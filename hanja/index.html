<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>WB 한자브레인 — 한자·어휘 훈련</title>
  <meta name="description" content="문제집 단어장으로 한자와 한글 어휘를 외우고, 한자는 손가락으로 따라 쓰는 WB 어휘 훈련 앱 (원내 전용)">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#8E3B2F">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #F7F4EC; --card: #FFFFFF; --card-2: #F1ECE1; --ink: #2B2118; --ink-strong: #1F1712; --ink-soft: #6F6459;
      --line: #E4DCCB; --red: #B23A2E; --deep: #8E3B2F; --red-soft: #F8E6E2; --blue: #3D6B8E; --blue-soft: #E6EFF6;
      --green: #4E8C57; --green-soft: #E6F1E6; --amber: #B98426; --amber-soft: #FBF1DC;
      --shadow: 0 1px 4px rgba(43,33,24,.08); --radius: 14px;
      --serif: "Noto Serif KR", "Nanum Myeongjo", "Batang", "BatangChe", "AppleMyungjo", serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--ink); font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; font-size: 16px; line-height: 1.6; word-break: keep-all; -webkit-font-smoothing: antialiased; }
    button { font-family: inherit; font-size: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    input { font-family: inherit; }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
    .shell { max-width: 640px; margin: 0 auto; padding: 0 16px 96px; }

    .top { display: flex; align-items: center; gap: 10px; padding: 18px 2px 10px; }
    .top .logo { width: 34px; height: 34px; flex: none; border-radius: 9px; }
    .top h1 { font-size: 1.12rem; font-weight: 900; color: var(--ink-strong); margin: 0; letter-spacing: -.01em; }
    .top .sub { font-size: .72rem; color: var(--ink-soft); display: block; font-weight: 500; }
    .top > div { min-width: 0; }
    .swap { margin-left: auto; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; font-size: .78rem; font-weight: 700; color: var(--ink-soft); text-decoration: none; white-space: nowrap; flex: none; }
    .streak { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: .8rem; font-weight: 700; color: var(--amber); box-shadow: var(--shadow); flex: none; margin-left: 6px; }
    @media (max-width: 430px) { .top .sub { display: none; } .swap .lbl { display: none; } .swap { padding: 5px 9px; font-size: .9rem; } }

    .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--card); border-top: 1px solid var(--line); display: flex; justify-content: center; gap: 2px; padding: 6px 8px calc(8px + env(safe-area-inset-bottom)); }
    .tabbar button { flex: 1; max-width: 120px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .68rem; font-weight: 700; color: var(--ink-soft); padding: 6px 0; border-radius: 10px; }
    .tabbar button b { font-size: 1.15rem; line-height: 1.2; font-weight: 700; }
    .tabbar button.on { color: var(--deep); background: var(--red-soft); }

    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin-bottom: 12px; }
    .card.tight { padding: 12px 14px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; padding: 12px 16px; font-weight: 700; font-size: .95rem; background: var(--card-2); color: var(--ink-strong); border: 1px solid var(--line); }
    .btn.primary { background: var(--deep); color: #fff; border-color: var(--deep); }
    .btn.blue { background: var(--blue); color: #fff; border-color: var(--blue); }
    .btn.ghost { background: transparent; }
    .btn.small { padding: 8px 12px; font-size: .84rem; border-radius: 10px; }
    .btn.big { width: 100%; padding: 15px 18px; font-size: 1rem; }
    .btn:disabled { opacity: .45; cursor: default; }
    .btn:active:not(:disabled) { transform: translateY(1px); }
    .btn[hidden] { display: none; }
    .row { display: flex; gap: 10px; } .row > * { flex: 1; }
    .row.wrap { flex-wrap: wrap; } .row.wrap > * { flex: none; }
    h2.sec { font-size: 1.02rem; font-weight: 900; color: var(--ink-strong); margin: 24px 0 10px; }
    h2.sec small { font-weight: 600; color: var(--ink-soft); font-size: .78rem; margin-left: 6px; }
    .muted { color: var(--ink-soft); font-size: .85rem; }
    .chip { display: inline-block; font-size: .7rem; font-weight: 700; border-radius: 6px; padding: 2px 8px; letter-spacing: .02em; vertical-align: middle; }
    .t-h { background: var(--blue-soft); color: var(--blue); } .t-n { background: var(--green-soft); color: #3A7A43; } .t-c { background: var(--red-soft); color: var(--deep); }
    .t-a { background: var(--amber-soft); color: var(--amber); } .t-g { background: var(--card-2); color: var(--ink-soft); }
    .notice { background: var(--amber-soft); border: 1px solid #EAD6A5; color: #6E4E10; border-radius: var(--radius); padding: 12px 14px; font-size: .86rem; margin-bottom: 12px; }
    .notice a { color: inherit; font-weight: 700; }
    .toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(10px); background: var(--ink-strong); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: .86rem; opacity: 0; transition: .25s; pointer-events: none; z-index: 60; max-width: 90vw; text-align: center; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* 오늘 */
    .nums { display: flex; gap: 14px; }
    .tn { flex: 1; text-align: center; background: var(--card-2); border-radius: 12px; padding: 10px 6px; }
    .tn b { display: block; font-size: 1.5rem; font-weight: 900; color: var(--ink-strong); line-height: 1.2; font-variant-numeric: tabular-nums; }
    .tn.warn b { color: var(--red); } .tn span { font-size: .72rem; color: var(--ink-soft); font-weight: 700; }
    .bar { height: 8px; background: var(--card-2); border-radius: 999px; overflow: hidden; margin: 8px 0 4px; }
    .bar i { display: block; height: 100%; background: var(--blue); border-radius: 999px; }
    .bar i.g { background: var(--green); }
    .bar.stack { display: flex; } .bar.stack i { border-radius: 0; }

    /* 단어장 */
    .book { display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; }
    .book .ico { width: 44px; height: 56px; border-radius: 6px; background: linear-gradient(160deg, var(--deep), #C2574A); color: #fff; display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-size: 1.5rem; font-weight: 700; flex: none; }
    .book .ico.n { background: linear-gradient(160deg, var(--blue), #6C97B9); }
    .book b { display: block; color: var(--ink-strong); }
    .book.on { border-color: var(--deep); background: #FFF9F5; }
    .unit { padding: 12px 14px; }
    .unit-head { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .unit-head b { flex: 1; color: var(--ink-strong); }
    .unit-head .n { font-size: .74rem; color: var(--ink-soft); white-space: nowrap; }
    .unit-body { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 10px; }
    .wrow { display: flex; align-items: baseline; gap: 8px; padding: 6px 2px; border-bottom: 1px solid #F1ECE1; cursor: pointer; }
    .wrow:last-child { border-bottom: none; }
    .wrow .w { font-weight: 800; color: var(--ink-strong); white-space: nowrap; }
    .wrow .hj { font-family: var(--serif); color: var(--blue); white-space: nowrap; }
    .wrow .m { flex: 1; font-size: .84rem; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
    .dot.s1 { background: #C9B98F; } .dot.s2 { background: var(--blue); } .dot.s3 { background: var(--green); } .dot.due { background: var(--red); }
    .cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; }
    .ctile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 4px 6px; text-align: center; cursor: pointer; position: relative; }
    .ctile .ch { font-family: var(--serif); font-size: 1.9rem; line-height: 1.15; color: var(--ink-strong); }
    .ctile .hm { font-size: .68rem; color: var(--ink-soft); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ctile .pip { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
    .ctile .pip.t1 { background: #C9B98F; } .ctile .pip.t2 { background: var(--blue); } .ctile .pip.t3 { background: var(--green); }
    .ctile .ord { position: absolute; top: 5px; left: 6px; font-size: .58rem; font-weight: 800; color: var(--deep); }
    .ctile.on { border-color: var(--deep); background: #FFF9F5; }

    /* 낱말 카드(배우기·상세) */
    .wcard { text-align: center; }
    .wcard .word { font-size: 2rem; font-weight: 900; color: var(--ink-strong); line-height: 1.2; }
    .wcard .hanja { font-family: var(--serif); font-size: 1.6rem; color: var(--blue); margin-top: 2px; }
    .parts { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
    .part { background: var(--blue-soft); border-radius: 10px; padding: 6px 10px; min-width: 60px; }
    .part .c { font-family: var(--serif); font-size: 1.5rem; color: var(--ink-strong); line-height: 1.1; }
    .part .g { font-size: .72rem; color: var(--blue); font-weight: 700; }
    .meaning { font-size: 1.02rem; color: var(--ink); margin: 8px 0 2px; }
    .example { font-size: .9rem; color: var(--ink-soft); background: var(--card-2); border-radius: 10px; padding: 8px 12px; margin-top: 8px; }
    .example mark { background: #FFE9A8; color: inherit; border-radius: 3px; padding: 0 2px; }
    .say-btn { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: .82rem; font-weight: 700; color: var(--ink-strong); background: var(--card); margin: 6px 3px 0; }
    .say-btn.on { background: var(--red-soft); border-color: #E4B8B0; color: var(--deep); }
    .cchip { display: inline-block; font-family: var(--serif); font-size: 1.1rem; background: var(--card-2); border-radius: 8px; padding: 2px 8px; margin: 2px; }

    /* 따라쓰기 */
    .trace { margin-top: 12px; }
    .trace-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
    .trace-head b { font-family: var(--serif); font-size: 2.2rem; color: var(--ink-strong); line-height: 1; }
    .trace-head span { color: var(--blue); font-weight: 700; }
    .trace-head i { margin-left: auto; font-style: normal; font-size: .78rem; color: var(--ink-soft); font-weight: 700; white-space: nowrap; }
    .trace canvas { display: block; width: 100%; max-width: 320px; aspect-ratio: 1; margin: 0 auto; background: #FFFDF8; border: 1px solid var(--line); border-radius: 12px; touch-action: none; }
    .trace-tip { text-align: center; font-size: .84rem; color: var(--ink-soft); margin: 8px 0; min-height: 1.4em; }
    .trace-tip.warn { color: var(--red); font-weight: 700; }
    .trace-tip.good { color: var(--green); font-weight: 700; }
    .trace-btns { max-width: 320px; margin: 0 auto; }
    .trace-mode { text-align: center; margin-bottom: 6px; }

    /* 훈련 */
    .qhead { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .qhead .prog { margin-left: auto; font-size: .78rem; color: var(--ink-soft); font-weight: 700; font-variant-numeric: tabular-nums; }
    .prompt { font-size: 1.12rem; font-weight: 800; color: var(--ink-strong); white-space: pre-line; line-height: 1.5; margin-bottom: 14px; }
    .prompt.big { font-family: var(--serif); font-size: 3.4rem; font-weight: 500; text-align: center; line-height: 1.2; }
    .prompt .sub { display: block; font-family: "Noto Sans KR", sans-serif; font-size: .95rem; font-weight: 700; color: var(--ink-soft); margin-top: 6px; }
    .choices { display: grid; gap: 8px; }
    .choices.two { grid-template-columns: 1fr 1fr; }
    .choice { text-align: left; background: var(--card-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-weight: 700; color: var(--ink-strong); }
    .choice.big { font-family: var(--serif); font-size: 1.9rem; text-align: center; font-weight: 500; padding: 8px; }
    .choice.ok { background: var(--green-soft); border-color: var(--green); }
    .choice.bad { background: var(--red-soft); border-color: var(--red); }
    .choice.dim { opacity: .5; }
    .ans-in { width: 100%; font-size: 1.1rem; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); }
    .feedback { margin-top: 12px; border-radius: 12px; padding: 12px 14px; font-size: .9rem; }
    .feedback.ok { background: var(--green-soft); color: #2E5F35; } .feedback.bad { background: var(--red-soft); color: #7A2A20; }
    .feedback b { display: block; font-size: 1rem; }
    .hintbox { background: var(--amber-soft); border-radius: 10px; padding: 8px 12px; font-size: .84rem; color: #6E4E10; margin-top: 8px; }
    .result-list { margin-top: 10px; }

    .sheet-back { position: fixed; inset: 0; background: rgba(31,23,18,.35); z-index: 50; display: none; align-items: flex-end; justify-content: center; }
    .sheet-back.show { display: flex; }
    .sheet { background: var(--card); width: 100%; max-width: 640px; max-height: 88vh; overflow: auto; border-radius: 18px 18px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); }
    .sheet .close { float: right; font-size: 1.2rem; color: var(--ink-soft); padding: 2px 8px; }
    .kv { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #F1ECE1; font-size: .9rem; }
    .kv:last-child { border-bottom: none; }
    .kv b { color: var(--ink-strong); }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
<!-- APP:BODY:START -->
  <div class="shell">
    <header class="top">
      <img class="logo" src="./icon.svg" alt="">
      <div><h1>WB 한자브레인</h1><span class="sub">한자·한글 어휘 훈련 · 손으로 쓰는 한자</span></div>
      <a class="swap" href="/" aria-label="진로독서 앱으로"><span aria-hidden="true">📖</span><span class="lbl"> 진로독서</span></a>
      <div class="streak" id="streakChip">🔥 0일</div>
    </header>
    <main>
      <section id="view-home"></section>
      <section id="view-books" hidden></section>
      <section id="view-chars" hidden></section>
      <section id="view-train" hidden></section>
      <section id="view-report" hidden></section>
    </main>
  </div>
  <nav class="tabbar" aria-label="주 메뉴">
    <button data-view="home" class="on"><b>⌂</b>오늘</button>
    <button data-view="books"><b>▤</b>단어장</button>
    <button data-view="chars"><b>字</b>한자</button>
    <button data-view="train"><b>◎</b>훈련</button>
    <button data-view="report"><b>◔</b>기록</button>
  </nav>
  <div class="sheet-back" id="sheetBack"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
<!-- APP:BODY:END -->

  <script src="./voice.js"></script>
  <script src="./book-check.js"></script>
  <script src="./srs.js"></script>
  <script src="./quiz.js"></script>
  <script src="./trace.js"></script>
  <script>
/* APP:JS:START */
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var DAY = WBHSRS.DAY;
  var SAMPLE_ID = 'wb-hanja-starter';
  var LEARN_MAX = 8;          /* 한 자리에서 새로 배우는 항목 상한 — 작업기억을 넘기지 않는다 */
  var TRAIN_MAX = 20;         /* 한 세션 문항 상한 */

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function now() { return Date.now(); }
  function toast(msg) { var el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(function () { el.classList.remove('show'); }, 2200); }
  function say(text) { try { WBVoice.unlock(); WBVoice.speak(text, { lang: 'ko-KR', rate: 0.95 }); } catch (e) {} }
  function fmtDue(due) { var d = due - now(); if (d <= 0) return '지금'; if (d < 3600000) return Math.max(1, Math.round(d / 60000)) + '분 후'; if (d < DAY) return Math.round(d / 3600000) + '시간 후'; return Math.round(d / DAY) + '일 후'; }
  function pct(a, b) { return b ? Math.round(a * 100 / b) : 0; }

  /* ── 연동 ── 학생 토큰(wbr.auth)은 진로독서 앱 소유 — 읽기만 한다 */
  function auth() { try { return JSON.parse(localStorage.getItem('wbr.auth') || 'null'); } catch (e) { return null; } }
  var AUTH = auth();
  var authed = !!(AUTH && AUTH.token);
  var code = authed ? String((AUTH.student && AUTH.student.code) || AUTH.code || 'linked') : 'demo';
  var SYNC = { avail: false, authBad: false, timer: null, busy: false, last: null, offline: false };
  async function api(path, opt) {
    if (!authed) throw new Error('연동이 필요해요');
    var r = await fetch('/api/hanja' + path, Object.assign({ headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + AUTH.token } }, opt || {}));
    if (r.status === 401) { SYNC.authBad = true; throw new Error('연동이 만료됐어요 — 진로독서 설정에서 다시 연동해 주세요'); }
    var j = await r.json();
    if (!r.ok) { var e = new Error((j && j.error) || ('오류 ' + r.status)); e.status = r.status; throw e; }
    return j;
  }
  function syncOn() { return authed && SYNC.avail && !SYNC.authBad; }

  /* ── 저장소 — 기기별 기록. 연동 학생 코드와 체험(demo)을 키로 갈라 섞이지 않게 ── */
  var KEY = 'wbhj.v1:' + code;
  var db;
  function fresh() { return { v: 1, states: {}, trace: {}, log: [], streak: { count: 0, last: null }, settings: { book: '', unit: '' }, created: now() }; }
  function load() { try { var raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }
  function adopt(next) { db = Object.assign(fresh(), next || {}); db.states = db.states || {}; db.trace = db.trace || {}; db.log = db.log || []; db.settings = db.settings || { book: '', unit: '' }; db.streak = db.streak || { count: 0, last: null }; }
  adopt(load());
  function save() {
    if (db.log.length > 400) db.log = db.log.slice(-300);
    try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { /* 저장 불가 환경 */ }
    if (syncOn()) { clearTimeout(SYNC.timer); SYNC.timer = setTimeout(syncPush, 2500); }
  }
  function richness(d) { return Object.keys((d && d.states) || {}).length * 10 + Object.keys((d && d.trace) || {}).length * 5 + ((d && d.log) || []).length; }
  async function syncPush() {
    if (!syncOn() || SYNC.busy) return;
    SYNC.busy = true;
    try { var r = await api('/state', { method: 'PUT', body: JSON.stringify({ state: db }) }); SYNC.last = r.updatedAt || new Date().toISOString(); }
    catch (e) { /* 다음 저장 때 재시도 */ }
    SYNC.busy = false;
    if (curView === 'report') render('report');
  }
  function bumpStreak() { var st = WBHSRS.bumpStreak(db.streak, now()); if (st !== db.streak) { db.streak = st; renderStreak(); } }
  function renderStreak() { $('#streakChip').textContent = '🔥 ' + ((db.streak && db.streak.count) || 0) + '일'; }
  function logEvent(kind, id, ok) { db.log.push({ t: now(), k: kind, id: id, ok: ok ? 1 : 0 }); }

  /* ── 단어장 ──
     목록(index)은 서버(/books)에서, 본문(/book?id=)은 열 때 받아 기기에 캐시한다. 미연동 기기는 체험 단어장뿐이다.
     체험 단어장은 연동 학생에게도 늘 보인다 — 학원 단어장이 아직 없을 때의 첫 계단이다. */
  var LIB = { index: [], books: {}, chars: {}, sample: null, loading: {} };
  var IKEY = 'wbhj.index:' + code;
  function cacheKey(id) { return 'wbhj.book:' + code + ':' + id; }
  function readCache(id) { try { return JSON.parse(localStorage.getItem(cacheKey(id)) || 'null'); } catch (e) { return null; } }
  function writeCache(id, rec) {
    var keys = [];
    try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf('wbhj.book:' + code + ':') === 0 && k !== cacheKey(id)) keys.push(k); } } catch (e) {}
    for (var tries = 0; tries <= keys.length; tries++) {
      try { localStorage.setItem(cacheKey(id), JSON.stringify(rec)); return; }
      catch (e) { if (!keys.length) return; localStorage.removeItem(keys.shift()); }   /* 자리가 없으면 다른 단어장 캐시부터 비운다 */
    }
  }
  function installBook(book, updatedAt) {
    var res = WBBOOKCHECK.checkBook(book);
    var b = res.book;
    if (!b) return null;
    b.updatedAt = updatedAt || null;
    b.words.forEach(function (w) { w._sid = WBHSRS.wordId(b.id, w.id); w._book = b.id; });
    b.chars.forEach(function (c) { c._sid = WBHSRS.charId(c.ch); c._book = b.id; });
    LIB.books[b.id] = b;
    /* 한자 사전 — 여러 단어장이 같은 글자를 가지면 획순·획수가 있는 쪽을 쓴다 */
    b.chars.forEach(function (c) {
      var prev = LIB.chars[c.ch];
      if (!prev || (!prev.medians && c.medians) || (!prev.strokes && c.strokes) || (!prev.hun && c.hun)) LIB.chars[c.ch] = c;
    });
    return b;
  }
  async function loadSample() {
    if (LIB.sample) return LIB.sample;
    var r = await fetch('./book-sample.json');
    var raw = await r.json();
    LIB.sample = installBook(raw, null);
    return LIB.sample;
  }
  function metaOf(b) { var m = WBBOOKCHECK.bookMeta(b); m.updatedAt = b.updatedAt || null; return m; }
  async function loadIndex() {
    var idx = null;
    if (syncOn()) {
      try { var j = await api('/books'); idx = j.books || []; try { localStorage.setItem(IKEY, JSON.stringify({ books: idx, at: now() })); } catch (e) {} }
      catch (e) { SYNC.offline = true; }
    }
    if (!idx) { try { idx = (JSON.parse(localStorage.getItem(IKEY) || 'null') || {}).books || []; } catch (e) { idx = []; } }
    LIB.index = idx.filter(function (e) { return e && e.id; });
    var s = await loadSample();
    if (s && !LIB.index.some(function (e) { return e.id === s.id; })) LIB.index.push(Object.assign(metaOf(s), { sample: true, scope: 'all', mine: false }));
    /* 캐시된 본문은 미리 실어 둔다 — 오늘 복습 목록이 단어장을 열지 않고도 그려지게 */
    LIB.index.forEach(function (e) { if (!LIB.books[e.id]) { var c = readCache(e.id); if (c && c.book) installBook(c.book, c.updatedAt); } });
  }
  /* 본문 열기 — 캐시가 최신이면 캐시, 아니면 서버. 서버가 없으면 캐시라도 */
  async function openBook(id) {
    if (id === SAMPLE_ID && LIB.sample) return LIB.sample;
    var entry = LIB.index.filter(function (e) { return e.id === id; })[0];
    var cached = readCache(id);
    var fresh2 = cached && entry && cached.updatedAt && entry.updatedAt && cached.updatedAt >= entry.updatedAt;
    if (LIB.books[id] && (fresh2 || !syncOn())) return LIB.books[id];
    if (syncOn() && !fresh2) {
      if (!LIB.loading[id]) LIB.loading[id] = api('/book?id=' + encodeURIComponent(id)).then(function (j) {
        writeCache(id, { book: j.book, updatedAt: j.updatedAt });
        return installBook(j.book, j.updatedAt);
      }).finally(function () { delete LIB.loading[id]; });
      try { return await LIB.loading[id]; } catch (e) { if (LIB.books[id]) return LIB.books[id]; throw e; }
    }
    if (LIB.books[id]) return LIB.books[id];
    if (cached && cached.book) return installBook(cached.book, cached.updatedAt);
    if (id === SAMPLE_ID) return loadSample();
    throw new Error('단어장을 아직 받지 못했어요 — 학원 와이파이에서 열어 주세요');
  }
  function bookOf(id) { return LIB.books[id] || null; }
  function curBookId() { var id = db.settings.book; return (id && LIB.index.some(function (e) { return e.id === id; })) ? id : (LIB.index[0] ? LIB.index[0].id : ''); }
  function unitsOf(book) { var u = book.units.slice(); if (book.words.some(function (w) { return !w.unit; }) || book.chars.some(function (c) { return !c.unit; })) u.push({ id: '', title: '단원 없음' }); return u; }
  /* 단원의 학습 항목 — 낱말 먼저, 그다음 직접 적은 한자. 낱말에서 끌어낸 한자(derived)는 참고 항목이라
     심기·진도에 넣지 않는다(한자어 12개가 한자 25자에 묻히지 않게). allChars 면 끌어낸 글자까지(한자만 훈련). */
  function itemsOf(book, unitId, opts) {
    var out = [], all = !!(opts && opts.allChars);
    book.words.forEach(function (w) { if (unitId == null || w.unit === unitId) out.push({ kind: 'word', w: w, sid: w._sid, book: book.id }); });
    book.chars.forEach(function (c) { if ((all || !c.derived) && (unitId == null || c.unit === unitId)) out.push({ kind: 'char', c: c, sid: c._sid, book: book.id }); });
    return out;
  }
  /* SRS id → 항목. 낱말은 그 단어장이 실려 있어야 하고, 한자는 어느 단어장에든 있으면 된다 */
  function resolve(sid) {
    if (sid.charAt(0) === 'c') { var c = LIB.chars[sid.slice(2)]; return c ? { kind: 'char', c: c, sid: sid, book: c._book } : null; }
    var m = sid.match(/^w:([^:]+):(.+)$/);
    var b = m && bookOf(m[1]);
    if (!b) return null;
    var w = b.words.filter(function (x) { return x.id === m[2]; })[0];
    return w ? { kind: 'word', w: w, sid: sid, book: b.id } : null;
  }
  function stateOf(item) { return db.states[item.sid] || null; }
  function progressOf(items) {
    var p = { total: items.length, planted: 0, graduated: 0, due: 0, seed: 0 }, t = now();
    items.forEach(function (it) { var s = stateOf(it); if (!s) return; p.planted += 1; if (s.graduated) p.graduated += 1; else if (s.due <= t) p.due += 1; if (s.step <= 1 && !s.graduated) p.seed += 1; });
    return p;
  }
  function dotClass(item) { var s = stateOf(item); if (!s) return ''; if (s.graduated) return 's3'; if (s.due <= now()) return 'due'; return s.step >= 2 ? 's2' : 's1'; }
  function ctxFor(item) {
    var b = bookOf(item.book) || LIB.sample;
    var words = b ? b.words : [], chars = b ? b.chars : [];
    /* 한자 문항은 다른 단어장 글자도 보기로 쓸 수 있다 — 한 단어장에 한자가 적을 때 */
    if (chars.length < 8) chars = Object.keys(LIB.chars).map(function (k) { return LIB.chars[k]; });
    return { words: words, chars: chars, find: WBBOOKCHECK.findInExample };
  }

  /* ── 화면 전환 ── */
  var curView = 'home';
  var VIEWS = { home: renderHome, books: renderBooks, chars: renderChars, train: renderTrain, report: renderReport };
  function render(view) {
    if (view && view !== curView) { traceStop(); }
    curView = view || curView;
    ['home', 'books', 'chars', 'train', 'report'].forEach(function (v) { $('#view-' + v).hidden = v !== curView; });
    document.querySelectorAll('.tabbar button').forEach(function (b) { b.classList.toggle('on', b.dataset.view === curView); });
    VIEWS[curView]();
    window.scrollTo(0, 0);
  }
  document.querySelectorAll('.tabbar button').forEach(function (b) { b.addEventListener('click', function () { render(b.dataset.view); }); });
  function sheet(html, onOpen) {
    var back = $('#sheetBack'), el = $('#sheet');
    el.innerHTML = '<button class="close" id="sheetClose" aria-label="닫기">✕</button>' + html;
    back.classList.add('show');
    $('#sheetClose').addEventListener('click', closeSheet);
    if (onOpen) onOpen(el);
  }
  function closeSheet() { $('#sheetBack').classList.remove('show'); $('#sheet').innerHTML = ''; traceStop(); }
  $('#sheetBack').addEventListener('click', function (e) { if (e.target === this) closeSheet(); });

  function demoNotice() {
    if (authed) return SYNC.authBad ? '<div class="notice">연동이 만료됐어요 — <a href="/">진로독서 설정</a>에서 다시 연동하면 학원 단어장과 기록 저장이 이어져요.</div>' : '';
    return '<div class="notice">체험 모드 — WB 기본 단어장으로 연습 중이에요. <a href="/">진로독서</a>에서 학원 QR로 연동하면 우리 학원 단어장(문제집별)과 기록 저장이 열려요.</div>';
  }
  function bookTitle(id) { var e = LIB.index.filter(function (x) { return x.id === id; })[0]; return e ? e.title : id; }

  /* ── 오늘 ── */
  function renderHome() {
    var el = $('#view-home'), t = now();
    var sum = WBHSRS.summary(db.states, t);
    var due = WBHSRS.dueList(db.states, t);
    var bid = curBookId(), book = bid ? bookOf(bid) : null;
    var html = demoNotice();
    html += '<div class="card"><div class="nums">' +
      '<div class="tn' + (sum.due ? ' warn' : '') + '"><b>' + sum.due + '</b><span>복습할 것</span></div>' +
      '<div class="tn"><b>' + sum.total + '</b><span>배우는 중</span></div>' +
      '<div class="tn"><b>' + sum.graduated + '</b><span>장기 기억</span></div>' +
      '<div class="tn"><b>' + Object.keys(db.trace).length + '</b><span>써 본 한자</span></div></div>' +
      '<div style="margin-top:14px">' + (due.length
        ? '<button class="btn primary big" id="hmReview">오늘 복습 시작 (' + Math.min(due.length, TRAIN_MAX) + '문항)</button>'
        : '<p class="muted" style="text-align:center;margin:0 0 8px">지금 복습할 것이 없어요' + (sum.total ? ' — 잊을 때쯤 다시 불러요 🌙' : '. 단어장에서 새로 배워 보세요.') + '</p>') +
      (sum.emergency ? '<p class="muted" style="text-align:center;margin:8px 0 0;color:var(--red)">오래 방치된 항목 ' + sum.emergency + '개가 먼저 나와요</p>' : '') + '</div></div>';

    if (book) {
      var units = unitsOf(book), uid = db.settings.unit;
      var unit = units.filter(function (u) { return u.id === uid; })[0] || units[0];
      var items = unit ? itemsOf(book, unit.id) : [];
      var p = progressOf(items);
      var fresh3 = items.filter(function (it) { return !stateOf(it); });
      html += '<h2 class="sec">내 단어장 <small>' + esc(book.title) + '</small></h2><div class="card">' +
        '<div style="display:flex;align-items:baseline;gap:8px"><b style="color:var(--ink-strong)">' + esc(unit ? unit.title : '') + '</b>' +
        '<span class="muted">낱말 ' + items.filter(function (i) { return i.kind === 'word'; }).length + ' · 한자 ' + items.filter(function (i) { return i.kind === 'char'; }).length + '</span>' +
        '<button class="btn small ghost" id="hmPick" style="margin-left:auto">바꾸기</button></div>' +
        '<div class="bar stack"><i class="g" style="width:' + pct(p.graduated, p.total) + '%"></i><i style="width:' + pct(p.planted - p.graduated, p.total) + '%"></i></div>' +
        '<p class="muted" style="margin:0 0 10px;font-size:.78rem">배우는 중 ' + p.planted + ' / ' + p.total + ' · 장기 기억 ' + p.graduated + (p.due ? ' · 복습 ' + p.due : '') + '</p>' +
        '<div class="row">' +
        (fresh3.length ? '<button class="btn primary" id="hmLearn">새로 배우기 (' + Math.min(fresh3.length, LEARN_MAX) + ')</button>' : '<button class="btn" id="hmTrainUnit">이 단원 훈련</button>') +
        (items.some(function (i) { return i.kind === 'char'; }) ? '<button class="btn blue" id="hmTrace">✍️ 따라쓰기</button>' : '') +
        '</div></div>';
    } else {
      html += '<div class="card"><p class="muted" style="margin:0">단어장을 불러오는 중이에요…</p></div>';
    }
    el.innerHTML = html;
    var b1 = $('#hmReview'); if (b1) b1.addEventListener('click', function () { trainStart({ mode: 'due' }); });
    var b2 = $('#hmLearn'); if (b2) b2.addEventListener('click', function () { learnStart(book, db.settings.unit); });
    var b3 = $('#hmTrainUnit'); if (b3) b3.addEventListener('click', function () { trainStart({ mode: 'unit', book: book.id, unit: db.settings.unit }); });
    var b4 = $('#hmTrace'); if (b4) b4.addEventListener('click', function () { render('chars'); });
    var b5 = $('#hmPick'); if (b5) b5.addEventListener('click', function () { render('books'); });
  }

  /* ── 단어장 ── */
  var BOOKS_UI = { open: {} };
  function renderBooks() {
    var el = $('#view-books');
    var bid = curBookId();
    var html = demoNotice() + '<h2 class="sec" style="margin-top:6px">단어장 고르기 <small>문제집 한 권이 단어장 하나</small></h2>';
    if (!LIB.index.length) html += '<div class="card"><p class="muted" style="margin:0">아직 단어장이 없어요.</p></div>';
    LIB.index.forEach(function (e) {
      var b = bookOf(e.id), p = b ? progressOf(itemsOf(b, null)) : null;
      html += '<div class="card book' + (e.id === bid ? ' on' : '') + '" data-book="' + esc(e.id) + '">' +
        '<div class="ico' + (e.counts && e.counts.hanja < e.counts.native ? ' n' : '') + '">' + (e.counts && e.counts.chars ? '字' : '語') + '</div>' +
        '<div style="flex:1;min-width:0"><b>' + esc(e.title) + '</b>' +
        '<span class="muted" style="font-size:.78rem">' + (e.publisher ? esc(e.publisher) + ' · ' : '') + (e.level ? e.level + ' · ' : '') +
        '낱말 ' + (e.counts ? e.counts.words : 0) + ' · 한자 ' + (e.counts ? e.counts.chars : 0) + ' · 단원 ' + (e.units ? e.units.length : 0) + '</span>' +
        (e.mine ? ' <span class="chip t-a">선생님 배정</span>' : '') + (e.sample ? ' <span class="chip t-g">WB 기본</span>' : '') +
        (p && p.planted ? '<div class="bar stack"><i class="g" style="width:' + pct(p.graduated, p.total) + '%"></i><i style="width:' + pct(p.planted - p.graduated, p.total) + '%"></i></div>' : '') +
        '</div><span class="muted">' + (e.id === bid ? '✔' : '›') + '</span></div>';
    });
    var book = bid ? bookOf(bid) : null;
    if (bid && !book) { html += '<div class="card" id="bookLoading"><p class="muted" style="margin:0">단어장을 받는 중…</p></div>'; }
    if (book) {
      html += '<h2 class="sec">' + esc(book.title) + ' <small>단원을 눌러 펼쳐요</small></h2>';
      unitsOf(book).forEach(function (u) {
        var items = itemsOf(book, u.id), p = progressOf(items), open = BOOKS_UI.open[book.id + '|' + u.id];
        var nw = items.filter(function (i) { return i.kind === 'word'; }).length, nc = items.length - nw;
        html += '<div class="card unit" data-unit="' + esc(u.id) + '"><div class="unit-head"><b>' + esc(u.title) + '</b>' +
          (db.settings.unit === u.id && db.settings.book === book.id ? '<span class="chip t-a">현재</span>' : '') +
          '<span class="n">' + (nw ? '낱말 ' + nw : '') + (nw && nc ? ' · ' : '') + (nc ? '한자 ' + nc : '') + '</span><span class="muted">' + (open ? '▾' : '▸') + '</span></div>' +
          '<div class="bar stack"><i class="g" style="width:' + pct(p.graduated, p.total) + '%"></i><i style="width:' + pct(p.planted - p.graduated, p.total) + '%"></i></div>';
        if (open) {
          html += '<div class="unit-body"><div class="row" style="margin-bottom:10px">' +
            '<button class="btn primary small" data-act="learn">새로 배우기</button>' +
            '<button class="btn small" data-act="train"' + (p.planted ? '' : ' disabled') + '>이 단원 훈련</button>' +
            (nc ? '<button class="btn blue small" data-act="trace">✍️ 따라쓰기</button>' : '') + '</div>';
          var cs = items.filter(function (i) { return i.kind === 'char'; });
          if (cs.length) html += '<div style="margin-bottom:8px">' + cs.map(function (i) { return '<span class="cchip" data-ch="' + esc(i.c.ch) + '" title="' + esc(i.c.hun + ' ' + i.c.eum) + '">' + esc(i.c.ch) + '</span>'; }).join('') + '</div>';
          items.filter(function (i) { return i.kind === 'word'; }).forEach(function (i) {
            html += '<div class="wrow" data-wid="' + esc(i.sid) + '"><span class="dot ' + dotClass(i) + '"></span><span class="w">' + esc(i.w.word) + '</span>' +
              (i.w.hanja ? '<span class="hj">' + esc(i.w.hanja) + '</span>' : '<span class="chip t-n">고유어</span>') + '<span class="m">' + esc(i.w.meaning) + '</span></div>';
          });
          html += '</div>';
        }
        html += '</div>';
      });
    }
    el.innerHTML = html;
    el.querySelectorAll('.book').forEach(function (b) {
      b.addEventListener('click', function () { selectBook(b.dataset.book); });
    });
    el.querySelectorAll('.unit').forEach(function (u) {
      var uid = u.dataset.unit, k = book.id + '|' + uid;
      u.querySelector('.unit-head').addEventListener('click', function () {
        BOOKS_UI.open[k] = !BOOKS_UI.open[k];
        if (BOOKS_UI.open[k]) { db.settings.book = book.id; db.settings.unit = uid; save(); }
        renderBooks();
      });
      u.querySelectorAll('[data-act]').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          db.settings.book = book.id; db.settings.unit = uid; save();
          if (btn.dataset.act === 'learn') learnStart(book, uid);
          else if (btn.dataset.act === 'train') trainStart({ mode: 'unit', book: book.id, unit: uid });
          else render('chars');
        });
      });
      u.querySelectorAll('.wrow').forEach(function (r) { r.addEventListener('click', function () { var it = resolve(r.dataset.wid); if (it) wordSheet(it); }); });
      u.querySelectorAll('.cchip').forEach(function (c) { c.addEventListener('click', function () { var ch = LIB.chars[c.dataset.ch]; if (ch) charSheet({ kind: 'char', c: ch, sid: ch._sid, book: ch._book }); }); });
    });
  }
  async function selectBook(id) {
    db.settings.book = id;
    var prev = bookOf(id);
    if (!prev) { db.settings.unit = ''; }
    save(); renderBooks();
    try {
      var b = await openBook(id);
      if (!prev && b) { var u = unitsOf(b)[0]; db.settings.unit = u ? u.id : ''; save(); }
      if (curView === 'books') renderBooks();
    } catch (e) { toast(e.message || '단어장을 열지 못했어요'); }
  }

  /* ── 낱말·한자 상세 ── */
  function partsHtml(w) {
    if (!w.parts) return '';
    return '<div class="parts">' + w.parts.map(function (p) { return '<div class="part"><div class="c">' + esc(p.ch) + '</div><div class="g">' + esc(p.hun && p.eum ? p.hun + ' ' + p.eum : '훈음 미상') + '</div></div>'; }).join('') + '</div>' +
      (w.literal ? '<p class="muted" style="margin:0;font-size:.82rem">조립하면: ' + esc(w.literal) + '</p>' : '');
  }
  function exampleHtml(w) {
    if (!w.example) return '';
    var pos = WBBOOKCHECK.findInExample(w.example, w.word);
    var ex = pos ? esc(w.example.slice(0, pos.start)) + '<mark>' + esc(w.example.slice(pos.start, pos.end)) + '</mark>' + esc(w.example.slice(pos.end)) : esc(w.example);
    return '<div class="example">' + ex + '</div>';
  }
  function wordCardHtml(w) {
    return '<div class="wcard"><span class="chip ' + (w.type === 'hanja' ? 't-h' : 't-n') + '">' + (w.type === 'hanja' ? '한자어' : '고유어') + '</span>' +
      '<div class="word">' + esc(w.word) + '</div>' + (w.hanja ? '<div class="hanja">' + esc(w.hanja) + '</div>' : '') + partsHtml(w) +
      '<div class="meaning">' + esc(w.meaning) + '</div>' + exampleHtml(w) +
      (w.syn && w.syn.length ? '<p class="muted" style="margin:6px 0 0;font-size:.82rem">비슷한 말: ' + esc(w.syn.join(', ')) + '</p>' : '') +
      '<div><button class="say-btn" data-say="' + esc(w.word + '. ' + w.meaning + (w.example ? '. ' + w.example : '')) + '">🔊 들어보기</button></div></div>';
  }
  function bindSay(root) { root.querySelectorAll('[data-say]').forEach(function (b) { b.addEventListener('click', function () { say(b.dataset.say); }); }); }
  function stateHtml(item) {
    var s = stateOf(item);
    if (!s) return '<p class="muted" style="text-align:center;margin:8px 0 0">아직 안 배운 항목이에요.</p>';
    return '<div style="margin-top:10px"><div class="kv"><span>기억 단계</span><b>' + WBHSRS.stageLabel(s) + (s.graduated ? ' 🌳' : '') + '</b></div>' +
      '<div class="kv"><span>다음 복습</span><b>' + (s.graduated ? '졸업' : fmtDue(s.due)) + '</b></div>' +
      '<div class="kv"><span>맞힘 · 틀림</span><b>' + Math.max(0, s.reps - s.lapses) + ' · ' + s.lapses + '</b></div></div>';
  }
  function wordSheet(item) {
    var w = item.w;
    sheet(wordCardHtml(w) + stateHtml(item) +
      (w.parts ? '<div class="row" style="margin-top:12px"><button class="btn blue" id="shTrace">✍️ 한자 따라쓰기</button></div>' : ''), function (el) {
      bindSay(el);
      var b = $('#shTrace'); if (b) b.addEventListener('click', function () { closeSheet(); render('chars'); traceOpen(WBHTRACE.chars(w.hanja)); });

  /* ── 새로 배우기(심기) — 카드로 보고, 곧바로 한 번 꺼내 보고(즉시 인출), 심는다 ──

  var LEARN = null;

        (it.kind === 'char' ? '<div class="trace-mode" style="margin-top:10px"><button class="say-btn" id="lnTrace">✍️ 지금 한 번 써 보기</button></div>' : '') +

  function learnDone(el) {

  /* ── 한자 탭 + 손가락 따라쓰기 ──

  function tracePanelHtml() {

      '<div class="trace-mode" id="trMode"></div><canvas id="trCv" aria-label="따라쓰기 칸"></canvas>' +
      '<p class="trace-tip" id="trTip"></p>' +
      '<div class="row trace-btns"><button class="btn ghost small" id="trClear">지우기</button><button class="btn ghost small" id="trPeek" hidden>겹쳐 보기</button>' +

  /* chars: 쓸 글자들. onDone: 다 쓰고 나서 부를 것(배우기 흐름에서 돌아가기) */

    if (curView !== 'chars') render('chars');
    var wrap = $('#trPanelWrap');
    wrap.innerHTML = tracePanelHtml();
    TRACE = { cv: $('#trCv'), ctx: null, size: 0, plan: WBHTRACE.plan(list.join('')), step: 0, cur: null, strokes: [], done: [], mode: 'shape', peek: false, anim: null, onDone: onDone || null, judged: null, retries: 0 };

  }
  function traceStop() {

  function traceChar() { return TRACE && TRACE.cur ? LIB.chars[TRACE.cur.ch] : null; }
  function traceShow() {

    $('#trHun').textContent = c && c.hun && c.eum ? c.hun + ' ' + c.eum + (c.strokes ? ' · ' + c.strokes + '획' : '') : (c && c.strokes ? c.strokes + '획' : '');

    $('#trMode').innerHTML = TRACE.mode === 'order' ? '<span class="chip t-c">획순 모드</span> <span class="muted" style="font-size:.76rem">안내선을 따라 한 획씩</span>' : '<span class="chip t-g">모양 모드</span> <span class="muted" style="font-size:.76rem">안내 글자를 따라 쓰고 확인</span>';

  function traceUpdateNext() {

  }
  function traceTip(msg, cls) { var t = $('#trTip'); if (!t) return; t.textContent = msg; t.className = 'trace-tip' + (cls ? ' ' + cls : ''); }

  /* 모양 모드 — 「확인」: 안내 글자 마스크와 학생 잉크의 겹침 + 획수 */

    TRACE.judged = v;
    traceTip(v.msg + (v.strokeMsg ? ' ' + v.strokeMsg : ''), v.level === 'good' ? 'good' : (v.level === 'retry' ? 'warn' : ''));
    if (v.level === 'retry') { TRACE.retries += 1; if (TRACE.retries >= 2) { TRACE.judged = { level: 'ok', score: v.score, forced: true }; traceTip(v.msg + ' 한 번 더 써 보거나, 이대로 넘어가도 돼요.', 'warn'); } }
    return v;
  }
  function traceRepDone() {
    var ch = traceChar();
    if (!ch || TRACE.repCounted) return;   /* 확인을 두 번 눌러도 한 회차는 한 번만 센다 */
    TRACE.repCounted = true;
    var tr = db.trace[ch.ch] = db.trace[ch.ch] || { reps: 0, best: 0, last: null };
    tr.reps += 1; tr.last = now();
    var score = TRACE.mode === 'order' ? 1 : (TRACE.judged && TRACE.judged.score != null ? TRACE.judged.score : 0);
    tr.best = Math.max(tr.best || 0, score);
    /* 처음 써 본 글자는 심는다 — 손으로 겪은 글자는 그날 밤 훈음으로 다시 만난다 */
    if (!db.states[ch._sid]) db.states[ch._sid] = WBHSRS.plant(ch._sid, now(), { book: ch._book });
    logEvent('trace', ch._sid, true);
    bumpStreak(); save();
  }
  function traceNext() {
    if (!TRACE) return;
    if (TRACE.mode === 'shape') {
      if (!TRACE.judged || TRACE.judged.level === 'retry') { var v = traceJudgeShape(); traceUpdateNext(); if (!v || v.level === 'retry') { tracePaint(); return; } traceRepDone(); return; }
    } else {
      var ch = traceChar();
      if (!ch || TRACE.done.length < ch.medians.length) return;
    }
    TRACE.step += 1;
    if (TRACE.step >= TRACE.plan.length) { traceDone(); return; }
    traceShow();
  }
  function traceDone() {
    var chs = [], seen = {};
    TRACE.plan.forEach(function (p) { if (!seen[p.ch]) { seen[p.ch] = true; chs.push(p.ch); } });
    var cb = TRACE.onDone;
    TRACE = null;
    if (!cb) renderChars();   /* 타일의 진행 표시를 새로 그린다 — 패널 자리는 비워진다 */
    var wrap = $('#trPanelWrap');
    wrap.innerHTML = '<div class="card wcard"><div class="word" style="font-family:var(--serif);font-weight:500">' + esc(chs.join(' ')) + '</div>' +
      '<p class="muted">' + chs.length + '자를 ' + WBHTRACE.REPS + '번씩 다 썼어요 ✍️ 손으로 한 번 겪은 획은 눈으로만 본 획보다 오래 남아요.</p>' +
      '<div class="row" style="margin-top:12px"><button class="btn" id="trAgain">한 번 더</button><button class="btn primary" id="trClose">' + (cb ? '돌아가기' : '닫기') + '</button></div></div>';
    $('#trAgain').addEventListener('click', function () { traceOpen(chs, cb); });
    $('#trClose').addEventListener('click', function () { wrap.innerHTML = ''; if (cb) cb(); });
  }
  /* 획순 보기 — 중심선을 획 순서대로 그려 보여 준다(점이 이동). 보는 동안은 그을 수 없다 */
  function traceAnimate() {
    var ch = traceChar(); if (!ch || !ch.medians || TRACE.anim) return;
    var lines = ch.medians.map(function (m) { return WBHTRACE.resample(med(m), 24); });
    var si = 0, pi = 0, t0 = null, saved = TRACE.strokes;
    TRACE.strokes = [];
    function frame(ts) {
      if (!TRACE) return;
      if (!t0) t0 = ts;
      var c = TRACE.ctx, s = TRACE.size;
      tracePaint();
      for (var i = 0; i < si; i++) paintPoly(c, s, lines[i], { color: '#B23A2E', width: Math.max(6, s * 0.05), alpha: 0.75 });
      var cur = lines[si].slice(0, pi + 1);
      paintPoly(c, s, cur, { color: '#B23A2E', width: Math.max(6, s * 0.05), alpha: 0.9 });
      var last = cur[cur.length - 1];
      c.save(); c.fillStyle = '#2B2118'; c.beginPath(); c.arc(last.x * s, last.y * s, Math.max(5, s * 0.024), 0, Math.PI * 2); c.fill(); c.restore();
      pi += 1;
      if (pi >= lines[si].length) { si += 1; pi = 0; }
      if (si >= lines.length) { TRACE.anim = null; TRACE.strokes = saved; setTimeout(function () { if (TRACE) tracePaint(); }, 500); traceTip('이 순서로 써 보세요.', ''); return; }
      TRACE.anim = requestAnimationFrame(function (t) { setTimeout(function () { if (TRACE && TRACE.anim) frame(t); }, pi === 0 ? 260 : 22); });
    }
    traceTip('획순을 보는 중…', '');
    TRACE.anim = requestAnimationFrame(frame);
  }
  window.addEventListener('resize', function () { if (TRACE && TRACE.cv && document.body.contains(TRACE.cv)) { traceFit(); tracePaint(); } });

  /* ── 훈련 ── 오늘 복습(due) · 단원 · 단어장 전체 · 한자만. 문항은 quiz.js, 판정은 SRS 로 */
  var TRAIN = null;
  function questionRender(el, head, q, onAnswer, opts) {
    opts = opts || {};
    var bigText = q.big ? (q.ch || q.word || '') : '';
    var promptHtml = bigText ? '<div class="prompt big">' + esc(bigText) + '<span class="sub">' + esc(q.prompt) + '</span></div>' : '<div class="prompt">' + esc(q.prompt) + '</div>';
    var body;
    if (q.input) body = '<input class="ans-in" id="qIn" autocomplete="off" autocapitalize="off" placeholder="낱말을 쓰세요"><div class="row" style="margin-top:10px"><button class="btn ghost small" id="qHint">힌트 보기</button><button class="btn primary" id="qSubmit">확인</button></div><div id="qHintBox"></div>';
    else body = '<div class="choices' + (q.bigChoices || q.suffix ? ' two' : '') + '">' + q.choices.map(function (c, i) { return '<button class="choice' + (q.bigChoices ? ' big' : '') + '" data-i="' + i + '">' + esc(c) + (q.suffix ? q.suffix : '') + '</button>'; }).join('') + '</div>' +
      (q.hint ? '<div class="row" style="margin-top:8px"><button class="btn ghost small" id="qHint">힌트 보기</button></div><div id="qHintBox"></div>' : '');
    el.innerHTML = '<div class="card">' + head + '<div style="margin-bottom:6px"><span class="chip t-h">' + esc(q.head) + '</span></div>' + promptHtml + body + '<div id="qFeed"></div></div>';
    var hinted = false, answered = false;
    var hb = $('#qHint'); if (hb) hb.addEventListener('click', function () { hinted = true; hb.disabled = true; $('#qHintBox').innerHTML = '<div class="hintbox">' + esc(q.hint || '') + '</div>'; });
    function finish(ok, given) {
      if (answered) return; answered = true;
      var fb = $('#qFeed');
      var reveal = q.reveal ? q.reveal : (q.answer + (q.suffix || ''));
      fb.innerHTML = '<div class="feedback ' + (ok ? 'ok' : 'bad') + '"><b>' + (ok ? (hinted ? '맞았어요 (힌트 사용)' : '맞았어요! ✨') : '아쉬워요') + '</b>' + (ok ? '' : '정답: ' + esc(reveal)) + (opts.extra ? '<div class="muted" style="margin-top:4px">' + opts.extra + '</div>' : '') + '</div>';
      el.querySelectorAll('.choice').forEach(function (b) { b.disabled = true; var v = q.choices[Number(b.dataset.i)]; if (v === q.answer) b.classList.add('ok'); else if (v === given) b.classList.add('bad'); else b.classList.add('dim'); });
      if (q.word && ok) say(q.word);
      onAnswer(ok, hinted);
    }
    el.querySelectorAll('.choice').forEach(function (b) { b.addEventListener('click', function () { var v = q.choices[Number(b.dataset.i)]; finish(WBHQUIZ.check(q, v), v); }); });
    var sb = $('#qSubmit'); if (sb) {
      var go = function () { var v = $('#qIn').value; if (!v.trim()) return; finish(WBHQUIZ.check(q, v), v); };
      sb.addEventListener('click', go); $('#qIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); }); $('#qIn').focus();
    }
  }
  function trainItems(scope) {
    var t = now(), items = [];
    if (scope.mode === 'due') {
      WBHSRS.dueList(db.states, t).forEach(function (s) { var it = resolve(s.id); if (it) { it.step = s.step; items.push(it); } });
    } else {
      var book = bookOf(scope.book); if (!book) return [];
      var list = scope.mode === 'unit' ? itemsOf(book, scope.unit === '' ? '' : scope.unit) : itemsOf(book, null, { allChars: !!scope.chars });
      if (scope.chars) list = list.filter(function (i) { return i.kind === 'char'; });
      list = list.filter(function (i) { return stateOf(i); });
      /* 복습이 밀린 것 먼저, 그다음 계단 낮은 것 */
      list.forEach(function (i) { var s = stateOf(i); i.step = s.step; i._pri = (s.due <= t ? 0 : 1) * 100 + s.step; });
      list.sort(function (a, b) { return a._pri - b._pri || Math.random() - 0.5; });
      items = list;
    }
    return items.slice(0, TRAIN_MAX);
  }
  function trainStart(scope) {
    var items = trainItems(scope);
    if (!items.length) { toast(scope.mode === 'due' ? '지금 복습할 것이 없어요' : '먼저 「새로 배우기」로 심어야 훈련할 수 있어요'); return; }
    var qs = [], skipped = 0;
    items.forEach(function (it) { var q = WBHQUIZ.makeQuestion(it, ctxFor(it), { step: it.step || 0, rnd: Math.random }); if (q) qs.push({ item: it, q: q }); else skipped += 1; });
    if (!qs.length) { toast('문항을 만들 낱말이 모자라요 — 단어장에 낱말이 더 있어야 해요'); return; }
    LEARN = null;
    TRAIN = { scope: scope, list: qs, i: 0, right: 0, wrong: [], skipped: skipped };
    render('train');
  }
  function renderTrain() {
    var el = $('#view-train');
    if (LEARN) { learnRender(el); return; }
    if (!TRAIN) { trainMenu(el); return; }
    var cur = TRAIN.list[TRAIN.i];
    if (!cur) { trainDone(el); return; }
    var label = TRAIN.scope.mode === 'due' ? '오늘 복습' : (TRAIN.scope.mode === 'unit' ? '단원 훈련' : '단어장 훈련');
    var head = '<div class="qhead"><span class="chip t-a">' + label + '</span><span class="muted" style="font-size:.78rem">' + esc(bookTitle(cur.item.book)) + '</span><span class="prog">' + (TRAIN.i + 1) + ' / ' + TRAIN.list.length + '</span></div>';
    questionRender(el, head, cur.q, function (ok, hinted) {
      var s = db.states[cur.item.sid] || (db.states[cur.item.sid] = WBHSRS.plant(cur.item.sid, now(), { book: cur.item.book }));
      var grade = ok ? (hinted ? 'hard' : 'good') : 'fail';
      WBHSRS.review(s, grade, now());
      logEvent('train', cur.item.sid, ok);
      if (ok) TRAIN.right += 1; else TRAIN.wrong.push(cur.item);
      bumpStreak(); save();
      var fb = $('#qFeed');
      fb.insertAdjacentHTML('beforeend', '<div class="row" style="margin-top:10px">' + (ok ? '' : '<button class="btn small" id="qSee">다시 보기</button>') + '<button class="btn primary" id="qNext">' + (TRAIN.i === TRAIN.list.length - 1 ? '결과 보기' : '다음 →') + '</button></div>');
      $('#qNext').addEventListener('click', function () { TRAIN.i += 1; renderTrain(); });
      var see = $('#qSee'); if (see) see.addEventListener('click', function () { cur.item.kind === 'word' ? wordSheet(cur.item) : charSheet(cur.item); });
    }, {});
  }
  function trainMenu(el) {
    var t = now(), due = WBHSRS.dueList(db.states, t), bid = curBookId(), book = bid ? bookOf(bid) : null;
    var units = book ? unitsOf(book) : [], unit = units.filter(function (u) { return u.id === db.settings.unit; })[0] || units[0];
    var unitP = book && unit ? progressOf(itemsOf(book, unit.id)) : null, bookP = book ? progressOf(itemsOf(book, null)) : null;
    var charP = book ? progressOf(itemsOf(book, null, { allChars: true }).filter(function (i) { return i.kind === 'char'; })) : null;
    el.innerHTML = '<h2 class="sec" style="margin-top:6px">훈련 <small>문제로 확인해요 — 보면 아는 것과 꺼낼 수 있는 것은 달라요</small></h2>' +
      '<div class="card"><b style="color:var(--ink-strong)">오늘 복습</b><p class="muted" style="margin:2px 0 10px">잊기 직전의 낱말·한자 ' + due.length + '개 (모든 단어장)</p><button class="btn primary big" id="tmDue"' + (due.length ? '' : ' disabled') + '>복습 시작</button></div>' +
      (book ? '<div class="card"><b style="color:var(--ink-strong)">' + esc(book.title) + '</b>' +
        '<div class="row" style="margin-top:10px"><button class="btn" id="tmUnit"' + (unitP && unitP.planted ? '' : ' disabled') + '>' + esc(unit ? unit.title : '단원') + ' (' + (unitP ? unitP.planted : 0) + ')</button>' +
        '<button class="btn" id="tmBook"' + (bookP.planted ? '' : ' disabled') + '>단어장 전체 (' + bookP.planted + ')</button></div>' +
        '<div class="row" style="margin-top:8px"><button class="btn" id="tmChars"' + (charP.planted ? '' : ' disabled') + '>한자만 (' + charP.planted + ')</button><button class="btn ghost" id="tmPick">단어장 바꾸기</button></div>' +
        '<p class="muted" style="margin:8px 0 0;font-size:.78rem">배운 것(심은 것)만 훈련해요. 계단이 오를수록 뜻 고르기 → 빈칸·한자 조립 → 낱말 쓰기로 어려워져요.</p></div>' : '');
    var d = $('#tmDue'); if (d) d.addEventListener('click', function () { trainStart({ mode: 'due' }); });
    var u = $('#tmUnit'); if (u) u.addEventListener('click', function () { trainStart({ mode: 'unit', book: book.id, unit: unit.id }); });
    var b = $('#tmBook'); if (b) b.addEventListener('click', function () { trainStart({ mode: 'book', book: book.id }); });
    var c = $('#tmChars'); if (c) c.addEventListener('click', function () { trainStart({ mode: 'book', book: book.id, chars: true }); });
    var p = $('#tmPick'); if (p) p.addEventListener('click', function () { render('books'); });
  }
  function trainDone(el) {
    var n = TRAIN.list.length, r = TRAIN.right, wrong = TRAIN.wrong, scope = TRAIN.scope;
    el.innerHTML = '<div class="card wcard"><div class="word" style="font-size:1.5rem">' + r + ' / ' + n + ' 맞혔어요' + (r === n ? ' 🎉' : '') + '</div>' +
      '<p class="muted">' + (wrong.length ? '틀린 것은 10분 뒤 다시 나와요 — 오늘 안에 한 번 더 만나요.' : '전부 다음 계단으로 올라갔어요.') + (TRAIN.skipped ? ' (문항을 못 만든 항목 ' + TRAIN.skipped + ')' : '') + '</p>' +
      (wrong.length ? '<div class="result-list" style="text-align:left">' + wrong.map(function (it) { return '<div class="wrow" data-sid="' + esc(it.sid) + '"><span class="dot due"></span><span class="w">' + esc(it.kind === 'word' ? it.w.word : it.c.ch) + '</span><span class="m">' + esc(it.kind === 'word' ? it.w.meaning : (it.c.hun + ' ' + it.c.eum)) + '</span></div>'; }).join('') + '</div>' : '') +
      '<div class="row" style="margin-top:12px"><button class="btn" id="tdAgain">한 번 더</button><button class="btn primary" id="tdHome">오늘 화면으로</button></div></div>';
    TRAIN = null;
    $('#tdAgain').addEventListener('click', function () { trainStart(scope); });
    $('#tdHome').addEventListener('click', function () { render('home'); });
    el.querySelectorAll('.wrow').forEach(function (r2) { r2.addEventListener('click', function () { var it = resolve(r2.dataset.sid); if (it) (it.kind === 'word' ? wordSheet(it) : charSheet(it)); }); });
  }

  /* ── 기록 ── */
  function renderReport() {
    var el = $('#view-report'), t = now(), sum = WBHSRS.summary(db.states, t);
    var byBook = {};
    Object.keys(db.states).forEach(function (id) { var s = db.states[id]; var m = id.match(/^w:([^:]+):/); var k = m ? m[1] : (s.book || '한자'); var b = byBook[k] = byBook[k] || { n: 0, g: 0 }; b.n += 1; if (s.graduated) b.g += 1; });
    var week = 0, weekOk = 0; db.log.forEach(function (l) { if (t - l.t < 7 * DAY && l.k === 'train') { week += 1; if (l.ok) weekOk += 1; } });
    var traced = Object.keys(db.trace).length;
    el.innerHTML = '<h2 class="sec" style="margin-top:6px">내 기록</h2><div class="card"><div class="nums">' +
      '<div class="tn"><b>' + sum.words + '</b><span>낱말</span></div><div class="tn"><b>' + sum.chars + '</b><span>한자</span></div>' +
      '<div class="tn"><b>' + sum.graduated + '</b><span>장기 기억</span></div><div class="tn"><b>' + traced + '</b><span>써 본 한자</span></div></div>' +
      '<div class="kv" style="margin-top:12px"><span>이번 주 훈련 문항</span><b>' + week + (week ? ' (정답 ' + pct(weekOk, week) + '%)' : '') + '</b></div>' +
      '<div class="kv"><span>연속 학습일</span><b>' + ((db.streak && db.streak.count) || 0) + '일</b></div>' +
      '<div class="kv"><span>지금 복습할 것</span><b>' + sum.due + (sum.emergency ? ' (오래 방치 ' + sum.emergency + ')' : '') + '</b></div></div>' +
      (Object.keys(byBook).length ? '<h2 class="sec">단어장별</h2><div class="card">' + Object.keys(byBook).map(function (k) { var b = byBook[k]; return '<div class="kv"><span>' + esc(k === '한자' ? '한자(공용)' : bookTitle(k)) + '</span><b>' + b.g + ' / ' + b.n + '</b></div>'; }).join('') + '</div>' : '') +
      '<h2 class="sec">연동</h2><div class="card">' + (authed
        ? '<div class="kv"><span>학생</span><b>' + esc((AUTH.student && AUTH.student.name) || AUTH.name || code) + '</b></div><div class="kv"><span>서버 저장</span><b>' + (SYNC.authBad ? '연동 만료 — 진로독서에서 다시 연동' : SYNC.avail ? (SYNC.last ? '저장됨 ' + new Date(SYNC.last).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) : '대기 중') : '오프라인 — 이 기기에만 저장') + '</b></div>'
        : '<p class="muted" style="margin:0">체험 모드 — 이 기기에만 저장돼요. <a href="/">진로독서</a>에서 학원 QR로 연동하면 학원 단어장과 서버 저장이 열려요.</p>' +
          '<div class="row" style="margin-top:10px"><button class="btn ghost small" id="rpReset">체험 기록 지우기</button></div>') + '</div>' +
      '<p class="muted" style="font-size:.76rem">간격: 오늘 밤 → 1일 → 3일 → 7일 → 14일 → 30일 → 90일. 30일 간격을 통과하고 연속 3회 맞히면 장기 기억(졸업)으로 봐요.</p>';
    var r = $('#rpReset'); if (r) r.addEventListener('click', function () { if (confirm('체험 기록을 모두 지울까요?')) { adopt(null); save(); renderStreak(); render('home'); } });
  }

  /* ── 부팅 ── */
  async function boot() {
    renderStreak();
    render('home');
    try { var r = await fetch('/api/health', { cache: 'no-store' }); var j = await r.json(); SYNC.avail = !!(j && j.ok); } catch (e) { SYNC.avail = false; }
    if (syncOn()) {
      try {
        var res = await api('/pull');
        if (res && res.state && richness(res.state) > richness(db)) { adopt(res.state); try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} toast('서버에 저장된 기록을 불러왔어요'); renderStreak(); }
        else if (richness(db) > 0) save();
        SYNC.last = res && res.updatedAt;
      } catch (e) { /* 오프라인·만료 — 이 기기 기록으로 계속 */ }
    }
    try { await loadIndex(); } catch (e) { toast('단어장 목록을 받지 못했어요'); }
    var bid = curBookId();
    if (bid) { try { var b = await openBook(bid); if (b && !db.settings.unit && unitsOf(b)[0]) { db.settings.unit = unitsOf(b)[0].id; } } catch (e) { /* 캐시 없음 — 단어장 탭에서 다시 */ } }
    render(curView);
    if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('./sw.js'); } catch (e) {} }
  }
  boot();
})();
/* APP:JS:END */
  </script>
