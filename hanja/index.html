<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>WB 어휘브레인 — 한글 어휘·한자어</title>
  <meta name="description" content="추천 교재의 어휘를 시험 보고, 부족한 낱말을 배우고 다시 확인하는 WB 어휘브레인 (원내 전용)">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#8E3B2F">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #F7F4EC; --card: #FFFFFF; --card-2: #F1ECE1; --ink: #2B2118; --ink-strong: #1F1712; --ink-soft: #6F6459;
      --line: #E4DCCB; --red: #B23A2E; --deep: #8E3B2F; --red-soft: #F8E6E2; --blue: #3D6B8E; --blue-soft: #E6EFF6;
      --green: #4E8C57; --green-soft: #E6F1E6; --amber: #B98426; --amber-soft: #FBF1DC;
      --shadow: 0 1px 4px rgba(43,33,24,.08); --radius: 14px;
      --serif: "Noto Serif KR", "Nanum Myeongjo", "Batang", "BatangChe", "AppleMyungjo", serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--ink); font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; font-size: 16px; line-height: 1.6; word-break: keep-all; -webkit-font-smoothing: antialiased; }
    button { font-family: inherit; font-size: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    input { font-family: inherit; }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
    .shell { max-width: 640px; margin: 0 auto; padding: 0 16px 96px; }

    .top { display: flex; align-items: center; gap: 10px; padding: 18px 2px 10px; }
    .top .logo { width: 34px; height: 34px; flex: none; border-radius: 9px; }
    .top h1 { font-size: 1.12rem; font-weight: 900; color: var(--ink-strong); margin: 0; letter-spacing: -.01em; }
    .top .sub { font-size: .72rem; color: var(--ink-soft); display: block; font-weight: 500; }
    .top > div { min-width: 0; }
    .swap { margin-left: auto; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; font-size: .78rem; font-weight: 700; color: var(--ink-soft); text-decoration: none; white-space: nowrap; flex: none; }
    .streak { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: .8rem; font-weight: 700; color: var(--amber); box-shadow: var(--shadow); flex: none; margin-left: 6px; }
    @media (max-width: 430px) { .top .sub { display: none; } .swap .lbl { display: none; } .swap { padding: 5px 9px; font-size: .9rem; } }

    .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--card); border-top: 1px solid var(--line); display: flex; justify-content: center; gap: 2px; padding: 6px 8px calc(8px + env(safe-area-inset-bottom)); }
    .tabbar button { flex: 1; max-width: 120px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .68rem; font-weight: 700; color: var(--ink-soft); padding: 6px 0; border-radius: 10px; }
    .tabbar button b { font-size: 1.15rem; line-height: 1.2; font-weight: 700; }
    .tabbar button.on { color: var(--deep); background: var(--red-soft); }

    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin-bottom: 12px; }
    .card.tight { padding: 12px 14px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; padding: 12px 16px; font-weight: 700; font-size: .95rem; background: var(--card-2); color: var(--ink-strong); border: 1px solid var(--line); }
    .btn.primary { background: var(--deep); color: #fff; border-color: var(--deep); }
    .btn.blue { background: var(--blue); color: #fff; border-color: var(--blue); }
    .btn.ghost { background: transparent; }
    .btn.small { padding: 8px 12px; font-size: .84rem; border-radius: 10px; }
    .btn.big { width: 100%; padding: 15px 18px; font-size: 1rem; }
    .btn:disabled { opacity: .45; cursor: default; }
    .btn:active:not(:disabled) { transform: translateY(1px); }
    .btn[hidden] { display: none; }
    .tabbar button[hidden] { display: none; }
    details.hanja-help { margin-top: 12px; text-align: left; border-top: 1px solid var(--line); padding-top: 10px; }
    details.hanja-help summary { cursor: pointer; color: var(--ink-soft); font-size: .84rem; }
    .row { display: flex; gap: 10px; } .row > * { flex: 1; }
    .row.wrap { flex-wrap: wrap; } .row.wrap > * { flex: none; }
    h2.sec { font-size: 1.02rem; font-weight: 900; color: var(--ink-strong); margin: 24px 0 10px; }
    h2.sec small { font-weight: 600; color: var(--ink-soft); font-size: .78rem; margin-left: 6px; }
    .muted { color: var(--ink-soft); font-size: .85rem; }
    .chip { display: inline-block; font-size: .7rem; font-weight: 700; border-radius: 6px; padding: 2px 8px; letter-spacing: .02em; vertical-align: middle; }
    .t-h { background: var(--blue-soft); color: var(--blue); } .t-n { background: var(--green-soft); color: #3A7A43; } .t-c { background: var(--red-soft); color: var(--deep); }
    .t-a { background: var(--amber-soft); color: var(--amber); } .t-g { background: var(--card-2); color: var(--ink-soft); }
    .notice { background: var(--amber-soft); border: 1px solid #EAD6A5; color: #6E4E10; border-radius: var(--radius); padding: 12px 14px; font-size: .86rem; margin-bottom: 12px; }
    .notice a { color: inherit; font-weight: 700; }
    .toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(10px); background: var(--ink-strong); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: .86rem; opacity: 0; transition: .25s; pointer-events: none; z-index: 60; max-width: 90vw; text-align: center; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* 오늘 */
    .nums { display: flex; gap: 14px; }
    .tn { flex: 1; text-align: center; background: var(--card-2); border-radius: 12px; padding: 10px 6px; }
    .tn b { display: block; font-size: 1.5rem; font-weight: 900; color: var(--ink-strong); line-height: 1.2; font-variant-numeric: tabular-nums; }
    .tn.warn b { color: var(--red); } .tn span { font-size: .72rem; color: var(--ink-soft); font-weight: 700; }
    .bar { height: 8px; background: var(--card-2); border-radius: 999px; overflow: hidden; margin: 8px 0 4px; }
    .bar i { display: block; height: 100%; background: var(--blue); border-radius: 999px; }
    .bar i.g { background: var(--green); }
    .bar.stack { display: flex; } .bar.stack i { border-radius: 0; }

    /* 단어장 */
    .book { display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; }
    .book .ico { width: 44px; height: 56px; border-radius: 6px; background: linear-gradient(160deg, var(--deep), #C2574A); color: #fff; display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-size: 1.5rem; font-weight: 700; flex: none; }
    .book .ico.n { background: linear-gradient(160deg, var(--blue), #6C97B9); }
    .book b { display: block; color: var(--ink-strong); }
    .book.on { border-color: var(--deep); background: #FFF9F5; }
    .unit { padding: 12px 14px; }
    .unit-head { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .unit-head b { flex: 1; color: var(--ink-strong); }
    .unit-head .n { font-size: .74rem; color: var(--ink-soft); white-space: nowrap; }
    .unit-body { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 10px; }
    .wrow { display: flex; align-items: baseline; gap: 8px; padding: 6px 2px; border-bottom: 1px solid #F1ECE1; cursor: pointer; }
    .wrow:last-child { border-bottom: none; }
    .wrow .w { font-weight: 800; color: var(--ink-strong); white-space: nowrap; }
    .wrow .hj { font-family: var(--serif); color: var(--blue); white-space: nowrap; }
    .wrow .m { flex: 1; font-size: .84rem; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
    .dot.s1 { background: #C9B98F; } .dot.s2 { background: var(--blue); } .dot.s3 { background: var(--green); } .dot.due { background: var(--red); }
    .cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; }
    .ctile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 4px 6px; text-align: center; cursor: pointer; position: relative; }
    .ctile .ch { font-family: var(--serif); font-size: 1.9rem; line-height: 1.15; color: var(--ink-strong); }
    .ctile .hm { font-size: .68rem; color: var(--ink-soft); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ctile .pip { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
    .ctile .pip.t1 { background: #C9B98F; } .ctile .pip.t2 { background: var(--blue); } .ctile .pip.t3 { background: var(--green); }
    .ctile .ord { position: absolute; top: 5px; left: 6px; font-size: .58rem; font-weight: 800; color: var(--deep); }
    .ctile.on { border-color: var(--deep); background: #FFF9F5; }

    /* 낱말 카드(배우기·상세) */
    .wcard { text-align: center; }
    .wcard .word { font-size: 2rem; font-weight: 900; color: var(--ink-strong); line-height: 1.2; }
    .wcard .hanja { font-family: var(--serif); font-size: 1.6rem; color: var(--blue); margin-top: 2px; }
    .parts { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
    .part { background: var(--blue-soft); border-radius: 10px; padding: 6px 10px; min-width: 60px; }
    .part .c { font-family: var(--serif); font-size: 1.5rem; color: var(--ink-strong); line-height: 1.1; }
    .part .g { font-size: .72rem; color: var(--blue); font-weight: 700; }
    .meaning { font-size: 1.02rem; color: var(--ink); margin: 8px 0 2px; }
    .example { font-size: .9rem; color: var(--ink-soft); background: var(--card-2); border-radius: 10px; padding: 8px 12px; margin-top: 8px; }
    .example mark { background: #FFE9A8; color: inherit; border-radius: 3px; padding: 0 2px; }
    .say-btn { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: .82rem; font-weight: 700; color: var(--ink-strong); background: var(--card); margin: 6px 3px 0; }
    .say-btn.on { background: var(--red-soft); border-color: #E4B8B0; color: var(--deep); }
    .cchip { display: inline-block; font-family: var(--serif); font-size: 1.1rem; background: var(--card-2); border-radius: 8px; padding: 2px 8px; margin: 2px; }

    /* 따라쓰기 */
    .trace { margin-top: 12px; }
    .trace-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; margin-bottom: 8px; }
    .trace-head b { font-family: var(--serif); font-size: 2.2rem; color: var(--ink-strong); line-height: 1; }
    .trace-head span { color: var(--blue); font-weight: 700; }
    .trace-head i { margin-left: auto; font-style: normal; font-size: .78rem; color: var(--ink-soft); font-weight: 700; white-space: nowrap; }
    .trace canvas { display: block; width: 100%; max-width: 320px; aspect-ratio: 1; margin: 0 auto; background: #FFFDF8; border: 1px solid var(--line); border-radius: 12px; touch-action: none; }
    .trace-tip { text-align: center; font-size: .84rem; color: var(--ink-soft); margin: 8px 0; min-height: 1.4em; }
    .trace-tip.warn { color: var(--red); font-weight: 700; }
    .trace-tip.good { color: var(--green); font-weight: 700; }
    .trace-btns { max-width: 320px; margin: 0 auto; }
    .trace-mode { text-align: center; margin-bottom: 6px; }

    /* 훈련 */
    .qhead { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .qhead .prog { margin-left: auto; font-size: .78rem; color: var(--ink-soft); font-weight: 700; font-variant-numeric: tabular-nums; }
    .prompt { font-size: 1.12rem; font-weight: 800; color: var(--ink-strong); white-space: pre-line; line-height: 1.5; margin-bottom: 14px; }
    .prompt.big { font-family: var(--serif); font-size: 3.4rem; font-weight: 500; text-align: center; line-height: 1.2; }
    .prompt .sub { display: block; font-family: "Noto Sans KR", sans-serif; font-size: .95rem; font-weight: 700; color: var(--ink-soft); margin-top: 6px; }
    .choices { display: grid; gap: 8px; }
    .choices.two { grid-template-columns: 1fr 1fr; }
    .choice { text-align: left; background: var(--card-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-weight: 700; color: var(--ink-strong); }
    .choice.big { font-family: var(--serif); font-size: 1.9rem; text-align: center; font-weight: 500; padding: 8px; }
    .choice.ok { background: var(--green-soft); border-color: var(--green); }
    .choice.bad { background: var(--red-soft); border-color: var(--red); }
    .choice.dim { opacity: .5; }
    .sel { flex: 1; min-width: 0; font-size: .92rem; font-weight: 700; padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink-strong); }
    .ans-in { width: 100%; font-size: 1.1rem; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); }
    .feedback { margin-top: 12px; border-radius: 12px; padding: 12px 14px; font-size: .9rem; }
    .feedback.ok { background: var(--green-soft); color: #2E5F35; } .feedback.bad { background: var(--red-soft); color: #7A2A20; }
    .feedback b { display: block; font-size: 1rem; }
    .hintbox { background: var(--amber-soft); border-radius: 10px; padding: 8px 12px; font-size: .84rem; color: #6E4E10; margin-top: 8px; }
    .result-list { margin-top: 10px; }

    .sheet-back { position: fixed; inset: 0; background: rgba(31,23,18,.35); z-index: 50; display: none; align-items: flex-end; justify-content: center; }
    .sheet-back.show { display: flex; }
    .sheet { background: var(--card); width: 100%; max-width: 640px; max-height: 88vh; overflow: auto; border-radius: 18px 18px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); }
    .sheet .close { float: right; font-size: 1.2rem; color: var(--ink-soft); padding: 2px 8px; }
    .kv { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #F1ECE1; font-size: .9rem; }
    .kv:last-child { border-bottom: none; }
    .kv b { color: var(--ink-strong); }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
<!-- APP:BODY:START -->
  <div class="shell">
    <header class="top">
      <img class="logo" src="./icon.svg" alt="">
      <div><h1>WB 어휘브레인</h1><span class="sub">교재로 공부하고, 어휘 실력을 확인해요</span></div>
      <a class="swap" href="/" aria-label="진로독서 앱으로"><span aria-hidden="true">📖</span><span class="lbl"> 진로독서</span></a>
      <div class="streak" id="streakChip">🔥 0일</div>
    </header>
    <main>
      <section id="view-home"></section>
      <section id="view-books" hidden></section>
      <section id="view-curriculum" hidden></section>
      <section id="view-words" hidden></section>
      <section id="view-chars" hidden></section>
      <section id="view-train" hidden></section>
      <section id="view-report" hidden></section>
    </main>
  </div>
  <nav class="tabbar" aria-label="주 메뉴">
    <button data-view="home" class="on"><b>⌂</b>오늘 할 일</button>
    <button data-view="books"><b>▤</b>내 교재</button>
    <button data-view="train"><b>◎</b>복습</button>
    <button data-view="report"><b>◔</b>학습 기록</button>
    <button data-view="chars"><b>✍</b>한자 집중</button>
  </nav>
  <div class="sheet-back" id="sheetBack"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
<!-- APP:BODY:END -->

  <script src="./voice.js"></script>
  <script src="./book-check.js"></script>
  <script src="./bridge.js"></script>
  <script src="./srs.js"></script>
  <script src="./quiz.js"></script>
  <script src="./trace.js"></script>
  <script>
/* APP:JS:START */
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var DAY = WBHSRS.DAY;
  var SAMPLE_ID = 'wb-hanja-starter';
  var LEARN_MAX = 8;          /* 한 자리에서 새로 배우는 항목 상한 — 작업기억을 넘기지 않는다 */
  var TRAIN_MAX = 20;         /* 한 세션 문항 상한 */

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function now() { return Date.now(); }
  function toast(msg) { var el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(function () { el.classList.remove('show'); }, 2200); }
  function say(text) { try { WBVoice.unlock(); WBVoice.speak(text, { lang: 'ko-KR', rate: 0.95 }); } catch (e) {} }
  function fmtDue(due) { var d = due - now(); if (d <= 0) return '지금'; if (d < 3600000) return Math.max(1, Math.round(d / 60000)) + '분 후'; if (d < DAY) return Math.round(d / 3600000) + '시간 후'; return Math.round(d / DAY) + '일 후'; }
  function pct(a, b) { return b ? Math.round(a * 100 / b) : 0; }

  /* ── 연동 ── 학생 토큰(wbr.auth)은 진로독서 앱 소유 — 읽기만 한다 */
  function auth() { try { return JSON.parse(localStorage.getItem('wbr.auth') || 'null'); } catch (e) { return null; } }
  var AUTH = auth();
  var authed = !!(AUTH && AUTH.token);
  var code = authed ? String((AUTH.student && AUTH.student.code) || AUTH.code || 'linked') : 'demo';
  var SYNC = { avail: false, ai: false, authBad: false, timer: null, busy: false, last: null, offline: false };
  function todayKst() { return new Date(now() + 9 * 3600e3).toISOString().slice(0, 10); }
  async function api(path, opt) {
    if (!authed) throw new Error('연동이 필요해요');
    var r = await fetch((path.indexOf('/api/') === 0 ? path : '/api/hanja' + path), Object.assign({ headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + AUTH.token } }, opt || {}));
    if (r.status === 401) { SYNC.authBad = true; throw new Error('연동이 만료됐어요 — 진로독서 설정에서 다시 연동해 주세요'); }
    var j = await r.json();
    if (!r.ok) { var e = new Error((j && j.error) || ('오류 ' + r.status)); e.status = r.status; throw e; }
    return j;
  }
  function syncOn() { return authed && SYNC.avail && !SYNC.authBad; }

  /* ── 저장소 — 기기별 기록. 연동 학생 코드와 체험(demo)을 키로 갈라 섞이지 않게 ── */
  var KEY = 'wbhj.v1:' + code;
  var db;
  function fresh() { return { v: 1, states: {}, trace: {}, log: [], custom: {}, checks: {}, streak: { count: 0, last: null }, settings: { book: '', unit: '' }, created: now() }; }
  function load() { try { var raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }
  function adopt(next) { db = Object.assign(fresh(), next || {}); db.states = db.states || {}; db.trace = db.trace || {}; db.log = db.log || []; db.custom = db.custom || {}; db.checks = db.checks || {}; db.settings = db.settings || { book: '', unit: '' }; db.streak = db.streak || { count: 0, last: null }; }
  adopt(load());
  function save() {
    if (db.log.length > 400) db.log = db.log.slice(-300);
    try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { /* 저장 불가 환경 */ }
    if (syncOn()) { clearTimeout(SYNC.timer); SYNC.timer = setTimeout(syncPush, 2500); }
  }
  function richness(d) { return Object.keys((d && d.states) || {}).length * 10 + Object.keys((d && d.trace) || {}).length * 5 + ((d && d.log) || []).length; }
  async function syncPush() {
    if (!syncOn() || SYNC.busy) return;
    SYNC.busy = true;
    try { var r = await api('/state', { method: 'PUT', body: JSON.stringify({ state: db }) }); SYNC.last = r.updatedAt || new Date().toISOString(); }
    catch (e) { /* 다음 저장 때 재시도 */ }
    SYNC.busy = false;
    if (curView === 'report') render('report');
  }
  function bumpStreak() { var st = WBHSRS.bumpStreak(db.streak, now()); if (st !== db.streak) { db.streak = st; renderStreak(); } }
  function renderStreak() { $('#streakChip').textContent = '🔥 ' + ((db.streak && db.streak.count) || 0) + '일'; }
  function logEvent(kind, id, ok) { db.log.push({ t: now(), k: kind, id: id, ok: ok ? 1 : 0 }); }

  /* ── 단원 시험 ──

  async function selectBook(id) {
    var entry = LIB.index.filter(function (e) { return e.id === id; })[0], curriculum = isCurriculum(entry);
    var bookKey = curriculum ? 'curriculumBook' : 'book', unitKey = curriculum ? 'curriculumUnit' : 'unit';
    var preferred = id === db.settings[bookKey] ? db.settings[unitKey] : null;
    db.settings[bookKey] = id; db.settings[unitKey] = '';
    var cached = bookOf(id); if (cached) selectUnit(cached, preferred);
    var requestedUnit = db.settings[unitKey];
    save(); renderBooks();
    try {
      var b = await openBook(id);
      if (db.settings[bookKey] !== id) return;
      if (!b) throw new Error('교재를 열지 못했어요');
      var u = selectUnit(b, db.settings[unitKey] !== requestedUnit ? db.settings[unitKey] : preferred);
      if (u) BOOKS_UI.open[checkKey(b.id, u.id)] = true;
      save();
      if (curView === (curriculum ? 'curriculum' : 'books')) render(curView);
    } catch (e) { toast(e.message || '교재를 열지 못했어요'); }
  }

      (w.syn && w.syn.length ? '<p class="muted">비슷한 말: ' + esc(w.syn.join(', ')) + '</p>' : '') + sceneHtml(w) +
      '<div><button class="say-btn" data-say="' + esc(w.word + '. ' + w.meaning + (w.example ? '. ' + w.example : '')) + '">🔊 들어보기</button></div>' +
      (w.hanja ? '<details class="hanja-help"><summary>한자로 뜻 더 알아보기 · 선택</summary><div class="hanja">' + esc(w.hanja) + '</div>' + partsHtml(w) +
        '<button class="say-btn" data-word-trace="' + esc(w._sid) + '">한자 따라쓰기</button></details>' : '') +
      (w.origin ? '<details class="hanja-help"><summary>한자·원어 참고 · 선택</summary><p>' + esc(w.origin) + '</p></details>' : '') + '</div>';
  }
  /* 연상 장면 — 단어장에 적힌 것(scene)이 먼저, 없으면 학생이 고른 AI 연상(검수 전/승인). 둘 다 없고 AI 가 있으면 만들기 버튼 —
     단, 자체 단어장(source own)에서만. 교재 단어장의 뜻 문장은 외부 AI 로 보내지 않는다 */
  function sceneHtml(w) {
    var mine = w._sid && db.custom[w._sid];
    var scene = w.scene || (mine && mine.scene) || '', cue = (!w.scene && mine && mine.cue) || '';
    if (scene) return '<div class="hintbox" style="text-align:left;margin-top:8px"><span class="chip t-a">연상</span> ' + (cue ? '<b>' + esc(cue) + '</b> — ' : '') + esc(scene) + (mine && !w.scene && mine.mnemoStatus === 'pending' ? ' <span class="muted">(선생님 검수 전)</span>' : '') + '</div>';
    if (authed && SYNC.ai && !SYNC.authBad && w._sid && WBBOOKCHECK.aiAllowed(bookOf(w._book))) return '<div><button class="say-btn" data-ai="' + esc(w._sid) + '">✨ AI 연상 만들기</button></div>';
    return '';
  }
  function bindSay(root) {
    root.querySelectorAll('[data-say]').forEach(function (b) { b.addEventListener('click', function () { say(b.dataset.say); }); });
    root.querySelectorAll('[data-ai]').forEach(function (b) { b.addEventListener('click', function () { aiMnemo(b.dataset.ai); }); });
    root.querySelectorAll('[data-word-trace]').forEach(function (b) { b.addEventListener('click', function () {
      var it = resolve(b.dataset.wordTrace); if (!it) return;
      var back = curView; closeSheet(); render('chars'); traceOpen(WBHTRACE.chars(it.w.hanja), function () { render(back); });
    }); });
  }
  /* AI 연상 — 워드브레인의 검수 흐름을 그대로 쓴다: 후보 3개 → 학생이 하나 고름 → 검수 전(pending) → 접속 때마다 승인/반려 확인 */
  async function aiMnemo(sid) {
    var it = resolve(sid); if (!it || it.kind !== 'word') return;
    if (!WBBOOKCHECK.aiAllowed(bookOf(it.book))) { toast('교재 단어장의 낱말은 AI 연상을 만들지 않아요'); return; }
    var w = it.w;
    try {
      var j = await api('/api/vocab/mnemonic', { method: 'POST', body: JSON.stringify({ word: w.word, meaning: w.meaning, type: w.type,
        hanja: w.parts ? w.parts.map(function (p) { return p.ch + (p.hun ? '(' + p.hun + ' ' + p.eum + ')' : ''); }).join('+') : undefined }) });
      if (!j.ok) { toast(j.reason === 'quota' ? '오늘 AI 연상 한도를 다 썼어요 — 내일 다시' : j.reason === 'no-key' ? 'AI 연상이 아직 준비되지 않았어요' : '연상을 만들지 못했어요'); return; }
      var cands = j.candidates || [];
      if (j.status === 'approved' && cands[0]) { db.custom[sid] = { cue: cands[0].cue, scene: cands[0].scene, mnemoStatus: 'approved' }; save(); toast('선생님이 승인한 연상을 붙였어요'); render(curView); return; }
      if (!cands.length) { toast('연상을 만들지 못했어요'); return; }
      sheet('<b style="display:block;color:var(--ink-strong);margin-bottom:8px">' + esc(w.word) + ' — 마음에 드는 연상을 고르세요</b><div class="choices">' +
        cands.map(function (c, i) { return '<button class="choice" data-pick="' + i + '"><b>' + esc(c.cue) + '</b><br><span class="muted">' + esc(c.scene) + '</span></button>'; }).join('') + '</div>' +
        '<p class="muted" style="font-size:.78rem;margin:8px 0 0">고른 연상은 선생님 검수를 거쳐 확정돼요. 내가 만든 연상이 제일 오래 가요 — 마음에 안 들면 안 골라도 돼요.</p>', function (el) {
        el.querySelectorAll('[data-pick]').forEach(function (b) { b.addEventListener('click', function () {
          var c = cands[Number(b.dataset.pick)]; db.custom[sid] = { cue: c.cue, scene: c.scene, mnemoStatus: 'pending' }; save(); closeSheet(); toast('연상을 붙였어요 — 선생님 검수 뒤 확정돼요'); render(curView);
        }); });
      });
    } catch (e) { toast(e.message || '연상을 만들지 못했어요'); }
  }
  async function refreshPendingMnemos() {
    if (!syncOn()) return;
    var pend = Object.keys(db.custom).filter(function (k) { return db.custom[k] && db.custom[k].mnemoStatus === 'pending'; });
    if (!pend.length) return;
    var byWord = {};
    pend.forEach(function (k) { var it = resolve(k); if (it && it.kind === 'word') byWord[it.w.word] = k; });
    var words = Object.keys(byWord).slice(0, 50);
    if (!words.length) return;
    try {
      var j = await api('/api/vocab/mnemonic/check', { method: 'POST', body: JSON.stringify({ words: words }) });
      var changed = 0;
      (j.items || []).forEach(function (r) {
        var k = byWord[r.word]; if (!k) return;
        if (r.status === 'approved' && r.approved) { db.custom[k] = { cue: r.approved.cue, scene: r.approved.scene, mnemoStatus: 'approved' }; changed += 1; }
        else if (r.status === 'rejected' || r.status === 'none') { delete db.custom[k]; changed += 1; }
      });
      if (changed) { save(); toast('선생님 검수 결과가 반영됐어요'); render(curView); }
    } catch (e) { /* 다음 접속 때 */ }
  }
  function stateHtml(item) {
    var s = stateOf(item);
    if (!s) return '<p class="muted" style="text-align:center;margin:8px 0 0">아직 안 배운 항목이에요.</p>';
    return '<div style="margin-top:10px"><div class="kv"><span>기억 단계</span><b>' + WBHSRS.stageLabel(s) + (s.graduated ? ' 🌳' : '') + '</b></div>' +
      '<div class="kv"><span>다음 복습</span><b>' + (s.graduated ? '졸업' : fmtDue(s.due)) + '</b></div>' +
      '<div class="kv"><span>맞힘 · 틀림</span><b>' + Math.max(0, s.reps - s.lapses) + ' · ' + s.lapses + '</b></div></div>';
  }
  function wordSheet(item) {
    sheet(wordCardHtml(item.w) + stateHtml(item), function (el) { bindSay(el); });
  }
  function charCardHtml(c) {
    var words = (c.words || []).slice(0, 8);
    return '<div class="wcard"><span class="chip t-c">한자</span><div class="word" style="font-family:var(--serif);font-size:3.2rem;font-weight:500">' + esc(c.ch) + '</div>' +
      '<div class="meaning" style="font-weight:800">' + esc(c.hun && c.eum ? c.hun + ' ' + c.eum : '훈음 미상') + '</div>' +
      '<p class="muted" style="margin:0">' + (c.strokes ? c.strokes + '획' : '획수 미상') + (c.medians ? ' · 획순 안내 있음' : '') + '</p>' +
      (words.length ? '<p class="muted" style="margin:8px 0 0;font-size:.84rem">이 글자가 든 낱말: ' + words.map(esc).join(', ') + '</p>' : '') +
      '<div><button class="say-btn" data-say="' + esc((c.hun || '') + ' ' + (c.eum || '')) + '">🔊 들어보기</button></div></div>';
  }
  function charSheet(item) {
    sheet(charCardHtml(item.c) + stateHtml(item) + '<div class="row" style="margin-top:12px"><button class="btn blue" id="shTrace">✍️ 따라쓰기</button></div>', function (el) {
      bindSay(el);
      $('#shTrace').addEventListener('click', function () { closeSheet(); render('chars'); traceOpen([item.c.ch]); });
    });
  }

  /* ── 낱말 학습(심기) — 카드로 보고, 곧바로 한 번 꺼내 보고(즉시 인출), 심는다 ──
     한 자리에 8개까지. 낱말은 뜻·예문 확인 뒤 검수된 새 상황을 적용하고, 한자는 훈음·획수를 확인한다.
     맞히면 심고(오늘 밤 첫 복습), 틀리면 카드를 다시 보여 주고 심는다 — 시작은 같되 기록에 남는다. */
  var LEARN = null;
  /* only: 'word'|'char' — 낱말 탭에서 시작하면 낱말만 심는다. 섞어 심으면 국어 어휘 교재에서 한자가 끼어들어
     「낱말 배우려는데 왜 한자가 나오나」가 된다. 안 주면 예전처럼 그 단원 전부다. */
  function learnStart(book, unitId, only, opts) {
    if (!leaveStudy()) { render('train'); return; }
    opts = opts || {};
    var items = opts.items || itemsOf(book, unitId == null ? null : unitId);
    if (only) items = items.filter(function (it) { return it.kind === only; });
    if (!items.length) { toast('학습할 낱말이 없어요'); return; }
    TRAIN = null;
    LEARN = { book: book, unit: unitId, items: items.slice(0, LEARN_MAX), remaining: items.slice(LEARN_MAX), all: opts.all || items, check: opts.check || null, only: only, i: 0, phase: 'card', ok: 0, applied: 0, contextN: 0 };
    render('train');
  }
  async function reviewCheck(key) {
    var c = db.checks[key]; if (!c) return;
    try {
      var book = await openBook(c.book);
      if (!book) throw new Error('교재를 받지 못했어요');
      var ids = pendingIds(c), items = itemsOf(book, c.unit).filter(function (it) { return ids.indexOf(it.sid) >= 0; });
      if (!items.length) { toast('보충할 항목을 현재 단원에서 찾지 못했어요. 오답 기록은 유지돼요 — 선생님에게 교재 내용을 확인해 주세요.'); return; }
      if (items.length < ids.length) toast('현재 단원에서 찾지 못한 보충 항목 ' + (ids.length - items.length) + '개는 오답 기록에 남겨 두어요.');
      if (checkIsChar(c)) db.settings.hanjaBook = book.id; else selectUnit(book, c.unit);
      save();
      learnStart(book, c.unit, checkIsChar(c) ? 'char' : null, { items: items, check: key });
    } catch (e) { toast(e.message || '교재를 열지 못했어요'); }
  }
  function learnRender(el) {
    var it = LEARN.items[LEARN.i];
    if (!it) { learnDone(el); return; }
    var head = '<div class="qhead"><span class="chip t-a">' + (LEARN.check ? '오답 보충' : it.kind === 'word' ? '낱말 학습' : '한자 학습') + '</span><span class="muted">' + esc(bookTitle(LEARN.book.id)) + ' · ' + esc(unitTitleOf(LEARN.book.id, LEARN.unit)) + '</span><span class="prog">' + (LEARN.i + 1) + ' / ' + LEARN.items.length + '</span><button class="btn ghost small" id="studyQuit">그만두기</button></div>';
    if (LEARN.phase === 'card') {
      el.innerHTML = '<div class="card">' + head + (it.kind === 'word' ? wordCardHtml(it.w) : charCardHtml(it.c)) +
        (it.kind === 'char' ? '<button class="say-btn" id="lnTrace">지금 한 번 써 보기</button>' : '') +
        '<button class="btn primary big" id="lnNext" style="margin-top:14px">뜻을 읽었어요 · 확인하기</button></div>';
      bindSay(el);
      $('#lnNext').addEventListener('click', function () { LEARN.phase = 'check'; learnRender(el); });
      var tb = $('#lnTrace'); if (tb) tb.addEventListener('click', function () { render('chars'); traceOpen([it.c.ch], function () { render('train'); }); });
      bindStudyQuit();
      return;
    }
    var applying = LEARN.phase === 'apply';
    var q = LEARN.q || (LEARN.q = WBHQUIZ.makeQuestion(it, ctxFor(it), { step: 0, rnd: Math.random, vocabulary: it.kind === 'word', kinds: applying ? ['w-context'] : it.kind === 'word' ? ['w-meaning', 'w-word', 'w-type'] : ['c-hun', 'c-char', 'c-write'] }));
    if (!q) {
      el.innerHTML = '<div class="card">' + head + '<p>이 낱말은 확인 문항을 만들 수 없어 뜻 학습만 기록해요.</p><button class="btn" id="lnSkip">다음 낱말</button></div>';
      $('#lnSkip').addEventListener('click', function () { learnPlant(it, null); LEARN.i += 1; LEARN.phase = 'card'; learnRender(el); });
      bindStudyQuit();
      return;
    }
    questionRender(el, head, q, function (ok, hinted, replay) {
      if (!replay) {
        if (applying) { LEARN.contextN += 1; if (ok && !hinted) LEARN.applied += 1; logEvent('apply', it.sid, ok && !hinted); save(); }
        else { learnPlant(it, ok && !hinted); if (ok && !hinted) LEARN.ok += 1; }
      }
      var fb = $('#qFeed');
      if (!ok || hinted) fb.insertAdjacentHTML('beforeend', it.kind === 'word' ? wordCardHtml(it.w) : charCardHtml(it.c));
      var nextContext = !applying && it.kind === 'word' && it.w.context;
      fb.insertAdjacentHTML('beforeend', '<button class="btn primary big" id="lnContinue" style="margin-top:12px">' + (nextContext ? '새로운 상황에 적용하기' : LEARN.i + 1 === LEARN.items.length ? '학습 마무리' : '다음 낱말') + '</button>');
      bindSay(fb);
      $('#lnContinue').addEventListener('click', function () { if (!nextContext) LEARN.i += 1; LEARN.q = null; LEARN.phase = nextContext ? 'apply' : 'card'; learnRender(el); });
    }, {});
    bindStudyQuit();
  }
  function learnPlant(it, ok) {
    if (!db.states[it.sid]) db.states[it.sid] = WBHSRS.plant(it.sid, now(), { book: it.book });
    logEvent('learn', it.sid, ok === true);
    bumpStreak(); save();
  }
  function learnDone(el) {
    var done = LEARN;
    el.innerHTML = '<div class="card wcard"><h2>' + done.items.length + '개를 공부했어요</h2><p class="muted">학습 직후 스스로 확인 ' + done.ok + ' / ' + done.items.length + '. 단원 시험 점수와는 따로 기록해요.</p>' +
      (done.only !== 'char' ? '<p class="muted">새로운 상황에 적용 ' + done.applied + ' / ' + done.contextN + (done.contextN < done.items.length ? ' · 상황 문제 미실시 ' + (done.items.length - done.contextN) + '개' : '') + '</p>' : '') +
      '<button class="btn primary big" id="lnMore">' + (done.remaining.length ? '다음 ' + Math.min(done.remaining.length, LEARN_MAX) + '개 배우기' : done.check ? (done.only === 'char' ? '보충한 한자만 재확인' : '보충한 낱말만 재확인') : '이 단원 시험 보기') + '</button>' +
      '<button class="btn big" id="lnHome" style="margin-top:8px">' + (done.only === 'char' ? '한자 집중으로' : '내 교재로') + '</button></div>';
    LEARN = null;
    $('#lnMore').addEventListener('click', function () {
      if (done.remaining.length) learnStart(done.book, done.unit, done.only, { items: done.remaining, all: done.all, check: done.check });
      else if (done.check) trainStart({ mode: 'retry', book: done.book.id, unit: done.unit, ids: done.all.map(function (it) { return it.sid; }), check: done.check, chars: done.only === 'char' });
      else trainStart({ mode: 'check', book: done.book.id, unit: done.unit, chars: done.only === 'char' });
    });
    $('#lnHome').addEventListener('click', function () { render(done.only === 'char' ? 'chars' : 'books'); });
  }

  /* ── 한자 탭 + 손가락 따라쓰기 ──
     안내 글자(폰트)를 옅게 깔고 그 위를 손가락으로 긋는다. 획 좌표는 0~1로 담아 화면 크기·회전에 무관하다.
     획순 데이터(medians)가 있는 글자는 획순 모드: 안내선을 따라 한 획씩 긋고 획마다 자리·방향·순서를 판정한다.
     없는 글자는 모양 모드: 다 쓴 뒤 「확인」으로 안내 글자와의 겹침(덮음률)과 획수를 본다.
     세 번 쓰되 안내가 회차마다 옅어진다 — 마지막은 빈 칸에 기억으로 쓴다. */
  var TRACE_FONT = getComputedStyle(document.documentElement).getPropertyValue('--serif') || 'serif';
  var TRACE = null;   /* { cv, ctx, size, plan, step, cur, strokes, done, mode, peek, anim, onDone, judged } */
  var MASK_N = 64;

  /* 낱말 탭 — 한자 탭과 대칭으로 둔다. 이 앱은 한글 어휘(고유어)와 한자어를 둘 다 익히는 앱이고,
     한자는 그 가운데 손으로 쓰는 부분이다. 낱말이 한 겹 안쪽(단어장 → 단원 펼치기)에만 있으면 한자 앱처럼 읽힌다. */
  function renderWords() {
    var el = $('#view-words');
    var bid = curBookId(), book = bid ? bookOf(bid) : null;
    if (!book) { el.innerHTML = '<div class="card"><p class="muted" style="margin:0">단어장을 먼저 골라 주세요.</p></div>'; return; }
    var nh = book.words.filter(function (w) { return w.type === 'hanja'; }).length;
    var nn = book.words.length - nh;
    var html = '<h2 class="sec" style="margin-top:6px">낱말 익히기 <small>' + esc(book.title) + '</small></h2>' +
      '<p class="muted" style="margin:-4px 0 10px;font-size:.8rem">한자어 ' + nh + ' · 고유어 ' + nn + ' — 교재로 공부한 단원은 「단원 시험」으로 바로 확인해요.</p>';
    var units = unitsOf(book), any = false;
    units.forEach(function (u) {
      var ws = itemsOf(book, u.id).filter(function (i) { return i.kind === 'word'; });
      if (!ws.length) return;
      any = true;
      var p = progressOf(ws), fresh = ws.filter(function (i) { return !stateOf(i); }), uck = lastCheck(book.id, u.id);
      html += '<div class="card tight"><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><b style="color:var(--ink-strong)">' + esc(u.title) + '</b>' +
        '<span class="muted" style="font-size:.76rem">낱말 ' + ws.length + '</span>' +
        (db.settings.unit === u.id ? '<span class="chip t-a">현재</span>' : '') + '</div>' +
        '<div class="bar stack"><i class="g" style="width:' + pct(p.graduated, p.total) + '%"></i><i style="width:' + pct(p.planted - p.graduated, p.total) + '%"></i></div>' +
        '<p class="muted" style="margin:0 0 8px;font-size:.76rem">배우는 중 ' + p.planted + ' / ' + p.total + ' · 장기 기억 ' + p.graduated + (p.due ? ' · 복습 ' + p.due : '') + '</p>' +
        '<div class="row" style="margin-bottom:8px">' +
        '<button class="btn primary small" data-wcheck="' + esc(u.id) + '">단원 시험</button>' +
        (fresh.length ? '<button class="btn small" data-wlearn="' + esc(u.id) + '">낱말 학습 (' + Math.min(fresh.length, LEARN_MAX) + ')</button>' : '') +
        (p.planted ? '<button class="btn small" data-wtrain="' + esc(u.id) + '">배운 것 복습</button>' : '') +
        (unitChars(book, u.id).length ? '<button class="btn blue small" data-wtrace="' + esc(u.id) + '">✍️ 한자</button>' : '') + '</div>' +
        (uck ? '<p class="muted" style="margin:-2px 0 8px;font-size:.74rem">' + checkLine(uck) + '</p>' : '');
      ws.forEach(function (i) {
        html += '<div class="wrow" data-wid="' + esc(i.sid) + '"><span class="dot ' + dotClass(i) + '"></span><span class="w">' + esc(i.w.word) + '</span>' +
          (i.w.hanja ? '<span class="hj">' + esc(i.w.hanja) + '</span>' : '<span class="chip t-n">고유어</span>') +
          '<span class="m">' + esc(i.w.meaning) + '</span></div>';
      });
      html += '</div>';
    });
    if (!any) html += '<div class="card"><p class="muted" style="margin:0">이 단어장에는 낱말이 없어요 — 글자만 배우는 한자 교재예요. 「한자」 탭에서 써 보세요.</p></div>';

      '<details class="card"><summary>교재·단원을 골라 시험 또는 학습하기</summary><b style="color:var(--ink-strong)">단원 시험</b>' +
      '<p class="muted" style="margin:2px 0 10px;font-size:.8rem">종이 교재로 공부한 단원을 그대로 확인해요 — 앱에서 「낱말 학습」를 하지 않은 낱말도 바로 나와요.</p>' +
      (LIB.index.length
        ? '<select class="sel" id="tmCkBook" aria-label="점검할 단어장" style="width:100%;margin-bottom:8px">' + textbookBooks().map(function (e) {

    bindReview(el);
    var ckBook = $('#tmCkBook');

    var ckGo = $('#tmCk'); if (ckGo) ckGo.addEventListener('click', function () { if (db.settings.book === book.id) trainStart({ mode: 'check', book: book.id, unit: ckSel ? ckSel.value : ckUnit.id }); });
    var d = $('#tmDue'); if (d) d.addEventListener('click', function () { trainStart({ mode: 'due' }); });
    var u = $('#tmUnit'); if (u) u.addEventListener('click', function () { trainStart({ mode: 'unit', book: book.id, unit: unit.id }); });
    var b = $('#tmBook'); if (b) b.addEventListener('click', function () { trainStart({ mode: 'book', book: book.id }); });
    var p = $('#tmPick'); if (p) p.addEventListener('click', function () { render('books'); });
  }
  function sessionDomains(session) {
    if (session.list.some(function (entry) { return entry.item.kind !== 'word'; })) return null;
    var domains = { meaning: { n: 0, right: 0 }, context: { n: 0, right: 0 }, recall: { n: 0, right: 0 } };
    session.list.forEach(function (entry) {
      var name = entry.q.kind === 'w-context' || entry.q.kind === 'w-cloze' ? 'context' : entry.q.kind === 'w-type' ? 'recall' : 'meaning';
      domains[name].n += 1; if (entry.independent) domains[name].right += 1;
    });
    return domains;
  }
  function finishCheck(session) {
    var scope = session.scope, n = session.list.length, wrongIds = session.wrong.map(function (it) { return it.sid; });
    var book = bookOf(scope.book), auxiliary = !!(scope.chars && book && trackOf(book) !== 'hanja');
    var passed = session.list.filter(function (entry) { return entry.independent; }).map(function (entry) { return entry.item.sid; });
    if (scope.mode === 'check' && !auxiliary) {
      /* 새 표본에 안 나온 오답·출제하지 못한 오답은 혼자 맞혔다고 간주하지 않는다. */
      wrongIds = pendingIds(lastCheck(scope.book, scope.unit)).filter(function (sid) { return passed.indexOf(sid) < 0; }).concat(wrongIds)
        .filter(function (sid, i, all) { return all.indexOf(sid) === i; });
      putCheck(scope.book, scope.unit, unitTitleOf(scope.book, scope.unit), n, session.right, scope.total, session.hinted, wrongIds, sessionDomains(session));
    } else if (scope.mode === 'retry') {
      var c = db.checks[scope.check];
      if (c && c.at === session.checkAt) {
        c.retry = { at: now(), total: n, right: session.right - session.hinted, wrongIds: pendingIds(c).filter(function (sid) { return passed.indexOf(sid) < 0; }).slice(0, WBBOOKCHECK.LIMITS.words) };
      }
    }
    save();
    return auxiliary;
  }
  function trainDone(el) {
    var done = TRAIN, n = done.list.length, right = done.right - done.hinted, scope = done.scope;
    var exam = scope.mode === 'check', retry = scope.mode === 'retry', auxiliary = finishCheck(done);
    var key = retry ? scope.check : checkKey(scope.book, scope.unit);
    var c = db.checks[key];
    el.innerHTML = '<div class="card wcard"><span class="chip t-a">' + (auxiliary ? '보조 한자 확인' : exam ? '단원 시험' : retry ? '오답 재확인' : '복습') + '</span>' +
      '<h2>스스로 정답 ' + right + ' / ' + n + '</h2>' +
      (sessionDomains(done) ? '<p class="muted">' + domainLine(sessionDomains(done)) + '</p>' : '') +
      '<p class="muted">' + (done.hinted ? '힌트 정답 ' + done.hinted + '개 · ' : '') + '틀림 ' + (n - done.right) + '개</p>' +
      '<p class="muted">이번에 확인한 범위 ' + n + ' / ' + scope.total + '개' + (scope.total > n ? ' · 아직 확인하지 않은 항목 ' + (scope.total - n) + '개' : '') + '</p>' +
      '<p class="muted">' + (auxiliary ? '어휘 시험 점수는 그대로 유지해요.' : retry ? '첫 시험 점수는 유지하고, 보충한 낱말의 재확인 결과를 따로 기록했어요.' : exam ? '이번 시험 결과예요. 시간을 두고 다시 기억하는지도 확인해요.' : '복습 예정 시간이 지난 항목만 기억 단계에 반영해요.') + '</p>' +
      (done.skipped ? '<p class="muted">문항을 만들지 못한 항목 ' + done.skipped + '개는 확인 범위에서 빠졌어요.</p>' : '') +
      (c && pendingIds(c).length && !auxiliary && (exam || retry) ? '<button class="btn primary big" id="tdLearn">보충할 ' + pendingIds(c).length + '개 배우기</button>' : '') +
      (done.wrong.length ? '<div class="result-list" style="text-align:left">' + done.wrong.map(function (it) { return '<button class="wrow" style="width:100%;text-align:left" data-sid="' + esc(it.sid) + '"><span class="w">' + esc(it.kind === 'word' ? it.w.word : it.c.ch) + '</span><span class="m">' + esc(it.kind === 'word' ? it.w.meaning : it.c.hun + ' ' + it.c.eum) + '</span></button>'; }).join('') + '</div>' : '') +
      '<div class="row" style="margin-top:12px"><button class="btn" id="tdAgain">' + (exam ? '단원 시험 다시 보기' : '한 번 더 확인') + '</button><button class="btn" id="tdHome">' + (done.list[0].item.kind === 'char' ? '한자 집중으로' : '학습 기록 보기') + '</button></div></div>';
    TRAIN = null;
    var learn = $('#tdLearn'); if (learn) learn.addEventListener('click', function () { reviewCheck(key); });
    $('#tdAgain').addEventListener('click', function () {
      if (retry) scope.ids = pendingIds(db.checks[key]).slice();
      trainStart(scope);
    });
    $('#tdHome').addEventListener('click', function () { render(done.list[0].item.kind === 'char' ? 'chars' : 'report'); });
    el.querySelectorAll('[data-sid]').forEach(function (b) { b.addEventListener('click', function () { var it = resolve(b.dataset.sid); if (it) it.kind === 'word' ? wordSheet(it) : charSheet(it); }); });
  }

  /* ── 기록 ── */
  function renderReport() {
    var el = $('#view-report'), t = now(), sum = WBHSRS.summary(db.states, t, function (s) { return WBHSRS.kindOf(s.id) === 'word'; });
    var cks = Object.keys(db.checks).map(function (k) { return db.checks[k]; }).filter(function (c) { return c && c.n && !checkIsChar(c); }).sort(function (a, b) { return (b.at || 0) - (a.at || 0); }).slice(0, 12);
    /* 한자 트랙 단어장(급수 배정한자)의 진도 — 기기에 받아 둔 것만 셀 수 있다(본문이 있어야 글자 목록을 안다) */
    var geup = LIB.index.map(function (e) { return bookOf(e.id); }).filter(function (b) { return b && trackOf(b) === 'hanja' && b.chars.length; })
      .map(function (b) { return { title: b.title, total: b.chars.length, planted: progressOf(itemsOf(b, null, { allChars: true })).planted, graduated: progressOf(itemsOf(b, null, { allChars: true })).graduated }; });
    el.innerHTML = '<h2 class="sec" style="margin-top:6px">교재 학습 기록</h2>' +
      (cks.length ? cks.map(function (c) {
        return '<div class="card"><b>' + esc(bookTitle(c.book)) + ' · ' + esc(c.title || c.unit) + '</b><p class="muted">' + checkLine(c) + '</p>' +
          (c.retry ? '<p class="muted">최근 오답 재확인: 스스로 정답 ' + c.retry.right + ' / ' + c.retry.total + ' · 남은 보충 ' + pendingIds(c).length + '개</p>' : '') +
          (pendingIds(c).length ? '<button class="btn primary" data-review="' + esc(checkKey(c.book, c.unit)) + '">보충할 ' + pendingIds(c).length + '개 배우기</button>' : '') + '</div>';
      }).join('') : '<div class="card"><p>아직 단원 시험 기록이 없어요.</p><button class="btn primary" id="rpBooks">내 교재에서 시작하기</button></div>') +
      '<h2 class="sec">학습과 간격 복습</h2><div class="card"><div class="nums"><div class="tn"><b>' + sum.words + '</b><span>학습한 낱말</span></div><div class="tn"><b>' + sum.due + '</b><span>오늘 복습</span></div><div class="tn"><b>' + ((db.streak && db.streak.count) || 0) + '</b><span>연속 학습일</span></div></div>' +
      '<p class="muted">학습한 수는 맞힘 여부와 별개예요. 시험 점수는 위에서 확인해 주세요.</p></div>' +
      (geup.length ? '<details class="card"><summary>급수 진도 · 한자 학습</summary>' + geup.map(function (g) { return '<div class="kv"><span>' + esc(g.title) + '</span><b>간격 복습 완료 ' + g.graduated + ' / ' + g.total + '</b></div>'; }).join('') + '</details>' : '') +
      '<h2 class="sec">연동</h2><div class="card">' + (authed
        ? '<div class="kv"><span>학생</span><b>' + esc((AUTH.student && AUTH.student.name) || AUTH.name || code) + '</b></div><div class="kv"><span>서버 저장</span><b>' + (SYNC.authBad ? '연동 만료 — 진로독서에서 다시 연동' : SYNC.avail ? (SYNC.last ? '저장됨 ' + new Date(SYNC.last).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) : '대기 중') : '오프라인 — 이 기기에만 저장') + '</b></div>' +
          (pushSupported() ? '<div class="row" style="margin-top:10px"><button class="btn small' + (db.settings.nightPush ? '' : ' primary') + '" id="rpPush">' + (db.settings.nightPush ? '밤 9시 알림 끄기' : '🌙 밤 9시 알림 켜기') + '</button></div><p class="muted" style="font-size:.76rem;margin:6px 0 0">첫 복습이 밤 9시에 와요 — 복습할 것이 있는 날만 알려요.</p>' : '')
        : '<p class="muted" style="margin:0">체험 모드 — 이 기기에만 저장돼요. <a href="/">진로독서</a>에서 학원 QR로 연동하면 학원 단어장과 서버 저장이 열려요.</p>' +
          '<div class="row" style="margin-top:10px"><button class="btn ghost small" id="rpReset">체험 기록 지우기</button></div>') + '</div>' +
      '<p class="muted" style="font-size:.76rem">간격: 오늘 밤 → 1일 → 3일 → 7일 → 14일 → 30일 → 90일. 30일 간격을 통과하고 연속 3회 맞히면 장기 기억(졸업)으로 봐요.</p>';
    bindReview(el);

    var r = $('#rpReset'); if (r) r.addEventListener('click', function () { if (confirm('체험 기록을 모두 지울까요?')) { adopt(null); save(); renderStreak(); render('home'); } });
    var pb = $('#rpPush'); if (pb) pb.addEventListener('click', function () { if (db.settings.nightPush) disableNightPush(); else enableNightPush(); });
  }

  /* ── 밤 9시 알림 (Web Push) — 워드브레인과 같은 방식, 구독 키만 hanja:push. 페이로드 없는 푸시라 내용은 늘 같다 ── */
  function b64uToU8(s) { var b = atob(s.replace(/-/g, '+').replace(/_/g, '/')); var u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function pushSupported() { return syncOn() && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
  async function enableNightPush() {
    try {
      var k = await api('/push/key');
      if (!k.ok) { toast('서버에 알림 키가 아직 설정되지 않았어요 — 선생님께 문의!'); return; }
      var perm = await Notification.requestPermission();
      if (perm !== 'granted') { toast('알림 권한이 꺼져 있어요 — 브라우저 설정에서 허용해 주세요'); return; }
      var reg = await navigator.serviceWorker.ready;
      var sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uToU8(k.key) });
      await api('/push/subscribe', { method: 'POST', body: JSON.stringify({ subscription: sub.toJSON() }) });
      db.settings.nightPush = true; save();
      toast('복습할 것이 있는 날 밤 9시에 알려 드릴게요 🌙');
      renderReport();
    } catch (e) { toast('알림 설정에 실패했어요 — ' + (e.message || '')); }
  }
  async function disableNightPush() {
    try { var reg = await navigator.serviceWorker.ready; var sub = await reg.pushManager.getSubscription(); if (sub) await sub.unsubscribe(); await api('/push/unsubscribe', { method: 'POST', body: '{}' }); } catch (e) { /* 서버 정리는 다음 발송 때 410 으로도 된다 */ }
    db.settings.nightPush = false; save();
    toast('밤 9시 알림을 껐어요');
    renderReport();
  }

  /* ── 부팅 ── */
  async function boot() {
    renderStreak();
    render('home');
    try { var r = await fetch('/api/health', { cache: 'no-store' }); var j = await r.json(); SYNC.avail = !!(j && j.ok); SYNC.ai = !!(j && j.ai); } catch (e) { SYNC.avail = false; SYNC.ai = false; }
    if (syncOn()) {
      try {
        var res = await api('/pull');
        if (res && res.state && richness(res.state) > richness(db)) { adopt(res.state); try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} toast('서버에 저장된 기록을 불러왔어요'); renderStreak(); }
        else if (richness(db) > 0) save();
        SYNC.last = res && res.updatedAt;
      } catch (e) { /* 오프라인·만료 — 이 기기 기록으로 계속 */ }
    }
    try { await loadIndex(); } catch (e) { toast('단어장 목록을 받지 못했어요'); }
    var oldSelection = LIB.index.filter(function (e) { return e.id === db.settings.book; })[0];
    if (isCurriculum(oldSelection)) {
      if (!db.settings.curriculumBook) { db.settings.curriculumBook = db.settings.book; db.settings.curriculumUnit = db.settings.unit; }
      db.settings.book = ''; db.settings.unit = ''; save();
    }
    /* 이번 주 단원(선생님 지정) — 오늘 화면 맨 위. 지정된 단어장은 미리 받아 둔다 */
    if (syncOn()) { try { var tk = await api('/task'); LIB.task = tk && tk.task && tk.task.bookId ? Object.assign({ scope: tk.scope }, tk.task) : null; } catch (e) { /* 다음 접속 때 */ } }
    /* 선생님이 이번 주 단원을 지정했고 학생이 아직 단어장을 고른 적이 없으면 그것을 현재 단어장·단원으로 삼는다.
       안 그러면 현재 단어장이 목록 맨 앞(가장 최근에 올린 책)이 되어, 낱말·한자 탭과 「내 단어장」 카드가
       이번 주 단원과 다른 책을 가리킨다 — 연동한 첫날 학생이 보는 화면이 이 경우다. */
    if (LIB.task && !db.settings.book) {
      var taskEntry = LIB.index.filter(function (e) { return e.id === LIB.task.bookId; })[0];
      if (taskEntry && !isCurriculum(taskEntry) && taskEntry.counts.words) { db.settings.book = LIB.task.bookId; db.settings.unit = LIB.task.unitId || ''; save(); }
    }
    await loadStrokes();
    await fetchDueBooks();
    if (LIB.task && !bookOf(LIB.task.bookId)) { try { await openBook(LIB.task.bookId); } catch (e) { /* 캐시 없음 */ } }
    var bid = curBookId();
    if (bid) { try { var b = await openBook(bid); if (b) { var u = selectUnit(b, db.settings.unit); if (u) BOOKS_UI.open[checkKey(b.id, u.id)] = true; } } catch (e) { /* 캐시 없음 — 내 교재에서 다시 */ } }
    render(curView);
    refreshPendingMnemos();
    if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('./sw.js'); } catch (e) {} }
  }
