<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>워크벤치 계정</title>
<style>
:root{--bg:#F3F5F8;--panel:#fff;--ink:#141A24;--muted:#566175;--line:#DCE1E8;--accent:#2E4FC7;--danger:#B3261E;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0F141B;--panel:#171E28;--ink:#E6EAF0;--muted:#9AA5B5;--line:#263040;--accent:#6385EE;--danger:#F0928B;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 'Malgun Gothic',sans-serif}main{max-width:620px;margin:48px auto;padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:10px}h1{font-size:22px}h2{font-size:17px;margin-top:28px}label{display:block;margin:16px 0 4px}input,button,textarea{font:inherit;max-width:100%}input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink)}button,.action{display:inline-block;margin:16px 8px 0 0;padding:10px 16px;border:0;border-radius:5px;background:var(--accent);color:#fff;cursor:pointer;text-decoration:none}button:disabled{opacity:.5}a{color:var(--accent)}p{color:var(--muted)}[hidden]{display:none!important}#message{color:var(--danger);white-space:pre-wrap}li{margin-bottom:12px}textarea{min-height:90px}section{border-top:1px solid var(--line);margin-top:24px}@media(max-width:640px){main{margin:16px;border-radius:6px;padding:20px}}
</style><main><h1>원장용 워크벤치</h1><p id="intro">관리자 계정으로 로그인하세요.</p><p id="message" role="status" aria-live="polite"></p>
<form id="login"><label for="username">아이디</label><input id="username" autocomplete="username" required maxlength="40"><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required maxlength="128"><button>로그인</button></form>
<div id="account" hidden><p id="who"></p><a id="open" class="action" href="/workbench/">상담 워크벤치 열기</a><button id="logout">로그아웃</button>
<section><h2 id="changeTitle">비밀번호 변경</h2><p id="changeHint">새 비밀번호는 기존과 다르게 12~128자로 정해 주세요.</p><form id="change"><label for="current">현재 비밀번호</label><input id="current" type="password" autocomplete="current-password" required maxlength="128"><label for="next">새 비밀번호</label><input id="next" type="password" autocomplete="new-password" required minlength="12" maxlength="128"><label for="confirm">새 비밀번호 확인</label><input id="confirm" type="password" autocomplete="new-password" required minlength="12" maxlength="128"><button>비밀번호 변경</button></form></section>
<section id="integrations" hidden><h2>API · MCP 연결</h2><p>API: <code>/api</code> · MCP: <code>/mcp</code><br>연결 키는 발급한 관리자의 상담 자료 조회·수정 권한으로 작동하며 30일 후 만료됩니다. 비밀번호를 바꾸면 기존 연결 키도 해제됩니다.</p><form id="newToken"><label for="tokenName">연결 이름</label><input id="tokenName" placeholder="예: 원장 개인 도구" required maxlength="60"><button>연결 키 발급</button></form><div id="tokenOnce" hidden><p>이 키는 지금 한 번만 표시됩니다. 채팅에 보내지 말고 개인 도구의 환경변수에 등록하세요.</p><textarea id="tokenValue" readonly aria-label="새 API 연결 키"></textarea><button id="copy">키 복사</button></div><ul id="tokens"></ul><a href="/api/openapi.json">API 명세 보기</a><h2>관리자</h2><ul id="users"></ul></section>
</div></main><script>
let csrf;
const $=id=>document.getElementById(id),message=text=>{$('message').textContent=text};
async function api(path,method='GET',body){const res=await fetch(path,{method,headers:{'Content-Type':'application/json',...(csrf?{'X-CSRF-Token':csrf}:{})},body:body?JSON.stringify(body):undefined});const data=await res.json();if(!res.ok)throw Error(data.error||'요청을 처리하지 못했습니다.');return data}
async function refresh(){try{const me=await api('/api/auth/me');csrf=me.csrf;$('login').hidden=true;$('account').hidden=false;$('who').textContent=me.user.name+' · '+me.user.username+' · 관리자';$('intro').textContent=me.user.mustChangePassword?'처음 접속하셨습니다. 임시 비밀번호를 변경해야 상담 자료를 열 수 있습니다.':'두 관리자 계정은 같은 상담 자료와 권한을 사용합니다.';$('open').hidden=me.user.mustChangePassword;$('integrations').hidden=me.user.mustChangePassword;if(!me.user.mustChangePassword){await tokenList();const users=await api('/api/admin/users');$('users').replaceChildren(...users.items.map(u=>{const li=document.createElement('li');li.textContent=u.name+' ('+u.username+') · 관리자';return li}))}}catch(error){$('login').hidden=false;$('account').hidden=true;if(location.pathname!='/login')history.replaceState(null,'','/login')}}
$('login').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;message('');try{const result=await api('/api/auth/login','POST',{username:$('username').value,password:$('password').value});$('password').value='';csrf=result.csrf;history.replaceState(null,'','/account');await refresh();if(!result.user.mustChangePassword)location.href='/workbench/'}catch(error){message(error.message)}finally{button.disabled=false}};
$('change').onsubmit=async e=>{e.preventDefault();if($('next').value!==$('confirm').value)return message('새 비밀번호 확인이 일치하지 않습니다.');const button=e.target.querySelector('button');button.disabled=true;try{const result=await api('/api/auth/password','POST',{currentPassword:$('current').value,nextPassword:$('next').value});csrf=result.csrf;e.target.reset();$('tokenValue').value='';$('tokenOnce').hidden=true;message('비밀번호를 변경했습니다. 상담 워크벤치를 열어 주세요.');await refresh()}catch(error){message(error.message)}finally{button.disabled=false}};
$('logout').onclick=async()=>{try{await api('/api/auth/logout','POST');location.href='/login'}catch(error){message(error.message)}};
async function tokenList(){const result=await api('/api/account/tokens');$('tokens').replaceChildren(...result.items.map(t=>{const li=document.createElement('li');li.append(document.createTextNode(t.name+' · '+new Date(t.expires).toLocaleDateString('ko-KR')+' 만료 '));const b=document.createElement('button');b.textContent='해제';b.onclick=async()=>{try{await api('/api/account/tokens/'+encodeURIComponent(t.id),'DELETE');await tokenList()}catch(error){message(error.message)}};li.append(b);return li}))}
$('newToken').onsubmit=async e=>{e.preventDefault();try{const result=await api('/api/account/tokens','POST',{name:$('tokenName').value});$('tokenValue').value=result.token;$('tokenOnce').hidden=false;await tokenList()}catch(error){message(error.message)}};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('tokenValue').value);message('연결 키를 복사했습니다.')}catch{message('위 입력란에서 직접 복사하세요.')}};
refresh();
</script></html>
