<title>WB 컨설팅 워크벤치</title>
<style>
:root{
  --bg:#F6F7F4; --panel:#FFFFFF; --ink:#1C2B2A; --ink2:#5A6B68; --line:#E2E6E1;
  --accent:#0F6B5C; --accent-soft:#E3F0EC; --accent-ink:#0A4A40;
  --ok:#2E7D32; --warn:#B26A00; --danger:#B3261E; --warn-soft:#FFF4E0; --danger-soft:#FBEAE9; --ok-soft:#E8F3E8;
  --chip:#EEF1ED; --shadow:0 1px 3px rgba(28,43,42,.08);
  --tk2bg:#F4E1EE; --tk2ink:#A03A80; --tk3bg:#E9E3F7; --tk3ink:#5B44A8;
}
:root:not([data-theme="light"]) { }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141917; --panel:#1D2422; --ink:#E8ECE9; --ink2:#9DABA6; --line:#2C3532;
    --accent:#4CC2A9; --accent-soft:#1E332E; --accent-ink:#8FE0CE;
    --ok:#7BC67E; --warn:#E0A94F; --danger:#E58E88; --warn-soft:#332A18; --danger-soft:#33201E; --ok-soft:#1E2E1F;
    --chip:#273029; --shadow:0 1px 3px rgba(0,0,0,.4);
    --tk2bg:#332030; --tk2ink:#D98CC0; --tk3bg:#282442; --tk3ink:#A794E0;
  }
}
:root[data-theme="dark"]{
  --bg:#141917; --panel:#1D2422; --ink:#E8ECE9; --ink2:#9DABA6; --line:#2C3532;
  --accent:#4CC2A9; --accent-soft:#1E332E; --accent-ink:#8FE0CE;
  --ok:#7BC67E; --warn:#E0A94F; --danger:#E58E88; --warn-soft:#332A18; --danger-soft:#33201E; --ok-soft:#1E2E1F;
  --chip:#273029; --shadow:0 1px 3px rgba(0,0,0,.4);
  --tk2bg:#332030; --tk2ink:#D98CC0; --tk3bg:#282442; --tk3ink:#A794E0;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-size:14px;line-height:1.55;}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
textarea{resize:vertical;min-height:90px;line-height:1.6}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
h1,h2,h3,h4{margin:0;line-height:1.3;text-wrap:balance}
.app{display:flex;min-height:100vh}
/* ── 사이드바 ── */
.side{width:230px;flex-shrink:0;border-right:1px solid var(--line);background:var(--panel);padding:14px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:8px;padding:4px 8px 14px;cursor:pointer}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:-.5px}
.brand b{font-size:15px;letter-spacing:-.3px}
.brand small{display:block;color:var(--ink2);font-weight:400;font-size:11px}
.navbtn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 10px;border-radius:8px;color:var(--ink2);font-weight:600}
.navbtn:hover{background:var(--chip)}
.navbtn.on{background:var(--accent-soft);color:var(--accent-ink)}
.side .grp{margin-top:10px;padding:6px 10px 2px;font-size:11px;font-weight:700;color:var(--ink2);letter-spacing:.08em}
.stubtn{display:flex;align-items:center;gap:8px;width:100%;padding:6px 10px;border-radius:8px;color:var(--ink)}
.stubtn:hover{background:var(--chip)}
.stubtn.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.stubtn .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.stubtn .cnt{margin-left:auto;font-size:11px;color:var(--ink2)}
.side .foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
/* ── 본문 ── */
.main{flex:1;min-width:0;padding:22px 26px 60px;max-width:1060px}
.crumb{color:var(--ink2);font-size:12px;margin-bottom:4px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.pagehead h1{font-size:22px;letter-spacing:-.4px}
.pagehead .sub{color:var(--ink2);margin-top:3px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-weight:600;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow)}
a.btn{text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 10px;font-size:12.5px;box-shadow:none}
.btn.ghost{border-color:transparent;box-shadow:none;color:var(--ink2)}
.btn.ghost:hover{color:var(--danger)}
/* 카드/그리드 */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}
.grid.cols3{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.grid.cols2{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--chip);border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;color:var(--ink2)}
.chip.acc{background:var(--accent-soft);color:var(--accent-ink)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.danger{background:var(--danger-soft);color:var(--danger)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.sec{margin-top:26px}
.sec>h2{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec>h2 .n{color:var(--ink2);font-weight:500;font-size:13px}
/* 학생 카드 */
.stucard{cursor:pointer;transition:border-color .15s}
.stucard:hover{border-color:var(--accent)}
.stucard h3{font-size:15px;display:flex;align-items:center;gap:7px}
/* ── 입시 검색 A안 (디렉터리) ── */
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:10px}
.ucard{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px;cursor:pointer;text-align:left;font-family:inherit;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.ucard:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.ucard .utop{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.uinit{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13.5px;flex:none}
.ucard .uname{font-size:14.5px;font-weight:700}
.ucard .ureg{font-size:11px;color:var(--ink2)}
.ucard .umeta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2)}
.ucard .urange{font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.mrow{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:7px;overflow:hidden}
.mbtn{display:flex;width:100%;align-items:center;gap:9px;padding:10px 13px;background:none;border:0;font:inherit;cursor:pointer;text-align:left;color:var(--ink)}
.mbtn .mname{font-weight:600;font-size:13.5px;flex:1;min-width:0}
.mbtn .mcut{font-weight:600;color:var(--accent);font-size:13.5px;flex:none;font-variant-numeric:tabular-nums}
.mbtn .marr{color:var(--ink2);flex:none;transition:transform .15s;font-size:11px}
.mrow.open .marr{transform:rotate(90deg)}
.mtrend{display:none;border-top:1px dashed var(--line);padding:11px 13px;gap:7px;flex-wrap:wrap;align-items:center}
.mrow.open .mtrend{display:flex}
.ycell{flex:1;min-width:70px;max-width:110px;background:var(--chip);border-radius:8px;padding:6px 8px;text-align:center}
.ycell .yy{font-size:10px;color:var(--ink2);letter-spacing:.05em;font-variant-numeric:tabular-nums}
.ycell .yc{font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums}
.ycell .yd{font-size:10px;font-weight:600}
.yd.up{color:var(--danger)}.yd.dn{color:var(--ok)}.yd.fl{color:var(--ink2)}
.tchip{font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 7px;flex:none;white-space:nowrap}
.tchip.tk0{background:var(--accent-soft);color:var(--accent-ink)}
.tchip.tk1{background:var(--warn-soft);color:var(--warn)}
.tchip.tk2{background:var(--tk2bg,#F4E1EE);color:var(--tk2ink,#A03A80)}
.tchip.tk3{background:var(--tk3bg,#E9E3F7);color:var(--tk3ink,#5B44A8)}
/* ── 진학 분석 C안 (상담 보드) ── */
.bfilters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.fchip{border:1.5px solid var(--line);background:var(--panel);color:var(--ink2);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.fchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.bsummary{background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:10px;color:var(--accent-ink)}
.bpins{border:1.5px dashed var(--line);border-radius:10px;padding:8px 12px;font-size:12.5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.bpin{background:var(--accent-soft);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--accent-ink);display:inline-flex;gap:5px;align-items:center}
.bpin button{border:0;background:none;cursor:pointer;color:var(--accent-ink);padding:0;font-size:12px;line-height:1}
.bcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:10px;align-items:start}
.bcol{background:var(--chip);border-radius:11px;padding:8px}
.bcol h4{font-size:12px;font-weight:700;padding:2px 5px 7px;display:flex;justify-content:space-between}
.bcol .bcnt{color:var(--ink2);font-weight:600;font-variant-numeric:tabular-nums}
.bcol.k0 h4{color:var(--ok)}.bcol.k1 h4{color:var(--accent-ink)}.bcol.k2 h4{color:var(--warn)}.bcol.k3 h4{color:var(--danger)}
.kcard{background:var(--panel);border-radius:9px;border:1px solid var(--line);border-left:3.5px solid transparent;padding:8px 10px;margin-bottom:7px;position:relative}
.bcol.k0 .kcard{border-left-color:var(--ok)}.bcol.k1 .kcard{border-left-color:var(--accent)}
.bcol.k2 .kcard{border-left-color:var(--warn)}.bcol.k3 .kcard{border-left-color:var(--danger)}
.kcard .ku{font-size:10.5px;color:var(--ink2);font-weight:600}
.kcard .km{font-weight:700;font-size:12.5px;padding-right:20px;line-height:1.35}
.kcard .kb{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:4px;font-size:11px;color:var(--ink2)}
.kcard .kb>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.kcard .kcut{font-weight:600;font-size:12.5px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.kstar{position:absolute;top:5px;right:6px;border:0;background:none;cursor:pointer;font-size:14px;color:var(--line);padding:2px;line-height:1}
.kstar.on{color:#DBA60F}
.bmore{font-size:11px;color:var(--ink2);text-align:center;padding:3px 0 1px}
/* ── B안 지형(등급 맵) ── */
.terrain{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:6px 4px;margin-bottom:10px}
.tlegend{display:flex;gap:12px;font-size:11px;color:var(--ink2);padding:4px 12px 6px;flex-wrap:wrap}
.tlegend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
/* ── 모의지원 ── */
.gapbar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;flex:1;min-width:80px;position:relative}
.gapbar i{position:absolute;top:0;bottom:0;border-radius:99px}
.mockrow{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:9px;background:var(--panel)}
.mockrow .mrtop{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.mockrow .mrgap{display:flex;align-items:center;gap:10px;margin:8px 0 2px;font-size:12.5px}
.mockrow .fix{font-size:12.5px;color:var(--ink2);margin-top:7px;padding-top:7px;border-top:1px dashed var(--line)}
.mocksel{display:flex;width:100%;align-items:center;gap:8px;padding:9px 12px;background:var(--panel);border:1px solid var(--line);border-radius:9px;margin-bottom:6px;cursor:pointer;font:inherit;text-align:left;color:var(--ink)}
.mocksel:hover{border-color:var(--accent)}
.mocksel .cnt{margin-left:auto;font-size:11.5px;color:var(--ink2);white-space:nowrap}
.stucard .meta{color:var(--ink2);font-size:12.5px;margin:6px 0 10px;min-height:2.6em}
.stucard .chips{display:flex;flex-wrap:wrap;gap:5px}
/* 마감 스트립 */
.duer{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line)}
.duer:last-child{border-bottom:none}
.duer .dd{font-variant-numeric:tabular-nums;font-weight:800;width:52px;text-align:center;border-radius:8px;padding:3px 0;font-size:12.5px}
.duer .who{font-weight:700;width:70px}
.duer .what{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.duer .st{font-size:11.5px}
/* 탭 */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tab{padding:9px 14px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--accent-ink);border-bottom-color:var(--accent)}
/* 폼 */
.frow{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;align-items:center;margin-bottom:8px}
.frow label{font-size:12.5px;font-weight:600;color:var(--ink2)}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
@media(max-width:760px){.formgrid{grid-template-columns:1fr}.main{padding:16px}.side{width:64px}.side .txt,.side .grp,.brand small,.brand b{display:none}}
/* 생기부 에디터 */
.charbar{height:5px;border-radius:3px;background:var(--chip);overflow:hidden;margin-top:6px}
.charbar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.charbar.over i{background:var(--danger)}
.cntline{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-top:4px;font-variant-numeric:tabular-nums}
.flag{background:var(--danger-soft);color:var(--danger);border-radius:6px;padding:2px 7px;font-size:12px;font-weight:600;display:inline-block;margin:2px 4px 2px 0}
.guide3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
@media(max-width:860px){.guide3{grid-template-columns:1fr}}
.guide3 .g{background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.guide3 .g b{display:block;font-size:12px;color:var(--accent-ink);margin-bottom:3px}
.guide3 .g span{font-size:12px;color:var(--ink2)}
/* 체크리스트 */
.ck{display:flex;align-items:flex-start;gap:8px;padding:5px 0;cursor:pointer}
.ck input{width:auto;margin-top:3px}
.ck.done span{color:var(--ink2);text-decoration:line-through}
/* 수행평가 */
.statuses{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.stpill{padding:4px 12px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--chip);color:var(--ink2)}
.taskrow{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.taskrow:hover{background:var(--chip)}
.taskrow .subj{font-weight:700;width:84px;flex-shrink:0}
.taskrow .top{flex:1;min-width:0}
.taskrow .due{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--ink2);width:88px;text-align:right}
/* 기록 타임라인 */
.rec{border-left:2px solid var(--line);padding:2px 0 14px 14px;margin-left:6px;position:relative}
.rec::before{content:"";position:absolute;left:-5px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.rec .rh{display:flex;gap:8px;align-items:baseline}
.rec .rh b{font-size:13.5px}
.rec .rh time{color:var(--ink2);font-size:12px;font-variant-numeric:tabular-nums}
.rec dl{margin:6px 0 0;display:grid;grid-template-columns:78px 1fr;gap:3px 10px;font-size:13px}
.rec dt{color:var(--ink2);font-weight:600}
.rec dd{margin:0;white-space:pre-wrap}
/* 노하우 */
.kh{border-left:3px solid var(--accent);padding:2px 0 2px 14px;margin-bottom:18px}
.kh h3{font-size:14px;margin-bottom:6px}
.kh p,.kh ul{margin:4px 0;color:var(--ink);font-size:13.5px}
.kh ul{padding-left:18px}
.kh .src{font-size:11.5px;color:var(--ink2)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;color:var(--ink2);font-weight:600;font-size:12px;border-bottom:1px solid var(--line);padding:5px 8px}
table.t td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
.tablewrap{overflow-x:auto}
/* 마크다운 뷰 */
.mdv{font-size:13.5px}
.mdv h1{font-size:17px;margin:14px 0 6px}.mdv h2{font-size:15px;margin:14px 0 6px}.mdv h3{font-size:13.5px;margin:10px 0 4px}
.mdv table{width:100%;border-collapse:collapse;margin:8px 0}
.mdv th,.mdv td{border:1px solid var(--line);padding:4px 8px;text-align:left;font-size:12.5px}
.mdv th{background:var(--chip)}
.mdv ul{padding-left:20px;margin:4px 0}
.mdv code{background:var(--chip);border-radius:4px;padding:1px 5px;font-size:12px}
.empty{color:var(--ink2);text-align:center;padding:34px 10px}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
/* 토스트/모달 */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99}
#toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(10,16,15,.45);display:none;place-items:center;z-index:50;padding:20px}
.modal.open{display:grid}
.modal .box{background:var(--panel);border-radius:14px;padding:20px;width:min(560px,100%);max-height:88vh;overflow-y:auto}
.modal .box h2{font-size:16px;margin-bottom:14px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
details.acc2{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;background:var(--panel)}
details.acc2 summary{cursor:pointer;font-weight:700;font-size:13.5px}
details.acc2[open]{padding-bottom:14px}
/* 월간 캘린더 */
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calhead{text-align:center;font-size:11px;font-weight:700;color:var(--ink2);padding:4px 0}
.calcell{min-height:76px;border:1px solid var(--line);border-radius:8px;padding:4px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.calcell.pad{border:none}
.calcell.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.calcell .dnum{font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums}
.calev{font-size:10.5px;text-align:left;border-radius:5px;padding:1px 5px;background:var(--accent-soft);color:var(--accent-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border:none}
.calev.warn{background:var(--warn-soft);color:var(--warn)}
.calev.danger{background:var(--danger-soft);color:var(--danger)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <nav class="side" id="side"></nav>
  <main class="main" id="main"></main>
</div>
<div id="toast" role="status"></div>
<div class="modal" id="modal"><div class="box" id="modalbox"></div></div>

<script>
/* ═══════════ WB 컨설팅 워크벤치 ═══════════
   데이터는 이 브라우저의 localStorage에만 저장된다.
   학생 데이터 시드는 별도 JSON 가져오기로 주입한다. */

    g.ys=Object.keys(g.years).sort();
    g.latestYear=g.ys[g.ys.length-1]||"";g.latest=g.ys.length?g.years[g.latestYear]:null;

/* ── 미니 마크다운 렌더러 (프로파일 원문 표시용) ── */
function md(src){
  if(!src)return"";
  const lines=String(src).split(/\r?\n/);let out="",inUl=false,inTable=false;
  const inline=t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`(.+?)`/g,"<code>$1</code>");
  for(let i=0;i<lines.length;i++){const L=lines[i];
    if(/^\|.*\|/.test(L)){ if(/^\|[\s:|-]+\|$/.test(L))continue;
      const cells=L.split("|").slice(1,-1).map(c=>c.trim());
      if(!inTable){out+="<table>";inTable=true;out+="<tr>"+cells.map(c=>"<th>"+inline(c)+"</th>").join("")+"</tr>";}
      else out+="<tr>"+cells.map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>";
      continue;}
    if(inTable){out+="</table>";inTable=false;}
    if(/^[-*] /.test(L)){if(!inUl){out+="<ul>";inUl=true;}out+="<li>"+inline(L.slice(2))+"</li>";continue;}
    if(inUl){out+="</ul>";inUl=false;}
    const h=L.match(/^(#{1,3}) (.*)/);
    if(h){out+=`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`;continue;}
    if(L.trim()==="")continue;
    out+="<p>"+inline(L)+"</p>";}
  if(inUl)out+="</ul>";if(inTable)out+="</table>";
  return out;}

  if(window.claude&&window.claude.downloads){try{await window.claude.downloads.save({filename:name,data});toast(name+" 저장");return;}catch(e){if(e&&e.code==="user_denied")return;}}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"text/plain"}));a.download=name;a.click();}
function dday(d){if(!d)return null;const diff=Math.ceil((new Date(d)-new Date(today()))/864e5);return diff;}
function ddayChip(d){const n=dday(d);if(n===null)return"";
  const cls=n<0?"danger":n<=3?"danger":n<=7?"warn":"ok";
  return `<span class="dd chip ${cls}">${n<0?"지남":n===0?"D-DAY":"D-"+n}</span>`;}

/* ── 정기 상담 주기 계산 ── */
const DAYS=["일","월","화","수","목","금","토"];
function nthWeekday(y,m,week,dayIdx){ // m: 0-based, week: 1~4
  const first=new Date(y,m,1);
  const d=1+((dayIdx-first.getDay()+7)%7)+(week-1)*7;
  const dt=new Date(y,m,d);
  return dt.getMonth()===m?dt:null;}
function fmtDate(dt){const p=n=>String(n).padStart(2,"0");return `${dt.getFullYear()}-${p(dt.getMonth()+1)}-${p(dt.getDate())}`;}
function nextConsult(s){
  const c=s.consult||{};
  if(c.nextOverride)return c.nextOverride;
  if(c.week==null||c.week===""||c.day==null||c.day==="")return null;
  const now=new Date(today());
  for(let k=0;k<3;k++){
    const dt=nthWeekday(now.getFullYear(),now.getMonth()+k,+c.week,+c.day);
    if(dt&&dt>=now)return fmtDate(dt);}
  return null;}
function lastRecordDate(s){const rs=(s.records||[]).map(r=>r.date).filter(Boolean).sort();return rs[rs.length-1]||null;}
function overdueDays(s){const d=lastRecordDate(s);if(!d)return null;return Math.floor((new Date(today())-new Date(d))/864e5);}
function odChip(s){const od=overdueDays(s);
  if(od===null)return `<span class="chip danger">상담 기록 없음</span>`;
  if(od>40)return `<span class="chip danger">마지막 상담 ${od}일 전</span>`;
  return `<span class="chip">마지막 상담 ${od}일 전</span>`;}
function focusList(){
  return db.students.map(s=>{
    const reasons=[];let score=0;
    const od=overdueDays(s);
    if(od===null){score+=3;reasons.push(["상담 기록 없음","danger"]);}
    else if(od>40){score+=3;reasons.push([`상담 ${od}일 경과`,"danger"]);}
    if(!nextConsult(s)){score+=1;reasons.push(["주기 미등록","warn"]);}
    const urgent=(s.tasks||[]).filter(t=>t.status!=="제출완료"&&t.due&&dday(t.due)!==null&&dday(t.due)>=0&&dday(t.due)<=7);
    if(urgent.length){score+=2*Math.min(urgent.length,2);reasons.push([`수행 마감 ${urgent.length}건`,"warn"]);}
    const ex=(s.exams||[]).filter(e=>e.date&&dday(e.date)!==null&&dday(e.date)>=0&&dday(e.date)<=14)
      .sort((a,b)=>a.date<b.date?-1:1);
    if(ex.length){score+=3;reasons.push([`${ex[0].name} D-${dday(ex[0].date)}`,"danger"]);}
    const cd=s.consult&&s.consult.contractEnd?dday(s.consult.contractEnd):null;
    if(cd!==null&&cd>=0&&cd<=60){score+=2;reasons.push([`계약 D-${cd}`,"warn"]);}
    return {s,score,reasons};
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,5);}

/* 고교 보정: 학교명으로 고교 DB 대조 → 내신 난이도 보정치 */
function hsAdjOf(name){
  if(!name)return {adj:0,why:"학교 미입력 — 보정 없음"};
  const n1=name.trim(),n2=n1.replace(/여고$/,"여자고등학교").replace(/([^자])고$/,"$1고등학교");
  const row=allHsRows().find(h=>h.name===n1||h.name===n2||h.name.includes(n1)||n1.includes(h.name.replace(/고등학교$/,"고")));
  if(!row)return {adj:0,why:"고교 DB에 없음 — 보정 없음"};
  let adj=0,parts=[];
  const ty=row.type||"";
  if(ty.includes("자사")||ty.includes("자율")){adj+=0.5;parts.push("자율·자사 +0.5");}
  else if(ty.includes("특목")||ty.includes("외고")||ty.includes("과학")||ty.includes("국제")){adj+=1.0;parts.push("특목 +1.0");}
  else if(ty.includes("특성화")){adj-=0.5;parts.push("특성화 −0.5");}
  if(row.level==="상"){adj+=0.4;parts.push("내신경쟁 상 +0.4");}
  else if(row.level==="하"){adj-=0.3;parts.push("내신경쟁 하 −0.3");}
  return {adj,why:`${row.name}(${ty||"유형 미상"}${row.level?"·경쟁 "+row.level:""}) — ${parts.join(", ")||"보정 0"}`};}
function trajHtml(s){
  const p=parseFloat(s.baseMsPct),iq=parseFloat(s.baseFsiq);
  const log=(s.gpaLog||[]);
  if(isNaN(p)&&isNaN(iq)&&!log.length)
    return `<div class="empty" style="padding:14px"><b>기준선이 없습니다</b>중3 상위% 또는 FSIQ를 넣으면 예측 밴드가, 내신 평균을 기록하면 실제선이 그려집니다.</div>`;
  const ha=hsAdjOf(s.school);
  let msBand=null,iqBand=null;
  if(!isNaN(p)&&p>0&&p<=100){
    const g1=topPctToGrade(p),g2=topPctToGrade(Math.min(100,p*2));
    msBand=[Math.max(1,Math.min(9,g1+ha.adj)),Math.max(1,Math.min(9,g2+ha.adj))];}
  if(!isNaN(iq)&&iq>=40&&iq<=160){
    const z=(iq-100)/15,pT=(1-normCdf(z))*100,pA=(1-normCdf(0.6*z))*100;
    const b1=topPctToGrade(Math.max(0.1,pT)),b2=topPctToGrade(Math.min(100,pA));
    iqBand=[Math.min(b1,b2),Math.max(b1,b2)];}
  // 차트
  const terms=["중3",...log.map(g=>g.term)];
  const W=680,H=210,PL=34,PR=14,PT=14,PB=26;
  const gmax=Math.min(9,Math.max(5,...log.map(g=>g.avg+1),msBand?msBand[1]+0.5:0,iqBand?iqBand[1]+0.5:0));
  const y=g=>PT+(Math.min(gmax,Math.max(1,g))-1)/(gmax-1)*(H-PT-PB);
  const x=i=>PL+(terms.length<2?(W-PL-PR)/2:i/(terms.length-1)*(W-PL-PR));
  let grid="";
  for(let g=1;g<=gmax;g++)grid+=`<line x1="${PL}" y1="${y(g)}" x2="${W-PR}" y2="${y(g)}" stroke="var(--line)" stroke-width="1"/>
    <text x="${PL-6}" y="${y(g)+3.5}" text-anchor="end" style="fill:var(--ink2)" font-size="10">${g}</text>`;
  const band=(b,color,label,left)=>b?`<rect x="${PL}" y="${y(b[0])}" width="${W-PL-PR}" height="${Math.max(3,y(b[1])-y(b[0]))}" fill="${color}" opacity="0.14"/>
    <text x="${left?PL+5:W-PR-4}" y="${y(b[left?0:1])+(left?11:-4)}" text-anchor="${left?"start":"end"}" style="fill:${color}" font-size="10" font-weight="700">${label} ${b[0].toFixed(1)}~${b[1].toFixed(1)}</text>`:"";
  const pts=log.map((g,i)=>({cx:x(i+1),cy:y(g.avg),g}));
  const line=pts.length?`<polyline points="${pts.map(pt=>pt.cx+","+pt.cy).join(" ")}" fill="none" stroke="var(--ink)" stroke-width="2"/>`:"";
  const dots=pts.map(pt=>`<circle cx="${pt.cx}" cy="${pt.cy}" r="4" fill="var(--ink)"><title>${esc(pt.g.term)} ${pt.g.avg}</title></circle>
    <text x="${pt.cx}" y="${pt.cy-8}" text-anchor="middle" style="fill:var(--ink)" font-size="10" font-weight="600">${pt.g.avg}</text>`).join("");
  const xlabels=terms.map((t,i)=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle" style="fill:var(--ink2)" font-size="10">${esc(t)}</text>`).join("");
  // 갭 배지
  let gapLine="";
  if(log.length&&iqBand){
    const cur=log[log.length-1].avg,d=+(cur-iqBand[1]).toFixed(2);
    gapLine=d>0.2?`<span class="chip danger">잠재 대비 ${d.toFixed(1)}등급 미달 — 학습 전략이 상담 의제</span>`
      :d<-0.2?`<span class="chip ok">잠재 밴드 상단 상회 — 성취 습관이 강점</span>`
      :`<span class="chip acc">잠재 밴드 안 — 유지 + 상향 목표 정당</span>`;}
  let predLine="";
  if(log.length&&msBand){
    const cur=log[log.length-1].avg;
    predLine=cur>msBand[1]+0.2?`<span class="chip warn">중3 예측 대비 하회 — 고교 적응 점검</span>`
      :cur<msBand[0]-0.2?`<span class="chip ok">중3 예측 상회</span>`:`<span class="chip">중3 예측 범위 안</span>`;}
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="min-width:520px">
    ${grid}${band(msBand,"var(--w1,#2F6DB5)","중3 예측",true)}${band(iqBand,"var(--accent)","웩슬러 잠재",false)}${line}${dots}${xlabels}</svg></div>
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">${gapLine}${predLine}</div>
  <p style="font-size:11.5px;color:var(--ink2);margin:6px 0 0">고교 보정: ${esc(ha.why)}. 밴드는 참고치 — 예측이 아니라 상담의 출발선입니다. 등급 축은 1(위)~${gmax}(아래).</p>`;}

  if(!g.exam&&!g.score){toast("시험명 또는 점수를 입력하세요");return;}

function addCommLog(){const s=stu();s.commLogs=s.commLogs||[];

function saveRecordFile(i){const s=stu();const r=(s.records||[])[i];if(!r)return;
  const body=`날짜: ${r.date}\n학생: ${s.name} (${s.grade})\n세션 유형: ${r.type}\n주요 내용: ${r.main||"-"}\n다음 과제: ${r.next||"-"}\n다음 세션: ${r.sess||"-"}\n특이사항: ${r.etc||"-"}\n`;
  saveFile(`${r.date}_수업기록.md`,body);}
function addRecord(){const s=stu();s.records=s.records||[];
  s.records.unshift({date:$("#r_date").value,type:$("#r_type").value,main:$("#r_main").value,next:$("#r_next").value,sess:$("#r_sess").value,etc:$("#r_etc").value});
  save();toast("기록 저장");render();}

function genPlan(type){
  const s=stu();const ym=new Date().toISOString().slice(0,7);
  const carry=(s.tasks||[]).filter(t=>t.status!=="제출완료").map(t=>`- [ ] ${t.subject} ${t.topic} (마감 ${t.due||"미정"})`).join("\n")||"- (없음)";
  let c;
  if(type==="진도계획표")c=`# ${s.name} ${ym} 진도 계획표\n\n## 이번 달 목표\n- \n- \n\n## 주별 계획\n| 주차 | 기간 | 교과목 | 내용 | 과제 |\n|-----|------|--------|------|------|\n| 1주 |  |  |  |  |\n| 2주 |  |  |  |  |\n| 3주 |  |  |  |  |\n| 4주 |  |  |  |  |\n\n## 수행평가·생기부 일정\n${carry}\n\n## 전월 미완료 이월\n- [ ] `;
  else c=`# ${s.name} ${ym} 주간 플래너\n\n## 이번 달 핵심 3가지\n1. \n2. \n3. \n\n## 1주차\n- [ ] 월: \n- [ ] 화: \n- [ ] 수: \n- [ ] 목: \n- [ ] 금: \n- [ ] 주말: \n\n## 2주차\n- [ ] 월: \n- [ ] 화: \n- [ ] 수: \n- [ ] 목: \n- [ ] 금: \n- [ ] 주말: \n\n## 3주차\n- [ ] 월: \n- [ ] 화: \n- [ ] 수: \n- [ ] 목: \n- [ ] 금: \n- [ ] 주말: \n\n## 4주차\n- [ ] 월: \n- [ ] 화: \n- [ ] 수: \n- [ ] 목: \n- [ ] 금: \n- [ ] 주말: \n\n## 이번 주 수행평가 체크\n${carry}`;
  s.planners=s.planners||[];s.planners.unshift({month:ym,type,content:c});save();render();}

  $("#tabbody").innerHTML=`

    <div class="statuses">${INQ_STAGES.map(st=>{const n=list.filter(q=>q.status===st).length;return n?`<span class="stpill">${st} ${n}</span>`:""}).join("")}</div>

  ${list.length?`<div class="card">${list.map((q,i)=>`
    <div class="taskrow" onclick="view.editInq=${i};render()">
      <span class="chip ${q.status==="완성"?"ok":"acc"}">${esc(q.status)}</span>
      <span class="subj">${esc(q.subject||"")}</span>

    </div>`).join("")}</div>`
  :`<div class="card empty"><b>탐구보고서가 없습니다</b>주제선정 → Perplexity 자료조사 → 초안 → 검증 → 완성(PPT는 Gamma).<br>진로 연계 탐구가 세특의 최상급 소재입니다.</div>`}`;}

/* ═══════════ 진학 가능권 분석 (웩슬러·중학·고교 → 입결 대조) ═══════════ */

function normCdf(z){const s=z<0?-1:1;z=Math.abs(z);
  const k=1/(1+0.2316419*z);
  const d=0.3989423*Math.exp(-z*z/2);
  const p=d*k*(0.3193815+k*(-0.3565638+k*(1.7814779+k*(-1.8212560+k*1.3302744))));
  return s>0?1-p:p;}
function invNorm(p){ // 백분위/확률 → z (이분법, normCdf 역함수)
  p=Math.min(0.9999,Math.max(0.0001,p));
  let lo=-4,hi=4;
  for(let i=0;i<60;i++){const m=(lo+hi)/2;if(normCdf(m)<p)lo=m;else hi=m;}
  return (lo+hi)/2;}
const CUM9=[4,11,23,40,60,77,89,96,100]; // 9등급 누적 상위%
function topPctToGrade(p){ // 상위 p% → 9등급제 소수 등급 (1.0=상위4% 경계, 하한 1.0)
  let prev=0;
  for(let i=0;i<9;i++){
    if(p<=CUM9[i]){ return Math.max(1, Math.round((i + (p-prev)/(CUM9[i]-prev)) * 100) / 100); }
    prev=CUM9[i];
  }
  return 9;}
function classify(myG,c70,c50){ // 낮을수록 좋은 등급 기준
  const ref=(c70!=null)?c70:c50; if(ref==null)return null;
  const diff=ref-myG;
  if(diff>=0.4)return["안정","ok"];
  if(diff>=-0.2)return["적정","acc"];
  if(diff>=-0.8)return["소신","warn"];
  return["도전","danger"];}
function parseCut(v){const n=parseFloat(String(v||"").replace(/[^\d.]/g,""));return isNaN(n)?null:n;}
function gradeToTopPct(g){g=Math.max(1,Math.min(9,g));const i=Math.min(8,Math.floor(g));const prev=i===0?0:CUM9[i-1];return prev+(g-i)*(CUM9[i]-prev);}
function classifyPct(myPct,cutPct){ // 정시: 수능 백분위 기준 (높을수록 좋음)
  if(cutPct==null||isNaN(cutPct))return null;
  const d=myPct-cutPct;
  if(d>=5)return["안정","ok"];
  if(d>=-3)return["적정","acc"];
  if(d>=-10)return["소신","warn"];
  return["도전","danger"];}
const FIELD_KW={"의약·간호":["의예","치의","한의","수의","약학","간호","의학","보건","임상"],
 "교육":["교육","사범","유아","초등"],
 "공학·자연":["공학","컴퓨터","전자","전기","기계","화학","물리","수학","생명","소프트","반도체","산업","통계","데이터","건축","토목","신소재","환경","에너지","인공지능","AI","IT","정보"],
 "인문·사회":["경영","경제","행정","심리","국어","영어","사회","미디어","법","정치","사학","철학","문헌","광고","무역","회계","복지","관광","언론","국제"]};
function fieldPass(major,f){const kw=FIELD_KW[f];return !kw||kw.some(k=>major.includes(k));}
const SPECIAL_KW=["특성화고","농어촌","기초","차상위","한부모","배려","보훈","장애","특수교육대상","재외국민","만학도","성인학습자","특성화고졸","서해5도","북한이탈","다문화","목회","신학","군인","군사","계약학과"];
function isSpecialTrack(t){t=String(t||"");return SPECIAL_KW.some(k=>t.includes(k));}
/* 보드 판정: 그룹 → {cls, diffTxt} 또는 null(창 밖·비교 불가) */
function judgeGroup(g,myG,myPct){
  if(!g.isJ&&g.latest!=null&&g.latest>=1&&g.latest<=9){
    const d=g.latest-myG;
    if(d>1.2)return null;
    const c=classify(myG,g.latest,null);
    return c?{cls:c,diff:d,kind:"s"}:null;}
  if(g.isJ&&g.pct!=null){
    const d=myPct-g.pct;
    if(d>15)return null;
    const c=classifyPct(myPct,g.pct);
    return c?{cls:c,diff:d,kind:"j"}:null;}
  return null;}
function runIpsi(){
  const mode=$("#ip_mode").value;let band=null,label="";
  if(mode==="hs"){
    const raw=parseFloat($("#ip_hs").value);
    const is5=view.ipsiScale==="5";
    if(is5&&(isNaN(raw)||raw<1||raw>5)){toast("5등급제 내신 평균(1.0~5.0)을 입력하세요");return;}
    if(!is5&&(isNaN(raw)||raw<1||raw>9)){toast("내신 평균 등급(1.0~9.0)을 입력하세요");return;}
    const g=is5?g5to9(raw):raw;
    band=[g,g];
    label=is5?`5등급제 내신 ${raw.toFixed(2)} → 9등급 환산 ${g.toFixed(2)}등급 (입결 DB가 9등급 기준)`:`고교 내신 평균 ${g.toFixed(2)}등급`;
    view.ipsiMyPct=Math.round((100-gradeToTopPct(g))*10)/10;
  }else if(mode==="ms"){
    let p=parseFloat($("#ip_ms").value);
    const rank=parseFloat($("#ip_msrank").value),tot=parseFloat($("#ip_mstot").value);
    if(!isNaN(rank)&&!isNaN(tot)&&tot>0)p=rank/tot*100;
    if(isNaN(p)||p<=0||p>100){toast("상위 % 또는 등수/재적수를 입력하세요");return;}
    const g1=topPctToGrade(p),g2=topPctToGrade(Math.min(100,p*2));
    band=[g1,g2];label=`중학 상위 ${p.toFixed(1)}% → 일반고 예상 내신 ${g1.toFixed(1)}~${g2.toFixed(1)}등급`;
    view.ipsiPct=p;view.ipsiMyPct=Math.round((100-p)*10)/10;
  }else if(mode==="dy"){
    const vo=parseFloat($("#ip_dy_vo").value),an=parseFloat($("#ip_dy_an").value),re=parseFloat($("#ip_dy_re").value);
    const langs=[vo,an].filter(v=>!isNaN(v)&&v>=1&&v<=99.9);
    if(!langs.length){toast("어휘적용력·언어유추력 백분위(1~99.9)를 하나 이상 입력하세요");return;}
    const lang=langs.reduce((a,b)=>a+b,0)/langs.length;
    // 언어 요인 → 내신 잠재 밴드 (동일 백분위 상한 + 상관 0.6 보정 기대치)
    const zL=invNorm(lang/100);
    const pTop=100-lang;                          // 상위%
    const pAdj=(1-normCdf(0.6*zL))*100;
    const g1=topPctToGrade(Math.max(0.1,pTop)),g2=topPctToGrade(Math.min(100,pAdj));
    band=[Math.min(g1,g2),Math.max(g1,g2)];
    // 추리력 → 정시(수능) 백분위 잠재치 (동일 백분위와 보정치의 중앙)
    let reTxt="";
    if(!isNaN(re)&&re>=1&&re<=99.9){
      const zR=invNorm(re/100);
      const reAdj=normCdf(0.6*zR)*100;
      view.ipsiMyPct=Math.round((re+reAdj)/2*10)/10;
      reTxt=` · 추리력 ${re} → 수능 백분위 ${view.ipsiMyPct} 추정`;
    }else{
      view.ipsiMyPct=Math.round((100-gradeToTopPct((band[0]+band[1])/2))*10)/10;
    }
    label=`다요인지능 ${!isNaN(vo)?`어휘 ${vo}`:""}${!isNaN(vo)&&!isNaN(an)?"·":""}${!isNaN(an)?`유추 ${an}`:""} → 교과 잠재 밴드 ${band[0].toFixed(1)}~${band[1].toFixed(1)}등급 (상관 0.6 보정 포함)${reTxt}`;
  }else{
    const iq=parseFloat($("#ip_iq").value);
    if(isNaN(iq)||iq<40||iq>160){toast("전체지능(FSIQ)을 입력하세요 (40~160)");return;}
    const z=(iq-100)/15;
    const pTop=(1-normCdf(z))*100;            // 잠재력 상한 (동일 백분위)
    const pAdj=(1-normCdf(0.6*z))*100;         // 상관 0.6 보정 기대치
    const g1=topPctToGrade(Math.max(0.1,pTop)),g2=topPctToGrade(Math.min(100,pAdj));
    band=[Math.min(g1,g2),Math.max(g1,g2)];
    label=`FSIQ ${iq} → 백분위 상위 ${pTop.toFixed(1)}% · 잠재력 밴드 ${band[0].toFixed(1)}~${band[1].toFixed(1)}등급 (통계 보정 포함)`;
    view.ipsiMyPct=Math.round((100-(pTop+pAdj)/2)*10)/10;
  }
  view.ipsiResult={band,label,mode};render();}
/* 관심대학 핀 — 학생 선택 시 그 학생의 관심대학으로 저장, 미선택 시 세션 핀 */
function ipsiPin(key){
  const g=ipGroups().find(x=>x.key===key);if(!g)return;
  const sid=view.ipsiStu;
  if(sid){
    const s=db.students.find(x=>x.id===sid);if(!s)return;
    s.univs=s.univs||[];
    const i=s.univs.findIndex(u=>uniNorm(u.univ)===g.univ&&u.major===g.major&&(u.track||"")===g.track);
    if(i>=0){s.univs.splice(i,1);toast("관심대학에서 제거");}
    else{s.univs.push({univ:g.univ,major:g.major,track:g.track,tong:"",checked:""});toast(`${g.univ} ${g.major} → ${s.name} 관심대학`);}
    save();
  }else{
    view.ipsiPins=view.ipsiPins||[];
    const i=view.ipsiPins.indexOf(key);
    if(i>=0)view.ipsiPins.splice(i,1);else view.ipsiPins.push(key);
  }

function ipsiPinned(g){
  const sid=view.ipsiStu;
  if(sid){const s=db.students.find(x=>x.id===sid);
    return !!(s&&(s.univs||[]).some(u=>uniNorm(u.univ)===g.univ&&u.major===g.major&&(u.track||"")===g.track));}
  return (view.ipsiPins||[]).includes(g.key);}

/* B안 지형 — 창 안 수시 항목을 등급 축 위에 배치 */
function terrainSvg(list,myG){
  const byU=new Map();
  for(const it of list){if(it.j.kind!=="s")continue;
    if(!byU.has(it.g.univ))byU.set(it.g.univ,[]);byU.get(it.g.univ).push(it.g);}
  if(!byU.size)return `<p style="font-size:12px;color:var(--ink2);padding:8px 12px">지형에 올릴 수시(등급) 항목이 없습니다.</p>`;
  const lanes=[...byU.entries()].sort((a,b)=>Math.min(...a[1].map(x=>x.latest))-Math.min(...b[1].map(x=>x.latest))).slice(0,16);
  const X0=Math.max(1,myG-1.6),X1=Math.min(9,myG+1.6),W=960,PL=104,PR=16,LH=32,H=lanes.length*LH+56;
  const x=v=>PL+(Math.min(X1,Math.max(X0,v))-X0)/(X1-X0)*(W-PL-PR);

    <rect x="${x(Math.min(X1,myG+0.4))}" y="30" width="${Math.max(0,W-PR-x(Math.min(X1,myG+0.4)))}" height="${H-52}" fill="var(--ok)" opacity="0.08"/>
    <rect x="${x(Math.max(X0,myG-0.2))}" y="30" width="${Math.max(0,x(Math.min(X1,myG+0.4))-x(Math.max(X0,myG-0.2)))}" height="${H-52}" fill="var(--accent)" opacity="0.10"/>
    <rect x="${x(Math.max(X0,myG-0.8))}" y="30" width="${Math.max(0,x(Math.max(X0,myG-0.2))-x(Math.max(X0,myG-0.8)))}" height="${H-52}" fill="var(--warn)" opacity="0.10"/>
    <line x1="${x(myG)}" y1="22" x2="${x(myG)}" y2="${H-20}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="${x(myG)}" y="14" text-anchor="middle" style="fill:var(--accent)" font-size="11" font-weight="700">내 등급 ${myG.toFixed(2)}</text>`;
  let dots="";
  lanes.forEach(([u,items],li)=>{
    const y=30+li*LH+LH/2;

  });
  return `<div class="tlegend"><span><i style="background:#2F6DB5"></i>교과</span><span><i style="background:#C88A18"></i>종합</span><span><i style="background:#B0487E"></i>논술</span><span style="margin-left:auto">왼쪽일수록 높은 컷 — 점에 마우스를 올리면 상세</span></div>
  <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="min-width:760px">${grid}${bands}${dots}</svg>`;}

/* ═══════════ 고교 선택 시뮬레이터 (중3 → 후보 고교 병렬 비교) ═══════════ */
function hsSimBand(p,row){ // 중학 상위% + 고교 행 → 예상 내신 밴드
  const g1=topPctToGrade(p),g2=topPctToGrade(Math.min(100,p*2));
  let adj=0;const ty=row.type||"";
  if(ty.includes("자사")||ty.includes("자율"))adj=0.5;
  else if(ty.includes("특목")||ty.includes("외고")||ty.includes("과학")||ty.includes("국제"))adj=1.0;
  else if(ty.includes("특성화"))adj=-0.5;
  if(row.level==="상")adj+=0.4;else if(row.level==="하")adj-=0.3;
  return {band:[Math.max(1,Math.min(9,g1+adj)),Math.max(1,Math.min(9,g2+adj))],adj};}
/* 중학 절대평가 성취도(A~E, 학기별) → 상위% 추정 밴드 — 학교별 A비율 편차를 반영한 근사 */
const ACH_TERMS=["중1-1","중1-2","중2-1","중2-2","중3-1","중3-2"];
function achEstimate(){
  const a=view.hsAch||{};const map={A:5,B:4,C:3,D:2,E:1};const vals=[];
  for(const t of ACH_TERMS){const s=(a[t]||"").toUpperCase().replace(/[^A-E]/g,"");
    for(const ch of s)vals.push(map[ch]);}
  if(!vals.length)return null;
  const avg=vals.reduce((x,y)=>x+y,0)/vals.length;
  const PTS=[[5,3,18],[4.5,8,28],[4,18,40],[3.5,32,55],[3,48,70],[2.5,63,85],[2,75,92],[1,88,98]];
  let lo=PTS[0][1],hi=PTS[0][2];
  if(avg<=PTS[PTS.length-1][0]){lo=PTS[PTS.length-1][1];hi=PTS[PTS.length-1][2];}
  else for(let i=0;i<PTS.length-1;i++){const A1=PTS[i],A2=PTS[i+1];
    if(avg<=A1[0]&&avg>=A2[0]){const t=(A1[0]-avg)/(A1[0]-A2[0]);
      lo=A1[1]+(A2[1]-A1[1])*t;hi=A1[2]+(A2[2]-A1[2])*t;break;}}
  return {avg:Math.round(avg*100)/100,lo:Math.round(lo),hi:Math.round(hi),
    mid:Math.round((lo+hi)/2*10)/10,n:vals.length};}

/* 진학사식 반원 게이지 — d=여유(+)/부족(−), unit "등급"|"백분위" */
function gaugeSvg(d,unit,dTxt){
  const R=unit==="등급"?[-1.5,-0.8,-0.2,0.4,1.5]:[-15,-10,-3,5,15];
  const W=176,H=104,cx=W/2,cy=86,r=62;
  const ang=v=>{const t=(Math.min(R[4],Math.max(R[0],v))-R[0])/(R[4]-R[0]);return Math.PI*(1-t);};
  const pt=(a,rr)=>[cx+rr*Math.cos(a),cy-rr*Math.sin(a)];
  const arc=(v1,v2,color)=>{const [x1,y1]=pt(ang(v1),r),[x2,y2]=pt(ang(v2),r);
    return `<path d="M ${x1.toFixed(1)} ${y1.toFixed(1)} A ${r} ${r} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}" stroke="${color}" stroke-width="13" fill="none" opacity="0.8"/>`;};
  const na=ang(d),[nx,ny]=pt(na,r-8);
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="flex:none">
    ${arc(R[0],R[1],"var(--danger)")}${arc(R[1],R[2],"var(--warn)")}${arc(R[2],R[3],"var(--accent)")}${arc(R[3],R[4],"var(--ok)")}
    <text x="16" y="${H-2}" style="fill:var(--danger)" font-size="9.5" font-weight="600">도전</text>
    <text x="${W-16}" y="${H-2}" text-anchor="end" style="fill:var(--ok)" font-size="9.5" font-weight="600">안정</text>
    <line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="4" fill="var(--ink)"/>
    <text x="${cx}" y="${cy+15}" text-anchor="middle" style="fill:${d>=0?"var(--ok)":"var(--danger)"}" font-size="11" font-weight="700">${esc(dTxt)}</text></svg>`;}
/* 컷 추이 라인차트 + 내 위치선 */
function mkTrendChart(t,isJ,myV){
  const ys=isJ?Object.keys(t.pcts).sort():t.ys;
  if(!ys.length)return"";
  const vals=ys.map(y=>isJ?t.pcts[y]:t.years[y]);
  const W=Math.max(220,42+ys.length*56),H=104,PL=8,PR=54,PT=16,PB=18;
  let lo=Math.min(...vals),hi=Math.max(...vals);
  if(myV!=null&&!isNaN(myV)){lo=Math.min(lo,myV);hi=Math.max(hi,myV);}
  if(hi-lo<(isJ?2:0.4)){const c=(hi+lo)/2,h2=(isJ?1:0.2);lo=c-h2;hi=c+h2;}
  const pad=(hi-lo)*0.18;lo-=pad;hi+=pad;
  const x=i=>PL+18+(ys.length<2?(W-PL-PR-18)/2:i/(ys.length-1)*(W-PL-PR-18));
  const y=v=>isJ?PT+(hi-v)/(hi-lo)*(H-PT-PB):PT+(v-lo)/(hi-lo)*(H-PT-PB);
  const pts=vals.map((v,i)=>[x(i),y(v)]);
  const line=`<polyline points="${pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
  const dots=pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="var(--accent)"/>
    <text x="${p[0].toFixed(1)}" y="${(p[1]-8).toFixed(1)}" text-anchor="middle" style="fill:var(--ink)" font-size="10" font-weight="600">${isJ?vals[i]:fmtCut(vals[i])}</text>
    <text x="${p[0].toFixed(1)}" y="${H-4}" text-anchor="middle" style="fill:var(--ink2)" font-size="9.5">${ys[i]}</text>`).join("");
  const my=(myV!=null&&!isNaN(myV))?`<line x1="${PL}" y1="${y(myV).toFixed(1)}" x2="${W-PR+14}" y2="${y(myV).toFixed(1)}" stroke="var(--danger)" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="${W-PR+16}" y="${(y(myV)+3.5).toFixed(1)}" style="fill:var(--danger)" font-size="9.5" font-weight="700">내 위치</text>`:"";
  return `<div style="overflow-x:auto;flex:1;min-width:200px"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${my}${line}${dots}</svg></div>`;}

function mkSaveUniv(){
  const s=db.students.find(x=>x.id===view.mkStu);if(!s||!view.mkSel)return;

function consultDateInMonth(s,y,m){
  const c=s.consult||{};const ym=`${y}-${String(m+1).padStart(2,"0")}`;
  if(c.nextOverride&&c.nextOverride.slice(0,7)===ym)return c.nextOverride;
  if(c.week==null||c.week===""||c.day==null||c.day==="")return null;
  const dt=nthWeekday(y,m,+c.week,+c.day);
  return dt?fmtDate(dt):null;}

  const ym=`${y}-${String(mo+1).padStart(2,"0")}`;
  const ev={};
  for(const s of db.students){
    const cd=consultDateInMonth(s,y,mo);

    for(const t of (s.tasks||[]))

        (ev[t.due]=ev[t.due]||[]).push({label:`${s.name} ${t.subject||""} 마감`,cls:"warn",id:s.id});
    for(const e of (s.exams||[]))
      if(e.date&&e.date.slice(0,7)===ym)
        (ev[e.date]=ev[e.date]||[]).push({label:`${s.name} ${e.name}`,cls:"danger",id:s.id});
  }
  const startPad=new Date(y,mo,1).getDay();
  const daysIn=new Date(y,mo+1,0).getDate();
  let cells="";
  for(let i=0;i<startPad;i++)cells+=`<div class="calcell pad"></div>`;
  for(let d=1;d<=daysIn;d++){
    const ds=`${ym}-${String(d).padStart(2,"0")}`;
    cells+=`<div class="calcell ${ds===today()?'today':''}"><span class="dnum">${d}</span>

function importJson(){
  modal(`<h2>데이터 가져오기</h2>
  <p style="font-size:12.5px;color:var(--ink2)">시드 파일(students.json) 또는 백업 파일을 선택하세요. 같은 이름의 학생은 병합(기존 초안·기록 유지)됩니다.</p>
  <input type=file id=impf accept=".json">
  <div class=mfoot><button class=btn onclick=closeModal()>취소</button>
  <button class="btn pri" onclick="doImport()">가져오기</button></div>`);}
function doImport(){
  const f=$("#impf").files[0];if(!f){toast("파일을 선택하세요");return;}
  const r=new FileReader();
  r.onload=()=>{try{
    const j=JSON.parse(r.result);
    const incoming=j.students||[];let added=0,merged=0;
    for(const inc of incoming){
      const ex=db.students.find(s=>s.name===inc.name);
      if(ex){Object.assign(ex,{...inc,id:ex.id,saenggibu:ex.saenggibu||[],tasks:ex.tasks||inc.tasks||[],records:ex.records||inc.records||[],planners:ex.planners||[]});merged++;}
      else{db.students.push({saenggibu:[],tasks:[],records:[],planners:[],lcsi:"미파악",...inc,id:inc.id||uid()});added++;}
    }
    save();closeModal();render();toast(`가져오기 완료 — 신규 ${added}명, 병합 ${merged}명`);
  }catch(e){toast("JSON 파싱 실패: "+e.message);}};
  r.readAsText(f);}
