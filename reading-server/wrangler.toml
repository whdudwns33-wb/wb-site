name = "wb-reading"
main = "worker.mjs"
compatibility_date = "2026-08-01"

[assets]
directory = "./dist"
binding = "ASSETS"
# articles.json은 워커를 먼저 거쳐야 발행 오버라이드(pubmap)가 적용됨.
# 기본값은 자산 직접 서빙이라 워커의 /articles.json 인터셉트가 실행되지 않는다.
run_worker_first = ["/articles.json"]

# KV 네임스페이스 — 배포 시 `wrangler kv namespace create DB`로 생성된 id로 교체
[[kv_namespaces]]
binding = "DB"
id = "7c7f971952b449fdadf616ef94ef73d1"

# 매일 03:00 KST(18:00 UTC) 자동 백업 스냅샷 (backup:<날짜> 키, 10개 보관)
[triggers]
crons = ["0 18 * * *"]
