name = "wb-reading"
main = "worker.mjs"
compatibility_date = "2026-08-01"

[assets]
directory = "./dist"
binding = "ASSETS"
# 자산은 기본적으로 워커를 거치지 않고 바로 서빙된다. 워커가 손대야 하는 것만 여기 적는다.
#  · articles.json — 발행 오버라이드(pubmap)를 얹어야 한다.
#  · textbook.json — 코칭 원문은 이제 자산에 없다(KV textbook-src로 이전, 2026-09).
#    목록에 남겨 두는 것은 과거 캐시·직접 요청이 와도 워커의 404 응답을 타게 하기 위해서다.
run_worker_first = ["/articles.json", "/articles-L1.json", "/articles-L2.json", "/articles-L3.json", "/articles-L4.json", "/hanja.json", "/version.json", "/textbook.json", "/letter/fonts/*"]

# KV 네임스페이스 — 배포 시 `wrangler kv namespace create DB`로 생성된 id로 교체
[[kv_namespaces]]
binding = "DB"
id = "7c7f971952b449fdadf616ef94ef73d1"

# 크론 4개 — 18:00 UTC(03:00 KST): 일일 백업 스냅샷(backup:<날짜>, 10개 보관, vocab:·haru:·letter:·hanja: 키 포함 — 한자 단어장 본문은 제외)
#           12:00 UTC(21:00 KST): 워드브레인 "자기 전 3분 물주기" Web Push
#           18:10 UTC(03:10 KST): 하루브레인 주간 익명 집계(haru:agg:<주>, 백업 직후 · 셀 n<5 생략)
#           22:00 UTC(07:00 KST): 브레인레터 "새 호 도착" Web Push — 발행일이 된 호(예약 발행분)만, 같은 VAPID 키
#           09:00 UTC(18:00 KST): 청크브레인 가족 링크 "오늘 복습할 글이 있어요" Web Push — 복습이 밀린 가정에만, 같은 VAPID 키
[triggers]
crons = ["0 18 * * *", "0 12 * * *", "10 18 * * *", "0 22 * * *", "0 9 * * *"]

# 밤 9시 푸시 — VAPID 키 등록 (node reading-server/gen-vapid.mjs 로 생성, 없으면 알림 기능만 비활성):
#   npx wrangler secret put VAPID_PUBLIC_KEY
#   npx wrangler secret put VAPID_PRIVATE_JWK
# 선택: VAPID_SUBJECT (기본 mailto:admin@wb.local)

# 워드브레인 AI 연상 생성 — 배포 후 1회 등록 (없으면 앱이 "AI 키 미설정"으로 안내하고 나머지는 정상 동작):
#   npx wrangler secret put ANTHROPIC_API_KEY
# 선택: 모델 오버라이드 (기본 claude-opus-5)
#   npx wrangler secret put VOCAB_AI_MODEL
