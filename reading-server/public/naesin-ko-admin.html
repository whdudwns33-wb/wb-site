<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>WB 국어브레인 · 관리</title>
  <style>
    :root{--green:#2A3B2E;--acc:#3E6B4A;--soft:#e9f1ea;--bg:#f4f6f3;--line:#dde5dc;--muted:#6b7268;--ink:#222a24;--ok:#14755e;--warn:#8a4b08;--bad:#9b352b}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;line-height:1.6}
    header{display:flex;align-items:center;gap:14px;padding:13px 20px;background:var(--green);color:#fff;flex-wrap:wrap}
    header b{font-size:17px}header small{opacity:.75}header .sp{flex:1}
    .hbtn{min-height:38px;padding:6px 14px;border:1px solid #ffffff55;border-radius:10px;background:transparent;color:#fff;font-weight:800;cursor:pointer}
    main{max-width:1080px;margin:auto;padding:18px 14px 60px}
    .card{margin-bottom:14px;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:#fff}
    h2{margin:0 0 6px;color:var(--green);font-size:17px}
    h3{margin:12px 0 6px;color:var(--green);font-size:14px}
    button{font:inherit;cursor:pointer}
    input,select,textarea{font:inherit;min-height:42px;padding:8px 10px;border:1.5px solid #c6d5c4;border-radius:10px;background:#fff;color:var(--ink);width:100%}
    textarea{min-height:70px;resize:vertical}
    .btn{min-height:42px;padding:6px 16px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-weight:900}
    .btn.ghost{background:#fff;border:1.5px solid #c6d5c4;color:var(--green)}
    .btn.sm{min-height:34px;padding:4px 12px;font-size:13px}
    .btn:disabled{opacity:.45;cursor:default}
    .tag{display:inline-block;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--acc);font-size:12px;font-weight:800}
    .tag.ok{background:#e7f6f0;color:var(--ok)}.tag.bad{background:#fff0ef;color:var(--bad)}.tag.warn{background:#fff4e6;color:var(--warn)}.tag.muted{background:#eef2ee;color:var(--muted)}
    .stats{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}
    .stat{flex:1;min-width:120px;padding:12px;border:1px solid #d6e4d5;border-radius:12px;background:#f7fbf7;text-align:center}
    .stat b{display:block;font-size:22px;color:var(--green)}
    .stat span{font-size:12px;color:var(--muted);font-weight:800}
    .tbl{overflow-x:auto}
    /* 준비도 — 반 그림은 평균 하나가 아니라 분포와 '누가 위험한가'다 */
    .rdbar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:#eef2ee;margin:8px 0 4px}
    .rdbar i{display:block}
    .rd-start{background:#e0736a}.rd-building{background:#e8b45c}.rd-ontrack{background:#7db98c}.rd-ready{background:#2e7d55}
    .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:700}
    .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
    .risklist{margin-top:10px;font-size:13px}
    .risklist div{padding:6px 0;border-top:1px solid var(--line)}
    .mini{display:inline-block;width:52px;height:7px;border-radius:999px;background:#eef2ee;vertical-align:middle;overflow:hidden}
    .mini i{display:block;height:100%;background:var(--green)}

    /* 루브릭 저작 — 왼쪽에 자료(발문·조건·모범답안), 오른쪽에 내가 쓰는 채점 요소 */
    .rub{border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
    .rub>summary{padding:10px 12px;cursor:pointer;background:#f7fbf7;font-weight:800;list-style:none}
    .rub>summary::-webkit-details-marker{display:none}
    .rub>summary .tag{margin-left:6px}
    .rub .body{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:12px;border-top:1px solid var(--line)}
    @media(max-width:900px){.rub .body{grid-template-columns:1fr}}
    .rub h4{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:800}
    .src{background:#fbfaf7;border-left:3px solid var(--soft);padding:8px 10px;border-radius:0 8px 8px 0;font-size:13px;margin-bottom:8px}
    /* 모범답안 어절을 눌러 인정 키워드로 넣는다 — 손으로 옮겨 적다가 오타 나면 채점이 틀린다 */
    .tok{display:inline-block;padding:1px 5px;margin:1px;border-radius:5px;background:#eef2ee;cursor:pointer;font-size:13px}
    .tok:hover{background:var(--green);color:#fff}
    .el{display:grid;grid-template-columns:1fr 1.4fr 56px 28px;gap:6px;margin-bottom:6px}
    .el input{padding:6px 8px;border:1px solid var(--line);border-radius:8px;width:100%}
    .el .x{border:none;background:none;color:var(--bad);cursor:pointer;font-size:16px}
    .chk{margin-top:8px;font-size:13px}
    .chk .ln{padding:5px 0;border-top:1px solid var(--line)}
    .chk b.ok{color:var(--ok)}.chk b.no{color:var(--bad)}.chk b.hold{color:var(--warn)}
    table{border-collapse:collapse;width:100%;font-size:13.5px}
    th{position:sticky;top:0;background:#eef3ed;color:var(--green);font-size:12px}
    th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
    tbody tr:nth-child(even) td{background:#f8fbf8}
    .grid-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-items:end}
    .err{color:var(--bad);font-weight:700;font-size:13px;margin-top:8px}
    .muted{color:var(--muted);font-size:12.5px}
    #loginCard{max-width:380px;margin:60px auto}
    .issues{margin:8px 0 0;padding:10px 12px;border-radius:10px;font-size:13px;max-height:280px;overflow:auto}
    .issues.bad{background:#fff0ef}.issues.warn{background:#fff4e6}.issues.ok{background:#e7f6f0}
    .issues div{margin:2px 0}
    label.ck{display:inline-flex;align-items:center;gap:6px;font-weight:700;margin:2px 10px 2px 0}
    label.ck input{width:auto;min-height:auto}
    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .ans{background:#f7fbf7;border-left:3px solid var(--acc);padding:8px 11px;border-radius:0 8px 8px 0;white-space:pre-wrap}
  </style>
</head>
<body>
<header><b>WB 국어브레인 · 관리</b><small>팩 업로드 · 시험 등록 · 오버레이 · 서술형 검토</small><span class="sp"></span>
  <button class="hbtn" onclick="location.href='/admin/naesin-admin.html'">내신브레인(영어)</button>
  <button class="hbtn" onclick="location.href='/admin/'">진로독서 관리</button>
  <button class="hbtn" id="btnLogout">로그아웃</button>
</header>
<main id="app"></main>

<script src="/naesin-ko/pack-check.js"></script>
<script src="/naesin-ko/readiness.js"></script>
<script src="/naesin-ko/grade.js"></script>
<script>
/* WB 국어브레인 관리 웹 — 기획서 §6·§7.
   인증은 진로독서 관리 웹과 같은 관리 PIN 토큰(wbr.admin.token)을 그대로 쓴다.
   팩 검증은 학생 앱·CLI와 같은 pack-check.js를 부른다 — 규칙을 두 벌로 두지 않는다(§7[3]). */
let TOKEN = localStorage.getItem('wbr.admin.token') || null;
let PACKS = [], OVERVIEW = [], REVIEWS = [], ASSEMBLED = null, CONCEPTS = null;
/* 팩과 함께 고른 검수 파일 — 팩이 아니라 루브릭 저작 대기 목록으로 간다 */
let PENDING_UP = null;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

async function api(path, opt) {
  const r = await fetch('/api' + path, Object.assign({
    headers: { 'Content-Type': 'application/json', ...(TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {}) }
  }, opt || {}));
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && TOKEN) {
    TOKEN = null; localStorage.removeItem('wbr.admin.token');
    renderLogin('세션이 만료됐어요. 다시 로그인해 주세요.');
    throw new Error('auth');
  }
  if (!r.ok) throw new Error(j.error || ('오류 ' + r.status));
  return j;
}

function renderLogin(msg) {
  $('#app').innerHTML = `<div class="card" id="loginCard"><h2>강사 로그인</h2>
    <p class="muted">진로독서 관리와 같은 PIN을 씁니다.</p>
    <input id="pin" type="password" inputmode="numeric" placeholder="관리 PIN" autocomplete="current-password">
    <button class="btn" id="go" style="margin-top:10px;width:100%">로그인</button>
    <div class="err" id="e">${msg ? esc(msg) : ''}</div></div>`;
  $('#go').onclick = async () => {
    try {
      const j = await api('/admin/login', { method: 'POST', body: JSON.stringify({ pin: $('#pin').value }) });
      TOKEN = j.token; localStorage.setItem('wbr.admin.token', TOKEN); refresh();
    } catch (e) { $('#e').textContent = e.message; }
  };
  $('#pin').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#go').click(); });
}

async function refresh() {
  try {
    const [ov, pk] = await Promise.all([api('/naesin-ko/admin/overview'), api('/naesin-ko/admin/packs')]);
    OVERVIEW = ov.students || []; PACKS = pk.packs || [];
    try { REVIEWS = (await api('/naesin-ko/admin/review')).reviews || []; } catch (e) { REVIEWS = []; }
    render();
  } catch (e) { if (e.message !== 'auth') $('#app').innerHTML = `<div class="card err">${esc(e.message)}</div>`; }
}

/* 학생 요약만 보고 반 그림을 만든다 — 학생 state는 서버가 통째로 읽지 않는다(§8).
   학생 앱과 **같은 모듈**(readiness.js)이라 두 화면의 숫자가 어긋날 수 없다. */
let CLS = { avg: null, risk: [], watch: [], dist: {}, weakTop: [], linked: 0, n: 0 };
const AXIS_LABEL = {};
(window.WBKOREADY ? WBKOREADY.AXES : []).forEach((a) => { AXIS_LABEL[a.key] = a.label; });

/* 위험한 학생이 표 맨 위에 온다 — 스크롤해서 찾아야 하는 신호는 신호가 아니다 */
function byReady(a, b) {
  const s = (x) => (x.summary && x.summary.ready && typeof x.summary.ready.score === 'number') ? x.summary.ready.score : 999;
  return s(a) - s(b);
}

function renderClass() {
  if (!CLS.linked) return '';
  const d = CLS.dist, n = CLS.linked;
  const seg = (k, label) => d[k] ? `<i class="rd-${k}" style="width:${(d[k] / n) * 100}%" title="${label} ${d[k]}명"></i>` : '';
  const weak = CLS.weakTop.slice(0, 3).map((w) => `${esc(w.label)} ${w.n}명`).join(' · ');
  const rows = CLS.risk.concat(CLS.watch).slice(0, 8).map((r) =>
    `<div><span class="tag ${CLS.risk.includes(r) ? 'bad' : 'warn'}">${CLS.risk.includes(r) ? '위험' : '주의'}</span>
      <b>${esc(r.name)}</b> <span class="muted">${esc(r.why)}</span></div>`).join('');
  return `<div class="rdbar">${seg('start', '시작 단계')}${seg('building', '쌓는 중')}${seg('ontrack', '궤도')}${seg('ready', '준비 완료')}</div>
    <div class="legend">
      <span><i class="rd-start"></i>시작 ${d.start}</span><span><i class="rd-building"></i>쌓는 중 ${d.building}</span>
      <span><i class="rd-ontrack"></i>궤도 ${d.ontrack}</span><span><i class="rd-ready"></i>완료 ${d.ready}</span>
      <span>중앙값 ${CLS.median}% · 최저 ${CLS.low}% · 최고 ${CLS.high}%</span>
    </div>
    ${weak ? `<p class="muted" style="margin:8px 0 0">반에서 가장 비어 있는 축: <b>${weak}</b> — 다음 수업 세트를 여기에 맞추세요.</p>` : ''}
    ${rows ? `<div class="risklist">${rows}</div>` : ''}`;
}

function render() {
  const linked = OVERVIEW.filter((s) => s.linked);
  CLS = window.WBKOREADY ? WBKOREADY.classReadiness(linked) : CLS;
  /* 목록과 같은 기준으로 센다 — 규칙이 통과시킨 답안도 표본 감사(§5.3 self)를 위해
     확정 전까지 큐에 남는다. 카운트만 다른 기준이면 숫자와 목록이 어긋나 보인다. */
  const hold = REVIEWS.filter((r) => !r.teacher);
  $('#app').innerHTML = `
  <div class="card">
    <h2>반 성취도</h2>
    <div class="stats">
      <div class="stat"><b>${CLS.avg == null ? '-' : CLS.avg + '%'}</b><span>평균 준비도</span></div>
      <div class="stat"><b>${linked.length}</b><span>학습 중</span></div>
      <div class="stat"><b>${CLS.risk.length}</b><span>위험</span></div>
      <div class="stat"><b>${hold.length}</b><span>서술형 미확정</span></div>
    </div>
    ${renderClass()}
    <div class="tbl"><table><thead><tr>
      <th>학생</th><th>반</th><th>준비도</th><th>비어 있는 축</th><th>작품 완료</th><th>개념 안정화</th><th>오답</th><th>서술형</th><th>최근</th>
    </tr></thead><tbody>${linked.length ? linked.slice().sort(byReady).map(rowStudent).join('') :
      '<tr><td colspan="9" class="muted">아직 학습 기록이 없어요.</td></tr>'}</tbody></table></div>
  </div>

  <div class="card">
    <h2>서술형 검토 큐</h2>
    <p class="muted">규칙 채점(1층)이 <b>보류</b>로 남긴 답안입니다. 읽고 원터치로 확정하세요 —
      학생 화면에는 “연습 판정”으로 표시됩니다(§10-8).</p>
    <div id="reviewList">${renderReviews()}</div>
  </div>

  <div class="card">
    <h2>서술형 루브릭 저작</h2>
    <p class="muted">추출기가 <b>채점 요소를 못 만든</b> 서술형입니다. 자료에 ‘핵심 단어’가 없거나,
      있어도 모범답안이 그 요소를 다 채우지 못하는 문항이에요. 요소를 쓰고
      <b>모범답안으로 검산</b>해서 통과하면 팩에 넣습니다 — 빈 루브릭은 배포가 막히고,
      통과 못 하는 루브릭은 학생이 무엇을 써도 영영 보류가 됩니다.</p>
    <div class="row">
      <select id="rbPack">${PACKS.map((p) => `<option>${esc(p)}</option>`).join('')}</select>
      <button class="btn ghost sm" id="btnRbLoad">불러오기</button>
      <button class="btn ghost sm" id="btnRbSave" disabled>저작한 것 내려받기</button>
      <span class="muted" id="rbMsg"></span>
    </div>
    <div id="rbList" class="muted" style="margin-top:10px">팩을 고르고 불러오기를 누르세요.</div>
  </div>

  <div class="card">
    <h2>단원 팩 업로드</h2>
    <p class="muted">분리 JSON을 모두 고르면 브라우저에서 합쳐 검증합니다.
      규칙은 <code>naesin-ko/pack-check.js</code> 하나 — CLI 검증기와 같은 파일입니다.
      <b><code>_build/review/review.json</code>도 함께 고르세요</b> — 팩에는 안 들어가고
      위 ‘서술형 루브릭 저작’ 목록으로 갑니다.</p>
    <input type="file" id="files" multiple accept="application/json,.json">
    <div id="checkOut"></div>
    <div class="row" style="margin-top:10px">
      <button class="btn" id="btnUpload" disabled>업로드</button>
      <span class="muted" id="upMsg"></span>
    </div>
    <h3>등록된 팩</h3>
    <div id="packList" class="muted">${PACKS.length ? PACKS.map((p) => `<span class="tag" style="margin:2px">${esc(p)}</span>`).join('') : '없음'}</div>
  </div>

  <div class="card">
    <h2>시험 등록</h2>
    <p class="muted">시험 프로파일(문항 수·서술형 배점)은 학교알리미 평가계획에서 옮겨 적습니다.
      서술형 배점이 30% 이상이면 플래너가 서술형을 D-21부터 배정합니다(§5.4).</p>
    <div class="grid-form">
      <div><label class="muted">대상</label><input id="exScope" value="default" placeholder="default 또는 학생 코드"></div>
      <div><label class="muted">시험일</label><input id="exDate" type="date"></div>
      <div><label class="muted">객관식 문항 수</label><input id="exMc" type="number" min="0" placeholder="예: 21"></div>
      <div><label class="muted">서술형 문항 수</label><input id="exEs" type="number" min="0" placeholder="예: 5"></div>
      <div><label class="muted">서술형 배점 비율</label><input id="exW" type="number" min="0" max="100" placeholder="예: 40 (%)"></div>
    </div>
    <h3>범위 팩</h3>
    <div id="exPacks">${PACKS.length ? PACKS.map((p) => `<label class="ck"><input type="checkbox" value="${esc(p)}"> ${esc(p)}</label>`).join('') : '<span class="muted">먼저 팩을 올려 주세요.</span>'}</div>
    <div class="row" style="margin-top:10px"><button class="btn" id="btnExam">등록</button><span class="muted" id="exMsg"></span></div>
  </div>

  <div class="card">
    <h2>오늘 수업 과제</h2>
    <p class="muted">배정하면 학생 홈 맨 위에 고정됩니다.</p>
    <div class="grid-form">
      <div><label class="muted">날짜</label><input id="tkDate" type="date"></div>
      <div><label class="muted">제목</label><input id="tkTitle" placeholder="예: 빈 의자 구절 적용"></div>
      <div><label class="muted">팩(선택)</label><select id="tkPack"><option value="">(지정 안 함)</option>${PACKS.map((p) => `<option>${esc(p)}</option>`).join('')}</select></div>
    </div>
    <h3>학습 유형</h3>
    <div id="tkTypes">${['읽기', '개념 빈칸', '구절 적용', '주석 복원', '서술형', '실전 객관식', '확인 문제', '브레인덤프']
      .map((k) => `<label class="ck"><input type="checkbox" value="${k}"> ${k}</label>`).join('')}</div>
    <div class="row" style="margin-top:10px"><button class="btn" id="btnTask">배정</button><span class="muted" id="tkMsg"></span></div>
  </div>

  <div class="card">
    <h2>학교 강조점 오버레이</h2>
    <p class="muted">국어 내신의 채점 기준은 <b>학교 선생님이 수업에서 강조한 해석</b>입니다(§1.4-4).
      정본과 다르면 여기서 덮어쓰세요 — 채점기·문항 생성기가 이 값을 따릅니다.
      학생 필기에 기반한 정보이므로 학생 화면에는 “학교 선생님 강조”로 표시됩니다.</p>
    <div class="grid-form">
      <div><label class="muted">대상</label><input id="ovScope" value="default"></div>
    </div>
    <h3>정답 덮어쓰기</h3>

    <textarea id="ovOver" placeholder="b-bl-09 | 의인법 / 활유법 | 학교에서는 활유법도 인정"></textarea>
    <h3>작품별 강조 메모</h3>

      <button class="btn ghost sm" id="btnOvLoad">불러오기</button><span class="muted" id="ovMsg"></span></div>
  </div>`;

function rowStudent(s) {
  const m = s.summary || {};
  const r = m.ready;
  const pct = (a, b) => (b ? Math.round((a / b) * 100) + '%' : '-');
  /* 준비도는 숫자 + 막대 + 신호등. 신호가 있으면 why 를 title 로 달아 둔다 —
     한 줄에 다 쓰면 표가 안 읽히고, 안 쓰면 왜 위험한지 모른다. */
  const lvl = r && r.alert ? r.alert.level : null;
  const ready = r ? `<b>${r.score}%</b> <span class="mini"><i style="width:${r.score}%"></i></span>
      ${lvl ? `<span class="tag ${lvl === 'risk' ? 'bad' : 'warn'}" title="${esc(r.alert.why)}">${lvl === 'risk' ? '위험' : '주의'}</span>` : ''}` : '-';
  /* 가장 비어 있는 축 두 개 — 이 학생에게 오늘 무엇을 시킬지가 여기서 나온다.
     찬 축은 빼고 센다: '비어 있는 축'에 100%가 뜨면 표를 잘못 읽게 된다. */
  const empty = r && r.axes ? Object.keys(r.axes).filter((k) => r.axes[k] < 100).sort((a, b) => r.axes[a] - r.axes[b]) : [];
  const axes = !r ? '-' : (empty.length
    ? empty.slice(0, 2).map((k) => `${esc(AXIS_LABEL[k] || k)} ${r.axes[k]}%`).join(' · ')
    : '<span class="tag ok">없음</span>');
  return `<tr>
    <td>${esc(s.name || s.code)}<div class="muted">${esc(s.code)}</div></td>
    <td>${esc(s.cls || '')}</td>
    <td>${ready}</td>
    <td class="muted">${axes}</td>
    <td>${m.complete != null ? `${m.complete} / ${m.works || 0}` : '-'}</td>
    <td>${m.blankTotal ? `${m.blankStable}/${m.blankTotal} <span class="muted">(${pct(m.blankStable, m.blankTotal)})</span>` : '-'}</td>
    <td>${m.wrongOpen != null ? (m.wrongOpen > 0 ? `<span class="tag warn">${m.wrongOpen}</span>` : '<span class="tag ok">0</span>') : '-'}</td>
    <td>${m.essayPass != null ? `통과 ${m.essayPass}${m.essayHold ? ` · 보류 ${m.essayHold}` : ''}` : '-'}</td>
    <td class="muted">${s.lastActive ? esc(String(s.lastActive).slice(5, 16).replace('T', ' ')) : '-'}</td>
  </tr>`;
}

function renderReviews() {
  const rows = REVIEWS.filter((r) => !r.teacher);
  if (!rows.length) return '<p class="muted">검토할 답안이 없어요.</p>';
  return rows.slice(0, 40).map((r) => {
    const v = r.rule || {};
    const tag = r.verdict === 'pass' ? '<span class="tag ok">규칙 통과</span>'
      : r.verdict === 'fail' ? '<span class="tag bad">규칙 미달</span>' : '<span class="tag warn">보류</span>';
    return `<div style="border-top:1px solid var(--line);padding:10px 0">
      <div class="row"><b>${esc(r.name || r.code)}</b><span class="muted">${esc(r.cls || '')}</span>
        <span class="tag muted">${esc(r.itemId)}</span>${tag}
        <span class="muted">${v.score != null ? `${v.score}/${v.total}점` : ''}</span></div>
      <div class="ans" style="margin:6px 0">${esc(r.answer || '(빈 답안)')}</div>
      <div class="row">
        <button class="btn sm" data-rv="pass" data-code="${esc(r.code)}" data-item="${esc(r.itemId)}">통과</button>
        <button class="btn sm ghost" data-rv="hold" data-code="${esc(r.code)}" data-item="${esc(r.itemId)}">보류</button>
        <button class="btn sm ghost" data-rv="fail" data-code="${esc(r.code)}" data-item="${esc(r.itemId)}">미달</button>
        <input style="max-width:80px" type="number" placeholder="점수" data-pt="${esc(r.code)}|${esc(r.itemId)}">

/* ── 서술형 루브릭 저작 ──
   추출기가 못 만든 채점 요소를 사람이 쓰는 자리다. 두 가지를 이 화면이 책임진다:
   ① 손으로 옮겨 적다 생기는 오타 — 모범답안 어절을 눌러 넣게 한다(글자 하나가 틀리면 채점이 틀린다)
   ② 통과 못 하는 루브릭 — 저장 전에 **모범답안으로 검산**한다. 자료의 모범답안조차 pass 가
      안 되는 루브릭을 팩에 넣으면 학생이 무엇을 써도 영영 보류가 된다(§4.1 5단계가 안 끝난다). */
let RB = { packId: '', pending: [], pack: null, draft: {} };

function rbTokens(text) {
  /* 어절 단위로 자른다 — 조사·문장부호는 채점기(normalizeKo)가 알아서 떼므로 그대로 둔다 */
  return String(text || '').split(/\s+/).map((x) => x.replace(/[.,!?"'‘’“”]/g, '')).filter((x) => x.length >= 2);
}
function rbKey(it) { return it.id; }
function rbDraftOf(it) {
  if (!RB.draft[rbKey(it)]) {
    const seed = (it.rubric || []).map((r) => ({ element: r.element || '', kw: (r.keywords || []).join(', '), points: r.points == null ? '' : r.points }));
    RB.draft[rbKey(it)] = seed.length ? seed : [{ element: '', kw: '', points: '' }];
  }
  return RB.draft[rbKey(it)];
}
function rbBuild(it) {
  const rows = rbDraftOf(it).filter((r) => r.element.trim() || r.kw.trim());
  return rows.map((r) => ({
    element: r.element.trim(),
    keywords: r.kw.split(',').map((x) => x.trim()).filter(Boolean),
    points: r.points === '' ? null : Number(r.points),
    source: 'authored',
  }));
}
/* 저작 중인 루브릭을 붙인 문항 — 검산과 저장이 같은 값을 본다 */
function rbItem(it) { return Object.assign({}, it, { rubric: rbBuild(it) }); }

function rbCheck(it) {
  const item = rbItem(it);
  if (!item.rubric.length) return { ok: false, why: '채점 요소가 없어요.', rows: [] };
  const bad = item.rubric.filter((r) => !r.element || !r.keywords.length);
  if (bad.length) return { ok: false, why: '요소 이름과 인정 키워드가 둘 다 있어야 해요.', rows: [] };
  const models = (item.modelAnswers || []).filter(Boolean);
  if (!models.length) return { ok: true, why: '모범답안이 없어 검산은 못 했어요 — 표본 채점으로 확인하세요.', rows: [] };
  const rows = models.map((m) => {
    const v = WBKOGRADE.gradeRubric(m, item);
    return { answer: m, verdict: v.verdict, score: v.score, total: v.total,
      missing: v.elements.filter((e) => !e.met).map((e) => e.element) };
  });
  const ok = rows.some((r) => r.verdict === 'pass');
  return { ok, rows,
    why: ok ? '모범답안이 통과합니다 — 팩에 넣을 수 있어요.'
      : '자료의 모범답안조차 통과하지 못해요. 요소를 줄이거나, 같은 뜻의 표현을 한 요소의 키워드로 묶으세요.' };
}

function rbRender() {
  const box = $('#rbList');
  if (!RB.pending.length) { box.innerHTML = '<span class="muted">루브릭을 기다리는 서술형이 없어요.</span>'; return; }
  box.innerHTML = RB.pending.map((p, i) => {
    const it = p.item;
    const d = rbDraftOf(it);
    const done = rbBuild(it).length ? (rbCheck(it).ok ? '<span class="tag ok">검산 통과</span>' : '<span class="tag warn">검산 필요</span>') : '';
    return `<details class="rub" data-i="${i}">
      <summary>${esc(String(it.source && it.source.no || i + 1))}. ${esc(String(it.stem || '').replace(/<[^>]+>/g, '').slice(0, 60))}
        <span class="tag muted">${esc(p.series || '')}</span>${done}</summary>
      <div class="body">
        <div>
          <h4>발문</h4><div class="src">${it.stem || ''}</div>
          ${(it.conditions || []).length ? `<h4>조건</h4><div class="src">${it.conditions.map((c) => esc(c.text || c.kind)).join('<br>')}</div>` : ''}
          <h4>모범답안 — 어절을 누르면 키워드로 들어갑니다</h4>
          ${(it.modelAnswers || []).map((m) => `<div class="src">${rbTokens(m).map((t) => `<span class="tok" data-tok="${esc(t)}">${esc(t)}</span>`).join(' ')}</div>`).join('')}
          ${it.explanation && it.explanation.main ? `<h4>해설(참고)</h4><div class="src">${esc(it.explanation.main)}</div>` : ''}
        </div>
        <div>
          <h4>채점 요소 — 요소마다 하나라도 맞으면 충족</h4>
          <div class="el" style="font-size:11px;color:var(--muted);font-weight:800">
            <span>요소 이름</span><span>인정 키워드(쉼표)</span><span>배점</span><span></span></div>
          <div data-rows>${d.map((r, k) => `<div class="el">
            <input data-f="element" data-k="${k}" value="${esc(r.element)}" placeholder="예: 화자의 태도">
            <input data-f="kw" data-k="${k}" value="${esc(r.kw)}" placeholder="예: 감사, 고마움">
            <input data-f="points" data-k="${k}" value="${esc(String(r.points))}" placeholder="1">
            <button class="x" data-del="${k}" title="이 요소 지우기">×</button></div>`).join('')}</div>
          <button class="btn ghost sm" data-add="1">＋ 요소 추가</button>
          <div class="chk" data-chk></div>
          <div class="row" style="margin-top:8px">
            <button class="btn sm" data-check="1">모범답안으로 검산</button>
            <button class="btn sm" data-put="1">팩에 넣기</button>
          </div>
        </div>
      </div></details>`;
  }).join('');
  box.className = '';
}

/* 지금 열려 있는 문항의 입력값을 초안에 담는다 — 다시 그려도 안 날아가게 */
function rbSync(det) {
  const i = Number(det.getAttribute('data-i'));
  const it = RB.pending[i].item;
  const d = rbDraftOf(it);
  det.querySelectorAll('[data-f]').forEach((inp) => {
    const k = Number(inp.getAttribute('data-k'));
    if (d[k]) d[k][inp.getAttribute('data-f')] = inp.value;
  });
  return { i, it, det };
}

function rbShowCheck(det, it) {
  const r = rbCheck(it);
  det.querySelector('[data-chk]').innerHTML =
    `<div class="ln"><b class="${r.ok ? 'ok' : 'no'}">${r.ok ? '통과' : '아직'}</b> ${esc(r.why)}</div>` +
    r.rows.map((x) => `<div class="ln"><b class="${x.verdict === 'pass' ? 'ok' : x.verdict === 'hold' ? 'hold' : 'no'}">${x.verdict}</b>
      ${x.score}/${x.total}점 ${x.missing.length ? `· 빠짐: ${esc(x.missing.join(', '))}` : ''}
      <div class="muted">${esc(String(x.answer).slice(0, 90))}</div></div>`).join('');
  return r;
}

async function rbLoad() {
  const id = $('#rbPack').value;
  if (!id) return;
  $('#rbMsg').textContent = '불러오는 중…';
  try {
    const [pd, pk] = await Promise.all([
      api('/naesin-ko/admin/pending?id=' + encodeURIComponent(id)),
      api('/naesin-ko/pack?id=' + encodeURIComponent(id)),
    ]);
    RB = { packId: id, pack: pk.pack,
      pending: (pd.pending || []).filter((p) => p.kind === 'item' && p.item && p.item.format === 'essay'),
      draft: {} };
    $('#rbMsg').textContent = `${RB.pending.length}문항 대기`;
    $('#btnRbSave').disabled = !RB.pending.length;
    rbRender();
  } catch (e) { $('#rbMsg').textContent = e.message; }
}

async function rbPut(i, det) {
  const p = RB.pending[i];
  const it = p.item;
  const r = rbShowCheck(det, it);
  if (!r.ok) { $('#rbMsg').textContent = '검산을 통과해야 넣을 수 있어요.'; return; }
  const item = rbItem(it);
  /* 문항을 더했으면 counts 도 다시 세야 한다 — 손으로 세지 않고 **병합기와 같은 함수**를 쓴다
     (assemble 이 counts 를 무시하고 다시 센다). 안 그러면 'counts 불일치'로 저장이 막힌다. */
  const merged = Object.assign({}, RB.pack, { items: (RB.pack.items || []).concat([item]) });
  const next = WBKOCHECK.assemble([{ name: RB.packId, json: merged }]).pack;
  /* 팩에 넣기 전에 팩 전체를 다시 검증한다 — 한 문항 때문에 배포가 막히면 안 된다 */
  const chk = WBKOCHECK.checkPack(next, CONCEPTS ? { concepts: CONCEPTS } : {});
  if (chk.errors.length) { $('#rbMsg').textContent = '팩 검증 실패: ' + chk.errors[0]; return; }
  try {
    await api('/naesin-ko/admin/pack', { method: 'POST', body: JSON.stringify({ id: RB.packId, pack: next }) });
    RB.pack = next;
    RB.pending.splice(i, 1);
    delete RB.draft[rbKey(it)];
    await api('/naesin-ko/admin/pending', { method: 'POST',
      body: JSON.stringify({ id: RB.packId, pending: RB.pending }) });
    /* 화면 전체를 다시 그리지 않는다 — 그리면 저작 중이던 목록과 방금 뜬 안내가 함께 사라진다.
       팩 목록·반 성취도는 이 저장으로 바뀌지 않으므로 이 카드만 갱신하면 된다. */
    rbRender();
    $('#rbMsg').textContent = `팩에 넣었어요 — 남은 ${RB.pending.length}문항`;
    $('#btnRbSave').disabled = !RB.pending.length;
  } catch (e) { $('#rbMsg').textContent = e.message; }
}

function rbBind() {
  $('#btnRbLoad').onclick = rbLoad;
  $('#btnRbSave').onclick = () => {
    /* 저작한 것은 KV 에만 두지 않는다 — 작업 폴더에 남겨야 다시 만들 때 잃지 않는다 */
    const out = { packId: RB.packId, savedAt: new Date().toISOString(),
      rubrics: RB.pending.map((p) => ({ itemId: p.item.id, no: p.item.source && p.item.source.no, rubric: rbBuild(p.item) }))
        .filter((x) => x.rubric.length) };
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' }));
    a.download = RB.packId + '-rubrics.json';
    a.click();
  };
  $('#rbList').addEventListener('click', (e) => {
    const det = e.target.closest('details.rub');
    if (!det) return;
    const tok = e.target.closest('[data-tok]');
    if (tok) {
      /* 마지막으로 손댄 키워드 칸에 넣는다 — 없으면 첫 칸 */
      const inputs = [...det.querySelectorAll('[data-f="kw"]')];
      const box = inputs.filter((x) => x === document.activeElement)[0] || det._lastKw || inputs[0];
      if (box) {
        const v = box.value.trim();
        box.value = v ? v + ', ' + tok.getAttribute('data-tok') : tok.getAttribute('data-tok');
        det._lastKw = box;
      }
      return;
    }
    if (e.target.closest('[data-add]')) {
      const { it } = rbSync(det);
      rbDraftOf(it).push({ element: '', kw: '', points: '' });
      rbRender(); document.querySelector(`details.rub[data-i="${det.getAttribute('data-i')}"]`).open = true;
      return;
    }
    const del = e.target.closest('[data-del]');
    if (del) {
      const { it } = rbSync(det);
      const d = rbDraftOf(it);
      if (d.length > 1) d.splice(Number(del.getAttribute('data-del')), 1);
      rbRender(); document.querySelector(`details.rub[data-i="${det.getAttribute('data-i')}"]`).open = true;
      return;
    }
    if (e.target.closest('[data-check]')) { const { it } = rbSync(det); rbShowCheck(det, it); return; }
    if (e.target.closest('[data-put]')) { const { i, it } = rbSync(det); rbPut(i, det); return; }
  });
  $('#rbList').addEventListener('focusin', (e) => {
    if (e.target.matches('[data-f="kw"]')) { const d = e.target.closest('details.rub'); if (d) d._lastKw = e.target; }
  });
}

function bind() {
  rbBind();
  $('#files').onchange = async (e) => {
    const files = [...e.target.files];
    const out = $('#checkOut');
    if (!files.length) { out.innerHTML = ''; return; }
    const parsed = [];
    for (const f of files) {
      try { parsed.push({ name: f.name, json: JSON.parse(await f.text()) }); }
      catch (err) { parsed.push({ name: f.name, json: null }); }
    }
    /* 검수 파일(review.json)은 **팩에 넣지 않는다.** assemble 은 모르는 최상위 키를 팩 루트로
       복사하므로 그냥 두면 초안이 학생 기기까지 간다(§7[3]). 따로 빼서 루브릭 저작 목록으로 보낸다. */
    PENDING_UP = null;
    for (let i = parsed.length - 1; i >= 0; i--) {
      const j = parsed[i].json;
      if (j && Array.isArray(j.pending) && !j.works && !j.sets && !j.items && !j.work) {
        PENDING_UP = { id: String(j.packId || '').trim(), pending: j.pending };
        parsed.splice(i, 1);
      }
    }
    if (!CONCEPTS) {
      try { CONCEPTS = await (await fetch('/naesin-ko/concepts.json')).json(); } catch (err) { CONCEPTS = null; }
    }
    const { pack, notes } = WBKOCHECK.assemble(parsed);
    const r = WBKOCHECK.checkPack(pack, CONCEPTS ? { concepts: CONCEPTS } : {});
    ASSEMBLED = r.ok ? pack : null;
    const errs = notes.concat(r.errors);
    out.innerHTML = `<div class="issues ${errs.length ? 'bad' : (r.warns.length ? 'warn' : 'ok')}">
      <div><b>${esc(pack.packId || '(packId 없음)')}</b> — ${r.summary.map(esc).join(' · ')}</div>
      ${errs.map((x) => `<div>✗ ${esc(x)}</div>`).join('')}
      ${r.warns.map((x) => `<div>! ${esc(x)}</div>`).join('')}
      ${!errs.length ? '<div>✓ 오류 없음 — 업로드할 수 있어요.</div>' : ''}
      ${PENDING_UP ? `<div>· 검수 파일도 함께 올립니다 — 대기 ${PENDING_UP.pending.length}건(팩에는 안 들어갑니다).</div>` : ''}</div>`;
    $('#btnUpload').disabled = !ASSEMBLED;
  };

  $('#btnUpload').onclick = async () => {
    if (!ASSEMBLED) return;
    try {
      await api('/naesin-ko/admin/pack', { method: 'POST', body: JSON.stringify({ id: ASSEMBLED.packId, pack: ASSEMBLED }) });
      let extra = '';
      if (PENDING_UP && PENDING_UP.id === ASSEMBLED.packId) {
        const r = await api('/naesin-ko/admin/pending', { method: 'POST', body: JSON.stringify(PENDING_UP) });
        extra = ` · 검수 대기 ${r.count}건`;
      } else if (PENDING_UP) {
        extra = ' · 검수 파일의 packId 가 팩과 달라 건너뛰었어요';
      }
      $('#upMsg').textContent = '업로드 완료' + extra;
      ASSEMBLED = null; PENDING_UP = null; refresh();
    } catch (e) { $('#upMsg').textContent = e.message; }
  };

  $('#btnExam').onclick = async () => {
    const packIds = [...document.querySelectorAll('#exPacks input:checked')].map((i) => i.value);
    const w = Number($('#exW').value);
    const profile = {
      mcCount: $('#exMc').value === '' ? null : Number($('#exMc').value),
      essayCount: $('#exEs').value === '' ? null : Number($('#exEs').value),
      essayWeight: $('#exW').value === '' ? null : (w > 1 ? w / 100 : w)
    };
    try {
      await api('/naesin-ko/admin/exam', { method: 'POST', body: JSON.stringify({
        scope: $('#exScope').value.trim(), examDate: $('#exDate').value, packIds, profile }) });
      $('#exMsg').textContent = '등록 완료';
    } catch (e) { $('#exMsg').textContent = e.message; }
  };

  $('#btnTask').onclick = async () => {
    const typeKeys = [...document.querySelectorAll('#tkTypes input:checked')].map((i) => i.value);
    try {
      await api('/naesin-ko/admin/task', { method: 'POST', body: JSON.stringify({
        date: $('#tkDate').value, title: $('#tkTitle').value.trim(),
        typeKeys, packId: $('#tkPack').value || undefined }) });
      $('#tkMsg').textContent = '배정 완료';
    } catch (e) { $('#tkMsg').textContent = e.message; }
  };

  $('#btnOvLoad').onclick = async () => {
    try {
      const j = await api('/naesin-ko/admin/overlay?scope=' + encodeURIComponent($('#ovScope').value.trim() || 'default'));
      const o = j.overlay || {};
      $('#ovOver').value = (o.overrides || []).map((x) => `${x.targetRef} | ${(x.answers || []).join(' / ')}${x.note ? ' | ' + x.note : ''}`).join('\n');
      $('#ovNotes').value = (o.notes || []).map((n) => `${n.workId} | ${n.text}`).join('\n');
      $('#ovMsg').textContent = '불러왔어요';
    } catch (e) { $('#ovMsg').textContent = e.message; }
  };

  $('#btnOv').onclick = async () => {
    const overrides = $('#ovOver').value.split('\n').map((l) => l.split('|').map((s) => s.trim()))
      .filter((p) => p[0] && p[1])
      .map((p) => ({ targetRef: p[0], answers: p[1].split('/').map((s) => s.trim()).filter(Boolean), note: p[2] || '' }));
    const notes = $('#ovNotes').value.split('\n').map((l) => l.split('|').map((s) => s.trim()))
      .filter((p) => p[0] && p[1]).map((p) => ({ workId: p[0], text: p.slice(1).join(' | ') }));
    try {
      await api('/naesin-ko/admin/overlay', { method: 'POST', body: JSON.stringify({
        scope: $('#ovScope').value.trim() || 'default', overrides, notes }) });
      $('#ovMsg').textContent = `저장 완료 (덮어쓰기 ${overrides.length} · 메모 ${notes.length})`;
    } catch (e) { $('#ovMsg').textContent = e.message; }
  };

  $('#reviewList').onclick = async (e) => {
    const b = e.target.closest('[data-rv]');
    if (!b) return;
    const code = b.getAttribute('data-code'), itemId = b.getAttribute('data-item');
    const key = `${code}|${itemId}`;
    const pt = document.querySelector(`[data-pt="${key}"]`);
    const cm = document.querySelector(`[data-cm="${key}"]`);
    try {
      await api('/naesin-ko/admin/review', { method: 'POST', body: JSON.stringify({
        code, itemId, verdict: b.getAttribute('data-rv'),
        points: pt && pt.value !== '' ? Number(pt.value) : undefined,
        comment: cm ? cm.value : '' }) });
      refresh();
    } catch (err) { alert(err.message); }
  };
}

$('#btnLogout').onclick = () => { TOKEN = null; localStorage.removeItem('wbr.admin.token'); renderLogin(); };
if (TOKEN) refresh(); else renderLogin();
</script>
</body>
</html>
