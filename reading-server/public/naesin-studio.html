<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>WB 내신브레인 · 팩 제작</title>
  <style>
    :root{--navy:#173957;--blue:#087ba6;--sky:#eaf7fb;--bg:#f3f7f8;--line:#d9e5e9;--muted:#647784;--ink:#20384c;--ok:#14755e;--warn:#8a4b08;--bad:#9b352b;--coral:#c9503c}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;line-height:1.6}
    header{display:flex;align-items:center;gap:14px;padding:13px 20px;background:var(--navy);color:#fff}
    header b{font-size:17px}header small{opacity:.75}
    header .sp{flex:1}
    .hbtn{min-height:38px;padding:6px 14px;border:1px solid #ffffff55;border-radius:10px;background:transparent;color:#fff;font-weight:800;cursor:pointer}
    @media (max-width:600px){header{flex-wrap:wrap;gap:8px}header b,header small{flex-basis:100%}header .sp{display:none}header .hbtn{flex:0 0 auto}}
    main{max-width:1180px;margin:auto;padding:18px 14px 60px}
    .card{margin-bottom:14px;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:#fff}
    h2{margin:0 0 6px;color:var(--navy);font-size:17px}
    h3{margin:12px 0 6px;color:var(--navy);font-size:14px}
    button{font:inherit;cursor:pointer}
    input,select,textarea{font:inherit;padding:0 10px;border:1.5px solid #bfd7e1;border-radius:10px;background:#fff;color:var(--ink)}
    input,select{min-height:42px}
    textarea{padding:8px 10px;line-height:1.5;width:100%;resize:vertical}
    .btn{min-height:42px;padding:6px 16px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:900}
    .btn.ghost{background:#fff;border:1.5px solid #bfd7e1;color:var(--navy)}
    .btn.sm{min-height:32px;padding:3px 10px;font-size:12.5px}
    .btn.danger{background:#fff;border:1.5px solid #efc2bb;color:var(--bad)}
    .btn.go{background:var(--ok)}
    .btn:disabled{opacity:.45;cursor:default}
    .tag{display:inline-block;padding:3px 9px;border-radius:999px;background:var(--sky);color:var(--blue);font-size:12px;font-weight:800}
    .tag.ok{background:#e7f6f0;color:var(--ok)}.tag.bad{background:#fff0ef;color:var(--bad)}.tag.warn{background:#fff4e6;color:var(--warn)}.tag.muted{background:#eef2f4;color:var(--muted)}
    .stats{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 2px}
    .stat{flex:1;min-width:104px;padding:10px;border:1px solid #d6ebf4;border-radius:12px;background:#f5fbfe;text-align:center}
    .stat b{display:block;font-size:20px;color:var(--navy)}
    .stat span{font-size:12px;color:var(--muted);font-weight:800}
    .stat.warn{background:#fff0ef;border-color:#efc2bb}.stat.warn b{color:var(--bad)}
    .tbl{overflow-x:auto}
    table{border-collapse:collapse;width:100%;font-size:13.5px;white-space:nowrap}
    th{background:#f0f5f7;color:var(--navy);font-size:12px}
    th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
    tbody tr:nth-child(even) td{background:#f8fcfe}
    .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
    .chip{min-height:36px;padding:5px 13px;border-radius:999px;border:1.5px solid #bfd7e1;background:#fff;font-weight:800;color:var(--navy)}
    .chip[aria-pressed="true"]{background:var(--sky);border-color:var(--blue)}
    .grid-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end}
    .err{color:var(--bad);font-weight:700;font-size:13px;margin-top:8px}
    .muted{color:var(--muted);font-size:12.5px}
    #loginCard{max-width:380px;margin:60px auto}
    .issues{margin:8px 0 0;padding:10px 12px;border-radius:10px;font-size:13px}
    .issues.bad{background:#fff0ef}.issues.warn{background:#fff4e6}.issues.ok{background:#e7f6f0}
    .issues div{margin:2px 0}
    .banner{display:flex;gap:10px;align-items:center;max-width:1180px;margin:12px auto -6px;padding:10px 14px;border-radius:12px;background:#fff0ef;color:var(--bad);font-weight:800;font-size:13.5px}
    .banner[hidden]{display:none}
    .banner .sp{flex:1}
    label.fld{display:block;font-size:12px;font-weight:800;color:var(--muted)}
    label.fld input,label.fld select{width:100%}

    /* ── 검수 두 칸 ──
       왼쪽은 구매 자료에서 뽑은 원천, 오른쪽은 추출된 행. 원문을 옆에 두지 않으면
       "이 행이 맞나"를 판단할 근거가 화면에 없다. 좁은 화면에서는 위아래로 쌓인다. */
    .panes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:12px;align-items:start}
    @media (max-width:900px){.panes{grid-template-columns:1fr}}
    .pane{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
    .pane>h3{margin:0;padding:9px 12px;background:#f0f5f7;border-bottom:1px solid var(--line);font-size:13px}
    #srcText{margin:0;padding:10px 12px;max-height:66vh;overflow:auto;white-space:pre-wrap;word-break:break-word;
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.65;color:var(--ink)}
    #srcText mark{background:#ffe9a8;color:var(--ink);border-radius:3px;padding:0 1px}
    #rowList{max-height:66vh;overflow:auto;padding:6px}
    .row{padding:8px 10px;border:1.5px solid transparent;border-radius:10px;margin-bottom:5px;background:#fbfdfe}
    .row[aria-selected="true"]{border-color:var(--blue);background:var(--sky)}
    .row .rh{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
    .row .rt{font-weight:800;font-size:13.5px;word-break:break-word;flex:1;min-width:0}
    .row .rs{font-size:12.5px;color:var(--muted);word-break:break-word;margin-top:1px}
    .row .ri{margin-top:4px;font-size:12px;font-weight:800;word-break:break-word}
    .row .ri.bad{color:var(--bad)}.row .ri.warn{color:var(--warn)}
    .row .ra{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
    .row.dropped .rt,.row.dropped .rs{text-decoration:line-through;color:var(--muted)}
    .row textarea[data-ed]{margin-top:6px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;min-height:190px}
    .keys{font-size:12px;color:var(--muted);font-weight:700}
    .keys kbd{display:inline-block;min-width:17px;padding:0 4px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:#fff;font:inherit;font-weight:800;text-align:center}
    .srcrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:7px 0;border-top:1px solid var(--line)}
    .srcrow:first-of-type{border-top:0}
  </style>
</head>
<body>
<header><b>WB 내신브레인 · 팩 제작</b><small>원천·초안 → 검수 → 배포</small><span class="sp"></span>
  <button class="hbtn" onclick="location.href='/admin/naesin-admin.html'">운영 관리</button>
  <button class="hbtn" onclick="location.href='/admin/naesin-live.html'">수업 화면</button>
  <button class="hbtn" id="btnRefresh" hidden>새로고침</button>
  <button class="hbtn" id="btnLogout" hidden>로그아웃</button>
</header>
<div class="banner" id="banner" role="alert" hidden><span id="bannerMsg"></span><span class="sp"></span><button class="btn sm ghost" id="bannerClose">닫기</button></div>
<main id="app"></main>
<script src="/admin/admin-login.js"></script>
<script src="/admin/pack-check.js"></script>
<script>
'use strict';
/* WB 내신브레인 팩 제작 스튜디오 — 원장·강사용 (기획서 §15-2).
   운영 화면(naesin-admin.html)과 인증·말투를 공유하고 역할만 나눈다. 여기는 만들기,
   저기는 배정·성취도다. 서버 계약은 reading-server/naesin-studio.mjs 하나뿐이다.

   라이선스: 왼쪽 칸의 원천 텍스트와 추출 초안은 구매 자료에서 나온 것이다. 화면에만
   띄우고 localStorage 에도 남기지 않는다 — 새로고침하면 서버에서 다시 받아 온다.
   원천에는 마크업이 섞여 들어올 수 있으므로 모든 표시 값을 esc() 로 감싼다. */
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=Number(v);return Number.isFinite(n)?Math.round(n):null;};
let TOKEN=localStorage.getItem('wbr.admin.token')||null;

/* 서버가 아는 추출 종류(naesin-extract.mjs KINDS)와 그 종류가 함께 만들어 내는 곁딸린 배열.
   words 추출은 단어만, sentences 추출은 문장 + 어색한 문장 찾기 + 종합 Check 까지 낸다. */
const KINDS=['words','sentences','dialogues','patterns','items'];
const DRAFT_KINDS=KINDS.concat(['oddOneItems','checkItems','keyExpressions','functions','vocabSidebar','readingQA']);
const KIND_KO={words:'단어',sentences:'본문 문장',dialogues:'대화문',patterns:'문법 패턴',items:'저장 문항',
  keyExpressions:'핵심 표현',functions:'의사소통 기능',oddOneItems:'어색한 문장 찾기',checkItems:'종합 Check'};
const kindKo=k=>KIND_KO[k]||k;
const STATE_KO={pending:'미검토',ok:'승인',fixed:'수정',dropped:'버림'};
const STATUS_KO={draft:'원천만',review:'검수 중',ready:'배포 대기',published:'배포됨',failed:'실패'};
/* 추출 실패 사유 — 서버 reason 을 사람 말로. no-key 는 실패가 아니라 '다른 길로 가라'는 안내다. */
const REASON_KO={'no-key':'AI 키가 서버에 없어요 — 아래 「초안 JSON 붙여넣기」로 진행하세요.',
  quota:'오늘 AI 사용 한도를 넘었어요.',network:'AI 서버에 닿지 못했어요.',refused:'AI가 응답을 거절했어요.',
  parse:'AI 응답이 JSON 이 아니었어요.',shape:'AI 응답의 모양이 달라요.',empty:'원천 텍스트가 비어 있어요.',
  'bad-kind':'추출 종류가 올바르지 않아요.'};
const reasonKo=r=>REASON_KO[r]||(/^api-/.test(String(r))?('AI 서버 오류('+r+')'):('추출 실패('+r+')'));

let VIEW='list';        // 'list' | 'job'
let JOBS=null;          // 작업 목록 (null = 아직 못 받음)
let JOB=null,GATE=null,SRC={};   // 열어 둔 작업 하나
let SEL=null;           // 선택된 행의 검수 키 — 키보드 조작과 원천 강조의 기준
let EDIT=null;          // 편집 중인 행의 검수 키
let PDF_WORD_EDIT=null; // 일반 단어 교정 입력은 현재 작업의 브라우저에만 둔다
let FKIND='all',FONLY='issue';   // 필터: 종류 · 무엇만 볼지('issue'|'pending'|'all')
let NEWSRC=[];          // 새 작업에 붙인 원천 [{name,kind,text}] — 만들기 전까지 화면에만 있다
let BUSY=false;
let PDF_LOCAL=null,JOB_READ=0;   // 본문 미대응 열은 현재 작업의 브라우저 메모리에만 둔다
let PDF_VIEW=null,PDF_READ=0;
function clearPdfView(){PDF_READ++;if(PDF_VIEW&&PDF_VIEW.url)URL.revokeObjectURL(PDF_VIEW.url);PDF_VIEW=null;}

async function api(path,opt){
  let r;const token=TOKEN,read=JOB_READ;
  try{r=await fetch('/api'+path,Object.assign({headers:{'Content-Type':'application/json',...(TOKEN?{Authorization:'Bearer '+TOKEN}:{})}},opt||{}));}
  catch(e){const err=new Error('네트워크 오류 — 연결을 확인하고 다시 시도하세요.');err.network=true;throw err;}
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&token){if(TOKEN===token&&JOB_READ===read){TOKEN=null;localStorage.removeItem('wbr.admin.token');renderLogin('세션이 만료됐어요. 다시 로그인해 주세요.');}throw new Error('auth');}
  if(!r.ok){const err=new Error(j.error||('HTTP '+r.status));err.status=r.status;err.body=j;throw err;}
  return j;
}
const isAuth=e=>!!e&&e.message==='auth';
function showBanner(msg){$('#bannerMsg').textContent=msg;$('#banner').hidden=false;}
function hideBanner(){$('#banner').hidden=true;}
function fail(e){if(isAuth(e))return;showBanner(e.message||String(e));}
function fmtLast(t){if(!t)return '—';const d=(Date.now()-new Date(t))/60000;if(!Number.isFinite(d))return '—';
  if(d<2)return '방금';if(d<60)return Math.round(d)+'분 전';if(d<1440)return Math.round(d/60)+'시간 전';return Math.round(d/1440)+'일 전';}

function renderLogin(msg){
  clearPdfView();
  VIEW='login';JOB=null;GATE=null;SRC={};SEL=null;EDIT=null;PDF_WORD_EDIT=null;PDF_LOCAL=null;NEWSRC=[];JOBS=null;JOB_READ++;
  $('#btnRefresh').hidden=true;$('#btnLogout').hidden=true;hideBanner();
  /* 로그인 폼은 공용 모듈이 그린다(아이디·비밀번호 기본, PIN 갈래로 전환) — reading-server/public/admin-login.js */
  $('#app').innerHTML='<div class="card" id="loginCard"><h2>강사 로그인</h2><div id="loginHost"></div></div>';
  WBAdminLogin.mount({host:'#loginHost',message:msg||'',classes:{btn:'btn'},onToken:function(t){TOKEN=t;try{localStorage.setItem('wbr.admin.token',TOKEN);}catch(e){}openList();}});
}

/* ── 행 요약 ──
   종류마다 모양이 다르다. 검수자는 "이 행이 원문과 같은가"만 보므로 한 줄 제목 + 한 줄 부제로 줄인다. */
function rowSummary(kind,row){
  const r=(row&&typeof row==='object')?row:{};
  const j=(a,sep)=>(Array.isArray(a)?a:[]).filter(x=>x!=null&&x!=='').join(sep||', ');
  if(kind==='words')return {t:String(r.headword==null?'?':r.headword),s:j(r.meaningKo)+(r.example&&r.example.en?(' · 예문: '+r.example.en):'')};
  if(kind==='sentences')return {t:(r.seq!=null?r.seq+'. ':'')+String(r.en==null?'?':r.en),s:String(r.ko==null?'':r.ko)+(r.dayGroup?(' · 단락 '+r.dayGroup):'')};
  if(kind==='oddOneItems')return {t:String(r.id||'?')+' · '+(r.kind==='grammatical'?'어법':'어휘'),s:'정답 '+(num(r.answerIdx)!=null?(num(r.answerIdx)+1)+'번':'?')+' → '+String(r.correction==null?'':r.correction)};
  if(kind==='checkItems')return {t:String(r.id||'?')+' · '+String(r.slot||'?'),s:String(r.promptKo||r.textEn||r.ko||'')};
  if(kind==='dialogues'){const ln=Array.isArray(r.lines)?r.lines:[];return {t:String(r.title||('대화 '+(r.id||'')))+' · '+ln.length+'줄',s:ln.length?(String(ln[0].speaker||'')+': '+String(ln[0].en||'')):''};}
  if(kind==='patterns')return {t:(r.patternNo!=null?r.patternNo+'. ':'')+String(r.title||'?'),s:String(r.conceptKo||'')};
  if(kind==='functions')return {t:String(r.name||'?'),s:String(r.pattern||'')+' · '+String(r.explainKo||'')};
  if(kind==='keyExpressions')return {t:String(r.en||'?'),s:String(r.ko||'')};
  if(kind==='items')return {t:(r.no!=null?r.no+'. ':'')+String(r.formatType||'?'),s:String(r.instructionKo||r.questionKo||r.question||r.promptKo||'')+' · 정답 '+j(r.answer,' ')};
  return {t:JSON.stringify(r).slice(0,80),s:''};
}
/* 원천에서 이 행을 찾을 때 쓰는 실마리 — 원문에 그대로 있는 영어가 가장 낫다 */
function anchorOf(kind,row){
  const r=(row&&typeof row==='object')?row:{};
  if(kind==='words')return r.headword;
  if(kind==='sentences')return r.en;
  if(kind==='oddOneItems'){const l=Array.isArray(r.sentences)?r.sentences:[];return l.length?l[0].text:r.correction;}
  if(kind==='checkItems')return r.textEn||(Array.isArray(r.tokens)?r.tokens.join(' '):'')||r.promptKo;
  if(kind==='dialogues'){const l=Array.isArray(r.lines)?r.lines:[];return l.length?l[0].en:r.title;}
  if(kind==='patterns')return r.title;
  if(kind==='functions')return r.name;
  if(kind==='keyExpressions')return r.en;
  if(kind==='items')return r.instructionKo||r.question||r.questionKo||r.stem;
  return '';
}

/* ── 검수 키 ──
   서버 rowKey 와 한 글자도 다르면 승인이 엉뚱한 행에 붙는다(naesin-studio.mjs rowKey 참조) */
function rowKey(kind,row,i){
  const r=(row&&typeof row==='object')?row:{};
  const own=r.id!=null?String(r.id):r.seq!=null?('s'+r.seq):r.no!=null?('n'+r.no):r.patternNo!=null?('p'+r.patternNo):('i'+i);
  return kind+':'+own;
}
/* 검사 메시지는 'words[3](apple) …' 로 시작한다 — 그 대괄호 번호가 조립된 팩의 인덱스다.
   버린 행은 조립에서 빠지므로, 초안 인덱스로 되돌리려면 살아남은 순서를 다시 세야 한다. */
function issueIndex(){
  const draft=(JOB&&JOB.draft)||{},review=(JOB&&JOB.review)||{};
  const map={};   // kind → [초안 인덱스] (조립 순서)
  for(const kind of Object.keys(draft)){
    const rows=Array.isArray(draft[kind])?draft[kind]:[];
    map[kind]=[];
    rows.forEach((row,i)=>{const rv=review[rowKey(kind,row,i)];if(rv&&rv.state==='dropped')return;map[kind].push(i);});
  }
  const byKey={},loose=[];
  const put=(list,sev)=>(list||[]).forEach(it=>{
    const m=/^([A-Za-z]+)\[(\d+)\]/.exec(String(it&&it.message||''));
    const kind=m&&m[1],ai=m?Number(m[2]):-1;
    const di=(kind&&map[kind]&&map[kind][ai]!=null)?map[kind][ai]:null;
    if(di==null){loose.push({sev,...it});return;}
    const rows=draft[kind];
    const key=rowKey(kind,rows[di],di);
    (byKey[key]=byKey[key]||[]).push({sev,message:it.message});
  });
  put(GATE&&GATE.errors,'bad');put(GATE&&GATE.warns,'warn');
  return {byKey,loose};
}

/* 화면에 그릴 행 목록 — 필터를 적용한 평평한 배열 */
function visibleRows(byKey){
  const draft=(JOB&&JOB.draft)||{},review=(JOB&&JOB.review)||{};
  const out=[];
  for(const kind of Object.keys(draft)){
    if(FKIND!=='all'&&FKIND!==kind)continue;
    (Array.isArray(draft[kind])?draft[kind]:[]).forEach((row,i)=>{
      const key=rowKey(kind,row,i);
      const rv=review[key]||{state:'pending'};
      const iss=byKey[key]||[];
      if(FONLY==='issue'&&!iss.length)return;
      if(FONLY==='pending'&&rv.state!=='pending')return;
      out.push({kind,row,i,key,state:rv.state,note:rv.note||'',patch:rv.patch||null,issues:iss});
    });
  }
  return out;
}

/* ── 원천 강조 ──
   공백·대소문자를 지운 사본에서 찾고 원본 위치로 되돌린다. 추출된 문장은 원문의 줄바꿈이
   지워진 경우가 많아 그냥 indexOf 로는 거의 못 찾는다. */
function flatten(s){
  let f='';const idx=[];
  for(let i=0;i<s.length;i+=1){const c=s[i];if(/\s/.test(c))continue;f+=c.toLowerCase();idx.push(i);}
  return {f,idx};
}
function srcHtml(text,anchor){
  const t=String(text||'');
  const a=String(anchor||'').trim();
  if(!t)return '<span class="muted">이 종류의 원천 텍스트가 없어요. (초안만 넣은 작업)</span>';
  if(a.length>=3){
    const F=flatten(t),N=flatten(a);
    if(N.f){
      const p=F.f.indexOf(N.f);
      if(p>=0){
        const s=F.idx[p],e=F.idx[p+N.f.length-1]+1;
        return esc(t.slice(0,s))+'<mark id="srcHit">'+esc(t.slice(s,e))+'</mark>'+esc(t.slice(e));
      }
    }
  }
  return esc(t);
}

function addSrc(){

  const kind=$('#nKind').value;

async function createJob(){
  const lesson=$('#nLesson').value;
  const b={packId:$('#nPack').value.trim(),
    meta:{curriculum:$('#nCur').value.trim(),textbook:$('#nText').value.trim(),grade:$('#nGrade').value.trim(),

    sources:NEWSRC};
  try{
    const j=await api('/naesin/admin/job',{method:'POST',body:JSON.stringify(b)});
    NEWSRC=[];hideBanner();openJob(j.jobId);
  }catch(e){if(isAuth(e))return;$('#nOut').innerHTML='<p class="err">'+esc(e.message)+'</p>';}

async function delJob(id){
  if(!confirm('작업과 원천 텍스트를 지웁니다. 이미 배포한 팩은 남습니다. 계속할까요?'))return;
  try{await api('/naesin/admin/job',{method:'DELETE',body:JSON.stringify({jobId:id})});openList();}
  catch(e){fail(e);}
}

async function readJob(id,read,token){
  const j=await api('/naesin/admin/job?id='+encodeURIComponent(id)+'&src=1');
  if(read!==JOB_READ||TOKEN!==token||VIEW!=='job')return false;
  if(!j.job||j.job.jobId!==id)throw new Error('작업 재조회에 실패했어요.');
  if(JOB&&JOB.jobId===id&&Date.parse(j.job.updatedAt)<Date.parse(JOB.updatedAt))return true;
  JOB=j.job;GATE=j.gate;SRC=j.sources||{};hideBanner();return true;
}
async function openJob(id){
  const read=++JOB_READ,token=TOKEN;
  if(PDF_VIEW&&(PDF_VIEW.jobId!==id||PDF_VIEW.token!==token||PDF_VIEW.busy))clearPdfView();
  if(PDF_LOCAL&&PDF_LOCAL.jobId!==id)PDF_LOCAL=null;
  if(PDF_WORD_EDIT&&PDF_WORD_EDIT.jobId!==id)PDF_WORD_EDIT=null;
  VIEW='job';EDIT=null;SEL=null;FKIND='all';FONLY='issue';
  try{
    if(!await readJob(id,read,token))return;
  }catch(e){if(read!==JOB_READ||TOKEN!==token||VIEW!=='job'||isAuth(e))return;fail(e);if(!JOB||JOB.jobId!==id)openList();return;}
  renderJob();
}

async function savePdfWord(){
  const f=PDF_WORD_EDIT;if(!JOB||!f||f.busy||EDIT!==f.key||JOB.jobId!==f.jobId)return;
  const read=JOB_READ,token=TOKEN,current=()=>JOB&&JOB.jobId===f.jobId&&JOB_READ===read&&TOKEN===token&&VIEW==='job'&&PDF_WORD_EDIT===f;
  const meaningKo=f.meaningKo.split(/\r?\n/).map(s=>s.trim()).filter(Boolean),sections=[];
  if(f.reading)sections.push('reading');if(f.conversation)sections.push('conversation');
  if(!f.headword.trim()||!meaningKo.length||!sections.length){f.message='표제어·뜻을 입력하고 본문 또는 대화를 직접 선택하세요.';$('#pdfWordOut').textContent=f.message;return;}
  if(f.baseUpdatedAt!==JOB.updatedAt){f.message='작업이 바뀌었어요. 입력을 유지했습니다. 입력을 확인한 뒤 취소하고 최신 원문을 대조해 다시 편집하세요.';$('#pdfWordOut').textContent=f.message;return;}
  const patch={...((JOB.review||{})[f.key]||{}).patch,headword:f.headword.trim(),pos:f.pos.trim(),meaningKo,sections};
  delete patch._pdfReview;
  f.busy=true;$('#pdfWordFields').disabled=true;
  try{
    if(await review(f.key,'fixed',patch)){
      if(!current())return;PDF_WORD_EDIT=null;EDIT=null;renderJob();
    }
  }finally{f.busy=false;if(current()){EDIT=f.key;renderJob();}}
}

    +pdfs.map(p=>'<option value="'+esc(p.source)+'"'+(p.source===source?' selected':'')+'>'+esc(p.source+' · '+p.file)+'</option>').join('')+'</select></label>'
    +'<p class="muted">'+esc(info.file)+' · '+page+'쪽'+(url?' · <a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">PDF 크게 보기</a>':'')+'</p>'
    +(view.message?'<p class="err" role="status">'+esc(view.message)+'</p><button class="btn sm ghost" id="btnPdfRetry">PDF 다시 열기</button>':view.busy?'<p class="muted" role="status">원본 PDF를 여는 중…</p>':'')+'</div>'
    +(url?'<iframe title="검수할 원본 PDF" src="'+esc(url)+'" style="display:block;width:100%;height:66vh;min-height:360px;border:0"></iframe>':'');
  $('#pdfSource').onchange=()=>{const next=$('#pdfSource').value;if(!pdfs.some(p=>p.source===next))return;clearPdfView();PDF_VIEW={jobId:JOB.jobId,token:TOKEN,source:next,rowKey:row.key,url:null,busy:false,message:''};renderPdfPreview(row);};

async function loadLocalPdf(){
  const view=PDF_VIEW,local=PDF_LOCAL,read=JOB_READ,request=++PDF_READ;
  if(!view||!local||!TOKEN)return;
  const current=()=>PDF_VIEW===view&&PDF_LOCAL===local&&TOKEN===view.token&&JOB&&JOB.jobId===view.jobId&&VIEW==='job'&&JOB_READ===read&&PDF_READ===request;
  const info=local.pdfs.find(p=>p.source===view.source);
  view.busy=true;
  renderSrc(visibleRows(issueIndex().byKey));
  try{
    const r=await fetch('/api/naesin/admin/job/local-pdf?id='+encodeURIComponent(view.jobId)+'&source='+view.source+'&sha256='+info.sha256,{headers:{Authorization:'Bearer '+view.token},cache:'no-store'});
    if(!current())return;
    if(r.status===401){TOKEN=null;localStorage.removeItem('wbr.admin.token');renderLogin('세션이 만료됐어요. 다시 로그인해 주세요.');return;}
    if(!r.ok){const body=await r.json().catch(()=>({}));throw new Error(body.error||'원본 PDF를 열지 못했어요. PC 자료를 다시 불러오세요.');}
    if(!/^application\/pdf(?:;|$)/i.test(r.headers.get('content-type')||''))throw new Error('원본 PDF 응답이 아니에요. PC 자료를 다시 불러오세요.');
    const blob=await r.blob();if(!current())return;
    view.url=URL.createObjectURL(blob);
  }catch(e){if(current())view.message=e.message||'원본 PDF를 열지 못했어요. 다시 시도하세요.';}
  finally{if(current()){view.busy=false;renderSrc(visibleRows(issueIndex().byKey));}}
}

/* ── 검수 저장 ──
   먼저 화면에 반영하고 서버에 보낸다(승인은 초당 여러 번 누르는 동작이라 왕복을 기다리면 못 쓴다).
   실패하면 되돌리고 배너를 띄운다 — 조용히 넘기면 승인한 줄 알고 배포를 누른다. */
async function review(key,state,patch,note){
  if(!JOB)return;
  const target=JOB,jobId=JOB.jobId,read=JOB_READ,token=TOKEN,baseUpdatedAt=JOB.updatedAt,before=JOB.review&&JOB.review[key];
  if(typeof baseUpdatedAt!=='string'||!baseUpdatedAt){showBanner('작업 버전이 없어요. 상단 새로고침으로 최신 작업을 읽은 뒤 다시 검수하세요.');return;}
  const current=()=>JOB&&JOB.jobId===jobId&&read===JOB_READ&&TOKEN===token&&VIEW==='job';
  const rec={...before,state};
  if(patch!==undefined){if(patch)rec.patch=patch;else delete rec.patch;}
  if(note!==undefined){if(note)rec.note=note;else delete rec.note;}
  JOB.review={...JOB.review,[key]:rec};
  if(!PDF_WORD_EDIT||PDF_WORD_EDIT.key!==key||EDIT!==key)EDIT=null;
  SEL=key;renderJob();
  let saved=false;
  try{
    const body={jobId,baseUpdatedAt,key,state};
    if(patch!==undefined)body.patch=patch;
    if(note!==undefined)body.note=note;
    await api('/naesin/admin/job/review',{method:'POST',body:JSON.stringify(body)});saved=true;
    if(!current()||!await readJob(jobId,read,token))return;
    renderJob();
    return true;
  }catch(e){
    if(isAuth(e)||!current())return;
    if(!saved&&JOB===target&&JOB.review[key]===rec){
      JOB.review={...JOB.review};if(before)JOB.review[key]=before;else delete JOB.review[key];renderJob();

async function bulkOk(){

function saveEdit(key){

async function runExtract(kind,btn){

    catch(e){bad.push(f.name+' — JSON 을 읽지 못했어요');continue;}

    if(isAuth(e)||!JOB||JOB.jobId!==id||read!==JOB_READ||TOKEN!==token||VIEW!=='job')return false;
    const message=saved?'초안 저장은 끝났지만 결과를 다시 읽지 못했어요. 입력을 유지했습니다. 상단 새로고침으로 저장 결과를 확인한 뒤 이어서 진행하세요.'
      :e.status===409?'다른 곳에서 작업이 바뀌었어요. 입력을 유지했습니다. 상단 새로고침으로 최신 작업을 읽고 확인한 뒤 다시 저장하세요.':e.message;
    $('#draftOut').innerHTML='<p class="err">'+esc(message)+'</p>';
    const out=errorSelector&&$(errorSelector);if(out)out.textContent=message;
    return false;
  }
}
async function publish(){
  if(!JOB)return;
  if(!confirm(JOB.packId+' 을(를) 배포합니다. 같은 id 의 팩이 있으면 덮어씁니다. 계속할까요?'))return;
  const btn=$('#btnPub');btn.disabled=true;btn.textContent='배포 중…';
  try{
    const j=await api('/naesin/admin/job/publish',{method:'POST',body:JSON.stringify({jobId:JOB.jobId})});
    await openJob(JOB.jobId);
    $('#pubOut').innerHTML='<div class="issues ok"><b>'+esc(j.packId)+' 배포 완료</b>'
      +'<div>운영 관리의 「레슨 팩」에 나타납니다. 학생이 받으려면 <b>시험 범위에 넣어야</b> 합니다 — 팩 커버리지 카드를 확인하세요.</div>'
      +(j.warns&&j.warns.length?'<div class="muted">경고 '+num(j.warns.length)+'건은 남아 있어요.</div>':'')+'</div>';
  }catch(e){
    if(isAuth(e))return;
    const b=e.body||{};
    $('#pubOut').innerHTML='<div class="issues bad"><b>'+esc(e.message)+'</b>'
      +((b.errors||[]).slice(0,8).map(x=>'<div>✕ ['+esc(x.where)+'] '+esc(x.message)+'</div>').join(''))
      +(b.pending?'<div>미검토 '+num(b.pending)+'행</div>':'')+'</div>';
    const p=$('#btnPub');if(p){p.disabled=!(GATE&&GATE.ok);p.textContent='배포';}
  }
}

/* ── 키보드 ──
   검수는 같은 동작을 수백 번 반복한다 — 마우스로만 하면 팩 하나에 반나절이 그대로 돌아온다.
   입력 칸에 있을 때는 가로채지 않는다(팩 id 에 'a'를 못 치면 안 된다). */
document.addEventListener('keydown',e=>{
  if(VIEW!=='job'||!JOB||!TOKEN)return;
  const t=e.target,tag=t&&t.tagName;
  if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA'){
    if(e.key==='Escape'&&((tag==='TEXTAREA'&&t.dataset.ed)||(PDF_WORD_EDIT&&EDIT===PDF_WORD_EDIT.key))){EDIT=null;PDF_WORD_EDIT=null;renderJob();}
    return;
  }
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const {byKey}=issueIndex();
  const rows=visibleRows(byKey);
  if(!rows.length)return;
  const at=Math.max(0,rows.findIndex(r=>r.key===SEL));
  if(e.key==='j'||e.key==='ArrowDown'){e.preventDefault();SEL=rows[Math.min(rows.length-1,at+1)].key;EDIT=null;renderJob();return;}
  if(e.key==='k'||e.key==='ArrowUp'){e.preventDefault();SEL=rows[Math.max(0,at-1)].key;EDIT=null;renderJob();return;}
  if(!SEL)return;
  if(e.key==='a'){e.preventDefault();review(SEL,'ok');return;}
  if(e.key==='x'){e.preventDefault();review(SEL,rows[at]&&rows[at].state==='dropped'?'pending':'dropped');return;}
  if(e.key==='e'){e.preventDefault();EDIT=SEL;renderJob();return;}
  if(e.key==='Escape'){EDIT=null;renderJob();}
});

$('#bannerClose').onclick=hideBanner;
$('#btnRefresh').onclick=()=>{if(VIEW==='job'&&JOB)openJob(JOB.jobId);else openList();};
$('#btnLogout').onclick=()=>{TOKEN=null;localStorage.removeItem('wbr.admin.token');renderLogin();};
if(TOKEN)openList();else renderLogin();
</script>
