<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>WB 내신브레인 · 팩 제작</title>
  <style>
    :root{--navy:#173957;--blue:#087ba6;--sky:#eaf7fb;--bg:#f3f7f8;--line:#d9e5e9;--muted:#647784;--ink:#20384c;--ok:#14755e;--warn:#8a4b08;--bad:#9b352b;--coral:#c9503c}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;line-height:1.6}
    header{display:flex;align-items:center;gap:14px;padding:13px 20px;background:var(--navy);color:#fff}
    header b{font-size:17px}header small{opacity:.75}
    header .sp{flex:1}
    .hbtn{min-height:38px;padding:6px 14px;border:1px solid #ffffff55;border-radius:10px;background:transparent;color:#fff;font-weight:800;cursor:pointer}
    main{max-width:1180px;margin:auto;padding:18px 14px 60px}
    .card{margin-bottom:14px;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:#fff}
    h2{margin:0 0 6px;color:var(--navy);font-size:17px}
    h3{margin:12px 0 6px;color:var(--navy);font-size:14px}
    button{font:inherit;cursor:pointer}
    input,select,textarea{font:inherit;padding:0 10px;border:1.5px solid #bfd7e1;border-radius:10px;background:#fff;color:var(--ink)}
    input,select{min-height:42px}
    textarea{padding:8px 10px;line-height:1.5;width:100%;resize:vertical}
    .btn{min-height:42px;padding:6px 16px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:900}
    .btn.ghost{background:#fff;border:1.5px solid #bfd7e1;color:var(--navy)}
    .btn.sm{min-height:32px;padding:3px 10px;font-size:12.5px}
    .btn.danger{background:#fff;border:1.5px solid #efc2bb;color:var(--bad)}
    .btn.go{background:var(--ok)}
    .btn:disabled{opacity:.45;cursor:default}
    .tag{display:inline-block;padding:3px 9px;border-radius:999px;background:var(--sky);color:var(--blue);font-size:12px;font-weight:800}
    .tag.ok{background:#e7f6f0;color:var(--ok)}.tag.bad{background:#fff0ef;color:var(--bad)}.tag.warn{background:#fff4e6;color:var(--warn)}.tag.muted{background:#eef2f4;color:var(--muted)}
    .stats{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 2px}
    .stat{flex:1;min-width:104px;padding:10px;border:1px solid #d6ebf4;border-radius:12px;background:#f5fbfe;text-align:center}
    .stat b{display:block;font-size:20px;color:var(--navy)}
    .stat span{font-size:12px;color:var(--muted);font-weight:800}
    .stat.warn{background:#fff0ef;border-color:#efc2bb}.stat.warn b{color:var(--bad)}
    .tbl{overflow-x:auto}
    table{border-collapse:collapse;width:100%;font-size:13.5px;white-space:nowrap}
    th{background:#f0f5f7;color:var(--navy);font-size:12px}
    th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
    tbody tr:nth-child(even) td{background:#f8fcfe}
    .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
    .chip{min-height:36px;padding:5px 13px;border-radius:999px;border:1.5px solid #bfd7e1;background:#fff;font-weight:800;color:var(--navy)}
    .chip[aria-pressed="true"]{background:var(--sky);border-color:var(--blue)}
    .grid-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end}
    .err{color:var(--bad);font-weight:700;font-size:13px;margin-top:8px}
    .muted{color:var(--muted);font-size:12.5px}
    #loginCard{max-width:380px;margin:60px auto}
    .issues{margin:8px 0 0;padding:10px 12px;border-radius:10px;font-size:13px}
    .issues.bad{background:#fff0ef}.issues.warn{background:#fff4e6}.issues.ok{background:#e7f6f0}
    .issues div{margin:2px 0}
    .banner{display:flex;gap:10px;align-items:center;max-width:1180px;margin:12px auto -6px;padding:10px 14px;border-radius:12px;background:#fff0ef;color:var(--bad);font-weight:800;font-size:13.5px}
    .banner[hidden]{display:none}
    .banner .sp{flex:1}
    label.fld{display:block;font-size:12px;font-weight:800;color:var(--muted)}
    label.fld input,label.fld select{width:100%}

    /* ── 검수 두 칸 ──
       왼쪽은 구매 자료에서 뽑은 원천, 오른쪽은 추출된 행. 원문을 옆에 두지 않으면
       "이 행이 맞나"를 판단할 근거가 화면에 없다. 좁은 화면에서는 위아래로 쌓인다. */
    .panes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:12px;align-items:start}
    @media (max-width:900px){.panes{grid-template-columns:1fr}}
    .pane{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
    .pane>h3{margin:0;padding:9px 12px;background:#f0f5f7;border-bottom:1px solid var(--line);font-size:13px}
    #srcText{margin:0;padding:10px 12px;max-height:66vh;overflow:auto;white-space:pre-wrap;word-break:break-word;
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.65;color:var(--ink)}
    #srcText mark{background:#ffe9a8;color:var(--ink);border-radius:3px;padding:0 1px}
    #rowList{max-height:66vh;overflow:auto;padding:6px}
    .row{padding:8px 10px;border:1.5px solid transparent;border-radius:10px;margin-bottom:5px;background:#fbfdfe}
    .row[aria-selected="true"]{border-color:var(--blue);background:var(--sky)}
    .row .rh{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
    .row .rt{font-weight:800;font-size:13.5px;word-break:break-word;flex:1;min-width:0}
    .row .rs{font-size:12.5px;color:var(--muted);word-break:break-word;margin-top:1px}
    .row .ri{margin-top:4px;font-size:12px;font-weight:800;word-break:break-word}
    .row .ri.bad{color:var(--bad)}.row .ri.warn{color:var(--warn)}
    .row .ra{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
    .row.dropped .rt,.row.dropped .rs{text-decoration:line-through;color:var(--muted)}
    .row textarea{margin-top:6px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;min-height:190px}
    .keys{font-size:12px;color:var(--muted);font-weight:700}
    .keys kbd{display:inline-block;min-width:17px;padding:0 4px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:#fff;font:inherit;font-weight:800;text-align:center}
    .srcrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:7px 0;border-top:1px solid var(--line)}
    .srcrow:first-of-type{border-top:0}
  </style>
</head>
<body>
<header><b>WB 내신브레인 · 팩 제작</b><small>원천·초안 → 검수 → 배포</small><span class="sp"></span>
  <button class="hbtn" onclick="location.href='/admin/naesin-admin.html'">운영 관리</button>
  <button class="hbtn" onclick="location.href='/admin/naesin-live.html'">수업 화면</button>
  <button class="hbtn" id="btnRefresh" hidden>새로고침</button>
  <button class="hbtn" id="btnLogout" hidden>로그아웃</button>
</header>
<div class="banner" id="banner" role="alert" hidden><span id="bannerMsg"></span><span class="sp"></span><button class="btn sm ghost" id="bannerClose">닫기</button></div>
<main id="app"></main>
<script src="/admin/admin-login.js"></script>
<script src="/admin/pack-check.js"></script>
<script>
'use strict';
/* WB 내신브레인 팩 제작 스튜디오 — 원장·강사용 (기획서 §15-2).
   운영 화면(naesin-admin.html)과 인증·말투를 공유하고 역할만 나눈다. 여기는 만들기,
   저기는 배정·성취도다. 서버 계약은 reading-server/naesin-studio.mjs 하나뿐이다.

   라이선스: 왼쪽 칸의 원천 텍스트와 추출 초안은 구매 자료에서 나온 것이다. 화면에만
   띄우고 localStorage 에도 남기지 않는다 — 새로고침하면 서버에서 다시 받아 온다.
   원천에는 마크업이 섞여 들어올 수 있으므로 모든 표시 값을 esc() 로 감싼다. */
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=Number(v);return Number.isFinite(n)?Math.round(n):null;};
let TOKEN=localStorage.getItem('wbr.admin.token')||null;

/* 서버가 아는 추출 종류(naesin-extract.mjs KINDS)와 그 종류가 함께 만들어 내는 곁딸린 배열.
   words 추출은 단어만, sentences 추출은 문장 + 어색한 문장 찾기 + 종합 Check 까지 낸다. */
const KINDS=['words','sentences','dialogues','patterns','items'];
const DRAFT_KINDS=KINDS.concat(['oddOneItems','checkItems','keyExpressions','functions','vocabSidebar','readingQA']);
const KIND_KO={words:'단어',sentences:'본문 문장',dialogues:'대화문',patterns:'문법 패턴',items:'저장 문항',
  oddOneItems:'어색한 문장 찾기',checkItems:'종합 Check'};
const kindKo=k=>KIND_KO[k]||k;
const STATE_KO={pending:'미검토',ok:'승인',fixed:'수정',dropped:'버림'};
const STATUS_KO={draft:'원천만',review:'검수 중',ready:'배포 대기',published:'배포됨',failed:'실패'};
/* 추출 실패 사유 — 서버 reason 을 사람 말로. no-key 는 실패가 아니라 '다른 길로 가라'는 안내다. */
const REASON_KO={'no-key':'AI 키가 서버에 없어요 — 아래 「초안 JSON 붙여넣기」로 진행하세요.',
  quota:'오늘 AI 사용 한도를 넘었어요.',network:'AI 서버에 닿지 못했어요.',refused:'AI가 응답을 거절했어요.',
  parse:'AI 응답이 JSON 이 아니었어요.',shape:'AI 응답의 모양이 달라요.',empty:'원천 텍스트가 비어 있어요.',
  'bad-kind':'추출 종류가 올바르지 않아요.'};
const reasonKo=r=>REASON_KO[r]||(/^api-/.test(String(r))?('AI 서버 오류('+r+')'):('추출 실패('+r+')'));

let VIEW='list';        // 'list' | 'job'
let JOBS=null;          // 작업 목록 (null = 아직 못 받음)
let JOB=null,GATE=null,SRC={};   // 열어 둔 작업 하나
let SEL=null;           // 선택된 행의 검수 키 — 키보드 조작과 원천 강조의 기준
let EDIT=null;          // 편집 중인 행의 검수 키
let FKIND='all',FONLY='issue';   // 필터: 종류 · 무엇만 볼지('issue'|'pending'|'all')
let NEWSRC=[];          // 새 작업에 붙인 원천 [{name,kind,text}] — 만들기 전까지 화면에만 있다
let BUSY=false;
let PDF_LOCAL=null,JOB_READ=0;   // 본문 미대응 열은 현재 작업의 브라우저 메모리에만 둔다

async function api(path,opt){
  let r;const token=TOKEN,read=JOB_READ;
  try{r=await fetch('/api'+path,Object.assign({headers:{'Content-Type':'application/json',...(TOKEN?{Authorization:'Bearer '+TOKEN}:{})}},opt||{}));}
  catch(e){const err=new Error('네트워크 오류 — 연결을 확인하고 다시 시도하세요.');err.network=true;throw err;}
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&token){if(TOKEN===token&&JOB_READ===read){TOKEN=null;localStorage.removeItem('wbr.admin.token');renderLogin('세션이 만료됐어요. 다시 로그인해 주세요.');}throw new Error('auth');}
  if(!r.ok){const err=new Error(j.error||('HTTP '+r.status));err.status=r.status;err.body=j;throw err;}
  return j;
}
const isAuth=e=>!!e&&e.message==='auth';
function showBanner(msg){$('#bannerMsg').textContent=msg;$('#banner').hidden=false;}
function hideBanner(){$('#banner').hidden=true;}
function fail(e){if(isAuth(e))return;showBanner(e.message||String(e));}
function fmtLast(t){if(!t)return '—';const d=(Date.now()-new Date(t))/60000;if(!Number.isFinite(d))return '—';
  if(d<2)return '방금';if(d<60)return Math.round(d)+'분 전';if(d<1440)return Math.round(d/60)+'시간 전';return Math.round(d/1440)+'일 전';}

function renderLogin(msg){
  PDF_LOCAL=null;JOB_READ++;
  $('#btnRefresh').hidden=true;$('#btnLogout').hidden=true;hideBanner();
  /* 로그인 폼은 공용 모듈이 그린다(아이디·비밀번호 기본, PIN 갈래로 전환) — reading-server/public/admin-login.js */
  $('#app').innerHTML='<div class="card" id="loginCard"><h2>강사 로그인</h2><div id="loginHost"></div></div>';
  WBAdminLogin.mount({host:'#loginHost',message:msg||'',classes:{btn:'btn'},onToken:function(t){TOKEN=t;try{localStorage.setItem('wbr.admin.token',TOKEN);}catch(e){}openList();}});
}

/* ── 행 요약 ──
   종류마다 모양이 다르다. 검수자는 "이 행이 원문과 같은가"만 보므로 한 줄 제목 + 한 줄 부제로 줄인다. */
function rowSummary(kind,row){
  const r=(row&&typeof row==='object')?row:{};
  const j=(a,sep)=>(Array.isArray(a)?a:[]).filter(x=>x!=null&&x!=='').join(sep||', ');
  if(kind==='words')return {t:String(r.headword==null?'?':r.headword),s:j(r.meaningKo)+(r.example&&r.example.en?(' · 예문: '+r.example.en):'')};
  if(kind==='sentences')return {t:(r.seq!=null?r.seq+'. ':'')+String(r.en==null?'?':r.en),s:String(r.ko==null?'':r.ko)+(r.dayGroup?(' · 단락 '+r.dayGroup):'')};
  if(kind==='oddOneItems')return {t:String(r.id||'?')+' · '+(r.kind==='grammatical'?'어법':'어휘'),s:'정답 '+(num(r.answerIdx)!=null?(num(r.answerIdx)+1)+'번':'?')+' → '+String(r.correction==null?'':r.correction)};
  if(kind==='checkItems')return {t:String(r.id||'?')+' · '+String(r.slot||'?'),s:String(r.promptKo||r.textEn||r.ko||'')};
  if(kind==='dialogues'){const ln=Array.isArray(r.lines)?r.lines:[];return {t:String(r.title||('대화 '+(r.id||'')))+' · '+ln.length+'줄',s:ln.length?(String(ln[0].speaker||'')+': '+String(ln[0].en||'')):''};}
  if(kind==='patterns')return {t:(r.patternNo!=null?r.patternNo+'. ':'')+String(r.title||'?'),s:String(r.conceptKo||'')};
  if(kind==='items')return {t:(r.no!=null?r.no+'. ':'')+String(r.formatType||'?'),s:String(r.questionKo||r.question||r.promptKo||'')+' · 정답 '+j(r.answer,' ')};
  return {t:JSON.stringify(r).slice(0,80),s:''};
}
/* 원천에서 이 행을 찾을 때 쓰는 실마리 — 원문에 그대로 있는 영어가 가장 낫다 */
function anchorOf(kind,row){
  const r=(row&&typeof row==='object')?row:{};
  if(kind==='words')return r.headword;
  if(kind==='sentences')return r.en;
  if(kind==='oddOneItems'){const l=Array.isArray(r.sentences)?r.sentences:[];return l.length?l[0].text:r.correction;}
  if(kind==='checkItems')return r.textEn||(Array.isArray(r.tokens)?r.tokens.join(' '):'')||r.promptKo;
  if(kind==='dialogues'){const l=Array.isArray(r.lines)?r.lines:[];return l.length?l[0].en:r.title;}
  if(kind==='patterns')return r.title;
  if(kind==='items')return r.question||r.questionKo||r.stem;
  return '';
}

/* ── 검수 키 ──
   서버 rowKey 와 한 글자도 다르면 승인이 엉뚱한 행에 붙는다(naesin-studio.mjs rowKey 참조) */
function rowKey(kind,row,i){
  const r=(row&&typeof row==='object')?row:{};
  const own=r.id!=null?String(r.id):r.seq!=null?('s'+r.seq):r.no!=null?('n'+r.no):r.patternNo!=null?('p'+r.patternNo):('i'+i);
  return kind+':'+own;
}
/* 검사 메시지는 'words[3](apple) …' 로 시작한다 — 그 대괄호 번호가 조립된 팩의 인덱스다.
   버린 행은 조립에서 빠지므로, 초안 인덱스로 되돌리려면 살아남은 순서를 다시 세야 한다. */
function issueIndex(){
  const draft=(JOB&&JOB.draft)||{},review=(JOB&&JOB.review)||{};
  const map={};   // kind → [초안 인덱스] (조립 순서)
  for(const kind of Object.keys(draft)){
    const rows=Array.isArray(draft[kind])?draft[kind]:[];
    map[kind]=[];
    rows.forEach((row,i)=>{const rv=review[rowKey(kind,row,i)];if(rv&&rv.state==='dropped')return;map[kind].push(i);});
  }
  const byKey={},loose=[];
  const put=(list,sev)=>(list||[]).forEach(it=>{
    const m=/^([A-Za-z]+)\[(\d+)\]/.exec(String(it&&it.message||''));
    const kind=m&&m[1],ai=m?Number(m[2]):-1;
    const di=(kind&&map[kind]&&map[kind][ai]!=null)?map[kind][ai]:null;
    if(di==null){loose.push({sev,...it});return;}
    const rows=draft[kind];
    const key=rowKey(kind,rows[di],di);
    (byKey[key]=byKey[key]||[]).push({sev,message:it.message});
  });
  put(GATE&&GATE.errors,'bad');put(GATE&&GATE.warns,'warn');
  return {byKey,loose};
}

/* 화면에 그릴 행 목록 — 필터를 적용한 평평한 배열 */
function visibleRows(byKey){
  const draft=(JOB&&JOB.draft)||{},review=(JOB&&JOB.review)||{};
  const out=[];
  for(const kind of Object.keys(draft)){
    if(FKIND!=='all'&&FKIND!==kind)continue;
    (Array.isArray(draft[kind])?draft[kind]:[]).forEach((row,i)=>{
      const key=rowKey(kind,row,i);
      const rv=review[key]||{state:'pending'};
      const iss=byKey[key]||[];
      if(FONLY==='issue'&&!iss.length)return;
      if(FONLY==='pending'&&rv.state!=='pending')return;
      out.push({kind,row,i,key,state:rv.state,note:rv.note||'',patch:rv.patch||null,issues:iss});
    });
  }
  return out;
}

/* ── 원천 강조 ──
   공백·대소문자를 지운 사본에서 찾고 원본 위치로 되돌린다. 추출된 문장은 원문의 줄바꿈이
   지워진 경우가 많아 그냥 indexOf 로는 거의 못 찾는다. */
function flatten(s){
  let f='';const idx=[];
  for(let i=0;i<s.length;i+=1){const c=s[i];if(/\s/.test(c))continue;f+=c.toLowerCase();idx.push(i);}
  return {f,idx};
}
function srcHtml(text,anchor){
  const t=String(text||'');
  const a=String(anchor||'').trim();
  if(!t)return '<span class="muted">이 종류의 원천 텍스트가 없어요. (초안만 넣은 작업)</span>';
  if(a.length>=3){
    const F=flatten(t),N=flatten(a);
    if(N.f){
      const p=F.f.indexOf(N.f);
      if(p>=0){
        const s=F.idx[p],e=F.idx[p+N.f.length-1]+1;
        return esc(t.slice(0,s))+'<mark id="srcHit">'+esc(t.slice(s,e))+'</mark>'+esc(t.slice(e));
      }
    }
  }
  return esc(t);
}

/* ── 목록 화면 ── */
async function openList(){
  PDF_LOCAL=null;JOB_READ++;
  VIEW='list';JOB=null;GATE=null;SRC={};SEL=null;EDIT=null;
  $('#btnRefresh').hidden=false;$('#btnLogout').hidden=false;
  try{JOBS=(await api('/naesin/admin/jobs')).jobs||[];hideBanner();}
  catch(e){if(isAuth(e))return;JOBS=null;fail(e);}
  renderList();
}
function renderList(){
  const rows=Array.isArray(JOBS)?JOBS:[];
  $('#app').innerHTML=`
  <div class="card"><h2>새 작업 <small>원천 텍스트를 붙여넣기</small></h2>
    <p class="muted">구매 자료 PDF에서 <b>텍스트를 복사해</b> 종류별로 붙여넣습니다. <code>.txt</code>·<code>.json</code> 파일도 됩니다.
      원천과 초안은 서버의 작업 저장소에만 있고 작업을 지우면 함께 지워집니다 — 저장소에 커밋되지 않습니다.</p>
    <div class="grid-form" style="margin-top:8px">
      <label class="fld">팩 id<input id="nPack" placeholder="2022-ne-m2-L6" autocapitalize="off" spellcheck="false"></label>
      <label class="fld">교육과정<input id="nCur" placeholder="2022"></label>
      <label class="fld">교과서<input id="nText" placeholder="능률(김성곤)"></label>
      <label class="fld">학년<input id="nGrade" placeholder="중2"></label>
      <label class="fld">과<input id="nLesson" type="number" min="1" max="20" placeholder="6"></label>
      <label class="fld">과 제목<input id="nTitle" placeholder="Wonders of the World"></label>
    </div>
    <h3>원천 붙이기</h3>
    <div class="filters">
      <select id="nKind">${KINDS.map(k=>`<option value="${k}">${esc(kindKo(k))}</option>`).join('')}</select>
      <input type="file" id="nFile" accept=".txt,.json,.md,text/plain,application/json">
      <button class="btn sm ghost" id="btnAddSrc">이 종류로 추가</button>
    </div>
    <textarea id="nSrc" rows="6" placeholder="PDF에서 복사한 텍스트를 붙여넣으세요." spellcheck="false"></textarea>
    <div id="nList" style="margin-top:8px"></div>
    <div style="margin-top:10px"><button class="btn" id="btnCreate">작업 만들기</button></div>
    <div id="nOut"></div>
  </div>

  <div class="card"><h2>작업 ${num(rows.length)||0}건</h2>
    ${JOBS===null?'<p class="err">작업 목록을 불러오지 못했어요 — 새로고침으로 다시 시도하세요.</p>'
      :!rows.length?'<p class="muted">아직 없어요. 위에서 원천을 붙여 첫 작업을 만드세요.</p>'
      :`<div class="tbl"><table><thead><tr><th>팩 id</th><th>교과서·과</th><th>상태</th><th>행</th><th>검수</th><th>수정</th><th></th></tr></thead><tbody>
        ${rows.map(jb=>{
          const kinds=Object.keys(jb.counts||{});
          const done=(jb.total||0)-(jb.pending||0);
          const st=STATUS_KO[jb.status]||jb.status||'—';
          const cls=jb.status==='published'?'ok':jb.status==='failed'?'bad':jb.status==='ready'?'ok':'';
          return `<tr><td><b>${esc(jb.packId)}</b>${jb.error?'<br><span class="muted">'+esc(jb.error)+'</span>':''}</td>
            <td>${esc((jb.meta&&jb.meta.textbook)||'—')}${jb.meta&&jb.meta.lesson!=null?' L'+num(jb.meta.lesson):''}</td>
            <td><span class="tag ${cls}">${esc(st)}</span></td>
            <td style="white-space:normal">${kinds.length?kinds.map(k=>`<span class="tag muted">${esc(kindKo(k))} ${num(jb.counts[k])}</span>`).join(' '):'—'}</td>
            <td>${num(done)||0}/${num(jb.total)||0}${jb.issueCount?' <span class="tag warn">문제 '+num(jb.issueCount)+'</span>':''}</td>
            <td>${esc(fmtLast(jb.updatedAt))}</td>
            <td><button class="btn sm" data-open="${esc(jb.jobId)}">열기</button>
              <button class="btn sm danger" data-del="${esc(jb.jobId)}">삭제</button></td></tr>`;
        }).join('')}</tbody></table></div>`}
  </div>`;
  renderNewSrc();
  $('#btnAddSrc').onclick=addSrc;
  $('#btnCreate').onclick=createJob;
  $('#nFile').onchange=async()=>{
    const f=$('#nFile').files[0];if(!f)return;
    $('#nSrc').value=await f.text();
    if(!$('#nPack').value){const m=/([A-Za-z0-9-]{3,60})/.exec(f.name.replace(/\.(txt|json|md)$/i,''));if(m)$('#nPack').value=m[1];}
  };
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openJob(b.dataset.open));
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delJob(b.dataset.del));
}
function renderNewSrc(){
  $('#nList').innerHTML=NEWSRC.length
    ? NEWSRC.map((s,i)=>`<div class="srcrow"><span class="tag">${esc(kindKo(s.kind))}</span>
        <b style="flex:1;min-width:0;word-break:break-all">${esc(s.name)}</b>
        <span class="muted">${num(s.text.length)}자</span>
        <button class="btn sm danger" data-rmsrc="${i}">빼기</button></div>`).join('')
    : '<p class="muted">붙인 원천이 없어요. 원천 없이 만들고 나중에 초안 JSON만 넣어도 됩니다.</p>';
  document.querySelectorAll('[data-rmsrc]').forEach(b=>b.onclick=()=>{NEWSRC.splice(Number(b.dataset.rmsrc),1);renderNewSrc();});
}
function addSrc(){
  const text=$('#nSrc').value;
  if(!text.trim()){$('#nOut').innerHTML='<p class="err">붙일 텍스트가 비어 있어요.</p>';return;}
  const kind=$('#nKind').value;
  const f=$('#nFile').files[0];
  NEWSRC.push({name:(f&&f.name)||(kindKo(kind)+' 붙여넣기'),kind,text});
  $('#nSrc').value='';$('#nFile').value='';$('#nOut').innerHTML='';
  renderNewSrc();
}
async function createJob(){
  const lesson=$('#nLesson').value;
  const b={packId:$('#nPack').value.trim(),
    meta:{curriculum:$('#nCur').value.trim(),textbook:$('#nText').value.trim(),grade:$('#nGrade').value.trim(),
      lesson:lesson===''?null:Number(lesson),lessonTitle:$('#nTitle').value.trim()},
    sources:NEWSRC};
  try{
    const j=await api('/naesin/admin/job',{method:'POST',body:JSON.stringify(b)});
    NEWSRC=[];hideBanner();openJob(j.jobId);
  }catch(e){if(isAuth(e))return;$('#nOut').innerHTML='<p class="err">'+esc(e.message)+'</p>';}
}
async function delJob(id){
  if(!confirm('작업과 원천 텍스트를 지웁니다. 이미 배포한 팩은 남습니다. 계속할까요?'))return;
  try{await api('/naesin/admin/job',{method:'DELETE',body:JSON.stringify({jobId:id})});openList();}
  catch(e){fail(e);}
}

/* ── 검수 화면 ── */
async function readJob(id,read,token){
  const j=await api('/naesin/admin/job?id='+encodeURIComponent(id)+'&src=1');
  if(read!==JOB_READ||TOKEN!==token||VIEW!=='job')return false;
  if(!j.job||j.job.jobId!==id)throw new Error('작업 재조회에 실패했어요.');
  if(JOB&&JOB.jobId===id&&Date.parse(j.job.updatedAt)<Date.parse(JOB.updatedAt))return true;
  JOB=j.job;GATE=j.gate;SRC=j.sources||{};hideBanner();return true;
}
async function openJob(id){
  const read=++JOB_READ,token=TOKEN;
  if(PDF_LOCAL&&PDF_LOCAL.jobId!==id)PDF_LOCAL=null;
  VIEW='job';EDIT=null;SEL=null;FKIND='all';FONLY='issue';
  try{
    if(!await readJob(id,read,token))return;
  }catch(e){if(read!==JOB_READ||TOKEN!==token||VIEW!=='job'||isAuth(e))return;fail(e);if(!JOB||JOB.jobId!==id)openList();return;}
  renderJob();
}
function renderJob(){
  if(!JOB){openList();return;}
  const {byKey,loose}=issueIndex();
  const rows=visibleRows(byKey);
  if(SEL&&!rows.some(r=>r.key===SEL))SEL=null;
  if(!SEL&&rows.length)SEL=rows[0].key;
  const meta=JOB.meta||{};
  const done=(GATE.total||0)-(GATE.pending||0);
  const srcKinds=(JOB.sources||[]).map(s=>s.kind).filter((k,i,a)=>a.indexOf(k)===i);
  const kinds=Object.keys(JOB.draft||{});
  const hasPdf=kinds.some(k=>(JOB.draft[k]||[]).some(row=>row&&row._pdfReview));
  const clean=(()=>{const r=(JOB.review)||{};let n=0;
    for(const kind of kinds)(JOB.draft[kind]||[]).forEach((row,i)=>{const k=rowKey(kind,row,i);
      if(!(row&&row._pdfReview)&&!(byKey[k]||[]).length&&!(r[k]&&r[k].state!=='pending'))n+=1;});
    return n;})();

  $('#app').innerHTML=`
  <div class="card">
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <button class="btn sm ghost" id="btnBack">← 작업 목록</button>
      <b style="font-size:16px;color:var(--navy)">${esc(JOB.packId)}</b>
      <span class="tag">${esc(STATUS_KO[JOB.status]||JOB.status||'')}</span>
      <span class="muted">${esc(meta.textbook||'')}${meta.lesson!=null?' L'+num(meta.lesson):''} ${esc(meta.lessonTitle||'')}</span>
      <span class="sp" style="flex:1"></span>
      <button class="btn go" id="btnPub" ${GATE.ok?'':'disabled'}>배포</button>
    </div>
    <div class="stats">
      <div class="stat"><b>${num(GATE.total)||0}</b><span>행</span></div>
      <div class="stat ${GATE.pending?'warn':''}"><b>${num(GATE.pending)||0}</b><span>미검토</span></div>
      <div class="stat ${GATE.errors.length?'warn':''}"><b>${num(GATE.errors.length)||0}</b><span>검사 오류</span></div>
      <div class="stat"><b>${num(GATE.warns.length)||0}</b><span>경고</span></div>
      <div class="stat"><b>${num(done)||0}</b><span>검수 완료</span></div>
    </div>
    ${GATE.ok?'<div class="issues ok">검사 오류 0 · 미검토 0 — 배포할 수 있어요.</div>'
      :`<div class="issues ${GATE.errors.length?'bad':'warn'}">${GATE.errors.length?('검사 오류 '+num(GATE.errors.length)+'건이 남아 배포할 수 없습니다. 해당 행을 고치거나 버리세요.'):('미검토 '+num(GATE.pending)+'행이 남았습니다.')}</div>`}
    ${loose.length?`<div class="issues ${loose.some(x=>x.sev==='bad')?'bad':'warn'}"><b>행에 붙이지 못한 문제 ${num(loose.length)}건</b> — 팩 전체에 관한 것이라 개별 행에서 못 고칩니다.
      ${loose.slice(0,8).map(x=>'<div>'+(x.sev==='bad'?'✕':'!')+' ['+esc(x.where)+'] '+esc(x.message)+'</div>').join('')}</div>`:''}
    ${GATE.summary&&GATE.summary.length?`<p class="muted" style="margin-top:8px">${GATE.summary.map(esc).join(' · ')}</p>`:''}
    <div id="pubOut"></div>
  </div>

  <div class="card"><h2>초안 만들기</h2>
    <div id="exOut"></div>
    <h3>이 PC의 PDF 검수 초안</h3>
    <p class="muted">로컬 추출 도구가 만든 <code>review-draft.json</code>을 넣습니다. 단어 후보는 모두 미검토로 시작하며,
      원본 PDF를 따로 열어 뜻·품사·<code>sections</code>를 확인해야 합니다. 본문 좌우 열은 자동으로 문장에 맞추지 않습니다.</p>
    <div class="filters"><input type="file" id="pdfReviewFile" accept=".json,application/json">
      <button class="btn ghost" id="btnPdfReview" ${BUSY?'disabled':''}>로컬 검수 초안 넣기</button></div>
    <div id="pdfReviewOut"></div>
    ${pdfColumnsHtml()}
    ${pdfSentenceHtml()}
    <h3>초안 JSON 넣기 <small class="muted">기본 경로</small></h3>
    <p class="muted">검수자가 구성한 학습 팩 JSON을 여기 넣습니다.
      파일 여러 개(<code>words.json</code>·<code>sentences.json</code>…)를 한 번에 골라도 되고,
      통짜 팩 하나여도 됩니다 — 배열이 아닌 키(<code>packId</code>·<code>textbook</code> 등)는 알아서 버립니다.</p>
    <div class="filters">
      <input type="file" id="draftFile" accept=".json,application/json" multiple>
      <button class="btn" id="btnDraftFile">파일로 넣기</button>
    </div>
    <div id="draftPick" class="muted"></div>
    <details style="margin-top:8px"><summary style="cursor:pointer;font-weight:800;color:var(--navy)">붙여넣기로 넣기</summary>
      <p class="muted">작은 조각만 고쳐 넣을 때 씁니다. 큰 팩은 파일이 낫습니다.</p>
      <textarea id="draftJson" rows="7" placeholder='{"words":[...],"sentences":[...]}' spellcheck="false"></textarea>
      <div style="margin-top:8px"><button class="btn ghost" id="btnDraft">붙여넣은 것으로 넣기</button></div>
    </details>
    <details style="margin-top:8px"><summary style="cursor:pointer;font-weight:800;color:var(--navy)">본문 문장 수동 입력 안내</summary>
      <p class="muted">원본 PDF의 영어·한글 문장을 직접 대조한 뒤 <code>sentences</code> 배열을 위 붙여넣기 칸에 넣으세요.
        <code>seq</code>는 1부터 순서대로, <code>dayGroup</code>은 단락, <code>chunks[].ko</code>는 영어 순서대로 뜻을 적습니다.
        원천 열이 화면에 있어도 문장 대응을 완료한 것은 아닙니다. 모든 문장을 대조·검수해야 배포할 수 있습니다.</p>
      <pre style="white-space:pre-wrap;word-break:break-word">${esc(JSON.stringify({sentences:[{seq:1,dayGroup:'1',en:'A toy is blue.',ko:'장난감이 파랗다.',chunks:[{en:'A toy',ko:'장난감은'},{en:'is blue.',ko:'파랗다.'}]}]},null,2))}</pre>
      <p class="muted">위 문장은 자체 창작 형식 예시입니다. 실제 교재 문장을 대신하지 않습니다.</p>
    </details>
    <div id="draftOut"></div>
    ${srcKinds.length?`<details style="margin-top:10px"><summary style="cursor:pointer;font-weight:800;color:var(--navy)">서버에서 AI 추출 (선택 — 서버에 API 키가 있을 때만)</summary>
      <p class="muted">원장 구독(Claude Max)으로 만드는 것이 기본 경로라 평소에는 쓰지 않습니다.
        무인으로 돌려야 할 때만 서버에 키를 넣고 씁니다 — 그때는 호출마다 요금이 따로 나갑니다.</p>
      <div class="filters">${srcKinds.map(k=>`<button class="btn sm ghost" data-ex="${esc(k)}">${esc(kindKo(k))} 추출</button>`).join('')}</div>
    </details>`:''}
  </div>

  ${kinds.length?`<div class="card"><h2>검수 <small>${num(rows.length)||0}행 보임</small></h2>
    <div class="filters">
      <button class="chip" data-only="issue" aria-pressed="${FONLY==='issue'}">문제 있는 행만</button>
      <button class="chip" data-only="pending" aria-pressed="${FONLY==='pending'}">미검토만</button>
      <button class="chip" data-only="all" aria-pressed="${FONLY==='all'}">전체</button>
      <span style="width:10px"></span>
      <button class="chip" data-kind="all" aria-pressed="${FKIND==='all'}">모든 종류</button>
      ${kinds.map(k=>`<button class="chip" data-kind="${esc(k)}" aria-pressed="${FKIND===k}">${esc(kindKo(k))} ${num((JOB.draft[k]||[]).length)}</button>`).join('')}
      <span class="sp" style="flex:1"></span>
      <button class="btn sm ghost" id="btnBulk" ${clean?'':'disabled'}>문제 없는 ${num(clean)||0}행 일괄 승인</button>
    </div>
    <p class="keys">${hasPdf?'PDF 후보는 원본을 대조해 한 행씩 검수하세요. 자동 검사만으로 승인하지 않습니다.':'전수 검토는 현실적으로 불가능합니다 — 자동 대조가 잡은 행만 사람이 보고, 나머지는 일괄 승인하세요.'}
      키보드: <kbd>j</kbd>/<kbd>k</kbd> 이동 · <kbd>a</kbd> 승인 · <kbd>x</kbd> 버림 · <kbd>e</kbd> 편집 · <kbd>Esc</kbd> 취소</p>
    <div class="panes">
      <div class="pane"><h3>원천 <span class="muted" id="srcWho"></span></h3><pre id="srcText"></pre></div>
      <div class="pane"><h3>추출 행</h3><div id="rowList"></div></div>
    </div>
  </div>`:'<div class="card"><p class="muted">아직 초안이 없어요. 위에서 로컬 검수 초안이나 학습 팩 JSON을 넣으세요.</p></div>'}`;

  $('#btnBack').onclick=openList;
  $('#btnPub').onclick=publish;
  document.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>runExtract(b.dataset.ex,b));
  $('#btnDraft').onclick=()=>putDraft($('#draftJson').value, '붙여넣기');
  $('#btnDraftFile').onclick=putDraftFiles;
  $('#btnPdfReview').onclick=putPdfReviewFile;
  bindPdfSentence();
  $('#draftFile').onchange=()=>{
    const fs2=[...$('#draftFile').files];
    $('#draftPick').textContent=fs2.length?('고른 파일 '+fs2.length+'개: '+fs2.map(f=>f.name).join(', ')):'';
  };
  document.querySelectorAll('[data-only]').forEach(b=>b.onclick=()=>{FONLY=b.dataset.only;SEL=null;renderJob();});
  document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{FKIND=b.dataset.kind;SEL=null;renderJob();});
  const bulk=$('#btnBulk');if(bulk)bulk.onclick=bulkOk;
  if(kinds.length){renderRows(rows);renderSrc(rows);}
}

function renderRows(rows){
  const el=$('#rowList');if(!el)return;
  el.innerHTML=rows.length?rows.map(r=>{
    const sm=rowSummary(r.kind,r.patch?{...r.row,...r.patch}:r.row);
    const tag=r.state==='pending'?'<span class="tag muted">미검토</span>'
      :r.state==='ok'?'<span class="tag ok">승인</span>'
      :r.state==='fixed'?'<span class="tag">수정</span>':'<span class="tag bad">버림</span>';
    const editing=EDIT===r.key;
    return `<div class="row ${r.state==='dropped'?'dropped':''}" data-key="${esc(r.key)}" aria-selected="${SEL===r.key}">
      <div class="rh"><span class="tag muted">${esc(kindKo(r.kind))}</span>${tag}<span class="rt">${esc(sm.t)}</span></div>
      ${sm.s?`<div class="rs">${esc(sm.s)}</div>`:''}
      ${r.issues.map(x=>`<div class="ri ${x.sev}">${x.sev==='bad'?'✕':'!'} ${esc(x.message)}</div>`).join('')}
      ${r.note?`<div class="rs">메모: ${esc(r.note)}</div>`:''}
      ${editing?`<textarea data-ed="${esc(r.key)}" spellcheck="false">${esc(JSON.stringify(r.patch?{...r.row,...r.patch}:r.row,null,2))}</textarea>
        <div class="ra"><button class="btn sm" data-save="${esc(r.key)}">저장</button>
          <button class="btn sm ghost" data-cancel="1">취소</button>
          <span class="muted">지운 키는 비운 값으로 저장됩니다.</span></div>`
      :`<div class="ra">
        <button class="btn sm ${r.state==='ok'?'':'ghost'}" data-ok="${esc(r.key)}">승인</button>
        <button class="btn sm ghost" data-edit="${esc(r.key)}">편집</button>
        <button class="btn sm danger" data-drop="${esc(r.key)}">${r.state==='dropped'?'되살리기':'버림'}</button>
      </div>`}
    </div>`;
  }).join(''):'<p class="muted" style="padding:10px">이 필터에 걸리는 행이 없어요. 「전체」로 바꿔 보세요.</p>';

  el.querySelectorAll('.row').forEach(d=>d.onclick=e=>{
    if(e.target.closest('button')||e.target.closest('textarea'))return;
    SEL=d.dataset.key;renderJob();
  });
  el.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>review(b.dataset.ok,'ok'));
  el.querySelectorAll('[data-drop]').forEach(b=>b.onclick=()=>{
    const r=rows.find(x=>x.key===b.dataset.drop);
    review(b.dataset.drop,r&&r.state==='dropped'?'pending':'dropped');
  });
  el.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{EDIT=b.dataset.edit;SEL=b.dataset.edit;renderJob();});
  el.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{EDIT=null;renderJob();});
  el.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>saveEdit(b.dataset.save));
  const sel=el.querySelector('.row[aria-selected="true"]');
  if(sel&&sel.scrollIntoView)sel.scrollIntoView({block:'nearest'});
  const ta=el.querySelector('textarea[data-ed]');if(ta)ta.focus();
}
function renderSrc(rows){

      :['단어 후보: '+String(row.headword||''),'뜻 후보: '+(Array.isArray(row.meaningKo)?row.meaningKo.join(' · '):'형식 확인 필요'),'품사: '+String(row.pos||'미지정'),'sections를 원본과 대조해 reading 또는 conversation으로 지정하세요.'];

      '검토 표시: '+(pdf.flags||[]).join(', ')].join('\n');

  el.innerHTML=srcHtml(srcKind?SRC[srcKind]:'',cur?anchorOf(cur.kind,cur.patch?{...cur.row,...cur.patch}:cur.row):'');

/* ── 검수 저장 ──
   먼저 화면에 반영하고 서버에 보낸다(승인은 초당 여러 번 누르는 동작이라 왕복을 기다리면 못 쓴다).
   실패하면 되돌리고 배너를 띄운다 — 조용히 넘기면 승인한 줄 알고 배포를 누른다. */
async function review(key,state,patch,note){
  if(!JOB)return;
  const target=JOB,jobId=JOB.jobId,read=JOB_READ,token=TOKEN,baseUpdatedAt=JOB.updatedAt,before=JOB.review&&JOB.review[key];
  if(typeof baseUpdatedAt!=='string'||!baseUpdatedAt){showBanner('작업 버전이 없어요. 상단 새로고침으로 최신 작업을 읽은 뒤 다시 검수하세요.');return;}
  const current=()=>JOB&&JOB.jobId===jobId&&read===JOB_READ&&TOKEN===token&&VIEW==='job';
  const rec={...before,state};
  if(patch!==undefined){if(patch)rec.patch=patch;else delete rec.patch;}
  if(note!==undefined){if(note)rec.note=note;else delete rec.note;}
  JOB.review={...JOB.review,[key]:rec};
  EDIT=null;SEL=key;renderJob();
  let saved=false;
  try{
    const body={jobId,baseUpdatedAt,key,state};
    if(patch!==undefined)body.patch=patch;
    if(note!==undefined)body.note=note;
    await api('/naesin/admin/job/review',{method:'POST',body:JSON.stringify(body)});saved=true;
    if(!current()||!await readJob(jobId,read,token))return;
    renderJob();
  }catch(e){
    if(isAuth(e)||!current())return;
    if(!saved&&JOB===target&&JOB.review[key]===rec){
      JOB.review={...JOB.review};if(before)JOB.review[key]=before;else delete JOB.review[key];renderJob();
    }
    showBanner(saved?'검수 저장은 끝났지만 결과를 다시 읽지 못했어요. 입력을 유지했습니다. 상단 새로고침으로 최신 작업을 확인하세요.'
      :e.status===409?'다른 곳에서 작업이 바뀌었어요. 검수와 입력을 유지했습니다. 상단 새로고침으로 최신 작업을 읽고 확인한 뒤 다시 검수하세요.':'검수를 저장하지 못했어요 — '+(e.message||''));
  }
}
async function bulkOk(){
  if(!JOB)return;
  const jobId=JOB.jobId,read=JOB_READ,token=TOKEN,baseUpdatedAt=JOB.updatedAt;
  if(typeof baseUpdatedAt!=='string'||!baseUpdatedAt){showBanner('작업 버전이 없어요. 상단 새로고침으로 최신 작업을 읽은 뒤 다시 검수하세요.');return;}
  const current=()=>JOB&&JOB.jobId===jobId&&read===JOB_READ&&TOKEN===token&&VIEW==='job';
  const {byKey}=issueIndex();
  const review=JOB.review||{};
  const keys=[];
  for(const kind of Object.keys(JOB.draft||{}))
    (JOB.draft[kind]||[]).forEach((row,i)=>{
      const k=rowKey(kind,row,i);
      if(row&&row._pdfReview)return;
      if((byKey[k]||[]).length)return;                 /* 문제 있는 행은 사람이 본다 */
      if(review[k]&&review[k].state!=='pending')return;
      keys.push(k);
    });
  if(!keys.length)return;
  if(!confirm('자동 대조에서 문제가 없던 '+keys.length+'행을 승인합니다. 계속할까요?'))return;
  let saved=false;
  try{
    await api('/naesin/admin/job/review',{method:'POST',
      body:JSON.stringify({jobId,baseUpdatedAt,rows:keys.map(k=>({key:k,state:'ok'}))})});saved=true;
    if(!current()||!await readJob(jobId,read,token))return;
    renderJob();
  }catch(e){if(isAuth(e)||!current())return;showBanner(saved?'검수 저장은 끝났지만 결과를 다시 읽지 못했어요. 입력을 유지했습니다. 상단 새로고침으로 최신 작업을 확인하세요.'
    :e.status===409?'다른 곳에서 작업이 바뀌었어요. 검수와 입력을 유지했습니다. 상단 새로고침으로 최신 작업을 읽고 확인한 뒤 다시 검수하세요.':e.message);}
}
function saveEdit(key){
  const ta=document.querySelector('textarea[data-ed="'+key.replace(/"/g,'\\"')+'"]');
  if(!ta)return;
  let obj;
  try{obj=JSON.parse(ta.value);}
  catch(e){showBanner('JSON 을 읽지 못했어요 — '+e.message);return;}
  if(!obj||typeof obj!=='object'||Array.isArray(obj)){showBanner('행 하나는 객체여야 해요.');return;}
  /* 서버는 patch 를 {...행, ...patch} 로 합친다 — 편집에서 지운 키는 그냥 두면 살아남는다.
     빈 값으로 덮어 검사기가 '없음'으로 보게 한다(nonEmpty(null)은 false). */
  const [kind]=key.split(':');
  const rows=(JOB.draft||{})[kind]||[];
  const orig=rows.find((row,i)=>rowKey(kind,row,i)===key)||{};
  const patch={...obj};
  for(const k of Object.keys(orig))if(!(k in patch))patch[k]=null;
  review(key,'fixed',patch);
}

/* ── 추출·초안·배포 ── */
async function runExtract(kind,btn){
  if(BUSY)return;BUSY=true;
  const old=btn.textContent;btn.disabled=true;btn.textContent='추출 중…';
  $('#exOut').innerHTML='<p class="muted">AI가 원천을 읽고 있어요. 종류에 따라 1~2분 걸립니다.</p>';
  try{
    const j=await api('/naesin/admin/job/extract',{method:'POST',body:JSON.stringify({jobId:JOB.jobId,kind})});
    if(!j.ok){
      const parts=(j.parts||[]).filter(p=>!p.ok);
      $('#exOut').innerHTML='<div class="issues bad"><b>'+esc(reasonKo(j.reason))+'</b>'
        +(parts.length?'<div class="muted">실패한 구간 '+num(parts.length)+'개</div>':'')
        +aiLeftHtml(j)+'</div>';
      BUSY=false;btn.disabled=false;btn.textContent=old;return;
    }
    /* 초안이 바뀌었으니 검수 상태·판정을 서버에서 다시 받는다 */
    BUSY=false;
    const short=(j.parts||[]).filter(p=>!p.ok);
    const byQuota=short.some(p=>p.reason==='quota');
    const msg=kindKo(kind)+' '+j.count+'행을 뽑았어요.'
      +(byQuota?' 오늘 AI 한도에 걸려 일부 구간을 못 불렀어요 — 내일 이어서 하거나 한도를 올리세요.'
        :short.length?' (일부 구간 실패 — 원천을 나눠 다시 시도할 수 있어요)':'');
    const left=aiLeftHtml(j);
    await openJob(JOB.jobId);
    $('#exOut').innerHTML='<div class="issues '+(byQuota?'warn':'ok')+'">'+esc(msg)+left+'</div>';
  }catch(e){
    BUSY=false;btn.disabled=false;btn.textContent=old;
    if(isAuth(e))return;
    $('#exOut').innerHTML='<p class="err">'+esc(e.message)+'</p>';
  }
}
/* 오늘 남은 AI 호출 수 — 요금이 걸린 값이라 화면에서 보이지 않으면 관리가 안 된다.
   호출 한 번이 대략 200원, 팩 하나가 10~15회다(기획서 §13-8). */
function aiLeftHtml(j){
  if(j==null||j.aiLeft==null)return '';
  const left=num(j.aiLeft),cap=num(j.aiCap);
  return '<div class="muted">오늘 남은 AI 호출 '+left+'/'+cap+'회 — 팩 하나에 10~15회쯤 듭니다.</div>';
}
/* 파일 여러 개를 한 초안으로 병합한다 — 관리 웹의 팩 업로드와 같은 결이다.
   같은 종류가 두 파일에 나뉘어 있으면 이어 붙인다(단어를 나눠 만든 경우). */
async function putDraftFiles(){
  if(BUSY||!JOB)return;
  const jobId=JOB.jobId,read=JOB_READ;
  const files=[...$('#draftFile').files];
  if(!files.length){$('#draftOut').innerHTML='<p class="err">파일을 고르세요.</p>';return;}
  const merged={};const bad=[];
  for(const f of files){
    let obj;
    try{obj=JSON.parse(await f.text());}
    catch(e){bad.push(f.name+' — JSON 을 읽지 못했어요');continue;}
    if(!JOB||JOB.jobId!==jobId||read!==JOB_READ)return;
    if(!obj||typeof obj!=='object'||Array.isArray(obj)){bad.push(f.name+' — 최상위가 객체가 아니에요');continue;}
    try{for(const [k,v] of Object.entries(regularDraft(obj)))merged[k]=(merged[k]||[]).concat(v);}
    catch(e){bad.push(f.name+' — '+e.message);}
  }
  if(bad.length){$('#draftOut').innerHTML='<div class="issues bad">'+bad.map(esc).join('<br>')+'</div>';return;}
  return sendDraft(merged, files.length+'개 파일',jobId);
}
function putDraft(raw, how){
  if(BUSY||!JOB)return;
  let obj;
  try{obj=JSON.parse(raw);}
  catch(e){$('#draftOut').innerHTML='<p class="err">JSON 을 읽지 못했어요 — '+esc(e.message)+'</p>';return;}
  if(!obj||typeof obj!=='object'||Array.isArray(obj)){$('#draftOut').innerHTML='<p class="err">최상위는 객체여야 해요.</p>';return;}
  /* 팩 통짜 JSON을 그대로 붙여도 되게 — 배열이 아닌 최상위 키(packId·textbook 등)는 버린다 */
  let draft;
  try{draft=regularDraft(obj);}catch(e){$('#draftOut').innerHTML='<p class="err">'+esc(e.message)+'</p>';return;}
  return sendDraft(draft, how);
}
function regularDraft(obj){
  if(obj.kind==='naesin-pdf-review-draft'||DRAFT_KINDS.some(k=>Array.isArray(obj[k])&&obj[k].some(r=>r&&r._pdfReview)))
    throw new Error('PDF 검수 초안은 위 「로컬 검수 초안 넣기」에서 선택하세요.');
  const draft={};
  for(const [k,v] of Object.entries(obj))if(Array.isArray(v)){
    if(!DRAFT_KINDS.includes(k))throw new Error('지원하지 않는 초안 배열: '+k);
    if(v.length)draft[k]=v;
  }
  return draft;
}
function pdfReviewDraft(obj){
  if(!obj||obj.kind!=='naesin-pdf-review-draft'||obj.version!==1||obj.status!=='needs-review'||obj.publishable!==false)
    throw new Error('미검수 상태의 로컬 PDF 검수 초안(v1)이 필요해요.');
  if(!Array.isArray(obj.wordCandidates)||!obj.wordCandidates.length||!Array.isArray(obj.passageColumns))
    throw new Error('단어 후보와 본문 원천 열 배열이 필요해요.');
  if(!Array.isArray(obj.unmatchedWordRows)||obj.unmatchedWordRows.length)
    throw new Error('대응하지 못한 단어 원천 행이 있어요. 원본을 대조해 추출 초안을 먼저 보완하세요.');
  const ids=new Set();
  const words=obj.wordCandidates.map(c=>{
    if(!c||typeof c.candidateId!=='string'||!/^wc-\d+$/.test(c.candidateId)||ids.has(c.candidateId)
      ||typeof c.headCandidate!=='string'||!Array.isArray(c.meanings)||c.meanings.some(m=>typeof m!=='string')
      ||!Array.isArray(c.posCandidates)||c.posCandidates.some(p=>typeof p!=='string')
      ||!Array.isArray(c.reviewFlags)||c.reviewFlags.some(f=>typeof f!=='string'||!f||f.length>200)
      ||!Array.isArray(c.sourceRows)||!c.sourceRows.length||c.sourceRows.length>100)
      throw new Error('단어 후보 형식이나 후보 ID가 올바르지 않아요.');
    ids.add(c.candidateId);
    const flags=[...new Set(['REVIEW_REQUIRED',...c.reviewFlags])];
    if(flags.length>100)throw new Error('검토 표시가 너무 많아요.');
    const locations=c.sourceRows.map(r=>{
      if(!r||!Number.isInteger(r.page)||r.page<1||r.page>1000000||!Array.isArray(r.bbox)||r.bbox.length!==4
        ||r.bbox.some(v=>typeof v!=='number'||!Number.isFinite(v)||v<0)||r.bbox[0]>r.bbox[2]||r.bbox[1]>r.bbox[3])
        throw new Error('PDF 원천 위치가 올바르지 않아요.');
      return{page:r.page,bbox:r.bbox.slice()};
    });
    return{id:c.candidateId.replace(/^wc-/,'w-'),headword:c.headCandidate,pos:c.posCandidates.length===1?c.posCandidates[0]:'',
      meaningKo:c.meanings.slice(),sections:[],_pdfReview:{flags,locations}};
  });
  const columns=obj.passageColumns.map(c=>{
    if(!c||!Number.isInteger(c.page)||c.page<1||c.page>1000000||!['EN','KO'].includes(c.column)||typeof c.rawText!=='string')
      throw new Error('본문 원천 열 형식이 올바르지 않아요.');
    if(c.lines!==undefined&&!Array.isArray(c.lines))throw new Error('본문 줄 정보는 배열이어야 해요.');
    const lines=(c.lines||[]).map(line=>{
      if(!line||typeof line.text!=='string'||!line.text.trim()||!Array.isArray(line.tokens)||!line.tokens.length)
        throw new Error('본문 줄의 글자와 위치 정보가 필요해요.');
      const boxes=line.tokens.map(t=>{
        const b=t&&[t.x0,t.top,t.x1,t.bottom];
        if(!b||b.some(v=>typeof v!=='number'||!Number.isFinite(v)||v<0)||b[0]>b[2]||b[1]>b[3])
          throw new Error('본문 줄 위치가 올바르지 않아요.');
        return b;
      });
      return{text:line.text,bbox:[Math.min(...boxes.map(b=>b[0])),Math.min(...boxes.map(b=>b[1])),Math.max(...boxes.map(b=>b[2])),Math.max(...boxes.map(b=>b[3]))]};
    });
    return{page:c.page,column:c.column,rawText:c.rawText,lines};
  });
  return{words,columns};
}

      <label class="fld">단락<input id="pdfSentenceDay" value="${esc(f.dayGroup)}" placeholder="예: 1"></label>
      <p class="muted">청크는 위에서 아래로 영어 순서입니다. 빈 두 칸은 제외하며 한쪽만 비면 저장할 수 없어요.</p>
      ${f.chunks.map((c,i)=>`<div class="grid-form"><label class="fld">청크 ${i+1} · 영어<textarea data-pdf-chunk-en="${i}" rows="2" spellcheck="false">${esc(c.en)}</textarea></label><label class="fld">청크 ${i+1} · 직독직해 뜻<textarea data-pdf-chunk-ko="${i}" rows="2">${esc(c.ko)}</textarea></label></div>`).join('')}
      <div class="filters" style="margin-top:8px"><button class="btn sm ghost" id="btnPdfChunkAdd">청크 한 줄 추가</button>
        <button class="btn" id="btnPdfSentenceSave" ${f.loaded?'':'disabled'}>문장 후보를 미검토로 저장</button></div>
    </fieldset><div id="pdfSentenceOut" class="err" role="status" aria-live="polite"></div>`;
}
function bindPdfSentence(){
  if(!$('#pdfSentenceFields')||!PDF_LOCAL||!PDF_LOCAL.sentence)return;
  const f=PDF_LOCAL.sentence;
  for(const side of ['en','ko'])for(const key of ['Column','Start','End']){
    const el=$('#pdf'+(side==='en'?'En':'Ko')+key);
    el.oninput=()=>{f[side+key]=el.value;f.loaded=null;$('#btnPdfSentenceSave').disabled=true;$('#pdfSentenceOut').textContent='줄 선택을 바꿨어요. 선택 줄로 문장을 다시 채워 주세요.';};
  }
  for(const [id,key] of [['pdfSentenceEn','en'],['pdfSentenceKo','ko'],['pdfSentenceDay','dayGroup']]){
    const el=$('#'+id);el.oninput=()=>{f[key]=el.value;$('#pdfSentenceOut').textContent='';};
  }
  for(const side of ['en','ko'])document.querySelectorAll('[data-pdf-chunk-'+side+']').forEach(el=>{
    el.oninput=()=>{f.chunks[Number(el.dataset[side==='en'?'pdfChunkEn':'pdfChunkKo'])][side]=el.value;$('#pdfSentenceOut').textContent='';};
  });
  $('#btnPdfChunkAdd').onclick=()=>{if(BUSY)return;f.chunks.push({en:'',ko:''});renderJob();};
  $('#btnPdfSentenceLoad').onclick=loadPdfSentence;
  $('#btnPdfSentenceSave').onclick=savePdfSentence;
}
function pdfLineRange(side,f){
  const columns=PDF_LOCAL&&PDF_LOCAL.columns,col=f[side+'Column'],start=Number(f[side+'Start']),end=Number(f[side+'End']);
  const c=columns&&col!==''&&columns[Number(col)];
  if(!/^\d+$/.test(col)||!c||c.column!==side.toUpperCase()||!Array.isArray(c.lines)||!Number.isInteger(start)||!Number.isInteger(end)||start<1||end<start||end>c.lines.length)
    throw new Error((side==='en'?'영어':'한글')+' 원천 열과 시작·끝 줄을 확인하세요.');
  const lines=c.lines.slice(start-1,end);
  return{text:lines.map(l=>l.text).join(' '),location:{page:c.page,bbox:[Math.min(...lines.map(l=>l.bbox[0])),Math.min(...lines.map(l=>l.bbox[1])),Math.max(...lines.map(l=>l.bbox[2])),Math.max(...lines.map(l=>l.bbox[3]))]}};
}
function loadPdfSentence(){
  if(BUSY||!JOB||!PDF_LOCAL||PDF_LOCAL.jobId!==JOB.jobId||!PDF_LOCAL.sentence)return;
  const f=PDF_LOCAL.sentence;
  try{
    const en=pdfLineRange('en',f),ko=pdfLineRange('ko',f);
    f.en=en.text;f.ko=ko.text;f.chunks=[{en:'',ko:''}];f.loaded=true;renderJob();
    $('#pdfSentenceOut').textContent='선택한 문장을 채웠어요. 원문을 대조하고 단락·직독직해 청크를 입력하세요.';
  }catch(e){$('#pdfSentenceOut').textContent=e.message;}
}
async function savePdfSentence(){
  if(BUSY||!JOB||!PDF_LOCAL||PDF_LOCAL.jobId!==JOB.jobId||!PDF_LOCAL.sentence)return;
  const local=PDF_LOCAL,f=local.sentence,jobId=JOB.jobId,token=TOKEN,read=JOB_READ;
  const current=()=>JOB&&JOB.jobId===jobId&&TOKEN===token&&VIEW==='job'&&PDF_LOCAL===local;
  BUSY=true;$('#pdfSentenceFields').disabled=true;
  try{
    const health=await api('/health');
    if(!current()||JOB_READ!==read)return;
    if(health.localPdfReview!==true)throw new Error('로컬 PDF 검수는 이 PC 서버의 학원 내 주소에서만 열 수 있어요.');
    if(!f.loaded)throw new Error('영어·한글 줄 범위를 골라 문장을 먼저 채워 주세요.');
    const en=pdfLineRange('en',f),ko=pdfLineRange('ko',f),chunks=f.chunks.map(c=>({en:c.en.trim(),ko:c.ko.trim()})).filter(c=>c.en||c.ko);
    if(!f.en.trim()||!f.ko.trim()||!f.dayGroup.trim())throw new Error('영어 문장·한글 해석·단락을 모두 입력하세요.');
    if(!chunks.length||chunks.some(c=>!c.en||!c.ko))throw new Error('각 청크의 영어와 직독직해 뜻을 짝으로 입력하세요.');
    if(WBPACKCHECK.flat(chunks.map(c=>c.en).join(' '))!==WBPACKCHECK.flat(f.en))throw new Error('청크 영어를 순서대로 이으면 영어 문장 전체와 같아야 해요.');
    const sentences=(JOB.draft.sentences||[]),seq=Math.max(0,...sentences.filter(s=>Number.isSafeInteger(s.seq)).map(s=>s.seq))+1;
    if(!Number.isSafeInteger(seq))throw new Error('기존 문장 순번을 확인하세요.');
    const row={seq,dayGroup:f.dayGroup.trim(),en:f.en.trim(),ko:f.ko.trim(),chunks,
      _pdfReview:{flags:['REVIEW_REQUIRED','TEACHER_PAIRED'],locations:[en.location,ko.location]}};
    if(await sendDraft({sentences:[...sentences,row]},'교사 대응 문장',jobId,'#pdfSentenceOut')){
      if(!current())return;
      local.sentence=null;renderJob();$('#pdfSentenceOut').textContent='문장 '+seq+'번을 미검토로 저장했어요. 검수에서 원본을 대조해 승인하세요.';
    }
  }catch(e){if(current()&&JOB_READ===read&&!isAuth(e))$('#pdfSentenceOut').textContent=e.message;}
  finally{BUSY=false;if(current()){
    const fields=$('#pdfSentenceFields'),button=$('#btnPdfReview');if(fields)fields.disabled=false;if(button)button.disabled=false;
  }}
}
async function putPdfReviewFile(){
  if(BUSY||!JOB)return;
  const file=$('#pdfReviewFile').files[0],jobId=JOB.jobId,token=TOKEN,read=JOB_READ;
  if(!file){$('#pdfReviewOut').textContent='검수 초안 JSON 파일을 선택하세요.';return;}
  const current=()=>JOB&&JOB.jobId===jobId&&TOKEN===token&&VIEW==='job'&&JOB_READ===read;
  BUSY=true;$('#btnPdfReview').disabled=true;
  const fields=$('#pdfSentenceFields');if(fields)fields.disabled=true;
  try{
    const health=await api('/health');
    if(!current())return;
    if(health.localPdfReview!==true)throw new Error('로컬 PDF 검수는 이 PC 서버의 학원 내 주소에서만 열 수 있어요.');
    const raw=await file.text();if(!current())return;
    const data=pdfReviewDraft(JSON.parse(raw));
    const existing=JOB.draft.words||[];
    if(existing.length){
      if(JSON.stringify(existing)!==JSON.stringify(data.words))throw new Error('현재 작업의 단어 후보와 달라요. 기존 검수를 지키려면 별도 작업에 새 초안을 넣으세요.');
      PDF_LOCAL={jobId,columns:data.columns};renderJob();
      $('#pdfReviewOut').textContent='기존 단어 '+data.words.length+'개와 검수를 유지하고 본문 '+data.columns.length+'열을 다시 열었어요.';
    }else if(await sendDraft({words:data.words},'로컬 PDF 검수 초안',jobId,'#pdfReviewOut')){
      PDF_LOCAL={jobId,columns:data.columns};renderJob();
      $('#pdfReviewOut').textContent='단어 후보 '+data.words.length+'개를 미검토로 넣었어요. 본문 '+data.columns.length+'열은 문장 대응 전입니다.';
    }
  }catch(e){if(current()&&!isAuth(e))$('#pdfReviewOut').textContent=e.message;}
  finally{BUSY=false;const button=$('#btnPdfReview');if(button)button.disabled=false;if(current()&&$('#pdfSentenceFields'))$('#pdfSentenceFields').disabled=false;}
}
async function sendDraft(draft, how, jobId, errorSelector){
  const id=jobId||(JOB&&JOB.jobId),read=JOB_READ,token=TOKEN,baseUpdatedAt=JOB&&JOB.updatedAt;
  if(!JOB||JOB.jobId!==id||VIEW!=='job')return false;
  if(!Object.keys(draft).length){$('#draftOut').innerHTML='<p class="err">넣을 배열이 없어요.</p>';return;}
  $('#draftOut').innerHTML='<p class="muted">넣는 중…</p>';
  let saved=false;
  try{
    if(typeof baseUpdatedAt!=='string'||!baseUpdatedAt)throw new Error('작업 버전이 없어요. 상단 새로고침으로 최신 작업을 읽은 뒤 다시 저장하세요.');
    await api('/naesin/admin/job/draft',{method:'POST',body:JSON.stringify({jobId:id,baseUpdatedAt,draft})});saved=true;
    if(!JOB||JOB.jobId!==id||read!==JOB_READ||TOKEN!==token||VIEW!=='job')return false;
    if(!await readJob(id,read,token))return false;
    EDIT=null;SEL=null;FKIND='all';FONLY='issue';renderJob();
    $('#exOut').innerHTML='<div class="issues ok">'+esc(how)+' 에서 '
      +esc(Object.keys(draft).map(k=>kindKo(k)+' '+draft[k].length+'행').join(' · '))+' 을 초안으로 넣었어요.</div>';
    return true;
  }catch(e){
    if(isAuth(e)||!JOB||JOB.jobId!==id||read!==JOB_READ||TOKEN!==token||VIEW!=='job')return false;
    const message=saved?'초안 저장은 끝났지만 결과를 다시 읽지 못했어요. 입력을 유지했습니다. 상단 새로고침으로 저장 결과를 확인한 뒤 이어서 진행하세요.'
      :e.status===409?'다른 곳에서 작업이 바뀌었어요. 입력을 유지했습니다. 상단 새로고침으로 최신 작업을 읽고 확인한 뒤 다시 저장하세요.':e.message;
    $('#draftOut').innerHTML='<p class="err">'+esc(message)+'</p>';
    const out=errorSelector&&$(errorSelector);if(out)out.textContent=message;
    return false;
  }
}
async function publish(){
  if(!JOB)return;
  if(!confirm(JOB.packId+' 을(를) 배포합니다. 같은 id 의 팩이 있으면 덮어씁니다. 계속할까요?'))return;
  const btn=$('#btnPub');btn.disabled=true;btn.textContent='배포 중…';
  try{
    const j=await api('/naesin/admin/job/publish',{method:'POST',body:JSON.stringify({jobId:JOB.jobId})});
    await openJob(JOB.jobId);
    $('#pubOut').innerHTML='<div class="issues ok"><b>'+esc(j.packId)+' 배포 완료</b>'
      +'<div>운영 관리의 「레슨 팩」에 나타납니다. 학생이 받으려면 <b>시험 범위에 넣어야</b> 합니다 — 팩 커버리지 카드를 확인하세요.</div>'
      +(j.warns&&j.warns.length?'<div class="muted">경고 '+num(j.warns.length)+'건은 남아 있어요.</div>':'')+'</div>';
  }catch(e){
    if(isAuth(e))return;
    const b=e.body||{};
    $('#pubOut').innerHTML='<div class="issues bad"><b>'+esc(e.message)+'</b>'
      +((b.errors||[]).slice(0,8).map(x=>'<div>✕ ['+esc(x.where)+'] '+esc(x.message)+'</div>').join(''))
      +(b.pending?'<div>미검토 '+num(b.pending)+'행</div>':'')+'</div>';
    const p=$('#btnPub');if(p){p.disabled=!(GATE&&GATE.ok);p.textContent='배포';}
  }
}

/* ── 키보드 ──
   검수는 같은 동작을 수백 번 반복한다 — 마우스로만 하면 팩 하나에 반나절이 그대로 돌아온다.
   입력 칸에 있을 때는 가로채지 않는다(팩 id 에 'a'를 못 치면 안 된다). */
document.addEventListener('keydown',e=>{
  if(VIEW!=='job'||!JOB)return;
  const t=e.target,tag=t&&t.tagName;
  if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA'){
    if(e.key==='Escape'&&tag==='TEXTAREA'&&t.dataset.ed){EDIT=null;renderJob();}
    return;
  }
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const {byKey}=issueIndex();
  const rows=visibleRows(byKey);
  if(!rows.length)return;
  const at=Math.max(0,rows.findIndex(r=>r.key===SEL));
  if(e.key==='j'||e.key==='ArrowDown'){e.preventDefault();SEL=rows[Math.min(rows.length-1,at+1)].key;EDIT=null;renderJob();return;}
  if(e.key==='k'||e.key==='ArrowUp'){e.preventDefault();SEL=rows[Math.max(0,at-1)].key;EDIT=null;renderJob();return;}
  if(!SEL)return;
  if(e.key==='a'){e.preventDefault();review(SEL,'ok');return;}
  if(e.key==='x'){e.preventDefault();review(SEL,rows[at]&&rows[at].state==='dropped'?'pending':'dropped');return;}
  if(e.key==='e'){e.preventDefault();EDIT=SEL;renderJob();return;}
  if(e.key==='Escape'){EDIT=null;renderJob();}
});

$('#bannerClose').onclick=hideBanner;
$('#btnRefresh').onclick=()=>{if(VIEW==='job'&&JOB)openJob(JOB.jobId);else openList();};
$('#btnLogout').onclick=()=>{TOKEN=null;localStorage.removeItem('wbr.admin.token');renderLogin();};
if(TOKEN)openList();else renderLogin();
</script>
