<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>WB 청크브레인 · 관리</title>
  <link rel="icon" href="/chunk/icon.svg" type="image/svg+xml">
  <style>
    /* 하루브레인 관리 화면과 같은 뼈대 — 강사가 두 화면을 오가며 헤매지 않게 색만 청크브레인(자두색)으로 */
    :root{--navy:#7A2E5C;--blue:#2F5F8F;--sky:#E7EEF6;--bg:#F7F4F0;--line:#E6E0E4;--muted:#6F667A;--ink:#2A2430;--ok:#14755e;--warn:#8a4b08;--bad:#9b352b;--plum-soft:#F5E6EE;--gold:#C8892A;--gold-soft:#FBF0DC}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;line-height:1.6}
    header{display:flex;align-items:center;gap:14px;padding:13px 20px;background:var(--navy);color:#fff}header b{font-size:17px}header small{opacity:.8}header .sp{flex:1}
    .hbtn{min-height:38px;padding:6px 14px;border:1px solid #ffffff55;border-radius:10px;background:transparent;color:#fff;font-weight:800;cursor:pointer}
    nav{display:flex;gap:6px;flex-wrap:wrap;max-width:1200px;margin:12px auto 0;padding:0 14px}
    nav button{min-height:38px;padding:5px 14px;border-radius:999px;border:1.5px solid #d9c4d0;background:#fff;font-weight:800;color:var(--navy);cursor:pointer}
    nav button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
    main{max-width:1200px;margin:auto;padding:14px 14px 60px}
    .card{margin-bottom:14px;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:#fff}
    h2{margin:0 0 6px;color:var(--navy);font-size:17px}h3{margin:12px 0 6px;color:var(--navy);font-size:14px}
    button{font:inherit;cursor:pointer}input,select,textarea{font:inherit;min-height:40px;padding:6px 10px;border:1.5px solid #d9c4d0;border-radius:10px;background:#fff;color:var(--ink)}
    textarea{width:100%;min-height:70px}
    .btn{min-height:40px;padding:6px 16px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-weight:900}
    .btn.ghost{background:#fff;border:1.5px solid #d9c4d0;color:var(--navy)}.btn.sm{min-height:30px;padding:2px 10px;font-size:12.5px}.btn.danger{background:#fff;border:1.5px solid #efc2bb;color:var(--bad)}
    .btn:disabled{opacity:.5;cursor:default}
    .tag{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--plum-soft);color:var(--navy);font-size:12px;font-weight:800}.tag.ok{background:#e7f6f0;color:var(--ok)}.tag.bad{background:#fff0ef;color:var(--bad)}.tag.warn{background:var(--gold-soft);color:var(--warn)}.tag.muted{background:#f1eef0;color:var(--muted)}
    .tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13.5px;white-space:nowrap}th{position:sticky;top:0;background:#f4eef2;color:var(--navy);font-size:12px}
    th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}tbody tr:nth-child(even) td{background:#fbf8fa}
    tr.pick td{cursor:pointer}tr.pick:hover td{background:var(--plum-soft)}
    /* 태블릿: 표는 가로로 넘기되 이름 열은 붙어 있어야 어느 학생 줄인지 안다 */
    .tbl{-webkit-overflow-scrolling:touch}.tbl td:first-child,.tbl th:first-child{position:sticky;left:0;background:#fff;z-index:2;box-shadow:1px 0 0 var(--line)}.tbl th:first-child{z-index:3;background:#f4eef2}tbody tr:nth-child(even) td:first-child{background:#fbf8fa}
    tr.att td{background:#FBECEC!important}tr.att:hover td{background:#F6DEDE!important}.tag.att{background:#F4C7C7;color:var(--bad)}
    .chk-h{grid-column:1/-1;font-weight:800;color:var(--navy);font-size:12.5px;margin-top:4px}
    .grid-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;align-items:end}label.f{display:flex;flex-direction:column;font-size:12.5px;font-weight:800;color:var(--muted)}
    .err{color:var(--bad);font-weight:700;font-size:13px;margin-top:8px;white-space:pre-wrap}.ok{color:var(--ok);font-weight:700;font-size:13px;margin-top:8px;white-space:pre-wrap}.muted{color:var(--muted);font-size:12.5px}
    #loginCard{max-width:380px;margin:60px auto}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:8px 0}
    .stat{background:#fbf8fa;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:22px;color:var(--navy)}.stat span{font-size:12px;color:var(--muted)}
    .bar{display:flex;align-items:center;gap:10px;margin:6px 0}.bar .lab{width:260px;font-size:13.5px}.bar .track{flex:1;height:14px;background:#f1eef0;border-radius:99px;overflow:hidden}.bar .fill{height:100%;background:var(--gold);border-radius:99px}.bar .n{width:130px;font-size:12.5px;color:var(--muted);text-align:right}
    .checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px}
    .checks label{display:flex;gap:8px;align-items:center;font-size:13.5px;min-height:30px}
    .weak{display:inline-block;margin:2px 4px 2px 0;padding:2px 8px;border-radius:8px;background:var(--gold-soft);color:var(--warn);font-size:12.5px;font-weight:700}
    pre{background:#fbf8fa;padding:10px;border-radius:10px;overflow:auto;font-size:12px}
    @media (max-width:640px){.bar .lab{width:150px}.bar .n{width:90px}}
  </style>
</head>
<body>
<header><b>청크브레인 관리</b><small>반 현황 · 학생 상세 · 과제 · 약한 규칙 · 교재</small><span class="sp"></span><button class="hbtn" id="btnRefresh" hidden>새로고침</button><button class="hbtn" id="btnLogout" hidden>로그아웃</button></header>
<nav id="nav" hidden>
  <button data-tab="board" aria-pressed="true">반 현황</button><button data-tab="student">학생 상세 · 과제</button><button data-tab="weak">약한 규칙</button><button data-tab="author">글 저작</button><button data-tab="print">교재 출력</button>
</nav>
<main id="main"></main>
<script src="/chunk/rules.js"></script>
<script src="/chunk/lessons.js"></script>
<script src="/chunk/passages.js"></script>
<script src="/admin/admin-login.js"></script>
<script>
'use strict';
const $=(s)=>document.querySelector(s);
const esc=(s)=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const R=WBCHUNK, LESSONS=WBCHUNK_LESSONS, PASSAGES=WBCHUNK_PASSAGES;
const pById=(id)=>PASSAGES.find((p)=>p.id===id)||(CUSTOM||[]).find((p)=>p.id===id);
const lById=(id)=>LESSONS.find((l)=>l.id===id);
const bandLabel=(b)=>R.BANDS[b]?R.BANDS[b].label:(b||'-');
let TOKEN=localStorage.getItem('wbr.admin.token')||null;
let TAB='board', ROWS=null, SEL=null, FILTER_CLS='', SORT='attention', ONLY_LATE=false;
let CUSTOM=null, ED=null, IMPORT=null;   /* 선생님 지문 목록(서버) · 편집 중인 글 · 진로독서 가져오기 패널 */
let LOGIN_MODE=localStorage.getItem('wbr.admin.loginMode')||'account';   /* 로그인 갈래 — 아이디·비밀번호가 기본, PIN 은 링크로(브레인레터 관리와 동일) */
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
async function api(path,opt){
  let r;
  try{r=await fetch('/api'+path,Object.assign({headers:{'Content-Type':'application/json',...(TOKEN?{Authorization:'Bearer '+TOKEN}:{})}},opt||{}));}
  catch(e){throw new Error('네트워크 오류');}
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&TOKEN){TOKEN=null;localStorage.removeItem('wbr.admin.token');renderLogin('세션이 만료됐어요. 다시 로그인해 주세요.');throw new Error('auth');}
  if(!r.ok){const e=new Error(j.error||('오류 '+r.status));e.status=r.status;e.body=j;throw e;}
  return j;
}
const post=(p,b)=>api(p,{method:'POST',body:JSON.stringify(b)});
const put=(p,b)=>api(p,{method:'PUT',body:JSON.stringify(b)});
/* <form> 으로 두는 이유: 브라우저 비밀번호 관리자가 아이디·비밀번호 칸을 알아보고 저장·자동 입력한다. 제출은 fetch 로만 */
function renderLogin(msg){
  $('#nav').hidden=true;$('#btnLogout').hidden=true;$('#btnRefresh').hidden=true;
  /* 로그인 폼은 공용 모듈이 그린다(아이디·비밀번호 기본, PIN 갈래로 전환) — reading-server/public/admin-login.js */
  $('#main').innerHTML='<div class="card" id="loginCard"><h2>강사 로그인</h2><div id="loginHost"></div></div>';
  WBAdminLogin.mount({host:'#loginHost',message:msg||'',classes:{btn:'btn'},onToken:function(t){TOKEN=t;try{localStorage.setItem('wbr.admin.token',TOKEN);}catch(e){}ROWS=null;show(TAB);}});
}
$('#btnLogout').onclick=()=>{TOKEN=null;localStorage.removeItem('wbr.admin.token');renderLogin();};
$('#btnRefresh').onclick=()=>{ROWS=null;CUSTOM=null;show(TAB);};
document.querySelectorAll('nav button').forEach((b)=>{b.onclick=()=>{TAB=b.dataset.tab;show(TAB);};});

const rel=(t)=>{if(!t)return '-';const d=Math.floor((Date.now()-t)/86400000);return d<=0?'오늘':d===1?'어제':d+'일 전';};
const ymd=(t)=>{const d=new Date(t);return d.getMonth()+1+'/'+d.getDate();};
async function loadRows(){ if(ROWS) return ROWS; const j=await api('/chunk/admin/overview'); ROWS=j.rows||[]; return ROWS; }
async function loadCustom(){ if(CUSTOM) return CUSTOM; const j=await api('/chunk/admin/custom'); CUSTOM=j.custom||[]; return CUSTOM; }

async function show(tab){
  if(!TOKEN){renderLogin();return;}
  $('#nav').hidden=false;$('#btnLogout').hidden=false;$('#btnRefresh').hidden=false;
  document.querySelectorAll('nav button').forEach((b)=>b.setAttribute('aria-pressed',String(b.dataset.tab===tab)));
  $('#main').innerHTML='<div class="card muted">불러오는 중…</div>';
  try{
    await loadRows();
    if(tab==='board') renderBoard();
    else if(tab==='student'){ await loadCustom(); await renderStudent(); }
    else if(tab==='weak') renderWeak();
    else if(tab==='author') await renderAuthor();
    else renderPrint();
  }catch(e){ if(e.message!=='auth') $('#main').innerHTML='<div class="card"><div class="err">'+esc(e.message)+'</div></div>'; }
}

/* ── 반 현황 ── */
/* 주의 점수 0~5 — 클수록 먼저 볼 학생. 최근 평균 60 미만, 7일 넘게 무활동, 마감 지난 미완료 과제, 과제가 있는데 시작 안 함 */
function attention(r){
  let a=0; const now=Date.now();
  if(r.recentAvg!=null&&r.recentAvg<60)a+=2;
  if(r.attempts>0&&r.lastAt&&now-r.lastAt>7*86400000)a+=2;
  if(r.assign){const total=r.assign.passages+r.assign.lessons; if(total&&r.assignDone<total){ if(r.assign.due&&r.assign.due<today())a+=1; if(r.attempts===0)a+=1; }}
  return a;
}
const isLate=(r)=>!!(r.assign&&(r.assign.passages+r.assign.lessons)&&r.assignDone<(r.assign.passages+r.assign.lessons)&&r.assign.due&&r.assign.due<today());
/* 미완료 과제 명단 CSV — 마감 지난 것 먼저, 마감 없는 미완료도 뒤에. 엑셀이 한글을 읽게 BOM 을 붙인다 */
function lateCsv(rows){
  const list=rows.filter((r)=>r.assign&&(r.assign.passages+r.assign.lessons)&&r.assignDone<(r.assign.passages+r.assign.lessons)).sort((a,b)=>(isLate(b)-isLate(a))||String(a.assign.due||'9').localeCompare(String(b.assign.due||'9')));
  const q=(v)=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const lines=[['이름','반','코드','마감','상태','완료/전체','최근 평균','최근 활동','메모'].map(q).join(',')].concat(list.map((r)=>[r.name,r.cls,r.code,r.assign.due||'',isLate(r)?'마감 지남':'진행 중',r.assignDone+'/'+(r.assign.passages+r.assign.lessons),r.recentAvg==null?'':r.recentAvg,r.lastAt?new Date(r.lastAt).toISOString().slice(0,10):'없음',r.assign.note||''].map(q).join(',')));
  return {n:list.length,late:list.filter(isLate).length,csv:'\ufeff'+lines.join('\r\n')};
}
function renderBoard(){
  const classes=[...new Set(ROWS.map((r)=>r.cls).filter(Boolean))].sort();
  let rows=ROWS.filter((r)=>!FILTER_CLS||r.cls===FILTER_CLS).filter((r)=>!ONLY_LATE||isLate(r));
  const key={attention:(r)=>attention(r)*1e13+(r.lastAt||0),lastAt:(r)=>r.lastAt||0,recentAvg:(r)=>r.recentAvg==null?-1:r.recentAvg,index:(r)=>r.index==null?-1:r.index,attempts:(r)=>r.attempts,streak:(r)=>r.streak,name:(r)=>r.name}[SORT]||((r)=>r.lastAt||0);
  rows=rows.slice().sort((a,b)=>{const x=key(a),y=key(b);return typeof x==='string'?x.localeCompare(y):(y-x);});
  const active7=ROWS.filter((r)=>r.lastAt&&Date.now()-r.lastAt<7*86400000).length;
  const avgAll=ROWS.filter((r)=>r.recentAvg!=null);
  let html='<div class="card"><h2>반 현황 <span class="muted">('+ROWS.length+'명)</span></h2>'+
    '<div class="stats"><div class="stat"><b>'+active7+'</b><span>최근 7일 연습</span></div><div class="stat"><b>'+(avgAll.length?Math.round(avgAll.reduce((s,r)=>s+r.recentAvg,0)/avgAll.length):'-')+'</b><span>최근 평균(연습한 학생)</span></div><div class="stat"><b>'+ROWS.filter((r)=>r.assign).length+'</b><span>과제 있는 학생</span></div><div class="stat"><b>'+ROWS.reduce((s,r)=>s+(r.graduated||0),0)+'</b><span>졸업한 글(합계)</span></div></div>'+
    '<div class="row"><label class="f">반 <select id="cls"><option value="">전체</option>'+classes.map((c)=>'<option '+(c===FILTER_CLS?'selected':'')+'>'+esc(c)+'</option>').join('')+'</select></label>'+
    '<label class="f">정렬 <select id="sort">'+[['attention','주의 순'],['lastAt','최근 활동'],['recentAvg','최근 평균'],['index','끊어읽기 지수'],['attempts','연습 횟수'],['streak','연속일'],['name','이름']].map(([k,l])=>'<option value="'+k+'" '+(k===SORT?'selected':'')+'>'+l+'</option>').join('')+'</select></label>'+
    '<label class="f" style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" id="onlyLate" '+(ONLY_LATE?'checked':'')+'> 마감 지난 미완료만</label>'+
    '<button class="btn ghost sm" id="csvLate">미완료 명단 CSV</button><span class="muted" id="csvMsg"></span></div>'+
    '<p class="muted"><b>붉은 줄</b>은 먼저 볼 학생 — 최근 평균 60 미만, 7일 넘게 무활동, 마감 지난 미완료 과제, 과제가 있는데 시작 안 함. 지수는 끊어읽기 지수(최근 5회 각각의 지문 단계로 가중한 평균, 0~100)로 상담·리포트에 인용하는 숫자예요. 어절/분은 초3 이상의 묵독 속도로 학생 자신의 지난 기록과만 비교합니다. 행을 누르면 학생 상세로 갑니다.</p></div>';
  html+='<div class="card tbl"><table><thead><tr><th>이름</th><th>반</th><th>단계</th><th>연습</th><th>최근 평균</th><th>지수</th><th>문제</th><th>어절/분</th><th>연속일</th><th>카드</th><th>과제</th><th>약한 규칙</th><th>최근 활동</th></tr></thead><tbody>'+
    (rows.length?rows.map((r)=>{
      const a=r.assign; const total=a?a.passages+a.lessons:0; const att=attention(r);
      const assignCell=a?('<span class="tag '+(total&&r.assignDone>=total?'ok':isLate(r)?'bad':'warn')+'">'+r.assignDone+'/'+total+'</span>'+(a.due?' <span class="muted">~'+esc(a.due.slice(5))+'</span>':'')):'<span class="muted">-</span>';
      const avgTag=r.recentAvg==null?'-':'<span class="tag '+(r.recentAvg>=85?'ok':r.recentAvg>=60?'warn':'bad')+'">'+r.recentAvg+'</span>';
      const nameTag=att>=2?' <span class="tag att">주의</span>':(r.attempts===0?' <span class="tag muted">미시작</span>':'');
      return '<tr class="pick'+(att>=2?' att':'')+'" data-code="'+esc(r.code)+'"><td><b>'+esc(r.name)+'</b>'+nameTag+'<div class="muted">'+esc(r.code)+'</div></td><td>'+esc(r.cls||'-')+'</td><td>'+bandLabel(r.band)+(a&&a.band&&a.band!==r.band?' <span class="tag">과제 '+bandLabel(a.band)+'</span>':'')+'</td><td>'+r.attempts+'</td><td>'+avgTag+'</td><td>'+(r.index==null?'-':'<b>'+r.index+'</b>')+'</td><td>'+(r.qRate==null?'-':r.qRate+'%')+'</td><td>'+(r.wpmRecent||'-')+'</td><td>'+r.streak+'</td><td>'+r.lessonsDone+'</td><td>'+assignCell+'</td><td>'+(r.weak||[]).slice(0,2).map((w)=>'<span class="weak">'+esc(R.TAG_LABEL[w.tag]||w.tag)+' '+w.n+'</span>').join('')+'</td><td>'+rel(r.lastAt)+'</td></tr>';
    }).join(''):'<tr><td colspan="13" class="muted">'+(ONLY_LATE?'마감 지난 미완료 과제가 없어요.':'명단에 학생이 없어요. 진로독서 관리에서 학생을 등록하면 여기 나타나요.')+'</td></tr>')+'</tbody></table></div>';
  $('#main').innerHTML=html;
  $('#cls').onchange=(e)=>{FILTER_CLS=e.target.value;renderBoard();};
  $('#sort').onchange=(e)=>{SORT=e.target.value;renderBoard();};
  $('#onlyLate').onchange=(e)=>{ONLY_LATE=e.target.checked;renderBoard();};
  $('#csvLate').onclick=()=>{
    const out=lateCsv(ROWS.filter((r)=>!FILTER_CLS||r.cls===FILTER_CLS));
    if(!out.n){$('#csvMsg').textContent='미완료 과제가 없어요.';return;}
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out.csv],{type:'text/csv;charset=utf-8'}));a.download='청크브레인-미완료-'+today()+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
    $('#csvMsg').textContent='미완료 '+out.n+'명(마감 지남 '+out.late+'명)을 내려받았어요.';
  };
  document.querySelectorAll('tr.pick').forEach((tr)=>{tr.onclick=()=>{SEL=tr.dataset.code;TAB='student';show(TAB);};});
}

/* ── 학생 상세 · 과제 ── */
async function renderStudent(){
  if(!SEL&&ROWS.length) SEL=ROWS[0].code;
  const row=ROWS.find((r)=>r.code===SEL);
  let html='<div class="card"><h2>학생 상세 · 과제</h2><div class="row"><label class="f">학생 <select id="sel">'+(ROWS.length?ROWS.map((r)=>'<option value="'+esc(r.code)+'" '+(r.code===SEL?'selected':'')+'>'+esc(r.name)+' ('+esc(r.cls||'반 없음')+')</option>').join(''):'<option value="">학생 없음</option>')+'</select></label>'+
    '<label class="f">다른 코드로 과제 주기 <input id="code" placeholder="wb-…" style="width:160px"></label><button class="btn ghost sm" id="goCode">열기</button></div></div>';
  html+=bulkCard();

    $('#lList').querySelectorAll('input').forEach((cb)=>{cb.onchange=()=>{if(cb.checked)chosenL.add(cb.dataset.l);else chosenL.delete(cb.dataset.l);};});};

/* 카드 체크 목록 — 단계별로 묶어 그린다(그 단계까지, 위 단계부터). 단일 과제·반 단위 과제가 같이 쓴다 */
function lessonChecks(band,chosen,attr){
  const upto=R.BAND_ORDER.slice(0,R.BAND_ORDER.indexOf(band)+1).reverse();
  return upto.map((b)=>{const ls=LESSONS.filter((l)=>l.band===b);if(!ls.length)return '';return '<div class="chk-h">'+bandLabel(b)+(b===band?' — 이 단계':'')+'</div>'+ls.map((l)=>'<label><input type="checkbox" '+attr+'="'+l.id+'" '+(chosen.has(l.id)?'checked':'')+'> '+esc(l.title)+'</label>').join('');}).join('');
}
const passageChecks=(band,chosen,attr)=>PASSAGES.concat(CUSTOM||[]).filter((p)=>p.band===band).map((p)=>'<label><input type="checkbox" '+attr+'="'+p.id+'" '+(chosen.has(p.id)?'checked':'')+'> '+esc(p.title)+' <span class="muted">'+esc(p.genre)+'</span></label>').join('');
/* ── 반 단위 과제 — 한 반 전체에 같은 단계·글·카드·메모·마감을 한 번에. 학생마다 PUT 하나(서버 계약 그대로) ── */
function bulkCard(){
  const classes=[...new Set(ROWS.map((r)=>r.cls).filter(Boolean))].sort();
  return '<div class="card" id="bulkCard"><h2>반 단위 과제 <span class="muted">(한 반 전체에 같은 과제)</span></h2><p class="muted">반을 고르고 저장하면 그 반 학생 모두의 과제가 이 내용으로 바뀌어요(기존 과제는 덮어써요). 단계를 비우면 학생이 고른 단계를 그대로 둬요.</p>'+
    '<div class="grid-form"><label class="f">반 <select id="bCls">'+(classes.length?classes.map((c)=>'<option>'+esc(c)+'</option>').join(''):'<option value="">반 없음</option>')+'</select></label>'+
    '<label class="f">단계 <select id="bBand"><option value="">학생이 고른 대로</option>'+R.BAND_ORDER.map((b)=>'<option value="'+b+'">'+bandLabel(b)+'</option>').join('')+'</select></label>'+
    '<label class="f">글 목록 단계 <select id="bfBand">'+R.BAND_ORDER.map((b)=>'<option value="'+b+'" '+(b==='G3'?'selected':'')+'>'+bandLabel(b)+'</option>').join('')+'</select></label>'+
    '<label class="f">마감일 <input id="bDue" type="date"></label></div>'+
    '<h3>글</h3><div class="checks" id="bpList"></div><h3>카드</h3><div class="checks" id="blList"></div>'+
    '<h3>메모 (학생에게 보임)</h3><textarea id="bNote" maxlength="200" placeholder="예: 이번 주에 두 편, 소리 내어 3번씩"></textarea>'+
    '<div class="row" style="margin-top:8px"><button class="btn" id="bSave">반 전체에 저장</button><span class="muted" id="bCount"></span></div><div id="bMsg"></div></div>';
}
function bindBulk(){
  const chosenP=new Set(), chosenL=new Set();
  const draw=()=>{const b=$('#bfBand').value;$('#bpList').innerHTML=passageChecks(b,chosenP,'data-p')||'<span class="muted">이 단계에 글이 없어요.</span>';$('#blList').innerHTML=lessonChecks(b,chosenL,'data-l');
    $('#bpList').querySelectorAll('input').forEach((cb)=>{cb.onchange=()=>{if(cb.checked)chosenP.add(cb.dataset.p);else chosenP.delete(cb.dataset.p);};});
    $('#blList').querySelectorAll('input').forEach((cb)=>{cb.onchange=()=>{if(cb.checked)chosenL.add(cb.dataset.l);else chosenL.delete(cb.dataset.l);};});
    const n=ROWS.filter((r)=>r.cls===$('#bCls').value).length;$('#bCount').textContent=$('#bCls').value?n+'명에게':'';};
  draw();
  $('#bfBand').onchange=draw;$('#bCls').onchange=draw;
  $('#bBand').onchange=()=>{if($('#bBand').value){$('#bfBand').value=$('#bBand').value;draw();}};
  $('#bSave').onclick=async()=>{
    const cls=$('#bCls').value;const targets=ROWS.filter((r)=>r.cls===cls);
    $('#bMsg').innerHTML='';
    if(!targets.length){$('#bMsg').innerHTML='<div class="err">이 반에 학생이 없어요.</div>';return;}
    if(!chosenP.size&&!chosenL.size&&!$('#bBand').value&&!$('#bNote').value.trim()){$('#bMsg').innerHTML='<div class="err">단계·글·카드·메모 중 하나는 넣어 주세요.</div>';return;}
    if(!confirm(cls+' '+targets.length+'명의 과제를 이 내용으로 바꿀까요? 기존 과제는 덮어써요.'))return;
    const body={band:$('#bBand').value||null,passages:[...chosenP],lessons:[...chosenL],note:$('#bNote').value,due:$('#bDue').value||null};
    let ok=0;const fail=[];
    for(const r of targets){try{await put('/chunk/admin/assign/'+encodeURIComponent(r.code),body);ok++;}catch(e){fail.push(r.name+'('+e.message+')');}}

  };

function bindStudentTop(){

/* ── 약한 규칙 분포 ── */
function renderWeak(){
  const tot={}, who={};
  ROWS.forEach((r)=>(r.weak||[]).forEach((w)=>{tot[w.tag]=(tot[w.tag]||0)+w.n;who[w.tag]=(who[w.tag]||0)+1;}));
  const tags=Object.keys(tot).sort((a,b)=>tot[b]-tot[a]);
  const max=tags.length?tot[tags[0]]:1;
  const bands={}; ROWS.forEach((r)=>{const b=r.band||'?';bands[b]=(bands[b]||0)+1;});
  let html='<div class="card"><h2>약한 규칙 분포 <span class="muted">(학생별 최근 30회 실수 태그의 합)</span></h2><p class="muted">막대가 긴 규칙부터 수업에서 카드로 다루면 반 전체의 점수가 가장 빨리 오릅니다. 괄호는 그 실수를 두 번 이상 한 학생 수예요.</p>'+
    (tags.length?tags.map((t)=>{const l=LESSONS.find((x)=>x.tags.indexOf(t)>=0);return '<div class="bar"><div class="lab">'+esc(R.TAG_LABEL[t]||t)+'</div><div class="track"><div class="fill" style="width:'+Math.round(tot[t]/max*100)+'%"></div></div><div class="n">'+tot[t]+'회 ('+who[t]+'명)'+(l?' · '+esc(l.title):'')+'</div></div>';}).join(''):'<p class="muted">아직 모인 실수 태그가 없어요.</p>')+'</div>';
  html+='<div class="card"><h2>단계 분포</h2><div class="row">'+R.BAND_ORDER.filter((b)=>bands[b]).map((b)=>'<span class="tag">'+bandLabel(b)+' '+bands[b]+'명</span>').join('')+(bands['?']?'<span class="tag muted">단계 미정 '+bands['?']+'명</span>':'')+'</div></div>';
  html+='<div class="card"><h2>규칙 태그 설명</h2><div class="tbl"><table><thead><tr><th>태그</th><th>뜻</th><th>다루는 카드</th></tr></thead><tbody>'+Object.keys(R.TAG_LABEL).map((t)=>'<tr><td><code>'+esc(t)+'</code></td><td>'+esc(R.TAG_LABEL[t])+'</td><td>'+LESSONS.filter((l)=>l.tags.indexOf(t)>=0).map((l)=>bandLabel(l.band)+' 「'+esc(l.title)+'」').join(', ')+'</td></tr>').join('')+'</tbody></table></div></div>';
  $('#main').innerHTML=html;
}

/* ── 글 저작 — 선생님 지문(서버 저장). 붙여 넣기 → 규칙 초안 → 다듬기 → 저장. 진로독서 지문은 이미 끊겨 있어 그대로 초안이 된다. ── */
const LV_BAND={L1:'G2',L2:'G4',L3:'G8',L4:'G11'}, LV_LABEL={L1:'7세~초2',L2:'초3~6',L3:'중1~3',L4:'고1~3'};
const markedOf=(p)=>p.paragraphs.map((segs)=>R.toMarked(segs,'∕')).join('\n\n');
const wordsOf=(p)=>R.stats([].concat.apply([],p.paragraphs)).words;
async function renderAuthor(){ await loadCustom(); paintAuthor(); }
function paintAuthor(){
  let html='<div class="card"><h2>글 저작 <span class="muted">('+CUSTOM.length+'편 · 200편까지)</span></h2><p class="muted">여기서 올린 글은 학생 앱의 연습 목록(그 단계)과 교재 출력에 기본 지문과 똑같이 나타나고, 과제로도 줄 수 있어요. 글을 붙여 넣으면 규칙 검사기가 첫 끊기 초안을 내고, 선생님이 ∕ 를 옮겨 다듬은 뒤 저장해요. <b>라이선스 자료는 넣지 마세요</b> — 자체 창작·진로독서 지문만.</p>'+
    '<div class="row"><button class="btn" id="cNew">새 글 붙여 넣기</button><button class="btn ghost" id="cImport">진로독서 지문 가져오기</button></div></div>';
  html+='<div class="card tbl"><table><thead><tr><th>제목</th><th>단계</th><th>갈래</th><th>출처</th><th>어절</th><th>문제</th><th></th></tr></thead><tbody>'+
    (CUSTOM.length?CUSTOM.map((p)=>'<tr><td><b>'+esc(p.title)+'</b><div class="muted">'+esc(p.id)+'</div></td><td>'+bandLabel(p.band)+'</td><td>'+esc(p.genre)+'</td><td class="muted">'+(p.source&&p.source.kind==='reading'?'진로독서 '+esc(p.source.ref):'직접 작성')+'</td><td>'+wordsOf(p)+'</td><td>'+(p.q?'○':'-')+'</td><td><button class="btn ghost sm" data-edit="'+esc(p.id)+'">편집</button> <button class="btn danger sm" data-del="'+esc(p.id)+'">삭제</button></td></tr>').join(''):'<tr><td colspan="7" class="muted">아직 올린 글이 없어요. 「새 글 붙여 넣기」나 「진로독서 지문 가져오기」로 시작해요.</td></tr>')+'</tbody></table></div>';
  if(IMPORT) html+=importHtml();
  if(ED) html+=editorHtml();
  $('#main').innerHTML=html; bindAuthor();
}
function editorHtml(){
  const e=ED;
  return '<div class="card" id="editor"><h2>'+(e.id?'글 편집 <span class="muted">'+esc(e.id)+'</span>':'새 글')+'</h2>'+
    '<div class="grid-form"><label class="f">제목 <input id="eTitle" maxlength="60" value="'+esc(e.title)+'"></label>'+
    '<label class="f">단계 <select id="eBand">'+R.BAND_ORDER.map((b)=>'<option value="'+b+'" '+(b===e.band?'selected':'')+'>'+bandLabel(b)+' — '+esc(R.BANDS[b].who)+'</option>').join('')+'</select></label>'+
    '<label class="f">갈래 <input id="eGenre" maxlength="12" value="'+esc(e.genre)+'" placeholder="설명 · 이야기 · 경험"></label></div>'+
    (e.source&&e.source.kind==='reading'?'<p class="muted">출처: 진로독서 '+esc(e.source.ref)+' — 이미 끊긴 글이라 단계 눈금에 맞는지만 검사해요.</p>':'')+
    '<h3>본문 <span class="muted">뜻이 나뉘는 곳에 ∕ 또는 / · 문단은 빈 줄로</span></h3><textarea id="eText" rows="10" style="width:100%;font-size:15px;line-height:1.8">'+esc(e.marked)+'</textarea>'+
    '<div class="row" style="margin-top:6px"><button class="btn ghost sm" id="eDraft">초안 다시 끊기 (표시를 지우고 규칙대로)</button><button class="btn ghost sm" id="eCheck">규칙 검사</button><span class="muted" id="eStat"></span></div><div id="eWarn"></div>'+
    '<h3>이해 문제 <span class="muted">(선택 — 비워 두면 3단계에 문제가 없어요)</span></h3><div class="grid-form"><label class="f">질문 <input id="qQ" maxlength="200" value="'+esc(e.q?e.q.q:'')+'"></label>'+
    [0,1,2,3].map((i)=>'<label class="f">보기 '+(i+1)+' <input id="qC'+i+'" maxlength="80" value="'+esc(e.q&&e.q.choices[i]||'')+'"></label>').join('')+
    '<label class="f">정답 <select id="qA">'+[0,1,2,3].map((i)=>'<option value="'+i+'" '+(e.q&&e.q.answer===i?'selected':'')+'>보기 '+(i+1)+'</option>').join('')+'</select></label><label class="f">해설 <input id="qE" maxlength="200" value="'+esc(e.q?e.q.explain:'')+'"></label></div>'+
    '<div class="row" style="margin-top:10px"><button class="btn" id="eSave">저장</button><button class="btn ghost" id="eCancel">취소</button></div><div id="eMsg"></div></div>';
}
function importHtml(){
  const im=IMPORT, q=(im.q||'').trim();
  const rows=(im.list||[]).map((a,i)=>({a,i})).filter(({a})=>!q||a.title.indexOf(q)>=0);
  return '<div class="card" id="importer"><h2>진로독서 지문 가져오기</h2><p class="muted">진로독서 지문은 이미 의미 단위로 끊겨 있어 그대로 초안이 돼요. 학년대를 고르면 목록이 뜨고, 「가져오기」를 누르면 편집기에 들어와요. 단계는 학년대에 맞춰 미리 골라 두니 필요하면 바꾸세요.</p>'+
    '<div class="row"><label class="f">학년대 <select id="imLv">'+Object.keys(LV_LABEL).map((l)=>'<option value="'+l+'" '+(l===im.level?'selected':'')+'>'+l+' · '+LV_LABEL[l]+'</option>').join('')+'</select></label><input id="imQ" placeholder="제목 검색" style="width:180px" value="'+esc(im.q||'')+'"><button class="btn ghost sm" id="imClose">닫기</button></div>'+
    (im.err?'<div class="err">'+esc(im.err)+'</div>':im.list?'<div class="tbl" style="max-height:340px;overflow:auto;margin-top:8px"><table><thead><tr><th>제목</th><th>분야</th><th>어절</th><th>문단</th><th></th></tr></thead><tbody>'+
      (rows.length?rows.map(({a,i})=>'<tr><td>'+esc(a.title)+'</td><td class="muted">'+esc(a.category)+'</td><td>'+a.words+'</td><td>'+a.paras+'</td><td><button class="btn ghost sm" data-imp="'+i+'">가져오기</button></td></tr>').join(''):'<tr><td colspan="5" class="muted">맞는 글이 없어요.</td></tr>')+'</tbody></table></div>':'<p class="muted">불러오는 중…</p>')+'</div>';
}
async function loadImport(){
  IMPORT.list=null; IMPORT.err='';
  try{
    const r=await fetch('/articles-'+IMPORT.level+'.json',{headers:{Authorization:'Bearer '+TOKEN}});
    if(!r.ok) throw new Error('목록을 못 받았어요 ('+r.status+')');
    const d=await r.json();
    IMPORT.list=(d.articles||[]).filter((a)=>a.levels&&a.levels[IMPORT.level]&&Array.isArray(a.levels[IMPORT.level].paragraphs)&&a.status!=='draft')
      .map((a)=>{const lv=a.levels[IMPORT.level];return {id:a.id,title:lv.title||a.id,category:a.category||'',paragraphs:lv.paragraphs,words:R.stats([].concat.apply([],lv.paragraphs)).words,paras:lv.paragraphs.length};});
  }catch(e){ IMPORT.err=e.message; }
  paintAuthor();
}
function editorRead(){
  const marked=$('#eText').value, band=$('#eBand').value;
  const paragraphs=R.fromMarked(marked);
  const cs=[0,1,2,3].map((i)=>$('#qC'+i).value.trim()).filter(Boolean);
  const q=$('#qQ').value.trim()?{q:$('#qQ').value.trim(),choices:cs,answer:+$('#qA').value,explain:$('#qE').value.trim()}:null;
  return {band,title:$('#eTitle').value.trim(),genre:$('#eGenre').value.trim()||(ED.source&&ED.source.kind==='reading'?'진로독서':'선생님 글'),paragraphs,q,source:ED.source||{kind:'teacher',ref:''},marked};
}
function editorCheck(){
  const e=editorRead(), warns=[];
  e.paragraphs.forEach((segs,i)=>R.check(segs,e.band).forEach((m)=>warns.push((i+1)+'문단: '+m)));
  const st=R.stats([].concat.apply([],e.paragraphs)), b=R.BANDS[e.band];
  $('#eStat').textContent=e.paragraphs.length+'문단 · '+st.words+'어절 · 덩어리 '+st.n+'개 · 평균 '+st.avg+'어절 (눈금 '+b.target+', 상한 '+b.max+')';
  $('#eWarn').innerHTML=!e.paragraphs.length?'<div class="err">본문이 비어 있어요.</div>':warns.length?'<div class="warn"><b>규칙과 다른 자리 '+warns.length+'곳</b> — 뜻에 맞게 끊었다면 그대로 저장해도 돼요.<br>'+warns.slice(0,8).map(esc).join('<br>')+(warns.length>8?'<br>…외 '+(warns.length-8)+'곳':'')+'</div>':'<div class="ok">규칙 검사 통과 — 눈금 안에 있어요.</div>';
  return e;
}
function bindAuthor(){
  const nw=$('#cNew'); if(nw) nw.onclick=()=>{ED={id:null,band:'G3',title:'',genre:'',source:{kind:'teacher',ref:''},marked:'',q:null};IMPORT=null;paintAuthor();const t=$('#eText');if(t)t.focus();};
  const im=$('#cImport'); if(im) im.onclick=()=>{IMPORT={level:'L2',list:null,err:'',q:''};paintAuthor();loadImport();};
  document.querySelectorAll('[data-edit]').forEach((b)=>{b.onclick=()=>{const p=CUSTOM.find((x)=>x.id===b.dataset.edit);if(!p)return;ED={id:p.id,band:p.band,title:p.title,genre:p.genre,source:p.source,marked:markedOf(p),q:p.q};IMPORT=null;paintAuthor();$('#editor').scrollIntoView();};});
  document.querySelectorAll('[data-del]').forEach((b)=>{b.onclick=async()=>{const p=CUSTOM.find((x)=>x.id===b.dataset.del);if(!p||!confirm('「'+p.title+'」을(를) 지울까요? 이 글로 준 과제와 학생 기록의 제목이 사라져요.'))return;try{await api('/chunk/admin/custom/'+encodeURIComponent(p.id),{method:'DELETE'});CUSTOM=null;await renderAuthor();}catch(e){alert(e.message);}};});
  const lv=$('#imLv'); if(lv) lv.onchange=()=>{IMPORT.level=lv.value;loadImport();};
  const iq=$('#imQ'); if(iq) iq.oninput=()=>{IMPORT.q=iq.value;const pos=iq.selectionStart;paintAuthor();const n=$('#imQ');if(n){n.focus();n.setSelectionRange(pos,pos);}};
  const ic=$('#imClose'); if(ic) ic.onclick=()=>{IMPORT=null;paintAuthor();};
  document.querySelectorAll('[data-imp]').forEach((b)=>{b.onclick=()=>{const a=IMPORT.list[+b.dataset.imp];if(!a)return;ED={id:null,band:LV_BAND[IMPORT.level]||'G4',title:a.title,genre:'진로독서',source:{kind:'reading',ref:a.id+'|'+IMPORT.level},marked:a.paragraphs.map((segs)=>R.toMarked(segs,'∕')).join('\n\n'),q:null};IMPORT=null;paintAuthor();editorCheck();$('#editor').scrollIntoView();};});
  if(!ED) return;
  $('#eDraft').onclick=()=>{const plain=$('#eText').value.replace(/\s*[∕\/]+\s*/g,' ');const paras=R.draftParagraphs(plain,$('#eBand').value);$('#eText').value=paras.map((segs)=>R.toMarked(segs,'∕')).join('\n\n');editorCheck();};
  $('#eCheck').onclick=editorCheck;
  $('#eBand').onchange=()=>{if($('#eText').value.trim())editorCheck();};
  $('#eCancel').onclick=()=>{ED=null;paintAuthor();};
  $('#eSave').onclick=async()=>{
    const e=editorCheck(); $('#eMsg').innerHTML='';
    if(!e.title){$('#eMsg').innerHTML='<div class="err">제목을 넣어 주세요.</div>';return;}
    if(!e.paragraphs.length){$('#eMsg').innerHTML='<div class="err">본문이 비어 있어요.</div>';return;}
    const body={band:e.band,title:e.title,genre:e.genre,paragraphs:e.paragraphs,q:e.q,source:e.source};
    try{
      const j=ED.id?await put('/chunk/admin/custom/'+encodeURIComponent(ED.id),body):await post('/chunk/admin/custom',body);
      CUSTOM=null; ED=null; await renderAuthor();
      $('#main').insertAdjacentHTML('afterbegin','<div class="card"><div class="ok">저장했어요 — 「'+esc(j.passage.title)+'」('+bandLabel(j.passage.band)+'). 학생이 앱을 켜면 그 단계 연습 목록에 나타나요.</div></div>');
    }catch(err){ $('#eMsg').innerHTML='<div class="err">'+esc(err.message)+'</div>'; }
  };
}

/* ── 교재 출력 ── */
function renderPrint(){
  $('#main').innerHTML='<div class="card"><h2>교재 출력</h2><p class="muted">단계를 누르면 연습장 조판 화면이 새 창에서 열려요. 글을 고르고 <b>인쇄 → PDF 로 저장</b>하면 교재가 됩니다. 「글 저작」에서 올린 선생님 지문도 그 단계 목록에 함께 떠요(여기서 열면 관리 토큰으로 받아요).</p><div class="row">'+
    R.BAND_ORDER.map((b)=>'<a class="btn ghost" href="/chunk/print.html?band='+b+'" target="_blank" rel="noopener">'+bandLabel(b)+' <span class="muted">'+PASSAGES.filter((p)=>p.band===b).length+'편</span></a>').join('')+'</div>'+
    '<h3>화면 수업 <span class="muted">(프로젝터)</span></h3><p class="muted">큰 글씨로 띄워 놓고 스페이스를 누를 때마다 덩어리 경계를 하나씩 공개해요. 아이들이 먼저 손을 들어 맞히게 한 뒤 눌러요. 「내 글 넣기」로 수업 자료를 붙여 넣을 수도 있어요.</p><div class="row">'+
    R.BAND_ORDER.map((b)=>'<a class="btn ghost" href="/chunk/class.html?band='+b+'" target="_blank" rel="noopener">'+bandLabel(b)+'</a>').join('')+'</div>'+
    '<h3>추천 구성</h3><ul class="muted"><li>유치·초1·초2: 표시본(밑줄 곡선) + 한 줄 한 덩어리 판 + 무표시본. 어른이 먼저 읽어 주고 따라 읽기 3회.</li><li>초3~초6: 표시본 + 무표시본 + 정답표. 주 3회, 한 편 10분.</li><li>중·고등: 무표시본 위주로 직접 긋고 정답표와 견주기. 규칙 페이지는 첫 주에만.</li></ul></div>';
}

if(TOKEN) show(TAB); else renderLogin();
</script>
