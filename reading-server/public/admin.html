<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>WB 진로독서 · 관리</title>
  <style>
    :root{--navy:#173957;--blue:#087ba6;--sky:#eaf7fb;--bg:#f3f7f8;--line:#d9e5e9;--muted:#647784;--ink:#20384c;--ok:#14755e;--warn:#8a4b08;--bad:#9b352b;--coral:#c9503c}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;line-height:1.6}
    header{display:flex;align-items:center;gap:14px;padding:13px 20px;background:var(--navy);color:#fff}
    header b{font-size:17px}header small{opacity:.75}
    header .sp{flex:1}
    .hbtn{min-height:38px;padding:6px 14px;border:1px solid #ffffff55;border-radius:10px;background:transparent;color:#fff;font-weight:800;cursor:pointer}
    main{max-width:1080px;margin:auto;padding:18px 14px 60px}
    .card{margin-bottom:14px;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:#fff}
    h2{margin:0 0 6px;color:var(--navy);font-size:17px}
    button{font:inherit;cursor:pointer}
    input,select{font:inherit;min-height:42px;padding:0 10px;border:1.5px solid #bfd7e1;border-radius:10px;background:#fff;color:var(--ink)}
    .btn{min-height:42px;padding:6px 16px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:900}
    .btn.ghost{background:#fff;border:1.5px solid #bfd7e1;color:var(--navy)}
    .tag{display:inline-block;padding:3px 9px;border-radius:999px;background:var(--sky);color:var(--blue);font-size:12px;font-weight:800}
    .tag.ok{background:#e7f6f0;color:var(--ok)}.tag.bad{background:#fff0ef;color:var(--bad)}.tag.warn{background:#fff4e6;color:var(--warn)}.tag.muted{background:#eef2f4;color:var(--muted)}
    .stats{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 2px}
    .stat{flex:1;min-width:120px;padding:12px;border:1px solid #d6ebf4;border-radius:12px;background:#f5fbfe;text-align:center}
    .stat b{display:block;font-size:22px;color:var(--navy)}
    .stat span{font-size:12px;color:var(--muted);font-weight:800}
    .stat.warn{background:#fff0ef;border-color:#efc2bb}
    .stat.warn b{color:var(--bad)}
    tbody tr:nth-child(even) td{background:#f8fcfe}
    .tbl{overflow-x:auto}
    table{border-collapse:collapse;width:100%;font-size:13.5px;white-space:nowrap}
    th{position:sticky;top:0;background:#f0f5f7;color:var(--navy);font-size:12px}
    th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
    tr:hover td{background:#f8fcfe}
    .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
    .chip{min-height:36px;padding:5px 13px;border-radius:999px;border:1.5px solid #bfd7e1;background:#fff;font-weight:800;color:var(--navy)}
    .chip[aria-pressed="true"]{background:var(--sky);border-color:var(--blue)}
    .grid-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;align-items:end}
    .err{color:var(--bad);font-weight:700;font-size:13px;margin-top:8px}
    .muted{color:var(--muted);font-size:12.5px}
    #loginCard{max-width:380px;margin:60px auto}
    .namebtn{border:0;background:none;padding:0;font:inherit;color:var(--navy);font-weight:800;border-bottom:2px dotted var(--blue);cursor:pointer}
    dialog{border:1px solid var(--line);border-radius:14px;max-width:640px;width:94%;padding:0}
    dialog::backdrop{background:#17395766}
    .dlg-in{padding:18px 20px;max-height:82vh;overflow-y:auto}
    .dlg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
    .dlg-sec{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
    .dlg-sec h3{margin:0 0 6px;color:var(--navy);font-size:14px}
    .mini-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}
    .mini-stats .stat{padding:9px 4px;min-width:0}
    .mini-stats .stat b{font-size:17px}
    .rline{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed #e4edf1;font-size:13px}
    .rline small{color:var(--muted);flex:0 0 auto}
    details{margin-top:6px}
    details summary{cursor:pointer;color:var(--blue);font-weight:800;font-size:12.5px}
    details pre{white-space:pre-wrap;font:inherit;font-size:13px;background:#f8fcfe;border:1px solid #d6ebf4;border-radius:10px;padding:10px 12px;margin:6px 0 0}
    .linkrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
    .linkrow input{flex:1;min-width:220px;font-size:12.5px}
  .pendrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 0;border-top:1px solid var(--line)}
  .pendrow:first-of-type{border-top:0}
  .dlg-sec.danger{border-top:1px solid var(--line);margin-top:18px;padding-top:14px}
.btn.danger{background:var(--coral);border-color:var(--coral);color:#fff}
.btn.danger:hover{filter:brightness(.94)}
.qrbox{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-top:10px}
  .qrbox svg{border:1px solid var(--line);border-radius:10px;background:#fff}
  @media print{body *{visibility:hidden}#qrSheet,#qrSheet *,#qrSheetAll,#qrSheetAll *{visibility:visible}
    #qrSheet,#qrSheetAll{position:absolute;left:0;top:0;width:100%}
    /* QR 한 장이 쪽 사이에서 잘리면 학생이 못 찍는다 */
    #qrSheetAll .qrcard{break-inside:avoid;page-break-inside:avoid}}
  .qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-top:12px}
  .qrcard{border:1px solid #e2ddd0;border-radius:10px;padding:12px 8px;text-align:center;background:#fff}
  .qrcard b{display:block;margin-top:6px;color:#173957}
  .qrcard span{font-size:12px;color:#647784}
  </style>
</head>
<body>
<header><b>WB 진로독서 · 관리</b><small>강사용 현황판</small><span class="sp"></span>
  <button class="hbtn" id="linkReview" onclick="location.href='/review.html'">지문 검수</button>
  <button class="hbtn" onclick="location.href='/admin/vocab-review.html'">연상 검수함</button>
  <button class="hbtn" onclick="location.href='/admin/metrics.html'">파일럿 지표</button>
  <button class="hbtn" onclick="location.href='/admin/naesin-admin.html'">내신브레인</button>
  <button class="hbtn" id="btnRefresh" hidden>새로고침</button>
  <button class="hbtn" id="btnLogout" hidden>로그아웃</button>
</header>
<main id="app"></main>
<dialog id="dlg"></dialog>
<script src="/admin/qr.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TOKEN=localStorage.getItem('wbr.admin.token')||null;
let DATA=null,FILTER='전체',ARTS=null;
const LV={L1:'7세~초2',L2:'초3~6',L3:'중1~3',L4:'고1~3'};

async function api(path,opt){
  const r=await fetch('/api'+path,Object.assign({headers:{'Content-Type':'application/json',...(TOKEN?{Authorization:'Bearer '+TOKEN}:{})}},opt||{}));
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&TOKEN){TOKEN=null;localStorage.removeItem('wbr.admin.token');renderLogin('세션이 만료됐어요. 다시 로그인해 주세요.');throw new Error('auth');}
  if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
  return j;
}
let TB=null;
async function getTb(){
  if(TB)return TB;
  try{TB=(await api('/admin/textbook')).books||[];}catch(e){TB=[];}
  return TB;
}
async function getArts(){
  if(ARTS)return ARTS;
  try{const r=await fetch('/articles.json',{cache:'no-store'});ARTS=await r.json();}catch(e){ARTS={articles:[]};}
  return ARTS;
}
function titleOf(id,lv){
  const a=(ARTS&&ARTS.articles||[]).find(x=>x.id===id);
  if(!a)return id;
  const b=(a.levels||{})[lv]||a.levels.L3||a.levels.L2||a.levels.L4;
  return b?b.title:id;
}
function downloadJson(obj,name){
  const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
function copyText(t){
  const fb=()=>{window.prompt('복사해서 사용하세요:',t);};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>alert('복사했어요'),fb);else fb();
}
function renderLogin(msg){
  $('#btnRefresh').hidden=true;$('#btnLogout').hidden=true;
  $('#app').innerHTML=`<div class="card" id="loginCard"><h2>강사 로그인</h2>
    <p class="muted">관리 PIN을 입력하세요.</p>
    <div style="display:flex;gap:8px;margin-top:10px"><input id="pin" type="password" placeholder="PIN" style="flex:1">
    <button class="btn" id="doLogin">로그인</button></div>
    ${msg?`<p class="err">${esc(msg)}</p>`:''}</div>`;
  $('#doLogin').onclick=async()=>{
    try{const j=await api('/admin/login',{method:'POST',body:JSON.stringify({pin:$('#pin').value})});
      TOKEN=j.token;localStorage.setItem('wbr.admin.token',TOKEN);refresh();}
    catch(e){renderLogin(e.message);}
  };
  $('#pin').addEventListener('keydown',e=>{if(e.key==='Enter')$('#doLogin').click();});
}
function fmtLast(t){if(!t)return '—';const d=(Date.now()-new Date(t))/60000;
  if(d<2)return '방금';if(d<60)return Math.round(d)+'분 전';if(d<1440)return Math.round(d/60)+'시간 전';return Math.round(d/1440)+'일 전';}
function render(){
  $('#btnRefresh').hidden=false;$('#btnLogout').hidden=false;
  const all=DATA.students.slice();
  const classes=['전체',...new Set(all.map(s=>s.cls).filter(Boolean))];
  let list=FILTER==='전체'?all:all.filter(s=>s.cls===FILTER);
  list.sort((a,b)=>(a.today===b.today?0:a.today?1:-1)||(b.streak-a.streak));
  const linked=all.filter(s=>s.linked);
  const doneToday=linked.filter(s=>s.today).length;
  const backups=DATA.backups||[];
  const pend=DATA.pending||[];
  $('#app').innerHTML=`
  ${pend.length?`<div class="card" style="border-color:#c9503c">
    <h2>연동 승인 대기 <span class="chip" style="background:#fbeae6;color:#c9503c">${pend.length}</span></h2>
    <p class="muted">학생이 코드를 넣으면 여기 뜹니다. <b>본인이 맞는지 확인한 뒤</b> 승인해 주세요 — 승인해야 앱이 연결됩니다.</p>
    ${pend.map(x=>`<div class="pendrow">
      <span><b>${esc(x.name)}</b> <span class="muted">${esc(x.code)}${x.cls?' · '+esc(x.cls):''}${x.device?' · '+esc(x.device):''} · ${fmtLast(x.at)}</span></span>
      <span><button class="btn sm ghost" data-deny="${esc(x.nonce)}">거절</button>
      <button class="btn sm" data-appr="${esc(x.nonce)}">승인</button></span></div>`).join('')}
  </div>`:''}
  <div class="card"><h2>오늘 현황</h2><div class="stats">
    <div class="stat"><b>${all.length}</b><span>등록 학생</span></div>
    <div class="stat"><b>${linked.length}</b><span>앱 연동</span></div>
    <div class="stat"><b>${doneToday} / ${linked.length}</b><span>오늘의 1지문 완료</span></div>
    <div class="stat ${linked.length-doneToday>0?'warn':''}"><b>${linked.length-doneToday}</b><span>오늘 미수행</span></div>
    <div class="stat ${DATA.vpending>0?'warn':''}"><b>${DATA.vpending||0}</b><span>연상 검수 대기</span></div>
  </div><p class="muted">기준 ${new Date(DATA.time).toLocaleString('ko-KR')} · 미수행 학생이 위로 정렬됩니다. 학생 이름을 누르면 상세 기록이 열려요.</p></div>
  <div class="card"><h2>학생 현황판</h2>
    <div class="filters">${classes.map(c=>`<button class="chip" data-f="${esc(c)}" aria-pressed="${FILTER===c}">${esc(c)}</button>`).join('')}
      ${list.length?`<button class="btn sm ghost" id="qrAll">${esc(FILTER)} QR 시트 (${list.length}명)</button>`:''}</div>
    <div id="qrAllBox"></div>
    <div class="tbl"><table><thead><tr>
      <th>학생</th><th>반</th><th>읽는 글</th><th>오늘</th><th>연속</th><th>이번 주</th><th>완독</th><th>정답률</th><th>어휘</th><th>워드브레인</th><th>보고서</th><th>독서요약</th><th>훈련</th><th>마지막 활동</th></tr></thead><tbody>
      ${list.map(s=>`<tr>
        <td><button class="namebtn" data-view="${esc(s.code)}">${esc(s.name||'(미등록)')}</button> <span class="muted">${esc(s.code)}</span></td>
        <td>${esc(s.cls||'—')}</td>
        <td><select data-lv="${esc(s.code)}" ${s.name?'':'disabled'}>
          ${['','L1','L2','L3','L4'].map(l=>`<option value="${l}" ${s.level===l?'selected':''}>${l?LV[l]:'—'}</option>`).join('')}</select>
          ${s.appLevel&&s.appLevel!==s.level&&s.level?`<span class="tag warn">앱:${s.appLevel}</span>`:''}</td>
        <td>${s.linked?(s.today?'<span class="tag ok">완료</span>':'<span class="tag bad">미수행</span>'):'<span class="tag muted">미연동</span>'}</td>
        <td>${s.streak}일</td><td>${s.week}/7</td><td>${s.reads}</td>
        <td>${s.acc==null?'—':s.acc+'%'}</td><td>${s.vocab}</td>
        <td>${(v=>v&&v.total?`${v.due?`<span class="tag ${v.emergency?'bad':'warn'}">물 ${v.due}</span>`:'<span class="tag ok">말끔</span>'} 🌳${v.graduated}`:'<span class="muted">—</span>')(DATA.vmap&&DATA.vmap[s.code])}</td>
        <td>${s.reports}</td><td>${s.redbook}</td><td>${s.train}</td>
        <td>${fmtLast(s.lastActive)}</td></tr>`).join('')||'<tr><td colspan="14" class="muted">학생이 없습니다. 아래에서 등록하세요.</td></tr>'}
    </tbody></table></div></div>
  <div class="card"><h2>학생 등록 / 수정</h2>
    <p class="muted">같은 코드로 저장하면 수정됩니다. 학생은 앱 설정 → 선생님 연동에서 이 코드를 입력합니다.</p>
    <div class="grid-form" style="margin-top:8px">
      <label>코드<br><input id="fCode" placeholder="예: wb-101" style="width:100%"></label>
      <label>이름<br><input id="fName" style="width:100%"></label>
      <label>학년<br><input id="fGrade" placeholder="예: 중2" style="width:100%"></label>
      <label>반<br><input id="fCls" placeholder="예: 월수금A" style="width:100%"></label>
      <label>읽는 글<br><select id="fLv" style="width:100%"><option value="">자동(학년대로)</option><option value="L1">7세~초2</option><option value="L2">초3~6</option><option value="L3">중1~3</option><option value="L4">고1~3</option></select></label>
      <button class="btn" id="fSave">저장</button>
    </div><p class="err" id="fErr"></p></div>
  <div class="card"><h2>반 명단 한꺼번에 등록</h2>
    <p class="muted">출석부를 그대로 붙여넣으세요. 한 줄에 한 명, <b>이름</b>만 있으면 됩니다 —
      코드는 겹치지 않게 새로 만들어 드립니다. 이미 있는 코드로 저장하면 이름·반만 수정되고 기록은 그대로예요.</p>
    <div class="grid-form" style="margin-top:8px">
      <label>이 명단의 학년<br><input id="bGrade" placeholder="예: 초5" style="width:100%"></label>
      <label>이 명단의 반<br><input id="bCls" placeholder="예: 초5 A반" style="width:100%"></label>
      <label>코드 접두사<br><input id="bPrefix" placeholder="wb-" style="width:100%"></label>
    </div>
    <textarea id="bText" rows="7" style="width:100%;margin-top:8px"
      placeholder="김지우&#10;박서준&#10;이하윤&#10;&#10;줄마다 다르게 적고 싶으면: 이름 | 학년 | 반 | 코드"></textarea>
    <div class="filters" style="margin:10px 0 0">
      <button class="btn ghost" id="bPrev">미리보기</button>
      <button class="btn" id="bSave" disabled>등록하기</button>
    </div>
    <div id="bOut"></div></div>
  <div class="card"><h2>데이터 백업</h2>
    <p class="muted">모든 학생 기록을 JSON 파일로 컴퓨터에 보관하세요. 서버는 매일 새벽 자동 스냅샷을 최근 10일치 보관합니다.</p>
    <div class="filters" style="margin:10px 0 0">
      <button class="btn" id="bkNow">지금 전체 백업 내려받기</button>
      ${backups.length?backups.map(d=>`<button class="chip" data-bk="${esc(d)}">${esc(d)} 스냅샷</button>`).join(''):'<span class="muted">자동 스냅샷이 아직 없어요 — 매일 새벽에 만들어져요.</span>'}
    </div></div>
  <div class="card"><h2>교재 코칭 원문</h2>
    <p class="muted">원문(코칭글)은 공개 저장소가 아니라 <b>서버에만</b> 저장돼요. 코칭 카드가 비어 보이면 여기서 원문 JSON(reading/textbook.json 형식)을 올려 주세요.</p>
    <div id="tbSrcStatus" class="muted" style="margin-top:6px">확인 중…</div>
    <div class="filters" style="margin:10px 0 0">
      <input type="file" id="tbSrcFile" accept=".json,application/json">
      <button class="btn" id="tbSrcUp" disabled>원문 업로드</button>
    </div></div>
  <div class="card"><h2>학부모 주간 메시지</h2>
    <p class="muted">연동된 모든 학생의 주간 리포트 발송 문구(링크 포함)를 한 번에 만들어요. 카톡·문자에 붙여넣어 학생별로 잘라 보내세요.</p>
    <div class="filters" style="margin:10px 0 0">
      <button class="btn" id="pmMake">메시지 만들기</button>
      <button class="chip" id="pmCopy" hidden>전체 복사</button>
      <span class="muted" id="pmInfo"></span>
    </div>
    <textarea id="pmOut" hidden style="width:100%;min-height:220px;margin-top:10px;padding:11px;border:1.5px solid #bfd7e1;border-radius:10px;font:inherit;font-size:13px;line-height:1.6"></textarea></div>`;
  (async()=>{try{const s=await api('/admin/textbook-src');
    $('#tbSrcStatus').innerHTML=s.exists
      ?`<span class="tag ok">서버에 있음</span> 버전 ${esc(s.version||'-')} · 책 ${s.books.length}권 — ${s.books.map(b=>esc(b.id)+' '+b.lessons+'강').join(', ')}`
      :`<span class="tag bad">서버에 원문이 없어요</span> 코칭 카드가 비어 있습니다 — 아래에서 업로드해 주세요.`;
  }catch(e){$('#tbSrcStatus').textContent='원문 상태 확인 실패: '+e.message;}})();
  $('#tbSrcFile').onchange=()=>{$('#tbSrcUp').disabled=!$('#tbSrcFile').files.length;};
  $('#tbSrcUp').onclick=async()=>{
    $('#tbSrcUp').disabled=true;
    try{const txt=await $('#tbSrcFile').files[0].text();
      JSON.parse(txt);   /* 올리기 전에 파싱만 확인 — 깨진 파일로 왕복하지 않게 */
      const j=await api('/admin/textbook-src',{method:'PUT',body:txt});

/* ── 학생 상세 ── */
function stuReportText(r){
  const lines=['['+(r.title||'탐구보고서')+'] '+(r.done||'')];
  if(r.topic)lines.push('탐구 질문: '+r.topic);
  if(r.motive)lines.push('동기: '+r.motive);
  Object.entries(r.learned||{}).forEach(([id,l])=>{if(l)lines.push('알게 된 것: '+l);});
  if(r.more)lines.push('더 알아본 것: '+r.more);
  if(r.conclusion)lines.push('결론: '+r.conclusion);
  if(r.reflect)lines.push('성찰: '+r.reflect);
  return lines.join('\n');
}

async function refresh(){
  try{
    const [ov,bk,vv,vr,pd]=await Promise.all([
      api('/admin/overview'),
      api('/admin/backups').catch(()=>({backups:[]})),
      api('/vocab/admin/overview').catch(()=>({students:[]})),
      api('/vocab/admin/review').catch(()=>({items:[]})),
      api('/admin/pending').catch(()=>({pending:[]})),
    ]);
    DATA=ov;DATA.backups=bk.backups||[];DATA.pending=pd.pending||[];
    DATA.vmap={};(vv.students||[]).forEach(s=>{DATA.vmap[s.code]=s;});
    DATA.vpending=(vr.items||[]).filter(i=>i.status==='pending').length;
    render();
  }
  catch(e){if(e.message!=='auth')renderLogin(e.message);}
}
