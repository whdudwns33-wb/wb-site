<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WB 청크브레인 — 연습장 출력</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <style>
    /* 화면에서는 왼쪽에 설정, 오른쪽에 종이 미리보기. 인쇄하면 설정은 사라지고 종이만 A4 로 나간다.
       브라우저의 「인쇄 → PDF 로 저장」이 곧 PDF 교재다 — 서버도 라이브러리도 필요 없다. */
    :root { --plum:#7A2E5C; --line:#DDD6DA; --soft:#6F667A; --ink:#1F1A22; }
    * { box-sizing:border-box; }
    html, body { margin:0; padding:0; }
    body { background:#ECE8E4; color:var(--ink); font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; font-size:15px; line-height:1.6; word-break:keep-all; }
    button, select, input, textarea { font-family:inherit; font-size:inherit; }
    .wrap { display:grid; grid-template-columns:340px 1fr; min-height:100vh; }
    aside { background:#fff; border-right:1px solid var(--line); padding:16px; position:sticky; top:0; height:100vh; overflow:auto; }
    aside h1 { font-size:17px; color:var(--plum); margin:0 0 4px; }
    aside h2 { font-size:13px; color:var(--soft); margin:16px 0 6px; text-transform:uppercase; letter-spacing:.04em; }
    aside label { display:flex; align-items:center; gap:8px; min-height:32px; font-size:14px; }
    aside select, aside input[type=text], aside textarea { width:100%; border:1.5px solid var(--line); border-radius:8px; padding:6px 8px; }
    aside textarea { min-height:120px; }
    .big { display:block; width:100%; min-height:46px; border-radius:12px; background:var(--plum); color:#fff; font-weight:900; border:none; margin-top:10px; cursor:pointer; }
    .big.ghost { background:#fff; color:var(--plum); border:2px solid var(--plum); }
    .small { font-size:12.5px; color:var(--soft); }
    .warn { background:#FBF0DC; border-radius:8px; padding:8px; font-size:12.5px; margin-top:6px; }
    .plist { display:grid; gap:4px; max-height:220px; overflow:auto; border:1px solid var(--line); border-radius:8px; padding:6px; }
    .preview { padding:20px; }
    /* ── 종이 ── */
    .page { background:#fff; width:210mm; min-height:297mm; margin:0 auto 16px; padding:16mm 16mm 18mm; box-shadow:0 4px 18px #0002; position:relative; page-break-after:always; break-after:page; }
    .page:last-child { page-break-after:auto; break-after:auto; }
    .page .hd { display:flex; justify-content:space-between; align-items:baseline; border-bottom:2px solid var(--plum); padding-bottom:4px; margin-bottom:10px; font-size:12px; color:var(--soft); }
    .page .hd b { color:var(--plum); font-size:13px; }
    .page .ft { position:absolute; left:16mm; right:16mm; bottom:8mm; display:flex; justify-content:space-between; font-size:10.5px; color:var(--soft); }
    .title { font-size:20px; font-weight:900; margin:4px 0 2px; }
    .sub { font-size:12.5px; color:var(--soft); margin:0 0 10px; }
    .cover { text-align:center; padding-top:40mm; }
    .cover .t1 { font-size:34px; font-weight:900; color:var(--plum); }
    .cover .t2 { font-size:18px; margin-top:6px; }
    .cover .box { margin:30px auto 0; width:120mm; text-align:left; font-size:15px; }
    .cover .box div { display:flex; gap:8px; align-items:baseline; margin:12px 0; }
    .cover .box span { flex:none; width:76px; color:var(--soft); }
    .cover .box i { flex:1; border-bottom:1.5px solid #333; display:block; height:22px; }
    .toc { text-align:left; margin:24px auto 0; width:140mm; font-size:13.5px; }
    .toc div { display:flex; justify-content:space-between; border-bottom:1px dotted #999; padding:3px 0; }
    .howto { text-align:left; width:150mm; margin:20px auto 0; font-size:13px; background:#F7F1F4; border-radius:10px; padding:10px 14px; }
    .howto ol { margin:4px 0 0 18px; padding:0; }
    .rulecard { border:1px solid var(--line); border-radius:10px; padding:8px 12px; margin:0 0 8px; break-inside:avoid; }
    .rulecard b { color:var(--plum); }
    .rulecard .r { font-weight:800; margin:2px 0; }
    .rulecard .w { font-size:12.5px; color:var(--soft); }
    .rulecard .ex { margin-top:4px; }
    .body { line-height:2.15; font-size:15px; margin:6px 0; }
    .body p { margin:0 0 10px; text-indent:0; }
    .body.plain p { line-height:2.7; letter-spacing:.02em; word-spacing:.35em; }
    .lines p { margin:0; }
    .lines .seg { display:block; }
    .sz-large .body { font-size:18px; line-height:2.3; } .sz-large .body.plain p { line-height:3; }
    .sz-xlarge .body { font-size:22px; line-height:2.4; } .sz-xlarge .body.plain p { line-height:3.1; word-spacing:.5em; }
    .seg { display:inline; }
    .m-slash .seg:not(:last-child)::after { content:"∕"; color:var(--plum); font-weight:900; margin:0 5px 0 2px; }
    .m-scoop .seg { border-bottom:2.2px solid #333; border-radius:0 0 12px 12px; padding:0 2px 1px; margin-right:9px; }
    .m-band .seg { padding:1px 4px; margin-right:5px; border-radius:4px; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .m-band .seg:nth-child(odd) { background:#EFE4EA; } .m-band .seg:nth-child(even) { background:#F5EBDC; }
    .key .body { font-size:12.5px; line-height:1.9; }
    .key .m-slash .seg:not(:last-child)::after { margin:0 3px 0 1px; }
    .task { border:1.5px dashed var(--plum); border-radius:10px; padding:8px 12px; margin:8px 0; font-size:13px; }
    .task b { color:var(--plum); }
    .boxes { display:flex; gap:12px; flex-wrap:wrap; align-items:center; font-size:13px; margin:6px 0; }
    .cb { display:inline-block; width:16px; height:16px; border:1.5px solid #333; border-radius:3px; vertical-align:-3px; margin-right:4px; }
    .q { margin-top:10px; font-size:14px; }
    .q .qq { font-weight:800; margin-bottom:4px; }
    .q .c { margin:3px 0 3px 4px; }
    .score { display:flex; gap:14px; font-size:13px; margin-top:10px; align-items:center; }
    .score i { display:inline-block; width:38px; border-bottom:1.5px solid #333; height:18px; }
    table.rec { width:100%; border-collapse:collapse; font-size:12.5px; }
    table.rec th, table.rec td { border:1px solid #999; padding:6px 4px; text-align:center; height:34px; }
    table.rec th { background:#F1ECEF; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .legend { font-size:12px; color:var(--soft); margin:2px 0 8px; }
    @media print {
      body { background:#fff; }
      .wrap { display:block; }
      aside, .no-print { display:none !important; }
      .preview { padding:0; }
      .page { box-shadow:none; margin:0; width:auto; min-height:0; padding:0; }
      .page .ft { position:fixed; }
      @page { size:A4; margin:15mm 15mm 17mm; }
    }
    @media (max-width:900px) { .wrap { grid-template-columns:1fr; } aside { position:static; height:auto; border-right:none; border-bottom:1px solid var(--line); } .page { width:auto; min-height:0; padding:12px; } }
  </style>
</head>
<body>
<div class="wrap">
  <aside class="no-print">
    <h1>연습장 출력</h1>
    <p class="small">오른쪽 미리보기를 확인하고 <b>인쇄 → PDF 로 저장</b>을 누르면 교재가 돼요. 지문·카드는 모두 자체 창작이라 인쇄·배부에 제한이 없어요(원내 사용).</p>
    <h2>단계</h2>
    <select id="band"></select>
    <h2>글 고르기</h2>
    <div class="plist" id="plist"></div>
    <p class="small"><button class="big ghost" id="selall" style="min-height:34px;margin-top:6px">전부 선택 / 해제</button></p>
    <h2>구성</h2>
    <label><input type="checkbox" id="o-cover" checked> 표지 + 차례 + 사용법</label>
    <label><input type="checkbox" id="o-rules" checked> 규칙 카드 페이지</label>
    <label><input type="checkbox" id="o-marked" checked> ① 따라 읽기(표시본) 페이지</label>
    <label><input type="checkbox" id="o-lines"> ①-2 한 줄에 한 덩어리 판</label>
    <label><input type="checkbox" id="o-plain" checked> ② 직접 끊기(표시 없는 본) + 문제</label>
    <label><input type="checkbox" id="o-key" checked> 정답표</label>
    <label><input type="checkbox" id="o-record" checked> 연습 기록표</label>
    <h2>모양</h2>
    <label>글자 크기 <select id="size"><option value="normal">보통</option><option value="large">크게</option><option value="xlarge">아주 크게</option></select></label>
    <label>덩어리 표시 <select id="marker"><option value="slash">∕ 표시</option><option value="scoop">밑줄 곡선(스쿱)</option><option value="band">색 띠</option></select></label>
    <label>학원 이름 <input type="text" id="org" value="WB 독해력학원"></label>
    <h2>내 글로 만들기 <span class="small">(선택)</span></h2>
    <p class="small">제목과 글을 넣고, 뜻이 나뉘는 곳에 <b>/</b> 를 쳐 주세요. 문단은 빈 줄로 나눠요. 이 글은 저장되지 않고 이 화면에서만 쓰여요.</p>
    <input type="text" id="c-title" placeholder="제목">
    <textarea id="c-text" placeholder="우리 반은 / 지난봄에 / 학교 텃밭에 / 상추 씨앗을 심었다."></textarea>
    <button class="big ghost" id="c-add">이 글 추가</button>
    <div id="c-warn"></div>
    <button class="big" id="print">🖨 인쇄 / PDF 로 저장</button>
    <p class="small" style="margin-top:10px"><a href="./">← 앱으로</a></p>
  </aside>
  <div class="preview"><div id="book"></div></div>
</div>
<script src="./rules.js"></script>
<script src="./lessons.js"></script>
<script src="./passages.js"></script>
<script>
'use strict';
(function () {
  const R = WBCHUNK, LESSONS = WBCHUNK_LESSONS, PASSAGES = WBCHUNK_PASSAGES;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const q = new URLSearchParams(location.search);
  const custom = [];
  let selected = new Set();

  $('band').innerHTML = R.BAND_ORDER.map((b) => '<option value="' + b + '">' + R.BANDS[b].label + ' — ' + R.BANDS[b].who + '</option>').join('');
  $('band').value = R.BANDS[q.get('band')] ? q.get('band') : 'E2';

  function bandDefaults() {
    const b = $('band').value, sm = R.BANDS[b].sentenceMode;
    $('size').value = b === 'K' ? 'xlarge' : (b === 'E1' ? 'large' : 'normal');
    $('marker').value = sm ? 'scoop' : 'slash';
    $('o-lines').checked = sm;
  }
  function list() { return PASSAGES.filter((p) => p.band === $('band').value).concat(custom.filter((c) => c.band === $('band').value)); }
  function fillList(all) {
    const ps = list();
    if (all) selected = new Set(ps.map((p) => p.id));
    $('plist').innerHTML = ps.map((p) => '<label><input type="checkbox" data-id="' + p.id + '" ' + (selected.has(p.id) ? 'checked' : '') + '> ' + esc(p.title) + ' <span class="small">' + esc(p.genre) + ' · ' + R.stats([].concat.apply([], p.paragraphs)).words + '어절</span></label>').join('') || '<p class="small">글이 없어요.</p>';
  }
  $('band').addEventListener('change', () => { bandDefaults(); fillList(true); build(); });
  $('plist').addEventListener('change', (e) => { const cb = e.target; if (!cb.dataset.id) return; if (cb.checked) selected.add(cb.dataset.id); else selected.delete(cb.dataset.id); build(); });
  $('selall').addEventListener('click', () => { const ps = list(); if (selected.size === ps.length) selected = new Set(); else selected = new Set(ps.map((p) => p.id)); fillList(); build(); });
  ['o-cover', 'o-rules', 'o-marked', 'o-lines', 'o-plain', 'o-key', 'o-record', 'size', 'marker', 'org'].forEach((id) => $(id).addEventListener('change', build));
  $('org').addEventListener('input', build);
  $('print').addEventListener('click', () => window.print());
  $('c-add').addEventListener('click', () => {
    const title = ($('c-title').value || '').trim() || '내 글', text = $('c-text').value || '';
    const paras = R.fromMarked(text);
    if (!paras.length) { $('c-warn').innerHTML = '<div class="warn">글을 넣어 주세요.</div>'; return; }
    const band = $('band').value;
    const warns = [];
    paras.forEach((segs, i) => R.check(segs, band).forEach((m) => warns.push((i + 1) + '문단: ' + m)));
    const id = 'custom-' + (custom.length + 1);
    custom.push({ id, band, title, genre: '내 글', paragraphs: paras, q: null });
    selected.add(id); fillList(); build();
    $('c-warn').innerHTML = warns.length ? '<div class="warn"><b>규칙과 다른 자리 ' + warns.length + '곳</b> — 그래도 추가했어요. 뜻에 맞게 끊었다면 그대로 써도 돼요.<br>' + warns.slice(0, 6).map(esc).join('<br>') + '</div>' : '<div class="warn" style="background:#E4F2EA">추가했어요. 규칙 검사도 통과했어요.</div>';
    $('c-title').value = ''; $('c-text').value = '';
  });

  /* ── 종이 만들기 ── */
  const segsHtml = (segs, marker) => segs.map((s) => '<span class="seg">' + esc(marker === 'slash' ? s.replace(/\s+$/, '') : s.trim()) + (marker === 'slash' ? ' ' : ' ') + '</span>').join('');
  const hd = (band, right) => '<div class="hd"><b>의미단위 끊어읽기 연습장</b><span>' + esc(R.BANDS[band].label) + ' 단계' + (right ? ' · ' + right : '') + '</span></div>';
  const ft = (org) => '<div class="ft"><span>' + esc(org) + '</span><span>이름 ______________</span></div>';
  function build() {
    const band = $('band').value, marker = $('marker').value, size = $('size').value, org = $('org').value || '';
    const ps = list().filter((p) => selected.has(p.id));
    const O = (id) => $(id).checked;
    const pages = [];
    if (O('o-cover')) {
      pages.push('<div class="page cover">' + '<div class="t1">의미단위 끊어읽기 연습장</div><div class="t2">' + esc(R.BANDS[band].label) + ' 단계 · ' + esc(R.BANDS[band].who) + '</div>' +
        '<div class="box"><div><span>이름</span><i></i></div><div><span>시작한 날</span><i></i></div><div><span>학원</span><i>' + esc(org) + '</i></div></div>' +
        '<div class="toc">' + ps.map((p, i) => '<div><span>' + (i + 1) + '. ' + esc(p.title) + '</span><span>' + esc(p.genre) + '</span></div>').join('') + '</div>' +
        '<div class="howto"><b>쓰는 법 — 글 한 편에 10분</b><ol><li>표시된 글(①)을 손가락으로 짚으며 <b>소리 내어 세 번</b> 읽어요. 표시에서 살짝, 문장 끝에서 크게 쉬어요. 어른이 먼저 읽어 주면 더 좋아요.</li><li>표시 없는 글(②)에 뜻이 나뉘는 곳마다 <b>∕</b> 를 그어요. 다 긋고 나서 문제를 풀어요.</li><li>정답표와 견주어 맞힌 자리에 ○, 놓친 자리에 ∕ 를 빨간색으로 더 그어요. 점수 = (맞힌 자리 − 군더더기 자리 × ½) ÷ 정답 자리 수 × 100.</li></ol>' +
        '<div class="legend" style="margin-top:6px">' + (marker === 'scoop' ? '밑줄 곡선 하나가 한 덩어리예요.' : marker === 'band' ? '색이 바뀌는 곳이 덩어리 경계예요.' : '∕ 가 덩어리 경계예요.') + ' 문장 끝(. ? !)에서는 더 길게 쉬어요.</div></div>' + ft(org) + '</div>');
    }
    if (O('o-rules')) {
      const ls = LESSONS.filter((l) => l.band === band);
      pages.push('<div class="page">' + hd(band, '규칙 카드') + '<div class="title">이 단계에서 배우는 규칙 ' + ls.length + '가지</div><p class="sub">카드마다 규칙 한 줄과 보기 하나. 연습하다 막히면 여기로 돌아와요.</p>' +
        ls.map((l, i) => '<div class="rulecard"><b>' + (i + 1) + '. ' + esc(l.title) + '</b><div class="r">' + esc(l.rule) + '</div><div class="w">' + esc(l.why) + '</div><div class="ex m-' + marker + '">' + segsHtml(l.examples[0].segs, marker) + '</div></div>').join('') + ft(org) + '</div>');
    }
    ps.forEach((p, idx) => {
      const n = idx + 1, words = R.stats([].concat.apply([], p.paragraphs)).words, nb = p.paragraphs.reduce((a, segs) => a + R.modelBoundaries(segs).length, 0);
      if (O('o-marked')) {
        pages.push('<div class="page sz-' + size + '">' + hd(band, n + '-① 따라 읽기') + '<div class="title">' + n + '. ' + esc(p.title) + '</div><p class="sub">' + esc(p.genre) + ' · ' + words + '어절 · 덩어리 ' + (nb + p.paragraphs.length) + '개</p>' +
          '<div class="task"><b>① 따라 읽기</b> — ' + (marker === 'scoop' ? '밑줄 곡선' : marker === 'band' ? '색 띠' : '∕') + ' 단위로 붙여 읽고, 경계에서 살짝 쉬어요. 세 번 읽고 칸에 표시해요.</div>' +
          '<div class="body m-' + marker + '">' + p.paragraphs.map((segs) => '<p>' + segsHtml(segs, marker) + '</p>').join('') + '</div>' +
          '<div class="boxes"><span>소리 내어 읽기 <span class="cb"></span>1회 <span class="cb"></span>2회 <span class="cb"></span>3회</span>' + (R.BANDS[band].sentenceMode ? '<span>어른이 읽어 주기 <span class="cb"></span></span>' : '<span>3회째 걸린 시간 ____분 ____초</span>') + '</div>' + ft(org) + '</div>');
      }
      if (O('o-lines')) {
        pages.push('<div class="page sz-' + size + '">' + hd(band, n + '-①ʹ 한 줄 한 덩어리') + '<div class="title">' + n + '. ' + esc(p.title) + '</div><p class="sub">한 줄이 한 덩어리예요. 줄 끝에서 살짝 쉬고, 문장 끝에서 크게 쉬어요.</p>' +
          '<div class="body lines">' + p.paragraphs.map((segs) => '<p>' + segs.map((s) => '<span class="seg">' + esc(s.trim()) + '</span>').join('') + '</p>').join('') + '</div>' + ft(org) + '</div>');
      }
      if (O('o-plain')) {
        pages.push('<div class="page sz-' + size + '">' + hd(band, n + '-② 직접 끊기') + '<div class="title">' + n + '. ' + esc(p.title) + '</div>' +
          '<div class="task"><b>② 직접 끊기</b> — 뜻이 나뉘는 곳에 <b>∕</b> 를 그어요. 꾸며 주는 말, 수와 단위, 「-어 보다」 같은 한 움직임은 붙여요. 정답 자리는 ' + nb + '곳이에요.</div>' +
          '<div class="body plain">' + p.paragraphs.map((segs) => '<p>' + esc(segs.join('')) + '</p>').join('') + '</div>' +
          (p.q ? '<div class="q"><div class="qq">문제. ' + esc(p.q.q) + '</div>' + p.q.choices.map((c, i) => '<div class="c">' + ['①', '②', '③', '④'][i] + ' ' + esc(c) + '</div>').join('') + '</div>' : '') +
          '<div class="score"><span>맞힌 자리 <i></i> / ' + nb + '</span><span>군더더기 <i></i></span><span>점수 <i></i></span><span>문제 <span class="cb"></span>정답</span></div>' + ft(org) + '</div>');
      }
    });
    if (O('o-key') && ps.length) {
      const items = ps.map((p, i) => '<div class="rulecard key"><b>' + (i + 1) + '. ' + esc(p.title) + '</b><div class="body m-slash">' + p.paragraphs.map((segs) => '<p>' + segsHtml(segs, 'slash') + '</p>').join('') + '</div>' + (p.q ? '<div class="small">문제 정답: ' + ['①', '②', '③', '④'][p.q.answer] + ' ' + esc(p.q.choices[p.q.answer]) + ' — ' + esc(p.q.explain) + '</div>' : '') + '</div>');
      /* 정답표는 한 장에 3~4편씩 — 넘치면 브라우저가 알아서 다음 장으로 넘긴다(rulecard 는 break-inside:avoid) */
      for (let i = 0; i < items.length; i += 4) pages.push('<div class="page key">' + hd(band, '정답표') + '<div class="title">정답표</div><p class="sub">∕ 가 모범 경계예요. 뜻이 통하면 다른 자리도 괜찮아요 — 쉼표 뒤에서 쉬는 것은 언제나 좋아요.</p>' + items.slice(i, i + 4).join('') + ft(org) + '</div>');
    }
    if (O('o-record')) {
      pages.push('<div class="page">' + hd(band, '기록표') + '<div class="title">연습 기록표</div><p class="sub">한 편이 끝날 때마다 적어요. 85점이 넘으면 1일 → 3일 → 7일 → 14일 → 30일 뒤에 다시 읽고, 30일 뒤에도 잘 읽으면 졸업이에요.</p>' +
        '<table class="rec"><tr><th style="width:15%">날짜</th><th>글</th><th style="width:13%">끊기 점수</th><th style="width:9%">문제</th><th style="width:14%">낭독 3회</th><th style="width:14%">다음 복습</th><th style="width:12%">확인</th></tr>' + Array.from({ length: 14 }, () => '<tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>').join('') + '</table>' + ft(org) + '</div>');
    }
    $('book').innerHTML = pages.join('') || '<div class="page"><p class="sub">왼쪽에서 글을 골라 주세요.</p></div>';
  }
  bandDefaults(); fillList(true); build();
})();
</script>
</body>
</html>
