<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WB 연산 체험</title>
<style>
/* WB 연산: 모눈 공책 바탕, 흰 종이, 100칸 숙달 격자, 빨간 색연필 채점. 강조는 셈 청록 하나 (design/DESIGN.md). 가상 학생만. */
:root{
  --paper:#F7F9F6; --sheet:#FFFFFF; --grid:#D6E3E1; --ink:#22282C; --ink-2:#525C63; --ink-3:#66707A; --line:#E1E6E3;
  --teal:#0F6E6E; --teal-ink:#FFFFFF; --teal-soft:#DDEFEE; --teal-text:#0B5555;
  --red:#CF2F39; --red-ink:#B3222C; --red-soft:#FBE8E9; --hl:#FFE36B;
  --mid:#8A5200; --mid-soft:#FFF0D3; --mid-fill:#E9A23B;
  --lift:0 1px 2px rgba(20,60,60,.06),0 8px 22px rgba(20,60,60,.08);
  --f:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif; --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121618; --sheet:#1A1F21; --grid:#22312F; --ink:#E8ECEA; --ink-2:#B5BFBA; --ink-3:#95A09B; --line:#2A3236;
  --teal:#7FD4D0; --teal-ink:#06302F; --teal-soft:#16383A; --teal-text:#9BE3DF;
  --red:#FF7A80; --red-ink:#FF8F94; --red-soft:#3B1D21; --hl:#6A5A12; --mid:#F5C37A; --mid-soft:#36290F; --mid-fill:#C98A2E;
  --lift:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121618; --sheet:#1A1F21; --grid:#22312F; --ink:#E8ECEA; --ink-2:#B5BFBA; --ink-3:#95A09B; --line:#2A3236;
  --teal:#7FD4D0; --teal-ink:#06302F; --teal-soft:#16383A; --teal-text:#9BE3DF;
  --red:#FF7A80; --red-ink:#FF8F94; --red-soft:#3B1D21; --hl:#6A5A12; --mid:#F5C37A; --mid-soft:#36290F; --mid-fill:#C98A2E;
  --lift:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f);font-size:17px;line-height:1.6;word-break:keep-all;min-height:100dvh;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:14px 14px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--sheet);border-radius:var(--r);min-height:44px;padding:8px 14px}
button:active{transform:translateY(1px)}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
h1,h2,h3{font-weight:800;letter-spacing:-.01em;line-height:1.25;margin:0}
h2{font-size:1.4rem} h3{font-size:1.1rem}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .small{font-size:.9rem} .tiny{font-size:.82rem;color:var(--ink-3)}
.eyebrow{font-size:.8rem;letter-spacing:.06em;color:var(--ink-2)}
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-weight:800;font-size:1.05rem;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:18px;height:18px;border:2px solid var(--teal);border-radius:4px;background:linear-gradient(var(--teal) 50%,transparent 50%)}
.bar select{min-height:44px;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet);padding:6px 10px}
.spacer{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--sheet)}
.seg button{border:0;border-radius:0;min-height:40px;padding:6px 14px;background:transparent}
.seg button.on{background:var(--teal);color:var(--teal-ink)}
main{max-width:760px;margin:0 auto;padding:16px 16px 40px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.sheet+.sheet,.sheet+.stack,.stack>*+*{margin-top:16px}
.today{box-shadow:var(--lift);display:grid;grid-template-columns:84px 1fr;gap:16px;align-items:start}
.lvbox{width:84px;height:84px;border:1px solid var(--grid);border-radius:8px;display:grid;place-items:center;font-size:2rem;font-weight:800;color:var(--teal);position:relative;background:var(--sheet)}
.lvbox:before,.lvbox:after{content:"";position:absolute;background:var(--grid)} .lvbox:before{left:50%;top:0;bottom:0;width:1px} .lvbox:after{top:50%;left:0;right:0;height:1px}
.lvbox b{position:relative;z-index:1;background:var(--sheet);padding:0 6px}
.btn{background:var(--teal);color:var(--teal-ink);border-color:var(--teal);font-weight:700;min-height:54px;padding:10px 22px;font-size:1.05rem}
.btn.ghost{background:var(--sheet);color:var(--ink);border-color:var(--line);font-weight:600}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:.95rem;background:var(--sheet);min-height:36px}
.chip.e{background:var(--mid-soft);color:var(--mid);border-color:transparent;font-weight:600}
.chip.bag{border-style:dashed}
.chip.ok{background:var(--teal-soft);color:var(--teal-text);border-color:transparent}
/* 격자 */
.grid{display:grid;gap:3px;width:max-content;max-width:100%}
.grid .h{font-size:.72rem;color:var(--ink-3);display:grid;place-items:center;height:22px}
.grid .c{width:26px;height:26px;border-radius:6px;border:1.5px solid var(--grid);display:grid;place-items:center;font-size:.68rem;color:var(--ink-3)}
.grid .c.prac{background:var(--mid-fill);border-color:var(--mid-fill);color:#fff}
.grid .c.done{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.grid .c.slow{box-shadow:inset 0 0 0 2px var(--mid-fill)}
.grid .c.anim{animation:fill .3s ease-out}
@keyframes fill{from{transform:scale(.6)}to{transform:scale(1)}}
.gridwrap{overflow:auto;padding-bottom:4px}
@media (min-width:520px){.grid .c{width:32px;height:32px;font-size:.78rem}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;border:1.5px solid var(--grid);vertical-align:-2px;margin-right:4px}
.legend i.prac{background:var(--mid-fill);border-color:var(--mid-fill)} .legend i.done{background:var(--teal);border-color:var(--teal)} .legend i.slow{box-shadow:inset 0 0 0 2px var(--mid-fill)}
.buckets{display:grid;gap:8px}
.bucket{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.bucket .st{font-size:.85rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sheet);border:1px solid var(--line)}
.bucket .st.prac{background:var(--mid-soft);color:var(--mid);border-color:transparent} .bucket .st.done{background:var(--teal-soft);color:var(--teal-text);border-color:transparent}
.map{display:flex;gap:6px;flex-wrap:wrap}
.map span{width:38px;height:38px;border-radius:8px;border:1.5px dashed var(--grid);display:grid;place-items:center;font-weight:700;font-size:.9rem;color:var(--ink-3)}
.map span.past{background:var(--teal);color:var(--teal-ink);border-style:solid;border-color:var(--teal)}
.map span.now{border:2px solid var(--teal);color:var(--teal-text);border-style:solid}
.stamps{display:flex;gap:6px;flex-wrap:wrap}
.stamps span{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--grid);display:grid;place-items:center;font-size:.7rem;color:var(--ink-3)}
.stamps span.on{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
/* 진행 */
.run{display:flex;flex-direction:column;min-height:calc(100dvh - 70px)}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:6px 0}
.dots i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--grid)} .dots i.done{background:var(--teal);border-color:var(--teal)} .dots i.now{border:2px solid var(--teal)} .dots i.star{border-color:var(--red);background:var(--red-soft)}
.stage{flex:1;display:grid;place-items:center;padding:12px 0;text-align:center}
.expr{font-size:clamp(2.2rem,9vw,3.4rem);font-weight:800;letter-spacing:.02em;line-height:1.2}
.expr .box{display:inline-block;min-width:1.6em;border-bottom:4px solid var(--teal);padding:0 .1em;color:var(--teal-text)}
.expr .box.empty:after{content:"";display:inline-block;width:2px;height:.9em;background:var(--teal);vertical-align:-.1em;animation:blink 1s steps(2) infinite}
@keyframes blink{to{opacity:0}}
.fb{min-height:2.2rem;font-size:1.05rem;color:var(--ink-2);margin-top:8px}
.fb .wrong{text-decoration:underline wavy var(--red);text-decoration-thickness:2px;color:var(--red-ink);font-weight:700}
.fb .ans{color:var(--teal-text);font-weight:800;font-size:1.3rem}
/* 세로셈 */
.col{display:inline-grid;grid-auto-rows:54px;gap:2px;font-size:2rem;font-weight:800;justify-items:end}
.col .cell{width:54px;height:54px;display:grid;place-items:center;border-radius:8px}
.col .carry{height:26px;font-size:.95rem;color:var(--mid);border:1.5px dashed var(--grid);width:30px;margin:0 12px 0 auto;display:grid;place-items:center;cursor:pointer}
.col .carry.on{border-color:var(--mid-fill);background:var(--mid-soft)}
.col .carryrow{grid-auto-rows:28px;height:28px}
.col .op{color:var(--ink-2);font-size:1.6rem}
.col .line{height:4px;background:var(--ink);border-radius:2px;grid-column:1/-1;width:100%;align-self:center}
.col .ans{border:2px solid var(--grid);background:var(--sheet);cursor:pointer;color:var(--teal-text)}
.col .ans.act{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.col .carry.act{border-color:var(--teal);border-style:solid}
.divin{display:flex;gap:18px;justify-content:center;align-items:end;flex-wrap:wrap;margin-top:10px}
.divin .f{display:grid;gap:4px;text-align:center}
.divin .f span{font-size:.9rem;color:var(--ink-2)}
.divin .f b{min-width:92px;height:56px;border:2px solid var(--grid);border-radius:8px;display:grid;place-items:center;font-size:1.8rem;color:var(--teal-text);cursor:pointer}
.divin .f b.act{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:360px;width:100%;margin:0 auto;padding:8px 0 4px}
.pad.left{margin-left:0} .pad.right{margin-right:0}
.pad button{min-height:58px;font-size:1.5rem;font-weight:700;border-radius:12px}
.pad button.ok{background:var(--teal);color:var(--teal-ink);border-color:var(--teal)}
.pad button.del{font-size:1.1rem}
.ring{position:relative;width:60px;height:60px;margin-left:auto}
.ring svg{transform:rotate(-90deg)} .ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:.85rem}
/* 결과 */
.res{display:grid;gap:8px}
.res .it{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.res .it:last-child{border-bottom:0}
.mark{width:40px;height:40px}
.mark path{fill:none;stroke:var(--red);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:140;stroke-dashoffset:140;animation:draw .6s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.res .g{color:var(--red-ink);text-decoration:underline wavy var(--red);font-weight:700}
.card{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--sheet)}
.card .ex mark{background:var(--hl);color:var(--ink);padding:0 4px;border-radius:4px}
.stamp{display:inline-grid;place-items:center;width:84px;height:84px;border:3px solid var(--teal);border-radius:50%;color:var(--teal-text);font-weight:800;transform:rotate(-8deg);font-size:.95rem;text-align:center;line-height:1.2}
/* 만져 보기 */
.tf{display:inline-grid;grid-template-columns:repeat(5,30px);gap:5px;padding:6px;border:2px solid var(--ink-2);border-radius:8px}
.tf i{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--grid)} .tf i.a{background:var(--teal)} .tf i.b{background:var(--mid-fill)}
.rods{display:flex;gap:4px;align-items:flex-end;flex-wrap:wrap}
.rods i{display:inline-block;background:var(--teal);border-radius:3px} .rods i.t{width:12px;height:60px} .rods i.o{width:12px;height:12px}
/* 선생님 */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border-radius:999px;min-height:40px}
.tabs button.on{background:var(--teal);color:var(--teal-ink);border-color:var(--teal)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;white-space:nowrap}
th{font-weight:600;color:var(--ink-2);font-size:.82rem}
.hm{width:22px;height:22px;border-radius:5px;border:1px solid var(--line);display:inline-block}
.hm.low{background:var(--red-soft);border-color:transparent} .hm.prac{background:var(--mid-soft);border-color:transparent} .hm.done{background:var(--teal);border-color:var(--teal)}
.tw{overflow:auto}
label.f{display:grid;gap:4px;font-size:.9rem;color:var(--ink-2)}
label.f input,label.f select{min-height:44px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--sheet);color:var(--ink);width:100%;max-width:100%;min-width:0}
.sw{display:flex;align-items:center;gap:10px;min-height:44px}
.sw input{width:22px;height:22px;accent-color:var(--teal)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.paper{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 14px;font-size:1.05rem;font-variant-numeric:tabular-nums}
.paper div{border-bottom:1px solid var(--line);padding:4px 0}
@media (min-width:520px){.paper{grid-template-columns:repeat(4,1fr)}}
.queue{display:grid;gap:8px} .queue pre{white-space:pre-wrap;font:inherit;font-size:.85rem;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px;margin:0}
.note{border-left:3px solid var(--mid-fill);padding:6px 12px;background:var(--mid-soft);color:var(--mid);border-radius:0 8px 8px 0;font-size:.92rem}
.why{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-top:8px}
.bagrows{display:grid;gap:6px;margin-top:10px}
.bagrow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;border:1px dashed var(--grid);border-radius:8px;padding:6px 12px;min-height:44px}
.bagrow.due{border-color:var(--mid-fill);background:var(--mid-soft)}
.bagrow .lab{font-weight:600;font-size:1.05rem}
.bagrow .tag{font-size:.8rem;font-weight:600;padding:1px 7px;border-radius:6px;background:var(--mid-soft);color:var(--mid);margin-left:6px;vertical-align:1px}
.bagrow.due .tag{background:var(--sheet)}
.bagrow .tag.card{background:var(--teal);color:var(--teal-ink)}
.stage-card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px 14px;display:inline-block}
.pad button.del{background:var(--paper)}
.res .it.bad{background:var(--red-soft);border-radius:8px;padding:8px 10px;margin:0 -10px}
.res .it .n{color:var(--ink-3);font-size:.9rem;margin-right:4px}
.grid .c.anim{position:relative} .grid .c.anim:after{content:"";position:absolute;right:2px;top:2px;width:6px;height:6px;border-radius:50%;background:var(--hl)}
.legend i.new{position:relative} .legend i.new:after{content:"";position:absolute;right:1px;top:1px;width:5px;height:5px;border-radius:50%;background:var(--hl)}
.actions{display:grid;gap:10px} .actions .btn{width:100%}
@media (min-width:520px){.actions{grid-template-columns:auto auto;justify-content:start} .actions .btn{width:auto}}
.strip{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;max-width:420px;width:100%;margin:0 auto;padding:8px 0 4px}
.strip button{min-height:58px;font-size:1.5rem;font-weight:700;border-radius:12px}
.pic{display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap;margin:4px 0 10px}
.pic .plus{font-size:1.6rem;color:var(--ink-2);font-weight:700}
.dg{display:inline-grid;grid-template-columns:repeat(5,36px);gap:6px}
.dg.frame{padding:8px;border:2px solid var(--ink-2);border-radius:10px}
.dg i{width:36px;height:36px;border-radius:50%;border:2px solid var(--grid);display:block}
.dg i.a{background:var(--teal);border-color:var(--teal)} .dg i.b{background:var(--mid-fill);border-color:var(--mid-fill)}
.dg i.q{border-style:dashed;border-color:var(--teal)}
.dg i.x{background:var(--grid);border-color:var(--grid);position:relative} .dg i.x:after{content:"";position:absolute;left:-2px;right:-2px;top:15px;height:3px;background:var(--ink-2);transform:rotate(-35deg)}
.cover{display:inline-grid;place-items:center;min-width:64px;height:52px;background:var(--ink-2);color:#fff;border-radius:10px;font-weight:800;font-size:1.4rem}
.qt{font-size:1.35rem;font-weight:800;margin-bottom:6px}
.listen{min-height:40px;padding:4px 12px;font-size:.95rem;border-radius:999px}
.stage-card.kid{padding-top:12px}
.hintbtn,.linkbtn{min-height:40px;padding:4px 12px;font-size:.95rem;border-radius:999px}
.hint{border:1px dashed var(--teal);border-radius:var(--r);padding:12px 14px;margin:10px auto 0;background:var(--sheet);text-align:left;max-width:440px}
.hint .eyebrow{color:var(--teal-text)} .hint ol{margin:6px 0 0;padding-left:20px} .hint li{margin:3px 0;font-size:.95rem;line-height:1.5}
.hint .viz{margin:6px 0 8px;text-align:center}
.nl{width:100%;max-width:380px;height:60px;display:block;margin:0 auto}
.arr{display:inline-grid;gap:4px} .arr i{width:14px;height:14px;border-radius:50%;background:var(--teal);display:block} .arr i.r{background:var(--mid-fill)}
.self{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px} .self button{min-height:40px;font-size:.9rem;border-radius:999px;padding:4px 12px} .self button.on{background:var(--teal);color:var(--teal-ink);border-color:var(--teal)}
.goalbar{height:10px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:6px} .goalbar i{display:block;height:100%;background:var(--teal);border-radius:999px}
.spark{width:100%;max-width:420px;height:80px;display:block}
.spark .ln{fill:none;stroke:var(--teal);stroke-width:2;stroke-linejoin:round} .spark .pt{fill:var(--teal)} .spark .gl{stroke:var(--mid-fill);stroke-width:1.5;stroke-dasharray:4 4} .spark .ax{stroke:var(--line);stroke-width:1} .spark text{font-size:11px;fill:var(--ink-3)}
.topics{display:grid;gap:10px} .topic{text-align:left;padding:12px 14px;display:grid;gap:2px} .topic b{font-size:1.05rem} .topic span{font-size:.9rem;color:var(--ink-2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.95rem;align-items:baseline} .kv b{color:var(--ink-2);font-weight:600;font-size:.85rem}
.asgrow{border:1px solid var(--line);border-radius:8px;padding:8px 12px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.asgrow.done{background:var(--teal-soft);border-color:transparent}
.funnel{display:grid;grid-template-columns:repeat(5,1fr);gap:6px} .funnel div{border:1px solid var(--line);border-radius:8px;padding:8px 6px;text-align:center} .funnel b{display:block;font-size:1.2rem} .funnel span{font-size:.78rem;color:var(--ink-2)}
@media (max-width:520px){.funnel{grid-template-columns:repeat(3,1fr)}}
.tagx{font-size:.78rem;font-weight:600;padding:1px 7px;border-radius:6px;background:var(--teal-soft);color:var(--teal-text);margin-left:6px;vertical-align:1px}
.frac{display:inline-grid;text-align:center;vertical-align:middle;line-height:1.15;font-size:.72em;margin:0 .1em} .frac b{display:block;padding:0 .25em} .frac b:first-child{border-bottom:3px solid currentColor}
.fin{display:inline-grid;gap:4px;justify-items:center;vertical-align:middle;margin-left:.3em}

<script>

/* WB 연산 엔진 — 순수 함수. 브라우저와 node에서 같이 씀. */
var CALC = (function(){
  function rng(seed){ var t=(seed>>>0)||1; return function(){ t+=0x6D2B79F5; var r=Math.imul(t^(t>>>15),1|t); r^=r+Math.imul(r^(r>>>7),61|r); return ((r^(r>>>14))>>>0)/4294967296; }; }
  function ri(r,lo,hi){ return lo+Math.floor(r()*(hi-lo+1)); }
  function pick(r,arr){ return arr[Math.floor(r()*arr.length)]; }
  function shuffle(r,arr){ var a=arr.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(r()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function hash(s){ var h=2166136261; for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
  function digs(n){ return String(n).split('').map(Number); }
  function addDays(d,n){ var p=d.split('-').map(Number); var x=new Date(p[0],p[1]-1,p[2]+n); function z(v){ return (v<10?'0':'')+v; } return x.getFullYear()+'-'+z(x.getMonth()+1)+'-'+z(x.getDate()); }

  /* 실수 유형 */
  var ETYPES = {
    E1:{name:'받아올림을 빠뜨렸어요', card:'10 넘으면 1을 올려요', tip:'일의 자리가 10을 넘으면 1을 십의 자리로 올려요. 7+6=13이면 3을 쓰고 1은 옆집으로.', ex:'47 + 36 = 83 (7+6=13, 1은 십의 자리로)'},
    E2:{name:'올림 수를 그 자리에 그대로 썼어요', card:'13은 3만 쓰고 1은 옆집으로', tip:'한 칸에는 숫자 하나만 들어가요. 13이 나오면 3을 쓰고 1은 왼쪽 칸 위에 작게 적어요.', ex:'47 + 36 = 83 (13은 3만 쓰고 1은 옆집으로)'},
    E3:{name:'큰 수에서 작은 수를 뺐어요', card:'위가 작으면 옆집에서 10을 빌려요', tip:'위 숫자가 아래보다 작으면 거꾸로 빼면 안 돼요. 왼쪽 칸에서 10을 빌려 와요.', ex:'52 − 38 = 14 (십의 자리에서 10 빌림)'},

    E6:{name:'자리를 잘못 맞췄어요', card:'일의 자리끼리 줄을 맞춰요', tip:'오른쪽 끝(일의 자리)부터 줄을 맞춰 써요. 23+5는 3과 5가 같은 줄이에요.', ex:'23 + 5 = 28 (3과 5가 같은 줄)'},

    E11:{name:'둘째 줄을 한 칸 밀지 않았어요', card:'둘째 줄은 한 칸 왼쪽으로', tip:'십의 자리와 곱한 줄은 한 칸 왼쪽에서 시작해요. 그 자리는 0이에요.', ex:'23 × 12 = 276 (46 + 230)'},
    E12:{name:'9를 10으로 보고 그대로 더했어요', card:'9는 10보다 1 작아요', tip:'9+6은 10+6=16에서 1을 빼요 → 15.', ex:'9 + 6 = 15 (10+6−1)'},
    E13:{name:'약분을 안 했어요', card:'답은 가장 간단한 분수로', tip:'분자와 분모를 같은 수로 나눌 수 있으면 끝까지 나눠요. 4/8 → 1/2.', ex:'4/8 = 1/2 (4로 나눔)'},
    E14:{name:'분모끼리도 더했어요', card:'분모가 같으면 분자만 더해요', tip:'1/4 + 2/4는 조각이 같은 크기예요. 조각 수만 더해요 → 3/4.', ex:'1/4 + 2/4 = 3/4'},
    E15:{name:'소수점을 안 맞췄어요', card:'소수점끼리 줄을 맞춰요', tip:'1.2 + 0.35는 1.20 + 0.35로 자리를 맞추고 더해요 → 1.55.', ex:'1.2 + 0.35 = 1.55'},
    E16:{name:'앞에서부터 차례로 계산했어요', card:'곱셈 · 나눗셈이 먼저, 괄호는 가장 먼저', tip:'12 + 3 × 4는 3 × 4 = 12를 먼저 하고 12 + 12 = 24.', ex:'12 + 3 × 4 = 24'},
    E17:{name:'나눗셈을 뒤집지 않고 곱했어요', card:'나누는 분수는 뒤집어 곱해요', tip:'2/3 ÷ 4/5 = 2/3 × 5/4 = 10/12 = 5/6.', ex:'2/3 ÷ 4/5 = 5/6'}
  };

  /* 전략 카드(새 칸 열 때) */
  var STRATEGY = {

  function cellStrategy(cell){
    var m;
    if((m=cell.match(/^\+(\d),(\d)$/))){ var a=+m[1],b=+m[2],s=a+b; if(a<=1||b<=1) return 'plus0'; if(a===2||b===2) return 'plus2'; if(a===b) return 'dbl'; if(s===10) return 'ten'; if(Math.abs(a-b)===1) return 'near'; if(a===9||b===9) return 'nine'; return s>10?'make10':'plus2'; }
    if(cell[0]==='-') return (+cell.split(',')[0].slice(1) + +cell.split(',')[1])>10?'back':'family';
    if((m=cell.match(/^×(\d),(\d)$/))){ var x=Math.max(+m[1],+m[2]); return x<=5?(x<=2?'x2':'x3'):'xhi'; }
    if(cell[0]==='÷') return 'div';
    if(cell[0]==='m'||cell[0]==='g') return 'split';
    if(cell.indexOf('분수')===0) return (cell.indexOf('×')>=0||cell.indexOf('÷')>=0)?'fracx':'frac'; if(cell==='약분') return 'reduce'; if(cell.indexOf('소수')===0) return 'dec'; if(cell.indexOf('혼합')===0||cell==='괄호') return 'mix';

    return 'col';
  }

  /* 단계 */
  function addOrder(){ var o=[],seen={}; function add(a,b){ var k='+'+a+','+b; if(!seen[k]){seen[k]=1;o.push(k);} }
    for(var a=0;a<=9;a++){ add(a,0); add(a,1); add(0,a); add(1,a); }
    for(a=0;a<=9;a++){ add(a,2); add(2,a); }
    for(a=0;a<=9;a++) add(a,a);
    for(a=0;a<=9;a++) add(a,10-a>9?0:10-a);
    for(a=0;a<=8;a++){ add(a,a+1); add(a+1,a); }
    for(a=0;a<=9;a++){ add(a,9); add(9,a); }
    for(a=0;a<=9;a++) for(var b=0;b<=9;b++) add(a,b);
    return o; }
  function subOrder(){ return addOrder().map(function(k){ return '-'+k.slice(1); }); }
  function mulOrder(){ var o=[],seen={}; function add(a,b){ var k='×'+a+','+b; if(!seen[k]){seen[k]=1;o.push(k);} }
    [2,5,3,4,6,7,8,9].forEach(function(t){ for(var a=1;a<=9;a++){ add(t,a); add(a,t); } });
    for(var a=1;a<=9;a++) for(var b=1;b<=9;b++) add(a,b); return o; }
  function divOrder(){ return mulOrder().map(function(k){ return '÷'+k.slice(1); }); }

    {n:0,name:'그림 덧셈 · 뺄셈 (10까지)',code:'누리과정 자연탐구 · [2수01-05]',input:'strip',grade:0,
      cells:function(){ var c=[]; for(var a=1;a<=9;a++) for(var b=1;b<=9;b++){ if(a+b<=10) c.push('k+'+a+','+b); } for(a=2;a<=10;a++) for(b=1;b<a;b++) c.push('k-'+a+','+b); return c; },

  ];

  function fr(n,d){ var g=gcd(n,d); if(d<0){ n=-n; d=-d; } return {n:n/g,d:d/g}; }
  function fmt(x,k){ return +x.toFixed(k); }

  var HI_LEVELS = [
    {n:14,name:'혼합 계산',code:'[6수01-01]',input:'row',grade:5,bucket:true,

      make:function(cell,r){ var a,b,c,t,ans,ltr;

        else if(cell==='혼합−÷'){ b=ri(r,2,9); c=ri(r,2,9); a=ri(r,b*c+5,b*c+60); t=a+' − '+(b*c)+' ÷ '+c; ans=a-b; ltr=(a-b*c)/c; }
        else { if(r()<0.5){ a=ri(r,3,30); b=ri(r,2,20); c=ri(r,2,6); t='('+a+' + '+b+') × '+c; ans=(a+b)*c; ltr=a+b*c; } else { c=ri(r,2,6); b=ri(r,2,15); a=b+c*ri(r,2,9); t='('+a+' − '+b+') ÷ '+c; ans=(a-b)/c; ltr=a-b/c; } }
        return P({op:'mix',a:a,b:b,c:c,ans:ans,ltr:ltr,text:t+' = □',cell:cell,level:14}); }},
    {n:15,name:'분수 · 소수 덧셈 · 뺄셈',code:'[4수01-15·16] [6수01-06·08]',input:'frac',grade:4,bucket:true,

      return '<div class="bucket"><span>'+esc(lab)+' <span class="tiny num">'+(g.s||0)+'번 연속</span></span><span class="st '+g.st+'">'+(g.st==='done'?'잘해요':g.st==='prac'?'연습 중':'아직')+'</span></div>'; }).join('')+'</div>';

  return h;

function startRun(confirm){
  var s=stu(), st=state();
  var ses=CALC.buildSession(st,s,today(),confirm?{confirm:true,count:20,seed:String(Date.now())}:{seed:String(runsToday(st))});
  run={ses:ses,i:0,results:[],attempt:1,typed:'',colCells:null,act:0,field:'q',q:'',r:'',t0:0,first:null,timer:null,confirm:confirm,left:s.grade*0+120,endAt:confirm?Date.now()+120000:0,anim:{}};

}

  h+='<div class="sheet"><b>주머니 ('+st.bag.length+')</b><div class="row" style="margin-top:8px">'+(st.bag.length?st.bag.slice().sort(function(a,b){return a.due<b.due?-1:1;}).map(function(b){ var lab=b.type==='E'?'유형 '+b.code+' · '+CALC.ETYPES[b.code].name:CALC.cellLabel(b.cell)+(b.E&&b.E.length?' · '+b.E.join(','):'')+(b.slow?' · 느림':''); return '<span class="chip bag num">'+esc(lab)+' <span class="tiny">'+b.due.slice(5).replace('-','/')+' · '+(b.s||0)+'/3</span></span>'; }).join(''):'<span class="muted small">비어 있어요</span>')+'</div></div>';
  h+='<div class="sheet"><b>최근 판</b><div class="tw" style="margin-top:8px"><table><tr><th>날짜</th><th>단계</th><th>맞음</th><th>처음</th><th>도움</th><th>느림</th><th>실수 유형</th></tr>'+st.runs.slice(-10).reverse().map(function(r){ return '<tr><td class="num">'+r.date.slice(5)+(r.confirm?' 확인':'')+'</td><td class="num">'+CALC.levelLabel(r.level)+'</td><td class="num">'+r.ok+'/'+r.n+'</td><td class="num">'+(r.first||0)+'</td><td class="num">'+(r.helped||0)+'</td><td class="num">'+r.slow+'</td><td>'+Object.keys(r.E).map(function(e){return e+'×'+r.E[e];}).join(' ')+'</td></tr>'; }).join('')+'</table></div></div>'+
  '<div class="sheet"><b>기록</b><p class="tiny">기록은 이 기기에만 저장돼요. 공동 태블릿이면 아이를 바꿀 때 위에서 학생을 고르고, 필요하면 지워요.</p><div class="row" style="margin-top:8px"><button class="btn ghost" id="wipe">이 학생 기록 지우기</button></div></div>';
  return h;
}
function paperHTML(){
  var s=DB.students.filter(function(x){return x.id===(teaStu||DB.cur);})[0]||DB.students[0]; teaStu=s.id; var st=DB.states[s.id], L=CALC.L(s.level), r=CALC.rng(CALC.hash(s.id+today()+'paper')), cells=CALC.levelCells(s.level);
  var bagCells=st.bag.filter(function(b){return b.type==='cell';}).map(function(b){return b.cell;}); var list=[], used={};
  var tries=0; while(list.length<100 && tries<3000){ tries++; var idx=list.length, inBag=idx<bagCells.length*3; var c=inBag?bagCells[idx%bagCells.length]:cells[Math.floor(r()*cells.length)]; var p=L.make(c,r); if(used[p.id] && !inBag && tries%6!==0) continue; used[p.id]=1; list.push(p); }
  var h='<div class="sheet"><div class="row noprint" style="justify-content:space-between"><div><b>100칸 종이 · '+esc(s.name)+'</b><p class="tiny">주머니 칸을 앞에 3번씩, 나머지는 지금 단계. 집에서 1분, 어른이 채점. 브라우저 인쇄로 출력해요.</p></div><div class="row"><select id="tStu">'+DB.students.map(function(x){ return '<option value="'+x.id+'"'+(x.id===s.id?' selected':'')+'>'+esc(x.name)+'</option>'; }).join('')+'</select><button class="btn ghost" id="print">인쇄</button></div></div>'+
    '<p class="small" style="margin:10px 0 6px">WB 연산 · '+CALC.levelLabel(s.level)+' '+esc(L.name)+' · 이름: ________ · 날짜: '+today()+'</p><div class="paper">'+list.map(function(p,i){ var body=p.pic?paperPic(p):fx(esc(p.text.replace(' = □','')))+(p.op==='÷'||p.input==='col'?' = ':''); return '<div><span class="tiny">'+(i+1)+'</span> '+body+'</div>'; }).join('')+'</div></div>';
  return h;
}
function paperPic(p){ var d=function(n,ch){ var o=''; for(var i=0;i<n;i++) o+=ch; return o; }; var c=p.pic; if(c.t==='count') return d(c.n,'●')+' → '; if(c.t==='next') return (c.next?d(c.n,'●')+' ○':'○ '+d(c.n,'●'))+' → '; if(c.t==='join') return d(c.a,'●')+' + '+d(c.b,'○')+' → '; if(c.t==='hide') return d(c.show,'●')+' ■ ('+(c.n)+'개) → '; if(c.t==='take') return d(c.n-c.take,'●')+d(c.take,'⊗')+' → '; return ''; }
function reportHTML(){
  var s=DB.students.filter(function(x){return x.id===(teaStu||DB.cur);})[0]||DB.students[0]; teaStu=s.id; var st=DB.states[s.id], t=today(), from=CALC.addDays(t,-30);
  var doneNow=Object.keys(st.grid).filter(function(k){return st.grid[k].st==='done';}).length, doneBefore=Object.keys(st.grid).filter(function(k){ var g=st.grid[k]; return g.st==='done'&&g.days.length>=3&&g.days[2]<from; }).length;
  var days=st.stamps.filter(function(d){return d>=from;}).length, ec=eCount(st,30), top=CALC.topE(ec), runs=st.runs.filter(function(r){return r.date>=from;}), n=0, ok=0; runs.forEach(function(r){ n+=r.n; ok+=r.ok; });
  var ym=t.slice(0,7).replace('-',''), key='calc-'+ym+'-'+String(DB.queue.length+1).padStart(4,'0');
  var body='#{보호자}님, #{학생명} '+(s.grade<=0?'어린이':'학생')+'의 이번 달 연산 소식입니다. 연습한 날 #{출석일}일, 잘해요 칸 #{잘해요전}개 → #{잘해요후}개, 정답률 #{정답률}%. '+(top?'이번 달 자주 나온 실수는 "'+CALC.ETYPES[top].name+'"였고 전략 카드로 연습했습니다.':'')+' 다음 달에는 #{다음단계}단계로 갑니다. — WB 독해력학원';
  var h='<div class="sheet"><div class="row" style="justify-content:space-between"><b>월간 보고 미리 보기 · '+esc(s.name)+'</b><select id="tStu">'+DB.students.map(function(x){ return '<option value="'+x.id+'"'+(x.id===s.id?' selected':'')+'>'+esc(x.name)+'</option>'; }).join('')+'</select></div>'+
    '<div class="row" style="margin-top:12px"><span class="chip num">연습한 날 '+days+'일</span><span class="chip num">잘해요 칸 '+doneBefore+' → '+doneNow+'</span><span class="chip num">정답률 '+(n?Math.round(ok/n*100):0)+'%</span>'+(top?'<span class="chip e">'+top+' · '+esc(CALC.ETYPES[top].name)+' '+ec[top]+'번</span>':'')+'</div>'+
    '<div style="margin-top:12px">'+gridHTML(st,s.level)+'</div>'+
    '<div class="note" style="margin-top:14px">학부모 발송은 이 앱에서 하지 않아요. 아래 "후보 넣기"는 번호 · 실명 없이 후보만 큐에 쌓고(DRY_RUN), 운영 PC의 study-notify 가 컨트롤타워 승인 큐로 올리고, 원장님 승인 뒤에만 알림톡이 나가요.</div>'+
    '<div class="row" style="margin-top:12px"><button class="btn ghost" id="queue">알림 후보 넣기 (DRY_RUN)</button></div></div>'+
    '<div class="sheet"><b>알림 후보 큐 ('+DB.queue.length+')</b><div class="queue" style="margin-top:8px">'+(DB.queue.length?DB.queue.slice().reverse().map(function(q){ return '<pre>'+esc(JSON.stringify(q,null,1))+'</pre>'; }).join(''):'<span class="muted small">비어 있어요</span>')+'</div></div>';
  window.__cand={key:key,title:t.slice(5,7).replace(/^0/,'')+'월 연산 월간 보고 1건',summary:'출석 '+days+'일 · 잘해요 '+doneBefore+'→'+doneNow+' · 정답률 '+(n?Math.round(ok/n*100):0)+'%',body:body,templateCode:'TBD_CALC_MONTHLY',count:1,scheduledAt:CALC.addDays(t,1)+' 18:00',audience:mask(s.name)+' 보호자',dryRun:true};
  return h;
}
function bindTeacher(){
  var sel=$('#tStu'); if(sel) sel.onchange=function(){ teaStu=sel.value; render(); };
  var s=DB.students.filter(function(x){return x.id===teaStu;})[0];
  if($('#fGrade')){ $('#fGrade').onchange=function(){ s.grade=+this.value; save(); render(); }; $('#fLevel').onchange=function(){ s.level=+this.value; save(); render(); }; $('#fConfirm').onchange=function(){ s.confirm=this.checked; save(); }; $('#fLeft').onchange=function(){ s.left=this.checked; save(); }; $('#fSound').onchange=function(){ s.sound=this.checked; save(); }; $('#fRead').onchange=function(){ s.read=this.checked; save(); }; }
  if($('#print')) $('#print').onclick=function(){ window.print(); };
  var al=$('#asgLevel'); if(al) al.onchange=function(){ window.__asgLevel=+this.value; render(); };
  var aa=$('#asgAdd'); if(aa) aa.onclick=function(){ var w=$('#asgWhat').value, lv=+$('#asgLevel').value, st=DB.states[teaStu]; st.assigns=st.assigns||[]; CALC.addAssign(st, w[0]==='c'?{cell:w.slice(2),level:lv,note:$('#asgNote').value}:{code:w.slice(2),level:lv,note:$('#asgNote').value}, today()); save(); render(); };
  app.querySelectorAll('[data-del]').forEach(function(b){ b.onclick=function(){ var k=b.getAttribute('data-del').split(':'), st=DB.states[k[0]]; st.assigns=st.assigns.filter(function(a){return a.id!==k[1];}); save(); render(); }; });
  app.querySelectorAll('[data-recheck]').forEach(function(c){ c.onchange=function(){ var k=c.getAttribute('data-recheck').split(':'), a=DB.states[k[0]].assigns.filter(function(x){return x.id===k[1];})[0]; if(a) a.recheck=c.checked; save(); }; });
  app.querySelectorAll('[data-flag]').forEach(function(b){ b.onclick=function(){ var k=b.getAttribute('data-flag').split(':'), st=DB.states[k[0]]; st.flags=st.flags||{}; st.flags[k[1]]={status:k[2],date:today()}; if(k[2]==='concept'){ var sS=DB.students.filter(function(x){return x.id===k[0];})[0]; CALC.addAssign(st,{code:k[1],level:sS.level,note:'확인함에서 개념 보충으로'},today()); } save(); render(); }; });
  var pa=$('#paperAdd'); if(pa) pa.onclick=function(){ var st=DB.states[teaStu], sS=DB.students.filter(function(x){return x.id===teaStu;})[0]; st.paper=st.paper||[]; st.paper.push({date:today(),ok:+$('#paperOk').value,n:+$('#paperN').value,level:sS.level}); save(); render(); };
  var wp=$('#wipe'); if(wp) wp.onclick=function(){ if(confirm('이 학생의 기록을 모두 지울까요? 되돌릴 수 없어요.')){ DB.states[teaStu]=CALC.emptyState(); save(); render(); } };
  if($('#queue')) $('#queue').onclick=function(){ DB.queue.push(window.__cand); save(); render(); };
}

/* ---------- 체험(마케팅) ---------- */
var autoTopicDone=false;
function startTrial(id){ ops('start',id); trialState=CALC.emptyState(); var ses=CALC.buildTrial(id,String(Date.now())); run={ses:ses,i:0,results:[],attempt:1,typed:'',colCells:null,act:0,field:'q',q:'',r:'',t0:0,first:null,timer:null,confirm:false,trial:true,endAt:0,anim:{}}; go('run'); }
function renderTrialHome(){
  if(!autoTopicDone){ autoTopicDone=true; var tq=qs('topic'); if(tq&&CALC.TRIAL_TOPICS.some(function(t){return t.id===tq;})){ startTrial(tq); return; } }
  app.innerHTML='<div class="sheet today" style="grid-template-columns:1fr"><div><p class="eyebrow">WB 학습실 · 연산 체험 (가칭)</p><h2>계산은 되는데 문장제에서 막히나요?</h2><p class="small muted" style="margin-top:6px">주제 하나를 골라 6문제, 약 3분. 로그인도 연락처도 없어요. 결과는 "이번 체험에서 본 학습 모습"으로 보여 드려요.</p></div></div>'+
    '<div class="sheet"><b>주제 고르기</b><div class="topics" style="margin-top:10px">'+CALC.TRIAL_TOPICS.map(function(t){ return '<button class="topic" data-topic="'+t.id+'"><b>'+esc(t.name)+'</b><span>'+esc(t.hook)+'</span></button>'; }).join('')+'</div></div>'+
    '<p class="tiny" style="margin:0 4px">체험 중 힌트를 보면 "도움 받고 해결"로 따로 세요. 몇 문제로 능력이나 원인을 판정하지 않아요.</p>';
  app.querySelectorAll('[data-topic]').forEach(function(b){ b.onclick=function(){ startTrial(b.getAttribute('data-topic')); }; });
}
function renderTrialResult(){
  var ses=run.ses, tp=ses.topic, res=run.done.results, first=0, helped=0, touched=0, again=[];
  res.forEach(function(r,i){ if(r.skipped) touched++; else if(r.ok&&!r.help) first++; else if(r.ok||r.retry) helped++; if(!r.ok||r.help||r.skipped){ var E=r.ok?[]:CALC.diagnose(ses.problems[i],r.given); again.push(E.length?CALC.ETYPES[E[0]].card:ses.problems[i].text.replace(' = □','')); } });
  var good=first>=4?'처음에 스스로 맞힌 문제가 '+first+'개예요. 이 주제는 꽤 익숙해요.':first>=2?'절반쯤은 처음에 맞혔고, 나머지는 힌트나 다시 풀기로 해결했어요.':'힌트를 보며 차근차근 해결했어요. 혼자 떠올리는 연습을 더 하면 좋아요.';
  var list=ses.problems.map(function(p,i){ var r=res[i], ok=r.ok&&!r.skipped; return '<div class="it'+(ok?'':' bad')+'"><div>'+(ok?circle():star())+'</div><div><span class="n num">'+(i+1)+'.</span><span class="num" style="font-weight:600;font-size:1.1rem">'+esc(p.text.replace(' = □',''))+' = '+(ok?p.ans:'□')+'</span> '+(r.help?'<span class="tagx">힌트 봄</span>':'')+(r.retry?'<span class="tagx">고쳐서 맞음</span>':'')+(r.skipped?'<span class="tagx">만져 봄</span>':'')+'</div></div>'; }).join('');
  app.innerHTML='<div class="sheet"><p class="eyebrow">체험 결과 · '+esc(tp.name)+'</p><h2 class="num">처음에 맞힘 '+first+' · 도움 받고 해결 '+helped+(touched?' · 만져 봄 '+touched:'')+'</h2><div class="res" style="margin-top:12px">'+list+'</div></div>'+
    '<div class="card"><p class="eyebrow">이번 체험에서 본 학습 모습</p><div class="kv" style="margin-top:6px"><b>잘한 점</b><span>'+esc(good)+'</span><b>다시 살펴볼 부분</b><span>'+(again.length?esc(again.filter(function(v,i,a){return a.indexOf(v)===i;}).slice(0,2).join(' · ')):'지금은 없어요. 숫자를 바꿔 한 번 더 해 보면 좋아요.')+'</span><b>집에서 한 가지</b><span>'+esc(tp.home)+'</span></div><p class="tiny" style="margin-top:8px">몇 문제로 아이의 능력이나 원인을 판정하지 않아요. 검사 권유도 하지 않아요.</p></div>'+
    '<div class="sheet"><div class="row" style="justify-content:space-between"><b>학부모 안내</b><button class="btn ghost" id="parent" style="min-height:44px">'+(run.parentOpen?'닫기':'보기')+'</button></div>'+(run.parentOpen?'<div style="margin-top:10px"><p class="small"><b>WB가 보는 법.</b> 틀린 답에서 "왜 그랬는지"를 봐요. 예를 들어 52−38을 26이라고 쓰면 "큰 수에서 작은 수를 뺐어요"예요. 그 한 가지만 짧게 연습하고, 며칠 뒤 숫자를 바꿔 다시 확인해요.</p><p class="small" style="margin-top:6px"><b>집에서 돕는 법.</b> '+esc(tp.home)+' 시간을 재지 말고, 틀리면 정답을 보여 주고 한 번 더 적게 해 주세요.</p><div class="row" style="margin-top:10px"><button class="btn ghost" id="material">관련 글 · 활동지 받기</button><button class="btn ghost" id="consult">상담 안내 보기</button></div><p class="tiny" style="margin-top:6px">체험판에서는 아무 데도 보내지 않아요(눌린 수만 운영 현황에 세요). 연락처는 받지 않아요.</p></div>':'')+'</div>'+
    '<div class="sheet actions"><button class="btn" id="again">다른 주제 체험</button><button class="btn ghost" id="retry">같은 주제 다시(숫자 바뀜)</button></div>';
  $('#parent').onclick=function(){ if(!run.parentOpen){ ops('parent',tp.id); } run.parentOpen=!run.parentOpen; renderTrialResult(); };
  var mb=$('#material'); if(mb) mb.onclick=function(){ ops('material',tp.id); mb.textContent='신청됐어요(체험판)'; mb.disabled=true; };
  var cb=$('#consult'); if(cb) cb.onclick=function(){ ops('consult',tp.id); cb.textContent='안내를 봤어요(체험판)'; cb.disabled=true; };
  $('#again').onclick=function(){ run=null; go('trialHome'); };
  $('#retry').onclick=function(){ startTrial(tp.id); };
}
/* ---------- 부팅 ---------- */
load();
if(!PUBLIC) connectDb(); else { var bd=$('.brand'); if(bd) bd.innerHTML='<i></i> WB 학습실 · 연산 체험 <span class="tiny">가칭 · WB 독해력학원</span>'; }
$('#stuSel').onchange=function(){ DB.cur=this.value; teaStu=DB.cur; run=null; save(); view='home'; render(); };
$('#mStu').onclick=function(){ DB.mode='stu'; run=null; view='home'; save(); render(); };
$('#mTea').onclick=function(){ DB.mode='tea'; run=null; save(); render(); };
$('#mTri').onclick=function(){ DB.mode='trial'; run=null; view='trialHome'; save(); render(); };
render();
})();
</script>
