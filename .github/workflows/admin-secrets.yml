name: 관리 계정·AI 삽화 시크릿 등록

# 운영 워커(wb-reading)에 관리 웹 로그인 수단(ADMIN_PIN, ADMIN_ID·ADMIN_PASSWORD)과 브레인레터 AI 삽화
# 키(GEMINI_API_KEY)를 넣는 수동 실행 워크플로우. 값은 저장소 시크릿(Settings → Secrets and variables → Actions)에서 읽어 워커 시크릿으로
# 복사한다 — workflow_dispatch 입력은 실행 기록에 남고 이 저장소는 public 이라, 비밀번호·키를 입력으로 받지 않는다.
# 배포 워크플로우와 같은 CLOUDFLARE_API_TOKEN 을 쓰므로 별도 자격증명이 필요 없다.
on:
  workflow_dispatch:
    inputs:
      account:
        description: 'ADMIN_ID·ADMIN_PASSWORD 를 저장소 시크릿에서 워커로 복사 (관리 웹 아이디·비밀번호 로그인)'
        type: boolean
        default: true
      pin:
        description: 'ADMIN_PIN 을 저장소 시크릿의 값으로 교체 (옛 PIN 은 곧바로 막힌다)'
        type: boolean
        default: false
      gemini:
        description: 'GEMINI_API_KEY 를 저장소 시크릿에서 워커로 복사 (브레인레터 AI 삽화 만들기)'
        type: boolean
        default: false

permissions: {}

jobs:
  put:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 토큰 확인
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN 시크릿이 없습니다. Settings → Secrets and variables → Actions 에 추가하세요."
            exit 1
          fi

      # 값은 마스킹된 채로만 러너를 지난다 — 길이만 확인하고 출력하지 않는다
      - name: ADMIN_ID·ADMIN_PASSWORD → 워커 시크릿 복사
        if: ${{ inputs.account }}
        working-directory: reading-server
        env:
          ID: ${{ secrets.ADMIN_ID }}
          PW: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ID:-}" ] || [ -z "${PW:-}" ]; then
            echo "::error::저장소 시크릿 ADMIN_ID·ADMIN_PASSWORD 가 비어 있습니다. Settings → Secrets and variables → Actions 에 먼저 추가하세요."
            exit 1
          fi
          if [ "${#PW}" -lt 10 ]; then
            echo "::error::ADMIN_PASSWORD 는 10자 이상이어야 합니다(값은 출력하지 않습니다)."
            exit 1
          fi
          echo "::add-mask::$ID"
          echo "::add-mask::$PW"
          printf '%s' "$ID" | npx wrangler@4 secret put ADMIN_ID
          printf '%s' "$PW" | npx wrangler@4 secret put ADMIN_PASSWORD
          echo "관리 계정 2종 등록 완료 — 관리 웹에서 아이디·비밀번호로 로그인할 수 있습니다(PIN 도 그대로)"

      # PIN 을 잃어버렸을 때 되찾는 길이기도 하다 — 워커 시크릿은 덮어쓸 수만 있고 읽어낼 수 없다.
      # 값은 마스킹된 채로만 러너를 지난다 — 길이만 확인하고 출력하지 않는다
      - name: ADMIN_PIN → 워커 시크릿 교체
        if: ${{ inputs.pin }}
        working-directory: reading-server
        env:
          PIN: ${{ secrets.ADMIN_PIN }}
        run: |
          set -euo pipefail
          if [ -z "${PIN:-}" ]; then
            echo "::error::저장소 시크릿 ADMIN_PIN 이 비어 있습니다. Settings → Secrets and variables → Actions 에 먼저 추가하세요."
            exit 1
          fi
          # 관리 PIN 하나로 학생 기록 전체가 열린다. 숫자 네 자리가 아니라 자유 문자열이므로 길이를 요구한다.
          if [ "${#PIN}" -lt 10 ]; then
            echo "::error::ADMIN_PIN 은 10자 이상이어야 합니다(값은 출력하지 않습니다)."
            exit 1
          fi
          echo "::add-mask::$PIN"
          printf '%s' "$PIN" | npx wrangler@4 secret put ADMIN_PIN
          echo "ADMIN_PIN 교체 완료 — 옛 PIN 으로는 더 이상 로그인할 수 없습니다."
          echo "※ 이미 로그인해 둔 기기의 관리 토큰은 최장 30일까지 그대로 살아 있습니다(로그인과 따로 발급되는 값이라 PIN 교체로 끊기지 않습니다)."

      - name: GEMINI_API_KEY → 워커 시크릿 복사
        if: ${{ inputs.gemini }}
        working-directory: reading-server
        env:
          KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${KEY:-}" ]; then
            echo "::error::저장소 시크릿 GEMINI_API_KEY 가 비어 있습니다. Google AI Studio 에서 키를 만들어 Settings → Secrets and variables → Actions 에 먼저 추가하세요."
            exit 1
          fi
          echo "::add-mask::$KEY"
          printf '%s' "$KEY" | npx wrangler@4 secret put GEMINI_API_KEY
          echo "GEMINI_API_KEY 등록 완료 — 브레인레터 관리 [사진] 탭의 AI 삽화 만들기가 켜집니다"

      # 이름과 타입만 나온다 — 값은 출력되지 않는다
      - name: 등록된 시크릿 목록
        working-directory: reading-server
        run: npx wrangler@4 secret list
