name: 검증 (PR·작업 브랜치)

# 배포 워크플로우(deploy-reading.yml)는 main 푸시에서만 돈다 — 즉 합치기 전에는 아무도 안 돌려 본다.
# 에이전트(Codex·Claude Code)나 사람이 브랜치에서 고친 것을 합치기 전에 여기서 전부 돌린다.
# 시크릿을 쓰지 않는다(배포하지 않으므로) — 포크에서 온 PR 도 안전하게 검증된다.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 같은 브랜치에 연달아 밀어 넣으면 앞 실행은 버린다 — 마지막 판만 보면 된다
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  WRANGLER: wrangler@4.129.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 저장소의 모든 테스트 — 배포 워크플로우가 부르는 55개보다 넓다(haru·sync·task·desk 포함).
      # 사람이 로컬에서 부르는 명령과 같다: node scripts/check.mjs
      - name: 전체 테스트
        run: node scripts/check.mjs

      - name: 업무지시서·보호자 Worker 번들 점검 (dry-run)
        run: |
          node sync/build-task-assets.mjs
          npx --yes --prefer-offline $WRANGLER deploy --config sync/wrangler.toml --dry-run --outdir=/tmp/wb-sync-bundle
          if grep -l 'node:' /tmp/wb-sync-bundle/*.js; then
            echo "::error::업무지시서 Worker 번들에 Node 모듈이 남아 있습니다"
            exit 1
          fi

      # 배포와 같은 자산을 만든 뒤 번들한다. dry-run 은 시크릿·원격 DB 없이 돈다.
      - name: 진로독서 워커 번들 점검 (dry-run)
        working-directory: reading-server
        run: |
          node build-dist.mjs
          npx --yes --prefer-offline $WRANGLER deploy --dry-run --outdir=/tmp/wb-bundle
          if grep -l 'node:' /tmp/wb-bundle/*.js; then
            echo "::error::워커 번들에 node: 내장 모듈이 남아 있습니다 — Cloudflare 에서 로드되지 않습니다"
            exit 1
          fi

      - name: 프로그램데스크 워커 번들 점검 (dry-run)
        working-directory: desk
        run: |
          node build.mjs
          npx --yes --prefer-offline $WRANGLER deploy --dry-run --outdir=/tmp/wb-desk-bundle
          if grep -l 'node:' /tmp/wb-desk-bundle/*.js; then
            echo "::error::워커 번들에 node: 내장 모듈이 남아 있습니다 — Cloudflare 에서 로드되지 않습니다"
            exit 1
          fi

      - name: 세일즈데스크 워커 번들 점검 (dry-run)
        working-directory: crm
        run: |
          node build.mjs
          npx --yes --prefer-offline $WRANGLER deploy --dry-run --outdir=/tmp/wb-crm-bundle
          if grep -l 'node:' /tmp/wb-crm-bundle/*.js; then
            echo "::error::워커 번들에 node: 내장 모듈이 남아 있습니다 — Cloudflare 에서 로드되지 않습니다"
            exit 1
          fi
