name: study 서브도메인 존 준비

# study.wbbraincenter.com을 Cloudflare에 존으로 올리고 네임서버를 알려준다.
# 홈페이지(wbbraincenter.com)는 건드리지 않는다 — 서브도메인만 별도 존으로 만든다.
# 여러 번 실행해도 안전하다: 이미 있으면 찾아서 현재 상태를 보여준다.
on:
  workflow_dispatch:
    inputs:
      zone:
        description: '만들 서브도메인 (부모 도메인을 넣지 말 것)'
        type: string
        default: 'study.wbbraincenter.com'

permissions: {}

jobs:
  zone:
    runs-on: ubuntu-latest
    steps:
      - name: 존 생성 또는 조회
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ZONE: ${{ inputs.zone }}
        run: |
          set -euo pipefail
          API=https://api.cloudflare.com/client/v4

          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 시크릿이 없습니다."
            exit 1
          fi

          # 부모 도메인을 통째로 올리는 사고 방지 — 점이 2개 이상이어야 서브도메인이다
          dots=$(printf '%s' "$ZONE" | tr -cd '.' | wc -c)
          if [ "$dots" -lt 2 ]; then
            echo "::error::'$ZONE'은 서브도메인이 아닙니다. 부모 도메인을 올리면 홈페이지 DNS가 넘어갑니다."
            exit 1
          fi

          get() { curl -sS -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' "$@"; }

          found=$(get "$API/zones?name=$ZONE")
          if [ "$(jq -r .success <<<"$found")" != "true" ]; then
            echo "::error::존 조회 실패 — 토큰 권한을 확인하세요."
            jq -r '.errors[]? | "  [\(.code)] \(.message)"' <<<"$found"
            exit 1
          fi

          if [ "$(jq -r '.result | length' <<<"$found")" -gt 0 ]; then
            zone=$(jq -c '.result[0]' <<<"$found"); made="기존 존을 찾았습니다"
          else
            created=$(get -X POST "$API/zones" \
              -d "{\"account\":{\"id\":\"$ACCOUNT\"},\"name\":\"$ZONE\",\"type\":\"full\"}")
            if [ "$(jq -r .success <<<"$created")" != "true" ]; then
              echo "::error::존 생성 실패"
              jq -r '.errors[]? | "  [\(.code)] \(.message)"' <<<"$created"
              echo "토큰에 Zone → Zone → Edit 권한이 필요합니다."
              exit 1
            fi
            zone=$(jq -c '.result' <<<"$created"); made="존을 새로 만들었습니다"
          fi

          status=$(jq -r .status <<<"$zone")
          {
            echo "## $made"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| 존 | \`$(jq -r .name <<<"$zone")\` |"
            echo "| 상태 | **$status** |"
            echo
            if [ "$status" = "active" ]; then
              echo "위임이 이미 끝났습니다. 워커에 연결할 수 있습니다."
            else
              echo "### AWS(부모 도메인 DNS)에 이 NS 레코드를 추가하세요"
              echo
              echo "이름 \`study\` · 타입 \`NS\` · TTL \`300\` · 값:"
              echo '```'
              jq -r '.name_servers[]' <<<"$zone"
              echo '```'
              echo
              echo "추가 후 몇 분~1시간이면 상태가 active로 바뀝니다."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
