name: 워드브레인 시크릿 등록

# 운영 워커(wb-reading)에 시크릿을 넣는 수동 실행 워크플로우.
# 배포 워크플로우와 같은 CLOUDFLARE_API_TOKEN을 쓰므로 별도 자격증명이 필요 없다.
on:
  workflow_dispatch:
    inputs:
      vapid:
        description: 'VAPID 키쌍을 새로 만들어 등록 (밤 9시 물주기 알림)'
        type: boolean
        default: true
      anthropic:
        description: 'ANTHROPIC_API_KEY를 저장소 시크릿에서 워커로 복사 (AI 연상·문장 판정)'
        type: boolean
        default: false

permissions: {}

jobs:
  put:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 토큰 확인
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN 시크릿이 없습니다. Settings → Secrets and variables → Actions 에 추가하세요."
            exit 1
          fi

      # 키쌍을 이 러너 안에서 만들어 바로 등록한다.
      # 값이 워크플로우 입력·로그·저장소 어디에도 남지 않는 유일한 경로.
      - name: VAPID 키쌍 생성 → 워커 시크릿 등록
        if: ${{ inputs.vapid }}
        working-directory: reading-server
        run: |
          set -euo pipefail
          out=$(node gen-vapid.mjs)
          pub=$(printf '%s\n' "$out" | sed -n 's/^VAPID_PUBLIC_KEY=//p')
          jwk=$(printf '%s\n' "$out" | sed -n 's/^VAPID_PRIVATE_JWK=//p')
          if [ -z "$pub" ] || [ -z "$jwk" ]; then
            echo "::error::VAPID 키 생성 실패 — gen-vapid.mjs 출력 형식을 확인하세요."
            exit 1
          fi
          echo "::add-mask::$pub"
          echo "::add-mask::$jwk"
          printf '%s' "$pub" | npx wrangler@4 secret put VAPID_PUBLIC_KEY
          printf '%s' "$jwk" | npx wrangler@4 secret put VAPID_PRIVATE_JWK
          echo "VAPID 2종 등록 완료"

      - name: ANTHROPIC_API_KEY → 워커 시크릿 복사
        if: ${{ inputs.anthropic }}
        working-directory: reading-server
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${KEY:-}" ]; then
            echo "::error::저장소 시크릿 ANTHROPIC_API_KEY가 비어 있습니다. Settings → Secrets and variables → Actions 에 먼저 추가하세요."
            exit 1
          fi
          printf '%s' "$KEY" | npx wrangler@4 secret put ANTHROPIC_API_KEY
          echo "ANTHROPIC_API_KEY 등록 완료"

      # 이름과 타입만 나온다 — 값은 출력되지 않는다
      - name: 등록된 시크릿 목록
        working-directory: reading-server
        run: npx wrangler@4 secret list
