name: Deploy wb-reading worker

on:
  push:
    branches: [main]
    paths:
      - 'reading/**'
      - 'reading-server/**'
      - 'vocab/**'
      - 'naesin/**'
      - 'shared/**'
  workflow_dispatch:

env:
  # wrangler 를 한 자리에서 고정한다. `wrangler@4` 는 실행할 때마다 최신 4.x 를 새로 받으므로
  # 저장소가 그대로여도 CI 는 매번 다른 도구로 돈다 — 새 4.x 가 번들을 깨면 저장소에 원인이
  # 없는 실패가 되고, 배포 #90·#91 처럼 운영이 뒤처진 뒤에야 안다. 올릴 때는 이 한 줄만 고친다
  # (아래 캐시 키가 버전을 물고 있어 자동으로 새로 받는다).
  WRANGLER: wrangler@4.129.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 콘텐츠 무결성 테스트
        run: node reading/content.test.cjs
      - name: 분할 파일 무결성 테스트
        run: node reading/split.test.cjs
      - name: 저장된 기록 복원 검증
        run: node reading/state.test.cjs
      - name: 학생 앱 뒤로 가기 검증
        run: node reading/back-nav.test.cjs
      - name: 두 학생 앱 사이 이동 검증
        run: node reading/app-links.test.cjs
      - name: 공통 음성 모듈 테스트
        run: node shared/voice.test.cjs
      - name: QR 인코더 테스트
        run: node shared/qr.test.cjs
      - name: 워드브레인 엔진·데이터 테스트
        run: node vocab/srs.test.cjs
      - name: 워드브레인 문제 출제 엔진 테스트
        run: node vocab/quiz.test.cjs
      - name: 워드브레인 서버 라우트 테스트
        run: node reading-server/vocab-api.test.mjs
      - name: 내신브레인 암기 엔진 테스트
        run: node naesin/engine.test.cjs
      - name: 내신브레인 채점 모듈 테스트
        run: node naesin/grade.test.cjs
      - name: 내신브레인 문항 생성 테스트
        run: node naesin/gen.test.cjs
      - name: 내신브레인 팩 검사 규칙 테스트
        run: node naesin/pack-check.test.cjs
      - name: 내신브레인 체험 팩 검증 (pack-validate)
        # 검증기는 팩 디렉터리(words.json·sentences.json…)를 받는다. 저장소의 유일한 팩인 pack-sample.json 은
        # 관리 웹이 병합한 형태라, 업로드 전 형태로 도로 쪼개 같은 검증 게이트를 통과시킨다 — 체험 팩이
        # 검증기와 어긋난 채 배포되면 학생 앱의 미연동 체험 모드가 첫 화면에서 깨진다.
        run: |
          node -e '
            const fs = require("fs"); const p = require("./naesin/pack-sample.json"); const dir = "/tmp/wb-pack-sample";
            fs.mkdirSync(dir, { recursive: true });
            const hdr = { packId: p.packId, source: p.source, curriculum: p.curriculum, textbook: p.textbook, grade: p.grade, lesson: p.lesson, lessonTitle: p.lessonTitle };
            const w = (n, o) => fs.writeFileSync(dir + "/" + n, JSON.stringify({ ...hdr, ...o }));
            w("words.json", { counts: { words: (p.words || []).length }, words: p.words || [] });
            w("sentences.json", { passage: p.passage, sentences: p.sentences || [], oddOneItems: p.oddOneItems || [], checkItems: p.checkItems || [] });
            if (p.dialogues) w("dialogues.json", { dialogues: p.dialogues });
            if (p.patterns) w("patterns.json", { patterns: p.patterns });
            if (p.items) w("items-sample.json", { items: p.items });
          '
          node naesin/pack-validate.mjs /tmp/wb-pack-sample
      - name: 내신브레인 서버 라우트 테스트
        run: node reading-server/naesin-api.test.mjs
      - name: 내신브레인 팩 제작 스튜디오 테스트
        run: node reading-server/naesin-studio.test.mjs
      - name: 내신브레인 AI 추출 테스트
        run: node reading-server/naesin-extract.test.mjs
      - name: 내신브레인 수업 라이브 세션 테스트
        run: node reading-server/naesin-live.test.mjs
      - name: 내신브레인 시험 결과 분석·예측 테스트
        run: node reading-server/naesin-results.test.mjs
      - name: 교재 코칭 테스트
        run: node reading-server/textbook.test.mjs
      - name: 정적 파일 가로채기 정합 테스트
        run: node reading-server/override.test.mjs
      - name: 반 명단 붙여넣기 테스트
        run: node reading-server/roster.test.mjs
      - name: 어휘 나이 진단 테스트
        run: node vocab-age/age.test.cjs
      - name: AI 하루 한도 테스트
        run: node reading-server/ai-quota.test.mjs
      - name: 아레나(반 대전) 테스트
        run: node reading-server/arena.test.mjs
      - name: 학생 수명주기 테스트 (등록~퇴원)
        run: node reading-server/student-lifecycle.test.mjs
      - name: dist 조립
        run: node reading-server/build-dist.mjs
      - name: 배포본 캐시 무효화 검증
        run: node reading-server/dist-cache.test.mjs
      # npx 는 받은 패키지를 ~/.npm/_npx 에 풀어 두고 다음 실행에서 그대로 쓴다. 그 자리만 캐시한다
      # (_cacache 는 tarball 사본이라 _npx 가 있으면 필요 없다 — 240MB 대신 385MB 를 나르게 된다).
      # 아래 두 스텝이 같은 설치를 나눠 쓴다. 키가 버전을 물고 있으니 WRANGLER 를 올리면 새로 받는다.
      - name: wrangler 캐시
        uses: actions/cache@v4
        with:
          path: ~/.npm/_npx
          key: npx-${{ runner.os }}-${{ env.WRANGLER }}
      # 배포 #90·#91 이 여기서 죽었다: 저장소 테스트는 전부 초록인데 워커 번들이
      # 'node:module' 을 찾다 실패했다(Node 에서는 잘 도는 코드였다). 실패가 배포 로그에만
      # 있어서 운영이 두 판 뒤처진 것을 한참 뒤에 알았다. dry-run 은 자격증명 없이도 돌고
      # 번들을 실제로 만들어 보므로, 같은 종류는 여기서 먼저 멈춘다.
      - name: 워커 번들 검증 (dry-run — 자격증명 없이 돈다)
        working-directory: reading-server
        run: npx --yes --prefer-offline $WRANGLER deploy --dry-run --outdir=/tmp/wb-bundle
      - name: 번들에 Node 전용 모듈이 없는지
        run: |
          if grep -rl 'node:' /tmp/wb-bundle/*.js 2>/dev/null | head -1 | grep -q .; then
            echo "::error::워커 번들에 node: 내장 모듈이 남아 있습니다 — Cloudflare 에서 로드되지 않습니다"
            grep -o 'node:[a-z]*' /tmp/wb-bundle/*.js | sort -u
            exit 1
          fi
          echo "번들 정상 — node: 임포트 없음"

      - name: Cloudflare Workers 배포
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: reading-server
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN 시크릿이 없어 배포를 건너뜁니다. 저장소 Settings → Secrets and variables → Actions 에 추가하세요."
            exit 0
          fi
          npx --yes --prefer-offline $WRANGLER deploy
