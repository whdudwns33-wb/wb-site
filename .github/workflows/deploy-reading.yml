name: Deploy wb-reading worker

on:
  push:
    branches: [main]
    paths:
      - 'reading/**'
      - 'reading-server/**'
      - 'vocab/**'
      - 'naesin/**'
      - 'naesin-ko/**'
      - 'shared/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 콘텐츠 무결성 테스트
        run: node reading/content.test.cjs
      - name: 분할 파일 무결성 테스트
        run: node reading/split.test.cjs
      - name: 저장된 기록 복원 검증
        run: node reading/state.test.cjs
      - name: 학생 앱 뒤로 가기 검증
        run: node reading/back-nav.test.cjs
      - name: 두 학생 앱 사이 이동 검증
        run: node reading/app-links.test.cjs
      - name: 공통 음성 모듈 테스트
        run: node shared/voice.test.cjs
      - name: QR 인코더 테스트
        run: node shared/qr.test.cjs
      - name: 워드브레인 엔진·데이터 테스트
        run: node vocab/srs.test.cjs
      - name: 워드브레인 문제 출제 엔진 테스트
        run: node vocab/quiz.test.cjs
      - name: 워드브레인 서버 라우트 테스트
        run: node reading-server/vocab-api.test.mjs
      - name: 내신브레인 암기 엔진 테스트
        run: node naesin/engine.test.cjs
      - name: 내신브레인 채점 모듈 테스트
        run: node naesin/grade.test.cjs
      - name: 내신브레인 문항 생성 테스트
        run: node naesin/gen.test.cjs
      - name: 내신브레인 서버 라우트 테스트
        run: node reading-server/naesin-api.test.mjs
      - name: 국어브레인 학습 엔진 테스트
        run: node naesin-ko/engine.test.cjs
      - name: 국어브레인 채점 모듈 테스트
        run: node naesin-ko/grade.test.cjs
      - name: 국어브레인 문항 생성 테스트
        run: node naesin-ko/gen.test.cjs
      - name: 국어브레인 팩 검증 규칙 테스트
        run: node naesin-ko/pack-check.test.cjs
      - name: 국어브레인 개념어 사전 테스트
        run: node naesin-ko/concepts.test.cjs
      - name: 국어브레인 준비도 테스트
        run: node naesin-ko/readiness.test.cjs
      - name: 국어브레인 추출 공용층 테스트
        run: node naesin-ko/extract/spans-util.test.mjs
      - name: 국어브레인 이해완성 추출기 테스트
        run: node naesin-ko/extract/build-ihae.test.mjs
      - name: 국어브레인 요약노트 추출기 테스트
        run: node naesin-ko/extract/build-yoyak.test.mjs
      - name: 국어브레인 단원집중 추출기 테스트
        run: node naesin-ko/extract/build-danwon.test.mjs
      - name: 국어브레인 서술형 공략 추출기 테스트
        run: node naesin-ko/extract/build-seosul.test.mjs
      - name: 국어브레인 폴더→팩 병합기 테스트
        run: node naesin-ko/extract/build-pack.test.mjs
      - name: 국어브레인 서버 라우트 테스트
        run: node reading-server/naesin-ko-api.test.mjs
      - name: 교재 코칭 테스트
        run: node reading-server/textbook.test.mjs
      - name: 정적 파일 가로채기 정합 테스트
        run: node reading-server/override.test.mjs
      - name: 반 명단 붙여넣기 테스트
        run: node reading-server/roster.test.mjs
      - name: 어휘 나이 진단 테스트
        run: node vocab-age/age.test.cjs
      - name: AI 하루 한도 테스트
        run: node reading-server/ai-quota.test.mjs
      - name: 아레나(반 대전) 테스트
        run: node reading-server/arena.test.mjs
      - name: 학생 수명주기 테스트 (등록~퇴원)
        run: node reading-server/student-lifecycle.test.mjs
      - name: dist 조립
        run: node reading-server/build-dist.mjs
      - name: 배포본 캐시 무효화 검증
        run: node reading-server/dist-cache.test.mjs
      - name: Cloudflare Workers 배포
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: reading-server
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN 시크릿이 없어 배포를 건너뜁니다. 저장소 Settings → Secrets and variables → Actions 에 추가하세요."
            exit 0
          fi
          npx wrangler@4 deploy
