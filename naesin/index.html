<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>WB 내신브레인 — 영어 시험대비</title>
  <meta name="description" content="단어 암기·본문 해석·백지 영작 — WB 영어 내신 시험대비 학습 시스템 (원내 전용)">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1C2430">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <style>
    /* 중학생 전용 학습 시스템 — D(스플릿 워크스페이스) 골격 + E(프로그레스 보드) 홈.
       주 기기 태블릿 가로, 보조 노트북. 놀이 요소 없이 목록·지면·숫자로만 말한다. */
    :root {
      --bg: #F2F4F7; --panel: #FFFFFF; --ink: #1C2430; --soft: #667382; --line: #E2E6EC;
      --ind: #4A56C9; --ind-soft: #EDEFFB; --green: #218358; --green-soft: #E8F4EE;
      --red: #C2402E; --red-soft: #FBEBE8; --amber: #B27B16; --amber-soft: #F8F1DF;
      --b1: #DCE9F7; --b2: #A9CBEF; --b3: #5E9BE0; --b4: #1F6BC4;
      --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body { background: var(--bg); color: var(--ink);
      font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      font-size: 14.5px; line-height: 1.6; word-break: keep-all; -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column; }
    button { font-family: inherit; font-size: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    input, textarea, select { font-family: inherit; font-size: 1rem; color: var(--ink); }
    :focus-visible { outline: 2px solid var(--ind); outline-offset: 2px; border-radius: 6px; }
    .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

    /* ── 상단 바 ── */
    .bar { display: flex; align-items: center; gap: 14px; background: var(--panel);
      border-bottom: 1px solid var(--line); padding: 9px 16px; flex: none; flex-wrap: wrap; }
    .bar .brand { font-weight: 900; font-size: 15px; letter-spacing: -.01em; }
    .seg { display: flex; background: var(--bg); border-radius: 9px; padding: 3px; }
    .seg button { padding: 7px 16px; border-radius: 7px; font-size: 13.5px; font-weight: 700; color: var(--soft); white-space: nowrap; }
    .seg button.on { background: var(--panel); color: var(--ind); box-shadow: 0 1px 3px rgba(20,30,60,.12); }
    .bar .who { margin-left: auto; font-size: 12.5px; color: var(--soft); text-align: right; line-height: 1.35; }
    .bar .who b { color: var(--ink); }
    .bar .dd { background: var(--red-soft); color: var(--red); font-weight: 800; font-size: 12.5px;
      border-radius: 6px; padding: 4px 10px; white-space: nowrap; }
    .bar .dd.practice { background: var(--ind-soft); color: var(--ind); }

    /* ── 본체: 스플릿 ── */
    .wrap { flex: 1; display: flex; min-height: 0; }
    .list { width: 330px; flex: none; background: var(--panel); border-right: 1px solid var(--line);
      display: flex; flex-direction: column; min-height: 0; }
    .list .lh { padding: 13px 16px 8px; font-size: 12.5px; color: var(--soft); font-weight: 700;
      display: flex; justify-content: space-between; gap: 8px; flex: none; }
    .list .lh b { color: var(--ink); }
    .rows { flex: 1; overflow-y: auto; }
    .hdr { padding: 7px 14px; background: #F7F8FA; font-size: 11.5px; font-weight: 800; color: var(--soft);
      border-bottom: 1px solid #EFF2F5; position: sticky; top: 0; }
    .row { display: flex; align-items: center; gap: 9px; padding: 9px 14px; border-bottom: 1px solid #EFF2F5; cursor: pointer; }
    .row .no { width: 22px; font-size: 12px; font-weight: 800; color: var(--soft); flex: none; font-family: var(--mono); }
    .row .tx { flex: 1; min-width: 0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #3A4656; }
    .row .sub { display: block; font-size: 11px; color: var(--soft); }
    .row.sel { background: var(--ind-soft); }
    .row.sel .tx { color: var(--ink); font-weight: 600; }
    .stg { display: inline-flex; gap: 2px; flex: none; }
    .stg i { width: 6px; height: 11px; border-radius: 2px; background: #E9EDF2; }
    .stg i.on { background: var(--ind); } .stg i.dn { background: var(--green); }
    .lvchip { flex: none; font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--soft); }
    .lvchip.r { color: var(--b4); } .lvchip.s { color: var(--green); }

    .work { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow-y: auto; }
    .wpad { padding: 18px 26px 30px; max-width: 860px; width: 100%; margin: 0 auto; }
    .full { flex: 1; overflow-y: auto; }
    .full .wpad { max-width: 1060px; }

    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
      padding: 16px 20px; margin: 0 0 14px; }
    .card h2 { font-size: 14.5px; font-weight: 800; margin: 0 0 10px; display: flex; align-items: baseline; gap: 8px; }
    .card h2 small { font-weight: 500; color: var(--soft); font-size: 12px; }
    .muted { color: var(--soft); font-size: 12.5px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 9px;
      padding: 11px 18px; font-weight: 700; font-size: 14px; background: var(--panel);
      color: var(--ink); border: 1px solid var(--line); }
    .btn.p { background: var(--ind); color: #fff; border-color: var(--ind); }
    .btn.dark { background: var(--ink); color: #fff; border-color: var(--ink); }
    .btn.big { width: 100%; padding: 13px 18px; }
    .btn:disabled { opacity: .4; cursor: default; }
    .btn:active:not(:disabled) { transform: translateY(1px); }
    .row2 { display: flex; gap: 10px; } .row2 > * { flex: 1; }
    .tag { display: inline-block; font-size: 11.5px; font-weight: 800; border-radius: 5px; padding: 2px 9px; }
    .t-ind { background: var(--ind-soft); color: var(--ind); }
    .t-green { background: var(--green-soft); color: var(--green); }
    .t-red { background: var(--red-soft); color: var(--red); }
    .t-gray { background: var(--bg); color: var(--soft); }
    .notice { border: 1px solid var(--amber); background: var(--amber-soft); border-radius: 9px;
      padding: 10px 14px; font-size: 12.5px; margin: 0 0 12px; }

    /* ── E 프로그레스 보드 (홈) ── */
    .big3 { display: grid; grid-template-columns: 1fr 1fr 1fr; border: 1px solid var(--line);
      border-radius: 12px; overflow: hidden; background: var(--panel); margin-bottom: 14px; }
    .big3 > div { padding: 16px 22px; border-right: 1px solid var(--line); }
    .big3 > div:last-child { border-right: none; }
    .big3 .n { font-family: var(--mono); font-size: 36px; font-weight: 700; letter-spacing: -.04em; line-height: 1.15; }
    .big3 .n small { font-size: 15px; color: var(--soft); }
    .big3 .l { font-size: 12px; font-weight: 700; color: var(--soft); margin-top: 2px; }
    .big3 .l b { color: var(--ink); }
    .boards { display: grid; grid-template-columns: 1.1fr .9fr; gap: 14px; margin-bottom: 14px; }
    .legend { font-size: 11px; color: var(--soft); margin: 0 0 10px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin: 0 3px 0 10px; vertical-align: -1px; }
    .heat { display: grid; grid-template-columns: repeat(13, 1fr); gap: 4px; }
    .heat i { aspect-ratio: 1; border-radius: 3px; background: #F0F3F6; cursor: default; }
    .mtx { display: grid; gap: 3px; margin-top: 4px; }
    .mtx i { height: 12px; border-radius: 2px; background: #F0F3F6; }
    .heat i { max-height: 26px; }
    .rowlbl { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--soft); margin: 7px 0 3px; }
    .todo { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .todo .t { font-size: 12.5px; font-weight: 800; color: var(--soft); }
    .chip { border: 1px solid var(--line); border-radius: 8px; padding: 7px 14px; font-size: 13px; font-weight: 700; background: var(--panel); }
    .chip small { display: block; font-weight: 500; color: var(--soft); font-size: 11px; }
    .chip.now { border-color: var(--ind); background: var(--ind-soft); }

    /* ── 작업 지면 (오른쪽 상세) ── */
    .wh { display: flex; align-items: baseline; gap: 10px; margin: 0 0 12px; flex-wrap: wrap; }
    .wh h2 { font-size: 16px; font-weight: 900; margin: 0; }
    .stagesteps { margin-left: auto; display: flex; gap: 5px; align-items: center; }
    .stagesteps em { font-style: normal; width: 22px; height: 22px; border-radius: 6px; background: #E9EDF2;
      display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 11.5px; color: var(--soft); }
    .stagesteps em.dn { background: var(--green); color: #fff; }
    .stagesteps em.on { background: var(--ind); color: #fff; }
    .chunkline { margin: 4px 0; padding: 7px 11px; border-radius: 7px; background: var(--bg); font-size: 13.5px; }
    .chunkline .ko { color: var(--soft); font-size: 12px; display: block; }
    .chunkline.miss { background: var(--red-soft); }

    /* ── 러너 (훈련 실행 — 전체 화면 집중 지면) ── */
    .runner { position: fixed; inset: 0; z-index: 60; background: var(--bg); overflow-y: auto; display: none; }
    .runner.open { display: block; }
    .runner .rshell { max-width: 760px; margin: 0 auto; padding: 14px 18px 40px; }
    .rtop { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .rtop .prog { flex: 1; }
    .rtop .quit { flex: none; font-size: 1.15rem; color: var(--soft); padding: 4px 10px; }
    .bar2 { height: 5px; background: #E5E9EF; border-radius: 3px; overflow: hidden; }
    .bar2 i { display: block; height: 100%; background: var(--ind); }
    .q { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; }
    .q .qmeta { font-size: 12px; font-weight: 800; color: var(--soft); margin-bottom: 10px; }
    .q .prompt { font-size: 1.2rem; font-weight: 800; color: var(--ink); margin: 4px 0 16px; line-height: 1.6; }
    .q .prompt.sm { font-size: 1.02rem; font-weight: 500; }
    .choices { display: flex; flex-direction: column; gap: 8px; }
    .choices button { text-align: left; background: var(--panel); border: 1px solid var(--line);
      border-radius: 9px; padding: 12px 15px; font-weight: 500; font-size: 15px; }
    .choices button.sel { border-color: var(--ind); background: var(--ind-soft); }
    .choices button.right { border-color: var(--green); background: var(--green-soft); }
    .choices button.wrongpick { border-color: var(--red); background: var(--red-soft); }
    .blankline { display: inline-block; min-width: 74px; border: none; border-bottom: 2px solid var(--ind);
      background: transparent; padding: 2px 6px; margin: 0 2px; text-align: center; font-weight: 700; font-size: 15px; }
    .blankline.ok { border-color: var(--green); color: var(--green); }
    .blankline.bad { border-color: var(--red); color: var(--red); }
    .hintko { font-size: 11px; color: var(--amber); display: inline-block; margin: 0 2px; }
    .tokens { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .tokens button { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 8px 13px; font-weight: 600; }
    .tokens button:disabled { opacity: .3; }
    .built { min-height: 48px; background: var(--bg); border: 1px dashed #C9D1DB; border-radius: 9px;
      padding: 8px 10px; display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .built button { background: var(--panel); border: 1px solid var(--ind); border-radius: 7px; padding: 6px 11px; font-weight: 600; }
    textarea.ans { width: 100%; min-height: 96px; border: 1px solid var(--line); border-radius: 9px;
      padding: 11px 13px; background: var(--panel); resize: vertical; }
    input.ans { width: 100%; border: 1px solid var(--line); border-radius: 9px; padding: 11px 13px; background: var(--panel); }
    .result { margin-top: 14px; border-radius: 9px; padding: 12px 15px; font-size: 14px; border: 1px solid transparent; }
    .result.good { background: var(--green-soft); border-color: var(--green); }
    .result.bad { background: var(--red-soft); border-color: var(--red); }
    .result b.mark { font-weight: 800; }
    .result .exp { margin-top: 6px; color: var(--soft); font-size: 13px; }
    .confrow { display: flex; gap: 8px; margin-top: 14px; }
    .confrow button { flex: 1; border: 1px solid var(--line); border-radius: 9px; padding: 10px 4px;
      font-size: 13.5px; font-weight: 700; background: var(--panel); }
    .confrow .cl { font-size: 11px; color: var(--soft); display: block; font-weight: 500; }
    .rnext { margin-top: 14px; }
    .diffline { margin: 6px 0; padding: 9px 11px; border-radius: 7px; font-size: 13.5px; background: var(--bg); }
    .diffline.ok { background: var(--green-soft); } .diffline.partial { background: var(--amber-soft); }
    .diffline.missing { background: var(--red-soft); }
    .diffline .d-missing { color: var(--red); text-decoration: underline; }
    .diffline .d-extra { color: var(--amber); text-decoration: line-through; }
    .diffline .lbl { font-size: 11px; font-weight: 800; margin-right: 6px; font-family: var(--mono); }
    .paperbtn { border: 1px solid var(--line); border-radius: 6px; padding: 2px 11px; font-weight: 800; }
    .paperbtn.y { background: var(--green-soft); border-color: var(--green); color: var(--green); }
    .paperbtn.n { background: var(--red-soft); border-color: var(--red); color: var(--red); }
    .typerow { display: flex; align-items: center; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--line); }
    .typerow:last-child { border-bottom: none; }
    .typerow .tt { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; }
    .typerow .tt small { display: block; font-weight: 400; color: var(--soft); font-size: 11.5px; }

    /* ── 반응형: 세로 패드·폰 — 목록이 위로 접힌다 ── */
    @media (max-width: 880px) {
      .wrap { flex-direction: column; }
      .list { width: 100%; max-height: 38vh; border-right: none; border-bottom: 1px solid var(--line); }
      .boards { grid-template-columns: 1fr; }
      .big3 .n { font-size: 28px; }
      .bar .who { display: none; }
    }
  </style>
</head>
<body>
<header class="bar">
  <span class="brand">내신브레인</span>
  <nav class="seg" id="tabs">
    <button data-tab="home">홈</button>
    <button data-tab="words">단어 암기</button>
    <button data-tab="passage">본문 암기</button>
    <button data-tab="quiz">문제 풀이</button>
    <button data-tab="progress">성취도</button>
  </nav>
  <span class="who" id="whoLine"></span>
  <span class="dd" id="ddayBadge">—</span>
</header>
<div class="wrap" id="wrap"></div>

<div class="runner" id="runner"><div class="rshell">
  <div class="rtop">
    <div class="prog"><div class="bar2"><i id="rBar" style="width:0%"></i></div>
      <span class="muted" id="rCount"></span></div>
    <button class="quit" id="rQuit" aria-label="닫기">✕</button>
  </div>
  <div id="rBody"></div>
</div></div>

<script src="./voice.js"></script>
<script src="./engine.js"></script>
<script src="./grade.js"></script>
<script src="./gen.js"></script>
<script>
'use strict';
/* WB 내신브레인 — 중학생 전용, 태블릿 우선.
   레이아웃: D 스플릿 워크스페이스(좌 목록 + 우 지면) + E 프로그레스 보드(홈).
   훈련 실행은 전체 화면 집중 지면(러너). 엔진·채점·생성 모듈은 순수 로직 그대로. */
(function () {
  var KEY = 'wbn.v1';
  var $ = function (id) { return document.getElementById(id); };
  var pack = null, DB = null, view = 'home';
  var authed = false, examServer = null, packList = [];
  var selSeq = null, selWordId = null, selType = null, selDlg = null;
  var taskServer = null;

  /* ── 저장소·동기화 (기존 계약 유지) ── */
  function loadDB() { try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; } }
  function persist() {
    DB.savedAt = Date.now();
    try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) {}
    scheduleSync();
  }
  function packDB() {
    if (!DB.packs[pack.packId]) DB.packs[pack.packId] = { states: {}, diagDone: false, wrong: {}, dump: [], paper: {}, exam: null };
    return DB.packs[pack.packId];
  }
  function setLast(label, resume) { DB.last = { packId: pack.packId, label: label, resume: resume, at: Date.now() }; }
  function auth() { try { return JSON.parse(localStorage.getItem('wbr.auth') || 'null'); } catch (e) { return null; } }
  function api(path, opt) {
    var a = auth();
    if (!a || !a.token) return Promise.reject(new Error('no-auth'));
    return fetch('/api/naesin' + path, Object.assign({
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + a.token }
    }, opt || {})).then(function (r) {
      if (!r.ok) throw new Error('api-' + r.status);
      return r.json();
    });
  }
  var syncTimer = null;
  function scheduleSync() {
    if (!authed) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(pushState, 3000);
  }
  function summaryOf() {
    var pd = packDB(), w = {}, s = {};
    Object.keys(pd.states).forEach(function (k) {
      var st = pd.states[k];
      if (st.kind === 'sentence') s[k] = st; else w[k] = st;
    });
    var pd2 = packDB();
    return { packId: pack.packId, word: WBNAESIN.wordSummary(w), sentence: WBNAESIN.sentenceSummary(s),
      task: (pd2.taskLog || {})[WBNAESIN.localDate(Date.now())] || null,
      updatedAt: new Date().toISOString() };
  }
  function pushState() {
    if (!authed) return;
    var body = { state: { v: 1, packs: DB.packs, last: DB.last || null, summary: summaryOf(), savedAt: DB.savedAt } };
    api('/state', { method: 'PUT', body: JSON.stringify(body) }).catch(function () {});
  }
  function pullState() {
    return api('/state').then(function (r) {
      var remote = r && r.state;
      if (remote && remote.packs && (remote.savedAt || 0) > (DB.savedAt || 0)) {
        DB.packs = remote.packs;
        if (remote.last) DB.last = remote.last;
      }
    }).catch(function () {});
  }

  /* ── 상태 접근 ── */
  function ensureStates() {
    var pd = packDB(), now = Date.now();
    (pack.words || []).forEach(function (w) {
      if (!pd.states[w.id]) pd.states[w.id] = WBNAESIN.createState(w.id, 'word', now);
    });
    (pack.sentences || []).forEach(function (s) {
      var id = WBNAESIN.sentenceId(s.seq);
      if (!pd.states[id]) pd.states[id] = WBNAESIN.createState(id, 'sentence', now);
    });
    /* 대화문 — 3단계(읽기→대화 완성→순서 배열), stage 4 도달 = 완료 */
    (pack.dialogues || []).forEach(function (d) {
      var id = 'd-' + d.id;
      if (!pd.states[id]) pd.states[id] = WBNAESIN.createState(id, 'sentence', now);
    });
  }
  function dlgState(id) { return packDB().states['d-' + id]; }
  function dlgById(id) { for (var i = 0; i < (pack.dialogues || []).length; i++) if (pack.dialogues[i].id === id) return pack.dialogues[i]; return null; }
  function dlgDone(st) { return st && st.stage >= 4; }
  var DLG_STAGES = { 1: '대역 읽기', 2: '대화 완성', 3: '순서 배열' };
  function wordStates() {
    var pd = packDB(), out = {};
    Object.keys(pd.states).forEach(function (k) { if (pd.states[k].kind !== 'sentence') out[k] = pd.states[k]; });
    return out;
  }
  function senStates() {
    var pd = packDB(), out = {};
    Object.keys(pd.states).forEach(function (k) { if (pd.states[k].kind === 'sentence') out[k] = pd.states[k]; });
    return out;
  }
  function senState(seq) { return packDB().states[WBNAESIN.sentenceId(seq)]; }
  function exam() { return packDB().exam || null; }
  function wordById(id) { for (var i = 0; i < pack.words.length; i++) if (pack.words[i].id === id) return pack.words[i]; return null; }
  function senBySeq(seq) { for (var i = 0; i < pack.sentences.length; i++) if (pack.sentences[i].seq === seq) return pack.sentences[i]; return null; }
  function dayGroups() {
    var groups = [], cur = null;
    (pack.sentences || []).forEach(function (s) {
      if (!cur || cur.day !== s.dayGroup) { cur = { day: s.dayGroup, header: s.dayHeaderKo || s.dayGroup, sentences: [] }; groups.push(cur); }
      if (s.dayHeaderKo) cur.header = s.dayHeaderKo;
      cur.sentences.push(s);
    });
    return groups;
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }
  var STAGE_NAMES = { 1: '대역 읽기', 2: '해석 쓰기', 3: '핵심어 인출', 4: '클로즈·배열', 5: '문장 영작', 6: '백지 쓰기' };

  /* ── 탭 ── */
  function setTab(t) {
    view = t;
    var btns = $('tabs').querySelectorAll('button');
    for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('on', btns[i].getAttribute('data-tab') === t);
    render();
  }
  $('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tab]');
    if (b) setTab(b.getAttribute('data-tab'));
  });

  function renderHeader() {
    var a = auth();
    $('whoLine').innerHTML = (a && a.name ? '<b>' + esc(a.name) + '</b> · ' : (authed ? '' : '체험 모드 · ')) +
      (pack ? esc((pack.textbook || '') + ' L' + pack.lesson) : '');
    var ex = exam(), b = $('ddayBadge');
    if (ex && ex.examDate) {
      var d = WBNAESIN.daysUntil(ex.examDate, Date.now());
      b.textContent = d >= 0 ? 'D-' + d : '시험 종료';
      b.className = 'dd';
    } else { b.textContent = '자율 학습'; b.className = 'dd practice'; }
  }

  /* ── 레이아웃 헬퍼 ── */
  function layoutSplit(listHtml, workHtml) {
    $('wrap').innerHTML =
      '<aside class="list" id="sidePane">' + listHtml + '</aside>' +
      '<section class="work"><div class="wpad" id="workPane">' + workHtml + '</div></section>';
  }
  function layoutFull(html) {
    $('wrap').innerHTML = '<section class="full"><div class="wpad" id="workPane">' + html + '</div></section>';
  }

  /* ════════ 홈 — E 프로그레스 보드 ════════ */
  function heatColor(v) { return ['#F0F3F6', 'var(--b2)', 'var(--b3)', 'var(--b4)'][v] || '#F0F3F6'; }
  function renderHome() {
    var pd = packDB();
    if (!pd.diagDone) {
      layoutFull(
        '<div class="card" style="max-width:640px;margin:40px auto"><h2>진단 평가 <small>학습 시작 전 1회 · 약 2분</small></h2>' +
        '<p class="muted" style="font-size:13.5px">현재 알고 있는 단어를 확인해 학습 계획을 세웁니다. 전 단어 ' + pack.words.length + '개. 모르는 단어는 「모름」을 선택하면 됩니다 — 진단이므로 점수와 무관합니다.</p>' +
        '<button class="btn p big" id="startDiag" style="margin-top:8px">진단 평가 시작</button></div>' +
        (authed ? '' : '<div class="notice" style="max-width:640px;margin:0 auto">체험 모드 — 예시 교재입니다. 학원 QR로 연동하면 내 학교 교재가 열립니다.</div>'));
      $('startDiag').onclick = startDiagnostic;
      return;
    }
    var wsum = WBNAESIN.wordSummary(wordStates());
    var ssum = WBNAESIN.sentenceSummary(senStates());
    var plan = WBNAESIN.planDay(pack, pd.states, exam(), Date.now(), {});
    var wCount = plan.words.fresh.length + plan.words.review.length + plan.words.relearn.length;
    var wrongN = Object.keys(pd.wrong).filter(function (k) { return !pd.wrong[k].cleared; }).length;
    var last = DB.last && DB.last.packId === pack.packId ? DB.last : null;

    var html = authed ? '' : '<div class="notice">체험 모드 — 예시 교재입니다. 학원 QR로 연동하면 내 학교 교재와 기록 저장이 열립니다.</div>';
    /* 세션 ⑤ 수업 모드 — 강사가 배정한 오늘 과제가 최상단에 온다 */
    var todayStr = WBNAESIN.localDate(Date.now());
    var task = (taskServer && taskServer.task && taskServer.task.date === todayStr) ? taskServer.task : null;
    var taskLog = (pd.taskLog || {})[todayStr];
    if (task) {
      html += '<div class="card" style="border-color:var(--ind)"><div class="todo"><span class="t">오늘 수업 과제</span>' +
        '<span style="flex:1"><b>' + esc(task.title) + '</b><span class="muted" style="display:block">학습 유형 ' + task.typeKeys.length + '종' +
        (task.seqFrom ? ' · 본문 문장 ' + task.seqFrom + '–' + task.seqTo : '') + '</span></span>' +
        (taskLog ? '<span class="tag t-green">완료 · ' + taskLog.correct + '/' + taskLog.total + '</span>'
                 : '<button class="btn p" id="taskGo">과제 시작</button>') + '</div></div>';
    }
    if (packList.length > 1) {
      html += '<p class="muted" style="margin:0 0 10px">시험 범위: ' + packList.map(function (id) {
        return id === pack.packId ? '<b>' + esc(id) + '</b>' : '<a href="#" data-pk="' + esc(id) + '">' + esc(id) + '</a>';
      }).join(' · ') + '</p>';
    }
    html +=
      '<div class="big3">' +
      '<div><div class="n">' + pct(wsum.reached, wsum.total) + '<small>%</small></div><div class="l">단어 도달 <b>' + wsum.reached + '/' + wsum.total + '</b> · 안정화 ' + wsum.stable + '</div></div>' +
      '<div><div class="n">' + pct(ssum.interpreted, ssum.total) + '<small>%</small></div><div class="l">본문 해석 통과 <b>' + ssum.interpreted + '/' + ssum.total + '</b></div></div>' +
      '<div><div class="n">' + pct(ssum.memorized, ssum.total) + '<small>%</small></div><div class="l">백지 영작 완료 <b>' + ssum.memorized + '/' + ssum.total + '</b></div></div></div>' +

      '<div class="boards">' +
      '<div class="card"><h2>단어 안정화 지도 <small>' + wsum.total + '단어 · 진하기 = 안정화 0→3</small></h2>' +
      '<div class="legend">0<i style="background:#F0F3F6"></i>1<i style="background:var(--b2)"></i>2<i style="background:var(--b3)"></i>3<i style="background:var(--b4)"></i></div>' +
      '<div class="heat" id="heat"></div></div>' +
      '<div class="card"><h2>본문 ' + ssum.total + '문장 × 6단계 <small>행 = 단계 · 열 = 문장</small></h2>' +
      '<div class="rowlbl"><span>6단계(백지)</span><span>문장 1 → ' + ssum.total + '</span></div>' +
      '<div id="mtxWrap"></div>' +
      '<div class="rowlbl"><span>1단계(대역)</span></div></div></div>' +

      '<div class="card"><div class="todo"><span class="t">오늘의 학습</span>' +
      '<button class="chip now" data-go="words">단어 ' + wCount + '개<small>신규 ' + plan.words.fresh.length + ' · 복습 ' + plan.words.review.length + ' · 안정화 ' + plan.words.relearn.length + '</small></button>' +
      '<button class="chip" data-go="passage">본문 ' + plan.sentences.length + '문장<small>단계별 훈련</small></button>' +
      '<button class="chip" data-go="quiz">문제 풀이<small>오답 ' + wrongN + '문항 미해결</small></button>' +
      (last ? '<button class="btn dark" id="resumeBtn" style="margin-left:auto">이어서 학습<small style="display:block;font-weight:400;font-size:11px;opacity:.8">' + esc(last.label) + '</small></button>' : '') +
      '</div>' + (plan.note ? '<p class="muted" style="margin:10px 0 0">' + esc(plan.note) + '</p>' : '') + '</div>' +

      '<div class="card"><div class="todo"><span class="t">백지 점검</span>' +
      '<span class="muted" style="flex:1">지금까지 학습한 문장을 아무것도 보지 않고 쓰는 2분 자기 점검 — 채점·기록 없음.</span>' +
      '<button class="btn" id="startDump">시작</button></div></div>';
    layoutFull(html);

    /* 히트맵·매트릭스 채우기 */
    var heat = $('heat'), ws = wordStates();
    pack.words.forEach(function (w) {
      var st = ws[w.id];
      var v = st ? (st.reached ? Math.max(1, WBNAESIN.stability(st)) : 0) : 0;
      if (st && WBNAESIN.isStable(st)) v = 3;
      var e = document.createElement('i');
      e.style.background = heatColor(v);
      e.title = w.headword + ' · 안정화 ' + (st ? WBNAESIN.stability(st) : 0) + '/3';
      heat.appendChild(e);
    });
    var mw = $('mtxWrap'), N = pack.sentences.length;
    for (var stage = 6; stage >= 1; stage--) {
      var row = document.createElement('div');
      row.className = 'mtx';
      row.style.gridTemplateColumns = 'repeat(' + N + ',1fr)';
      pack.sentences.forEach(function (s) {
        var st = senState(s.seq);
        var cur = st ? (st.reached ? 7 : st.stage) : 1;
        var e = document.createElement('i');
        if (cur > stage) e.style.background = (stage === 6 ? 'var(--green)' : (stage >= 4 ? 'var(--b4)' : (stage >= 2 ? 'var(--b3)' : 'var(--b1)')));
        row.appendChild(e);
      });
      mw.appendChild(row);
    }
    $('workPane').addEventListener('click', function (e) {
      var g = e.target.closest('[data-go]');
      if (g) { setTab(g.getAttribute('data-go')); return; }
      var pk = e.target.closest('a[data-pk]');
      if (pk) { e.preventDefault(); switchPack(pk.getAttribute('data-pk')); }
    });
    if (last) $('resumeBtn').onclick = function () { doResume(last.resume); };
    $('startDump').onclick = startDump;
    var tg = $('taskGo');
    if (tg && task) tg.onclick = function () { runTask(task); };
  }
  function runTask(task) {
    var items = [], types = quizTypes();
    task.typeKeys.forEach(function (k) {
      var t = types.filter(function (x) { return x.key === k; })[0];
      if (t) items = items.concat(t.make().slice(0, 10));
    });
    if (task.seqFrom) {
      pack.sentences.filter(function (s) { return s.seq >= task.seqFrom && s.seq <= task.seqTo; })
        .slice(0, 10).forEach(function (s) {
          var q = WBGEN.keywordBlanks(s, 'en');
          if (q) items.push(q);
        });
    }
    if (!items.length) { alert('과제로 출제할 문항이 없습니다.'); return; }
    var correct = 0, total = 0;
    runQueue(items, '수업 과제 · ' + task.title, function (item, ok) {
      total += 1; if (ok) correct += 1;
      applyMockGrade(item, ok);
    }, function () {
      var pd = packDB();
      pd.taskLog = pd.taskLog || {};
      pd.taskLog[task.date] = { correct: correct, total: total, title: task.title, at: new Date().toISOString() };
      persist(); render();
    }, { noConfidence: true });
  }
  function switchPack(pid) {
    api('/pack?id=' + encodeURIComponent(pid)).then(function (r) {
      pack = r.pack; ensureStates();
      if (examServer && examServer.examDate) packDB().exam = { examDate: examServer.examDate, wordDeadlineDays: examServer.wordDeadlineDays || 7 };
      persist(); render();
    }).catch(function () { alert('교재를 불러오지 못했습니다.'); });
  }
  function doResume(r) {
    if (!r) return;
    if (r.t === 'wordDaily') { setTab('words'); return startWordDaily(); }
    if (r.t === 'sentence') { selSeq = r.seq; setTab('passage'); return; }
    if (r.t === 'quizType') { selType = r.key; setTab('quiz'); return; }
    if (r.t === 'blank') { setTab('passage'); var grp = dayGroups().filter(function (g) { return g.day === r.day; })[0]; return startBlank(grp); }
    if (r.t === 'dialogue') { selDlg = r.id; setTab('passage'); return; }
    setTab('home');
  }

  function startDiagnostic() {
    var items = WBGEN.diagnosticSet(pack, Math.random);
    var results = [];
    runQueue(items, '진단 평가', function (item, ok, answerKey) {
      results.push({ id: item.wordId, known: ok && answerKey !== item.unknownKey });
    }, function () {
      var pd = packDB();
      WBNAESIN.applyDiagnostic(pd.states, results, Date.now());
      pd.diagDone = true;
      persist();
      var known = results.filter(function (r) { return r.known; }).length;
      alert('진단 완료.\n아는 단어 ' + known + '개 / 전체 ' + pack.words.length + '개.\n학습 계획은 남은 ' + (pack.words.length - known) + '개 기준으로 편성됩니다.');
      render();
    }, { noConfidence: true });
  }

  /* ════════ 단어 암기 (스플릿) ════════ */
  function startWordDaily() {
    var plan = WBNAESIN.planDay(pack, packDB().states, exam(), Date.now(), {});
    var items = WBGEN.dailySet(pack, { words: plan.words, sentences: [] }, Math.random);
    if (!items.length) { alert('오늘 예정된 단어 학습이 없습니다.'); return; }
    setLast('단어 암기 — 오늘의 학습', { t: 'wordDaily' });
    persist();
    runItems(items, '단어 암기');
  }
  function renderWords() {
    var ws = wordStates();
    var sum = WBNAESIN.wordSummary(ws);
    var listHtml = '<div class="lh"><span>단어 ' + sum.total + '개</span><span>도달 <b>' + sum.reached + '</b> · 안정화 <b>' + sum.stable + '</b></span></div><div class="rows" id="wRows">';
    pack.words.forEach(function (w) {
      var st = ws[w.id], stb = st ? WBNAESIN.stability(st) : 0;
      var cls = st && st.reached ? (WBNAESIN.isStable(st) ? 's' : 'r') : '';
      listHtml += '<div class="row' + (selWordId === w.id ? ' sel' : '') + '" data-w="' + esc(w.id) + '">' +
        '<span class="tx">' + esc(w.headword) + '<span class="sub">' + esc((w.meaningKo || [])[0] || '') + '</span></span>' +
        '<span class="lvchip ' + cls + '">' + stb + '/3</span></div>';
    });
    listHtml += '</div>';
    var w = selWordId ? wordById(selWordId) : null;
    var workHtml =
      '<div class="card"><h2>오늘의 단어 학습</h2>' +
      '<p class="muted">도달 = 힌트 없이 1회 인출 성공 · 안정화 = 도달 후 서로 다른 날 3회 재확인. 시험 전 전 단어 안정화(3/3)가 목표입니다.</p>' +
      '<button class="btn p big" id="trainWords" style="margin-top:8px">단어 학습 시작</button></div>';
    if (w) {
      var st = ws[w.id];
      workHtml += '<div class="card"><h2>' + esc(w.headword) + ' <small>' + esc(w.pos || '') + '</small>' +
        '<span class="tag ' + (st && st.reached ? (WBNAESIN.isStable(st) ? 't-green' : 't-ind') : 't-gray') + '" style="margin-left:auto">안정화 ' + (st ? WBNAESIN.stability(st) : 0) + '/3</span></h2>' +
        '<p style="font-size:15px;margin:0 0 8px"><b>' + esc((w.meaningKo || []).join(', ')) + '</b></p>' +
        (w.example ? '<div class="chunkline">' + esc(w.example.en) + '<span class="ko">' + esc(w.example.ko) + '</span></div>' : '') +
        (w.definition ? '<div class="chunkline">' + esc(w.definition.en) + '<span class="ko">' + esc(w.definition.ko) + '</span></div>' : '') +
        ((w.senses || []) || []).map(function (sn) {
          return '<div class="chunkline">[의미 ' + sn.senseNo + '] ' + esc(sn.meaningKo) + (sn.example ? '<span class="ko">' + esc(sn.example.en) + ' — ' + esc(sn.example.ko) + '</span>' : '') + '</div>';
        }).join('') +
        ((w.synonyms || []).length ? '<p class="muted">유의어: ' + esc(w.synonyms.join(', ')) + '</p>' : '') +
        ((w.antonyms || []).length ? '<p class="muted">반의어: ' + esc(w.antonyms.join(', ')) + '</p>' : '') +
        '</div>';
    } else {
      workHtml += '<p class="muted">왼쪽 목록에서 단어를 선택하면 상세 정보가 표시됩니다.</p>';
    }
    layoutSplit(listHtml, workHtml);
    $('wRows').onclick = function (e) {
      var r = e.target.closest('.row[data-w]');
      if (r) { selWordId = r.getAttribute('data-w'); render(); }
    };
    $('trainWords').onclick = startWordDaily;
  }

  /* ════════ 본문 암기 (스플릿) ════════ */
  function stageSteps(stage, done) {
    var h = '<span class="stagesteps">';
    for (var i = 1; i <= 6; i++) {
      var cls = done ? 'dn' : (i < stage ? 'dn' : (i === stage ? 'on' : ''));
      h += '<em class="' + cls + '">' + i + '</em>';
    }
    return h + '</span>';
  }
  function stgMini(stage, done) {
    var h = '<span class="stg">';
    for (var i = 1; i <= 6; i++) h += '<i class="' + (done ? 'dn' : (i < stage ? 'dn' : (i === stage ? 'on' : ''))) + '"></i>';
    return h + '</span>';
  }
  function renderPassage() {
    var g = WBNAESIN.gate(wordStates(), exam(), Date.now(), {});
    var ssum = WBNAESIN.sentenceSummary(senStates());
    if (selSeq == null) selSeq = (pack.sentences[0] || {}).seq;
    var listHtml = '<div class="lh"><span>본문 ' + ssum.total + '문장</span><span>해석 <b>' + ssum.interpreted + '</b> · 백지 <b>' + ssum.memorized + '</b></span></div><div class="rows" id="sRows">';
    dayGroups().forEach(function (gr, gi) {
      var doneAll = gr.sentences.every(function (s) { var st = senState(s.seq); return st && st.reached; });
      listHtml += '<div class="hdr">' + esc(gr.header) + (doneAll ? ' · 백지 완료' : '') +
        ' <button data-blank="' + gi + '" style="float:right;font-size:11px;font-weight:800;color:var(--ind)"' + (g.open ? '' : ' disabled') + '>단락 백지 시험</button></div>';
      gr.sentences.forEach(function (s) {
        var st = senState(s.seq);
        listHtml += '<div class="row' + (s.seq === selSeq ? ' sel' : '') + '" data-seq="' + s.seq + '">' +
          '<span class="no">' + s.seq + '</span><span class="tx">' + esc(s.en) + '</span>' +
          stgMini(st ? st.stage : 1, st && st.reached) + '</div>';
      });
    });
    if ((pack.dialogues || []).length) {
      listHtml += '<div class="hdr">대화문 · 의사소통 기능</div>';
      pack.dialogues.forEach(function (d) {
        var st = dlgState(d.id);
        listHtml += '<div class="row' + (selDlg === d.id ? ' sel' : '') + '" data-dlg="' + esc(d.id) + '">' +
          '<span class="tx">' + esc(d.section) + '<span class="sub">' + d.lines.length + '줄 · ' + (dlgDone(st) ? '완료' : (st ? st.stage : 1) + '단계 ' + DLG_STAGES[Math.min(st ? st.stage : 1, 3)]) + '</span></span>' +
          '<span class="lvchip ' + (dlgDone(st) ? 's' : '') + '">' + (dlgDone(st) ? '완료' : (Math.min(st ? st.stage : 1, 3)) + '/3') + '</span></div>';
      });
      if ((pack.keyExpressions || []).length) {
        listHtml += '<div class="row' + (selDlg === '__key__' ? ' sel' : '') + '" data-dlg="__key__">' +
          '<span class="tx">핵심표현<span class="sub">의사소통 기능 표현 ' + pack.keyExpressions.length + '개 빈칸 확인</span></span></div>';
      }
    }
    listHtml += '</div>';
    layoutSplit(listHtml, selDlg ? dialogueWorkHtml(selDlg) : sentenceWorkHtml(selSeq, g));
    $('sRows').onclick = function (e) {
      var b = e.target.closest('button[data-blank]');
      if (b) { startBlank(dayGroups()[Number(b.getAttribute('data-blank'))]); return; }
      var r = e.target.closest('.row[data-seq]');
      if (r) { selSeq = Number(r.getAttribute('data-seq')); selDlg = null; render(); return; }
      var dr = e.target.closest('.row[data-dlg]');
      if (dr) { selDlg = dr.getAttribute('data-dlg'); render(); }
    };
    if (selDlg) wireDialogueWork(selDlg);
    else wireSentenceWork(selSeq, g);
  }

  /* ── 대화문 학습 (세션 ①) ── */
  function dialogueWorkHtml(id) {
    if (id === '__key__') {
      return '<div class="wh"><h2>핵심표현</h2><span class="tag t-ind">의사소통 기능</span></div>' +
        '<div class="card">' +
        (pack.functions || []).map(function (f) {
          return '<div class="chunkline"><b>' + esc(f.name) + '</b> — ' + esc(f.pattern || '') + '<span class="ko">' + esc(f.explainKo || '') + '</span></div>';
        }).join('') +
        '<p class="muted">단원 핵심표현 ' + (pack.keyExpressions || []).length + '개를 빈칸으로 확인합니다.</p>' +
        '<button class="btn p big" id="dlgGo">핵심표현 확인 시작</button></div>';
    }
    var d = dlgById(id), st = dlgState(id);
    if (!d || !st) return '<p class="muted">대화문을 선택하십시오.</p>';
    var stage = Math.min(st.stage, 3);
    return '<div class="wh"><h2>' + esc(d.section) + '</h2>' +
      '<span class="tag ' + (dlgDone(st) ? 't-green' : 't-ind') + '">' + (dlgDone(st) ? '완료' : stage + '단계 · ' + DLG_STAGES[stage]) + '</span></div>' +

  function wireDialogueWork(id) {

  function contentWordOf(line) {

      return { type: 'kwblank', koFull: k.ko, parts: [
        { text: k.en.slice(0, idx) }, { blank: { answers: [surface, ansRaw] } }, { text: k.en.slice(idx + ansRaw.length) }] };

  function trainSentence(seq) {

  function rndPick(arr, n, rnd) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor((rnd || Math.random)() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }

  }

    return types;
  }
  function polyItems() {
    var out = [];
    (pack.words || []).forEach(function (w) {
      if (!w.senses || w.senses.length < 2) return;
      w.senses.forEach(function (sn, si) {
        if (!sn.example) return;
        out.push({ kind: 'word', wordId: w.id,
          prompt: sn.example.en,
          choices: w.senses.map(function (s2, i) { return { key: String(i + 1), text: s2.meaningKo }; }),
          answerKey: String(si + 1) });
      });
    });
    return WBGEN.shuffle(out, Math.random).slice(0, 10);
  }
  function synItems() {
    var W = pack.words || [], out = [];
    W.forEach(function (w) {
      [['synonyms', '유의어'], ['antonyms', '반의어']].forEach(function (pair) {
        var arr = w[pair[0]] || [];
        if (!arr.length) return;
        var correct = String(arr[0]).replace(/\s*\(.*\)$/, '');
        var pool = W.filter(function (x) { return x.id !== w.id; }).map(function (x) { return x.headword; });
        var dis = rndPick(pool, 3);
        if (dis.length < 2) return;
        var opts = WBGEN.shuffle([correct].concat(dis), Math.random);
        out.push({ kind: 'word', wordId: w.id,
          prompt: '"' + w.headword + '"의 ' + pair[1] + '로 알맞은 것은?',
          choices: opts.map(function (t, i) { return { key: String(i + 1), text: t }; }),
          answerKey: String(opts.indexOf(correct) + 1) });
      });
    });
    return WBGEN.shuffle(out, Math.random).slice(0, 10);
  }
  function luiItems(pat) {
    return (pat.letsUseIt || []).map(function (u) {
      var m = String(u.stem || '').match(/_{3,}/);
      if (!m) return null;
      var bank = (u.wordBank || []).length ? '  [보기: ' + u.wordBank.join(' · ') + ']' : '';
      return { type: 'kwblank', koFull: (u.ko || '') + bank, parts: [
        { text: u.stem.slice(0, m.index) },
        { blank: { answers: u.answers || [] } },
        { text: u.stem.slice(m.index + m[0].length) }] };
    }).filter(Boolean);
  }
  function mockItems() {
    var W = pack.words || [], S = pack.sentences || [];
    var out = [];
    rndPick(W, 5).forEach(function (w) { var q = WBGEN.vocabMcq(w, W, Math.random); if (q) { q.kind = 'word'; out.push(q); } });
    rndPick(S, 2).forEach(function (s) { var q = WBGEN.keywordBlanks(s, 'en'); if (q) out.push(q); });
    S.map(function (s) { return WBGEN.grammarChoiceDrill(s); }).filter(Boolean)
      .reduce(function (a, b) { return a.concat(b); }, []).slice(0, 3).forEach(function (q) { out.push(q); });
    var single = (pack.items || []).filter(function (it) { return (it.answerCount || 1) === 1; });
    storedToRunner(rndPick(single, 5)).forEach(function (q) { out.push(q); });
    return WBGEN.shuffle(out, Math.random);
  }
  function storedToRunner(items) {
    return items.map(function (it) {
      var stim = ((it.stimulus && it.stimulus.parts) || []).map(function (p) { return p.text; }).join(' ').trim();
      return {
        stored: it, no: it.no, type: 'storedmcq',
        prompt: (it.instructionKo || '') + (stim ? '\n' + stim : ''),
        choices: it.choices.map(function (c) { return { key: String(c.label), text: c.text || (c.tuple || []).join(' - ') }; }),
        answerKeys: it.answer.map(String), answerCount: it.answerCount || 1,
        explanation: it.explanationKo || ''

    });
  }
  function runQuizType(key) {

  /* 세션 ④ 실전 모의 — 즉시 채점 없이 수집, 종료 후 결과 리포트 */
  function expectedOf(item) {
    if (item.answerKeys && item.choices) {
      return item.choices.filter(function (c) { return item.answerKeys.indexOf(c.key) >= 0; })
        .map(function (c) { return c.key + '. ' + c.text; }).join(' / ');
    }
    if (item.answerKey && item.choices) {
      var c = item.choices.filter(function (x) { return x.key === item.answerKey; })[0];
      return c ? c.text : '';
    }
    if (item.parts) return item.parts.filter(function (p) { return p.blank; }).map(function (p) { return p.blank.answers[0]; }).join(', ');
    if (item.answers) return item.answers[0];
    if (item.answer) return item.answer.join(' ');
    return '';
  }
  function promptOf(item) {
    if (item.prompt) return String(item.prompt).split('\n')[0];

    if (item.ko) return item.ko;

  }

  }

  /* ════════ 러너 공통 ════════ */
  var RQ = null;
  function runItems(items, title) {
    runQueue(items, title, function (item, ok, ans, meta) {
      var pd = packDB(), now = Date.now();
      if (item.kind === 'sentence' || (item.seq != null && item.stage != null)) {
        var st = senState(item.seq);
        if (st) WBNAESIN.advanceStage(st, ok, now);
      } else if (item.wordId) {
        var ws = pd.states[item.wordId];
        if (!ws) return;
        if (item.type === 'spell') WBNAESIN.recordCriterion(ws, { correct: ok, confidence: meta.confidence }, now);
        else WBNAESIN.recordQuiz(ws, { correct: ok, confidence: meta.confidence, hinted: false }, now);
      }
    }, function () { persist(); render(); });
  }
  function mmss(ms) {
    var s = Math.max(0, Math.round(ms / 1000));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }
  function runQueue(items, title, onGrade, onDone, opts) {
    RQ = { items: items, i: 0, title: title, onGrade: onGrade, onDone: onDone, opts: opts || {} };
    if (RQ.opts.timeLimit) {
      RQ.deadline = Date.now() + RQ.opts.timeLimit * 1000;
      RQ.timerId = setInterval(function () {
        if (!RQ) return;
        if (Date.now() >= RQ.deadline) { $('rQuit').onclick(); return; }  /* 시간 종료 — 푼 데까지 결과 */
        countLine();
      }, 500);
    }
    $('runner').classList.add('open');
    stepRunner();
  }
  function countLine() {
    if (!RQ) return;
    $('rCount').textContent = RQ.title + ' · ' + Math.min(RQ.i + 1, RQ.items.length) + ' / ' + RQ.items.length +
      (RQ.deadline ? ' · 남은 시간 ' + mmss(RQ.deadline - Date.now()) : '');
  }
  $('rQuit').onclick = function () {
    $('runner').classList.remove('open');
    if (RQ && RQ.timerId) clearInterval(RQ.timerId);
    if (RQ && RQ.onDone) RQ.onDone();
    RQ = null;
  };
  function stepRunner() {
    if (!RQ) return;
    if (RQ.i >= RQ.items.length) { $('rQuit').onclick(); return; }
    $('rBar').style.width = Math.round(RQ.i / RQ.items.length * 100) + '%';
    countLine();
    renderItem(RQ.items[RQ.i], $('rBody'));
  }
  function finishItem(item, ok, answerKey, resultHtml) {
    /* 모의 모드 — 시험처럼 정답을 보여 주지 않고 즉시 다음 문항으로 */
    if (RQ && RQ.opts.mock) {
      if (RQ.onGrade) RQ.onGrade(item, ok, answerKey, { confidence: 'sure' });
      RQ.i += 1; stepRunner();
      return;
    }
    var box = document.createElement('div');
    box.className = 'result ' + (ok ? 'good' : 'bad');
    box.innerHTML = '<b class="mark">' + (ok ? '정답' : '오답') + '</b>' + (resultHtml || '');
    $('rBody').querySelector('.q').appendChild(box);
    var q = $('rBody').querySelector('.q');
    var needConf = !RQ.opts.noConfidence && item.wordId && item.type !== undefined;
    function next(conf) {
      if (RQ.onGrade) RQ.onGrade(item, ok, answerKey, { confidence: conf || 'sure' });
      RQ.i += 1; stepRunner();
    }
    if (needConf) {
      var cr = document.createElement('div');
      cr.className = 'confrow';
      cr.innerHTML =
        '<button data-c="sure">확실함<span class="cl">알고 답함</span></button>' +
        '<button data-c="unsure">애매함<span class="cl">확신 없음</span></button>' +
        '<button data-c="guess">추측함<span class="cl">찍어서 답함</span></button>';
      cr.onclick = function (e) { var b = e.target.closest('button'); if (b) next(b.getAttribute('data-c')); };
      q.appendChild(cr);
      var note = document.createElement('p');
      note.className = 'muted'; note.style.marginTop = '6px';
      note.textContent = '정직하게 선택할수록 복습 계획이 정확해집니다.';
      q.appendChild(note);
    } else {
      var nb = document.createElement('div');
      nb.className = 'rnext';
      nb.innerHTML = '<button class="btn p big">다음</button>';
      nb.querySelector('button').onclick = function () { next('sure'); };
      q.appendChild(nb);
      nb.querySelector('button').focus();
    }
  }
  function runCustom(title, html, wire) {
    RQ = { custom: true };
    $('runner').classList.add('open');
    $('rBar').style.width = '100%';
    $('rCount').textContent = title;
    $('rBody').innerHTML = html;
    wire();
  }
  function closeCustom() { $('runner').classList.remove('open'); RQ = null; }

  /* ── 문항 렌더 (유형별) ── */
  function renderItem(item, root) {
    var stageLabel = item.stage ? '본문 ' + Math.floor(item.stage) + '단계' : (item.kind === 'word' || item.wordId ? '단어' : '');
    var head = '<div class="q"><div class="qmeta">' + esc(stageLabel) + '</div>';

    if (item.type === 'storedmcq') return renderStored(item, root);

    if (item.choices) {
      root.innerHTML = head + '<div class="prompt">' + esc(item.prompt) + '</div><div class="choices" id="chs"></div></div>';
      var chs = $('chs');
      var list = item.choices.slice();
      if (item.unknownKey) list.push({ key: item.unknownKey, text: '모름 (진단용 — 감점 없음)' });
      list.forEach(function (c) {
        var b = document.createElement('button');
        b.textContent = c.text; b.setAttribute('data-k', c.key);
        chs.appendChild(b);
      });
      chs.onclick = function (e) {
        var b = e.target.closest('button'); if (!b || chs.getAttribute('data-done')) return;
        chs.setAttribute('data-done', '1');
        var k = b.getAttribute('data-k');
        var ok = k === item.answerKey;
        var all = chs.querySelectorAll('button');
        for (var i = 0; i < all.length; i++) {
          if (all[i].getAttribute('data-k') === item.answerKey) all[i].classList.add('right');
          else if (all[i] === b) all[i].classList.add('wrongpick');
        }
        finishItem(item, ok, k, '');
      };
      return;
    }

    if (item.type === 'spell') {
      root.innerHTML = head + '<div class="prompt sm">뜻: <b>' + esc(item.promptKo) + '</b></div>' +
        '<div class="prompt" style="letter-spacing:2px">' + esc(item.hint) + '</div>' +
        '<input class="ans" id="spellIn" autocomplete="off" autocapitalize="off" placeholder="영어 단어 입력">' +
        '<div class="rnext"><button class="btn p big" id="subBtn">확인</button></div></div>';
      bindSubmit(function () {
        var v = $('spellIn').value;
        var g = WBGRADE.gradeAnswer(v, item.answers);
        finishItem(item, g.correct, v, g.correct ? '' : ' — 정답: <b>' + esc(item.answers[0]) + '</b>');
      });
      $('spellIn').focus();
      return;
    }

    if (item.type === 'cloze') {
      root.innerHTML = head + '<div class="prompt sm">' + esc(item.textParts[0]) +
        '<input class="blankline" id="czIn" autocomplete="off" autocapitalize="off">' + esc(item.textParts[1]) + '</div>' +
        '<div class="rnext"><button class="btn p big" id="subBtn">확인</button></div></div>';
      bindSubmit(function () {
        var v = $('czIn').value;
        var g = WBGRADE.gradeAnswer(v, item.answers);
        finishItem(item, g.correct, v, g.correct ? '' : ' — 정답: <b>' + esc(item.answers[0]) + '</b>');
      });
      $('czIn').focus();
      return;
    }

    if (item.type === 'kwblank' || item.type === 'verb') {
      var html = head + (item.koFull ? '<div class="prompt sm" style="color:var(--soft)">' + esc(item.koFull) + '</div>' : '') + '<div class="prompt sm">';
      var bi = 0;
      item.parts.forEach(function (p) {
        if (p.text != null) html += esc(p.text);
        else {
          var hint = p.blank.hintKo ? '<span class="hintko">' + esc(p.blank.hintKo) + '</span>' : (p.blank.base ? '<span class="hintko">(' + esc(p.blank.base) + ')</span>' : '');
          html += '<span style="white-space:nowrap"><input class="blankline" data-b="' + bi + '" autocomplete="off" autocapitalize="off">' + hint + '</span>';
          bi += 1;
        }
      });
      html += '</div><div class="rnext"><button class="btn p big" id="subBtn">확인</button></div></div>';
      root.innerHTML = html;
      var blanks = item.parts.filter(function (p) { return p.blank; });
      bindSubmit(function () {
        var ins = root.querySelectorAll('input[data-b]');
        var inputs = [], answers = [];
        blanks.forEach(function (p, i) { inputs.push(ins[i].value); answers.push(p.blank.answers); });
        var g = WBGRADE.gradeBlanks(inputs, answers);
        for (var i = 0; i < ins.length; i++) ins[i].classList.add(g.perBlank[i].correct ? 'ok' : 'bad');
        var wrongAns = g.perBlank.filter(function (pb) { return !pb.correct; })
          .map(function (pb) { return pb.expected && pb.expected[0]; }).filter(Boolean);
        finishItem(item, g.allCorrect, null, g.allCorrect ? '' : ' — 정답: <b>' + esc(wrongAns.join(', ')) + '</b>');
      });
      var f = root.querySelector('input[data-b]'); if (f) f.focus();
      return;
    }

    if (item.type === 'order') {
      root.innerHTML = head + '<div class="prompt sm" style="color:var(--soft)" id="ordKo"></div>' +
        '<div class="built" id="built"></div><div class="tokens" id="toks"></div>' +
        '<div class="rnext"><button class="btn p big" id="subBtn">확인</button></div></div>';
      var sen = senBySeq(item.seq);
      $('ordKo').textContent = sen ? sen.ko : '어순에 맞게 배열하시오';
      var picked = [];
      function draw() {
        var b = $('built'); b.innerHTML = '';
        picked.forEach(function (t, i) {
          var x = document.createElement('button'); x.textContent = t;
          x.onclick = function () { picked.splice(i, 1); draw(); };
          b.appendChild(x);
        });
        var tk = $('toks'); tk.innerHTML = '';
        var used = picked.slice();
        item.shuffled.forEach(function (t) {
          var x = document.createElement('button'); x.textContent = t;
          var ui = used.indexOf(t);
          if (ui >= 0) { x.disabled = true; used.splice(ui, 1); }
          else x.onclick = function () { picked.push(t); draw(); };
          tk.appendChild(x);
        });
      }
      draw();
      bindSubmit(function () {
        var ok = picked.length === item.answer.length && picked.every(function (t, i) { return t === item.answer[i]; });
        finishItem(item, ok, null, ok ? '' : ' — 정답: <b>' + esc(item.answer.join(' ')) + '</b>');
      });
      return;
    }

    if (item.type === 'write' || item.type === 'skeleton') {
      var hintHtml = item.type === 'write'
        ? '<p class="muted">활용 단어: ' + esc((item.keywords || []).join(', ')) + '</p>'
        : '<p class="muted">제시어: <b>' + esc(item.hint) + '</b></p>';
      root.innerHTML = head + '<div class="prompt sm">' + esc(item.ko || '다음 문장을 영어로 쓰시오.') + '</div>' + hintHtml +
        '<textarea class="ans" id="wrIn" autocapitalize="off" placeholder="영어 문장 전체를 쓰시오"></textarea>' +
        '<div class="rnext"><button class="btn p big" id="subBtn">확인</button></div></div>';
      bindSubmit(function () {
        var v = $('wrIn').value;
        var g = WBGRADE.gradeAnswer(v, item.answers);
        var sim = WBGRADE.similarity(v, item.answers[0]);
        var ok = g.correct || sim >= 0.92;
        finishItem(item, ok, v, '<div class="exp">모범 답안: ' + esc(item.answers[0]) + (ok ? '' : ' (일치율 ' + Math.round(sim * 100) + '%)') + '</div>');
      });
      $('wrIn').focus();
      return;
    }

    root.innerHTML = head + '<div class="prompt sm">지원하지 않는 문항 유형입니다.</div>' +
      '<div class="rnext"><button class="btn big" id="subBtn">건너뛰기</button></div></div>';
    bindSubmit(function () { RQ.i += 1; stepRunner(); });
  }
  function renderStored(item, root) {
    var multi = item.answerCount > 1;
    root.innerHTML = '<div class="q"><div class="qmeta">문항 ' + item.no + (multi ? ' · 정답 ' + item.answerCount + '개 선택' : '') + '</div>' +
      '<div class="prompt sm" style="white-space:pre-line">' + esc(item.prompt) + '</div><div class="choices" id="chs"></div>' +
      (multi ? '<div class="rnext"><button class="btn p big" id="subBtn">확인</button></div>' : '') + '</div>';
    var chs = $('chs');
    item.choices.forEach(function (c) {
      var b = document.createElement('button');
      b.textContent = c.key + '. ' + c.text; b.setAttribute('data-k', c.key);
      chs.appendChild(b);
    });
    function grade(picked) {
      var ok = picked.length === item.answerKeys.length &&
        item.answerKeys.every(function (k) { return picked.indexOf(k) >= 0; });
      var all = chs.querySelectorAll('button');
      for (var i = 0; i < all.length; i++) {
        var k = all[i].getAttribute('data-k');
        if (item.answerKeys.indexOf(k) >= 0) all[i].classList.add('right');
        else if (picked.indexOf(k) >= 0) all[i].classList.add('wrongpick');
      }
      finishItem(item, ok, picked.join(','), item.explanation ? '<div class="exp">' + esc(item.explanation) + '</div>' : '');
    }
    if (multi) {
      var picked = [];
      chs.onclick = function (e) {
        var b = e.target.closest('button'); if (!b || chs.getAttribute('data-done')) return;
        var k = b.getAttribute('data-k'), i = picked.indexOf(k);
        if (i >= 0) { picked.splice(i, 1); b.classList.remove('sel'); }
        else { picked.push(k); b.classList.add('sel'); }
      };
      bindSubmit(function () { chs.setAttribute('data-done', '1'); grade(picked); });
    } else {
      chs.onclick = function (e) {
        var b = e.target.closest('button'); if (!b || chs.getAttribute('data-done')) return;
        chs.setAttribute('data-done', '1');
        grade([b.getAttribute('data-k')]);
      };
    }
  }
  function bindSubmit(fn) {
    var b = $('subBtn');
    b.onclick = function () { if (!b.getAttribute('data-done')) { b.setAttribute('data-done', '1'); fn(); } };
  }

  /* ── 렌더 루트 ── */
  function render() {
    renderHeader();
    if (!pack) { layoutFull('<p class="muted">교재를 불러오는 중…</p>'); return; }
    if (view === 'home') renderHome();
    else if (view === 'words') renderWords();
    else if (view === 'passage') renderPassage();
    else if (view === 'quiz') renderQuiz();
    else renderProgress();
  }

  /* ── 부팅: 연동 확인 → 배정된 내 학교 교재를 이어서 연다 ── */
  function loadDemo() {
    return fetch('./pack-sample.json').then(function (r) { return r.json(); });
  }
  function boot() {
    DB = loadDB() || { v: 1, packs: {}, savedAt: 0 };
    var a = auth();
    var flow;
    if (a && a.token) {
      flow = api('/exam').then(function (r) {
        authed = true;
        var ex = (r && r.exam) || {};
        examServer = ex;
        packList = (ex.packIds || []).slice();
        return Promise.all([pullState(),
          api('/task').then(function (tr) { taskServer = tr; }).catch(function () {})
        ]).then(function () {
          var pid = (DB.last && packList.indexOf(DB.last.packId) >= 0) ? DB.last.packId : packList[0];
          if (!pid) throw new Error('no-pack');
          return api('/pack?id=' + encodeURIComponent(pid)).then(function (r2) {
            pack = r2.pack;
            if (ex.examDate) {
              if (!DB.packs[pack.packId]) DB.packs[pack.packId] = { states: {}, diagDone: false, wrong: {}, dump: [], paper: {}, exam: null };
              DB.packs[pack.packId].exam = { examDate: ex.examDate, wordDeadlineDays: ex.wordDeadlineDays || 7 };
            }
          });
        });
      }).catch(function () { return loadDemo().then(function (p) { pack = p; }); });
    } else {
      flow = loadDemo().then(function (p) { pack = p; });
    }
    flow.then(function () {
      ensureStates(); persist();
      setTab('home');
    }).catch(function () {
      layoutFull('<div class="card"><p>교재를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침하십시오.</p></div>');
    });
  }
  boot();

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(function () {});
})();
</script>
</body>
