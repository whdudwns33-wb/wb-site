        return '<div class="chunkline"><b>' + esc(l.speaker) + '</b> ' + esc(l.en) + '<span class="ko">' + esc(l.ko) + '</span></div>';
      }).join('') +
      '<div class="row2" style="margin-top:10px"><button class="btn" id="dlgTts">전체 듣기</button>' +
      '<button class="btn p" id="dlgGo">' + (dlgDone(st) ? '대화 완성 다시 연습' : stage + '단계 학습 시작 — ' + DLG_STAGES[stage]) + '</button></div></div>';
  }
  function wireDialogueWork(id) {
    var go = $('dlgGo');
    if (id === '__key__') { if (go) go.onclick = runKeyExpressions; return; }
    var d = dlgById(id), st = dlgState(id);
    var tts = $('dlgTts');
    if (tts) tts.onclick = function () {
      /* speakSeq(list, opt)는 문자열 배열을 받는다(shared/voice.js) — 줄마다 영어 목소리로 차례 읽기 */
      if (window.WBVoice && WBVoice.ttsSupported()) WBVoice.speakSeq(d.lines.map(function (l) { return l.en; }), { lang: 'en' });
    };
    if (go) go.onclick = function () { trainDialogue(d, st); };
  }
  function contentWordOf(line) {
    var toks = String(line).replace(/[^A-Za-z' ]/g, ' ').split(/\s+/).filter(function (t) { return t.length >= 4; });
    toks.sort(function (a, b) { return b.length - a.length; });
    return toks[0] || null;
  }
  function dlgClozeItems(d) {
    var out = [];
    d.lines.forEach(function (l) {
      var w = contentWordOf(l.en);
      if (!w) return;
      var idx = l.en.toLowerCase().indexOf(w.toLowerCase());
      var surface = l.en.slice(idx, idx + w.length);
      out.push({ type: 'kwblank', koFull: l.ko, parts: [
        { text: l.speaker + ': ' + l.en.slice(0, idx) },
        { blank: { answers: [surface] } },
        { text: l.en.slice(idx + w.length) }] });

  }
  function trainDialogue(d, st) {
    var stage = Math.min(st.stage, 3);
    setLast('대화문 · ' + d.section, { t: 'dialogue', id: d.id });
    persist();
    if (!dlgDone(st) && stage === 1) {
      runCustom('대화문 1단계 · 대역 읽기',
        '<div class="q"><div class="qmeta">' + esc(d.section) + '</div>' +
        d.lines.map(function (l) { return '<div class="chunkline"><b>' + esc(l.speaker) + '</b> ' + esc(l.en) + '<span class="ko">' + esc(l.ko) + '</span></div>'; }).join('') +
        '<div class="rnext"><button class="btn p big" id="okBtn">읽기 완료 — 대화 완성으로</button></div></div>',
        function () { $('okBtn').onclick = function () { closeCustom(); advanceAndRefresh(st, true); }; });
      return;
    }
    if (!dlgDone(st) && stage === 3) {
      var lines = d.lines.map(function (l) { return l.speaker + ': ' + l.en; });
      var item = { type: 'order', shuffled: WBGEN.shuffle(lines, Math.random), answer: lines };
      if (item.shuffled.join('|') === lines.join('|')) item.shuffled = WBGEN.shuffle(lines, Math.random);
      var allOk = true;
      runQueue([item], '대화문 3단계 · 순서 배열', function (it, ok) { if (!ok) allOk = false; logEvent('dialogue', 'order', d.id, ok); },
        function (finished) { WBNAESIN.advanceStage(st, finished && allOk, Date.now(), { session: newSession() }); persist(); render(); }, { noConfidence: true });
      return;
    }
    /* 2단계(대화 완성) — 완료된 대화의 재연습도 이 형식. 통과 = 끝까지 풀고(✕ 중단 아님) 실패 없음 */
    var items = dlgClozeItems(d);
    if (!items.length) { advanceAndRefresh(st, true); return; }
    var all = true;
    runQueue(items, '대화문 · 대화 완성', function (it, ok) { if (!ok) all = false; logEvent('dialogue', 'kwblank', d.id, ok); },
      function (finished) { if (!dlgDone(st)) WBNAESIN.advanceStage(st, finished && all, Date.now(), { session: newSession() }); persist(); render(); }, { noConfidence: true });
  }
  function runKeyExpressions() {
    var items = (pack.keyExpressions || []).map(function (k, i) {
      var ansRaw = String(k.blankAnswer || '');
      var idx = k.en.toLowerCase().indexOf(ansRaw.toLowerCase());
      if (idx < 0) return null;
      var surface = k.en.slice(idx, idx + ansRaw.length);
      return { type: 'kwblank', ref: 'k' + (i + 1), koFull: k.ko, parts: [
        { text: k.en.slice(0, idx) }, { blank: { answers: [surface, ansRaw] } }, { text: k.en.slice(idx + ansRaw.length) }] };
    }).filter(Boolean);
    if (!items.length) { alert('핵심표현 데이터가 없습니다.'); return; }
    setLast('대화문 · 핵심표현', { t: 'dialogue', id: '__key__' });
    persist();
    /* 엔진 상태가 없는 학습 — 결과는 최근 학습 로그(pd.log)에 남긴다 */
    runQueue(items, '핵심표현 확인', function (it, ok) { logEvent('key', 'kwblank', it.ref, ok); }, function () { persist(); render(); }, { noConfidence: true });
  }
  /* 진급 세션 id — 엔진의 이중 진급 가드는 session이 없으면 '1분 안 재호출'을 중복으로 본다.
     1단계 읽기 완료 직후 2단계 해석을 1분 안에 통과하는 빠른 학생의 정당한 진급이 먹히지 않게
     앱은 학습 세트(러너 1회)마다 새 session을 넘긴다 — 같은 세트 안의 재호출만 막힌다. */
  var stageSessionNo = 0;

  /* ── 문장 사다리 지면 ── */
  function cueBarHtml(cue) {

      '<span class="tag ' + (st.reached ? 't-green' : 't-ind') + '">' + (st.reached ? '암기 완료' : stage + '단계 · ' + STAGE_NAMES[stage]) + '</span>' +

      (!st.reached && FADED_STAGES[stage] && ckg.open ? cueBarHtml(cue) : '') +

      '<p class="muted" style="font-size:13.5px;margin:0 0 10px">' + esc(s.ko) + '</p>' +
      (stage <= 2 || st.reached ? chunks + notes : '<p class="muted">청크·구문 해설은 2단계(영어 청크 배열)까지 표시됩니다.</p>') +

      (!ckg.open

        : (wordLocked
          ? '<div class="notice">단어 선행 기준(' + g.done + '/' + g.total + ' 도달) 충족 전에는 5·6단계가 잠깁니다. 단어 암기를 먼저 완성하십시오.</div>'
          : '<button class="btn p big" id="stageGo">' + (st.reached ? '단락 백지 시험 다시 보기' : stage + '단계 학습 시작 — ' + STAGE_NAMES[stage]) + '</button>')) +
      genNoteHtml();
  }
  function wireSentenceWork(seq, g) {
    var s = senBySeq(seq), st = senState(seq);
    if (!s || !st) return;
    var tts = $('ttsBtn');
    if (tts) tts.onclick = function () { if (window.WBVoice && WBVoice.ttsSupported()) WBVoice.speak(s.en, { lang: 'en' }); };
    var go = $('stageGo');
    if (go) go.onclick = function () { trainSentence(seq); };
  }
  /* 사다리 한 세트 — 문장당 1회만 진급시킨다(4단계는 문항이 둘).
     단서 단계는 한 세션 안에서 두 라운드를 돈다: 통과하면 곧바로 같은 문장을 한 단계 낮은
     단서로 한 번 더 낸다. 이걸 다음 날로 미루면 문장당 러너 횟수가 6회에서 9회로 불어난다.
     틀리면 거기서 세션이 끝난다 — 다음에는 더 높은 단서(더 많은 힌트)로 다시 만난다. */
  var CUE_ROUNDS = 2;
  function runLadder(items, title, st, stage, seq, round, faded) {
    var pid = curPackId(), allOk = true, session = newSession();

    }, function (finished) {
      var before = { stage: stageNum(st), cue: cueOf(st) };

  }
  function trainSentence(seq) { return trainStageRound(seq, 1); }
  function trainStageRound(seq, round) {
    var s = senBySeq(seq), st = senState(seq);
    if (!s || !st) return;
    if (!ckGate(s.dayGroup).open) return;            // 청크 미통과 단락은 1단계도 시작할 수 없다
    var stage = st.reached ? 6 : stageNum(st);

    if (stage >= 5 && !g.open && !st.reached) return;

      alert('이 문장은 ' + stage + '단계(' + STAGE_NAMES[stage] + ') 문항을 만들 데이터가 없습니다.\n다음 단계로 넘깁니다.');

  /* ── 백지 실패 원인 라우팅(§3.7) ── */
  var CAUSE_STAGE = { missing: 1, order: 2, form: 4, lexical: 3 };
  var CAUSE_LABEL = { missing: '통째로 빠뜨림', order: '어순', form: '동사 형태', lexical: '낱말' };
  function tokBag(text) {
    var bag = {};
    WBGRADE.normalizeEn(text).split(' ').forEach(function (t) { if (t) bag[t] = (bag[t] || 0) + 1; });
    return bag;
  }
  function bagDiff(a, b) {
    var out = [], k;
    for (k in a) if (Object.prototype.hasOwnProperty.call(a, k)) { var n = (a[k] || 0) - (b[k] || 0); if (n > 0) out.push(k); }
    return out;
  }
  /* 채점기에 blankCause 가 있으면 그것이 정본, 없으면 같은 네 분류를 앱이 근사한다 */
  function causeOf(ps, s) {
    if (WBGRADE.blankCause) {
      try { var c = WBGRADE.blankCause(ps, s); if (c === 'ok' || (typeof c === 'string' && CAUSE_STAGE[c] != null)) return c; } catch (e) {}
    }
    if (!ps || ps.status === 'ok') return 'ok';
    if (ps.status === 'missing' || !ps.input) return 'missing';
    var A = tokBag(s.en), B = tokBag(ps.input);
    var lost = bagDiff(A, B), gained = bagDiff(B, A);
    if (!lost.length && !gained.length) return 'order';                   // 같은 토큰, 순서만 다름
    var vf = {};
    (s.verbForms || []).forEach(function (v) {
      if (v && v.answer) vf[WBGRADE.normalizeEn(v.answer)] = 1;
      if (v && v.base) vf[WBGRADE.normalizeEn(v.base)] = 1;
    });
    var onlyForm = lost.length > 0 && lost.every(function (t) { return vf[t]; }) && gained.every(function (t) { return vf[t] || !!vfLike(t, vf); });
    if (onlyForm) return 'form';
    return 'lexical';
  }
  /* 동사 형태 변형 근사 — 정본 동사와 앞 3글자를 공유하면 같은 동사의 다른 형태로 본다 */
  function vfLike(tok, vf) {
    var k;
    for (k in vf) if (Object.prototype.hasOwnProperty.call(vf, k)) {
      if (k.length >= 3 && tok.length >= 3 && k.slice(0, 3) === tok.slice(0, 3)) return true;
    }
    return false;
  }
  function routeBlank(ps, s, st, now, pd) {
    var cause = causeOf(ps, s);
    if (cause === 'ok') return null;
    pd.senMiss[s.seq] = n0(pd.senMiss[s.seq]) + 1;
    if (st.reached && cause !== 'missing') return { cause: cause, target: null };
    /* 이미 백지를 통과한 문장은 통째로 빠뜨렸을 때만 되돌린다 — 낱말 하나 차이로 '암기 완료'가
       사라지면 사다리가 신뢰를 잃는다. 통째로 못 쓴 것은 실제로 잊은 것이다. */
    if (st.reached) { st.reached = false; st.reachedAt = null; st.relearnCount = 0; }
    /* 원인 → 단계 표는 채점기(grade.js)에 있다 — 앱과 채점기가 같은 표를 본다 */
    var target = (WBGRADE.blankCauseStage ? WBGRADE.blankCauseStage(cause) : null) || CAUSE_STAGE[cause] || 3;
    st.stage = Math.min(stageNum(st), target);
    if (cause === 'missing') st.cue = Math.min(3, cueOf(st) + 1);

  }
  function diffLineHtml(ps, s) {
    var body;

      if (t.type === 'missing') return '<span class="d-missing">' + esc(t.text) + '</span>';
      if (t.type === 'extra') return '<span class="d-extra">' + esc(t.text) + '</span>';

    return '<div class="diffline ' + ps.status + '"><span class="lbl">' + ps.seq + '</span>' + body + '</div>';
  }
  function startBlank(group) {
    if (!group) return;
    var targets = group.sentences, pid = curPackId();
    setLast('본문 ' + group.header + ' · 백지 시험', { t: 'blank', day: group.day });
    persist();
    runCustom('백지 시험 · ' + group.header,
      '<div class="q"><div class="qmeta">' + esc(group.header) + ' — ' + targets.length + '문장을 순서대로, 아무것도 보지 않고 쓰시오</div>' +
      '<textarea class="ans" id="bkIn" style="min-height:170px"' + INATTR + ' placeholder="기억나는 대로 영어로 작성 (줄바꿈으로 문장 구분 가능)"></textarea>' +

      '<div id="bkOut"></div></div>',
      function () {
        $('okBtn').onclick = function () {
          var v = $('bkIn').value;
          var canonical = targets.map(function (s) { return { seq: s.seq, en: s.en }; });
          var d = WBGRADE.diffPassage(v, canonical);
          var html = '<div class="result ' + (d.missingCount === 0 && d.partialCount === 0 ? 'good' : 'bad') + '">' +
            '정확 ' + d.okCount + ' · 부분 ' + d.partialCount + ' · 누락 ' + d.missingCount +
            (d.orderOk ? '' : ' · 순서 불일치') + '</div>';
          d.perSentence.forEach(function (ps) { html += diffLineHtml(ps, senBySeq(ps.seq)); });
          html += '<div class="rnext"><button class="btn p big" id="bkDone">기록하고 닫기</button></div>';
          $('bkOut').innerHTML = html;
          $('bkDone').onclick = function () {
            var now = Date.now(), pd = packDB(), routes = [];

              if (r) routes.push({ seq: ps.seq, cause: r.cause, target: r.target });
            });

            var pg = pgState(group.day);
            if (pg) trackAdvance(pg, paraBlankDone(group), PG_MAX, now);

            logEvent('blank', 'blank', group.day, d.missingCount === 0 && d.partialCount === 0, pid);
            touchPack(pid); persist();
            if (routes.length) { closeCustom(); showRoutes(routes); return; }
            closeCustom(); render();
          };
        };
      });
  }
  /* 되돌림 안내 — "이 문장은 ○단계부터 다시" 를 원인과 함께 한 줄씩 */
  function showRoutes(routes) {
    runCustom('백지 결과 · 되돌아갈 자리',
      '<div class="q"><div class="qmeta">틀린 문장은 원인에 맞는 단계로 되돌립니다 — 처음부터 다시가 아닙니다</div>' +
      routes.map(function (r) {
        var s = senBySeq(r.seq);
        return '<div class="chunkline">' + '<b>문장 ' + r.seq + '</b> · ' + esc(CAUSE_LABEL[r.cause] || r.cause) +
          '<span class="ko">' + (r.target ? '→ ' + r.target + '단계(' + STAGE_NAMES[r.target] + ')부터 다시' : '→ 암기 완료는 유지 · 다음 백지에서 확인') +
          ' — ' + esc(s ? s.en : '') + '</span></div>';
      }).join('') +
      '<div class="rnext"><button class="btn p big" id="rtDone">확인</button></div></div>',
      function () { $('rtDone').onclick = function () { closeCustom(); render(); }; });
  }
  /* ── 누적 백지 — 1일차 → 1+2일차 → … → 전체 ── */
  function startCumulative(i) {
    var steps = cumSteps(), cs = steps[i];

    cs.days.forEach(function (d) { var gr = groupOfDay(d); if (gr) targets = targets.concat(gr.sentences); });
    if (!targets.length) return;
    setLast('누적 백지 · ' + cs.days.join('+'), { t: 'cumulative', i: i });
    persist();
    runCustom('누적 백지 · ' + cs.days.join(' + '),
      '<div class="q"><div class="qmeta">' + esc(cs.days.join(' + ')) + ' — ' + targets.length + '문장을 순서대로, 아무것도 보지 않고 쓰시오</div>' +
      '<textarea class="ans" id="cmIn" style="min-height:200px"' + INATTR + ' placeholder="기억나는 대로 영어로 작성"></textarea>' +

      function () {

  /* ── 종합 Check — 모든 단락을 마친 뒤의 최종 점검 ── */
  function runCheck() {

  /* ════════ 문제 풀이 (스플릿 · 유형별) ════════ */
  function rndPick(arr, n, rnd) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor((rnd || Math.random)() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }

    types.push({ key: 'w-cloze', group: '단어 시험', name: '예문 빈칸', desc: '예문 속 단어 채우기',

    types.push({ key: 's-gram', group: '본문 변형', name: '어법 선택', desc: '본문 문장의 어법 2지선다',
      make: function () { return S.map(function (s) { return WBGEN.grammarChoiceDrill(s); }).filter(Boolean).reduce(function (a, b) { return a.concat(b); }, []).slice(0, 12); } });
    types.push({ key: 's-verb', group: '본문 변형', name: '동사 형태', desc: '괄호 동사를 알맞은 형태로',
      make: function () { return rndPick(S.filter(function (s) { return (s.verbForms || []).length; }), 8).map(function (s) { return WBGEN.verbFormDrill(s); }).filter(Boolean); } });
    types.push({ key: 's-order', group: '본문 변형', name: '어순 배열', desc: '우리말에 맞게 어구 배열',
      make: function () { return rndPick(S, 8).map(function (s) { return WBGEN.tokenOrder(s, Math.random); }).filter(Boolean); } });
    types.push({ key: 's-kw', group: '본문 변형', name: '핵심어 빈칸', desc: '우리말 힌트로 핵심어 채우기',
      make: function () { return rndPick(S, 8).map(function (s) { return WBGEN.keywordBlanks(s, 'en'); }).filter(Boolean); } });
    /* 세션 ③ 어휘 심화 — 다의어·유의반의는 학교 시험의 변별 유형 */
    if (W.some(function (w) { return w.senses && w.senses.length >= 2; }))

        make: polyItems });

    var items = pack.items || [];

    if (single.length) types.push({ key: 'i-mcq', group: '문법·실전', name: '객관식 (단일 정답)', desc: single.length + '문항 · 해설 포함',

  /* 단어 하나의 다의어 문항들 — 오답 재시험(gen:w-poly:<id>)도 이걸로 다시 만든다 */
  function polyItemsFor(w) {
    var out = [];
    if (!w.senses || w.senses.length < 2) return out;
    w.senses.forEach(function (sn, si) {

  }
  function synItemsFor(w, W) {
    var out = [];
    [['synonyms', '유의어'], ['antonyms', '반의어']].forEach(function (pair) {
      var arr = w[pair[0]] || [];
      if (!arr.length) return;
      var correct = String(arr[0]).replace(/\s*\(.*\)$/, '');
      var pool = W.filter(function (x) { return x.id !== w.id; }).map(function (x) { return x.headword; });
      var dis = rndPick(pool, 3);
      if (dis.length < 2) return;
      var opts = WBGEN.shuffle([correct].concat(dis), Math.random);
      out.push({ type: 'mcq', typeKey: 'w-syn', kind: 'word', wordId: w.id,
        prompt: '"' + w.headword + '"의 ' + pair[1] + '로 알맞은 것은?',

  function synItems() {
    var W = pack.words || [], out = [];

  function luiItems(pat) {
    return (pat.letsUseIt || []).map(function (u) {

      if (!m) return null;
      var bank = (u.wordBank || []).length ? '  [보기: ' + u.wordBank.join(' · ') + ']' : '';

  /* 실전 모의 문항 — 시험 범위 전체에서 뽑는다. 게이트가 범위 전체 단어를 요구하는데 문항은

     문항마다 packId 를 실어 채점·오답노트가 그 과로 간다. */
  function mockItems() {
    var wordRefs = [], senRefs = [], storedRefs = [];
    rangeIds().forEach(function (pid) {
      var p = packOf(pid);
      if (!p) return;
      (p.words || []).forEach(function (w) { wordRefs.push({ pid: pid, w: w, W: p.words }); });
      (p.sentences || []).forEach(function (sn) { senRefs.push({ pid: pid, s: sn }); });
      (p.items || []).filter(function (it) { return (it.answerCount || 1) === 1; })
        .forEach(function (it) { storedRefs.push({ pid: pid, it: it }); });
    });
    var out = [];
    var take = function (q, pid) { if (q) { q.packId = pid; out.push(q); } };
    rndPick(wordRefs, 5).forEach(function (r) { var q = WBGEN.vocabMcq(r.w, r.W, Math.random); if (q) { q.kind = 'word'; take(q, r.pid); } });
    rndPick(senRefs, 2).forEach(function (r) { take(WBGEN.keywordBlanks(r.s, 'en'), r.pid); });

    rndPick(storedRefs, 5).forEach(function (r) { storedToRunner([r.it]).forEach(function (q) { take(q, r.pid); }); });

  }
  function storedToRunner(items) {
    return items.map(function (it) {
      var stim = ((it.stimulus && it.stimulus.parts) || []).map(function (p) { return p.text; }).join(' ').trim();
      return {
        stored: it, no: it.no, type: 'storedmcq',
        prompt: (it.instructionKo || '') + (stim ? '\n' + stim : ''),
        choices: it.choices.map(function (c) { return { key: String(c.label), text: c.text || (c.tuple || []).join(' - ') }; }),
        answerKeys: it.answer.map(String), answerCount: it.answerCount || 1,
        explanation: it.explanationKo || ''

  }
  function runQuizType(key) {
    var tdef = quizTypes().filter(function (t) { return t.key === key; })[0];

    if (!items.length) { alert('이 유형은 현재 교재에서 출제할 문항이 없습니다.'); return; }
    /* 오답 노트 키(gen:<유형>:<ref>)에 쓸 유형을 문항에 붙인다 — 같은 mcq라도 영→뜻과 뜻→영은 다른 문제다 */
    if (GEN_KEYS.indexOf(key) >= 0) items.forEach(function (q) { if (!q.typeKey) q.typeKey = key; });
    setLast('문제 풀이 · ' + tdef.name, { t: 'quizType', key: key });

  /* 오답 재시험 문항 — 저장 문항(i-*)은 그대로, 생성형(gen:*)은 유형별 생성기로 다시 만든다.
     생성이 안 되는 것(단어·문장이 팩에서 사라짐 등)은 건너뛴다. */
  var REGEN = {
    'w-e2k': function (w, s, W) { return tagWord(WBGEN.vocabMcq(w, W, Math.random)); },
    'w-k2e': function (w, s, W) { return tagWord(WBGEN.vocabMcqReverse(w, W, Math.random)); },
    'w-spell': function (w) { return tagWord(WBGEN.spelling(w)); },
    'w-cloze': function (w) { return tagWord(WBGEN.exampleCloze(w)); },
    'w-def': function (w, s, W) { return tagWord(WBGEN.definitionPick(w, W, Math.random)); },
    's-gram': function (w, s) { return WBGEN.grammarChoiceDrill(s); },
    's-verb': function (w, s) { return WBGEN.verbFormDrill(s); },

  function regenWrong(e) {

    if (e.type.charAt(0) === 'w' ? !w : !s) return [];
    var q = gen(w, s, pack.words || []);

  }
  function wrongRetryItems(keys) {
    var pd = packDB(), out = [];
    var stored = (pack.items || []).filter(function (it) { return keys.indexOf('i-' + it.no) >= 0; });
    storedToRunner(stored).forEach(function (q) { out.push(q); });
    keys.forEach(function (k) {
      var e = pd.wrong[k];
      if (e && e.kind === 'gen') regenWrong(e).forEach(function (q) { out.push(q); });

  }
  function renderQuiz() {

        '<div class="card"><p class="muted">틀린 문항은 같은 날 다시 맞혀도 해결되지 않습니다 — <b>서로 다른 날 2회 정답</b>이어야 해결 처리됩니다. 다시 틀리면 처음부터 셉니다. 해결된 문항 ' +
        Object.keys(pd.wrong).filter(function (k) { return pd.wrong[k].cleared; }).length + '개' +
        (genN ? ' · 단어·본문 생성 문항 ' + genN + '개는 같은 단어·문장으로 새로 출제됩니다' : '') + '.</p>' +
        '<button class="btn p big" id="qGo"' + (wrongs.length ? '' : ' disabled') + '>재시험 시작</button></div>';
    } else if (selType.charAt(0) === 'g' && selType.charAt(1) === '-') {
      var pat = (pack.patterns || []).filter(function (p) { return 'g-' + p.patternNo === selType; })[0];
      if (!pat) { selType = types[0].key; return renderQuiz(); }
      workHtml = '<div class="wh"><h2>패턴 ' + pat.patternNo + ' · ' + esc(pat.title) + '</h2><span class="tag t-ind">문법 개념</span></div>' +
        '<div class="card"><p style="font-size:14px;line-height:1.8;margin:0 0 10px">' + esc(pat.conceptKo || '') + '</p>' +
        ((pat.grammarPoint || []).length ? '<div style="border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:0 0 10px">' +
          pat.grammarPoint.map(function (row) {
            return '<div style="display:flex;border-bottom:1px solid var(--line)"><div style="flex:0 0 90px;background:var(--bg);padding:6px 10px;font-weight:700;font-size:12.5px">' + esc(row[0] || '') + '</div>' +
              '<div style="flex:1;padding:6px 10px;font-size:13px">' + esc(row.slice(1).join(' ')) + '</div></div>';
          }).join('') + '</div>' : '') +
        (pat.textbookExamples || []).map(function (ex2) {
          return '<div class="chunkline">' + esc(ex2.en) + '<span class="ko">' + esc(ex2.ko) + (ex2.origin ? ' — ' + esc(ex2.origin) : '') + '</span></div>';
        }).join('') +
        '<button class="btn p big" id="qGo" style="margin-top:10px"' + ((pat.letsUseIt || []).length ? '' : ' disabled') + '>확인 문제 (' + (pat.letsUseIt || []).length + '문항)</button></div>';
    } else {
      var tdef = types.filter(function (t) { return t.key === selType; })[0] || types[0];
      /* 실전 모의는 시험 범위 전체가 기준이다(§4.4) — 본문 사다리 5·6단계는 그 과의 단어지만,
         실전은 시험 그 자체를 흉내 내므로 범위 단어가 다 완성되기 전에는 열지 않는다. */
      var mg = tdef.key === 'mock' ? rangeGate() : null;
      workHtml = '<div class="wh"><h2>' + esc(tdef.name) + '</h2><span class="tag t-ind">' + esc(tdef.group) + '</span></div>' +
        '<div class="card"><p class="muted">' + esc(tdef.desc) +
        (tdef.key === 'mock' ? ' · 시험처럼 정답을 바로 보여 주지 않고, 종료 후 점수와 오답을 한꺼번에 확인합니다.' : ' · 문항 단위 즉시 채점되며, 오답은 정답·해설과 함께 오답노트에 기록됩니다.') + '</p>' +
        (mg && !mg.open
          ? '<div class="notice">시험 범위 단어 선행 기준(' + mg.done + '/' + mg.total + ' 도달) 충족 전에는 실전 모의가 잠깁니다. 단어 암기를 먼저 완성하십시오.</div>'
          : '') +
        '<button class="btn p big" id="qGo"' + (mg && !mg.open ? ' disabled' : '') + '>시작</button></div>';
    }
    layoutSplit(listHtml, workHtml);
    $('qRows').onclick = function (e) {
      var r = e.target.closest('.row[data-qt]');
      if (r) { selType = r.getAttribute('data-qt'); render(); }
    };
    $('qGo').onclick = function () {
      if (selType === 'wrong') {
        var items = wrongRetryItems(wrongs);
        if (!items.length) { alert('재시험으로 출제할 수 있는 문항이 없습니다.'); return; }
        setLast('문제 풀이 · 오답 재시험', { t: 'quizType', key: 'wrong' });
        persist();
        runItems(items, '오답 재시험');
      } else if (selType.charAt(0) === 'g' && selType.charAt(1) === '-') {
        var pat = (pack.patterns || []).filter(function (p) { return 'g-' + p.patternNo === selType; })[0];
        var items2 = pat ? luiItems(pat) : [];
        if (!items2.length) { alert('확인 문제가 없습니다.'); return; }
        setLast('문법 개념 · 패턴 ' + pat.patternNo, { t: 'quizType', key: selType });
        persist();
        /* 개념 확인 결과도 최근 학습 로그에 남긴다 — "기록된다"는 안내와 실제가 같아야 한다 */
        runQueue(items2, '개념 확인 · 패턴 ' + pat.patternNo, function (it, ok) { logEvent('concept', 'kwblank', it.ref, ok); },
          function () { persist(); render(); }, { noConfidence: true });
      } else if (selType === 'mock') {
        if (!rangeGate().open) return;

  }

  /* 범위 전체 단어 게이트 — 엔진에 gateRange 가 없는 판이면 현재 과 게이트로 물러난다 */
  function rangeGate() {
    if (WBNAESIN.gateRange) return WBNAESIN.gateRange(rangeEntries(), exam(), Date.now(), {});
    return WBNAESIN.gate(wordStates(), exam(), Date.now(), {});
  }

  /* 세션 ④ 실전 모의 — 즉시 채점 없이 수집, 종료 후 결과 리포트 */
  function expectedOf(item) {
    if (item.answerKeys && item.choices) {
      return item.choices.filter(function (c) { return item.answerKeys.indexOf(c.key) >= 0; })
        .map(function (c) { return c.key + '. ' + c.text; }).join(' / ');
    }
    if (item.answerKey && item.choices) {
      var c = item.choices.filter(function (x) { return x.key === item.answerKey; })[0];
      return c ? c.text : '';
    }
    if (item.parts) return item.parts.filter(function (p) { return p.blank; }).map(function (p) { return p.blank.answers[0]; }).join(', ');
    if (item.answers) return item.answers[0];
    if (item.answer) return item.answer.join(' ');
    return '';
  }
  function promptOf(item) {
    if (item.prompt) return String(item.prompt).split('\n')[0];
    if (item.parts) return item.parts.map(function (p) { return p.text != null ? p.text : '____'; }).join('');
    if (item.ko) return item.ko;
    return '(문항)';
  }
  function runMock() {
    var items = mockItems();
    if (items.length < 5) { alert('모의 시험을 구성할 문항이 부족합니다.'); return; }
    setLast('실전 모의', { t: 'quizType', key: 'mock' });
    persist();
    var results = [];
    runQueue(items, '실전 모의', function (item, ok) {
      results.push({ item: item, ok: ok });
      applyMockGrade(item, ok);
    }, function (finished) {
      persist();
      if (!finished) { render(); return; }   // ✕ 중단 — 리포트 없음(시간 종료는 finished)
      var correct = results.filter(function (r) { return r.ok; }).length;
      var wrong = results.filter(function (r) { return !r.ok; });
      var html = '<div class="q"><div class="qmeta">실전 모의 결과</div>' +
        '<div class="prompt num" style="font-size:2rem">' + correct + ' / ' + results.length + '</div>' +
        (results.length < items.length ? '<p class="muted">시간 초과 — ' + (items.length - results.length) + '문항은 풀지 못했습니다.</p>' : '') +
        (wrong.length ? wrong.map(function (r) {
          return '<div class="diffline missing"><span class="lbl">오답</span>' + esc(promptOf(r.item).slice(0, 80)) +
            '<span style="display:block;font-size:12px;color:var(--soft)">정답: ' + esc(expectedOf(r.item)) + '</span></div>';
        }).join('') : '<p class="muted">전 문항 정답입니다.</p>') +
        '<div class="rnext"><button class="btn p big" id="mkDone">닫기</button></div></div>';
      runCustom('실전 모의 · 결과', html, function () { $('mkDone').onclick = function () { closeCustom(); render(); }; });
    }, { noConfidence: true, mock: true, timeLimit: 600 });
  }
  /* 확신도를 묻지 않는 경로(모의·과제) — 'unsure'로 기록한다. 'sure'로 넣으면 모의에서 한 번
     틀린 단어가 과신 오류(2계단 후퇴·위험 단어)로 잡힌다. */
  function applyMockGrade(item, ok) {
    gradeItem(item, ok, { confidence: 'unsure' }, Date.now(), null);
  }
  /* 오답 노트 공통 — 틀리면 클리어 날짜를 비운다(다시 틀리면 처음부터, 계약 0.6).
     항목엔 엔진 상태 객체를 두지 않는다 — clearWrong은 wrongClearDates 배열만 본다. */
  function markWrong(k, seed, ok, now, pid) {
    var pd = packDB(pid), e = pd.wrong[k];
    if (!ok) {
      if (!e) { e = pd.wrong[k] = seed; e.tries = 0; e.wrongClearDates = []; e.cleared = false; e.firstAt = new Date(now).toISOString(); }
      e.tries += 1; e.wrongClearDates = []; e.cleared = false; e.at = new Date(now).toISOString();
    } else if (e && !e.cleared) {
      var r = WBNAESIN.clearWrong(e, now);
      if (r && r.cleared) e.cleared = true;
    }
  }
  function recordStoredResult(q, ok, now, pid) {
    markWrong('i-' + q.no, { kind: 'item', no: q.no }, ok, now, pid);
  }
  /* 생성형 문항의 오답 노트 키 유형 — 재시험 생성기가 있는 유형만(REGEN). 유형 태그가 없으면 문항 모양에서 유추. */
  var GEN_KEYS = ['w-e2k', 'w-k2e', 'w-spell', 'w-cloze', 'w-def', 's-gram', 's-verb', 's-order', 's-kw', 'w-poly', 'w-syn'];
  function genTypeKeyOf(item, pid) {
    if (item.typeKey) return GEN_KEYS.indexOf(item.typeKey) >= 0 ? item.typeKey : null;
    switch (item.type) {
      case 'mcq': if (!item.wordId) return null; var w = wordById(item.wordId, pid); return (w && item.prompt === w.headword) ? 'w-e2k' : 'w-k2e';
      case 'cloze': return item.wordId ? 'w-cloze' : null;
      case 'defpick': return item.wordId ? 'w-def' : null;
      case 'spell': return item.wordId ? 'w-spell' : null;
      case 'grammar': return item.seq != null ? 's-gram' : null;
      case 'verb': return item.seq != null ? 's-verb' : null;
      case 'order': return item.seq != null ? 's-order' : null;
      case 'kwblank': return item.seq != null ? 's-kw' : null;
    }
    return null;
  }
  function recordGenResult(item, ok, now, pid) {
    var type = genTypeKeyOf(item, pid);
    if (!type) return;
    var ref = item.wordId ? String(item.wordId) : (item.seq != null ? 's' + item.seq : null);
    if (!ref) return;
    markWrong('gen:' + type + ':' + ref, { kind: 'gen', type: type, ref: ref }, ok, now, pid);
  }

  /* ════════ 성취도 (전체 폭) ════════ */
  var paperMode = false;

        : '시험일 <b>' + esc(ex.examDate) + '</b> — 시험 모드로 학습량이 자동 편성됩니다.';

    var html =

      '<div><div class="n">' + ssum.interpreted + '<small>/' + ssum.total + '</small></div><div class="l">본문 해석 통과' + curNote + '</div></div>' +

      passageBoardHtml() +

      pack.sentences.map(function (s) {

        return '<div class="row" role="button" tabindex="0" data-go="' + s.seq + '"><span class="no">' + s.seq + '</span>' +
          '<span class="tx">' + esc(s.en) + '</span><span class="lvchip ' + (ok ? 's' : '') + '">' + (ok ? '통과' : '미완') + '</span></div>';
      }).join('') + '</div></div>' +

      '<div class="card"><h2>본문 암기 현황 <small>백지 영작</small>' +
      '<button class="tag tb ' + (paperMode ? 't-red' : 't-gray') + '" id="paperToggle" style="margin-left:auto">' + (paperMode ? '입력 종료' : '종이 백지시험 결과 입력') + '</button></h2><div>' +
      pack.sentences.map(function (s) {

          ? '<button class="paperbtn ' + (paper === true ? 'y' : paper === false ? 'n' : '') + '" data-paper="' + s.seq + '" aria-label="문장 ' + s.seq + ' 종이 시험 결과: ' + (paper === true ? '정답' : paper === false ? '오답' : '미입력') + '">' + (paper === true ? '○' : paper === false ? '×' : '—') + '</button>'
          : '<span class="lvchip ' + (done ? 's' : '') + '">' + (done ? '완료' : stage + '단계') + '</span>';
        return '<div class="row" style="cursor:default"><span class="no">' + s.seq + '</span>' +

      }).join('') + '</div>' +
      (paperMode ? '<p class="muted" style="margin-top:8px">선생님과 함께 종이 백지시험 결과를 문장별 ○/×로 입력합니다. ○는 암기 완료 기록에 반영됩니다.</p>' : '') + '</div>' +

      predictionHtml() +

      '<div class="card"><h2>시험 설정</h2>' +
      '<p class="muted">' + examMsg + '</p>' +
      '<div class="row2" style="max-width:520px"><input class="ans" type="date" id="examIn" value="' + esc((raw && raw.examDate) || '') + '">' +
      '<button class="btn" id="examSet">적용</button><button class="btn" id="examClear"' + (ex ? '' : ' disabled') + '>자율 학습으로</button></div>' +
      '<p class="muted" style="margin-top:8px">' + (authed ? '학습 기록이 서버에 저장되어 선생님 화면과 연동됩니다.' : '이 기기에만 저장 중입니다 (체험 모드).') + '</p></div>';
    layoutFull(html);
    $('workPane').addEventListener('click', function (e) {
      var pb = e.target.closest('button[data-paper]');
      if (pb) {
        var seq = Number(pb.getAttribute('data-paper'));

        var next = cur === true ? false : cur === false ? null : true;
        if (next === null) delete pd.paper[seq]; else pd.paper[seq] = next;
        if (next === true) {

          if (st) { if (st.stage < 6) st.stage = 6; WBNAESIN.advanceStage(st, true, Date.now()); }
        }
        persist(); render();
        return;
      }
      var go = e.target.closest('[data-go]');
      if (go) { selSeq = Number(go.getAttribute('data-go')); selPass = null; selDlg = null; setTab('passage'); }
    });
    $('paperToggle').onclick = function () { paperMode = !paperMode; render(); };
    /* 시험은 범위 전체에 하나다 — 시험일도 「자율 학습으로」도 범위의 모든 과에 같이 건다.
       한 과만 바꾸면 같은 화면의 D-day 와 과별 플랜 모드가 서로 다른 말을 하게 된다. */

        delete q.examOverride; delete q.examOverrideFor;

       서버 시험일이 바뀌면(applyServerExam) 오버라이드는 자동으로 풀린다. */

      rangeIds().forEach(function (id) {

  /* 본문 진행 — 청크(뜻 세우기) · 단락 백지 · 누적 · 종합 Check 한 줄 요약(§4-A-9) */
  function passageBoardHtml() {

    if (!ps) return '';
    var steps = cumSteps(), cum = cumReachedCount();

      '<div><div class="n">' + ps.paraBlank + '<small style="font-size:13px;color:var(--soft)">/' + ps.paraTotal + '</small></div><div class="l">단락 백지 통과</div></div>' +
      '<div><div class="n">' + cum + '<small style="font-size:13px;color:var(--soft)">/' + steps.length + '</small></div><div class="l">누적 백지 도달 단락</div></div>' +
      '<div><div class="n">' + (ps.check ? ps.check.correct + '<small style="font-size:13px;color:var(--soft)">/' + ps.check.total + '</small>' : '—') + '</div><div class="l">종합 Check</div></div>' +
      '</div></div>';
  }
  /* 자주 빠뜨리는 문장 Top 5 — 백지·누적에서 놓친 횟수(pd.senMiss). 다음 학습의 우선 대상이다. */
  function missTopHtml() {
    var pd = packDB(), rows = [];
    Object.keys(pd.senMiss || {}).forEach(function (k) {
      var n = n0(pd.senMiss[k]);
      if (n > 0) rows.push({ seq: Number(k), n: n });
    });
    if (!rows.length) return '';
    rows.sort(function (a, b) { return b.n - a.n || a.seq - b.seq; });
    return '<div class="card"><h2>자주 빠뜨리는 문장 <small>백지에서 놓친 횟수 상위 5</small></h2>' +
      rows.slice(0, 5).map(function (r) {
        var sen = senBySeq(r.seq), st = senState(r.seq);
        var stage = st && st.reached ? '암기 완료' : (st ? stageNum(st) + '단계' : '1단계');
        return '<div class="misstop"><span class="mn">' + r.n + '회</span>' +
          '<span class="tx" style="flex:1;min-width:0">' + esc(sen ? sen.en : ('문장 ' + r.seq)) + '</span>' +
          '<button class="btn" data-go="' + r.seq + '" style="min-height:44px">' + stage + ' →</button></div>';
      }).join('') + '</div>';
  }
  /* 예상 점수대(계약 R2 prediction) — 원내 시험 결과가 충분히 쌓였을 때만 서버가 준다.
     확정·과장 어조를 쓰지 않는다: 도달률과 점수의 관계에서 나온 참고 구간일 뿐이다. */
  function predictionHtml() {
    var pr = resultServer && resultServer.prediction;
    if (!pr || typeof pr !== 'object') return '';
    var lo = Number(pr.low), hi = Number(pr.high);
    if (!isFinite(lo) || !isFinite(hi)) return '';
    return '<div class="card"><h2>예상 점수대 <small>참고용</small></h2>' +
      '<p style="font-size:15px;margin:0 0 4px">현재 도달률 기준 예상 점수대 <b class="num">' + Math.round(lo) + '~' + Math.round(hi) + '점</b></p>' +
      '<p class="muted" style="margin:0">원내 ' + n0(pr.n) + '회 시험 데이터로 계산한 참고값입니다. 실제 점수는 시험 범위·난이도·문항 구성에 따라 달라질 수 있습니다.</p></div>';
  }

  /* ════════ 러너 공통 ════════ */
  var RQ = null;
  /* 문항 하나의 결과를 상태에 반영하는 공통 경로.
       저장 문항(i-*)  → 오답 노트
       문장 문항       → seqRes에 모아 두고 세트가 끝날 때 seq당 1회만 진급(4단계는 클로즈+배열 2문항 —
                         문항마다 진급시키면 한 세트에 두 단계를 뛴다)
       단어 문항       → 철자(완전 인출)는 recordCriterion, 나머지는 recordQuiz — 문항별 그대로
       생성형 오답     → 오답 노트(gen:<유형>:<ref>) */
  function gradeItem(item, ok, meta, now, seqRes) {
    /* 문항이 어느 과의 것인가 — 통합 범위 세션은 한 세트에 여러 과의 단어가 섞여 있다.
       packId 가 없는 문항(그 과 안에서 만든 유형별 세트)은 지금 보는 과의 것이다. */
    var pid = item.packId != null ? item.packId : curPackId();
    var pd = packDB(pid);
    touchPack(pid);
    if (item.type === 'storedmcq') { recordStoredResult(item, ok, now, pid); return; }
    if (item.kind === 'sentence' || (item.seq != null && item.stage != null)) {
      var st = senState(item.seq, pid);
      if (st && seqRes) {
        var key = pid + '#' + item.seq;      // 과가 다르면 같은 seq 라도 다른 문장이다
        var r = seqRes[key] || (seqRes[key] = { st: st, allOk: true });
        if (!ok) r.allOk = false;
      }
    } else if (item.wordId && pd.states[item.wordId]) {
      var ws = pd.states[item.wordId];
      var hinted = item.hinted != null ? !!item.hinted : !!item.hint;   // 힌트 본 철자는 완전 인출이 아니다
      if (item.type === 'spell') WBNAESIN.recordCriterion(ws, { correct: ok, confidence: meta.confidence, hinted: hinted }, now);
      else WBNAESIN.recordQuiz(ws, { correct: ok, confidence: meta.confidence, hinted: false }, now);
    }
    recordGenResult(item, ok, now, pid);
  }
  function runItems(items, title, opts) {
    var seqRes = {}, session = newSession();
    runQueue(items, title, function (item, ok, ans, meta) {
      gradeItem(item, ok, meta, Date.now(), seqRes);
    }, function (finished) {
      /* 세트 단위 진급 — 끝까지 풀었고(✕ 중단 아님) 그 문장의 문항을 모두 맞혔을 때만, 문장당 1회 */
      var now = Date.now();
      Object.keys(seqRes).forEach(function (k) { WBNAESIN.advanceStage(seqRes[k].st, finished && seqRes[k].allOk, now, { session: session }); });
      persist(); render();
    }, opts || {});
  }
  function mmss(ms) {
    var s = Math.max(0, Math.round(ms / 1000));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }
  /* 러너 열기/닫기 — 열릴 때 포커스를 옮기고 뒤 화면 스크롤을 잠근다(대화상자). 닫힐 때 원래 자리로. */
  var lastFocus = null;
  function openRunner() {
    var r = $('runner');
    if (!r.classList.contains('open')) lastFocus = document.activeElement;
    r.classList.add('open');
    r.scrollTop = 0;
    document.body.style.overflow = 'hidden';
    try { r.focus(); } catch (e) {}
  }
  function closeRunner() {
    $('runner').classList.remove('open');
    /* 신고 창을 열어 둔 채 세션이 끝나면 다음 세션에 남의 문항 신고가 열려 있다 */
    if (typeof closeFlag === 'function') closeFlag();
    document.body.style.overflow = '';
    if (lastFocus && lastFocus.focus && document.contains(lastFocus)) { try { lastFocus.focus(); } catch (e) {} }
    lastFocus = null;
  }
  /* 러너 종료 계약(0.7): finished=true 는 마지막 문항까지 채점됨(또는 모의 시간 종료), false 는 ✕ 중단 */
  function endQueue(finished) {
    var q = RQ; RQ = null;
    if (q && q.timerId) clearInterval(q.timerId);
    closeRunner();
    if (q && q.onDone) q.onDone(finished === true);
  }
  function runQueue(items, title, onGrade, onDone, opts) {
    RQ = { items: items, i: 0, title: title, onGrade: onGrade, onDone: onDone, opts: opts || {} };
    if (RQ.opts.timeLimit) {
      RQ.deadline = Date.now() + RQ.opts.timeLimit * 1000;
      RQ.timerId = setInterval(function () {
        if (!RQ) return;
        if (Date.now() >= RQ.deadline) { endQueue(true); return; }  /* 시간 종료 — 푼 데까지 결과, 완료로 본다 */
        countLine();
      }, 500);
    }
    openRunner();
    stepRunner();
  }
  function countLine() {
    if (!RQ) return;
    $('rCount').textContent = RQ.title + ' · ' + Math.min(RQ.i + 1, RQ.items.length) + ' / ' + RQ.items.length +

  }
  $('rQuit').onclick = function () {

      var typed = Array.prototype.some.call($('rBody').querySelectorAll('textarea.ans, input.ans'), function (el) { return el.value.trim(); });
      if (typed && !confirm('중단하면 이번 세션 결과는 기록되지 않습니다. 중단할까요?')) return;
      closeCustom(); render(); return;
    }
    if (!confirm('중단하면 이번 세션 결과는 기록되지 않습니다. 중단할까요?')) return;
    endQueue(false);
  };

  /* ── 문항 신고 ──
     팩은 PDF를 AI로 읽어 만들기 때문에 오탈자·잘못된 정답이 남을 수 있다. 학생이 수업 중에
     발견한 것을 바로 알리면 그것이 팩 정오표가 되어 품질이 계속 올라간다.
     학습 흐름은 끊지 않는다 — 보내고 나면 문항은 그대로 진행된다. */
  var flagReason = null;
  function flagTarget() {
    if (!RQ) return null;
    if (RQ.custom) return RQ.flagRef ? { packId: RQ.flagPackId || curPackId(), itemRef: RQ.flagRef } : null;
    var it = RQ.items && RQ.items[Math.min(RQ.i, RQ.items.length - 1)];

    return { packId: it.packId || curPackId(), itemRef: itemRefOf(it) };
  }
  /* 신고 식별자 — 오답노트 키(gen:<유형>:<대상>)와 같은 결로 만들어 강사가 같은 문항을 찾을 수 있게 */
  function itemRefOf(it) {
    var type = it.type || it.kind || 'item';
    var ref = it.wordId || (it.checkId ? 'chk:' + it.checkId : null) || (it.id ? String(it.id) : null)
      || (it.seq != null ? 's' + it.seq : null) || (it.day ? 'd' + it.day : null) || '?';
    return ('gen:' + type + ':' + ref).slice(0, 80);
  }
  function closeFlag() {
    $('rFlagBox').hidden = true;
    $('rFlag').classList.remove('on');
    flagReason = null;
    $('rFlagMemo').value = '';
    Array.prototype.forEach.call($('rFlagWhy').querySelectorAll('button'), function (b) { b.classList.remove('sel'); });
  }
  $('rFlag').onclick = function () {
    if (!authed) { showBanner('체험 모드에서는 알릴 수 없어요.'); return; }
    if (!flagTarget()) { showBanner('지금 화면에서는 알릴 수 없어요.'); return; }
    var open = $('rFlagBox').hidden;
    $('rFlagBox').hidden = !open;
    $('rFlag').classList.toggle('on', open);
    if (open) $('rFlagBox').scrollIntoView({ block: 'nearest' });
  };
  $('rFlagWhy').onclick = function (e) {
    var b = e.target.closest('button[data-r]'); if (!b) return;
    flagReason = b.getAttribute('data-r');
    Array.prototype.forEach.call($('rFlagWhy').querySelectorAll('button'), function (x) { x.classList.toggle('sel', x === b); });
  };
  $('rFlagCancel').onclick = closeFlag;
  $('rFlagMemo').onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); $('rFlagSend').click(); } };
  $('rFlagSend').onclick = function () {
    var t = flagTarget();
    if (!t) { closeFlag(); return; }
    var body = { packId: t.packId, itemRef: t.itemRef, reason: flagReason || 'other', memo: $('rFlagMemo').value.trim() };
    closeFlag();
    api('/report', { method: 'POST', body: JSON.stringify(body) })
      .then(function () { showBanner('선생님께 전달했어요. 계속 풀어도 됩니다.'); })
      /* 전달 실패도 학습을 막지 않는다 — 다만 조용히 넘기지는 않는다 */
      .catch(function () { showBanner('전달하지 못했어요. 잠시 뒤 다시 눌러 주세요.'); });
  };
  function stepRunner() {
    if (!RQ) return;
    if (RQ.i >= RQ.items.length) { endQueue(true); return; }
    $('rBar').style.width = Math.round(RQ.i / RQ.items.length * 100) + '%';
    /* 문항이 넘어가면 신고 창을 닫는다 — 앞 문항에 대한 신고가 다음 문항으로 붙으면 안 된다 */
    if (typeof closeFlag === 'function') closeFlag();
    countLine();
    renderItem(RQ.items[RQ.i], $('rBody'));
  }
  function finishItem(item, ok, answerKey, resultHtml) {
    if (!RQ) return;
    var q0 = RQ;
    /* 진단(silent) — 채점을 보여 주지 않고 500ms 뒤 자동 다음. 그 사이 ✕로 닫혔으면 아무것도 안 한다 */
    if (RQ.opts.silent) {
      setTimeout(function () {
        if (RQ !== q0) return;
        if (RQ.onGrade) RQ.onGrade(item, ok, answerKey, { confidence: 'unsure' });
        RQ.i += 1; stepRunner();
      }, 500);
      return;
    }
    /* 모의 모드 — 시험처럼 정답을 보여 주지 않고 즉시 다음 문항으로 */
    if (RQ.opts.mock) {
      if (RQ.onGrade) RQ.onGrade(item, ok, answerKey, { confidence: 'unsure' });
      RQ.i += 1; stepRunner();
      return;
    }
    try { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); } catch (e) {}  // 태블릿 키보드 내리기
    var box = document.createElement('div');
    box.className = 'result ' + (ok ? 'good' : 'bad');
    box.innerHTML = '<b class="mark">' + (ok ? '정답' : '오답') + '</b>' + (resultHtml || '');
    var q = $('rBody').querySelector('.q');
    q.appendChild(box);
    var needConf = !RQ.opts.noConfidence && !!item.wordId;
    function next(conf) {
      if (RQ !== q0) return;
      if (RQ.onGrade) RQ.onGrade(item, ok, answerKey, { confidence: conf || 'unsure' });
      RQ.i += 1; stepRunner();
    }
    if (needConf) {
      var cr = document.createElement('div');
      cr.className = 'confrow';
      cr.innerHTML =
        '<button data-c="sure">확실함<span class="cl">알고 답함</span></button>' +
        '<button data-c="unsure">애매함<span class="cl">확신 없음</span></button>' +
        '<button data-c="guess">추측함<span class="cl">찍어서 답함</span></button>';
      cr.onclick = function (e) { var b = e.target.closest('button'); if (b) next(b.getAttribute('data-c')); };
      q.appendChild(cr);
      var note = document.createElement('p');
      note.className = 'muted'; note.style.marginTop = '6px';
      note.textContent = '정직하게 선택할수록 복습 계획이 정확해집니다.';
      q.appendChild(note);
    } else {
      var nb = document.createElement('div');
      nb.className = 'rnext';
      nb.innerHTML = '<button class="btn p big" id="nextBtn">다음</button>';
      nb.querySelector('button').onclick = function () { next('unsure'); };
      q.appendChild(nb);
      try { nb.querySelector('button').focus({ preventScroll: true }); } catch (e) {}
    }
    try { box.scrollIntoView({ block: 'nearest' }); } catch (e) {}
  }
  /* 답 입력 <input>에서 Enter = 확인(채점 뒤엔 다음). textarea는 줄바꿈이 필요하니 제외. */
  $('rBody').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || e.isComposing) return;
    var t = e.target;
    if (!t || t.tagName !== 'INPUT') return;
    e.preventDefault();
    var b = $('subBtn');
    if (b && !b.getAttribute('data-done')) { b.click(); return; }
    var nb = $('nextBtn');
    if (nb) nb.click();
  });
  function runCustom(title, html, wire) {
    RQ = { custom: true };
    openRunner();
    $('rBar').style.width = '100%';
    $('rCount').textContent = title;
    $('rBody').innerHTML = html;
    wire();
  }
  function closeCustom() { closeRunner(); RQ = null; }

  /* ── 문항 렌더 (유형별) ── */
  /* 답 입력창 공통 속성 — 자동 교정·대문자화·맞춤법 밑줄은 영어 철자 시험을 망친다 */
  var INATTR = ' autocorrect="off" spellcheck="false" autocomplete="off" autocapitalize="off" enterkeyhint="done"';
  /* 듣기 버튼 — 청크 트랙과 배열 문항에서 영어 소리를 늘 곁에 둔다(못 읽는 학생의 입구) */
  function ttsBtnHtml(item, id) {
    if (!item.ttsText) return '';
    return ' <button id="' + id + '" class="tag t-ind tb" aria-label="영어 듣기">듣기</button>';
  }
  function wireTtsBtn(item, id) {
    var b = $(id);
    if (b) b.onclick = function () { if (window.WBVoice && WBVoice.ttsSupported()) WBVoice.speak(item.ttsText, { lang: 'en' }); };
  }
  /* 전사(cue 3) 화면에 보여 줄 답 — 생성기는 showAnswer(불리언)+given(전문)으로 준다.
     옛 판·앱 대체본은 showAnswer 에 문자열을 담기도 해서 둘 다 받는다. */
  function givenText(item) {
    if (item.showAnswer === true) return String(item.given || '');
    if (typeof item.showAnswer === 'string') return item.showAnswer;
    return '';
  }
  /* 한글 답 채점 — WBGRADE.normalizeEn 은 한글을 통째로 지우므로 뜻 빈칸에 쓸 수 없다.
     공백·문장부호만 털고 견준다(조사·어미까지 좇지 않는다 — 여기서 재는 것은 '뜻을 아는가'다). */
  function normKo(v) {
    return String(v == null ? '' : v).replace(/\s+/g, '').replace(/[.,!?~·"'“”‘’()\[\]<>/\\-]/g, '').toLowerCase();
  }
  function gradeKoBlanks(inputs, answers) {
    var all = true;
    var per = (answers || []).map(function (acc, i) {
      var got = normKo(inputs[i]);
      var ok = !!got && (acc || []).some(function (a) { return normKo(a) === got; });
      if (!ok) all = false;
      return { correct: ok, expected: (acc && acc[0]) || '' };
    });
    return { allCorrect: all, perBlank: per };
  }
  function renderItem(item, root) {
    var stageLabel = item.track === 'chunk' ? ZONE_MEAN + (item.day ? ' · ' + item.day : '')
      : item.stage ? '본문 ' + Math.floor(item.stage) + '단계 · ' + (STAGE_NAMES[Math.floor(item.stage)] || '')
      : (item.kind === 'word' || item.wordId ? '단어'
      : (item.type === 'grammar' ? '어법 선택' + (item.seq != null ? ' · 문장 ' + item.seq : '')
      : (item.seq != null ? '본문 문장 ' + item.seq : '')));
    /* 통합 범위 세션은 과가 섞인다 — 지금 보는 과가 아닌 문항엔 어느 과인지 붙인다 */
    if (item.packId != null && item.packId !== curPackId()) stageLabel = lessonLabel(item.packId) + ' · ' + stageLabel;
    var head = '<div class="q"><div class="qmeta">' + esc(stageLabel) + '</div>' +
      (item.roundNote ? '<div class="cuebar"><span>' + esc(item.roundNote) + '</span></div>' : '');

    if (item.type === 'storedmcq') return renderStored(item, root);

    /* 청크 짝 맞추기 — 왼쪽 영어를 누르면 소리가 나고, 오른쪽 한글을 눌러 잇는다.
       틀리면 표시만 하고 다시 고를 수 있다(여기서 막히면 첫날이 끝난다). 다 이으면 통과. */
    if (item.type === 'ckmatch') {
      var pairs = item.pairs || [];
      var kos = WBGEN.shuffle(pairs.map(function (p, i) { return { i: i, ko: p.ko }; }), Math.random);
      root.innerHTML = head + '<div class="prompt sm">영어를 누르면 소리가 납니다. 같은 뜻의 우리말을 이어 주세요.</div>' +
        '<div class="pairs"><div class="col"><span class="cl">영어 청크</span>' +
        pairs.map(function (p, i) { return '<button data-en="' + i + '">' + esc(p.en) + '</button>'; }).join('') +
        '</div><div class="col"><span class="cl">우리말 뜻</span>' +
        kos.map(function (k) { return '<button data-ko="' + k.i + '">' + esc(k.ko) + '</button>'; }).join('') +
        '</div></div><p class="muted" id="mkNote" style="margin-top:10px">0 / ' + pairs.length + ' 연결</p></div>';
      var pickedEn = null, matched = {}, wrongOnce = false;
      var enBtns = root.querySelectorAll('button[data-en]'), koBtns = root.querySelectorAll('button[data-ko]');
      function clearSel() { for (var i = 0; i < enBtns.length; i++) enBtns[i].classList.remove('sel', 'bad'); for (i = 0; i < koBtns.length; i++) koBtns[i].classList.remove('sel', 'bad'); }
      function doneN() { return Object.keys(matched).length; }
      function finish() {
        $('mkNote').textContent = doneN() + ' / ' + pairs.length + ' 연결';
        if (doneN() < pairs.length) return;
        finishItem(item, !wrongOnce, null, wrongOnce ? ' — 다시 이어 맞췄습니다' : '');
      }
      root.querySelector('.pairs').onclick = function (e) {
        var b = e.target.closest('button');
        if (!b || b.disabled) return;
        if (b.hasAttribute('data-en')) {
          clearSel(); pickedEn = Number(b.getAttribute('data-en')); b.classList.add('sel');
          if (window.WBVoice && WBVoice.ttsSupported()) WBVoice.speak(pairs[pickedEn].en, { lang: 'en' });
          return;
        }
        var ki = Number(b.getAttribute('data-ko'));
        if (pickedEn == null) { b.classList.add('sel'); setTimeout(function () { b.classList.remove('sel'); }, 250); return; }
        var eb = root.querySelector('button[data-en="' + pickedEn + '"]');
        if (ki === pickedEn) {
          matched[ki] = 1; eb.classList.remove('sel'); eb.classList.add('done'); eb.disabled = true;
          b.classList.add('done'); b.disabled = true; pickedEn = null;
          finish();
        } else {
          wrongOnce = true; b.classList.add('bad'); eb.classList.add('bad');
          setTimeout(function () { clearSel(); pickedEn = null; }, 450);
        }
      };
      return;
    }

    if (item.choices) {
      /* prompt가 없는 문항(어법 선택 — parts로만 옴)은 빈칸(____)을 넣어 조립한 문장 + 우리말을 보인다 */
      var ptxt = item.prompt != null ? String(item.prompt) : promptOf(item);
      root.innerHTML = head +
        (item.koFull ? '<div class="prompt sm" style="color:var(--soft)">' + esc(item.koFull) + '</div>' : '') +
        '<div class="prompt' + (item.prompt != null ? '' : ' sm') + '">' + esc(ptxt) + ttsBtnHtml(item, 'chTts') + '</div><div class="choices" id="chs"></div></div>';
      wireTtsBtn(item, 'chTts');
      var chs = $('chs');
      var list = item.choices.slice();
      if (item.unknownKey) list.push({ key: item.unknownKey, text: '모름 (진단용 — 감점 없음)' });
      list.forEach(function (c) {
        var b = document.createElement('button');
        b.textContent = c.text; b.setAttribute('data-k', c.key);
        chs.appendChild(b);
      });
      chs.onclick = function (e) {
        var b = e.target.closest('button'); if (!b || chs.getAttribute('data-done')) return;
        chs.setAttribute('data-done', '1');
        var k = b.getAttribute('data-k');
        var ok = k === item.answerKey;
        if (RQ && RQ.opts.silent) { b.classList.add('sel'); }   // 진단 — 정오답을 드러내지 않는다
        else {
          var all = chs.querySelectorAll('button');
          for (var i = 0; i < all.length; i++) {
            if (all[i].getAttribute('data-k') === item.answerKey) all[i].classList.add('right');

    if (item.type === 'spell') {
      root.innerHTML = head + '<div class="prompt sm">뜻: <b>' + esc(item.promptKo) + '</b></div>' +
        (item.hint ? '<div class="prompt" style="letter-spacing:2px">' + esc(item.hint) + '</div>'
                   : '<p class="muted">힌트 없음 — 철자 전체를 떠올려 쓰세요.</p>') +
        '<input class="ans" id="spellIn"' + INATTR + ' placeholder="영어 단어 입력">' +
        '<div class="rnext"><button class="btn p big" id="subBtn">확인</button></div></div>';
      bindSubmit(function () {
        var v = $('spellIn').value;
        var g = WBGRADE.gradeAnswer(v, item.answers);
        finishItem(item, g.correct, v, g.correct ? '' : ' — 정답: <b>' + esc(item.answers[0]) + '</b>');
      });
      $('spellIn').focus();
      return;
    }

    if (item.type === 'cloze') {
      root.innerHTML = head + '<div class="prompt sm">' + esc(item.textParts[0]) +
        '<input class="blankline" id="czIn"' + INATTR + ' aria-label="빈칸">' + esc(item.textParts[1]) + '</div>' +
        '<div class="rnext"><button class="btn p big" id="subBtn">확인</button></div></div>';
      bindSubmit(function () {
        var v = $('czIn').value;
        var g = WBGRADE.gradeAnswer(v, item.answers);
        finishItem(item, g.correct, v, g.correct ? '' : ' — 정답: <b>' + esc(item.answers[0]) + '</b>');
      });

    }

    /* parts+blank 형식 전부 — 핵심어 빈칸(3단계)·구 클로즈(4단계, clozewide)·동사 형태 */
    if (item.type === 'kwblank' || item.type === 'koblank' || item.type === 'ckblank' || item.type === 'verb' || item.type === 'clozewide' || (item.parts && !item.choices)) {
      var isKo = item.lang === 'ko';
      /* 단서 3(전사) — 답을 보여 주고 그대로 옮겨 쓴다. 실패부터 시키면 학습이 아니라 회피가 생긴다. */
      var shownAns = givenText(item);
      var html = head +
        (shownAns ? '<div class="showans"><small>보고 그대로 옮겨 쓰기</small>' + esc(shownAns) + '</div>' : '') +
        (isKo && item.enFull ? '<div class="enline">' + esc(item.enFull) + ttsBtnHtml({ ttsText: item.enFull }, 'kbTts') + '</div>' : '') +
        (item.koFull ? '<div class="prompt sm" style="color:var(--soft)">' + esc(item.koFull) + '</div>' : '') +

      var bi = 0;

        else {

            : (p.blank.hintEn ? '<span class="hintko">' + esc(p.blank.hintEn) + '</span>'
            : (p.blank.base ? '<span class="hintko">(' + esc(p.blank.base) + ')</span>' : ''));
          var phv = p.blank.hint != null ? p.blank.hint : p.blank.ph;
          var ph = phv ? ' placeholder="' + esc(phv) + '"' : '';
          html += '<span style="white-space:nowrap"><input class="blankline" data-b="' + bi + '"' + INATTR + ph + ' aria-label="빈칸 ' + (bi + 1) + '">' + hint + '</span>';
          bi += 1;

      });
      html += '</div>' +
        (isKo && (item.chunks || []).length ? (item.chunks || []).map(function (c) {
          return '<div class="chunkline">' + esc(c.en) + '<span class="ko">' + esc(c.ko) + '</span></div>';
        }).join('') : '') +
        '<div class="rnext"><button class="btn p big" id="subBtn">확인</button></div></div>';
      root.innerHTML = html;
      if (isKo && item.enFull) wireTtsBtn({ ttsText: item.enFull }, 'kbTts');
      var blanks = item.parts.filter(function (p) { return p.blank; });
      bindSubmit(function () {
        var ins = root.querySelectorAll('input[data-b]');
        var inputs = [], answers = [];
        blanks.forEach(function (p, i) { inputs.push(ins[i].value); answers.push(p.blank.answers); });
        var g = isKo ? gradeKoBlanks(inputs, answers) : WBGRADE.gradeBlanks(inputs, answers);
        for (var i = 0; i < ins.length; i++) ins[i].classList.add(g.perBlank[i].correct ? 'ok' : 'bad');
        /* expected 는 대표 정답 '문자열'이다 — [0]을 집으면 첫 글자만 보여 준다(옛 버그).
           단서가 줄어드는 단계에서 정답을 못 보면 배울 기회 자체가 없다. */
        var wrongAns = g.perBlank.filter(function (pb) { return !pb.correct; })
          .map(function (pb) { return pb.expected; }).filter(Boolean);
        finishItem(item, g.allCorrect, null, g.allCorrect ? '' : ' — 정답: <b>' + esc(wrongAns.join(', ')) + '</b>');
      });
      var f = root.querySelector('input[data-b]'); if (f) f.focus();
      return;
    }

    if (item.type === 'order') {
      /* 배열 문항의 길잡이 — 한글 청크를 배열할 때 매끄러운 해석(sentences[].ko)을 그대로 보이면
         답이 그대로 새어 나간다. 문항이 hintText 를 주면 그것이 정본이다(영어 원문·한글 청크 순서). */
      root.innerHTML = head +
        (item.hintLabel ? '<div class="qmeta">' + esc(item.hintLabel) + '</div>' : '') +
        '<div class="prompt sm" style="color:var(--soft)"><span id="ordKo"></span>' + ttsBtnHtml(item, 'ordTts') + '</div>' +
        '<div class="built" id="built"></div><div class="tokens" id="toks"></div>' +
        '<div class="rnext"><button class="btn p big" id="subBtn">확인</button></div></div>';
      wireTtsBtn(item, 'ordTts');
      var sen = senBySeq(item.seq, item.packId);
      $('ordKo').textContent = item.hintText != null ? String(item.hintText) : (sen ? sen.ko : '어순에 맞게 배열하시오');
      var picked = [];
      function draw() {
        var b = $('built'); b.innerHTML = '';
        picked.forEach(function (t, i) {
          var x = document.createElement('button'); x.textContent = t;
          x.onclick = function () { picked.splice(i, 1); draw(); };
          b.appendChild(x);
        });
        var tk = $('toks'); tk.innerHTML = '';
        var used = picked.slice();
        item.shuffled.forEach(function (t) {
          var x = document.createElement('button'); x.textContent = t;
          var ui = used.indexOf(t);
          if (ui >= 0) { x.disabled = true; used.splice(ui, 1); }
          else x.onclick = function () { picked.push(t); draw(); };
          tk.appendChild(x);
        });
      }
      draw();
      bindSubmit(function () {
        var ok = picked.length === item.answer.length && picked.every(function (t, i) { return t === item.answer[i]; });
        finishItem(item, ok, null, ok ? '' : ' — 정답: <b>' + esc(item.answer.join(' ')) + '</b>');
      });
      return;
    }

    if (item.type === 'write' || item.type === 'skeleton') {
      var hintHtml = item.type === 'write'
        ? '<p class="muted">활용 단어: ' + esc((item.keywords || []).join(', ')) + '</p>'
        : '<p class="muted">제시어: <b>' + esc(item.hint) + '</b></p>';
      var shownW = givenText(item);
      var skel = item.cueHint != null ? item.cueHint : (item.type === 'write' && !shownW ? item.hint : null);
      if (skel) hintHtml += '<p class="muted" style="font-family:var(--mono);letter-spacing:1px">' + esc(skel) + '</p>';
      root.innerHTML = head +
        (shownW ? '<div class="showans"><small>보고 그대로 옮겨 쓰기</small>' + esc(shownW) + '</div>' : '') +
        '<div class="prompt sm">' + esc(item.ko || '다음 문장을 영어로 쓰시오.') + '</div>' + hintHtml +
        '<textarea class="ans" id="wrIn"' + INATTR + ' placeholder="영어 문장 전체를 쓰시오"></textarea>' +
        '<div class="rnext"><button class="btn p big" id="subBtn">확인</button></div></div>';
      bindSubmit(function () {
        var v = $('wrIn').value;
        var g = WBGRADE.gradeAnswer(v, item.answers);
        var sim = WBGRADE.similarity(v, item.answers[0]);
        /* 6단계 백지와 같은 임계 — 정규화 완전 일치만 통과. 유사도는 화면 피드백(일치율)에만 쓴다 */
        var ok = g.correct;
        finishItem(item, ok, v, '<div class="exp">모범 답안: ' + esc(item.answers[0]) + (ok ? '' : ' (일치율 ' + Math.round(sim * 100) + '%)') + '</div>');
      });
      $('wrIn').focus();
      return;
    }

    root.innerHTML = head + '<div class="prompt sm">지원하지 않는 문항 유형입니다.</div>' +
      '<div class="rnext"><button class="btn big" id="subBtn">건너뛰기</button></div></div>';
    bindSubmit(function () { RQ.i += 1; stepRunner(); });
  }
  function renderStored(item, root) {
    var multi = item.answerCount > 1;
    root.innerHTML = '<div class="q"><div class="qmeta">문항 ' + item.no + (multi ? ' · 정답 ' + item.answerCount + '개 선택' : '') + '</div>' +
      '<div class="prompt sm" style="white-space:pre-line">' + esc(item.prompt) + '</div><div class="choices" id="chs"></div>' +
      (multi ? '<div class="rnext"><button class="btn p big" id="subBtn">확인</button></div>' : '') + '</div>';
    var chs = $('chs');
    item.choices.forEach(function (c) {
      var b = document.createElement('button');
      b.textContent = c.key + '. ' + c.text; b.setAttribute('data-k', c.key);
      chs.appendChild(b);
    });
    function grade(picked) {
      var ok = picked.length === item.answerKeys.length &&
        item.answerKeys.every(function (k) { return picked.indexOf(k) >= 0; });
      var all = chs.querySelectorAll('button');
      for (var i = 0; i < all.length; i++) {
        var k = all[i].getAttribute('data-k');
        if (item.answerKeys.indexOf(k) >= 0) all[i].classList.add('right');
        else if (picked.indexOf(k) >= 0) all[i].classList.add('wrongpick');
      }
      finishItem(item, ok, picked.join(','), item.explanation ? '<div class="exp">' + esc(item.explanation) + '</div>' : '');
    }
    if (multi) {
      var picked = [];
      chs.onclick = function (e) {
        var b = e.target.closest('button'); if (!b || chs.getAttribute('data-done')) return;
        var k = b.getAttribute('data-k'), i = picked.indexOf(k);
        if (i >= 0) { picked.splice(i, 1); b.classList.remove('sel'); }
        else { picked.push(k); b.classList.add('sel'); }
      };
      bindSubmit(function () { chs.setAttribute('data-done', '1'); grade(picked); });
    } else {
      chs.onclick = function (e) {
        var b = e.target.closest('button'); if (!b || chs.getAttribute('data-done')) return;
        chs.setAttribute('data-done', '1');
        grade([b.getAttribute('data-k')]);
      };
    }
  }
  function bindSubmit(fn) {
    var b = $('subBtn');
    b.onclick = function () { if (!b.getAttribute('data-done')) { b.setAttribute('data-done', '1'); fn(); } };
  }

  /* ── 렌더 루트 ── */
  function render() {
    renderHeader();
    if (!pack) { layoutFull('<p class="muted">교재를 불러오는 중…</p>'); return; }
    if (view === 'home') renderHome();
    else if (view === 'words') renderWords();
    else if (view === 'passage') renderPassage();
    else if (view === 'quiz') renderQuiz();
    else renderProgress();
  }

  /* ── 부팅: 연동 확인 → 배정된 내 학교 교재를 이어서 연다 ──
     연동 기기는 어떤 실패에도 체험 모드로 떨어지지 않는다 — 학생 기록이 데모 팩에 섞이거나,
     "왜 예시 교재가 뜨지?" 하고 지나가는 일이 없게 원인별 화면을 보인다. */
  function loadDemo() {
    return fetch('./pack-sample.json').then(function (r) { return r.json(); });
  }
  function openLoaded() {
    var n = ensureStatesAll();       // 범위 전체 — 아직 안 연 과의 단어·문장도 합계에 들어가야 한다
    if (n) persist(); else save();   // 실제로 상태를 만들었을 때만 서버 push — 열기만으로 savedAt을 올리지 않는다
    setTab('home');
  }
  function openDemo() {
    return loadDemo().then(function (p) { pack = p; PACKS[p.packId] = p; demoMode = true; openLoaded(); });
  }
  /* 시험 범위 팩 전부 로드 — 실제 시험 범위는 보통 2~3개 과다. 하나라도 열리면 학습을 시작한다:
     한 과의 팩이 삭제·오류여도 나머지 범위까지 막을 이유가 없다. 전부 실패해야 부팅 오류다. */
  function loadRangePacks() {
    if (!packList.length) return Promise.reject(new Error('no-pack'));
    var errs = [];
    return Promise.all(packList.map(function (id) {
      return api('/pack?id=' + encodeURIComponent(id))
        .then(function (r) { return { id: id, pack: r.pack, updatedAt: r.updatedAt || null }; })
        .catch(function (e) { errs.push(e); return null; });
    })).then(function (list) {
      var got = list.filter(function (x) { return x && x.pack && x.pack.packId; });
      if (!got.length) {
        /* 배정 밖(403)만이면 '아직 배정되지 않음'이다 — 서버 오류가 아니라 A7 안내 화면 */
        if (errs.length && errs.every(function (e) { return e && e.message === 'api-403'; })) throw new Error('no-pack');
        throw errs[0] || new Error('no-pack');
      }
      got.forEach(function (g) { PACKS[g.id] = g.pack; });
      cachePacks(got);
      /* 지금 열 과 — 마지막으로 보던 과가 범위에 남아 있으면 그것, 아니면 범위의 첫 과 */
      var pid = (DB.last && PACKS[DB.last.packId]) ? DB.last.packId : got[0].id;
      pack = PACKS[pid];
      applyServerExamAll();
      return got;
    });
  }
  function fatal(html) { layoutFull('<div class="card" style="max-width:560px;margin:40px auto">' + html + '</div>'); }
  function bootError(e) {
    var msg = (e && e.message) || '';
    if (msg === 'api-401') {
      fatal('<h2>연동이 만료되었습니다</h2><p class="muted">학원 QR로 다시 연동해 주세요.</p>' +
        '<div class="row2" style="margin-top:10px"><a class="btn p" href="/">연동 화면으로</a><button class="btn" id="unlinkBtn">이 기기의 연동 해제</button></div>');
      $('unlinkBtn').onclick = function () { try { localStorage.removeItem('wbr.auth'); } catch (x) {} clearPackCache(); location.href = '/'; };
      return;
    }
    if (msg === 'no-pack') {
      fatal('<h2>배정된 교재가 없습니다</h2><p class="muted">선생님이 아직 시험 범위(교재)를 배정하지 않았습니다. 배정되면 다시 시도를 누르세요.</p>' +
        '<div class="row2" style="margin-top:10px"><button class="btn p" id="retryBtn">다시 시도</button><button class="btn" id="demoBtn">체험 교재로 연습</button></div>');
      $('retryBtn').onclick = function () { location.reload(); };
      $('demoBtn').onclick = function () { openDemo().catch(function () { fatal('<p>체험 교재를 불러오지 못했습니다.</p>'); }); };
      return;
    }
    if (isNetErr(e)) {
      var c = loadPacksCache();
      if (c) {
        /* 오프라인 — 캐시된 시험 범위 전체를 연다. 기록은 로컬에 쌓이고 다음 연결 때 push된다
           (팩별 savedAt 병합). 범위가 여러 과면 오프라인에서도 과 전환이 그대로 된다. */
        Object.keys(c).forEach(function (id) { if (c[id] && c[id].pack) PACKS[id] = c[id].pack; });
        var ids = packList.filter(function (id) { return !!PACKS[id]; });
        if (!ids.length) ids = Object.keys(PACKS);
        /* /exam 도 못 받은 상태다 — 캐시에 담긴 팩 목록이 곧 마지막으로 아는 시험 범위다.
           이걸 안 채우면 범위를 캐시해 두고도 과 선택이 사라져 한 과만 열린다. */
        packList = ids.slice();
        var pid = (DB.last && PACKS[DB.last.packId]) ? DB.last.packId : ids[0];
        pack = PACKS[pid];
        offlineMode = true;
        openLoaded();
        return;
      }
      fatal('<h2>연결 실패</h2><p class="muted">서버에 연결할 수 없습니다. 인터넷 연결을 확인하고 다시 시도하세요.</p>' +
        '<button class="btn p" id="retryBtn" style="margin-top:10px">다시 시도</button>');
      $('retryBtn').onclick = function () { location.reload(); };
      return;
    }
    fatal('<h2>서버 오류</h2><p class="muted">교재를 불러오지 못했습니다 (' + esc(msg) + '). 잠시 후 다시 시도하세요.</p>' +
      '<button class="btn p" id="retryBtn" style="margin-top:10px">다시 시도</button>');
    $('retryBtn').onclick = function () { location.reload(); };
  }
  /* 옛 단일 키(wbn.v1) 이관 — 원격에도 새 키에도 기록이 없을 때 1회. 원격이 있으면 원격이 정본이다. */
  function migrateLegacy() {
    var legacy = null;
    try { legacy = JSON.parse(localStorage.getItem(LEGACY_KEY) || 'null'); } catch (e) {}
    if (!legacy || !legacy.packs || Object.keys(legacy.packs).length === 0) return false;
    if (Object.keys(DB.packs).length) return false;
    DB.packs = legacy.packs;
    if (legacy.last) DB.last = legacy.last;
    DB.savedAt = legacy.savedAt || 0;
    try { localStorage.removeItem(LEGACY_KEY); } catch (e) {}
    return true;
  }
  function boot() {
    var a = auth();
    var code = (a && a.token && a.code) ? String(a.code) : null;
    KEY = 'wbn.v1:' + (code || 'demo');
    DB = loadDB();
    if (!DB || (code && DB.owner && DB.owner !== code)) DB = { v: 1, packs: {}, savedAt: 0 };
    if (code) DB.owner = code;
    if (!DB.packs || typeof DB.packs !== 'object') DB.packs = {};
    if (!code) {
      openDemo().catch(function () { fatal('<p>교재를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침하십시오.</p>'); });
      return;
    }
    authed = true;
    layoutFull('<p class="muted">교재를 불러오는 중…</p>');
    api('/exam').then(function (r) {
      var ex = (r && r.exam) || {};
      examServer = ex;
      packList = (ex.packIds || []).slice();
      /* 원격 pull이 먼저다 — 로컬에 뭐가 있든 원격이 더 새로우면 그것을 받은 뒤 팩을 연다 */
      return api('/state').then(function (sr) {
        var remote = sr && sr.state;
        var pulled = pullAdopt(remote);
        if (!pulled && !(remote && remote.packs && Object.keys(remote.packs).length)) {
          if (migrateLegacy()) { save(); scheduleSync(); }
        }
        /* pull이 됐으면 옛 단일 키는 이 기기에서 역할이 끝났다 — 남겨 두면 공용 태블릿에서 다음 학생이
           부팅할 때 남의 레거시 기록이 이관되어 그 학생의 서버 상태로 올라간다. */
        try { localStorage.removeItem(LEGACY_KEY); } catch (e) {}
        /* 오프라인에서 공부한 분량 — 로컬이 더 새로운 팩이 하나라도 있으면 다음 학습 행동을 기다리지 않고
           지금 올린다(관리 현황판이 재부팅 후에도 뒤처지지 않게). */
        var localNewer = Object.keys(DB.packs).some(function (pid) {
          var lp = DB.packs[pid] || {}, rp = remote && remote.packs && remote.packs[pid];
          return (lp.savedAt || 0) > ((rp && rp.savedAt) || 0);
        });
        if (localNewer) scheduleSync();
      }).catch(function () {}).then(function () {
        /* 과제·지난 시험 결과는 학습을 막지 않는다 — 없거나 라우트가 아직 없으면 조용히 넘어간다 */
        return Promise.all([
          api('/task').then(function (tr) { taskServer = tr; }).catch(function () {}),
          api('/result').then(function (rr) { resultServer = rr; }).catch(function () {})
        ]);
      }).then(function () {
        return loadRangePacks();
      });
    }).then(function () { openLoaded(); }).catch(bootError);
  }
  /* 원격 상태를 팩별 savedAt 비교로 받아 적는다(pullState와 같은 규칙, 부팅용 동기 버전) */
  function pullAdopt(remote) {
    if (!remote || !remote.packs || typeof remote.packs !== 'object') return false;
    var changed = false;
    Object.keys(remote.packs).forEach(function (pid) {
      var rp = remote.packs[pid], lp = DB.packs[pid];
      if (!rp || typeof rp !== 'object') return;
      if (!lp || (rp.savedAt || 0) > (lp.savedAt || 0)) { DB.packs[pid] = rp; changed = true; }
    });
    if ((remote.savedAt || 0) > (DB.savedAt || 0)) {
      if (remote.last) DB.last = remote.last;
      DB.savedAt = remote.savedAt;
      changed = true;
    }
    if (changed) save();
    return changed;
  }
  boot();

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(function () {});
})();
</script>
