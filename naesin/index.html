<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>WB 내신브레인 — 영어 시험대비</title>
  <meta name="description" content="단어 암기·본문 해석·백지 영작 — WB 영어 내신 시험대비 학습 시스템 (원내 전용)">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1C2430">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <style>
    /* 중학생 전용 학습 시스템 — D(스플릿 워크스페이스) 골격 + E(프로그레스 보드) 홈.
       주 기기 태블릿 가로, 보조 노트북. 놀이 요소 없이 목록·지면·숫자로만 말한다. */
    :root {
      --bg: #F2F4F7; --panel: #FFFFFF; --ink: #1C2430; --soft: #667382; --line: #E2E6EC;
      --ind: #4A56C9; --ind-soft: #EDEFFB; --green: #218358; --green-soft: #E8F4EE;
      --red: #C2402E; --red-soft: #FBEBE8; --amber: #B27B16; --amber-soft: #F8F1DF;
      --b1: #DCE9F7; --b2: #A9CBEF; --b3: #5E9BE0; --b4: #1F6BC4;
      --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body { background: var(--bg); color: var(--ink);
      font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      font-size: 14.5px; line-height: 1.6; word-break: keep-all; -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column; }
    button { font-family: inherit; font-size: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    input, textarea, select { font-family: inherit; font-size: 1rem; color: var(--ink); }
    :focus-visible { outline: 2px solid var(--ind); outline-offset: 2px; border-radius: 6px; }
    .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

    /* ── 상단 바 ── */
    .bar { display: flex; align-items: center; gap: 14px; background: var(--panel);
      border-bottom: 1px solid var(--line); padding: 9px 16px; flex: none; flex-wrap: wrap; }
    .bar .brand { font-weight: 900; font-size: 15px; letter-spacing: -.01em; }
    .seg { display: flex; background: var(--bg); border-radius: 9px; padding: 3px; }
    .seg button { padding: 7px 16px; border-radius: 7px; font-size: 13.5px; font-weight: 700; color: var(--soft); white-space: nowrap; }
    .seg button.on { background: var(--panel); color: var(--ind); box-shadow: 0 1px 3px rgba(20,30,60,.12); }
    .bar .who { margin-left: auto; font-size: 12.5px; color: var(--soft); text-align: right; line-height: 1.35;
      padding: 4px 6px; border-radius: 6px; min-height: 44px; display: inline-flex; align-items: center; }
    .bar .who b { color: var(--ink); }
    .bar .who.linked { cursor: pointer; }            /* 이름 탭 = 다른 학생으로 연동 (공용 태블릿) */
    .bar .who.linked:hover { background: var(--bg); }
    .bar .dd { background: var(--red-soft); color: var(--red); font-weight: 800; font-size: 12.5px;
      border-radius: 6px; padding: 4px 10px; white-space: nowrap; }
    .bar .dd.practice { background: var(--ind-soft); color: var(--ind); }
    .bar .dd.offline { background: var(--amber-soft); color: var(--amber); cursor: pointer; }
    /* 저장 상태 점 — 서버 동기화가 조용히 실패하는 일을 학생·강사가 눈으로 안다 */
    .savedot { font-size: 11.5px; color: var(--soft); white-space: nowrap; }
    .savedot i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #B7C0CC; margin-right: 5px; vertical-align: 1px; }
    .savedot.saved i { background: var(--green); }
    .savedot.pending i { background: var(--amber); }
    .savedot.failed i, .savedot.toobig i { background: var(--red); }
    .savedot.failed, .savedot.toobig { color: var(--red); }
    .banner { background: var(--red-soft); color: var(--red); border-bottom: 1px solid var(--red); padding: 8px 16px; font-size: 13px; font-weight: 700; flex: none; }
    [hidden] { display: none !important; }

    /* ── 본체: 스플릿 ── */
    .wrap { flex: 1; display: flex; min-height: 0; }
    .list { width: 330px; flex: none; background: var(--panel); border-right: 1px solid var(--line);
      display: flex; flex-direction: column; min-height: 0; }
    .list .lh { padding: 13px 16px 8px; font-size: 12.5px; color: var(--soft); font-weight: 700;
      display: flex; justify-content: space-between; gap: 8px; flex: none; }
    .list .lh b { color: var(--ink); }
    .rows { flex: 1; overflow-y: auto; }
    .hdr { padding: 4px 8px 4px 14px; background: #F7F8FA; font-size: 11.5px; font-weight: 800; color: var(--soft);
      border-bottom: 1px solid #EFF2F5; position: sticky; top: 0; z-index: 1;
      display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 32px; }
    /* 터치 타깃 ≥44px — 태블릿에서 손가락으로 누르는 것들은 전부 이 크기를 지킨다 */
    .hdr button { min-height: 44px; min-width: 44px; padding: 0 10px; font-size: 11px; font-weight: 800; color: var(--ind); border-radius: 7px; }
    .hdr button:disabled { opacity: .4; cursor: default; }
    .row { display: flex; align-items: center; gap: 9px; padding: 9px 14px; border-bottom: 1px solid #EFF2F5; cursor: pointer; min-height: 44px; }
    .row[role="button"]:focus-visible { outline-offset: -2px; }
    .row .no { width: 22px; font-size: 12px; font-weight: 800; color: var(--soft); flex: none; font-family: var(--mono); }
    .row .tx { flex: 1; min-width: 0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #3A4656; }
    .row .sub { display: block; font-size: 11px; color: var(--soft); }
    .row.sel { background: var(--ind-soft); }
    .row.sel .tx { color: var(--ink); font-weight: 600; }
    .stg { display: inline-flex; gap: 2px; flex: none; }
    .stg i { width: 6px; height: 11px; border-radius: 2px; background: #E9EDF2; }
    .stg i.on { background: var(--ind); } .stg i.dn { background: var(--green); }
    .lvchip { flex: none; font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--soft); }
    .lvchip.r { color: var(--b4); } .lvchip.s { color: var(--green); }

    .work { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow-y: auto; }
    .wpad { padding: 18px 26px 30px; max-width: 860px; width: 100%; margin: 0 auto; }
    .full { flex: 1; overflow-y: auto; }
    .full .wpad { max-width: 1060px; }

    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
      padding: 16px 20px; margin: 0 0 14px; }
    .card h2 { font-size: 14.5px; font-weight: 800; margin: 0 0 10px; display: flex; align-items: baseline; gap: 8px; }
    .card h2 small { font-weight: 500; color: var(--soft); font-size: 12px; }
    .muted { color: var(--soft); font-size: 12.5px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 9px;
      padding: 11px 18px; min-height: 44px; font-weight: 700; font-size: 14px; background: var(--panel);
      color: var(--ink); border: 1px solid var(--line); }
    .btn.p { background: var(--ind); color: #fff; border-color: var(--ind); }
    .btn.dark { background: var(--ink); color: #fff; border-color: var(--ink); }
    .btn.big { width: 100%; padding: 13px 18px; }
    .btn:disabled { opacity: .4; cursor: default; }
    .btn:active:not(:disabled) { transform: translateY(1px); }
    .row2 { display: flex; gap: 10px; } .row2 > * { flex: 1; }
    .tag { display: inline-block; font-size: 11.5px; font-weight: 800; border-radius: 5px; padding: 2px 9px; }
    .t-ind { background: var(--ind-soft); color: var(--ind); }
    .t-green { background: var(--green-soft); color: var(--green); }
    .t-red { background: var(--red-soft); color: var(--red); }
    .t-gray { background: var(--bg); color: var(--soft); }
    .tag.tb { min-height: 44px; min-width: 44px; display: inline-flex; align-items: center; justify-content: center; padding: 0 12px; vertical-align: middle; }
    .notice { border: 1px solid var(--amber); background: var(--amber-soft); border-radius: 9px;
      padding: 10px 14px; font-size: 12.5px; margin: 0 0 12px; }

    /* ── E 프로그레스 보드 (홈) ── */
    .big3 { display: grid; grid-template-columns: 1fr 1fr 1fr; border: 1px solid var(--line);
      border-radius: 12px; overflow: hidden; background: var(--panel); margin-bottom: 14px; }
    .big3 > div { padding: 16px 22px; border-right: 1px solid var(--line); }
    .big3 > div:last-child { border-right: none; }
    .big3 .n { font-family: var(--mono); font-size: 36px; font-weight: 700; letter-spacing: -.04em; line-height: 1.15; }
    .big3 .n small { font-size: 15px; color: var(--soft); }
    .big3 .l { font-size: 12px; font-weight: 700; color: var(--soft); margin-top: 2px; }
    .big3 .l b { color: var(--ink); }
    .boards { display: grid; grid-template-columns: 1.1fr .9fr; gap: 14px; margin-bottom: 14px; }
    .legend { font-size: 11px; color: var(--soft); margin: 0 0 10px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin: 0 3px 0 10px; vertical-align: -1px; }
    .heat { display: grid; grid-template-columns: repeat(13, 1fr); gap: 4px; }
    .heat i { aspect-ratio: 1; border-radius: 3px; background: #F0F3F6; cursor: default; }
    .mtx { display: grid; gap: 3px; margin-top: 4px; }
    .mtx i { height: 12px; border-radius: 2px; background: #F0F3F6; }
    .heat i { max-height: 26px; }
    .rowlbl { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--soft); margin: 7px 0 3px; }
    .todo { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .todo .t { font-size: 12.5px; font-weight: 800; color: var(--soft); }
    .chip { border: 1px solid var(--line); border-radius: 8px; padding: 7px 14px; font-size: 13px; font-weight: 700; background: var(--panel); }
    .chip small { display: block; font-weight: 500; color: var(--soft); font-size: 11px; }
    .chip.now { border-color: var(--ind); background: var(--ind-soft); }

    /* ── 통합 시험 범위 — 과 선택·과별 진도·시험 결과 회고 ── */
    .packseg { display: flex; gap: 4px; padding: 9px 12px 3px; flex: none; flex-wrap: wrap; }
    .packseg button { min-height: 44px; min-width: 52px; padding: 0 13px; border-radius: 8px; border: 1px solid var(--line);
      background: var(--panel); font-size: 13.5px; font-weight: 800; color: var(--soft); }
    .packseg button.on { border-color: var(--ind); background: var(--ind-soft); color: var(--ind); }
    .packrow { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
      padding: 9px 10px; border-bottom: 1px solid #EFF2F5; min-height: 44px; border-radius: 8px; }
    .packrow:last-child { border-bottom: none; }
    .packrow.on { background: var(--ind-soft); }
    .packrow .pl { flex: 0 0 92px; font-weight: 800; font-size: 13.5px; }
    .packrow .pl small { display: block; font-weight: 400; font-size: 11px; color: var(--soft);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .packrow .pv { flex: 1; font-size: 12.5px; color: var(--soft); display: flex; gap: 14px; flex-wrap: wrap; }
    .packrow .pv b { color: var(--ink); font-family: var(--mono); font-weight: 700; }
    .rescard { border-color: var(--ind); }
    .rescard .rs { font-family: var(--mono); font-size: 26px; font-weight: 700; letter-spacing: -.03em; }
    .rechips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

    /* ── 작업 지면 (오른쪽 상세) ── */
    .wh { display: flex; align-items: baseline; gap: 10px; margin: 0 0 12px; flex-wrap: wrap; }
    .wh h2 { font-size: 16px; font-weight: 900; margin: 0; }
    .stagesteps { margin-left: auto; display: flex; gap: 5px; align-items: center; }
    .stagesteps em { font-style: normal; width: 22px; height: 22px; border-radius: 6px; background: #E9EDF2;
      display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 11.5px; color: var(--soft); }
    .stagesteps em.dn { background: var(--green); color: #fff; }
    .stagesteps em.on { background: var(--ind); color: #fff; }
    .chunkline { margin: 4px 0; padding: 7px 11px; border-radius: 7px; background: var(--bg); font-size: 13.5px; }
    .chunkline .ko { color: var(--soft); font-size: 12px; display: block; }
    .chunkline.miss { background: var(--red-soft); }

    /* ── 러너 (훈련 실행 — 전체 화면 집중 지면) ── */
    .runner { position: fixed; inset: 0; z-index: 60; background: var(--bg); overflow-y: auto; display: none; }
    .runner.open { display: block; }
    .runner .rshell { max-width: 760px; margin: 0 auto; padding: 14px 18px 40px; }
    .rtop { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .rtop .prog { flex: 1; }
    .rtop .quit { flex: none; font-size: 1.15rem; color: var(--soft); padding: 4px 10px; min-width: 44px; min-height: 44px;
      display: inline-flex; align-items: center; justify-content: center; }
    /* 문항 신고 — 팩은 PDF에서 추출해 만들어서 오탈자가 남는다. 학생이 발견한 것이 정오표가 된다.
       눈에 띄지 않게 두되 늘 같은 자리에 있어야 수업 중에 망설이지 않고 누른다. */
    .rtop .flag { flex: none; font-size: 1rem; font-weight: 800; color: var(--soft); padding: 4px 10px;
      min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }
    .rtop .flag.on { color: var(--ind); }
    .flagbox { border-top: 1px solid var(--line); padding: 14px 16px 18px; background: #FAFBFC; }
    .flagbox .ft { margin: 0 0 10px; font-size: 14px; font-weight: 700; }
    .flagbox .frow { display: flex; flex-wrap: wrap; gap: 8px; }
    .flagbox .frow button { min-height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px;
      background: #fff; font-size: 14px; }
    .flagbox .frow button.sel { border-color: var(--ind); background: var(--b1); font-weight: 700; }
    .flagbox input { display: block; width: 100%; margin: 12px 0 0; padding: 12px; font-size: 16px;
      border: 1px solid var(--line); border-radius: 10px; }
    .flagbox .frow2 { display: flex; gap: 8px; margin-top: 12px; }
    .bar2 { height: 5px; background: #E5E9EF; border-radius: 3px; overflow: hidden; }
    .bar2 i { display: block; height: 100%; background: var(--ind); }
    .q { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; }
    .q .qmeta { font-size: 12px; font-weight: 800; color: var(--soft); margin-bottom: 10px; }
    .q .prompt { font-size: 1.2rem; font-weight: 800; color: var(--ink); margin: 4px 0 16px; line-height: 1.6; }
    .q .prompt.sm { font-size: 1.02rem; font-weight: 500; }
    .choices { display: flex; flex-direction: column; gap: 8px; }
    .choices button { text-align: left; background: var(--panel); border: 1px solid var(--line);
      border-radius: 9px; padding: 12px 15px; font-weight: 500; font-size: 15px; min-height: 44px; }
    .choices button.sel { border-color: var(--ind); background: var(--ind-soft); }
    .choices button.right { border-color: var(--green); background: var(--green-soft); }
    .choices button.wrongpick { border-color: var(--red); background: var(--red-soft); }
    /* 입력 폰트 16px 이상 — iOS가 포커스 시 화면을 확대하지 않게 */
    .blankline { display: inline-block; min-width: 74px; border: none; border-bottom: 2px solid var(--ind);
      background: transparent; padding: 2px 6px; margin: 0 2px; text-align: center; font-weight: 700; font-size: 16px; }
    input.ans, textarea.ans { font-size: 16px; }
    .blankline.ok { border-color: var(--green); color: var(--green); }
    .blankline.bad { border-color: var(--red); color: var(--red); }
    .hintko { font-size: 11px; color: var(--amber); display: inline-block; margin: 0 2px; }
    .tokens { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .tokens button { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 8px 13px; min-height: 44px; font-weight: 600; }
    .tokens button:disabled { opacity: .3; }
    .built { min-height: 48px; background: var(--bg); border: 1px dashed #C9D1DB; border-radius: 9px;
      padding: 8px 10px; display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .built button { background: var(--panel); border: 1px solid var(--ind); border-radius: 7px; padding: 6px 11px; min-height: 44px; font-weight: 600; }
    textarea.ans { width: 100%; min-height: 96px; border: 1px solid var(--line); border-radius: 9px;
      padding: 11px 13px; background: var(--panel); resize: vertical; }
    input.ans { width: 100%; border: 1px solid var(--line); border-radius: 9px; padding: 11px 13px; background: var(--panel); }
    .result { margin-top: 14px; border-radius: 9px; padding: 12px 15px; font-size: 14px; border: 1px solid transparent; }
    .result.good { background: var(--green-soft); border-color: var(--green); }
    .result.bad { background: var(--red-soft); border-color: var(--red); }
    .result b.mark { font-weight: 800; }
    .result .exp { margin-top: 6px; color: var(--soft); font-size: 13px; }
    .confrow { display: flex; gap: 8px; margin-top: 14px; }
    .confrow button { flex: 1; border: 1px solid var(--line); border-radius: 9px; padding: 10px 4px;
      font-size: 13.5px; font-weight: 700; background: var(--panel); min-height: 44px; }
    .confrow .cl { font-size: 11px; color: var(--soft); display: block; font-weight: 500; }
    .rnext { margin-top: 14px; }
    .diffline { margin: 6px 0; padding: 9px 11px; border-radius: 7px; font-size: 13.5px; background: var(--bg); }
    .diffline.ok { background: var(--green-soft); } .diffline.partial { background: var(--amber-soft); }
    .diffline.missing { background: var(--red-soft); }
    .diffline .d-missing { color: var(--red); text-decoration: underline; }
    .diffline .d-extra { color: var(--amber); text-decoration: line-through; }
    .diffline .lbl { font-size: 11px; font-weight: 800; margin-right: 6px; font-family: var(--mono); }
    .paperbtn { border: 1px solid var(--line); border-radius: 6px; padding: 2px 11px; font-weight: 800; min-width: 44px; min-height: 44px; }
    .paperbtn.y { background: var(--green-soft); border-color: var(--green); color: var(--green); }
    .paperbtn.n { background: var(--red-soft); border-color: var(--red); color: var(--red); }
    .typerow { display: flex; align-items: center; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--line); }
    .typerow:last-child { border-bottom: none; }
    .typerow .tt { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; }
    .typerow .tt small { display: block; font-weight: 400; color: var(--soft); font-size: 11.5px; }

    /* ── 본문 암기 재설계 — 뜻 세우기 · 영어 얹기 · 굳히기 ──
       못 읽는 학생이 첫날 오를 수 있는 사다리를 위한 화면들. 한글 청크는 언제나 영어 자리와
       짝지어 보인다(한글만 있는 화면을 만들지 않는다). */
    .zonehd { padding: 7px 14px 3px; font-size: 10.5px; font-weight: 800; color: var(--ind);
      letter-spacing: .02em; background: #FAFBFE; border-bottom: 1px solid #EFF2F5; }
    .row.lk { opacity: .62; cursor: default; }
    .row .why { display: block; font-size: 10.5px; color: var(--amber); font-weight: 700; white-space: normal; }
    /* 단서 농도 표시 — "지금은 힌트 단계, 맞히면 힌트가 줄어요" */
    .cuebar { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700;
      color: var(--soft); margin: 0 0 12px; flex-wrap: wrap; }
    .cuebar b { color: var(--amber); }
    .cuebar .dots { display: inline-flex; gap: 3px; }
    .cuebar .dots i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #E1E6EC; }
    .cuebar .dots i.on { background: var(--amber); }
    /* 청크 짝 맞추기 — 왼쪽 영어, 오른쪽 한글. 탭 → 탭으로 잇는다(끌기 없음: 태블릿에서 안정적) */
    .pairs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0 0; }
    .pairs .col { display: flex; flex-direction: column; gap: 8px; }
    .pairs .cl { font-size: 10.5px; font-weight: 800; color: var(--soft); }

    .pgbars { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
    .pgbars > div { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
    .pgbars .n { font-family: var(--mono); font-size: 22px; font-weight: 700; letter-spacing: -.03em; }
    .pgbars .l { font-size: 11.5px; color: var(--soft); font-weight: 700; }

    /* ── 반응형: 세로 패드·폰 — 목록이 위로 접힌다 ── */
    @media (max-width: 880px) {
      .wrap { flex-direction: column; }
      .list { width: 100%; max-height: 38vh; border-right: none; border-bottom: 1px solid var(--line); }
      .boards { grid-template-columns: 1fr; }

    }

<script>
'use strict';
/* WB 내신브레인 — 중학생 전용, 태블릿 우선.
   레이아웃: D 스플릿 워크스페이스(좌 목록 + 우 지면) + E 프로그레스 보드(홈).
   훈련 실행은 전체 화면 집중 지면(러너). 엔진·채점·생성 모듈은 순수 로직 그대로. */
(function () {
  /* 저장 키는 학생 코드별이다 — 공용 태블릿에서 앞 학생의 기록이 다음 학생에게 섞이지 않게.
     미연동 기기는 'wbn.v1:demo'. 옛 단일 키 'wbn.v1'은 부팅 때 1회 이관한다. */
  var KEY = 'wbn.v1:demo', LEGACY_KEY = 'wbn.v1';
  /* 팩 캐시는 시험 범위 전체다 — 실제 시험은 보통 2~3개 과라 '마지막 교재' 하나만 캐시하면
     오프라인에서 범위의 나머지 과가 통째로 사라진다. 옛 단일 키('wbn.pack')는 부팅 때 이관한다. */
  var PACKS_CACHE_KEY = 'wbn.packs', LEGACY_PACK_CACHE_KEY = 'wbn.pack';
  var DEMO_PACK_ID = 'sample-demo-L0';
  var $ = function (id) { return document.getElementById(id); };
  var pack = null, DB = null, view = 'home';
  var PACKS = {};              // 시험 범위 팩 전부 {packId: pack} — pack 은 그중 '지금 보는 과'
  var authed = false, examServer = null, packList = [];
  var selSeq = null, selWordId = null, selType = null, selDlg = null;
  /* 본문 탭에서 문장이 아닌 항목을 고른 상태 — {kind:'chunk'|'para'|'cum'|'check', day, i}.
     null 이면 selSeq(문장)가 지면의 주인이다. */
  var selPass = null;
  var wordFilter = 'all';      // 단어 목록 필터 — 'unfinished' 는 회고 칩에서 들어온 미완성만 보기
  var taskServer = null, resultServer = null;
  var offlineMode = false;     // 연동 기기인데 서버가 닿지 않아 마지막 교재 캐시로 여는 중
  var demoMode = false;        // 체험 교재(pack-sample)로 열린 상태 — 미연동 기기 또는 배정 전 연습
  var DUMP_MAX = 20, LOG_MAX = 50;   // 기록 상한 — state 256KB 계약을 넘기지 않기 위해

  /* ── 저장소·동기화 ──
     save()   : 로컬 쓰기만(savedAt 안 올림) — 원격에서 받아 적거나 서버 값 반영 같은 '내 학습이 아닌' 변경
     persist(): 학습 결과 — savedAt 갱신 + 팩별 savedAt + 서버 push 예약 */
  function loadDB() { try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) {} }
  /* 이번 persist 에서 savedAt 을 올려야 할 과들. 통합 범위 학습은 한 세션에서 여러 과의 단어를
     같이 푼다 — 현재 과만 올리면 다른 과의 기록이 '오래된 것'으로 남아 다른 기기의 옛 기록에
     덮인다(pullAdopt 는 팩별 savedAt 으로 병합한다). */
  var touchedPacks = {};
  function touchPack(pid) { if (pid != null) touchedPacks[pid] = 1; }
  function persist() {
    DB.savedAt = Date.now();
    if (pack) touchPack(pack.packId);
    Object.keys(touchedPacks).forEach(function (pid) {
      var pd = DB.packs[pid];
      if (!pd) return;
      pd.savedAt = DB.savedAt;
      if (pd.dump.length > DUMP_MAX) pd.dump = pd.dump.slice(-DUMP_MAX);
      if (pd.log.length > LOG_MAX) pd.log = pd.log.slice(-LOG_MAX);
    });
    touchedPacks = {};
    save();
    scheduleSync();
  }
  /* cumulative·check·senMiss 는 본문 암기의 팩 저장소 기록(§3.5) — 상태(states)가 아니라
     "이 교재에서 무엇을 어디까지 밟았는가"의 기록이다. */
  function blankPd() { return { states: {}, diagDone: false, wrong: {}, dump: [], paper: {}, taskLog: {}, log: [], exam: null, cumulative: {}, check: null, senMiss: {}, savedAt: 0 }; }
  var orphanPd = null;
  function curPackId() { return pack ? pack.packId : null; }
  /* 과별 학습 기록. 인자를 생략하면 '지금 보는 과' — 통합 범위 세션은 문항의 packId 로 부른다. */
  function packDB(pid) {
    if (pid == null) pid = curPackId();
    if (pid == null) return (orphanPd || (orphanPd = blankPd()));   // 팩 로드 전 호출 — DB에 남기지 않는다
    var pd = DB.packs[pid];
    if (!pd) pd = DB.packs[pid] = blankPd();
    /* 옛 기록엔 나중에 생긴 필드가 없다 — 접근할 때마다 보정해 호출부가 || {} 를 안 쓰게 */
    if (!pd.states || typeof pd.states !== 'object') pd.states = {};
    if (!pd.wrong || typeof pd.wrong !== 'object') pd.wrong = {};
    if (!Array.isArray(pd.dump)) pd.dump = [];
    if (!pd.paper || typeof pd.paper !== 'object') pd.paper = {};
    if (!pd.taskLog || typeof pd.taskLog !== 'object') pd.taskLog = {};
    if (!Array.isArray(pd.log)) pd.log = [];
    if (pd.exam === undefined) pd.exam = null;
    if (!pd.cumulative || typeof pd.cumulative !== 'object') pd.cumulative = {};
    if (pd.check !== null && (!pd.check || typeof pd.check !== 'object')) pd.check = null;
    if (!pd.senMiss || typeof pd.senMiss !== 'object') pd.senMiss = {};
    return pd;
  }
  /* 오답 항목엔 엔진 상태 객체를 넣지 않는다(크기·혼동) — 옛 항목의 state는 날짜 배열만 남기고 걷어낸다 */
  function tidyPack(pd) {
    var n = 0;
    Object.keys(pd.wrong).forEach(function (k) {
      var e = pd.wrong[k];
      if (!e || typeof e !== 'object') { delete pd.wrong[k]; n += 1; return; }
      if (e.state) { e.wrongClearDates = (e.state.wrongClearDates || []).slice(); delete e.state; n += 1; }
      if (!Array.isArray(e.wrongClearDates)) { e.wrongClearDates = []; n += 1; }
    });
    return n;
  }
  function setLast(label, resume) { DB.last = { packId: pack.packId, label: label, resume: resume || null, at: Date.now() }; }
  function auth() { try { return JSON.parse(localStorage.getItem('wbr.auth') || 'null'); } catch (e) { return null; } }
  function api(path, opt) {
    var a = auth();
    if (!a || !a.token) return Promise.reject(new Error('no-auth'));
    return fetch('/api/naesin' + path, Object.assign({
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + a.token }
    }, opt || {})).then(function (r) {
      if (!r.ok) throw new Error('api-' + r.status);
      return r.json();
    });
  }
  /* 네트워크 단절(fetch 자체 실패)과 서버가 답한 오류(api-NNN)를 가른다 — 오프라인 캐시는 전자에만 쓴다 */
  function isNetErr(e) { return !(e && /^api-\d+$/.test(String(e.message || ''))); }

  /* 시험 범위 팩 캐시 — 연동 기기에서 팩 로드에 성공할 때마다 갱신. 연동 해제 시 함께 지운다.
     담는 것은 '지금 범위'뿐이다: 지난 학기 팩까지 쌓으면 localStorage 를 몇 MB씩 먹는다. */
  function cachePacks(entries) {
    var out = {};
    entries.forEach(function (e) { if (e && e.pack && e.pack.packId) out[e.id] = { pack: e.pack, updatedAt: e.updatedAt || null }; });
    try {
      localStorage.setItem(PACKS_CACHE_KEY, JSON.stringify(out));
      /* 옛 단일 캐시는 여기서 끝난다 — 남겨 두면 팩 하나(수백 KB~MB)가 영영 자리를 차지한다 */
      localStorage.removeItem(LEGACY_PACK_CACHE_KEY);
    } catch (e) {}
  }
  /* 캐시 읽기 — 옛 단일 키('wbn.pack')는 여기서 한 번 이관하고 지운다(업그레이드 직후 오프라인) */
  function loadPacksCache() {
    var out = null;
    try { out = JSON.parse(localStorage.getItem(PACKS_CACHE_KEY) || 'null'); } catch (e) { out = null; }
    if (!out || typeof out !== 'object') out = {};
    var legacy = null;
    try { legacy = JSON.parse(localStorage.getItem(LEGACY_PACK_CACHE_KEY) || 'null'); } catch (e) {}
    if (legacy && legacy.pack && legacy.pack.packId && !out[legacy.id || legacy.pack.packId]) {
      out[legacy.id || legacy.pack.packId] = { pack: legacy.pack, updatedAt: legacy.updatedAt || null };
      try { localStorage.setItem(PACKS_CACHE_KEY, JSON.stringify(out)); } catch (e) {}
    }
    try { localStorage.removeItem(LEGACY_PACK_CACHE_KEY); } catch (e) {}
    var ids = Object.keys(out).filter(function (id) { return out[id] && out[id].pack && out[id].pack.packId; });
    return ids.length ? out : null;
  }
  function clearPackCache() {
    try { localStorage.removeItem(PACKS_CACHE_KEY); localStorage.removeItem(LEGACY_PACK_CACHE_KEY); } catch (e) {}
  }

  /* 저장 상태 표시 — 실패는 다음 persist 때 자연히 재시도된다(push는 늘 전체 상태) */
  var saveStatus = 'saved';
  var SAVE_LABEL = { saved: ['저장됨', '학습 기록이 서버에 저장되었습니다'], pending: ['저장 대기', '3초 뒤 서버에 저장합니다'],
    failed: ['저장 실패', '서버에 저장하지 못했습니다 — 다음 학습 기록 때 다시 시도합니다'],
    toobig: ['기록 초과', '기록이 너무 커서 저장되지 않았습니다'] };
  function setSaveStatus(s) {
    saveStatus = s;
    var el = $('saveDot');
    if (!authed || demoMode) { el.hidden = true; return; }
    el.hidden = false;
    el.className = 'savedot ' + s;
    el.querySelector('span').textContent = SAVE_LABEL[s][0];
    el.title = SAVE_LABEL[s][1];
    if (s === 'toobig') showBanner('기록이 너무 커서 저장되지 않았습니다. 선생님께 알려 주세요.');
    else if (s === 'saved') showBanner('');
  }
  function showBanner(msg) { var b = $('topBanner'); b.textContent = msg; b.hidden = !msg; }

  var syncTimer = null;
  /* 체험 교재(배정 전 연습)는 서버에 올리지 않는다 — 관리 overview에 예시 교재 요약이 학생 기록으로 뜨면 안 된다 */
  function scheduleSync() {
    if (!authed || demoMode) return;
    setSaveStatus('pending');
    clearTimeout(syncTimer);
    syncTimer = setTimeout(pushState, 3000);
  }
  function n0(v) { v = Number(v); return isFinite(v) ? Math.round(v) : 0; }
  /* 관리 overview의 원천(계약 0.1) — 형태를 정확히 지킨다. 서버가 화이트리스트로 정규화한다. */
  function summaryOf() {
    var pd = packDB();
    var w = WBNAESIN.wordSummary(wordStates()), s = WBNAESIN.sentenceSummary(senStates());
    var task = null, dates = Object.keys(pd.taskLog).sort();
    if (dates.length) {
      var d = dates[dates.length - 1], tl = pd.taskLog[d] || {};
      task = { date: d, taskAt: String(tl.taskAt || ''), title: String(tl.title || '').slice(0, 80), correct: n0(tl.correct), total: n0(tl.total) };
    }
    var bs = s.byStage || {};
    return {
      packId: pack.packId,
      word: { total: n0(w.total), reached: n0(w.reached), stable: n0(w.stable), risky: n0(w.risky), needsSpellCheck: n0(w.needsSpellCheck) },
      sentence: { total: n0(s.total), interpreted: n0(s.interpreted), memorized: n0(s.memorized),
        byStage: { 1: n0(bs[1]), 2: n0(bs[2]), 3: n0(bs[3]), 4: n0(bs[4]), 5: n0(bs[5]), 6: n0(bs[6]) } },
      task: task,
      passage: passageSummaryOf(curPackId()) || undefined,
      range: rangeSummaryNow(),
      updatedAt: new Date().toISOString()
    };
  }
  /* 계약 R1 의 summary.range — 시험 범위 전체 합계 + 과별 값. 관리 현황판이 "시험 범위 100%"를
     한 단위로 보게 하는 값이라, 팩 하나만 열려 있어도(단일 범위) 같은 모양으로 낸다.
     엔진에 범위 API 가 없는 판(옛 engine.js)에서는 아예 붙이지 않는다 — 반쪽 모양을 올리면
     서버 정규화가 0으로 채운 값이 강사 화면에 진짜 숫자처럼 뜬다. */
  function rangeSummaryNow() {
    if (!WBNAESIN.rangeSummary || !pack) return undefined;
    var r = WBNAESIN.rangeSummary(rangeEntries());
    if (!(r && r.packIds && r.packIds.length)) return undefined;
    /* 본문 진행(§3.6)은 범위 합계로도 낸다 — 시험 범위가 재는 단위가 과 하나가 아니다.
       엔진판이 이미 넣어 줬으면 그것을 정본으로 둔다. */
    if (!r.passage) r.passage = passageSummaryRange();
    return r;
  }
  function pushState() {
    if (!authed || !pack || demoMode) return;
    var sentAt = DB.savedAt;
    var body = { state: { v: 1, owner: DB.owner || null, packs: DB.packs, last: DB.last || null, summary: summaryOf(), savedAt: DB.savedAt } };
    api('/state', { method: 'PUT', body: JSON.stringify(body) }).then(function () {
      if (DB.savedAt === sentAt) setSaveStatus('saved');   // 그 사이 새 persist가 있었으면 '대기'가 맞다
    }).catch(function (e) {
      setSaveStatus(e && e.message === 'api-413' ? 'toobig' : 'failed');
    });
  }
  /* 원격 채택은 팩 단위 — 팩별 savedAt이 더 새로운 것만 받는다. 다른 기기에서 다른 팩을
     공부한 기록이 이 기기의 팩 기록을 통째로 덮지 않는다. 러너가 열려 있으면 받지 않는다
     (진행 중인 세션이 참조하는 상태 객체가 바뀌면 안 된다). 반환: 무언가 바뀌었는가. */
  function pullState() {
    if (!authed) return Promise.resolve(false);
    return api('/state').then(function (r) {
      if ($('runner').classList.contains('open')) return false;
      var changed = pullAdopt(r && r.state);
      if (changed && pack) { tidyPack(packDB()); save(); }
      return changed;
    }).catch(function () { return false; });
  }
  /* 앱으로 돌아올 때(다른 탭·기기에서 공부하고 온 경우) 원격을 다시 받는다 — 러너 중엔 안 한다 */
  var lastWake = 0;
  function onWake() {
    if (!authed || !pack || offlineMode) return;
    if ($('runner').classList.contains('open')) return;
    if (Date.now() - lastWake < 5000) return;
    lastWake = Date.now();
    /* 저장 실패가 남아 있어도 받기부터 한다 — 곧장 올리면 그 사이 다른 기기가 올린 더 새로운 팩 기록이
       통째로 덮인다(push는 늘 DB 전체를 보낸다). 팩별 savedAt으로 병합한 뒤에 다시 올린다.
       시험 결과도 함께 받는다 — 강사가 수업 중에 점수를 넣으면 학생이 앱으로 돌아올 때 회고 카드가
       떠야 한다. 부팅 때만 받으면 새로고침 전까지 없는 것처럼 보인다. */
    Promise.all([
      pullState(),
      api('/result').then(function (rr) { resultServer = rr; return true; }).catch(function () { return false; }),
    ]).then(function (r) { if (r[0] || r[1]) render(); if (saveStatus === 'failed') pushState(); });
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') onWake(); });
  window.addEventListener('focus', onWake);

  /* ── 상태 접근 ── */
  function mkDialogueState(id, now) {
    var s = WBNAESIN.createState(id, 'dialogue', now);
    if (s.stage == null) s.stage = 1;   // 엔진이 dialogue에 stage를 안 붙이는 판이어도 3단계 사다리는 돈다
    return s;
  }
  /* 없는 상태만 만든다. 반환: 새로 만들거나 고친 수 — 0이면 부팅 때 persist(서버 push)할 이유가 없다 */
  function ensureStates(pid) {
    var p = packOf(pid);
    if (!p) return 0;
    var pd = packDB(p.packId), now = Date.now(), n = 0;
    (p.words || []).forEach(function (w) {
      if (!pd.states[w.id]) { pd.states[w.id] = WBNAESIN.createState(w.id, 'word', now); n += 1; }
    });
    (p.sentences || []).forEach(function (s) {
      var id = WBNAESIN.sentenceId(s.seq);
      if (!pd.states[id]) { pd.states[id] = WBNAESIN.createState(id, 'sentence', now); n += 1; }
    });
    /* 대화문 — 3단계(읽기→대화 완성→순서 배열), stage 4 도달 = 완료. kind 'dialogue'는 본문 문장
       집계(해석·백지)에 섞이지 않는다 — 옛 기록의 'sentence' 대화문은 여기서 이관한다. */
    (p.dialogues || []).forEach(function (d) {
      var id = 'd-' + d.id, cur = pd.states[id];
      if (!cur) { pd.states[id] = mkDialogueState(id, now); n += 1; }
      else if (cur.kind !== 'dialogue') { cur.kind = 'dialogue'; if (cur.stage == null) cur.stage = 1; n += 1; }
    });
    /* 단락 단위 트랙 — 청크(뜻 세우기)와 단락 관문(굳히기). 문장이 없는 팩이면 만들지 않는다. */
    dayGroupsOf(p).forEach(function (gr) {
      var ci = ckId(gr.day), pi = pgId(gr.day);
      if (!pd.states[ci]) { pd.states[ci] = mkTrackState(ci, 'chunk', now); n += 1; }
      else if (pd.states[ci].kind !== 'chunk') { pd.states[ci].kind = 'chunk'; if (pd.states[ci].stage == null) pd.states[ci].stage = 1; n += 1; }
      if (!pd.states[pi]) { pd.states[pi] = mkTrackState(pi, 'para', now); n += 1; }
      else if (pd.states[pi].kind !== 'para') { pd.states[pi].kind = 'para'; if (pd.states[pi].stage == null) pd.states[pi].stage = 1; n += 1; }
    });
    n += tidyPack(pd);
    return n;
  }
  /* 범위 전체의 상태를 만든다 — 홈의 범위 합계·범위 플랜은 아직 한 번도 열지 않은 과의
     단어·문장까지 세야 "시험 범위 100%"가 실제 시험 단위와 맞는다. */
  function ensureStatesAll() {
    var n = 0;
    rangeIds().forEach(function (id) { n += ensureStates(id); });
    return n;
  }
  function dlgState(id, pid) { return packDB(pid).states['d-' + id]; }
  function dlgById(id) { for (var i = 0; i < (pack.dialogues || []).length; i++) if (pack.dialogues[i].id === id) return pack.dialogues[i]; return null; }
  function dlgDone(st) { return st && st.stage >= 4; }
  var DLG_STAGES = { 1: '대역 읽기', 2: '대화 완성', 3: '순서 배열' };
  function statesOfKind(kind, pid) {
    var pd = packDB(pid), out = {};
    Object.keys(pd.states).forEach(function (k) { if (pd.states[k] && pd.states[k].kind === kind) out[k] = pd.states[k]; });
    return out;
  }
  function wordStates(pid) { return statesOfKind('word', pid); }
  function senStates(pid) { return statesOfKind('sentence', pid); }
  function senState(seq, pid) { return packDB(pid).states[WBNAESIN.sentenceId(seq)]; }

  /* ══ 본문 암기 — 청크 트랙(뜻 세우기) · 단락 관문(굳히기) ══
     kind 'chunk'·'para' 는 statesOfKind 가 kind 로 거르므로 단어·문장 집계에 섞이지 않는다
     (지금 'dialogue' 가 빠지는 것과 같다). 진행은 passage 요약이 따로 센다(§3.6). */
  function ckId(day) { return 'ck-' + day; }
  function pgId(day) { return 'pg-' + day; }
  function mkTrackState(id, kind, now) {
    var s = WBNAESIN.createState(id, kind, now);
    if (s.stage == null) s.stage = 1;   // 엔진이 이 kind 에 사다리를 안 붙이는 판이어도 트랙은 돈다
    if (s.cue == null) s.cue = 1;
    return s;
  }
  function ckState(day, pid) { return packDB(pid).states[ckId(day)]; }
  function pgState(day, pid) { return packDB(pid).states[pgId(day)]; }
  /* 단계는 정수로만 읽는다 — 옛 기록의 4.5 같은 값이 화면 분기를 어긋나게 하지 않게 */
  function stageNum(st) { var n = Math.floor(+(st && st.stage)); return n >= 1 ? n : 1; }
  function groupOfDay(day, pid) {
    var gs = dayGroupsOf(packOf(pid) || pack);
    for (var i = 0; i < gs.length; i++) if (gs[i].day === day) return gs[i];
    return null;
  }

  /* 단서 농도(§3.3) — 엔진판이 있으면 그것이 정본이고, 없으면 앱이 같은 계약으로 읽고 쓴다 */
  function cueOf(st) {
    if (WBNAESIN.cueOf) { try { var v = WBNAESIN.cueOf(st); if (isFinite(v)) return Math.max(0, Math.min(3, Math.floor(v))); } catch (e) {} }
    var c = Math.floor(+(st && st.cue));
    return isFinite(c) && c >= 0 ? Math.min(3, c) : 1;
  }
  /* 통과하면 단서 한 칸 소거, 틀리면 한 칸 증가(최대 3) — 단계는 그대로다.
     엔진 recordCue 가 있으면 먼저 부르고, 그것이 값을 안 움직였을 때만 계약대로 앱이 맞춘다
     (엔진이 더 똑똑하게 움직이면 그 판단을 존중한다). */
  function bumpCue(st, passed, now) {
    if (!st) return 1;
    var before = cueOf(st);
    if (WBNAESIN.recordCue) { try { WBNAESIN.recordCue(st, passed, now); } catch (e) {} }
    if (cueOf(st) === before) st.cue = passed ? Math.max(0, before - 1) : Math.min(3, before + 1);
    return cueOf(st);
  }
  function isFadedStage(stage) {
    if (WBNAESIN.isCueStage) { try { return !!WBNAESIN.isCueStage(stage); } catch (e) {} }
    return !!FADED_STAGES[stage];
  }
  /* 문장 사다리 한 세트의 결과 반영.
     단서 단계(1·3·5)는 recordCue 하나만 부른다 — 그 함수가 단서 소거와 진급을 함께 처리한다.
     recordCue 와 advanceStage(faded)를 둘 다 부르면 한 번의 통과가 두 번 세어진다.
     단서 없는 단계(2·4·6)는 예전처럼 advanceStage 한 번이다. */
  function applyLadder(st, passed, now, session) {
    if (!st) return;
    var stage = stageNum(st);
    if (st.reached || !isFadedStage(stage)) {
      WBNAESIN.advanceStage(st, passed, now, { session: session, fromStage: stage });
      return;
    }
    if (WBNAESIN.recordCue) { WBNAESIN.recordCue(st, passed, now, { session: session, fromStage: stage }); return; }
    /* 엔진에 recordCue 가 없는 판 — 같은 계약(§3.3)을 앱이 지킨다 */
    if (passed && cueOf(st) === 0) {
      WBNAESIN.advanceStage(st, true, now, { session: session, fromStage: stage });
      st.cue = 1;
      return;
    }
    st.last = now;
    bumpCue(st, passed, now);
  }
  /* 청크 트랙·단락 관문 진급 — 3단이고 3단 통과가 그 트랙의 reached다.
     엔진 advanceStage 가 stageMaxOf 로 트랙별 최고 단계를 알면 그것이 정본이다. */
  function trackAdvance(st, passed, max, now) {
    if (!st) return;
    if (WBNAESIN.stageMaxOf) {
      try {
        if (WBNAESIN.stageMaxOf(st) === max) {
          WBNAESIN.advanceStage(st, passed, now, { fromStage: stageNum(st) });
          return;
        }
      } catch (e) {}
    }
    st.last = now;
    if (!passed || st.reached) return;
    var cur = stageNum(st);
    if (cur < max) { st.stage = cur + 1; st.stageAdvancedAt = now; return; }
    st.stage = max; st.reached = true;
    if (st.reachedAt == null) st.reachedAt = now;
  }

  /* ── 게이트(§3.4) — 엔진판을 먼저 쓰고, 없으면 같은 판정을 앱이 한다 ── */
  function ckGate(day, pid) {
    var p = packOf(pid) || pack;
    if (WBNAESIN.chunkGate) {
      try { var r = WBNAESIN.chunkGate(p, packDB(pid).states, day); if (r && typeof r === 'object') return r; if (typeof r === 'boolean') return { open: r }; } catch (e) {}
    }
    var gr = groupOfDay(day, pid);
    var hasCk = !!(gr && gr.sentences.some(function (s) { return (s.chunks || []).length; }));
    if (!hasCk) return { open: true, reason: 'no-chunk' };   // 열 방법이 없는 자물쇠는 걸지 않는다
    var st = ckState(day, pid);
    return { open: !!(st && st.reached), reason: (st && st.reached) ? 'reached' : 'chunk-gate', stage: st ? stageNum(st) : 1 };
  }
  function pgStageGate(day, need, pid) {
    var p = packOf(pid) || pack;
    if (WBNAESIN.paraGate) {
      try { var r = WBNAESIN.paraGate(p, packDB(pid).states, day, need); if (r && typeof r === 'object') return r; if (typeof r === 'boolean') return { open: r }; } catch (e) {}
    }
    var gr = groupOfDay(day, pid);
    if (!gr || !gr.sentences.length) return { open: false, done: 0, total: 0, need: need };
    var done = 0;
    gr.sentences.forEach(function (s) {
      var st = senState(s.seq, pid);
      var n = st ? (st.reached ? 6 : stageNum(st)) : 1;
      if (n >= need) done += 1;
    });
    return { open: done >= gr.sentences.length, done: done, total: gr.sentences.length, need: need };
  }
  /* 그 단락 백지가 끝났는가 = 문장이 전부 reached. 누적·종합이 열리는 조건의 단위다. */
  function paraBlankDone(gr, pid) {
    return !!(gr && gr.sentences.length && gr.sentences.every(function (s) { var st = senState(s.seq, pid); return st && st.reached; }));
  }
  /* 엔진 passageCandidates 와 같은 눈 — 단락 관문(pg)이 3단(단락 백지)까지 reached 인가.
     관문 3단은 그 단락 문장이 모두 백지를 통과했을 때만 reached 가 된다(startBlank). */
  function allParasDone(pid) {
    var gs = dayGroupsOf(packOf(pid) || pack);
    return gs.length > 0 && gs.every(function (gr) {
      var st = pgState(gr.day, pid);
      return !!(st && st.reached);
    });
  }
  /* 누적 백지 단계 — 1일차 → 1+2일차 → … → 전체. 앞 칸을 밟아야 다음 칸이 열린다. */
  function cumSteps(pid) {
    var gs = dayGroupsOf(packOf(pid) || pack), pd = packDB(pid), rec = pd.cumulative || {};
    var out = [];
    for (var i = 0; i < gs.length; i++) {
      var lastDay = gs[i].day;
      out.push({ i: i, lastDay: lastDay, days: gs.slice(0, i + 1).map(function (g) { return g.day; }),
        rec: rec[lastDay] || null, open: i === 0 ? true : !!rec[gs[i - 1].day] });
    }
    return out;
  }
  function cumReachedCount(pid) {
    var steps = cumSteps(pid), n = 0;
    steps.forEach(function (s, i) { if (s.rec) n = i + 1; });
    return n;
  }
  /* 상태 요약의 passage(§3.6) — 엔진판이 있으면 그것을 쓰고, 없으면 같은 모양을 앱이 만든다 */
  function passageSummaryOf(pid) {
    var p = packOf(pid);
    if (!p) return null;
    var pd = packDB(pid);
    if (WBNAESIN.passageSummary) {
      try {
        var r = WBNAESIN.passageSummary(p, pd.states, { cumulative: pd.cumulative, check: pd.check });
        if (r && typeof r === 'object' && r.chunkTotal != null) return normPassage(r);
      } catch (e) {}
    }
    var gs = dayGroupsOf(p), ckDone = 0, blank = 0;
    gs.forEach(function (gr) {
      var ck = pd.states[ckId(gr.day)];
      if (ck && ck.reached) ckDone += 1;
      if (paraBlankDone(gr, pid)) blank += 1;
    });
    return normPassage({ chunkDone: ckDone, chunkTotal: gs.length, paraBlank: blank, paraTotal: gs.length,
      cumulative: cumReachedCount(pid), check: pd.check && isFinite(+pd.check.total) ? { correct: pd.check.correct, total: pd.check.total } : null });
  }
  function normPassage(r) {
    var chk = r.check && isFinite(+r.check.total) ? { correct: n0(r.check.correct), total: n0(r.check.total) } : null;
    return { chunkDone: n0(r.chunkDone), chunkTotal: n0(r.chunkTotal), paraBlank: n0(r.paraBlank),
      paraTotal: n0(r.paraTotal), cumulative: n0(r.cumulative), check: chk };
  }
  /* 범위 전체 합계 — 과가 여러 개인 시험 범위도 한 단위로 본다 */
  function passageSummaryRange() {
    var out = { chunkDone: 0, chunkTotal: 0, paraBlank: 0, paraTotal: 0, cumulative: 0, check: null };
    var cor = 0, tot = 0, any = false;
    rangeIds().forEach(function (id) {
      var r = passageSummaryOf(id);
      if (!r) return;
      out.chunkDone += r.chunkDone; out.chunkTotal += r.chunkTotal;
      out.paraBlank += r.paraBlank; out.paraTotal += r.paraTotal;
      out.cumulative += r.cumulative;
      if (r.check) { any = true; cor += r.check.correct; tot += r.check.total; }
    });
    if (any) out.check = { correct: cor, total: tot };
    return out;
  }
  /* 유효 시험 — 「자율 학습으로」 오버라이드가 있으면 서버 시험일이 있어도 연습 모드.
     시험은 범위 전체에 하나다 — 시험일·오버라이드도 범위의 모든 과에 같이 걸고 같이 푼다
     (성취도 탭 「적용」·「자율 학습으로」가 rangeIds() 를 돌며 쓴다). */
  function exam(pid) { var pd = packDB(pid); if (pd.examOverride === 'practice') return null; return pd.exam || null; }
  function examEnded() { var ex = exam(); return !!(ex && ex.examDate && WBNAESIN.daysUntil(ex.examDate, Date.now()) < 0); }
  /* 서버 시험 배정을 팩 기록에 반영 — 시험일이 바뀌었으면 학생의 자율 학습 오버라이드는 풀린다 */
  function applyServerExam(pid) {
    var ex = examServer;
    if (!ex || !ex.examDate) return;
    var pd = packDB(pid);
    if (pd.examOverride && pd.examOverrideFor !== ex.examDate) { delete pd.examOverride; delete pd.examOverrideFor; }
    var dl = Number(ex.wordDeadlineDays);
    pd.exam = { examDate: ex.examDate, wordDeadlineDays: (dl >= 3 && dl <= 30) ? Math.round(dl) : 7 };
  }
  function applyServerExamAll() { rangeIds().forEach(function (id) { applyServerExam(id); touchPack(id); }); }

  /* ── 통합 시험 범위(여러 과) ──
     packList = 서버가 준 시험 범위 순서, PACKS = 그중 실제로 열린 팩. 지금 보는 과(pack)는
     범위에 없을 수도 있다(체험 교재·오프라인 단일 캐시) — 그때도 자기 자신은 범위다. */
  function packOf(pid) {
    if (pid == null) return pack;
    if (PACKS[pid]) return PACKS[pid];
    return (pack && pack.packId === pid) ? pack : null;
  }
  function rangeIds() {
    var ids = packList.filter(function (id) { return !!PACKS[id]; });
    var cur = curPackId();
    if (cur && ids.indexOf(cur) < 0) ids.push(cur);
    return ids;
  }
  /* 엔진 범위 API(planRange·gateRange·rangeSummary)의 입력 — [{packId, pack, states}] 범위 순서 */
  function rangeEntries() {
    /* rec — 팩 저장소의 누적 백지·종합 Check 기록(§3.5). 엔진 플랜이 "다음 누적은 어디까지인가"를
       이 값으로 안다. 없으면 누적은 미시작으로 본다. */
    return rangeIds().map(function (id) {
      var pd = packDB(id);
      return { packId: id, pack: packOf(id), states: pd.states, rec: { cumulative: pd.cumulative, check: pd.check } };
    }).filter(function (e) { return !!e.pack; });
  }
  function isRange() { return rangeIds().length > 1; }
  /* 과 표시명 — 학생이 아는 단위는 packId 가 아니라 'L6' 이다 */
  function lessonLabel(pid) {
    var p = packOf(pid);
    var l = p && p.lesson;
    return (l != null && l !== '') ? ('L' + l) : String(pid);
  }
  function lessonTitle(pid) {
    var p = packOf(pid);
    return p ? String(p.lessonTitle || p.textbook || '') : '';
  }
  /* 세 탭의 목록 창 맨 위 과 선택 — 통합 범위에서 '지금 보는 과'를 바꾸는 유일한 상시 입구 */
  function packSegHtml() {
    var ids = rangeIds();
    if (ids.length <= 1) return '';
    return '<div class="packseg" role="group" aria-label="시험 범위 과 선택">' + ids.map(function (id) {
      return '<button type="button" data-pks="' + esc(id) + '"' + (id === curPackId() ? ' class="on" aria-current="true"' : '') +
        ' title="' + esc(lessonTitle(id)) + '">' + esc(lessonLabel(id)) + '</button>';
    }).join('') + '</div>';
  }
  /* 최근 학습 로그(핵심표현·문법 확인처럼 엔진 상태가 없는 학습) — 최근 50건 */
  function logEvent(t, type, ref, ok, pid) {
    var pd = packDB(pid);
    pd.log.push({ t: t, type: type, ref: ref, ok: !!ok, at: new Date().toISOString() });
    if (pd.log.length > LOG_MAX) pd.log = pd.log.slice(-LOG_MAX);
    touchPack(pid == null ? curPackId() : pid);
  }
  /* pid 를 주면 그 과에서 찾는다 — 통합 범위 세션의 문항은 다른 과 것일 수 있다 */
  function wordById(id, pid) {
    var p = packOf(pid), ws = (p && p.words) || [];
    for (var i = 0; i < ws.length; i++) if (ws[i].id === id) return ws[i];
    return null;
  }
  function senBySeq(seq, pid) {
    var p = packOf(pid), ss = (p && p.sentences) || [];
    for (var i = 0; i < ss.length; i++) if (ss[i].seq === seq) return ss[i];
    return null;
  }
  function dayGroups() { return dayGroupsOf(pack); }

     packOf(pid) 로 다른 과의 단락도 세야 범위 합계(passage 요약)가 맞는다. */
  function dayGroupsOf(p) {

  var PARA_STEP_NO = { summary: 1, odd: 2, blank: 3 };

        (w.definition ? '<div class="chunkline">' + esc(w.definition.en) + '<span class="ko">' + esc(w.definition.ko) + '</span></div>' : '') +
        ((w.senses || []) || []).map(function (sn) {
          return '<div class="chunkline">[의미 ' + sn.senseNo + '] ' + esc(sn.meaningKo) + (sn.example ? '<span class="ko">' + esc(sn.example.en) + ' — ' + esc(sn.example.ko) + '</span>' : '') + '</div>';
        }).join('') +
        ((w.synonyms || []).length ? '<p class="muted">유의어: ' + esc(w.synonyms.join(', ')) + '</p>' : '') +
        ((w.antonyms || []).length ? '<p class="muted">반의어: ' + esc(w.antonyms.join(', ')) + '</p>' : '') +
        '</div>';
    } else {
      workHtml += '<p class="muted">왼쪽 목록에서 단어를 선택하면 상세 정보가 표시됩니다.</p>';
    }
    layoutSplit(listHtml, workHtml);
    $('wRows').onclick = function (e) {
      var r = e.target.closest('.row[data-w]');
      if (r) { selWordId = r.getAttribute('data-w'); render(); }
    };
    $('wFilter').onclick = function () { wordFilter = wordFilter === 'unfinished' ? 'all' : 'unfinished'; render(); };
    $('trainWords').onclick = startWordDaily;
  }

  /* ════════ 본문 암기 (스플릿) ════════ */
  function stageSteps(stage, done) {
    var h = '<span class="stagesteps">';
    for (var i = 1; i <= 6; i++) {
      var cls = done ? 'dn' : (i < stage ? 'dn' : (i === stage ? 'on' : ''));
      h += '<em class="' + cls + '">' + i + '</em>';
    }
    return h + '</span>';
  }
  function stgMini(stage, done) {
    var h = '<span class="stg" role="img" aria-label="' + (done ? '암기 완료' : stage + '단계') + '">';
    for (var i = 1; i <= 6; i++) h += '<i class="' + (done ? 'dn' : (i < stage ? 'dn' : (i === stage ? 'on' : ''))) + '"></i>';
    return h + '</span>';
  }
  /* ══ 본문 문항 생성 ══
     문항 생성기(gen.js)의 새 함수가 아직 없는 판에서도 학습이 멈추지 않게, 같은 계약의
     대체 생성기를 앱 안에 둔다. WBGEN 판이 있으면 그것을 쓰고 모양이 맞지 않을 때만
     대체본으로 내려간다 — 어느 쪽을 썼는지는 화면 한 줄로 남긴다(조용히 넘어가지 않는다). */
  var genFallback = {};
  function genNote(name) { genFallback[name] = 1; }
  function genNoteHtml() {
    var ks = Object.keys(genFallback);
    if (!ks.length) return '';
    return '<p class="muted" style="margin:6px 0 0">문항 생성기(' + esc(ks.join(', ')) + ')가 이 판에 없어 앱 내장 문항으로 진행합니다.</p>';
  }
  function shuffleNot(arr) {
    var a = (arr || []).slice();
    if (a.length < 2) return a;
    var s = WBGEN.shuffle(a, Math.random);
    if (s.join('|') === a.join('|')) s = WBGEN.shuffle(a, Math.random);
    return s;
  }
  /* 암기용 한글은 chunks[].ko(직독직해)다 — sentences[].ko(매끄러운 해석)는 한국어 어순이라
     영어 자리와 어긋난다. 표시용으로만 쓴다. */
  function chunksOfGroup(gr) {
    var out = [];
    (gr ? gr.sentences : []).forEach(function (s) {
      (s.chunks || []).forEach(function (c) {
        if (c && c.en && c.ko) out.push({ en: String(c.en), ko: String(c.ko), seq: s.seq });
      });
    });
    return out;
  }
  function chunkCountOf(gr) { return chunksOfGroup(gr).length; }

  /* ① 듣고 짝 맞추기 — 생성기는 한 판(4~5쌍)씩 준다. next 로 단락 전체를 덮는다. */
  function ckMatchItems(gr) {
    var out = [];
    if (WBGEN.chunkMatch) {
      try {
        var start = 0;
        for (var n = 0; n < 20; n++) {
          var q = WBGEN.chunkMatch(gr.sentences, Math.random, { start: start });
          if (!q || !Array.isArray(q.pairs) || q.pairs.length < 2) break;
          out.push({ type: 'ckmatch', pairs: q.pairs.map(function (x) { return { en: String(x.en), ko: String(x.ko) }; }) });
          if (q.next == null || q.next <= start) break;
          start = q.next;
        }
      } catch (e) { out = []; }
    }
    if (out.length) return out;
    if (WBGEN.chunkMatch) genNote('chunkMatch');
    var all = chunksOfGroup(gr);
    for (var i = 0; i < all.length; i += 5) {
      var part = all.slice(i, i + 5);
      if (part.length === 1 && out.length) { out[out.length - 1].pairs.push({ en: part[0].en, ko: part[0].ko }); break; }
      out.push({ type: 'ckmatch', pairs: part.map(function (c) { return { en: c.en, ko: c.ko }; }) });
    }
    return out.filter(function (q) { return q.pairs.length >= 2; });
  }
  /* ② 뜻 인출 — 생성기는 청크 하나씩 준다(opts.index). 단락의 청크를 차례로 돈다. */
  function ckMeanItems(gr) {
    var all = chunksOfGroup(gr), out = [];
    if (WBGEN.chunkMeaning) {
      try {
        for (var i = 0; i < all.length; i++) {
          var q = WBGEN.chunkMeaning(gr.sentences, Math.random, { index: i });
          if (!q || !Array.isArray(q.choices) || q.choices.length < 2 || q.answerKey == null) continue;
          q.type = 'ckmean';
          if (!q.ttsText) q.ttsText = q.prompt;
          out.push(q);
        }
      } catch (e) { out = []; }
    }
    if (out.length) return out;
    if (WBGEN.chunkMeaning) genNote('chunkMeaning');
    if (all.length < 2) return [];
    return all.map(function (c, i) {
      var pool = all.filter(function (x, j) { return j !== i && x.ko !== c.ko; });
      var texts = [c.ko].concat(rndPick(pool, 3, Math.random).map(function (w) { return w.ko; }));
      texts = WBGEN.shuffle(texts, Math.random);
      var chs = texts.map(function (t, k) { return { key: 'abcde'.charAt(k), text: t }; });
      var ans = chs.filter(function (o) { return o.text === c.ko; })[0];
      return { type: 'ckmean', prompt: c.en, ttsText: c.en, choices: chs, answerKey: ans ? ans.key : chs[0].key };
    });
  }
  /* ③ 순서 세우기 — 한글 청크를 직독직해 순서로. 영어 원문(enFull)을 늘 곁에 둔다. */
  function ckOrderItems(gr) {
    var out = [];
    (gr ? gr.sentences : []).forEach(function (s) {
      var q = null;
      if (WBGEN.chunkOrder) { try { q = WBGEN.chunkOrder(s, Math.random); } catch (e) { q = null; } }
      if (!q || !Array.isArray(q.answer) || q.answer.length < 2) {
        if (WBGEN.chunkOrder) genNote('chunkOrder');
        var kos = (s.chunks || []).map(function (c) { return c.ko; }).filter(Boolean);
        if (kos.length < 2) return;
        q = { shuffled: shuffleNot(kos), answer: kos, enFull: s.en };
      }
      out.push({ type: 'order', seq: s.seq, shuffled: (q.shuffled && q.shuffled.length ? q.shuffled : shuffleNot(q.answer)),
        answer: q.answer, hintText: q.enFull || s.en, ttsText: q.enFull || s.en, hintLabel: '영어 원문' });
    });
    return out;
  }
  /* 2단계 — 한글 청크를 순서대로 보여 주고 영어 청크를 배열. 철자를 한 자도 쓰지 않는다.
     영어 전문은 화면에도 소리에도 두지 않는다(그게 곧 정답이다) — 생성기가 enFull 을 빼는 이유. */
  function enChunkOrderItem(s) {
    var q = null;
    if (WBGEN.enChunkOrder) { try { q = WBGEN.enChunkOrder(s, Math.random); } catch (e) { q = null; } }
    var ens = (s.chunks || []).map(function (c) { return c.en; }).filter(Boolean);
    var kos = (s.chunks || []).map(function (c) { return c.ko; }).filter(Boolean);
    if (!q || !Array.isArray(q.answer) || q.answer.length < 2) {
      if (WBGEN.enChunkOrder) genNote('enChunkOrder');
      if (ens.length < 2) return null;
      q = { shuffled: shuffleNot(ens), answer: ens, koChunks: kos };
    }
    return { type: 'order', seq: s.seq, shuffled: (q.shuffled && q.shuffled.length ? q.shuffled : shuffleNot(q.answer)),
      answer: q.answer, hintText: (q.koChunks || kos).join(' / ') || s.ko, hintLabel: '한글 청크 순서' };
  }

  /* ── 단서 농도(§3.3) — 3 전사 · 2 첫 글자+글자 수 · 1 첫 글자 · 0 빈칸만 ──
     생성기가 빈칸마다 hint(화면 문자열)를, 문항에 showAnswer(불리언)+given(전문)을 실어 준다.
     생성기가 cue 를 모르는 옛 판일 때만 앱이 같은 모양을 만든다. */
  function cueHintOf(ans, cue) {
    var a = String(ans == null ? '' : ans);
    if (!a || cue >= 3 || cue <= 0) return '';
    if (cue === 2) return a.charAt(0) + '__ (' + a.replace(/\s/g, '').length + '자)';
    return a.charAt(0) + '__';
  }
  function applyCueParts(q, cue) {
    (q.parts || []).forEach(function (p) {
      if (!p || !p.blank) return;
      if (p.blank.hint == null && p.blank.ph == null) p.blank.ph = cueHintOf((p.blank.answers || [])[0], cue);
    });
    return q;
  }
  /* 1단계 줄 해석 — 영어 자리를 보며 한글 뜻을 채운다. 영어 입력이 한 글자도 없는 단계다. */
  function koBlankItem(s, cue) {
    var q = null;
    if (WBGEN.koBlanks) { try { q = WBGEN.koBlanks(s, cue); } catch (e) { q = null; } }
    if (!q || !Array.isArray(q.parts) || !q.parts.some(function (p) { return p && p.blank; })) {
      if (WBGEN.koBlanks) genNote('koBlanks');
      q = fallbackKoBlanks(s);
      if (q && cue >= 3) { q.showAnswer = true; q.given = String(s.ko || ''); }
    }
    if (!q) return null;
    q.type = 'koblank'; q.lang = 'ko'; q.seq = s.seq; q.cue = cue;
    if (q.enFull == null) q.enFull = s.en;
    if (!q.chunks) q.chunks = (s.chunks || []).slice();
    return applyCueParts(q, cue);
  }
  function fallbackKoBlanks(s) {
    var chunks = (s.chunks || []).filter(function (c) { return c && c.ko; });
    var text = chunks.length ? chunks.map(function (c) { return c.ko; }).join(' / ') : String(s.ko || '');
    if (!text) return null;
    var taken = [], spans = [];
    (s.keywords || []).forEach(function (kw) {
      var w = kw && kw.ko;
      if (!w) return;
      for (var p = text.indexOf(w); p >= 0; p = text.indexOf(w, p + 1)) {
        var free = taken.every(function (t) { return p >= t[1] || p + w.length <= t[0]; });
        if (free) { taken.push([p, p + w.length]); spans.push({ start: p, end: p + w.length, ans: w, en: kw.en }); return; }
      }
    });
    if (!spans.length) return null;
    spans.sort(function (a, b) { return a.start - b.start; });
    var parts = [], cur = 0;
    spans.forEach(function (sp) {
      if (sp.start > cur) parts.push({ text: text.slice(cur, sp.start) });
      parts.push({ blank: { answers: [sp.ans], hintEn: sp.en } });
      cur = sp.end;
    });
    if (cur < text.length) parts.push({ text: text.slice(cur) });
    return { type: 'koblank', parts: parts, enFull: s.en,
      chunks: chunks.map(function (c) { return { en: c.en || '', ko: c.ko }; }) };
  }
  /* 3단계 핵심어 빈칸(영어) */
  function kwBlankItem(s, cue) {
    var q = null;
    try { q = WBGEN.keywordBlanks(s, 'en', cue); } catch (e) { q = null; }
    if (!q) return null;
    q.seq = s.seq; q.cue = cue;
    if (cue >= 3 && q.given == null) { q.showAnswer = true; q.given = String(s.en || ''); }
    return applyCueParts(q, cue);
  }
  /* 5단계 줄 영작 — cue 3 은 모범 문장을 보여 주고 그대로 옮겨 쓰는 전사다 */
  function writeItem(s, cue) {
    var q = null;
    try { q = WBGEN.writingPrompt(s, cue); } catch (e) { q = null; }
    if (!q) return null;
    q.seq = s.seq; q.cue = cue;
    if (cue >= 3 && q.given == null) { q.showAnswer = true; q.given = String(s.en || ''); }
    if (q.hint == null && cue > 0 && cue < 3) {
      q.hint = String(s.en || '').split(/\s+/).map(function (w) {
        var core = w.replace(/[^A-Za-z']/g, '');
        if (!core) return w;
        return cue === 2 ? core.charAt(0) + new Array(core.length).join('_') : core.charAt(0);
      }).join(' ');
    }
    return q;
  }
  /* 4단계 문법 형태 — 동사 형태 + 어법 선택. 단서 없이 한 번에 판정한다. */
  function formItems(s) {
    var out = [];
    var v = null, c = null;
    try { v = WBGEN.verbFormDrill(s); } catch (e) {}
    try { c = WBGEN.grammarChoiceDrill(s, Math.random); } catch (e) {}
    if (v) out.push(v);
    if (c) { if (Array.isArray(c)) out = out.concat(c); else out.push(c); }
    if (!out.length) {
      var w = null;
      try { w = WBGEN.clozeWide(s, Math.random); } catch (e) {}
      if (w) out.push(w);
    }
    return out;
  }
  /* 어색한 곳 찾기 — 생성기는 그 단락의 문항을 index 로 하나씩 준다. 팩에 데이터가 없으면 빈 배열. */
  function oddItems(day) {
    var src = pack.oddOneItems || [];
    var out = [];
    if (WBGEN.oddOneItem && src.length) {
      var n = 0;
      try {
        var first = WBGEN.oddOneItem(src, day, { index: 0 });
        n = first && first.total ? first.total : (first ? 1 : 0);
        for (var i = 0; i < n; i++) {
          var q = i === 0 ? first : WBGEN.oddOneItem(src, day, { index: i });
          if (q && Array.isArray(q.choices) && q.choices.length >= 2 && q.answerKey != null) out.push(q);
        }
      } catch (e) { out = []; }
    }
    if (out.length) return out;
    /* 생성기가 없거나 못 만든 경우 — 팩 항목이 이미 러너 모양이면 그대로 쓴다 */
    return (Array.isArray(src) ? src : []).filter(function (x) {
      return x && (x.dayGroup == null || x.dayGroup === day) && Array.isArray(x.choices) && x.choices.length >= 2 && x.answerKey != null;
    }).map(function (q) {
      var o = {}, k;
      for (k in q) if (Object.prototype.hasOwnProperty.call(q, k)) o[k] = q[k];
      o.type = 'oddone';
      return o;
    });
  }
  /* 종합 Check — 팩의 checkItems 를 러너 문항으로. 없으면 사다리 문항을 섞어 대체 점검을 만든다. */
  function checkSetItems() {
    var src = pack.checkItems || [];
    var made = null;
    if (WBGEN.checkSet && src.length) { try { made = WBGEN.checkSet(src, Math.random); } catch (e) { made = null; } }
    var list = (Array.isArray(made) ? made : (made ? [made] : [])).filter(renderableItem);
    if (list.length) return { items: list, made: true };
    return { items: fallbackCheckItems(), made: false };
  }
  function renderableItem(q) {
    if (!q || typeof q !== 'object') return false;
    if (Array.isArray(q.choices) && q.choices.length >= 2 && q.answerKey != null) return true;
    if (Array.isArray(q.parts) && q.parts.some(function (p) { return p && p.blank; })) return true;
    if (q.type === 'order' && Array.isArray(q.answer) && q.answer.length >= 2) return true;
    if ((q.type === 'write' || q.type === 'skeleton') && Array.isArray(q.answers) && q.answers.length) return true;
    if (q.type === 'spell' && Array.isArray(q.answers) && q.answers.length) return true;
    if (q.type === 'cloze' && Array.isArray(q.answers) && q.answers.length) return true;
    return false;
  }
  /* 대체 종합 점검 — choice(뜻 인출) · blank(핵심어) · arrange(청크 배열) · write(영작)를 골고루 */
  function fallbackCheckItems() {
    var out = [];
    dayGroups().forEach(function (gr) {
      var means = ckMeanItems(gr);
      if (means.length) out.push(means[Math.floor(Math.random() * means.length)]);
      gr.sentences.forEach(function (s) {
        var k = kwBlankItem(s, 0); if (k) out.push(k);
        var o = enChunkOrderItem(s); if (o) out.push(o);
        var w = writeItem(s, 0); if (w) out.push(w);
      });
    });
    return out;
  }

  /* ══ 본문 탭 — 단락별로 「뜻 세우기 → 영어 얹기 → 굳히기」 ══
     잠긴 항목은 지우지 않고 이유를 한 줄로 보인다 — 왜 못 하는지 모르는 자물쇠가 가장 나쁘다. */
  function lockRow(attrs, sel, title, sub, right, why) {
    return '<div class="row' + (sel ? ' sel' : '') + (why ? ' lk' : '') + '" role="button" tabindex="0" ' + attrs + '>' +
      '<span class="tx">' + title +
      (sub ? '<span class="sub">' + sub + '</span>' : '') +
      (why ? '<span class="why">잠김 · ' + why + '</span>' : '') + '</span>' + (right || '') + '</div>';
  }
  function chip(done, label) { return '<span class="lvchip ' + (done ? 's' : '') + '">' + label + '</span>'; }
  function selIs(kind, day, i) {
    return !!(selPass && selPass.kind === kind && (day == null || selPass.day === day) && (i == null || selPass.i === i));
  }
  function groupRowsHtml(gr, gi, g) {
    var ck = ckState(gr.day), ckg = ckGate(gr.day);
    var ckStage = Math.min(stageNum(ck), CK_MAX), ckDone = !!(ck && ck.reached);
    var nCk = chunkCountOf(gr);
    var h = '<div class="hdr"><span>' + esc(gr.header) + (paraBlankDone(gr) ? ' · 백지 완료' : '') + '</span></div>';

    h += '<div class="zonehd">' + ZONE_MEAN + ' — 한글 청크로 뜻부터</div>';
    h += lockRow('data-ck="' + esc(gr.day) + '"', selIs('chunk', gr.day),
      '청크 ' + nCk + '개 · ' + (ckDone ? '완료' : CK_STAGES[ckStage]),
      ckDone ? '듣고 짝 맞추기 · 뜻 인출 · 순서 세우기 통과' : '영어를 쓰지 않고 뜻부터 세웁니다',
      chip(ckDone, ckDone ? '완료' : ckStage + '/3'), null);

    h += '<div class="zonehd">' + ZONE_EN + ' — 문장 사다리 6단</div>';
    gr.sentences.forEach(function (s) {
      var st = senState(s.seq);
      var stage = st && st.reached ? 6 : stageNum(st);
      var why = null;
      if (!ckg.open) why = '먼저 청크 뜻을 익혀요';
      else if (stage >= 5 && !(st && st.reached) && !g.open) why = '단어 ' + g.done + '/' + g.total + ' 도달 뒤에 열려요';
      h += '<div class="row' + (s.seq === selSeq && !selPass && !selDlg ? ' sel' : '') + (why ? ' lk' : '') + '" role="button" tabindex="0" data-seq="' + s.seq + '">' +
        '<span class="no">' + s.seq + '</span><span class="tx">' + esc(s.en) +
        (why ? '<span class="why">잠김 · ' + why + '</span>' : '') + '</span>' +
        stgMini(stage, st && st.reached) + '</div>';
    });

    h += '<div class="zonehd">' + ZONE_FIRM + ' — 단락으로 굳히기</div>';
    var pg = pgState(gr.day), pgStage = Math.min(stageNum(pg), PG_MAX), pgDone = !!(pg && pg.reached);
    [1, 2, 3].forEach(function (step) {
      var done = pgDone || pgStage > step;
      var gate = pgStageGate(gr.day, PG_NEED[step]);
      var why = null;
      if (!done) {
        if (!ckg.open) why = '먼저 청크 뜻을 익혀요';
        else if (pgStage < step) why = '앞 단계(' + PG_STEPS[step - 1] + ')를 먼저 마쳐요';
        else if (!gate.open) why = '단락 문장이 모두 ' + PG_NEED[step] + '단계 이상이어야 열려요 (' + n0(gate.done) + '/' + n0(gate.total) + ')';
        else if (step >= 2 && !g.open) why = '단어 ' + g.done + '/' + g.total + ' 도달 뒤에 열려요';
      }
      h += lockRow('data-pg="' + esc(gr.day) + '" data-step="' + step + '"', selIs('para', gr.day, step),
        PG_STEPS[step], step === 1 ? '한글 줄거리 이어 쓰기' : (step === 2 ? '바뀐 곳 고르기' : '단락 전체를 아무것도 보지 않고'),
        chip(done, done ? '완료' : step + '/3'), why);
    });
    return h;
  }
  function tailRowsHtml(g) {
    var gs = dayGroups();
    if (!gs.length) return '';
    var allDone = allParasDone(), h = '<div class="hdr"><span>전체 마무리 · ' + ZONE_FIRM + '</span></div>';
    cumSteps().forEach(function (cs) {
      var why = !allDone ? '모든 단락 백지를 마친 뒤에 열려요'
        : (!g.open ? '단어 ' + g.done + '/' + g.total + ' 도달 뒤에 열려요'
        : (!cs.open ? '앞 누적 백지를 먼저 마쳐요' : null));
      var label = cs.i === 0 ? '누적 백지 · 1일차' : (cs.i === gs.length - 1 ? '누적 백지 · 전체' : '누적 백지 · 1~' + (cs.i + 1) + '일차');
      h += lockRow('data-cum="' + cs.i + '"', selIs('cum', null, cs.i), label,
        cs.days.join(' + ') + ' 단락을 이어서',
        chip(!!cs.rec, cs.rec ? n0(cs.rec.okCount) + '/' + n0(cs.rec.total) : (cs.i + 1) + '/' + gs.length), why);
    });
    var pd = packDB();
    var chkWhy = !allDone ? '모든 단락 백지를 마친 뒤에 열려요' : (!g.open ? '단어 ' + g.done + '/' + g.total + ' 도달 뒤에 열려요' : null);
    h += lockRow('data-check="1"', selIs('check'), '종합 Check',
      '시험 전 최종 점검', chip(!!pd.check, pd.check ? n0(pd.check.correct) + '/' + n0(pd.check.total) : '최종'), chkWhy);
    return h;
  }
  function renderPassage() {
    var g = WBNAESIN.gate(wordStates(), exam(), Date.now(), {});
    var ssum = WBNAESIN.sentenceSummary(senStates());
    var psum = passageSummaryOf(curPackId()) || { chunkDone: 0, chunkTotal: 0, paraBlank: 0, paraTotal: 0, cumulative: 0, check: null };
    if (selSeq == null) selSeq = (pack.sentences[0] || {}).seq;
    var listHtml = packSegHtml() +
      '<div class="lh"><span>본문 ' + ssum.total + '문장 · ' + psum.chunkTotal + '단락</span>' +

    dayGroups().forEach(function (gr, gi) { listHtml += groupRowsHtml(gr, gi, g); });
    listHtml += tailRowsHtml(g);
    if ((pack.dialogues || []).length) {
      listHtml += '<div class="hdr"><span>대화문 · 의사소통 기능</span></div>';
      pack.dialogues.forEach(function (d) {
        var st = dlgState(d.id);
        listHtml += '<div class="row' + (selDlg === d.id ? ' sel' : '') + '" role="button" tabindex="0" data-dlg="' + esc(d.id) + '">' +
          '<span class="tx">' + esc(d.section) + '<span class="sub">' + d.lines.length + '줄 · ' + (dlgDone(st) ? '완료' : (st ? st.stage : 1) + '단계 ' + DLG_STAGES[Math.min(st ? st.stage : 1, 3)]) + '</span></span>' +
          '<span class="lvchip ' + (dlgDone(st) ? 's' : '') + '">' + (dlgDone(st) ? '완료' : (Math.min(st ? st.stage : 1, 3)) + '/3') + '</span></div>';
      });
      if ((pack.keyExpressions || []).length) {
        listHtml += '<div class="row' + (selDlg === '__key__' ? ' sel' : '') + '" role="button" tabindex="0" data-dlg="__key__">' +
          '<span class="tx">핵심표현<span class="sub">의사소통 기능 표현 ' + pack.keyExpressions.length + '개 빈칸 확인</span></span></div>';
      }
    }
    listHtml += '</div>';
    var work;
    if (selDlg) work = dialogueWorkHtml(selDlg);
    else if (selPass && selPass.kind === 'chunk') work = chunkWorkHtml(selPass.day, g);
    else if (selPass && selPass.kind === 'para') work = paraWorkHtml(selPass.day, selPass.i, g);
    else if (selPass && selPass.kind === 'cum') work = cumWorkHtml(selPass.i, g);
    else if (selPass && selPass.kind === 'check') work = checkWorkHtml(g);
    else work = sentenceWorkHtml(selSeq, g);
    layoutSplit(listHtml, work);
    $('sRows').onclick = function (e) {
      var t = e.target;
      var ckr = t.closest('.row[data-ck]');
      if (ckr) { selPass = { kind: 'chunk', day: ckr.getAttribute('data-ck') }; selDlg = null; render(); return; }
      var pgr = t.closest('.row[data-pg]');
      if (pgr) { selPass = { kind: 'para', day: pgr.getAttribute('data-pg'), i: Number(pgr.getAttribute('data-step')) }; selDlg = null; render(); return; }
      var cr = t.closest('.row[data-cum]');
      if (cr) { selPass = { kind: 'cum', i: Number(cr.getAttribute('data-cum')) }; selDlg = null; render(); return; }
      var chr = t.closest('.row[data-check]');
      if (chr) { selPass = { kind: 'check' }; selDlg = null; render(); return; }
      var r = t.closest('.row[data-seq]');
      if (r) { selSeq = Number(r.getAttribute('data-seq')); selPass = null; selDlg = null; render(); return; }
      var dr = t.closest('.row[data-dlg]');
      if (dr) { selDlg = dr.getAttribute('data-dlg'); selPass = null; render(); }
    };
    if (selDlg) wireDialogueWork(selDlg);
    else if (selPass && selPass.kind === 'chunk') wireChunkWork(selPass.day, g);
    else if (selPass && selPass.kind === 'para') wireParaWork(selPass.day, selPass.i, g);
    else if (selPass && selPass.kind === 'cum') wireCumWork(selPass.i, g);
    else if (selPass && selPass.kind === 'check') wireCheckWork(g);
    else wireSentenceWork(selSeq, g);
  }

  /* ── 뜻 세우기(청크 트랙) 지면 ── */
  function ckStepDots(stage, done) {
    var h = '<span class="ckstep">';
    for (var i = 1; i <= CK_MAX; i++) h += '<em class="' + (done || i < stage ? 'dn' : (i === stage ? 'on' : '')) + '">' + CK_STAGES[i] + '</em>';
    return h + '</span>';
  }
  function chunkWorkHtml(day, g) {
    var gr = groupOfDay(day);
    if (!gr) return '<p class="muted">단락을 선택하십시오.</p>';
    var st = ckState(day), stage = Math.min(stageNum(st), CK_MAX), done = !!(st && st.reached);
    var all = chunksOfGroup(gr);
    var pairs = all.map(function (c) {
      return '<div class="chunkline">' + esc(c.en) + '<span class="ko">' + esc(c.ko) + '</span></div>';
    }).join('');
    return '<div class="wh"><h2>' + esc(gr.header) + ' · ' + ZONE_MEAN + '</h2>' +
      '<span class="tag ' + (done ? 't-green' : 't-ind') + '">' + (done ? '뜻 세우기 완료' : stage + '/3 · ' + CK_STAGES[stage]) + '</span>' +
      ckStepDots(stage, done) + '</div>' +
      '<div class="card"><p class="muted" style="margin:0 0 8px">영어를 쓰지 않습니다. 뜻(한글)을 먼저 세운 뒤에 문장 사다리가 열립니다.</p>' +
      (all.length ? pairs : '<p class="muted">이 단락에는 청크 데이터가 없어 뜻 세우기를 건너뜁니다 — 문장 사다리가 바로 열립니다.</p>') +
      '<div class="row2" style="margin-top:10px">' +
      '<button class="btn" id="ckTts">전체 듣기</button>' +
      (all.length
        ? '<button class="btn p" id="ckGo">' + (done ? '뜻 세우기 다시 연습' : stage + '단계 시작 — ' + CK_STAGES[stage]) + '</button>'
        : '<button class="btn" disabled>청크 없음</button>') +
      '</div>' + genNoteHtml() + '</div>';
  }
  function wireChunkWork(day, g) {
    var gr = groupOfDay(day);
    if (!gr) return;
    var tts = $('ckTts');
    if (tts) tts.onclick = function () {
      var list = chunksOfGroup(gr).map(function (c) { return c.en; });
      if (window.WBVoice && WBVoice.ttsSupported() && list.length) WBVoice.speakSeq(list, { lang: 'en' });
    };
    var go = $('ckGo');
    if (go) go.onclick = function () { runChunkSession(day); };
  }
  /* 청크 세션 — 통과 기준은 8할이다. 만점을 요구하면 못 읽는 학생이 첫 관문에서 다시 막힌다. */
  function runChunkSession(day) {
    var gr = groupOfDay(day), st = ckState(day);
    if (!gr || !st) return;
    var stage = Math.min(stageNum(st), CK_MAX);
    var items = stage === 1 ? ckMatchItems(gr) : (stage === 2 ? ckMeanItems(gr) : ckOrderItems(gr));
    if (!items.length) {
      alert('이 단락의 ' + CK_STAGES[stage] + ' 문항을 만들 수 없습니다 (청크 데이터 부족). 문장 사다리로 바로 진행합니다.');
      trackAdvance(st, true, CK_MAX, Date.now());
      persist(); render();
      return;
    }
    var pid = curPackId();
    items.forEach(function (q) { q.packId = pid; q.track = 'chunk'; q.day = day; });
    var okN = 0;
    setLast('본문 ' + gr.header + ' · ' + ZONE_MEAN + ' ' + stage + '단계', { t: 'chunk', day: day });
    persist();
    runQueue(items, ZONE_MEAN + ' ' + stage + '/3 · ' + CK_STAGES[stage],
      function (it, ok) { if (ok) okN += 1; logEvent('chunk', it.type, day, ok, pid); },
      function (finished) {
        var passed = finished && items.length > 0 && (okN / items.length) >= 0.8;
        trackAdvance(st, passed, CK_MAX, Date.now());
        touchPack(pid); persist(); render();
      }, { noConfidence: true });
  }

  /* ── 굳히기(단락 관문) 지면 ── */
  function paraWorkHtml(day, step, g) {
    var gr = groupOfDay(day);
    if (!gr) return '<p class="muted">단락을 선택하십시오.</p>';
    var pg = pgState(day), pgStage = Math.min(stageNum(pg), PG_MAX), pgDone = !!(pg && pg.reached);
    var done = pgDone || pgStage > step;
    var gate = pgStageGate(day, PG_NEED[step]), ckg = ckGate(day);
    var why = null;
    if (!done) {
      if (!ckg.open) why = '먼저 이 단락의 청크 뜻을 익히세요.';
      else if (pgStage < step) why = '앞 단계(' + PG_STEPS[step - 1] + ')를 먼저 마치세요.';
      else if (!gate.open) why = '이 단락 문장이 모두 ' + PG_NEED[step] + '단계 이상이어야 열립니다 (지금 ' + n0(gate.done) + '/' + n0(gate.total) + ').';
      else if (step >= 2 && !g.open) why = '단어 선행 기준(' + g.done + '/' + g.total + ' 도달) 충족 전에는 잠깁니다.';
    }
    var body;
    if (step === 1) body = '<p class="muted">이 단락의 줄거리를 우리말로 이어 씁니다. 청크의 핵심 뜻이 얼마나 들어갔는지로 채점합니다.</p>';
    else if (step === 2) body = '<p class="muted">단락 문장 중 한 곳이 바뀌어 있습니다. 어디가 어색한지 고릅니다.</p>' +
      ((pack.oddOneItems || []).length ? '' : '<p class="muted" style="color:var(--amber)">이 교재에는 「어색한 곳」 문항 데이터(oddOneItems)가 없습니다 — 건너뛰고 단락 백지로 넘어갑니다.</p>');
    else body = '<p class="muted">' + gr.sentences.length + '문장을 순서대로, 아무것도 보지 않고 씁니다. 틀린 문장은 원인에 맞는 단계로 되돌아갑니다.</p>';
    return '<div class="wh"><h2>' + esc(gr.header) + ' · ' + PG_STEPS[step] + '</h2>' +
      '<span class="tag ' + (done ? 't-green' : 't-ind') + '">' + (done ? '통과' : ZONE_FIRM + ' ' + step + '/3') + '</span></div>' +
      '<div class="card">' + body +
      (why ? '<div class="notice" style="margin:10px 0 0">' + esc(why) + '</div>'
           : '<button class="btn p big" id="pgGo" style="margin-top:10px">' + (done ? PG_STEPS[step] + ' 다시 하기' : PG_STEPS[step] + ' 시작') + '</button>') +
      '</div>';
  }
  function wireParaWork(day, step, g) {
    var go = $('pgGo');
    if (!go) return;
    go.onclick = function () {
      if (step === 1) return runParaSummary(day);
      if (step === 2) return runParaOdd(day);
      return startBlank(groupOfDay(day));
    };
  }
  /* 관문 ① 단락 줄거리 — 한글 이어 쓰기, 청크 커버리지로 채점(6할) */
  function runParaSummary(day) {
    var gr = groupOfDay(day), pg = pgState(day);
    if (!gr || !pg) return;
    var chunks = chunksOfGroup(gr);
    setLast('본문 ' + gr.header + ' · 단락 줄거리', { t: 'para', day: day, step: 1 });
    persist();
    runCustom(ZONE_FIRM + ' · ' + esc(gr.header) + ' 단락 줄거리',
      '<div class="q"><div class="qmeta">' + esc(gr.header) + ' — 이 단락의 줄거리를 우리말로 이어 쓰시오</div>' +
      gr.sentences.map(function (s) { return '<div class="chunkline">' + esc(s.en) + '</div>'; }).join('') +
      '<textarea class="ans" id="pgIn" style="min-height:140px"' + INATTR + ' placeholder="우리말로 줄거리를 이어 쓰기"></textarea>' +
      '<div class="rnext"><button class="btn p big" id="okBtn">확인</button></div><div id="pgOut"></div></div>',
      function () {
        $('okBtn').onclick = function () {
          var v = $('pgIn').value;
          var cov = WBGRADE.gradeTranslationChunks(v, chunks);
          var passed = cov.coverage >= 0.6;
          var html = '<div class="result ' + (passed ? 'good' : 'bad') + '">청크 뜻 ' + Math.round(cov.coverage * 100) + '% 반영 — ' + (passed ? '통과' : '더 채워야 합니다(60% 이상)') + '</div>';
          chunks.forEach(function (c, i) {
            var miss = cov.perChunk[i] && !cov.perChunk[i].present;
            html += '<div class="chunkline' + (miss ? ' miss' : '') + '">' + (miss ? '[빠짐] ' : '') + esc(c.en) + '<span class="ko">' + esc(c.ko) + '</span></div>';
          });
          html += '<div class="rnext"><button class="btn p big" id="pgDone">기록하고 닫기</button></div>';
          $('pgOut').innerHTML = html;
          $('pgDone').onclick = function () {
            trackAdvance(pg, passed, PG_MAX, Date.now());
            logEvent('para', 'summary', day, passed);
            closeCustom(); persist(); render();
          };
        };
      });
  }
  /* 관문 ② 어색한 곳 찾기 — 데이터가 없으면 이유를 보이고 넘긴다(조용히 막지 않는다) */
  function runParaOdd(day) {
    var gr = groupOfDay(day), pg = pgState(day);
    if (!gr || !pg) return;
    var items = oddItems(day);
    if (!items.length) {
      alert('이 교재에는 「어색한 곳 찾기」 문항 데이터(oddOneItems)가 없습니다.\n이 단계를 건너뛰고 단락 백지로 넘어갑니다.');
      trackAdvance(pg, true, PG_MAX, Date.now());
      persist(); render();
      return;
    }
    var pid = curPackId();
    items.forEach(function (q) { q.packId = pid; q.day = day; });
    var okN = 0;
    setLast('본문 ' + gr.header + ' · 어색한 곳', { t: 'para', day: day, step: 2 });
    persist();
    runQueue(items, ZONE_FIRM + ' · 어색한 곳 찾기',
      function (it, ok) { if (ok) okN += 1; logEvent('para', 'odd', day, ok, pid); },
      function (finished) {
        trackAdvance(pg, finished && okN === items.length, PG_MAX, Date.now());
        touchPack(pid); persist(); render();
      }, { noConfidence: true });
  }

  /* ── 누적 백지 · 종합 Check 지면 ── */
  function cumWorkHtml(i, g) {
    var steps = cumSteps(), cs = steps[i];
    if (!cs) return '<p class="muted">항목을 선택하십시오.</p>';
    var allDone = allParasDone();
    var why = !allDone ? '모든 단락의 백지를 먼저 마치세요.'
      : (!g.open ? '단어 선행 기준(' + g.done + '/' + g.total + ' 도달) 충족 전에는 잠깁니다.'

      (cs.rec ? '<p class="muted">마지막 기록 · 정확 ' + n0(cs.rec.okCount) + ' / ' + n0(cs.rec.total) + ' (' + n0(cs.rec.score) + '%)</p>' : '') +
      (why ? '<div class="notice" style="margin:10px 0 0">' + esc(why) + '</div>'
           : '<button class="btn p big" id="cumGo" style="margin-top:10px">' + (cs.rec ? '누적 백지 다시 도전' : '누적 백지 시작') + '</button>') +
      '</div>';
  }
  function wireCumWork(i, g) {

  function checkWorkHtml(g) {

      : (!g.open ? '단어 선행 기준(' + g.done + '/' + g.total + ' 도달) 충족 전에는 잠깁니다.' : null);
    var src = (pack.checkItems || []).length;
    return '<div class="wh"><h2>종합 Check</h2>' +
      '<span class="tag ' + (pd.check ? 't-green' : 't-ind') + '">' + (pd.check ? n0(pd.check.correct) + '/' + n0(pd.check.total) : '최종 점검') + '</span></div>' +
      '<div class="card"><p class="muted">시험 전 최종 점검입니다. 고르기·빈칸·배열·영작을 섞어 한 번에 봅니다.</p>' +
      (src ? '' : '<p class="muted" style="color:var(--amber)">이 교재에는 종합 Check 문항(checkItems)이 없어 사다리 문항으로 대체 점검을 만듭니다.</p>') +
      (pd.check ? '<p class="muted">마지막 기록 · ' + n0(pd.check.correct) + ' / ' + n0(pd.check.total) + '</p>' : '') +
      (why ? '<div class="notice" style="margin:10px 0 0">' + esc(why) + '</div>'
           : '<button class="btn p big" id="chkGo" style="margin-top:10px">' + (pd.check ? '종합 Check 다시 보기' : '종합 Check 시작') + '</button>') +
      '</div>';
  }
  function wireCheckWork(g) {
    var go = $('chkGo');
    if (go) go.onclick = runCheck;
  }

  /* ── 대화문 학습 (세션 ①) ── */
  function dialogueWorkHtml(id) {
    if (id === '__key__') {
      return '<div class="wh"><h2>핵심표현</h2><span class="tag t-ind">의사소통 기능</span></div>' +
        '<div class="card">' +
        (pack.functions || []).map(function (f) {
          return '<div class="chunkline"><b>' + esc(f.name) + '</b> — ' + esc(f.pattern || '') + '<span class="ko">' + esc(f.explainKo || '') + '</span></div>';
        }).join('') +
        '<p class="muted">단원 핵심표현 ' + (pack.keyExpressions || []).length + '개를 빈칸으로 확인합니다.</p>' +
        '<button class="btn p big" id="dlgGo">핵심표현 확인 시작</button></div>';
    }
    var d = dlgById(id), st = dlgState(id);
    if (!d || !st) return '<p class="muted">대화문을 선택하십시오.</p>';
    var stage = Math.min(st.stage, 3);
    return '<div class="wh"><h2>' + esc(d.section) + '</h2>' +
      '<span class="tag ' + (dlgDone(st) ? 't-green' : 't-ind') + '">' + (dlgDone(st) ? '완료' : stage + '단계 · ' + DLG_STAGES[stage]) + '</span></div>' +
