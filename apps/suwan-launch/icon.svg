<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" role="img" aria-label="WB 전략 총괄 보드">
  <!-- 보드의 디자인 언어 그대로: 서류지 바탕 · 먹잉크 · 인주 빨강, 각진 2px 모서리 대신
       아이콘은 마스크 잘림을 견디도록 여유를 둔다(purpose any maskable). -->
  <rect width="192" height="192" rx="40" fill="#23272E"/>
  <!-- 바인더 표지 -->
  <rect x="38" y="30" width="116" height="132" rx="4" fill="#FDFBF5"/>
  <!-- 좌측 제본 띠 -->
  <rect x="38" y="30" width="13" height="132" rx="4" fill="#BC4B2A"/>
  <!-- 문서 괘선 -->
  <rect x="64" y="52" width="58" height="7" rx="2" fill="#23272E"/>
  <rect x="64" y="70" width="74" height="5" rx="2" fill="#C9C2B4"/>
  <rect x="64" y="83" width="74" height="5" rx="2" fill="#C9C2B4"/>
  <!-- 지표 막대 — 이 보드의 핵심(전략 총괄) -->
  <rect x="64" y="103" width="14" height="24" rx="2" fill="#2F5B7E"/>
  <rect x="84" y="112" width="14" height="15" rx="2" fill="#2F5B7E" opacity=".62"/>
  <rect x="104" y="96" width="14" height="31" rx="2" fill="#BC4B2A"/>
  <rect x="124" y="107" width="14" height="20" rx="2" fill="#2F5B7E" opacity=".62"/>
  <!-- 기준선 -->
  <rect x="64" y="131" width="74" height="3" rx="1.5" fill="#23272E"/>
  <!-- 결재 도장 -->
  <circle cx="139" cy="49" r="15" fill="none" stroke="#BC4B2A" stroke-width="4"/>
  <path d="M132 49l5 6 10-12" stroke="#BC4B2A" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
