<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수완지구 신규 학원 런치보드 | WB 웩슬러브레인센터</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --display:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',-apple-system,BlinkMacSystemFont,sans-serif;
    --ivory:#F4EFE4; --paper-deep:#EAE2CF; --white:#FDFBF5; --surface:#FDFBF5;
    --dark:#23272E; --mid:#6E675A; --line:#D8CFBB;
    --navy:#23272E; --navy-deep:#17191E; --ink-fill:#23272E;
    --blue:#2F5B7E; --deep-blue:#24465F; --blue-soft:#9DB6C6; --tint-blue:#E2E8E4;
    --coral:#BC4B2A;
    --ok:#3A7257; --ok-bg:#E5EBDC; --warn:#A0761B; --warn-bg:#F2E8CE;
    --bad:#A63E28; --bad-bg:#F1DFD4;
    --light:#EFE9DB; --kanban-bg:#EAE2CF;
  }
  html{scroll-behavior:smooth}
  body{font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',-apple-system,BlinkMacSystemFont,sans-serif;color:var(--dark);background:var(--ivory);line-height:1.7}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit;font-size:14px}
  .hidden{display:none!important}

  /* ─── 마스트헤드 (문서 상단부) ─── */
  .demobar{position:sticky;top:0;z-index:50;background:var(--ivory);color:var(--dark);
    display:flex;align-items:flex-end;gap:2px;padding:12px 18px 0;flex-wrap:wrap;
    border-bottom:2px solid var(--dark)}
  .demobar .logo{font-family:var(--display);font-weight:700;font-size:17px;margin-right:14px;
    letter-spacing:-.01em;white-space:nowrap;flex:none;padding-bottom:9px}
  .demobar .logo span{color:var(--coral)}
  .demobar .tag{font-size:10px;font-weight:700;color:var(--coral);letter-spacing:.14em;
    border:1px solid var(--coral);padding:2px 8px;border-radius:2px;margin-right:auto;margin-bottom:11px}
  .navbtn{background:transparent;border:none;border-bottom:3px solid transparent;color:var(--mid);
    font-size:12.5px;font-weight:600;padding:6px 9px 9px;white-space:nowrap;transition:color .12s}
  .navbtn:hover{color:var(--dark)}
  .navbtn.active{color:var(--dark);border-bottom-color:var(--coral);font-weight:800}
  .nav-sep{width:1px;align-self:center;height:14px;background:var(--line);margin:0 6px 6px}
  @media(max-width:700px){
    .demobar{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    .demobar::-webkit-scrollbar{display:none}
    .demobar .tag{display:none}
    .iv-steps,.sim-preview{position:static}
  }

  .view{padding:38px 0 84px;animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){.view{animation:none}}

  .eyebrow{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.22em;
    text-transform:uppercase;color:var(--coral);margin-bottom:12px;
    border-top:2px solid var(--coral);padding-top:7px}
  h1{font-family:var(--display);font-size:clamp(26px,4vw,40px);font-weight:700;line-height:1.32;letter-spacing:-.015em;margin-bottom:14px;text-wrap:balance}
  h2{font-family:var(--display);font-size:clamp(21px,3vw,28px);font-weight:700;margin-bottom:10px;letter-spacing:-.01em;text-wrap:balance}
  h3{font-family:var(--display);font-size:16.5px;font-weight:700;margin-bottom:6px}
  .lede{font-size:15px;color:var(--mid);max-width:64ch}
  .muted{color:var(--mid)}
  .small{font-size:12.5px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:22px;margin-bottom:16px}
  .card.tight{padding:16px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  @media(max-width:860px){.grid3,.grid4{grid-template-columns:1fr 1fr}}
  @media(max-width:560px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}

  .pill{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.05em;padding:3px 9px;border-radius:2px;
    background:transparent;border:1px solid var(--line);color:var(--mid)}
  .pill.blue{border-color:var(--blue);color:var(--deep-blue);background:transparent}
  .pill.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
  .pill.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-bg)}
  .pill.bad{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}

  .btn{display:inline-block;border:none;border-radius:2px;font-weight:700;font-size:14px;
    padding:10px 20px;background:var(--blue);color:#fff;text-decoration:none}
  .btn:hover{filter:brightness(1.12)}
  .btn.ghost{background:transparent;border:1px solid var(--dark);color:var(--dark)}
  .btn.ghost:hover{border-color:var(--coral);color:var(--coral);background:transparent;filter:none}
  .btn.coral{background:var(--coral)}
  .btn.sm{font-size:12.5px;padding:6px 13px}
  .btn.xs{font-size:11.5px;padding:4px 10px;border-radius:2px}

  .progressbar{height:5px;border-radius:0;background:var(--paper-deep);overflow:hidden}
  .progressbar>i{display:block;height:100%;background:var(--blue);border-radius:0;transition:width .3s}

  /* ─── 홈 (표제부) ─── */
  .hero-launch{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--dark);
    border-radius:2px;color:var(--dark);padding:46px 38px 34px;margin-bottom:20px;position:relative}
  .hero-launch .lede{color:var(--mid)}
  .hero-launch .chip-row{margin-top:20px;border-top:1px solid var(--line);padding-top:16px}
  .hero-launch .chip{background:transparent;border:1px solid var(--dark);color:var(--dark)}
  .hero-launch::after{content:"WB 內部";position:absolute;top:26px;right:26px;width:76px;height:76px;
    border:2.5px solid rgba(188,75,42,.5);border-radius:100px;color:rgba(188,75,42,.62);
    font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.1em;
    display:flex;align-items:center;justify-content:center;transform:rotate(-12deg);pointer-events:none}
  @media(max-width:640px){.hero-launch::after{display:none}}
  .stat-num{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.2;font-variant-numeric:tabular-nums}
  .stat-lbl{font-size:11px;color:var(--mid);font-weight:700;letter-spacing:.08em}
  .partner{display:flex;gap:10px;align-items:flex-start}
  .partner .dot{flex:none;width:38px;height:38px;border-radius:2px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:15px;font-family:var(--display)}

  /* ─── 인터뷰 ─── */
  .iv-layout{display:grid;grid-template-columns:230px 1fr;gap:20px;align-items:start}
  @media(max-width:820px){.iv-layout{grid-template-columns:1fr}}
  .iv-steps{position:sticky;top:64px}
  .iv-step{display:flex;gap:9px;align-items:center;padding:9px 12px;border-radius:2px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--mid);border-left:3px solid transparent}
  .iv-step:hover{background:var(--surface)}
  .iv-step.active{background:var(--surface);color:var(--dark);border-left-color:var(--coral);font-weight:800}
  .iv-step.done .iv-num{background:var(--ok);color:#fff;border-color:var(--ok)}
  .iv-num{flex:none;width:22px;height:22px;border-radius:2px;border:1px solid var(--line);background:var(--surface);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--mid);font-variant-numeric:tabular-nums}
  .iv-step.active .iv-num{background:var(--ink-fill);border-color:var(--ink-fill);color:#fff}
  .q-block{padding:18px 0;border-bottom:1px solid var(--line)}
  .q-block:last-of-type{border-bottom:none}
  .q-title{font-size:15.5px;font-weight:800;margin-bottom:4px}
  .q-hint{font-size:12.5px;color:var(--mid);margin-bottom:10px}
  .opt-row{display:flex;flex-wrap:wrap;gap:8px}
  .opt{border:1px solid var(--line);background:var(--surface);border-radius:2px;padding:8px 14px;font-size:13.5px;font-weight:600;color:var(--dark);text-align:left}
  .opt:hover{border-color:var(--dark)}
  .opt.sel{border-color:var(--deep-blue);background:var(--tint-blue);color:var(--deep-blue);box-shadow:inset 0 0 0 1px var(--deep-blue)}
  .opt .oh{display:block;font-size:11px;font-weight:500;color:var(--mid);margin-top:1px}
  .q-input{width:100%;max-width:420px;border:1px solid var(--line);border-radius:2px;padding:10px 13px;background:var(--surface);color:var(--dark)}
  .q-input:focus{outline:none;border-color:var(--deep-blue)}
  textarea.q-input{max-width:100%;min-height:74px;resize:vertical}
  .unit{font-size:13px;color:var(--mid);margin-left:8px;font-weight:600}
  .scale-row{display:flex;gap:8px}
  .scale-row .opt{width:44px;text-align:center;padding:8px 0}

  /* ─── 컨셉 ─── */
  .concept-tabs{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
  .ctab{flex:1;min-width:200px;text-align:left;border:1px solid var(--line);border-top:3px solid var(--line);border-radius:2px;background:var(--surface);padding:16px}
  .ctab .cc{font-size:10.5px;font-weight:800;letter-spacing:.14em}
  .ctab .cn{font-family:var(--display);font-size:16px;font-weight:700;margin:2px 0}
  .ctab .ct{font-size:12px;color:var(--mid)}
  .ctab.active{border-color:var(--c-main,var(--dark));border-top-color:var(--c-main,var(--dark));border-top-width:3px}
  .concept-hero{border-radius:2px;padding:34px 30px;color:#fff;margin-bottom:16px;
    background:var(--c-deep,#17191E);border-left:6px solid var(--c-main,#2F5B7E)}
  .concept-hero h2{color:#fff}
  .chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.35);border-radius:2px;
    font-size:12px;font-weight:700;padding:4px 12px}
  .swatches{display:flex;gap:8px;margin-top:14px}
  .swatch{width:34px;height:34px;border-radius:2px;border:2px solid rgba(255,255,255,.5)}
  .c-section-title{display:flex;align-items:center;gap:10px;margin:28px 0 12px}
  .c-section-title h3{margin:0;white-space:nowrap}
  .c-section-title::before{content:"";width:14px;height:2px;background:var(--coral)}
  .c-section-title::after{content:"";flex:1;height:1px;background:var(--line)}
  .curri{border-left:3px solid var(--c-main,var(--blue));padding:10px 14px;background:var(--surface);border-radius:0;
    border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  .abs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  @media(max-width:760px){.abs-grid{grid-template-columns:1fr}}
  .abs-col{background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:14px}
  .abs-col h4{font-size:12.5px;font-weight:800;margin-bottom:8px}
  .abs-col ul{list-style:none}
  .abs-col li{font-size:12.5px;padding:5px 0 5px 16px;position:relative;color:var(--dark);line-height:1.55}
  .abs-col li::before{content:"·";position:absolute;left:4px;font-weight:700;color:var(--c-main,var(--blue))}
  table.mini{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
  table.mini th{background:transparent;border-top:2px solid var(--dark);border-bottom:1px solid var(--dark);
    text-align:left;font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--mid);padding:8px 10px}
  table.mini td{border-bottom:1px solid var(--line);padding:8px 10px;vertical-align:top}

  /* ─── 연계전략 보드 ─── */
  .ch-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .ch-tab{border:1px solid var(--line);background:var(--surface);border-radius:2px;font-size:13px;font-weight:700;padding:7px 16px;color:var(--mid)}
  .ch-tab.active{background:var(--ink-fill);border-color:var(--dark);color:#fff}
  .action-card{background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:12px 14px;margin-bottom:9px}
  .action-card.st1{border-left:3px solid var(--warn)}
  .action-card.st2{border-left:3px solid var(--ok);opacity:.72}
  .action-card.st0{border-left:3px solid var(--line)}
  .action-top{display:flex;gap:8px;align-items:flex-start}
  .action-top .t{font-size:13.5px;font-weight:700;flex:1;line-height:1.5}
  .action-detail{font-size:12.5px;color:var(--mid);margin-top:5px;line-height:1.6}
  .action-kpi{font-size:11.5px;color:var(--deep-blue);font-weight:700;margin-top:5px}
  .stbtn{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:2px;font-size:11px;font-weight:800;padding:4px 9px;color:var(--mid);white-space:nowrap}
  .stbtn.s1{border-color:var(--warn);color:var(--warn);background:var(--warn-bg)}
  .stbtn.s2{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}

  /* ─── 실행 작업 ─── */
  .kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
  @media(max-width:760px){.kanban{grid-template-columns:1fr}}
  .kcol{background:var(--kanban-bg);border-radius:2px;padding:12px;border:1px solid var(--line)}
  .kcol h4{font-family:var(--display);font-size:13.5px;font-weight:700;padding:2px 6px 10px;display:flex;justify-content:space-between}
  .tcard{background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:11px 13px;margin-bottom:8px}
  .tcard .tt{font-size:13.5px;font-weight:700;line-height:1.45}
  .tcard .td{font-size:12px;color:var(--mid);margin-top:3px;line-height:1.55}
  .tcard .trow{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}

  /* ─── 계산기 ─── */
  .calc-grid{display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start}
  @media(max-width:820px){.calc-grid{grid-template-columns:1fr}}
  .calc-form label{display:block;font-size:12.5px;font-weight:700;margin:12px 0 4px}
  .calc-form input[type=number]{width:100%;border:1px solid var(--line);border-radius:2px;padding:9px 12px;background:var(--surface);color:var(--dark);font-variant-numeric:tabular-nums}
  .calc-form input:focus{outline:none;border-color:var(--deep-blue)}
  .preset-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .res-big{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .res-item{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;font-variant-numeric:tabular-nums}
  .res-item b{font-weight:800}
  .toggle-row{display:flex;gap:8px;margin-top:4px}

  /* ─── 커리큘럼·시간표 생성기 ─── */
  .gen-form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
  @media(max-width:760px){.gen-form{grid-template-columns:1fr 1fr}}
  .gen-form label{display:block;font-size:11.5px;font-weight:700;color:var(--mid);margin-bottom:4px}
  .gen-form input{width:100%;border:1px solid var(--line);border-radius:2px;padding:8px 10px;font-size:13.5px;background:var(--surface);color:var(--dark);font-variant-numeric:tabular-nums}
  .gen-form input:focus{outline:none;border-color:var(--deep-blue)}
  .tier-select{border:1px solid var(--line);border-radius:2px;padding:4px 8px;font-size:12px;font-weight:600;background:var(--surface);color:var(--dark)}
  table.sched{width:100%;border-collapse:collapse;font-size:12.5px}
  table.sched th{background:var(--ink-fill);color:#fff;text-align:center;font-size:11.5px;padding:8px 6px;font-weight:700}
  table.sched td{border:1px solid var(--line);padding:6px;vertical-align:top;text-align:center}
  table.sched td.timecol{background:var(--light);font-weight:700;font-size:11.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .slot-card{background:var(--tint-blue);border-radius:2px;padding:5px 6px;font-size:11px;line-height:1.5;text-align:left;color:var(--dark)}
  .slot-card b{display:block;font-size:11.5px}
  .slot-card.tier-premium{background:var(--bad-bg)}
  .slot-card.tier-blended{background:var(--ok-bg)}
  .gap-badge{font-weight:800}
  .gap-badge.ok{color:var(--ok)}
  .gap-badge.warn{color:var(--warn)}
  .teacher-row{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
  .teacher-row .tname{flex:none;width:64px;font-weight:800}
  .teacher-row .tload{flex:none;font-size:11.5px;color:var(--mid);font-variant-numeric:tabular-nums}

  /* ─── 3자 합의 트래커 ─── */
  .agr-item{background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:14px 16px;margin-bottom:10px}
  .agr-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
  .agr-status{border:1px solid transparent;border-radius:2px;font-size:12px;font-weight:800;padding:5px 12px;cursor:pointer;white-space:nowrap}
  .agr-status.st-미논의{background:var(--light);color:var(--mid);border-color:var(--line)}
  .agr-status.st-논의중{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
  .agr-status.st-합의완료{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
  .agr-note{width:100%;border:1px solid var(--line);border-radius:2px;padding:8px 10px;font-size:12.5px;margin-top:8px;min-height:44px;font-family:inherit;background:var(--surface);color:var(--dark)}

  /* ─── 인수 실사 체크리스트 ─── */
  .dd-cat{margin-bottom:18px}
  .dd-cat h4{font-family:var(--display);font-size:14px;font-weight:700;margin-bottom:8px;color:var(--deep-blue)}
  .dd-item{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
  .dd-item:last-child{border-bottom:none}
  .dd-item input[type=checkbox]{margin-top:3px;flex:none;width:16px;height:16px;accent-color:var(--blue)}
  .dd-item.checked .dd-label{text-decoration:line-through;color:var(--mid)}
  .dd-label{font-size:13px;line-height:1.6}

  /* ─── 모집 퍼널 ─── */
  .funnel-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .funnel-bar-wrap{flex:1;background:var(--paper-deep);border-radius:0;overflow:hidden;height:36px}
  .funnel-bar{height:100%;background:var(--blue);display:flex;align-items:center;padding-left:12px;color:#fff;font-weight:800;font-size:13px;border-radius:0;transition:width .3s;white-space:nowrap;font-variant-numeric:tabular-nums}
  .funnel-lbl{flex:none;width:88px;font-size:12.5px;font-weight:700}
  .funnel-pct{flex:none;width:64px;text-align:right;font-size:12px;color:var(--mid);font-variant-numeric:tabular-nums}

  /* ─── 상담 매뉴얼 ─── */
  .manual-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .mtab{border:1px solid var(--line);background:var(--surface);border-radius:2px;font-size:13px;font-weight:700;padding:7px 16px;color:var(--mid)}
  .mtab.active{background:var(--ink-fill);border-color:var(--dark);color:#fff}
  .script{background:var(--tint-blue);border-left:3px solid var(--blue);border-radius:0;padding:14px 16px;margin:10px 0;font-size:13.5px;line-height:1.85}
  .script .who{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--deep-blue);margin-bottom:4px}
  .script.parent{background:var(--warn-bg);border-left-color:var(--warn)}
  .script.parent .who{color:var(--warn)}
  .script.forbidden{background:var(--bad-bg);border-left-color:var(--bad)}
  .script.forbidden .who{color:var(--bad)}
  .do-dont{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
  @media(max-width:700px){.do-dont{grid-template-columns:1fr}}
  .do-box,.dont-box{border-radius:2px;padding:12px 14px;font-size:13px;line-height:1.7}
  .do-box{background:var(--ok-bg);border:1px solid var(--ok)}
  .dont-box{background:var(--bad-bg);border:1px solid var(--bad)}
  .do-box b,.dont-box b{display:block;font-size:12px;margin-bottom:6px}
  .faq-item{border-bottom:1px solid var(--line);padding:13px 0}
  .faq-item:last-child{border-bottom:none}
  .faq-q{font-weight:800;font-size:14px;display:flex;gap:8px}
  .faq-q .qmark{flex:none;width:22px;height:22px;border-radius:2px;background:var(--ink-fill);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;font-family:var(--display)}
  .faq-a{font-size:13.5px;color:var(--dark);margin-top:6px;margin-left:30px;line-height:1.75}
  .checklist{list-style:none}
  .checklist li{font-size:13.5px;padding:6px 0 6px 26px;position:relative}

  /* ─── 오픈 타임라인 ─── */
  .tl-track{position:relative;padding-left:26px}
  .tl-track::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:1px;background:var(--dark)}
  .tl-item{position:relative;padding-bottom:22px}

  .subj-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}

  .sim-opts{display:flex;flex-wrap:wrap;gap:10px}
  .sim-opt{border:1px solid var(--line);background:var(--surface);border-radius:2px;padding:14px 16px;min-width:140px;flex:1;text-align:left;cursor:pointer}
  .sim-opt:hover{border-color:var(--dark)}
  .sim-opt.picked{border-color:var(--deep-blue);background:var(--tint-blue);box-shadow:inset 0 0 0 1px var(--deep-blue)}
  .sim-opt .so-emoji{font-size:20px;margin-bottom:4px;display:block}
  .sim-opt .so-name{font-weight:800;font-size:13.5px}
  .sim-opt .so-desc{font-size:11px;color:var(--mid);margin-top:2px;line-height:1.5}
  .sim-preview{position:sticky;top:64px;background:var(--navy-deep);border-top:3px solid var(--coral);
    color:#fff;border-radius:2px;padding:22px 20px}
  .sim-preview h3{color:#fff;font-size:16px;margin-bottom:4px}
  .sim-preview .sp-tagline{font-size:13px;opacity:.85;line-height:1.6;margin-bottom:14px;min-height:60px}
  .sim-preview .sp-row{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid rgba(255,255,255,.15);font-size:12.5px;font-variant-numeric:tabular-nums}
  .sim-preview .sp-row b{font-weight:800}
  .sim-save-list{margin-top:12px}
  .sim-save-item{background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:10px 12px;margin-bottom:8px;font-size:12.5px}

  /* misc */
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink-fill);color:#fff;
    font-size:13px;font-weight:700;padding:11px 22px;border-radius:2px;box-shadow:0 6px 22px rgba(0,0,0,.25);
    opacity:0;pointer-events:none;transition:opacity .25s;z-index:99}
  .toast.show{opacity:1}
  .footer-note{font-size:11.5px;color:var(--mid);text-align:center;padding:26px 0 40px}
  .print-only{display:none}

  @media print{
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .demobar,.no-print,.footer-note,.concept-tabs,.ch-tabs,.manual-tabs,.subj-tabs{display:none!important}
    .print-only{display:block}
    body{background:#fff}
    .view{padding:0}
    .card{break-inside:avoid;border-color:#ccc}
  }
</style>

const DATA = {"concepts":[{"code":"A","conceptName":"WB 리딩 브릿지 — 검사 데이터 기반 초등 국어·문해력 전문학원","brandNames":["WB리딩랩 문해력학원","리딩브릿지 국어문해력학원","글자람 문해력연구소"],"tagline":"감이 아니라 데이터로 — 한글 다음의 3년을 설계합니다","positioning":"광주 수완지구 유일의 '검사 데이터 기반' 초등 국어·문해력 전문학원. WB 웩슬러 검사 데이터와 12가지 읽기 패턴 매핑으로 아이마다 다른 독해 훈련 처방을 제공하는 '왜 못 읽는지 아는 학원'으로 포지셔닝한다. 리더스 유치원·영유의 한글·독서 교육을 초등 문해력으로 잇는 공식 브릿지 기관이며, 다독·논술 중심의 기존 국어학원과 달리 진단→처방→성장 리포트의 폐쇄 루프를 상품화한다. 정원제 소수정예~중형(70~150명)으로 희소성과 품질을 동시에 유지한다.","target":"핵심 타깃: 리더스 유치원·영유 졸업 예정/졸업생 가정(6~9세)과 그 형제자매. 확장 타깃: 수완지구 거주 초1~초4 자녀를 둔 30~40대 학부모 중 \"문해력이 전 과목의 기초\"라는 인식이 있고, 감각적 지도가 아닌 진단·데이터 기반 관리에 지불 의사가 있는 층. 보조 타깃: 독해 부진이 의심되나 원인을 모르는 초3~4 전환기(읽기 학습→학습 읽기) 가정. 운영 정원 70~150명 상한제.","curriculum":[{"line":"브릿지반 (한글·읽기 독립 전환)","desc":"리더스 졸업생의 한글 완성도를 이어받아 소리내어 읽기→유창성→읽기 독립까지 완성. 입학 시 WB 읽기 발달 진단으로 출발점을 확정하고 유치원 독서 이력과 연계한 개별 도서 로드맵 운영.","grade":"예비초~초1"},{"line":"리딩 베이직 (독해 기초·어휘)","desc":"문장→문단→글 구조 독해의 기초 체계화. 12패턴 매핑 결과에 따라 어휘형·유창성형·집중형 등 훈련 모듈을 다르게 배합하는 처방형 수업.","grade":"초1~초2"},{"line":"리딩 마스터 (비문학·교과 독해)","desc":"'읽기 학습'에서 '학습 읽기'로 전환되는 시기의 비문학 독해, 교과 연계 지문, 요약·추론 훈련. 6개월 주기 리체크 검사로 성장 곡선을 리포트화.","grade":"초3~초4"},{"line":"국어 완성반 (문학·서술형·쓰기)","desc":"중등 대비 문학 감상, 서술형 답안 쓰기, 긴 글 쓰기까지 확장. 졸업 시점에 중등 국어 준비도 리포트 제공.","grade":"초5~초6"},{"line":"12패턴 클리닉 (1:4 소수정예)","desc":"웩슬러 검사 데이터·12패턴 매핑에서 독해 부진 원인이 확인된 학생 대상 원인별 집중 클리닉. 정규반 병행 또는 단독 수강, 프리미엄 단가의 시그니처 상품.","grade":"전학년"}],"absorption":{"leadersGrad":{"short":["리더스 유치원 원장·리드앤톡 원장·WB 3자 협업 합의서를 먼저 문서화한 뒤, 졸업 예정 7세 학부모 대상 합동 설명회 '한글 다음, 읽기 독립'을 리더스 원장 명의 초청으로 개최 (커뮤니케이션 창구는 리더스 원장으로 일원화)","졸업생 대상 '읽기 발달 브릿지 진단'(WB 웩슬러 기반)을 정가로 안내하고, 검사 결과 상담을 리더스 졸업 상담 일정과 자연스럽게 연계 (할인·조건 제시 없음)","졸업식·졸업앨범 시즌에 '유치원 독서 이력→초등 문해력 로드맵' 리플렛을 정보 중심으로 제공, 경품·판촉성 접근 금지","졸업생 가정별 유치원 독서·한글 이력 인수인계 포맷을 리더스와 합의해 입학 상담 품질을 표준화"],"mid":["분기별 '초1 문해력 점검의 달' 운영 — 졸업생 대상 리체크 검사와 성장 리포트로 재접점 형성","리더스 재원 6~7세 학부모 대상 연 1~2회 '읽기 준비도 세미나'를 정례화해 졸업 전부터 브릿지 경로 인지 구축","졸업생 전환율·만족도 데이터를 3자 협의체에 투명 공유하고 추천 프로토콜을 분기마다 개선"],"long":["'리더스→WB 문해력 트랙'을 공식 진학 경로로 브랜드화 — 졸업생 코호트 3년 추적 성장 데이터를 백서로 발간해 신뢰 자산화","재원생 가정의 동생이 리더스에 입학하고 졸업 후 다시 WB로 오는 형제 순환 구조를 설계 (비금전적 가족 멤버십, 할인 아님)","졸업생 종단 데이터를 커리큘럼 고도화와 12패턴 매핑 정밀화에 재투자해 경쟁사가 복제 불가능한 진입장벽 구축"]},"leadersAcademy":{"short":["3자 협의로 직영학원 커리큘럼과 신규 학원 커리큘럼의 중복·보완 지점을 매핑하고, 연계 대상(초등 독해 심화 수요)과 잔류 대상(유아~초저 과정) 기준을 사전 합의","재원생 학부모 안내는 리더스 직영학원 원장 명의의 단일 채널로만 진행 — 신규 학원의 재원생 직접 접촉·조건 제시를 원칙적으로 금지","희망 가정에 한해 전환 진단(정가)을 실시하고 결과 기반 개별 학습 로드맵 상담으로만 전환 여부를 결정 (설득·권유 아닌 데이터 제시)"],"mid":["학년 진급 시점(겨울방학)을 자연 전환 윈도우로 운영 — 직영학원은 유아·초저 기초, 신규 학원은 초등 문해력 심화로 역할 분담을 정착","분기 1회 공동 커리큘럼 위원회를 운영해 두 기관 간 레벨 연계표(유아 한글 단계↔초등 독해 레벨)를 유지·보수","전환 가정 만족도와 잔류 가정 이탈률을 함께 추적해 협의체에 보고 — 전환이 직영학원에 손실이 아님을 데이터로 증명"],"long":["유아 한글부터 초등 독해까지 통합 레벨 체계를 완성해 '한 지붕 두 단계' 구조를 정착","성장 리포트·상담 포맷을 두 기관이 공유해 학부모 경험의 연속성을 브랜드 자산으로 전환","장기 브랜드 아키텍처 정리(리더스=유아 단계, WB=초등 이상 단계)를 3자 협의체 의결로 단계적 추진"]},"readAndTalk":{"short":["리드앤톡 원장과 프로그램 경계를 먼저 합의 — 리드앤톡의 기존 강점 프로그램과 신규 학원의 검사 기반 독해 클리닉의 역할을 문서로 정의","리드앤톡 재원생 중 독해 부진이 관찰되는 케이스에 한해 리드앤톡 원장의 추천 방식으로만 WB 검사를 연계 (신규 학원의 직접 마케팅·조건 제시 금지)","상호 역추천 프로토콜 문서화 — 신규 학원에 들어온 독서토론·표현 수요는 리드앤톡으로 보내는 양방향 구조로 신뢰 확보"],"mid":["분기별 공동 사례 회의를 열어 검사 데이터 기반 성장 리포트를 리드앤톡 수업 설계에 피드백 — 데이터를 주는 협력자 위치 선점","병행 수강 모델 설계: 리드앤톡 정규 수업 + WB 12패턴 클리닉 주1회 조합을 공동 상담으로 안내","기능이 겹치는 프로그램은 협의체 의결로 한쪽에 단계적 통합 — 일방 흡수가 아닌 합의 기반 정리"],"long":["병행 수강 가정 대상 통합 성장 리포트 체계를 구축해 두 학원의 학부모 경험을 하나로 통합","리드앤톡 커리큘럼과 12패턴 매핑의 공동 연구를 진행해 공동 브랜드 프로그램 출시","합병·제휴 지속 등 장기 통합 형태는 3자 협의체에서 성과 데이터 기반으로 결정 — 사전 확정하지 않음"]},"external":{"short":["오픈 전 사전 설명회 2회 '초등 문해력, 감이 아니라 데이터로' 개최 — 익명화된 웩슬러 데이터·12패턴 실사례로 차별성 각인","오픈 프로모션은 할인 대신 가치 부가로: 오픈 기념 진단(정가) 신청자에게 심층 상담 리포트·개별 도서 로드맵 제공","수완지구 맘카페·블로그에 문해력 발달 칼럼 연재 시작, 네이버 플레이스·지도·검색 세팅 완료","인근 초등학교 학사일정에 맞춘 학기초 상담 주간 운영"],"mid":["월 1회 학부모 공개 세미나 정례화 — 학년별 문해력 발달 단계와 재원생 집단 성장 데이터(익명) 공개로 신뢰 축적","동의받은 재원생 성장 리포트 기반 전후 비교 후기 콘텐츠를 블로그·맘카페에 축적","예비초 학부모가 움직이는 11~1월 초등 입학 설명회 시즌 집중 캠페인","지역 도서관·동네 서점과 제휴한 독서 프로그램으로 비상업적 접점 확대"],"long":["'수완에서 문해력 = WB' 인지 구축 — 연 1회 지역 문해력 컨퍼런스 개최와 성장 데이터 백서 발간","졸업생(초6)의 중등 국어 연계 트랙을 검토해 재원 기간과 LTV를 확장","정원 상한(150명) 도달 시 대기자 리스트 운영으로 희소성 기반 브랜드 유지","재원 가정의 지인 추천을 비금전적 가치(우선 상담권·특별 세미나 초청)로 보상 — 할인 금지 원칙 유지"]}},"space":"수완지구 학원가 접근성 좋은 상가 내 실평수 50~60평급 중형 공간(정원 150명 상한 기준 가정). 구성: 6~8인 소그룹 강의실 4~5실, 방음 처리된 WB 검사·상담실 1실, 서가와 대기 공간을 겸한 리딩 라운지, 학부모 상담존. 인테리어는 따뜻한 아이보리 톤 목재 베이스에 네이비 포인트월로 '연구소의 전문성 + 도서관의 온기'를 구현. 복도에는 12패턴 매핑 인포그래픽과 재원생 성장 그래프(익명)를 전시해 공간 자체가 포지셔닝을 증명하게 한다. 임대 조건은 회의 기준(보증금 3,000~5,000만·월세 150~180만) 범위에서 검토한다.","vehicle":"기본 무차량 운영 — 리더스 하원 동선·아파트 단지 인접 입지로 도보·학부모 라이딩을 전제한다. 회의 기준 무차량 시 70명 소수정예가 안전선이므로 정원 70명까지는 차량 없이 운영하고, 100명 돌파 시점에 차량 1대(월 약 250만원, 약 20명 커버) 시범 도입을 검토한다. 150명 상한까지 확장하려면 차량 2대 이상 또는 저학년 2~3시간 블록 수업 재설계가 전제다(회의 기준: 150명 규모는 차량 운영 필요).","pricing":"정규 독해 수업 원비는 월 평균 28만원 가정(주 2회 기준, 학년·주회수에 따라 24~32만원 범위 설계). 12패턴 클리닉(1:4 소수정예)은 프리미엄 단가를 별도 책정한다. 입학 진단·6개월 리체크 검사는 WB 센터의 기존 검사 가격 정책을 그대로 준용하며, 모든 채널(졸업생·재원생·외부 신규)에 대해 할인 금지 원칙을 적용해 가격 신뢰를 지킨다. 교재비는 실비 별도. 검사 정가: 웩슬러 15만·성향기질 20만·통합 상품 35만. 원비 평균 28만원은 프리미엄 목표 단가 가정(회의 언급 원비 범위 18~28만의 상단 — 계산기 기본 평균 24만원과 구분해 민감도 검증 필요).","scenarios":[{"students":30,"monthlyRevenue":"평균 28만원 × 30명 = 840만원","note":"오픈 후 0~3개월 목표. 리더스 졸업생 브릿지 유입 중심의 초기 구간으로, 임대료·인건비 감안 시 BEP 이전 단계 — 강사 최소 인력(원장+1)으로 운영"},{"students":50,"monthlyRevenue":"평균 28만원 × 50명 = 1,400만원","note":"6개월 내 1차 목표. 강사 2인 체제에서 BEP 근접 구간으로 추정(확정 비용 데이터 제공 시 재검증), 클리닉 프리미엄 매출이 더해지면 상회 가능"},{"students":150,"monthlyRevenue":"평균 28만원 × 150명 = 4,200만원","note":"정원 상한 도달(1~2년차 목표). 소수정예 품질을 유지할 수 있는 한계선으로, 이후는 증원이 아닌 대기자 운영과 단가 구조 개선으로 대응 ※ 회의 기준 150명 규모는 차량 운영이 전제 — 차량 비용(대당 월 약 250만)을 손익에 반영할 것."},{"students":300,"monthlyRevenue":"평균 28만원 × 300명 = 8,400만원","note":"참고 시나리오. 소수정예~중형 컨셉의 정체성을 훼손하는 규모이므로 단일 캠퍼스 확장은 비권장 — 도달 수요 확인 시 2호점 분리 또는 중등 트랙 신설로 흡수"}],"kpi":["재원생 수 (월말 기준, 목표 경로 30→50→150명)","리더스 졸업생 → 입학 전환율 (졸업 코호트 대비 %)","진단 검사 → 등록 전환율 (졸업생 연계 채널 60% · 외부 신규 40% 차등 목표)","월 퇴원율 (목표 3% 이하) 및 평균 재원 기간","재등록률 (분기 기준 90% 이상)","6개월 리체크 검사 시행률과 독해력 성장 지표 개선율","성장 리포트 정시 발행률 100% (신뢰 상품의 핵심 납품물)","학부모 추천 의향(NPS)과 지인 추천 유입 비중","외부 신규 문의 수 및 채널별 유입 (맘카페·블로그·플레이스)"],"risks":[{"risk":"재원생 연계가 리더스 직영학원·리드앤톡의 '학생 빼가기'로 인식되어 3자 관계가 훼손될 위험","mitigation":"오픈 전 3자 협업 합의서 문서화, 커뮤니케이션은 각 원장 명의로 일원화, 재원생 직접 접촉·조건 제시 금지, 전환·잔류 데이터를 협의체에 투명 공유해 상호 손실이 없음을 증명"},{"risk":"검사 기반 포지셔닝이 '과잉 진단 상술'이라는 학부모 반감을 살 위험","mitigation":"검사는 강요 없는 선택제로 운영하고 정가 원칙 유지, 설명회에서 데이터 활용 범위·개인정보 처리 방침을 선제 공개, 검사 없이도 등록 가능한 일반 트랙 병행"},{"risk":"초등 국어 단과 특성상 객단가가 낮고 방학·학년 전환기 이탈 계절성이 큼","mitigation":"6개월 리체크·성장 리포트로 리텐션 루프를 상품에 내장, 형제자매·병행 수강 유도로 가정당 매출 확대, 12패턴 클리닉 프리미엄 단가로 평균 객단가 방어"},{"risk":"검사 해석과 처방형 수업이 가능한 초등 국어 강사 수급 난이도","mitigation":"12패턴별 훈련 모듈과 수업 매뉴얼을 표준화해 강사 의존도를 낮추고, 검사 해석은 WB 센터가 담당하는 분업 구조 유지, 내부 양성 트랙(신입 강사 12패턴 연수) 운영"},{"risk":"150명 초과 수요 발생 시 증원 유혹으로 소수정예 품질과 브랜드 약속이 무너질 위험","mitigation":"정원 150명 상한제와 대기자 리스트를 공식 정책으로 선언하고, 초과 수요는 2호점 분리·중등 트랙 신설로 흡수하는 확장 원칙을 사전 확정"}],"design":{"mood":"따뜻한 아이보리 베이스 위에 네이비와 블루로 신뢰·전문성을 얹은 '온기 있는 연구소'. 유아 학원의 알록달록함과 입시 학원의 차가움 사이에서, 도서관의 편안함과 데이터 연구소의 정밀함이 공존하는 무드.","palette":[{"name":"웜 아이보리 (베이스)","hex":"#F8F4EA"},{"name":"딥 네이비 (신뢰·타이틀)","hex":"#1C2B4A"},{"name":"트러스트 블루 (브랜드 메인)","hex":"#2F5DA8"},{"name":"스카이 미스트 (보조·차트 배경)","hex":"#BCD3EE"},{"name":"앰버 포인트 (성장·강조)","hex":"#E3A94F"}],"heroCopy":"우리 아이의 읽기 두뇌, 감이 아니라 데이터로 봅니다. 웩슬러 검사 데이터와 12가지 읽기 패턴으로 설계하는, 한글 다음 초등 문해력의 첫 3년.","uiIdea":"학부모 앱 홈 화면은 아이보리 카드 위에 아이의 12패턴 레이더 차트를 네이비 라인으로 그려 첫 화면에서 '진단 기반 학원'임을 각인시킨다. 그 아래로 월별 독해력 성장 곡선과 오늘 읽은 책·수업 미션이 타임라인으로 이어지고, 성장 지점마다 앰버색 마일스톤 배지가 붙는다. 리포트 탭은 검사→처방→수업→리체크의 여정을 한 줄 타임라인으로 보여줘 재등록 시점마다 성장의 증거를 자동으로 제시한다."},"whyWins":"수완지구 초등 국어·독서 학원 대부분이 다독·논술 중심의 감각적 운영에 머무는 반면, 이 컨셉은 WB만 보유한 웩슬러 검사 데이터·12패턴 매핑이라는 복제 불가능한 진단 자산을 정면에 세워 '왜 못 읽는지 아는 유일한 학원'이라는 명확한 차별성을 갖는다. 여기에 리더스 유치원·영유 졸업생이라는 확보된 유입 파이프라인이 3자 협업 합의 위에서 매년 안정적으로 공급되어 신규 학원의 최대 리스크인 초기 모객이 구조적으로 해소된다. 소수정예 정원제와 할인 금지 원칙은 가격 경쟁 대신 신뢰 경쟁으로 판을 옮기며, 검사→처방→리포트→리체크의 폐쇄 루프가 리텐션과 추천을 동시에 만들어 70~150명 규모에서 가장 수익 밀도가 높은 모델이 된다."},{"code":"B","conceptName":"원라인 잉글리시(One-Line English) — 파닉스에서 중등 내신까지 한 줄로 잇는 영어 중심 통합 어학원","brandNames":["리더스브릿지 어학원","WB 잉글리시랩 수완","빅스텝 어학원"],"tagline":"파닉스에서 내신까지, 갈아타지 않는 영어","positioning":"수완지구에서 유일하게 '영유(리더스) → 원서 리딩(리드앤톡 승계) → 중등 내신'을 한 브랜드 안에서 끊김 없이 잇는 수직통합 프리미엄 어학원. 3자 합의로 리드앤톡 커리큘럼·재원생 승계가 성립하는 경우, 검증된 커리큘럼과 재원생 기반·리더스 영유 졸업생 파이프라인·원어민 리크루팅 리소스를 갖고 출발하는 '이미 검증된 신설 학원'으로 포지셔닝한다. 경쟁 대형 어학원 대비 차별점은 (1) 유아기부터 이어지는 레벨 연속성, (2) 원어민+한국인 담임 이중 케어, (3) 초등 리딩에서 중등 내신으로의 무손실 진급 설계. ※ 본 안은 리드앤톡과의 통합·승계 합의 성립이 전제 — 합의 전에는 연계 협력 모델(별도 사업자+업무제휴)로 시작한다.","target":"핵심 타깃 1순위: 리더스 유치원·영유 졸업 예정(6~7세) 가정 — 졸업 후 영어 공백을 두려워하는 학부모. 2순위: 리드앤톡 재원생(초등) 가정 — 커리큘럼·담임 연속성을 원하는 기존 고객. 3순위: 수완지구 일반 초1~4 원서 리딩 수요층과 예비중(초5~6)~중등 내신 수요층. 지리적 범위는 수완지구 중심 + 차량 노선으로 닿는 인접 생활권(첨단·신창·운남 방면 단계적 확장).","curriculum":[{"line":"Phonics Start (파닉스 라인)","desc":"파닉스·사이트워드·소리 중심 문자 해득. 리더스 영유 졸업생은 진단 후 파닉스 생략·단축 트랙으로 진입. 원어민 챈트·스피킹 병행.","grade":"6~7세, 초1"},{"line":"Reading Core (리딩 라인, 리드앤톡 승계·확장)","desc":"리드앤톡의 원서 리딩 커리큘럼을 그대로 승계하고 상위 레벨을 신설·확장. AR/Lexile 기반 레벨제, 다독+정독 병행, 북리포트와 낭독 녹음 피드백.","grade":"초1~4"},{"line":"Language Arts (라이팅·스피킹 라인)","desc":"원서 기반 어휘·에세이 라이팅·발표. 원어민 교사 주도 스피킹·디베이트 수업으로 산출 역량 강화.","grade":"초3~6"},{"line":"Grammar Bridge (예비중 브릿지 라인)","desc":"리딩 라인에서 축적한 영어 감각을 문법·구문·어법 체계로 전환. 중등 내신형 문제 풀이 입문과 서술형 대비 기초.","grade":"초5~6"},{"line":"중등 내신 Master (내신 라인)","desc":"학교별 교과서·기출 기반 내신 대비, 서술형·수행평가 첨삭, 시험 4주 전 학교별 분반. 어학원 출신의 리딩 자산을 내신 등급으로 연결.","grade":"중1~3"},{"line":"Native Speaking Clinic (원어민 클리닉, 공통 트랙)","desc":"원어민 리크루팅 리소스를 활용한 소그룹 스피킹 클리닉·인터뷰 테스트. 전 라인 학생이 레벨별로 주 1회 이상 원어민 노출을 보장받는 공통 모듈.","grade":"전 학년 공통"}],"absorption":{"leadersGrad":{"short":["리더스 유치원 원장·리드앤톡 원장·WB 3자 협의체를 구성하고 졸업생 연계 원칙(원장 일원화 커뮤니케이션, 개별 조건 제시·할인 금지)을 서면 합의","졸업 예정(7세) 학부모 대상 오픈하우스·입학 설명회를 리더스 원장 공동 명의로 안내(학원 단독 영업 메시지 금지)","졸업 예정 원아 대상 '영어 성장 리포트'형 레벨 진단을 유치원 정규 일정 밖 별도 신청제(주말·방과후, 학원 공간)로 운영하고, 희망 가정에 한해 결과 상담을 초등 로드맵 안내로 연결 (재원 중 유치원 내 검사·직접 접촉 금지)","졸업~입학 공백기(1~2월) 대비 신학기 반 편성 사전 예약 접수"],"mid":["졸업 시즌마다 '리더스 브릿지 클래스'(영유→초등 전환 4~8주 과정)를 유치원과 공동 운영해 전환을 제도화","리더스 영유 레벨과 신규 학원 리딩 레벨의 공식 매핑표를 만들어 학부모에게 '이어서 올라가는 한 줄 로드맵'으로 제시","유치원 영어 발표회·행사에 학원 교사진이 참여해 브랜드 연속성을 자연스럽게 노출","졸업생 입학 가정 대상 첫 학기 학부모 간담회를 유치원 원장 배석으로 진행"],"long":["유치원 커리큘럼과 초등 커리큘럼의 레벨 체계·교재 라인을 표준화해 '리더스 → 원라인' 통합 커리큘럼 맵을 브랜드 자산화","졸업생 코호트별 입학률·잔존율·레벨업 데이터를 추적해 매년 전환율 목표(예: 40% 이상)를 3자 협의체에서 리뷰","유치원~중등까지 이어지는 통합 브랜드 데이(영어 페스티벌·낭독대회)를 연 1회 정례화","졸업생의 8~10년 재원 생애가치(LTV) 모델을 기준으로 유치원과의 장기 협력 구조(역할·기여 정산)를 갱신"]},"leadersAcademy":{"short":["직영학원 재원생 관련 모든 안내는 리더스 원장을 단일 창구로 하는 일원화 커뮤니케이션 원칙을 3자 서면 합의(학원의 개별 접촉·조건 제시·할인 전면 금지)","직영학원과 신규 학원의 과정 중복 구간을 진단하고, 어느 쪽이 어떤 레벨·연령을 맡을지 역할 분담 초안을 협의","재원생 학부모에게는 '두 기관이 한 로드맵 위에 있다'는 통합 로드맵 안내문만 공동 명의로 발송(비교·전환 권유 문구 배제)"],"mid":["양 기관 레벨 체계 상호 인정 협약: 직영학원 레벨을 무시험 인정해 전환 시 재배치 스트레스 제거(단, 전환은 학부모 자발 요청 + 3자 합의 프로세스로만 진행)","직영학원이 커버하지 않는 상위 과정(고학년 라이팅, 예비중, 중등 내신)을 신규 학원이 맡는 상향 연계 구조를 공식화","분기별 3자 운영회의에서 전환·연계 현황과 학부모 반응을 리뷰하고 갈등 요소를 조기 조정"],"long":["브랜드 아키텍처 확정: 유치원·직영학원은 유아~초등 저학년, 신규 학원은 초등 중학년~중등으로 단계 분담하는 그룹 구조로 재편","직영학원 수료생의 신규 학원 진급을 정규 프로세스(수료식 → 진급 배치)로 제도화","그룹 차원 통합 학사관리(레벨·성적 데이터 공유 체계)를 구축해 기관 간 이동이 '전학'이 아니라 '진급'이 되게 설계"]},"readAndTalk":{"short":["승계 발표는 리드앤톡 원장 명의 중심의 공동 안내로 진행: '같은 커리큘럼, 같은 선생님, 더 커진 공간'이라는 무손실 이관 메시지로 통일","재원생 전원의 레벨·교재 진도·담임 배정을 그대로 유지하는 이관 체크리스트(반 편성표, 교재 연속성, 시간표, 차량 노선)를 오픈 전 확정","이관 대상 학부모 간담회를 2회 이상 열어 새 공간·원어민 수업·상위 라인 신설을 설명(별도 조건 제시·할인 없이 정규 원비 체계 그대로 승계)","이관 직후 4주간 담임이 전 가정에 개별 안착 콜을 실시해 초기 이탈 차단"],"mid":["리드앤톡 리딩 커리큘럼을 신규 학원의 Reading Core 라인으로 공식 확장: 기존 최상위 레벨 위에 Language Arts·예비중 라인을 신설해 '더 올라갈 곳'을 제시","기존 한국인 담임 수업에 원어민 스피킹 클리닉을 결합한 업그레이드 시간표를 학기 단위로 적용","이관 재원생의 레벨업·리딩 지수 성장 데이터를 학부모 리포트로 정례 발송해 '옮기길 잘했다'는 체감 창출","리드앤톡 시절 수강 가정 중 마케팅 수신 동의가 유효한 가정에 한해 상위 라인 신설 소식을 안내하고, 그 외에는 블로그·맘카페 등 공개 채널 공지로 알린다 (퇴원생 개인정보 이용은 학부모 본인 동의가 유효한 경우로 한정)"],"long":["리드앤톡 출신 재원생의 중등 내신 라인 진급률을 핵심 지표로 관리해 초등 리딩 → 중등 내신의 수직 동선을 완성","리드앤톡 1기 출신 학생의 성장 스토리(원서 리딩 → 내신 등급)를 간판 사례로 브랜드 서사화","승계 커리큘럼을 계속 고도화해 '리드앤톡의 리딩 DNA'를 신규 브랜드의 교육 철학으로 계승·명문화"]},"external":{"short":["오픈 2개월 전부터 수완지구 맘카페·아파트 커뮤니티에 '리더스 유치원·리드앤톡과 공식 협력하는 신규 어학원' 서사로 사전 인지 캠페인 실행 (캠페인 문안은 두 원장 사전 승인 필수 — 타 기관 성과를 자기 것처럼 표현 금지)","사전 레벨테스트 예약제 운영(선착순 정원제로 희소성 부여, 가격 할인 대신 정규 커리큘럼 로드맵 상담을 가치로 제공)","오픈 설명회 2회(유아·초등 리딩편 / 예비중·내신편)를 분리 개최해 타깃별 메시지 최적화","개원 시점 차량 노선을 수완지구 주요 대단지 중심으로 공개해 등원 편의성을 초기 소구점으로 활용"],"mid":["초등 저학년 대상 원서 리딩 공개수업·낭독회를 분기 1회 열어 체험 기반 전환 퍼널 구축","재원생 레벨업률·리딩 지수 성장 등 성과 데이터를 블로그·카페 콘텐츠로 정기 발행해 신뢰 자산 축적","탑승률 데이터를 근거로 차량 노선을 인접 생활권까지 단계 확장해 상권 반경을 넓힘","재원생 학부모 추천 프로그램은 할인이 아닌 비가격 혜택(원서·진단 리포트 등) 중심으로 설계"],"long":["중등 내신 라인의 성과(내신 성적 향상 사례)를 전면에 세워 '리딩 어학원'을 넘어 '결과를 내는 어학원'으로 인식 전환","수완지구 영어 낭독대회·스펠링비 등 지역 이벤트를 주최해 카테고리 대표 브랜드 지위 확보","초등 저학년 신규 유입 → 중등까지 평균 재원 기간을 늘리는 리텐션 설계로 300명 체제의 안정적 유지 기반 마련","인접 지구(첨단·신창 등) 수요가 검증되면 2호점 또는 분원 형태의 확장 옵션 검토"]}},"space":"확장형(150~300명) 전제의 공간 요건 제안 — 강의실 10~12개(레벨별 8~12명 소그룹 기준), 원어민 스피킹 클리닉 전용 룸 2개, 레벨테스트·상담실 2개, 학부모 대기 라운지, 원서 라이브러리(브랜드 상징 공간, 딥그린+골드 인테리어의 중심), 차량 승하차 대기 존. 300명 체제 기준 시간대별 2부제 운영(초등 오후 1~2부 / 중등 저녁부)으로 강의실 회전율을 확보한다. 임대·투자는 회의 기준(보증금 3,000~5,000만·월세 150~180만, 초기 투자 1.0~1.5억)과 정합 검증이 필요하며, 300명 확장형 공간은 이 기준을 상회할 수 있어 1단계 표준 공간 → 2단계 증평의 단계 확장을 권장한다.","vehicle":"차량 운영 전제 — 회의 기준 1대당 약 20명 커버, 대당 월 약 250만원(지입·유류 포함). 1단계(개원~50명): 2대로 리더스 유치원 하원→학원 등원 직결 노선 + 수완 대단지 노선 운영. 2단계(150명 이상): 시간대별 다회전 배차와 2~3시간 블록 수업 재설계를 전제로 3~4대까지 증차(단회전 기준으로는 150명에 7~8대가 필요하므로 다회전 설계가 필수). 전 차량 동승 안전요원 배치·실시간 위치 공유, 탑승률 70% 미만 노선은 분기별 재편. 차량 래핑은 브랜드 광고 자산으로 활용.","pricing":"원비는 '평균 28만원' 가정(시나리오 계산 기준 단가)으로 설계한다: 파닉스·리딩 라인 주 3회 월 26~28만원 수준, 라이팅·예비중 라인 28~30만원 수준, 중등 내신 라인 30~33만원 수준, 원어민 클리닉 포함 트랙은 상위 단가 적용(교재비 별도). 할인 금지 원칙: 승계 재원생·리더스 졸업생 포함 어떤 채널에도 가격 할인·개별 조건 제시를 하지 않으며, 연계 가정에는 비가격 가치(무시험 레벨 인정, 진단 리포트, 원서 증정 등)로 보상한다. 원비 평균 28만원은 프리미엄 어학원 목표 단가 가정(회의 언급 원비 범위 18~28만의 상단 — 계산기 기본 평균 24만원과 구분해 검증 필요). 검사 연계 시 WB 정가(웩슬러 15만·성향기질 20만·통합 35만)를 그대로 적용한다.","scenarios":[{"students":30,"monthlyRevenue":"평균 28만원 × 30명 = 840만원 (원비 평균 28만원 가정)","note":"오픈 직후 최소 시나리오. 리드앤톡 승계 재원생만으로도 도달해야 하는 방어선. 이 구간에서는 고정비 최소화(강사 겸임, 차량 1~2대)로 버티는 구조."},{"students":50,"monthlyRevenue":"평균 28만원 × 50명 = 1,400만원 (원비 평균 28만원 가정)","note":"오픈 3개월 내 1차 목표. 리드앤톡 승계 + 리더스 졸업생 1차 유입으로 달성. 손익분기 접근 구간으로, 원어민 정규 배치를 본격화하는 시점."},{"students":150,"monthlyRevenue":"평균 28만원 × 150명 = 4,200만원 (원비 평균 28만원 가정)","note":"12개월 내 안정화 목표. 외부 신규 유입이 절반 이상을 차지해야 하는 구간. 강의실 1부제 → 2부제 전환, 차량 다회전 배차 풀가동, 중등 내신 라인 개설 완료."},{"students":300,"monthlyRevenue":"평균 28만원 × 300명 = 8,400만원 (원비 평균 28만원 가정)","note":"1~3년 확장 상한 시나리오. 초등~중등 전 라인 가동 + 차량 3~4대+다회전 배차 + 2부제 완전 정착 전제. 이 규모에서는 부원장·라인별 팀장 체계 등 중간 관리 조직이 선행 조건."}],"kpi":["오픈 3개월 내 재원생 50명(승계 포함), 12개월 내 150명, 36개월 내 300명","리드앤톡 승계 재원생 이관 유지율 90% 이상 (이관 후 3개월 기준)","리더스 영유 졸업생의 입학 전환율 40% 이상 (연간 코호트 기준)","월 퇴원율 3% 이하, 평균 재원 기간 24개월 이상","레벨테스트 → 등록 전환율 40% 이상 (외부 신규 채널)","재원생 레벨업 달성률(학기별 목표 레벨 도달) 80% 이상","차량 노선별 탑승률 70% 이상","중등 내신 라인 진급률(초6 재원생 중 중1 잔존 비율) 60% 이상"],"risks":[{"risk":"리드앤톡 재원생 이관 과정에서 '학원이 바뀐다'는 불안으로 초기 이탈 발생","mitigation":"커리큘럼·담임·레벨을 그대로 유지하는 무손실 이관 원칙을 리드앤톡 원장 명의로 공지하고, 이관 후 4주간 전 가정 개별 안착 콜과 학부모 간담회로 불안을 선제 해소한다."},{"risk":"리더스 유치원(직영학원 포함)과의 이해관계 충돌 — 재원생 흡수가 '빼앗기'로 비화","mitigation":"3자 협의체에서 역할 분담(연령·레벨 구간)과 커뮤니케이션 일원화 원칙을 서면 합의하고, 개별 조건 제시·할인 금지를 상호 감시 가능한 규칙으로 명문화한다. 분기별 3자 회의로 갈등을 조기 조정한다."},{"risk":"150명 이상 확장 시 강사(특히 원어민) 수급 지연으로 수업 품질 저하","mitigation":"원어민 리크루팅 리소스를 활용해 학생 수 증가 1개 분기 전에 채용을 선행하고, 한국인 담임 + 원어민 클리닉 이중 구조로 원어민 1인 공백이 전체 시간표를 흔들지 않게 설계한다."},{"risk":"수완지구 기존 대형 어학원과의 정면 경쟁으로 외부 신규 유입 부진","mitigation":"가격 경쟁 대신 '영유부터 내신까지 수직 라인'이라는 구조적 차별화로 승부하고, 승계 재원생 기반으로 손익 방어선을 확보한 상태에서 성과 데이터 콘텐츠로 장기전을 편다."},{"risk":"차량 운영 비용 부담 및 안전 사고 리스크","mitigation":"탑승률 70% 기준의 분기별 노선 재편으로 비용을 통제하고, 전 차량 안전요원 동승·실시간 위치 공유·정기 안전 점검을 운영 표준으로 고정한다."},{"risk":"리드앤톡 통합·승계 합의가 지연·불발되면 개원 첫날 재원생 기반이라는 전제가 무너짐","mitigation":"합의 전에는 연계 협력 모델(별도 사업자+업무제휴)로 시작하는 플랜B를 병행 설계하고, 승계 전제 수치(오픈 30명 방어선 등)는 3자 합의 확정 후에만 실행 계획에 반영한다."}],"design":{"mood":"비비드하고 에너지 있는 프리미엄 어학원 톤. 딥그린을 메인으로 골드 포인트를 얹은 '모던 아이비리그' 무드 — 클래식 세리프 로고타입과 산세리프 본문의 대비, 원서 라이브러리를 연상시키는 깊은 녹색 공간감에 골드 라인 그래픽으로 성장 동선(파닉스→내신)을 시각화한다.","palette":[{"name":"딥그린 (메인)","hex":"#0A3B2E"},{"name":"비비드그린 (에너지 포인트)","hex":"#17B26A"},{"name":"클래식 골드 (프리미엄 포인트)","hex":"#C9A227"},{"name":"아이보리 (배경)","hex":"#F7F3E8"},{"name":"잉크 블랙 (텍스트)","hex":"#1C1C1A"}],"heroCopy":"파닉스의 첫 소리부터 내신 1등급까지 — 갈아타지 않는 영어, 수완에서 한 줄로 이어집니다.","uiIdea":"앱 홈 화면은 딥그린 배경 위에 골드 라인으로 그려진 세로형 '영어 성장 라인'(파닉스→리딩→라이팅→예비중→내신)이 중심이며, 아이의 현재 레벨이 빛나는 마커로 표시되고 다음 목표까지의 진행률이 채워진다. 그 아래로 오늘의 원서 읽기 기록 카드, 원어민 스피킹 클리닉 영상 피드백 카드, 셔틀 실시간 위치 위젯이 카드 스택으로 이어진다. 학부모 모드에서는 월간 리딩 지수 성장 그래프와 레벨업 리포트를 비비드그린 강조색으로 보여줘 '성장이 보이는 앱'이라는 인상을 준다."},"whyWins":"일반 신규 어학원은 0명에서 시작해 2~3년간 인지도를 쌓아야 하지만, 이 컨셉은 개원 첫날부터 리드앤톡 승계 재원생으로 방어선 매출을 확보하고, 리더스 영유 졸업생이라는 매년 반복되는 유입 파이프라인을 구조적으로 보유한 채 출발한다. 수완지구 학부모의 최대 불만인 '영유 끝나면 갈 곳이 애매하고, 리딩 학원은 중등에서 끊긴다'는 단절 문제를 파닉스→리딩→내신 수직 라인 하나로 해결하는 유일한 브랜드가 되며, 원어민 리크루팅 리소스와 검증된 커리큘럼으로 프리미엄 톤을 실체로 뒷받침한다. 할인 없는 정가 정책과 3자 협업 기반의 품위 있는 전환 설계는 지역 내 평판 리스크를 차단하면서, 유아부터 중등까지 8~10년의 재원 생애가치를 극대화한다 — 즉, 가장 빨리 손익분기에 도달하고 가장 오래 학생을 보유하는 구조라서 이긴다."},{"code":"C","conceptName":"데이터 러닝랩 — 검사·배치·플래너·리포트를 운영 프로그램화한 초·중 통합 학습관제 종합학원","brandNames":["WB러닝랩 수완","온트랙학원(ONTRACK)","러닝랩 수완 학습관제소"],"tagline":"검사로 시작해, 데이터로 관리하고, 리포트로 증명하는 초·중 공부 습관","positioning":"수완지구 유일의 '진단검사 → 맞춤 배치 → 플래너 관리 → 주간·월간 리포트' 풀사이클 데이터 관리형 국·영·수 종합학원. 감과 소문으로 고르는 보습학원 시장에서, 객관적 검사와 수치화된 관리로 아이의 공부가 '보이는' 학원이라는 자리를 선점한다. 초등부는 파이프라인, 중등부는 수익 중심축으로 하는 수직화 구조이며, 리더스 유치원·리드앤톡과의 3자 협업 연계로 유아기부터 중등까지 이어지는 성장 데이터 라인을 완성한다.","target":"수완지구 초3~중3 (핵심 타깃: 초5~중2). 객관적 리포트와 체계적 학습관리를 원하는 30~40대 학부모, 특히 리더스 유치원·영유 졸업 가정과 리드앤톡 재원 가정처럼 이미 '관리형 교육'을 경험한 가정. 수익 중심은 단가와 체류기간이 긴 중등부, 초등부는 중등 수직 전환을 위한 모수 확보 채널.","curriculum":[{"line":"IN-LAB 진단·배치","desc":"입학 시 진단검사(정가 청구)로 인지·학습 수준을 측정하고 과목별 레벨·반 배치와 개인 학습 로드맵을 산출. 6개월 주기 재검사로 성장 폭을 수치로 추적.","grade":"초3~중3 (전원 필수)"},{"line":"국어 독해랩","desc":"독해력 레벨 기반 소그룹 수업 + 어휘·비문학 데이터 트래킹. WB 독해력 노하우를 초·중으로 이식.","grade":"초3~중3"},{"line":"수학랩","desc":"단원별 성취도 데이터로 결손 지점을 찾아 메우는 진단·처방형 수학. 중등부는 학교별 내신 대비 트랙 병행.","grade":"초3~중3"},{"line":"영어랩(연계형)","desc":"영어 신규 문의는 리드앤톡 우선 안내를 원칙으로 명문화하고, 자체 영어랩은 리드앤톡이 커버하지 않는 구간(중등 내신)에 한정. 인수 학원의 기존 영어 재원생은 승계 유지 후 학년 전환 시 리드앤톡·중등 내신 트랙으로 자연 재배치(처리 기준은 3자 합의 항목).","grade":"중등 내신 중심 (승계생은 유지)"},{"line":"데이터 학습관리 시스템","desc":"주간 플래너 작성·수행률 체크, 주간 리포트 발송, 월간 학부모 브리핑을 운영 프로그램(매뉴얼+템플릿+앱)으로 표준화. 모든 반에 기본 탑재.","grade":"전 학년 공통"},{"line":"중등 내신 집중 트랙","desc":"수완지구 중학교별 기출·수행평가 데이터 기반 내신 집중반. 시험 4주 전 관리 모드 전환, 결과 분석 리포트 제공. 수익 중심 상품.","grade":"중1~중3"}],"absorption":{"leadersGrad":{"short":["3자(리더스 유치원 원장·리드앤톡 원장·WB) 협약 체결 후, 졸업생 학부모 대상 안내는 리더스 원장 명의로 일원화해 발송 — WB의 개별 접촉·조건 제시·할인 없음","리더스 유치원과 공동으로 '초등 학습 준비도 설명회' 1회 개최(오픈 전후), 진단검사는 정가 사전예약제로 운영","졸업 시즌 배포물(졸업앨범·안내문)에 초등 전환 로드맵 브로슈어를 동의 기반으로 동봉","졸업생 가정 대상 오픈하우스 초청(참관·상담 중심, 판촉성 혜택 없음)"],"mid":["매년 1~2월 '초등 입학 전 학습 로드맵' 세미나를 3자 공동 행사로 정례화","졸업생 전용 온보딩 트랙 운영: 진단 → 배치 → 4주 후 첫 성장 리포트까지 표준 사이클 제공","학부모 동의 하에 리더스 재원기 발달 기록과 입학 진단 결과를 연결한 '연속 성장 리포트' 시범 제공","졸업 기수별 등록 전환율을 분기 단위로 3자 회의에서 공유·개선"],"long":["'유치원 → 초등 → 중등' 12년 성장 로드맵을 3사 공동 브랜드 자산으로 문서화·홍보","졸업 기수 코호트별 리텐션·성취 데이터를 축적해 세미나 콘텐츠로 환류","졸업생 수요 데이터에 근거해 초1~2 브릿지 프로그램 신설 검토"]},"leadersAcademy":{"short":["두 원장 합의로 커리큘럼 연계 맵 확정: 어떤 과목·학년을 어느 원에서 담당하는지 역할 분담을 문서화","재원생 학부모 커뮤니케이션은 리더스 직영학원 원장 명의로 일원화 — WB의 재원생 개별 접촉·조건 제시·할인 일절 금지","상호 소개 프로토콜 문서화: 리더스 직영학원이 커버하지 않는 과목·학년에 한해서만 WB를 안내","3자 운영회의체(월 1회) 발족과 정산·소개 원칙 합의서 작성"],"mid":["학년 전환 시점(초등 고학년 → 중등)의 '자연 전환 트랙'을 공동 설계해 학부모에게 두 원장이 함께 브리핑","분기별 3자 회의에서 전환 현황·학부모 반응·이슈를 리뷰하고 프로토콜 보완","리더스 수업 데이터 + WB 진단 데이터를 합친 공동 리포트를 동의 가정 대상 시범 운영"],"long":["중등 전 과정은 WB로 수직 통합하고 리더스 직영학원은 유아·초저학년 특화로 역할 재편하는 그림을 합의 기반으로 추진","위탁운영·합병 등 브랜드·지분 통합 옵션을 3자 테이블에서 검토","통합 LMS로 원생 학습 데이터를 동의 기반 이관해 단일 관리 체계 완성"]},"readAndTalk":{"short":["리드앤톡 원장과 '영어는 리드앤톡, 국어·수학·학습관리는 WB' 상호보완 모델을 합의·문서화","재원생 안내는 리드앤톡 원장 명의로 일원화, 재원생 대상 개별 조건 제시·할인 없음","리드앤톡 재원생 학부모 대상 '데이터 학습관리 공동 설명회' 1회 개최(전환 권유가 아닌 보완 설계 소개)","시간표 사전 조율로 두 학원 병행 시 요일·시간 충돌 최소화"],"mid":["동의 기반으로 플래너·리포트 데이터를 공유해 영어(리드앤톡)+국·수(WB)를 묶은 '한 장 통합 리포트' 제공","중등 진학 시 영어 내신은 리드앤톡, 수학·국어 내신은 WB로 이어지는 공동 중등 트랙 운영","분기별 공동 학부모 브리핑으로 두 원장이 같은 데이터를 놓고 상담"],"long":["공동 레벨 체계를 만들어 리드앤톡 영어 과정을 WB 중등부 커리큘럼과 수준 단위로 통합","3자 합의 하에 리드앤톡 인수 또는 브랜드 통합 시나리오 검토(일방 추진 금지)","영어 포함 전 과목 단일 데이터 관리 시스템으로 '한 아이 한 대시보드' 완성"]},"external":{"short":["인수 학원 리브랜딩 오픈 행사 + 정가 진단검사 오픈 슬롯 운영 — 할인 대신 검사 리포트·상담의 가치로 소구","수완지구 맘카페·블로그에 '데이터로 관리하는 학원' 콘텐츠 시리즈 게시(진단→배치→리포트 과정 공개)","인근 초·중학교 학사일정에 맞춘 현수막·전단 집행과 네이버 플레이스 세팅·초기 리뷰 확보","오픈 후 4주간 등원·플래너 현황을 입구 대시보드 스크린으로 시각화해 차별점 체감"],"mid":["신학기(3·9월) 수완지구 학교별 교육과정·내신 분석 설명회 정례 개최","재원생 성장 리포트 사례(익명화)를 월 2회 콘텐츠로 발행","진단검사 → 상담 → 등록 전환 퍼널을 KPI로 관리하고 병목 단계를 개선","초6 대상 '중등 전환 설명회'로 중등부 신규 유입 창구 확보"],"long":["수완지구 중학교 내신 성과 사례를 축적해 '데이터 관리형 중등 학원'의 대표 인지를 확보하라 (대외 문구에는 '1등' 등 근거 없는 최상급 표현 금지 — 검증 가능한 사실·수치만 사용)","학교별 재원 점유율 데이터에 근거한 증설·2관(확장) 검토","연 1회 지역 초·중 학습 데이터 리포트(무료 발행)로 지역 내 데이터 관리 담론의 표준 장악"]}},"space":"기존 학원 인수 후 리브랜딩과 궁합이 가장 좋은 컨셉 — 수완지구 내 원생 40~80명 규모 국·영·수 보습학원을 인수해 4~6주에 걸쳐 간판→관리 시스템→커리큘럼 순으로 단계 전환하고, 인수 직후 8주는 시간표·담임 무변경으로 이탈을 방어한다(권리금 기준: 3개월치 원비 수준부터, 재무 실사 필수). 공간은 전용 60~80평: 6~10인 소형 강의실 6개, 진단검사·상담실 1실, 입구의 데이터 관제 데스크(등원 체크인·플래너 확인), 자습·클리닉 존 1개소. 기존 강의실 배치를 최대한 승계해 공사비를 아끼고, 입구 '오늘의 학습 현황' 대시보드 스크린과 다크 네이비+민트 사인물로 리브랜딩을 시각적으로 각인시킨다.","vehicle":"※ 인터뷰 확정(2026-08): 개원부터 지입 차량 1대 운영. 아래 단계안은 비용 절감 대안으로 보존 — 1단계(승계 원생 중심 ~80명): 무차량, 인수 학원의 기존 통학 패턴 유지. 2단계(100명~): 지입 차량 1대(월 약 250만원, 약 20명 커버) 도입해 인접 단지 노선 신설. 3단계(150명 이상): 중등부 확대에 맞춰 저녁 시간대 노선 추가·증차 검토. 저학년 1시간 수업+차량 조합은 비효율(회의 기준)이므로 저학년은 2~3시간 블록 수업으로 재설계한다.","pricing":"가정 원비: 초등 종합(국·영·수+데이터 관리) 월 28만원, 중등 종합 월 38만원, 관리 단과(플래너+리포트, 리드앤톡 병행 가정용) 월 12만원 — 회의 언급 원비 범위(18~28만)의 상단 프리미엄 가정이므로 계산기 기본 평균 24만원과 구분해 민감도 검증이 필요하다. 입학 진단검사는 원비와 별도 WB 정가 청구(웩슬러 15만·성향기질 20만·통합 35만), 교재비 실비. 모든 채널(리더스 졸업생·직영학원 연계·리드앤톡 연계·외부 신규)에 동일 정가 적용 — 재원생 조건 제시·할인 금지 원칙을 가격표 차원에서 고정한다.","scenarios":[{"students":30,"monthlyRevenue":"평균 28만원 × 30명 = 840만원 (가정)","note":"오픈 0~3개월. 인수 승계 원생 중심, 초등 비중 높음. 임대료·인건비(가정) 감안 시 적자 구간으로 자금 버퍼 필요."},{"students":50,"monthlyRevenue":"평균 30만원 × 50명 = 1,500만원 (가정)","note":"3~6개월 차. 중등 비중 약 20%로 객단가 상승. 고정비 규모(확정 임대료 데이터 필요)에 따라 BEP 근접 구간."},{"students":150,"monthlyRevenue":"평균 32만원 × 150명 = 4,800만원 (가정)","note":"12~18개월 목표. 중등 비중 35%, 강사 5~6명 체제. 3자 연계 채널과 외부 신규가 절반씩 기여하는 구조가 이상적."},{"students":300,"monthlyRevenue":"평균 33만원 × 300명 = 9,900만원 (가정)","note":"3년 차 목표 상한. 중등 비중 50%로 수직화 완성. 현 공간 기준 수용 한계로 증설 또는 2관 전개가 전제."}],"kpi":["재원생 수(월말 기준)와 월 순증 인원","월 퇴원율 3% 이하(가정 목표) 및 6개월 리텐션","진단검사 → 등록 전환율 (연계 채널 60%·외부 신규 40% 차등 가정 목표)","채널별 유입 비중(리더스 졸업생/직영학원 연계/리드앤톡 연계/외부 신규 4채널 태깅)","플래너 수행률과 주간 리포트 정시 발송률 95% 이상","중등부 재원 비중(1년 차 35% → 3년 차 50% 목표)","인당 객단가와 월 매출, BEP 도달 시점(확정 고정비 데이터 수신 후 산출)","3자 협업 채널의 분기별 전환 건수와 클레임 0건 유지"],"risks":[{"risk":"가정 단가(초등 28만·중등 38만)가 수완 시장 수용도·인수 학원 기존 원비와 어긋나면 시나리오·BEP가 통째로 틀어질 수 있음","mitigation":"오픈 전 인수 학원 기존 원비와 경쟁 학원 시세를 실사해 단가를 확정하고, 시나리오 계산기로 24만~38만 구간 민감도 분석을 실행 전 필수 게이트로 둔다."},{"risk":"인수 학원 기존 원생의 리브랜딩 이탈(담임·시간표 변경 불안)","mitigation":"인수 후 8주 시간표·담임 무변경 유지, 기존 강사 승계, 원장 대면 상담을 통한 전환 안내, 진단검사·리포트를 '추가 혜택'으로 먼저 체감시킨 뒤 커리큘럼 전환"},{"risk":"3자 협업 갈등 — 재원생을 '빼앗겼다'는 인식이 생기면 리더스·리드앤톡 관계 전체가 훼손","mitigation":"협약서에 원장 명의 커뮤니케이션 일원화, 재원생 조건 제시 지양, 할인 금지, 역할 분담과 소개 프로토콜을 명문화하고 분기 3자 회의에서 상호 점검"},{"risk":"데이터 관리 운영 부담 — 플래너·리포트 공수가 커지면 품질 저하 또는 강사 번아웃","mitigation":"리포트·플래너를 템플릿과 앱으로 자동화해 강사 1인당 관리 공수를 표준화하고, 학습관리 전담 인력 1명을 초기부터 배치"},{"risk":"수완지구 저가 보습학원과의 가격 경쟁 압박","mitigation":"할인 금지 원칙을 유지하고 검사·배치·리포트라는 눈에 보이는 산출물로 정가를 방어, 가격이 아닌 '관리의 증거'로 경쟁"},{"risk":"수익 중심인 중등부 강사(수학·영어) 수급 실패 시 수직화 전략 지연","mitigation":"오픈 전 중등 핵심 강사 선채용, 재원생 수 연동 인센티브 설계, 커리큘럼·리포트 시스템화로 강사 의존도 자체를 낮춤"}],"design":{"mood":"다크 네이비 대시보드 위에 민트·시안 데이터 포인트가 빛나는 테크·데이터 무드. '학원'이 아니라 '학습 관제센터'로 보이게 — 차분하고 신뢰감 있는 어두운 바탕에 성장 지표만 형광으로 살아 움직이는 인상.","palette":[{"name":"딥 네이비(배경)","hex":"#0A1F33"},{"name":"패널 네이비(카드)","hex":"#14304D"},{"name":"민트(핵심 지표·CTA)","hex":"#2EE6A8"},{"name":"시안(보조 그래프)","hex":"#35C4F0"},{"name":"오프화이트(텍스트)","hex":"#F2F6FA"}],"heroCopy":"감으로 가르치지 않습니다. 검사로 시작해, 데이터로 관리하고, 리포트로 증명합니다 — 아이의 공부가 보이는 학원, 러닝랩.","uiIdea":"학부모 앱 첫 화면은 자녀별 다크 네이비 대시보드로, 이번 주 플래너 수행률이 민트색 링 게이지로 중앙에 뜨고 그 아래 국·영·수 성취 추이가 시안색 스파크라인으로 흐른다. 리포트 발행일에는 카드형 '주간 리포트'가 상단에 떠오르고 탭 한 번으로 담당 강사 코멘트와 다음 주 학습 배치가 열린다. 진단검사 결과는 레이더 차트로 시각화되어 입학 시점 대비 성장 폭을 항상 비교해 보여준다."},"whyWins":"첫째, 수완지구 보습학원 시장에서 '검사–배치–플래너–리포트'를 운영 프로그램으로 표준화한 데이터 관리형 종합학원은 명확한 공백 포지션이며, WB의 검사·독해력 관리 역량을 그대로 이식할 수 있어 모방이 어렵다. 둘째, 리더스 유치원 졸업생·직영학원·리드앤톡이라는 세 개의 검증된 파이프라인을 3자 합의 기반 연계로 묶어, 광고비 없이도 신뢰 기반 유입이 구조적으로 발생한다. 셋째, 기존 학원 인수 리브랜딩으로 오픈 첫 달부터 승계 원생 매출이 깔리고, 초등(모수) → 중등(수익)의 수직화로 객단가와 체류기간이 함께 늘어나는 구조라 150명 이상 구간에서 수익성이 가파르게 개선된다. 마지막으로 할인 없는 정가 정책과 눈에 보이는 리포트 산출물이 결합해 가격 경쟁이 아닌 '관리의 증거' 경쟁으로 판을 옮기는 것이 이 컨셉의 승리 공식이다."}],"interview":{"sections":[{"id":"vision","title":"1. 비전·컨셉","intro":"새 학원이 '무엇이 되어야 하는지'를 먼저 정합니다. 여기서의 답이 이후 모든 질문(입지, 자금, 가격, 인력)의 기준점이 됩니다.","questions":[{"id":"v1","q":"수완 신규 학원의 핵심 정체성을 하나만 고른다면?","type":"multi","hint":"WB 본원의 강점=웩슬러 검사·문해력 데이터, 파트너 강점=리더스 졸업생 풀·리드앤톡 영어 콘텐츠","options":[{"label":"WB 검사데이터 기반 문해력 전문관 (본원의 수완 분원)","weight":{"A":3}},{"label":"리드앤톡과 연계한 영어 중심 어학원","weight":{"B":3}},{"label":"국어·영어·학습코칭을 묶은 초중 종합 러닝랩","weight":{"C":3}},{"label":"아직 미정 — 시장 반응을 보며 확정","weight":{"A":1,"B":1,"C":1}}]},{"id":"v2","q":"핵심 타깃 학년대는 어디입니까?","type":"single","hint":"리더스 유치원은 매년 7세 졸업생을 배출 — 졸업 직후 바로 흡수할지, 초등 중학년에 재접점을 만들지 선택","options":[{"label":"7세~초2 (리더스 졸업 직후 흡수)","weight":{"A":1,"B":2}},{"label":"초3~초6 (문해력 골든타임)","weight":{"A":2,"C":1}},{"label":"초5~중2 (독해·내신 수요)","weight":{"C":3}},{"label":"전 학년 폭넓게","weight":{"B":2,"C":1}}]},{"id":"v3","q":"새 학원이 WB 본원에서 반드시 가져가야 할 자산은? (복수 선택)","type":"multi","hint":"검사데이터 체계는 본원의 차별화 핵심 자산 — 많이 가져갈수록 A형(문해력·데이터 소수정예) 컨셉에 가까워짐","options":[{"label":"웩슬러·문해력 검사 시스템","weight":{"A":3,"C":1}},{"label":"문해력 커리큘럼·교재","weight":{"A":2}},{"label":"학부모 리포트·데이터 관리 체계","weight":{"A":1,"C":2}},{"label":"WB 브랜드명","weight":{"A":1,"C":1}},{"label":"리드앤톡 영어 콘텐츠·도서관 (본원 자산 대신 파트너 자산 중심)","weight":{"B":3}}]},{"id":"v4","q":"3자 협업(리더스 원장·리드앤톡 원장)에서 대표가 절대 양보할 수 없는 원칙 한 가지를 적어주세요.","type":"text","placeholder":"예: 커리큘럼 결정권은 내가 갖는다 / 검사 데이터 소유권은 WB / 지분 50% 미만 불가","hint":"이 답이 이후 역할 충돌·수익 배분 협상에서 대표의 의 직접 영업 메시지로 보이는 순간 신뢰 자산이 훼손된다. 개인정보 활용 동의 확인이 선행 조건.","phases":{"short":[{"task":"졸업생 연계 동의 확보 체계를 리더스와 함께 구축하라","detail":"명단·연락처는 리더스가 계속 보유하고 안내 발송도 리더스 원장 명의로 대행한다. WB는 학부모가 '제3자 제공 동의'를 명시적으로 한 가정의 정보만 수령하며, 동의서 양식과 수집 항목(최소한)을 오픈 전에 확정한다 — 동의 없는 명단 이관은 개인정보보호법 위반 소지.","kpi":"졸업 예정 가정의 제3자 제공 동의 확보율 60% 이상","owner":"리더스 원장"},{"task":"리더스 원장 명의로 '졸업생 성장 초청' 안내를 발송하라","detail":"할인 언급 없이 졸업생 전용 독해력 진단과 성장 리포트 제공을 핵심 혜택으로 안내한다. 발신 주체는 반드시 리더스 원장으로 일원화해 신규 학원의 영업 메시지로 읽히지 않게 한다.","kpi":"발송 대비 진단·상담 예약률 30% 이상","owner":"리더스 원장"},{"task":"졸업생 가정에 검사 우선 예약권을 제공하라","detail":"웩슬러(15만)·성향기질(20만)·통합(35만) 검사를 졸업생 가정 우선 슬롯으로 열어 첫 방문 접점을 만든다. 검사 결과 상담에서 초등 독해 로드맵을 제시해 자연스럽게 등록 상담으로 연결한다 — '검사→해석→로드맵→등록' 표준 퍼널 스크립트를 이 단계에서 최초 구축한다. 안내 발송 명의는 리더스 원장으로 하고, 상담실장은 예약 접수·상담 실무를 지원한다.","kpi":"오픈 3개월 내 졸업생 검사 예약 10건, 검사 후 등록 전환 40%","owner":"상담실장"},{"task":"오픈 프리뷰 데이에 졸업생 가정을 우선 초청하라","detail":"정식 오픈 전 졸업생 가정만 초청하는 프리뷰 데이를 열어 'VIP 초청' 프레임을 만든다. 현장에서는 등록 권유 대신 공간·커리큘럼 체험과 검사 예약 접수에만 집중한다. 초청장 발신 명의는 리더스 원장, WB는 행사 운영을 맡는다.","kpi":"15가정 이상 참석, 참석 가정의 검사·상담 예약 전환 50%","owner":"WB 대표"},{"task":"졸업생 전용 웰컴 키트를 제작하라","detail":"리더스와 WB 로고를 함께 넣은 독서 노트·학습 키트 등 비가격 혜택 패키지를 만든다. 등록 시점이 아니라 첫 방문 시점에 제공해 심리적 소속감을 먼저 형성한다.","kpi":"오픈 전 제작 완료, 첫 방문 졸업생 가정 100% 전달","owner":"상담실장"}],"mid":[{"task":"2월 졸업 시즌 전환 캠페인을 정례화하라","detail":"리더스 졸업식·수료식 일정과 연동해 '초등 준비 설명회 → 검사 → 등록'으로 이어지는 시즌 캠페인을 설계한다. 매년 반복 가능한 표준 일정표와 안내문 템플릿을 확정해 자산화한다.","kpi":"당해 졸업생의 30% 이상 검사·상담 유입","owner":"WB 대표"},{"task":"등록한 졸업생 학부모를 서포터즈로 위촉하라","detail":"만족도 높은 졸업생 학부모 5명 내외를 서포터즈로 위촉해 후기 작성·지인 소개의 자연 바이럴 축으로 삼는다. 보상은 할인 대신 성장 리포트 추가 제공, 우선 상담권 등 비가격 혜택으로 설계한다.","kpi":"서포터즈 5명 위촉, 서포터즈 경유 신규 상담 월 3건","owner":"상담실장"},{"task":"검사→등록 퍼널 전환율을 개선하라","detail":"단기에 구축한 표준 퍼널의 병목 단계(검사 후 미상담·상담 후 미등록)를 월간 분석해 스크립트·안내문·상담 프로세스를 반복 개선한다. 결과 해석 상담은 검사에 포함된 정규 서비스로 운영한다(별도 무상 프레임 금지).","kpi":"검사 가정 등록 전환율 40% → 50% 단계 개선","owner":"상담실장"},{"task":"졸업생 성장 사례를 콘텐츠로 축적하라","detail":"학부모 동의를 받은 졸업생의 전후 성장 사례를 블로그·안내문 콘텐츠로 제작한다. 개인 식별 정보를 제거하고 검사 데이 function migrate(st){
  // 구버전 localStorage(확정 답변 도입 前: answers:{}, selectedConcept:null 등)가
  // 새 기본 시드를 덮지 않도록 키 단위 병합·복원한다.
  const base = defaultState();
  const merged = Object.assign({}, base, st);   // base를 변이시키지 않도록 새 객체에 병합
  merged.answers = Object.assign({}, CONFIRMED_ANSWERS, st.answers || {});
  if(!st.selectedConcept) merged.selectedConcept = 'C';
  if(!st.openDate) merged.openDate = base.openDate;
  if(!st.memo) merged.memo = base.memo;
  if(!st.simConfig) merged.simConfig = base.simConfig;
  if(!Array.isArray(st.savedSims)) merged.savedSims = [];
  if(!st.agreements) merged.agreements = base.agreements;
  if(!st.duediligence) merged.duediligence = base.duediligence;
  if(!Array.isArray(st.funnelEntries)) merged.funnelEntries = [];
  return merged;
}
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const st = JSON.parse(raw);
      if(st && typeof st === 'object' && !Array.isArray(st)) return migrate(st);
    }
  }catch(e){}
  return defaultState();
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 1800);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ══════════════════ 공통 계산 ══════════════════ */
function interviewProgress(){
  const qs = DATA.interview.sections.flatMap(s=>s.questions);
  if(!qs.length) return {done:0,total:0,pct:0};
  const done = qs.filter(q=>{
    const v = S.answers[q.id];
    return v!==undefined && v!==null && v!=='' && !(Array.isArray(v)&&!v.length);
  }).length;
  return {done, total:qs.length, pct: Math.round(done/qs.length*100)};
}
function conceptScores(){
  const sc = {A:0,B:0,C:0};
  DATA.interview.sections.forEach(sec=>sec.questions.forEach(q=>{
    if(!q.options) return;
    const v = S.answers[q.id];
    if(v===undefined||v===null) return;
    const chosen = Array.isArray(v)?v:[v];
    q.options.forEach(o=>{
      if(chosen.includes(o.label) && o.weight){
        sc.A += o.weight.A||0; sc.B += o.weight.B||0; sc.C += o.weight.C||0;
      }
    });
  }));
  return sc;
}
function allActions(){
  const out = [];
  (DATA.matrix.channels||[]).forEach(ch=>{
    ['short','mid','long'].forEach(ph=>{
      (ch.phases[ph]||[]).forEach((a,i)=>out.push({key:ch.id+'|'+ph+'|'+i, channel:ch.id, phase:ph, ...a}));
    });
  });
  (S.customActions||[]).forEach(a=>out.push({key:a.id, channel:a.channel, phase:a.phase, task:a.task, detail:a.detail, kpi:a.kpi, custom:true}));
  return out;
}
function boardProgress(){
  const acts = allActions();
  if(!acts.length) return {done:0,total:0,pct:0};
  const done = acts.filter(a=>(S.actionState[a.key]||0)===2).length;
  return {done, total:acts.length, pct:Math.round(done/acts.length*100)};
}
function taskProgress(){
  const t = S.tasks||[];
  if(!t.length) return {done:0,total:0,pct:0};
  const done = t.filter(x=>x.col==='done').length;
  return {done, total:t.length, pct:Math.round(done/t.length*100)};
}
function dday(){
  if(!S.openDate) return null;
  const d = new Date(S.openDate+'T00:00:00');
  if(isNaN(d)) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((d-today)/86400000);
}

      </div>
    </div>

function ivGo(i){ ivIdx = Math.max(0, i); window.scrollTo({top:0}); renderInterview(); }
function renderQuestion(q){
  const v = S.answers[q.id];
  let body = '';
  if(q.type==='single' || q.type==='multi'){
    const chosen = Array.isArray(v)?v:(v!=null?[v]:[]);
    body = `<div class="opt-row">${(q.options||[]).map(o=>`
      <button class="opt ${chosen.includes(o.label)?'sel':''}" onclick="pick('${esc(q.id)}','${esc(String(o.label).replace(/'/g,"\\'"))}',${q.type==='multi'})">
        ${esc(o.label)}${o.hint?`<span class="oh">${esc(o.hint)}</span>`:''}
      </button>`).join('')}</div>`;
  } else if(q.type==='number'){
    body = `<input type="number" class="q-input" style="max-width:200px" value="${v!=null?esc(v):''}"
      onchange="setAns('${esc(q.id)}', this.value===''?'':Number(this.value))">${q.unit?`<span class="unit">${esc(q.unit)}</span>`:''}`;
  } else if(q.type==='scale'){
    body = `<div class="scale-row">${[1,2,3,4,5].map(n=>`
      <button class="opt ${v===n?'sel':''}" onclick="setAns('${esc(q.id)}',${n});renderInterview()">${n}</button>`).join('')}
      <span class="unit">1 낮음 ~ 5 높음</span></div>`;
  } else {
    body = `<textarea class="q-input" placeholder="${esc(q.placeholder||'')}"
      onchange="setAns('${esc(q.id)}', this.value)">${v!=null?esc(v):''}</textarea>`;
  }
  return `<div class="q-block">
    <div class="q-title">${esc(q.q)}</div>
    ${q.hint?`<div class="q-hint">💡 ${esc(q.hint)}</div>`:''}
    ${body}
  </div>`;
}
function setAns(qid, val){ S.answers[qid] = val; save(); }
function pick(qid, label, multi){
  if(multi){
    const cur = Array.isArray(S.answers[qid])?S.answers[qid].slice():[];
    const ix = cur.indexOf(label);
    if(ix>=0) cur.splice(ix,1); else cur.push(label);
    S.answers[qid] = cur;
  } else {
    S.answers[qid] = (S.answers[qid]===label)? undefined : label;
  }
  save(); renderInterview();
}

const CALC_DEFAULT = {students:50, fee:24, rent:165, deposit:4000, premium:1500, fitout:5000,
  teacherRatio:33, vanCount:0, vanCost:250, etcCost:300, invest:12000, testsPerMonth:5, testPrice:35};
function calcDefaults(){
  // 인터뷰 확정 답변이 있으면 그 값을 기본으로 (원비 c2, 차량 t1, 총투자 f1)
  // 검사 단가는 통합상품(웩슬러+성향기질) 35만 — c3 '입회 필수 관문' 답변과 정합
  return Object.assign({}, CALC_DEFAULT, {

function calcSet(k,v){ S.calc = calcState(); S.calc[k] = isNaN(v)?0:v; save(); renderCalc(); }
function calcReset(){ S.calc = null; save(); renderCalc(); }

/* ══════════════════ ⑥ 커리큘럼·시간표 생성기 ══════════════════
   인터뷰 답변(정원 정책·운영시간대·강사수·목표원생수)과 선택된 컨셉의
   커리큘럼 라인을 조합해 반편성표·주간 시간표·강사 배정을 자동 계산한다.
   순수 함수 조합이라 답변/설정을 바꾸면 화면을 다시 열 때마다 즉시 재계산된다. */
const TIER_CAPACITY = { premium: 4, standard: 7, blended: 12 };
const TIER_LABEL = { premium: '프리미엄 소수정예 (4명)', standard: '표준 (6~8명)', blended: '블렌디드 그룹 (10명+)' };
const NON_CLASS_KEYWORDS = ['진단', '배치', '학습관리 시스템', '관리 시스템'];
const DAY_PAIRS = [['월','목'], ['화','금'], ['월','수'], ['화','목'], ['수','금']];
const TIME_WINDOWS = {
  '평일 오후 2~8시 (초등 하교 후 집중)': [14, 20],
  '오전(7세 프로그램) + 오후 초등': [9, 18],
  '오후 + 저녁 (중등 내신까지 커버)': [14, 22],
};

function isSchedulableLine(line){
  // 라인 "이름"만 검사한다 (설명 문장엔 '진단·처방형 수학'처럼 실제 수업 라인의
  // 설명어로도 흔히 등장해 오탐 소지가 큼 — 인프라성 라인은 대개 이름 자체가 명시적임)
  return !NON_CLASS_KEYWORDS.some(k => line.line.includes(k));
}
function defaultTierForLine(line){
  if(/내신|집중|클리닉|심화/.test(line.line)) return 'premium';
  if(/연계|블렌디드/.test(line.line)) return 'blended';
  return 'standard';
}
function allowedTiers(){
  const c4 = S.answers.c4;
  const arr = Array.isArray(c4) ? c4 : (c4 ? [c4] : []);
  const map = { '반당 4명 이하 소수정예':'premium', '반당 6~8명 표준':'standard', '반당 10명 이상 + 레벨 세분화':'blended' };
  const allowed = arr.map(a=>map[a]).filter(Boolean);
  return allowed.length ? allowed : ['premium','standard','blended'];
}
function scheduleGenState(){
  const g = S.scheduleGen || {};
  const [defStart, defEnd] = TIME_WINDOWS[S.answers.t2] || [14, 20];
  return {
    target: g.target != null ? g.target : (S.answers.g2 || S.answers.s2 || 100),
    teacherCount: g.teacherCount != null ? g.teacherCount : (S.answers.p2 || 4),
    rooms: g.rooms != null ? g.rooms : 4,
    startHour: g.startHour != null ? g.startHour : defStart,
    endHour: g.endHour != null ? g.endHour : defEnd,
    sessionsPerWeek: g.sessionsPerWeek != null ? g.sessionsPerWeek : 2,
    sessionHours: g.sessionHours != null ? g.sessionHours : 2,
    tierOverride: g.tierOverride || {},
  };
}
function setScheduleGen(patch){
  S.scheduleGen = Object.assign(scheduleGenState(), patch);
  save(); renderSchedule();
}
function buildCurriculumPlan(concept, gen){
  const lines = concept.curriculum.filter(isSchedulableLine);
  const commonLines = concept.curriculum.filter(l=>!isSchedulableLine(l));
  const n = Math.max(1, lines.length);
  const allowed = allowedTiers();
  // 목표 인원을 라인 수로 나누되, 나머지는 앞 라인부터 1명씩 추가 배정 (합계 = 목표)
  const basePer = Math.floor(gen.target / n), remainder = gen.target - basePer*n;
  const rows = lines.map((line, i) => {
    let tier = gen.tierOverride[line.line] || defaultTierForLine(line);
    if(!allowed.includes(tier)) tier = allowed[0];   // 선택지에 없는 티어는 허용 티어로 보정
    const cap = TIER_CAPACITY[tier];
    const allocated = basePer + (i < remainder ? 1 : 0);
    const sections = Math.max(1, Math.ceil(allocated / cap));
    return { line, tier, cap, sections, allocated, covered: sections * cap };
  });
  const totalAllocated = rows.reduce((a,r)=>a+r.allocated, 0);
  const totalCovered = rows.reduce((a,r)=>a+r.covered, 0);
  return { rows, commonLines, totalAllocated, totalCovered };
}
function fmtHour(h){ return `${Math.floor(h)}:${h%1 ? '30' : '00'}`; }
function buildWeeklyGrid(plan, gen){
  const blocks = [];
  for(let h=gen.startHour; h+gen.sessionHours<=gen.endHour; h+=gen.sessionHours) blocks.push(`${fmtHour(h)}~${fmtHour(h+gen.sessionHours)}`);
  if(!blocks.length) blocks.push(`${fmtHour(gen.startHour)}~${fmtHour(gen.endHour)}`);
  const nTeachers = Math.max(1, gen.teacherCount);
  const teacherLoad = Array(nTeachers).fill(0);
  const cells = [];      // {lineName, tier, sectionNo, dayPair, block, room, teacher, students}
  const unplaced = [];   // 강의실·시간 부족으로 배정 못 한 반
  // 요일 단위 점유표 — 요일쌍(월목 vs 월수)이 겹치는 날까지 정확히 잡는다
  const occ = {};        // `${요일}|${블록}` -> { rooms:Set, teachers:Set }
  const slotOf = (dp, block) => dp.map(d => occ[d+'|'+block] || (occ[d+'|'+block] = { rooms:new Set(), teachers:new Set() }));
  let cursor = 0;
  plan.rows.forEach(row => {
    for(let s=0; s<row.sections; s++){
      // 부하가 적은 강사 순으로 시도
      const order = teacherLoad.map((load,i)=>({i,load})).sort((a,b)=>a.load-b.load).map(o=>o.i);
      let placed = null;
      outer:
      for(const t of order){
        for(let j=0; j<DAY_PAIRS.length*blocks.length; j++){
          const k = (cursor + j) % (DAY_PAIRS.length*blocks.length);
          const dp = DAY_PAIRS[k % DAY_PAIRS.length];
          const block = blocks[Math.floor(k / DAY_PAIRS.length) % blocks.length];
          const slots = slotOf(dp, block);
          if(slots.some(sl => sl.teachers.has(t))) continue;         // 강사 동시간 중복 방지
          let room = null;
          for(let r=1; r<=gen.rooms; r++){ if(slots.every(sl => !sl.rooms.has(r))){ room = r; break; } }
          if(room === null) continue;                                 // 그 시간대 강의실 만석
          slots.forEach(sl => { sl.rooms.add(room); sl.teachers.add(t); });
          teacherLoad[t] += dp.length * gen.sessionHours;             // 주 2회 × 세션시간
          placed = { dayPair: dp, block, room, teacher: t+1 };
          cursor = (k + 1) % (DAY_PAIRS.length*blocks.length);
          break outer;
        }
      }
      const remain = row.allocated - s*row.cap;
      const students = Math.max(1, Math.min(row.cap, remain > 0 ? remain : row.cap));
      if(placed){
        cells.push({ lineName: row.line.line, tier: row.tier, sectionNo: s+1, students, ...placed });
      } else {
        unplaced.push({ lineName: row.line.line, sectionNo: s+1, students });
      }
    }
  });
  return { blocks, cells, teacherLoad, unplaced };
}

function formatAnswer(q, v){
  if(v===undefined||v===null||v==='') return null;
  if(Array.isArray(v)){ if(!v.length) return null; return v.join(', '); }
  if(q.type==='number') return num(v) + (q.unit?' '+q.unit:'');
  if(q.type==='scale') return v + ' / 5';
  return String(v);
}

  lines.push(`- 선택 컨셉: ${sel?sel.conceptName+' — '+sel.tagline:'미선택'}`);

    const rows = sec.questions.map(q=>{const t=formatAnswer(q, S.answers[q.id]); return t?`  · ${q.q} → ${t}`:null;}).filter(Boolean);

    navigator.clipboard.writeText(text).then(()=>toast('요약 텍스트가 복사되었습니다')).catch(()=>fallbackCopy(text));
  } else { fallbackCopy(text); }

function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('요약 텍스트가 복사되었습니다'); }catch(e){ toast('복사 실패 — 텍스트를 직접 선택해 복사해주세요'); }
  document.body.removeChild(ta);
}

/* ══════════════════ 📈 손익 시뮬레이션 (3개년) ══════════════════ */
function pnlSeries(){
  const c = calcState();
  const price = S.answers.c2 || c.fee;
  const points = [
    { m:0,  students:0 },
    { m:3,  students: S.answers.s2 || 100 },
    { m:12, students: S.answers.g2 || 150 },
    { m:24, students: Math.round(((S.answers.g2||150)+300)/2) },
    { m:36, students: 300 },
  ];
  let prevStudents = 0, prevMonth = 0;
  return points.map(p=>{
    const tuitionRevenue = p.students * price;
    // 검사 매출: 그 구간에서 늘어난 신규 학생 수 × 검사 단가(입회 필수 관문) ÷ 경과 개월 = 월평균 검사 매출
    const newStudents = Math.max(0, p.students - prevStudents);
    const monthsElapsed = Math.max(1, p.m - prevMonth);
    const testRevenueMonthly = newStudents > 0 ? (newStudents * c.testPrice) / monthsElapsed : 0;
    const revenue = tuitionRevenue + testRevenueMonthly;
    const teacher = tuitionRevenue * (c.teacherRatio/100);
    const cost = c.rent + teacher + (c.vanCount*c.vanCost) + c.etcCost;
    const profit = revenue - cost;
    prevStudents = p.students; prevMonth = p.m;
    return { ...p, tuitionRevenue, testRevenue: testRevenueMonthly, revenue, cost, profit };
  });
}
function renderPnl(){
  const series = pnlSeries();
  const W = 640, H = 300, PAD = { t:24, r:20, b:36, l:56 };
  const plotW = W-PAD.l-PAD.r, plotH = H-PAD.t-PAD.b;
  const maxM = series[series.length-1].m || 1;
  const maxY = Math.max(...series.map(s=>s.revenue), 1) * 1.15;
  const minY = Math.min(...series.map(s=>s.profit), 0) * 1.15;   // 개원 초기 적자를 숨기지 않는다
  const x = m => PAD.l + (m/maxM)*plotW;                          // 개월수 비례 (시간 왜곡 방지)
  const y = v => PAD.t + plotH * (maxY - v) / (maxY - minY);
  const zeroY = y(0);
  const revPath = series.map((s,i)=>`${i===0?'M':'L'}${x(s.m)},${y(s.revenue)}`).join(' ');
  const profitPath = series.map((s,i)=>`${i===0?'M':'L'}${x(s.m)},${y(s.profit)}`).join(' ');
  const areaPath = revPath + ` L${x(maxM)},${zeroY} L${x(0)},${zeroY} Z`;

  app.innerHTML = `

function showChartTip(e, text){

  const rect = card.getBoundingClientRect();
  tip.style.left = (e.clientX - rect.left + card.scrollLeft + 12) + 'px';  // 가로 스크롤 보정

}

/* ══════════════════ 🎯 모집 퍼널 실측 대시보드 ══════════════════ */
const FUNNEL_STAGES = [
  { key:'inquiry', label:'문의' }, { key:'testBooked', label:'검사예약' },
  { key:'testDone', label:'검사실시' }, { key:'consult', label:'결과상담' }, { key:'enrolled', label:'등록' },
];
function addFunnelEntry(){
  const month = prompt('기준 월 (예: 2026-11)'); if(!month) return;
  const vals = {};
  for(const s of FUNNEL_STAGES){
    const v = prompt(`${s.label} 건수:`, '0');
    if(v === null) return;
    vals[s.key] = Math.max(0, Number(v)||0);
  }
  S.funnelEntries = S.funnelEntries || [];
  S.funnelEntries.push({ id:'fn'+Math.random().toString(36).slice(2,9), month, ...vals });
  S.funnelEntries.sort((a,b)=>a.month<b.month?-1:1);
  save(); renderFunnel(); toast('입력 완료');
}
function delFunnelEntry(id){
  S.funnelEntries = (S.funnelEntries||[]).filter(e=>e.id!==id); save(); renderFunnel();
}
function renderFunnel(){
  const entries = S.funnelEntries || [];
  const latest = entries[entries.length-1];
  const totals = FUNNEL_STAGES.reduce((acc,s)=>{ acc[s.key] = entries.reduce((a,e)=>a+(e[s.key]||0),0); return acc; }, {});
  const target3mo = S.answers.s2 || 100, target12mo = S.answers.g2 || 150;
  app.innerHTML = `
  <section class="view">
    <div class="eyebrow">Recruitment Funnel — Actuals</div>

    ${!entries.length ? `<div class="card"><p class="small muted">아직 입력된 실적이 없습니다. "월별 실적 입력"으로 첫 데이터를 추가하세요.</p></div>` : `
    <div class="card">
      <h3>누적 퍼널 (${entries[0].month} ~ ${entries[entries.length-1].month})</h3>
      ${FUNNEL_STAGES.map((s,i)=>{
        const val = totals[s.key];
        const base = totals[FUNNEL_STAGES[0].key] || 1;
        const pct = Math.round(val/base*100);
        const prevVal = i>0 ? totals[FUNNEL_STAGES[i-1].key] : null;
        const stepPct = prevVal ? Math.round(val/Math.max(prevVal,1)*100) : 100;
        return `<div class="funnel-row">

      <table class="mini">
        <thead><tr><th>월</th>${FUNNEL_STAGES.map(s=>`<th>${esc(s.label)}</th>`).join('')}<th>등록전환율</th><th></th></tr></thead>

const SIM_CAP_MAP = { premium:4, standard:7, blended:12 };

function simConfig(){ return S.simConfig || defaultState().simConfig; }
function setSim(key, val){
  S.simConfig = Object.assign({}, simConfig(), {[key]:val});
  save(); renderSimulator();
}
function simTagline(cfg){
  return `${SIM_TEXT.focus[cfg.focus]} ${SIM_TEXT.format[cfg.format]} 학원입니다. ${SIM_TEXT.testUsage[cfg.testUsage]} 운영 방식이며, ${SIM_TEXT.vehicle[cfg.vehicle]} ${SIM_TEXT.pricePosition[cfg.pricePosition]} 포지셔닝입니다.`;
}
function simPnlPreview(cfg){
  const c = calcState();
  const price = SIM_PRICE_MAP[cfg.pricePosition];
  const students = S.answers.g2 || 150;
  const revenue = students * price;
  const teacher = revenue * (c.teacherRatio/100);
  const van = cfg.vehicle === 'fromStart' ? c.vanCost : (cfg.vehicle === 'later' ? c.vanCost*0.5 : 0);
  const cost = c.rent + teacher + van + c.etcCost;
  const profit = revenue - cost;
  const cap = SIM_CAP_MAP[cfg.format];
  const sections = Math.ceil(students / cap);
  return { revenue, cost, profit, students, price, sections, cap };
}
function saveSimConfig(){

  S.savedSims = S.savedSims || [];
  S.savedSims.push({ id:'sim'+Math.random().toString(36).slice(2,9), name, config: Object.assign({}, simConfig()) });
  save(); renderSimulator(); toast('구성 저장됨');
}

}

  S.savedSims = (S.savedSims||[]).filter(x=>x.id!==id); save(); renderSimulator();

function exportJson(){
  const blob = new Blob([JSON.stringify({exportedAt:new Date().toISOString(), state:S}, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'wb-suwan-launch-백업.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  toast('JSON 내보내기 완료');
}
function importJson(input){
  const f = input.files && input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const obj = JSON.parse(r.result);
      const st = obj.state || obj;
      if(!st || Array.isArray(st) || typeof st !== 'object' || !st.answers) throw new Error('형식 오류');
      S = migrate(st);
      save(); render(); toast('가져오기 완료');
    }catch(e){ toast('가져오기 실패 — 파일 형식을 확인하세요'); }
  };
  r.readAsText(f);
}
function resetAll(){
  if(!confirm('모든 답변·선택·작업 상태를 삭제합니다. 계속할까요?')) return;
  localStorage.removeItem(LS_KEY);
  S = defaultState(); ivIdx = 0; cIdx = null; chFilter='all';
  render(); toast('초기화 완료');
}

/* ══════════════════ 접근 게이트 ══════════════════
   공개 URL 오입장 방지용 간이 코드. 완전한 보안이 아니라 '우연 유입 차단' 수준 —
   투자·협상 수치가 담긴 내부 도구이므로 링크가 퍼져도 바로 열리지 않게 한다.
   로컬 파일(file://)로 열 때는 개발·검증 편의를 위해 게이트를 건너뛴다. */
const GATE_KEY = 'wb-suwan-gate-ok';
const GATE_CODE = '7575';   // 센터 전화 뒷자리 — 변경 시 이 값만 수정
function gatePassed(){ return location.protocol === 'file:' || localStorage.getItem(GATE_KEY) === '1'; }
function renderGate(){
  document.querySelector('.demobar').style.display = 'none';
  app.innerHTML = `
  <section class="view" style="max-width:420px;margin:0 auto;text-align:center;padding-top:80px">
    <div class="eyebrow">Private Workspace</div>
    <h2>내부 전략 도구입니다</h2>
    <p class="small muted" style="margin:10px 0 20px">리더스 유치원 · 리드앤톡 · WB 협업 관계자 전용 페이지입니다.<br>접근 코드를 입력해주세요.</p>
    <input id="gateCode" type="password" inputmode="numeric" class="q-input" style="max-width:200px;text-align:center;font-size:18px;letter-spacing:.3em"
      placeholder="····" onkeydown="if(event.key==='Enter')tryGate()">
    <div style="margin-top:14px"><button class="btn" onclick="tryGate()">입장</button></div>
  </section>`;
  const inp = document.getElementById('gateCode'); if(inp) inp.focus();
}
function tryGate(){
  const v = (document.getElementById('gateCode').value||'').trim();
  if(v === GATE_CODE){
    localStorage.setItem(GATE_KEY, '1');
    document.querySelector('.demobar').style.display = '';
    nav('home');
  } else {
    toast('접근 코드가 올바르지 않습니다');
  }
}

/* ══════════════════ 시작 ══════════════════ */
if(gatePassed()) nav('home'); else renderGate();
</script>
