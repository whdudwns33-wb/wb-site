<svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg" aria-label="변형 B HTP: 지붕 작음·문 손잡이 있음·울타리·뿌리 없는 가는 나무·손 그림·처진 입">
  <rect width="520" height="340" fill="#fffdf7"/>
  <line x1="0" y1="300" x2="520" y2="300" stroke="#8bbf6a" stroke-width="3"/>

  <!-- 집: 낮은 지붕, 손잡이 있는 문, 앞 울타리 -->
  <g stroke="#3a6ea5" stroke-width="3" fill="none" stroke-linejoin="round">
    <rect x="45" y="200" width="120" height="100" fill="#eaf3ff"/>
    <polygon points="40,200 105,178 170,200" fill="#f6d7c9" stroke="#d98b6f"/> <!-- 낮고 작은 지붕 -->
    <rect x="92" y="250" width="28" height="50" fill="#fff"/>
    <circle cx="114" cy="276" r="2.5" fill="#3a6ea5" stroke="none"/> <!-- 문 손잡이 있음 -->
    <rect x="60" y="220" width="22" height="22" fill="#fff"/>
  </g>
  <!-- 울타리(방어·경계) -->
  <g stroke="#9a8a6a" stroke-width="3">
    <line x1="30" y1="285" x2="30" y2="308"/><line x1="48" y1="285" x2="48" y2="308"/>
    <line x1="66" y1="285" x2="66" y2="308"/><line x1="84" y1="285" x2="84" y2="308"/>
    <line x1="102" y1="285" x2="102" y2="308"/><line x1="120" y1="285" x2="120" y2="308"/>
    <line x1="138" y1="285" x2="138" y2="308"/><line x1="156" y1="285" x2="156" y2="308"/>
    <line x1="26" y1="292" x2="160" y2="292"/><line x1="26" y1="302" x2="160" y2="302"/>
  </g>

  <!-- 나무: 가는 줄기, 뿌리 없음, 처진 앙상한 가지 -->
  <g stroke="#b9825a" fill="none">
    <path d="M262 300 q-6 -40 -3 -80" stroke-width="6"/> <!-- 가늘고 휘어진 줄기 -->
    <path d="M259 232 q-24 8 -34 26" stroke-width="4"/>   <!-- 아래로 처진 가지 -->
    <path d="M259 238 q24 6 34 24" stroke-width="4"/>
    <path d="M260 224 q-14 -6 -22 -2" stroke-width="3"/>
  </g>
  <!-- 잎 거의 없음(작은 잎 2개) -->
  <circle cx="230" cy="258" r="5" fill="#9ccb74"/>
  <circle cx="292" cy="262" r="5" fill="#9ccb74"/>

  <!-- 사람: 작은 눈, 처진 입, 손(손가락) 그려짐 -->
  <g stroke="#4a4a4a" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="410" cy="172" r="30" fill="#ffe7c2"/>
    <circle cx="401" cy="168" r="2.2" fill="#4a4a4a"/>
    <circle cx="420" cy="168" r="2.2" fill="#4a4a4a"/>
    <path d="M400 186 q10 -7 22 0"/> <!-- 아래로 처진 입 -->
    <line x1="410" y1="202" x2="410" y2="262"/>
    <path d="M410 216 l-26 18 M410 216 l26 18"/>
    <!-- 손: 손가락 표현 -->
    <g stroke-width="2">
      <path d="M384 234 l-4 -5 M384 234 l-6 -1 M384 234 l-3 4"/>
      <path d="M436 234 l4 -5 M436 234 l6 -1 M436 234 l3 4"/>
    </g>
    <path d="M410 262 l-20 34 M410 262 l20 34"/>
  </g>
</svg>
