<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>WB 국어브레인 — 국어 시험대비</title>
  <meta name="description" content="작품 정본 암기·구절 적용·서술형 — WB 국어 내신 시험대비 학습 시스템 (원내 전용)">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#2A3B2E">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <style>
    /* 중학생 전용 학습 시스템 — 태블릿 가로 우선, 좌 목록 + 우 지면 스플릿.
       국어는 '지문을 보면서 푸는' 과목이라 지면이 늘 화면에 남아 있어야 한다(§5.2). */
    :root {
      --bg: #F4F2EE; --panel: #FFFFFF; --ink: #222A24; --soft: #6B7268; --line: #E3E1DA;
      --ind: #3E6B4A; --ind-soft: #E9F1EA; --green: #218358; --green-soft: #E8F4EE;
      --red: #B4482F; --red-soft: #FAEBE7; --amber: #A8781A; --amber-soft: #F8F1DF;
      --mark: #FFF0B8;
      --b1: #E4EBE3; --b2: #BCD1BB; --b3: #7D9B6A; --b4: #3E6B4A;
      --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body { background: var(--bg); color: var(--ink);
      font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      font-size: 14.5px; line-height: 1.65; word-break: keep-all; -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column; }
    button { font-family: inherit; font-size: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    input, textarea, select { font-family: inherit; font-size: 1rem; color: var(--ink); }
    textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 10px; resize: vertical; }
    :focus-visible { outline: 2px solid var(--ind); outline-offset: 2px; border-radius: 6px; }

    header { display: flex; align-items: center; gap: 12px; padding: 9px 16px;
      background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    .brand { font-weight: 800; letter-spacing: -.3px; }
    .brand em { font-style: normal; color: var(--ind); }
    .hstat { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--ind-soft); color: var(--ind); font-weight: 700; }
    .chip.warn { background: var(--amber-soft); color: var(--amber); }
    .chip.mut { background: #EFEEE9; color: var(--soft); }
    .chip.bad { background: var(--red-soft); color: var(--red); }

    /* 준비도 — 숫자 하나와 그 분해. 막대는 '얼마나 찼나'가 아니라
       '어느 축이 비었나'를 보이려고 축마다 따로 그린다. */
    .score { display: flex; align-items: baseline; gap: 10px; }
    .score b { font-size: 34px; line-height: 1; letter-spacing: -1px; }
    .axes { margin-top: 10px; display: grid; gap: 7px; }
    .axis { display: grid; grid-template-columns: 84px 1fr 42px; gap: 8px; align-items: center; font-size: 12.5px; }
    .axis .tr { height: 8px; border-radius: 999px; background: #EFEEE9; overflow: hidden; }
    .axis .fl { display: block; height: 100%; background: var(--b3); border-radius: 999px; }
    .axis.weak .fl { background: var(--amber); }
    /* 비어 있는 축은 막대가 0이라 색으로 못 알린다 — 라벨로 알린다 */
    .axis.weak > span:first-child { color: var(--amber); font-weight: 700; }
    .axis .n { text-align: right; color: var(--soft); font-variant-numeric: tabular-nums; }
    .alert { margin-top: 10px; padding: 9px 11px; border-radius: 8px; font-size: 13px;
      background: var(--amber-soft); color: var(--amber); }
    .alert.risk { background: var(--red-soft); color: var(--red); }

    nav.seg { display: flex; gap: 2px; padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--line); overflow-x: auto; }
    nav.seg button { padding: 7px 14px; border-radius: 8px; font-weight: 700; color: var(--soft); white-space: nowrap; }
    nav.seg button.on { background: var(--ind); color: #fff; }

    #wrap { flex: 1; min-height: 0; display: flex; overflow: hidden; }
    section.side { width: 34%; min-width: 300px; max-width: 480px; flex-shrink: 0; overflow-y: auto;
      background: var(--panel); border-right: 1px solid var(--line); }
    section.work { flex: 1; min-width: 0; overflow-y: auto; }
    section.full { flex: 1; overflow-y: auto; }
    .wpad { padding: 16px; max-width: 900px; margin: 0 auto; }
    .spad { padding: 12px; }
    @media (max-width: 780px) { section.side { display: none; } }

    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .card h3 { margin: 0 0 8px; font-size: 15px; }
    .muted { color: var(--soft); }
    .small { font-size: 12.5px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .spread { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .btn { padding: 9px 15px; border-radius: 9px; background: var(--ind); color: #fff; font-weight: 700; }
    .btn.ghost { background: var(--ind-soft); color: var(--ind); }
    .btn.mut { background: #EFEEE9; color: var(--soft); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn.sm { padding: 6px 11px; font-size: 13px; }

    .stage { display: flex; gap: 4px; margin-top: 6px; }
    .stage i { flex: 1; height: 7px; border-radius: 3px; background: var(--b1); font-style: normal; }
    .stage i.on { background: var(--b3); }
    .stage i.done { background: var(--b4); }
    .gauge { display: inline-flex; gap: 2px; vertical-align: middle; }
    .gauge i { width: 8px; height: 8px; border-radius: 2px; background: var(--b1); }
    .gauge i.on { background: var(--b4); }

    .worklist button { display: block; width: 100%; text-align: left; padding: 10px 12px; border-radius: 9px; margin-bottom: 4px; }
    .worklist button.on { background: var(--ind-soft); }
    .worklist .t { font-weight: 700; }

    .poem { background: #FBFAF7; border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; line-height: 2.05; }
    .poem .st { margin-bottom: 14px; }
    .poem .ln { position: relative; }
    .poem mark { background: var(--mark); border-radius: 3px; padding: 0 2px; }
    .poem .note { display: block; font-size: 12.5px; color: var(--ind); padding-left: 14px; border-left: 2px solid var(--b2); margin: 2px 0 6px; line-height: 1.55; }
    .sym { font-weight: 700; color: var(--red); }

    .q { border: 1px solid var(--line); border-radius: 11px; padding: 13px; margin-bottom: 10px; background: var(--panel); }
    .q .stem { font-weight: 700; margin-bottom: 8px; }
    /* 부정발문('적절하지 않은 것은?')은 <b>로 표시돼 오는데 발문 전체가 이미 굵어서
       굵기로는 안 보인다. 발문 오독은 국어 객관식 오답의 큰 몫이라(§11 KPI) 색으로 세운다. */
    .q .stem b { color: var(--red); text-decoration: underline; text-underline-offset: 3px; }
    .q .quote { background: #FBFAF7; border-left: 3px solid var(--b3); padding: 8px 11px; border-radius: 0 8px 8px 0; margin-bottom: 9px; white-space: pre-line; }
    .q .bogi { border: 1px dashed var(--b2); border-radius: 8px; padding: 9px 11px; margin-bottom: 9px; font-size: 13.5px; background: #FBFAF7; }
    .ch { display: block; width: 100%; text-align: left; padding: 9px 12px; border: 1px solid var(--line); border-radius: 9px; margin-bottom: 5px; }
    .ch:hover { border-color: var(--b3); }
    .ch.pick { border-color: var(--ind); background: var(--ind-soft); }
    .ch.ok { border-color: var(--green); background: var(--green-soft); }
    .ch.no { border-color: var(--red); background: var(--red-soft); }
    .fb { margin-top: 8px; padding: 10px 12px; border-radius: 9px; font-size: 13.5px; }
    .fb.ok { background: var(--green-soft); color: var(--green); }
    .fb.no { background: var(--red-soft); color: var(--red); }
    .fb.hold { background: var(--amber-soft); color: var(--amber); }
    .fb b { color: var(--ink); }
    .conf { display: flex; gap: 6px; margin-top: 8px; }
    .conf button { flex: 1; padding: 8px; border-radius: 8px; background: #EFEEE9; font-weight: 700; font-size: 13px; }

    /* 빈칸 입력칸은 **정답 길이만큼**이다. 넓게 두면 뒤 글자를 덮어 문맥이 안 보이고,
       한 줄에 빈칸이 여럿인 문맥(개관 '주제' 한 줄에 4개)에서 특히 심하다. */
    input.blank { border: none; border-bottom: 2px solid var(--b3); background: transparent; text-align: center;
      min-width: 4.5ch; font-weight: 700; padding: 2px 4px; margin: 0 3px; }
    input.blank::placeholder { font-weight: 400; color: var(--soft); font-size: 12px; }
    .cond { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .cond span { font-size: 12.5px; padding: 4px 9px; border-radius: 999px; background: #EFEEE9; color: var(--soft); }
    .cond span.ok { background: var(--green-soft); color: var(--green); }
    .cond span.no { background: var(--red-soft); color: var(--red); }

    table.mx { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.mx th, table.mx td { border: 1px solid var(--line); padding: 6px 8px; text-align: center; }
    table.mx th { background: #FBFAF7; font-weight: 700; }
    table.mx td.t { text-align: left; }
    .dot { display: inline-block; width: 12px; height: 12px; border-radius: 3px; background: var(--b1); }
    .dot.on { background: var(--b3); } .dot.done { background: var(--b4); }

    .banner { padding: 10px 14px; border-radius: 10px; margin-bottom: 12px; font-size: 13.5px; }
    .banner.info { background: var(--ind-soft); color: var(--ind); }
    .banner.warn { background: var(--amber-soft); color: var(--amber); }
    .banner.err { background: var(--red-soft); color: var(--red); }
    .src { font-size: 11.5px; color: var(--soft); border-top: 1px solid var(--line); padding-top: 8px; margin-top: 14px; }
    .wm { position: fixed; inset: 0; pointer-events: none; z-index: 5; opacity: .022; overflow: hidden;
      font-size: 15px; font-weight: 700; color: #000; line-height: 3.2; white-space: pre; transform: rotate(-24deg) scale(1.6); }
  </style>
</head>
<body>
  <div class="wm" id="wm" aria-hidden="true"></div>
  <header>
    <div class="brand">WB <em>국어브레인</em></div>
    <div class="hstat" id="hstat"></div>
    <button class="btn sm ghost" id="clearDevice" type="button">이 기기에서 지우기</button>
  </header>
  <nav class="seg" id="tabs">
    <button data-tab="home">오늘</button>
    <button data-tab="works">작품</button>
    <button data-tab="vocab">어휘·개념</button>
    <button data-tab="quiz">문제</button>
    <button data-tab="progress">성취도</button>
  </nav>
  <div id="wrap"></div>

<script src="./engine.js"></script>
<script src="./grade.js"></script>
<script src="./gen.js"></script>
<script src="./pack-check.js"></script>
<script src="./readiness.js"></script>
<script src="./render.js"></script>
<script src="./voice.js"></script>
<script>
'use strict';
/* WB 국어브레인 학생 앱 — 기획서 §4(사다리 5단계)·§5(문제 풀이)·§6(수업 모드).
   localStorage(wbk.v1)가 정본이고 서버는 백업이다. 요약(summary)은 state와 함께
   올리되 서버에서는 별도 키에 저장된다 — 관리 화면이 state를 통째로 읽지 않게(§8). */
(function () {
  var E = window.WBKOENGINE, G = window.WBKOGRADE, GEN = window.WBKOGEN, RD = window.WBKOREADY, R = window.WBKORENDER;
  var LS = 'wbk.v1';
  var AUTH = 'wbr.auth';
  var API = '/api/naesin-ko';

  var S = {
    tab: 'home', token: null, code: null,
    pack: null, packIds: [], packId: null, demo: false,
    exam: null, task: null, overlay: null, concepts: [],
    data: null, backupPacks: {}, backupSavedAt: 0, backupBlocked: false, // 이전 단원은 백업 확인 뒤 기기 저장에서 뺀다
    workId: null, session: null, // 현재 세션
    err: null, saving: false
  };

  /* ── 로컬 저장 ── */
  function blank() { return { v: 1, packs: {}, savedAt: 0 }; }
  function load() {
    try {
      var j = JSON.parse(localStorage.getItem(LS) || 'null');
      if (!j || j.v !== 1) return blank();
      if (scrubWrong(j)) S.scrubbed = true;
      return j;
    } catch (e) { return blank(); }
  }
  function selectPack(id) {
    if (deviceCleared) return;
    Object.keys(S.data.packs).forEach(function (old) {
      if (old !== id) { S.backupPacks[old] = S.data.packs[old]; delete S.data.packs[old]; }
    });
    if (!S.data.packs[id] && S.backupPacks[id]) S.data.packs[id] = S.backupPacks[id];
    delete S.backupPacks[id];
    S.packId = id;
    saveLocal();
  }
  function backupState() {
    return { v: S.data.v, packs: Object.assign({}, S.backupPacks, S.data.packs), savedAt: S.data.savedAt };
  }
  function saveLocal() {
    if (deviceCleared) return;
    /* 연결이 끊긴 단원 기록은 서버가 받은 뒤에만 기기에서 비운다. */
    var data = S.data.savedAt > S.backupSavedAt ? backupState() : S.data;
    try { localStorage.setItem(LS, JSON.stringify(data)); } catch (e) {}
  }
  function pk() {
    var id = S.packId || 'none';
    if (!S.data.packs[id]) {
      S.data.packs[id] = { states: {}, wrong: {}, dump: [], essays: {}, diagDone: false, log: [] };
    }
    var p = S.data.packs[id];
    p.wrong = p.wrong || {}; p.essays = p.essays || {}; p.dump = p.dump || []; p.log = p.log || [];
    return p;
  }
  function st(key, kind) {
    var m = pk().states;
    if (!m[key]) m[key] = E.createState(key, kind, Date.now());
    return m[key];
  }

  var saveTimer = null;
  var deviceCleared = false, deviceClearing = false, saveRequest = null;
  function persist() {
    if (deviceCleared || deviceClearing) return;
    S.data.savedAt = Math.max(Date.now(), S.data.savedAt + 1);
    saveLocal();
    if (!S.token || S.demo) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(push, 3000);   // 3초 디바운스 — 타이핑마다 올리지 않는다
  }

  /* 관리 화면이 보는 요약. 서버는 허용 필드와 형식만 검증하고 성취도는 해석하지 않는다. */
  function summary() {
    var p = pk(), sum = E.workSummary(p.states);
    var v = E.kindSummary(p.states, 'vocab'), b = E.kindSummary(p.states, 'blank');
    var wrongOpen = 0, k;
    for (k in p.wrong) if (p.wrong[k] && !p.wrong[k].cleared) wrongOpen += 1;
    var essayPass = 0, essayHold = 0;
    for (k in p.essays) {
      if (p.essays[k].verdict === 'pass') essayPass += 1;
      else if (p.essays[k].verdict === 'hold') essayHold += 1;
    }
    /* 준비도는 축 백분율만 담는다 — 관리 화면이 반 그림을 만드는 데 그것이면 충분하고,
       요약 예산(8KB)을 학생 수만큼 곱하면 작은 차이가 큰 차이가 된다(§8). */
    var rd = readyNow(), ready = null;
    if (rd) {
      var axes = {};
      rd.parts.forEach(function (x) { if (x.weight > 0) axes[x.key] = Math.round(x.rate * 100); });
      ready = { score: rd.score, grade: rd.grade, weak: rd.weak, axes: axes,
        alert: rd.alert, pace: rd.pace, untouched: rd.totals.untouched };
    }
    return {
      packId: S.packId, works: sum.total, complete: sum.complete, restored: sum.restored,
      applied: sum.applied, byStage: sum.byStage,
      vocabReached: v.reached, vocabStable: v.stable, vocabTotal: v.total,
      blankReached: b.reached, blankStable: b.stable, blankTotal: b.total,
      wrongOpen: wrongOpen, essayPass: essayPass, essayHold: essayHold,
      ready: ready, lastAt: new Date().toISOString()
    };
  }

  function api(path, opts) {
    opts = opts || {};
    var h = { 'Content-Type': 'application/json' };
    if (S.token) h.Authorization = 'Bearer ' + S.token;
    return fetch(API + path, { method: opts.method || 'GET', headers: h, body: opts.body ? JSON.stringify(opts.body) : undefined })
      .then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); });
  }

  /* 화면을 떠날 때 미뤄 둔 저장을 밀어 넣는다.
     3초 디바운스 중에 탭을 닫으면 로컬에는 남아도 서버 백업이 빠지고,
     강사 화면이 옛 값을 본다. keepalive라야 언로드 중에도 요청이 산다. */
  function flush() {
    if (deviceCleared || deviceClearing || S.backupBlocked || !S.token || S.demo || !saveTimer) return;
    clearTimeout(saveTimer); saveTimer = null;
    try {
      fetch(API + '/state', {
        method: 'PUT', keepalive: true,
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + S.token },
        body: JSON.stringify({ state: backupState(), summary: summary() })
      });
    } catch (e) {}
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') flush();
  });
  window.addEventListener('pagehide', flush);

  function push() {
    if (deviceCleared || deviceClearing || S.backupBlocked || !S.token || S.demo) return;
    if (S.saving) { saveTimer = setTimeout(push, 3000); return; }
    saveTimer = null;
    S.saving = true;
    var savedAt = S.data.savedAt;
    saveRequest = api('/state', { method: 'PUT', body: { state: backupState(), summary: summary() } })
      .then(function (r) {
        S.saving = false;
        if (r.status === 200) { S.backupSavedAt = Math.max(S.backupSavedAt, savedAt); saveLocal(); }
        if (r.status === 400 || r.status === 413) {
          S.err = (r.body && r.body.error) || '학습 기록을 서버에 보관하지 못했어요. 기록을 지우지 말고 선생님께 알려 주세요.';
          render();
        }
      })
      .catch(function () { S.saving = false; });
    return saveRequest;
  }

  $('clearDevice').onclick = async function () {
    if (S.backupBlocked) { alert('서버 백업을 확인하기 전에는 이 기기의 기록을 비울 수 없어요. 선생님께 알려 주세요.'); return; }
    if (!confirm('이 기기에 저장된 국어브레인 기록을 지울까요? 서버에 보관된 학습 기록과 다른 앱 로그인은 유지됩니다. 다시 열면 학습 기록을 불러옵니다.')) return;
    deviceClearing = true;
    $('clearDevice').disabled = true; $('wrap').inert = true; $('tabs').inert = true;
    clearTimeout(saveTimer); saveTimer = null;
    try {
      if (saveRequest) await saveRequest;
      if (S.token && S.data.savedAt > S.backupSavedAt) {
        var r = await api('/state', { method: 'PUT', body: { state: backupState(), summary: summary() } });
        if (r.status !== 200) throw new Error('backup');
        S.backupSavedAt = S.data.savedAt;
      }
      localStorage.removeItem(LS);
      deviceCleared = true;
      if (window.WBVOICE) window.WBVOICE.stop();
      location.replace('/');
    } catch (e) {
      alert('최근 학습 기록을 보관하거나 이 기기의 저장 공간을 비우지 못했어요. 기록은 그대로 두었습니다. 연결과 브라우저 설정을 확인하고 다시 시도해 주세요.');
    } finally {
      if (!deviceCleared) { deviceClearing = false; $('clearDevice').disabled = false; $('wrap').inert = false; $('tabs').inert = false; }
    }
  };

  /* ── 오버레이(§3) — 학교 선생님이 강조한 해석이 정본 정답을 덮어쓴다 ── */
  function ovAnswers(ref, fallback) {
    var ov = S.overlay && S.overlay.overrides;
    if (!ov) return fallback;
    for (var i = 0; i < ov.length; i++) if (ov[i].targetRef === ref) return ov[i].answers;
    return fallback;
  }
  /* 회복 편성 안전판(§5.4) — 강사가 연 게이트. 오버레이에 실려 온다(내것 → 반 공통 폴백).
     세 화면이 같은 함수를 쓴다 — 한 군데만 빠뜨리면 '열렸다는데 못 푸는' 상태가 된다. */
  function recovery() {
    var r = S.overlay && S.overlay.recovery;
    if (!r) return null;
    return E.recoveryOpts(r, null, Date.now()).expired ? null : r;
  }
  function gateOf(ws, workId) {
    return E.gate(ws, S.exam, E.recoveryOpts(recovery(), workId, Date.now()));
  }
  function ovNote(workId) {
    var ns = S.overlay && S.overlay.notes;
    if (!ns) return null;
    for (var i = 0; i < ns.length; i++) if (ns[i].workId === workId) return ns[i].text;
    return null;
  }

  /* ── 부팅 ── */
  function boot() {
    S.data = load();
    /* 인쇄물 QR — ?paper=<작품id>. 종이로 푼 주석 복원을 ○△× 로 들이는 화면으로 바로 간다(§4.4).
       주소는 지우지 않는다 — 새로고침해도 같은 화면이라야 학생이 헤매지 않는다. */
    try {
      var q = new URLSearchParams(location.search);
      if (q.get('paper')) S.paperWork = q.get('paper');
    } catch (e) {}
    try { S.token = JSON.parse(localStorage.getItem(AUTH) || 'null'); } catch (e) {}
    if (S.token && typeof S.token === 'object') { S.code = S.token.code; S.token = S.token.token || S.token.t; }
    fetch('./concepts.json').then(function (r) { return r.json(); })
      .then(function (j) { S.concepts = j.concepts || []; })
      .catch(function () { S.concepts = []; })
      .then(function () { return S.token ? online() : demo(); })
      .then(render)
      /* 지운 발문이 서버·다른 기기에도 남아 있다 — 한 번 올려 거기서도 사라지게 한다 */
      .then(function () { if (S.scrubbed) persist(); });
  }

  function demo(msg, assigned) {
    S.demo = true; selectPack('sample-demo-U0');
    /* 범위가 이미 배정됐는데 받아 오기만 실패한 경우를 구분한다 — 그때 "시험 범위가 배정되면
       바뀝니다"라고 하면 거짓말이 된다(선생님은 이미 배정하셨다). */
    S.assigned = !!assigned;
    S.workId = null; S.paper = null;
    if (msg) S.err = msg;
    return fetch('./pack-sample.json').then(function (r) { return r.json(); })
      .then(function (p) { S.pack = p; });
  }

  /* 시험 범위 팩 받기 — 부팅과 재시도와 단원 전환이 같은 길을 쓴다.
     받은 팩은 일단 S.pending 에 두고 **끼울 때를 고른다.** 학생이 누른 전환(now=true)이면 바로
     갈고, 배경 재시도면 공부가 끝난 뒤로 미룬다 — 세션 도중에 갈면 화면은 체험 문항을 계속 내는데
     (render 는 S.session 이면 되돌아간다) 기록은 실제 단원 칸(pk())에 쌓이고 서버로도 올라간다. */
  function loadPack(id, now) {
    return api('/pack?id=' + encodeURIComponent(id)).then(function (r) {
      if (deviceCleared || deviceClearing) return false;
      if (r.status === 200) {
        S.pending = { id: id, pack: r.body.pack };
        return now ? applyPack() : applyPending(false);
      }
      return packFail(r.status, id);
    }).catch(function () { return packFail(0, id); });
  }

  /* 지금 갈면 쓰던 것이 사라지는가. 세션·종이 채점은 플래그로 알지만 주석 복원·서술형 입력은
     플래그 없이 textarea 로만 산다 — 적어 둔 글이 있으면 그것도 '공부 중'이다. */
  function busy(typed) {
    if (S.session || S.paperWork) return true;
    if (!typed) return false;
    var f = $('wrap').querySelectorAll('textarea, input[type=text]'), i;
    for (i = 0; i < f.length; i += 1) if (String(f[i].value || '').trim()) return true;
    return false;
  }

  /* 받아 둔 팩을 안전한 순간에만 끼운다. 못 끼우면 그대로 두고 다음 기회(setTab)를 기다린다.
     leaving=true 는 학생이 스스로 화면을 떠나는 순간이라, 적어 둔 글은 어차피 버려진다. */
  function applyPending(leaving) {
    if (!S.pending) return false;
    if (busy(!leaving)) return false;
    return applyPack();
  }
  function applyPack() {
    var p = S.pending;
    S.pending = null; S.retryId = null;
    S.demo = false; S.err = null; S.retries = 0; S.retries403 = 0;
    selectPack(p.id); S.pack = p.pack;
    /* 작품 선택·종이 채점은 팩 안의 id 를 가리킨다 — 팩이 갈리면 가리킬 곳이 없어진다 */
    S.workId = null; S.paper = null;
    return true;
  }

  /* 못 받았을 때 — 체험 팩으로 내려 주되 **이유를 바르게 말하고, 스스로 다시 올라온다.**
     예전에는 어떤 실패든 한 문장으로 뭉뚱그렸고, 한 번 떨어지면 신호가 돌아와도 그 세션 내내
     체험 팩에 머물렀다. 학생은 앱을 껐다 켤 생각을 안 한다. */
  var RETRY_MS = [30000, 120000, 600000, 1800000];
  function packFail(status, id) {
    if (deviceCleared || deviceClearing) return false;
    var why = status === 403 ? '이 단원은 아직 나에게 배정되지 않았어요 — 선생님께 말씀드려 주세요.'
      : status === 404 ? '선생님이 이 단원 자료를 아직 올리지 않으셨어요.'
        : '시험 범위 자료를 지금 받지 못했어요 — 잠시 뒤 저절로 다시 받아 올게요.';
    /* 403 도 두 번은 다시 묻는다 — 선생님이 방금 범위를 바꾸셨을 때 KV 가 1분쯤 옛 범위를
       내주는 구간이 있어, 영구 거절로 단정하면 그 사이 학생이 체험 팩에 갇힌다.
       404(아직 올리지 않으셨다)는 기다려도 바뀌지 않으니 다시 묻지 않는다. */
    var p403 = status === 403;
    var n = p403 ? (S.retries403 || 0) : (S.retries || 0);
    if (status !== 404 && (!p403 || n < 2)) {
      if (p403) S.retries403 = n + 1; else S.retries = n + 1;
      S.retryId = id;
      /* 조용히 다시 시도한다 — 인프라 사정을 학생에게 설명하지 않는다.
         그 사이 다른 단원이 열렸으면(= 체험 모드를 벗어났으면) 끼어들지 않는다. */
      setTimeout(function () {
        if (!S.demo || S.retryId !== id) return;
        loadPack(id).then(function (ok) { if (ok) render(); });
      }, RETRY_MS[Math.min(n, RETRY_MS.length - 1)]);
    }
    S.pending = null;
    /* 이미 체험 팩을 보고 있으면 다시 받아 끼우지 않는다 — 보고 있던 화면이 날아간다 */
    if (S.demo && S.pack) { S.err = why; S.assigned = true; return false; }
    return demo(why, true).then(function () { return false; });
  }

  function online() {
    return Promise.all([api('/exam'), api('/task'), api('/overlay'), api('/state')])
      .then(function (rs) {
        if (deviceCleared || deviceClearing) return false;
        if (rs[0].status === 401) return demo('로그인이 만료됐어요 — 체험 모드로 보고 있어요.');
        /* 깨진 백업을 새 기기의 빈 진도로 덮거나, 유일한 기기 원본을 비우지 않는다. */
        if (rs[3].status === 409) {
          S.backupBlocked = true;
          return demo((rs[3].body && rs[3].body.error) || '서버 백업을 확인해야 해요. 선생님께 알려 주세요.');
        }
        S.exam = (rs[0].body && rs[0].body.exam && rs[0].body.exam.examDate) ? rs[0].body.exam : null;
        S.task = (rs[1].body && rs[1].body.task && rs[1].body.task.title) ? rs[1].body.task : null;
        S.overlay = (rs[2].body && rs[2].body.overlay) || null;
        /* 서버 기록이 더 최신이면 그것을 쓴다 — 기기를 바꿔도 이어진다 */
        var sv = rs[3].body && rs[3].body.state;
        if (sv && sv.v === 1) {
          /* 서버 기록에도 옛 발문이 들어 있다 — 받아 쓰기 전에 지우고, 지웠으면 올려 보낸다 */
          if (scrubWrong(sv)) S.scrubbed = true;
          S.backupPacks = Object.assign({}, sv.packs);
          S.backupSavedAt = sv.savedAt || 0;
          if ((sv.savedAt || 0) > (S.data.savedAt || 0)) S.data = sv;
        }
        S.packIds = (S.exam && S.exam.packIds) || [];
        if (!S.packIds.length) return demo('아직 시험 범위가 등록되지 않았어요 — 체험 팩으로 연습할 수 있어요.');
        return loadPack(S.packIds[0], true);
      })
      .catch(function () { return demo('서버에 연결하지 못했어요 — 체험 팩으로 연습할 수 있어요.'); });
  }

  /* ── 유틸 ── */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function works() { return (S.pack && S.pack.works) || []; }
  function work(id) { var w = works().filter(function (x) { return x.workId === id; }); return w[0] || null; }
  function canonWorks() { return works().filter(function (w) { return w.hasCanon; }); }

  /* 준비도(§11) — 팩·상태·시험을 넘겨 한 숫자와 그 분해를 받는다.
     여기서만 만들고 화면 세 군데(홈 칩·성취도 카드·서버 요약)가 같은 값을 쓴다. */
  function readyNow() {
    if (!RD || !S.pack) return null;
    var p = pk(), open = 0, k;
    for (k in p.wrong) if (p.wrong[k] && !p.wrong[k].cleared) open += 1;
    return RD.readiness(readyPack(), p.states, {
      exam: S.exam, now: Date.now(), wrongOpen: open,
      relearnTarget: E.RELEARN_TARGET, applyGateRate: E.APPLY_GATE_RATE,
      /* 안전판을 켠 학생에게는 오늘 손댈 축도 달라진다 — 병행 모드는 사다리 순서를 푸는
         조치라, 화면이 여전히 1단계를 가리키면 강사가 한 조치와 지시가 어긋난다 */
      recovery: recovery()
    });
  }
  function readyPack() {
    return { works: canonWorks().map(function (w) {
      return { workId: w.workId, title: w.title, vocab: w.vocab || [], blanks: w.blanks || [] };
    }) };
  }
  function $(id) { return document.getElementById(id); }
  function rnd() { return Math.random(); }

  /* planDay가 먹는 모양으로 팩을 줄여 넘긴다 */
  function planPack() {
    return { works: canonWorks().map(function (w) {
      return { workId: w.workId, vocab: w.vocab || [], blanks: w.blanks || [] };
    }) };
  }
  function plan() { return E.planDay(planPack(), pk().states, S.exam, Date.now(), {}); }

  function stageName(n) {
    return ['', '읽기', '개념 빈칸', '구절 적용', '주석 복원', '서술형'][n] || '';
  }

  /* ── 렌더 ── */
  function setTab(t) { S.tab = t; S.session = null; applyPending(true); render(); }
  document.getElementById('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tab]');
    if (b) setTab(b.getAttribute('data-tab'));
  });

  /* 단원 전환 — 부팅 때 **한 번만** 건다. #wrap 은 innerHTML 만 갈리고 요소 자체는 남으므로,
     화면 함수 안에서 걸면 다시 그릴 때마다 핸들러가 쌓인다. */
  $('wrap').addEventListener('click', function (e) {
    var u = e.target.closest('[data-unit]');
    if (!u) return;
    var id = u.getAttribute('data-unit');
    if (id === S.packId) return;
    S.session = null; S.err = null; S.paperWork = null;
    loadPack(id, true).then(function () { setTab('home'); });
  });

  /* 단원 이름 — 팩 id 는 `2022-cheonjae-nomisuk-m2-1-U1` 같은 좌표라 학생에게는 끝의 단원만 보인다 */
  function unitLabel(id) {
    var m = String(id || '').match(/U(\d+)$/);
    return m ? m[1] + '단원' : String(id || '').slice(-8);
  }

  function header() {
    var out = [];
    if (S.demo) out.push('<span class="chip warn">체험 모드</span>');
    else if (S.code) out.push('<span class="chip mut">' + esc(S.code) + '</span>');
    if (S.exam) {
      var d = E.daysUntil(S.exam.examDate, Date.now());
      out.push('<span class="chip">' + (d >= 0 ? 'D-' + d : '시험 종료') + '</span>');
    } else out.push('<span class="chip mut">연습 모드</span>');
    var p = pk(), sum = E.workSummary(p.states);
    out.push('<span class="chip mut">작품 ' + sum.complete + '/' + canonWorks().length + ' 완료</span>');
    $('hstat').innerHTML = out.join('');
    /* 유출 억제(§10-6) — 타일형 워터마크. 방지가 아니라 억제이고 식별 수단이다. */
    var who = S.code || '체험';
    var row = new Array(9).join(who + '  ');
    $('wm').textContent = new Array(14).join(row + '\n');
  }

  function split(sideHtml, workHtml) {
    $('wrap').innerHTML = '<section class="side"><div class="spad">' + sideHtml + '</div></section>' +
      '<section class="work"><div class="wpad" id="pane">' + workHtml + '</div></section>';
  }
  function full(html) { $('wrap').innerHTML = '<section class="full"><div class="wpad" id="pane">' + html + '</div></section>'; }

  function banner() {
    var out = '';
    if (S.err) out += '<div class="banner warn">' + esc(S.err) + '</div>';
    if (S.demo) {
      out += '<div class="banner info">체험 팩(자체 창작 작품)으로 연습 중이에요. ' +
        (S.assigned ? '우리 학교 작품은 받는 대로 바뀝니다.' : '시험 범위가 배정되면 우리 학교 작품으로 바뀝니다.') + '</div>';
    }
    /* 시험 범위가 여러 단원이면 고를 수 있어야 한다 — 예전에는 첫 단원만 받아서 2단원이
       범위에 있어도 학생이 열 길이 없었다. 기록은 pk() 가 팩 id 로 나눠 담으므로 단원마다 따로 쌓인다.
       체험 모드에서도 버튼을 남긴다 — 전환이 실패해 체험 팩으로 떨어졌을 때 되돌아갈 길이 이것뿐이다. */
    if ((S.packIds || []).length > 1) {
      out += '<div class="banner info"><b>단원</b> ' + S.packIds.map(function (id) {
        return '<button class="btn sm' + (id === S.packId ? '' : ' ghost') + '" data-unit="' + esc(id) + '">' +
          esc(unitLabel(id)) + '</button>';
      }).join(' ') + '</div>';
    }
    return out;
  }

  function sourceNote() {
    var src = S.pack && S.pack.source;
    if (!src) return '';
    return '<div class="src">' + esc(src.provider || '') +
      (src.producedAt ? ' · ' + esc(src.producedAt) : '') +
      ' · 원내 학습 전용 자료입니다. 화면 밖으로 내보내지 마세요.' +
      '<br>채점 결과는 <b>연습 판정</b>이에요 — 학교 채점 기준과 다를 수 있어요.</div>';
  }

  /* 준비도 카드 — 홈은 접힌 형태(숫자 + 다음 할 일), 성취도는 축을 다 편다.
     학생에게 '몇 %'만 보이면 행동이 안 바뀐다. 늘 **가장 비어 있는 축**을 같이 말한다(§11). */
  function readyCard(rd, compact) {
    if (!rd) return '';
    var weak = null;
    rd.parts.forEach(function (x) { if (x.key === rd.weak) weak = x; });
    var m = ['<div class="card"><div class="spread"><h3 style="margin:0">시험 준비도</h3>' +
      (rd.pace ? '<span class="small muted">D-' + rd.pace.dday + '</span>' : '<span class="small muted">연습 모드</span>') +
      '</div>'];
    m.push('<div class="score" style="margin-top:8px"><b>' + rd.score + '<span style="font-size:18px">%</span></b>' +
      '<span class="chip' + (rd.score >= 70 ? '' : rd.score >= 45 ? ' mut' : ' warn') + '">' + esc(rd.grade.label) + '</span></div>');
    if (weak && weak.rate < 1) {
      m.push('<div class="small" style="margin-top:6px">다음에 할 것 → <b>' + esc(weak.label) + '</b> ' +
        '<span class="muted">' + esc(weak.act) + '</span></div>');
    }
    if (!compact) {
      m.push('<div class="axes">');
      rd.parts.forEach(function (x) {
        if (!x.weight) return;
        var w = Math.round(x.rate * 100);
        m.push('<div class="axis' + (x.key === rd.weak ? ' weak' : '') + '" title="' + esc(x.hint || '') + '">' +
          '<span>' + esc(x.label) + '</span>' +
          '<span class="tr"><span class="fl" style="width:' + w + '%"></span></span>' +
          '<span class="n">' + w + '%</span></div>');
      });
      m.push('</div>');
      var ew = Math.round(rd.parts.filter(function (x) { return x.key === 'essay'; })[0].weight * 100);
      m.push('<div class="small muted" style="margin-top:8px">' +
        (rd.weightSource === 'exam'
          ? '축의 비중은 우리 학교 시험 배점에서 와요 — 서술형 ' + ew + '%.'
          : '학교 시험 배점이 등록되면 그 비중으로 다시 계산돼요(지금은 기본값 · 서술형 ' + ew + '%).') +
        ' 빈 축부터 채우면 점수가 가장 많이 올라요.</div>');
      m.push('<div class="small muted">구절 적용은 게이트 기준선(' + Math.round(E.APPLY_GATE_RATE * 100) +
        '%) 대비로 재요 — 시도가 ' + RD.APPLY_MIN + '회보다 적으면 그만큼 낮게 잡혀요.</div>');
      if (rd.pace) {
        m.push('<div class="small muted" style="margin-top:4px">안정화까지 최소 ' + rd.pace.minDays + '일' +
          ' · 남은 회전 ' + rd.pace.rotations + '개(하루 ' + rd.pace.perDay + '개)</div>');
      }
    }
    if (rd.alert) m.push('<div class="alert' + (rd.alert.level === 'risk' ? ' risk' : '') + '">' + esc(rd.alert.why) + '</div>');
    m.push('</div>');
    return m.join('');
  }

  /* ── 오늘 ── */
  function renderHome() {
    var p = plan();
    var sum = E.workSummary(pk().states);
    var m = [];
    m.push(banner());
    m.push('<div class="card"><div class="spread"><h3 style="margin:0">오늘의 계획</h3>' +
      '<span class="small muted">' + (p.dday != null ? 'D-' + p.dday : '연습 모드') + '</span></div>' +
      '<div class="small muted" style="margin-top:4px">' + esc(p.note) + '</div></div>');
    /* 출발선 진단(§4.2) — 첫 만남에 어디서 시작할지 정한다. 아직 안 했고 물어볼 것이 있을 때만 뜬다 */
    var dg = diagPool();
    if (!pk().diagDone && dg.length >= 4) {
      m.push('<div class="card" style="border-color:var(--b3)"><h3>출발선 진단 · 2분</h3>' +
        '<div class="small muted" style="margin:4px 0 10px">' + dg.length + '개를 훑어 <b>어디서 시작할지</b>만 정해요. ' +
        '아는 것을 빼는 게 아니라 출발선을 잡는 거라, 안다고 해도 회전은 그대로 돕니다.</div>' +
        '<div class="row">' + btn('sess-diag', '시작하기') +
        '<button class="btn ghost" data-act="diag-skip">나중에</button></div></div>');
    }
    if (S.task) {
      m.push('<div class="card" style="border-color:var(--b3)"><h3>오늘 수업 과제</h3>' +
        '<div><b>' + esc(S.task.title) + '</b> <span class="small muted">' + esc(S.task.date) + '</span></div>' +
        '<div class="small muted">' + esc((S.task.typeKeys || []).join(' · ')) + '</div></div>');
    }
    m.push(readyCard(readyNow(), true));
    m.push('<div class="card"><h3>세션</h3><div class="small muted" style="margin-bottom:10px">' +
      '단계마다 걸리는 시간이 달라요. 오늘은 이만큼이면 됩니다.</div><div class="row">');
    var n1 = p.blanks.fresh.length + p.blanks.review.length + p.blanks.relearn.length;
    var n2 = p.vocab.fresh.length + p.vocab.review.length + p.vocab.relearn.length;
    m.push(btn('sess-blank', '개념 빈칸 ' + n1 + '개 · 5분', n1 === 0));
    m.push(btn('sess-vocab', '어휘·개념어 ' + n2 + '개 · 5분', n2 === 0));
    m.push(btn('sess-apply', '구절 적용 · 8분', p.works.length === 0));
    m.push(btn('sess-essay', '서술형 ' + p.essay + '문항 · 15분', p.essay === 0));
    m.push(btn('sess-dump', '브레인덤프 · 2분', canonWorks().length === 0));
    m.push('</div></div>');

    m.push('<div class="card"><h3>오늘 볼 작품</h3>');
    if (!p.works.length) m.push('<div class="small muted">오늘 몫이 없어요. 성취도에서 진행 상황을 볼 수 있어요.</div>');
    p.works.forEach(function (w) {
      var wk = work(w.workId);
      if (!wk) return;
      m.push('<div class="spread" style="padding:8px 0;border-bottom:1px solid var(--line)">' +
        '<div><b>' + esc(wk.title) + '</b> <span class="small muted">' + stageName(w.stage) + '</span>' +
        (w.gateOpen ? '' : ' <span class="chip warn">적용 정답률 미달</span>') + '</div>' +
        '<button class="btn sm ghost" data-open="' + esc(w.workId) + '">열기</button></div>');
    });
    m.push('</div>');
    m.push('<div class="card"><h3>진행</h3><div class="small">' +
      '작품 완료 ' + sum.complete + ' · 주석 복원 ' + sum.restored + ' · 적용 통과 ' + sum.applied +
      ' · 개념 안정화 ' + E.kindSummary(pk().states, 'blank').stable + '</div></div>');
    m.push(sourceNote());
    full(m.join(''));

    $('pane').addEventListener('click', function (e) {
      var o = e.target.closest('[data-open]');
      if (o) { S.workId = o.getAttribute('data-open'); setTab('works'); return; }
      var b = e.target.closest('[data-act]');
      if (!b) return;
      var a = b.getAttribute('data-act');
      if (a === 'sess-blank') startBlank();
      else if (a === 'sess-vocab') startVocab();
      else if (a === 'sess-apply') { S.workId = (p.works[0] || {}).workId; startApply(); }
      else if (a === 'sess-essay') startEssay();
      else if (a === 'sess-dump') startDump();
      else if (a === 'sess-diag') startDiag();
      else if (a === 'diag-skip') { pk().diagDone = true; persist(); render(); }
    });
  }
  function btn(act, label, dis) {
    return '<button class="btn' + (dis ? ' mut' : '') + '" data-act="' + act + '"' + (dis ? ' disabled' : '') + '>' + esc(label) + '</button>';
  }

  /* ── 작품 ── */
  function renderWorks() {
    var list = canonWorks();
    if (!list.length) { full(banner() + '<div class="card">정본이 있는 작품이 아직 없어요.</div>'); return; }
    if (!S.workId || !work(S.workId)) S.workId = list[0].workId;
    var w = work(S.workId);
    var ws = st(E.workKey(w.workId), 'work');

    var side = ['<div class="worklist">'];
    list.forEach(function (x) {
      var xs = st(E.workKey(x.workId), 'work');
      side.push('<button data-w="' + esc(x.workId) + '" class="' + (x.workId === S.workId ? 'on' : '') + '">' +
        '<div class="t">' + esc(x.title) + '</div>' +
        '<div class="small muted">' + esc(x.author || '') + ' · ' + stageName(xs.stage) + '</div>' +
        '<div class="stage">' + stageBars(xs) + '</div></button>');
    });
    side.push('</div>');

    var m = [banner()];
    var note = ovNote(w.workId);
    if (note) m.push('<div class="banner info"><b>학교 선생님 강조</b> — ' + esc(note) + '</div>');
    m.push('<div class="card"><div class="spread"><h3 style="margin:0">' + esc(w.title) + '</h3>' +
      '<span class="small muted">' + esc(w.author || '') + '</span></div>' +
      '<div class="stage" style="margin-top:10px">' + stageBars(ws) + '</div>' +
      '<div class="small muted" style="margin-top:6px">현재 ' + ws.stage + '단계 — ' + stageName(ws.stage) + '</div>');
    var g = gateOf(ws, w.workId);
    m.push('<div class="small muted" style="margin-top:4px">구절 적용 정답률 ' +
      (g.total ? Math.round(g.rate * 100) + '% (' + g.right + '/' + g.total + ')' : '아직 없음') +
      ' · 기준 ' + Math.round(g.threshold * 100) + '%</div>');
    /* 기준을 넘겨 열린 것과 선생님이 열어 준 것을 구분해 말한다 — 같은 '열림'으로 보이면
       학생은 자기가 통과한 줄 알고, 정작 채워야 할 적용 훈련을 건너뛴다. */
    if (g.reason === 'override' || g.reason === 'parallel') {
      var rc = recovery() || {};
      m.push('<div class="banner info" style="margin-top:8px"><b>선생님이 열어 둔 트랙</b> — ' +
        (g.reason === 'parallel' ? '병행 모드' : '이 작품만') +
        (rc.until ? ' · ' + esc(rc.until) + '까지' : '') +
        '. 적용 정답률은 아직 기준 아래예요' + (rc.why ? ' (' + esc(rc.why) + ')' : '') + '</div>');
    }
    m.push('<div class="row" style="margin-top:10px">');
    [1, 2, 3, 4, 5].forEach(function (n) {
      var locked = (n === 5 && !g.open);
      m.push('<button class="btn sm' + (n === ws.stage ? '' : ' ghost') + (locked ? ' mut' : '') + '" data-stage="' + n + '"' +
        (locked ? ' disabled title="구절 적용 정답률이 기준을 넘으면 열려요"' : '') + '>' + n + '. ' + stageName(n) + '</button>');
    });
    m.push('</div></div>');
    m.push(sourceNote());
    split(side.join(''), m.join(''));

    $('wrap').addEventListener('click', function (e) {
      var b = e.target.closest('[data-w]');
      if (b) { S.workId = b.getAttribute('data-w'); render(); return; }
      var s = e.target.closest('[data-stage]');
      if (!s) return;
      var n = +s.getAttribute('data-stage');
      if (n === 1) startRead();
      else if (n === 2) startBlank(S.workId);
      else if (n === 3) startApply();
      else if (n === 4) startRestore();
      else if (n === 5) startEssay(S.workId);
    });
  }
  function stageBars(ws) {
    var out = '';
    for (var i = 1; i <= 5; i++) {
      out += '<i class="' + (i < ws.stage ? 'done' : (i === ws.stage ? 'on' : '')) + '"></i>';
    }
    return out;
  }

  /* 1단계 읽기 — 본문·날개풀이·구조도. 원문이 없는 팩(§10-2 ③)이면 위치만 보여 준다. */
  function startRead() {
    var w = work(S.workId);
    var m = ['<div class="card"><div class="spread"><h3 style="margin:0">' + esc(w.title) + ' — 읽기</h3>' +
      '<button class="btn sm mut" data-back="1">닫기</button></div></div>'];
    m.push('<div class="card"><h3>본문</h3>');
    if (w.text && w.text.stanzas) {
      m.push('<div class="poem" id="poem">' + R.poemHtml(w, true) + '</div>');
      m.push('<div class="row" style="margin-top:10px">' +
        '<button class="btn sm ghost" data-note="1">날개풀이 보기</button>' +
        '<button class="btn sm ghost" data-tts="1">낭독</button></div>');
    } else {
      m.push('<div class="banner warn">이 팩은 본문을 싣지 않습니다. 교과서를 옆에 두고 위치 표시로 학습하세요.</div>');
    }
    m.push('</div>');
    if (w.overview) {
      m.push('<div class="card"><h3>개관</h3><table class="mx">' +
        row2('갈래', (w.overview.genre || []).join('·')) + row2('제재', w.overview.material) +
        row2('성격', (w.overview.tone || []).join('·')) + row2('주제', w.overview.theme) + '</table></div>');
    }
    if (w.structureMap) {
      m.push('<div class="card"><h3>구조도</h3>' + R.structureHtml(w.structureMap) + '</div>');
    }
    if ((w.appreciationPoints || []).length) {
      m.push('<div class="card"><h3>감상 Point</h3><ul class="small">' +
        w.appreciationPoints.map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('') + '</ul></div>');
    }
    m.push('<div class="card"><button class="btn" data-done="1">읽었어요 — 다음 단계로</button></div>');
    full(m.join(''));
    var shown = false;
    $('pane').addEventListener('click', function (e) {
      if (e.target.closest('[data-back]')) { render(); return; }
      if (e.target.closest('[data-note]')) {
        shown = !shown;
        document.querySelectorAll('#poem .note').forEach(function (n) { n.style.display = shown ? 'block' : 'none'; });
        return;
      }
      if (e.target.closest('[data-tts]')) {
        if (window.WBVOICE && WBVOICE.speak) {
          var txt = (w.text.stanzas || []).map(function (s) { return (s.lines || []).join(' '); }).join(' ');
          WBVOICE.speak(txt, { lang: 'ko-KR' });
        }
        return;
      }
      if (e.target.closest('[data-done]')) {
        var ws = st(E.workKey(w.workId), 'work');
        if (ws.stage < 2) { ws.stage = 2; persist(); }
        render();
      }
    });
    document.querySelectorAll('#poem .note').forEach(function (n) { n.style.display = 'none'; });
  }
  function row2(k, v) { return '<tr><th style="width:90px">' + esc(k) + '</th><td class="t">' + esc(v || '') + '</td></tr>'; }

  /* 2단계 개념 빈칸 — SRS 큐. 정답은 오버레이가 덮어쓸 수 있다. */
  function startBlank(onlyWork) {
    var p = plan();
    var ids = [].concat(p.blanks.fresh, p.blanks.review, p.blanks.relearn);
    var items = [];
    canonWorks().forEach(function (w) {
      if (onlyWork && w.workId !== onlyWork) return;
      (w.blanks || []).forEach(function (b) {
        if (!onlyWork && ids.indexOf(b.id) < 0) return;
        /* 회전 수를 넘겨 문맥을 바꾼다 — 같은 문장을 반복해 채우면 문장을 외운다 */
        var bs = pk().states[E.blankKey(b.id)];
        var it = GEN.blankItem(w, b, bs ? bs.relearnCount : 0);
        it.answers = ovAnswers('b-' + b.id, b.answers);
        items.push(it);
      });
    });
    if (!items.length) { S.err = '오늘 낼 개념 빈칸이 없어요.'; render(); return; }
    runQueue({ title: '개념 빈칸', items: items.slice(0, 20), kind: 'blank' });
  }

  function startVocab() {
    var p = plan();
    var ids = [].concat(p.vocab.fresh, p.vocab.review, p.vocab.relearn);
    var all = [], items = [];
    canonWorks().forEach(function (w) { (w.vocab || []).forEach(function (v) { all.push(v); }); });
    canonWorks().forEach(function (w) {
      (w.vocab || []).forEach(function (v) {
        if (ids.indexOf(v.id) < 0) return;
        var it = GEN.vocabItem(w, v, all, S.concepts, rnd);
        if (it) items.push(it);
      });
    });
    if (!items.length) { S.err = '오늘 낼 어휘가 없어요.'; render(); return; }
    runQueue({ title: '어휘·개념어', items: items, kind: 'vocab' });
  }

  /* SRS 큐 러너 — 빈칸(단답)·어휘(선다)를 같은 화면에서 돌린다 */
  function runQueue(sess) {
    sess.i = 0; sess.right = 0; S.session = sess;
    drawQueue();
  }
  function drawQueue() {
    var sess = S.session, it = sess.items[sess.i];
    if (!it) return finishQueue();
    var m = ['<div class="card"><div class="spread"><h3 style="margin:0">' + esc(sess.title) + '</h3>' +
      '<span class="small muted">' + (sess.i + 1) + ' / ' + sess.items.length + '</span></div></div>'];
    m.push('<div class="q" id="q">');
    m.push('<div class="stem">' + esc(it.stem) + '</div>');
    if (it.kind === 'blank') {
      /* 한 문맥에 □ 무리가 여럿인 빈칸이 흔하다(개관 '특징' 한 줄에 정답 6~7개).
         **채점할 정답의 자리에** 입력칸을 뚫어야 한다 — 늘 첫 무리에 뚫으면 학생이 보는 칸과
         채점하는 답이 어긋난다(실측 요약노트 빈칸의 44%가 첫 무리가 아니다). */
      var slot = it.slot || 0, seen = -1;
      var txt = esc(it.context || '').replace(/□+/g, function (g) {
        seen += 1;
        if (seen !== slot) return g;
        /* 폭을 글자 수에 맞춘다 — 넉넉하게 두 칸만 더 준다 */
        var n = Math.max(4, (it.hintLen || 2) + 2);
        return '<input class="blank" id="ans" autocomplete="off" style="width:' + n + 'ch" placeholder="' +
          (it.hintLen ? it.hintLen + '자' : '') + '">';
      });
      if (txt.indexOf('id="ans"') < 0) txt += ' <input class="blank" id="ans" autocomplete="off">';
      m.push('<div class="quote">' + txt + '</div>');
      m.push('<button class="btn" data-sub="1">확인</button>');
    } else {
      m.push('<div id="chs">' + it.choices.map(function (c) {
        return '<button class="ch" data-key="' + esc(c.key) + '">' + c.no + '. ' + esc(c.text) + '</button>';
      }).join('') + '</div>');
    }
    m.push('<div id="fb"></div></div>');
    full(m.join(''));
    var ansEl = $('ans');
    if (ansEl) {
      ansEl.focus();
      ansEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') judgeQueue(ansEl.value); });
    }
    $('pane').addEventListener('click', function (e) {
      if (e.target.closest('[data-sub]')) { judgeQueue($('ans').value); return; }
      var c = e.target.closest('[data-key]');
      if (c && !S.session.answered) judgeQueue(c.getAttribute('data-key'));
      var n = e.target.closest('[data-next]');
      if (n) { S.session.i += 1; S.session.answered = false; drawQueue(); }
      var cf = e.target.closest('[data-conf]');
      if (cf) recordConf(cf.getAttribute('data-conf'));
    });
  }
  function judgeQueue(input) {
    var sess = S.session, it = sess.items[sess.i];
    if (sess.answered) return;
    sess.answered = true;
    var correct, msg;
    if (it.kind === 'blank') {
      var r = G.gradeAnswer(input, it.answers);
      correct = r.correct;
      msg = correct ? ('정답' + (r.matched && G.normalizeKo(r.matched) !== G.normalizeKo(input) ? ' — ‘' + esc(r.matched) + '’로 인정' : ''))
        : '정답: ' + esc((it.answers || []).join(' / '));
    } else {
      var pickEl = document.querySelector('[data-key="' + input + '"]');
      var ch = it.choices.filter(function (c) { return c.key === input; })[0];
      correct = !!(ch && ch.correct);
      document.querySelectorAll('#chs .ch').forEach(function (b) {
        var k = b.getAttribute('data-key');
        var cc = it.choices.filter(function (c) { return c.key === k; })[0];
        if (cc.correct) b.classList.add('ok');
        else if (k === input) b.classList.add('no');
      });
      msg = correct ? '정답' : '정답: ' + esc(it.choices.filter(function (c) { return c.correct; })[0].text);
      if (pickEl) pickEl.classList.add('pick');
    }
    sess.lastCorrect = correct;
    if (correct) sess.right += 1;
    var fb = '<div class="fb ' + (correct ? 'ok' : 'no') + '">' + msg +
      (it.explain ? '<div class="small" style="margin-top:4px">' + esc(it.explain) + '</div>' : '') + '</div>';
    fb += '<div class="small muted" style="margin-top:8px">얼마나 확실했나요?</div><div class="conf">' +
      '<button data-conf="sure">확실</button><button data-conf="unsure">애매</button><button data-conf="guess">찍음</button></div>';
    $('fb').innerHTML = fb;
  }
  function recordConf(conf) {
    var sess = S.session, it = sess.items[sess.i];
    var key = it.kind === 'blank' ? E.blankKey(it.blankId) : E.vocabKey(it.vocabId);
    var s = st(key, it.kind === 'blank' ? 'blank' : 'vocab');
    var res = { correct: sess.lastCorrect, confidence: conf };
    /* 빈칸 단답은 힌트 없는 완전 인출이라 안정화 트랙을 탄다(§4.1 2단계 = SRS 대상) */
    if (it.kind === 'blank') E.recordCriterion(s, res, Date.now());
    else E.recordQuiz(s, res, Date.now());
    if (!sess.lastCorrect) markWrong(key, it);
    else clearIfWrong(key);
    persist();
    $('fb').innerHTML = '<div class="fb ' + (sess.lastCorrect ? 'ok' : 'no') + '">기록했어요.</div>' +
      '<button class="btn" style="margin-top:8px" data-next="1">다음</button>';
  }
  function finishQueue() {
    var sess = S.session;
    full('<div class="card"><h3>' + esc(sess.title) + ' 끝</h3>' +
      '<div>' + sess.right + ' / ' + sess.items.length + ' 정답</div>' +
      '<button class="btn" style="margin-top:10px" data-home="1">오늘로 돌아가기</button></div>');
    S.session = null;
    $('pane').addEventListener('click', function () { setTab('home'); });
  }

  /* 오답노트에 **발문 원문을 적지 않는다.** 적으면 그 글이 localStorage(학생 태블릿) ·
     KV `naesinko:state:*` · 야간 백업(`backup:<날짜>` 10일분)까지 그대로 복제된다.
     라이선스 자료를 금고(원장 PC)에 두는 결정(2026-10-11)은 "자료는 라이선스 칸에만 있다"를
     전제로 하는데, 이 한 줄이 그 전제를 깨고 있었다 — 팩 본문은 백업에서 공들여 뺐는데
     학생 기록이 발문을 태우고 들어갔다. 되찾을 **좌표만** 남긴다: 작품 id·종류·지면 번호는
     자료 본문이 아니다. 화면에 보일 이름은 wrongLabel() 이 팩에서 그때그때 만든다. */
  function markWrong(key, it) {
    var w = pk().wrong;
    if (!w[key]) {
      w[key] = { key: key, n: 0, cleared: false, dates: [],
        workId: (it && it.workId) || S.workId || null,
        kind: (it && it.kind) || null,
        mark: (it && it.mark) || null,
        no: (it && it.source && it.source.no) || null };
    }
    w[key].n += 1; w[key].cleared = false; w[key].dates = [];
  }

  /* 오답 한 줄의 이름 — 기록에는 글이 없으니 좌표로 그때그때 만든다.
     팩이 손에 없으면(체험 모드·다른 단원) 종류만 보인다. */
  var KIND_NAME = { vocab: '어휘', blank: '개념 빈칸', rhetoric: '표현', keyword: '시어',
    speaker: '화자', ox: 'O/X', matching: '짝 맞추기', composition: '구성', apply: '구절 적용' };
  function wrongLabel(x) {
    var out = [], wk = x && x.workId ? work(x.workId) : null;
    if (wk && wk.title) out.push(wk.title);
    if (x && x.mark) out.push(x.mark);
    if (x && x.kind) out.push(KIND_NAME[x.kind] || x.kind);
    if (x && x.no) out.push(x.no + '번');
    /* 표식도 번호도 없으면 같은 작품의 여러 줄이 똑같아 보인다 — id 꼬리로 가린다(글이 아니다) */
    if (!(x && (x.mark || x.no))) out.push(String((x && x.key) || '').slice(-8));
    if (!out.length) out.push(String((x && x.key) || ''));
    return out.length ? out.join(' · ') : String((x && x.key) || '');
  }

  /* 옛 버전이 적어 둔 발문을 불러올 때 지운다 — 수도를 잠그는 것과 이미 흘러나온 물을
     닦는 것은 다른 일이라 둘을 같이 한다. 지운 뒤 한 번 올려 보내 서버 기록에서도 사라진다. */
  function scrubWrong(d) {
    var n = 0, ps = (d && d.packs) || {}, id, w, k;
    for (id in ps) {
      w = ps[id] && ps[id].wrong;
      if (!w || typeof w !== 'object') continue;
      for (k in w) if (w[k] && typeof w[k] === 'object' && 'label' in w[k]) { delete w[k].label; n += 1; }
    }
    return n;
  }
  function clearIfWrong(key) {
    var w = pk().wrong[key];
    if (!w || w.cleared) return;
    var s = { wrongClearDates: w.dates };
    var r = E.clearWrong(s, Date.now());
    w.dates = s.wrongClearDates;
    if (r.cleared) w.cleared = true;
  }

  /* 3단계 구절 적용 — 실전 형식(5지선다·부정발문·<보기>)으로 생성한다 */
  function startApply() {
    var w = work(S.workId) || canonWorks()[0];
    if (!w) { S.err = '적용할 작품이 없어요.'; render(); return; }
    S.workId = w.workId;
    var items = GEN.applySet(w, S.concepts, 6, rnd, { negRatio: 0.5 });
    if (!items.length) { S.err = '이 작품은 아직 적용 문항을 만들 재료가 부족해요.'; render(); return; }
    S.session = { title: w.title + ' — 구절 적용', items: items, i: 0, right: 0, kind: 'apply', workId: w.workId };
    drawApply();
  }
  function drawApply() {
    var sess = S.session, it = sess.items[sess.i];
    if (!it) return finishApply();
    var w = work(sess.workId);
    var side = w.text ? '<div class="poem">' + R.poemHtml(w) + '</div>' : '<div class="small muted">본문 미수록 팩</div>';
    var m = ['<div class="card"><div class="spread"><h3 style="margin:0">' + esc(sess.title) + '</h3>' +
      '<span class="small muted">' + (sess.i + 1) + ' / ' + sess.items.length + '</span></div></div>'];
    m.push('<div class="q">');
    m.push('<div class="stem">' + it.stem + '</div>');
    if (it.bogi) m.push('<div class="bogi"><b>&lt;보기&gt;</b><br>' + esc(it.bogi.text) + '</div>');
    if (it.quote) m.push('<div class="quote">' + (it.mark ? '<span class="sym">' + esc(it.mark) + '</span> ' : '') + esc(it.quote) + '</div>');
    if (it.kind === 'ox') {
      m.push('<div id="chs"><button class="ch" data-key="O">○ 맞다</button><button class="ch" data-key="X">✕ 아니다</button></div>');
    } else {
      m.push('<div id="chs">' + it.choices.map(function (c) {
        return '<button class="ch" data-key="' + esc(c.key) + '">' + c.no + '. ' + esc(c.text) + '</button>';
      }).join('') + '</div>');
    }
    m.push('<div id="fb"></div></div>');
    split(side, m.join(''));
    $('pane').addEventListener('click', function (e) {
      var c = e.target.closest('[data-key]');
      if (c && !sess.answered) judgeApply(c.getAttribute('data-key'));
      if (e.target.closest('[data-next]')) { sess.i += 1; sess.answered = false; drawApply(); }
      var mt = e.target.closest('[data-mis]');
      if (mt) tagMistake(mt.getAttribute('data-mis'));
    });
  }
  function judgeApply(key) {
    var sess = S.session, it = sess.items[sess.i];
    sess.answered = true;
    var correct;
    if (it.kind === 'ox') {
      correct = (key === 'O') === !!it.answer;
      document.querySelectorAll('#chs .ch').forEach(function (b) {
        var k = b.getAttribute('data-key');
        if ((k === 'O') === !!it.answer) b.classList.add('ok');
        else if (k === key) b.classList.add('no');
      });
    } else {
      var ch = it.choices.filter(function (c) { return c.key === key; })[0];
      correct = !!(ch && ch.correct);
      document.querySelectorAll('#chs .ch').forEach(function (b) {
        var k = b.getAttribute('data-key');
        var cc = it.choices.filter(function (c) { return c.key === k; })[0];
        if (cc && cc.correct) b.classList.add('ok');
        else if (k === key) b.classList.add('no');
      });
    }
    if (correct) sess.right += 1;
    var ws = st(E.workKey(sess.workId), 'work');
    E.recordApply(ws, correct, Date.now());
    if (ws.stage < 3) ws.stage = 3;
    persist();

    /* 정답이든 오답이든 근거 구절을 보여 준다 — 이 단계의 목적은 구절→개념 연결이다 */
    var fb = '<div class="fb ' + (correct ? 'ok' : 'no') + '">' + (correct ? '정답' : '틀렸어요') +
      (it.evidence ? '<div class="small" style="margin-top:4px"><b>근거</b> — ' + esc(it.evidence) + '</div>' : '') +
      (it.explain ? '<div class="small" style="margin-top:4px">' + esc(it.explain) + '</div>' : '') + '</div>';
    if (!correct) {
      /* 실수 유형은 학생이 고른다 — 부정발문 실수는 기계로 판정할 수 없다(§5.4) */
      fb += '<div class="small muted" style="margin-top:8px">왜 틀렸을까요?</div><div class="conf">' +
        '<button data-mis="negative">발문 잘못 읽음</button><button data-mis="bogi">&lt;보기&gt; 오독</button>' +
        '<button data-mis="concept">개념 헷갈림</button><button data-mis="guess">찍음</button></div>';
    } else {
      fb += '<button class="btn" style="margin-top:8px" data-next="1">다음</button>';
    }
    $('fb').innerHTML = fb;
  }
  function tagMistake(kind) {
    var sess = S.session, it = sess.items[sess.i];
    var p = pk();
    p.mistakes = p.mistakes || {};
    p.mistakes[kind] = (p.mistakes[kind] || 0) + 1;
    markWrong('apply-' + it.id, it);
    persist();
    $('fb').innerHTML = '<div class="fb no">오답노트에 담았어요.</div>' +
      '<button class="btn" style="margin-top:8px" data-next="1">다음</button>';
  }
  function finishApply() {
    var sess = S.session;
    var ws = st(E.workKey(sess.workId), 'work');
    var g = gateOf(ws, sess.workId);
    full('<div class="card"><h3>구절 적용 끝</h3>' +
      '<div>' + sess.right + ' / ' + sess.items.length + ' 정답</div>' +
      '<div class="small muted" style="margin-top:6px">누적 적용 정답률 ' + Math.round(g.rate * 100) + '% (' + g.right + '/' + g.total + ')' +
      (g.open ? ' — 다음 단계가 열렸어요.' : ' — 기준 ' + Math.round(g.threshold * 100) + '%를 넘으면 서술형이 열려요.') + '</div>' +
      '<button class="btn" style="margin-top:10px" data-home="1">돌아가기</button></div>');
    S.session = null;
    $('pane').addEventListener('click', function () { setTab('works'); });
  }

  /* 4단계 주석 복원 — 지문을 보여 주고 표시 구절의 주석을 힌트 없이 쓴다(§4.4) */
  function startRestore() {
    var w = work(S.workId);
    var targets = GEN.restoreTargets(w).map(function (t) {
      t.keywords = ovAnswers('t-' + t.id, t.keywords);
      return t;
    });
    if (!targets.length) { S.err = '이 작품은 복원할 항목이 없어요.'; render(); return; }
    var side = w.text ? '<div class="poem">' + R.poemHtml(w) + '</div>' : '<div class="small muted">본문 미수록 팩</div>';
    var m = ['<div class="card"><h3>' + esc(w.title) + ' — 주석 복원</h3>' +
      '<div class="small muted">지문을 보고, 표시된 구절의 주석과 각 연의 내용을 힌트 없이 써 보세요.</div></div>'];
    targets.forEach(function (t) {
      m.push('<div class="card"><div class="small" style="font-weight:700;margin-bottom:6px">' + esc(t.label) + '</div>' +
        (t.quote ? '<div class="quote small">' + esc(t.quote) + '</div>' : '') +
        '<textarea rows="2" data-rt="' + esc(t.id) + '"></textarea></div>');
    });
    m.push('<div class="card"><button class="btn" data-grade="1">채점하기</button>' +
      '<div id="rfb" style="margin-top:10px"></div></div>');
    split(side, m.join(''));
    $('pane').addEventListener('click', function (e) {
      if (!e.target.closest('[data-grade]')) return;
      var inputs = {};
      document.querySelectorAll('[data-rt]').forEach(function (el) { inputs[el.getAttribute('data-rt')] = el.value; });
      var r = G.gradeRestore(inputs, targets);
      var ws = st(E.workKey(w.workId), 'work');
      var passed = r.coverage >= 0.7;
      if (ws.stage === 4) E.advanceStage(ws, passed, Date.now());
      else if (passed && ws.stage < 4) { ws.stage = 4; E.advanceStage(ws, true, Date.now()); }
      persist();
      var html = '<div class="fb ' + (passed ? 'ok' : 'hold') + '">완성 ' + r.full + ' · 부분 ' + r.partial +
        ' · 누락 ' + r.missing + ' (커버리지 ' + Math.round(r.coverage * 100) + '%)' +
        (passed ? ' — 통과했어요.' : ' — 70% 이상이면 통과예요.') + '</div><table class="mx" style="margin-top:8px">';
      r.perTarget.forEach(function (t) {
        var lab = t.status === 'full' ? '완성' : (t.status === 'partial' ? '부분' : '누락');
        html += '<tr><td class="t">' + esc(t.label) + '</td><td>' + lab + '</td><td class="t small muted">' +
          esc(t.keywords.join(', ')) + '</td></tr>';
      });
      html += '</table>';
      /* 누락 항목은 2단계 빈칸 큐로 되돌린다 — 실패 라우팅(§4.4) */
      var back = r.perTarget.filter(function (t) { return t.status === 'missing'; });
      if (back.length) html += '<div class="small muted" style="margin-top:8px">누락한 ' + back.length +
        '개 항목은 개념 빈칸으로 다시 나와요.</div>';
      /* 채점 결과(perTarget)에는 종류가 없다 — 원래 목표에서 찾아 좌표를 넘긴다.
         표식(㉠·㉡)은 자료를 가리키는 기호일 뿐이라 기록에 남겨도 된다. 그게 없으면
         오답노트 아홉 줄이 같은 작품 이름으로만 보여 학생이 무엇을 틀렸는지 못 가린다. */
      back.forEach(function (t) {
        var src = targets.filter(function (x) { return x.id === t.id; })[0] || {};
        markWrong('rt-' + t.id, { kind: src.kind, workId: w.workId, mark: src.mark || null });
      });
      persist();
      $('rfb').innerHTML = html;
    });
  }

  /* 5단계 서술형 — 루브릭 1층 채점 후 서버 제출(§5.3) */
  function startEssay(onlyWork) {
    var items = ((S.pack && S.pack.items) || []).filter(function (i) {
      return i.format === 'essay' && (!onlyWork || i.workId === onlyWork);
    });
    if (!items.length) { S.err = '서술형 문항이 없어요.'; render(); return; }
    S.session = { title: '서술형', items: items, i: 0, kind: 'essay' };
    drawEssay();
  }
  function drawEssay() {
    var sess = S.session, it = sess.items[sess.i];
    if (!it) { S.session = null; setTab('home'); return; }
    var side = R.passageHtml(S.pack, it);
    var m = ['<div class="card"><div class="spread"><h3 style="margin:0">서술형</h3>' +
      '<span class="small muted">' + (sess.i + 1) + ' / ' + sess.items.length + '</span></div></div>'];
    m.push('<div class="q"><div class="stem">' + it.stem + '</div>');
    /* 저장 문항의 <보기>도 그려야 한다 — 안 그리면 발문만 뜨고 판단 근거가 없는 문항이 된다.
       런타임 생성 문항(drawApply)만 그리고 있었는데, 단원집중 자료는 <보기> 제시형이 많다. */
    if (it.bogi && it.bogi.text) m.push('<div class="bogi"><b>&lt;보기&gt;</b><br>' + esc(it.bogi.text) + '</div>');
    if ((it.conditions || []).length) {
      m.push('<div class="cond" id="cond">' + it.conditions.map(function (c, i) {
        return '<span data-ci="' + i + '">' + esc(c.text || c.kind) + '</span>';
      }).join('') + '</div>');
    }
    /* 발판(§5.2) — 연습 모드에서만. 시험·수업 모드에서는 끈다. */
    var scaffold = !S.exam && !S.task;
    if (scaffold) {
      var form = (it.conditions || []).filter(function (c) { return c.kind === 'form'; })[0];
      if (form) m.push('<div class="small muted" style="margin-bottom:6px">첫 문장 뼈대: ' + esc(String(form.value).replace(/~/g, '____')) + '</div>');
    }
    m.push('<textarea id="ea" rows="4" placeholder="조건을 지켜 완결된 문장으로 쓰세요."></textarea>');
    m.push('<button class="btn" style="margin-top:8px" data-egrade="1">채점하기</button>');
    m.push('<div id="efb"></div></div>');
    split(side, m.join(''));

    var ta = $('ea');
    ta.addEventListener('input', function () {
      /* 조건 충족을 쓰면서 실시간으로 보여 준다 */
      var cs = G.checkConditions(ta.value, it.conditions);
      cs.forEach(function (c, i) {
        var el = document.querySelector('[data-ci="' + i + '"]');
        if (el) el.className = c.manual ? '' : (c.pass ? 'ok' : 'no');
      });
    });
    $('pane').addEventListener('click', function (e) {
      if (e.target.closest('[data-egrade]')) gradeEssay(it, ta.value);
      if (e.target.closest('[data-enext]')) { sess.i += 1; drawEssay(); }
    });
  }
  function gradeEssay(it, text) {
    var r = G.gradeRubric(text, it);
    var p = pk();
    p.essays[it.id] = { verdict: r.verdict, score: r.score, total: r.total, at: Date.now() };
    if (r.verdict === 'pass' && it.workId) {
      var ws = st(E.workKey(it.workId), 'work');
      if (ws.stage >= 4) { ws.stage = 5; E.advanceStage(ws, true, Date.now()); }
    }
    persist();
    var cls = r.verdict === 'pass' ? 'ok' : (r.verdict === 'fail' ? 'no' : 'hold');
    /* 조건을 어기면 내용이 맞아도 학교에서는 감점·0점이다(§1.4-5).
       "2/2점인데 미달"로 읽히지 않게, 막고 있는 조건을 먼저 말한다. */
    var bad = r.conditions.filter(function (c) { return !c.pass && !c.manual; });
    var html;
    if (bad.length) {
      html = '<div class="fb no"><b>조건을 지키지 않았어요</b>' +
        bad.map(function (c) {
          return '<div class="small" style="margin-top:4px">· ' + esc(c.text || c.kind) +
            (c.detail ? ' — ' + esc(c.detail) : '') + '</div>';
        }).join('') +
        '<div class="small" style="margin-top:6px">내용 요소는 ' + r.score + ' / ' + r.total +
        '점이에요. 조건만 맞추면 됩니다.</div></div>';
    } else {
      html = '<div class="fb ' + cls + '"><b>' + r.score + ' / ' + r.total + '점</b> — ' + esc(r.note) + '</div>';
    }
    html += '<table class="mx" style="margin-top:8px">';
    r.elements.forEach(function (el) {
      html += '<tr><td class="t">' + esc(el.element) + '</td><td>' + (el.met ? '갖춤' : '빠짐') +
        '</td><td>' + el.points + '점</td></tr>';
    });
    html += '</table>';
    if (r.verdict !== 'pass') {
      html += '<div class="small muted" style="margin-top:8px">선생님이 확인한 뒤 최종 점수가 정해져요.</div>';
    }
    if ((it.modelAnswers || []).length && r.verdict !== 'fail') {
      html += '<div class="card" style="margin-top:10px"><b>모범 답안</b><div class="small">' +
        esc(it.modelAnswers[0]) + '</div>';
      if ((it.answerChecks || []).length) {
        html += '<div class="small muted" style="margin-top:6px">채점 요소 — ' + esc(it.answerChecks.join(' / ')) + '</div>';
      }
      html += '</div>';
    }
    if (it.tip) html += '<div class="small muted" style="margin-top:6px">' + esc(it.tip) + '</div>';
    html += '<button class="btn" style="margin-top:10px" data-enext="1">다음</button>';
    $('efb').innerHTML = html;

    /* 서버에는 답안 원문을 별도 레코드로 보낸다 — state를 부풀리지 않는다(§8) */
    if (S.token && !S.demo) {
      api('/review', { method: 'POST', body: { review: {
        itemId: it.id, packId: S.packId, answer: text,
        rule: { verdict: r.verdict, score: r.score, total: r.total }, verdict: r.verdict
      } } }).catch(function () {});
    }
  }

  /* 브레인덤프 — 판정 없이 diff만(§4.4) */
  /* ── 출발선 진단 2분(§4.2) ──
     "무엇부터 시작할까"만 정한다. 안다고 답해도 engine.applyDiagnostic 은 reached 만 세우고
     needsRecheck 를 켜므로 안정화 회전(서로 다른 날 3회)은 그대로 돈다 — 그래서 화면도
     '아는 것을 건너뛴다'가 아니라 '출발선을 잡는다'로 말한다. 과장하면 학생이 안 돌린다. */
  function diagPool() {
    if (!S.pack) return [];
    return GEN.diagnosticSet({ works: canonWorks() }, pk().states, {});
  }
  function startDiag() {
    var items = diagPool();
    if (!items.length) { S.err = '진단할 것이 없어요.'; render(); return; }
    S.session = { title: '출발선 진단', items: items, i: 0, kind: 'diag', results: [] };
    drawDiag();
  }
  function drawDiag() {
    var sess = S.session, it = sess.items[sess.i];
    if (!it) { finishDiag(); return; }
    full('<div class="card"><div class="spread"><h3 style="margin:0">출발선 진단</h3>' +
      '<span class="small muted">' + (sess.i + 1) + ' / ' + sess.items.length + '</span></div>' +
      '<div class="small muted" style="margin-top:4px">맞히는 시험이 아니에요 — 아는 만큼만 눌러 주세요.</div></div>' +
      '<div class="q"><div class="small muted">' + esc(it.work) + ' · ' + (it.kind === 'vocab' ? '어휘' : '개념') + '</div>' +
      '<div class="stem" style="font-size:20px;margin:10px 0">' + esc(it.label) + '</div>' +
      '<div class="row">' +
      '<button class="btn" data-dg="1">알아요</button>' +
      '<button class="btn ghost" data-dg="0">모르겠어요</button></div></div>');
    $('pane').addEventListener('click', function (e) {
      var b = e.target.closest('[data-dg]');
      if (!b) return;
      sess.results.push({ key: it.key, known: b.getAttribute('data-dg') === '1' });
      sess.i += 1;
      drawDiag();
    });
  }
  function finishDiag() {
    var res = S.session.results || [];
    var p = pk();
    /* 상태가 없으면 만들어 둔다 — 진단이 먼저 오고 학습이 뒤따르는 순서다 */
    res.forEach(function (r) {
      if (!p.states[r.key]) {
        var kind = r.key.indexOf('v-') === 0 ? 'vocab' : 'blank';
        p.states[r.key] = E.createState(r.key.slice(2), kind, Date.now());
      }
    });
    E.applyDiagnostic(p.states, res, Date.now());
    p.diagDone = true;
    persist();
    var known = res.filter(function (r) { return r.known; }).length;
    S.session = null;
    full('<div class="card"><h3>출발선을 잡았어요</h3>' +
      '<div>' + res.length + '개 중 ' + known + '개를 안다고 했어요.</div>' +
      '<div class="small muted" style="margin-top:6px">아는 것으로 표시한 것도 <b>안정화 회전은 그대로</b> 돕니다 — ' +
      '서로 다른 날 3번 다시 만나야 시험장에서 꺼낼 수 있어요. 다만 처음 만나는 것들보다 뒤에 놓여요.</div>' +
      '<button class="btn" style="margin-top:10px" data-home="1">오늘 계획 보기</button></div>');
    $('pane').addEventListener('click', function () { setTab('home'); });
  }

  /* ── 종이 주석 복원 ○△× 입력(§4.4) ──
     인쇄물 QR 이 데려오는 화면이다. 종이로 푼 것을 앱 기록으로 들이되 **채점은 사람이 한 것**을
     그대로 받는다 — 종이 답안을 다시 타이핑시키면 아무도 안 한다(그게 종이를 쓴 이유다).
     판정 공식은 화면 채점과 같은 것을 쓴다(grade.js scorePaper) — 통과선이 두 벌이면
     같은 학생이 종이로 풀었느냐 화면으로 풀었느냐에 따라 다른 대접을 받는다. */
  function drawPaper() {
    var w = work(S.paperWork);
    if (!w) {
      full('<div class="card"><h3>종이 채점</h3><div class="small muted">이 시험 범위에 없는 작품이에요. ' +
        '선생님께 확인해 주세요.</div><button class="btn" style="margin-top:10px" data-pq="x">돌아가기</button></div>');
      $('pane').addEventListener('click', function () { S.paperWork = null; setTab('home'); });
      return;
    }
    var targets = GEN.restoreTargets(w);
    if (!targets.length) {
      full('<div class="card"><h3>종이 채점</h3><div class="small muted">이 작품은 복원할 항목이 없어요.</div>' +
        '<button class="btn" style="margin-top:10px" data-pq="x">돌아가기</button></div>');
      $('pane').addEventListener('click', function () { S.paperWork = null; setTab('home'); });
      return;
    }
    if (!S.paper) S.paper = {};
    var m = ['<div class="card"><h3>' + esc(w.title) + ' — 종이 채점</h3>' +
      '<div class="small muted">인쇄물에 쓴 주석을 정본과 대조해 ○△× 로 표시하세요. ' +
      '○ 다 맞음 · △ 일부 맞음 · × 못 씀. 표시하지 않은 항목은 <b>못 쓴 것</b>으로 셉니다.</div></div>'];
    targets.forEach(function (t) {
      var cur = S.paper[t.id];
      m.push('<div class="card"><div class="small" style="font-weight:700;margin-bottom:4px">' + esc(t.label) + '</div>' +
        (t.quote ? '<div class="quote small">' + esc(t.quote) + '</div>' : '') +
        '<div class="small muted" style="margin:6px 0">정본: ' + esc((t.keywords || []).join(' · ')) + '</div>' +
        '<div class="row">' +
        ['full', 'partial', 'missing'].map(function (k, i) {
          return '<button class="btn sm' + (cur === k ? '' : ' ghost') + '" data-pm="' + k + '" data-pt="' + esc(t.id) + '">' +
            ['○ 다 맞음', '△ 일부', '× 못 씀'][i] + '</button>';
        }).join('') + '</div></div>');
    });
    var marked = targets.filter(function (t) { return S.paper[t.id]; }).length;
    m.push('<div class="card"><div class="small muted">' + marked + ' / ' + targets.length + ' 표시함</div>' +
      '<div class="row" style="margin-top:8px">' +
      '<button class="btn" data-psave="1"' + (marked ? '' : ' disabled') + '>기록에 넣기</button>' +
      '<button class="btn ghost" data-pq="x">그만두기</button></div></div>');
    full(m.join(''));
    $('pane').addEventListener('click', function (e) {
      var mk = e.target.closest('[data-pm]');
      if (mk) { S.paper[mk.getAttribute('data-pt')] = mk.getAttribute('data-pm'); drawPaper(); return; }
      if (e.target.closest('[data-pq]')) { S.paperWork = null; S.paper = null; setTab('home'); return; }
      if (e.target.closest('[data-psave]')) savePaper(w, targets);
    });
  }
  function savePaper(w, targets) {
    var r = G.scorePaper(S.paper, targets);
    var ws = st(E.workKey(w.workId), 'work');
    var passed = r.coverage >= 0.7;
    /* 화면 채점과 같은 전이를 탄다 — 종이로 통과한 학생이 4단계에 머무르면 안 된다 */
    if (ws.stage === 4) E.advanceStage(ws, passed, Date.now());
    else if (passed && ws.stage < 4) { ws.stage = 4; E.advanceStage(ws, true, Date.now()); }
    pk().log.push({ at: Date.now(), kind: 'paper', workId: w.workId, coverage: r.coverage });
    persist();
    S.paperWork = null; S.paper = null;
    full('<div class="card"><h3>종이 채점을 넣었어요</h3>' +
      '<div class="fb ' + (passed ? 'ok' : 'hold') + '">○ ' + r.full + ' · △ ' + r.partial + ' · × ' + r.missing +
      ' (커버리지 ' + Math.round(r.coverage * 100) + '%)' + (passed ? ' — 통과했어요.' : ' — 70% 이상이면 통과예요.') + '</div>' +
      '<div class="small muted" style="margin-top:8px">화면에서 푼 것과 같은 기준입니다.</div>' +
      '<button class="btn" style="margin-top:10px" data-home="1">오늘 계획 보기</button></div>');
    $('pane').addEventListener('click', function () { setTab('home'); });
  }

  function startDump() {
    var w = work(S.workId) || canonWorks()[0];
    if (!w) { S.err = '작품이 없어요.'; render(); return; }
    var targets = GEN.restoreTargets(w);
    full('<div class="card"><h3>' + esc(w.title) + ' — 브레인덤프 2분</h3>' +
      '<div class="small muted">기억나는 것을 그냥 쏟아 내세요. 점수는 매기지 않아요.</div>' +
      '<textarea id="dp" rows="6" style="margin-top:10px"></textarea>' +
      '<button class="btn" style="margin-top:8px" data-dump="1">무엇을 안 썼는지 보기</button>' +
      '<div id="dfb"></div></div>');
    $('pane').addEventListener('click', function (e) {
      if (!e.target.closest('[data-dump]')) return;
      var r = G.dumpDiff($('dp').value, targets);
      var p = pk();
      p.dump.push({ workId: w.workId, at: Date.now(), present: r.present, total: r.total });
      if (p.dump.length > 200) p.dump = p.dump.slice(-200);
      persist();
      $('dfb').innerHTML = '<div class="fb hold" style="margin-top:10px">' + r.present + ' / ' + r.total + '개를 떠올렸어요.</div>' +
        '<table class="mx" style="margin-top:8px">' + r.perTarget.map(function (t) {
          return '<tr><td class="t">' + esc(t.label) + '</td><td>' + (t.present ? '썼음' : '안 씀') + '</td></tr>';
        }).join('') + '</table>';
    });
  }

  /* ── 문제 (저장 문항) ── */
  function renderQuiz() {
    var items = (S.pack && S.pack.items) || [];
    if (!items.length) { full(banner() + '<div class="card">저장된 문항이 없어요.</div>'); return; }
    var mc = items.filter(function (i) { return i.format === 'mc5'; });
    var etc = items.filter(function (i) { return i.format === 'ox' || i.format === 'matching' || i.format === 'cloze'; });
    var es = items.filter(function (i) { return i.format === 'essay'; });
    var m = [banner()];
    m.push('<div class="card"><h3>실전 객관식</h3><div class="small muted">' + mc.length +
      '문항 · 선지별 해설이 붙어 있어요.</div>' +
      (mc.length ? '<button class="btn sm" style="margin-top:8px" data-start="mc">시작</button>' : '') + '</div>');
    m.push('<div class="card"><h3>확인 문제</h3><div class="small muted">' + etc.length + '문항</div>' +
      (etc.length ? '<button class="btn sm ghost" style="margin-top:8px" data-start="etc">시작</button>' : '') + '</div>');
    m.push('<div class="card"><h3>서술형</h3><div class="small muted">' + es.length + '문항</div>' +
      (es.length ? '<button class="btn sm ghost" style="margin-top:8px" data-start="es">시작</button>' : '') + '</div>');
    m.push(sourceNote());
    full(m.join(''));
    $('pane').addEventListener('click', function (e) {
      var b = e.target.closest('[data-start]');
      if (!b) return;
      var k = b.getAttribute('data-start');
      if (k === 'es') startEssay();
      else runStored(k === 'mc' ? mc : etc);
    });
  }
  function runStored(items) {
    S.session = { title: '문제 풀이', items: items, i: 0, right: 0, kind: 'stored' };
    drawStored();
  }
  function drawStored() {
    var sess = S.session, it = sess.items[sess.i];
    if (!it) {
      full('<div class="card"><h3>끝</h3><div>' + sess.right + ' / ' + sess.items.length + ' 정답</div>' +
        '<button class="btn" style="margin-top:10px" data-home="1">돌아가기</button></div>');
      S.session = null;
      $('pane').addEventListener('click', function () { setTab('quiz'); });
      return;
    }
    var m = ['<div class="card"><div class="spread"><h3 style="margin:0">' + esc(sess.title) + '</h3>' +
      '<span class="small muted">' + (sess.i + 1) + ' / ' + sess.items.length + '</span></div></div>'];
    m.push('<div class="q"><div class="stem">' + it.stem + '</div>');
    /* 저장 문항의 <보기>도 그려야 한다 — 안 그리면 발문만 뜨고 판단 근거가 없는 문항이 된다.
       런타임 생성 문항(drawApply)만 그리고 있었는데, 단원집중 자료는 <보기> 제시형이 많다. */
    if (it.bogi && it.bogi.text) m.push('<div class="bogi"><b>&lt;보기&gt;</b><br>' + esc(it.bogi.text) + '</div>');
    if (it.format === 'mc5') {
      m.push('<div id="chs">' + (it.choices || []).map(function (c) {
        return '<button class="ch" data-no="' + c.no + '">' + c.no + '. ' + esc(c.text) + '</button>';
      }).join('') + '</div>');
    } else if (it.format === 'ox') {
      m.push('<div id="chs"><button class="ch" data-no="O">○ 맞다</button><button class="ch" data-no="X">✕ 아니다</button></div>');
    } else if (it.format === 'matching') {
      m.push('<div class="small muted">용어를 고른 뒤 설명을 고르세요.</div>');
      m.push('<div id="chs">' + (it.terms || []).map(function (t, i) {
        return '<div class="row" style="margin-bottom:6px"><b style="width:100px">' + esc(t.text) + '</b>' +
          '<select data-mk="' + esc(t.key) + '"><option value="">선택</option>' +
          (it.defs || []).map(function (d, k) { return '<option value="' + esc(d.key) + '">' + (k + 1) + '. ' + esc(d.text) + '</option>'; }).join('') +
          '</select></div>';
      }).join('') + '<button class="btn sm" data-msub="1">확인</button></div>');
    }
    m.push('<div id="fb"></div></div>');
    split(R.passageHtml(S.pack, it), m.join(''));
    $('pane').addEventListener('click', function (e) {
      var c = e.target.closest('[data-no]');
      if (c && !sess.answered) judgeStored(it, c.getAttribute('data-no'));
      if (e.target.closest('[data-msub]')) judgeMatching(it);
      if (e.target.closest('[data-next]')) { sess.i += 1; sess.answered = false; drawStored(); }
    });
  }
  function judgeStored(it, pickRaw) {
    var sess = S.session;
    sess.answered = true;
    var correct, fb;
    if (it.format === 'ox') {
      correct = (pickRaw === 'O') === !!it.answer;
      document.querySelectorAll('#chs .ch').forEach(function (b) {
        var k = b.getAttribute('data-no');
        if ((k === 'O') === !!it.answer) b.classList.add('ok'); else if (k === pickRaw) b.classList.add('no');
      });
      fb = '<div class="fb ' + (correct ? 'ok' : 'no') + '">' + (correct ? '정답' : '틀렸어요') +
        (it.explanation && it.explanation.main ? '<div class="small" style="margin-top:4px">' + esc(it.explanation.main) + '</div>' : '') + '</div>';
    } else {
      var pick = +pickRaw;
      correct = pick === it.answer;
      document.querySelectorAll('#chs .ch').forEach(function (b) {
        var n = +b.getAttribute('data-no');
        if (n === it.answer) b.classList.add('ok'); else if (n === pick) b.classList.add('no');
      });
      /* 내가 고른 선지가 왜 틀렸는지 — 이 자료의 강점이자 §5.2의 핵심 */
      var per = (it.explanation && it.explanation.perChoice) || {};
      fb = '<div class="fb ' + (correct ? 'ok' : 'no') + '">' + (correct ? '정답' : '정답은 ' + it.answer + '번') +
        (per[pick] ? '<div class="small" style="margin-top:6px"><b>' + pick + '번</b> — ' + esc(per[pick]) + '</div>' : '') +
        (!correct && per[it.answer] ? '<div class="small" style="margin-top:4px"><b>' + it.answer + '번</b> — ' + esc(per[it.answer]) + '</div>' : '') +
        /* main 과 정답 선지 해설이 같은 문장인 자료가 많다(지면의 해설이 '앞 산문 + 오답 풀이'
           구조라 앞 산문이 곧 정답 근거다). 같으면 한 번만 보인다 — 두 번 읽히면 다른 말인 줄 안다. */
        (it.explanation && it.explanation.main && it.explanation.main !== per[pick] && it.explanation.main !== per[it.answer]
          ? '<div class="small" style="margin-top:6px">' + esc(it.explanation.main) + '</div>' : '') +
        '</div>';
    }
    if (correct) sess.right += 1;
    else {
      markWrong('item-' + it.id, it);
      /* 오답 → 연결된 개념 단위 되돌리기(§5.4). targetRefs가 비면(정본 없는 작품)
         작품 단위 오답노트로만 남는다. */
      (it.targetRefs || []).forEach(function (ref) {
        if (ref.indexOf('b-') === 0) markWrong(ref, { kind: 'blank', workId: it.workId });
      });
    }
    persist();
    $('fb').innerHTML = fb + '<button class="btn" style="margin-top:8px" data-next="1">다음</button>';
  }
  function judgeMatching(it) {
    var sess = S.session;
    sess.answered = true;
    var right = 0;
    (it.terms || []).forEach(function (t) {
      var sel = document.querySelector('[data-mk="' + t.key + '"]');
      if (sel && sel.value === t.key) right += 1;
    });
    var all = right === (it.terms || []).length;
    if (all) sess.right += 1; else markWrong('item-' + it.id, it);
    persist();
    $('fb').innerHTML = '<div class="fb ' + (all ? 'ok' : 'no') + '">' + right + ' / ' + it.terms.length + ' 짝을 맞췄어요.</div>' +
      '<button class="btn" style="margin-top:8px" data-next="1">다음</button>';
  }

  /* ── 성취도 ── */
  function renderProgress() {
    var p = pk(), sum = E.workSummary(p.states);
    var v = E.kindSummary(p.states, 'vocab'), b = E.kindSummary(p.states, 'blank');
    var m = [banner()];
    m.push(readyCard(readyNow(), false));
    m.push('<div class="card"><h3>작품 × 단계</h3><table class="mx"><tr><th class="t">작품</th>' +
      '<th>단계</th><th>적용</th><th>복원</th><th>서술형</th></tr>');
    canonWorks().forEach(function (w) {
      var s = st(E.workKey(w.workId), 'work');
      var g = gateOf(s, w.workId);
      m.push('<tr><td class="t">' + esc(w.title) + '</td><td>' + s.stage + '. ' + stageName(s.stage) + '</td>' +
        '<td>' + (g.total ? Math.round(g.rate * 100) + '%' : '-') + '</td>' +
        '<td>' + (s.reached ? '통과' : '-') + '</td><td>' + (s.essayDone ? '통과' : '-') + '</td></tr>');
    });
    m.push('</table><div class="small muted" style="margin-top:8px">완료 = 적용 정답률 기준 + 주석 복원 + 서술형, 셋을 모두 넘긴 작품이에요.</div></div>');

    m.push('<div class="card"><h3>개념·어휘 안정화</h3>' +
      '<div>개념 빈칸 ' + b.stable + ' 안정화 / ' + b.reached + ' 도달 / ' + b.total + '</div>' +
      '<div>어휘·개념어 ' + v.stable + ' 안정화 / ' + v.reached + ' 도달 / ' + v.total + '</div>' +
      '<div class="small muted" style="margin-top:6px">안정화 = 서로 다른 날 3번 다시 꺼낸 것. 시험일에 꺼낼 수 있다는 뜻이에요.</div></div>');

    var mis = p.mistakes || {};
    var labels = { negative: '발문 잘못 읽음', bogi: '&lt;보기&gt; 오독', concept: '개념 헷갈림', guess: '찍음' };
    var keys = Object.keys(mis);
    if (keys.length) {
      m.push('<div class="card"><h3>내 실수 유형</h3><table class="mx">');
      keys.forEach(function (k) { m.push('<tr><td class="t">' + (labels[k] || k) + '</td><td>' + mis[k] + '회</td></tr>'); });
      m.push('</table></div>');
    }

    var open = [], k;
    for (k in p.wrong) if (p.wrong[k] && !p.wrong[k].cleared) open.push(p.wrong[k]);
    m.push('<div class="card"><h3>오답노트</h3>');
    if (!open.length) m.push('<div class="small muted">해결하지 않은 오답이 없어요.</div>');
    else {
      m.push('<div class="small muted">서로 다른 날 2번 맞히면 지워져요. 남은 ' + open.length + '개</div><table class="mx" style="margin-top:6px">');
      open.slice(0, 30).forEach(function (x) {
        m.push('<tr><td class="t">' + esc(wrongLabel(x).slice(0, 60)) + '</td><td>' + x.n + '회</td>' +
          '<td>' + (x.dates || []).length + '/2일</td></tr>');
      });
      m.push('</table>');
    }
    m.push('</div>');

    var es = Object.keys(p.essays || {});
    if (es.length) {
      var pass = es.filter(function (i) { return p.essays[i].verdict === 'pass'; }).length;
      m.push('<div class="card"><h3>서술형</h3><div>확정 통과 ' + pass + ' / 제출 ' + es.length + '</div>' +
        '<div class="small muted" style="margin-top:6px">보류는 선생님이 확인한 뒤 점수가 정해져요.</div></div>');
    }
    m.push(sourceNote());
    full(m.join(''));
  }

  /* ── 어휘·개념 ── */
  function renderVocab() {
    var m = [banner()];
    var p = plan();
    var n = p.vocab.fresh.length + p.vocab.review.length + p.vocab.relearn.length;
    m.push('<div class="card"><h3>오늘 어휘 큐</h3><div class="small muted">' + n + '개</div>' +
      (n ? '<button class="btn sm" style="margin-top:8px" data-v="1">시작</button>' : '') + '</div>');
    m.push('<div class="card"><h3>작품 어휘</h3><table class="mx">');
    canonWorks().forEach(function (w) {
      (w.vocab || []).forEach(function (v) {
        var s = pk().states[E.vocabKey(v.id)];
        m.push('<tr><td class="t"><b>' + esc(v.term) + '</b><div class="small muted">' + esc(v.definition) + '</div></td>' +
          '<td><span class="gauge">' + gauge(s) + '</span></td></tr>');
      });
    });
    m.push('</table></div>');
    m.push('<div class="card"><h3>개념어 사전</h3><div class="small muted">' + S.concepts.length +
      '개 · 헷갈리는 짝끼리 함께 나와요.</div><table class="mx" style="margin-top:8px">');
    S.concepts.slice(0, 60).forEach(function (c) {
      m.push('<tr><td class="t"><b>' + esc(c.term) + '</b> <span class="small muted">' + esc(c.category) + '</span>' +
        '<div class="small">' + esc(c.definition) + '</div>' +
        '<div class="small muted">예: ' + esc((c.examples || [])[0] || '') + '</div></td></tr>');
    });
    m.push('</table></div>');
    full(m.join(''));
    $('pane').addEventListener('click', function (e) { if (e.target.closest('[data-v]')) startVocab(); });
  }
  function gauge(s) {
    var n = E.stability(s || {});
    var out = '';
    for (var i = 0; i < 3; i++) out += '<i class="' + (i < n ? 'on' : '') + '"></i>';
    return out;
  }

  function render() {
    header();
    if (S.session) return;   // 세션 화면은 스스로 그린다
    if (S.paperWork) return drawPaper();
    if (S.tab === 'home') renderHome();
    else if (S.tab === 'works') renderWorks();
    else if (S.tab === 'vocab') renderVocab();
    else if (S.tab === 'quiz') renderQuiz();
    else renderProgress();
    var btns = document.querySelectorAll('#tabs button');
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('on', btns[i].getAttribute('data-tab') === S.tab);
    }
    S.err = null;
  }

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(function () {});
  boot();
})();
</script>
</body>
</html>
