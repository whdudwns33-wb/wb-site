<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>컨설팅 플래너 · WB 웩슬러브레인센터</title>
<meta name="theme-color" content="#1B3A5C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./learning-platform.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue:       #7C3AED;
    --deep-blue:  #5B21B6;
    --navy:       #1B3A5C;
    --coral:      #E85D4A;
    --ivory:      #FAF8F3;
    --dark-gray:  #2D2D2D;
    --mid-gray:   #6B7280;
    --line:       #E5E7EB;
    --light-gray: #F3F4F6;
    --white:      #FFFFFF;
    --green:      #16A34A;
    --amber:      #D97706;
  }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--dark-gray);
    background: var(--ivory);
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
    padding-bottom: 48px;
  }

  button, input, select, textarea { font-family: inherit; font-size: 100%; color: inherit; }
  button { cursor: pointer; border: none; background: none; }

  .wrap { max-width: 760px; margin: 0 auto; padding: 0 14px; }

  /* ─── 상단 바 ─── */
  .topbar { background: var(--navy); color: var(--white); padding: 12px 0; position: sticky; top: 0; z-index: 50; }
  .topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .brand { font-size: 15px; font-weight: 900; letter-spacing: -0.02em; }
  .brand span { color: var(--blue); }
  .brand small { display: block; font-size: 11px; font-weight: 400; color: rgba(255,255,255,0.6); letter-spacing: 0; }
  .whoami {
    font-size: 12px; font-weight: 700; background: rgba(255,255,255,0.14);
    padding: 6px 12px; border-radius: 999px; display: flex; align-items: center; gap: 6px;
  }
  .whoami i { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); font-style: normal; }
  .whoami.off i { background: var(--mid-gray); }

  /* ─── 탭 ─── */
  .tabs { background: var(--white); border-bottom: 1px solid var(--line); position: sticky; top: 55px; z-index: 40; }
  .tabs .wrap { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
  .tabs .wrap::-webkit-scrollbar { display: none; }
  .tab {
    padding: 13px 14px; font-size: 14px; font-weight: 700; color: var(--mid-gray);
    border-bottom: 3px solid transparent; white-space: nowrap; display: flex; align-items: center; gap: 5px;
  }
  .tab.on { color: var(--deep-blue); border-bottom-color: var(--blue); }
  .badge {
    background: var(--coral); color: var(--white); font-size: 11px; font-weight: 900;
    min-width: 18px; height: 18px; border-radius: 999px; padding: 0 5px;
    display: inline-flex; align-items: center; justify-content: center;
  }

  /* ─── 카드 ─── */
  .card { background: var(--white); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .card.alert { border-color: var(--coral); background: #FFF9F8; }
  .card-title { font-size: 15px; font-weight: 900; margin-bottom: 4px; }
  .card-sub { font-size: 13px; color: var(--mid-gray); }
  main { padding-top: 16px; }

  .row { display: flex; align-items: center; gap: 10px; }
  .row > .in { min-width: 0; }
  .wraprow { flex-wrap: wrap; }
  .between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .muted { color: var(--mid-gray); }
  .small { font-size: 12px; }
  .mb8 { margin-bottom: 8px; } .mb14 { margin-bottom: 14px; } .mt14 { margin-top: 14px; }

  /* ─── 버튼 ─── */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 11px 16px; border-radius: 10px; font-size: 14px; font-weight: 700;
    background: var(--light-gray); color: var(--dark-gray); border: 1px solid transparent;
  }
  .btn:active { filter: brightness(0.94); }
  .btn-primary { background: var(--blue); color: var(--white); }
  .btn-navy { background: var(--navy); color: var(--white); }
  .btn-ghost { background: var(--white); border-color: var(--line); }
  .btn-danger { background: #FEF2F2; color: var(--coral); }
  .btn-warn { background: #FFF7ED; color: #9A3412; border: 1px solid #FDE8CC; }
  .btn-sm { padding: 7px 11px; font-size: 12.5px; border-radius: 8px; }
  .btn-block { display: flex; width: 100%; }
  .btn:disabled { opacity: .5; cursor: default; }

  /* ─── 폼 ─── */
  .fl { display: block; font-size: 12.5px; font-weight: 700; color: var(--mid-gray); margin-bottom: 5px; }
  .in { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--white); font-size: 14.5px; }
  .in:focus { outline: 2px solid rgba(30,157,214,.35); outline-offset: -1px; border-color: var(--blue); }
  textarea.in { resize: vertical; min-height: 62px; line-height: 1.6; }
  .field { margin-bottom: 12px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip { padding: 8px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--white); font-size: 13px; font-weight: 700; color: var(--mid-gray); }
  .chip.on { background: var(--navy); border-color: var(--navy); color: var(--white); }
  .chip.dow { min-width: 42px; padding: 8px 0; text-align: center; justify-content: center; }

  /* ─── 날짜 네비 ─── */
  .datenav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px; }
  .datenav .d { font-size: 17px; font-weight: 900; }
  .datenav .d em { font-style: normal; font-size: 13px; font-weight: 700; color: var(--blue); margin-left: 6px; }
  .navbtn { width: 38px; height: 38px; border-radius: 10px; background: var(--white); border: 1px solid var(--line); font-size: 16px; font-weight: 900; color: var(--mid-gray); }

  /* ─── 진행률 ─── */
  .prog { display: flex; align-items: center; gap: 14px; }
  .ring {
    width: 62px; height: 62px; border-radius: 50%; flex-shrink: 0;
    display: grid; place-items: center; font-weight: 900; color: var(--navy);
    background: conic-gradient(var(--blue) calc(var(--p) * 1%), var(--light-gray) 0);
    position: relative;
  }
  .ring::after { content: ''; position: absolute; inset: 7px; background: var(--white); border-radius: 50%; }
  .ring b { position: relative; z-index: 1; font-size: 15px; }
  .bar { height: 8px; border-radius: 99px; background: var(--light-gray); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--blue); border-radius: 99px; }
  .bar.mini { height: 5px; }
  .bar.doing i { background: var(--amber); }

  /* ─── 업무 항목 ─── */
  .task { display: flex; gap: 12px; align-items: flex-start; padding: 14px 4px; border-bottom: 1px solid var(--light-gray); }
  .task:last-child { border-bottom: none; }
  .task.isblocked { background: #FFF9F8; border-radius: 10px; padding-left: 10px; padding-right: 10px; }
  .box {
    width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0; margin-top: 1px;
    border: 2px solid #D1D5DB; background: var(--white);
    display: grid; place-items: center; color: transparent; font-size: 15px; font-weight: 900;
  }
  .task.done .box { background: var(--blue); border-color: var(--blue); color: var(--white); }
  .task.doing .box { border-color: var(--amber); }
  .task-body { flex: 1; min-width: 0; }
  .task-t { font-size: 15px; font-weight: 700; line-height: 1.45; word-break: keep-all; }
  .task.done .task-t { color: var(--mid-gray); text-decoration: line-through; }
  .task-d { font-size: 13px; color: var(--mid-gray); margin-top: 3px; white-space: pre-wrap; word-break: break-word; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; align-items: center; }
  .tag { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: var(--light-gray); color: var(--mid-gray); }
  .tag.time { background: #EAF6FC; color: var(--deep-blue); }
  .tag.high { background: #FEF2F2; color: var(--coral); }
  .tag.ok   { background: #ECFDF5; color: var(--green); }
  .tag.doing{ background: #FFF7ED; color: #9A3412; }
  .tag.blk  { background: var(--coral); color: var(--white); }
  .tag.carry{ background: #FEF2F2; color: var(--coral); }
  .tag.add  { background: #ECFDF5; color: var(--green); }
  .tag.edit { background: #FFF7ED; color: #9A3412; }
  .note { margin-top: 8px; width: 100%; font-size: 13px; padding: 8px 10px; border: 1px dashed var(--line); border-radius: 8px; background: var(--ivory); }
  .empty { text-align: center; padding: 40px 16px; color: var(--mid-gray); font-size: 14px; }
  .empty b { display: block; font-size: 30px; margin-bottom: 8px; }

  /* ─── 단계 / 가이드 ─── */
  .opener { font-size: 12.5px; font-weight: 700; color: var(--deep-blue); padding: 4px 0; margin-top: 6px; }
  .panel { margin-top: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: #FCFDFE; }
  .guide { background: #F0F9FF; border: 1px solid #D5EBF7; border-radius: 8px; padding: 10px 12px; font-size: 13px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .guide b { display: block; color: var(--deep-blue); font-size: 12px; margin-bottom: 4px; }
  .step { display: flex; gap: 9px; align-items: flex-start; padding: 7px 0; font-size: 13.5px; }
  .sbox {
    width: 20px; height: 20px; border-radius: 6px; flex-shrink: 0; margin-top: 1px;
    border: 2px solid #D1D5DB; background: var(--white);
    display: grid; place-items: center; color: transparent; font-size: 12px; font-weight: 900;
  }
  .step.on .sbox { background: var(--green); border-color: var(--green); color: var(--white); }
  .step.on span { color: var(--mid-gray); text-decoration: line-through; }
  .counter { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; font-weight: 700; }
  .counter input { width: 74px; text-align: center; padding: 8px; }

  /* ─── 주간 그리드 ─── */
  .weekwrap { overflow-x: auto; }
  table.week { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 480px; }
  table.week th, table.week td { border: 1px solid var(--line); padding: 7px 6px; text-align: center; }
  table.week th.n, table.week td.n { text-align: left; width: 38%; font-weight: 700; }
  table.week thead th { background: var(--light-gray); font-size: 12px; color: var(--mid-gray); font-weight: 700; }
  table.week thead th.today { background: var(--navy); color: var(--white); }
  .dot { width: 20px; height: 20px; border-radius: 6px; display: inline-block; background: var(--light-gray); line-height: 20px; color: transparent; font-size: 12px; font-weight: 900; }
  .dot.done { background: var(--blue); color: var(--white); }
  .dot.doing { background: #FCD9A5; color: #7C2D12; }
  .dot.blocked { background: var(--coral); color: var(--white); }
  .dot.miss { background: #FDE8E4; }
  .dot.none { background: transparent; }

  /* ─── 학생 현황 ─── */
  .staffcard { display: flex; gap: 14px; align-items: center; }
  .ava { width: 44px; height: 44px; border-radius: 12px; background: var(--navy); color: var(--white); display: grid; place-items: center; font-weight: 900; font-size: 15px; flex-shrink: 0; }

  /* ─── 토스트 / 모달 ─── */
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px);
    background: var(--navy); color: var(--white); padding: 12px 20px; border-radius: 999px;
    font-size: 13.5px; font-weight: 700; opacity: 0; pointer-events: none; transition: all .2s; z-index: 200;
    max-width: 90vw; text-align: center;
  }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  .modal { position: fixed; inset: 0; background: rgba(27,58,92,.55); display: grid; place-items: center; padding: 16px; z-index: 150; }
  .modal-box { background: var(--white); border-radius: 16px; padding: 20px; width: 100%; max-width: 460px; max-height: 88vh; overflow-y: auto; }

  hr.sep { border: none; border-top: 1px solid var(--line); margin: 14px 0; }
  .hint { font-size: 12.5px; color: var(--mid-gray); line-height: 1.65; }
  /* ─── 월간 달력 ─── */
  table.cal { width: 100%; border-collapse: collapse; table-layout: fixed; }
  table.cal th { font-size: 11px; color: var(--mid-gray); font-weight: 700; padding: 4px 0; }
  table.cal td { padding: 2px; }
  .calday { width: 100%; aspect-ratio: 1; border: 1px solid var(--line); border-radius: 10px;
            background: var(--white); display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 1px; cursor: pointer; }
  .calday b { font-size: 13px; color: var(--dark-gray); }
  .calday small { font-size: 9px; color: var(--mid-gray); }
  .calday.has { background: var(--light-gray); }
  .calday.done { background: #EAF6FC; border-color: var(--blue); }
  .calday.done b, .calday.done small { color: var(--deep-blue); }
  .calday.doing { background: #FFF7ED; border-color: var(--amber); }
  .calday.doing small { color: #9A3412; }
  .calday.miss { background: #FEF2F2; border-color: #FECACA; }
  .calday.miss small { color: var(--coral); }
  .calday.today { outline: 2px solid var(--navy); outline-offset: -1px; }

  .newver {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 90;
    background: var(--navy); color: #fff; padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    font-size: 13.5px; font-weight: 700; box-shadow: 0 -4px 16px rgba(0,0,0,.18);
  }
  .newver button { background: #fff; color: var(--navy); font-weight: 900;
    padding: 8px 14px; border-radius: 8px; font-size: 13px; }
  .pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #EAF6FC; color: var(--deep-blue); }
  .pill.warn { background: #FFF7ED; color: #9A3412; }
  .pill.bad { background: #FEF2F2; color: var(--coral); }
  .sect { font-size: 12px; font-weight: 900; color: var(--mid-gray); letter-spacing: .04em; margin: 18px 0 8px; }

  @media (max-width: 520px) {
    #view .card .row, .modal-box .row { flex-wrap: wrap; }
    #view .card .between { flex-wrap: wrap; }
    #view .card .row > .in, .modal-box .row > .in { flex: 1 1 160px; min-width: 0; }
    #view .card .row > label, .modal-box .row > label { flex: 1 1 180px; min-width: 0; }
    #view .card .row > .btn, .modal-box .row > .btn { flex: 1 1 auto; }
    .grid2 { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <div class="brand"><span>WB</span> 컨설팅 플래너<small>Consulting Planner</small></div>
    <button class="whoami off" id="whoami"><i></i><span>—</span></button>
  </div>
</header>

<nav class="tabs"><div class="wrap" id="tabs"></div></nav>

<main class="wrap" id="view"></main>

<div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
<div id="modalHost"></div>

<script src="./learning-persistence.js"></script>
<script src="./program-imports.js"></script>
<script src="./learning-platform.js"></script>
<script src="./learning-shell.js"></script>
<script>
"use strict";

/* ══════════════════════════════════════════════════════
   1. 저장소
   ══════════════════════════════════════════════════════ */
const LEGACY_LS_KEY = 'wb_consult_v1';
const LEGACY_LINK_TOKEN_KEY = 'wb_consult_link_tokens_v1';
const URL_STAFF_ID = new URLSearchParams(location.search).get('u') || '';
const SAFE_SCOPE_ID = /^[A-Za-z0-9_-]{1,128}$/.test(URL_STAFF_ID) ? URL_STAFF_ID : '';
const HAS_PERSON_SCOPE = !!URL_STAFF_ID;
// 원장과 개인 링크가 같은 localStorage·동기화 커서를 공유하지 않도록 역할별로 격리한다.
const LS_KEY = HAS_PERSON_SCOPE ? 'wb_consult_v2_person_' + (SAFE_SCOPE_ID || 'invalid') : 'wb_consult_v2_admin';
const linkCodeVault = new Map();
const DOW = ['일','월','화','수','목','금','토'];

const CONSULT_ADMIN_SECRET_SESSION_KEY = 'wb_consult_admin_secret_v1';
let migratedPersistentAdminSecret = false;

function getConsultAdminSecret(vault) {
  try { return String((vault || sessionStorage).getItem(CONSULT_ADMIN_SECRET_SESSION_KEY) || ''); }
  catch (error) { return ''; }
}

function setConsultAdminSecret(value, vault) {
  const storage = vault || sessionStorage;
  const clean = String(value || '').trim();
  try {
    if (clean) storage.setItem(CONSULT_ADMIN_SECRET_SESSION_KEY, clean);
    else storage.removeItem(CONSULT_ADMIN_SECRET_SESSION_KEY);
  } catch (error) { console.warn('session secret failed', error); }
  return clean;
}

function removeAdminSecretFromState(target) {
  if (target && target.settings && Object.prototype.hasOwnProperty.call(target.settings, 'syncSecret')) {
    delete target.settings.syncSecret;
  }
  return target;
}

function scrubPersistentAdminSecrets(persistentStorage, sessionVault, keys, allowSession) {
  let discovered = '';
  Array.from(new Set(keys || [])).forEach(key => {
    try {
      const raw = persistentStorage.getItem(key);
      if (!raw) return;
      const parsed = JSON.parse(raw);
      if (!parsed || !parsed.settings || !Object.prototype.hasOwnProperty.call(parsed.settings, 'syncSecret')) return;
      const candidate = String(parsed.settings.syncSecret || '').trim();
      if (!discovered && candidate) discovered = candidate;
      delete parsed.settings.syncSecret;
      persistentStorage.setItem(key, JSON.stringify(parsed));
    } catch (error) { console.warn('persistent secret cleanup failed', key, error); }
  });
  if (allowSession && discovered && !getConsultAdminSecret(sessionVault)) {
    setConsultAdminSecret(discovered, sessionVault);
  }
  return !!discovered && !!allowSession;
}

function migratePersistentAdminSecret() {
  const keys = HAS_PERSON_SCOPE ? [LS_KEY] : [LS_KEY, LEGACY_LS_KEY];
  return scrubPersistentAdminSecrets(localStorage, sessionStorage, keys, !HAS_PERSON_SCOPE);
}

const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id' + Date.now() + Math.random().toString(16).slice(2));
const now = () => Date.now();

function blankState() {
  return {
    version: 3,
    staff: [],
    tasks: [],
    checks: {},
    settings: {
      adminPin: '', adminPinHash: '', adminPinSalt: '', adminPinVersion: 0,
      syncUrl: '', centerName: 'WB 웩슬러브레인센터', syncCursors: {}
    }
  };
}

let state = blankState();

function load() {
  try {
    migratedPersistentAdminSecret = migratePersistentAdminSecret();
    // 개인 링크는 과거 공용 저장소를 읽지 않는다. 원장만 기존 상태를 1회 복사한다.
    const scoped = localStorage.getItem(LS_KEY);
    const raw = scoped || (!HAS_PERSON_SCOPE ? localStorage.getItem(LEGACY_LS_KEY) : '');
    if (raw) {
      const p = JSON.parse(raw);
      state = Object.assign(blankState(), p);
      state.settings = Object.assign(blankState().settings, p.settings || {});
      removeAdminSecretFromState(state);
      state.settings.syncCursors = Object.assign({}, state.settings.syncCursors || {});
      if (!scoped) save();
    }
  } catch (e) { console.warn('load failed', e); }
}

function save() {
  removeAdminSecretFromState(state);
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  catch (e) { toast('저장 공간이 부족합니다'); }
}

function linkCodeFor(id) {
  const entry = linkCodeVault.get(String(id));
  if (!entry || Number(entry.expiresAt || 0) <= Date.now()) {
    linkCodeVault.delete(String(id));
    return '';
  }
  return String(entry.code || '');
}

function storeLinkCode(id, code, expiresAt) {
  linkCodeVault.set(String(id), { code: String(code || ''), expiresAt: Number(expiresAt) || 0 });
}

function clearLinkCode(id) {
  linkCodeVault.delete(String(id));
}

function staffWithoutLegacyTokens(staff) {
  return (Array.isArray(staff) ? staff : []).map(person => {
    if (!person || typeof person !== 'object' || Array.isArray(person)) return person;
    const clean = Object.assign({}, person);
    delete clean.token;
    return clean;
  });
}

function migrateLegacyStaffTokens() {
  // 개인 범위에서는 공용 legacy 저장소나 관리자 token vault에 절대 접근하지 않는다.
  if (HAS_PERSON_SCOPE) return;
  let changed = false;
  (state.staff || []).forEach(person => {
    if (!person || !person.token) return;
    delete person.token;
    changed = true;
  });
  try { localStorage.removeItem(LEGACY_LINK_TOKEN_KEY); } catch (error) {}
  if (changed) save();
}

function hasAdminPin() {
  return !!(state.settings.adminPinHash || state.settings.adminPin);
}

function randomHex(bytes) {
  const out = new Uint8Array(bytes);
  crypto.getRandomValues(out);
  return Array.from(out, b => b.toString(16).padStart(2, '0')).join('');
}

async function derivePinHash(pin, salt) {
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey('raw', enc.encode(String(pin)), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({
    name: 'PBKDF2', salt: enc.encode(String(salt)), iterations: 120000, hash: 'SHA-256'
  }, key, 256);
  return Array.from(new Uint8Array(bits), b => b.toString(16).padStart(2, '0')).join('');
}

async function setAdminPin(pin) {
  const salt = randomHex(16);
  state.settings.adminPinSalt = salt;
  state.settings.adminPinHash = await derivePinHash(pin, salt);
  state.settings.adminPinVersion = 1;
  state.settings.adminPin = '';
  save();
}

async function verifyAdminPin(pin) {
  if (state.settings.adminPinHash && state.settings.adminPinSalt) {
    return await derivePinHash(pin, state.settings.adminPinSalt) === state.settings.adminPinHash;
  }
  if (state.settings.adminPin && pin === state.settings.adminPin) {
    await setAdminPin(pin);
    return true;
  }
  return false;
}

/* ══════════════════════════════════════════════════════
   2. 날짜 유틸
   ══════════════════════════════════════════════════════ */
function ymd(d) {
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function parseYmd(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
function today() { return ymd(new Date()); }
function nowHM() { const d = new Date(); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
function dowOf(s) { return parseYmd(s).getDay(); }
function label(s) { const d = parseYmd(s); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + DOW[d.getDay()] + ')'; }
function shortDate(s) { const d = parseYmd(s); return (d.getMonth() + 1) + '/' + d.getDate(); }
function relLabel(s) {
  const diff = Math.round((parseYmd(s) - parseYmd(today())) / 86400000);
  if (diff === 0) return '오늘';
  if (diff === -1) return '어제';
  if (diff === 1) return '내일';
  return null;
}
function mondayOf(s) { const d = parseYmd(s); return addDays(s, -((d.getDay() + 6) % 7)); }
const ymOf = s => s.slice(0, 7);
function ymLabel(ym) { return ym.slice(0, 4) + '년 ' + Number(ym.slice(5)) + '월'; }
function ymAdd(ym, n) {
  const d = new Date(Number(ym.slice(0, 4)), Number(ym.slice(5, 7)) - 1 + n, 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function monthDates(ym) {
  const last = new Date(Number(ym.slice(0, 4)), Number(ym.slice(5, 7)), 0).getDate();
  return Array.from({ length: last }, (_, i) => ym + '-' + String(i + 1).padStart(2, '0'));
}

/* ══════════════════════════════════════════════════════
   3. 도메인 로직
   ══════════════════════════════════════════════════════ */
const liveStaff = () => state.staff.filter(s => !s.deleted);
/** 통계에 넣을 사람 — 대표는 제외한다. 대표 업무가 섞이면 학생 수행률이 흐려진다. */
const teamStaff = () => liveStaff().filter(s => !s.owner);
const owners = () => liveStaff().filter(s => s.owner);
const staffById = id => state.staff.find(s => s.id === id);
const staffByName = n => liveStaff().find(s => s.name === String(n || '').trim());

function occursOn(task, date) {
  if (task.deleted) return false;
  if (task.kind === 'mgoal') return false;   // 월간 목표는 일별 목록에 섞지 않는다
  if (task.start && date < task.start) return false;
  if (task.end && date > task.end) return false;
  switch (task.repeat) {
    case 'once':    return date === task.start;
    case 'daily':   return true;
    case 'weekday': { const w = dowOf(date); return w >= 1 && w <= 5; }
    case 'days':    return (task.days || []).includes(dowOf(date));
    default:        return false;
  }
}

function tasksFor(staffId, date) {
  return state.tasks
    .filter(t => t.staffId === staffId && occursOn(t, date))
    .sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99')
                 || (b.priority === 'high') - (a.priority === 'high')
                 || (a.createdAt || 0) - (b.createdAt || 0));
}

const ckey = (taskId, date) => taskId + '|' + date;
const getCheck = (taskId, date) => state.checks[ckey(taskId, date)] || null;
const isDone = (taskId, date) => !!(state.checks[ckey(taskId, date)] || {}).done;

function setCheck(taskId, date, patch) {
  const k = ckey(taskId, date);
  const cur = state.checks[k] || { taskId: taskId, date: date, done: false, note: '', steps: {}, count: 0, blocked: false };
  const next = Object.assign({}, cur, patch, { updatedAt: now() });
  state.checks[k] = next;
  save();
  queueSync();
  return next;
}

/** 단계·수량을 고려한 개별 업무 진행률 */
function taskProgress(t, c) {
  const steps = t.steps || [];
  if (steps.length) {
    const done = steps.filter(s => c && c.steps && c.steps[s.id]).length;
    return { done: done, total: steps.length, unit: '단계', pct: Math.round(done / steps.length * 100) };
  }
  if (t.target) {
    const n = (c && c.count) || 0;
    return { done: n, total: t.target, unit: t.unit || '건', pct: Math.min(100, Math.round(n / t.target * 100)) };
  }
  const d = (c && c.done) ? 1 : 0;
  return { done: d, total: 1, unit: '', pct: d * 100 };
}

/** 미착수 todo / 진행중 doing / 완료 done / 막힘 blocked */
function statusOf(t, date) {
  const c = getCheck(t.id, date);
  if (c && c.blocked) return 'blocked';
  if (c && c.done) return 'done';
  if (taskProgress(t, c).done > 0) return 'doing';
  return 'todo';
}
const STATUS_LABEL = { todo: '미착수', doing: '진행중', done: '완료', blocked: '막힘' };

/** 단계·수량이 다 차면 자동 완료, 되돌리면 자동 해제.
 *  둘 다 있는 업무는 단계도 끝나고 수량도 채워져야 완료다. */
function syncAuto(t, date) {
  const c = getCheck(t.id, date);
  if (!c) return;
  const hasSteps = (t.steps || []).length > 0, hasTarget = !!t.target;
  if (!hasSteps && !hasTarget) return;
  const stepsOk = !hasSteps || t.steps.every(s => c.steps && c.steps[s.id]);
  const countOk = !hasTarget || ((c.count || 0) >= t.target);
  const full = stepsOk && countOk;
  if (full && !c.done) setCheck(t.id, date, { done: true, at: now() });
  else if (!full && c.done) setCheck(t.id, date, { done: false, at: null });
}

function progress(staffId, date) {
  const list = tasksFor(staffId, date);
  const done = list.filter(t => isDone(t.id, date)).length;
  return { done: done, total: list.length, pct: list.length ? Math.round(done / list.length * 100) : 0 };
}

/** 그 달의 월간 목표 (kind:'mgoal') — 일별 업무와 별도로 산다 */
function goalsFor(staffId, ym) {
  return state.tasks
    .filter(t => !t.deleted && t.kind === 'mgoal' && t.staffId === staffId && t.month === ym)
    .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
}

function monthProgress(staffId, ym) {
  let done = 0, total = 0;
  monthDates(ym).forEach(d => { const p = progress(staffId, d); done += p.done; total += p.total; });
  return { done: done, total: total, pct: total ? Math.round(done / total * 100) : 0 };
}

function weekProgress(staffId, anchor) {
  const mon = mondayOf(anchor);
  let done = 0, total = 0;
  for (let i = 0; i < 7; i++) { const p = progress(staffId, addDays(mon, i)); done += p.done; total += p.total; }
  return { done: done, total: total, pct: total ? Math.round(done / total * 100) : 0 };
}

function streak(staffId) {
  let d = today(), n = 0;
  for (let i = 0; i < 120; i++) {
    const p = progress(staffId, d);
    if (p.total === 0) { d = addDays(d, -1); continue; }
    if (p.done < p.total) break;
    n++; d = addDays(d, -1);
  }
  return n;
}

/** 이월: 최근 7일 안에 못 끝낸 '이월' 업무 */
function carryOver(staffId, date) {
  const out = [];
  for (let i = 1; i <= 7; i++) {
    const d = addDays(date, -i);
    tasksFor(staffId, d).forEach(t => {
      if (!t.carry || isDone(t.id, d)) return;
      out.push({ t: t, date: d });
    });
  }
  return out.sort((a, b) => a.date.localeCompare(b.date));
}

/** 그 주에 학생이 스스로 추가한 업무 */
function staffAdded(anchor) {
  const mon = mondayOf(anchor);
  const days = Array.from({ length: 7 }, (_, i) => addDays(mon, i));
  const out = [];
  state.tasks.forEach(t => {
    if (t.deleted || t.origin !== 'staff') return;
    const s = staffById(t.staffId);
    if (!s || s.owner) return;              // 대표가 스스로 넣은 건 '학생 추가'가 아니다
    days.forEach(d => { if (occursOn(t, d)) out.push({ t: t, date: d }); });
  });
  return out.sort((a, b) => a.date.localeCompare(b.date));
}

/** 원장이 바로 봐야 할 것: 막힘 + 예정 시각이 지난 미완료 */
function alertsToday() {
  const d = today(), hm = nowHM();
  let blocked = 0, overdue = 0;
  liveStaff().forEach(s => tasksFor(s.id, d).forEach(t => {
    const c = getCheck(t.id, d);
    if (c && c.blocked) { blocked++; return; }
    if (c && c.done) return;
    if (t.time && t.time < hm) overdue++;
  }));
  return { blocked: blocked, overdue: overdue, total: blocked + overdue };
}

/* ══════════════════════════════════════════════════════
   4. 동기화 (선택) — Google Apps Script 웹앱
   ══════════════════════════════════════════════════════ */
/* 동기화 — Cloudflare Workers + D1
 * 예전에는 매번 전체 상태를 통째로 주고받았다. 학생이 100명이 되면
 * 한 명이 체크 하나를 눌러도 나머지 99명 데이터가 오가서 감당이 안 된다.
 * 지금은 (1) 마지막 동기화 이후 바뀐 것만 (2) 학생은 자기 것만 주고받는다. */
const SYNC_URL = 'https://wb-sync.whdudwns33.workers.dev';
const SYNC_APP = 'consult';
const SYNC_BATCH_SIZE = 400;
// 819,200건까지 한 회차에서 처리한다. 현재 안전 가져오기 최대치(255,000건)에 충분한 여유를 둔다.
const MAX_SYNC_ROUNDS = 2048;

/** 이 체크가 누구 것인지 — 서버가 학생별로 나눠 담는 기준이 된다.
 *  '__st__S1|2026-08-02' → S1,  '<taskId>|날짜' → 그 업무의 담당자 */
function ownerOfCheck(key) {
  const tid = String(key).split('|')[0];
  const m = tid.match(/^__[a-zA-Z]+__(.+)$/);
  if (m) return m[1];
  const t = (state.tasks || []).find(x => x.id === tid);
  return t ? (t.staffId || null) : null;
}

function syncCursor() {
  const key = session.isStaffLink ? 'person:' + session.staffId : 'admin';
  const all = state.settings.syncCursors || (state.settings.syncCursors = {});
  if (!all[key]) {
    all[key] = key === 'admin'
      ? { pullAt: Number(state.settings.pullAt) || 0, pushAt: Number(state.settings.pushAt) || 0 }
      : { pullAt: 0, pushAt: 0 };
  }
  return all[key];
}

const sync = {
  busy: false, dirty: false, last: null, timer: null, loud: false, err: '',

  /** 원장은 비밀키로, 학생은 개인 링크에 담겨 온 토큰으로 접속한다 */
  auth() {
    if (session.isStaffLink) {
      const t = state.settings.myToken || '';
      return t ? { mode: 'person', id: session.staffId, token: t } : null;
    }
    const k = getConsultAdminSecret();
    return k ? { mode: 'admin', secret: k } : null;
  },
  enabled() { return !!this.auth(); },

  /** since 이후 바뀐 것만 모은다. 각 레코드가 이미 updatedAt을 갖고 있어
   *  저장 지점마다 표시를 남기지 않아도 변경분을 정확히 골라낼 수 있다. */
  collect(since) {
    const out = [];
    (state.staff || []).forEach(s => {
      if ((s.updatedAt || 0) > since) out.push({ table: 'staff', id: s.id, owner: s.id, data: s, updated_at: s.updatedAt || 0 });
    });
    (state.tasks || []).forEach(t => {
      if ((t.updatedAt || 0) > since) out.push({ table: 'tasks', id: t.id, owner: t.staffId || null, data: t, updated_at: t.updatedAt || 0 });
    });
    Object.keys(state.checks || {}).forEach(k => {
      const c = state.checks[k];
      if (c && (c.updatedAt || 0) > since) out.push({ table: 'checks', k: k, owner: ownerOfCheck(k), data: c, updated_at: c.updatedAt || 0 });
    });
    return out;
  },

  /** 받은 변경을 반영한다. 내 것이 더 최신이면 그대로 둔다 */
  apply(changes) {
    let n = 0;
    (changes || []).forEach(ch => {
      if (!ch || !ch.data) return;
      const at = ch.data.updatedAt || 0;
      if (ch.table === 'checks') {
        const cur = state.checks[ch.key];
        const isPlannerAggregate = String(ch.key || '').startsWith('__lpplan__') && String(ch.key || '').endsWith('|all');
        if (isPlannerAggregate && cur && window.WBLearningPersistence && window.WBLearningPlatform) {
          try {
            const merged = WBLearningPersistence.mergePlannerCheckRecords(
              cur, ch.data, WBLearningPlatform.createPlannerItem
            );
            const mustRetry = merged.conflicts.length > 0 ||
              (merged.localPreserved === true && Boolean(merged.record.planMutation));
            if (mustRetry) {
              merged.record.updatedAt = Math.max(Number(merged.record.updatedAt) || 0, now() + 1);
              merged.changed = true;
            }
            if (merged.changed) { state.checks[ch.key] = merged.record; n++; }
          } catch (error) {
            throw new Error('플래너 동기화 병합 실패 — ' + String(error && error.message || error));
          }
        } else if (!cur || at > (cur.updatedAt || 0)) {
          state.checks[ch.key] = ch.data; n++;
        }
      } else if (ch.table === 'staff' || ch.table === 'tasks') {
        const arr = state[ch.table];
        const i = arr.findIndex(x => x.id === ch.key);
        if (i < 0) { arr.push(ch.data); n++; }
        else if (at > (arr[i].updatedAt || 0)) { arr[i] = ch.data; n++; }
      }
    });
    return n;
  },

  async post(path, body) {
    const res = await fetch(SYNC_URL + path, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const d = await res.json().catch(() => null);
    if (!d || d.ok !== true) throw new Error((d && d.error) || ('HTTP ' + res.status));
    if (Number(d.rejected || 0) > 0) throw new Error('서버가 ' + d.rejected + '건을 거절해 동기화를 중단했습니다');
    return d;
  },

  async run() {
    const auth = this.auth();
    if (!auth || this.busy) return;
    this.busy = true; paintStatus();
    try {
      const t0 = now();
      const cursorState = syncCursor();
      const pending = this.collect(Number(cursorState.pushAt) || 0);
      let rounds = 0;
      let serverMore = true;
      while ((pending.length || serverMore) && rounds < MAX_SYNC_ROUNDS) {
        rounds++;
        const batch = pending.splice(0, SYNC_BATCH_SIZE);
        const d = await this.post('/sync', {
          app: SYNC_APP, auth: auth,
          since: Number(cursorState.pullAt) || 0,
          changes: batch
        });
        this.apply(d.changes);
        const previousPull = Number(cursorState.pullAt) || 0;
        cursorState.pullAt = Number(d.now) || previousPull;
        if (d.more && cursorState.pullAt <= previousPull) throw new Error('동기화 커서가 진행되지 않습니다');
        serverMore = !!d.more;
      }
      if (pending.length || serverMore) {
        const reason = [
          pending.length ? '미전송 ' + pending.length + '건' : '',
          serverMore ? '서버 다음 페이지 남음' : ''
        ].filter(Boolean).join(', ');
        throw new Error('동기화 처리 한도 초과 — ' + reason + '. 커서를 유지하고 다시 시도해 주세요');
      }
      // 요청 도중에 바뀐 것은 updatedAt이 t0보다 크므로 다음 회차에 올라간다
      cursorState.pushAt = t0;
      save();
      this.last = now(); this.dirty = false; this.err = '';
      render();
    } catch (e) {
      console.warn('sync', e);
      this.dirty = true; this.err = String(e && e.message || e);
      if (this.loud) toast('동기화 실패 — ' + this.err);
    } finally {
      this.busy = false; this.loud = false; paintStatus();
    }
  },

  /** 링크에는 장기 bearer 대신 24시간 안에 한 번만 교환할 bootstrap code를 넣는다. */
  async issueBootstrap(staffId) {
    const auth = this.auth();
    if (!auth || auth.mode !== 'admin') throw new Error('원장 화면에서만 발급할 수 있습니다');
    return await this.post('/token', { app: SYNC_APP, auth: auth, staffId: staffId });
  },

  async exchangeBootstrap(staffId, code) {
    return await this.post('/exchange', { app: SYNC_APP, staffId: staffId, code: code });
  },

  async revokeAccess(staffId) {
    const auth = this.auth();
    if (!auth || auth.mode !== 'admin') throw new Error('원장 화면에서만 해지할 수 있습니다');
    return await this.post('/revoke', { app: SYNC_APP, auth: auth, staffId: staffId });
  }
};

function queueSync() {
  if (!sync.enabled()) return;
  sync.dirty = true;
  clearTimeout(sync.timer);
  sync.timer = setTimeout(() => sync.run(), 1200);
}

function go(r) { route = r; location.hash = '#/' + r; window.scrollTo(0, 0); render(); }
window.addEventListener('hashchange', () => {

function unb64(s) { return decodeURIComponent(escape(atob(String(s).replace(/-/g, '+').replace(/_/g, '/')))); }

let pendingAdd = null;   // 링크로 들어온 지시서 — 확인 후 등록
let pendingBootstrapCode = ''; // fragment에서 즉시 제거한 뒤 1회 교환할 코드

/** 링크에 담겨 온 것들을 흡수한다.
 *  s=  구형 비밀정보 복구 링크 (내용은 무시하고 URL에서 제거)
 *  add= 지시서 묶음 (원장이 링크 한 번으로 등록) */
function absorbLinkParams() {
  const q = new URLSearchParams(location.search);
  let touched = false;

  const legacyToken = q.get('t');
  if (legacyToken !== null) {
    // URL bearer는 절대 흡수하지 않는다. 새 1회용 링크를 다시 받아야 한다.
    q.delete('t'); touched = true;
    setTimeout(() => toast('기존 토큰 링크는 사용할 수 없습니다. 새 개인 링크를 받아 주세요'), 0);
  }

  const codeMatch = location.hash.match(/[#&]c=([^&]+)/);
  if (codeMatch) {
    try {
      const code = decodeURIComponent(codeMatch[1]);
      if (code && code.length <= 256) pendingBootstrapCode = code;
    } catch (error) { pendingBootstrapCode = ''; }
  }

  const s = q.get('s');
  if (s) {
    // 구형 복구 링크는 비밀키·PIN을 포함할 수 있으므로 내용을 흡수하지 않고 제거한다.
    q.delete('s'); touched = true;
  }

  // 지시서는 주소창에 남지 않도록 해시(#add=)를 우선 쓴다.
  let raw = null;
  const addMatch = location.hash.match(/[#&]add=([^&]+)/);
  if (addMatch) raw = addMatch[1];
  else if (q.get('add')) { raw = q.get('add'); q.delete('add'); touched = true; }

  if (raw) {
    try {
      const p = JSON.parse(unb64(raw));
      const list = Array.isArray(p) ? p : (p.assignments || []);
      if (list.length) pendingAdd = list;
    } catch (error) { console.warn('link add', error); }
  }

  // code fragment는 네트워크 교환보다 먼저 제거한다.
  if (touched || addMatch || codeMatch) {
    history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '') +
      (addMatch || codeMatch ? '' : location.hash));
  }
}

function saveLearningClaim(studentId, claimInput) {
  const input = claimInput || {};

  if (!Number.isInteger(expectedRevision) || expectedRevision < 1) throw new Error('완료 요청 revision이 올바르지 않습니다');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) throw new Error('완료 요청 날짜가 올바르지 않습니다');
  if (!window.WBLearningPersistence) {
    throw new Error('학습 저장 모듈을 사용할 수 없어 완료 요청을 저장하지 않았습니다');
  }
  const claims = lpClaimsFor(studentId).filter(claim => claim && claim.itemId !== itemId);
  claims.push({

    date: date,

  const taskId = '__lpclaim__' + studentId;

    value: { claims: claims.slice(-LP_CLAIM_LIMIT) }, done: true, updatedAt: now()
  });
  const nextChecks = Object.assign({}, state.checks, { [key]: nextCheck });
  const candidateState = Object.assign({}, state, { checks: nextChecks });
  removeAdminSecretFromState(candidateState);
  WBLearningPersistence.commitCandidate(localStorage, LS_KEY, candidateState, {
    maxBytes: 4 * 1024 * 1024,
    tooLargeMessage: '브라우저 저장 한도에 가까워 완료 요청을 저장하지 않았습니다',
    writeErrorMessage: '브라우저 저장 공간이 부족해 완료 요청을 저장하지 않았습니다'
  });
  state = candidateState;

}

function lpImportLedger(studentId) {

  return value && typeof value === 'object'
    ? { keys: (value.keys || []).slice(), history: (value.history || []).map(entry => Object.assign({}, entry)) }
    : { keys: [], history: [] };

function lpImportReviewKey(studentId, confirmBatch) {
  const identities = confirmBatch && Array.isArray(confirmBatch.candidates)
    ? confirmBatch.candidates.map(candidate => [
      candidate.row_id, candidate.student_code, candidate.provider_id,
      candidate.duplicate_key, candidate.payload_hash
    ].join(':')).sort()
    : [];
  return [studentId].concat(identities).join('|');
}
function normalizeLpImportLedger(value) {
  const result = {
    history: (value && value.history || []).slice(-100),
    keys: Array.from(new Set(value && value.keys || [])).slice(-600)
  };
  const size = () => new TextEncoder().encode(JSON.stringify(result)).length;
  while (size() > 52 * 1024 && (result.history.length || result.keys.length)) {
    if (result.history.length > 20 || (result.history.length && !result.keys.length)) result.history.shift();
    else if (result.keys.length) result.keys.shift();
  }
  if (size() > 52 * 1024) throw new Error('가져오기 이력이 너무 커서 저장할 수 없습니다');
  return result;
}

function validateLearningStudentScope(value, expectedStudentCode) {
  const expected = String(expectedStudentCode || '');
  const stack = [{ value: value, path: '$', depth: 0 }];
  const seen = new Set();
  const maxNodes = 20000;
  const maxDepth = 32;
  let visited = 0;
  while (stack.length) {
    const current = stack.pop();
    const node = current.value;
    if (!node || typeof node !== 'object') continue;
    if (seen.has(node)) continue;
    seen.add(node);
    visited += 1;
    if (visited > maxNodes) return { code: 'LP_STUDENT_SCOPE_LIMIT', path: current.path };
    const entries = Object.entries(node);
    for (let index = 0; index < entries.length; index += 1) {
      const key = entries[index][0];
      const child = entries[index][1];
      const path = current.path + (Array.isArray(node) ? '[' + key + ']' : '.' + key);
      if (key === 'studentCode' || key === 'student_code') {
        const explicit = child === undefined || child === null ? '' : String(child).trim();
        if (explicit && explicit !== expected) return { code: 'LP_FOREIGN_STUDENT_DATA', path: path };
      }
      if (child && typeof child === 'object') {
        if (current.depth >= maxDepth) return { code: 'LP_STUDENT_SCOPE_LIMIT', path: path };
        stack.push({ value: child, path: path, depth: current.depth + 1 });
      }
    }
  }
  return null;
}

function learningStateFor(student) {
  if (!student) return null;
  const failIntegrity = (code, message) => {
    lpLearningStateErrors.set(student.id, { code: code, message: message });
    console.warn('learning state integrity', code);
    return null;
  };
  if (!window.WBLearningShell || !window.WBLearningPersistence || !window.WBLearningPlatform) {
    return failIntegrity('LP_MODULE_UNAVAILABLE', '학습 기록을 읽는 모듈을 불러오지 못했습니다');
  }
  const learningRecords = {
    legacy: state.checks['__lp__' + student.id + '|all'],
    core: lpPart('lpcore', student.id),
    plan: lpPart('lpplan', student.id),
    assessment: lpPart('lpassess', student.id),
    campaign: lpPart('lpcampaign', student.id),
    wrong: lpPart('lpwrong', student.id),
    importLedger: lpPart('lpimport', student.id)
  };
  const requestedStudentCode = String(student.id || '');
  const scopeSources = [
    learningRecords.legacy && learningRecords.legacy.platformState,
    learningRecords.core && learningRecords.core.value,
    learningRecords.plan && learningRecords.plan.value,
    learningRecords.assessment && learningRecords.assessment.value,
    learningRecords.campaign && learningRecords.campaign.value,
    learningRecords.wrong && learningRecords.wrong.value,
    learningRecords.importLedger && learningRecords.importLedger.value
  ];
  const inspected = WBLearningPersistence.inspectLearningRecords(learningRecords);
  if (inspected.kind === 'uninitialized') {
    lpLearningStateErrors.delete(student.id);
    return null;
  }
  if (inspected.kind === 'corrupt') {
    lpLearningStateErrors.set(student.id, {
      code: inspected.code,
      message: inspected.message,
      missingParts: inspected.missingParts || []
    });
    console.warn('learning state integrity', inspected.code);
    return null;
  }
  try {
    const storedStudentCode = String(inspected.stored && inspected.stored.student && inspected.stored.student.studentCode || '');
    if (!storedStudentCode || storedStudentCode !== requestedStudentCode) {
      return failIntegrity('LP_STUDENT_MISMATCH', '저장된 학생 ID와 현재 학생이 일치하지 않습니다');
    }
    const storedPlannerItems = Array.isArray(inspected.stored.plannerItems) ? inspected.stored.plannerItems : [];
    const wrongStudentItem = storedPlannerItems.find(item =>
      !item || String(item.studentCode || '') !== requestedStudentCode
    );
    if (wrongStudentItem) {
      return failIntegrity('LP_PLANNER_STUDENT_MISMATCH', '다른 학생의 플래너 항목이 포함되어 있습니다');
    }
    for (let scopeIndex = 0; scopeIndex < scopeSources.length; scopeIndex += 1) {
      const scopeProblem = validateLearningStudentScope(scopeSources[scopeIndex], requestedStudentCode);
      if (scopeProblem) {
        return failIntegrity(scopeProblem.code,
          scopeProblem.code === 'LP_FOREIGN_STUDENT_DATA'
            ? '다른 학생의 학습 데이터가 포함되어 있어 자동 표시·저장을 중단했습니다'
            : '학습 데이터의 학생 범위를 안전하게 확인할 수 없어 자동 표시·저장을 중단했습니다');
      }
    }
    const storedIssues = Array.isArray(inspected.stored.migrationIssues)
      ? inspected.stored.migrationIssues.slice()
      : [];
    const normalized = WBLearningShell.normalizeState(inspected.stored, {
      studentCode: student.id,
      displayName: student.name
    });
    const normalizedIssues = Array.isArray(normalized.migrationIssues) ? normalized.migrationIssues : [];
    const storedIds = storedPlannerItems.map(item => String(item.itemId || '')).sort();
    const normalizedIds = normalized.plannerItems.map(item => String(item.itemId || '')).sort();
    const issuesChanged = normalizedIssues.length !== storedIssues.length ||
      JSON.stringify(normalizedIssues.slice(0, storedIssues.length)) !== JSON.stringify(storedIssues);
    if (issuesChanged || JSON.stringify(storedIds) !== JSON.stringify(normalizedIds)) {
      return failIntegrity('LP_NORMALIZATION_DATA_LOSS', '정규화 중 일부 학습 기록이 제외되어 자동 저장을 중단했습니다');
    }
    if (normalized.plannerItems.some(item => item.studentCode !== requestedStudentCode)) {
      return failIntegrity('LP_PLANNER_STUDENT_MISMATCH', '정규화된 플래너에 다른 학생 기록이 포함되어 있습니다');
    }
    const completed = WBLearningShell.applyCompletionClaims(normalized, lpClaimsFor(student.id));
    lpLearningStateErrors.delete(student.id);
    return completed;
  } catch (error) {
    console.warn('learning state', error);
    lpLearningStateErrors.set(student.id, {
      code: 'LP_NORMALIZE_FAILED',
      message: String(error && error.message || '학습 기록 정규화에 실패했습니다').slice(0, 240)
    });
    return null;
  }
}

function learningPlanWriteFor(studentId, currentRecord, nextItems, stamp) {
  if (currentRecord && !Array.isArray(currentRecord.value)) {
    throw new Error('기존 플래너 저장 형식이 손상되어 변경을 저장하지 않았습니다');
  }
  const currentItems = currentRecord
    ? WBLearningPersistence.restorePlannerItemsFromStorage(currentRecord.value, WBLearningPlatform.createPlannerItem)
    : [];
  const proposedItems = Array.isArray(nextItems) ? nextItems : [];
  const compactItems = WBLearningPersistence.compactPlannerItemsForStorage(
    proposedItems, WBLearningPlatform.createPlannerItem
  );
  const currentById = new Map();
  currentItems.forEach(item => {
    if (!item.itemId || currentById.has(item.itemId)) {
      throw new Error('기존 플래너 항목 ID가 중복되어 변경을 저장하지 않았습니다');
    }
    currentById.set(item.itemId, item);
  });
  const proposedById = new Map();
  proposedItems.forEach(item => {
    if (!item || !item.itemId || proposedById.has(item.itemId)) {
      throw new Error('플래너 항목 ID가 없거나 중복되어 변경을 저장하지 않았습니다');
    }
    proposedById.set(item.itemId, item);
  });
  const removedIds = currentItems.filter(item => !proposedById.has(item.itemId)).map(item => item.itemId);
  if (removedIds.length) {
    throw new Error('플래너 항목 삭제는 허용되지 않습니다. 취소 또는 이월 상태로 남겨 주세요');
  }
  const mutations = [];
  proposedItems.forEach(item => {
    const current = currentById.get(item.itemId) || null;
    const baseRevision = current ? Number(current.revision || 0) : 0;
    const nextRevision = Number(item.revision || 0);
    if (!Number.isInteger(nextRevision) || nextRevision < 1) {
      throw new Error('플래너 revision이 올바르지 않아 변경을 저장하지 않았습니다');
    }
    if (current && nextRevision === baseRevision) {
      if (!WBLearningPersistence.plannerItemsSemanticallyEqual(
        [current], [item], WBLearningPlatform.createPlannerItem
      )) {
        throw new Error('플래너 내용이 바뀌었지만 revision이 증가하지 않아 저장하지 않았습니다');
      }
      return;
    }
    if (current && nextRevision < baseRevision) {
      throw new Error('플래너 revision이 이전 값보다 작아 저장하지 않았습니다');
    }
    mutations.push({
      itemId: item.itemId,
      baseRevision: baseRevision,
      nextRevision: nextRevision
    });
  });
  return {
    write: !currentRecord || mutations.length > 0,
    value: compactItems,
    planMutation: mutations.length ? {
      id: ['lpm', stamp, uid()].join('_')
        .replace(/[^A-Za-z0-9_-]/g, '_').slice(0, 128),
      items: mutations
    } : null
  };
}

function saveLearningState(studentId, nextState, options) {
  if (!lpCanManage()) throw new Error('학습 원장 상태는 관리자만 저장할 수 있습니다');
  const opts = options || {};
  const stamp = now();
  const planTaskId = lpPartKey('lpplan', studentId);
  const planKey = ckey(planTaskId, 'all');
  const planWrite = learningPlanWriteFor(studentId, state.checks[planKey] || null, nextState.plannerItems, stamp);
  const pieces = {
    lpcore: {
      schemaVersion: nextState.schemaVersion,
      student: nextState.student,
      settings: nextState.settings,
      programStates: nextState.programStates,
      migrationIssues: nextState.migrationIssues || []
    },
    lpplan: planWrite.value,
    lpassess: {
      schedules: nextState.assessmentSchedules || [],
      occurrences: nextState.assessmentOccurrences || []
    },
    lpcampaign: nextState.prepCampaigns || [],
    lpwrong: nextState.remediationCases || []
  };
  if (opts.importLedger) pieces.lpimport = normalizeLpImportLedger(opts.importLedger);
  if (opts.clearClaimItemId) {
    pieces.lpclaim = {
      claims: lpClaimsFor(studentId).filter(claim => claim && claim.itemId !== opts.clearClaimItemId)
    };
  }
  const nextChecks = Object.assign({}, state.checks);
  Object.keys(pieces).forEach(prefix => {
    if (prefix === 'lpplan' && !planWrite.write) return;
    const bytes = new TextEncoder().encode(JSON.stringify(pieces[prefix])).length;
    if (bytes > 56 * 1024) throw new Error('학습 기록이 커졌습니다. v2 서버 이전 후 추가해 주세요 (' + prefix + ')');
    const taskId = lpPartKey(prefix, studentId);
    const key = ckey(taskId, 'all');
    const current = nextChecks[key] || { taskId: taskId, date: 'all', done: false };
    const nextRecord = Object.assign({}, current, { value: pieces[prefix], done: true, updatedAt: stamp });
    if (prefix === 'lpplan') {
      if (planWrite.planMutation) nextRecord.planMutation = planWrite.planMutation;
      else delete nextRecord.planMutation;
    }
    const recordBytes = new TextEncoder().encode(JSON.stringify(nextRecord)).length;
    if (recordBytes > 64 * 1024) {
      throw new Error('학습 기록 조각이 서버 64KB 한도를 초과해 저장하지 않았습니다 (' + prefix + ')');
    }
    nextChecks[key] = nextRecord;
  });
  const candidateState = Object.assign({}, state, { checks: nextChecks });
  removeAdminSecretFromState(candidateState);
  const serialized = JSON.stringify(candidateState);
  if (new TextEncoder().encode(serialized).length > 4 * 1024 * 1024) {
    throw new Error('브라우저 저장 한도에 가까워졌습니다. v2 이전 또는 오래된 이력 정리가 필요합니다');
  }
  try {
    localStorage.setItem(LS_KEY, serialized);
  } catch (error) {
    throw new Error('브라우저 저장 공간이 부족해 변경을 저장하지 않았습니다');
  }
  state = candidateState;
  queueSync();
}
function viewLearning() {

      '<div class="row"><select class="in" id="lpInitStage" aria-label="초기 학생 학교 단계"><option value="elementary">초등</option><option value="middle">중등</option><option value="high">고등</option></select>' +

function mountLearningView() {
  const root = document.getElementById('learning-platform');
  const student = currentStaff();
  if (!root || !student || !window.WBLearningPlatform) return;
  const learningState = learningStateFor(student);
  if (!learningState) return;
  learningMount = WBLearningPlatform.mountLearningPlatform(root, {
    state: learningState,
    today: today(),
    onChange: (nextState, action) => {
      try {
        if (lpCanManage()) {
          saveLearningState(student.id, nextState);
        } else if (action && action.type === 'planner_completion_claimed') {
          saveLearningClaim(student.id, { itemId: action.itemId, expectedRevision: action.expectedRevision, date: action.date, claimedAt: new Date().toISOString() });
        } else {
          throw new Error('학생 링크에서는 완료 요청만 저장할 수 있습니다');
        }
        // 플래너 내부 요청이 저장되면 관리자 확인대기 건수와 승인 버튼도 즉시 갱신한다.
        setTimeout(() => {
          render();
          if (action && action.type === 'planner_completion_claimed') {
            toast('완료 요청을 확인대기로 저장했습니다');
          }
        }, 0);
      } catch (error) {
        // mount 내부의 낙관적 확인대기 표시도 저장된 원본으로 되돌린다.
        setTimeout(() => render(), 0);
        toast(error.message);
      }
    }
  });
}

function runLearningCommand(command, successMessage) {
  const student = currentStaff();
  if (!student || !lpCanManage()) return toast('관리자 확인이 필요한 작업입니다');
  const current = learningStateFor(student);
  if (!current) {
    if (lpLearningStateErrors.has(student.id)) return toast('학습 기록 복구가 필요해 변경하지 않았습니다');
    return toast('통합 학습을 먼저 시작해 주세요');
  }
  try {
    const next = WBLearningShell.applyCommand(current, command, {
      actorId: lpActorId(), today: today(), at: new Date().toISOString()
    });
    saveLearningState(student.id, next, command && command.type === 'planner_verify'
      ? { clearClaimItemId: command.itemId }
      : null);
    render();
    toast(successMessage || '저장했습니다');
  } catch (error) { toast(error.message); }
}


function render() {
  if (learningMount) { learningMount.destroy(); learningMount = null; }
  paintStatus();
  renderTabs();
  const v = $('#view');

  if (session.isStaffLink && !staffById(session.staffId)) {
    v.innerHTML = '<div class="card"><div class="empty"><b>🔗</b>이 링크에 연결된 학생 정보가 없습니다.<br>원장님께 링크를 다시 요청해 주세요.</div></div>';
    return;
  }
  if (!session.isStaffLink && !session.isAdmin) { v.innerHTML = viewLock(); return; }

  if (pendingAdd) {
    if (session.isStaffLink) { pendingAdd = null; toast('지시서 등록은 원장 화면에서만 됩니다'); }
    else { v.innerHTML = viewPendingAdd(); return; }

  // 개인 링크는 허용된 화면만 — 관리자는 발행·현황까지, 학생은 자기 플래너만
  if (session.isStaffLink) {

    if (!allowed.includes(route)) route = 'today';

  const map = { today: viewToday, week: viewWeek, month: viewMonth, ingang: viewIngang, study: viewStudy, learning: viewLearning, write: viewWrite, board: viewBoard, staff: viewStaffAdmin, settings: viewSettings };

}

/* ── 오늘 ── */
function viewToday() {
  const me = currentStaff();
  if (!me) return emptyStaffCard();

  const rel = relLabel(cursor);
  const list = tasksFor(me.id, cursor);
  const p = progress(me.id, cursor);
  const editable = session.isStaffLink || session.isAdmin;
  const carry = (cursor === today()) ? carryOver(me.id, cursor) : [];

  let h = '';
  if (!session.isStaffLink) h += staffSwitcher(me.id);

  h += '<div class="datenav">' +
    '<button class="navbtn" data-act="day" data-n="-1">‹</button>' +
    '<div class="d">' + label(cursor) + (rel ? '<em>' + rel + '</em>' : '') + '</div>' +
    '<button class="navbtn" data-act="day" data-n="1">›</button></div>';

  const counts = { todo: 0, doing: 0, done: 0, blocked: 0 };
  list.forEach(t => counts[statusOf(t, cursor)]++);

  h += '<div class="card"><div class="prog">' +
    '<div class="ring" style="--p:' + p.pct + '"><b>' + p.pct + '%</b></div>' +
    '<div style="flex:1">' +
      '<div class="card-title">' + esc(me.name) + ' 학생</div>' +

        (list.length
          ? '완료 ' + counts.done + ' · 진행중 ' + counts.doing + ' · 미착수 ' + counts.todo +
            (counts.blocked ? ' · <b style="color:var(--coral)">막힘 ' + counts.blocked + '</b>' : '') +
            (p.total && p.done === p.total ? ' · 오늘 완료 🎉' : '')
          : '지시된 업무가 없습니다') +
      '</div>' +
      '<div class="bar"><i style="width:' + p.pct + '%"></i></div>' +
    '</div></div></div>';

  h += tbCard(me, editable);

  if (cursor === today()) h += ingTodayCard(me, editable);

  if (editable && cursor === today()) {
    h += stCard(me);

    h += '<div class="card" style="padding:12px">' +
      '<div class="row" style="gap:8px">' +
        '<input class="in" id="qAdd" placeholder="빠른 추가 — 예) 3시까지 보호자께 전화">' +

      '</div></div>';

}

function taskRow(t, date, editable, isCarry) {
  const c = getCheck(t.id, date);
  const st = statusOf(t, date);
  const prog = taskProgress(t, c);
  const hasDetail = (t.steps || []).length || t.guide || t.target;
  const open = openPanels.has(t.id + '|' + date);

  let h = '<div class="task ' + st + (st === 'blocked' ? ' isblocked' : '') + '" data-task="' + t.id + '">' +
    '<button class="box" ' + (editable ? 'data-act="toggle" data-id="' + t.id + '" data-date="' + date + '"' : 'disabled') + '>✓</button>' +
    '<div class="task-body">' +
      '<div class="task-t">' + esc(t.title) + '</div>' +
      (t.detail ? '<div class="task-d">' + esc(t.detail) + '</div>' : '') +
      '<div class="meta">' +
        (isCarry ? '<span class="tag carry">⚠ ' + shortDate(date) + ' 미완료</span>' : '') +
        (t.time ? '<span class="tag time">' + esc(t.time) + '</span>' : '') +
        (t.priority === 'high' ? '<span class="tag high">중요</span>' : '') +
        (st === 'blocked' ? '<span class="tag blk">막힘</span>' : '') +
        (st === 'doing' ? '<span class="tag doing">진행중 ' + prog.done + '/' + prog.total + prog.unit + '</span>' : '') +
        (!isCarry ? '<span class="tag">' + esc(repeatLabel(t)) + '</span>' : '') +
        (st === 'done' && c && c.at ? '<span class="tag ok">✓ ' + new Date(c.at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) + ' 완료</span>' : '') +
        originTags(t) +
      '</div>';

  if (hasDetail && st !== 'done') {
    h += '<div class="bar mini ' + (st === 'doing' ? 'doing' : '') + '" style="margin-top:8px"><i style="width:' + prog.pct + '%"></i></div>';
  }
  if (hasDetail) {
    h += '<button class="opener" data-act="panel" data-id="' + t.id + '" data-date="' + date + '">' +
      (open ? '▾ 접기' : '▸ 하는 방법 · 단계 열기' + ((t.steps || []).length ? ' (' + prog.done + '/' + prog.total + ')' : '')) + '</button>';
  }
  if (open) h += taskPanel(t, date, c, editable);

  h += (editable
      ? '<input class="note" data-act="note" data-id="' + t.id + '" data-date="' + date + '" value="' + esc((c && c.note) || '') + '" placeholder="메모 · 막힌 이유나 특이사항을 남기세요">'
      : ((c && c.note) ? '<div class="note">' + esc(c.note) + '</div>' : ''));

  return h + '</div></div>';
}

function taskPanel(t, date, c, editable) {
  let h = '<div class="panel">';

  if (t.guide) h += '<div class="guide"><b>📘 이렇게 하세요</b>' + esc(t.guide) + '</div>';

  if ((t.steps || []).length) {
    h += '<div style="margin-top:10px">' + t.steps.map((s, i) => {
      const on = !!(c && c.steps && c.steps[s.id]);
      return '<div class="step ' + (on ? 'on' : '') + '">' +
        '<button class="sbox" ' + (editable ? 'data-act="step" data-id="' + t.id + '" data-date="' + date + '" data-step="' + s.id + '"' : 'disabled') + '>✓</button>' +
        '<span>' + (i + 1) + '. ' + esc(s.label) + '</span></div>';
    }).join('') + '</div>';
  }

  if (t.target) {
    h += '<div class="counter"><span>진행 수량</span>' +
      '<button class="btn btn-sm btn-ghost" ' + (editable ? 'data-act="cnt" data-id="' + t.id + '" data-date="' + date + '" data-n="-1"' : 'disabled') + '>−</button>' +
      '<input class="in" type="number" min="0" ' + (editable ? 'data-act="cntset" data-id="' + t.id + '" data-date="' + date + '"' : 'readonly') + ' value="' + ((c && c.count) || 0) + '">' +
      '<button class="btn btn-sm btn-ghost" ' + (editable ? 'data-act="cnt" data-id="' + t.id + '" data-date="' + date + '" data-n="1"' : 'disabled') + '>＋</button>' +
      '<span class="muted">/ ' + t.target + esc(t.unit || '건') + '</span></div>';
  }

  if (editable) {
    const blocked = !!(c && c.blocked);
    h += '<div class="row wraprow mt14" style="gap:8px">' +
      '<button class="btn btn-sm ' + (blocked ? 'btn-danger' : 'btn-warn') + '" ' +
        'data-act="block" data-id="' + t.id + '" data-date="' + date + '">' +
        (blocked ? '✓ 막힘 해제' : '🚧 막혔어요') + '</button>' +
      (canEditTask(t) ? '<button class="btn btn-sm btn-ghost" data-act="etask" data-id="' + t.id + '">✏️ 업무 수정</button>' : '') +
    '</div>';
  }
  return h + '</div>';
}

  return '<div class="chips mb14">' + list.map(s =>
    '<button class="chip ' + (s.id === activeId ? 'on' : '') + '" data-act="pickstaff" data-id="' + s.id + '">' + esc(s.name) + '</button>'

}

function emptyStaffCard() {
  return '<div class="card"><div class="empty"><b>👥</b>먼저 학생을 등록해 주세요.</div>' +

/* ══════════════════════════════════════════════════════
   순공시간 타이머 — 계획(플래너)과 별개로 '실제로 공부한 시간'을 잰다.
   과목 칩을 누르면 시작, 다시 누르면 정지. 시작 시각만 저장하므로
   앱을 닫아도 시간이 계속 흐르고, 기기를 바꿔도 이어진다.
   ══════════════════════════════════════════════════════ */
const ST_DEFAULT = ['국어', '수학', '영어', '탐구', '기타'];
const ST_MAX_RUN = 6 * 3600;   // 한 번에 인정하는 최대 시간 — 정지를 깜빡해도 밤새 쌓이지 않는다

const stKey = sid => '__st__' + sid;
const stOf = (sid, date) => state.checks[stKey(sid) + '|' + date] || null;
const stSubjects = sid => {
  const c = state.checks['__stsubj__' + sid + '|all'];
  return (c && Array.isArray(c.list) && c.list.length) ? c.list : ST_DEFAULT;
};
const stGoalMin = sid => {
  const c = state.checks['__stgoal__' + sid + '|all'];
  return Number(c && c.mins) || 0;
};
const stRunning = (sid, date) => {
  const c = stOf(sid, date);
  return (c && c.run && c.run.subj && c.run.since) ? c.run : null;
};
/** 그날 과목별 누적 초 — 진행 중인 타이머의 경과분까지 더해서 돌려준다 */
function stSecs(sid, date) {
  const c = stOf(sid, date);
  const out = Object.assign({}, (c && c.secs) || {});
  const r = stRunning(sid, date);
  if (r) out[r.subj] = (out[r.subj] || 0) + stElapsed(r);
  return out;
}
const stElapsed = r => Math.min(ST_MAX_RUN, Math.max(0, Math.floor((now() - r.since) / 1000)));
const stTotal = (sid, date) => Object.values(stSecs(sid, date)).reduce((a, b) => a + b, 0);

function fmtHMS(s) { return Math.floor(s / 3600) + ':' + pad2(Math.floor(s % 3600 / 60)) + ':' + pad2(s % 60); }
function fmtHM(s) { return Math.floor(s / 3600) + ':' + pad2(Math.floor(s % 3600 / 60)); }
function fmtDur(s) {
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? h + '시간 ' + m + '분' : m + '분';
}

/** 진행 중인 타이머를 정지하고 누적에 반영한다 (내부용) */
function stFreeze(sid, date) {
  const c = stOf(sid, date);
  const secs = Object.assign({}, (c && c.secs) || {});
  const r = stRunning(sid, date);
  if (r) secs[r.subj] = (secs[r.subj] || 0) + stElapsed(r);
  return secs;
}
function stStart(sid, date, subj) {
  setCheck(stKey(sid), date, { secs: stFreeze(sid, date), run: { subj: subj, since: now() }, done: true });
}
function stStop(sid, date) {
  setCheck(stKey(sid), date, { secs: stFreeze(sid, date), run: null, done: true });
}

function stCard(me) {
  const date = today();
  const secs = stSecs(me.id, date);
  const total = Object.values(secs).reduce((a, b) => a + b, 0);
  const goal = stGoalMin(me.id) * 60;
  const pct = goal ? Math.min(100, Math.round(total / goal * 100)) : 0;
  const r = stRunning(me.id, date);
  const on = r ? r.subj : '';

  return '<div class="card">' +
    '<div class="between mb8"><div class="card-title">⏱ 순공시간</div>' +
      '<div class="row" style="gap:6px">' +
        (goal ? '<span class="pill ' + (pct >= 100 ? '' : 'warn') + '">목표 ' + fmtDur(goal) + ' · ' + pct + '%</span>' : '') +
        '<button class="btn btn-sm btn-ghost" data-act="stgoal">🎯</button>' +
        '<button class="btn btn-sm btn-ghost" data-act="stedit">✏️</button>' +
      '</div></div>' +
    '<div style="text-align:center;padding:4px 0 12px">' +
      '<div id="stTot" style="font-size:36px;font-weight:900;letter-spacing:-.02em;color:var(--navy);font-variant-numeric:tabular-nums">' +
        fmtHMS(total) + '</div>' +
      (on
        ? '<div class="small" style="color:var(--blue);font-weight:800">▶ ' + esc(on) + ' 공부 중 — 다시 누르면 정지</div>'
        : '<div class="small muted">과목을 눌러 시작하세요</div>') +
    '</div>' +
    (goal ? '<div class="bar mb8"><i style="width:' + pct + '%"></i></div>' : '') +
    '<div class="chips">' +
      stSubjects(me.id).map(s =>
        '<button class="chip ' + (on === s ? 'on' : '') + '" data-act="sttoggle" data-subj="' + esc(s) + '"' +
          (on === s ? ' id="stChipOn"' : '') + '>' +
          (on === s ? '⏸ ' : '▶ ') + esc(s) +
          (secs[s] ? ' ' + fmtHM(secs[s]) : '') + '</button>').join('') +
      '<button class="chip" data-act="stsubjadd">＋ 과목</button>' +
    '</div></div>';
}

/** 주간 순공 통계 — 일별 막대 + 과목별 합계 */
function stWeekCard(me, days) {
  const per = days.map(d => ({ d: d, secs: stTotal(me.id, d) }));
  const sum = per.reduce((a, x) => a + x.secs, 0);
  if (!sum) return '';
  const max = Math.max.apply(null, per.map(x => x.secs)) || 1;
  const bySubj = {};
  days.forEach(d => {
    const s = stSecs(me.id, d);
    Object.keys(s).forEach(k => { bySubj[k] = (bySubj[k] || 0) + s[k]; });
  });
  const goal = stGoalMin(me.id) * 60;
  const met = goal ? per.filter(x => x.secs >= goal).length : 0;

  return '<div class="card"><div class="between mb8">' +
      '<div class="card-title">⏱ 이번 주 순공시간</div>' +
      '<div class="pill">' + fmtDur(sum) + '</div></div>' +
    '<div class="row" style="align-items:flex-end;gap:6px;height:88px;margin-bottom:6px">' +
      per.map(x => '<div style="flex:1;text-align:center">' +
        '<div style="height:64px;display:flex;align-items:flex-end;justify-content:center">' +
          '<div title="' + fmtDur(x.secs) + '" style="width:70%;border-radius:5px 5px 0 0;background:' +
            (x.d === today() ? 'var(--navy)' : 'var(--blue)') + ';opacity:' + (x.secs ? 1 : .18) +
            ';height:' + Math.max(3, Math.round(x.secs / max * 64)) + 'px"></div></div>' +
        '<div class="small muted" style="margin-top:3px">' + DOW[dowOf(x.d)] + '</div></div>').join('') +
    '</div>' +
    '<div class="small muted" style="text-align:center;margin-bottom:10px">하루 평균 ' +
      fmtDur(Math.round(sum / 7)) + (goal ? ' · 목표 달성 ' + met + '일' : '') + '</div>' +
    '<hr class="sep">' +
    Object.keys(bySubj).sort((a, b) => bySubj[b] - bySubj[a]).map(k =>
      '<div class="between small" style="padding:3px 0"><span>' + esc(k) + '</span>' +
      '<span class="pill">' + fmtDur(bySubj[k]) + '</span></div>').join('') +
    '</div>';
}

/** 과목별 시간 직접 수정 — 정지를 깜빡했거나 앱 없이 공부한 날을 보정한다 */
function stEditModal(sid) {
  const date = today();
  const secs = stSecs(sid, date);
  modal('⏱ 오늘 공부시간 수정',
    '<div class="hint mb14">분 단위로 고칠 수 있습니다. 타이머 정지를 깜빡했거나, 앱 없이 공부한 시간을 넣을 때 쓰세요.</div>' +
    stSubjects(sid).map(s =>
      '<div class="between mb8"><span class="small">' + esc(s) + '</span>' +
      '<input class="in" type="number" min="0" style="max-width:120px" data-stedit="' + esc(s) + '" value="' +
        Math.round((secs[s] || 0) / 60) + '"><span class="small muted">분</span></div>').join(''),

}

/* ══════════════════════════════════════════════════════
   인강 플래너
   원본 앱(Flask+SQLite)의 핵심 설계를 그대로 옮겼다.
   · 강좌(courses) ↔ 배정(plan)을 분리한다 — 같은 강좌를 여러 학생에게
     다른 일정으로 배정해도 강의 데이터가 중복되지 않는다.
   · 강의는 3단계 상태를 갖는다: 미배정 / 배정됨(미완료) / 완료
   원본에 없던 두 가지를 더했다: 목표일 역산, 밀림 3일 이상 강조.
   ══════════════════════════════════════════════════════ */
const ING_PLATFORMS = ['엘리하이', '엠베스트', '메가스터디', '이투스', '대성마이맥', '기타'];
const ING_LATE_WARN = 3;   // 이 일수 이상 밀리면 강조한다

const ingKey = sid => '__ing__' + sid;          // 강좌·강의 목록
const ingPlanKey = sid => '__ingp__' + sid;     // 날짜별 배정
const ingCourses = sid => ((state.checks[ingKey(sid) + '|all'] || {}).courses) || [];
const ingPlan = (sid, date) => ((state.checks[ingPlanKey(sid) + '|' + date] || {}).items) || [];
const ingSet = sid => Object.assign({ days: [1, 2, 3, 4, 5], perDay: 2 },
  (state.checks['__ingset__' + sid + '|all'] || {}).set || {});

function ingSaveCourses(sid, courses) { setCheck(ingKey(sid), 'all', { courses: courses, done: true }); }
function ingSavePlan(sid, date, items) { setCheck(ingPlanKey(sid), date, { items: items, done: true }); }
const ingPlanDates = sid => {
  const pre = ingPlanKey(sid) + '|';
  return Object.keys(state.checks).filter(k => k.startsWith(pre)).map(k => k.slice(pre.length)).sort();
};

/** 배정 현황 — 'courseId|seq' → {date, done} */
function ingAssigned(sid) {
  const map = {};
  ingPlanDates(sid).forEach(d => {
    ingPlan(sid, d).forEach(it => { map[it.cid + '|' + it.seq] = { date: d, done: !!it.done }; });
  });
  return map;
}
function ingLec(sid, cid, seq) {
  const c = ingCourses(sid).find(x => x.id === cid);
  if (!c) return null;
  const l = (c.lectures || []).find(x => Number(x.seq) === Number(seq));
  return l ? { course: c, lec: l } : null;
}
function ingStats(sid, c, asg) {
  asg = asg || ingAssigned(sid);
  const lecs = c.lectures || [];
  let assigned = 0, done = 0;
  lecs.forEach(l => {
    const a = asg[c.id + '|' + l.seq];
    if (a) { assigned++; if (a.done) done++; }
  });
  return { total: lecs.length, assigned: assigned, done: done,
    unassigned: lecs.length - assigned, pct: lecs.length ? Math.round(done / lecs.length * 100) : 0 };
}

/** 커리큘럼 텍스트 파서 — 사이트별이 아니라 패턴 기반이라 개편에 안 깨진다.
 *  "1강 다항식의 덧셈 52분" / "01. 제목 (52:30)" 같은 형태를 모두 받는다. */
function ingParse(text) {
  const out = [];
  String(text || '').split('\n').forEach(line => {
    const s = line.trim();
    if (!s) return;
    const m = s.match(/^(\d{1,3})\s*(?:강|회|차|교시)?\s*[.)\]:-]?\s*(.*)$/);
    if (!m) return;
    let rest = (m[2] || '').trim(), min = null;
    const t = rest.match(/[\s(\[]*(\d{1,3})\s*분(?:\s*\d{1,2}\s*초)?[)\]]*\s*$/)
           || rest.match(/[\s(\[]*(\d{1,3}):(\d{2})[)\]]*\s*$/);
    if (t) { min = Number(t[1]); rest = rest.slice(0, t.index).trim(); }
    rest = rest.replace(/[\s\-–—·|,]+$/, '').trim();
    out.push({ seq: Number(m[1]), title: rest || (m[1] + '강'), min: min });
  });
  return out;
}

/** count개를 start부터 지정 요일에 하루 perDay개씩 배정한 날짜 목록 (원본 assign_dates 이식) */
function ingAssignDates(count, start, weekdays, perDay) {
  const out = [];
  let d = start, guard = 0;
  perDay = Math.max(1, perDay);
  const wd = (weekdays && weekdays.length) ? weekdays : [0, 1, 2, 3, 4, 5, 6];
  while (out.length < count && guard < 1100) {
    if (wd.includes(dowOf(d))) {
      const n = Math.min(perDay, count - out.length);
      for (let i = 0; i < n; i++) out.push(d);
    }
    d = addDays(d, 1); guard++;
  }
  return out;
}
/** 목표일 역산 — 원본에 없던 기능. "8/30까지 끝내려면 하루 몇 강?" */
function ingPerDayFor(count, start, end, weekdays) {
  const wd = (weekdays && weekdays.length) ? weekdays : [0, 1, 2, 3, 4, 5, 6];
  let days = 0, d = start, guard = 0;
  while (d <= end && guard < 1100) { if (wd.includes(dowOf(d))) days++; d = addDays(d, 1); guard++; }
  return days ? Math.ceil(count / days) : count;
}

function ingToggle(sid, date, cid, seq) {
  const items = ingPlan(sid, date).map(x =>
    (x.cid === cid && Number(x.seq) === Number(seq)) ? Object.assign({}, x, { done: !x.done }) : x);
  ingSavePlan(sid, date, items);
}

/** 오늘 이전 미완료를 전부 오늘로 — 따라잡기용 */
function ingCatchup(sid) {
  const t = today(), moved = [];
  ingPlanDates(sid).forEach(d => {
    if (d >= t) return;
    const items = ingPlan(sid, d);
    const late = items.filter(x => !x.done);
    if (!late.length) return;
    moved.push.apply(moved, late);
    ingSavePlan(sid, d, items.filter(x => x.done));
  });
  if (moved.length) ingSavePlan(sid, t, ingPlan(sid, t).concat(moved));
  return moved.length;
}
/** 기준일 이후 미완료를 통째로 ±N일 이동 — 시험기간용 */
function ingShift(sid, from, n) {
  const buckets = {};
  let cnt = 0;
  ingPlanDates(sid).forEach(d => {
    if (d < from) return;
    const items = ingPlan(sid, d);
    const move = items.filter(x => !x.done);
    if (!move.length) return;
    ingSavePlan(sid, d, items.filter(x => x.done));
    const nd = addDays(d, n);
    (buckets[nd] = buckets[nd] || []).push.apply(buckets[nd], move);
    cnt += move.length;
  });
  Object.keys(buckets).forEach(d => ingSavePlan(sid, d, ingPlan(sid, d).concat(buckets[d])));
  return cnt;
}

/** 오늘 화면용 — 밀린 것과 오늘 것 */
function ingTodayItems(sid) {
  const t = today(), overdue = [];
  ingPlanDates(sid).forEach(d => {
    if (d >= t) return;
    ingPlan(sid, d).forEach(x => { if (!x.done) overdue.push(Object.assign({}, x, { date: d })); });
  });
  overdue.sort((a, b) => a.date.localeCompare(b.date));
  return { overdue: overdue, todays: ingPlan(sid, t).map(x => Object.assign({}, x, { date: t })) };
}

function ingRow(sid, it, editable) {
  const f = ingLec(sid, it.cid, it.seq);
  const late = it.date < today() ? Math.round((parseYmd(today()) - parseYmd(it.date)) / 86400000) : 0;
  return '<div class="task ' + (it.done ? 'done' : '') + '">' +
    '<button class="box" ' + (editable
      ? 'data-act="ingcheck" data-sid="' + sid + '" data-date="' + it.date + '" data-cid="' + esc(it.cid) + '" data-seq="' + it.seq + '"'
      : 'disabled') + '>✓</button>' +
    '<div class="task-body"><div class="task-t">' +
      (f ? esc(f.course.name) + ' ' + it.seq + '강' : '(삭제된 강좌) ' + it.seq + '강') + '</div>' +
      (f && f.lec.title ? '<div class="task-d">' + esc(f.lec.title) + '</div>' : '') +
      '<div class="meta">' +
        (f && f.lec.min ? '<span class="tag time">' + f.lec.min + '분</span>' : '') +
        (f && f.course.platform ? '<span class="tag">' + esc(f.course.platform) + '</span>' : '') +
        (late ? '<span class="tag ' + (late >= ING_LATE_WARN ? 'carry' : '') + '">' +
          shortDate(it.date) + ' · ' + late + '일 밀림</span>' : '') +
      '</div></div></div>';
}

/** 오늘 화면에 붙는 인강 카드 */
function ingTodayCard(me, editable) {
  const { overdue, todays } = ingTodayItems(me.id);
  if (!overdue.length && !todays.length) return '';
  const bad = overdue.filter(x => Math.round((parseYmd(today()) - parseYmd(x.date)) / 86400000) >= ING_LATE_WARN).length;
  let h = '';
  if (overdue.length) {
    h += '<div class="card alert"><div class="between mb8">' +
      '<div class="card-title" style="color:var(--coral)">🎬 먼저 듣자! — 밀린 인강 ' + overdue.length + '강</div>' +
      (bad ? '<span class="pill bad">' + ING_LATE_WARN + '일 이상 ' + bad + '강</span>' : '') + '</div>' +
      overdue.map(x => ingRow(me.id, x, editable)).join('') + '</div>';
  }
  if (todays.length) {
    const done = todays.filter(x => x.done).length;
    h += '<div class="card"><div class="between mb8">' +
      '<div class="card-title">🎬 오늘 인강</div>' +
      '<div class="pill' + (done === todays.length ? '' : ' warn') + '">' + done + ' / ' + todays.length + '강</div></div>' +
      todays.map(x => ingRow(me.id, x, editable)).join('') + '</div>';
  }
  return h;
}

/* ── 인강 탭 ── */
function viewIngang() {
  const me = currentStaff();
  if (!me) return emptyStaffCard();

  const asg = ingAssigned(me.id);
  const set = ingSet(me.id);

  if (!session.isStaffLink) h += staffSwitcher(me.id);

        ? '<div class="row wraprow" style="gap:6px">' + up.map(x =>

            shortDate(x.d) + '(' + DOW[dowOf(x.d)] + ') ' + x.done + '/' + x.n + '</button>').join('') + '</div>' +
          '<div class="hint" style="margin-top:10px">날짜를 누르면 그날 할 일 화면으로 갑니다.</div>'
        : '<div class="small muted">배정된 강의가 앞으로 2주 안에 없습니다. ' +
          '배정 요일(' + (set.days.length ? set.days.map(d => DOW[d]).join('·') : '미설정') + ')을 확인해 보세요.</div>') +

  courses.forEach(c => {

      '<div class="small muted">' + esc(c.platform || '') + ' · 총 ' + s.total + '강</div></div>' +
      '<div class="pill' + (s.pct >= 100 ? '' : s.pct >= 50 ? ' warn' : ' bad') + '">' + s.pct + '%</div></div>' +
      '<div class="bar mb8"><i style="width:' + s.pct + '%"></i></div>' +
      '<div class="between small"><span class="muted">완료 ' + s.done + ' · 배정 ' + s.assigned +
        ' · <b>미배정 ' + s.unassigned + '</b></span>' +
      (admin
        ? '<span class="row" style="gap:6px">' +
            (s.unassigned ? '<button class="btn btn-sm btn-primary" data-act="ingassign" data-cid="' + esc(c.id) + '">배정</button>' : '') +
            '<button class="btn btn-sm btn-ghost" data-act="ingdel" data-cid="' + esc(c.id) + '">삭제</button></span>'
        : '') +
      '</div></div>';

/* ══════════════════════════════════════════════════════
   타임블록 — "몇 시에 뭘 할지"를 시간 칸에 배치한다.
   할 일 목록(체크리스트)과 다른 축이라 따로 둔다.
   블록을 누르면 그 과목 타이머가 바로 시작돼 계획과 실측이 이어진다.
   ══════════════════════════════════════════════════════ */
const tbKey = sid => '__tb__' + sid;
const tbOf = (sid, date) => (((state.checks[tbKey(sid) + '|' + date] || {}).blocks) || [])
  .slice().sort((a, b) => String(a.s).localeCompare(String(b.s)));
const tbSave = (sid, date, blocks) => setCheck(tbKey(sid), date, { blocks: blocks, done: true });

function tbCard(me, editable) {
  const blocks = tbOf(me.id, cursor);
  const isToday = cursor === today();
  const hm = nowHM();
  let h = '<div class="card"><div class="between mb8">' +
    '<div class="card-title">🗓 시간표</div>' +
    (editable ? '<button class="btn btn-sm btn-ghost" data-act="tbadd">＋ 시간 추가</button>' : '') + '</div>';

  if (!blocks.length) {
    h += '<div class="small muted">아직 짜둔 시간이 없습니다.' +
      (editable ? ' 몇 시에 무엇을 할지 넣어보세요.' : '') + '</div></div>';
    return h;
  }
  h += blocks.map((b, i) => {
    const nowOn = isToday && b.s <= hm && hm < b.e;
    return '<div class="between" style="padding:7px 0;border-bottom:1px solid var(--light-gray)' +
      (nowOn ? ';background:#EAF6FC;border-radius:8px;padding-left:8px;padding-right:8px' : '') + '">' +
      '<span class="row" style="gap:10px">' +
        '<b class="small" style="font-variant-numeric:tabular-nums;color:var(--navy)">' + esc(b.s) + '~' + esc(b.e) + '</b>' +
        '<span>' + esc(b.label) + (nowOn ? ' <span class="pill">지금</span>' : '') + '</span></span>' +
      (editable
        ? '<span class="row" style="gap:6px">' +
            (b.subj ? '<button class="btn btn-sm btn-navy" data-act="tbstart" data-subj="' + esc(b.subj) + '">▶ 시작</button>' : '') +
            '<button class="btn btn-sm btn-ghost" data-act="tbdel" data-i="' + i + '">×</button></span>'
        : '') +
      '</div>';
  }).join('');
  const mins = blocks.reduce((a, b) => {
    const p = s => Number(s.slice(0, 2)) * 60 + Number(s.slice(3, 5));
    return a + Math.max(0, p(b.e) - p(b.s));
  }, 0);
  h += '<div class="small muted" style="margin-top:10px">계획 ' + fmtDur(mins * 60) +
    (isToday ? ' · 실제 ' + fmtDur(stTotal(me.id, cursor)) : '') + '</div></div>';
  return h;
}
