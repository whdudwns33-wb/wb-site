/* ══════════════════════════════════════════════════════
   회독 — 같은 교재를 몇 번 돌렸는지. 목표 회독수 대비 진행을 본다.
   ══════════════════════════════════════════════════════ */
const rdKey = sid => '__rd__' + sid;
const rdItems = sid => ((state.checks[rdKey(sid) + '|all'] || {}).items) || [];
const rdSave = (sid, items) => setCheck(rdKey(sid), 'all', { items: items, done: true });

/* ══════════════════════════════════════════════════════
   오답노트 — 틀린 문제를 기록하고 3일·7일 뒤에 다시 띄운다.
   등록일에 저장하고, 복습 횟수(rv)로 다음 복습일을 정한다.
   ══════════════════════════════════════════════════════ */
const WN_REVIEW = [3, 7];   // 등록 후 며칠 뒤에 다시 볼지
const wnKey = sid => '__wn__' + sid;
const wnOf = (sid, date) => ((state.checks[wnKey(sid) + '|' + date] || {}).items) || [];
const wnDates = sid => {
  const pre = wnKey(sid) + '|';
  return Object.keys(state.checks).filter(k => k.startsWith(pre)).map(k => k.slice(pre.length)).sort();
};
function wnAll(sid) {
  const out = [];
  wnDates(sid).forEach(d => wnOf(sid, d).forEach(x => out.push(Object.assign({}, x, { date: d }))));
  return out.sort((a, b) => b.date.localeCompare(a.date));
}
/** 오늘 다시 볼 오답 — 복습 회차별로 예정일이 지났고 아직 안 본 것 */
function wnDue(sid) {
  const t = today();
  return wnAll(sid).filter(x => {
    if (x.fixed) return false;
    const rv = x.rv || 0;
    return rv < WN_REVIEW.length && addDays(x.date, WN_REVIEW[rv]) <= t;
  });
}
function wnPatch(sid, date, id, patch) {
  wnOf(sid, date).length && setCheck(wnKey(sid), date, {
    items: wnOf(sid, date).map(x => x.id === id ? Object.assign({}, x, patch) : x), done: true
  });
}

function wnRow(sid, x, editable) {
  const rv = x.rv || 0;
  return '<div class="task ' + (x.fixed ? 'done' : '') + '">' +
    '<button class="box" ' + (editable
      ? 'data-act="wnfix" data-date="' + x.date + '" data-id="' + esc(x.id) + '"' : 'disabled') + '>✓</button>' +
    '<div class="task-body"><div class="task-t">' + esc(x.note) + '</div>' +
      '<div class="meta">' +
        (x.subj ? '<span class="tag">' + esc(x.subj) + '</span>' : '') +
        (x.src ? '<span class="tag">' + esc(x.src) + '</span>' : '') +
        '<span class="tag time">' + shortDate(x.date) + '</span>' +
        (x.fixed ? '<span class="tag ok">해결</span>'
          : '<span class="tag ' + (rv ? 'doing' : '') + '">복습 ' + rv + '/' + WN_REVIEW.length + '</span>') +
      '</div>' +
      (editable && !x.fixed && (x.rv || 0) < WN_REVIEW.length
        ? '<button class="btn btn-sm btn-ghost mt8" data-act="wnrv" data-date="' + x.date + '" data-id="' + esc(x.id) + '">다시 봤어요</button>'
        : '') +
    '</div></div>';
}

/* ── 학습 탭 (회독 · 오답노트) ── */
function viewStudy() {
  const me = currentStaff();
  if (!me) return emptyStaffCard();
  const editable = session.isStaffLink || session.isAdmin;
  let h = '';
  if (!session.isStaffLink) h += staffSwitcher(me.id);

  // 오늘 복습할 오답 먼저

      due.map(x => wnRow(me.id, x, editable)).join('') + '</div>';
  }

  // 회독
  const items = rdItems(me.id);
  h += '<div class="card"><div class="between mb8"><div class="card-title">📚 회독</div>' +
    (editable ? '<button class="btn btn-sm btn-ghost" data-act="rdadd">＋ 교재</button>' : '') + '</div>' +
    (items.length
      ? items.map((it, i) => {
          const pct = it.target ? Math.min(100, Math.round(it.done / it.target * 100)) : 0;
          return '<div style="padding:7px 0">' +
            '<div class="between mb8"><span>' + esc(it.name) + '</span>' +
            '<span class="row" style="gap:6px"><span class="pill' + (pct >= 100 ? '' : ' warn') + '">' +
              it.done + ' / ' + it.target + '회독</span>' +
            (editable
              ? '<button class="btn btn-sm btn-primary" data-act="rdup" data-i="' + i + '">＋1</button>' +
                '<button class="btn btn-sm btn-ghost" data-act="rddel" data-i="' + i + '">×</button>'
              : '') + '</span></div>' +
            '<div class="bar mini"><i style="width:' + pct + '%"></i></div></div>';
        }).join('')
      : '<div class="small muted">등록된 교재가 없습니다. 몇 회독을 목표로 할지 정해두면 진행이 보입니다.</div>') +
    '</div>';

  // 오답노트 전체
  const all = wnAll(me.id);
  const open = all.filter(x => !x.fixed);
  h += '<div class="card"><div class="between mb8"><div class="card-title">✏️ 오답노트</div>' +
    '<span class="row" style="gap:6px"><span class="pill' + (open.length ? ' warn' : '') + '">미해결 ' + open.length + '</span>' +
    (editable ? '<button class="btn btn-sm btn-ghost" data-act="wnadd">＋ 오답</button>' : '') + '</span></div>' +
    (all.length
      ? all.slice(0, 30).map(x => wnRow(me.id, x, editable)).join('')
      : '<div class="small muted">틀린 문제를 한 줄로 남겨두면 3일·7일 뒤에 다시 띄워줍니다.</div>') +
    '</div>';

  return h;
}

function viewWeek() {
  const me = currentStaff();
  if (!me) return emptyStaffCard();
  const mon = mondayOf(cursor);
  const days = Array.from({ length: 7 }, (_, i) => addDays(mon, i));
  const rows = {};
  days.forEach(d => tasksFor(me.id, d).forEach(t => { rows[t.id] = t; }));
  const list = Object.values(rows);
  const wp = weekProgress(me.id, cursor);
  const editable = session.isStaffLink || session.isAdmin;

  let h = '';
  if (!session.isStaffLink) h += staffSwitcher(me.id);

  h += '<div class="datenav">' +
    '<button class="navbtn" data-act="week" data-n="-1">‹</button>' +
    '<div class="d">' + shortDate(mon) + ' ~ ' + shortDate(days[6]) + '</div>' +
    '<button class="navbtn" data-act="week" data-n="1">›</button></div>';

  h += '<div class="card"><div class="between mb8">' +
    '<div class="card-title">이번 주 달성률</div>' +
    '<div class="pill">' + wp.done + ' / ' + wp.total + '건 · ' + wp.pct + '%</div></div>' +
    '<div class="bar"><i style="width:' + wp.pct + '%"></i></div></div>';

  h += stWeekCard(me, days);

  if (!list.length) return h + '<div class="card"><div class="empty"><b>📋</b>이 주에 지시된 업무가 없습니다.</div></div>';

  h += '<div class="card weekwrap"><table class="week"><thead><tr><th class="n">업무</th>' +
    days.map(d => '<th class="' + (d === today() ? 'today' : '') + '">' + DOW[dowOf(d)] + '<br>' + parseYmd(d).getDate() + '</th>').join('') +
    '</tr></thead><tbody>' +
    list.map(t => '<tr><td class="n">' + esc(t.title) + '</td>' +
      days.map(d => {
        if (!occursOn(t, d)) return '<td><span class="dot none">·</span></td>';
        const st = statusOf(t, d);
        const cls = st === 'done' ? 'done' : st === 'blocked' ? 'blocked' : st === 'doing' ? 'doing' : (d < today() ? 'miss' : '');
        return '<td><button class="dot ' + cls + '" ' +
          (editable ? 'data-act="toggle" data-id="' + t.id + '" data-date="' + d + '"' : 'disabled') + '>✓</button></td>';
      }).join('') + '</tr>').join('') +
    '</tbody></table></div>' +
    '<div class="hint">🔵 완료 · 🟠 진행중 · 🔴 막힘 · 🩷 지난 날짜 미완료. 칸을 눌러 바로 체크할 수 있습니다.</div>';
  return h;
}

              '<button class="btn btn-sm btn-ghost" data-act="cnt" data-id="' + g.id + '" data-date="' + ym + '" data-n="-1">－</button>'
            : '<button class="btn btn-sm ' + (done ? 'btn-ghost' : 'btn-primary') + '" data-act="toggle" data-id="' + g.id + '" data-date="' + ym + '">' + (done ? '취소' : '완료') + '</button>') +
          (canEditTask(g) ? '<button class="btn btn-sm btn-danger" data-act="gdel" data-id="' + g.id + '">삭제</button>' : '')
        : '') +
      '</div>';
  }).join('');
  if (editable) {
    h += '<hr class="sep">' +
      '<div class="field"><input class="in" id="gTitle" placeholder="목표 (예: 책 2권 읽기)"></div>' +
      '<div class="row">' +
        '<input class="in" id="gTarget" type="number" inputmode="numeric" placeholder="목표 수량 (선택)">' +
        '<input class="in" id="gUnit" placeholder="단위 (권·회·쪽)" style="max-width:110px">' +
        '<button class="btn btn-primary" data-act="gadd">추가</button>' +
      '</div>' +
      '<div class="hint">수량을 넣으면 ＋1 버튼으로 세면서 채웁니다. 다 채우면 자동 완료.</div>';
  }
  h += '</div>';

  /* 이번 달 달성률 */
  h += '<div class="card"><div class="between mb8">' +
    '<div class="card-title">이번 달 달성률</div>' +
    '<div class="pill">' + mp.done + ' / ' + mp.total + '건 · ' + mp.pct + '%</div></div>' +
    '<div class="bar"><i style="width:' + mp.pct + '%"></i></div></div>';

  /* 달력 */
  const firstDow = (dowOf(dates[0]) + 6) % 7;   // 월요일 시작
  let cells = [];
  for (let i = 0; i < firstDow; i++) cells.push('<td></td>');
  dates.forEach(d => {
    const p = progress(me.id, d);
    let cls = '', mark = '';
    if (p.total > 0) {
      if (p.done >= p.total) { cls = 'done'; mark = p.done; }
      else if (d < today()) { cls = 'miss'; mark = p.done + '/' + p.total; }
      else if (p.done > 0) { cls = 'doing'; mark = p.done + '/' + p.total; }
      else { cls = 'has'; mark = p.total; }
    }
    cells.push('<td><button class="calday ' + cls + (d === today() ? ' today' : '') + '" data-act="daypick" data-date="' + d + '">' +
      '<b>' + Number(d.slice(8)) + '</b>' + (mark !== '' ? '<small>' + mark + '</small>' : '') + '</button></td>');
  });
  while (cells.length % 7) cells.push('<td></td>');
  const rows = [];
  for (let i = 0; i < cells.length; i += 7) rows.push('<tr>' + cells.slice(i, i + 7).join('') + '</tr>');

  h += '<div class="card"><div class="card-title mb8">달력</div>' +
    '<table class="cal"><thead><tr>' + ['월','화','수','목','금','토','일'].map(x => '<th>' + x + '</th>').join('') + '</tr></thead>' +
    '<tbody>' + rows.join('') + '</tbody></table>' +
    '<div class="hint">날짜를 누르면 그날의 할 일로 이동합니다. 🔵 전부 완료 · 🟠 진행중 · 🩷 미완료 · 회색 숫자는 할 일 개수.</div></div>';

  return h;
}

/* ── 학생 현황 ── */
function viewBoard() {
  const list = teamStaff();
  const mine = owners();
  if (!list.length && !mine.length) return emptyStaffCard();

  let h = '<div class="datenav">' +
    '<button class="navbtn" data-act="day" data-n="-1">‹</button>' +
    '<div class="d">' + label(cursor) + (relLabel(cursor) ? '<em>' + relLabel(cursor) + '</em>' : '') + '</div>' +
    '<button class="navbtn" data-act="day" data-n="1">›</button></div>';

  // 막힘 먼저
  const blocked = [];
  liveStaff().forEach(s => tasksFor(s.id, cursor).forEach(t => {
    if (statusOf(t, cursor) === 'blocked') blocked.push({ s: s, t: t, c: getCheck(t.id, cursor) });
  }));
  if (blocked.length) {
    h += '<div class="card alert"><div class="card-title" style="color:var(--coral)">🚧 막힘 ' + blocked.length + '건 — 원장님 확인 필요</div>' +
      blocked.map(x => '<div class="small mt14"><b>' + esc(x.s.name) + '</b> · ' + esc(x.t.title) +
        (x.c && x.c.note ? '<br><span class="muted">“' + esc(x.c.note) + '”</span>' : '<br><span class="muted">사유 미기재</span>') +
        '</div>').join('') + '</div>';
  }

  // 학생이 스스로 추가한 업무 — 지시서를 현실에 맞게 고치는 단서가 된다
  const added = staffAdded(cursor);
  if (added.length) {
    const byStaff = {};
    added.forEach(x => {
      const n = (staffById(x.t.staffId) || {}).name || '?';
      (byStaff[n] = byStaff[n] || []).push(x);
    });
    h += '<div class="card">' +
      '<div class="between mb8"><div class="card-title">＋ 학생이 추가한 업무</div>' +
      '<div class="pill">이번 주 ' + added.length + '건</div></div>' +
      '<div class="card-sub mb14">지시하지 않았는데 실제로 하고 있는 일입니다. 반복되면 정식 지시로 올리세요.</div>' +
      Object.keys(byStaff).map(n =>
        '<div class="small" style="font-weight:700;margin-top:10px">' + esc(n) + ' · ' + byStaff[n].length + '건</div>' +
        byStaff[n].map(x => {
          const st = statusOf(x.t, x.date);
          return '<div class="between small" style="padding:3px 0">' +
            '<span class="muted">· ' + esc(x.t.title) + ' <span style="opacity:.7">(' + shortDate(x.date) + ')</span></span>' +
            (st === 'done' ? '<span class="pill">완료</span>'
              : st === 'blocked' ? '<span class="pill bad">막힘</span>'
              : st === 'doing' ? '<span class="pill warn">진행중</span>' : '<span class="pill warn">미완료</span>') +
          '</div>';
        }).join('')
      ).join('') + '</div>';
  }

  // 순공시간 — 계획 이행률과 별개로 '실제로 얼마나 앉아 있었나'를 본다
  {
    const rows = list.map(s => ({ s: s, secs: stTotal(s.id, cursor), run: stRunning(s.id, cursor) }))
      .filter(x => x.secs || x.run)
      .sort((a, b) => b.secs - a.secs);
    if (rows.length) {
      const sum = rows.reduce((a, x) => a + x.secs, 0);
      h += '<div class="card"><div class="between mb8">' +
        '<div class="card-title">⏱ 순공시간</div>' +
        '<div class="pill">' + rows.length + '명 · 합계 ' + fmtDur(sum) + '</div></div>' +
        rows.map(x => {
          const goal = stGoalMin(x.s.id) * 60;
          const p = goal ? Math.min(100, Math.round(x.secs / goal * 100)) : 0;
          return '<div class="between small" style="padding:4px 0">' +
            '<span>' + esc(x.s.name) +
              (x.run ? ' <span class="pill">▶ ' + esc(x.run.subj) + '</span>' : '') + '</span>' +
            '<span class="row" style="gap:6px">' +
              (goal ? '<span class="pill ' + (p >= 100 ? '' : p >= 60 ? 'warn' : 'bad') + '">' + p + '%</span>' : '') +
              '<b>' + fmtDur(x.secs) + '</b></span></div>';
        }).join('') +
        '<div class="hint" style="margin-top:10px">계획 이행률과 함께 보세요 — 시간은 많은데 이행률이 낮으면 계획이 과한 것입니다.</div>' +
        '</div>';
    }
  }

  const all = list.reduce((a, s) => { const p = progress(s.id, cursor); a.done += p.done; a.total += p.total; return a; }, { done: 0, total: 0 });
  const pct = all.total ? Math.round(all.done / all.total * 100) : 0;
  h += '<div class="card"><div class="prog">' +
    '<div class="ring" style="--p:' + pct + '"><b>' + pct + '%</b></div>' +
    '<div style="flex:1"><div class="card-title">전체 수행률</div>' +
    '<div class="card-sub mb8">학생 ' + list.length + '명 · 지시 ' + all.total + '건 중 ' + all.done + '건 완료</div>' +
    '<div class="bar"><i style="width:' + pct + '%"></i></div></div></div>' +
    '<hr class="sep"><button class="btn btn-navy btn-block" data-act="brief">📊 오늘 마감 브리핑 만들기</button></div>';

  if (mine.length) {
    h += '<div class="sect">내 업무 — 대표</div>' + mine.map(s => staffCard(s)).join('');
    if (list.length) h += '<div class="sect">학생</div>';
  }
  h += list.map(s => staffCard(s)).join('');

  return h;
}

function staffCard(s) {
  const p = progress(s.id, cursor);
  const w = weekProgress(s.id, cursor);
  const st = streak(s.id);
  const rows = tasksFor(s.id, cursor).map(t => ({ t: t, st: statusOf(t, cursor), c: getCheck(t.id, cursor) }));
  const pend = rows.filter(x => x.st !== 'done');
  const notes = rows.filter(x => x.c && x.c.note);

  return '<div class="card">' +
    '<div class="staffcard mb14">' +
    '<div class="ava">' + esc(initials(s.name)) + '</div>' +
    '<div style="flex:1;min-width:0">' +
      '<div class="between"><div class="card-title">' + esc(s.name) + '</div>' +
        '<div class="pill">' + p.done + '/' + p.total + '</div></div>' +
      '<div class="bar" style="margin:6px 0 5px"><i style="width:' + p.pct + '%"></i></div>' +
      '<div class="small muted">이번 주 ' + w.pct + '% · 연속 달성 ' + st + '일</div>' +
    '</div></div>' +
    (pend.length
    ? pend.map(x => {
        const prog = taskProgress(x.t, x.c);
        const badge = x.st === 'blocked' ? '<span class="pill bad">막힘</span>'
                    : x.st === 'doing' ? '<span class="pill warn">' + prog.done + '/' + prog.total + prog.unit + '</span>'
                    : '<span class="pill">미착수</span>';
        return '<div class="between small" style="padding:4px 0"><span>· ' + esc(x.t.title) +
          (x.t.time ? ' <span class="muted">(' + esc(x.t.time) + ')</span>' : '') + '</span>' + badge + '</div>';
      }).join('')
    : '<div class="small" style="color:var(--green);font-weight:700">✓ 지시 업무 모두 완료</div>') +
    (notes.length
    ? '<hr class="sep">' + notes.map(x =>
        '<div class="small mb8"><b>' + esc(x.t.title) + '</b><br><span class="muted">“' + esc(x.c.note) + '”</span></div>').join('')
    : '') +
    '<hr class="sep">' +
    '<div class="row wraprow" style="gap:8px">' +
    (session.isAdmin ? '<button class="btn btn-sm btn-ghost" data-act="openstaff" data-id="' + s.id + '">할 일 보기</button>' : '') +
    (session.isAdmin ? '<button class="btn btn-sm btn-ghost" data-act="copylink" data-id="' + s.id + '">개인 링크 복사</button>' : '') +
    '<button class="btn btn-sm btn-ghost" data-act="orderText" data-id="' + s.id + '">지시서 문구</button>' +
    '</div></div>';
}

let modalReturnFocus = null;
let modalTitleSequence = 0;
const MODAL_FOCUSABLE_SELECTOR = 'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';

function modalFocusableElements(box) {
  if (!box) return [];
  return Array.from(box.querySelectorAll(MODAL_FOCUSABLE_SELECTOR)).filter(node =>
    node.getAttribute('aria-hidden') !== 'true' && !node.hasAttribute('hidden'));
}

function handleModalKeydown(event) {
  const box = $('#modalHost .modal-box');
  if (!box) return;
  if (event.key === 'Escape') {
    event.preventDefault();
    closeModal();
    return;
  }
  if (event.key !== 'Tab') return;
  const focusable = modalFocusableElements(box);
  if (!focusable.length) {
    event.preventDefault();
    box.focus();
    return;
  }
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  if (!box.contains(document.activeElement)) {
    event.preventDefault();
    (event.shiftKey ? last : first).focus();
  } else if (event.shiftKey && document.activeElement === first) {
    event.preventDefault();
    last.focus();
  } else if (!event.shiftKey && document.activeElement === last) {
    event.preventDefault();
    first.focus();
  }
}

function modal(title, bodyHtml, footHtml) {
  const host = $('#modalHost');
  if (!host.innerHTML) modalReturnFocus = document.activeElement;
  const titleId = 'wb-modal-title-' + (++modalTitleSequence);
  host.innerHTML =
    '<div class="modal" data-act="closemodal"><div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="' + titleId + '" tabindex="-1">' +
      '<div class="between mb14"><div class="card-title" id="' + titleId + '">' + esc(title) + '</div>' +
      '<button class="btn btn-sm btn-ghost" data-act="closemodal" aria-label="대화상자 닫기">닫기</button></div>' +
      bodyHtml + (footHtml || '') +
    '</div></div>';
  document.removeEventListener('keydown', handleModalKeydown);
  document.addEventListener('keydown', handleModalKeydown);
  requestAnimationFrame(() => {
    const box = $('#modalHost .modal-box');
    if (!box) return;
    const initial = box.querySelector('[autofocus]') || modalFocusableElements(box)[0] || box;
    initial.focus();
  });
}

function closeModal() {
  const host = $('#modalHost');
  document.removeEventListener('keydown', handleModalKeydown);
  host.innerHTML = '';
  const returnTo = modalReturnFocus;
  modalReturnFocus = null;
  if (returnTo && document.contains(returnTo) && typeof returnTo.focus === 'function') returnTo.focus();
}

function b64(str) { return btoa(unescape(encodeURIComponent(str))).replace(/\+/g, '-').replace(/\//g, '_'); }

/** 개인 링크. 예전에는 여기에 전체 접근 비밀키를 담았는데,
 *  링크 하나가 새면 전체가 열리는 구조라 학생별 토큰으로 바꿨다. */
function staffLink(id) {
  const code = linkCodeFor(id);
  const suffix = code ? '#c=' + encodeURIComponent(code) : '';
  return location.origin + location.pathname + '?u=' + encodeURIComponent(id) + suffix;
}

async function issueLinkCode(id) {
  if (!staffById(id)) throw new Error('대상을 찾을 수 없습니다');
  if (sync.enabled()) {
    for (let i = 0; sync.busy && i < 100; i++) await new Promise(resolve => setTimeout(resolve, 50));
    sync.loud = true;
    await sync.run();
  }
  const issued = await sync.issueBootstrap(id);
  storeLinkCode(id, issued.code, issued.expiresAt);
  return issued.code;
}

function reportText(staffId, date) {
  const s = staffById(staffId);
  const list = tasksFor(staffId, date);
  const p = progress(staffId, date);
  let txt = '✅ ' + label(date) + ' 업무 수행 보고\n' + (s ? s.name + '\n' : '') +
    '완료 ' + p.done + '/' + p.total + '건 (' + p.pct + '%)\n─────────\n';
  txt += list.map(t => {
    const c = getCheck(t.id, date), st = statusOf(t, date), pr = taskProgress(t, c);
    const mark = st === 'done' ? '✅' : st === 'blocked' ? '🚧' : st === 'doing' ? '🔸' : '⬜';
    return mark + ' ' + t.title +
      (st === 'doing' ? ' (' + pr.done + '/' + pr.total + pr.unit + ')' : '') +
      (c && c.note ? '\n   · ' + c.note : '');
  }).join('\n') || '(지시된 업무 없음)';
  return txt;

function briefText(date) {
  const list = teamStaff();
  let done = 0, total = 0;
  const pend = [], blocked = [], clear = [];
  list.forEach(s => {
    const p = progress(s.id, date);
    done += p.done; total += p.total;
    let hasPend = false;
    tasksFor(s.id, date).forEach(t => {
      const st = statusOf(t, date), c = getCheck(t.id, date), pr = taskProgress(t, c);
      if (st === 'done') return;
      hasPend = true;
      const line = '· ' + s.name + ' — ' + t.title + (t.time ? ' (' + t.time + ')' : '') +
        (st === 'doing' ? ' [진행 ' + pr.done + '/' + pr.total + pr.unit + ']' : '') +
        (c && c.note ? '\n   “' + c.note + '”' : '');
      (st === 'blocked' ? blocked : pend).push(line);
    });
    if (!hasPend && p.total) clear.push(s.name);
  });
  const pct = total ? Math.round(done / total * 100) : 0;

  let txt = '📊 ' + label(date) + ' 업무 마감 브리핑\n' +
    '전체 ' + total + '건 중 ' + done + '건 완료 (' + pct + '%)\n─────────\n';
  if (blocked.length) txt += '🚧 막힘 ' + blocked.length + '건 — 조치 필요\n' + blocked.join('\n') + '\n─────────\n';
  txt += pend.length ? '⚠️ 미완료 ' + pend.length + '건\n' + pend.join('\n') + '\n' : '✅ 미완료 없음\n';
  if (clear.length) txt += '─────────\n✅ 전원 완료: ' + clear.join(', ') + '\n';

  // 지시하지 않았는데 학생이 스스로 한 일
  const own = [];
  list.forEach(s => tasksFor(s.id, date).forEach(t => {
    if (t.origin !== 'staff') return;
    const st = statusOf(t, date);
    own.push('· ' + s.name + ' — ' + t.title + ' [' + STATUS_LABEL[st] + ']');
  }));
  if (own.length) txt += '─────────\n＋ 학생 추가 업무 ' + own.length + '건\n' + own.join('\n') + '\n';

  // 대표 본인 업무는 학생 통계와 섞지 않고 따로 붙인다
  const mineLines = [];
  owners().forEach(s => tasksFor(s.id, date).forEach(t => {
    const st = statusOf(t, date), c = getCheck(t.id, date), pr = taskProgress(t, c);
    mineLines.push('· ' + t.title + (t.time ? ' (' + t.time + ')' : '') +
      ' [' + STATUS_LABEL[st] + (st === 'doing' ? ' ' + pr.done + '/' + pr.total + pr.unit : '') + ']' +
      (c && c.note ? '\n   “' + c.note + '”' : ''));
  }));
  if (mineLines.length) txt += '─────────\n🙋 내 업무 ' + mineLines.length + '건\n' + mineLines.join('\n') + '\n';

  return txt;
}

    try { document.execCommand('copy'); toast('복사했습니다'); }
    catch (e2) { toast('복사 실패 — 직접 선택해 주세요'); }
    document.body.removeChild(ta);

}

function saveEditedTask() {
  const isNew = !eForm.id;
  const title = ($('#eTitle').value || '').trim();
  if (!title) return toast('업무 내용을 입력해 주세요');
  if (eForm.repeat === 'days' && !eForm.days.length) return toast('요일을 선택해 주세요');

  let t;
  if (isNew) {
    const who = currentStaff();
    if (!who) return toast('학생을 먼저 선택해 주세요');
    t = {
      id: uid(), groupId: 'own-' + now(), staffId: who.id,
      steps: [], createdAt: now(), deleted: false,
      origin: actor()
    };
    state.tasks.push(t);
  } else {
    t = state.tasks.find(x => x.id === eForm.id);
    if (!t) return closeModal();
    if (!canEditTask(t)) { closeModal(); return toast('원장님이 내린 지시는 수정할 수 없습니다'); }
    if (actor() === 'staff') t.lastEditBy = 'staff';
    else if (t.origin !== 'staff') t.lastEditBy = 'admin';
  }

  // 같은 순서의 단계는 id를 물려줘서 이미 체크한 진행 상태를 잃지 않게 한다
  const oldSteps = t.steps || [];
  const labels = ($('#eSteps').value || '').split('\n').map(x => x.trim()).filter(Boolean);
  t.steps = labels.map((label, i) => ({ id: (oldSteps[i] && oldSteps[i].id) || uid(), label: label }));

  t.title = title;
  t.detail = ($('#eDetail').value || '').trim();
  t.guide = ($('#eGuide').value || '').trim();
  t.target = Number($('#eTarget').value) || 0;
  t.unit = ($('#eUnit').value || '건').trim();
  t.time = $('#eTime').value || '';
  t.priority = $('#ePri').value;
  t.repeat = eForm.repeat;
  t.days = eForm.days.slice().sort();
  t.start = $('#eStart').value || today();
  t.end = $('#eEnd').value || '';
  t.carry = eForm.carry;
  t.updatedAt = now();

  eForm = null;
  save(); queueSync(); closeModal(); render();
  toast(isNew ? '추가했습니다' : '수정했습니다');
}

/* ══════════════════════════════════════════════════════
   8-1. 말로 쓴 지시를 업무로 — 카톡 문장 해석
   ══════════════════════════════════════════════════════ */
const pad2 = n => String(n).padStart(2, '0');

/** "혜지쌤", "김혜지", "혜지 선생님" 모두 잡는다 */
function matchStaff(text) {
  const list = liveStaff();
  for (const s of list) if (text.includes(s.name)) return { s: s, token: s.name };
  for (const s of list) {
    const short = s.name.length >= 3 ? s.name.slice(1) : '';
    if (short.length >= 2 && text.includes(short)) return { s: s, token: short };
  }
  return null;
}

/** "3시까지", "오후 3시반", "15:00", "9시 30분" */
function matchTime(text) {
  let m = text.match(/(\d{1,2})\s*:\s*(\d{2})/);
  if (m) return { time: pad2(m[1]) + ':' + m[2], token: m[0] };

  m = text.match(/(오전|오후|아침|저녁|밤|낮)?\s*(\d{1,2})\s*시\s*(반|\d{1,2}\s*분)?/);
  if (!m) return null;
  let h = Number(m[2]);
  const mer = m[1] || '';
  if (/오후|저녁|밤/.test(mer)) { if (h < 12) h += 12; }
  else if (/오전|아침/.test(mer)) { if (h === 12) h = 0; }
  else if (h >= 1 && h <= 7) h += 12;   // 오후에 도는 센터라 한 자리 시각은 오후로 본다
  let mm = '00';
  if (m[3]) mm = m[3] === '반' ? '30' : pad2(parseInt(m[3], 10));
  return { time: pad2(h) + ':' + mm, token: m[0] };
}

/** "오늘", "내일", "모레", "금요일", "8월 3일" */
function matchDate(text) {
  if (/오늘/.test(text)) return { date: today(), token: '오늘' };
  if (/내일/.test(text)) return { date: addDays(today(), 1), token: '내일' };
  if (/모레/.test(text)) return { date: addDays(today(), 2), token: '모레' };

  const dw = text.match(/([일월화수목금토])\s*요일/);
  if (dw) {
    const want = DOW.indexOf(dw[1]);
    for (let i = 1; i <= 7; i++) {
      const c = addDays(today(), i);
      if (dowOf(c) === want) return { date: c, token: dw[0] };
    }
  }
  const md = text.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
  if (md) return { date: new Date().getFullYear() + '-' + pad2(md[1]) + '-' + pad2(md[2]), token: md[0] };
  return null;
}

function cleanTitle(s) {
  return String(s)
    .replace(/(쌤|선생님|샘)/g, ' ')
    .replace(/(긴급히?|급히|급하게|asap)/gi, ' ')   // 중요 표시로 이미 잡히므로 제목에서는 뺀다
    .replace(/^[\s,.·\-~]*(에게|한테|께)?\s*/, '')
    .replace(/\s*(좀|까지|안에|전에)\s*/g, ' ')
    .replace(/\s*(부탁\s*(해요|드려요|드립니다|합니다|해)|해\s*주세요|해주세요|해줘요|해줘|하세요|해주시고|해주시면|바랍니다)\s*[.!~]*$/, '')
    .replace(/\s+/g, ' ')
    .replace(/[\s.,!~]+$/, '')
    .trim();
}

/** 한 줄에 한 건. 이름·시간·날짜를 뽑고 나머지를 업무 이름으로 쓴다. */
function parseInstructions(text) {
  return String(text || '').split('\n').map(l => l.trim()).filter(Boolean).map(line => {
    let rest = line;
    const sm = matchStaff(rest); if (sm) rest = rest.replace(sm.token, ' ');
    const tm = matchTime(rest);  if (tm) rest = rest.replace(tm.token, ' ');
    const dm = matchDate(rest);  if (dm) rest = rest.replace(dm.token, ' ');
    const title = cleanTitle(rest);
    return {
      staff: sm ? sm.s.name : '',
      title: title || line,
      time: tm ? tm.time : '',
      start: dm ? dm.date : today(),
      repeat: 'once',
      priority: /긴급|급하|급히|중요|바로|asap/i.test(line) ? 'high' : 'normal',
      carry: true,
      raw: line
    };
  });
}

function applyAssignments(input, preConfirmed) {
  let data = input;
  if (typeof input === 'string') {
    try { data = JSON.parse(input); }
    catch (e) { return toast('JSON 형식이 잘못되었습니다'); }
  }
  const list = Array.isArray(data) ? data : (data.assignments || []);
  if (!list.length) return toast('등록할 업무가 없습니다');

  // 이름 확인 → 없는 학생은 물어보고 등록
  const missing = [...new Set(list.map(a => String(a.staff || '').trim()).filter(n => n && !staffByName(n)))];
  if (missing.length) {
    if (!preConfirmed && !confirm('등록되지 않은 학생이 있습니다: ' + missing.join(', ') + '\n새로 등록할까요?')) return;
    missing.forEach(n => {
      const isOwner = list.some(a => String(a.staff || '').trim() === n && a.owner === true);
      state.staff.push({ id: uid(), name: n, owner: isOwner, createdAt: now(), updatedAt: now(), deleted: false });
    });
  }

  let added = 0, skipped = 0;
  list.forEach(a => {
    const s = staffByName(a.staff);
    if (!s) { skipped++; return; }
    const steps = (a.steps || []).map(x => ({
      id: uid(), label: typeof x === 'string' ? x : String(x.label || '')
    })).filter(x => x.label);
    state.tasks.push({
      id: uid(), groupId: 'ai-' + now(), staffId: s.id,
      title: String(a.title || '').trim() || '(제목 없음)',
      detail: String(a.detail || ''),
      guide: String(a.guide || ''),
      steps: steps,
      target: Number(a.target) || 0,
      unit: String(a.unit || '건'),
      time: String(a.time || ''),
      priority: a.priority === 'high' ? 'high' : 'normal',
      repeat: ['once', 'daily', 'weekday', 'days'].includes(a.repeat) ? a.repeat : 'once',
      days: Array.isArray(a.days) ? a.days.map(Number).filter(n => n >= 0 && n <= 6) : [],
      start: /^\d{4}-\d{2}-\d{2}$/.test(a.start || '') ? a.start : today(),
      end: /^\d{4}-\d{2}-\d{2}$/.test(a.end || '') ? a.end : '',
      carry: a.carry !== false,
      createdAt: now(), updatedAt: now(), deleted: false
    });
    added++;
  });

  save(); queueSync(); closeModal(); render();
  toast(added + '건 등록' + (skipped ? ' · ' + skipped + '건 건너뜀' : ''));
}

      const ds = Object.keys(buckets).sort();
      closeModal(); render();
      toast(left.length + '강 배정 완료 — ' + shortDate(ds[0]) + ' ~ ' + shortDate(ds[ds.length - 1]) +
        ' (' + ds.length + '일)');
      break;
    }
    case 'ingcatchup': {
      const me = currentStaff(); if (!me) break;
      if (!confirm('밀린 인강을 전부 오늘로 옮길까요?')) return;
      const n = ingCatchup(me.id);
      render(); toast(n + '강을 오늘로 옮겼습니다');
      break;
    }
    case 'ingshift': {
      const me = currentStaff(); if (!me) break;
      const v = prompt('오늘 이후의 미완료 인강을 며칠 밀까요?\n(앞당기려면 -3 처럼 음수를 넣으세요)', '7');
      if (v === null) break;
      const n = Number(v);
      if (!n) return toast('숫자를 넣어주세요');
      const cnt = ingShift(me.id, today(), n);
      render(); toast(cnt + '강을 ' + (n > 0 ? n + '일 뒤로' : (-n) + '일 앞으로') + ' 옮겼습니다');
      break;
    }
    case 'ingset': {
      const me = currentStaff(); if (!me) break;
      const set = ingSet(me.id);
      const d = prompt('배정할 요일을 번호로 입력하세요 (0=일 1=월 ... 6=토)\n예: 1,2,3,4,5', set.days.join(','));
      if (d === null) break;
      const days = String(d).split(',').map(x => Number(x.trim())).filter(x => x >= 0 && x <= 6);
      const p = prompt('하루에 몇 강씩 배정할까요?', set.perDay);
      if (p === null) break;
      setCheck('__ingset__' + me.id, 'all',
        { set: { days: days, perDay: Math.max(1, Number(p) || 1) }, done: true });
      render(); toast('저장했습니다');
      break;
    }

    /* 순공시간 타이머 */
    case 'sttoggle': {
      const me = currentStaff(); if (!me) break;
      const subj = el.dataset.subj;
      const r = stRunning(me.id, today());
      if (r && r.subj === subj) { stStop(me.id, today()); toast(subj + ' 정지 — 수고했어요'); }
      else { stStart(me.id, today(), subj); toast(subj + ' 시작!'); }
      render();
      break;
    }
    case 'stsubjadd': {
      const me = currentStaff(); if (!me) break;
      const name = (prompt('추가할 과목 이름을 입력하세요 (예: 한국사)') || '').trim();
      if (!name) break;
      const list = stSubjects(me.id);
      if (list.includes(name)) return toast('이미 있는 과목입니다');
      setCheck('__stsubj__' + me.id, 'all', { list: list.concat(name), done: true });
      render();
      break;
    }
    case 'stgoal': {
      const me = currentStaff(); if (!me) break;
      const cur = stGoalMin(me.id);
      const v = prompt('하루 목표 공부시간을 분 단위로 입력하세요 (예: 360 = 6시간)\n0을 넣으면 목표를 없앱니다', cur || 360);
      if (v === null) break;
      setCheck('__stgoal__' + me.id, 'all', { mins: Math.max(0, Number(v) || 0), done: true });
      render();
      break;
    }
    case 'stedit': {
      const me = currentStaff(); if (!me) break;
      stEditModal(me.id);
      break;
    }
    case 'stsave': {
      const me = currentStaff(); if (!me) break;
      const secs = {};
      document.querySelectorAll('[data-stedit]').forEach(inp => {
        const m = Math.max(0, Number(inp.value) || 0);
        if (m) secs[inp.dataset.stedit] = m * 60;
      });
      setCheck(stKey(me.id), today(), { secs: secs, run: null, done: true });
      closeModal(); render(); toast('저장했습니다');
      break;
    }

    /* 날짜 */
    case 'day':  cursor = addDays(cursor, Number(el.dataset.n)); cursorPinned = (cursor !== today()); render(); break;
    case 'week': cursor = addDays(cursor, Number(el.dataset.n) * 7); cursorPinned = (mondayOf(cursor) !== mondayOf(today())); render(); break;
    case 'mnav': ymCursor = ymAdd(ymCursor, Number(el.dataset.n)); render(); break;
    case 'daypick': cursor = el.dataset.date; cursorPinned = (cursor !== today()); go('today'); break;

    /* 월간 목표 */
    case 'gadd': {
      const title = ($('#gTitle').value || '').trim();
      if (!title) return toast('목표를 입력해 주세요');
      const me = currentStaff(); if (!me) break;
      const target = Math.max(0, Number($('#gTarget').value) || 0);
      const unit = ($('#gUnit').value || '').trim() || '회';
      state.tasks.push({
        id: uid(), groupId: 'goal-' + now(), staffId: me.id,
        kind: 'mgoal', month: ymCursor,
        title: title, detail: '', guide: '', steps: [], target: target, unit: unit,
        time: '', priority: 'normal', repeat: 'once', days: [], start: ymCursor + '-01', end: '', carry: false,
        origin: actor(), createdAt: now(), updatedAt: now(), deleted: false
      });
      save(); queueSync(); render(); toast('목표를 추가했습니다');
      break;
    }
    case 'gdel': {
      const t = task();
      if (!t || !canEditTask(t)) break;
      if (!confirm('이 목표를 삭제할까요?')) return;
      t.deleted = true; t.updatedAt = now();
      save(); queueSync(); render();
      break;
    }

    /* 체크 · 단계 · 수량 · 막힘 */
    case 'toggle': {
      const t = task(); if (!t) break;
      const c = getCheck(id, date);
      const turnOn = !(c && c.done);
      const steps = {};
      (t.steps || []).forEach(s => { steps[s.id] = turnOn; });
      setCheck(id, date, {
        done: turnOn, at: turnOn ? now() : null,
        steps: steps,
        count: t.target ? (turnOn ? t.target : 0) : ((c && c.count) || 0),
        blocked: turnOn ? false : (c ? c.blocked : false)
      });
      render();
      break;
    }
    case 'step': {
      const t = task(); if (!t) break;
      const c = getCheck(id, date);
      const cur = Object.assign({}, (c && c.steps) || {});
      const k = el.dataset.step;
      cur[k] = !cur[k];
      setCheck(id, date, { steps: cur, blocked: false });
      syncAuto(t, date);
      render();
      break;
    }
    case 'cnt': {
      const t = task(); if (!t) break;
      const c = getCheck(id, date);
      const n = Math.max(0, ((c && c.count) || 0) + Number(el.dataset.n));
      setCheck(id, date, { count: n, blocked: false });
      syncAuto(t, date);
      render();
      break;
    }
    case 'block': {
      const c = getCheck(id, date);
      const on = !(c && c.blocked);
      setCheck(id, date, { blocked: on, done: on ? false : (c ? c.done : false) });
      render();
      toast(on ? '원장님 화면에 표시됩니다' : '막힘을 해제했습니다');
      break;
    }
    case 'panel': {
      const k = id + '|' + date;
      openPanels.has(k) ? openPanels.delete(k) : openPanels.add(k);
      render();
      break;
    }

    /* 학생 */
    case 'pickstaff': viewStaff = id; render(); break;
    case 'openstaff': viewStaff = id; go('today'); break;
    case 'addstaff': {
      const name = ($('#sName').value || '').trim();
      if (!name) return toast('이름을 입력해 주세요');
      state.staff.push({ id: uid(), name: name, createdAt: now(), updatedAt: now(), deleted: false });
      save(); queueSync(); render(); toast(name + ' 등록 완료');
      break;
    }
    case 'delstaff': {
      if (!session.isAdmin) break;
      const s = staffById(id);
      if (!s || !confirm(s.name + ' 님을 삭제할까요? 지시 기록은 남습니다.')) return;
      s.deleted = true; s.updatedAt = now();
      save(); queueSync(); render();
      break;
    }
    case 'toggleowner': {
      if (!session.isAdmin) break;
      const s = staffById(id);
      if (!s) break;
      s.owner = !s.owner; s.updatedAt = now();
      save(); queueSync(); render();
      toast(s.owner ? s.name + ' — 대표로 지정 (학생 통계에서 제외)' : s.name + ' — 대표 해제');
      break;
    }
    case 'togglemanager': {
      if (!session.isAdmin) break;
      const s = staffById(id);
      if (!s) break;
      s.manager = !s.manager; s.updatedAt = now();
      save(); queueSync(); render();
      toast(s.manager
        ? s.name + ' — 관리자로 지정. 본인 개인 링크에서 현황·발행이 열립니다'
        : s.name + ' — 관리자 해제');
      break;
    }
    case 'revokeaccess': {
      if (!session.isAdmin) break;
      const person = staffById(id);
      if (!person || !confirm(person.name + ' 님의 개인 링크와 접속 세션을 모두 해지할까요?')) break;
      sync.revokeAccess(id)
        .then(() => { clearLinkCode(id); toast('개인 링크와 접속 세션을 해지했습니다'); })
        .catch(e => toast('링크를 해지하지 못했습니다 — ' + e.message));
      break;
    }
    case 'copylink': {
      issueLinkCode(id)
        .then(() => copy(staffLink(id)))
        .catch(e => toast('링크를 만들지 못했습니다 — ' + e.message))
        .finally(() => clearLinkCode(id));
      break;
    }
    case 'alllinks': {
      const list = liveStaff();
      toast(list.length + '명 링크 준비 중…');
      Promise.all(list.map(s => issueLinkCode(s.id)))
        .then(() => copy(list.map(s => s.name + '\n' + staffLink(s.id)).join('\n\n')))
        .catch(e => toast('링크를 만들지 못했습니다 — ' + e.message))
        .finally(() => list.forEach(s => clearLinkCode(s.id)));
      break;
    }
    case 'adminlink': {
      copy(location.origin + location.pathname);
      toast('보안상 비밀키·PIN은 주소에 넣지 않습니다');
      break;
    }
    case 'orderText':
      issueLinkCode(id)
        .then(() => { showText('카카오톡 지시서 문구', orderText(id, cursor)); clearLinkCode(id); })
        .catch(e => toast('링크를 만들지 못했습니다 — ' + e.message));
      break;
    case 'report': showText('오늘 수행 보고', reportText(currentStaff().id, cursor)); break;
    case 'brief': showText('오늘 마감 브리핑', briefText(cursor)); break;
    case 'copytext': copy($('#mText').value); break;
    case 'managetasks': manageTasks(id); break;
    case 'newtask': editTaskModal(null); break;

    /* 빠른 추가 — 한 줄로 쓰고 바로 카톡 문구까지 */
    case 'qadd': {
      const line = ($('#qAdd').value || '').trim();
      if (!line) return toast('내용을 입력해 주세요');
      const me = currentStaff();
      if (!me) return toast('학생을 먼저 선택해 주세요');
      const p = parseInstructions(line)[0];
      const t = {
        id: uid(), groupId: 'quick-' + now(), staffId: me.id,
        title: p.title, detail: '', guide: '', steps: [], target: 0, unit: '건',
        time: p.time, priority: p.priority,
        repeat: 'once', days: [], start: p.start, end: '', carry: true,
        origin: actor(), createdAt: now(), updatedAt: now(), deleted: false
      };
      state.tasks.push(t);
      save(); queueSync(); render();
      toast(me.name + ' — 추가했습니다');
      if (!session.isStaffLink) {
        setTimeout(() => {
          issueLinkCode(t.staffId)
            .then(() => { showText('카톡으로 보낼 문구', quickText(t)); clearLinkCode(t.staffId); })
            .catch(e => toast('링크를 만들지 못했습니다 — ' + e.message));
        }, 300);
      }
      break;
    }

    /* 카톡 문장 붙여넣기 */
    case 'kopen': kakaoText = ''; kakaoParsed = null; kakaoModal(); break;
    case 'kparse': {
      kakaoText = $('#kText').value || '';
      kakaoParsed = parseInstructions(kakaoText);
      kakaoModal();
      break;
    }
    case 'kapply': {
      pendingAdd = kakaoParsed;
      kakaoParsed = null; kakaoText = '';
      closeModal(); render();
      break;
    }
    case 'etask': {
      const t = task();
      if (!t) break;
      if (!canEditTask(t)) return toast('원장님이 내린 지시는 수정할 수 없습니다');
      editTaskModal(id);
      break;
    }
    case 'edelete': {
      const t = state.tasks.find(x => x.id === eForm.id);
      if (!t) break;
      if (!canEditTask(t)) { closeModal(); return toast('원장님이 내린 지시는 중단할 수 없습니다'); }
      if (!confirm('이 업무를 중단할까요? 지난 기록은 유지됩니다.')) return;
      t.deleted = true; t.updatedAt = now();
      eForm = null;
      save(); queueSync(); closeModal(); render(); toast('중단했습니다');
      break;
    }
    case 'erepeat': {
      eForm.repeat = el.dataset.v;
      document.querySelectorAll('#eRepeat .chip').forEach(c => c.classList.toggle('on', c.dataset.v === eForm.repeat));
      $('#eDaysWrap').style.display = eForm.repeat === 'days' ? '' : 'none';
      break;
    }
    case 'edow': {
      const d = Number(el.dataset.d), i = eForm.days.indexOf(d);
      if (i < 0) eForm.days.push(d); else eForm.days.splice(i, 1);
      el.classList.toggle('on');
      break;
    }
    case 'ecarry': {
      eForm.carry = !eForm.carry;
      el.classList.toggle('on', eForm.carry);
      el.textContent = (eForm.carry ? '☑' : '☐') + ' 못 끝내면 다음날로 이월';
      break;
    }
    case 'esave': saveEditedTask(); break;
    case 'deltask': {
      const t = task();
      if (!t || !confirm('이 지시를 중단할까요? 지난 기록은 유지됩니다.')) return;
      t.deleted = true; t.updatedAt = now();
      save(); queueSync(); closeModal(); render(); toast('중단했습니다');
      break;
    }

    /* AI 가져오기 */
    case 'aiopen': aiModal(); break;
    case 'aisample': $('#aiText').value = AI_SAMPLE; break;
    case 'aiapply': applyAssignments($('#aiText').value || ''); break;
    case 'padd': { const p = pendingAdd; pendingAdd = null; applyAssignments(p, true); go('today'); break; }
    case 'pcancel': pendingAdd = null; render(); toast('취소했습니다'); break;

    /* 지시서 작성 */
    case 'wstaff': {
      const i = wForm.staff.indexOf(id);
      if (i < 0) wForm.staff.push(id); else wForm.staff.splice(i, 1);
      el.classList.toggle('on');
      break;
    }
    case 'wrepeat': {
      wForm.repeat = el.dataset.v;
      document.querySelectorAll('#wRepeat .chip').forEach(c => c.classList.toggle('on', c.dataset.v === wForm.repeat));
      $('#wDaysWrap').style.display = wForm.repeat === 'days' ? '' : 'none';
      $('#wEndWrap').style.display  = wForm.repeat === 'once' ? 'none' : '';
      break;
    }
    case 'wdow': {
      const d = Number(el.dataset.d), i = wForm.days.indexOf(d);
      if (i < 0) wForm.days.push(d); else wForm.days.splice(i, 1);
      el.classList.toggle('on');
      break;
    }
    case 'wcarry': { wForm.carry = !wForm.carry; render(); break; }
    case 'wadd': {
      const title = ($('#wTitle').value || '').trim();
      if (!wForm.staff.length) return toast('받는 학생을 선택해 주세요');
      if (!title) return toast('업무 내용을 입력해 주세요');
      if (wForm.repeat === 'days' && !wForm.days.length) return toast('요일을 선택해 주세요');
      wForm.start = $('#wStart').value || today();
      wForm.end = (wForm.repeat === 'once' ? '' : ($('#wEnd').value || ''));
      draft.push({
        title: title,
        detail: ($('#wDetail').value || '').trim(),
        guide: ($('#wGuide').value || '').trim(),
        steps: ($('#wSteps').value || '').split('\n').map(x => x.trim()).filter(Boolean)
                 .map(l => ({ id: uid(), label: l })),
        target: Number($('#wTarget').value) || 0,
        unit: ($('#wUnit').value || '건').trim(),
        time: $('#wTime').value || '',
        priority: $('#wPri').value,
        repeat: wForm.repeat,
        days: wForm.days.slice().sort(),
        start: wForm.start,
        end: wForm.end,
        carry: wForm.carry,
        staffIds: wForm.staff.slice(),
        names: wForm.staff.map(x => (staffById(x) || {}).name).filter(Boolean)
      });
      render();
      toast('목록에 담았습니다 (' + draft.length + '건)');
      break;
    }
    case 'wdel': draft.splice(Number(el.dataset.i), 1); render(); break;
    case 'wclear': draft = []; render(); break;
    case 'wpublish': {
      if (!draft.length) return;
      const gid = uid(), touched = new Set();
      draft.forEach(d => d.staffIds.forEach(sid => {
        state.tasks.push({
          id: uid(), groupId: gid, staffId: sid,
          title: d.title, detail: d.detail, guide: d.guide,
          steps: (d.steps || []).map(s => ({ id: uid(), label: s.label })),
          target: d.target, unit: d.unit,
          time: d.time, priority: d.priority,
          repeat: d.repeat, days: d.days, start: d.start, end: d.end, carry: d.carry,
          origin: session.isStaffLink ? 'manager' : undefined,
          createdAt: now(), updatedAt: now(), deleted: false
        });
        touched.add(sid);
      }));
      const n = draft.length;
      draft = [];
      save(); queueSync(); render();
      toast(n + '건 발행 완료');
      const first = [...touched][0];
      if (first) setTimeout(() => {
        issueLinkCode(first)
          .then(() => { showText('카카오톡 지시서 문구', orderText(first, today())); clearLinkCode(first); })
          .catch(e => toast('링크를 만들지 못했습니다 — ' + e.message));
      }, 400);
      break;
    }

    /* 설정 */
    case 'savecfg': {
      const nextSecret = ($('#cfgSecret').value || '').trim();
      if (nextSecret) setConsultAdminSecret(nextSecret);
      if (!getConsultAdminSecret()) return toast('비밀키를 입력해 주세요');
      render(); toast(nextSecret ? '현재 탭 세션에만 연결했습니다' : '현재 탭의 기존 연결을 유지합니다');
      sync.loud = true; sync.run();
      break;
    }
    case 'syncnow': sync.loud = true; sync.run(); toast('동기화 중…'); break;
    case 'export': {
      const clean = {
        format: 'wb-consult-data', formatVersion: 2, exportedAt: new Date().toISOString(),
        state: { version: state.version, staff: staffWithoutLegacyTokens(state.staff), tasks: state.tasks, checks: state.checks,
          settings: { centerName: state.settings.centerName || 'WB 웩슬러브레인센터' } }
      };
      const blob = new Blob([JSON.stringify(clean, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'wb-컨설팅플래너-안전백업-' + today() + '.json';
      a.click(); URL.revokeObjectURL(a.href);
      break;
    }
    case 'import': {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = 'application/json';
      inp.onchange = () => {
        const f = inp.files[0]; if (!f) return;
        const r = new FileReader();
        r.onload = () => {
          try {
            if (String(r.result || '').length > 10 * 1024 * 1024) throw new Error('파일이 너무 큽니다');
            const parsed = JSON.parse(r.result);
            const p = parsed && parsed.format === 'wb-consult-data' ? parsed.state : parsed;
            if (!p || !Array.isArray(p.staff) || !Array.isArray(p.tasks) || !p.checks || typeof p.checks !== 'object') throw new Error('형식 오류');
            if (p.staff.length > 5000 || p.tasks.length > 50000 || Object.keys(p.checks).length > 200000) throw new Error('항목 수 초과');
            if (!confirm('현재 학생·업무·체크 데이터를 덮어씁니다. 현재 탭의 연결 비밀키와 PIN은 유지됩니다. 계속할까요?')) return;
            const secure = {
              myToken: state.settings.myToken,
              adminPin: state.settings.adminPin, adminPinHash: state.settings.adminPinHash,
              adminPinSalt: state.settings.adminPinSalt, adminPinVersion: state.settings.adminPinVersion,
              syncCursors: state.settings.syncCursors
            };
            state = Object.assign(blankState(), {
              version: Number(p.version) || 3, staff: staffWithoutLegacyTokens(p.staff), tasks: p.tasks, checks: p.checks
            });
            state.settings = Object.assign(blankState().settings, {
              centerName: p.settings && p.settings.centerName || 'WB 웩슬러브레인센터'
            }, secure);
            save(); render(); toast('데이터를 불러왔습니다');
          } catch (e) { toast('파일을 읽을 수 없습니다'); }
        };
        r.readAsText(f);
      };
      inp.click();
      break;
    }
    case 'lpinit': {
      const student = currentStaff();
      if (!student || !lpCanManage()) break;
      const existingLearningState = learningStateFor(student);
      if (lpLearningStateErrors.has(student.id)) {
        return toast('손상된 학습 기록이 있어 초기화하지 않았습니다. 먼저 안전 백업 후 복구해 주세요');
      }
      if (existingLearningState) return toast('이미 학습 설정이 있어 초기화하지 않았습니다');
      try {
        let next = WBLearningShell.createInitialState({
          studentCode: student.id,
          displayName: student.name,
          academicStage: $('#lpInitStage').value,
          grade: Number($('#lpInitGrade').value) || 1
        });
        if ($('#lpInitSchedules').checked) {
          next = WBLearningShell.applyCommand(next, {
            type: 'schedules_generate', fromDate: today(), toDate: addDays(today(), 365), weekday: 5
          }, {});
        }
        saveLearningState(student.id, next);
        render(); toast('통합 학습을 시작했습니다');
      } catch (error) { toast(error.message); }
      break;
    }
    case 'lpprofile':
      runLearningCommand({ type: 'profile_update', academicStage: $('#lpStage').value, grade: Number($('#lpGrade').value) || 1 }, '학년 단계를 저장했습니다');
      break;
    case 'lpschedule': {
      const fromDate = $('#lpScheduleFrom').value || today();
      runLearningCommand({ type: 'schedules_generate', fromDate: fromDate, toDate: addDays(fromDate, 365), weekday: Number($('#lpWeekday').value) || 5 }, '정기평가 1년 일정을 생성했습니다');
      break;
    }
    case 'lpassessmentapprove': {
      const occurrenceId = $('#lpAssessmentOccurrence').value;
      const scoreValue = ($('#lpAssessmentScore').value || '').trim();
      const maxScoreValue = ($('#lpAssessmentMaxScore').value || '').trim();
      const evidenceRef = ($('#lpAssessmentEvidence').value || '').trim();
      const externalRef = ($('#lpAssessmentExternal').value || '').trim();
      if (!occurrenceId) return toast('승인할 평가 회차를 선택해 주세요');
      if (!scoreValue) return toast('평가 점수를 입력해 주세요');
      if (!maxScoreValue) return toast('평가 만점을 입력해 주세요');
      if (!evidenceRef) return toast('평가 결과를 확인한 근거 참조를 입력해 주세요');
      const score = Number(scoreValue);
      const maxScore = Number(maxScoreValue);
      if (!Number.isFinite(score) || score < 0) return toast('평가 점수는 0 이상의 숫자로 입력해 주세요');
      if (!Number.isFinite(maxScore) || maxScore <= 0) return toast('평가 만점은 0보다 큰 숫자로 입력해 주세요');
      if (score > maxScore) return toast('평가 점수는 만점을 넘을 수 없습니다');
      runLearningCommand({
        type: 'assessment_result_approve', occurrenceId: occurrenceId,
        score: score, maxScore: maxScore, evidenceRef: evidenceRef, externalRef: externalRef
      }, '사람 확인을 거쳐 평가 결과와 플래너 완료를 승인했습니다');
      break;
    }
    case 'lpprovideradd': {
      const providerId = ($('#lpCustomProviderId').value || '').trim();
      const label = ($('#lpCustomProviderLabel').value || '').trim();
      const capabilities = ($('#lpCustomProviderCapabilities').value || '').split(/[\s,]+/).map(value => value.trim()).filter(Boolean);
      if (!providerId) return toast('추가 프로그램 ID를 입력해 주세요');
      if (!label) return toast('추가 프로그램 이름을 입력해 주세요');
      runLearningCommand({ type: 'provider_register', providerId: providerId, label: label, capabilities: capabilities, active: true }, '추가 프로그램을 등록했습니다');
      break;
    }
    case 'lpprovidertoggle':
      runLearningCommand({ type: 'provider_toggle', providerId: id, active: el.dataset.active === 'true' }, el.dataset.active === 'true' ? '프로그램을 다시 사용합니다' : '프로그램 신규 사용을 중지했습니다');
      break;
    case 'lpprogram':
      runLearningCommand({
        type: 'program_upsert', providerId: $('#lpProvider').value, status: $('#lpProgramStatus').value,
        accountIdRef: ($('#lpAccountRef').value || '').trim(),
        assignedCount: ($('#lpAssigned').value || '').trim(), completedCount: ($('#lpCompleted').value || '').trim()
      }, '온라인 프로그램 상태를 확인 후보로 저장했습니다');
      break;
    case 'lpimportpreview': {
      const student = currentStaff();
      if (!student || !lpCanManage() || !window.WBProgramImports) break;
      const raw = ($('#lpImportText').value || '').trim();
      if (!raw) return toast('CSV 또는 JSON을 붙여넣어 주세요');
      const providerId = $('#lpImportProvider').value;
      const previewSequence = ++lpImportPreviewSequence;
      try {
        const currentLearningState = learningStateFor(student);
        if (!currentLearningState) throw new Error('통합 학습 상태를 읽을 수 없습니다');
        const importRegistry = lpProgramImportRegistry(currentLearningState);
        const parsed = /^[\[{]/.test(raw) ? WBProgramImports.parseJson(raw) : WBProgramImports.parseCsv(raw);
        const rows = parsed.map(row => Object.assign({ student_code: student.id }, row));
        WBProgramImports.previewImport({
          providerId: providerId,
          input: rows,
          format: 'json',
          sourceRef: 'consult-manual-import',
          studentDirectory: [{ student_code: student.id, external_ids: {} }],
          registry: importRegistry
        }).then(preview => {
          if (previewSequence !== lpImportPreviewSequence) return;
          const activeStudent = currentStaff();
          if (!activeStudent || activeStudent.id !== student.id) {
            throw new Error('미리보기 중 학생 선택이 바뀌었습니다. 현재 학생에서 다시 미리보기 해주세요');
          }
          const ledger = lpImportLedger(student.id);
          const validation = WBProgramImports.validatePreview(preview, { existingIdempotencyKeys: ledger.keys });
          const candidates = WBProgramImports.createConfirmCandidates(validation, { requestedBy: lpActorId() });
          const reviewRows = WBProgramImports.createReviewRows(validation);
          lpImportReview = {
            studentId: student.id, validation: validation, candidates: candidates, reviewRows: reviewRows,
            previewSequence: previewSequence, reviewKey: lpImportReviewKey(student.id, candidates)
          };
          const invalidReasons = validation.invalid_candidates.slice(0, 10).map(candidate =>
            '행 ' + candidate.row_number + ': ' + candidate.issues.filter(issue => issue.blocking).map(issue => issue.message).join(', ')
          );
          const currentPrograms = currentLearningState && Array.isArray(currentLearningState.programStates)
            ? currentLearningState.programStates : [];
          const importDisplay = value => value === null || value === undefined || value === '' ? '-' : String(value);
          const importDateDisplay = value => {
            const display = importDisplay(value);
            return display === '-' ? display : display.slice(0, 10);
          };
          const rowHtml = reviewRows.map(row => {
            const currentProgram = currentPrograms.find(program =>
              program && program.studentCode === student.id && program.providerId === row.provider_id
            );
            const currentSnapshot = currentProgram && currentProgram.latestSnapshot;
            const currentData = currentSnapshot && currentSnapshot.data || {};
            const currentProgress = currentData.progress_pct === undefined ? currentData.progressPct : currentData.progress_pct;
            const currentTarget = currentData.target_score === undefined ? currentData.targetScore : currentData.target_score;
            const currentScore = currentData.score == null ? '-' : String(currentData.score) + (currentTarget == null ? '' : '/' + currentTarget);
            const incomingScore = row.score == null ? '-' : String(row.score) + (row.target_score == null ? '' : '/' + row.target_score);
            const comparison = '현재: 상태 ' + importDisplay(currentProgram && currentProgram.status) +
              ' · 날짜 ' + importDateDisplay(currentSnapshot && currentSnapshot.checkDate || currentProgram && currentProgram.lastCheckedAt) +
              ' · 진행률 ' + (currentProgress == null ? '-' : currentProgress + '%') + ' · 점수 ' + currentScore +
              ' → 반영: 상태 ' + importDisplay(row.status) + ' · 날짜 ' + importDateDisplay(row.check_date) +
              ' · 진행률 ' + (row.progress_pct == null ? '-' : row.progress_pct + '%') + ' · 점수 ' + incomingScore;
            const details = [
              '학생 ' + (row.student_code || '-'),
              row.current_unit ? '진도 ' + row.current_unit : '',
              row.set_name ? '세트 ' + row.set_name : ''
            ].filter(Boolean).join(' · ');
            return '<label class="card-sub" style="display:block;margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:10px">' +
              '<input type="checkbox" data-lp-import-row value="' + esc(row.row_id) + '" aria-label="' + esc('행 ' + row.row_number + ' ' + (row.provider_label || row.provider_id) + ' 승인 선택') + '"> ' +
              '<strong>행 ' + esc(row.row_number) + ' · ' + esc(row.provider_label || row.provider_id) + '</strong>' +
              '<div class="hint">' + esc(details) + '</div><div class="hint" style="margin-top:4px">' + esc(comparison) + '</div></label>';
          }).join('');
          modal('프로그램 가져오기 확인',
            '<div class="card-sub">전체 ' + validation.summary.total + '행 · 승인 가능 ' + validation.summary.valid + '행 · 확인필요 ' + validation.summary.invalid + '행</div>' +
            (invalidReasons.length ? '<div class="hint mt14">' + invalidReasons.map(esc).join('<br>') + '</div>' : '') +
            (rowHtml ? '<div style="max-height:360px;overflow:auto">' + rowHtml + '</div>' : '') +
            '<div class="hint mt14">기본 선택은 없습니다. 내용을 확인해 직접 선택한 행만 승인자·승인시각과 함께 반영되며, 선택하지 않은 행은 원장에 기록되지 않습니다.</div>' +
            '<div class="hint mt14">최근 이력은 프로그램별 최대 20건·8KB를 보존합니다. 초과한 오래된 이력은 정리되고 누적 정리 건수는 상태에 기록됩니다.</div>',
            validation.summary.valid
              ? '<button class="btn btn-primary btn-block mt14" data-act="lpimportapply">선택 행 승인 및 반영</button>'
              : '');
        }).catch(error => toast(error.message));
      } catch (error) { toast(error.message); }
      break;
    }
    case 'lpimportapply': {
      const review = lpImportReview;
      if (!review || !lpCanManage()) break;
      if (lpImportApplying) return toast('프로그램 승인 반영이 이미 진행 중입니다. 잠시 기다려 주세요');
      const student = currentStaff();
      if (!student || student.id !== review.studentId) return toast('학생 선택이 바뀌었습니다. 현재 학생에서 다시 미리보기 해주세요');
      lpImportApplying = true;
      try {
        if (review !== lpImportReview || review.previewSequence !== lpImportPreviewSequence ||
            review.reviewKey !== lpImportReviewKey(student.id, review.candidates)) {
          throw new Error('가져오기 검토 내용이 변경되었습니다. 다시 미리보기 해주세요');
        }
        if (!window.WBLearningPlatform || typeof WBLearningPlatform.applyApprovedProgramImport !== 'function') {
          throw new Error('승인된 프로그램 가져오기 모듈을 사용할 수 없습니다');
        }
        const selectedRowIds = Array.from(document.querySelectorAll('[data-lp-import-row]:checked'))
          .map(input => input.value);
        if (!selectedRowIds.length) throw new Error('반영할 행을 한 개 이상 선택해 주세요');
        let learningState = learningStateFor(student);
        const ledger = lpImportLedger(student.id);
        const currentKeys = new Set(ledger.keys || []);
        const candidatesByRow = new Map(review.candidates.candidates.map(candidate => [candidate.row_id, candidate]));
        const staleRows = selectedRowIds.filter(rowId => {
          const candidate = candidatesByRow.get(rowId);
          return candidate && currentKeys.has(candidate.duplicate_key);
        });
        if (staleRows.length) throw new Error('미리보기 이후 이미 반영된 행이 있습니다. 다시 미리보기 해주세요');
        const approvedAt = new Date().toISOString();
        const approval = WBProgramImports.approveConfirmCandidates(review.candidates, {
          selectedRowIds: selectedRowIds,
          approvedBy: lpActorId(),
          approvedAt: approvedAt,
          expectedStudentCode: student.id,
          alreadyApprovedDuplicateKeys: Array.from(currentKeys)
        });
        approval.approved_candidates.forEach(candidate => {
          if (candidate.student_code !== student.id) throw new Error('다른 학생의 가져오기 후보는 반영할 수 없습니다');
          const learningRegistry = WBLearningPlatform.createProviderRegistry(learningState.settings && learningState.settings.customProviders);
          learningState = WBLearningPlatform.applyApprovedProgramImport(learningState, candidate, learningRegistry);
          ledger.keys.push(candidate.duplicate_key);
          ledger.history.push({
            rowId: candidate.row_id, at: candidate.approved_at, actor: candidate.approved_by,
            providerId: candidate.provider_id, studentCode: student.id,
            idempotencyKey: candidate.duplicate_key, payloadHash: candidate.payload_hash,
            sourceHash: candidate.source_hash, reportedStatus: candidate.reported_status,
            finalStatus: candidate.final_status, approvalStatus: candidate.approval_status,
            confirmedByHuman: true
          });
        });
        const activeStudent = currentStaff();
        if (review !== lpImportReview || !activeStudent || activeStudent.id !== student.id) {
          throw new Error('승인 중 학생 또는 검토 내용이 바뀌어 반영하지 않았습니다. 다시 미리보기 해주세요');
        }
        saveLearningState(student.id, learningState, { importLedger: ledger });
        const appliedCount = approval.approved_candidates.length;
        lpImportPreviewSequence += 1;
        lpImportReview = null;
        closeModal(); render(); toast('사람 확인을 거쳐 ' + appliedCount + '행을 반영했습니다');
      } catch (error) { toast(error.message); }
      finally { lpImportApplying = false; }
      break;
    }
    case 'lpplan':
      runLearningCommand({
        type: 'planner_add', date: $('#lpPlanDate').value || today(), title: ($('#lpPlanTitle').value || '').trim(),
        minutes: Number($('#lpPlanMinutes').value) || 0, providerId: $('#lpPlanProvider').value
      }, '플래너에 추가했습니다');
      break;
    case 'lpplanedit': {
      const dateInput = document.querySelector('[data-lp-plan-date="' + CSS.escape(id) + '"]');
      const titleInput = document.querySelector('[data-lp-plan-title="' + CSS.escape(id) + '"]');
      const minutesInput = document.querySelector('[data-lp-plan-minutes="' + CSS.escape(id) + '"]');
      const reasonInput = document.querySelector('[data-lp-plan-reason="' + CSS.escape(id) + '"]');
      runLearningCommand({
        type: 'planner_edit', itemId: id, date: dateInput ? dateInput.value : '',
        title: titleInput ? titleInput.value.trim() : '', minutes: minutesInput ? minutesInput.value : '',
        reason: reasonInput ? reasonInput.value.trim() : ''
      }, '플래너 편집 이력을 저장했습니다');
      break;
    }
    case 'lpplancancel': {
      const reasonInput = document.querySelector('[data-lp-plan-reason="' + CSS.escape(id) + '"]');
      const reason = reasonInput ? reasonInput.value.trim() : '';
      if (!reason) return toast('취소 사유를 입력해 주세요');
      runLearningCommand({ type: 'planner_cancel', itemId: id, reason: reason }, '사유와 감사 이력을 남기고 플래너를 취소했습니다');
      break;
    }
    case 'lpplancarryrequest': {
      const dateInput = document.querySelector('[data-lp-plan-carry-date="' + CSS.escape(id) + '"]');
      const reasonInput = document.querySelector('[data-lp-plan-reason="' + CSS.escape(id) + '"]');
      const targetDate = dateInput ? dateInput.value : '';
      if (!targetDate) return toast('이월할 날짜를 선택해 주세요');
      runLearningCommand({
        type: 'planner_carryover_request', itemId: id, date: targetDate,
        reason: reasonInput ? reasonInput.value.trim() : ''
      }, '플래너 이월을 승인대기로 요청했습니다');
      break;
    }
    case 'lpplancarryreview': {
      const dateInput = document.querySelector('[data-lp-plan-carry-date="' + CSS.escape(id) + '"]');
      const reasonInput = document.querySelector('[data-lp-plan-reason="' + CSS.escape(id) + '"]');
      const approved = el.dataset.decision === 'approve';
      const reason = reasonInput ? reasonInput.value.trim() : '';
      if (!approved && !reason) return toast('이월 반려 사유를 입력해 주세요');
      runLearningCommand({
        type: 'planner_carryover_review', itemId: id, approved: approved,
        date: dateInput ? dateInput.value : '', reason: reason
      }, approved ? '이월을 승인해 새 날짜에 플래너를 만들었습니다' : '사유와 함께 이월을 반려했습니다');
      break;
    }
    case 'lpverifyitem': {
      const evidence = document.querySelector('[data-lp-verify-evidence="' + CSS.escape(id) + '"]');
      const decision = el.dataset.decision;
      const evidenceRef = evidence ? evidence.value.trim() : '';
      if (decision !== 'approve' && decision !== 'reject') return toast('승인 또는 반려를 선택해 주세요');
      if (!evidenceRef) return toast('완료 근거 참조를 입력해 주세요');
      runLearningCommand({ type: 'planner_verify', itemId: id, approved: decision === 'approve', evidenceRef: evidenceRef }, decision === 'approve' ? '완료를 승인했습니다' : '확인필요로 반려했습니다');
      break;
    }
    case 'lpcampaign':
      runLearningCommand({
        type: 'campaign_add', campaignType: $('#lpCampaignType').value,
        title: ($('#lpCampaignTitle').value || '').trim() || $('#lpCampaignType').selectedOptions[0].textContent,
        examDate: $('#lpCampaignDate').value
      }, '시험대비 캠페인 초안을 추가했습니다');
      break;
    case 'lpactivate': {
      const consent = document.querySelector('[data-lp-consent-ref="' + CSS.escape(id) + '"]');
      const consentEvidenceRef = consent ? consent.value.trim() : '';
      if (consent && !consentEvidenceRef) return toast('학생·보호자 동의 증빙 참조를 입력해 주세요');
      runLearningCommand({ type: 'campaign_activate', campaignId: id, consentEvidenceRef: consentEvidenceRef }, '시험대비 캠페인을 활성화했습니다');
      break;
    }
    case 'lpcampaignnext': {
      const nextStatus = el.dataset.next;
      const evidence = document.querySelector('[data-lp-campaign-evidence="' + CSS.escape(id) + '"]');
      const result = document.querySelector('[data-lp-campaign-result="' + CSS.escape(id) + '"]');
      const scoreInput = document.querySelector('[data-lp-campaign-score="' + CSS.escape(id) + '"]');
      const maxInput = document.querySelector('[data-lp-campaign-max="' + CSS.escape(id) + '"]');
      const evidenceRef = evidence ? evidence.value.trim() : '';
      const resultSummary = result ? result.value.trim() : '';
      const scoreValue = scoreInput ? scoreInput.value.trim() : '';
      const maxScoreValue = maxInput ? maxInput.value.trim() : '';
      if (!evidenceRef) return toast('현재 단계를 확인한 근거 참조를 입력해 주세요');
      if (nextStatus === 'result_review' && !resultSummary) return toast('대회·시험 결과 요약을 입력해 주세요');
      if (!!scoreValue !== !!maxScoreValue) return toast('점수와 만점은 함께 입력해 주세요');
      if (scoreValue && Number(scoreValue) > Number(maxScoreValue)) return toast('점수는 만점을 넘을 수 없습니다');
      runLearningCommand({
        type: 'campaign_transition', campaignId: id, toStatus: nextStatus,
        evidenceRef: evidenceRef, resultSummary: resultSummary,
        score: scoreValue, maxScore: maxScoreValue
      }, '근거와 승인 이력을 남기고 시험대비 단계를 이동했습니다');
      break;
    }
    case 'lpwrong':
      runLearningCommand({
        type: 'wrong_add', textbookId: ($('#lpWrongBook').value || '').trim(),
        page: ($('#lpWrongPage').value || '').trim(), problemNo: ($('#lpWrongNo').value || '').trim(),
        skillCode: ($('#lpWrongSkill').value || '').trim()
      }, '오답 참조를 등록했습니다');
      break;
    case 'lpwrongnext': {
      const ref = document.querySelector('[data-lp-wrong-ref="' + CSS.escape(id) + '"]');
      const result = document.querySelector('[data-lp-wrong-result="' + CSS.escape(id) + '"]');
      const correct = document.querySelector('[data-lp-wrong-correct="' + CSS.escape(id) + '"]');
      const total = document.querySelector('[data-lp-wrong-total="' + CSS.escape(id) + '"]');
      const correctCount = correct ? correct.value.trim() : undefined;
      const totalCount = total ? total.value.trim() : undefined;
      if (correct && !correctCount) return toast('쌍둥이 문제의 정답 수를 입력해 주세요');
      if (total && !totalCount) return toast('쌍둥이 문제의 전체 문항 수를 입력해 주세요');
      const mastered = !!(result && result.value === 'mastered');
      runLearningCommand({
        type: 'wrong_advance', caseId: id, externalRef: ref ? ref.value.trim() : '',
        correctCount: correctCount, totalCount: totalCount,
        mastered: mastered, nextRecheckDate: result && !mastered ? addDays(today(), 7) : ''
      }, mastered ? '사람 확인을 거쳐 숙달 완료했습니다' : '오답 워크플로우를 다음 단계로 이동했습니다');
      break;
    }
    case 'closemodal': closeModal(); break;
  }
});

/* 메모 · 수량 직접 입력 */
let inputTimer = null;
document.addEventListener('input', ev => {
  const noteEl = ev.target.closest('[data-act="note"]');
  if (noteEl) {
    clearTimeout(inputTimer);
    inputTimer = setTimeout(() => {
      setCheck(noteEl.dataset.id, noteEl.dataset.date || cursor, { note: noteEl.value });
      toast('메모 저장됨');
    }, 700);
    return;
  }
  const cntEl = ev.target.closest('[data-act="cntset"]');
  if (cntEl) {
    clearTimeout(inputTimer);
    inputTimer = setTimeout(() => {
      const t = state.tasks.find(x => x.id === cntEl.dataset.id);
      const d = cntEl.dataset.date || cursor;
      setCheck(cntEl.dataset.id, d, { count: Math.max(0, Number(cntEl.value) || 0), blocked: false });
      if (t) syncAuto(t, d);
      render();
    }, 600);
  }
});

/* 엔터 제출 */
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Enter') return;
  const t = ev.target;
  if (t.id === 'pin')   document.querySelector('[data-act="setpin"],[data-act="login"]')?.click();
  if (t.id === 'sName') document.querySelector('[data-act="addstaff"]')?.click();
  if (t.id === 'qAdd')  document.querySelector('[data-act="qadd"]')?.click();
});

/* 복귀 시 최신화 */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (!cursorPinned && cursor !== today()) { cursor = today(); render(); }
  sync.run();
});

/* ══════════════════════════════════════════════════════
   11. 시작
   ══════════════════════════════════════════════════════ */
load();
migrateLegacyStaffTokens();
absorbLinkParams();
const h = location.hash.replace('#/', '');
if (h) route = h;
if (session.isStaffLink && !['today', 'week'].includes(route)) route = 'today';
render();
if (migratedPersistentAdminSecret) {
  setTimeout(() => toast('기존 비밀키를 이번 탭 세션으로 옮기고 기기 저장에서 삭제했습니다'), 0);
}

let syncLoopStarted = false;
async function startSyncSession() {
  if (pendingBootstrapCode) {
    const code = pendingBootstrapCode;
    const previousToken = String(state.settings.myToken || '');
    pendingBootstrapCode = '';
    try {
      const exchanged = await sync.exchangeBootstrap(session.staffId, code);
      state.settings.myToken = exchanged.token;
      save();
      toast('개인 링크 인증을 완료했습니다');
    } catch (error) {
      // 교환 성공 전에는 기존 정상 세션을 유지한다. 토큰이 없을 때만 링크 만료 상태로 남는다.
      sync.err = String(error && error.message || error);
      render();
      toast('개인 링크를 열 수 없습니다 — ' + sync.err);
      if (!previousToken) return;
    }
  }
  if (!sync.enabled()) return;
  sync.run();
  if (!syncLoopStarted) {
    syncLoopStarted = true;
    setInterval(() => sync.run(), 45000);
  }
}
startSyncSession();

/* 순공시간 초 단위 표시 — 화면 전체를 다시 그리지 않고 숫자만 갈아끼운다 */
setInterval(() => {
  const el = $('#stTot');
  if (!el) return;
  const me = currentStaff();
  if (!me || !stRunning(me.id, today())) return;
  const secs = stSecs(me.id, today());
  el.textContent = fmtHMS(Object.values(secs).reduce((a, b) => a + b, 0));
  const chip = $('#stChipOn');
  const r = stRunning(me.id, today());
  if (chip && r) chip.textContent = '⏸ ' + r.subj + (secs[r.subj] ? ' ' + fmtHM(secs[r.subj]) : '');
}, 1000);

/* ── 새 버전 감지 ──
 * 단일 HTML이라 브라우저가 예전 파일을 계속 물고 있는 일이 잦다.
 * version.json을 주기적으로 확인해 새 버전이 올라오면 알려주고 한 번에 새로고침한다. */
const APP_VER = '2026-08-03.3';
function checkVersion() {
  fetch('../version.json?t=' + Date.now(), { cache: 'no-store' })
    .then(r => r.ok ? r.json() : null)
    .then(d => {
      if (!d || !d.v || d.v === APP_VER || document.getElementById('newver')) return;
      const el = document.createElement('div');
      el.className = 'newver'; el.id = 'newver';
      el.innerHTML = '<span>\uc0c8 \ubc84\uc804\uc774 \uc788\uc2b5\ub2c8\ub2e4 \u2014 \uc0c8\ub85c\uace0\uce68\ud558\uba74 \ubc14\ub85c \uc801\uc6a9\ub429\ub2c8\ub2e4</span>' +
        '<button type="button" id="verReload">\uc0c8\ub85c\uace0\uce68</button>';
      document.body.appendChild(el);
      document.getElementById('verReload').onclick = () => {
        location.replace(location.pathname + location.search.replace(/[?&]v=\d+/, '') +
          (location.search ? '&' : '?') + 'v=' + Date.now() + location.hash);
      };
    })
    .catch(() => {});
}
checkVersion();
setInterval(checkVersion, 10 * 60 * 1000);

</script>
