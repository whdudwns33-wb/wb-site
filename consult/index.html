async function saveConsultLinkContact(staffId, expectedUpdatedAt, button, clear, sendAfterSave) {
  if (!session.isAdmin || session.isStaffLink || consultLinkContactsUi.busy) return;
  const student = staffById(staffId);
  if (!student || student.deleted || student.owner || student.manager) return toast('학생을 다시 선택해 주세요');
  const phone = clear ? '' : String((($('#consultLinkPhone') || {}).value) || '').replace(/[\s()-]/g, '');
  const consent = clear ? false : !!(($('#consultLinkConsent') || {}).checked);
  if (!clear && !/^01[016789]\d{7,8}$/.test(phone)) return toast('올바른 휴대폰 번호를 입력해 주세요');
  if (!clear && !consent) return toast('발송 동의를 확인해 주세요');
  if (clear && !confirm('카카오 발송 동의를 철회하고 저장된 번호를 삭제할까요?')) return;
  const auth = sync.auth();
  if (!auth) return toast('로그인과 동기화 연결이 필요합니다');
  consultLinkContactsUi.busy = 'set:' + staffId;
  let savedForSend = false;
  if (button) button.disabled = true;
  try {
    const data = await sync.post('/consult-link-send', {
      app: SYNC_APP, auth: sync.auth(), action: 'set', staffId: staffId, phone: phone,
      consent: consent, expectedUpdatedAt: Number(expectedUpdatedAt) || 0
    });
    const row = consultLinkContactRow(Object.assign({ staffId: staffId }, data.contact || {}));
    if (row && row.phoneMasked) consultLinkContactsUi.rows.set(staffId, row);
    else consultLinkContactsUi.loaded = false;
    savedForSend = !!(row && row.phoneMasked && row.consent);
    closeModal();
    toast(clear ? '카카오 발송을 중지하고 번호를 삭제했습니다'
      : sendAfterSave ? '학생 연락처를 저장했습니다 · 개인 링크를 발송합니다'
      : '학생 연락처와 발송 동의를 저장했습니다');
    if (!consultLinkContactsUi.loaded) await loadConsultLinkContacts(true);
    else if (route === 'staff') render();
  } catch (error) {
    toast('수신번호를 저장하지 못했습니다 — ' + String(error && error.message || error));
    if (button) button.disabled = false;
  } finally {
    consultLinkContactsUi.busy = '';
    if (route === 'staff' && !$('#modalHost').firstElementChild) render();
  }
  if (savedForSend && sendAfterSave) await sendConsultStudentLink(staffId);
}

function consultLinkSendMessage(data) {
  const send = data && data.send && typeof data.send === 'object' ? data.send : data || {};
  const status = String(send.status || (data && data.status) || '').toLowerCase();
  if ((data && data.idempotent === true) || send.idempotent === true || status === 'idempotent') return '이미 같은 발송이 접수되어 중복 발송하지 않았습니다';
  if (status === 'accepted') return '솔라피에 카카오 알림톡이 접수되었습니다';
  if (status === 'dispatching') return '이미 솔라피 발송 접수 처리 중입니다';
  if (status === 'unknown') return '발송 결과를 확인할 수 없습니다 · 중복 발송하지 말고 솔라피 발송 내역을 확인해 주세요';
  if (status === 'rejected') return '솔라피에서 발송 요청을 접수하지 않았습니다';
  return '발송 요청 결과를 솔라피 발송 내역에서 확인해 주세요';
}

function consultLinkSendError(error) {
  const code = String((error && error.code) || '').toLowerCase();
  const status = String((error && error.remoteStatus) || '').toLowerCase();
  if (error && error.idempotent && status === 'accepted') return '이미 같은 발송이 접수되어 중복 발송하지 않았습니다';
  if (status === 'dispatching' || code.includes('dispatch')) return '이미 솔라피 발송 접수 처리 중입니다';
  if (status === 'unknown' || code.includes('unknown') || code.includes('uncertain') || code.includes('timeout') || code.includes('network')) {
    return '발송 결과를 확인할 수 없습니다 · 중복 발송하지 말고 솔라피 발송 내역을 확인해 주세요';
  }
  if (status === 'rejected' || code.includes('reject')) return '솔라피에서 발송 요청을 접수하지 않았습니다';
  return '개인 링크 발송을 접수하지 못했습니다 — ' + String(error && error.message || error);
}

async function sendConsultStudentLink(staffId) {
  if (!session.isAdmin || session.isStaffLink || consultLinkContactsUi.busy) return;
  const student = staffById(staffId);
  const contact = consultLinkContactsUi.rows.get(staffId);
  if (!student || student.deleted || student.owner || student.manager) return toast('학생을 다시 선택해 주세요');
  if (!contact || !contact.phoneMasked || !contact.consent) return consultLinkContactModal(staffId, true);
  if (!sync.auth()) return toast('로그인과 동기화 연결이 필요합니다');
  if (sync.busy) return toast('동기화가 끝난 뒤 다시 눌러 주세요');
  consultLinkContactsUi.busy = 'send:' + staffId;
  if (route === 'staff') render();
  try {
    await sync.run();
    if (sync.err) throw new Error('학생 정보를 먼저 동기화해 주세요');
    const data = await sync.post('/consult-link-send', {
      app: SYNC_APP, auth: sync.auth(), action: 'send', staffId: staffId
    });
    toast(consultLinkSendMessage(data));
  } catch (error) {
    toast(consultLinkSendError(error));
  } finally {
    consultLinkContactsUi.busy = '';
    if (route === 'staff') render();
  }
}

let modalReturnFocus = null;
let modalReturnHint = null;

function rememberModalReturnFocus(el) {
  modalReturnFocus = el && typeof el.focus === 'function' ? el : null;
  modalReturnHint = el && el.dataset ? {
    id: el.id || '', act: el.dataset.act || '', rowId: el.dataset.id || '', go: el.dataset.go || ''
  } : null;
}

function restoreModalReturnFocus() {
  const direct = modalReturnFocus;
  const hint = modalReturnHint;
  modalReturnFocus = null; modalReturnHint = null;
  requestAnimationFrame(() => {
    if (direct && direct.isConnected) return direct.focus();
    if (!hint) return;
    const candidates = Array.from(document.querySelectorAll('button, a, input, select, textarea'));
    const target = candidates.find(el =>
      (!hint.id || el.id === hint.id) && (!hint.act || el.dataset.act === hint.act) &&
      (!hint.rowId || el.dataset.id === hint.rowId) && (!hint.go || el.dataset.go === hint.go));
    if (target) target.focus();
  });
}

function modal(title, bodyHtml, footHtml) {
  const host = $('#modalHost');
  if (!host.firstElementChild) rememberModalReturnFocus(document.activeElement);
  host.innerHTML =
    '<div class="modal" data-act="closemodal"><div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1">' +
      '<div class="between mb14"><div class="card-title" id="modalTitle">' + esc(title) + '</div>' +
      '<button class="btn btn-sm btn-ghost" data-act="closemodal" aria-label="' + esc(title) + ' 닫기">닫기</button></div>' +
      bodyHtml + (footHtml || '') +
    '</div></div>';
  if (storageError) lockStorageFailureControls(true);
  requestAnimationFrame(() => {
    const box = host.querySelector('.modal-box');
    const first = box && box.querySelector('input:not([disabled]), textarea:not([disabled]), select:not([disabled]), button:not([disabled])');
    if (first) first.focus(); else if (box) box.focus();
  });
}
function closeModal() {
  if (saveFailedThisTurn) return false;
  clearSubmissionPreview();
  submissionForm = null; submissionReviewDraft = null;
  clearGuardianShareUi();
  $('#modalHost').innerHTML = '';
  restoreModalReturnFocus();
  return true;
}

function b64(str) { return btoa(unescape(encodeURIComponent(str))).replace(/\+/g, '-').replace(/\//g, '_'); }

/** 개인 링크. 예전에는 여기에 전체 접근 비밀키를 담았는데,
 *  링크 하나가 새면 전체가 열리는 구조라 학생별 토큰으로 바꿨다. */
function staffLink(id) {
  const s = staffById(id);
  const t = s && s.token ? '&t=' + encodeURIComponent(s.token) : '';
  return location.origin + location.pathname + '?u=' + id + t;
}
/** 학생 정보 동기화 뒤 새 개인 토큰을 발급한다. 저장된 토큰은 만료·해제됐을 수 있어 재사용하지 않는다. */
async function ensureTokens(ids) {
  if (sync.busy) throw new Error('동기화 중입니다. 잠시 후 다시 눌러 주세요');
  await sync.run();
  if (sync.err) throw new Error('학생 정보를 먼저 동기화해 주세요');
  const list = ids.map(id => staffById(id));
  if (list.some(s => !s || s.deleted)) throw new Error('대상을 찾을 수 없습니다');
  const tokens = await Promise.all(list.map(s => sync.issueToken(s.id)));
  const at = now();
  list.forEach((s, i) => { s.token = tokens[i]; s.updatedAt = at; });
  if (!save()) throw new Error('새 링크를 기기에 저장하지 못했습니다');
  queueSync();
  return tokens;
}
async function ensureToken(id) {
  return (await ensureTokens([id]))[0];
}

function reportText(staffId, date) {
  const s = staffById(staffId);
  const close = dailyCloseOf(staffId, date);
  const currentItems = dailyCloseStudyItems(staffId, date);
  const list = close.itemSnapshot.length ? close.itemSnapshot : currentItems.map(item => ({
    key: item.key, type: item.type, label: item.label, detail: item.detail,
    subjectKey: item.subjectKey, carriedFromDate: item.carriedFromDate || '',
    carryOriginDate: item.carryOriginDate || '', claimed: item.claimed !== false, done: item.done
  }));
  const done = list.filter(item => item.done).length;
  const pct = list.length ? Math.round(done / list.length * 100) : 0;
  let txt = '✅ ' + label(date) + ' 학습 수행 보고\n' + (s ? s.name + '\n' : '') +
    '완료 ' + done + '/' + list.length + '건 (' + pct + '%)\n' +
    '순공시간 ' + fmtDur(stTotal(staffId, date)) + '\n─────────\n';
  txt += list.map(item => {
    const resolution = close.resolutions[item.key] || {};
    const mark = item.done ? '✅' : resolution.type === 'carry' ? '↪' : resolution.type === 'blocked' ? '🚧' : resolution.type === 'closed' ? '⏹' : '⬜';
    const carriedDone = item.done && item.carriedFromDate ? ' [' + shortDate(item.carriedFromDate) + ' 이월 완료]' : '';
    const unclaimed = item.claimed === false;
    const result = resolution.type === 'carry'
      ? (unclaimed ? ' [미수락 · 내일로 이월]' : item.carriedFromDate ? ' [미완료 · 다시 이월]' : ' [미완료 · 내일로 이월]')
      : resolution.type === 'blocked' ? (unclaimed ? ' [미수락 · 막힘]' : ' [미완료 · 막힘]')
      : resolution.type === 'closed' ? (unclaimed ? ' [미수락 · 오늘 종료]' : ' [미완료 · 오늘 종료]') : '';
    return mark + ' ' + item.label + carriedDone + result + (resolution.note ? '\n   · ' + resolution.note : '');
  }).join('\n') || '(체크리스트가 비어 있음)';
  const events = dailyCloseEventRefs(staffId, date);
  if (events.length) {
    txt += '\n─────────\n📌 시험·중요 일정 준비율\n' + events.map(ref => {
      const value = Object.prototype.hasOwnProperty.call(close.eventProgress, ref.event.id)
        ? Number(close.eventProgress[ref.event.id]) : Number(ref.event.progress) || 0;
      return '· ' + ref.event.title + ' ' + monthDday(ref.event.date) + ' · 준비 ' + value + '%';
    }).join('\n');
  }
  return txt;
}

function briefText(date) {
  const list = teamStaff();
  let done = 0, total = 0;
  const pend = [], blocked = [], clear = [];
  list.forEach(s => {
    const p = progress(s.id, date);
    done += p.done; total += p.total;
    let hasPend = false;
    tasksFor(s.id, date).forEach(t => {
      const st = statusOf(t, date), c = getCheck(t.id, date), pr = taskProgress(t, c);
      if (st === 'done') return;
      hasPend = true;
      const line = '· ' + s.name + ' — ' + t.title + (t.time ? ' (' + t.time + ')' : '') +
        (st === 'doing' ? ' [진행 ' + pr.done + '/' + pr.total + pr.unit + ']' : '') +
        (c && c.note ? '\n   “' + c.note + '”' : '');
      (st === 'blocked' ? blocked : pend).push(line);
    });
    if (!hasPend && p.total) clear.push(s.name);
  });
  const pct = total ? Math.round(done / total * 100) : 0;

  let txt = '📊 ' + label(date) + ' 업무 마감 브리핑\n' +
    '전체 ' + total + '건 중 ' + done + '건 완료 (' + pct + '%)\n─────────\n';
  if (blocked.length) txt += '🚧 막힘 ' + blocked.length + '건 — 조치 필요\n' + blocked.join('\n') + '\n─────────\n';
  txt += pend.length ? '⚠️ 미완료 ' + pend.length + '건\n' + pend.join('\n') + '\n' : '✅ 미완료 없음\n';
  if (clear.length) txt += '─────────\n✅ 전원 완료: ' + clear.join(', ') + '\n';

  // 지시하지 않았는데 학생이 스스로 한 일
  const own = [];
  list.forEach(s => tasksFor(s.id, date).forEach(t => {
    if (t.origin !== 'staff') return;
    const st = statusOf(t, date);
    own.push('· ' + s.name + ' — ' + t.title + ' [' + STATUS_LABEL[st] + ']');
  }));
  if (own.length) txt += '─────────\n＋ 학생 추가 업무 ' + own.length + '건\n' + own.join('\n') + '\n';

  // 대표 본인 업무는 학생 통계와 섞지 않고 따로 붙인다
  const mineLines = [];
  owners().forEach(s => tasksFor(s.id, date).forEach(t => {
    const st = statusOf(t, date), c = getCheck(t.id, date), pr = taskProgress(t, c);
    mineLines.push('· ' + t.title + (t.time ? ' (' + t.time + ')' : '') +
      ' [' + STATUS_LABEL[st] + (st === 'doing' ? ' ' + pr.done + '/' + pr.total + pr.unit : '') + ']' +
      (c && c.note ? '\n   “' + c.note + '”' : ''));
  }));
  if (mineLines.length) txt += '─────────\n🙋 내 업무 ' + mineLines.length + '건\n' + mineLines.join('\n') + '\n';

  return txt;
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast('복사했습니다'); return true; }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let copied = false;
    try { copied = !!document.execCommand('copy'); toast(copied ? '복사했습니다' : '복사 실패 — 직접 선택해 주세요'); }
    catch (e2) { toast('복사 실패 — 직접 선택해 주세요'); }
    document.body.removeChild(ta);
    return copied;
  }
}

function saveEditedTask() {
  const isNew = !eForm.id;
  const title = ($('#eTitle').value || '').trim();
  const subjectKey = $('#eSubject').value || '';
  const resourceEl = $('#eResourceUrl');
  const rawResourceUrl = resourceEl ? (resourceEl.value || '').trim() : '';
  const resourceUrl = safeHttpsUrl(rawResourceUrl);
  if (!subjectKey || !STUDY_SUBJECTS[subjectKey]) return toast('과목 카테고리를 선택해 주세요');
  if (!title) return toast('공부 내용을 입력해 주세요');
  if (eForm.repeat === 'days' && !eForm.days.length) return toast('요일을 선택해 주세요');
  if (resourceEl && rawResourceUrl && !resourceUrl) return toast('자료 링크는 https://로 시작하는 안전한 주소만 쓸 수 있어요');

  let t;
  if (isNew) {
    const who = currentStaff();
    if (!who) return toast('학생을 먼저 선택해 주세요');
    t = {
      id: uid(), groupId: 'own-' + now(), staffId: who.id,
      steps: [], createdAt: now(), deleted: false,
      origin: actor(), requiresClaim: actor() !== 'staff'
    };
    state.tasks.push(t);
  } else {
    t = state.tasks.find(x => x.id === eForm.id);
    if (!t) return closeModal();
    if (!canEditTask(t)) { closeModal(); return toast('원장님이 내린 지시는 수정할 수 없습니다'); }
    if (t.source === 'exam_material' && resourceEl && !resourceUrl) return toast('시험대비자료의 보기 전용 링크를 넣어주세요');
    if (actor() === 'staff') t.lastEditBy = 'staff';
    else if (t.origin !== 'staff') t.lastEditBy = 'admin';
  }

  const learningTask = LEARNING_SOURCES[t.source] || null;
  const learningStart = $('#eStart').value || today();
  const learningDue = learningTask ? (($('#eLearningDue') && $('#eLearningDue').value) || learningStart) : '';
  if (learningTask && learningDue < learningStart) return toast('마감일은 학습 예정일보다 빠를 수 없습니다');
  const learningEstimatedMin = Math.max(10, Math.min(600, Number((($('#eEstimatedMin') || {}).value)) || 50));
  const academicId = learningTask ? (($('#eAcademicEvent') && $('#eAcademicEvent').value) || '') : '';
  const linkedExam = academicId ? state.tasks.find(row => !row.deleted && row.id === academicId &&
    row.kind === 'academic_event' && row.staffId === t.staffId) : null;

  // 같은 순서의 단계는 id를 물려줘서 이미 체크한 진행 상태를 잃지 않게 한다
  const oldSteps = t.steps || [];
  const labels = ($('#eSteps').value || '').split('\n').map(x => x.trim()).filter(Boolean);
  t.steps = labels.map((label, i) => ({ id: (oldSteps[i] && oldSteps[i].id) || uid(), label: label }));

  t.title = title;
  t.studySubject = subjectKey;
  t.detail = ($('#eDetail').value || '').trim();
  t.guide = ($('#eGuide').value || '').trim();
  if (resourceEl) t.resourceUrl = resourceUrl;
  t.target = Number($('#eTarget').value) || 0;
  t.unit = ($('#eUnit').value || '건').trim();
  t.time = $('#eTime').value || '';
  t.estimatedMin = learningEstimatedMin;
  t.priority = $('#ePri').value;
  t.repeat = eForm.repeat;
  t.days = eForm.days.slice().sort();
  if (learningTask) {
    const moveKey = weekMoveKey(t.staffId) + '|all';
    const moveCheck = state.checks[moveKey];
    if (moveCheck && Array.isArray(moveCheck.moves) && moveCheck.moves.some(move => move.taskId === t.id)) {
      state.checks[moveKey] = Object.assign({}, moveCheck, {
        moves: moveCheck.moves.filter(move => move.taskId !== t.id), updatedAt: now()
      });
    }
  }
  t.start = learningStart;
  if (learningTask) {
    t.dueDate = learningDue;
    t.academicEventId = linkedExam ? linkedExam.id : '';
    t.end = '';
  } else {
    t.end = $('#eEnd').value || '';
  }
  t.carry = eForm.carry;
  if (session.isAdmin) t.evidenceMode = eForm.evidenceMode ? 'photo' : '';
  t.updatedAt = now();

  const stored = save(); queueSync();
  if (!stored) return;
  eForm = null; closeModal(); render();
  toast(isNew ? '추가했습니다' : '수정했습니다');
}

/* ══════════════════════════════════════════════════════
   8-1. 말로 쓴 지시를 업무로 — 카톡 문장 해석
   ══════════════════════════════════════════════════════ */
const pad2 = n => String(n).padStart(2, '0');

/** "혜지쌤", "김혜지", "혜지 선생님" 모두 잡는다 */
function matchStaff(text) {
  const list = teamStaff();
  for (const s of list) if (text.includes(s.name)) return { s: s, token: s.name };
  for (const s of list) {
    const short = s.name.length >= 3 ? s.name.slice(1) : '';
    if (short.length >= 2 && text.includes(short)) return { s: s, token: short };
  }
  return null;
}

/** "3시까지", "오후 3시반", "15:00", "9시 30분" */
function matchTime(text) {
  let m = text.match(/(\d{1,2})\s*:\s*(\d{2})/);
  if (m) return { time: pad2(m[1]) + ':' + m[2], token: m[0] };

  m = text.match(/(오전|오후|아침|저녁|밤|낮)?\s*(\d{1,2})\s*시\s*(반|\d{1,2}\s*분)?/);
  if (!m) return null;
  let h = Number(m[2]);
  const mer = m[1] || '';
  if (/오후|저녁|밤/.test(mer)) { if (h < 12) h += 12; }
  else if (/오전|아침/.test(mer)) { if (h === 12) h = 0; }
  else if (h >= 1 && h <= 7) h += 12;   // 오후에 도는 센터라 한 자리 시각은 오후로 본다
  let mm = '00';
  if (m[3]) mm = m[3] === '반' ? '30' : pad2(parseInt(m[3], 10));
  return { time: pad2(h) + ':' + mm, token: m[0] };
}

/** "40분", "1시간 20분" — 공부에 필요한 예상시간 */
function matchDuration(text) {
  let m = text.match(/(\d+(?:\.\d+)?)\s*시간(?:\s*(\d{1,2})\s*분)?/);
  if (m) return { minutes: Math.min(600, Math.max(10, Math.round(Number(m[1]) * 60 + Number(m[2] || 0)))), token: m[0] };
  m = text.match(/(\d{1,3})\s*분(?:간)?/);
  if (m) return { minutes: Math.min(600, Math.max(10, Number(m[1]))), token: m[0] };
  return null;
}

/** "오늘", "내일", "모레", "금요일", "8월 3일" */
function matchDate(text) {
  if (/오늘/.test(text)) return { date: today(), token: '오늘' };
  if (/내일/.test(text)) return { date: addDays(today(), 1), token: '내일' };
  if (/모레/.test(text)) return { date: addDays(today(), 2), token: '모레' };

  const dw = text.match(/([일월화수목금토])\s*요일/);
  if (dw) {
    const want = DOW.indexOf(dw[1]);
    for (let i = 1; i <= 7; i++) {
      const c = addDays(today(), i);
      if (dowOf(c) === want) return { date: c, token: dw[0] };
    }
  }
  const md = text.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
  if (md) return { date: new Date().getFullYear() + '-' + pad2(md[1]) + '-' + pad2(md[2]), token: md[0] };
  return null;
}

function cleanTitle(s) {
  return String(s)
    .replace(/(쌤|선생님|샘)/g, ' ')
    .replace(/(긴급히?|급히|급하게|asap)/gi, ' ')   // 중요 표시로 이미 잡히므로 제목에서는 뺀다
    .replace(/^[\s,.·\-~]*(에게|한테|께)?\s*/, '')
    .replace(/\s*(좀|까지|안에|전에)\s*/g, ' ')
    .replace(/\s*(부탁\s*(해요|드려요|드립니다|합니다|해)|해\s*주세요|해주세요|해줘요|해줘|하세요|해주시고|해주시면|바랍니다)\s*[.!~]*$/, '')
    .replace(/\s+/g, ' ')
    .replace(/[\s.,!~]+$/, '')
    .trim();
}

/** 한 줄에 한 건. 이름·시간·날짜를 뽑고 나머지를 업무 이름으로 쓴다. */
function parseInstructions(text) {
  return String(text || '').split('\n').map(l => l.trim()).filter(Boolean).map(line => {
    let rest = line;
    const sm = matchStaff(rest); if (sm) rest = rest.replace(sm.token, ' ');
    const tm = matchTime(rest);  if (tm) rest = rest.replace(tm.token, ' ');
    const dm = matchDate(rest);  if (dm) rest = rest.replace(dm.token, ' ');
    const duration = matchDuration(rest); if (duration) rest = rest.replace(duration.token, ' ');
    const title = cleanTitle(rest);
    return {
      staff: sm ? sm.s.name : '',
      title: title || line,
      studySubject: inferStudySubjectFromText(title || line),
      estimatedMin: duration ? duration.minutes : 50,
      time: tm ? tm.time : '',
      start: dm ? dm.date : today(),
      repeat: 'once',
      priority: /긴급|급하|급히|중요|바로|asap/i.test(line) ? 'high' : 'normal',
      carry: true,
      raw: line
    };
  });
}

function applyAssignments(input, preConfirmed) {
  let data = input;
  if (typeof input === 'string') {
    try { data = JSON.parse(input); }
    catch (e) { return toast('JSON 형식이 잘못되었습니다'); }
  }
  const list = Array.isArray(data) ? data : (data.assignments || []);
  if (!list.length) return toast('가져올 공부가 없습니다');

  const missing = [...new Set(list.map(item => String(item.staff || '').trim()).filter(name => {
    const student = name && staffByName(name);
    return !student || student.owner;
  }))];
  if (missing.length) return toast('등록된 학생 이름을 확인해 주세요: ' + missing.map(name => name || '(이름 없음)').join(', '));

  const queued = list.map(item => {
    const student = staffByName(item.staff);
    const title = String(item.title || '').trim();
    if (!title) return null;
    const subjectKey = studySubjectKey(item.studySubject || item.subject || inferStudySubjectFromText(title + ' ' + String(item.detail || '')));
    const steps = (item.steps || []).map(value => ({
      id: uid(), label: typeof value === 'string' ? value : String(value.label || '')
    })).filter(step => step.label);
    const start = /^\d{4}-\d{2}-\d{2}$/.test(item.start || '') && item.start >= today() ? item.start : today();
    const days = Array.isArray(item.days) ? item.days.map(Number).filter(day => day >= 0 && day <= 6) : [];
    const repeat = item.repeat === 'days' && !days.length ? 'once'
      : ['once', 'daily', 'weekday', 'days'].includes(item.repeat) ? item.repeat : 'once';
    const estimatedMin = Math.max(10, Math.min(600, Number(item.estimatedMin) || 50));
    return {
      title: title,
      studySubject: subjectKey,
      estimatedMin: estimatedMin,
      detail: String(item.detail || ''),
      guide: String(item.guide || ''),
      steps: steps,
      target: Number(item.target) || 0,
      unit: String(item.unit || '건'),
      time: String(item.time || ''),
      priority: item.priority === 'high' ? 'high' : 'normal',
      repeat: repeat,
      days: days,
      start: start,
      end: repeat !== 'once' && /^\d{4}-\d{2}-\d{2}$/.test(item.end || '') && item.end >= start ? item.end : '',
      carry: item.carry !== false,
      evidenceMode: session.isAdmin && item.evidenceMode === 'photo' ? 'photo' : '',
      staffIds: [student.id], names: [student.name]
    };
  }).filter(Boolean);
  if (queued.length !== list.length) return toast('제목이 없는 공부가 있습니다. 내용을 확인해 주세요');

  draft.push(...queued);
  closeModal();
  if (route !== 'write') route = 'write';
  render();
  toast(queued.length + '건을 발행 대기에 담았습니다');
}

      (t.steps || []).forEach(s => { steps[s.id] = turnOn; });
      setCheck(id, date, {
        done: turnOn, at: turnOn ? now() : null,
        steps: steps,
        count: t.target ? (turnOn ? t.target : 0) : ((c && c.count) || 0),
        blocked: turnOn ? false : (c ? c.blocked : false)
      });
      const running = stRunning(t.staffId, date);
      if (turnOn && running && running.taskId === t.id) stStop(t.staffId, date);
      if (turnOn) syncLinkedStudyTask(t, date);
      render();
      break;
    }
    case 'step': {
      const t = task(); if (!t) break;
      const c = getCheck(id, date);
      const cur = Object.assign({}, (c && c.steps) || {});
      const k = el.dataset.step;
      cur[k] = !cur[k];
      setCheck(id, date, { steps: cur, blocked: false });
      syncAuto(t, date);
      if (isDone(t.id, date)) {
        const running = stRunning(t.staffId, date);
        if (running && running.taskId === t.id) stStop(t.staffId, date);
        syncLinkedStudyTask(t, date);
      }
      render();
      break;

      const c = getCheck(id, date);

      syncAuto(t, date);

      const resolutionEls = [...document.querySelectorAll('[data-daily-resolution]')];

      const nextResolutions = Object.assign({}, data.close.resolutions);
      for (const item of data.incomplete) {
        const select = resolutionEls.find(input => input.dataset.key === item.key);

          subjectKey: item.subjectKey, itemType: item.type, claimed: item.claimed !== false, at: now()

          if (type === 'closed') setCheck(item.id, cursor, { blocked: false, dropped: true, dropReason: 'daily-close', droppedAt: now(), note: note });

        nextEventProgress[ref.event.id] = value;
        ref.event.progress = value;
        const history = Array.isArray(ref.event.progressHistory) ? ref.event.progressHistory.slice() : [];
        ref.event.progressHistory = history.filter(row => !(row && row.date === cursor && row.source === 'student'))

        ref.event.progressConfirmedAt = now();
        ref.event.progressConfirmedDate = cursor;
        changedPlans.set(ref.ym, ref.plan);

      changedPlans.forEach((plan, ym) => setCheck(monthPlanKey(me.id), ym, { plan: plan, done: true }));

        carryOriginDate: item.carryOriginDate || '', claimed: item.claimed !== false, done: item.done
      }));
      Object.keys(nextResolutions).forEach(key => {
        if (snapshot.some(item => item.key === key)) return;

          key: key, type: resolution.itemType || 'task', label: resolution.label || '이월한 공부',

          claimed: resolution.claimed !== false, done: false

        status: 'reviewed', resolutions: nextResolutions, eventProgress: nextEventProgress,

        finalizedAt: null, signature: ''
      });

      setCheck(dailyCloseKey(me.id), cursor, { close: nextClose, done: true });

          return toast('이전 미마감 날짜를 먼저 마무리해 주세요');
        }
        const data = dailyCloseState(me.id, cursor);
        if (!data.canReport && !data.complete) return toast('오늘 마무리 단계를 먼저 완료해 주세요');
        dailyReportModal(me.id, cursor);

      const reportDate = cursor;
      copy($('#mText').value).then(copied => {

        const fresh = dailyCloseState(me.id, reportDate);

        const nextClose = Object.assign({}, fresh.close, { reportCopiedAt: now(), copySignature: fresh.signature });

      if (!data.canReport && !data.complete) return toast('오늘 기록이 바뀌었습니다. 마무리를 다시 확인해 주세요');
      const nextClose = Object.assign({}, data.close, {
        status: 'complete', finalizedAt: now(), signature: data.signature
      });
      setCheck(dailyCloseKey(me.id), cursor, { close: nextClose, done: true });
      const closedPastDate = cursor < today();
      const weekMon = mondayOf(closedDate);

      break;
    }
    case 'wadd': {
      const title = ($('#wTitle').value || '').trim();
      const subjectKey = $('#wSubject').value || '';
      const estimatedMin = Number($('#wEstimatedMin').value) || 0;
      if (!wForm.staff.length) return toast('받는 학생을 선택해 주세요');
      if (!subjectKey || !STUDY_SUBJECTS[subjectKey]) return toast('과목 카테고리를 선택해 주세요');
      if (!title) return toast('공부 내용을 입력해 주세요');
      if (estimatedMin < 10 || estimatedMin > 600) return toast('예상 소요시간은 10분부터 600분 사이로 입력해 주세요');
      if (wForm.repeat === 'days' && !wForm.days.length) return toast('요일을 선택해 주세요');
      wForm.start = $('#wStart').value || today();
      if (!/^\d{4}-\d{2}-\d{2}$/.test(wForm.start) || wForm.start < today()) return toast('학습 예정일은 오늘 이후로 선택해 주세요');
      wForm.end = (wForm.repeat === 'once' ? '' : ($('#wEnd').value || ''));
      if (wForm.end && wForm.end < wForm.start) return toast('반복 종료일은 학습 예정일보다 빠를 수 없습니다');
      wForm.subject = subjectKey;
      wForm.estimatedMin = estimatedMin;
      const nextDraft = {
        title: title,
        studySubject: subjectKey,
        estimatedMin: estimatedMin,
        detail: ($('#wDetail').value || '').trim(),
        guide: ($('#wGuide').value || '').trim(),
        steps: ($('#wSteps').value || '').split('\n').map(x => x.trim()).filter(Boolean)
                 .map(l => ({ id: uid(), label: l })),
        target: Number($('#wTarget').value) || 0,
        unit: ($('#wUnit').value || '건').trim(),
        time: $('#wTime').value || '',
        priority: $('#wPri').value,
        repeat: wForm.repeat,
        days: wForm.days.slice().sort(),
        start: wForm.start,
        end: wForm.end,
        carry: wForm.carry,
        evidenceMode: session.isAdmin && wForm.evidenceMode ? 'photo' : '',
        staffIds: wForm.staff.slice(),
        names: wForm.staff.map(x => (staffById(x) || {}).name).filter(Boolean)
      };
      if (wEditIndex >= 0 && draft[wEditIndex]) draft[wEditIndex] = nextDraft;
      else draft.push(nextDraft);
      const edited = wEditIndex >= 0;
      wEditIndex = -1;
      render();
      toast(edited ? '배부 대기 내용을 수정했습니다' : '발행 대기에 담았습니다 (' + draft.length + '건)');
      break;
    }
    case 'wedit': {
      const index = Number(el.dataset.i), item = draft[index];
      if (!item) break;
      wEditIndex = index;
      Object.assign(wForm, {
        staff: item.staffIds.slice(), subject: item.studySubject, repeat: item.repeat, days: item.days.slice(),
        start: item.start, end: item.end, estimatedMin: item.estimatedMin || 50,
        carry: item.carry !== false, evidenceMode: item.evidenceMode === 'photo'
      });
      render();
      setTimeout(() => $('#writeComposer')?.scrollIntoView({ block: 'start', behavior: 'smooth' }), 0);
      break;
    }
    case 'weditcancel': wEditIndex = -1; render(); break;
    case 'wcopy': {
      const item = draft[Number(el.dataset.i)];
      if (!item) break;
      draft.push(Object.assign({}, item, {
        steps: (item.steps || []).map(step => ({ id: uid(), label: step.label })),
        staffIds: item.staffIds.slice(), names: item.names.slice(), days: item.days.slice()
      }));
      render(); toast('같은 공부를 복제했습니다');
      break;
    }
    case 'wdel': removeWriteDraft(Number(el.dataset.i)); renderWritePreservingInputs(); break;
    case 'wclear': draft = []; wEditIndex = -1; renderWritePreservingInputs(); break;
    case 'wpublish': {
      if (!draft.length) return;
      const gid = uid(), published = [];
      draft.forEach(d => d.staffIds.forEach(sid => {
        const task = {
          id: uid(), groupId: gid, staffId: sid,
          title: d.title, detail: d.detail, guide: d.guide,
          studySubject: d.studySubject,
          estimatedMin: d.estimatedMin,
          steps: (d.steps || []).map(s => ({ id: uid(), label: s.label })),
          target: d.target, unit: d.unit,
          time: d.time, priority: d.priority,
          repeat: d.repeat, days: d.days, start: d.start, end: d.end, carry: d.carry,
          evidenceMode: d.evidenceMode || '',
          origin: session.isStaffLink ? 'manager' : 'admin', requiresClaim: true,
          createdAt: now(), updatedAt: now(), deleted: false
        };
        state.tasks.push(task);
        published.push(task);
      }));
      const n = draft.length;
      draft = [];
      wEditIndex = -1;
      save(); queueSync(); render();
      toast(n + '건 발행 완료');
      setTimeout(() => writePublishedResult(published), 300);
      break;
    }

    /* 비공개 질문 · 인증사진 */
    case 'submissionquestion': {
      if (!session.isStaffLink) break;
      submissionModal('question', '', '');
      break;
    }
    case 'performanceinstruction': {
      if (!session.isStaffLink || isManager()) break;
      const task = state.tasks.find(row => !row.deleted && row.id === id && row.staffId === session.staffId &&
        row.kind === 'academic_event' && row.academicType === 'performance');
      if (!task) return toast('수행평가 일정을 다시 확인해 주세요');
      submissionModal('question', task.id, academicDateOf(task));
      break;
    }
    case 'submissionproof': {
      if (!session.isStaffLink) break;
      const task = state.tasks.find(row => row.id === el.dataset.id && row.staffId === session.staffId);
      const date = el.dataset.date || cursor;
      if (!task || task.evidenceMode !== 'photo') return toast('인증이 필요한 할 일을 다시 확인해 주세요');
      submissionModal('proof', task.id, date);
      break;
    }
    case 'submissionsubmit': submitSubmissionForm(el); break;
    case 'submissionview': showSubmissionPhoto(el.dataset.id); break;
    case 'submissionrefresh': {
      const me = currentStaff();
      const owner = session.isAdmin && route === 'board' ? '*' : (me && me.id);
      if (owner) loadSubmissions(owner, true);
      break;
    }
    case 'submissionreview': {
      if (!session.isAdmin) break;
      const item = submissionCache.items.find(row => row.id === el.dataset.id);
      if (item) submissionReviewModal(item, el.dataset.v);
      break;
    }
    case 'submissionreviewsave': saveSubmissionReview(); break;
    case 'submissioncancel': {
      const item = submissionCache.items.find(row => row.id === el.dataset.id);
      cancelSubmission(item);
      break;
    }

    /* 설정 */
    case 'savecfg': {
      state.settings.syncSecret = ($('#cfgSecret').value || '').trim();
      state.settings.adminToken = '';
      save(); render(); toast('저장했습니다');
      if (state.settings.syncSecret) { sync.loud = true; sync.run(); }
      break;
    }
    case 'syncretry': {
      if (!sync.enabled()) return toast('먼저 로그인하거나 동기화 연결을 복구해 주세요');
      sync.loud = true; sync.run(); toast('동기화를 다시 시도합니다…');
      break;
    }
    case 'storagehelp': {
      if (session.isAdmin) go('settings');
      else toast('기기 저장 실패 · 화면을 닫지 말고 원장에게 알려 주세요');
      break;
    }
    case 'storageretry': {
      if (!save()) break;
      queueSync(); closeModal(); render(); toast('기기 저장을 다시 완료했습니다');
      break;
    }
    case 'syncnow': sync.loud = true; sync.run(); toast('동기화 중…'); break;
    case 'export': {
      if (!session.isAdmin || session.isStaffLink) return toast('백업은 원장 화면에서만 할 수 있습니다');
      const blob = new Blob([JSON.stringify(sanitizedBackupState(state), null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      const url = URL.createObjectURL(blob);
      a.href = url;
      a.download = 'wb-컨설팅플래너-' + today() + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      break;
    }
    case 'import': {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = 'application/json';
      inp.onchange = () => {
        const f = inp.files[0]; if (!f) return;
        const r = new FileReader();
        r.onload = () => {
          try {
            const p = JSON.parse(r.result);
            if (!p || !Array.isArray(p.staff)) throw new Error('형식 오류');
            if (!confirm('현재 데이터를 덮어씁니다. 계속할까요?')) return;
            state = mergeImportedState(p, state);
            save(); render(); toast('불러왔습니다');
          } catch (e) { toast('파일을 읽을 수 없습니다'); }
        };
        r.readAsText(f);
      };
      inp.click();
      break;
    }
    case 'closemodal': closeModal(); break;
  }
});

document.addEventListener('change', ev => {
  if (ev.target.id === 'ingImages') {
    const files = ev.target.files ? Array.from(ev.target.files) : [];
    const out = $('#ingImageOut');
    if (out) out.textContent = files.length
      ? (files.length > 6 ? '사진은 최대 6장까지 선택할 수 있습니다.' : files.length + '장 선택됨 · 선택한 순서대로 읽습니다.')
      : '스크린샷·사진을 순서대로 최대 6장 선택하세요.';
    return;
  }
  if (ev.target.id !== 'submissionFile') return;
  clearSubmissionPreview();
  const file = ev.target.files && ev.target.files[0];
  const preview = $('#submissionPreview');
  if (!preview) return;
  if (!file) { preview.innerHTML = '<span class="small muted">촬영하거나 앨범에서 사진을 선택하세요.</span>'; return; }
  if (!String(file.type || '').startsWith('image/')) { preview.innerHTML = '<span class="small muted">사진 파일만 선택해 주세요.</span>'; return; }
  submissionPreviewUrl = URL.createObjectURL(file);
  preview.innerHTML = '<img src="' + esc(submissionPreviewUrl) + '" alt="선택한 사진 미리보기">';
});

/* 메모 · 수량 직접 입력 */
let inputTimer = null;
document.addEventListener('input', ev => {
  if (ev.target.closest && ev.target.closest('#view') && ev.target.matches('input, textarea, select, [contenteditable="true"]')) {
    viewInputDirty = true;
  }
  if (ev.target.id === 'ingText') { ingPasteSeq++; ingShowParsePreview(); return; }
  if (ev.target.closest && ev.target.closest('#ingAvailEditor')) { ingAvailRefreshPreview(); return; }
  if (ev.target.id.startsWith('examPlan')) {
    const preview = $('#examPlanPreview');
    if (preview) renderExamPlanPreview(preview.dataset.exam);
    return;
  }
  if ($('#materialRequestPreview') && (ev.target.id.startsWith('material') || ev.target.matches('[data-material-type]'))) {
    renderMaterialRequestPreview();
    return;
  }
  if (ev.target.id === 'ingShiftFrom' || ev.target.id === 'ingShiftDays') {
    const preview = $('#ingShiftPreview'); if (preview) ingShiftRender(preview.dataset.sid);
    return;
  }
  const noteEl = ev.target.closest('[data-act="note"]');
  if (noteEl) {
    clearTimeout(inputTimer);
    inputTimer = setTimeout(() => {
      const stored = setCheck(noteEl.dataset.id, noteEl.dataset.date || cursor, { note: noteEl.value });
      if (stored) { viewInputDirty = false; toast('메모 저장됨'); }
    }, 700);
    return;
  }
  const cntEl = ev.target.closest('[data-act="cntset"]');
  if (cntEl) {
    clearTimeout(inputTimer);
    inputTimer = setTimeout(() => {
      const t = state.tasks.find(x => x.id === cntEl.dataset.id);
      const d = cntEl.dataset.date || cursor;
      setCheck(cntEl.dataset.id, d, { count: Math.max(0, Number(cntEl.value) || 0), blocked: false });
      if (t) {
        syncAuto(t, d);
        if (isDone(t.id, d)) {
          const running = stRunning(t.staffId, d);
          if (running && running.taskId === t.id) stStop(t.staffId, d);
          syncLinkedStudyTask(t, d);
        }
      }
      render();
    }, 600);
  }
});

document.addEventListener('change', ev => {
  if (ev.target.closest && ev.target.closest('#view') && ev.target.matches('input, textarea, select')) viewInputDirty = true;
});

/* 모달 키보드 이동 · 엔터 제출 */
document.addEventListener('keydown', ev => {
  const box = document.querySelector('#modalHost .modal-box');
  if (box) {
    if (ev.key === 'Escape') { ev.preventDefault(); closeModal(); return; }
    if (ev.key === 'Tab') {
      const focusable = Array.from(box.querySelectorAll(
        'button:not([disabled]), a[href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
      )).filter(el => {
        const style = window.getComputedStyle(el);
        return !el.hidden && el.getAttribute('aria-hidden') !== 'true' && style.display !== 'none' && style.visibility !== 'hidden';
      });
      if (!focusable.length) { ev.preventDefault(); box.focus(); return; }
      const first = focusable[0], last = focusable[focusable.length - 1];
      if (ev.shiftKey && (document.activeElement === first || !box.contains(document.activeElement))) {
        ev.preventDefault(); last.focus(); return;
      }
      if (!ev.shiftKey && (document.activeElement === last || !box.contains(document.activeElement))) {
        ev.preventDefault(); first.focus(); return;
      }
    }
  }
  if (ev.key !== 'Enter') return;
  const t = ev.target;
  if (t.id === 'pin' || t.id === 'loginId') document.querySelector('[data-act="login"]')?.click();
  if (t.id === 'sName') document.querySelector('[data-act="addstaff"]')?.click();
  if (t.id === 'qAdd')  document.querySelector('[data-act="qadd"]')?.click();
});

/* 복귀 시 최신화 */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (!cursorPinned && cursor !== today()) {
    cursor = today();
    if (activeViewEditor()) sync.pendingRender = true; else render();
  }
  sync.run();
});

/* ══════════════════════════════════════════════════════
   11. 시작
   ══════════════════════════════════════════════════════ */
load();
if (ensureRecentDailyCarryTasks()) { save(); queueSync(); }
absorbLinkParams();
const h = routeFromHash(location.hash);
if (h) route = h;
if (pendingStudentWelcome && session.isStaffLink && !isManager()) {
  route = 'guide';
}
if (session.isStaffLink && !['guide', 'today', 'week', 'month', 'academic', 'ingang', 'study', 'write', 'board'].includes(route)) route = 'today';
render();
connectAdminDevice();
if (pendingStudentCode) {
  connectStudentLink();
} else if (sync.enabled() && !studentConnectError) {
  sync.run().then(() => {
    if (pendingStudentWelcome && session.isStaffLink && !isManager() && !sync.err) {
      startStudentSetup(session.staffId);
      if (route === 'guide') render();
    }
  });
}
setInterval(() => sync.run(), 45000);

/* 순공시간 초 단위 표시 — 숫자는 매초, 시간표는 분이 바뀔 때만 갱신한다 */
let lastTimelineMinute = -1;
setInterval(() => {
  const totalEls = document.querySelectorAll('[data-st-total][data-st-date="' + today() + '"]');
  if (!totalEls.length) return;
  const me = currentStaff();
  if (!me || !stRunning(me.id, today())) return;
  const secs = stSecs(me.id, today());
  const totalText = fmtHMS(Object.values(secs).reduce((a, b) => a + b, 0));
  totalEls.forEach(el => { el.textContent = totalText; });
  const minuteNow = Math.floor(now() / 60000);
  const timeline = $('#studyTimeline');
  if (timeline && minuteNow !== lastTimelineMinute) {
    timeline.innerHTML = studyTimelineRows(me.id, today());
    lastTimelineMinute = minuteNow;
  }
  const chip = $('#stChipOn');
  const r = stRunning(me.id, today());
  if (chip && r) {
    const shown = (r.subj === '탐구' || r.subj === 'explore') ? '사회' : r.subj;
    const key = studySubjectKey(shown);
    const shownSecs = STUDY_SUBJECTS[key].label === shown ? stCategorySecs(secs)[key] : secs[r.subj];
    chip.textContent = '⏸ ' + shown + (shownSecs ? ' ' + fmtHM(shownSecs) : '');
  }
}, 1000);

/* ── 새 버전 감지 ──
 * consult 배포가 task 앱의 캐시 버전을 건드리지 않도록 전용 파일을 쓴다. */
const APP_VER = '2026-08-31.1';
function checkVersion() {
  fetch('./version.json?t=' + Date.now(), { cache: 'no-store' })
    .then(r => r.ok ? r.json() : null)
    .then(d => {
      if (!d || !d.v || d.v === APP_VER || document.getElementById('newver')) return;
      const el = document.createElement('div');
      el.className = 'newver'; el.id = 'newver';
      el.innerHTML = '<span>\uc0c8 \ubc84\uc804\uc774 \uc788\uc2b5\ub2c8\ub2e4 \u2014 \uc0c8\ub85c\uace0\uce68\ud558\uba74 \ubc14\ub85c \uc801\uc6a9\ub429\ub2c8\ub2e4</span>' +
        '<button type="button" id="verReload">\uc0c8\ub85c\uace0\uce68</button>';
      document.body.appendChild(el);
      document.getElementById('verReload').onclick = () => {
        const next = new URL(location.href);
        next.searchParams.set('v', String(Date.now()));
        location.replace(next.pathname + next.search + next.hash);
      };
    })
    .catch(() => {});
}
checkVersion();
setInterval(checkVersion, 10 * 60 * 1000);
