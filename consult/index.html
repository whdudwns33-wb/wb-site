/** 주간 순공 통계 — 일별 막대 + 과목별 합계 */
function stWeekCard(me, days) {
  const per = days.map(d => ({ d: d, secs: stTotal(me.id, d) }));
  const sum = per.reduce((a, x) => a + x.secs, 0);
  if (!sum) return '';
  const max = Math.max.apply(null, per.map(x => x.secs)) || 1;
  const bySubj = Object.fromEntries(STUDY_SUBJECT_KEYS.map(key => [key, 0]));
  days.forEach(d => {
    const daily = stCategorySecs(stSecs(me.id, d));
    STUDY_SUBJECT_KEYS.forEach(key => { bySubj[key] += daily[key] || 0; });
  });
  const goal = stGoalMin(me.id) * 60;
  const met = goal ? per.filter(x => x.secs >= goal).length : 0;

  return '<div class="card"><div class="between mb8">' +
      '<div class="card-title">⏱ 이번 주 순공시간</div>' +
      '<div class="pill">' + fmtDur(sum) + '</div></div>' +
    '<div class="row" style="align-items:flex-end;gap:6px;height:88px;margin-bottom:6px">' +
      per.map(x => '<div style="flex:1;text-align:center">' +
        '<div style="height:64px;display:flex;align-items:flex-end;justify-content:center">' +
          '<div title="' + fmtDur(x.secs) + '" style="width:70%;border-radius:5px 5px 0 0;background:' +
            (x.d === today() ? 'var(--navy)' : 'var(--blue)') + ';opacity:' + (x.secs ? 1 : .18) +
            ';height:' + Math.max(3, Math.round(x.secs / max * 64)) + 'px"></div></div>' +
        '<div class="small muted" style="margin-top:3px">' + DOW[dowOf(x.d)] + '</div></div>').join('') +
    '</div>' +
    '<div class="small muted" style="text-align:center;margin-bottom:10px">하루 평균 ' +
      fmtDur(Math.round(sum / 7)) + (goal ? ' · 목표 달성 ' + met + '일' : '') + '</div>' +
    '<hr class="sep">' +
    STUDY_SUBJECT_KEYS.filter(key => bySubj[key] > 0).sort((a, b) => bySubj[b] - bySubj[a]).map(key =>
      '<div class="between small" style="padding:3px 0"><span>' + STUDY_SUBJECTS[key].label + '</span>' +
      '<span class="pill">' + fmtDur(bySubj[key]) + '</span></div>').join('') +
    '</div>';
}

/** 과목별 시간 직접 수정 — 정지를 깜빡했거나 앱 없이 공부한 날을 보정한다 */
function stEditModal(sid) {

}

/* ══════════════════════════════════════════════════════
   인강 플래너
   원본 앱(Flask+SQLite)의 핵심 설계를 그대로 옮겼다.
   · 강좌(courses) ↔ 배정(plan)을 분리한다 — 같은 강좌를 여러 학생에게
     다른 일정으로 배정해도 강의 데이터가 중복되지 않는다.
   · 강의는 3단계 상태를 갖는다: 미배정 / 배정됨(미완료) / 완료
   원본에 없던 두 가지를 더했다: 목표일 역산, 밀림 3일 이상 강조.
   ══════════════════════════════════════════════════════ */
const ING_PLATFORMS = ['엘리하이', '엠베스트', '메가스터디', '이투스', '대성마이맥', '기타'];
const ING_PROVIDER_URLS = {
  '이투스': 'https://www.etoos.com/lecture/TotalLecture.asp',
  '메가스터디': 'https://www.megastudy.net/lecbookSearch/main.asp',
  '대성마이맥': 'https://www.mimacstudy.com/common/getMenuContainer.ds?requestMenuId=MNMN_M004',
  '엠베스트': 'https://www.mbest.co.kr/lecture/coursemap/main.asp',
  '엘리하이': 'https://mjr.mbest.co.kr/lecture/list/lecture_list.asp'
};
const ING_PROVIDER_DOMAINS = {
  '이투스': 'etoos.com', '메가스터디': 'megastudy.net', '대성마이맥': 'mimacstudy.com',
  '엠베스트': 'mbest.co.kr', '엘리하이': 'mjr.mbest.co.kr'
};
const ING_LATE_WARN = 3;   // 이 일수 이상 밀리면 강조한다
const ING_WEEK_DAYS = [1, 2, 3, 4, 5, 6, 0]; // 월 ~ 일
const ING_DEFAULT_MIN = 50;
const ING_BUFFER_MIN = 10;
const ING_MIN_FREE = 20;
const ING_CAL_HOUR_PX = 60;
const ING_MIN_TOUCH_PX = 44;
let ingWeekAnchor = today();
let ingCalDay = (dowOf(today()) + 6) % 7;
let ingLibraryFilter = 'active';
let ingOpenCourseId = '';

function ingProviderUrlMatches(platform, url) {
  if (!url || platform === '기타') return true;
  const domain = ING_PROVIDER_DOMAINS[platform];
  if (!domain) return false;
  const host = new URL(url).hostname.toLowerCase();
  const elihighHost = host === 'mjr.mbest.co.kr' || host.endsWith('.mjr.mbest.co.kr') ||
    host === 'junior.mbest.co.kr' || host.endsWith('.junior.mbest.co.kr');
  if (platform === '엘리하이') return elihighHost;
  if (platform === '엠베스트' && elihighHost) return false;
  return host === domain || host.endsWith('.' + domain);
}

const ingKey = sid => '__ing__' + sid;          // 강좌·강의 목록
const ingPlanKey = sid => '__ingp__' + sid;     // 날짜별 배정
const ingAvailKey = sid => '__ingavail__' + sid; // 반복 주간 고정 일정
const ingNoteKey = sid => '__ingnote__' + sid;  // 회차별 학생 질문·메모
const ingCourses = sid => ((state.checks[ingKey(sid) + '|all'] || {}).courses) || [];
const ingPlan = (sid, date) => ((state.checks[ingPlanKey(sid) + '|' + date] || {}).items) || [];
const ingSet = sid => Object.assign({ days: [1, 2, 3, 4, 5], perDay: 2 },
  (state.checks['__ingset__' + sid + '|all'] || {}).set || {});

function ingHmMin(value) {
  const m = String(value || '').match(/^(\d{2}):(\d{2})$/);
  if (!m) return null;
  const h = Number(m[1]), min = Number(m[2]);
  return h < 24 && min < 60 ? h * 60 + min : null;
}
function ingMinHm(value) {
  const n = Math.max(0, Math.min(1439, Math.round(value)));
  return String(Math.floor(n / 60)).padStart(2, '0') + ':' + String(n % 60).padStart(2, '0');
}
function ingAvail(sid) {
  const row = state.checks[ingAvailKey(sid) + '|all'];
  const raw = (row && row.avail) || {};
  let start = ingHmMin(raw.start) === null ? '07:00' : raw.start;
  let end = ingHmMin(raw.end) === null ? '23:00' : raw.end;
  if (ingHmMin(end) <= ingHmMin(start)) { start = '07:00'; end = '23:00'; }
  const blocks = Array.isArray(raw.blocks) ? raw.blocks.filter(b =>
    b && b.id && Array.isArray(b.days) && ingHmMin(b.s) !== null && ingHmMin(b.e) > ingHmMin(b.s)) : [];
  return { configured: !!row && raw.configured === true, start: start, end: end, blocks: blocks };
}
function ingSaveAvail(sid, avail) {
  setCheck(ingAvailKey(sid), 'all', {
    avail: Object.assign({}, avail, { configured: true }), done: true
  });
}
function ingFreeIntervals(start, end, busy) {
  const ranges = (busy || []).map(x => ({
    s: Math.max(start, Number(x.s)), e: Math.min(end, Number(x.e))
  })).filter(x => x.e > x.s).sort((a, b) => a.s - b.s || a.e - b.e);
  const out = [];
  let at = start;
  ranges.forEach(x => {
    if (x.s > at && x.s - at >= ING_MIN_FREE) out.push({ s: at, e: x.s });
    at = Math.max(at, x.e);
  });
  if (end > at && end - at >= ING_MIN_FREE) out.push({ s: at, e: end });
  return out;
}
function ingFreeForDate(sid, date, includePlan) {
  const avail = ingAvail(sid);
  if (!avail.configured) return [];
  const day = dowOf(date);
  const busy = avail.blocks.filter(b => b.days.includes(day)).map(b => ({ s: ingHmMin(b.s), e: ingHmMin(b.e) }));
  tbOf(sid, date).forEach(b => {
    const s = ingHmMin(b.s), e = ingHmMin(b.e);
    if (s !== null && e > s) busy.push({ s: s, e: e });
  });
  if (includePlan !== false) {
    ingPlan(sid, date).forEach(it => {
      const s = ingHmMin(it.s), e = ingHmMin(it.e);
      if (s !== null && e > s) busy.push({ s: s, e: e });
    });
  }
  return ingFreeIntervals(ingHmMin(avail.start), ingHmMin(avail.end), busy);
}
function ingWeeklyFreeMin(sid, anchor) {
  const mon = mondayOf(anchor || today());
  return ING_WEEK_DAYS.reduce((sum, _, i) =>
    sum + ingFreeForDate(sid, addDays(mon, i), true).reduce((n, x) => n + x.e - x.s, 0), 0);
}
const ingLectureSpan = (lecture, fallback) =>
  Math.max(10, Number(lecture.min) || Number(fallback) || ING_DEFAULT_MIN) + ING_BUFFER_MIN;

function ingSaveCourses(sid, courses) { setCheck(ingKey(sid), 'all', { courses: courses, done: true }); }
function ingSavePlan(sid, date, items) { setCheck(ingPlanKey(sid), date, { items: items, done: true }); }
const ingPlanDates = sid => {
  const pre = ingPlanKey(sid) + '|';
  return Object.keys(state.checks).filter(k => k.startsWith(pre)).map(k => k.slice(pre.length)).sort();
};

/** 배정 현황 — 'courseId|seq' → {date, done} */
function ingAssigned(sid) {
  const map = {};
  ingPlanDates(sid).forEach(d => {
    ingPlan(sid, d).forEach(it => {
      map[it.cid + '|' + it.seq] = Object.assign({}, it, { date: d, done: !!it.done });
    });
  });
  return map;
}
function ingLec(sid, cid, seq) {
  const c = ingCourses(sid).find(x => x.id === cid);
  if (!c) return null;
  const l = (c.lectures || []).find(x => Number(x.seq) === Number(seq));
  return l ? { course: c, lec: l } : null;
}
function ingCourseSubjectKey(course) {
  const stored = String((course && course.studySubject) || '').trim();
  if (stored) return studySubjectKey(stored);
  const text = String((course && course.name) || '');
  if (/(과학|과탐|물리|화학|생명|생물|지구과학)/.test(text)) return 'science';
  if (/(국어|독서|문학|화법|작문|언어와매체|언매)/.test(text)) return 'korean';
  if (/(영어|영단어|어법|구문)/.test(text)) return 'english';
  if (/(수학|수리|미적분|확률과통계|확통|기하)/.test(text)) return 'math';
  if (/(사회|사탐|한국사|세계사|윤리|지리|정치|경제)/.test(text)) return 'social';
  return 'other';
}
function ingCourseSubject(course) { return STUDY_SUBJECTS[ingCourseSubjectKey(course)]; }
const ingTimerTaskId = (cid, seq) => 'ing:' + String(cid || '') + ':' + Number(seq);
const ingIsClaimed = item => !!(item && (item.claimed || item.done));
function ingChecklistItems(sid, date) {
  return ingPlan(sid, date).filter(ingIsClaimed).map(item => Object.assign({}, item, { date: date }));
}
function ingStats(sid, c, asg) {
  asg = asg || ingAssigned(sid);
  const lecs = c.lectures || [];
  let assigned = 0, done = 0;
  lecs.forEach(l => {
    const a = asg[c.id + '|' + l.seq];
    if (a) { assigned++; if (a.done) done++; }
  });
  return { total: lecs.length, assigned: assigned, done: done,
    unassigned: lecs.length - assigned, pct: lecs.length ? Math.round(done / lecs.length * 100) : 0 };
}

function ingCourseItems(sid, cid) {
  const out = [];
  ingPlanDates(sid).forEach(date => ingPlan(sid, date).forEach(it => {
    if (it.cid === cid) out.push(Object.assign({}, it, { date: date }));
  }));
  return out.sort((a, b) => a.date.localeCompare(b.date) || Number(a.seq) - Number(b.seq));
}

function ingLectureNote(sid, cid, seq) {
  return state.checks[ingNoteKey(sid) + '|' + String(cid || '') + ':' + Number(seq)] || {};
}

function ingSaveLectureNote(sid, cid, seq, patch) {
  return setCheck(ingNoteKey(sid), String(cid || '') + ':' + Number(seq),
    Object.assign({}, patch, { done: true }));
}

function ingCourseStudySeconds(sid, course) {
  const taskIds = new Set(((course && course.lectures) || []).map(lecture =>
    ingTimerTaskId(course.id, lecture.seq)));
  return ingPlanDates(sid).reduce((sum, date) => sum + stTimelineSegments(sid, date).reduce((daily, segment) =>
    daily + (taskIds.has(segment.taskId) ? Math.max(0, Number(segment.end) - Number(segment.start)) / 1000 : 0), 0), 0);
}

function ingCourseState(sid, course, asg) {
  const stats = ingStats(sid, course, asg);
  const items = ingCourseItems(sid, course.id);
  const notes = (course.lectures || []).map(lecture => ingLectureNote(sid, course.id, lecture.seq));
  const overdue = items.filter(item => !item.done && item.date < today()).length;
  const review = items.filter(item => item.review).length;
  const unanswered = notes.filter(note => {
    const question = String(note.question || '').trim(), answer = String(note.answer || '').trim();
    return question && (!answer || String(note.answeredQuestion || '').trim() !== question);
  }).length;
  const completed = stats.total > 0 && stats.done >= stats.total;
  const paused = !completed && course.status === 'paused';
  const lastDone = items.filter(item => item.done).map(item => item.date).sort().pop() || '';
  const importedDate = Number(course.importedAt) ? ymd(new Date(Number(course.importedAt))) : '';
  const lastActivity = lastDone || importedDate;
  const stalled = !completed && !paused && !!lastActivity && lastActivity < addDays(today(), -7);
  const seconds = Math.round(ingCourseStudySeconds(sid, course));
  const status = completed ? 'completed' : paused ? 'paused' : 'active';
  return {
    stats: stats, items: items, overdue: overdue, review: review, unanswered: unanswered,
    completed: completed, paused: paused, stalled: stalled, seconds: seconds, status: status,
    attention: overdue + review + unanswered + (stalled ? 1 : 0)
  };
}

/** 순수 배치 코어 — 날짜별 빈 구간에 강의를 순서대로, 쪼개지 않고 넣는다. */
function ingPackSchedule(lectures, start, end, weekdays, perDay, freeForDate, usedForDate) {
  const items = [];
  const days = Array.isArray(weekdays) ? weekdays : ING_WEEK_DAYS;
  const finishBy = end || addDays(start, 1099);
  let index = 0, date = start, guard = 0;
  while (index < lectures.length && date <= finishBy && guard < 1100) {
    if (days.includes(dowOf(date))) {
      const slots = (freeForDate(date) || []).map(x => ({ s: Number(x.s), e: Number(x.e) }));
      let dailyLeft = Math.max(0, Math.max(1, Number(perDay) || 1) -
        (usedForDate ? Number(usedForDate(date)) || 0 : 0));
      while (index < lectures.length && dailyLeft > 0) {
        const lec = lectures[index];
        const span = Math.max(10, Number(lec._span) || ingLectureSpan(lec));
        const slot = slots.find(x => x.e - x.s >= span);
        if (!slot) break;
        const s = slot.s;
        slot.s += span;
        items.push({ date: date, seq: lec.seq, title: lec.title || '', min: lec.min || null,
          s: ingMinHm(s), e: ingMinHm(s + span) });
        index++; dailyLeft--;
      }
    }
    date = addDays(date, 1); guard++;
  }
  return {
    items: items,
    remaining: lectures.length - index,
    complete: index === lectures.length,
    finishDate: index === lectures.length && items.length ? items[items.length - 1].date : null
  };
}

function ingBuildSchedule(sid, course, start, end, weekdays, perDay) {
  const asg = ingAssigned(sid);
  const left = (course.lectures || []).filter(l => !asg[course.id + '|' + l.seq]).map(l =>
    Object.assign({}, l, { _span: ingLectureSpan(l, course.defaultMin) }));
  if (!ingAvail(sid).configured) {
    return { items: [], remaining: left.length, complete: !left.length, finishDate: null, reason: '주간 일정 미설정' };
  }
  const packed = ingPackSchedule(left, start, end, weekdays, perDay,
    date => ingFreeForDate(sid, date, true), date => ingPlan(sid, date).length);
  packed.items = packed.items.map(it => Object.assign({}, it, {
    cid: course.id, done: false, auto: 'free-v1'
  }));
  return packed;
}

function ingReplayRounds(sid, course, finishDate, goalDate, weekdays, perDay) {
  if (!finishDate || !goalDate || finishDate > goalDate || !(course.lectures || []).length) return 0;
  const lectures = course.lectures.map(l => Object.assign({}, l, {
    _span: ingLectureSpan(l, course.defaultMin)
  }));
  let rounds = 1, start = addDays(finishDate < today() ? today() : finishDate, 1);
  // 실제 학습에서는 20회독을 넘기지 않는다. 필요가 확인되면 이 상한만 올리면 된다.
  while (start <= goalDate && rounds < 20) {
    const packed = ingPackSchedule(lectures, start, goalDate, weekdays, perDay,
      date => ingFreeForDate(sid, date, true), date => ingPlan(sid, date).length);
    if (!packed.complete || !packed.finishDate) break;
    rounds++; start = addDays(packed.finishDate, 1);
  }
  return rounds;
}

function ingForecast(sid, course) {
  const stats = ingStats(sid, course);
  const set = ingSet(sid);
  const existing = ingCourseItems(sid, course.id);
  const overdue = existing.filter(x => !x.done && x.date < today()).length;
  const existingLast = existing.length ? existing[existing.length - 1].date : null;
  const projectionEnd = addDays(today(), 1099);
  const projected = stats.unassigned
    ? ingBuildSchedule(sid, course, today(), projectionEnd, set.days, set.perDay)
    : { complete: true, finishDate: existingLast, remaining: 0, items: [] };
  let finishDate = projected.complete ? projected.finishDate : null;
  if (finishDate && existingLast && existingLast > finishDate) finishDate = existingLast;
  if (overdue) finishDate = null;
  let rounds = null;
  if (course.goalDate) {
    rounds = overdue ? 0 : ingReplayRounds(sid, course, finishDate, course.goalDate, set.days, set.perDay);
  }
  const review = existing.filter(x => x.review).length;
  let next = '현재 회차를 계획대로 진행하세요.';
  if (overdue) next = '밀린 ' + overdue + '강을 다시 배정한 뒤 계획을 이어가세요.';
  else if (review) next = '복습 표시 ' + review + '강을 먼저 다시 들으세요.';
  else if (stats.pct >= 100) next = course.nextName ? '약점 복습을 마치면 다음 과정으로 넘어가세요.' : '오답·약점 강의를 복습한 뒤 다음 과정을 정하세요.';
  else if (stats.pct >= 80) next = course.nextName ? '완강이 가까워졌습니다. 다음 과정 전환을 준비하세요.' : '완강이 가까워졌습니다. 다음 과정을 정해 주세요.';
  return { finishDate: finishDate, rounds: rounds, remaining: projected.remaining || 0,
    complete: !!projected.complete && !overdue, next: next, review: review, overdue: overdue };
}

/** 커리큘럼 텍스트 파서 — 사이트별이 아니라 패턴 기반이라 개편에 안 깨진다.
 *  "1강 다항식의 덧셈 52분" / "01. 제목 (52:30)" 같은 형태를 모두 받는다. */
function ingParse(text) {
  const out = [];
  String(text || '').replace(/\r/g, '').split('\n').forEach(line => {
    const s = line.replace(/\u00a0/g, ' ').replace(/\t+/g, ' ').replace(/^[\s•·▶▷-]+/, '').trim();
    if (!s) return;
    let plain = false;
    const m = s.match(/^\[?(?:강의\s*)?(\d{1,3})\s*(?:강|회|차|교시)\s*[.)\]:-]?\s*(.*)$/)
      || s.match(/^\[?(?:강의\s*)?(\d{1,3})\s*[.)\]:-]\s*(.*)$/)
      || (plain = true, s.match(/^\[?(?:강의\s*)?(\d{1,3})\s+(.*)$/));
    if (!m) return;
    let rest = (m[2] || '').trim(), min = null;
    const t = rest.match(/[\s(\[]*(\d{1,3})\s*분(?:\s*\d{1,2}\s*초)?[)\]]*\s*$/)
           || rest.match(/[\s(\[]*(\d{1,2}):(\d{2}):(\d{2})[)\]]*\s*$/)
           || rest.match(/[\s(\[]*(\d{1,3}):(\d{2})[)\]]*\s*$/);
    if (t) {
      min = t.length === 4 ? Number(t[1]) * 60 + Number(t[2]) + (Number(t[3]) >= 30 ? 1 : 0)
        : Number(t[1]) + (Number(t[2]) >= 30 ? 1 : 0);
      rest = rest.slice(0, t.index).trim();
    }
    if (plain && !t) return;
    rest = rest.replace(/[\s\-–—·|,]+$/, '').trim();
    const seq = Number(m[1]);
    if (seq < 1 || seq > 999) return;
    out.push({ seq: seq, title: rest || (m[1] + '강'), min: min });
  });
  return out.filter((x, i) => !out.slice(0, i).some(y => y.seq === x.seq));
}

function ingCourseText(course) {
  return ((course && course.lectures) || []).map(lecture =>
    Number(lecture.seq) + '강 ' + (String(lecture.title || '').trim() || (Number(lecture.seq) + '강')) +
      (Number(lecture.min) > 0 ? ' ' + Number(lecture.min) + '분' : '')).join('\n');
}

function ingToggle(sid, date, cid, seq) {
  const items = ingPlan(sid, date).map(x =>
    (x.cid === cid && Number(x.seq) === Number(seq))
      ? Object.assign({}, x, { done: !x.done }, !x.done && !x.claimed ? { claimed: true, claimedAt: now() } : {})
      : x);
  ingSavePlan(sid, date, items);
}
function ingPatchItem(sid, date, cid, seq, patch) {
  ingSavePlan(sid, date, ingPlan(sid, date).map(x =>
    (x.cid === cid && Number(x.seq) === Number(seq)) ? Object.assign({}, x, patch) : x));
}

/** 오늘 이전 미완료를 전부 오늘로 — 따라잡기용 */
function ingCatchup(sid) {
  const t = today(), moved = [];
  ingPlanDates(sid).forEach(d => {
    if (d >= t) return;
    const items = ingPlan(sid, d);
    const late = items.filter(x => !x.done);
    if (!late.length) return;
    moved.push.apply(moved, late.map(x => Object.assign({}, x, { s: '', e: '', auto: '' })));
    ingSavePlan(sid, d, items.filter(x => x.done));
  });
  if (moved.length) ingSavePlan(sid, t, ingPlan(sid, t).concat(moved));
  return moved.length;
}
/** 기준일 이후 미완료를 통째로 ±N일 이동 — 시험기간용 */
function ingShift(sid, from, n) {
  const info = ingShiftInfo(sid, from, n);
  if (!info.count || info.beforeToday) return 0;
  const buckets = {};
  let cnt = 0;
  ingShiftRows(sid, from).forEach(row => {
    ingSavePlan(sid, row.date, row.items.filter(x => x.done));
    const nd = addDays(row.date, n);
    (buckets[nd] = buckets[nd] || []).push.apply(buckets[nd],
      row.move.map(x => Object.assign({}, x)));
    cnt += row.move.length;
  });
  Object.keys(buckets).forEach(d => ingSavePlan(sid, d, ingPlan(sid, d).concat(buckets[d])));
  return cnt;
}

function ingShiftRows(sid, from) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(from || '') || from < today()) return [];
  return ingPlanDates(sid).filter(date => date >= from).map(date => {
    const items = ingPlan(sid, date);
    return { date: date, items: items, move: items.filter(item => !item.done) };
  }).filter(row => row.move.length);
}

function ingShiftInfo(sid, from, n) {
  const validShift = Number.isInteger(n) && n !== 0 && Math.abs(n) <= 365;
  const rows = validShift ? ingShiftRows(sid, from) : [];
  const first = rows.length ? rows[0].date : '';
  const last = rows.length ? rows[rows.length - 1].date : '';
  const nextFirst = first ? addDays(first, n) : '';
  const nextLast = last ? addDays(last, n) : '';
  return {
    count: rows.reduce((sum, row) => sum + row.move.length, 0),
    first: first, last: last, nextFirst: nextFirst, nextLast: nextLast,
    beforeToday: !!nextFirst && nextFirst < today()
  };
}

function ingShiftDraft(sid) {
  const from = ($('#ingShiftFrom') && $('#ingShiftFrom').value) || '';
  const days = Number($('#ingShiftDays') && $('#ingShiftDays').value);
  const picked = document.querySelector('#ingShiftDirection .chip.on');
  const direction = picked && Number(picked.dataset.n) === -1 ? -1 : 1;
  const valid = /^\d{4}-\d{2}-\d{2}$/.test(from) && from >= today() &&
    Number.isInteger(days) && days >= 1 && days <= 365;
  return { from: from, days: days, n: direction * days, valid: valid,
    info: valid ? ingShiftInfo(sid, from, direction * days) : null };
}

function ingShiftRender(sid) {
  const box = $('#ingShiftPreview'), apply = $('#ingShiftApply');
  if (!box || !apply) return;
  const draft = ingShiftDraft(sid);
  document.querySelectorAll('.ing-shift-quick .chip').forEach(chip => {
    const on = draft.valid && Number(chip.dataset.days) === draft.days;
    chip.classList.toggle('on', on); chip.setAttribute('aria-pressed', String(on));
  });
  if (!draft.valid) {
    box.className = 'ing-shift-preview warn';
    box.textContent = '기준일과 이동 일수를 확인해 주세요. 이동 일수는 1~365일입니다.';
    apply.disabled = true; apply.textContent = '날짜를 확인해 주세요'; return;
  }
  const info = draft.info;
  if (!info.count) {
    box.className = 'ing-shift-preview';
    box.textContent = '선택한 기준일 이후에 이동할 미완료 강의가 없습니다.';
    apply.disabled = true; apply.textContent = '이동할 일정이 없습니다'; return;
  }
  const moveText = draft.n > 0 ? draft.days + '일 뒤로' : draft.days + '일 앞으로';
  box.className = 'ing-shift-preview' + (info.beforeToday ? ' warn' : '');
  box.innerHTML = '<div class="ing-shift-route"><div><span>현재 일정</span><b>' + shortDate(info.first) +
    (info.first === info.last ? '' : ' ~ ' + shortDate(info.last)) + '</b></div>' +
    '<div class="ing-shift-arrow" aria-hidden="true">→</div><div><span>이동 후</span><b>' + shortDate(info.nextFirst) +
    (info.nextFirst === info.nextLast ? '' : ' ~ ' + shortDate(info.nextLast)) + '</b></div></div>' +
    '<div class="ing-shift-result">미완료 <b>' + info.count + '강</b>을 <b>' + moveText + '</b> 이동합니다.</div>' +
    (info.beforeToday ? '<div class="hint" style="color:var(--coral)">이동 후 첫 일정이 오늘 이전입니다. 이동 일수를 줄여주세요.</div>' : '');
  apply.disabled = info.beforeToday;
  apply.textContent = info.beforeToday ? '오늘 이전으로는 이동할 수 없습니다' : info.count + '강 · ' + moveText + ' 이동';
}

function ingShiftModal(sid) {
  const info = ingShiftInfo(sid, today(), 7);
  if (!info.count) return toast('오늘 이후 이동할 미완료 강의가 없습니다');
  modal('↔ 전체 일정 날짜 이동',
    '<div class="ing-shift-intro mb14"><div><b>오늘 이후 미완료 일정</b><span class="small muted">완료한 강의는 그대로 둡니다.</span></div>' +
      '<span class="pill">' + info.count + '강</span></div>' +
    '<div class="field"><label class="fl" for="ingShiftFrom">어느 날짜부터 옮길까요?</label>' +
      '<input class="in" id="ingShiftFrom" type="date" min="' + today() + '" value="' + today() + '"></div>' +
    '<div class="fl mb8">이동 방향</div><div class="ing-shift-choice mb14" id="ingShiftDirection">' +
      '<button type="button" class="chip on" data-act="ingshiftdir" data-n="1" aria-pressed="true"><b>→ 뒤로 미루기</b><small>일정을 늦출 때</small></button>' +
      '<button type="button" class="chip" data-act="ingshiftdir" data-n="-1" aria-pressed="false"><b>← 앞으로 당기기</b><small>일정을 앞당길 때</small></button></div>' +
    '<div class="ing-shift-days"><div class="field"><label class="fl" for="ingShiftDays">이동 일수</label>' +
      '<input class="in" id="ingShiftDays" type="number" min="1" max="365" inputmode="numeric" value="7"></div>' +
      '<div class="field"><div class="fl">빠른 선택</div><div class="ing-shift-quick">' +
        [1, 3, 7, 14].map(day => '<button type="button" class="chip' + (day === 7 ? ' on' : '') + '" data-act="ingshiftquick" data-days="' + day +
          '" aria-pressed="' + (day === 7) + '">' + day + '일</button>').join('') +
      '</div></div></div>' +
    '<div id="ingShiftPreview" data-sid="' + esc(sid) + '" aria-live="polite"></div>' +
    '<div class="hint mt14">기준일 전 일정과 완료한 강의는 이동하지 않습니다. 기존 시간도 함께 옮기며, 새 날짜의 고정 일정과 겹치면 주간 시간표에 경고로 표시됩니다.</div>',
    '<button class="btn btn-primary btn-block mt14" id="ingShiftApply" data-act="ingshiftapply" data-sid="' + esc(sid) + '" disabled>미리보기 계산 중</button>');
  ingShiftRender(sid);
}

/** 오늘 화면용 — 밀린 것과 오늘 것 */
function ingTodayItems(sid) {
  const t = today(), overdue = [];
  ingPlanDates(sid).forEach(d => {
    if (d >= t) return;
    ingPlan(sid, d).forEach(x => { if (!x.done) overdue.push(Object.assign({}, x, { date: d })); });
  });
  overdue.sort((a, b) => a.date.localeCompare(b.date));
  return { overdue: overdue, todays: ingPlan(sid, t).map(x => Object.assign({}, x, { date: t })) };
}

function ingRow(sid, it, editable) {
  const f = ingLec(sid, it.cid, it.seq);
  const late = it.date < today() ? Math.round((parseYmd(today()) - parseYmd(it.date)) / 86400000) : 0;
  const claimed = ingIsClaimed(it);
  const canClaim = session.isStaffLink && (late || !claimed);
  const claimStatus = session.isStaffLink
    ? '<button class="btn btn-sm ' + (claimed && !late ? 'btn-ghost' : 'btn-primary') + '" data-act="ingclaim" data-sid="' + esc(sid) +
      '" data-date="' + it.date + '" data-cid="' + esc(it.cid) + '" data-seq="' + it.seq + '"' +
      (canClaim ? '' : ' disabled') + '>' + (late ? '오늘 체크리스트로 가져오기' : claimed ? '✓ 체크리스트에 담음' : '내 체크리스트로 가져오기') + '</button>'
    : '<span class="pill ' + (claimed && !late ? '' : 'bad') + '">' +
      (late ? '오늘로 옮기기 전' : claimed ? '체크리스트에 담음' : '가져오기 전') + '</span>';
  return '<div class="task ing-today-row ' + (it.done ? 'done' : '') + '">' +
    '<div class="task-body"><div class="task-t">' +
      (f ? esc(f.course.name) + ' ' + it.seq + '강' : '(삭제된 강좌) ' + it.seq + '강') + '</div>' +
      (f && f.lec.title ? '<div class="task-d">' + esc(f.lec.title) + '</div>' : '') +
      '<div class="meta">' +
        (f ? studySubjectTag(ingCourseSubjectKey(f.course)) : studySubjectTag('other')) +
        (it.s && it.e ? '<span class="tag time">' + esc(it.s) + '~' + esc(it.e) + '</span>' : '') +
        (f && f.lec.min ? '<span class="tag time">' + f.lec.min + '분</span>' : '') +
        (f && f.course.platform ? '<span class="tag">' + esc(f.course.platform) + '</span>' : '') +
        (late ? '<span class="tag ' + (late >= ING_LATE_WARN ? 'carry' : '') + '">' +
          shortDate(it.date) + ' · ' + late + '일 밀림</span>' : '') +
        (editable ? '<button class="tag ' + (it.review ? 'high' : '') + '" data-act="ingreview"' +
          ' data-sid="' + sid + '" data-date="' + it.date + '" data-cid="' + esc(it.cid) + '" data-seq="' + it.seq + '">' +
          (it.review ? '★ 복습 필요' : '☆ 복습 표시') + '</button>' :
          (it.review ? '<span class="tag high">★ 복습 필요</span>' : '')) +
        claimStatus +
      '</div></div></div>';
}

/** 오늘 화면에 붙는 인강 카드 */
function ingTodayCard(me, editable) {
  const { overdue, todays } = ingTodayItems(me.id);
  const folded = todayFoldState.lectures;
  const bad = overdue.filter(x => Math.round((parseYmd(today()) - parseYmd(x.date)) / 86400000) >= ING_LATE_WARN).length;
  const done = todays.filter(x => x.done).length;
  let body = '';
  if (overdue.length) {
    body += '<div class="today-fold-section"><div class="between mb8">' +
      '<div class="card-title" style="color:var(--coral)">🎬 먼저 듣자! — 밀린 인강 ' + overdue.length + '강</div>' +
      (bad ? '<span class="pill bad">' + ING_LATE_WARN + '일 이상 ' + bad + '강</span>' : '') + '</div>' +
      overdue.map(x => ingRow(me.id, x, editable)).join('') + '</div>';
  }
  if (todays.length) {
    body += '<div class="today-fold-section"><div class="card-title">오늘 들을 인강</div>' +
      todays.map(x => ingRow(me.id, x, editable)).join('') + '</div>';
  }
  if (!body) body = '<div class="small muted" style="padding:10px 0 2px">오늘 배정되거나 밀린 인강이 없습니다.</div>';

  return '<div class="card today-fold-card' + (folded ? ' is-folded' : '') + '" id="todayLectures">' +
    '<button type="button" class="today-fold-head" data-act="todayfold" data-section="lectures" aria-expanded="' + (!folded) + '" aria-controls="todayLecturesBody">' +
      '<span class="today-fold-copy"><span class="card-title" style="display:block">🎬 인강</span>' +
        '<span class="card-sub">오늘 들을 강의를 체크리스트로 가져와 스터디 플래너에서 기록하세요.</span></span>' +
      '<span class="today-fold-meta">' +
        (overdue.length ? '<span class="pill bad">밀림 ' + overdue.length + '강</span>' : '') +
        (todays.length ? '<span class="pill' + (done === todays.length ? '' : ' warn') + '">' + done + ' / ' + todays.length + '강</span>' :
          '<span class="pill">0강</span>') +
        '<span class="today-fold-chevron" aria-hidden="true">' + (folded ? '⌄' : '⌃') + '</span></span></button>' +
    '<div class="today-fold-body" id="todayLecturesBody"' + (folded ? ' hidden' : '') + '>' + body + '</div>' +
    '</div>';
}

/* ── 인강 탭 ── */
function ingHourText(min) {
  const h = Math.floor(min / 60), m = min % 60;
  return (h ? h + '시간 ' : '') + (m ? m + '분' : (h ? '' : '0분'));
}

function ingOverviewCard(me, editable, admin, courses, states) {
  const active = states.filter(state => state.status === 'active').length;
  const total = states.reduce((sum, state) => sum + state.stats.total, 0);
  const done = states.reduce((sum, state) => sum + state.stats.done, 0);
  const pct = total ? Math.round(done / total * 100) : 0;
  const attention = states.reduce((sum, state) => sum + state.overdue + state.review, 0);
  const questions = states.reduce((sum, state) => sum + state.unanswered, 0);
  const seconds = states.reduce((sum, state) => sum + state.seconds, 0);
  const overdue = states.reduce((sum, state) => sum + state.overdue, 0);
  const avail = ingAvail(me.id);
  return '<div class="card ing-hero"><div class="ing-hero-top"><div>' +
    '<div class="ing-hero-kicker">LECTURE LIBRARY</div>' +
    '<div class="ing-hero-title">' + esc(me.name) + ' 인강 관리실</div>' +
    '<div class="ing-hero-sub">강좌·회차·질문을 한곳에서 관리합니다 · 등록 강좌 ' + courses.length + '개</div></div>' +
    (overdue ? '<span class="ing-hero-alert">밀림 ' + overdue + '강</span>' : '') + '</div>' +
    '<div class="ing-overview-grid"><div class="ing-overview-stat"><b>' + active + '개</b>수강 중 강좌</div>' +
      '<div class="ing-overview-stat"><b>' + pct + '%</b>전체 완강률</div>' +
      '<div class="ing-overview-stat"><b>' + attention + '강</b>지연·복습</div>' +
      '<div class="ing-overview-stat"><b>' + questions + '개</b>답변 대기 질문</div></div>' +
    (seconds ? '<div class="ing-hero-time">⏱ 인강 타이머 누적 ' + fmtDur(seconds) + '</div>' : '') +
    '<div class="ing-hero-actions">' +
      (admin ? '<button class="btn btn-sm btn-primary" data-act="ingadd">＋ 강좌 등록</button>' : '') +
      (editable ? '<button class="btn btn-sm btn-ghost" data-act="ingavopen">' +
        (avail.configured ? '자동배정 시간 수정' : '자동배정 시간 입력') + '</button>' : '') +
      (admin ? '<button class="btn btn-sm btn-ghost" data-act="ingshift">전체 일정 날짜 이동</button>' : '') +
    '</div></div>';
}

function ingCalendarPosition(start, end, calStart, calEnd, hourPx) {
  const s = Math.max(Number(start), Number(calStart));
  const e = Math.min(Number(end), Number(calEnd));
  if (!Number.isFinite(s) || !Number.isFinite(e) || e <= s) return null;
  const px = Number(hourPx) > 0 ? Number(hourPx) : ING_CAL_HOUR_PX;
  return {
    top: Math.round((s - calStart) / 60 * px),
    height: Math.max(6, Math.round((e - s) / 60 * px))
  };
}

function ingWeekCard(me, editable, canManage) {
  const avail = ingAvail(me.id);
  const mon = mondayOf(ingWeekAnchor);
  const sun = addDays(mon, 6);
  let h = '<div class="card ing-calendar-card"><div class="ing-week-toolbar mb8"><div>' +
    '<div class="card-title">🗓 주간 시간표</div>' +
    '<div class="small muted">' + shortDate(mon) + ' ~ ' + shortDate(sun) +
      (avail.configured ? ' · 빈 시간 ' + ingHourText(ingWeeklyFreeMin(me.id, mon)) : ' · 일정 미설정') + '</div></div>' +
    '<div class="row" style="gap:6px">' +
      '<button class="btn btn-sm btn-ghost" data-act="ingweek" data-n="-7">‹</button>' +
      '<button class="btn btn-sm btn-ghost" data-act="ingweektoday">이번 주</button>' +
      '<button class="btn btn-sm btn-ghost" data-act="ingweek" data-n="7">›</button></div></div>';
  if (!avail.configured) {
    h += '<div class="hint">학생의 활동 가능 시간과 학교·학원 같은 고정 일정을 먼저 넣어주세요. ' +
      '저장하기 전에는 빈 시간으로 계산하지 않습니다.</div>' +
      (editable ? '<button class="btn btn-primary btn-block mt14" data-act="ingavopen">주간 시간표 입력</button>' : '') + '</div>';
    return h;
  }
  h += '<div class="ing-calendar-bar"><div><div class="small muted mb8">활동 가능 ' + esc(avail.start) + '~' + esc(avail.end) + '</div>' +
      '<div class="ing-legend"><span><i class="busy"></i>고정 일정</span><span><i class="free"></i>빈 시간</span>' +
        '<span><i class="lecture"></i>배정 인강</span></div></div>' +
      (editable ? '<button class="btn btn-sm btn-ghost" data-act="ingavopen">시간표 수정</button>' : '') + '</div>';
  const calStart = ingHmMin(avail.start), calEnd = ingHmMin(avail.end);
  const calMinutes = calEnd - calStart;
  const calHourPx = Math.max(ING_CAL_HOUR_PX, 240 * 60 / calMinutes);
  const calHeight = Math.round(calMinutes / 60 * calHourPx);
  const days = [], conflicts = [];
  for (let i = 0; i < 7; i++) {
    const date = addDays(mon, i), day = dowOf(date);
    const blocks = avail.blocks.filter(b => b.days.includes(day)).map(b => ({
      s: ingHmMin(b.s), e: ingHmMin(b.e), type: 'busy', label: b.label || '고정 일정'
    }));
    tbOf(me.id, date).forEach(b => {
      const s = ingHmMin(b.s), e = ingHmMin(b.e);
      if (s !== null && e > s) blocks.push({ s: s, e: e, type: 'busy', label: b.label || '일정' });
    });
    ingPlan(me.id, date).forEach(it => {
      const s = ingHmMin(it.s), e = ingHmMin(it.e), found = ingLec(me.id, it.cid, it.seq);
      if (s !== null && e > s) blocks.push({ s: s, e: e, type: 'lecture',
        done: !!it.done, subjectClass: found ? studySubject(ingCourseSubjectKey(found.course)).className : 'subject-other',
        label: (it.done ? '✓ ' : (it.review ? '★ ' : '')) +
          (found ? found.course.name + ' ' + it.seq + '강' : '인강 ' + it.seq + '강') });
    });
    ingFreeForDate(me.id, date, true).forEach(x => blocks.push({ s: x.s, e: x.e, type: 'free', label: '빈 시간' }));
    blocks.sort((a, b) => a.s - b.s || a.e - b.e);
    for (let a = 0; a < blocks.length; a++) for (let b = a + 1; b < blocks.length; b++) {
      if (blocks[a].type !== 'free' && blocks[b].type !== 'free' &&
          blocks[a].s < blocks[b].e && blocks[b].s < blocks[a].e) {
        blocks[a].conflict = blocks[b].conflict = true;
        conflicts.push({ date: date, day: day, s: Math.max(blocks[a].s, blocks[b].s),
          e: Math.min(blocks[a].e, blocks[b].e),
          left: (blocks[a].type === 'lecture' ? '인강' : '고정 일정') + ' · ' + blocks[a].label,
          right: (blocks[b].type === 'lecture' ? '인강' : '고정 일정') + ' · ' + blocks[b].label });
      }
    }
    days.push({ date: date, day: day, blocks: blocks });
  }
  let timeLabels = '<span class="ing-cal-time-label start" style="top:0">' + esc(avail.start) + '</span>';
  for (let min = Math.ceil((calStart + 1) / 60) * 60; min < calEnd; min += 60) {
    const top = Math.round((min - calStart) / 60 * calHourPx);
    timeLabels += '<span class="ing-cal-time-label" style="top:' + top + 'px">' + ingMinHm(min) + '</span>';
  }
  timeLabels += '<span class="ing-cal-time-label end" style="top:' + calHeight + 'px">' + esc(avail.end) + '</span>';
  const shortSlots = [];
  if (canManage) days.forEach(d => {
    if (d.date < today()) return;
    d.blocks.forEach(x => {
      const pos = x.type === 'free' ? ingCalendarPosition(x.s, x.e, calStart, calEnd, calHourPx) : null;
      if (pos && pos.height < ING_MIN_TOUCH_PX) shortSlots.push({ d: d, x: x });
    });
  });
  h += '<div class="ing-cal-tabs" aria-label="요일 선택">' + days.map((d, i) =>
      '<button type="button" class="chip ' + (i === ingCalDay ? 'on' : '') + '" data-act="ingcalday" data-i="' + i +
        '" aria-pressed="' + (i === ingCalDay) + '" aria-label="' + DOW[d.day] + ' ' + shortDate(d.date) + '">' +
        DOW[d.day] + '<br>' + shortDate(d.date) + '</button>').join('') +
    '</div><div class="ing-cal-scroll" role="region" tabindex="0" aria-label="주간 인강 캘린더"><div class="ing-calendar" style="--ing-cal-height:' + calHeight + 'px;--ing-cal-hour-px:' + calHourPx + 'px">' +
      '<div class="ing-cal-head-row"><div class="ing-cal-corner" aria-hidden="true"></div>' +
        days.map((d, i) => '<div class="ing-cal-head ' + (i === ingCalDay ? 'active ' : '') +
          (d.date === today() ? 'today' : '') + '"><b>' + DOW[d.day] + '</b>' + shortDate(d.date) + '</div>').join('') +
      '</div><div class="ing-cal-body"><div class="ing-cal-time-axis">' + timeLabels + '</div>' +
        days.map((d, i) => '<div class="ing-cal-day ' + (i === ingCalDay ? 'active ' : '') +
          (d.date === today() ? 'today' : '') + '">' + d.blocks.map(x => {
            const pos = ingCalendarPosition(x.s, x.e, calStart, calEnd, calHourPx);
            if (!pos) return '';
            const time = ingMinHm(x.s) + '~' + ingMinHm(x.e);
            const body = '<b>' + time + '</b>' + (x.conflict ? '⚠ ' : '') + esc(x.label) +
              (x.type === 'free' ? ' · ' + ingHourText(x.e - x.s) : '');
            const attrs = ' class="ing-cal-event ' + x.type + (x.subjectClass ? ' ' + x.subjectClass : '') +
              (x.done ? ' done' : '') + (x.conflict ? ' conflict' : '') + '" style="top:' + pos.top + 'px;height:' + pos.height +
              'px" title="' + esc(time + ' ' + x.label) + '"';
            return x.type === 'free' && canManage && d.date >= today() && pos.height >= ING_MIN_TOUCH_PX
              ? '<button type="button"' + attrs + ' data-act="ingslot" data-date="' + d.date + '" data-s="' +
                  ingMinHm(x.s) + '" data-e="' + ingMinHm(x.e) + '" aria-label="' + DOW[d.day] + ' ' + shortDate(d.date) +
                  ' ' + time + ' 빈 시간에 인강 배정">' + body + '</button>'
              : '<span' + attrs + '>' + body + '</span>';
          }).join('') + '</div>').join('') +
      '</div></div></div>' +
    (conflicts.length ? '<details class="ing-conflict-list"><summary>⚠ 겹친 일정 ' + conflicts.length + '건</summary>' +
      conflicts.map(c => '<div class="ing-conflict-row"><b>' + DOW[c.day] + ' ' + shortDate(c.date) + ' ' +
        ingMinHm(c.s) + '~' + ingMinHm(c.e) + '</b><span>' + esc(c.left) + ' ↔ ' + esc(c.right) + '</span></div>').join('') +
      '</details>' : '') +
    (shortSlots.length ? '<details class="ing-short-slot-list"><summary>짧은 빈 시간 ' + shortSlots.length + '개</summary>' +
      '<div class="small muted">달력에서 누르기 어려운 짧은 빈 시간은 아래 큰 버튼으로 배정하세요.</div>' +
      '<div class="ing-short-slot-actions">' + shortSlots.map(({ d, x }) => {
        const time = ingMinHm(x.s) + '~' + ingMinHm(x.e);
        return '<button type="button" class="btn btn-ghost ing-short-slot-action" data-act="ingslot" data-date="' + d.date +
          '" data-s="' + ingMinHm(x.s) + '" data-e="' + ingMinHm(x.e) + '" aria-label="' + DOW[d.day] + ' ' +
          shortDate(d.date) + ' ' + time + ' 빈 시간에 인강 배정"><b>' + DOW[d.day] + ' ' + shortDate(d.date) +
          '</b><span>' + time + ' · ' + ingHourText(x.e - x.s) + '</span></button>';
      }).join('') + '</div></details>' : '') +
    (canManage ? '<div class="hint mt14">달력의 초록 빈 시간을 누르거나, 짧은 빈 시간은 위 큰 버튼을 눌러 다음 미배정 강의를 넣을 수 있습니다.</div>' : '') +
    '</div>';
  return h;
}

function ingAvailPreviewHtml(rows) {
  return '<div class="ing-avail-preview-grid">' + ING_WEEK_DAYS.map(day => {
    const items = rows.filter(row => row.days.includes(day) && row.label).sort((a, b) => a.s.localeCompare(b.s));
    const conflict = items.some((item, index) => items.slice(index + 1).some(next =>
      ingHmMin(item.s) !== null && ingHmMin(next.s) !== null && ingHmMin(item.s) < ingHmMin(next.e) && ingHmMin(next.s) < ingHmMin(item.e)));
    return '<div class="ing-avail-preview-day' + (conflict ? ' conflict' : '') + '"><b>' + DOW[day] + (conflict ? ' · 겹침' : '') + '</b>' +
      (items.length ? items.map(item => '<span class="ing-avail-preview-item">' + esc(item.label) + '<em>' + esc(item.s) + '~' + esc(item.e) + '</em></span>').join('') :
        '<span class="ing-avail-preview-empty">고정 일정 없음</span>') + '</div>';
  }).join('') + '</div>';
}

function ingCourseStatusLabel(state) {
  if (state.completed) return '완강';
  if (state.paused) return '일시 정지';
  if (state.overdue) return '지연 ' + state.overdue + '강';
  if (state.stalled) return '7일 정체';
  return '수강 중';
}

function ingCourseFilterMatch(state, filter) {
  if (filter === 'attention') return state.attention > 0;
  if (filter === 'paused') return state.paused;
  if (filter === 'completed') return state.completed;
  if (filter === 'all') return true;
  return state.status === 'active';
}

function ingAttentionCard(me, courseStates, admin) {
  const issues = courseStates.filter(row => row.state.attention > 0);
  const overdue = courseStates.reduce((sum, row) => sum + row.state.overdue, 0);
  if (!issues.length) return '<div class="card ing-attention-card is-clear"><div class="ing-attention-icon">✓</div>' +
    '<div><div class="card-title">관리할 인강이 없습니다</div><div class="card-sub">지연·복습·답변 대기 없이 잘 진행되고 있습니다.</div></div></div>';
  return '<div class="card ing-attention-card"><div class="between mb8"><div><div class="card-title">🔔 지금 관리할 강좌</div>' +

      const state = row.state, tags = [];
      if (state.overdue) tags.push('지연 ' + state.overdue + '강');
      if (state.review) tags.push('복습 ' + state.review + '강');
      if (state.unanswered) tags.push('답변 대기 ' + state.unanswered + '개');
      if (state.stalled) tags.push('7일 정체');
      return '<button type="button" class="ing-attention-row" data-act="ingcourseopen" data-cid="' + esc(row.course.id) + '">' +
        '<span><b>' + esc(row.course.name) + '</b><small>' + tags.join(' · ') + '</small></span><span aria-hidden="true">›</span></button>';
    }).join('') + '</div></div>';
}

function ingLectureStatusInfo(plan) {
  if (!plan) return { key: 'unassigned', label: '미배정' };
  if (plan.review) return { key: 'review', label: '복습 필요' };
  if (plan.done) return { key: 'done', label: '완료' };
  if (plan.date < today()) return { key: 'overdue', label: '지연' };
  if (plan.date === today()) return { key: 'today', label: '오늘' };
  return { key: 'scheduled', label: shortDate(plan.date) + ' 예정' };
}

function viewIngang() {
  const me = currentStaff();
  if (!me) return emptyStaffCard();
  const admin = session.isAdmin || isManager();
  const editable = session.isStaffLink || admin;
  const courses = ingCourses(me.id);
  const asg = ingAssigned(me.id);
  const courseStates = courses.map(course => ({ course: course, state: ingCourseState(me.id, course, asg) }));

  let h = '';
  if (!session.isStaffLink) h += staffSwitcher(me.id);

  h += ingOverviewCard(me, editable, admin, courses, courseStates.map(row => row.state));
  h += ingWeekCard(me, editable, admin);

  if (!courses.length) {
    return h + '<div class="card"><div class="empty"><b>🎬</b>등록된 강좌가 없습니다.' +
      (admin ? '<br>강좌를 등록하고 커리큘럼을 붙여넣으세요.' : '') + '</div></div>';
  }

  h += ingAttentionCard(me, courseStates, admin);
  const filters = [
    { key: 'active', label: '수강 중' }, { key: 'attention', label: '관리 필요' },
    { key: 'paused', label: '일시 정지' }, { key: 'completed', label: '완강' }, { key: 'all', label: '전체' }
  ];
  const counts = Object.fromEntries(filters.map(filter => [filter.key,
    courseStates.filter(row => ingCourseFilterMatch(row.state, filter.key)).length]));
  if (!filters.some(filter => filter.key === ingLibraryFilter)) ingLibraryFilter = 'active';
  if (ingLibraryFilter === 'active' && !counts.active && counts.completed) ingLibraryFilter = 'completed';
  h += '<div class="ing-section-head"><div><h3>강좌 보관함</h3><span>강좌를 펼쳐 회차별 진도와 질문을 확인하세요.</span></div>' +
    '<span>' + courses.length + '개 강좌</span></div>' +
    '<div class="ing-library-filter" role="tablist" aria-label="강좌 상태 필터">' + filters.map(filter =>
      '<button type="button" role="tab" class="chip' + (ingLibraryFilter === filter.key ? ' on' : '') + '" data-act="ingfilter" data-v="' + filter.key +

function ingShowParsePreview() {

let ingImageSeq = 0;
async function ingImportImages(button) {
  if (!(session.isAdmin || isManager())) return;
  const input = $('#ingImages'), box = $('#ingText'), status = $('#ingImageOut');
  const files = input && input.files ? Array.from(input.files) : [];
  if (!files.length) return toast('목차 스크린샷이나 사진을 선택해 주세요');
  if (files.length > 6) return toast('목차 사진은 한 번에 6장까지 선택할 수 있습니다');
  const auth = sync.auth();
  if (!auth) return toast('원장 또는 관리자 로그인이 필요합니다');
  const initial = box.value;
  if (initial.trim() && !confirm('현재 목차를 사진에서 읽은 내용으로 바꿀까요?')) return;

  const requestId = ++ingImageSeq, originalLabel = button.textContent;
  button.disabled = true; button.textContent = '사진 준비 중…';
  try {
    const form = new FormData();
    form.set('app', SYNC_APP); form.set('auth', JSON.stringify(auth));
    for (let i = 0; i < files.length; i++) {
      if (status) status.textContent = (i + 1) + '/' + files.length + '장 압축 중…';
      form.append('files', await prepareSubmissionImage(files[i]), 'curriculum-' + (i + 1) + '.jpg');
    }
    button.textContent = '목차 읽는 중…';
    if (status) status.textContent = files.length + '장 목차를 읽고 있습니다…';
    const response = await fetch(SYNC_URL + '/consult-curriculum-image', { method: 'POST', body: form });
    const data = await response.json().catch(() => null);
    if (!response.ok || !data || data.ok !== true) throw new Error((data && data.error) || ('HTTP ' + response.status));
    if (requestId !== ingImageSeq || !box.isConnected) return;
    if (box.value !== initial && !confirm('목차를 읽는 동안 직접 수정한 내용이 있습니다. 사진 인식 결과로 바꿀까요?')) return;
    const lectures = ingParse(data.text);
    if (!lectures.length) throw new Error('강의 번호가 있는 목차를 찾지 못했습니다');
    box.value = ingCourseText({ lectures: lectures });
    ingPasteSeq++; ingShowParsePreview();
    if (status) status.textContent = '✓ ' + files.length + '장에서 ' + lectures.length + '강을 읽었습니다. 아래에서 제목과 시간을 확인하세요.';
    toast(lectures.length + '강을 읽었습니다 — 틀린 내용만 고친 뒤 등록하세요');
  } catch (error) {
    if (requestId === ingImageSeq && status && status.isConnected) status.textContent = '읽기 실패 — 사진을 선명하게 찍거나 나누어 다시 선택해 주세요.';
    toast('목차 사진 읽기 실패 — ' + String(error && error.message || error));
  } finally {
    if (button.isConnected) { button.disabled = false; button.textContent = originalLabel; }
  }
}

async function ingFetchCurriculumUrl(button) {
  if (!(session.isAdmin || isManager())) return;
  const urlInput = $('#ingUrl'), box = $('#ingText'), status = $('#ingUrlOut');
  const sourceUrl = safeHttpsUrl(urlInput && urlInput.value);
  if (!sourceUrl) return toast('https://로 시작하는 공개 강좌 상세 주소를 넣어주세요');
  const auth = sync.auth();
  if (!auth) return toast('원장 또는 관리자 로그인이 필요합니다');
  const initial = box.value;
  if (initial.trim() && !confirm('현재 목차를 주소에서 읽은 내용으로 바꿀까요?')) return;

  const originalLabel = button.textContent;
  button.disabled = true; button.textContent = '주소 읽는 중…';
  if (status) status.textContent = '강좌 상세 페이지에서 목차를 찾고 있습니다…';
  try {
    const data = await sync.post('/consult-curriculum-url', {
      app: SYNC_APP, auth: auth, url: sourceUrl
    });
    if (!data.text) throw new Error(data.hint || '이 주소에서 강의 목차를 찾지 못했습니다');
    if (!box.isConnected) return;
    if (box.value !== initial && !confirm('주소를 읽는 동안 직접 수정한 내용이 있습니다. 가져온 목차로 바꿀까요?')) return;
    const lectures = ingParse(data.text);
    if (!lectures.length) throw new Error('강의 번호가 있는 목차를 찾지 못했습니다');
    box.value = ingCourseText({ lectures: lectures });
    ingPasteSeq++; ingShowParsePreview();
    if (status) status.textContent = '✓ ' + lectures.length + '강을 읽었습니다. 아래에서 제목과 시간을 확인하세요.';
    toast(lectures.length + '강을 가져왔습니다 — 틀린 내용만 고친 뒤 등록하세요');
  } catch (error) {
    if (status && status.isConnected) status.textContent = '가져오기 실패 — 로그인이 필요한 페이지라면 목차 사진을 사용해 주세요.';
    toast('강좌 주소 읽기 실패 — ' + String(error && error.message || error));
  } finally {
    if (button.isConnected) { button.disabled = false; button.textContent = originalLabel; }
  }
}

function ingQuickText(count, minutes, courseName) {
  const total = Number(count), min = Number(minutes);
  if (!Number.isInteger(total) || !Number.isInteger(min) || total < 1 || total > 999 || min < 10 || min > 240) return '';
  const name = String(courseName || '').trim().replace(/\s+/g, ' ') || '강의';
  return Array.from({ length: total }, (_, i) =>
    (i + 1) + '강 ' + name + ' ' + (i + 1) + ' ' + min + '분').join('\n');
}

function ingScheduleFromForm(sid, cid) {
  const course = ingCourses(sid).find(x => x.id === cid);
  if (!course) return null;
  const start = ($('#ingStart') && $('#ingStart').value) || today();
  const end = ($('#ingEnd') && $('#ingEnd').value) || '';
  const days = Array.from(document.querySelectorAll('#ingDays .chip.on')).map(x => Number(x.dataset.v));
  const perDay = Math.max(1, Number($('#ingPer') && $('#ingPer').value) || 1);
  const temp = Object.assign({}, course, {
    defaultMin: Math.max(10, Number($('#ingDefaultMin') && $('#ingDefaultMin').value) || ING_DEFAULT_MIN)
  });
  if (start < today()) return { error: '시작일은 오늘 이후로 선택해 주세요' };
  if (!days.length) return { error: '요일을 하나 이상 선택해 주세요' };
  if (end && end < start) return { error: '목표일은 시작일 이후로 넣어주세요' };
  return { course: temp, start: start, end: end, days: days, perDay: perDay,
    result: ingBuildSchedule(sid, temp, start, end || addDays(start, 1099), days, perDay) };
}

function ingRenderPreview(sid, cid) {
  const data = ingScheduleFromForm(sid, cid), box = $('#ingPreview'), out = $('#ingCalcOut');
  if (!data || data.error) { if (data && data.error) toast(data.error); return null; }
  const r = data.result;
  if (!ingAvail(sid).configured) { out.textContent = '주간 일정을 먼저 설정해야 빈 시간을 계산할 수 있습니다.'; return data; }
  out.textContent = r.items.length + '강 배정 · ' + (r.complete
    ? (r.finishDate ? '예상 완강 ' + shortDate(r.finishDate) : '새로 배정할 강의 없음')
    : '가용시간 부족 · ' + r.remaining + '강 미배정');
  box.innerHTML = r.items.length ? '<div class="panel">' + r.items.slice(0, 7).map(it =>
    '<div class="between small" style="padding:4px 0"><span>' + shortDate(it.date) + '(' + DOW[dowOf(it.date)] +
      ') ' + esc(it.s) + '~' + esc(it.e) + '</span><b>' + it.seq + '강 ' + esc(it.title) + '</b></div>').join('') +
    (r.items.length > 7 ? '<div class="small muted mt14">외 ' + (r.items.length - 7) + '강</div>' : '') + '</div>' : '';
  return data;

   회독 — 같은 교재를 몇 번 돌렸는지. 목표 회독수 대비 진행을 본다.
   ══════════════════════════════════════════════════════ */
const rdKey = sid => '__rd__' + sid;
const rdItems = sid => ((state.checks[rdKey(sid) + '|all'] || {}).items) || [];
const rdSave = (sid, items) => setCheck(rdKey(sid), 'all', { items: items, done: true });
function rdDue(sid) {
  return rdItems(sid).filter(item => {
    if (!item.nextDate || item.nextDate > today() || Number(item.done || 0) >= Number(item.target || 0)) return false;
    if (!item.plannedTaskId) return true;
    const planned = state.tasks.find(task => !task.deleted && task.id === item.plannedTaskId);
    return !planned;
  });
}

/* ══════════════════════════════════════════════════════
   오답노트 — 틀린 문제를 기록하고 3일·7일 뒤에 다시 띄운다.
   등록일에 저장하고, 복습 횟수(rv)로 다음 복습일을 정한다.
   ══════════════════════════════════════════════════════ */
const WN_REVIEW = [3, 7];   // 등록 후 며칠 뒤에 다시 볼지
const wnKey = sid => '__wn__' + sid;
const wnOf = (sid, date) => ((state.checks[wnKey(sid) + '|' + date] || {}).items) || [];
const wnDates = sid => {
  const pre = wnKey(sid) + '|';
  return Object.keys(state.checks).filter(k => k.startsWith(pre)).map(k => k.slice(pre.length)).sort();
};
function wnAll(sid) {
  const out = [];
  wnDates(sid).forEach(d => wnOf(sid, d).forEach(x => out.push(Object.assign({}, x, { date: d }))));
  return out.sort((a, b) => b.date.localeCompare(a.date));
}
/** 오늘 다시 볼 오답 — 복습 회차별로 예정일이 지났고 아직 안 본 것 */
function wnDue(sid) {
  const t = today();
  return wnAll(sid).filter(x => {
    if (x.fixed) return false;
    const rv = x.rv || 0;
    if (rv >= WN_REVIEW.length) return false;
    if (x.reviewTaskId) {
      const planned = state.tasks.find(task => !task.deleted && task.id === x.reviewTaskId);
      if (planned) return false;
    }
    return (x.nextReviewDate || addDays(x.date, WN_REVIEW[rv])) <= t;
  });
}
function wnPatch(sid, date, id, patch) {
  wnOf(sid, date).length && setCheck(wnKey(sid), date, {
    items: wnOf(sid, date).map(x => x.id === id ? Object.assign({}, x, patch) : x), done: true
  });
}

function syncLinkedStudyTask(task, date) {
  if (!task || !isDone(task.id, date)) return;
  if (task.wrongNoteId && task.wrongNoteDate) {
    const item = wnOf(task.staffId, task.wrongNoteDate).find(row => row.id === task.wrongNoteId);
    if (!item) return;
    const history = Array.isArray(item.reviewHistory) ? item.reviewHistory.slice() : [];
    if (history.some(row => row.taskId === task.id)) return;
    const round = Math.min(WN_REVIEW.length, Math.max(Number(item.rv || 0) + 1, Number(task.wrongNoteRound || 1)));
    history.push({ taskId: task.id, date: date, at: now() });
    wnPatch(task.staffId, task.wrongNoteDate, task.wrongNoteId, {
      rv: round, reviewHistory: history, lastReviewedAt: date, reviewTaskId: '',
      nextReviewDate: round < WN_REVIEW.length ? addDays(date, WN_REVIEW[round]) : '',
      fixed: round >= WN_REVIEW.length
    });
    return;
  }
  if (task.readingRoundId) {
    const list = rdItems(task.staffId);
    const index = list.findIndex(item => item.id === task.readingRoundId);
    if (index < 0) return;
    const item = list[index];
    const history = Array.isArray(item.history) ? item.history.slice() : [];
    if (history.some(row => row.taskId === task.id)) return;
    const done = Math.min(Number(item.target || 1), Number(item.done || 0) + 1);
    const taskMinutes = Math.round(stTimelineSegments(task.staffId, date)
      .filter(segment => segment.taskId === task.id)
      .reduce((sum, segment) => sum + Math.max(0, Number(segment.end) - Number(segment.start)), 0) / 60000);
    history.push({ taskId: task.id, date: date, range: '', minutes: taskMinutes, at: now() });
    list[index] = Object.assign({}, item, {
      done: done, history: history, plannedTaskId: '', lastDate: date,
      nextDate: done < Number(item.target || 1) ? addDays(date, 7) : ''
    });
    rdSave(task.staffId, list);
  }
}

/* ══════════════════════════════════════════════════════
   학습 카드 — 외부 프로그램·자체 교재·자료를 종류별로 관리한다.
   외부 계정·비밀번호·문제 원문은 저장하지 않는다.
   ══════════════════════════════════════════════════════ */
/* ── 비공개 질문 · 인증사진 ──
 * 사진은 localStorage/state에 넣지 않는다. 화면에 필요한 목록만 메모리에 잠깐 둔다. */
const SUBMISSION_STATUS = Object.freeze({
  pending: '확인 대기', approved: '승인', rejected: '보완 요청', answered: '답변 완료', cancelled: '취소'
});
const submissionCache = { owner: '', items: [], loaded: false, loading: false, error: '' };
let submissionForm = null;
let submissionReviewDraft = null;
let submissionPreviewUrl = '';
let submissionLoadSeq = 0;

function clearSubmissionPreview() {
  if (submissionPreviewUrl) URL.revokeObjectURL(submissionPreviewUrl);
  submissionPreviewUrl = '';
}

async function submissionPost(body) {
  const auth = sync.auth();
  if (!auth) throw new Error('로그인과 동기화 연결이 필요합니다');
  return await sync.post('/consult-submission', Object.assign({ app: SYNC_APP, auth: auth }, body));
}

async function loadSubmissions(owner, force) {
  if (!owner || (submissionCache.loading && submissionCache.owner === owner)) return;
  if (!force && submissionCache.loaded && submissionCache.owner === owner) return;
  if (!sync.auth()) {
    submissionCache.owner = owner; submissionCache.items = []; submissionCache.loaded = true;
    submissionCache.error = '사진·질문을 확인하려면 로그인 연결이 필요합니다.';
    return;
  }
  const loadId = ++submissionLoadSeq;
  submissionCache.owner = owner; submissionCache.loading = true; submissionCache.error = '';
  try {
    const query = { action: 'list', owner: owner === '*' ? '' : owner };
    if (owner === '*') { query.status = 'pending'; query.limit = 50; }
    const data = await submissionPost(query);
    if (loadId !== submissionLoadSeq || submissionCache.owner !== owner) return;
    submissionCache.items = Array.isArray(data.submissions) ? data.submissions : [];
    submissionCache.loaded = true;
  } catch (error) {
    if (loadId === submissionLoadSeq && submissionCache.owner === owner) {
      submissionCache.items = []; submissionCache.loaded = true;
      submissionCache.error = String(error && error.message || error);
    }
  } finally {
    if (loadId !== submissionLoadSeq) return;
    submissionCache.loading = false;
    const me = currentStaff();
    if ((me && me.id === owner) || (owner === '*' && route === 'board')) renderAfterSync();
  }
}

function ensureSubmissionLoad(owner) {
  if (!owner) return;
  if (submissionCache.owner !== owner) {
    submissionLoadSeq++;
    submissionCache.owner = owner; submissionCache.items = []; submissionCache.loaded = false; submissionCache.loading = false; submissionCache.error = '';
  }
  if (!submissionCache.loaded && !submissionCache.loading) setTimeout(() => loadSubmissions(owner, false), 0);
}

function latestProof(taskId, date) {
  return submissionCache.items.filter(item => item.kind === 'proof' && item.taskId === taskId && item.taskDate === date && item.status !== 'cancelled')
    .sort((a, b) => Number(b.createdAt || 0) - Number(a.createdAt || 0))[0] || null;
}

function performanceSubmissionFor(item) {
  if (!item || item.academicType !== 'performance') return null;
  const date = academicDateOf(item);
  return submissionCache.items.filter(row => row.kind === 'question' && row.taskId === item.id && row.taskDate === date && row.status !== 'cancelled')
    .sort((a, b) => Number(b.createdAt || 0) - Number(a.createdAt || 0))[0] || null;
}

function submissionStatusTag(item) {
  const cls = item.status === 'approved' || item.status === 'answered' ? 'ok' : item.status === 'rejected' ? 'high' : 'doing';
  return '<span class="tag ' + cls + '">' + esc(SUBMISSION_STATUS[item.status] || item.status) + '</span>';

    (actions ? '<div class="submission-actions">' + actions + '</div>' : '') + '</div>';

async function prepareSubmissionImage(file) {
  if (!file) return null;
  if (!String(file.type || '').startsWith('image/')) throw new Error('사진 파일만 선택해 주세요');
  if (file.size > 15 * 1024 * 1024) throw new Error('원본 사진이 너무 큽니다 (최대 15MB)');
  let source, sourceUrl = '';
  try {
    if ('createImageBitmap' in window) {
      try { source = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
      catch (error) { source = null; }
    }
    if (!source) {
      sourceUrl = URL.createObjectURL(file);
      source = await new Promise((resolve, reject) => {
        const image = new Image(); image.onload = () => resolve(image); image.onerror = () => reject(new Error('사진을 읽을 수 없습니다')); image.src = sourceUrl;
      });
    }
    const sw = source.width || source.naturalWidth, sh = source.height || source.naturalHeight;
    if (!sw || !sh) throw new Error('사진 크기를 확인할 수 없습니다');
    let limit = 1600, quality = .82, blob = null;
    for (let attempt = 0; attempt < 3; attempt++) {
      const scale = Math.min(1, limit / Math.max(sw, sh));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(sw * scale)); canvas.height = Math.max(1, Math.round(sh * scale));
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.drawImage(source, 0, 0, canvas.width, canvas.height);
      blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
      if (!blob) throw new Error('사진을 JPEG로 바꾸지 못했습니다');
      if (blob.size <= 1.5 * 1024 * 1024) break;
      limit = attempt === 0 ? 1280 : 1024; quality = attempt === 0 ? .72 : .64;
    }
    if (!blob || blob.size > 2 * 1024 * 1024) throw new Error('압축 후에도 사진이 너무 큽니다. 화면을 조금 더 가까이 찍어주세요');
    return new File([blob], 'image.jpg', { type: 'image/jpeg' });
  } finally {
    if (source && typeof source.close === 'function') source.close();
    if (sourceUrl) URL.revokeObjectURL(sourceUrl);
  }
}

async function submitSubmissionForm(button) {
  if (!submissionForm || !session.isStaffLink) return;
  const auth = sync.auth();
  if (!auth) return toast('로그인과 동기화 연결이 필요합니다');
  const performance = !!submissionForm.performance;
  const textEl = $('#submissionText');
  const rawText = (textEl && textEl.value || '').trim();
  let bodyText = rawText;
  const subjectEl = $('#submissionSubject');
  if (subjectEl && subjectEl.value && STUDY_SUBJECTS[subjectEl.value]) bodyText = '[' + STUDY_SUBJECTS[subjectEl.value].label + '] ' + bodyText;
  const fileEl = $('#submissionFile');
  const rawFile = fileEl && fileEl.files && fileEl.files[0];
  if (submissionForm.kind === 'proof' && !rawFile) return toast('인증사진을 선택해 주세요');
  if (submissionForm.kind === 'question' && !rawText && !rawFile) return toast(performance ? '평가 안내 내용이나 사진 중 하나를 넣어주세요' : '질문 내용이나 사진 중 하나를 넣어주세요');
  button.disabled = true; button.textContent = '사진 준비 중…';
  try {
    if (submissionForm.kind === 'question' && !rawFile) {
      button.textContent = performance ? '평가 안내 전송 중…' : '질문 전송 중…';
      await submissionPost({ action: 'submit_question', clientRequestId: submissionForm.clientRequestId,
        taskId: submissionForm.taskId, taskDate: submissionForm.taskDate, bodyText: bodyText });
    } else {
      const file = await prepareSubmissionImage(rawFile);
      const form = new FormData();
      form.set('app', SYNC_APP); form.set('auth', JSON.stringify(auth)); form.set('kind', submissionForm.kind);
      form.set('clientRequestId', submissionForm.clientRequestId); form.set('taskId', submissionForm.taskId); form.set('taskDate', submissionForm.taskDate); form.set('bodyText', bodyText);
      if (file) form.set('file', file);
      button.textContent = '업로드 중…';
      const response = await fetch(SYNC_URL + '/consult-submission-upload', { method: 'POST', body: form });
      const data = await response.json().catch(() => null);
      if (!response.ok || !data || data.ok !== true) throw new Error((data && data.error) || ('HTTP ' + response.status));
    }
    const owner = session.staffId;
    submissionForm = null; clearSubmissionPreview(); closeModal();
    await loadSubmissions(owner, true); render(); toast('안전하게 제출했습니다');
  } catch (error) {
    toast('제출 실패 — ' + String(error && error.message || error));
    button.disabled = false; button.textContent = performance ? '평가 안내 보내기' : submissionForm && submissionForm.kind === 'question' ? '질문 보내기' : '인증사진 보내기';
  }
}

async function saveSubmissionReview() {
  if (!session.isAdmin || !submissionReviewDraft) return;
  const draft = submissionReviewDraft;
  const textEl = $('#submissionReviewText');

function learningTaskDate(task) {
  if (!task) return '';
  const move = weekMovesFor(task.staffId).find(row => row.taskId === task.id);
  return move ? move.to : (task.start || '');
}

function learningDueDate(task) {
  return String((task && (task.dueDate || task.start)) || '');
}

function learningAcademicEvent(task) {
  if (!task || !task.academicEventId) return null;
  return state.tasks.find(row => !row.deleted && row.id === task.academicEventId &&
    row.kind === 'academic_event' && row.staffId === task.staffId) || null;
}

function learningExamOptions(staffId, selected) {
  const exams = academicItemsFor(staffId).filter(item => item.academicType === 'exam');
  return '<option value="">연결 안 함</option>' + exams.map(item =>
    '<option value="' + esc(item.id) + '"' + (item.id === selected ? ' selected' : '') + '>' +
      esc(item.title) + ' · ' + shortDate(academicDateOf(item)) + '</option>').join('');
}

function learningTasksFor(staffId, sourceKey) {
  if (!LEARNING_SOURCES[sourceKey]) return [];
  return state.tasks
    .filter(t => !t.deleted && t.staffId === staffId && t.source === sourceKey)
    .sort((a, b) => {
      const aDate = learningTaskDate(a), bDate = learningTaskDate(b);
      const ad = isDone(a.id, aDate), bd = isDone(b.id, bDate);
      if (ad !== bd) return ad - bd;
      const as = aDate || '', bs = bDate || '';
      return ad ? bs.localeCompare(as) : as.localeCompare(bs);
    });
}

  const appOnly = source.appOnly === true;

  const help = director
    ? esc(me.name) + '에게 ' + esc(source.detail) + ' 과제를 보내고 확인합니다.'

      : esc(source.detail) + ' 과제와 진행 상태만 모아 봅니다.';
  const url = appOnly
    ? classcardAppUrl(navigator.userAgent, navigator.maxTouchPoints)

    : '';
  const appHint = appOnly
    ? '<div class="small muted mb8">' + (url
        ? '공식 앱 스토어 화면으로 이동합니다. 이미 설치했다면 ‘열기’를 눌러 주세요.'
        : '클래스카드 앱 연결은 휴대폰에서 이 화면을 열어 이용하세요.') + '</div>'
    : '';
  const addLabel = sourceKey === 'exam_material' ? '＋ 자료 보내기' : '＋ 과제 보내기';
  const active = list.filter(task => !isDone(task.id, learningTaskDate(task)));
  const completed = list.filter(task => isDone(task.id, learningTaskDate(task)));
  const late = active.filter(task => learningDueDate(task) && learningDueDate(task) < today()).length;

  return '<details class="card study-source-card" data-learning-source="' + esc(sourceKey) + '"' + (late ? ' open' : '') + '>' +
    '<summary class="study-source-summary"><span class="study-source-head"><span class="study-source-icon">' + source.icon + '</span>' +
      '<span class="study-source-copy"><b>' + esc(source.label) + '</b><span>' + esc(source.detail) + '</span></span></span>' +
      '<span class="study-source-count">' + (late ? '<span class="pill bad">지연 ' + late + '</span>' : '') +
        '<span class="pill' + (active.length ? ' warn' : '') + '">' + active.length + '건</span></span></summary>' +
    '<div class="study-source-body"><div class="small muted mt14">' + help + '</div>' +
    '<div class="study-source-actions">' +
      (director ? '<button class="btn btn-primary" data-act="learnadd" data-source="' + esc(sourceKey) + '">' + addLabel + '</button>' : '') + link +
    '</div>' +
    appHint +
    (active.length
      ? active.map(t => taskRow(t, learningTaskDate(t), editable, false)).join('')
      : '<div class="small muted">진행할 ' + esc(source.label) + ' 과제가 없습니다.</div>') +
    (completed.length ? '<details class="study-completed"><summary>완료 기록 ' + completed.length + '건 보기</summary>' +
      completed.slice(0, 10).map(t => taskRow(t, learningTaskDate(t), editable, false)).join('') + '</details>' : '') +
    '</div></details>';
}

const weekPlanKey = staffId => '__weekplan__' + staffId;
function weekPlanOf(staffId, anchor) {
  const c = state.checks[weekPlanKey(staffId) + '|' + mondayOf(anchor)];
  return Object.assign({ subjectGoals: {}, reflection: '', directorNote: '', nextFocus: '' }, (c && c.plan) || {});
}
const WEEK_CLOSE_START = '2026-08-17';
const weekCloseKey = staffId => '__weekclose__' + staffId;
function weekCloseOf(staffId, anchor) {
  const mon = mondayOf(anchor);
  const check = state.checks[weekCloseKey(staffId) + '|' + mon];
  const close = Object.assign({
    status: 'open', difficulty: '', studentNextFocus: '', resolutions: {},
    itemSnapshot: [], summary: null, reviewToken: '', copyToken: ''
  }, (check && check.close) || {});
  close.resolutions = Object.assign({}, close.resolutions || {});
  close.itemSnapshot = Array.isArray(close.itemSnapshot) ? close.itemSnapshot : [];
  return close;
}
function weekCloseDays(anchor) {
  const mon = mondayOf(anchor);
  return Array.from({ length: 7 }, (_, index) => addDays(mon, index));
}
function weekCloseFollowups(staffId, anchor) {
  const out = [];
  weekCloseDays(anchor).forEach(date => {
    const daily = dailyCloseOf(staffId, date);
    const items = daily.itemSnapshot.length ? daily.itemSnapshot : dailyCloseStudyItems(staffId, date);
    items.filter(item => !item.done).forEach(item => {
      const dailyResolution = daily.resolutions[item.key] || {};
      out.push({
        key: date + '|' + item.key, date: date, itemKey: item.key,
        label: item.label, detail: item.detail || '', subjectKey: item.subjectKey || 'other',
        dailyType: dailyResolution.type || '', dailyNote: dailyResolution.note || ''
      });
    });
  });
  return out;
}
function weekCloseSummary(staffId, anchor) {
  const mon = mondayOf(anchor);
  const days = weekCloseDays(mon);
  let done = 0, total = 0, activeDays = 0, closedDays = 0, totalSecs = 0;
  days.forEach(date => {
    const daily = dailyCloseOf(staffId, date);
    const items = daily.itemSnapshot.length ? daily.itemSnapshot : dailyCloseStudyItems(staffId, date);
    const active = items.length || stTotal(staffId, date) > 0 || daily.reviewedAt;
    done += items.filter(item => item.done).length;
    total += items.length;
    totalSecs += stTotal(staffId, date);
    if (active && date >= DAILY_CLOSE_START) {
      activeDays++;
      if (dailyCloseState(staffId, date).complete) closedDays++;
    }
  });
  const actual = weekSubjectActual(staffId, days);
  const topKey = STUDY_SUBJECT_KEYS.slice().sort((a, b) => (actual[b] || 0) - (actual[a] || 0))[0] || 'other';
  const sunday = days[6];
  const sundayClose = dailyCloseOf(staffId, sunday);
  const events = dailyCloseEventRefs(staffId, sunday).map(ref => ({
    id: ref.event.id, title: ref.event.title, date: ref.event.date,
    progress: Object.prototype.hasOwnProperty.call(sundayClose.eventProgress, ref.event.id)
      ? Number(sundayClose.eventProgress[ref.event.id]) : Number(ref.event.progress) || 0
  }));
  return {
    mon: mon, sun: sunday, done: done, total: total,
    pct: total ? Math.round(done / total * 100) : 0,
    activeDays: activeDays, closedDays: closedDays, totalSecs: totalSecs,
    actual: actual, topKey: totalSecs ? topKey : '', events: events
  };
}
function weekHadActivity(staffId, anchor) {
  const summary = weekCloseSummary(staffId, anchor);
  const plan = weekPlanOf(staffId, anchor);
  return !!(summary.total || summary.totalSecs || summary.activeDays || (plan.reflection || '').trim());
}
function weekCloseUnclosedDays(staffId, anchor) {
  return weekCloseDays(anchor).filter(date => {
    if (date < DAILY_CLOSE_START) return false;
    const close = dailyCloseOf(staffId, date);
    const active = dailyCloseStudyItems(staffId, date).length || stTotal(staffId, date) > 0 || close.reviewedAt;
    return active && !dailyCloseState(staffId, date).complete;
  });
}
function weekCloseComplete(staffId, anchor) {
  return ['complete', 'overridden'].includes(weekCloseOf(staffId, anchor).status);
}
function weekCloseAvailable(anchor) {
  const mon = mondayOf(anchor);
  return mon >= WEEK_CLOSE_START && today() >= addDays(mon, 6);
}
function previousUnclosedWeek(staffId, date) {
  const currentMon = mondayOf(date);
  const weeks = [];
  for (let mon = addDays(currentMon, -7), guard = 0; mon >= WEEK_CLOSE_START && guard++ < 520; mon = addDays(mon, -7)) {
    weeks.unshift(mon);
  }
  for (const mon of weeks) {
    if (weekHadActivity(staffId, mon) && !weekCloseComplete(staffId, mon)) return mon;
  }
  return '';
}
function weekCloseStatusLabel(staffId, anchor) {
  const close = weekCloseOf(staffId, anchor);
  if (close.status === 'complete') return { key: 'complete', label: '주간 마감 완료' };
  if (close.status === 'overridden') return { key: 'complete', label: '원장 대신 마감' };
  if (!weekCloseAvailable(anchor)) return { key: 'future', label: '일요일 마감 예정' };
  if (close.status === 'reviewed') return { key: 'ready', label: '보고 전' };
  return { key: 'open', label: '주간 마감 필요' };
}
function weekSubjectActual(staffId, days) {
  const totals = Object.fromEntries(STUDY_SUBJECT_KEYS.map(key => [key, 0]));
  days.forEach(date => {
    const daily = stCategorySecs(stSecs(staffId, date));
    STUDY_SUBJECT_KEYS.forEach(key => { totals[key] += daily[key] || 0; });
  });
  return totals;
}
function weekUnclaimedOffers(staffId, days) {
  const out = [];
  days.forEach(date => studyOffersFor(staffId, date).forEach(task => {
    const check = getCheck(task.id, date) || {};
    const resolved = (dailyCloseOf(staffId, date).resolutions['task:' + task.id] || {}).type;
    if (!isStudyClaimed(task, date) && !check.dropped && !resolved) out.push({ t: task, date: date });
  }));
  return out.sort((a, b) => a.date.localeCompare(b.date));
}
function weekBacklog(staffId, days) {
  const found = new Map();
  const moves = weekMovesFor(staffId, days[0]);
  carryOver(staffId, days[0]).forEach(item => found.set(item.t.id + '|' + item.date, item));
  days.filter(date => date < today()).forEach(date => checklistTasksFor(staffId, date).forEach(task => {
    if (task.carry && !isDone(task.id, date)) found.set(task.id + '|' + date, { t: task, date: date });
  }));
  return [...found.values()]
    .filter(item => !moves.some(move => move.taskId === item.t.id && move.from === item.date))
    .sort((a, b) => a.date.localeCompare(b.date));
}

function weekReportText(staffId, mon) {
  const student = staffById(staffId);
  const close = weekCloseOf(staffId, mon);
  const summary = close.summary || weekCloseSummary(staffId, mon);
  const items = close.itemSnapshot.length ? close.itemSnapshot : weekCloseFollowups(staffId, mon);
  let txt = '📊 ' + shortDate(mon) + ' ~ ' + shortDate(addDays(mon, 6)) + ' 주간 수행 보고\n' +
    (student ? student.name + '\n' : '') +
    '학습 완료 ' + summary.done + '/' + summary.total + '건 (' + summary.pct + '%)\n' +
    '주간 순공시간 ' + fmtDur(summary.totalSecs) + '\n' +
    '활동일 마감 ' + summary.closedDays + '/' + summary.activeDays + '일\n─────────\n' +
    STUDY_SUBJECT_KEYS.filter(key => Number((summary.actual || {})[key]) > 0)
      .map(key => '· ' + STUDY_SUBJECTS[key].label + ' ' + fmtDur(summary.actual[key])).join('\n');
  txt += '\n─────────\n📝 학생 주간 회고\n· 잘한 점: ' + (close.reflection || weekPlanOf(staffId, mon).reflection || '—') +
    '\n· 어려웠던 점: ' + (close.difficulty || '—') +
    '\n· 다음 주 집중: ' + (close.studentNextFocus || '—');
  if (items.length) {
    txt += '\n─────────\n↪ 미완료 공부 정리\n' + items.map(item => {
      const resolution = close.resolutions[item.key] || {};
      const result = resolution.type === 'next' ? '다음 주 계속' : resolution.type === 'help' ? '원장 도움 요청' : '이번 주 종료';
      return '· ' + item.label + ' [' + result + ']' + (resolution.note ? ' — ' + resolution.note : '');
    }).join('\n');
  }
  if ((summary.events || []).length) txt += '\n─────────\n📌 시험·중요 일정 준비율\n' +
    summary.events.map(event => '· ' + event.title + ' · 준비 ' + event.progress + '%').join('\n');
  return txt;
}
