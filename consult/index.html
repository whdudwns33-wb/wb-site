/* ── 월간 플래너 ── */
const monthPlanKey = staffId => '__monthplan__' + staffId;
const MONTH_EVENT_KINDS = Object.freeze({ exam: '시험', mock: '모의고사', performance: '수행평가', apply: '원서·접수', consult: '상담', other: '기타' });
function monthPlanOf(staffId, ym) {
  const c = state.checks[monthPlanKey(staffId) + '|' + ym];
  const plan = Object.assign({ subjectGoals: {}, events: [], reflection: '', directorNote: '', nextFocus: '' }, (c && c.plan) || {});
  plan.events = Array.isArray(plan.events) ? plan.events.filter(event =>
    event && event.id && event.title && /^\d{4}-\d{2}-\d{2}$/.test(event.date || '')) : [];
  return plan;
}
const MONTH_CLOSE_START = '2026-08';
const monthCloseKey = staffId => '__monthclose__' + staffId;
const monthLastDate = ym => addDays(ymAdd(ym, 1) + '-01', -1);
function monthCloseOf(staffId, ym) {
  const check = state.checks[monthCloseKey(staffId) + '|' + ym];
  const close = Object.assign({
    status: 'open', difficulty: '', studentNextFocus: '', resolutions: {},
    itemSnapshot: [], summary: null, reviewToken: '', copyToken: ''
  }, (check && check.close) || {});
  close.resolutions = Object.assign({}, close.resolutions || {});
  close.itemSnapshot = Array.isArray(close.itemSnapshot) ? close.itemSnapshot : [];
  return close;
}
function monthCloseFollowups(staffId, ym) {
  const out = [];
  monthDates(ym).forEach(date => {
    const daily = dailyCloseOf(staffId, date);
    const items = daily.itemSnapshot.length ? daily.itemSnapshot : dailyCloseStudyItems(staffId, date);
    items.filter(item => !item.done).forEach(item => {
      const dailyResolution = daily.resolutions[item.key] || {};
      out.push({
        key: date + '|' + item.key, date: date, itemKey: item.key,
        label: item.label, detail: item.detail || '', subjectKey: item.subjectKey || 'other',
        dailyType: dailyResolution.type || '', dailyNote: dailyResolution.note || ''
      });
    });
  });
  return out;
}
function monthCloseSummary(staffId, ym) {
  const dates = monthDates(ym);
  const stats = monthSubjectStats(staffId, ym);
  let done = 0, total = 0, activeDays = 0, closedDays = 0, totalSecs = 0;
  dates.forEach(date => {
    const daily = dailyCloseOf(staffId, date);
    const items = daily.itemSnapshot.length ? daily.itemSnapshot : dailyCloseStudyItems(staffId, date);
    const active = items.length || stTotal(staffId, date) > 0 || daily.reviewedAt;
    done += items.filter(item => item.done).length;
    total += items.length;
    totalSecs += stTotal(staffId, date);
    if (active && date >= DAILY_CLOSE_START) {
      activeDays++;
      if (dailyCloseState(staffId, date).complete) closedDays++;
    }
  });
  const actual = Object.fromEntries(STUDY_SUBJECT_KEYS.map(key => [key, stats[key].secs]));
  const topKey = STUDY_SUBJECT_KEYS.slice().sort((a, b) => actual[b] - actual[a])[0] || 'other';
  const plan = monthPlanOf(staffId, ym);
  const goals = goalsFor(staffId, ym);
  return {
    ym: ym, lastDate: monthLastDate(ym), done: done, total: total,
    pct: total ? Math.round(done / total * 100) : 0,
    activeDays: activeDays, closedDays: closedDays, totalSecs: totalSecs,
    actual: actual, topKey: totalSecs ? topKey : '',
    goalsDone: goals.filter(goal => isDone(goal.id, ym)).length, goalsTotal: goals.length,
    events: plan.events.map(event => ({ id: event.id, title: event.title, date: event.date, progress: Number(event.progress) || 0 }))
  };
}
function monthHadActivity(staffId, ym) {
  const summary = monthCloseSummary(staffId, ym);
  const plan = monthPlanOf(staffId, ym);
  return !!(summary.total || summary.totalSecs || summary.activeDays || summary.goalsTotal || plan.events.length || (plan.reflection || '').trim());
}
function monthCloseUnclosedDays(staffId, ym) {
  return monthDates(ym).filter(date => {
    if (date < DAILY_CLOSE_START || date > today()) return false;
    const close = dailyCloseOf(staffId, date);
    const active = dailyCloseStudyItems(staffId, date).length || stTotal(staffId, date) > 0 || close.reviewedAt;
    return active && !dailyCloseState(staffId, date).complete;
  });
}
function monthCloseUnclosedWeeks(staffId, ym) {
  const weeks = [];
  monthDates(ym).filter(date => dowOf(date) === 0 && date <= today()).forEach(sunday => {
    const mon = mondayOf(sunday);
    if (mon >= WEEK_CLOSE_START && weekHadActivity(staffId, mon) && !weekCloseComplete(staffId, mon)) weeks.push(mon);
  });
  return weeks;
}
function monthCloseComplete(staffId, ym) {
  return ['complete', 'overridden'].includes(monthCloseOf(staffId, ym).status);
}
function monthCloseAvailable(ym) {
  return ym >= MONTH_CLOSE_START && today() >= monthLastDate(ym);
}
function previousUnclosedMonth(staffId, date) {
  const currentYm = ymOf(date);
  const months = [];
  for (let ym = ymAdd(currentYm, -1), guard = 0; ym >= MONTH_CLOSE_START && guard++ < 120; ym = ymAdd(ym, -1)) months.unshift(ym);
  for (const ym of months) {
    if (monthHadActivity(staffId, ym) && !monthCloseComplete(staffId, ym)) return ym;
  }
  return '';
}
function monthCloseStatusLabel(staffId, ym) {
  const close = monthCloseOf(staffId, ym);
  if (close.status === 'complete') return { key: 'complete', label: '월간 마감 완료' };
  if (close.status === 'overridden') return { key: 'complete', label: '원장 대신 마감' };
  if (!monthHadActivity(staffId, ym)) return { key: 'empty', label: '기록 없음 · 마감 제외' };
  if (!monthCloseAvailable(ym)) return { key: 'future', label: '말일 마감 예정' };
  if (close.status === 'reviewed') return { key: 'ready', label: '보고 전' };
  return { key: 'open', label: '월간 마감 필요' };
}
function monthSubjectStats(staffId, ym) {
  const stats = Object.fromEntries(STUDY_SUBJECT_KEYS.map(key => [key, { secs: 0, done: 0, total: 0 }]));
  monthDates(ym).forEach(date => {
    const daily = stCategorySecs(stSecs(staffId, date));
    STUDY_SUBJECT_KEYS.forEach(key => { stats[key].secs += daily[key] || 0; });
    checklistTasksFor(staffId, date).forEach(task => {
      const item = stats[taskStudySubjectKey(task)];
      item.total++;
      if (isDone(task.id, date)) item.done++;
    });
  });
  return stats;
}
function monthReport(staffId, ym, stats) {
  const dates = monthDates(ym);
  const elapsed = dates.filter(date => date <= today());
  const totalSecs = STUDY_SUBJECT_KEYS.reduce((sum, key) => sum + stats[key].secs, 0);
  const totalTasks = STUDY_SUBJECT_KEYS.reduce((sum, key) => sum + stats[key].total, 0);
  const doneTasks = STUDY_SUBJECT_KEYS.reduce((sum, key) => sum + stats[key].done, 0);
  const dailyGoal = stGoalMin(staffId) * 60;
  const goalDays = dailyGoal ? elapsed.filter(date => stTotal(staffId, date) >= dailyGoal).length : 0;
  const topKey = STUDY_SUBJECT_KEYS.slice().sort((a, b) => stats[b].secs - stats[a].secs)[0];
  return {
    totalSecs: totalSecs,
    avgSecs: elapsed.length ? Math.round(totalSecs / elapsed.length) : 0,
    doneTasks: doneTasks,
    totalTasks: totalTasks,
    goalDays: goalDays,
    elapsedDays: elapsed.length,
    topKey: totalSecs ? topKey : ''
  };
}
function monthBacklog(staffId, ym) {

/* ── 학생의 하루 마감 ──
 * 오늘 탭에서 미완료 처리와 시험 준비율 확인을 끝내야 보고 문자를 만들 수 있다. */
const DAILY_CLOSE_START = '2026-08-18';
const dailyCloseKey = staffId => '__dailyclose__' + staffId;
function dailyCloseOf(staffId, date) {
  const check = state.checks[dailyCloseKey(staffId) + '|' + date];
  const close = Object.assign({ status: 'open', resolutions: {}, eventProgress: {}, itemSnapshot: [] },
    (check && check.close) || {});
  close.resolutions = Object.assign({}, close.resolutions || {});
  close.eventProgress = Object.assign({}, close.eventProgress || {});
  close.itemSnapshot = Array.isArray(close.itemSnapshot) ? close.itemSnapshot : [];
  return close;
}

function dailyCloseStudyItems(staffId, date) {
  const tasks = tasksFor(staffId, date).map(task => {
    const check = getCheck(task.id, date);
    const claimed = isStudyClaimed(task, date);
    return {
      key: 'task:' + task.id, type: 'task', id: task.id, task: task,
      label: task.title, detail: task.detail || '', subjectKey: taskStudySubjectKey(task),
      carriedFromDate: task.dailyCarrySourceDate || '', carryOriginDate: task.dailyCarryOriginDate || '',
      claimed: claimed, done: !!(check && check.done), blocked: !!(check && check.blocked), dropped: !!(check && check.dropped)
    };
  });
  const lectures = ingChecklistItems(staffId, date).map(item => {
    const found = ingLec(staffId, item.cid, item.seq);
    return {
      key: 'lecture:' + item.cid + ':' + Number(item.seq), type: 'lecture', cid: item.cid, seq: Number(item.seq), item: item,
      label: found ? found.course.name + ' ' + item.seq + '강' : '인강 ' + item.seq + '강',
      detail: found && found.lec.title ? found.lec.title : '',
      subjectKey: found ? ingCourseSubjectKey(found.course) : 'other', done: !!item.done,
      blocked: !!item.blocked, dropped: !!item.closed
    };
  });
  return tasks.concat(lectures);
}

function dailyCloseEventRefs(staffId, date) {
  const end = addDays(date, 30);
  const months = [...new Set([ymOf(date), ymOf(end)])];
  const refs = [];
  months.forEach(ym => {
    const plan = monthPlanOf(staffId, ym);
    plan.events.forEach(event => {
      if (event.date >= date && event.date <= end) refs.push({ ym: ym, plan: plan, event: event });
    });
  });
  return refs.sort((a, b) => a.event.date.localeCompare(b.event.date)).slice(0, 3);
}

function dailyCloseSignature(staffId, date, override) {
  const close = override || dailyCloseOf(staffId, date);
  const items = dailyCloseStudyItems(staffId, date).map(item => [item.key, item.done, item.blocked, item.dropped]);
  const events = dailyCloseEventRefs(staffId, date).map(ref => [ref.event.id, Number(ref.event.progress) || 0]);
  const resolutions = Object.keys(close.resolutions || {}).sort().map(key => {
    const row = close.resolutions[key] || {};
    return [key, row.type || '', row.note || ''];
  });
  return JSON.stringify([items, events, resolutions, stTotal(staffId, date)]);
}

function dailyCloseState(staffId, date) {
  const close = dailyCloseOf(staffId, date);
  const items = dailyCloseStudyItems(staffId, date);
  const incomplete = items.filter(item => !item.done);
  const unresolved = incomplete.filter(item => !(close.resolutions[item.key] || {}).type);
  const events = dailyCloseEventRefs(staffId, date);
  const unconfirmedEvents = events.filter(ref =>
    !Object.prototype.hasOwnProperty.call(close.eventProgress, ref.event.id));
  const running = date === today() ? stRunning(staffId, date) : null;
  const signature = dailyCloseSignature(staffId, date, close);
  const reviewCurrent = !!close.reviewedAt && close.reviewSignature === signature;
  const complete = close.status === 'complete' && close.signature === signature;
  return {
    close: close, items: items, incomplete: incomplete, unresolved: unresolved,
    events: events, unconfirmedEvents: unconfirmedEvents, running: running,
    signature: signature, reviewCurrent: reviewCurrent, complete: complete,
    canReport: !running && !unresolved.length && !unconfirmedEvents.length && reviewCurrent
  };
}

function dailyCloseStatusLabel(staffId, date) {
  if (date < DAILY_CLOSE_START) return { key: 'legacy', label: '도입 전' };
  const data = dailyCloseState(staffId, date);
  if (data.complete) return { key: 'complete', label: '마감 완료' };
  if (date > today()) return { key: 'future', label: '예정' };
  if (data.canReport) return { key: 'ready', label: '보고 전' };
  if (data.close.reviewedAt) return { key: 'changed', label: '재확인 필요' };
  if (date < today()) return { key: 'miss', label: '미마감' };
  return { key: 'open', label: '진행 중' };
}

function dailyUnclosedDates(staffId, date) {
  const out = [];
  for (let offset = 7; offset >= 1; offset--) {
    const target = addDays(date, -offset);
    if (target < DAILY_CLOSE_START) continue;
    const close = dailyCloseOf(staffId, target);
    const hadStudy = dailyCloseStudyItems(staffId, target).length || stTotal(staffId, target) > 0 || close.reviewedAt;
    if (hadStudy && !dailyCloseState(staffId, target).complete) out.push(target);
  }
  return out;
}

    '<div class="between"><div><div class="card-title">✅ ' + (date === today() ? '오늘' : label(date)) + ' 학습 마무리</div>' +
      '<div class="card-sub">아래 단계를 확인해야 오늘 최종 마감을 완료할 수 있습니다.</div></div>' +
      '<span class="pill ' + (data.complete && !weeklyRequired && !monthlyRequired && !priorDates.length ? '' : data.canReport && !priorDates.length ? 'warn' : 'bad') + '">' +
        (priorDates.length ? '이전 마감 필요' : weeklyRequired ? '주간 마무리 필요' : monthlyRequired ? '월간 마무리 필요' : status.label) + '</span></div>' +
    '<div class="daily-close-steps">' +
      '<div class="daily-close-step ' + (!data.running ? 'ok' : 'warn') + '"><span>1 · 공부 종료</span><b>' +
        (data.running ? '타이머 정지 필요' : done + '/' + total + '개 완료') + '</b></div>' +
      '<div class="daily-close-step ' + (!data.unresolved.length ? 'ok' : 'warn') + '"><span>2 · 미완료 정리</span><b>' +
        (data.unresolved.length ? data.unresolved.length + '개 처리 필요' : '정리 완료') + '</b></div>' +
      '<div class="daily-close-step ' + (!data.unconfirmedEvents.length ? 'ok' : 'warn') + '"><span>3 · 일정 준비율</span><b>' + eventText + '</b></div>' +
      (date === addDays(weekMon, 6) ? '<div class="daily-close-step ' + (weekCloseComplete(student.id, weekMon) ? 'ok' : 'warn') + '"><span>4 · 주간 마무리</span><b>' +
        (weekCloseComplete(student.id, weekMon) ? '마감 완료' : '회고·보고 필요') + '</b></div>' : '') +
      (monthEnd ? '<div class="daily-close-step ' + (monthCloseComplete(student.id, monthYm) || !monthHasActivity ? 'ok' : 'warn') + '"><span>' +

function dailyCarryTask(task, date, targetDate) {
  const carryFrom = task.id + '|' + date;
  const existing = state.tasks.find(row => !row.deleted && row.dailyCarryFrom === carryFrom);
  if (existing) return existing;
  const nextDate = targetDate || (date < today() ? today() : addDays(date, 1));
  const stamp = now();
  const rootId = task.dailyCarryRootId || task.id;
  const carried = Object.assign({}, task, {
    id: 'daily-carry-' + rootId + '-' + date, groupId: task.groupId || ('daily-carry-' + stamp),
    repeat: 'once', days: [], start: nextDate, end: '', carry: true, requiresClaim: false,
    dailyCarryFrom: carryFrom, dailyCarryRootId: rootId, dailyCarrySourceDate: date,
    dailyCarryOriginDate: task.dailyCarryOriginDate || task.dailyCarrySourceDate || date,
    dailyCarryDepth: Number(task.dailyCarryDepth || 0) + 1,
    createdAt: stamp, updatedAt: stamp, deleted: false
  });
  state.tasks.push(carried);
  return carried;
}

/** 이전 버전에서 원래 날짜에 완료 처리된 이월 기록을 실제 완료 날짜의 항목으로 옮긴다. */
function ensureRecentDailyCarryTasks() {
  let changed = false;
  const oldest = addDays(today(), -7);
  liveStaff().forEach(student => {
    const prefix = dailyCloseKey(student.id) + '|';
    Object.keys(state.checks).filter(key => key.startsWith(prefix)).forEach(key => {
      const sourceDate = key.slice(prefix.length);
      if (sourceDate < oldest || sourceDate >= today()) return;
      const close = dailyCloseOf(student.id, sourceDate);
      Object.entries(close.resolutions || {}).forEach(([itemKey, resolution]) => {
        if (!resolution || resolution.type !== 'carry' || !itemKey.startsWith('task:')) return;
        const taskId = itemKey.slice(5);
        const task = state.tasks.find(row => !row.deleted && row.id === taskId && row.staffId === student.id);
        if (!task) return;
        const sourceCheck = getCheck(task.id, sourceDate);
        let completedDate = '';
        if (sourceCheck && sourceCheck.done && Number(sourceCheck.at || sourceCheck.updatedAt)) {
          const candidate = ymd(new Date(Number(sourceCheck.at || sourceCheck.updatedAt)));
          if (candidate > sourceDate && candidate <= today()) completedDate = candidate;
        }
        const before = state.tasks.length;
        const carried = dailyCarryTask(task, sourceDate, completedDate || today());
        if (state.tasks.length > before) changed = true;
        if (completedDate && carried && !isDone(carried.id, completedDate)) {
          const steps = {};
          (carried.steps || []).forEach(step => { steps[step.id] = true; });
          state.checks[ckey(carried.id, completedDate)] = {
            taskId: carried.id, date: completedDate, done: true,
            at: sourceCheck.at || sourceCheck.updatedAt || now(), steps: steps,
            count: carried.target || 0, blocked: false, migratedFromCarry: true, updatedAt: now()
          };
          state.checks[ckey(task.id, sourceDate)] = Object.assign({}, sourceCheck, {
            done: false, at: null, blocked: false, dropped: false, steps: {}, count: 0,
            migratedToCarryTask: carried.id, updatedAt: now()
          });
          changed = true;
        }
      });
    });
  });
  return changed;
}

function dailyCarryLecture(staffId, date, cid, seq) {
  const current = ingPlan(staffId, date);
  const moving = current.find(item => item.cid === cid && Number(item.seq) === Number(seq));
  if (!moving) return;
  ingSavePlan(staffId, date, current.filter(item => !(item.cid === cid && Number(item.seq) === Number(seq))));
  const nextDate = date < today() ? today() : addDays(date, 1);
  const next = ingPlan(staffId, nextDate);
  if (!next.some(item => item.cid === cid && Number(item.seq) === Number(seq))) {
    next.push(Object.assign({}, moving, { s: '', e: '', auto: 'daily-close-v1', done: false }));
    ingSavePlan(staffId, nextDate, next);
  }
}

/* ── 발행형 주간·월간 리포트 ──
 * 초안은 저장하지 않는다. 원장이 발행할 때마다 admin-origin task를 새로 추가해
 * 지난 발행본을 그대로 보존하고, 학생은 최신 발행본만 읽는다. */
const REPORT_SCHEMA_VERSION = 1;

function reportPeriod(periodType, periodKey) {
  if (periodType === 'week' && /^\d{4}-\d{2}-\d{2}$/.test(periodKey || '') &&
      ymd(parseYmd(periodKey)) === periodKey && mondayOf(periodKey) === periodKey) {
    return { start: periodKey, end: addDays(periodKey, 6) };
  }
  if (periodType === 'month' && /^\d{4}-(0[1-9]|1[0-2])$/.test(periodKey || '')) {
    const dates = monthDates(periodKey);
    return dates.length ? { start: dates[0], end: dates[dates.length - 1] } : null;
  }
  return null;
}

function buildReportSnapshot(staffId, periodType, periodKey, asOf) {
  const student = staffById(staffId);
  const period = reportPeriod(periodType, periodKey);
  const at = Number(asOf == null ? now() : asOf);
  if (!student || student.deleted || !period || !Number.isFinite(at)) return null;
  const asOfDate = ymd(new Date(at));
  const cutoff = asOfDate < period.end ? asOfDate : period.end;
  const subjects = Object.fromEntries(STUDY_SUBJECT_KEYS.map(key => [key, { done: 0, total: 0, studySecs: 0 }]));
  const rows = [], days = [];
  let done = 0, total = 0, blocked = 0, studySecs = 0, goalDays = 0;
  const goalSecs = stGoalMin(staffId) * 60;

  if (cutoff >= period.start) {
    let date = period.start, guard = 0;
    while (date <= cutoff && guard++ < 370) {
      const dailyTasks = checklistTasksFor(staffId, date);
      const dailySecs = stCategorySecs(stSecs(staffId, date));
      const dailyTotalSecs = STUDY_SUBJECT_KEYS.reduce((sum, key) => {
        const value = Math.max(0, Number(dailySecs[key]) || 0);
        subjects[key].studySecs += value;
        return sum + value;
      }, 0);
      let dailyDone = 0;
      dailyTasks.forEach(task => {
        const status = statusOf(task, date);
        const subjectKey = taskStudySubjectKey(task);
        total++; subjects[subjectKey].total++;
        if (status === 'done') { done++; dailyDone++; subjects[subjectKey].done++; }
        if (status === 'blocked') blocked++;
        rows.push({
          taskId: task.id, date: date, title: String(task.title || ''),
          subject: subjectKey, origin: task.origin === 'staff' ? 'staff' : 'admin', status: status
        });
      });
      studySecs += dailyTotalSecs;
      if (goalSecs && dailyTotalSecs >= goalSecs) goalDays++;
      days.push({ date: date, done: dailyDone, total: dailyTasks.length, studySecs: dailyTotalSecs });
      date = addDays(date, 1);
    }
  }

  const plan = periodType === 'week' ? weekPlanOf(staffId, periodKey) : monthPlanOf(staffId, periodKey);
  return {
    schemaVersion: REPORT_SCHEMA_VERSION,
    periodType: periodType, periodKey: periodKey,
    periodStart: period.start, periodEnd: period.end,
    asOf: at, isPartial: cutoff < period.end,
    student: { id: student.id, name: String(student.name || '') },
    summary: {
      done: done, total: total, pct: total ? Math.round(done / total * 100) : 0,
      blocked: blocked, studySecs: studySecs, goalDays: goalDays
    },
    subjects: subjects, rows: rows, days: days,
    elapsedDays: days.length, dailyGoalMin: stGoalMin(staffId),
    reflection: String(plan.reflection || ''),
    directorNote: String(plan.directorNote || ''),
    nextFocus: String(plan.nextFocus || '')
  };
}

function reportSnapshotsFor(staffId, periodType, periodKey) {
  return state.tasks.filter(task => !task.deleted && task.kind === 'report_snapshot' && task.origin === 'admin' &&
      task.staffId === staffId && task.reportType === periodType && task.periodKey === periodKey)
    .sort((a, b) => (Number(b.reportRevision) || 0) - (Number(a.reportRevision) || 0) ||
      (Number(b.publishedAt || b.createdAt) || 0) - (Number(a.publishedAt || a.createdAt) || 0) ||
      String(b.id || '').localeCompare(String(a.id || '')));
}

function currentReportSnapshot(staffId, periodType, periodKey) {
  const latest = reportSnapshotsFor(staffId, periodType, periodKey)[0] || null;
  return latest && latest.reportStatus === 'published' && latest.snapshot ? latest : null;
}

function publishReportSnapshot(staffId, periodType, periodKey, asOf) {
  if (!session.isAdmin) return null;
  const at = Number(asOf == null ? now() : asOf);
  const snapshot = buildReportSnapshot(staffId, periodType, periodKey, at);
  if (!snapshot || snapshot.periodStart > ymd(new Date(at))) return null;
  const previous = reportSnapshotsFor(staffId, periodType, periodKey)[0] || null;
  const revision = previous ? (Number(previous.reportRevision) || 0) + 1 : 1;
  const task = {
    id: uid(), staffId: staffId, kind: 'report_snapshot',
    title: (periodType === 'week' ? '주간' : '월간') + ' 학습 리포트 ' + periodKey,
    reportType: periodType, periodKey: periodKey,
    periodStart: snapshot.periodStart, periodEnd: snapshot.periodEnd, asOf: at,
    reportStatus: 'published', reportRevision: revision,
    seriesKey: periodType + ':' + staffId + ':' + periodKey,
    supersedesId: previous ? previous.id : '', action: 'publish',
    snapshot: JSON.parse(JSON.stringify(snapshot)), publishedAt: at,
    origin: 'admin', repeat: 'none', days: [], start: '', end: '', carry: false,
    createdAt: at, updatedAt: at, deleted: false
  };
  state.tasks.push(task); save(); queueSync();
  return task;
}

function withdrawReportSnapshot(staffId, periodType, periodKey, at) {
  if (!session.isAdmin) return null;
  const previous = reportSnapshotsFor(staffId, periodType, periodKey)[0] || null;
  if (!previous || previous.reportStatus !== 'published') return null;
  const time = Number(at == null ? now() : at);
  if (!Number.isFinite(time)) return null;
  const task = {
    id: uid(), staffId: staffId, kind: 'report_snapshot', title: previous.title,
    reportType: periodType, periodKey: periodKey,
    periodStart: previous.periodStart, periodEnd: previous.periodEnd, asOf: time,
    reportStatus: 'withdrawn', reportRevision: (Number(previous.reportRevision) || 0) + 1,
    seriesKey: previous.seriesKey || (periodType + ':' + staffId + ':' + periodKey),
    supersedesId: previous.id, action: 'revoke', snapshot: null, withdrawnAt: time,
    origin: 'admin', repeat: 'none', days: [], start: '', end: '', carry: false,
    createdAt: time, updatedAt: time, deleted: false
  };
  state.tasks.push(task); save(); queueSync();
  return task;
}

function reportSafeText(value) {
  return String(value == null ? '' : value)
    .replace(/https?:\/\/\S+|www\.\S+/gi, '[외부 링크 제외]')
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, '').trim();
}

    '<p>' + esc(periodLabel) + ' · ' + (s.isPartial ? '중간 리포트' : '최종 리포트') + ' · 발행 시점 학생 기록 기준</p></div>' +
    '<div class="report-kpis"><div class="report-kpi"><span>완료·달성률</span><b>' + taskValue + '</b></div>' +
      '<div class="report-kpi"><span>총 순공시간</span><b>' + esc(fmtDur(Number(summary.studySecs) || 0)) + '</b></div>' +
      '<div class="report-kpi"><span>하루 평균</span><b>' + esc(fmtDur(s.elapsedDays ? Math.round((Number(summary.studySecs) || 0) / s.elapsedDays) : 0)) + '</b></div>' +
      '<div class="report-kpi"><span>목표 달성일</span><b>' + (Number(s.dailyGoalMin) ? (Number(summary.goalDays) || 0) + '일' : '목표 미설정') + '</b></div>' +
      '<div class="report-kpi"><span>막힌 공부</span><b>' + (Number(summary.blocked) || 0) + '건</b></div></div>' +
    '<div class="report-section"><h3>과목별 학습</h3>' + subjectRows + '</div>' +
    (taskRows ? '<div class="report-section"><h3>공부 수행 내역</h3><div class="report-task-list">' + taskRows + '</div></div>' : '') +
    note('학생 회고', s.reflection) + note('원장 피드백', s.directorNote) + note('다음 집중 목표', s.nextFocus) + '</section>';
}

function monthDday(date) {
  const diff = Math.round((parseYmd(date) - parseYmd(today())) / 86400000);
  if (diff === 0) return 'D-DAY';
  return diff > 0 ? 'D-' + diff : 'D+' + Math.abs(diff);
}

function agendaDday(date, anchor) {
  const diff = Math.round((parseYmd(date) - parseYmd(anchor || today())) / 86400000);
  if (diff === 0) return 'D-DAY';
  return diff > 0 ? 'D-' + diff : 'D+' + Math.abs(diff);
}

function agendaEndTime(start, minutes) {
  const at = ingHmMin(start);
  if (at === null) return '';
  return ingMinHm((at + Math.max(10, Number(minutes) || 30)) % 1440);
}

function agendaEndDate(date, start, minutes) {
  const at = ingHmMin(start);
  if (at === null) return date;
  return addDays(date, Math.floor((at + Math.max(10, Number(minutes) || 30)) / 1440));
}

function agendaStableId(value) {
  let hash = 2166136261;
  for (const ch of String(value || '')) { hash ^= ch.codePointAt(0); hash = Math.imul(hash, 16777619); }
  return (hash >>> 0).toString(36);
}

function agendaItemsFor(staffId, start, end) {
  if (!staffId || !/^\d{4}-\d{2}-\d{2}$/.test(start || '') || !/^\d{4}-\d{2}-\d{2}$/.test(end || '') || start > end) return [];
  const out = [];
  const academics = academicItemsFor(staffId);
  const availability = ingAvail(staffId);
  const monthPlans = {};
  let date = start, guard = 0;
  while (date <= end && guard++ < 370) {
    const official = academics.filter(item => academicDateOf(item) === date);
    official.forEach(item => out.push({
      key: 'academic:' + item.id + ':' + date, source: 'academic', sourceId: item.id,
      title: item.title, date: date, startTime: '', endTime: '', allDay: true,
      type: item.academicType === 'performance' ? 'performance' : 'exam',
      detail: item.academicType === 'performance' ? '' : [item.unit, item.range].filter(Boolean).join(' · '), done: false, quiet: false
    }));

    const month = date.slice(0, 7);
    const personal = monthPlans[month] || (monthPlans[month] = monthPlanOf(staffId, month));
    personal.events.filter(event => event.date === date)
      .forEach(event => out.push({
        key: 'personal:' + event.id + ':' + date, source: 'personal', sourceId: event.id,
        title: event.title, date: date, startTime: '', endTime: '', allDay: true,
        type: event.kind === 'exam' || event.kind === 'mock' ? 'exam' : 'personal',
        detail: event.range || '', done: false, quiet: false, personal: true, importantKind: event.kind || 'other',
        progress: Math.max(0, Math.min(100, Number(event.progress) || 0)),
        progressConfirmedDate: event.progressConfirmedDate || ''
      }));

    checklistTasksFor(staffId, date).forEach(task => {
      const startTime = task.slotStart || task.time || '';
      const endTime = task.slotEnd || (startTime ? agendaEndTime(startTime, task.estimateMin || 30) : '');
      const endDate = task.slotEnd ? date : (startTime ? agendaEndDate(date, startTime, task.estimateMin || 30) : date);
      out.push({
        key: 'task:' + task.id + ':' + date, source: 'task', sourceId: task.id,
        title: task.title, date: date, endDate: endDate, startTime: startTime, endTime: endTime, allDay: !startTime,
        type: task.auto === 'exam-plan-v1' ? 'exam-plan' : 'task',
        detail: task.detail || '', done: isDone(task.id, date), quiet: false,
        subject: taskStudySubjectKey(task), examPlan: task.auto === 'exam-plan-v1'
      });
    });

    ingPlan(staffId, date).forEach((item, index) => {
      const found = ingLec(staffId, item.cid, item.seq);
      out.push({
        key: 'ingang:' + (item.cid || index) + ':' + item.seq + ':' + date,
        source: 'ingang', sourceId: (item.cid || index) + '-' + item.seq,
        title: found ? found.course.name + ' ' + item.seq + '강' : '인강 ' + item.seq + '강',
        date: date, endDate: date, startTime: item.s || '', endTime: item.e || '', allDay: !item.s,
        type: 'ingang', detail: found ? found.lec.title || '' : item.title || '', done: !!item.done, quiet: false
      });
    });

    const blockOrdinals = {};
    tbOf(staffId, date).forEach(block => {
      const fingerprint = [date, block.s, block.e, block.label, block.subj].join('|');
      const ordinal = blockOrdinals[fingerprint] = (blockOrdinals[fingerprint] || 0) + 1;
      const sourceId = 'tb-' + agendaStableId(fingerprint) + '-' + ordinal;
      out.push({
      key: 'timetable:' + sourceId + ':' + date, source: 'timetable', sourceId: sourceId,
      title: block.label, date: date, endDate: date, startTime: block.s || '', endTime: block.e || '', allDay: false,
      type: 'timeblock', detail: block.subj ? studySubject(block.subj).label : '', done: false, quiet: false
      });
    });

    if (availability.configured) availability.blocks.filter(block => block.days.includes(dowOf(date))).forEach(block => out.push({
      key: 'fixed:' + block.id + ':' + date, source: 'fixed', sourceId: block.id,
      title: block.label || '고정 일정', date: date, endDate: date, startTime: block.s, endTime: block.e, allDay: false,
      type: 'fixed', detail: '매주 반복 일정', done: false, quiet: true
    }));
    date = addDays(date, 1);
  }
  const priority = { exam: 0, performance: 0, personal: 1, fixed: 1, timeblock: 1, ingang: 2, 'exam-plan': 3, task: 3 };
  const ownerKey = agendaStableId(staffId);
  return out.map(item => Object.assign({ ownerKey: ownerKey, endDate: item.endDate || item.date }, item))
    .sort((a, b) => a.date.localeCompare(b.date) || Number(a.done) - Number(b.done) ||
    (priority[a.type] ?? 9) - (priority[b.type] ?? 9) ||
    (a.allDay ? '00:00' : a.startTime || '99:99').localeCompare(b.allDay ? '00:00' : b.startTime || '99:99') || a.title.localeCompare(b.title));
}

function googleCalendarUrl(item) {
  if (!item || !item.title || !/^\d{4}-\d{2}-\d{2}$/.test(item.date || '')) return '';
  if (!item.allDay && (ingHmMin(item.startTime) === null || ingHmMin(item.endTime || agendaEndTime(item.startTime, 30)) === null)) return '';
  const compact = value => String(value || '').replace(/[-:]/g, '');
  const start = compact(item.date) + (item.allDay ? '' : 'T' + compact(item.startTime) + '00');
  const end = item.allDay ? compact(addDays(item.date, 1)) : compact(item.endDate || item.date) + 'T' + compact(item.endTime || agendaEndTime(item.startTime, 30)) + '00';
  const params = new URLSearchParams({
    action: 'TEMPLATE', text: String(item.title || 'WB 일정'), dates: start + '/' + end,
    details: 'WB 컨설팅 앱에서 추가한 일정'
  });
  params.set('ctz', 'Asia/Seoul');
  return 'https://calendar.google.com/calendar/render?' + params.toString();
}

function icsEscape(value) {
  return String(value || '').replace(/\r\n|\r|\n/g, '\n')
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, '')
    .replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;');
}

function agendaUtcStamp(date, time) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date || '') || ingHmMin(time) === null) return '';
  const d = parseYmd(date), minutes = ingHmMin(time);
  return new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate(), Math.floor(minutes / 60) - 9, minutes % 60))
    .toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
}

function icsFold(line) {
  const encoder = new TextEncoder();
  const rows = [];
  let chunk = '';
  for (const ch of String(line || '')) {
    if (chunk && encoder.encode(chunk + ch).length > 75) {
      rows.push(chunk);
      chunk = ' ' + ch;
    } else chunk += ch;
  }
  if (chunk) rows.push(chunk);
  return rows.join('\r\n');
}

function agendaIcs(items) {
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//WB//Consult Calendar//KO', 'CALSCALE:GREGORIAN'];
  (items || []).forEach((item, index) => {
    if (!item || !/^\d{4}-\d{2}-\d{2}$/.test(item.date || '') || !item.title) return;
    if (!item.allDay && (ingHmMin(item.startTime) === null || ingHmMin(item.endTime || agendaEndTime(item.startTime, 30)) === null)) return;
    const compact = value => String(value || '').replace(/[-:]/g, '');
    const uid = String((item.ownerKey || 'owner') + '-' + (item.source || 'item') + '-' + (item.sourceId || index) + '-' + item.date).replace(/[^A-Za-z0-9_.-]/g, '-') + '@wb-consult';
    lines.push('BEGIN:VEVENT', 'UID:' + uid, 'DTSTAMP:' + stamp, 'SUMMARY:' + icsEscape(item.title));
    if (item.allDay) {
      lines.push('DTSTART;VALUE=DATE:' + compact(item.date), 'DTEND;VALUE=DATE:' + compact(addDays(item.date, 1)));
    } else {
      lines.push('DTSTART:' + agendaUtcStamp(item.date, item.startTime),
        'DTEND:' + agendaUtcStamp(item.endDate || item.date, item.endTime || agendaEndTime(item.startTime, 30)));
    }
    lines.push('DESCRIPTION:WB 컨설팅 앱에서 추가한 일정');
    lines.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEscape(item.title),
      'TRIGGER:' + (item.allDay ? '-P1D' : '-PT30M'), 'END:VALARM', 'END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.map(icsFold).join('\r\n') + '\r\n';
}

function downloadAgendaIcs(items, filename) {
  const list = (items || []).filter(Boolean);
  if (!list.length) return toast('내보낼 일정이 없습니다');
  const url = URL.createObjectURL(new Blob([agendaIcs(list)], { type: 'text/calendar;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = String(filename || 'wb-consult.ics').replace(/[^0-9A-Za-z가-힣._-]/g, '-');
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function moveMonthOccurrence(task, from, to) {
  if (!task || !/^\d{4}-\d{2}-\d{2}$/.test(to) || to < today()) return toast('오늘 이후 날짜를 선택해 주세요');
  const oldCheck = getCheck(task.id, from);
  if (task.repeat === 'once') {
    const existing = weekMovesFor(task.staffId).find(move => move.taskId === task.id && move.to === from);
    const original = existing ? existing.from : from;
    const moves = weekMovesFor(task.staffId).filter(move => !(move.taskId === task.id && move.from === original));
    if (to !== original) moves.push({ taskId: task.id, from: original, to: to, movedAt: now() });
    setCheck(task.id, to, monthCarryCheckPatch(oldCheck));
    setCheck(weekMoveKey(task.staffId), 'all', { moves: moves, done: true });
  } else {
    const carried = Object.assign({}, task, {
      id: uid(), groupId: 'month-carry-' + now(), repeat: 'once', days: [], start: to, end: '',
      carry: true, createdAt: now(), updatedAt: now(), deleted: false
    });
    state.tasks.push(carried);
    save(); queueSync();
    setCheck(carried.id, to, monthCarryCheckPatch(oldCheck));
    setCheck(task.id, from, { dropped: true, dropReason: 'rescheduled', droppedAt: now() });
  }
  render(); toast('공부 날짜를 변경했습니다');
}

  return '<div class="month-section-nav" role="tablist" aria-label="월간 화면 선택">' +
    Object.keys(MONTH_SECTIONS).map(key => {
      const section = MONTH_SECTIONS[key];
      const badge = key === 'plan' && backlogCount ? '<span class="badge">' + backlogCount + '</span>' : '';
      return '<button class="month-section-btn ' + (monthSection === key ? 'on' : '') + '" data-act="monthsection" data-v="' + key + '" role="tab" aria-selected="' + (monthSection === key) + '">' + section.label + badge + '</button>';
    }).join('') + '</div><div class="month-section-intro">' + MONTH_SECTIONS[monthSection].description + '</div>';
}

function viewMonth() {
  const me = currentStaff();
  if (!me) return emptyStaffCard();
  const ym = ymCursor;
  const dates = monthDates(ym);
  const mp = monthProgress(me.id, ym);
  const goals = goalsFor(me.id, ym);
  const plan = monthPlanOf(me.id, ym);
  const monthClose = monthCloseOf(me.id, ym);
  const stats = monthSubjectStats(me.id, ym);
  const previousStats = monthSubjectStats(me.id, ymAdd(ym, -1));
  const report = monthReport(me.id, ym, stats);
  const backlog = monthBacklog(me.id, ym);
  const events = plan.events.slice().sort((a, b) => a.date.localeCompare(b.date));
  const editable = session.isStaffLink || session.isAdmin;

  let h = '';
  if (!session.isStaffLink) h += staffSwitcher(me.id);

  h += '<div class="datenav">' +
    '<button class="navbtn" data-act="mnav" data-n="-1">‹</button>' +
    '<div class="d">' + ymLabel(ym) + '</div>' +
    '<button class="navbtn" data-act="mnav" data-n="1">›</button></div>';

  h += monthSectionNav(backlog.length);
  if (monthSection === 'calendar') {
    h += agendaCalendarCard(me, ym);
    return h;
  }

  /* 시험 · 중요 일정 */
  if (monthSection === 'plan') {
  h += '<div class="card"><div class="between mb8"><div><div class="card-title">📌 시험·중요 일정</div>' +
    '<div class="card-sub">시험일과 학생이 오늘 마무리에서 확인한 준비율을 함께 관리합니다.</div></div>' +
    (editable ? '<button class="btn btn-sm btn-ghost" data-act="montheventadd">＋ 일정</button>' : '') + '</div>';
  if (session.isStaffLink) h += '<div class="hint mb14">준비율 변경은 오늘 학습을 마친 뒤 ‘오늘 학습 마무리’ 단계에서 확인합니다.</div>';
  if (!events.length) h += '<div class="empty" style="padding:22px 12px"><b>🗓</b>등록된 시험이나 중요 일정이 없습니다.</div>';
  h += events.map(event => {
    const kind = MONTH_EVENT_KINDS[event.kind] || MONTH_EVENT_KINDS.other;
    const progressValue = Math.max(0, Math.min(100, Number(event.progress) || 0));
    const history = Array.isArray(event.progressHistory) ? event.progressHistory.filter(row => row && row.date) : [];
    const latestProgress = history.length ? history.slice().sort((a, b) => Number(b.at || 0) - Number(a.at || 0))[0] : null;
    const progressSource = latestProgress
      ? (latestProgress.source === 'student' ? shortDate(latestProgress.date) + ' 학생 확인' : shortDate(latestProgress.date) + ' 원장 보정')
      : '아직 확인 전';
    return '<div class="month-event-row"><span class="pill ' + (event.date < today() ? '' : 'warn') + '">' + monthDday(event.date) + '</span>' +
      '<div><div class="row wraprow" style="gap:6px"><b>' + esc(event.title) + '</b><span class="tag">' + kind + '</span>' +
        (event.goalScore ? '<span class="tag doing">목표 ' + Number(event.goalScore) + '점</span>' : '') + '</div>' +
        '<div class="small muted">' + label(event.date) + (event.range ? ' · ' + esc(event.range) : '') + '</div>' +
        '<div class="month-event-progress"><i style="width:' + progressValue + '%"></i></div>' +
        '<div class="small muted">준비 ' + progressValue + '% · ' + progressSource + '</div></div>' +
      (editable ? '<div class="row wraprow" style="gap:5px">' +
        (session.isAdmin ? '<button class="btn btn-sm btn-ghost" data-act="montheventprogress" data-id="' + esc(event.id) + '" data-n="-10">원장 －10%</button>' +
          '<button class="btn btn-sm" data-act="montheventprogress" data-id="' + esc(event.id) + '" data-n="10">원장 ＋10%</button>' : '') +

  /* 이달의 목표 */

  }

  }

  /* 과목별 분석 */
  if (monthSection === 'report') {
  const totalSubjectSecs = report.totalSecs;
  const topShare = report.topKey && totalSubjectSecs ? Math.round(stats[report.topKey].secs / totalSubjectSecs * 100) : 0;
  const subjectReportRows = STUDY_SUBJECT_KEYS.map(key => {
      const subject = STUDY_SUBJECTS[key];
      const current = stats[key];
      const previous = previousStats[key].secs;
      const diff = previous ? Math.round((current.secs - previous) / previous * 100) : (current.secs ? null : 0);
      const exactShare = totalSubjectSecs ? current.secs / totalSubjectSecs * 100 : 0;
      const share = Math.floor(exactShare);
      const completion = current.total ? Math.round(current.done / current.total * 100) : null;
      const deltaText = !previous && !current.secs ? '—' : diff == null ? '신규' : (diff > 0 ? '+' : '') + diff + '%';
      const deltaClass = diff == null || diff === 0 ? 'flat' : diff > 0 ? 'up' : 'down';
      return { key: key, subject: subject, current: current, previous: previous, share: share, exactShare: exactShare,

  const remainingShare = totalSubjectSecs ? 100 - subjectReportRows.reduce((sum, row) => sum + row.share, 0) : 0;
  subjectReportRows.filter(row => row.current.secs).sort((a, b) => (b.exactShare - b.share) - (a.exactShare - a.share))

      (totalSubjectSecs ? '<div class="month-share-track" role="img" aria-label="이번 달 과목별 순공시간 비중">' + subjectReportRows.filter(row => row.current.secs).map(row =>

        '<div class="month-share-legend">' + subjectReportRows.filter(row => row.current.secs).map(row => '<span class="month-share-key ' + row.subject.className + '"><i></i><b>' +

      subjectReportRows.map(row => '<tr><td><span class="tag subject-tag ' + row.subject.className + '">' + row.subject.label + '</span></td>' +
        '<td data-label="이번 달"><b>' + fmtDur(row.current.secs) + '</b></td><td data-label="지난달">' + fmtDur(row.previous) + '</td>' +
        '<td data-label="증감"><span class="month-delta ' + row.deltaClass + '">' + row.deltaText + '</span></td>' +

  }

  /* 미완료 공부 */
  if (monthSection === 'plan') {
  h += '<div class="card' + (backlog.length ? ' alert' : '') + '"><div class="between mb8"><div><div class="card-title">↪ 이번 달 미완료 공부</div>' +
    '<div class="card-sub">이월이 켜진 공부만 모아 날짜를 다시 정할 수 있습니다.</div></div><span class="pill ' + (backlog.length ? 'bad' : '') + '">' + backlog.length + '개</span></div>';
  if (!backlog.length) h += '<div class="small muted">현재 이월할 미완료 공부가 없습니다.</div>';

  const rolloverDate = nextMonthStart < today() ? today() : nextMonthStart;

    const subject = taskStudySubject(item.t);
    return '<div class="month-backlog-row ' + subject.className + '"><span class="tag subject-tag ' + subject.className + '">' + subject.label + '</span>' +
      '<div><b class="small">' + esc(item.t.title) + '</b><div class="small muted">' + shortDate(item.date) + ' 미완료</div></div>' +

          (nextMonthStart < today() ? '오늘로 이월' : '다음 달 이월') + '</button>' +
        '<button class="btn btn-sm btn-danger" data-act="monthdrop" data-id="' + item.t.id + '" data-date="' + item.date + '">종료</button></div>' : '') + '</div>';

  h += '<div class="card"><div class="between mb14"><div><div class="card-title">📝 월간 기록과 원장 피드백</div>' +
    '<div class="card-sub">이번 달 결과를 정리하고 다음 달 방향을 정합니다.</div></div><span class="pill">달성률 ' + mp.pct + '%</span></div>' +
    '<div class="month-kpis mb14"><div class="month-kpi"><span class="small muted">총 순공시간</span><b>' + fmtDur(report.totalSecs) + '</b></div>' +
      '<div class="month-kpi"><span class="small muted">하루 평균</span><b>' + fmtDur(report.avgSecs) + '</b></div>' +
      '<div class="month-kpi"><span class="small muted">목표 달성일</span><b>' + report.goalDays + '일</b></div>' +
      '<div class="month-kpi"><span class="small muted">완료한 공부</span><b>' + report.doneTasks + '/' + report.totalTasks + '</b></div></div>' +
    '<div class="hint mb14">가장 많이 공부한 과목: <b>' + (report.topKey ? STUDY_SUBJECTS[report.topKey].label : '기록 없음') + '</b>' +
      (stGoalMin(me.id) ? ' · 일일 목표 ' + stGoalMin(me.id) + '분 기준 ' + report.goalDays + '/' + report.elapsedDays + '일 달성' : '') + '</div>' +
    '<div class="month-review-grid"><div class="field"><label class="fl">학생 월간 회고</label><textarea class="in" id="monthReflection" ' +

      '<div class="field"><label class="fl">학생이 어려웠던 점</label><textarea class="in" readonly placeholder="월말 마무리에서 작성합니다">' + esc(monthClose.difficulty || '') + '</textarea></div>' +
      '<div class="field wide"><label class="fl">학생의 다음 달 집중</label><textarea class="in" readonly placeholder="월말 마무리에서 작성합니다">' + esc(monthClose.studentNextFocus || '') + '</textarea></div>' +
      '<div class="field"><label class="fl">원장 종합 피드백</label><textarea class="in" id="monthDirectorNote" ' +
        (session.isAdmin ? '' : 'readonly') + ' placeholder="이번 달 학습에 대한 피드백">' + esc(plan.directorNote || '') + '</textarea></div>' +
      '<div class="field wide"><label class="fl">다음 달 권장사항</label><textarea class="in" id="monthNextFocus" ' +
        (session.isAdmin ? '' : 'readonly') + ' placeholder="다음 달 우선순위와 권장 공부량">' + esc(plan.nextFocus || '') + '</textarea></div></div>' +
    (editable ? '<button class="btn btn-primary btn-block" data-act="monthreviewsave" data-ym="' + ym + '">월간 기록 저장</button>' : '') + '</div>';
  h += reportPanel('month', me, ym);
  }

  return h;
}

/* ══════════════════════════════════════════════════════
   학사관리 — 공식 시험·수행평가와 시험대비 자료 요청
   ══════════════════════════════════════════════════════ */
const MATERIAL_STATUS = Object.freeze({
  requested: '요청됨', needs_info: '보완 필요', resubmitted: '보완 제출됨',
  preparing: '자료 찾는 중', provided: '자료 도착', unavailable: '제공 어려움', cancelled: '취소'
});
const academicDateOf = item => item.dueDate || item.examDate || item.start || '';

function academicItemsFor(staffId) {
  return state.tasks.filter(t => !t.deleted && t.kind === 'academic_event' && t.staffId === staffId)
    .sort((a, b) => academicDateOf(a).localeCompare(academicDateOf(b)) || (a.createdAt || 0) - (b.createdAt || 0));
}

function materialRequestsFor(staffId) {
  return state.tasks.filter(t => !t.deleted && t.kind === 'material_request' && t.staffId === staffId)
    .sort((a, b) => String(a.neededBy || '').localeCompare(String(b.neededBy || '')) || (a.requestedAt || 0) - (b.requestedAt || 0));
}

function allMaterialRequests() {
  return teamStaff().flatMap(staff => materialRequestsFor(staff.id));
}

function materialRequestById(requestId) {
  return state.tasks.find(t => !t.deleted && t.kind === 'material_request' && t.id === requestId) || null;
}

function materialResponseFor(requestId) {
  return state.tasks.find(t => !t.deleted && t.kind === 'material_response' && t.materialRequestId === requestId) || null;
}

function materialProvidedTask(requestId) {
  const response = materialResponseFor(requestId);
  return response && response.status === 'provided' && response.source === 'exam_material' ? response : null;
}

function materialRequestStatus(req) {
  const provided = materialProvidedTask(req.id);
  if (provided) return 'provided';
  if (req.cancelledAt) return 'cancelled';
  const response = materialResponseFor(req.id);
  if (response && response.status === 'needs_info' && (req.requestRevision || 1) > (response.requestRevision || 0)) return 'resubmitted';
  if (response && MATERIAL_STATUS[response.status]) return response.status;
  return 'requested';
}

function materialRequestFingerprint(req) {
  const norm = value => String(value || '').trim().toLowerCase().replace(/\s+/g, ' ');
  return [req.staffId, req.examId, req.subject, req.publisher, req.textbook, req.unit,
    (req.materialTypes || []).slice().sort().join(',')].map(norm).join('|');
}

function buildMaterialRequestSummary(req) {
  const book = [req.publisher, req.textbook].filter(Boolean).join(' ');
  const scope = [req.unit, req.pages, req.schoolHandout].filter(Boolean).join(', ');
  return [
    '[' + [req.grade, req.semester, req.subject].filter(Boolean).join(' ') + (book ? ' / ' + book : '') + ']',
    [req.examName, req.examDate].filter(Boolean).join(' '),
    scope,
    (req.materialTypes || []).length ? '자료: ' + req.materialTypes.join('·') : '',
    req.level ? '난이도: ' + req.level : '',
    req.amount ? '분량: ' + req.amount : '',
    req.explanation ? '해설: ' + req.explanation : '',
    req.weakness ? '어려운 부분: ' + req.weakness : '',
    req.neededBy ? req.neededBy + '까지 필요' : '',
    req.note ? '기타: ' + req.note : ''
  ].filter(Boolean).join(' · ');
}

function materialRequestSearchText(req) {
  return [req.grade, req.semester, req.subject, req.publisher, req.textbook, req.unit]
    .concat(req.materialTypes || []).concat([req.level]).filter(Boolean).join(' ');
}

function examPlanSessions(settings) {
  const sessionMin = Number(settings && settings.sessionMin);
  if (!Number.isInteger(sessionMin) || sessionMin < 20 || sessionMin > 180) return [];
  const counts = EXAM_PLAN_PHASES.map(phase => Number(settings[phase.key + 'Count']));
  if (counts.some(count => !Number.isInteger(count) || count < 0 || count > 100)) return [];
  let seq = 0;
  return EXAM_PLAN_PHASES.flatMap((phase, phaseIndex) => {
    const count = counts[phaseIndex];
    return Array.from({ length: count }, (_, index) => ({
      seq: ++seq, phase: phase.key, planItemKey: phase.key + '-' + (index + 1),
      title: phase.label + ' ' + (index + 1) + '/' + count,
      guide: phase.guide, steps: phase.steps.slice(), min: sessionMin, _span: sessionMin
    }));
  });
}

function examPlanPhaseCounts(total) {
  total = Math.max(4, Math.min(100, Math.round(Number(total) || 0)));
  const counts = EXAM_PLAN_PHASES.map(() => 1);
  while (counts.reduce((sum, value) => sum + value, 0) < total) {
    let best = 0, score = -Infinity;
    EXAM_PLAN_PHASES.forEach((phase, index) => {
      const gap = phase.weight * total - counts[index];
      if (gap > score) { score = gap; best = index; }
    });
    counts[best]++;
  }
  const out = {};
  EXAM_PLAN_PHASES.forEach((phase, index) => { out[phase.key + 'Count'] = counts[index]; });
  return out;
}

function examPlanTasks(examId) {
  return state.tasks.filter(task => !task.deleted && task.auto === 'exam-plan-v1' && task.examId === examId);
}

function examPlanReplaceable(task, examId, from) {
  const hasCheck = typeof getCheck === 'function' && !!getCheck(task.id, task.start);
  return !!task && !task.deleted && task.auto === 'exam-plan-v1' && task.examId === examId &&
    task.start >= from && !isDone(task.id, task.start) && !hasCheck && !task.lastEditBy;
}

function examPlanFixedKeys(examId, from) {
  return new Set(examPlanTasks(examId).filter(task => !examPlanReplaceable(task, examId, from))
    .map(task => task.planItemKey).filter(Boolean));
}

function examPlanLockedTasks(staffId, date, examId, from) {
  return state.tasks.filter(task => {
    if (task.deleted || task.auto !== 'exam-plan-v1' || task.staffId !== staffId || task.start !== date) return false;
    return !examPlanReplaceable(task, examId, from);
  });
}

function examPlanFreeSlots(staffId, date, examId, from, baseSlots) {
  const busy = examPlanLockedTasks(staffId, date, examId, from).map(task => ({
    s: ingHmMin(task.slotStart || task.time), e: ingHmMin(task.slotEnd)
  })).filter(slot => slot.s !== null && slot.e > slot.s);
  return (baseSlots || []).flatMap(slot => ingFreeIntervals(Number(slot.s), Number(slot.e), busy));
}

function examPlanPreview(staffId, exam, settings) {
  const sessions = examPlanSessions(settings || {});
  const empty = reason => ({ items: [], remaining: sessions.length, complete: false, finishDate: null,
    reason: reason, warning: reason ? reason : '' });
  if (!exam || exam.staffId !== staffId || exam.academicType !== 'exam') return empty('시험 정보를 확인해 주세요');
  if (!ingAvail(staffId).configured) return empty('주간 일정 미설정');
  const examDate = academicDateOf(exam);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(examDate)) return empty('시험 날짜를 확인해 주세요');
  const from = [today(), exam.periodStart || today(), settings.start || ''].filter(Boolean).sort().pop();
  const until = addDays(examDate, -1);
  const perDay = Number(settings.perDay);
  const weekdays = Array.isArray(settings.weekdays) ? [...new Set(settings.weekdays.filter(day => ING_WEEK_DAYS.includes(day)))] : ING_WEEK_DAYS.slice();
  if (settings.totalHours != null && (!Number.isFinite(Number(settings.totalHours)) || Number(settings.totalHours) < 2 || Number(settings.totalHours) > 100)) {
    return empty('총 준비시간을 2~100시간으로 입력해 주세요');
  }
  if (settings.totalHours != null) {
    const requested = Math.ceil(Number(settings.totalHours) * 60 / Number(settings.sessionMin));
    if (requested < EXAM_PLAN_PHASES.length) return empty('4단계 학습을 위해 총 준비시간을 더 늘려 주세요');
    if (requested > 100) return empty('학습 횟수는 최대 100회까지 만들 수 있습니다');
  }
  if (!sessions.length || !Number.isInteger(perDay) || perDay < 1 || perDay > 12) return empty('준비 횟수와 하루 학습량을 확인해 주세요');
  if (from > until) return empty('시험 전날까지 배정할 수 있는 날짜가 없습니다');
  if (!weekdays.length) return empty('학습 가능 요일을 선택해 주세요');
  const fixedKeys = typeof examPlanFixedKeys === 'function' ? examPlanFixedKeys(exam.id, from) : new Set();
  const remainingSessions = sessions.filter(item => !fixedKeys.has(item.planItemKey));
  const packed = ingPackSchedule(remainingSessions, from, until, weekdays, perDay,
    date => {
      const base = ingFreeForDate(staffId, date, true);
      return typeof examPlanFreeSlots === 'function' ? examPlanFreeSlots(staffId, date, exam.id, from, base) : base;
    },
    date => typeof examPlanLockedTasks === 'function' ? examPlanLockedTasks(staffId, date, exam.id, from).length : 0);
  const bySeq = new Map(remainingSessions.map(item => [item.seq, item]));
  const items = packed.items.map(item => Object.assign({}, item, bySeq.get(item.seq) || {}));
  const warning = packed.remaining ? '가용시간이 부족합니다 · ' + packed.remaining + '회 (' +
    packed.remaining * Number(settings.sessionMin) + '분) 미배정' : '';
  return Object.assign({}, packed, {
    items: items, warning: warning, reason: '', fixedCount: fixedKeys.size,
    totalSessions: sessions.length, settings: Object.assign({}, settings), staffId: staffId, examId: exam.id, from: from
  });
}

function commitExamPlan(staffId, exam, draft) {
  const stamp = now();
  const replaceFrom = /^\d{4}-\d{2}-\d{2}$/.test(draft.from || '') && draft.from >= today() ? draft.from : today();
  state.tasks.forEach(task => {
    if (task.staffId === staffId && examPlanReplaceable(task, exam.id, replaceFrom)) {
      task.deleted = true; task.updatedAt = stamp;
    }
  });
  (draft.items || []).forEach(item => {
    const taskId = 'exam-plan-' + exam.id + '-' + item.planItemKey;
    const existing = state.tasks.find(task => task.id === taskId);
    const next = {
      id: taskId, groupId: 'exam-plan-' + exam.id, staffId: staffId,
      auto: 'exam-plan-v1', examId: exam.id, examPhase: item.phase,
      planItemKey: item.planItemKey, estimateMin: Number(item.min) || 0,
      slotStart: item.s || '', slotEnd: item.e || '',
      title: (item.title || '시험대비 학습') + ' · ' + exam.title,
      studySubject: exam.studySubject || '',
      detail: [exam.title, exam.unit, exam.range].filter(Boolean).join(' · '),
      guide: item.guide || '',
      steps: (item.steps || []).map((label, index) => ({ id: item.planItemKey + '-step-' + (index + 1), label: label })),
      target: 0, unit: '회', time: item.s || '', priority: 'high',
      repeat: 'once', days: [], start: item.date, end: '', carry: true,
      origin: 'admin', requiresClaim: false, createdAt: existing ? existing.createdAt : stamp, updatedAt: stamp, deleted: false
    };
    if (existing) Object.assign(existing, next);
    else state.tasks.push(next);
  });
  exam.examPlan = Object.assign({}, draft.settings || {}, {
    generatedAt: stamp, finishDate: draft.finishDate || '', totalSessions: draft.totalSessions || (draft.items || []).length
  });
  exam.updatedAt = stamp;
  return (draft.items || []).length;
}

function examPlanSummary(exam) {
  const tasks = examPlanTasks(exam.id);
  const done = tasks.filter(task => isDone(task.id, task.start)).length;
  const finishDate = tasks.map(task => task.start).sort().pop() || '';
  return { total: tasks.length, done: done, finishDate: finishDate };
}

function provideMaterialRequest(req, resourceUrl, due) {
  const existing = materialProvidedTask(req.id);
  if (existing) return existing;
  let task = materialResponseFor(req.id);
  if (!task) {
    task = {
      id: 'material-response-' + req.id, groupId: 'material-response-' + req.id,
      kind: 'material_response', materialRequestId: req.id,
      staffId: req.staffId, origin: 'admin', createdAt: now(), deleted: false
    };
    state.tasks.push(task);
  }
  Object.assign(task, {
    status: 'provided', source: 'exam_material', resourceUrl: resourceUrl,
    title: '시험대비자료 · ' + [req.subject, req.unit].filter(Boolean).join(' '),
    studySubject: req.studySubject || '', detail: buildMaterialRequestSummary(req),
    academicEventId: req.examId || '', dueDate: req.examDate || due, estimatedMin: 50,
    guide: LEARNING_SOURCES.exam_material.guide,

}

let draft = [];
let wEditIndex = -1;
const wForm = { staff: [], subject: '', repeat: 'once', days: [], start: today(), end: '', estimatedMin: 50, carry: true, evidenceMode: false };
const WRITE_INPUT_IDS = ['wSubject', 'wTitle', 'wEstimatedMin', 'wDetail', 'wGuide', 'wSteps', 'wTarget', 'wUnit', 'wTime', 'wPri', 'wStart', 'wEnd'];

function writeInputSnapshot() {
  if (route !== 'write') return null;
  const values = {};
  WRITE_INPUT_IDS.forEach(id => { const field = $('#' + id); if (field) values[id] = field.value; });
  const active = document.activeElement;
  return { values: values, activeId: active && WRITE_INPUT_IDS.includes(active.id) ? active.id : '' };
}

function renderWritePreservingInputs() {
  const snapshot = writeInputSnapshot();
  render();
  if (!snapshot) return;
  WRITE_INPUT_IDS.forEach(id => { const field = $('#' + id); if (field && Object.prototype.hasOwnProperty.call(snapshot.values, id)) field.value = snapshot.values[id]; });
  viewInputDirty = true;
  const active = snapshot.activeId && $('#' + snapshot.activeId);
  if (active) active.focus();
}

function removeWriteDraft(index) {
  draft.splice(index, 1);
  if (wEditIndex === index) wEditIndex = -1;
  else if (wEditIndex > index) wEditIndex--;
}

function writeDraftSeed() {
  return draft[wEditIndex] || {
    title: '', studySubject: wForm.subject, detail: '', guide: '', steps: [], target: 0, unit: '건',
    time: '', priority: 'normal', start: wForm.start, end: wForm.end, estimatedMin: wForm.estimatedMin
  };
}

function writeDraftLoadRows() {
  const rows = {};
  draft.forEach(item => item.staffIds.forEach(staffId => {
    const key = staffId + '|' + item.start;
    if (!rows[key]) rows[key] = { staffId: staffId, date: item.start, draftMin: 0, count: 0 };
    rows[key].draftMin += Number(item.estimatedMin) || 0;
    rows[key].count++;
  }));
  return Object.values(rows).map(row => {
    const available = ingAvail(row.staffId);
    const availableMin = available.configured
      ? ingFreeForDate(row.staffId, row.date, true).reduce((sum, slot) => sum + slot.e - slot.s, 0) : 0;
    const existingMin = tasksFor(row.staffId, row.date).reduce((sum, task) => sum + (Number(task.estimatedMin) || 0), 0);
    row.availableConfigured = !!available.configured;
    row.availableMin = availableMin;
    row.totalMin = row.draftMin + existingMin;
    row.over = row.availableConfigured && row.totalMin > row.availableMin;
    return row;
  }).sort((a, b) => a.date.localeCompare(b.date) || ((staffById(a.staffId) || {}).name || '').localeCompare((staffById(b.staffId) || {}).name || ''));
}

function viewBoard() {

  let h = '<div class="datenav">' +
    '<button class="navbtn" data-act="day" data-n="-1">‹</button>' +
    '<div class="d">' + label(cursor) + (relLabel(cursor) ? '<em>' + relLabel(cursor) + '</em>' : '') + '</div>' +
    '<button class="navbtn" data-act="day" data-n="1">›</button></div>';

  h += submissionBoardInbox();

  // 막힘 먼저
  const blocked = [];
  liveStaff().forEach(s => tasksFor(s.id, cursor).forEach(t => {
    if (statusOf(t, cursor) === 'blocked') blocked.push({ s: s, t: t, c: getCheck(t.id, cursor) });
  }));
  if (blocked.length) {
    h += '<div class="card alert"><div class="card-title" style="color:var(--coral)">🚧 막힘 ' + blocked.length + '건 — 원장님 확인 필요</div>' +

        '</div>').join('') + '</div>';
  }

  // 학생이 스스로 추가한 업무 — 지시서를 현실에 맞게 고치는 단서가 된다
  const added = staffAdded(cursor);
  if (added.length) {
    const byStaff = {};
    added.forEach(x => {
      const n = (staffById(x.t.staffId) || {}).name || '?';
      (byStaff[n] = byStaff[n] || []).push(x);
    });
    h += '<div class="card">' +
      '<div class="between mb8"><div class="card-title">＋ 학생이 추가한 업무</div>' +
      '<div class="pill">이번 주 ' + added.length + '건</div></div>' +
      '<div class="card-sub mb14">지시하지 않았는데 실제로 하고 있는 일입니다. 반복되면 정식 지시로 올리세요.</div>' +
      Object.keys(byStaff).map(n =>
        '<div class="small" style="font-weight:700;margin-top:10px">' + esc(n) + ' · ' + byStaff[n].length + '건</div>' +
        byStaff[n].map(x => {
          const st = statusOf(x.t, x.date);
          return '<div class="between small" style="padding:3px 0">' +
            '<span class="muted">· ' + esc(x.t.title) + ' <span style="opacity:.7">(' + shortDate(x.date) + ')</span></span>' +
            (st === 'done' ? '<span class="pill">완료</span>'
              : st === 'blocked' ? '<span class="pill bad">막힘</span>'
              : st === 'doing' ? '<span class="pill warn">진행중</span>' : '<span class="pill warn">미완료</span>') +
          '</div>';
        }).join('')
      ).join('') + '</div>';
  }

  // 순공시간 — 계획 이행률과 별개로 '실제로 얼마나 앉아 있었나'를 본다
  {
    const rows = list.map(s => ({ s: s, secs: stTotal(s.id, cursor), run: stRunning(s.id, cursor) }))
      .filter(x => x.secs || x.run)
      .sort((a, b) => b.secs - a.secs);
    if (rows.length) {
      const sum = rows.reduce((a, x) => a + x.secs, 0);
      h += '<div class="card"><div class="between mb8">' +
        '<div class="card-title">⏱ 순공시간</div>' +
        '<div class="pill">' + rows.length + '명 · 합계 ' + fmtDur(sum) + '</div></div>' +
        rows.map(x => {
          const goal = stGoalMin(x.s.id) * 60;
          const p = goal ? Math.min(100, Math.round(x.secs / goal * 100)) : 0;
          return '<div class="between small" style="padding:4px 0">' +
            '<span>' + esc(x.s.name) +
              (x.run ? ' <span class="pill">▶ ' + esc(x.run.subj) + '</span>' : '') + '</span>' +
            '<span class="row" style="gap:6px">' +
              (goal ? '<span class="pill ' + (p >= 100 ? '' : p >= 60 ? 'warn' : 'bad') + '">' + p + '%</span>' : '') +
              '<b>' + fmtDur(x.secs) + '</b></span></div>';
        }).join('') +
        '<div class="hint" style="margin-top:10px">계획 이행률과 함께 보세요 — 시간은 많은데 이행률이 낮으면 계획이 과한 것입니다.</div>' +
        '</div>';
    }
  }

  const all = list.reduce((a, s) => { const p = progress(s.id, cursor); a.done += p.done; a.total += p.total; return a; }, { done: 0, total: 0 });
  const pct = all.total ? Math.round(all.done / all.total * 100) : 0;
  h += '<div class="card"><div class="prog">' +
    '<div class="ring" style="--p:' + pct + '"><b>' + pct + '%</b></div>' +
    '<div style="flex:1"><div class="card-title">전체 수행률</div>' +
    '<div class="card-sub mb8">학생 ' + list.length + '명 · 지시 ' + all.total + '건 중 ' + all.done + '건 완료</div>' +
    '<div class="bar"><i style="width:' + pct + '%"></i></div></div></div>' +
    '<hr class="sep"><button class="btn btn-navy btn-block" data-act="brief">📊 오늘 마감 브리핑 만들기</button></div>';

  if (mine.length) {
    h += '<div class="sect">내 업무 — 대표</div>' + mine.map(s => staffCard(s)).join('');
    if (list.length) h += '<div class="sect">학생</div>';
  }
  h += list.map(s => staffCard(s)).join('');

  return h;
}

function staffCard(s) {
  const p = progress(s.id, cursor);
  const w = weekProgress(s.id, cursor);
  const st = streak(s.id);
  const rows = tasksFor(s.id, cursor).map(t => ({ t: t, st: statusOf(t, cursor), c: getCheck(t.id, cursor) }));
  const pend = rows.filter(x => x.st !== 'done');
  const notes = rows.filter(x => x.c && x.c.note);

  return '<div class="card">' +
    '<div class="staffcard mb14">' +
    '<div class="ava">' + esc(initials(s.name)) + '</div>' +
    '<div style="flex:1;min-width:0">' +
      '<div class="between"><div class="card-title">' + esc(s.name) + '</div>' +
        '<div class="pill">' + p.done + '/' + p.total + '</div></div>' +
      '<div class="bar" style="margin:6px 0 5px"><i style="width:' + p.pct + '%"></i></div>' +
      '<div class="small muted">이번 주 ' + w.pct + '% · 연속 달성 ' + st + '일</div>' +
    '</div></div>' +
    (pend.length
    ? pend.map(x => {

                    : x.st === 'doing' ? '<span class="pill warn">' + prog.done + '/' + prog.total + prog.unit + '</span>'
                    : '<span class="pill">미착수</span>';
        return '<div class="between small" style="padding:4px 0"><span>· ' + esc(x.t.title) +
          (x.t.time ? ' <span class="muted">(' + esc(x.t.time) + ')</span>' : '') + '</span>' + badge + '</div>';
      }).join('')
    : '<div class="small" style="color:var(--green);font-weight:700">✓ 지시 업무 모두 완료</div>') +
    (notes.length
    ? '<hr class="sep">' + notes.map(x =>
        '<div class="small mb8"><b>' + esc(x.t.title) + '</b><br><span class="muted">“' + esc(x.c.note) + '”</span></div>').join('')
    : '') +
    '<hr class="sep">' +
    '<div class="row wraprow" style="gap:8px">' +
    (session.isAdmin ? '<button class="btn btn-sm btn-ghost" data-act="openstaff" data-id="' + s.id + '">할 일 보기</button>' : '') +

    '<button class="btn btn-sm btn-ghost" data-act="orderText" data-id="' + s.id + '">지시서 문구</button>' +
    '</div></div>';
}

/* ── 영어·수학 PDF 결과지 ── */
const resultSheetUi = { owner: '', items: [], loaded: false, loading: false, error: '', seq: 0 };

async function resultSheetPost(body) {
  const auth = sync.auth();
  if (!auth) throw new Error('로그인과 동기화 연결이 필요합니다');
  return await sync.post('/consult-result', Object.assign({ app: SYNC_APP, auth: auth }, body));
}

async function loadResultSheets(owner, force) {
  if (!owner || (resultSheetUi.loading && resultSheetUi.owner === owner)) return;
  if (!force && resultSheetUi.loaded && resultSheetUi.owner === owner) return;
  const seq = ++resultSheetUi.seq;
  Object.assign(resultSheetUi, { owner: owner, loading: true, error: '' });
  try {
    const data = await resultSheetPost({ action: 'list', staffId: owner });
    if (seq !== resultSheetUi.seq || owner !== resultSheetUi.owner) return;
    resultSheetUi.items = Array.isArray(data.results) ? data.results : [];
    resultSheetUi.loaded = true;
  } catch (error) {
    if (seq === resultSheetUi.seq && owner === resultSheetUi.owner) {
      resultSheetUi.items = []; resultSheetUi.loaded = true;
      resultSheetUi.error = String(error && error.message || error);
    }
  } finally {
    if (seq !== resultSheetUi.seq) return;
    resultSheetUi.loading = false;
    if (route === 'results') renderAfterSync();
  }
}

function ensureResultSheets(owner) {
  if (resultSheetUi.owner !== owner) {
    resultSheetUi.seq++;
    Object.assign(resultSheetUi, { owner: owner, items: [], loaded: false, loading: false, error: '' });
  }

async function uploadResultSheet(staffId, button) {
  if (!session.isAdmin || session.isStaffLink) return;
  const auth = sync.auth(); if (!auth) return toast('로그인과 동기화 연결이 필요합니다');
  const subject = ($('#resultSubject') && $('#resultSubject').value) || '';
  const resultDate = ($('#resultDate') && $('#resultDate').value) || '';
  const title = ($('#resultTitle') && $('#resultTitle').value || '').trim();
  const fileInput = $('#resultFile'), file = fileInput && fileInput.files && fileInput.files[0];
  if (!['english', 'math'].includes(subject)) return toast('영어 또는 수학을 선택해 주세요');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(resultDate)) return toast('결과 날짜를 선택해 주세요');
  if (!title) return toast('결과지 제목을 입력해 주세요');
  if (!file || !/\.pdf$/i.test(file.name || '')) return toast('PDF 파일을 선택해 주세요');
  if (file.size > 10 * 1024 * 1024) return toast('PDF는 10MB 이하로 올려 주세요');
  button.disabled = true; button.textContent = 'PDF 올리는 중…';
  try {
    const form = new FormData();
    form.set('app', SYNC_APP); form.set('auth', JSON.stringify(auth)); form.set('staffId', staffId);
    form.set('subject', subject); form.set('resultDate', resultDate); form.set('title', title); form.set('file', file);
    const response = await fetch(SYNC_URL + '/consult-result-upload', { method: 'POST', body: form });
    const data = await response.json().catch(() => null);
    if (!response.ok || !data || data.ok !== true) throw new Error((data && data.error) || ('HTTP ' + response.status));
    await loadResultSheets(staffId, true); render(); toast('보호자 결과지를 등록했습니다');
  } catch (error) {
    toast('결과지 등록 실패 — ' + String(error && error.message || error));
    button.disabled = false; button.textContent = '보호자 결과지로 올리기';
  }
}

async function showResultSheet(id) {
  const auth = sync.auth(); if (!auth) return toast('로그인이 필요합니다');
  const popup = window.open('', '_blank');
  if (popup) popup.document.write('<p style="font-family:sans-serif;padding:20px">PDF를 불러오는 중입니다…</p>');
  try {
    const response = await fetch(SYNC_URL + '/consult-result', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ app: SYNC_APP, auth: auth, action: 'read_media', id: id })
    });
    if (!response.ok) {
      const data = await response.json().catch(() => null); throw new Error((data && data.error) || ('HTTP ' + response.status));
    }
    const url = URL.createObjectURL(await response.blob());
    if (popup) popup.location.replace(url); else location.href = url;
    setTimeout(() => URL.revokeObjectURL(url), 5 * 60 * 1000);
  } catch (error) {
    if (popup) popup.close();
    toast('PDF를 열 수 없습니다 — ' + String(error && error.message || error));
  }
}

function guardianPost(action, body) {
  if (!session.isAdmin || session.isStaffLink) return Promise.reject(new Error('원장 화면에서만 사용할 수 있습니다'));
  const auth = sync.auth();
  if (!auth) return Promise.reject(new Error('이 기기의 동기화 연결을 먼저 복구해 주세요'));
  return sync.post('/consult-guardian', Object.assign({
    app: SYNC_APP, auth: auth, action: action
  }, body || {}));
}

function guardianNormalizeAccess(value, staffId, fallbackEnabled) {
  const row = value && typeof value === 'object' ? value : {};
  return {
    staffId: staffId,
    enabled: row.enabled == null ? !!fallbackEnabled : row.enabled === true,
    updatedAt: row.updatedAt || 0,
    activeSessions: Math.max(0, Number(row.activeSessions) || 0),
    lastAckAt: row.lastAckAt || 0
  };
}

function guardianDateTime(value) {
  if (!value) return '없음';
  const raw = typeof value === 'number' && value > 0 && value < 1e12 ? value * 1000 : value;
  const date = new Date(raw);
  return Number.isNaN(date.getTime()) ? '없음' : date.toLocaleString('ko-KR');
}

function guardianInviteLink(data) {
  const returned = safeHttpsUrl(data && data.link);
  if (returned) return returned;
  const code = String(data && data.code || '').trim();
  return code ? sync.url().replace(/\/$/, '') + '/consult-guardian/#code=' + encodeURIComponent(code) : '';

  const period = row.periodLabel || [row.periodStart || snapshot.periodStart, row.periodEnd || snapshot.periodEnd].filter(Boolean).join(' ~ ') || row.periodKey || '기간 정보 없음';
  const summary = row.summary && typeof row.summary === 'object' ? row.summary :

function studentNameCompare(a, b) {
  return String(a && a.name || '').localeCompare(String(b && b.name || ''), 'ko', { numeric: true });
}

function isStudentActivityCheck(key, row) {
  if (!row) return false;
  const id = String(key || '').split('|')[0];
  if (!id.startsWith('__')) {
    return !!(row.claimed || row.done || row.blocked || row.dropped || Number(row.count) > 0 ||
      String(row.note || '').trim() || Object.values(row.steps || {}).some(Boolean));
  }
  if (id.startsWith('__st__')) {
    return !!(row.run || (row.segments || []).length || Object.values(row.secs || {}).some(Number));
  }
  if (id.startsWith('__dailyclose__') || id.startsWith('__weekclose__') || id.startsWith('__monthclose__')) {
    const close = row.close || {};
    return !!(close.reviewedAt || close.completedAt || close.difficulty || close.studentNextFocus ||
      Object.keys(close.resolutions || {}).length);
  }
  if (id.startsWith('__ingp__')) {
    return (row.items || []).some(item => item && (item.claimed || item.done || item.review));
  }
  if (id.startsWith('__ingnote__')) return !!(row.question || row.memo || row.page);
  if (id.startsWith('__rd__') || id.startsWith('__wn__')) return !!(row.items || []).length;
  return false;
}

function studentUsage(staffId) {
  let lastAt = 0;
  Object.entries(state.checks || {}).forEach(([key, row]) => {
    if (ownerOfCheck(key) === staffId && isStudentActivityCheck(key, row)) {
      lastAt = Math.max(lastAt, Number(row.updatedAt) || 0);
    }
  });
  (state.tasks || []).forEach(task => {
    if (!task.deleted && task.staffId === staffId && task.origin === 'staff') {
      lastAt = Math.max(lastAt, Number(task.updatedAt) || 0);
    }
  });
  const date = lastAt ? ymd(new Date(lastAt)) : '';
  const days = date ? Math.max(0, Math.round((parseYmd(today()) - parseYmd(date)) / 86400000)) : Infinity;
  const p = progress(staffId, today());
  return {
    status: days === 0 ? 'today' : days <= 7 ? 'recent' : 'idle',
    lastLabel: !date ? '학습 기록 없음' : days === 0 ? '오늘' : days === 1 ? '어제' : shortDate(date) + ' · ' + days + '일 전',
    done: p.done, total: p.total, secs: stTotal(staffId, today()),
    closed: dailyCloseState(staffId, today()).complete
  };
}

function studentUsageLine(student) {
  if (student.owner || student.manager) return '';
  const usage = studentUsage(student.id);
  const label = usage.status === 'today' ? '● 오늘 학습' : usage.status === 'recent' ? '● 최근 학습' : '● 확인 필요';
  return '<div class="student-usage-line"><span class="tag usage-' + usage.status + '">' + label + '</span>' +
    '<span class="small muted">최근 기록 ' + usage.lastLabel + ' · 오늘 순공 ' + fmtDur(usage.secs) +
    ' · 체크 ' + usage.done + '/' + usage.total + ' · 하루 마감 ' + (usage.closed ? '완료' : '미완료') + '</span></div>';
}

/* 카카오 수신번호는 서버에만 두고, 원장 화면에는 마스킹 상태만 잠시 보관한다. */
const consultLinkContactsUi = {
  rows: new Map(), loaded: false, loading: false, error: '', busy: ''
};

function clearConsultLinkContacts() {
  consultLinkContactsUi.rows.clear();
  consultLinkContactsUi.loaded = false;
  consultLinkContactsUi.loading = false;
  consultLinkContactsUi.error = '';
  consultLinkContactsUi.busy = '';
}

function consultLinkContactRow(row) {
  const staffId = String((row && row.staffId) || '');
  if (!staffId) return null;
  return {
    staffId: staffId,
    phoneMasked: String(row.phoneMasked || ''),
    consent: row.consent === true,
    updatedAt: Number(row.updatedAt) || 0
  };
}

async function loadConsultLinkContacts(force) {
  if (!session.isAdmin || session.isStaffLink || consultLinkContactsUi.loading || (consultLinkContactsUi.loaded && !force)) return;
  const auth = sync.auth();
  if (!auth) {
    consultLinkContactsUi.loaded = true;
    consultLinkContactsUi.error = '로그인과 동기화 연결이 필요합니다';
    if (route === 'staff') render();
    return;
  }
  consultLinkContactsUi.loading = true;
  consultLinkContactsUi.loaded = false;
  consultLinkContactsUi.error = '';
  try {
    const data = await sync.post('/consult-link-send', { app: SYNC_APP, auth: sync.auth(), action: 'list' });
    if (!session.isAdmin || session.isStaffLink) return;
    const rows = new Map();
    (Array.isArray(data.contacts) ? data.contacts : []).forEach(value => {
      const row = consultLinkContactRow(value);
      if (row) rows.set(row.staffId, row);
    });
    consultLinkContactsUi.rows = rows;
    consultLinkContactsUi.loaded = true;
  } catch (error) {
    if (!session.isAdmin || session.isStaffLink) return;
    consultLinkContactsUi.loaded = true;
    consultLinkContactsUi.error = String(error && error.message || error);
  } finally {
    consultLinkContactsUi.loading = false;
    if (route === 'staff' && session.isAdmin && !session.isStaffLink) render();
  }
}

function consultLinkStudentPanel(student) {
  if (!student || student.owner || student.manager) return '';

  const phone = contact && contact.phoneMasked;
  const ready = !!(phone && contact.consent);
  const sendBusy = consultLinkContactsUi.busy === 'send:' + student.id;
  const anyBusy = !!consultLinkContactsUi.busy;
  const status = consultLinkContactsUi.error ? '카카오 상태 확인 실패'
    : !consultLinkContactsUi.loaded ? '카카오 상태 확인 중…'
    : ready ? '학생 연락처 ' + phone + ' · 카카오 발송 준비됨'
    : phone ? '학생 연락처 ' + phone + ' · 동의 확인 필요'
    : '학생 연락처 없음 · 처음 한 번만 등록하세요';

        (unavailable || anyBusy ? ' disabled' : '') + '>학생 연락처 수정</button>' : '') +
