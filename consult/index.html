<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>컨설팅 플래너 · WB 웩슬러브레인센터</title>
<meta name="theme-color" content="#1B3A5C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue:       #7C3AED;
    --deep-blue:  #5B21B6;
    --navy:       #1B3A5C;
    --coral:      #E85D4A;
    --ivory:      #FAF8F3;
    --dark-gray:  #2D2D2D;
    --mid-gray:   #6B7280;
    --line:       #E5E7EB;
    --light-gray: #F3F4F6;
    --white:      #FFFFFF;
    --green:      #16A34A;
    --amber:      #D97706;
    --surface:    rgba(255,255,255,.94);
    --shadow-sm:  0 1px 2px rgba(27,58,92,.04), 0 8px 24px rgba(27,58,92,.055);
    --shadow-md:  0 18px 50px rgba(27,58,92,.18);
    --focus:      rgba(124,58,237,.28);
    --subject-korean:  #7FB3F4;
    --subject-english: #F49ABC;
    --subject-math:    #82CFA2;
    --subject-social:  #E7C85C;
    --subject-science: #B9A7F5;
    --subject-other:   #A8AFB8;
  }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--dark-gray);
    background: linear-gradient(180deg, #F8F5FF 0, var(--ivory) 240px);
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
    padding-bottom: calc(48px + env(safe-area-inset-bottom));
  }

  button, input, select, textarea { font-family: inherit; font-size: 100%; color: inherit; }
  button { cursor: pointer; border: none; background: none; }

  .wrap { max-width: 760px; margin: 0 auto; padding: 0 14px; }

  /* ─── 상단 바 ─── */
  .topbar { background: var(--navy); color: var(--white); padding: calc(10px + env(safe-area-inset-top)) 0 10px; position: sticky; top: 0; z-index: 50; box-shadow: 0 3px 14px rgba(27,58,92,.18); }
  .topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .brand { font-size: 15px; font-weight: 900; letter-spacing: -0.02em; }
  .brand span { color: var(--blue); }
  .brand small { display: block; font-size: 11px; font-weight: 400; color: rgba(255,255,255,0.6); letter-spacing: 0; }
  .whoami {
    font-size: 12px; font-weight: 700; background: rgba(255,255,255,0.14);
    min-height: 36px; padding: 6px 12px; border-radius: 999px; display: flex; align-items: center; gap: 6px;
  }
  .whoami i { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); font-style: normal; }
  .whoami.off i { background: var(--mid-gray); }
  .whoami.err i { background: var(--coral); }

  /* ─── 탭 ─── */
  .tabs { background: rgba(255,255,255,.94); border-bottom: 1px solid var(--line); position: sticky; top: calc(56px + env(safe-area-inset-top)); z-index: 40; backdrop-filter: blur(14px); }
  .tabs .wrap { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x proximity; overscroll-behavior-inline: contain; }
  .tabs .wrap::-webkit-scrollbar { display: none; }
  .tab {
    min-height: 48px; padding: 11px 14px; font-size: 14px; font-weight: 700; color: var(--mid-gray);
    border-bottom: 3px solid transparent; white-space: nowrap; display: flex; align-items: center; gap: 5px; scroll-snap-align: center;
  }
  .tab.on { color: var(--deep-blue); border-bottom-color: var(--blue); }
  .badge {
    background: var(--coral); color: var(--white); font-size: 11px; font-weight: 900;
    min-width: 18px; height: 18px; border-radius: 999px; padding: 0 5px;
    display: inline-flex; align-items: center; justify-content: center;
  }

  /* ─── 카드 ─── */
  .card { background: var(--surface); border: 1px solid rgba(229,231,235,.9); border-radius: 16px; padding: 17px; margin-bottom: 13px; box-shadow: var(--shadow-sm); }
  .card.alert { border-color: var(--coral); background: #FFF9F8; }
  .card-title { font-size: 15px; font-weight: 900; margin-bottom: 4px; }
  .card-sub { font-size: 13px; color: var(--mid-gray); }
  .today-fold-card { padding: 0; overflow: hidden; }
  .today-fold-head {
    width: 100%; min-height: 74px; padding: 15px 17px; display: flex; align-items: center;
    justify-content: space-between; gap: 12px; text-align: left; background: transparent;
  }
  .today-fold-head:hover { background: rgba(243,244,246,.55); }
  .today-fold-copy { flex: 1; min-width: 0; }
  .today-fold-meta { display: flex; align-items: center; justify-content: flex-end; gap: 7px; flex-wrap: wrap; }
  .today-fold-chevron {
    width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
    flex-shrink: 0; background: var(--light-gray); color: var(--mid-gray); font-size: 15px; font-weight: 900;
  }
  .today-fold-body { padding: 0 17px 17px; border-top: 1px solid var(--light-gray); }
  .today-fold-body > :first-child { margin-top: 10px; }
  .today-fold-card.is-folded .today-fold-head { min-height: 66px; }
  .today-fold-section + .today-fold-section { margin-top: 13px; padding-top: 13px; border-top: 1px solid var(--light-gray); }
  main { padding-top: 16px; }

  .row { display: flex; align-items: center; gap: 10px; }
  .wraprow { flex-wrap: wrap; }
  .between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .muted { color: var(--mid-gray); }
  .small { font-size: 12px; }
  .mb8 { margin-bottom: 8px; } .mb14 { margin-bottom: 14px; } .mt14 { margin-top: 14px; }

  /* ─── 버튼 ─── */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 44px; padding: 10px 16px; border-radius: 11px; font-size: 14px; font-weight: 700;
    background: var(--light-gray); color: var(--dark-gray); border: 1px solid transparent;
    text-decoration: none; cursor: pointer; transition: transform .16s ease, box-shadow .16s ease, filter .16s ease;
  }
  .btn:active { filter: brightness(0.94); transform: translateY(1px); }
  .btn-primary { background: var(--blue); color: var(--white); }
  .btn-navy { background: var(--navy); color: var(--white); }
  .btn-ghost { background: var(--white); border-color: var(--line); }
  .btn-danger { background: #FEF2F2; color: var(--coral); }
  .btn-warn { background: #FFF7ED; color: var(--amber); border: 1px solid #FDE8CC; }
  .btn-sm { min-height: 36px; padding: 7px 11px; font-size: 12.5px; border-radius: 9px; }
  .btn-block { display: flex; width: 100%; }
  .btn:disabled { opacity: .5; cursor: default; }

  /* ─── 폼 ─── */
  .fl { display: block; font-size: 12.5px; font-weight: 700; color: var(--mid-gray); margin-bottom: 5px; }
  .in { width: 100%; min-height: 44px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 11px; background: var(--white); font-size: 14.5px; transition: border-color .16s ease, box-shadow .16s ease; }
  .in:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--focus); }
  textarea.in { resize: vertical; min-height: 62px; line-height: 1.6; }
  .field { margin-bottom: 12px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip { min-height: 38px; padding: 8px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--white); font-size: 13px; font-weight: 700; color: var(--mid-gray); display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
  .chip.on { background: var(--navy); border-color: var(--navy); color: var(--white); }
  .chip.dow { min-width: 42px; padding: 8px 0; text-align: center; justify-content: center; }

  /* ─── 날짜 네비 ─── */
  .datenav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px; }
  .datenav .d { font-size: 17px; font-weight: 900; }
  .datenav .d em { font-style: normal; font-size: 13px; font-weight: 700; color: var(--blue); margin-left: 6px; }
  .navbtn { width: 38px; height: 38px; border-radius: 10px; background: var(--white); border: 1px solid var(--line); font-size: 16px; font-weight: 900; color: var(--mid-gray); }

  /* ─── 진행률 ─── */
  .prog { display: flex; align-items: center; gap: 14px; }
  .ring {
    width: 62px; height: 62px; border-radius: 50%; flex-shrink: 0;
    display: grid; place-items: center; font-weight: 900; color: var(--navy);
    background: conic-gradient(var(--blue) calc(var(--p) * 1%), var(--light-gray) 0);
    position: relative;
  }
  .ring::after { content: ''; position: absolute; inset: 7px; background: var(--white); border-radius: 50%; }
  .ring b { position: relative; z-index: 1; font-size: 15px; }
  .bar { height: 8px; border-radius: 99px; background: var(--light-gray); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--blue); border-radius: 99px; }
  .bar.mini { height: 5px; }
  .bar.doing i { background: var(--amber); }

  /* ─── 업무 항목 ─── */
  .task { display: flex; gap: 12px; align-items: flex-start; padding: 14px 4px; border-bottom: 1px solid var(--light-gray); }
  .task:last-child { border-bottom: none; }
  .task.isblocked { background: #FFF9F8; border-radius: 10px; padding-left: 10px; padding-right: 10px; }
  .box {
    width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0; margin-top: 1px;
    border: 2px solid #D1D5DB; background: var(--white);
    display: grid; place-items: center; color: transparent; font-size: 15px; font-weight: 900;
  }
  .task.done .box { background: var(--blue); border-color: var(--blue); color: var(--white); }
  .task.doing .box { border-color: var(--amber); }
  .task-body { flex: 1; min-width: 0; }
  .task-t { font-size: 15px; font-weight: 700; line-height: 1.45; word-break: keep-all; }
  .task.done .task-t { color: var(--mid-gray); text-decoration: line-through; }
  .task-d { font-size: 13px; color: var(--mid-gray); margin-top: 3px; white-space: pre-wrap; word-break: break-word; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; align-items: center; }
  .tag { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: var(--light-gray); color: var(--mid-gray); }
  .tag.time { background: #EAF6FC; color: var(--deep-blue); }
  .tag.high { background: #FEF2F2; color: var(--coral); }
  .tag.ok   { background: #ECFDF5; color: var(--green); }
  .tag.doing{ background: #FFF7ED; color: var(--amber); }
  .tag.blk  { background: var(--coral); color: var(--white); }
  .tag.carry{ background: #FEF2F2; color: var(--coral); }
  .tag.add  { background: #ECFDF5; color: var(--green); }
  .tag.edit { background: #FFF7ED; color: var(--amber); }
  .tag.usage-today { background: #E7F7EE; color: #2E6E49; }
  .tag.usage-recent { background: #FFF7D7; color: #755E0A; }
  .tag.usage-idle { background: #F0F2F4; color: #626B75; }
  .student-usage-summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
  .student-usage-summary > div { padding: 10px 8px; border: 1px solid var(--line); border-radius: 10px; background: #FAFCFF; text-align: center; }
  .student-usage-summary span, .student-usage-summary b { display: block; }
  .student-usage-summary span { color: var(--mid-gray); font-size: 10px; font-weight: 800; }
  .student-usage-summary b { margin-top: 3px; color: var(--navy); font-size: 16px; }
  .student-usage-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 7px; }
  .subject-tag { border: 1px solid transparent; }
  .subject-korean { --subject-color: var(--subject-korean); --subject-bg: #E8F2FF; --subject-text: #285B91; }
  .subject-english { --subject-color: var(--subject-english); --subject-bg: #FFEAF2; --subject-text: #8E3E5E; }
  .subject-math { --subject-color: var(--subject-math); --subject-bg: #E7F7EE; --subject-text: #2E6E49; }
  .subject-social { --subject-color: var(--subject-social); --subject-bg: #FFF7D7; --subject-text: #755E0A; }
  .subject-science { --subject-color: var(--subject-science); --subject-bg: #F1ECFF; --subject-text: #5B3E8D; }
  .subject-other { --subject-color: var(--subject-other); --subject-bg: #F0F2F4; --subject-text: #555D67; }
  .subject-tag, .subject-chip { background: var(--subject-bg); color: var(--subject-text); border-color: var(--subject-color); }
  .subject-chip.on { background: var(--subject-color); color: #24303B; border-color: var(--subject-color); box-shadow: 0 0 0 3px rgba(27,58,92,.10); }
  .note { margin-top: 8px; width: 100%; font-size: 13px; padding: 8px 10px; border: 1px dashed var(--line); border-radius: 8px; background: var(--ivory); }
  .empty { text-align: center; padding: 40px 16px; color: var(--mid-gray); font-size: 14px; }
  .empty b { display: block; font-size: 30px; margin-bottom: 8px; }

  /* ─── 단계 / 가이드 ─── */
  .opener { font-size: 12.5px; font-weight: 700; color: var(--deep-blue); padding: 4px 0; margin-top: 6px; }
  .panel { margin-top: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: #FCFDFE; }
  .guide { background: #F0F9FF; border: 1px solid #D5EBF7; border-radius: 8px; padding: 10px 12px; font-size: 13px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .guide b { display: block; color: var(--deep-blue); font-size: 12px; margin-bottom: 4px; }
  .step { display: flex; gap: 9px; align-items: flex-start; padding: 7px 0; font-size: 13.5px; }
  .sbox {
    width: 20px; height: 20px; border-radius: 6px; flex-shrink: 0; margin-top: 1px;
    border: 2px solid #D1D5DB; background: var(--white);
    display: grid; place-items: center; color: transparent; font-size: 12px; font-weight: 900;
  }
  .step.on .sbox { background: var(--green); border-color: var(--green); color: var(--white); }
  .step.on span { color: var(--mid-gray); text-decoration: line-through; }
  .counter { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; font-weight: 700; }
  .counter input { width: 74px; text-align: center; padding: 8px; }

  /* ─── 주간 그리드 ─── */
  .weekwrap { overflow-x: auto; }
  table.week { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 720px; }
  table.week th, table.week td { border: 1px solid var(--line); padding: 7px 5px; text-align: center; }
  table.week th.subj, table.week td.subj { width: 62px; padding: 5px; font-weight: 900; }
  table.week th.n, table.week td.n { text-align: left; width: 30%; font-weight: 700; }
  table.week thead th { background: var(--light-gray); font-size: 12px; color: var(--mid-gray); font-weight: 700; }
  table.week thead th.today { background: var(--navy); color: var(--white); }
  .ing-hero { position: relative; overflow: hidden; border: 0; color: var(--white); background: linear-gradient(135deg, var(--navy), #3B2667); box-shadow: 0 18px 42px rgba(27,58,92,.2); }
  .ing-hero::after { content: ''; position: absolute; right: -54px; top: -72px; width: 190px; height: 190px; border-radius: 50%; background: rgba(255,255,255,.08); }
  .ing-hero-top { position: relative; z-index: 1; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .ing-hero-kicker { margin-bottom: 3px; color: #D8C9FF; font-size: 10px; font-weight: 900; letter-spacing: .13em; }
  .ing-hero-title { font-size: 21px; font-weight: 900; letter-spacing: -.03em; }
  .ing-hero-sub { margin-top: 3px; color: rgba(255,255,255,.72); font-size: 12px; }
  .ing-hero-alert { position: relative; z-index: 1; flex: 0 0 auto; padding: 5px 9px; border-radius: 999px; color: #FFF; background: rgba(232,93,74,.9); font-size: 11px; font-weight: 900; }
  .ing-overview-grid { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
  .ing-overview-stat { min-width: 0; padding: 11px 12px; border: 1px solid rgba(255,255,255,.13); border-radius: 11px; background: rgba(255,255,255,.09); color: rgba(255,255,255,.72); font-size: 11px; }
  .ing-overview-stat b { display: block; margin-bottom: 1px; color: var(--white); font-size: 18px; line-height: 1.25; }
  .ing-hero-time { position: relative; z-index: 1; margin-top: 9px; color: rgba(255,255,255,.78); font-size: 11px; font-weight: 800; }
  .ing-hero-actions { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 13px; }
  .ing-hero .btn-primary { background: var(--white); color: var(--navy); }
  .ing-hero .btn-ghost { border-color: rgba(255,255,255,.24); background: rgba(255,255,255,.1); color: var(--white); }
  .ing-shift-intro { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 14px; border-radius: 12px; background: linear-gradient(135deg, #F3EEFF, #F8FAFC); }
  .ing-shift-intro b, .ing-shift-intro span { display: block; }
  .ing-shift-choice { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .ing-shift-choice .chip { min-height: 54px; border-radius: 11px; flex-direction: column; line-height: 1.35; }
  .ing-shift-choice small { font-size: 10px; font-weight: 500; opacity: .78; }
  .ing-shift-days { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 10px; align-items: end; }
  .ing-shift-quick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
  .ing-shift-quick .chip { min-width: 0; padding-left: 4px; padding-right: 4px; }
  .ing-shift-preview { margin-top: 14px; padding: 13px; border: 1px solid #C7DDF6; border-radius: 12px; background: #F5FAFF; }
  .ing-shift-preview.warn { border-color: #F5B8AF; background: #FFF9F8; color: #B93827; }
  .ing-shift-route { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px; }
  .ing-shift-route > div { min-width: 0; padding: 9px; border-radius: 9px; background: var(--white); text-align: center; }
  .ing-shift-route span { display: block; color: var(--mid-gray); font-size: 10px; font-weight: 700; }
  .ing-shift-route b { display: block; overflow-wrap: anywhere; color: var(--navy); font-size: 13px; }
  .ing-shift-arrow { color: var(--deep-blue); font-size: 18px; font-weight: 900; }
  .ing-shift-result { margin-top: 9px; text-align: center; font-size: 12px; }
  .ing-calendar-card { padding-bottom: 14px; }
  .ing-avail-intro { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 13px 14px; border: 1px solid #CFE1F3; border-radius: 13px; background: linear-gradient(135deg, #F5FAFF, #FBF8FF); }
  .ing-avail-intro b { display: block; color: var(--navy); font-size: 13px; }
  .ing-avail-intro span { display: block; margin-top: 3px; color: var(--mid-gray); font-size: 11px; line-height: 1.5; }
  .ing-avail-step { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; color: var(--white); background: var(--navy); font-size: 12px; font-weight: 900; }
  .ing-avail-section { margin-top: 14px; padding: 14px; border: 1px solid var(--line); border-radius: 13px; background: #FBFCFE; }
  .ing-avail-section-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .ing-avail-section-head b { color: var(--navy); font-size: 13px; }
  .ing-avail-window-grid { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: end; }
  .ing-avail-window-grid label, .ing-avail-time-grid label { display: grid; gap: 5px; color: var(--mid-gray); font-size: 10px; font-weight: 800; }
  .ing-avail-arrow { padding-bottom: 12px; color: var(--mid-gray); font-weight: 900; }
  .ing-avail-presets, .ing-avail-quick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .ing-avail-presets .chip, .ing-avail-quick .chip { min-height: 38px; }
  .ing-avail-quick .chip { border-color: #D7E5F3; background: var(--white); }
  .ing-avail-list { display: grid; gap: 10px; }
  .ing-avail-row { padding: 12px; border: 1px solid #DCE4EC; border-radius: 12px; background: var(--white); box-shadow: 0 4px 12px rgba(27,58,92,.04); }
  .ing-avail-row-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 7px; align-items: center; }
  .ing-avail-row-actions { display: flex; gap: 5px; }
  .ing-avail-day-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 10px 0 7px; }
  .ing-avail-day-head > span { color: var(--mid-gray); font-size: 10px; font-weight: 800; }
  .ing-avail-day-presets { display: flex; gap: 4px; }
  .ing-avail-day-presets .btn { min-height: 32px; padding: 5px 8px; font-size: 10px; }
  .ing-avail-days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .ing-avail-days .chip { min-width: 0; min-height: 38px; padding: 6px 2px; }

const LOCAL_AUTH_SETTINGS = Object.freeze([
  'adminPin', 'adminLoginId', 'syncSecret', 'adminToken', 'myToken', 'syncUrl', 'pullAt', 'pushAt', 'dataGeneration'
]);
function sanitizedBackupState(source) {
  const copy = JSON.parse(JSON.stringify(source || blankState()));
  copy.settings = Object.assign({}, copy.settings || {});
  LOCAL_AUTH_SETTINGS.forEach(key => { delete copy.settings[key]; });
  copy.staff = (Array.isArray(copy.staff) ? copy.staff : []).map(staff => {
    const clean = Object.assign({}, staff);
    delete clean.token;
    return clean;
  });
  return copy;
}
function mergeImportedState(imported, current) {
  const base = blankState();
  const safe = sanitizedBackupState(imported || {});
  const currentSettings = Object.assign({}, (current && current.settings) || {});
  const local = {};
  LOCAL_AUTH_SETTINGS.forEach(key => {
    if (Object.prototype.hasOwnProperty.call(currentSettings, key)) local[key] = currentSettings[key];
  });
  const currentTokens = new Map(((current && current.staff) || [])
    .filter(staff => staff && staff.id && staff.token).map(staff => [staff.id, staff.token]));
  const staff = (safe.staff || []).map(item => currentTokens.has(item.id)
    ? Object.assign({}, item, { token: currentTokens.get(item.id) }) : item);
  return Object.assign(base, safe, {
    staff: staff,
    settings: Object.assign({}, base.settings, safe.settings || {}, local, { pullAt: 0, pushAt: 0 })
  });
}

function lockStorageFailureControls(locked) {
  if (typeof document === 'undefined' || typeof document.querySelectorAll !== 'function') return;
  document.querySelectorAll('#modalHost button[data-act]:not([data-act="closemodal"])').forEach(button => {
    if (locked && !button.disabled) { button.disabled = true; button.dataset.storageDisabled = '1'; }
    else if (!locked && button.dataset.storageDisabled === '1') { button.disabled = false; delete button.dataset.storageDisabled; }
  });
}

function save() {

    saveFailedThisTurn = false;
    lockStorageFailureControls(false);

      const host = typeof document !== 'undefined' && typeof document.getElementById === 'function' && document.getElementById('modalHost');
      if (host && host.firstElementChild) { closeModal(); render(); toast('기기 저장을 다시 완료했습니다'); }

  } catch (e) {
    storageError = 'LOCAL_SAVE_FAILED';
    storageRecoveryPending = true;
    saveFailedThisTurn = true;
    Promise.resolve().then(() => { saveFailedThisTurn = false; });
    lockStorageFailureControls(true);
    paintStorageAlert();
    if (typeof paintStatus === 'function' && typeof document.getElementById === 'function' && document.getElementById('whoami')) paintStatus();

function ymd(d) {
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function parseYmd(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
function today() { return ymd(new Date()); }
function nowHM() { const d = new Date(); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
function dowOf(s) { return parseYmd(s).getDay(); }
function label(s) { const d = parseYmd(s); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + DOW[d.getDay()] + ')'; }
function shortDate(s) { const d = parseYmd(s); return (d.getMonth() + 1) + '/' + d.getDate(); }
function relLabel(s) {
  const diff = Math.round((parseYmd(s) - parseYmd(today())) / 86400000);
  if (diff === 0) return '오늘';
  if (diff === -1) return '어제';
  if (diff === 1) return '내일';
  return null;
}
function mondayOf(s) { const d = parseYmd(s); return addDays(s, -((d.getDay() + 6) % 7)); }
const ymOf = s => s.slice(0, 7);
function ymLabel(ym) { return ym.slice(0, 4) + '년 ' + Number(ym.slice(5)) + '월'; }
function ymAdd(ym, n) {
  const d = new Date(Number(ym.slice(0, 4)), Number(ym.slice(5, 7)) - 1 + n, 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function monthDates(ym) {
  const last = new Date(Number(ym.slice(0, 4)), Number(ym.slice(5, 7)), 0).getDate();
  return Array.from({ length: last }, (_, i) => ym + '-' + String(i + 1).padStart(2, '0'));
}

function occursOn(task, date) {
  if (task.deleted) return false;
  if (task.kind === 'mgoal') return false;   // 월간 목표는 일별 목록에 섞지 않는다
  if (task.kind === 'report_snapshot') return false;
  if (task.kind === 'academic_event' || task.kind === 'material_request') return false;
  if (task.kind === 'material_response' && task.status !== 'provided') return false;
  if (task.start && date < task.start) return false;
  if (task.end && date > task.end) return false;
  switch (task.repeat) {
    case 'once':    return date === task.start;
    case 'daily':   return true;
    case 'weekday': { const w = dowOf(date); return w >= 1 && w <= 5; }
    case 'days':    return (task.days || []).includes(dowOf(date));
    default:        return false;
  }
}

const weekMoveKey = staffId => '__weekmove__' + staffId;
function weekMovesFor(staffId) {
  const c = state.checks[weekMoveKey(staffId) + '|all'];
  return (c && Array.isArray(c.moves)) ? c.moves.filter(move => move && move.taskId && move.from && move.to) : [];
}
function effectiveOccursOn(task, date) {
  const moves = weekMovesFor(task.staffId, date);
  if (moves.some(move => move.taskId === task.id && move.to === date)) return true;
  if (moves.some(move => move.taskId === task.id && move.from === date)) return false;
  return occursOn(task, date);
}

function tasksFor(staffId, date) {
  return state.tasks
    .filter(t => t.staffId === staffId && effectiveOccursOn(t, date))
    .sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99')
                 || (b.priority === 'high') - (a.priority === 'high')
                 || (a.createdAt || 0) - (b.createdAt || 0));
}

/** 새 배부 공부만 학생이 직접 체크리스트에 담는다. 기존 업무는 이전처럼 바로 보인다. */
const isStudyOffer = task => !!(task && task.requiresClaim && task.origin !== 'staff');
const isStudyClaimed = (task, date) => !isStudyOffer(task) || !!(getCheck(task.id, date) || {}).claimed;
const checklistTasksFor = (staffId, date) => tasksFor(staffId, date)
  .filter(task => isStudyClaimed(task, date) && !(getCheck(task.id, date) || {}).dropped);
const studyOffersFor = (staffId, date) => tasksFor(staffId, date).filter(isStudyOffer);

/** 과거 플래너는 마감 당시 항목과 이후 다른 날짜로 옮긴 항목까지 보존해서 보여준다. */
function historicalPlannerTasks(staffId, date) {
  const rows = new Map(tasksFor(staffId, date).map(task => [task.id, task]));
  weekMovesFor(staffId, date).filter(move => move.from === date).forEach(move => {
    const task = state.tasks.find(item => item.id === move.taskId && item.staffId === staffId);
    if (task) rows.set(task.id, task);
  });

  const snapshot = dailyCloseOf(staffId, date).itemSnapshot || [];
  snapshot.filter(item => item.type === 'task' && String(item.key || '').startsWith('task:')).forEach(item => {
    const id = String(item.key).slice(5);
    const task = state.tasks.find(row => row.id === id && row.staffId === staffId) || {
      id: id, staffId: staffId, title: item.label || '기록된 공부', detail: item.detail || '',
      studySubject: item.subjectKey || 'other', repeat: 'once', start: date,
      requiresClaim: false, plannerSnapshot: true
    };
    rows.set(id, task);
  });
  return [...rows.values()];
}

const ckey = (taskId, date) => taskId + '|' + date;
const getCheck = (taskId, date) => state.checks[ckey(taskId, date)] || null;
const isDone = (taskId, date) => !!(state.checks[ckey(taskId, date)] || {}).done;

function setCheck(taskId, date, patch) {
  const k = ckey(taskId, date);
  if (storageError) {
    paintStorageAlert();
    toast('먼저 기기 저장을 재시도해 주세요');
    return null;
  }
  const cur = state.checks[k] || { taskId: taskId, date: date, done: false, note: '', steps: {}, count: 0, blocked: false };
  const next = Object.assign({}, cur, patch, { updatedAt: now() });
  state.checks[k] = next;
  const stored = save();
  queueSync();
  return stored ? next : null;
}

/** 단계·수량을 고려한 개별 업무 진행률 */
function taskProgress(t, c) {
  const steps = t.steps || [];
  if (steps.length) {
    const done = steps.filter(s => c && c.steps && c.steps[s.id]).length;
    return { done: done, total: steps.length, unit: '단계', pct: Math.round(done / steps.length * 100) };
  }
  if (t.target) {
    const n = (c && c.count) || 0;
    return { done: n, total: t.target, unit: t.unit || '건', pct: Math.min(100, Math.round(n / t.target * 100)) };
  }
  const d = (c && c.done) ? 1 : 0;
  return { done: d, total: 1, unit: '', pct: d * 100 };
}

/** 미착수 todo / 진행중 doing / 완료 done / 막힘 blocked */
function statusOf(t, date) {
  const c = getCheck(t.id, date);
  if (c && c.blocked) return 'blocked';
  if (c && c.done) return 'done';
  if (taskProgress(t, c).done > 0) return 'doing';
  return 'todo';
}
const STATUS_LABEL = { todo: '미착수', doing: '진행중', done: '완료', blocked: '막힘' };

/** 단계·수량이 다 차면 자동 완료, 되돌리면 자동 해제.
 *  둘 다 있는 업무는 단계도 끝나고 수량도 채워져야 완료다. */
function syncAuto(t, date) {
  const c = getCheck(t.id, date);
  if (!c) return;
  const hasSteps = (t.steps || []).length > 0, hasTarget = !!t.target;
  if (!hasSteps && !hasTarget) return;
  const stepsOk = !hasSteps || t.steps.every(s => c.steps && c.steps[s.id]);
  const countOk = !hasTarget || ((c.count || 0) >= t.target);
  const full = stepsOk && countOk;
  if (full && !c.done) setCheck(t.id, date, { done: true, at: now() });
  else if (!full && c.done) setCheck(t.id, date, { done: false, at: null });
}

function progress(staffId, date) {
  const list = checklistTasksFor(staffId, date);
  const done = list.filter(t => isDone(t.id, date)).length;
  return { done: done, total: list.length, pct: list.length ? Math.round(done / list.length * 100) : 0 };
}

/** 그 달의 월간 목표 (kind:'mgoal') — 일별 업무와 별도로 산다 */
function goalsFor(staffId, ym) {
  return state.tasks
    .filter(t => !t.deleted && t.kind === 'mgoal' && t.staffId === staffId && t.month === ym)
    .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
}

function monthProgress(staffId, ym) {
  let done = 0, total = 0;
  monthDates(ym).forEach(d => { const p = progress(staffId, d); done += p.done; total += p.total; });
  return { done: done, total: total, pct: total ? Math.round(done / total * 100) : 0 };
}

function weekProgress(staffId, anchor) {
  const mon = mondayOf(anchor);
  let done = 0, total = 0;
  for (let i = 0; i < 7; i++) { const p = progress(staffId, addDays(mon, i)); done += p.done; total += p.total; }
  return { done: done, total: total, pct: total ? Math.round(done / total * 100) : 0 };
}

function streak(staffId) {
  let d = today(), n = 0;
  for (let i = 0; i < 120; i++) {
    const p = progress(staffId, d);
    if (p.total === 0) { d = addDays(d, -1); continue; }
    if (p.done < p.total) break;
    n++; d = addDays(d, -1);
  }
  return n;
}

/** 이월: 최근 7일 안에 못 끝낸 '이월' 업무 */
function carryOver(staffId, date) {
  const out = [];
  for (let i = 1; i <= 7; i++) {
    const d = addDays(date, -i);
    checklistTasksFor(staffId, d).forEach(t => {
      if (!t.carry || isDone(t.id, d)) return;
      if (state.tasks.some(row => !row.deleted && row.dailyCarryFrom === t.id + '|' + d)) return;
      out.push({ t: t, date: d });
    });
  }
  return out.sort((a, b) => a.date.localeCompare(b.date));
}

/** 그 주에 학생이 스스로 추가한 업무 */
function staffAdded(anchor) {
  const mon = mondayOf(anchor);
  const days = Array.from({ length: 7 }, (_, i) => addDays(mon, i));
  const out = [];
  state.tasks.forEach(t => {
    if (t.deleted || t.origin !== 'staff') return;
    const s = staffById(t.staffId);
    if (!s || s.owner) return;              // 대표가 스스로 넣은 건 '학생 추가'가 아니다
    days.forEach(d => { if (occursOn(t, d)) out.push({ t: t, date: d }); });
  });
  return out.sort((a, b) => a.date.localeCompare(b.date));
}

/** 원장이 바로 봐야 할 것: 막힘 + 예정 시각이 지난 미완료 */
function alertsToday() {
  const d = today(), hm = nowHM();
  let blocked = 0, overdue = 0;
  liveStaff().forEach(s => tasksFor(s.id, d).forEach(t => {
    const c = getCheck(t.id, d);
    if (c && c.blocked) { blocked++; return; }
    if (c && c.done) return;
    if (t.time && t.time < hm) overdue++;
  }));
  return { blocked: blocked, overdue: overdue, total: blocked + overdue };
}

/* ══════════════════════════════════════════════════════
   4. 동기화 (선택) — Google Apps Script 웹앱
   ══════════════════════════════════════════════════════ */
/* 동기화 — Cloudflare Workers + D1
 * 예전에는 매번 전체 상태를 통째로 주고받았다. 학생이 100명이 되면
 * 한 명이 체크 하나를 눌러도 나머지 99명 데이터가 오가서 감당이 안 된다.
 * 지금은 (1) 마지막 동기화 이후 바뀐 것만 (2) 학생은 자기 것만 주고받는다. */
const SYNC_URL = 'https://wb-sync.whdudwns33.workers.dev';
const SYNC_APP = 'consult';

/** 이 체크가 누구 것인지 — 서버가 학생별로 나눠 담는 기준이 된다.
 *  '__st__S1|2026-08-02' → S1,  '<taskId>|날짜' → 그 업무의 담당자 */
function ownerOfCheck(key) {
  const tid = String(key).split('|')[0];
  const m = tid.match(/^__[a-zA-Z]+__(.+)$/);
  if (m) return m[1];
  const t = (state.tasks || []).find(x => x.id === tid);
  return t ? (t.staffId || null) : null;
}

const sync = {
  busy: false, dirty: false, last: null, timer: null, loud: false, err: '', pendingRender: false,

  url() { return SYNC_URL; },

  /** 원장은 연결된 기기 토큰(구형 기기는 비밀키), 학생은 개인 토큰으로 접속한다 */
  auth() {
    if (session.isStaffLink) {
      const t = state.settings.myToken || '';
      return t ? { mode: 'person', id: session.staffId, token: t } : null;
    }
    const t = state.settings.adminToken || '';
    if (t) return { mode: 'admin_device', token: t };
    const k = state.settings.syncSecret || '';
    return k ? { mode: 'admin', secret: k } : null;
  },
  enabled() { return !!this.auth(); },

  /** since 이후 바뀐 것만 모은다. 각 레코드가 이미 updatedAt을 갖고 있어
   *  저장 지점마다 표시를 남기지 않아도 변경분을 정확히 골라낼 수 있다. */
  collect(since) {
    const out = [];
    (state.staff || []).forEach(s => {
      if ((s.updatedAt || 0) > since) out.push({ table: 'staff', id: s.id, owner: s.id, data: s, updated_at: s.updatedAt || 0 });
    });
    (state.tasks || []).forEach(t => {
      if ((t.updatedAt || 0) > since) out.push({ table: 'tasks', id: t.id, owner: t.staffId || null, data: t, updated_at: t.updatedAt || 0 });
    });
    Object.keys(state.checks || {}).forEach(k => {
      const c = state.checks[k];
      if (c && (c.updatedAt || 0) > since) out.push({ table: 'checks', k: k, owner: ownerOfCheck(k), data: c, updated_at: c.updatedAt || 0 });
    });
    return out;
  },

  /** 받은 변경을 반영한다. 내 것이 더 최신이면 그대로 둔다 */
  apply(changes) {
    let n = 0;
    (changes || []).forEach(ch => {
      if (!ch || !ch.data) return;
      const at = ch.data.updatedAt || 0;
      if (ch.table === 'checks') {
        const cur = state.checks[ch.key];
        if (!cur || at > (cur.updatedAt || 0)) { state.checks[ch.key] = ch.data; n++; }
      } else if (ch.table === 'staff' || ch.table === 'tasks') {
        const arr = state[ch.table];
        const i = arr.findIndex(x => x.id === ch.key);
        if (i < 0) { arr.push(ch.data); n++; }
        else if (at > (arr[i].updatedAt || 0)) { arr[i] = ch.data; n++; }
      }
    });
    return n;
  },

  async post(path, body) {
    const res = await fetch(SYNC_URL + path, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const d = await res.json().catch(() => null);
    if (!d || d.ok !== true) {
      const error = new Error((d && d.error) || ('HTTP ' + res.status));
      error.status = res.status;
      error.code = d && d.code;
      error.remoteStatus = d && d.status;
      error.idempotent = !!(d && d.idempotent);
      error.dataGeneration = d && d.dataGeneration;
      throw error;
    }
    return d;
  },

  async run(duringStudentConnect) {
    const auth = this.auth();
    if (!auth || this.busy || (studentConnectBusy && !duringStudentConnect)) return;
    this.busy = true; paintStatus();
    try {
      const t0 = now();
      const pending = this.collect(Number(state.settings.pushAt) || 0);
      let more = true, pullPages = 0, localCursorSaved = false, applied = 0;
      while (pending.length || more) {
        const batch = pending.splice(0, 400);
        const d = await this.post('/sync', {
          app: SYNC_APP, auth: auth,
          dataGeneration: Number(state.settings.dataGeneration) || 0,
          since: Number(state.settings.pullAt) || 0,
          changes: batch
        });
        if (Number.isSafeInteger(Number(d.dataGeneration))) state.settings.dataGeneration = Number(d.dataGeneration);
        applied += this.apply(d.changes);
        state.settings.pullAt = d.now;
        more = !!d.more;
        if (!pending.length && !localCursorSaved) {
          // 로컬 변경을 모두 보낸 뒤에만 전송 커서를 전진시킨다. 24,000건을 넘어도 누락하지 않는다.
          state.settings.pushAt = t0;
          save();
          localCursorSaved = true;
        }
        if (more && ++pullPages >= 60 && !pending.length) {
          save();
          throw new Error('받을 데이터가 많습니다. 동기화를 다시 눌러 이어서 받아 주세요');
        }
      }
      if (!localCursorSaved) state.settings.pushAt = t0;
      if (ensureRecentDailyCarryTasks()) applied++;
      // 마지막 pullAt과 마지막 페이지의 원격 변경까지 오프라인 재시작에 남긴다.
      save();
      this.last = now();
      this.dirty = this.collect(Number(state.settings.pushAt) || 0).length > 0;
      this.err = '';
      if (applied) renderAfterSync();
      if (this.dirty) queueSync();
    } catch (e) {
      console.warn('sync', e);
      if (e && e.code === 'DATA_GENERATION_MISMATCH' && Number.isSafeInteger(Number(e.dataGeneration))) {
        state.staff = [];
        state.tasks = [];
        state.checks = {};
        state.settings.pullAt = 0;
        state.settings.pushAt = 0;
        state.settings.dataGeneration = Number(e.dataGeneration);
        save();
        this.dirty = false;
        this.err = '';
        if (typeof location !== 'undefined' && typeof location.reload === 'function') location.reload();
        return;
      }
      if (auth.mode === 'admin_device' && e.status === 401) {
        state.settings.adminToken = '';
        clearConsultLinkContacts();
        save(); session.lock(); render();
        toast('로그인 기간이 끝났습니다 · 다시 로그인해 주세요');
      }
      this.dirty = true; this.err = String(e && e.message || e);
      if (this.loud) toast('동기화 실패 — ' + this.err);
    } finally {
      this.busy = false; this.loud = false; paintStatus();
    }
  },

  /** 개인 링크용 토큰 발급 (원장만). 링크마다 다른 토큰이라 하나가 새어도 그 학생 것만 열린다 */
  async issueToken(staffId) {
    const auth = this.auth();
    if (!auth) throw new Error('원장 화면에서만 발급할 수 있습니다');
    const d = await this.post('/token', { app: SYNC_APP, auth: auth, staffId: staffId });
    return d.token;
  },

  async issueAdminHandoff() {
    const auth = this.auth();
    if (!auth) throw new Error('동기화 연결이 필요합니다');
    return await this.post('/admin-handoff', { app: SYNC_APP, auth: auth });
  },

  async exchangeAdmin(code) {
    return await this.post('/exchange', { app: SYNC_APP, staffId: '__admin__', code: code });
  },

  async exchangeBootstrap(staffId, code) {
    return await this.post('/exchange', { app: SYNC_APP, staffId: staffId, code: code });
  },

  async loginAdmin(loginId, password) {
    return await this.post('/admin-login', { app: SYNC_APP, loginId: loginId, password: password });
  },

  async saveAdminAccount(loginId, password, auth) {
    return await this.post('/admin-account', {
      app: SYNC_APP, auth: auth || this.auth(), action: 'set', loginId: loginId, password: password
    });
  }
};

function queueSync() {
  if (!sync.enabled()) return;
  sync.dirty = true;
  clearTimeout(sync.timer);
  sync.timer = setTimeout(() => sync.run(), 1200);
}

/** 원장·다른 학생 캐시를 새 학생 권한으로 올리지 않도록 운영 데이터만 비운다. */

function studentCacheScopedTo(staffId) {

/** 링크에 담겨 온 것들을 흡수한다.
 *  s=  동기화 설정 (학생 기기 세팅 대신)
 *  add= 지시서 묶음 (원장이 링크 한 번으로 등록) */
function absorbLinkParams() {
  const q = new URLSearchParams(location.search);
  let touched = false;

  const tk = q.get('t');
  if (tk) {
    const alreadyCurrent = state.settings.myToken === tk && !!staffById(session.staffId) && studentCacheScopedTo(session.staffId);
    if (alreadyCurrent) {
      state.settings.myToken = tk;
      save();

      const unsent = sync.collect(Number(state.settings.pushAt) || 0);
      if (unsent.length) {
        studentConnectError = '이 브라우저에 아직 동기화되지 않은 기록이 있습니다. 기존 화면에서 동기화한 뒤 학생 링크를 다시 열어 주세요.';
      } else {
        resetStudentLinkCache(tk);
      }
    }
    pendingStudentWelcome = true;
    q.delete('t'); touched = true;
  }

  const s = q.get('s');
  if (s) {
    try {
      const cfg = JSON.parse(unb64(s));
      if (cfg.k) state.settings.syncSecret = cfg.k;
      // 예전 복구 링크의 비밀번호(cfg.p)는 현재 로그인 정보를 덮어쓰지 않는다.
      save();
    } catch (e) { console.warn('link config', e); }
    q.delete('s'); touched = true;
  }

  const adminMatch = location.hash.match(/[#&]admin=([^&]+)/);
  if (adminMatch) {
    try { pendingAdminCode = decodeURIComponent(adminMatch[1]); }
    catch (e) { pendingAdminCode = ''; }
  }

  const studentMatch = location.hash.match(/[#&]c=([^&]+)/);
  if (studentMatch) {
    try {
      pendingStudentCode = decodeURIComponent(studentMatch[1]);
      studentConnectError = '';
      sessionStorage.removeItem(STUDENT_LINK_BLOCK_KEY);
    }
    catch (e) { pendingStudentCode = ''; clearStudentCodeHash(); }
  }

  // 지시서는 주소창에 남지 않도록 해시(#add=)를 우선 쓴다
  let raw = null;
  const m = location.hash.match(/[#&]add=([^&]+)/);
  if (m) raw = m[1];
  else if (q.get('add')) { raw = q.get('add'); q.delete('add'); touched = true; }

  if (raw) {
    try {
      const p = JSON.parse(unb64(raw));
      const list = Array.isArray(p) ? p : (p.assignments || []);
      if (list.length) pendingAdd = list;
    } catch (e) { console.warn('link add', e); }
  }

  if (touched || m || adminMatch) {
    history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '') +
      ((m || adminMatch) ? '' : location.hash));
  }
}

async function waitForSyncIdle(timeoutMs) {
  const until = now() + (Number(timeoutMs) || 20000);
  while (sync.busy && now() < until) await new Promise(resolve => setTimeout(resolve, 100));
  return !sync.busy;
}

async function connectStudentLink() {
  const code = pendingStudentCode;
  const staffId = session.staffId;
  if (!staffId || !code || studentConnectBusy) return;
  studentConnectBusy = true;
  studentConnectError = '';
  render();
  try {
    if (!(await waitForSyncIdle())) {
      studentConnectError = '기존 동기화가 아직 끝나지 않았습니다. 잠시 후 같은 링크로 다시 시도해 주세요.';
      return;
    }
    const unsent = sync.collect(Number(state.settings.pushAt) || 0);
    if (unsent.length) {
      studentConnectError = '이 브라우저에 아직 동기화되지 않은 기록이 있습니다. 기존 원장 또는 학생 화면으로 돌아가 동기화한 뒤 같은 링크를 다시 열어 주세요.';
      return;
    }
    const d = await sync.exchangeBootstrap(staffId, code);
    pendingStudentCode = '';
    const stored = resetStudentLinkCache(d.token);
    clearStudentCodeHash();
    sessionStorage.removeItem(STUDENT_LINK_BLOCK_KEY);
    if (!stored) return;
    sync.loud = true;
    await sync.run(true);
    if (!sync.err) startStudentSetup(staffId);
    go('guide');
    toast(sync.err ? '학생 연결 완료 · 데이터 동기화를 다시 시도해 주세요' : '학생 화면에 연결되었습니다');
  } catch (e) {
    const terminal = [400, 401, 403, 404, 409, 410, 422].includes(Number(e && e.status));
    if (terminal) {
      studentConnectError = '이 연결 링크는 사용할 수 없습니다. 원장님께 새 개인 링크를 요청해 주세요.';
      sessionStorage.setItem(STUDENT_LINK_BLOCK_KEY, studentConnectError);
    } else {
      studentConnectError = '인터넷 연결을 확인한 뒤 다시 시도해 주세요.';
    }
    toast(terminal
      ? '학생 연결 링크를 사용할 수 없습니다 — ' + e.message
      : '인터넷 연결을 확인한 뒤 다시 시도해 주세요');
  } finally {
    studentConnectBusy = false;
    render();
  }
}

async function connectAdminDevice() {
  const code = pendingAdminCode;
  if (!code || adminConnectBusy) return;
  adminConnectBusy = true;
  toast('새 컴퓨터 연결 중…');
  try {
    const d = await sync.exchangeAdmin(code);
    pendingAdminCode = '';
    state.settings.adminToken = d.token;
    state.settings.syncSecret = '';
    state.settings.pullAt = 0;
    state.settings.pushAt = 0; // 기존 컴퓨터의 미전송 데이터도 서버 LWW로 안전하게 다시 비교한다
    save(); session.unlock(); render();
    sync.loud = true;
    await sync.run();
    toast('새 컴퓨터 연결 완료');
  } catch (e) {
    const terminal = [400, 401, 403, 404, 409, 410, 422].includes(Number(e && e.status));
    if (terminal) pendingAdminCode = '';
    toast(terminal
      ? '연결 링크를 사용할 수 없습니다 — ' + e.message
      : '인터넷 연결을 확인한 뒤 아래 버튼으로 다시 시도해 주세요');
  } finally {
    adminConnectBusy = false;
    if (!session.isAdmin) render();
  }
}

const $ = sel => document.querySelector(sel);
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function safeHttpsUrl(value) {
  const raw = String(value || '').trim();
  if (!raw || raw.length > 2048) return '';
  try {
    const url = new URL(raw);
    if (url.protocol !== 'https:' || !url.hostname || url.username || url.password) return '';
    return url.href;
  } catch (e) { return ''; }
}
function toast(msg) {
  const t = $('#toast');
  if (storageError) msg = '기기 저장 실패 · 화면을 닫지 말고 백업하거나 동기화해 주세요';
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('on'), 2400);
}
function repeatLabel(t) {
  if (t.repeat === 'once')    return (t.start ? label(t.start) + ' ' : '') + '1회';
  if (t.repeat === 'daily')   return '매일';
  if (t.repeat === 'weekday') return '평일(월~금)';
  if (t.repeat === 'days')    return '매주 ' + (t.days || []).map(d => DOW[d]).join('·');
  return '';
}

const studentSetupKey = sid => '__studentsetup__' + sid;

function studentSetupOf(sid) {
  const row = state.checks[studentSetupKey(sid) + '|all'];
  const setup = (row && row.setup) || {};
  return {
    version: Number(setup.version) || 1,
    startedAt: Number(setup.startedAt) || 0,
    guideConfirmedAt: Number(setup.guideConfirmedAt) || 0,
    completedAt: Number(setup.completedAt) || 0
  };
}

function studentGoalConfigured(sid) {
  return Object.prototype.hasOwnProperty.call(state.checks, '__stgoal__' + sid + '|all');
}

function studentSetupStatus(sid) {
  const setup = studentSetupOf(sid);
  const timetable = ingAvail(sid).configured;
  const goal = studentGoalConfigured(sid);
  const guide = !!setup.guideConfirmedAt;
  const done = [timetable, goal, guide].filter(Boolean).length;
  return {
    setup: setup, started: !!setup.startedAt, timetable: timetable, goal: goal, guide: guide,
    done: done, total: 3, pct: Math.round(done / 3 * 100),
    step: !timetable ? 1 : !goal ? 2 : 3,
    complete: !!setup.completedAt && timetable && goal && guide
  };
}

function saveStudentSetup(sid, patch) {
  const current = studentSetupOf(sid);
  const setup = Object.assign({}, current, patch, { version: 1 });
  return setCheck(studentSetupKey(sid), 'all', { setup: setup, done: !!setup.completedAt });
}

function startStudentSetup(sid) {
  if (!sid) return null;
  const setup = studentSetupOf(sid);
  if (setup.startedAt) return setup;
  return saveStudentSetup(sid, { startedAt: now(), guideConfirmedAt: 0, completedAt: 0 });
}

    const number = index + 1;
    const done = number < status.step || status.complete;
    const current = !status.complete && number === status.step;
    return '<div class="student-setup-nav-item ' + (done ? 'done' : current ? 'current' : '') + '"' +
      (current ? ' aria-current="step"' : '') + '><b>' + (done ? '✓' : number) + '</b>' + label + '</div>';
  }).join('') + '</div>';
}

/* ── 오늘 ── */
function viewToday() {
  const me = currentStaff();
  if (!me) return emptyStaffCard();

  const rel = relLabel(cursor);
  const pastDate = cursor < today();
  const list = pastDate ? historicalPlannerTasks(me.id, cursor) : checklistTasksFor(me.id, cursor);
  const offers = studyOffersFor(me.id, cursor);
  const p = pastDate
    ? { total: list.length, done: list.filter(task => isDone(task.id, cursor)).length }
    : progress(me.id, cursor);
  const lectureChecklist = ingChecklistItems(me.id, cursor);
  const checklistTotal = p.total + lectureChecklist.length;
  const checklistDone = p.done + lectureChecklist.filter(item => item.done).length;
  const checklistPct = checklistTotal ? Math.round(checklistDone / checklistTotal * 100) : 0;
  const editable = session.isStaffLink || session.isAdmin;
  const carry = (cursor === today()) ? carryOver(me.id, cursor) : [];
  const priorCloseDates = session.isStaffLink && cursor === today() ? dailyUnclosedDates(me.id, cursor) : [];
  const priorWeekMon = session.isStaffLink && cursor === today() ? previousUnclosedWeek(me.id, cursor) : '';
  const priorMonthYm = session.isStaffLink && cursor === today() ? previousUnclosedMonth(me.id, cursor) : '';

  let h = '';
  if (!session.isStaffLink) h += staffSwitcher(me.id);

  h += '<div class="datenav">' +
    '<button class="navbtn" data-act="day" data-n="-1">‹</button>' +
    '<div class="d">' + label(cursor) + (rel ? '<em>' + rel + '</em>' : '') + '</div>' +
    '<button class="navbtn" data-act="day" data-n="1">›</button></div>';

  if (priorCloseDates.length) {
    h += '<div class="card alert"><div class="between"><div><div class="card-title">⚠ 마무리하지 않은 하루가 있습니다</div>' +
      '<div class="card-sub">전날 기록을 먼저 마감해야 오늘 학습을 시작할 수 있습니다.</div></div>' +
      '<span class="pill bad">' + priorCloseDates.length + '일</span></div>' +
      '<button class="btn btn-primary btn-block mt14" data-act="daypick" data-date="' + priorCloseDates[0] + '">' +
        label(priorCloseDates[0]) + ' 마무리하기</button></div>' +
      '<div class="card"><div class="empty"><b>🔒</b><strong>오늘 학습은 잠시 잠겨 있습니다.</strong><br>' +
        '이전 날짜의 미완료 공부와 일정 준비율을 확인하고 보고 발송까지 마쳐 주세요.</div></div>';
    return h;
  }

  if (priorWeekMon) {
    h += '<div class="card alert"><div class="between"><div><div class="card-title">⚠ 지난주 마무리가 필요합니다</div>' +
      '<div class="card-sub">주간 회고와 보고 발송까지 완료해야 오늘 학습을 시작할 수 있습니다.</div></div>' +
      '<span class="pill bad">지난주 미마감</span></div>' +
      '<button class="btn btn-navy btn-block mt14" data-act="weekcloseopen" data-mon="' + priorWeekMon + '">' +
        shortDate(priorWeekMon) + ' 주간 마무리하기</button></div>' +
      '<div class="card"><div class="empty"><b>🔒</b><strong>오늘 학습은 잠시 잠겨 있습니다.</strong><br>' +
        '지난주의 학습 결과를 확인하고 주간 보고 발송을 마쳐 주세요.</div></div>';
    return h;
  }

  if (priorMonthYm) {
    h += '<div class="card alert"><div class="between"><div><div class="card-title">⚠ 지난달 마무리가 필요합니다</div>' +
      '<div class="card-sub">월간 회고와 보고 발송까지 완료해야 오늘 학습을 시작할 수 있습니다.</div></div>' +
      '<span class="pill bad">지난달 미마감</span></div>' +
      '<button class="btn btn-navy btn-block mt14" data-act="monthcloseopen" data-ym="' + priorMonthYm + '">' +
        ymLabel(priorMonthYm) + ' 월간 마무리하기</button></div>' +
      '<div class="card"><div class="empty"><b>🔒</b><strong>오늘 학습은 잠시 잠겨 있습니다.</strong><br>' +
        '지난달 학습 결과를 확인하고 월간 보고 발송을 마쳐 주세요.</div></div>';
    return h;
  }

  if (cursor === today()) h += studentSetupReminder(me);

  const counts = { todo: 0, doing: 0, done: 0, blocked: 0 };
  list.forEach(t => counts[statusOf(t, cursor)]++);
  const running = cursor === today() ? stRunning(me.id, cursor) : null;
  lectureChecklist.forEach(item => {
    if (item.done) counts.done++;
    else if (running && running.taskId === ingTimerTaskId(item.cid, item.seq)) counts.doing++;
    else counts.todo++;
  });

  h += '<div class="card"><div class="prog">' +
    '<div class="ring" style="--p:' + checklistPct + '"><b>' + checklistPct + '%</b></div>' +
    '<div style="flex:1">' +
      '<div class="card-title">' + esc(me.name) + ' 학생</div>' +
      '<div class="card-sub mb8">' +
        (checklistTotal
          ? '완료 ' + counts.done + ' · 진행중 ' + counts.doing + ' · 미착수 ' + counts.todo +
            (counts.blocked ? ' · <b style="color:var(--coral)">막힘 ' + counts.blocked + '</b>' : '') +
            (checklistDone === checklistTotal ? ' · 오늘 완료 🎉' : '')
          : (offers.length ? '배부된 공부를 체크리스트에 담아 시작해 보세요' : '체크리스트가 비어 있습니다')) +
      '</div>' +
      '<div class="bar"><i style="width:' + checklistPct + '%"></i></div>' +
    '</div></div></div>';

  h += studyTotalHeroCard(me, cursor);

  if (cursor === today()) {
    h += studyOffersCard(me, cursor, offers);
    h += ingTodayCard(me, editable);
    h += studyReviewOffersCard(me);
    if (editable) {
      h += '<div class="card" style="padding:12px">' +
        '<div class="quick-add-grid">' +
          '<select class="in" id="qSubject" aria-label="빠른 추가 과목">' + studySubjectOptions('', '과목 선택') + '</select>' +
          '<input class="in" id="qAdd" placeholder="빠른 추가 — 예) 수학 오답 10문제">' +
          '<button class="btn btn-primary" data-act="qadd">추가</button>' +
        '</div></div>';
    }
    h += studyPlannerCard(me, cursor, list, carry, editable);
  } else {
    h += studyPlannerCard(me, cursor, list, [], false);
  }

  if (editable && cursor === today()) {
    h += '<button class="btn btn-ghost btn-block mb8" data-act="newtask">＋ 업무 추가</button>';
  }
  if (cursor >= DAILY_CLOSE_START && cursor <= today()) h += dailyClosureCard(me, cursor);
  return h;
}

function studyTotalHeroCard(me, date) {
  const total = stTotal(me.id, date);
  const goal = stGoalMin(me.id) * 60;
  const pct = goal ? Math.min(100, Math.round(total / goal * 100)) : 0;
  const running = date === today() ? stRunning(me.id, date) : null;
  const runningLabel = running ? ((running.subj === '탐구' || running.subj === 'explore') ? '사회' : running.subj) : '';
  return '<div class="card study-total-hero" id="studyTotalHero">' +
    '<div class="study-total-label">TOTAL PURE STUDY TIME</div>' +
    '<div class="study-time-total" data-st-total data-st-date="' + date + '">' + fmtHMS(total) + '</div>' +
    (running
      ? '<div class="small" style="color:var(--blue);font-weight:800">▶ ' + esc(runningLabel) + ' 공부 중</div>'
      : '<div class="small muted">' + (date === today() ? '오늘 기록한 전체 순공시간' : label(date) + ' 전체 순공시간') + '</div>') +
    (goal ? '<div class="bar mt14"><i style="width:' + pct + '%"></i></div><div class="small muted" style="margin-top:6px">목표 ' + fmtDur(goal) + ' · ' + pct + '%</div>' : '') +
    '</div>';
}

function studyOffersCard(me, date, offers) {
  const folded = todayFoldState.studyOffers;
  const rows = offers.map(task => {
    const check = getCheck(task.id, date);
    const claimed = !!(check && check.claimed);
    const done = !!(check && check.done);
    const subject = taskStudySubject(task);
    const status = done ? '<span class="pill">완료</span>'
      : claimed ? '<span class="pill warn">체크리스트에 담음</span>'
      : '<span class="pill bad">가져오기 전</span>';
    const action = session.isStaffLink
      ? '<button class="btn btn-sm ' + (claimed ? 'btn-ghost' : 'btn-primary') + '" data-act="studyclaim" data-id="' + task.id + '" data-date="' + date + '"' +
        (claimed ? ' disabled' : '') + '>' + (claimed ? '✓ 내 체크리스트에 담음' : '내 체크리스트로 가져오기') + '</button>'
      : status;
    return '<div class="study-offer ' + subject.className + (done ? ' done' : '') + '">' +
      '<div class="between"><div style="min-width:0">' +
        '<div class="row wraprow" style="gap:6px">' + taskStudySubjectTag(task) +
          (task.estimatedMin ? '<span class="tag time">예상 ' + Number(task.estimatedMin) + '분</span>' : '') +
          (task.time ? '<span class="tag time">' + esc(task.time) + '</span>' : '') + '</div>' +
        '<div class="task-t" style="margin-top:6px">' + esc(task.title) + '</div>' +
        (task.detail ? '<div class="task-d">' + esc(task.detail) + '</div>' : '') +
      '</div>' + action + '</div></div>';
  }).join('');

  return '<div class="card today-fold-card' + (folded ? ' is-folded' : '') + '" id="studyOffers">' +
    '<button type="button" class="today-fold-head" data-act="todayfold" data-section="studyOffers" aria-expanded="' + (!folded) + '" aria-controls="studyOffersBody">' +
      '<span class="today-fold-copy"><span class="card-title" style="display:block">📚 오늘 배부된 공부</span>' +
        '<span class="card-sub">' + (session.isStaffLink
          ? '원장이 보낸 목록에서 공부를 내 체크리스트로 가져오세요.'
          : '학생에게 배부한 공부와 체크리스트로 가져간 상태입니다.') + '</span></span>' +
      '<span class="today-fold-meta"><span class="pill">' + offers.length + '개</span>' +
        '<span class="today-fold-chevron" aria-hidden="true">' + (folded ? '⌄' : '⌃') + '</span></span></button>' +
    '<div class="today-fold-body" id="studyOffersBody"' + (folded ? ' hidden' : '') + '>' +
      (rows || '<div class="small muted" style="padding:10px 0 2px">오늘 새로 배부된 공부가 없습니다.</div>') + '</div>' +
    '</div>';
}

function studyPlannerCard(me, date, list, carry, editable) {
  const dateObj = new Date(date + 'T00:00:00');
  const dayName = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'][dateObj.getDay()];
  const studyTotal = stTotal(me.id, date);
  const lectures = ingChecklistItems(me.id, date);
  const todayCount = list.length + lectures.length;
  const checklist = '<div class="planner-list-head"><span>과목</span><span>세부 공부내용</span><span>완료</span></div>' +
    (carry.length
    ? '<div class="planner-divider">지난 미완료 · 오늘 이어서 공부해요</div>' +
      carry.map(x => plannerTaskRow(x.t, x.date, editable, true)).join('')
    : '') +
    (todayCount
      ? (carry.length ? '<div class="planner-divider" style="color:#736C5A">오늘 체크리스트</div>' : '') +
        list.map(task => plannerTaskRow(task, date, editable, false)).join('') +
        lectures.map(item => plannerLectureRow(me.id, item, editable)).join('')
      : (!carry.length ? '<div class="small muted" style="padding:16px 8px">배부 공부를 가져오거나 아래에서 직접 추가해 주세요.</div>' : ''));

  return '<div class="card study-paper" id="studyPlanner">' +
    '<div class="study-paper-head">' +
      '<div class="study-paper-date">' + date.replace(/-/g, '.') + '<em>' + dayName + '</em></div>' +
      '<div class="study-paper-title">TODAY STUDY PLANNER</div>' +
      '<div class="study-paper-total"><span>PURE STUDY TIME</span><b data-st-total data-st-date="' + date + '">' + fmtHMS(studyTotal) + '</b></div>' +
    '</div>' +
    '<div class="study-planner">' +
      '<section class="study-planner-pane" aria-label="오늘 공부 체크리스트">' +
        '<div class="study-paper-col-title">TODAY CHECK LIST <span>' + (todayCount + carry.length) + ' TASKS</span></div>' + checklist + '</section>' +
      '<section class="study-planner-pane" aria-label="과목별 순공시간">' +
        '<div class="study-paper-col-title">TIME TABLE <span>실제 · 10분 단위</span></div>' + studyTimePanel(me, editable, true, date) + '</section>' +
    '</div></div>';
}

function plannerTaskRow(t, date, editable, isCarry) {
  const c = getCheck(t.id, date);
  const status = statusOf(t, date);
  const mark = plannerTaskMark(t, date, c, isCarry);
  const subject = taskStudySubject(t);
  const learning = LEARNING_SOURCES[t.source] || null;
  const learningDue = learning ? learningDueDate(t) : '';
  const open = openPanels.has(t.id + '|' + date);
  const resourceUrl = safeHttpsUrl(t.resourceUrl);
  const hasDetail = (t.steps || []).length || t.guide || t.target || resourceUrl || t.evidenceMode === 'photo';
  const running = stRunning(t.staffId, today());
  const timingThis = !!(running && running.taskId === t.id);

  let h = '<div class="planner-task-row ' + subject.className + ' ' + status + ' ' + mark.rowClass + '" data-task="' + t.id + '">' +
    '<div class="planner-task-subject">' + subject.label + '</div>' +
    '<div class="planner-task-detail">' +
      '<div class="planner-task-title">' + esc(t.title) + '</div>' +
      (t.detail ? '<div class="planner-task-desc">' + esc(t.detail) + '</div>' : '') +
      '<div class="planner-task-actions">' +
        (isCarry ? '<span class="tag carry">' + shortDate(date) + ' 이월</span>'
          : t.dailyCarrySourceDate ? '<span class="tag carry">' + shortDate(t.dailyCarrySourceDate) + ' 이월</span>' : '') +
        (t.time ? '<span class="tag time">' + esc(t.time) + '</span>' : '') +
        (t.estimatedMin ? '<span class="tag time">예상 ' + Number(t.estimatedMin) + '분</span>' : '') +
        (learning && learningDue && learningDue !== date ? '<span class="tag">마감 ' + shortDate(learningDue) + '</span>' : '') +
        (t.priority === 'high' ? '<span class="tag high">중요</span>' : '') +
        (t.evidenceMode === 'photo' ? '<span class="tag doing">📷 인증 필요</span>' : '') +
        (editable && status !== 'done'
          ? '<button class="btn ' + (timingThis ? 'btn-warn' : 'btn-ghost') + '" data-act="sttask" data-id="' + t.id + '" data-subj="' + subject.label + '">' +
            (timingThis ? '⏸ 공부 정지' : '▶ 공부 시작') + '</button>'
          : '') +
        (hasDetail ? '<button class="btn btn-ghost" data-act="panel" data-id="' + t.id + '" data-date="' + date + '">' +
          (open ? '▾ 접기' : '▸ 상세') + '</button>' : '') +
      '</div>' +
    '</div>' +
    '<div class="planner-check-wrap"><button class="planner-check ' + mark.className + '" aria-label="' + mark.label + '" title="' + mark.label + '" ' +
      (editable ? 'data-act="toggle" data-id="' + t.id + '" data-date="' + date + '"' : 'disabled') + '>' + mark.symbol + '</button></div>';

  if (open) {
    h += '<div class="planner-task-extra">' + taskPanel(t, date, c, editable) +
      (editable
        ? '<input class="note" data-act="note" data-id="' + t.id + '" data-date="' + date + '" value="' + esc((c && c.note) || '') + '" placeholder="메모 · 막힌 이유나 특이사항">'
        : ((c && c.note) ? '<div class="note">' + esc(c.note) + '</div>' : '')) +
      '</div>';
  }
  return h + '</div>';
}

function plannerTaskMark(task, date, check, isCarry) {
  if (check && check.done) {
    return { symbol: '✓', label: '완료', className: 'is-done', rowClass: 'planner-done' };
  }
  const resolution = (dailyCloseOf(task.staffId, date).resolutions || {})['task:' + task.id] || {};
  if (resolution.type === 'carry' || isCarry || task.dailyCarrySourceDate) {
    return { symbol: '→', label: '다음 날짜로 이월', className: 'is-carry', rowClass: 'planner-carried' };
  }
  if (resolution.type === 'closed' || (check && check.dropped)) {
    return { symbol: '×', label: '오늘 학습에서 종료', className: 'is-negative', rowClass: 'planner-closed' };
  }
  if (resolution.type === 'blocked' || (check && check.blocked)) {
    return { symbol: '×', label: '막힘', className: 'is-negative', rowClass: 'planner-blocked' };
  }
  return { symbol: '✓', label: '미완료', className: '', rowClass: '' };
}

function plannerLectureRow(sid, item, editable) {
  const found = ingLec(sid, item.cid, item.seq);
  const subject = found ? ingCourseSubject(found.course) : STUDY_SUBJECTS.other;
  const taskId = ingTimerTaskId(item.cid, item.seq);
  const running = stRunning(sid, today());
  const timingThis = !!(running && running.taskId === taskId);
  const title = found ? found.course.name + ' ' + item.seq + '강' : '인강 ' + item.seq + '강';

  return '<div class="planner-task-row ' + subject.className + ' ' + (item.done ? 'done' : 'todo') + '" data-ing-task="' + esc(taskId) + '">' +
    '<div class="planner-task-subject">' + subject.label + '</div>' +
    '<div class="planner-task-detail">' +
      '<div class="planner-task-title">' + esc(title) + '</div>' +
      (found && found.lec.title ? '<div class="planner-task-desc">' + esc(found.lec.title) + '</div>' : '') +
      '<div class="planner-task-actions"><span class="tag doing">🎬 인강</span>' +
        (item.s && item.e ? '<span class="tag time">' + esc(item.s) + '~' + esc(item.e) + '</span>' : '') +
        (found && found.lec.min ? '<span class="tag time">예상 ' + found.lec.min + '분</span>' : '') +
        (found && found.course.platform ? '<span class="tag">' + esc(found.course.platform) + '</span>' : '') +
        (editable && !item.done
          ? '<button class="btn ' + (timingThis ? 'btn-warn' : 'btn-ghost') + '" data-act="ingsttask" data-sid="' + esc(sid) +
            '" data-date="' + item.date + '" data-cid="' + esc(item.cid) + '" data-seq="' + item.seq + '">' +
            (timingThis ? '⏸ 공부 정지' : '▶ 공부 시작') + '</button>'
          : '') +
      '</div></div>' +
    '<div class="planner-check-wrap"><button class="planner-check" ' +
      (editable ? 'data-act="ingcheck" data-sid="' + esc(sid) + '" data-date="' + item.date + '" data-cid="' + esc(item.cid) + '" data-seq="' + item.seq + '"' : 'disabled') +
      '>✓</button></div></div>';
}

function taskRow(t, date, editable, isCarry) {
  const c = getCheck(t.id, date);
  const st = statusOf(t, date);
  const prog = taskProgress(t, c);
  const learning = LEARNING_SOURCES[t.source] || null;
  const resourceUrl = safeHttpsUrl(t.resourceUrl);
  const learningDue = learning ? learningDueDate(t) : '';
  const linkedExam = learning ? learningAcademicEvent(t) : null;
  const hasDetail = (t.steps || []).length || t.guide || t.target || resourceUrl || t.evidenceMode === 'photo';
  const open = openPanels.has(t.id + '|' + date);
  const learningLate = learning && learningDue && learningDue < today() && st !== 'done';
  const noteHint = learning ? learning.noteHint : '메모 · 막힌 이유나 특이사항을 남기세요';

  let h = '<div class="task ' + st + (st === 'blocked' ? ' isblocked' : '') + '" data-task="' + t.id + '">' +
    '<button class="box" ' + (editable ? 'data-act="toggle" data-id="' + t.id + '" data-date="' + date + '"' : 'disabled') + '>✓</button>' +
    '<div class="task-body">' +
      '<div class="task-t">' + esc(t.title) + '</div>' +
      (t.detail ? '<div class="task-d">' + esc(t.detail) + '</div>' : '') +
      '<div class="meta">' +
        taskStudySubjectTag(t) +
        (isCarry ? '<span class="tag carry">⚠ ' + shortDate(date) + ' 미완료</span>'
          : t.dailyCarrySourceDate ? '<span class="tag carry">' + shortDate(t.dailyCarrySourceDate) + ' 이월</span>' : '') +
        (learning ? '<span class="tag time">' + learning.icon + ' ' + esc(learning.label) + '</span>' : '') +
        ((t.learningKind || t.metaKind) ? '<span class="tag">' + esc(t.learningKind || t.metaKind) + '</span>' : '') +
        (learning && date ? '<span class="tag time">학습 ' + shortDate(date) + '</span>' : '') +
        (learning && learningDue
          ? '<span class="tag ' + (learningLate ? 'high' : '') + '">' + (learningLate ? '마감 지남 · ' : '') + shortDate(learningDue) + ' 마감</span>'
          : '') +
        (learning && t.estimatedMin ? '<span class="tag time">예상 ' + Number(t.estimatedMin) + '분</span>' : '') +
        (linkedExam ? '<span class="tag high">시험 · ' + esc(linkedExam.title) + '</span>' : '') +
        (t.time ? '<span class="tag time">' + esc(t.time) + '</span>' : '') +
        (t.priority === 'high' ? '<span class="tag high">중요</span>' : '') +
        (t.evidenceMode === 'photo' ? '<span class="tag doing">📷 인증 필요</span>' : '') +
        (st === 'blocked' ? '<span class="tag blk">막힘</span>' : '') +
        (st === 'doing' ? '<span class="tag doing">진행중 ' + prog.done + '/' + prog.total + prog.unit + '</span>' : '') +
        (!isCarry ? '<span class="tag">' + esc(repeatLabel(t)) + '</span>' : '') +
        (st === 'done' && c && c.at ? '<span class="tag ok">✓ ' + new Date(c.at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) + ' 완료</span>' : '') +
        originTags(t) +
      '</div>';

  if (hasDetail && st !== 'done') {
    h += '<div class="bar mini ' + (st === 'doing' ? 'doing' : '') + '" style="margin-top:8px"><i style="width:' + prog.pct + '%"></i></div>';
  }
  if (hasDetail) {
    h += '<button class="opener" data-act="panel" data-id="' + t.id + '" data-date="' + date + '">' +
      (open ? '▾ 접기' : '▸ ' + (resourceUrl ? '자료 · ' : '') + '하는 방법 · 단계 열기' + ((t.steps || []).length ? ' (' + prog.done + '/' + prog.total + ')' : '')) + '</button>';
  }
  if (open) h += taskPanel(t, date, c, editable);

  h += (editable
      ? '<input class="note" data-act="note" data-id="' + t.id + '" data-date="' + date + '" value="' + esc((c && c.note) || '') + '" placeholder="' + noteHint + '">'
      : ((c && c.note) ? '<div class="note">' + esc(c.note) + '</div>' : ''));

  return h + '</div></div>';
}

function taskPanel(t, date, c, editable) {
  let h = '<div class="panel">';
  const resourceUrl = safeHttpsUrl(t.resourceUrl);

  h += submissionTaskPanel(t, date);

  if (resourceUrl) {
    h += '<a class="btn btn-primary mb8" href="' + esc(resourceUrl) + '" target="_blank" rel="noopener noreferrer">' +
      (t.source === 'exam_material' ? '📎 시험대비자료 열기' : '📎 학습 자료 열기') + ' ↗</a>';
  }

  if (t.guide) h += '<div class="guide"><b>📘 이렇게 하세요</b>' + esc(t.guide) + '</div>';

  if ((t.steps || []).length) {
    h += '<div style="margin-top:10px">' + t.steps.map((s, i) => {
      const on = !!(c && c.steps && c.steps[s.id]);
      return '<div class="step ' + (on ? 'on' : '') + '">' +
        '<button class="sbox" ' + (editable ? 'data-act="step" data-id="' + t.id + '" data-date="' + date + '" data-step="' + s.id + '"' : 'disabled') + '>✓</button>' +
        '<span>' + (i + 1) + '. ' + esc(s.label) + '</span></div>';
    }).join('') + '</div>';
  }

  if (t.target) {
    h += '<div class="counter"><span>진행 수량</span>' +
      '<button class="btn btn-sm btn-ghost" ' + (editable ? 'data-act="cnt" data-id="' + t.id + '" data-date="' + date + '" data-n="-1"' : 'disabled') + '>−</button>' +
      '<input class="in" type="number" min="0" ' + (editable ? 'data-act="cntset" data-id="' + t.id + '" data-date="' + date + '"' : 'readonly') + ' value="' + ((c && c.count) || 0) + '">' +

/* ══════════════════════════════════════════════════════
   순공시간 타이머 — 계획(플래너)과 별개로 '실제로 공부한 시간'을 잰다.
   과목 칩을 누르면 시작, 다시 누르면 정지. 시작 시각만 저장하므로
   앱을 닫아도 시간이 계속 흐르고, 기기를 바꿔도 이어진다.
   ══════════════════════════════════════════════════════ */
const ST_DEFAULT = ['국어', '영어', '수학', '사회', '과학', '기타'];
const ST_MAX_RUN = 6 * 3600;   // 한 번에 인정하는 최대 시간 — 정지를 깜빡해도 밤새 쌓이지 않는다
const ST_TIMELINE_START = 5;
const ST_TIMELINE_END = 24;
const ST_MAX_SEGMENTS = 200;

const stKey = sid => '__st__' + sid;
const stOf = (sid, date) => state.checks[stKey(sid) + '|' + date] || null;
const stSubjects = sid => {
  const c = state.checks['__stsubj__' + sid + '|all'];
  const source = (c && Array.isArray(c.list) && c.list.length) ? c.list : ST_DEFAULT;
  const split = [];
  source.forEach(name => {
    if (name === '탐구' || name === 'explore') split.push('사회', '과학');
    else split.push(name);
  });
  return [...new Set(split)];
};
const stGoalMin = sid => {
  const c = state.checks['__stgoal__' + sid + '|all'];
  return Number(c && c.mins) || 0;
};
const stRunning = (sid, date) => {
  const c = stOf(sid, date);
  return (c && c.run && c.run.subj && c.run.since) ? c.run : null;
};
/** 그날 과목별 누적 초 — 진행 중인 타이머의 경과분까지 더해서 돌려준다 */
function stSecs(sid, date) {
  const c = stOf(sid, date);
  const out = Object.assign({}, (c && c.secs) || {});
  const r = stRunning(sid, date);
  if (r) out[r.subj] = (out[r.subj] || 0) + stElapsed(r);
  return out;
}
const stElapsed = r => Math.min(ST_MAX_RUN, Math.max(0, Math.floor((now() - r.since) / 1000)));
const stTotal = (sid, date) => Object.values(stSecs(sid, date)).reduce((a, b) => a + b, 0);

function fmtHMS(s) { return Math.floor(s / 3600) + ':' + pad2(Math.floor(s % 3600 / 60)) + ':' + pad2(s % 60); }
function fmtHM(s) { return Math.floor(s / 3600) + ':' + pad2(Math.floor(s % 3600 / 60)); }
function fmtDur(s) {
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? h + '시간 ' + m + '분' : m + '분';
}

/** 진행 중인 타이머를 정지하고 누적에 반영한다 (내부용) */
function stFreeze(sid, date) {
  const c = stOf(sid, date);
  const secs = Object.assign({}, (c && c.secs) || {});
  const r = stRunning(sid, date);
  if (r) secs[r.subj] = (secs[r.subj] || 0) + stElapsed(r);
  return secs;
}
function stStoredSegments(sid, date) {
  const c = stOf(sid, date);
  return ((c && Array.isArray(c.segments)) ? c.segments : [])
    .filter(segment => segment && Number.isFinite(Number(segment.start)) && Number.isFinite(Number(segment.end)) && Number(segment.end) > Number(segment.start))
    .map(segment => ({
      subj: String(segment.subj || '기타'),
      taskId: segment.taskId ? String(segment.taskId) : '',
      start: Number(segment.start),
      end: Number(segment.end)
    }))
    .slice(-ST_MAX_SEGMENTS);
}
function stFreezeSegments(sid, date) {
  const segments = stStoredSegments(sid, date);
  const r = stRunning(sid, date);
  if (r) {
    const end = Number(r.since) + stElapsed(r) * 1000;
    if (end > Number(r.since)) {
      segments.push({ subj: r.subj, taskId: r.taskId || '', start: Number(r.since), end: end });
    }
  }
  return segments.slice(-ST_MAX_SEGMENTS);
}
function stTimelineSegments(sid, date) {
  const segments = stStoredSegments(sid, date);
  const r = stRunning(sid, date);
  if (r) {
    const end = Number(r.since) + stElapsed(r) * 1000;
    if (end > Number(r.since)) {
      segments.push({ subj: r.subj, taskId: r.taskId || '', start: Number(r.since), end: end, running: true });
    }
  }
  return segments;
}
function stStart(sid, date, subj, taskId) {
  setCheck(stKey(sid), date, {
    secs: stFreeze(sid, date),
    segments: stFreezeSegments(sid, date),
    run: { subj: subj, taskId: taskId || '', since: now() },
    done: true
  });
}
function stStop(sid, date) {
  setCheck(stKey(sid), date, { secs: stFreeze(sid, date), segments: stFreezeSegments(sid, date), run: null, done: true });
}

function stCategorySecs(secs) {
  const out = Object.fromEntries(STUDY_SUBJECT_KEYS.map(key => [key, 0]));
  Object.keys(secs || {}).forEach(name => {
    const key = studySubjectKey(name);
    out[key] += Number(secs[name]) || 0;
  });
  return out;
}

function stTimelineCell(segments, date, hour, minute) {
  const start = parseYmd(date);
  start.setHours(hour, minute, 0, 0);
  const from = start.getTime();
  const to = from + 10 * 60000;
  for (let i = segments.length - 1; i >= 0; i--) {
    const segment = segments[i];
    if (segment.start < to && segment.end > from) return segment;
  }
  return null;
}

function studyTimelineRows(sid, date) {
  const segments = stTimelineSegments(sid, date);
  const secs = stSecs(sid, date);
  const byCategory = stCategorySecs(secs);
  let h = '<div class="study-timeline-row study-timeline-minutes"><span></span>' +
    [0, 10, 20, 30, 40, 50].map(minute => '<span>' + pad2(minute) + '</span>').join('') + '</div>';

  for (let hour = ST_TIMELINE_START; hour < ST_TIMELINE_END; hour++) {
    h += '<div class="study-timeline-row"><span class="study-timeline-hour">' + pad2(hour) + '</span>';
    for (let minute = 0; minute < 60; minute += 10) {
      const segment = stTimelineCell(segments, date, hour, minute);
      const actualSubject = segment ? studySubject(segment.subj) : null;
      const timeLabel = pad2(hour) + ':' + pad2(minute);
      const description = actualSubject ? actualSubject.label + ' 공부' : '기록 없음';
      h += '<span class="study-timeline-cell" title="' + esc(timeLabel + ' ' + description) + '" aria-label="' +
        esc(timeLabel + ' ' + description) + '">' +
        (actualSubject ? '<b class="study-timeline-actual ' + actualSubject.className + (segment.running ? ' running' : '') + '"></b>' : '') +
        '</span>';
    }
    h += '</div>';
  }

  const summary = STUDY_SUBJECT_KEYS.filter(key => byCategory[key] > 0).map(key => {
    const subject = STUDY_SUBJECTS[key];
    return '<span class="tag subject-tag ' + subject.className + '">' + subject.label + ' ' + fmtDur(byCategory[key]) + '</span>';
  }).join('');
  h += '<div class="study-subject-summary">' + summary + '</div>';
  h += '<div class="study-timeline-note">' +
    (!segments.length && stTotal(sid, date)
      ? '기존 누적시간은 합계에 유지됩니다. 실제 시간대는 새 타이머 기록부터 표시됩니다.'
      : '색이 표시된 한 칸은 실제 공부 10분입니다.') + '</div>';
  return h;
}

function studyTimePanel(me, editable, paperMode, dateOverride) {
  const date = dateOverride || today();

  const r = stRunning(me.id, date);
  const on = r ? studySubject(r.subj).label : '';
  const categorySecs = stCategorySecs(secs);
  const baseSubjects = stSubjects(me.id);
  const timerSubjects = on && !baseSubjects.includes(on) ? baseSubjects.concat(on) : baseSubjects;

  return '<div class="study-time-controls">' +
    (paperMode
      ? '<div class="between mb8">' +
          (goal ? '<span class="pill ' + (pct >= 100 ? '' : 'warn') + '">목표 ' + fmtDur(goal) + ' · ' + pct + '%</span>' : '<span class="small muted">순공 타이머</span>') +
          (editable ? '<div class="row" style="gap:5px"><button class="btn btn-sm btn-ghost" data-act="stgoal" aria-label="순공시간 목표 설정">🎯</button>' +
            '<button class="btn btn-sm btn-ghost" data-act="stedit" aria-label="순공시간 수정">✏️</button></div>' : '') +
        '</div>'
      : '<div class="between mb8"><div class="card-title">⏱ 순공시간</div>' +
      '<div class="row" style="gap:6px">' +
        (goal ? '<span class="pill ' + (pct >= 100 ? '' : 'warn') + '">목표 ' + fmtDur(goal) + ' · ' + pct + '%</span>' : '') +
        (editable ? '<button class="btn btn-sm btn-ghost" data-act="stgoal" aria-label="순공시간 목표 설정">🎯</button>' +
          '<button class="btn btn-sm btn-ghost" data-act="stedit" aria-label="순공시간 수정">✏️</button>' : '') +
      '</div></div>') +
    '<div style="text-align:center;padding:' + (paperMode ? '2px 0 9px' : '3px 0 12px') + '">' +
      (paperMode ? '' : '<div class="study-time-total" data-st-total data-st-date="' + date + '">' + fmtHMS(total) + '</div>') +
      (on
        ? '<div class="small" style="color:var(--blue);font-weight:800">▶ ' + esc(on) + ' 공부 중 — 다시 누르면 정지</div>'
        : '<div class="small muted">' + (editable ? '과목을 눌러 시작하세요' : '학생이 기록한 실제 순공시간입니다') + '</div>') +
    '</div>' +
    (goal ? '<div class="bar mb8"><i style="width:' + pct + '%"></i></div>' : '') +
    (editable ? '<div class="study-timer-subjects">' +
      timerSubjects.map(s => {
        const subject = studySubject(s);
        const key = studySubjectKey(s);
        const shownSecs = STUDY_SUBJECTS[key].label === s ? categorySecs[key] : secs[s];
        return '<button class="chip subject-chip ' + subject.className + ' ' + (on === s ? 'on' : '') + '" data-act="sttoggle" data-subj="' + esc(s) + '"' +
          (on === s ? ' id="stChipOn"' : '') + '>' +
          (on === s ? '⏸ ' : '▶ ') + esc(s) +
          (shownSecs ? ' ' + fmtHM(shownSecs) : '') + '</button>';
      }).join('') + '</div>' : '') + '</div>' +
    '<div class="study-timeline" id="studyTimeline" role="img" aria-label="05시부터 24시까지 10분 단위 실제 순공시간">' +
      studyTimelineRows(me.id, date) + '</div>';
}

function stCard(me) {
  return '<div class="card">' + studyTimePanel(me, true) + '</div>';
