name = "wb-sync"
main = "worker.js"
compatibility_date = "2026-08-01"

# 학생 개인 링크와 원장 화면이 GitHub Pages에서 열리므로 그 출처만 허용한다.
# 비우면 모든 출처를 허용하니 운영에서는 반드시 채운다.
[vars]
ALLOW_ORIGIN = "https://whdudwns33-wb.github.io"
WB_PARENT_PORTAL_BASE_URL = "https://wb-sync.whdudwns33.workers.dev/"
WB_STUDENT_PORTAL_BASE_URL = "https://wb-student.whdudwns33.workers.dev/"
# 감사 가능한 배포 설정의 관리 담당. 기존 비밀 allowlist와 합쳐 적용한다.
# 김남기, 김혜지 선생님은 QR 발급을 포함해 동일한 task 관리 권한을 가진다.
TASK_MANAGER_STAFF_IDS_CONFIG = "84349fea-f2f0-4fc3-b32a-aaef1e466d54,ef0af47e-f9d2-4dfc-bd95-887991ee9479"

# 보호자 앱은 GitHub Pages(task/admin)와 origin을 분리하고 Worker API와 같은
# origin에서만 세션 쿠키를 사용한다. 모든 요청을 Worker가 먼저 보고 GET asset만
# ASSETS binding으로 넘긴다.
[assets]
directory = "../parent"
binding = "ASSETS"
run_worker_first = true

# Cloudflare Cron은 UTC 기준이다. 11:00 UTC = 20:00 KST.
[triggers]
crons = ["0 11 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "wb-sync"
database_id = "5d65c2e2-47d9-4947-b402-704719914fd3"

[[r2_buckets]]
binding = "CONSULT_MEDIA"
bucket_name = "wb-consult-private"

# 비밀값은 이 파일에 쓰지 않는다. 아래 명령으로 따로 넣는다.
#   npx wrangler secret put TASK_ADMIN_SECRET
#   npx wrangler secret put CONSULT_ADMIN_SECRET
#   npx wrangler secret put TASK_MANAGER_STAFF_IDS
#   npx wrangler secret put SOLAPI_KAKAO_DIRECTOR_REPORT_TEMPLATE_ID
