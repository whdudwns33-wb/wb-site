<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>하루브레인 — 보호자</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <style>
    /* 부모 화면 — 읽기 5, 쓰기 0 (설계안 §3-2). 점수·정답률·개별 문항·칸 이름·접속 로그 없음.
       토큰 이름·값은 학생 앱(index.html)과 같다 — 부모는 밤에 이 링크를 연다(다크). 대비: 글자 4.5 이상, 막대·테두리 3 이상. */
    :root { color-scheme:light dark; --bg:#F5F3EE; --panel:#FFFFFF; --ink:#22302A; --soft:#56645D; --line:#E1E6E2; --edge:#86938C;
            --accent:#2B4C3F; --green-soft:#E6EFEA; --amber-soft:#F8F1DF; --red:#B0483A; --red-soft:#F9E9E6; }
    @media (prefers-color-scheme:dark) {
      :root { --bg:#141A17; --panel:#1C2420; --ink:#E6ECE8; --soft:#A3B1AA; --line:#2E3A34; --edge:#6E7D76;
              --accent:#8FC7AE; --green-soft:#22352C; --amber-soft:#3A2F17; --red:#F0A090; --red-soft:#3A2220; }
    }
    * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--ink); font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; font-size:16px; line-height:1.65; word-break:keep-all; }
    main { max-width:560px; margin:0 auto; padding:20px 16px 40px; }
    h1 { font-size:18px; color:var(--accent); margin:0 0 6px; } .lead { color:var(--soft); font-size:14px; margin:0 0 16px; }
    h2 { font-size:16px; font-weight:800; margin:0 0 4px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px 18px; margin-bottom:12px; }
    .kv { display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:9px 0; border-bottom:1px solid var(--line); } .kv:last-child { border-bottom:none; }
    .kv b { text-align:right; } .bar { height:12px; background:var(--line); border-radius:99px; overflow:hidden; } .bar i { display:block; height:100%; background:var(--accent); }
    .hist { display:flex; align-items:flex-end; gap:6px; height:80px; margin-top:24px; } .hist div { flex:1; background:var(--edge); border-radius:4px 4px 0 0; position:relative; min-height:3px; }
    .hist div.me { background:var(--accent); } .hist div.me::after { content:'●'; position:absolute; top:-18px; left:50%; transform:translateX(-50%); color:var(--accent); font-size:12px; }
    .small { font-size:13px; color:var(--soft); margin:6px 0 0; } .coach { background:var(--green-soft); border-radius:12px; padding:12px 14px; }
    .bed { font-size:24px; font-weight:900; color:var(--accent); font-variant-numeric:tabular-nums; } .foot { font-size:13px; color:var(--soft); margin-top:16px; line-height:1.6; }
    .nw { white-space:nowrap; } ul { padding-left:18px; margin:6px 0 0; } .err { background:var(--red-soft); color:var(--red); border-radius:12px; padding:12px 14px; font-weight:700; }
  </style>
</head>
<body>
  <main id="app"><div class="card">불러오는 중…</div></main>
  <script>
  'use strict';
  (function () {
    var esc = function (s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };
    /* 날짜(2026-11-04)가 하이픈에서 꺾이지 않게 — 이스케이프한 뒤에 감싼다 */
    var escD = function (s) { return esc(s).replace(/\d{4}-\d{2}-\d{2}/g, '<span class="nw">$&</span>'); };
    var DAY = 86400000, BED_DAYS = 7;   // 취침 위상 전진 일수 — plan.js bedTarget·plan-build 기본값과 같다
    /* 날짜는 KST 로 센다 — 서버의 bedTarget 도 KST 날짜로 계산된다(plan.js). */
    var kstToday = function () { return new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10); };
    var daysUntil = function (ymd) { return Math.round((Date.parse(ymd + 'T00:00:00Z') - Date.parse(kstToday() + 'T00:00:00Z')) / DAY); };
    var md = function (ymd) { return ymd.slice(5).replace('-', '/'); };
    var app = document.getElementById('app');
    var t = new URLSearchParams(location.search).get('t') || '';
    fetch('/api/haru/parent?t=' + encodeURIComponent(t), { cache: 'no-store' }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); }).then(function (x) {
      if (!x.ok) { app.innerHTML = '<div class="err" role="alert">' + esc(x.j.error || '열 수 없어요.') + '</div>'; return; }
      var p = x.j.parent;
      var html = '<h1>' + esc(p.name) + ' 학생</h1><p class="lead">채점은 저희가 합니다. 부모님은 재우고 깨워 주세요.</p>';
      html += '<div class="card"><div class="kv"><span>오늘</span><b>' + (p.today.done ? '● 했어요 · ' + p.today.min + '분' : '○ 오늘은 앉지 않았어요') + '</b></div>' +
        '<div class="kv"><span>이번 주</span><b>누적 ' + p.week.done + '일</b></div><div class="bar" aria-hidden="true"><i style="width:' + Math.round(p.week.done / 7 * 100) + '%"></i></div>' +
        '<div class="kv"><span>지난 회차</span><b>' + (p.lastMock ? (p.lastMock.completed ? '완주 ○' : '완주 —') + ' · 무응답 ' + p.lastMock.blank : '회차 없음') + '</b></div></div>';
      html += '<div class="card"><h2>이번 달 회차 분포</h2>';
      if (p.dist) {
        var max = Math.max.apply(null, p.dist.bins.map(function (b) { return b.c; })) || 1;
        html += '<div class="hist" role="img" aria-label="회차 분포 막대그래프 — ● 표시가 우리 아이가 있는 구간">' + p.dist.bins.map(function (b, i) { return '<div class="' + (p.dist.mine === i ? 'me' : '') + '" style="height:' + Math.round(b.c / max * 100) + '%"></div>'; }).join('') + '</div>' +
          '<p class="small">표본 ' + p.dist.n + '명 · ' + esc(p.dist.composition) + ' · 문항 출처 ' + esc(p.dist.itemSource) + '</p>';
      } else html += '<p class="small">표본이 30명을 넘으면 그려집니다.</p>';
      html += '</div>';
      if (p.coach) html += '<div class="card coach">' + esc(p.coach) + '</div>';
      /* 취침 목표는 위상 전진(시험 D-7 ~ D-1) 동안에만 '목표'로 크게 보인다. 그 전의 값은 플랜의 출발 시각(bed.base, 23:45)이라
         초6 부모에게 목표처럼 보이면 안 된다 — 숫자 없이 언제부터 나오는지만 적는다. 시험일은 서버가 따로 주지 않아
         어른 일정의 입실 항목에서 읽는다(plan-build.test.mjs 가 그 항목이 하나뿐임을 지킨다). */
      var exam = (p.milestones || []).filter(function (m) { return /고사장 입실/.test(m.text); })[0];
      var dd = exam ? daysUntil(exam.d) : null;
      if (p.bedTarget && dd != null && dd >= 1 && dd <= BED_DAYS) {
        html += '<div class="card"><div class="kv"><span>오늘 취침 목표</span><span class="bed">' + esc(p.bedTarget) + '</span></div><p class="small">시험 7일 전부터 매일 15분씩 당겨집니다. 이 화면은 기록을 받지 않습니다.</p></div>';
      } else if (dd != null && dd > BED_DAYS) {
        html += '<div class="card"><h2>취침</h2><p class="small">' + esc(md(new Date(Date.parse(exam.d + 'T00:00:00Z') - BED_DAYS * DAY).toISOString().slice(0, 10))) + '부터 그날의 취침 목표를 이 자리에 보여 드립니다. 시험 전날까지 매일 15분씩 당깁니다.</p></div>';
      }
      html += '<div class="card"><h2>어른 일정</h2>' + (p.milestones.length ? '<ul>' + p.milestones.map(function (m) { return '<li>' + esc(md(m.d)) + (m.at ? ' ' + esc(m.at) : '') + ' — ' + escD(m.text) + '</li>'; }).join('') + '</ul>' : '<p class="small">45일 안에 예정된 일정이 없습니다.</p>') + '</div>';
      html += '<p class="foot">' + escD(p.notice || '') + '</p>';
      app.innerHTML = html;
    }).catch(function () { app.innerHTML = '<div class="err" role="alert">지금은 열 수 없어요. 잠시 뒤 다시 열어 주세요.</div>'; });
  })();
  </script>
</body>
</html>
