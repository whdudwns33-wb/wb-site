<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>업무지시서 · WB 웩슬러브레인센터</title>
<meta name="theme-color" content="#1B3A5C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue:       #1E9DD6;
    --deep-blue:  #0F7AAB;
    --navy:       #1B3A5C;
    --coral:      #E85D4A;
    --ivory:      #FAF8F3;
    --dark-gray:  #2D2D2D;
    --mid-gray:   #6B7280;
    --line:       #E5E7EB;
    --light-gray: #F3F4F6;
    --white:      #FFFFFF;
    --green:      #16A34A;
    --amber:      #D97706;
  }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--dark-gray);
    background: var(--ivory);
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
    padding-bottom: 48px;
  }

  button, input, select, textarea { font-family: inherit; font-size: 100%; color: inherit; }
  button { cursor: pointer; border: none; background: none; }

  .wrap { max-width: 760px; margin: 0 auto; padding: 0 14px; }

  /* ─── 상단 바 ─── */
  .topbar { background: var(--navy); color: var(--white); padding: 12px 0; position: sticky; top: 0; z-index: 50; }
  .topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .brand { font-size: 15px; font-weight: 900; letter-spacing: -0.02em; }
  .brand span { color: var(--blue); }
  .brand small { display: block; font-size: 11px; font-weight: 400; color: rgba(255,255,255,0.6); letter-spacing: 0; }
  .whoami {
    font-size: 12px; font-weight: 700; background: rgba(255,255,255,0.14);
    padding: 6px 12px; border-radius: 999px; display: flex; align-items: center; gap: 6px;
  }
  .whoami i { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); font-style: normal; }
  .whoami.off i { background: var(--mid-gray); }

  /* ─── 탭 ─── */
  .tabs { background: var(--white); border-bottom: 1px solid var(--line); position: sticky; top: 55px; z-index: 40; }
  .tabs .wrap { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
  .tabs .wrap::-webkit-scrollbar { display: none; }
  .tab {
    padding: 13px 14px; font-size: 14px; font-weight: 700; color: var(--mid-gray);
    border-bottom: 3px solid transparent; white-space: nowrap; display: flex; align-items: center; gap: 5px;
  }
  .tab.on { color: var(--deep-blue); border-bottom-color: var(--blue); }
  .badge {
    background: var(--coral); color: var(--white); font-size: 11px; font-weight: 900;
    min-width: 18px; height: 18px; border-radius: 999px; padding: 0 5px;
    display: inline-flex; align-items: center; justify-content: center;
  }

  /* ─── 카드 ─── */
  .card { background: var(--white); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .card.alert { border-color: var(--coral); background: #FFF9F8; }
  .card-title { font-size: 15px; font-weight: 900; margin-bottom: 4px; }
  .card-sub { font-size: 13px; color: var(--mid-gray); }
  main { padding-top: 16px; }

  .row { display: flex; align-items: center; gap: 10px; }
  .wraprow { flex-wrap: wrap; }
  .between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .muted { color: var(--mid-gray); }
  .small { font-size: 12px; }
  .mb8 { margin-bottom: 8px; } .mb14 { margin-bottom: 14px; } .mt14 { margin-top: 14px; }

  /* ─── 버튼 ─── */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 11px 16px; border-radius: 10px; font-size: 14px; font-weight: 700;
    background: var(--light-gray); color: var(--dark-gray); border: 1px solid transparent;
  }
  .btn:active { filter: brightness(0.94); }
  .btn-primary { background: var(--blue); color: var(--white); }
  .btn-navy { background: var(--navy); color: var(--white); }
  .btn-ghost { background: var(--white); border-color: var(--line); }
  .btn-danger { background: #FEF2F2; color: var(--coral); }
  .btn-warn { background: #FFF7ED; color: var(--amber); border: 1px solid #FDE8CC; }
  .btn-sm { padding: 7px 11px; font-size: 12.5px; border-radius: 8px; }
  .btn-block { display: flex; width: 100%; }
  .btn:disabled { opacity: .5; cursor: default; }

  /* ─── 폼 ─── */
  label.fl { display: block; font-size: 12.5px; font-weight: 700; color: var(--mid-gray); margin-bottom: 5px; }
  .in { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--white); font-size: 14.5px; }
  .in:focus { outline: 2px solid rgba(30,157,214,.35); outline-offset: -1px; border-color: var(--blue); }
  textarea.in { resize: vertical; min-height: 62px; line-height: 1.6; }
  .field { margin-bottom: 12px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip { padding: 8px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--white); font-size: 13px; font-weight: 700; color: var(--mid-gray); }
  .chip.on { background: var(--navy); border-color: var(--navy); color: var(--white); }
  .chip.dow { min-width: 42px; padding: 8px 0; text-align: center; justify-content: center; }

  /* ─── 날짜 네비 ─── */
  .datenav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px; }
  .datenav .d { font-size: 17px; font-weight: 900; }
  .datenav .d em { font-style: normal; font-size: 13px; font-weight: 700; color: var(--blue); margin-left: 6px; }
  .navbtn { width: 38px; height: 38px; border-radius: 10px; background: var(--white); border: 1px solid var(--line); font-size: 16px; font-weight: 900; color: var(--mid-gray); }

  /* ─── 진행률 ─── */
  .prog { display: flex; align-items: center; gap: 14px; }
  .ring {
    width: 62px; height: 62px; border-radius: 50%; flex-shrink: 0;
    display: grid; place-items: center; font-weight: 900; color: var(--navy);
    background: conic-gradient(var(--blue) calc(var(--p) * 1%), var(--light-gray) 0);
    position: relative;
  }
  .ring::after { content: ''; position: absolute; inset: 7px; background: var(--white); border-radius: 50%; }
  .ring b { position: relative; z-index: 1; font-size: 15px; }
  .bar { height: 8px; border-radius: 99px; background: var(--light-gray); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--blue); border-radius: 99px; }
  .bar.mini { height: 5px; }
  .bar.doing i { background: var(--amber); }

  /* ─── 업무 항목 ─── */
  .task { display: flex; gap: 12px; align-items: flex-start; padding: 14px 4px; border-bottom: 1px solid var(--light-gray); }
  .task:last-child { border-bottom: none; }
  .task.isblocked { background: #FFF9F8; border-radius: 10px; padding-left: 10px; padding-right: 10px; }
  .box {
    width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0; margin-top: 1px;
    border: 2px solid #D1D5DB; background: var(--white);
    display: grid; place-items: center; color: transparent; font-size: 15px; font-weight: 900;
  }
  .task.done .box { background: var(--blue); border-color: var(--blue); color: var(--white); }
  .task.doing .box { border-color: var(--amber); }
  .task-body { flex: 1; min-width: 0; }
  .task-t { font-size: 15px; font-weight: 700; line-height: 1.45; word-break: keep-all; }
  .task.done .task-t { color: var(--mid-gray); text-decoration: line-through; }
  .task-d { font-size: 13px; color: var(--mid-gray); margin-top: 3px; white-space: pre-wrap; word-break: break-word; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; align-items: center; }
  .tag { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: var(--light-gray); color: var(--mid-gray); }
  .tag.time { background: #EAF6FC; color: var(--deep-blue); }
  .tag.high { background: #FEF2F2; color: var(--coral); }
  .tag.ok   { background: #ECFDF5; color: var(--green); }
  .tag.doing{ background: #FFF7ED; color: var(--amber); }
  .tag.blk  { background: var(--coral); color: var(--white); }
  .tag.carry{ background: #FEF2F2; color: var(--coral); }
  .tag.add  { background: #ECFDF5; color: var(--green); }
  .tag.edit { background: #FFF7ED; color: var(--amber); }
  .note { margin-top: 8px; width: 100%; font-size: 13px; padding: 8px 10px; border: 1px dashed var(--line); border-radius: 8px; background: var(--ivory); }
  .empty { text-align: center; padding: 40px 16px; color: var(--mid-gray); font-size: 14px; }
  .empty b { display: block; font-size: 30px; margin-bottom: 8px; }

  /* ─── 단계 / 가이드 ─── */
  .opener { font-size: 12.5px; font-weight: 700; color: var(--deep-blue); padding: 4px 0; margin-top: 6px; }
  .panel { margin-top: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: #FCFDFE; }
  .guide { background: #F0F9FF; border: 1px solid #D5EBF7; border-radius: 8px; padding: 10px 12px; font-size: 13px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .guide b { display: block; color: var(--deep-blue); font-size: 12px; margin-bottom: 4px; }
  .step { display: flex; gap: 9px; align-items: flex-start; padding: 7px 0; font-size: 13.5px; }
  .sbox {
    width: 20px; height: 20px; border-radius: 6px; flex-shrink: 0; margin-top: 1px;
    border: 2px solid #D1D5DB; background: var(--white);
    display: grid; place-items: center; color: transparent; font-size: 12px; font-weight: 900;
  }
  .step.on .sbox { background: var(--green); border-color: var(--green); color: var(--white); }
  .step.on span { color: var(--mid-gray); text-decoration: line-through; }
  .counter { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; font-weight: 700; }
  .counter input { width: 74px; text-align: center; padding: 8px; }

  /* ─── 주간 그리드 ─── */
  .weekwrap { overflow-x: auto; }
  table.week { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 480px; }
  table.week th, table.week td { border: 1px solid var(--line); padding: 7px 6px; text-align: center; }
  table.week th.n, table.week td.n { text-align: left; width: 38%; font-weight: 700; }
  table.week thead th { background: var(--light-gray); font-size: 12px; color: var(--mid-gray); font-weight: 700; }
  table.week thead th.today { background: var(--navy); color: var(--white); }
  .dot { width: 20px; height: 20px; border-radius: 6px; display: inline-block; background: var(--light-gray); line-height: 20px; color: transparent; font-size: 12px; font-weight: 900; }
  .dot.done { background: var(--blue); color: var(--white); }
  .dot.doing { background: #FCD9A5; color: var(--amber); }
  .dot.blocked { background: var(--coral); color: var(--white); }
  .dot.miss { background: #FDE8E4; }
  .dot.none { background: transparent; }

  /* ─── 직원 현황 ─── */
  .staffcard { display: flex; gap: 14px; align-items: center; }
  .ava { width: 44px; height: 44px; border-radius: 12px; background: var(--navy); color: var(--white); display: grid; place-items: center; font-weight: 900; font-size: 15px; flex-shrink: 0; }

  /* ─── 토스트 / 모달 ─── */
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px);
    background: var(--navy); color: var(--white); padding: 12px 20px; border-radius: 999px;
    font-size: 13.5px; font-weight: 700; opacity: 0; pointer-events: none; transition: all .2s; z-index: 200;
    max-width: 90vw; text-align: center;
  }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  .modal { position: fixed; inset: 0; background: rgba(27,58,92,.55); display: grid; place-items: center; padding: 16px; z-index: 150; }
  .modal-box { background: var(--white); border-radius: 16px; padding: 20px; width: 100%; max-width: 460px; max-height: 88vh; overflow-y: auto; }

  hr.sep { border: none; border-top: 1px solid var(--line); margin: 14px 0; }
  .hint { font-size: 12.5px; color: var(--mid-gray); line-height: 1.65; }
  .pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #EAF6FC; color: var(--deep-blue); }
  .pill.warn { background: #FFF7ED; color: var(--amber); }
  .pill.bad { background: #FEF2F2; color: var(--coral); }
  .sect { font-size: 12px; font-weight: 900; color: var(--mid-gray); letter-spacing: .04em; margin: 18px 0 8px; }
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <div class="brand"><span>WB</span> 업무지시서<small>Work Order &amp; Check</small></div>
    <button class="whoami off" id="whoami"><i></i><span>—</span></button>
  </div>
</header>

<nav class="tabs"><div class="wrap" id="tabs"></div></nav>

<main class="wrap" id="view"></main>

<div id="toast"></div>
<div id="modalHost"></div>

<script>
"use strict";

/* ══════════════════════════════════════════════════════
   1. 저장소
   ══════════════════════════════════════════════════════ */
const LS_KEY = 'wb_taskboard_v1';
const DOW = ['일','월','화','수','목','금','토'];

const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id' + Date.now() + Math.random().toString(16).slice(2));
const now = () => Date.now();

function blankState() {
  return {
    version: 2,
    staff: [],
    tasks: [],
    checks: {},
    settings: { adminPin: '', syncUrl: '', syncSecret: '', centerName: 'WB 웩슬러브레인센터' }
  };
}

let state = blankState();

function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      state = Object.assign(blankState(), p);
      state.settings = Object.assign(blankState().settings, p.settings || {});
    }
  } catch (e) { console.warn('load failed', e); }
}

function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  catch (e) { toast('저장 공간이 부족합니다'); }
}

/* ══════════════════════════════════════════════════════
   2. 날짜 유틸
   ══════════════════════════════════════════════════════ */
function ymd(d) {
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function parseYmd(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
function today() { return ymd(new Date()); }
function nowHM() { const d = new Date(); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
function dowOf(s) { return parseYmd(s).getDay(); }
function label(s) { const d = parseYmd(s); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + DOW[d.getDay()] + ')'; }
function shortDate(s) { const d = parseYmd(s); return (d.getMonth() + 1) + '/' + d.getDate(); }
function relLabel(s) {
  const diff = Math.round((parseYmd(s) - parseYmd(today())) / 86400000);
  if (diff === 0) return '오늘';
  if (diff === -1) return '어제';
  if (diff === 1) return '내일';
  return null;
}
function mondayOf(s) { const d = parseYmd(s); return addDays(s, -((d.getDay() + 6) % 7)); }

/* ══════════════════════════════════════════════════════
   3. 도메인 로직
   ══════════════════════════════════════════════════════ */
const liveStaff = () => state.staff.filter(s => !s.deleted);
const staffById = id => state.staff.find(s => s.id === id);
const staffByName = n => liveStaff().find(s => s.name === String(n || '').trim());

function occursOn(task, date) {
  if (task.deleted) return false;
  if (task.start && date < task.start) return false;
  if (task.end && date > task.end) return false;
  switch (task.repeat) {
    case 'once':    return date === task.start;
    case 'daily':   return true;
    case 'weekday': { const w = dowOf(date); return w >= 1 && w <= 5; }
    case 'days':    return (task.days || []).includes(dowOf(date));
    default:        return false;
  }
}

function tasksFor(staffId, date) {
  return state.tasks
    .filter(t => t.staffId === staffId && occursOn(t, date))
    .sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99')
                 || (b.priority === 'high') - (a.priority === 'high')
                 || (a.createdAt || 0) - (b.createdAt || 0));
}

const ckey = (taskId, date) => taskId + '|' + date;
const getCheck = (taskId, date) => state.checks[ckey(taskId, date)] || null;
const isDone = (taskId, date) => !!(state.checks[ckey(taskId, date)] || {}).done;

function setCheck(taskId, date, patch) {
  const k = ckey(taskId, date);
  const cur = state.checks[k] || { taskId: taskId, date: date, done: false, note: '', steps: {}, count: 0, blocked: false };
  const next = Object.assign({}, cur, patch, { updatedAt: now() });
  state.checks[k] = next;
  save();
  queueSync();
  return next;
}

/** 단계·수량을 고려한 개별 업무 진행률 */
function taskProgress(t, c) {
  const steps = t.steps || [];
  if (steps.length) {
    const done = steps.filter(s => c && c.steps && c.steps[s.id]).length;
    return { done: done, total: steps.length, unit: '단계', pct: Math.round(done / steps.length * 100) };
  }
  if (t.target) {
    const n = (c && c.count) || 0;
    return { done: n, total: t.target, unit: t.unit || '건', pct: Math.min(100, Math.round(n / t.target * 100)) };
  }
  const d = (c && c.done) ? 1 : 0;
  return { done: d, total: 1, unit: '', pct: d * 100 };
}

/** 미착수 todo / 진행중 doing / 완료 done / 막힘 blocked */
function statusOf(t, date) {
  const c = getCheck(t.id, date);
  if (c && c.blocked) return 'blocked';
  if (c && c.done) return 'done';
  if (taskProgress(t, c).done > 0) return 'doing';
  return 'todo';
}
const STATUS_LABEL = { todo: '미착수', doing: '진행중', done: '완료', blocked: '막힘' };

/** 단계·수량이 다 차면 자동 완료, 되돌리면 자동 해제.
 *  둘 다 있는 업무는 단계도 끝나고 수량도 채워져야 완료다. */
function syncAuto(t, date) {
  const c = getCheck(t.id, date);
  if (!c) return;
  const hasSteps = (t.steps || []).length > 0, hasTarget = !!t.target;
  if (!hasSteps && !hasTarget) return;
  const stepsOk = !hasSteps || t.steps.every(s => c.steps && c.steps[s.id]);
  const countOk = !hasTarget || ((c.count || 0) >= t.target);
  const full = stepsOk && countOk;
  if (full && !c.done) setCheck(t.id, date, { done: true, at: now() });
  else if (!full && c.done) setCheck(t.id, date, { done: false, at: null });
}

function progress(staffId, date) {
  const list = tasksFor(staffId, date);
  const done = list.filter(t => isDone(t.id, date)).length;
  return { done: done, total: list.length, pct: list.length ? Math.round(done / list.length * 100) : 0 };
}

function weekProgress(staffId, anchor) {
  const mon = mondayOf(anchor);
  let done = 0, total = 0;
  for (let i = 0; i < 7; i++) { const p = progress(staffId, addDays(mon, i)); done += p.done; total += p.total; }
  return { done: done, total: total, pct: total ? Math.round(done / total * 100) : 0 };
}

function streak(staffId) {
  let d = today(), n = 0;
  for (let i = 0; i < 120; i++) {
    const p = progress(staffId, d);
    if (p.total === 0) { d = addDays(d, -1); continue; }
    if (p.done < p.total) break;
    n++; d = addDays(d, -1);
  }
  return n;
}

/** 이월: 최근 7일 안에 못 끝낸 '이월' 업무 */
function carryOver(staffId, date) {
  const out = [];
  for (let i = 1; i <= 7; i++) {
    const d = addDays(date, -i);
    tasksFor(staffId, d).forEach(t => {
      if (!t.carry || isDone(t.id, d)) return;
      out.push({ t: t, date: d });
    });
  }
  return out.sort((a, b) => a.date.localeCompare(b.date));
}

/** 그 주에 직원이 스스로 추가한 업무 */
function staffAdded(anchor) {
  const mon = mondayOf(anchor);
  const days = Array.from({ length: 7 }, (_, i) => addDays(mon, i));
  const out = [];
  state.tasks.forEach(t => {
    if (t.deleted || t.origin !== 'staff') return;
    days.forEach(d => { if (occursOn(t, d)) out.push({ t: t, date: d }); });
  });
  return out.sort((a, b) => a.date.localeCompare(b.date));
}

/** 원장이 바로 봐야 할 것: 막힘 + 예정 시각이 지난 미완료 */
function alertsToday() {
  const d = today(), hm = nowHM();
  let blocked = 0, overdue = 0;
  liveStaff().forEach(s => tasksFor(s.id, d).forEach(t => {
    const c = getCheck(t.id, d);
    if (c && c.blocked) { blocked++; return; }
    if (c && c.done) return;
    if (t.time && t.time < hm) overdue++;
  }));
  return { blocked: blocked, overdue: overdue, total: blocked + overdue };
}

/* ══════════════════════════════════════════════════════
   4. 동기화 (선택) — Google Apps Script 웹앱
   ══════════════════════════════════════════════════════ */
const sync = {
  busy: false, dirty: false, last: null, timer: null, loud: false,

  enabled() { return !!state.settings.syncUrl; },

  merge(remote) {
    if (!remote) return;
    const byId = arr => { const m = {}; (arr || []).forEach(x => { m[x.id] = x; }); return m; };
    ['staff', 'tasks'].forEach(key => {
      const mine = byId(state[key]), theirs = byId(remote[key]);
      const out = {};
      Object.keys(Object.assign({}, mine, theirs)).forEach(id => {
        const a = mine[id], b = theirs[id];
        out[id] = (!a) ? b : (!b) ? a : ((b.updatedAt || 0) > (a.updatedAt || 0) ? b : a);
      });
      state[key] = Object.values(out);
    });
    const rc = remote.checks || {};
    Object.keys(rc).forEach(k => {
      const a = state.checks[k], b = rc[k];
      if (!a || (b.updatedAt || 0) > (a.updatedAt || 0)) state.checks[k] = b;
    });
    save();
  },

  async run() {
    if (!this.enabled() || this.busy) return;
    this.busy = true; paintStatus();
    try {
      const res = await fetch(state.settings.syncUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          secret: state.settings.syncSecret || '',
          state: { staff: state.staff, tasks: state.tasks, checks: state.checks }
        })
      });
      const data = await res.json();
      if (!data || data.ok !== true) throw new Error((data && data.error) || '동기화 거부됨');
      this.merge(data.state);
      this.last = now(); this.dirty = false;
      render();
    } catch (e) {
      console.warn('sync', e);
      this.dirty = true;
      if (this.loud) toast('동기화 실패 — 주소·비밀키를 확인하세요');
    } finally {
      this.busy = false; this.loud = false; paintStatus();
    }
  }
};

function queueSync() {
  if (!sync.enabled()) return;
  sync.dirty = true;
  clearTimeout(sync.timer);
  sync.timer = setTimeout(() => sync.run(), 1200);
}

/* ══════════════════════════════════════════════════════

function go(r) { route = r; location.hash = '#/' + r; window.scrollTo(0, 0); render(); }
window.addEventListener('hashchange', () => {
  // 앱이 이미 열린 상태에서 지시서 링크를 누르면 해시만 바뀌고 새로고침이 없다 — 여기서 받는다
  if (/[#&]add=/.test(location.hash)) { absorbLinkParams(); render(); return; }
  const r = location.hash.replace('#/', '');
  if (r && r !== route) { route = r; render(); }
});

function unb64(s) { return decodeURIComponent(escape(atob(String(s).replace(/-/g, '+').replace(/_/g, '/')))); }

let pendingAdd = null;   // 링크로 들어온 지시서 — 확인 후 등록

/** 링크에 담겨 온 것들을 흡수한다.
 *  s=  동기화 설정 (직원 기기 세팅 대신)
 *  add= 지시서 묶음 (원장이 링크 한 번으로 등록) */
function absorbLinkParams() {
  const q = new URLSearchParams(location.search);
  let touched = false;

  const s = q.get('s');
  if (s) {
    try {
      const cfg = JSON.parse(unb64(s));
      if (cfg.u) state.settings.syncUrl = cfg.u;
      if (cfg.k) state.settings.syncSecret = cfg.k;
      save();
    } catch (e) { console.warn('link config', e); }
    q.delete('s'); touched = true;
  }

  // 지시서는 주소창에 남지 않도록 해시(#add=)를 우선 쓴다
  let raw = null;
  const m = location.hash.match(/[#&]add=([^&]+)/);
  if (m) raw = m[1];
  else if (q.get('add')) { raw = q.get('add'); q.delete('add'); touched = true; }

  if (raw) {
    try {
      const p = JSON.parse(unb64(raw));
      const list = Array.isArray(p) ? p : (p.assignments || []);
      if (list.length) pendingAdd = list;
    } catch (e) { console.warn('link add', e); }
  }

  if (touched || m) {
    history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '') + (m ? '' : location.hash));
  }
}

const $ = sel => document.querySelector(sel);
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('on'), 2400);
}
function repeatLabel(t) {
  if (t.repeat === 'once')    return (t.start ? label(t.start) + ' ' : '') + '1회';
  if (t.repeat === 'daily')   return '매일';
  if (t.repeat === 'weekday') return '평일(월~금)';
  if (t.repeat === 'days')    return '매주 ' + (t.days || []).map(d => DOW[d]).join('·');
  return '';
}

 *  (직원도 체크·단계·수량·메모·막힘은 언제나 가능하다) */
function canEditTask(t) {

function paintStatus() {
  const el = $('#whoami');

  if (session.isStaffLink) { text = me ? me.name + ' 선생님' : '알 수 없는 링크'; on = !!me; }
  else if (session.isAdmin) { text = '원장 모드'; on = true; }
  else { text = '잠김'; }
  if (sync.busy) text += ' · 동기화중';
  else if (sync.enabled() && sync.dirty) text += ' · 대기';
  el.innerHTML = '<i></i><span>' + esc(text) + '</span>';

function taskRow(t, date, editable, isCarry) {

  let h = '<div class="task ' + st + (st === 'blocked' ? ' isblocked' : '') + '" data-task="' + t.id + '">' +
    '<button class="box" ' + (editable ? 'data-act="toggle" data-id="' + t.id + '" data-date="' + date + '"' : 'disabled') + '>✓</button>' +
    '<div class="task-body">' +
      '<div class="task-t">' + esc(t.title) + '</div>' +
      (t.detail ? '<div class="task-d">' + esc(t.detail) + '</div>' : '') +
      '<div class="meta">' +
        (isCarry ? '<span class="tag carry">⚠ ' + shortDate(date) + ' 미완료</span>' : '') +
        (t.time ? '<span class="tag time">' + esc(t.time) + '</span>' : '') +
        (t.priority === 'high' ? '<span class="tag high">중요</span>' : '') +
        (st === 'blocked' ? '<span class="tag blk">막힘</span>' : '') +
        (st === 'doing' ? '<span class="tag doing">진행중 ' + prog.done + '/' + prog.total + prog.unit + '</span>' : '') +
        (!isCarry ? '<span class="tag">' + esc(repeatLabel(t)) + '</span>' : '') +
        (st === 'done' && c && c.at ? '<span class="tag ok">✓ ' + new Date(c.at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) + ' 완료</span>' : '') +
        originTags(t) +
      '</div>';

  if (hasDetail && st !== 'done') {
    h += '<div class="bar mini ' + (st === 'doing' ? 'doing' : '') + '" style="margin-top:8px"><i style="width:' + prog.pct + '%"></i></div>';
  }

    h += '<button class="opener" data-act="panel" data-id="' + t.id + '" data-date="' + date + '">' +
      (open ? '▾ 접기' : '▸ 하는 방법 · 단계 열기' + ((t.steps || []).length ? ' (' + prog.done + '/' + prog.total + ')' : '')) + '</button>';

/* ── 주간 플래너 ── */
function viewWeek() {
  const me = currentStaff();
  if (!me) return emptyStaffCard();
  const mon = mondayOf(cursor);
  const days = Array.from({ length: 7 }, (_, i) => addDays(mon, i));
  const rows = {};
  days.forEach(d => tasksFor(me.id, d).forEach(t => { rows[t.id] = t; }));
  const list = Object.values(rows);
  const wp = weekProgress(me.id, cursor);
  const editable = session.isStaffLink || session.isAdmin;

  let h = '';
  if (!session.isStaffLink) h += staffSwitcher(me.id);

  h += '<div class="datenav">' +
    '<button class="navbtn" data-act="week" data-n="-1">‹</button>' +
    '<div class="d">' + shortDate(mon) + ' ~ ' + shortDate(days[6]) + '</div>' +
    '<button class="navbtn" data-act="week" data-n="1">›</button></div>';

  h += '<div class="card"><div class="between mb8">' +
    '<div class="card-title">이번 주 달성률</div>' +
    '<div class="pill">' + wp.done + ' / ' + wp.total + '건 · ' + wp.pct + '%</div></div>' +
    '<div class="bar"><i style="width:' + wp.pct + '%"></i></div></div>';

  if (!list.length) return h + '<div class="card"><div class="empty"><b>📋</b>이 주에 지시된 업무가 없습니다.</div></div>';

  h += '<div class="card weekwrap"><table class="week"><thead><tr><th class="n">업무</th>' +
    days.map(d => '<th class="' + (d === today() ? 'today' : '') + '">' + DOW[dowOf(d)] + '<br>' + parseYmd(d).getDate() + '</th>').join('') +
    '</tr></thead><tbody>' +
    list.map(t => '<tr><td class="n">' + esc(t.title) + '</td>' +
      days.map(d => {
        if (!occursOn(t, d)) return '<td><span class="dot none">·</span></td>';
        const st = statusOf(t, d);
        const cls = st === 'done' ? 'done' : st === 'blocked' ? 'blocked' : st === 'doing' ? 'doing' : (d < today() ? 'miss' : '');
        return '<td><button class="dot ' + cls + '" ' +
          (editable ? 'data-act="toggle" data-id="' + t.id + '" data-date="' + d + '"' : 'disabled') + '>✓</button></td>';
      }).join('') + '</tr>').join('') +
    '</tbody></table></div>' +
    '<div class="hint">🔵 완료 · 🟠 진행중 · 🔴 막힘 · 🩷 지난 날짜 미완료. 칸을 눌러 바로 체크할 수 있습니다.</div>';
  return h;
}

/* ── 직원 현황 ── */
function viewBoard() {
  const list = liveStaff();
  if (!list.length) return emptyStaffCard();

  let h = '<div class="datenav">' +
    '<button class="navbtn" data-act="day" data-n="-1">‹</button>' +
    '<div class="d">' + label(cursor) + (relLabel(cursor) ? '<em>' + relLabel(cursor) + '</em>' : '') + '</div>' +
    '<button class="navbtn" data-act="day" data-n="1">›</button></div>';

  // 막힘 먼저
  const blocked = [];
  list.forEach(s => tasksFor(s.id, cursor).forEach(t => {
    if (statusOf(t, cursor) === 'blocked') blocked.push({ s: s, t: t, c: getCheck(t.id, cursor) });
  }));
  if (blocked.length) {
    h += '<div class="card alert"><div class="card-title" style="color:var(--coral)">🚧 막힘 ' + blocked.length + '건 — 원장님 확인 필요</div>' +
      blocked.map(x => '<div class="small mt14"><b>' + esc(x.s.name) + '</b> · ' + esc(x.t.title) +
        (x.c && x.c.note ? '<br><span class="muted">“' + esc(x.c.note) + '”</span>' : '<br><span class="muted">사유 미기재</span>') +
        '</div>').join('') + '</div>';
  }

  // 직원이 스스로 추가한 업무 — 지시서를 현실에 맞게 고치는 단서가 된다
  const added = staffAdded(cursor);
  if (added.length) {
    const byStaff = {};
    added.forEach(x => {
      const n = (staffById(x.t.staffId) || {}).name || '?';
      (byStaff[n] = byStaff[n] || []).push(x);
    });
    h += '<div class="card">' +
      '<div class="between mb8"><div class="card-title">＋ 직원이 추가한 업무</div>' +
      '<div class="pill">이번 주 ' + added.length + '건</div></div>' +
      '<div class="card-sub mb14">지시하지 않았는데 실제로 하고 있는 일입니다. 반복되면 정식 지시로 올리세요.</div>' +
      Object.keys(byStaff).map(n =>
        '<div class="small" style="font-weight:700;margin-top:10px">' + esc(n) + ' · ' + byStaff[n].length + '건</div>' +
        byStaff[n].map(x => {
          const st = statusOf(x.t, x.date);
          return '<div class="between small" style="padding:3px 0">' +
            '<span class="muted">· ' + esc(x.t.title) + ' <span style="opacity:.7">(' + shortDate(x.date) + ')</span></span>' +
            (st === 'done' ? '<span class="pill">완료</span>'
              : st === 'blocked' ? '<span class="pill bad">막힘</span>'
              : st === 'doing' ? '<span class="pill warn">진행중</span>' : '<span class="pill warn">미완료</span>') +
          '</div>';
        }).join('')
      ).join('') + '</div>';
  }

  const all = list.reduce((a, s) => { const p = progress(s.id, cursor); a.done += p.done; a.total += p.total; return a; }, { done: 0, total: 0 });
  const pct = all.total ? Math.round(all.done / all.total * 100) : 0;
  h += '<div class="card"><div class="prog">' +
    '<div class="ring" style="--p:' + pct + '"><b>' + pct + '%</b></div>' +
    '<div style="flex:1"><div class="card-title">전체 수행률</div>' +
    '<div class="card-sub mb8">직원 ' + list.length + '명 · 지시 ' + all.total + '건 중 ' + all.done + '건 완료</div>' +
    '<div class="bar"><i style="width:' + pct + '%"></i></div></div></div>' +
    '<hr class="sep"><button class="btn btn-navy btn-block" data-act="brief">📊 오늘 마감 브리핑 만들기</button></div>';

  h += list.map(s => {
    const p = progress(s.id, cursor);
    const w = weekProgress(s.id, cursor);
    const st = streak(s.id);
    const rows = tasksFor(s.id, cursor).map(t => ({ t: t, st: statusOf(t, cursor), c: getCheck(t.id, cursor) }));
    const pend = rows.filter(x => x.st !== 'done');
    const notes = rows.filter(x => x.c && x.c.note);

    return '<div class="card">' +
      '<div class="staffcard mb14">' +
        '<div class="ava">' + esc(initials(s.name)) + '</div>' +
        '<div style="flex:1;min-width:0">' +
          '<div class="between"><div class="card-title">' + esc(s.name) + '</div>' +
            '<div class="pill">' + p.done + '/' + p.total + '</div></div>' +
          '<div class="bar" style="margin:6px 0 5px"><i style="width:' + p.pct + '%"></i></div>' +
          '<div class="small muted">이번 주 ' + w.pct + '% · 연속 달성 ' + st + '일</div>' +
        '</div></div>' +
      (pend.length
        ? pend.map(x => {
            const prog = taskProgress(x.t, x.c);
            const badge = x.st === 'blocked' ? '<span class="pill bad">막힘</span>'
                        : x.st === 'doing' ? '<span class="pill warn">' + prog.done + '/' + prog.total + prog.unit + '</span>'
                        : '<span class="pill">미착수</span>';
            return '<div class="between small" style="padding:4px 0"><span>· ' + esc(x.t.title) +
              (x.t.time ? ' <span class="muted">(' + esc(x.t.time) + ')</span>' : '') + '</span>' + badge + '</div>';
          }).join('')
        : '<div class="small" style="color:var(--green);font-weight:700">✓ 지시 업무 모두 완료</div>') +
      (notes.length
        ? '<hr class="sep">' + notes.map(x =>
            '<div class="small mb8"><b>' + esc(x.t.title) + '</b><br><span class="muted">“' + esc(x.c.note) + '”</span></div>').join('')
        : '') +
      '<hr class="sep">' +
      '<div class="row wraprow" style="gap:8px">' +
        '<button class="btn btn-sm btn-ghost" data-act="openstaff" data-id="' + s.id + '">할 일 보기</button>' +
        '<button class="btn btn-sm btn-ghost" data-act="copylink" data-id="' + s.id + '">개인 링크 복사</button>' +
        '<button class="btn btn-sm btn-ghost" data-act="orderText" data-id="' + s.id + '">지시서 문구</button>' +
      '</div></div>';
  }).join('');

  return h;
}

function reportText(staffId, date) {

function briefText(date) {
  const list = liveStaff();
  let done = 0, total = 0;
  const pend = [], blocked = [], clear = [];
  list.forEach(s => {
    const p = progress(s.id, date);
    done += p.done; total += p.total;
    let hasPend = false;
    tasksFor(s.id, date).forEach(t => {
      const st = statusOf(t, date), c = getCheck(t.id, date), pr = taskProgress(t, c);
      if (st === 'done') return;
      hasPend = true;
      const line = '· ' + s.name + ' — ' + t.title + (t.time ? ' (' + t.time + ')' : '') +
        (st === 'doing' ? ' [진행 ' + pr.done + '/' + pr.total + pr.unit + ']' : '') +
        (c && c.note ? '\n   “' + c.note + '”' : '');
      (st === 'blocked' ? blocked : pend).push(line);
    });
    if (!hasPend && p.total) clear.push(s.name);
  });
  const pct = total ? Math.round(done / total * 100) : 0;

  let txt = '📊 ' + label(date) + ' 업무 마감 브리핑\n' +
    '전체 ' + total + '건 중 ' + done + '건 완료 (' + pct + '%)\n─────────\n';
  if (blocked.length) txt += '🚧 막힘 ' + blocked.length + '건 — 조치 필요\n' + blocked.join('\n') + '\n─────────\n';
  txt += pend.length ? '⚠️ 미완료 ' + pend.length + '건\n' + pend.join('\n') + '\n' : '✅ 미완료 없음\n';
  if (clear.length) txt += '─────────\n✅ 전원 완료: ' + clear.join(', ') + '\n';

  // 지시하지 않았는데 직원이 스스로 한 일
  const own = [];
  list.forEach(s => tasksFor(s.id, date).forEach(t => {
    if (t.origin !== 'staff') return;
    const st = statusOf(t, date);
    own.push('· ' + s.name + ' — ' + t.title + ' [' + STATUS_LABEL[st] + ']');
  }));
  if (own.length) txt += '─────────\n＋ 직원 추가 업무 ' + own.length + '건\n' + own.join('\n') + '\n';

  return txt;
}

/* ══════════════════════════════════════════════════════
   8-1. 말로 쓴 지시를 업무로 — 카톡 문장 해석
   ══════════════════════════════════════════════════════ */
const pad2 = n => String(n).padStart(2, '0');

/** "혜지쌤", "김혜지", "혜지 선생님" 모두 잡는다 */
function matchStaff(text) {
  const list = liveStaff();
  for (const s of list) if (text.includes(s.name)) return { s: s, token: s.name };
  for (const s of list) {
    const short = s.name.length >= 3 ? s.name.slice(1) : '';
    if (short.length >= 2 && text.includes(short)) return { s: s, token: short };
  }
  return null;
}

/** "3시까지", "오후 3시반", "15:00", "9시 30분" */
function matchTime(text) {
  let m = text.match(/(\d{1,2})\s*:\s*(\d{2})/);
  if (m) return { time: pad2(m[1]) + ':' + m[2], token: m[0] };

  m = text.match(/(오전|오후|아침|저녁|밤|낮)?\s*(\d{1,2})\s*시\s*(반|\d{1,2}\s*분)?/);
  if (!m) return null;
  let h = Number(m[2]);
  const mer = m[1] || '';
  if (/오후|저녁|밤/.test(mer)) { if (h < 12) h += 12; }
  else if (/오전|아침/.test(mer)) { if (h === 12) h = 0; }
  else if (h >= 1 && h <= 7) h += 12;   // 오후에 도는 센터라 한 자리 시각은 오후로 본다
  let mm = '00';
  if (m[3]) mm = m[3] === '반' ? '30' : pad2(parseInt(m[3], 10));
  return { time: pad2(h) + ':' + mm, token: m[0] };
}

/** "오늘", "내일", "모레", "금요일", "8월 3일" */
function matchDate(text) {
  if (/오늘/.test(text)) return { date: today(), token: '오늘' };
  if (/내일/.test(text)) return { date: addDays(today(), 1), token: '내일' };
  if (/모레/.test(text)) return { date: addDays(today(), 2), token: '모레' };

  const dw = text.match(/([일월화수목금토])\s*요일/);
  if (dw) {
    const want = DOW.indexOf(dw[1]);
    for (let i = 1; i <= 7; i++) {
      const c = addDays(today(), i);
      if (dowOf(c) === want) return { date: c, token: dw[0] };
    }
  }
  const md = text.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
  if (md) return { date: new Date().getFullYear() + '-' + pad2(md[1]) + '-' + pad2(md[2]), token: md[0] };
  return null;
}

function cleanTitle(s) {
  return String(s)
    .replace(/(쌤|선생님|샘)/g, ' ')
    .replace(/(긴급히?|급히|급하게|asap)/gi, ' ')   // 중요 표시로 이미 잡히므로 제목에서는 뺀다
    .replace(/^[\s,.·\-~]*(에게|한테|께)?\s*/, '')
    .replace(/\s*(좀|까지|안에|전에)\s*/g, ' ')
    .replace(/\s*(부탁\s*(해요|드려요|드립니다|합니다|해)|해\s*주세요|해주세요|해줘요|해줘|하세요|해주시고|해주시면|바랍니다)\s*[.!~]*$/, '')
    .replace(/\s+/g, ' ')
    .replace(/[\s.,!~]+$/, '')
    .trim();
}

/** 한 줄에 한 건. 이름·시간·날짜를 뽑고 나머지를 업무 이름으로 쓴다. */
function parseInstructions(text) {
  return String(text || '').split('\n').map(l => l.trim()).filter(Boolean).map(line => {
    let rest = line;
    const sm = matchStaff(rest); if (sm) rest = rest.replace(sm.token, ' ');
    const tm = matchTime(rest);  if (tm) rest = rest.replace(tm.token, ' ');
    const dm = matchDate(rest);  if (dm) rest = rest.replace(dm.token, ' ');
    const title = cleanTitle(rest);
    return {
      staff: sm ? sm.s.name : '',
      title: title || line,
      time: tm ? tm.time : '',
      start: dm ? dm.date : today(),
      repeat: 'once',
      priority: /긴급|급하|급히|중요|바로|asap/i.test(line) ? 'high' : 'normal',
      carry: true,
      raw: line
    };
  });
}

      "target": 12,
      "unit": "명",
      "time": "15:00",
      "priority": "high",
      "repeat": "days",
      "days": [2, 5],
      "carry": true
    }
  ]
}`;

function aiModal() {
  modal('AI 지시서 붙여넣기',
    '<div class="hint mb14">Claude에게 “이런 업무가 있어” 하고 말하면 담당·단계·가이드까지 짜서 아래 형식으로 만들어 줍니다. 그대로 붙여넣으세요.</div>' +
    '<textarea class="in" rows="10" id="aiText" placeholder=\'{"assignments":[ ... ]}\'></textarea>' +
    '<button class="btn btn-ghost btn-block mt14" data-act="aisample">예시 형식 보기</button>',
    '<button class="btn btn-primary btn-block mt14" data-act="aiapply">등록하기</button>');
}

function applyAssignments(input, preConfirmed) {
  let data = input;
  if (typeof input === 'string') {
    try { data = JSON.parse(input); }
    catch (e) { return toast('JSON 형식이 잘못되었습니다'); }
  }
  const list = Array.isArray(data) ? data : (data.assignments || []);
  if (!list.length) return toast('등록할 업무가 없습니다');

  // 이름 확인 → 없는 직원은 물어보고 등록
  const missing = [...new Set(list.map(a => String(a.staff || '').trim()).filter(n => n && !staffByName(n)))];
  if (missing.length) {
    if (!preConfirmed && !confirm('등록되지 않은 직원이 있습니다: ' + missing.join(', ') + '\n새로 등록할까요?')) return;
    missing.forEach(n => state.staff.push({ id: uid(), name: n, createdAt: now(), updatedAt: now(), deleted: false }));
  }

  let added = 0, skipped = 0;
  list.forEach(a => {
    const s = staffByName(a.staff);
    if (!s) { skipped++; return; }
    const steps = (a.steps || []).map(x => ({
      id: uid(), label: typeof x === 'string' ? x : String(x.label || '')
    })).filter(x => x.label);
    state.tasks.push({
      id: uid(), groupId: 'ai-' + now(), staffId: s.id,
      title: String(a.title || '').trim() || '(제목 없음)',
      detail: String(a.detail || ''),
      guide: String(a.guide || ''),
      steps: steps,
      target: Number(a.target) || 0,
      unit: String(a.unit || '건'),
      time: String(a.time || ''),
      priority: a.priority === 'high' ? 'high' : 'normal',
      repeat: ['once', 'daily', 'weekday', 'days'].includes(a.repeat) ? a.repeat : 'once',
      days: Array.isArray(a.days) ? a.days.map(Number).filter(n => n >= 0 && n <= 6) : [],
      start: /^\d{4}-\d{2}-\d{2}$/.test(a.start || '') ? a.start : today(),
      end: /^\d{4}-\d{2}-\d{2}$/.test(a.end || '') ? a.end : '',
      carry: a.carry !== false,
      createdAt: now(), updatedAt: now(), deleted: false
    });
    added++;
  });

  save(); queueSync(); closeModal(); render();
  toast(added + '건 등록' + (skipped ? ' · ' + skipped + '건 건너뜀' : ''));
}

/* ══════════════════════════════════════════════════════
   10. 이벤트
   ══════════════════════════════════════════════════════ */
document.addEventListener('click', ev => {
  const goEl = ev.target.closest('[data-go]');
  if (goEl) { go(goEl.dataset.go); return; }

  const el = ev.target.closest('[data-act]');
  if (!el) return;
  if (el.dataset.act === 'closemodal'
      && ev.target.closest('.modal-box')
      && !ev.target.closest('button[data-act="closemodal"]')) return;

  const act = el.dataset.act;
  const id = el.dataset.id;
  const date = el.dataset.date || cursor;
  const task = () => state.tasks.find(x => x.id === id);

  switch (act) {

    /* 잠금 */
    case 'setpin': {
      const v = ($('#pin').value || '').trim();
      if (v.length < 4) return toast('4자리 이상 입력해 주세요');
      state.settings.adminPin = v; save(); session.unlock(); go('staff'); toast('설정되었습니다');
      break;
    }
    case 'login': {
      if (($('#pin').value || '').trim() !== state.settings.adminPin) return toast('비밀번호가 다릅니다');
      session.unlock(); render(); toast('환영합니다');
      break;
    }
    case 'logout': session.lock(); render(); break;
    case 'changepin': {
      const v = ($('#newPin').value || '').trim();
      if (v.length < 4) return toast('4자리 이상 입력해 주세요');
      state.settings.adminPin = v; save(); toast('변경되었습니다');
      break;
    }

    /* 날짜 */
    case 'day':  cursor = addDays(cursor, Number(el.dataset.n)); cursorPinned = (cursor !== today()); render(); break;
    case 'week': cursor = addDays(cursor, Number(el.dataset.n) * 7); cursorPinned = (mondayOf(cursor) !== mondayOf(today())); render(); break;

    /* 체크 · 단계 · 수량 · 막힘 */
    case 'toggle': {
      const t = task(); if (!t) break;
      const c = getCheck(id, date);
      const turnOn = !(c && c.done);
      const steps = {};
      (t.steps || []).forEach(s => { steps[s.id] = turnOn; });
      setCheck(id, date, {
        done: turnOn, at: turnOn ? now() : null,
        steps: steps,
        count: t.target ? (turnOn ? t.target : 0) : ((c && c.count) || 0),
        blocked: turnOn ? false : (c ? c.blocked : false)
      });
      render();
      break;
    }
    case 'step': {
      const t = task(); if (!t) break;
      const c = getCheck(id, date);
      const cur = Object.assign({}, (c && c.steps) || {});
      const k = el.dataset.step;
      cur[k] = !cur[k];
      setCheck(id, date, { steps: cur, blocked: false });
      syncAuto(t, date);
      render();
      break;
    }
    case 'cnt': {
      const t = task(); if (!t) break;
      const c = getCheck(id, date);
      const n = Math.max(0, ((c && c.count) || 0) + Number(el.dataset.n));
      setCheck(id, date, { count: n, blocked: false });
      syncAuto(t, date);
      render();
      break;
    }
    case 'block': {
      const c = getCheck(id, date);
      const on = !(c && c.blocked);
      setCheck(id, date, { blocked: on, done: on ? false : (c ? c.done : false) });
      render();
      toast(on ? '원장님 화면에 표시됩니다' : '막힘을 해제했습니다');
      break;
    }
    case 'panel': {
      const k = id + '|' + date;
      openPanels.has(k) ? openPanels.delete(k) : openPanels.add(k);
      render();
      break;
    }

    /* 직원 */
    case 'pickstaff': viewStaff = id; render(); break;
    case 'openstaff': viewStaff = id; go('today'); break;
    case 'addstaff': {
      const name = ($('#sName').value || '').trim();
      if (!name) return toast('이름을 입력해 주세요');
      state.staff.push({ id: uid(), name: name, createdAt: now(), updatedAt: now(), deleted: false });
      save(); queueSync(); render(); toast(name + ' 등록 완료');
      break;
    }
    case 'delstaff': {
      const s = staffById(id);
      if (!s || !confirm(s.name + ' 님을 삭제할까요? 지시 기록은 남습니다.')) return;
      s.deleted = true; s.updatedAt = now();
      save(); queueSync(); render();
      break;
    }
    case 'copylink': copy(staffLink(id)); break;
    case 'alllinks': copy(liveStaff().map(s => s.name + '\n' + staffLink(s.id)).join('\n\n')); break;
    case 'adminlink': {
      const url = location.origin + location.pathname + '?s=' +
        b64(JSON.stringify({ u: state.settings.syncUrl, k: state.settings.syncSecret || '' }));
      copy(url);
      break;
    }
    case 'orderText': showText('카카오톡 지시서 문구', orderText(id, cursor)); break;
    case 'report': showText('오늘 수행 보고', reportText(currentStaff().id, cursor)); break;
    case 'brief': showText('오늘 마감 브리핑', briefText(cursor)); break;
    case 'copytext': copy($('#mText').value); break;
    case 'managetasks': manageTasks(id); break;
    case 'newtask': editTaskModal(null); break;

    /* 빠른 추가 — 한 줄로 쓰고 바로 카톡 문구까지 */
    case 'qadd': {
      const line = ($('#qAdd').value || '').trim();
      if (!line) return toast('내용을 입력해 주세요');
      const me = currentStaff();
      if (!me) return toast('직원을 먼저 선택해 주세요');
      const p = parseInstructions(line)[0];
      const t = {
        id: uid(), groupId: 'quick-' + now(), staffId: me.id,
        title: p.title, detail: '', guide: '', steps: [], target: 0, unit: '건',
        time: p.time, priority: p.priority,
        repeat: 'once', days: [], start: p.start, end: '', carry: true,
        origin: actor(), createdAt: now(), updatedAt: now(), deleted: false
      };
      state.tasks.push(t);
      save(); queueSync(); render();
      toast(me.name + ' — 추가했습니다');
      if (!session.isStaffLink) {
        setTimeout(() => showText('카톡으로 보낼 문구', quickText(t)), 300);
      }
      break;
    }

    /* 카톡 문장 붙여넣기 */
    case 'kopen': kakaoText = ''; kakaoParsed = null; kakaoModal(); break;
    case 'kparse': {
      kakaoText = $('#kText').value || '';
      kakaoParsed = parseInstructions(kakaoText);
      kakaoModal();
      break;
    }
    case 'kapply': {
      pendingAdd = kakaoParsed;
      kakaoParsed = null; kakaoText = '';
      closeModal(); render();
      break;
    }
    case 'etask': {
      const t = task();
      if (!t) break;
      if (!canEditTask(t)) return toast('원장님이 내린 지시는 수정할 수 없습니다');
      editTaskModal(id);
      break;
    }
    case 'edelete': {
      const t = state.tasks.find(x => x.id === eForm.id);
      if (!t) break;
      if (!canEditTask(t)) { closeModal(); return toast('원장님이 내린 지시는 중단할 수 없습니다'); }
      if (!confirm('이 업무를 중단할까요? 지난 기록은 유지됩니다.')) return;
      t.deleted = true; t.updatedAt = now();
      eForm = null;
      save(); queueSync(); closeModal(); render(); toast('중단했습니다');
      break;
    }
    case 'erepeat': {
      eForm.repeat = el.dataset.v;
      document.querySelectorAll('#eRepeat .chip').forEach(c => c.classList.toggle('on', c.dataset.v === eForm.repeat));
      $('#eDaysWrap').style.display = eForm.repeat === 'days' ? '' : 'none';
      break;
    }
    case 'edow': {
      const d = Number(el.dataset.d), i = eForm.days.indexOf(d);
      if (i < 0) eForm.days.push(d); else eForm.days.splice(i, 1);
      el.classList.toggle('on');
      break;
    }
    case 'ecarry': {
      eForm.carry = !eForm.carry;
      el.classList.toggle('on', eForm.carry);
      el.textContent = (eForm.carry ? '☑' : '☐') + ' 못 끝내면 다음날로 이월';
      break;
    }
    case 'esave': saveEditedTask(); break;
    case 'deltask': {
      const t = task();
      if (!t || !confirm('이 지시를 중단할까요? 지난 기록은 유지됩니다.')) return;
      t.deleted = true; t.updatedAt = now();
      save(); queueSync(); closeModal(); render(); toast('중단했습니다');
      break;
    }

    /* AI 가져오기 */
    case 'aiopen': aiModal(); break;
    case 'aisample': $('#aiText').value = AI_SAMPLE; break;
    case 'aiapply': applyAssignments($('#aiText').value || ''); break;
    case 'padd': { const p = pendingAdd; pendingAdd = null; applyAssignments(p, true); go('today'); break; }
    case 'pcancel': pendingAdd = null; render(); toast('취소했습니다'); break;

    /* 지시서 작성 */
    case 'wstaff': {
      const i = wForm.staff.indexOf(id);
      if (i < 0) wForm.staff.push(id); else wForm.staff.splice(i, 1);
      el.classList.toggle('on');
      break;
    }
    case 'wrepeat': {
      wForm.repeat = el.dataset.v;
      document.querySelectorAll('#wRepeat .chip').forEach(c => c.classList.toggle('on', c.dataset.v === wForm.repeat));
      $('#wDaysWrap').style.display = wForm.repeat === 'days' ? '' : 'none';
      $('#wEndWrap').style.display  = wForm.repeat === 'once' ? 'none' : '';
      break;
    }
    case 'wdow': {
      const d = Number(el.dataset.d), i = wForm.days.indexOf(d);
      if (i < 0) wForm.days.push(d); else wForm.days.splice(i, 1);
      el.classList.toggle('on');
      break;
    }
    case 'wcarry': { wForm.carry = !wForm.carry; render(); break; }
    case 'wadd': {
      const title = ($('#wTitle').value || '').trim();
      if (!wForm.staff.length) return toast('받는 직원을 선택해 주세요');
      if (!title) return toast('업무 내용을 입력해 주세요');
      if (wForm.repeat === 'days' && !wForm.days.length) return toast('요일을 선택해 주세요');
      wForm.start = $('#wStart').value || today();
      wForm.end = (wForm.repeat === 'once' ? '' : ($('#wEnd').value || ''));
      draft.push({
        title: title,
        detail: ($('#wDetail').value || '').trim(),
        guide: ($('#wGuide').value || '').trim(),
        steps: ($('#wSteps').value || '').split('\n').map(x => x.trim()).filter(Boolean)
                 .map(l => ({ id: uid(), label: l })),
        target: Number($('#wTarget').value) || 0,
        unit: ($('#wUnit').value || '건').trim(),
        time: $('#wTime').value || '',
        priority: $('#wPri').value,
        repeat: wForm.repeat,
        days: wForm.days.slice().sort(),
        start: wForm.start,
        end: wForm.end,
        carry: wForm.carry,
        staffIds: wForm.staff.slice(),
        names: wForm.staff.map(x => (staffById(x) || {}).name).filter(Boolean)
      });
      render();
      toast('목록에 담았습니다 (' + draft.length + '건)');
      break;
    }
    case 'wdel': draft.splice(Number(el.dataset.i), 1); render(); break;
    case 'wclear': draft = []; render(); break;
    case 'wpublish': {
      if (!draft.length) return;
      const gid = uid(), touched = new Set();
      draft.forEach(d => d.staffIds.forEach(sid => {
        state.tasks.push({
          id: uid(), groupId: gid, staffId: sid,
          title: d.title, detail: d.detail, guide: d.guide,
          steps: (d.steps || []).map(s => ({ id: uid(), label: s.label })),
          target: d.target, unit: d.unit,
          time: d.time, priority: d.priority,
          repeat: d.repeat, days: d.days, start: d.start, end: d.end, carry: d.carry,
          createdAt: now(), updatedAt: now(), deleted: false
        });
        touched.add(sid);
      }));
      const n = draft.length;
      draft = [];
      save(); queueSync(); render();
      toast(n + '건 발행 완료');
      const first = [...touched][0];
      if (first) setTimeout(() => showText('카카오톡 지시서 문구', orderText(first, today())), 400);
      break;
    }

    /* 설정 */
    case 'savecfg': {
      state.settings.syncUrl = ($('#cfgUrl').value || '').trim();
      state.settings.syncSecret = ($('#cfgSecret').value || '').trim();
      save(); render(); toast('저장했습니다');
      if (state.settings.syncUrl) { sync.loud = true; sync.run(); }
      break;
    }
    case 'syncnow': sync.loud = true; sync.run(); toast('동기화 중…'); break;
    case 'export': {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'wb-업무지시서-' + today() + '.json';
      a.click(); URL.revokeObjectURL(a.href);
      break;
    }
    case 'import': {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = 'application/json';
      inp.onchange = () => {
        const f = inp.files[0]; if (!f) return;
        const r = new FileReader();
        r.onload = () => {
          try {
            const p = JSON.parse(r.result);
            if (!p || !Array.isArray(p.staff)) throw new Error('형식 오류');
            if (!confirm('현재 데이터를 덮어씁니다. 계속할까요?')) return;
            state = Object.assign(blankState(), p);
            save(); render(); toast('불러왔습니다');
          } catch (e) { toast('파일을 읽을 수 없습니다'); }
        };
        r.readAsText(f);
      };
      inp.click();
      break;
    }
    case 'closemodal': closeModal(); break;
  }
});

/* 메모 · 수량 직접 입력 */
let inputTimer = null;
document.addEventListener('input', ev => {
  const noteEl = ev.target.closest('[data-act="note"]');
  if (noteEl) {
    clearTimeout(inputTimer);
    inputTimer = setTimeout(() => {
      setCheck(noteEl.dataset.id, noteEl.dataset.date || cursor, { note: noteEl.value });
      toast('메모 저장됨');
    }, 700);
    return;
  }
  const cntEl = ev.target.closest('[data-act="cntset"]');
  if (cntEl) {
    clearTimeout(inputTimer);
    inputTimer = setTimeout(() => {
      const t = state.tasks.find(x => x.id === cntEl.dataset.id);
      const d = cntEl.dataset.date || cursor;
      setCheck(cntEl.dataset.id, d, { count: Math.max(0, Number(cntEl.value) || 0), blocked: false });
      if (t) syncAuto(t, d);
      render();
    }, 600);
  }
});

/* 엔터 제출 */
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Enter') return;
  const t = ev.target;
  if (t.id === 'pin')   document.querySelector('[data-act="setpin"],[data-act="login"]')?.click();
  if (t.id === 'sName') document.querySelector('[data-act="addstaff"]')?.click();
  if (t.id === 'qAdd')  document.querySelector('[data-act="qadd"]')?.click();
});

/* 복귀 시 최신화 */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (!cursorPinned && cursor !== today()) { cursor = today(); render(); }
  sync.run();
});

/* ══════════════════════════════════════════════════════
   11. 시작
   ══════════════════════════════════════════════════════ */
load();
absorbLinkParams();
const h = location.hash.replace('#/', '');
if (h) route = h;
if (session.isStaffLink && !['today', 'week'].includes(route)) route = 'today';
render();

if (sync.enabled()) {
  sync.run();
  setInterval(() => sync.run(), 45000);
}
</script>
