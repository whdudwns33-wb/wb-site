function guardianOpsKey(target) {
  return [target.eventType, target.sourceId, Number(target.revision)].join('|');
}

function guardianOpsDomId(target) {
  return 'guardianOps-' + String(target.eventType) + '-' + String(target.sourceId) + '-' + Number(target.revision);
}

function guardianOpsTargetForMakeup(caseId) {
  const row = makeupRows.find(item => item.caseId === String(caseId || ''));
  const eventType = row && ({ proposal: 'makeup_proposal', confirmed: 'makeup_confirmed', cancelled: 'makeup_cancelled' }[row.notificationEvent]);
  const revision = Number(row && row.notificationEventRevision);
  if (!row || !row.notificationNeeded || !eventType || !Number.isInteger(revision) || revision < 1) return null;
  return { kind: 'makeup', eventType: eventType, sourceId: row.caseId, revision: revision, studentName: row.studentName || '학생' };
}

function guardianOpsTargetForSession(packId) {
  const pack = sessionPackRows.find(item => item.packId === String(packId || ''));
  const revision = Number(pack && pack.revision);
  if (!pack || pack.status !== 'active' || !Number.isInteger(revision) || revision < 1) return null;
  return { kind: 'session', eventType: 'session_balance', sourceId: pack.packId, revision: revision, studentName: pack.studentName || '학생' };
}

function guardianOpsStateText(state, emptyText) {
  if (!state) return { cls: '', text: emptyText || '수동 접수 전' };
  if (state.kind === 'checking') return { cls: ' is-ready', text: '알림톡 상태 확인 중…' };
  if (state.kind === 'sending') return { cls: ' is-ready', text: '알림톡 요청 접수 중…' };
  if (state.kind === 'accepted') return { cls: ' is-accepted', text: state.idempotent
    ? '이미 접수된 동일 이벤트입니다' : '알림톡 요청 접수' };
  if (state.kind === 'rejected') return { cls: ' is-rejected', text: '알림톡 요청 거절 · 다시 확인 필요' };
  if (state.kind === 'unknown') return { cls: ' is-unknown', text: '알림톡 접수 여부 불명 · 확인 전 재요청 금지' };
  if (state.kind === 'ready') return { cls: ' is-ready', text: '상태 확인 완료 · 아직 접수하지 않음' };
  return { cls: '', text: GUARDIAN_OPS_BLOCKER_TEXT[state.code] || '알림톡 상태를 확인해 주세요' };
}

function guardianOpsStatusHtml(target, emptyText) {
  const status = guardianOpsStateText(guardianOpsSendStates.get(guardianOpsKey(target)), emptyText);
  return '<span class="guardian-ops-status' + status.cls + '" id="' + esc(guardianOpsDomId(target)) +
    '" role="status" aria-live="polite" aria-atomic="true">' + esc(status.text) + '</span>';
}

function guardianOpsButtonHtml(target, action, label) {
  if (!GUARDIAN_CONTACT_ENABLED) return '';
  const state = guardianOpsSendStates.get(guardianOpsKey(target));
  const busy = state && (state.kind === 'checking' || state.kind === 'sending');
  return '<button class="btn btn-sm btn-ghost" data-act="' + action + '" data-guardian-ops ' +
    (target.kind === 'makeup' ? 'data-case="' : 'data-pack="') + esc(target.sourceId) + '" aria-describedby="' +
    esc(guardianOpsDomId(target)) + '"' + (busy ? ' disabled' : '') + '>' + esc(label) + '</button>';
}

function repaintGuardianOpsTarget(target) {
  if (target.kind === 'makeup') rememberMakeupFocus(target.sourceId, 'guardianopsmakeup');
  else rememberSessionPackFocus(target.sourceId, 'opssessionnotice');
  if ((target.kind === 'makeup' && route === 'makeup') || (target.kind === 'session' && route === 'sessions')) render();
}

function setGuardianOpsState(target, state) {
  guardianOpsSendStates.set(guardianOpsKey(target), state);
  repaintGuardianOpsTarget(target);
}

function guardianOpsPreviewState(preview) {
  const blocker = String(preview && preview.blocker || '');
  if (blocker === 'ALREADY_ACCEPTED' || (preview && preview.prior && preview.prior.status === 'accepted')) {
    return { kind: 'accepted', idempotent: true };
  }
  if (blocker === 'PRIOR_SEND_UNCERTAIN' || (preview && preview.prior && ['dispatching', 'unknown'].includes(preview.prior.status))) {
    return { kind: 'unknown', code: blocker || 'PRIOR_SEND_UNCERTAIN' };
  }
  if (!preview || preview.ready !== true) return { kind: 'blocked', code: blocker || 'PREVIEW_NOT_READY' };
  return null;
}

async function requestGuardianOpsSend(target) {
  if (!GUARDIAN_CONTACT_ENABLED) return toast('학부모 알림톡 기능은 현재 사용하지 않습니다');
  if (!session.isAdmin || !target) return;
  const auth = sync.auth();
  if (!auth) return toast('동기화 인증이 필요합니다');
  setGuardianOpsState(target, { kind: 'checking' });
  let preview;
  try {
    const result = await sync.post('/guardian-ops-send', {
      app: SYNC_APP, auth: auth, action: 'preview', eventType: target.eventType,
      sourceId: target.sourceId, revision: Number(target.revision)
    });
    preview = result.preview;
  } catch (error) {
    if (error && error.personAuthHandled) return;
    setGuardianOpsState(target, { kind: 'blocked', code: String(error && error.code || 'PREVIEW_FAILED') });
    return toast('알림톡 상태를 확인하지 못했습니다 — 접수하지 않았습니다');
  }

  const stopped = guardianOpsPreviewState(preview);
  if (stopped) {
    setGuardianOpsState(target, stopped);
    if (stopped.kind === 'accepted') toast('이미 접수된 동일 이벤트입니다');
    else if (stopped.kind === 'unknown') toast('접수 여부 확인 전에는 다시 요청할 수 없습니다');
    else toast(GUARDIAN_OPS_BLOCKER_TEXT[stopped.code] || '알림톡 준비 상태를 확인해 주세요');
    return;
  }

  const eventLabel = GUARDIAN_OPS_EVENT_LABELS[target.eventType] || '보호자 운영 안내';
  const retryText = preview.retryAllowed ? '이전 요청이 거절되어 같은 상태를 다시 접수합니다.\n' : '';
  if (!confirm(retryText + target.studentName + ' · ' + eventLabel + ' 알림톡 요청을 접수할까요?\n' +
      '카카오 접수 비용이 발생할 수 있으며, 보호자가 확인했다는 뜻은 아닙니다.')) {
    setGuardianOpsState(target, { kind: 'ready' });
    return;
  }

  setGuardianOpsState(target, { kind: 'sending' });
  try {
    const result = await sync.post('/guardian-ops-send', {
      app: SYNC_APP, auth: auth, action: 'send', eventType: target.eventType,
      sourceId: target.sourceId, revision: Number(target.revision)
    });
    setGuardianOpsState(target, { kind: 'accepted', idempotent: !!result.idempotent });
    toast(result.idempotent ? '이미 접수된 동일 이벤트입니다' : '알림톡 요청이 접수됐습니다');
  } catch (error) {
    if (error && error.personAuthHandled) return;
    const status = Number(error && error.status);
    const code = String(error && error.code || '');
    if (status === 202 || code === 'PRIOR_SEND_UNCERTAIN') {
      setGuardianOpsState(target, { kind: 'unknown', code: code });
      toast('알림톡 접수 여부를 확인해 주세요 — 확인 전 재요청하지 않습니다');
    } else if (status === 502 || /_BEFORE_DISPATCH$/.test(code)) {
      setGuardianOpsState(target, { kind: 'rejected', code: code });
      toast('알림톡 요청이 거절됐습니다 — 상태를 확인해 주세요');
    } else {
      setGuardianOpsState(target, { kind: 'blocked', code: code || 'SEND_BLOCKED' });
      toast(GUARDIAN_OPS_BLOCKER_TEXT[code] || '알림톡 요청을 접수하지 않았습니다 — 준비 상태를 확인해 주세요');
    }
  }
}

// 회차 카드는 운영 알림 공통 흐름을 이 세 도우미로만 연결한다.
const opsSessionTarget = guardianOpsTargetForSession;
const opsActionButtonHtml = guardianOpsButtonHtml;
const opsNoticeStatusHtml = guardianOpsStatusHtml;

/* ── 회차제 수업 — 월제는 행을 만들지 않고, 지정한 학생·수업만 서버 원장을 본다. ── */
const SESSION_PACK_EVENTS = {
  present: '출석', late: '지각', approved_absence: '사전 인정 결석', same_day: '당일 취소',
  no_show: '무단결석', academy_cancel: '학원 휴강', makeup_completed: '보강 완료', manual_adjustment: '관리자 조정'
};
const SESSION_PACK_ADJUST_REASONS = [
  ['correction', '오입력 정정'], ['carryover', '이월 반영'], ['manual_credit', '회차 복원'],
  ['manual_charge', '회차 추가 차감'], ['other', '기타 운영 조정']
];

function sessionPackDaysLeft(expiresOn) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(expiresOn || ''))) return -9999;
  return Math.round((parseYmd(expiresOn) - parseYmd(today())) / 86400000);
}

function sessionPackIsAttention(pack) {
  if (!pack || pack.status !== 'active') return false;
  const days = sessionPackDaysLeft(pack.expiresOn);
  return Number(pack.remainingSessions) <= 3 || pack.expired || days <= 14;
}

function sessionPackAttentionCount() {
  return sessionPackRows.filter(sessionPackIsAttention).length;
}

const SESSION_MODE_BADGE_ROUTES = new Set(['today', 'schedule']);

function sessionModeRouteVisible() {
  return route === 'sessions' || SESSION_MODE_BADGE_ROUTES.has(route);
}

function sessionModeLessonTask(task) {
  return isSessionLessonTask(task);
}

function sessionPackForLessonTask(task) {
  if (!sessionModeLessonTask(task)) return null;
  return sessionPackRows.find(pack => pack && pack.status === 'active' &&
    String(pack.lessonTaskId || '') === String(task.id || '')) || null;
}

const SESSION_PACK_ATTENDANCE_CUTOFF_MINUTE = 23 * 60 + 50;
const SESSION_PACK_ABSENCE_OPTIONS = [
  ['approved_absence', '사전 인정 결석 · 비차감'], ['same_day', '당일 취소 · 1회 차감'],
  ['no_show', '무단결석 · 1회 차감'], ['academy_cancel', '학원 휴강 · 비차감']
];

function sessionPackAttendanceState(task, date) {
  const pack = sessionPackForLessonTask(task);
  if (!pack || date < String(pack.validFrom || '') || date > String(pack.expiresOn || '')) return null;
  const sourceKey = String(task.id || '') + '|' + String(date || '');
  const reflected = (pack.usage || []).some(row => row && row.sourceType === 'regular' && row.sourceKey === sourceKey);
  const current = seoulNowParts();
  const cutoffReached = date < current.date || (date === current.date && current.minute >= SESSION_PACK_ATTENDANCE_CUTOFF_MINUTE);
  return { pack, reflected, cutoffReached, locked: reflected || cutoffReached };
}

function sessionPackAttendanceHintHtml(task, date, check, attendanceState) {
  if (!attendanceState) return '';
  const locked = attendanceState.locked;
  const absence = check && check.att === 'A'
    ? '<label class="field mt8"><span class="fl">결석 차감 유형</span><select class="in" data-session-pack-absence data-id="' + esc(task.id) + '" data-date="' + esc(date) + '"' +
      (locked ? ' disabled' : '') + '><option value="">유형 선택</option>' + SESSION_PACK_ABSENCE_OPTIONS.map(item =>
        '<option value="' + item[0] + '"' + (String(check.absenceType || '') === item[0] ? ' selected' : '') + '>' + item[1] + '</option>').join('') +
      '</select></label>' : '';
  const message = locked
    ? (attendanceState.reflected ? '당일 23:50 기준 출결이 회차 원장에 반영되어 마감됐습니다.' : '당일 출결 변경 가능 시간이 23:50에 마감됐습니다.')
    : '회차제 출결은 당일 23:50에 자동 반영됩니다. 그 전까지 출결 상태와 결석 차감 유형을 변경할 수 있습니다.';
  return absence + '<div class="small muted mt8">' + message + '</div>';
}

function sessionPackAlertInfo(pack) {
  if (!pack || pack.status !== 'active') return null;
  const remaining = Math.max(0, Number(pack.remainingSessions) || 0);
  const hasValidExpiry = /^\d{4}-\d{2}-\d{2}$/.test(String(pack.expiresOn || ''));
  const days = hasValidExpiry ? sessionPackDaysLeft(pack.expiresOn) : -9999;
  if (!hasValidExpiry) return { text: '유효기간 확인 필요', cls: 'is-critical' };
  if (remaining <= 0) return { text: '잔여 0회 · 재등록 전 수업 여부 확인', cls: 'is-critical' };
  if (pack.expired || days < 0) return { text: '유효기간 만료 · 연장 확인', cls: 'is-critical' };
  if (remaining === 1) return { text: '잔여 1회 · 보호자 안내 검토', cls: 'is-critical' };
  if (remaining <= 3) return { text: '잔여 3회 이하 · 연장 일정 확인', cls: 'is-warn' };
  if (days <= 14) return { text: '만료 ' + Math.max(0, days) + '일 전 · 연장 일정 확인', cls: 'is-warn' };
  return null;
}

function sessionModeBadgeDescriptor(task) {
  if (!sessionModeLessonTask(task)) return null;
  if (!sessionPackLoaded) return { text: '수업 형태 확인 중', cls: '' };
  if (sessionPackError) return { text: '수업 형태 확인 필요', cls: 'is-error' };
  const pack = sessionPackForLessonTask(task);
  if (!pack) return { text: '월제', cls: 'is-monthly' };
  const remaining = Math.max(0, Number(pack.remainingSessions) || 0);
  const alert = sessionPackAlertInfo(pack);
  return {
    text: '회차제 · ' + remaining + '회 남음',
    cls: 'is-session' + (alert ? ' ' + alert.cls : ''),
    title: alert ? alert.text : ''
  };
}

function sessionModeBadgeHtml(task) {
  if (!session.isAdmin) return '';
  const badge = sessionModeBadgeDescriptor(task);
  return badge ? '<span class="tag session-mode-badge ' + badge.cls + '"' +
    (badge.title ? ' title="' + esc(badge.title) + '" aria-label="' + esc(badge.text + ' · ' + badge.title) + '"' : '') +
    '>' + esc(badge.text) + '</span>' : '';
}

function sessionModeBadgesHtml(tasks) {
  const badges = new Map();
  (tasks || []).filter(sessionModeLessonTask).forEach(task => {
    const descriptor = sessionModeBadgeDescriptor(task);
    if (descriptor) badges.set(descriptor.text + '|' + descriptor.cls, sessionModeBadgeHtml(task));
  });
  return Array.from(badges.values()).join('');
}

function sessionModeBadgesForStudent(studentId, referenceDate) {
  const reference = referenceDate || today();
  return sessionModeBadgesHtml(state.tasks.filter(task => sessionModeLessonTask(task) &&
    String(task.studentId || '') === String(studentId || '') &&
    (!task.start || task.start <= reference) && (!task.end || task.end >= reference)));
}

function ensureSessionModeData(tasks) {
  if (!(tasks || []).some(sessionModeLessonTask) || sessionPackLoaded || sessionPackLoading) return;
  setTimeout(() => loadSessionPacks(false), 0);
}

function rememberSessionPackFocus(packId, act) {
  sessionPackRestoreFocus = packId ? { packId: String(packId), act: String(act || '') } : null;
}

function restoreSessionPackFocus() {
  const saved = sessionPackRestoreFocus;
  sessionPackRestoreFocus = null;
  if (!saved) return false;
  const selector = '[data-session-pack="' + saved.packId + '"]';
  const card = document.querySelector(selector);
  const target = card && (saved.act ? card.querySelector('[data-act="' + saved.act + '"]') : null);
  if (target) target.focus({ preventScroll: true });
  else if (card) card.focus({ preventScroll: true });
  return !!(target || card);
}

function replaceSessionPack(pack) {
  if (!pack || !pack.packId) return;
  const index = sessionPackRows.findIndex(row => row.packId === pack.packId);
  if (index < 0) sessionPackRows.push(pack); else sessionPackRows[index] = pack;
  sessionPackLoaded = true;
  sessionPackError = '';
}

async function loadSessionPacks(force) {
  if (sessionPackLoading || (sessionPackLoaded && !force)) return;
  const auth = sync.auth();
  if (!auth) {
    sessionPackError = '동기화 인증이 필요합니다'; sessionPackLoaded = true;
    if (sessionModeRouteVisible()) render();
    return;
  }
  sessionPackLoading = true; sessionPackError = '';
  if (sessionModeRouteVisible()) render();
  try {
    const result = await sync.post('/session-pack', { app: SYNC_APP, auth: auth, action: 'list' });
    sessionPackRows = Array.isArray(result.packs) ? result.packs : [];
    sessionPackLoaded = true;
  } catch (error) {
    sessionPackError = String(error && error.message || error);
    sessionPackLoaded = true;
  } finally {
    sessionPackLoading = false;
    if (sessionModeRouteVisible()) renderAfterSync();
  }
}

function sessionPackLessonOptions() {
  return state.tasks.filter(task => task.studentId && isSessionLessonTask(task))
    .sort((a, b) => String(a.studentName || '').localeCompare(String(b.studentName || ''), 'ko') ||
      String(a.subject || a.className || '').localeCompare(String(b.subject || b.className || ''), 'ko'));
}

function sessionPackCreateHtml() {
  if (!session.isAdmin) return '';
  const lessons = sessionPackLessonOptions();
  return '<section class="card"><div class="card-title">회차제 수업 지정</div>' +
    '<div class="card-sub">학생 전체가 아니라 학생·수업 조합에만 적용합니다. 지정하지 않은 월제 수업은 아래 목록에 나타나지 않습니다.</div>' +
    '<div class="session-pack-create"><label class="field"><span class="fl">학생·수업</span><select class="in" id="spLesson">' +
      '<option value="">수업 선택</option>' + lessons.map(task => '<option value="' + esc(task.id) + '">' +
        esc(task.studentName || '학생 미확인') + ' · ' + esc([task.grade, task.subject, task.className].filter(Boolean).join(' · ') || '수업') + '</option>').join('') +
      '</select></label><label class="field"><span class="fl">총 횟수</span><input class="in" id="spTotal" type="number" min="1" max="200" value="8" inputmode="numeric"></label>' +
      '<label class="field"><span class="fl">시작일</span><input class="in" id="spFrom" type="date" value="' + today() + '"></label>' +

      '<button class="btn btn-primary" data-act="spcreate"' + (lessons.length ? '' : ' disabled') + '>회차제 지정</button></div>' +

}

function sessionPackKpis(rows) {
  const active = rows.filter(pack => pack.status === 'active');
  const low3 = active.filter(pack => Number(pack.remainingSessions) > 0 && Number(pack.remainingSessions) <= 3).length;
  const low1 = active.filter(pack => Number(pack.remainingSessions) > 0 && Number(pack.remainingSessions) <= 1).length;
  const zero = active.filter(pack => Number(pack.remainingSessions) <= 0).length;
  const expiring = active.filter(pack => pack.expired || sessionPackDaysLeft(pack.expiresOn) <= 14).length;
  return '<div class="ops-kpis" aria-label="회차제 수업 요약">' +
    '<div class="ops-kpi' + (low3 ? ' is-alert' : '') + '"><b>' + low3 + '</b><span>잔여 3회 이하</span></div>' +
    '<div class="ops-kpi' + (low1 ? ' is-alert' : '') + '"><b>' + low1 + '</b><span>잔여 1회 이하</span></div>' +
    '<div class="ops-kpi' + (zero ? ' is-alert' : '') + '"><b>' + zero + '</b><span>잔여 0회</span></div>' +
    '<div class="ops-kpi' + (expiring ? ' is-alert' : '') + '"><b>' + expiring + '</b><span>14일 내 만료·경과</span></div></div>';
}

function sessionPackModeKpis(rows) {
  const reference = today();
  const lessonIds = new Set(sessionPackLessonOptions()
    .filter(task => (!task.start || task.start <= reference) && (!task.end || task.end >= reference))
    .map(task => String(task.id || '')));
  const activePackIds = new Set(rows.filter(pack => pack.status === 'active' && lessonIds.has(String(pack.lessonTaskId || '')))
    .map(pack => String(pack.lessonTaskId || '')));
  const monthly = Array.from(lessonIds).filter(id => !activePackIds.has(id)).length;
  return '<div class="ops-kpis session-mode-kpis" aria-label="수업 운영 방식 요약">' +
    '<div class="ops-kpi"><b>' + monthly + '</b><span>월제 학생·수업</span></div>' +
    '<div class="ops-kpi"><b>' + activePackIds.size + '</b><span>회차제 학생·수업</span></div></div>';
}

function sessionPackHistoryHtml(pack) {
  const usage = Array.isArray(pack.usage) ? pack.usage.slice().reverse() : [];
  if (!usage.length) return '';
  return '<details class="session-pack-history"><summary>사용·조정 내역 ' + usage.length + '건</summary>' +
    usage.slice(0, 20).map(row => '<div class="session-pack-history-row"><span>' +
      esc(row.sourceDate ? shortDate(row.sourceDate) + ' · ' : '') +
      esc(row.reasonCode === 'early_leave' ? '조퇴' : SESSION_PACK_EVENTS[row.event] || row.event) + '</span><b>' +
      (Number(row.delta) > 0 ? Number(row.delta) + '회 차감' : Number(row.delta) < 0 ? Math.abs(Number(row.delta)) + '회 복원' : '비차감') +
      '</b></div>').join('') + '</details>';
}

function sessionPackOpsNoticeHtml(pack) {
  if (!session.isAdmin || !pack || pack.status !== 'active') return '';
  const target = opsSessionTarget(pack.packId);
  if (!target) return '';
  const attention = sessionPackAlertInfo(pack);
  return '<div class="ops-notice-action">' +
    opsActionButtonHtml(target, 'opssessionnotice', attention ? '잔여 회차 보호자 안내 검토' : '현재 회차 보호자 안내') +
    opsNoticeStatusHtml(target, '자동발송 없음 · 수동 접수 전') + '</div>';
}

function sessionPackStaffRecordHtml(pack) {
  if (!session.isStaffLink || pack.teacherId !== session.staffId || pack.status !== 'active') return '';
  const task = state.tasks.find(row => String(row.id || '') === String(pack.lessonTaskId || ''));
  const check = task && getCheck(pack.lessonTaskId, today());
  const att = check && check.att;
  const labelText = att === 'P' ? '오늘 출석' : att === 'L' ? '오늘 지각' : att === 'A' ? '오늘 결석' : att === 'E' ? '오늘 조퇴' : '오늘 출결 미기록';
  return '<div class="session-pack-record"><div class="between"><b>' + labelText + '</b><span class="pill">' + esc(shortDate(today())) + '</span></div>' +
    (task ? sessionPackAttendanceHintHtml(task, today(), check, sessionPackAttendanceState(task, today())) : '') +
    (!att ? '<div class="small muted mt8">오늘 수업 카드에서 23:50 전까지 출결을 기록해 주세요.</div>' : '') + '</div>';
}

function sessionPackCard(pack) {
  const remaining = Number(pack.remainingSessions) || 0;
  const days = sessionPackDaysLeft(pack.expiresOn);
  const expired = !!pack.expired || days < 0;
  const cls = remaining <= 0 ? ' is-empty' : expired ? ' is-expired' : remaining <= 3 ? ' is-low' : '';
  const attention = sessionPackAlertInfo(pack);
  const status = pack.status === 'closed' ? ['종료', ''] : expired ? ['기간 만료', 'bad'] : days <= 14 ? ['만료 ' + Math.max(0, days) + '일 전', 'warn'] : ['운영 중', ''];
  const adminActions = session.isAdmin && pack.status === 'active'
    ? '<div class="session-pack-actions"><button class="btn btn-sm btn-warn" data-act="spadjust" data-session-pack-action data-pack="' + esc(pack.packId) + '" data-rev="' + Number(pack.revision) + '" data-delta="1">1회 추가 차감</button>' +
      '<button class="btn btn-sm btn-ghost" data-act="spadjust" data-session-pack-action data-pack="' + esc(pack.packId) + '" data-rev="' + Number(pack.revision) + '" data-delta="-1">1회 복원</button>' +
      '<button class="btn btn-sm btn-danger" data-act="spclose" data-session-pack-action data-pack="' + esc(pack.packId) + '" data-rev="' + Number(pack.revision) + '">회차권 종료</button></div>' : '';
  return '<article class="card session-pack-card' + cls + '" tabindex="-1" data-session-pack="' + esc(pack.packId) + '">' +
    '<div class="between"><div><div class="card-title">' + esc(pack.studentName || '학생 연결 확인 필요') + '</div>' +
      '<div class="card-sub">' + esc([pack.grade, pack.lessonLabel].filter(Boolean).join(' · ') || '수업 연결 확인 필요') + '</div></div>' +
      '<span class="pill ' + status[1] + '">' + status[0] + '</span></div>' +
    '<div class="session-pack-balance"><span><b>' + Number(pack.totalSessions) + '</b>총 횟수</span><span><b>' + Number(pack.usedSessions) + '</b>사용</span><span><b>' + remaining + '</b>남음</span></div>' +
    (attention ? '<div class="session-pack-warning ' + attention.cls + '" role="status">' + esc(attention.text) + '</div>' : '') +
    '<div class="small muted">유효기간 ' + esc(pack.validFrom) + ' ~ ' + esc(pack.expiresOn) + ' · 수정본 ' + Number(pack.revision) + '</div>' +
    sessionPackStaffRecordHtml(pack) + adminActions + sessionPackOpsNoticeHtml(pack) + sessionPackHistoryHtml(pack) + '</article>';
}

function viewSessionPacks() {
  if (!sessionPackLoaded && !sessionPackLoading) setTimeout(() => loadSessionPacks(false), 0);
  const rows = sessionPackRows.slice().sort((a, b) =>
    Number(a.status !== 'active') - Number(b.status !== 'active') ||
    Number(sessionPackIsAttention(b)) - Number(sessionPackIsAttention(a)) ||
    Number(a.remainingSessions) - Number(b.remainingSessions) || String(a.studentName || '').localeCompare(String(b.studentName || ''), 'ko'));
  let h = '<section class="card session-pack-hero"><div class="between"><div><div class="card-title">회차제 수업</div>' +
    '<div class="card-sub">보강과 분리된 수업 회차 원장입니다. 지정한 학생·수업만 표시하며 월제 수업은 표시하지 않습니다.</div></div>' +
    '<button class="btn btn-sm btn-ghost" data-act="sprefresh">새로고침</button></div>' +
    '<div class="hint mt8">출석·지각·조퇴 1회, 사전 인정 결석·학원 휴강 0회, 당일 취소·무단결석 1회입니다. 원 결석과 완료 보강은 합쳐 한 번만 차감합니다.</div></section>' +
    sessionPackCreateHtml();
  if (sessionPackLoading && !sessionPackLoaded) return h + '<div class="card"><div class="empty"><b>⏳</b>회차 현황을 불러오는 중입니다.</div></div>';
  if (sessionPackError) h += '<div class="card alert" role="alert"><div class="card-title">회차 현황을 불러오지 못했습니다</div><div class="small">' + esc(sessionPackError) + '</div>' +
    '<button class="btn btn-sm btn-ghost mt14" data-act="sprefresh" autofocus>다시 시도</button></div>';
  if (!sessionPackError) h += sessionPackModeKpis(rows);
  h += sessionPackKpis(rows);
  if (!rows.length) return h + '<div class="card"><div class="empty"><b>🔢</b>지정된 회차제 수업이 없습니다.<br><span class="muted">월제 수업은 정상이며 이 목록에 나타나지 않습니다.</span></div></div>';
  return h + '<div class="session-pack-grid" aria-live="polite">' + rows.map(sessionPackCard).join('') + '</div>';
}

async function createSessionPack(button) {
  if (!session.isAdmin) return toast('원장·관리 담당만 회차제를 지정할 수 있습니다');
  const lessonTaskId = String(($('#spLesson') || {}).value || '');
  const task = state.tasks.find(row => row.id === lessonTaskId && row.studentId);
  const totalSessions = Number(($('#spTotal') || {}).value);
  const validFrom = String(($('#spFrom') || {}).value || '');
  const expiresOn = String(($('#spExpires') || {}).value || '');
  if (!task) return toast('학생과 수업을 선택해 주세요');
  if (!Number.isInteger(totalSessions) || totalSessions < 1 || totalSessions > 200) return toast('총 횟수는 1~200회로 입력해 주세요');
  if (!validFrom || !expiresOn || expiresOn < validFrom) return toast('유효기간을 확인해 주세요');
  const auth = sync.auth();
  if (!auth) return toast('동기화 인증이 필요합니다');
  if (button) button.disabled = true;
  try {
    const result = await sync.post('/session-pack', {
      app: SYNC_APP, auth: auth, action: 'create', studentId: task.studentId, lessonTaskId: task.id,
      totalSessions: totalSessions, validFrom: validFrom, expiresOn: expiresOn, deductionPolicy: 'recommended_v1'
    });
    replaceSessionPack(result.pack);
    rememberSessionPackFocus(result.pack.packId, 'spclose');
    render();
    toast((result.pack.studentName || task.studentName || '학생') + ' 회차제를 지정했습니다');
  } catch (error) {
    toast('회차제 지정 실패 — ' + (error.message || error));
    const select = $('#spLesson'); if (select) select.focus();
  } finally {
    if (button && button.isConnected) button.disabled = false;
  }
}

function sessionPackAdjustmentModal(packId, revision, delta) {
  const pack = sessionPackRows.find(row => row.packId === packId);
  if (!session.isAdmin || !pack || ![1, -1].includes(delta)) return;
  modal((delta > 0 ? '1회 추가 차감' : '1회 복원') + ' — ' + esc(pack.studentName || '학생'),
    '<div class="hint mb14">기존 내역을 수정하지 않고 조정 행을 새로 남깁니다.</div>' +
    '<div class="field"><label class="fl" for="spAdjustReason">조정 사유</label><select class="in" id="spAdjustReason" autofocus>' +
      SESSION_PACK_ADJUST_REASONS.map(item => '<option value="' + item[0] + '">' + item[1] + '</option>').join('') + '</select></div>',
    '<button class="btn btn-primary btn-block mt14" data-act="spadjustsubmit" data-pack="' + esc(packId) + '" data-rev="' + revision + '" data-delta="' + delta + '">조정 기록</button>');
}

async function submitSessionPackAdjustment(button) {
  if (!session.isAdmin) return;
  const packId = String(button.dataset.pack || '');
  const delta = Number(button.dataset.delta);
  const revision = Number(button.dataset.rev);
  const reasonCode = String(($('#spAdjustReason') || {}).value || '');
  const auth = sync.auth();
  if (!auth || !SESSION_PACK_ADJUST_REASONS.some(item => item[0] === reasonCode)) return toast('조정 사유를 선택해 주세요');
  button.disabled = true;
  try {
    const result = await sync.post('/session-pack', {
      app: SYNC_APP, auth: auth, action: 'adjust', packId: packId, revision: revision, delta: delta,
      sourceKey: 'adj_' + uid().replace(/-/g, ''), reasonCode: reasonCode
    });
    replaceSessionPack(result.pack); closeModal(); rememberSessionPackFocus(packId, 'spadjust'); render();
    toast(delta > 0 ? '1회를 추가 차감했습니다' : '1회를 복원했습니다');
  } catch (error) {
    toast('회차 조정 실패 — ' + (error.message || error));
    if (Number(error && error.status) === 409) { sessionPackLoaded = false; loadSessionPacks(true); }
    if (button.isConnected) button.disabled = false;
  }
}

async function closeSessionPack(packId, revision, button) {
  if (!session.isAdmin || !confirm('이 회차권을 종료할까요? 사용·조정 내역은 그대로 보관됩니다.')) return;
  const auth = sync.auth();
  if (!auth) return toast('동기화 인증이 필요합니다');
  if (button) button.disabled = true;
  try {
    const result = await sync.post('/session-pack', { app: SYNC_APP, auth: auth, action: 'close', packId: packId, revision: revision });
    replaceSessionPack(result.pack); rememberSessionPackFocus(packId, ''); render(); toast('회차권을 종료했습니다');
  } catch (error) {
    toast('회차권 종료 실패 — ' + (error.message || error));
    if (Number(error && error.status) === 409) { sessionPackLoaded = false; loadSessionPacks(true); }
    if (button && button.isConnected) button.disabled = false;
  }
}

/* ── 주간 플래너 앞: 보강 확장 기능 ── */
/* ── 보강 — 모든 학생의 결석 수업을 원 수업과 연결해 별도 원장으로 관리한다. ── */
const MAKEUP_STATUS_LABELS = {
  review_pending: '검토 대기', reviewed: '일정 제안 대기', awaiting_parent: '보호자 응답 대기',
  confirmed: '일정 확정', completed: '완료', cancelled: '취소'
};
const MAKEUP_REASON_OPTIONS = [
  ['policy_ineligible', '정책상 보강 없음'], ['already_resolved', '이미 처리'],
  ['parent_declined', '보호자 취소'], ['schedule_unavailable', '일정 불가'],
  ['student_inactive', '수강 종료'], ['other', '기타 운영 사유']
];
const MAKEUP_REASON_LABELS = Object.fromEntries(MAKEUP_REASON_OPTIONS);

function makeupCaseForSource(taskId, date) {
  return makeupRows.find(row => row.sourceTaskId === taskId && row.sourceDate === date) || null;
}

function makeupCreateKey(taskId, date) { return String(taskId || '') + '|' + String(date || ''); }

function makeupRequestHtml(task, date, check) {
  if (!check || check.att !== 'A') return '';
  if (!isMakeupLessonTask(task)) return '';
  const linked = makeupCaseForSource(task.id, date);
  if (linked) return '<div class="row wraprow mt14" style="gap:8px"><button class="btn btn-sm btn-ghost makeup-request" data-go="makeup">보강 · ' +
    esc(MAKEUP_STATUS_LABELS[linked.status] || linked.status) + '</button></div>';
  if (!task.studentId) return '<div class="small muted mt8">결석 출결은 저장됩니다. 보강 자동 검토는 원생 명단의 학생 ID를 이 수업에 연결한 뒤 만들 수 있습니다.</div>';
  const creating = makeupCreateStates.get(makeupCreateKey(task.id, date));
  if (creating && creating.status === 'pending') {
    return '<div class="row wraprow mt14" style="gap:8px"><button class="btn btn-sm btn-ghost makeup-request" disabled>출결 저장 확인 중 · 보강 자동 생성…</button></div>';
  }
  if (creating && creating.status === 'sync_failed') {
    return '<div class="row wraprow mt14" style="gap:8px"><button class="btn btn-sm btn-primary makeup-request" data-act="mucreate" data-id="' +
      esc(task.id) + '" data-date="' + esc(date) + '">동기화 후 다시 시도</button>' +
      '<span class="small muted">출결은 이 기기에 저장됨 · 서버 동기화 후 보강 검토를 만듭니다.</span></div>';
  }
  if (creating && creating.status === 'create_failed') {
    return '<div class="row wraprow mt14" style="gap:8px"><button class="btn btn-sm btn-primary makeup-request" data-act="mucreate" data-id="' +
      esc(task.id) + '" data-date="' + esc(date) + '">보강 검토 다시 시도</button>' +
      '<span class="small muted">출결 저장됨 · 보강 검토 생성 실패</span></div>';
  }
  return '<div class="row wraprow mt14" style="gap:8px"><button class="btn btn-sm btn-primary makeup-request" data-act="mucreate" data-id="' +
    esc(task.id) + '" data-date="' + esc(date) + '">보강 검토 요청</button>' +
    '<span class="small muted">결석 출결을 서버에 저장한 뒤 요청됩니다.</span></div>';
}

function makeupIsDelayed(row, date) {
  if (!row || ['completed', 'cancelled'].includes(row.status)) return false;
  const due = row.status === 'confirmed' ? row.confirmedDate :
    row.status === 'awaiting_parent' ? row.proposedDate : row.sourceDate;
  return /^\d{4}-\d{2}-\d{2}$/.test(String(due || '')) && due < date;
}

function makeupKpiCounts(rows, date) {
  const active = rows.filter(row => !['completed', 'cancelled'].includes(row.status));
  return {
    review: active.filter(row => row.status === 'review_pending').length,
    awaiting: active.filter(row => row.status === 'awaiting_parent').length,
    confirmed: active.filter(row => row.status === 'confirmed').length,
    today: active.filter(row => (row.confirmedDate || row.proposedDate) === date).length,
    overdue: active.filter(row => makeupIsDelayed(row, date)).length,
    notification: rows.filter(row => row.notificationNeeded).length
  };
}

function makeupAttentionCount() {
  return makeupRows.filter(row => row.notificationNeeded || makeupIsDelayed(row, today()) ||
    ['review_pending', 'reviewed', 'awaiting_parent'].includes(row.status)).length;
}

function rememberMakeupFocus(caseId, act) {
  makeupRestoreFocus = caseId ? { caseId: String(caseId), act: String(act || '') } : null;
}

function restoreMakeupFocus() {
  const saved = makeupRestoreFocus;
  makeupRestoreFocus = null;
  if (!saved) return false;
  const card = document.querySelector('[data-makeup-case="' + CSS.escape(saved.caseId) + '"]');
  const target = card && (saved.act ? card.querySelector('[data-act="' + saved.act + '"]') : null);
  if (target) target.focus({ preventScroll: true });
  else if (card) card.focus({ preventScroll: true });
  return !!(target || card);
}

function replaceMakeup(row) {
  if (!row || !row.caseId) return;
  const index = makeupRows.findIndex(item => item.caseId === row.caseId);
  if (index < 0) makeupRows.push(row); else makeupRows[index] = row;
  makeupLoaded = true; makeupError = '';
}

async function loadMakeups(force) {
  if (makeupLoading || (makeupLoaded && !force)) return;
  const auth = sync.auth();
  if (!auth) {
    makeupError = '동기화 인증이 필요합니다'; makeupLoaded = true;
    if (route === 'makeup') render();
    return;
  }
  makeupLoading = true; makeupError = '';
  if (route === 'makeup') render();
  try {
    const result = await sync.post('/makeup', { app: SYNC_APP, auth: auth, action: 'list' });
    makeupRows = Array.isArray(result.cases) ? result.cases : [];
    makeupLoaded = true;
    makeupLiveMessage = '보강 현황 ' + makeupRows.length + '건을 새로 불러왔습니다.';
  } catch (error) {
    makeupError = String(error && error.message || error); makeupLoaded = true;
  } finally {
    makeupLoading = false;
    if (route === 'makeup') renderAfterSync();
  }
}

function makeupReasonSelect(id) {
  return '<label class="field"><span class="fl">운영 사유</span><select class="in" id="' + id + '">' +
    MAKEUP_REASON_OPTIONS.map(item => '<option value="' + item[0] + '">' + item[1] + '</option>').join('') + '</select></label>' +
    '<div class="makeup-reason-guide">질병·가정사 등 민감정보는 입력하지 않습니다. 정해진 운영 사유만 기록합니다.</div>';
}

function makeupStatusPill(row) {
  const cls = row.status === 'cancelled' ? 'bad' : row.status === 'awaiting_parent' ? 'warn' : '';
  return '<span class="pill ' + cls + '">' + esc(MAKEUP_STATUS_LABELS[row.status] || row.status) + '</span>';
}

function makeupParentHtml(row) {
  if (row.status !== 'awaiting_parent' && !row.parentResponse) return '';
  const current = Number(row.parentResponseRevision) === Number(row.revision);
  const prefix = current ? '보호자 응답' : '이전 일정 응답';
  if (row.parentResponse === 'accept') return '<div class="makeup-parent"><span class="tag ok">' + prefix + ' · 참석 가능</span></div>';
  if (row.parentResponse === 'decline') return '<div class="makeup-parent"><span class="tag blk">' + prefix + ' · 참석 불가</span></div>';
  return row.status === 'awaiting_parent'
    ? '<div class="makeup-parent"><span class="tag high">보호자 응답 대기</span></div>' : '';
}

function makeupScheduleHtml(row) {
  const confirmed = row.confirmedDate && row.confirmedStartTime && row.confirmedEndTime;
  const proposed = row.proposedDate && row.proposedStartTime && row.proposedEndTime;
  if (!confirmed && !proposed) return '<div class="makeup-schedule">보강 일정이 아직 제안되지 않았습니다.</div>';
  const date = confirmed ? row.confirmedDate : row.proposedDate;
  const start = confirmed ? row.confirmedStartTime : row.proposedStartTime;
  const end = confirmed ? row.confirmedEndTime : row.proposedEndTime;
  const staffId = confirmed ? row.confirmedStaffId : row.proposedStaffId;
  const staff = staffById(staffId);
  return '<div class="makeup-schedule"><b>' + (confirmed ? '확정 일정' : '제안 일정') + '</b><br>' +
    esc(date + ' · ' + start + '–' + end) + ' · ' + esc(staff ? staff.name + ' 선생님' : '담당 선생님') + '</div>';
}

function makeupAdminActions(row) {
  if (!session.isAdmin || ['completed', 'cancelled'].includes(row.status)) return '';
  const buttons = [];
  if (row.status === 'review_pending') {
    buttons.push('<button class="btn btn-sm btn-primary" data-act="mureviewrequired" data-makeup-action data-case="' + esc(row.caseId) + '" data-rev="' + Number(row.revision) + '">보강 진행</button>');
    buttons.push('<button class="btn btn-sm btn-ghost" data-act="mureviewnot" data-makeup-action data-case="' + esc(row.caseId) + '" data-rev="' + Number(row.revision) + '">보강 없음</button>');
  }
  if (row.status === 'reviewed' || row.status === 'awaiting_parent') {
    buttons.push('<button class="btn btn-sm btn-primary" data-act="mupropose" data-makeup-action data-case="' + esc(row.caseId) + '">' +
      (row.status === 'awaiting_parent' ? '새 일정 제안' : '일정 제안') + '</button>');
  }
  const currentDecline = row.parentResponse === 'decline' && Number(row.parentResponseRevision) === Number(row.revision);
  if (row.status === 'awaiting_parent' && !currentDecline) {
    buttons.push('<button class="btn btn-sm btn-navy" data-act="muconfirm" data-makeup-action data-case="' + esc(row.caseId) + '" data-rev="' + Number(row.revision) + '">일정 확정</button>');
  }
  if (row.status !== 'review_pending') {
    buttons.push('<button class="btn btn-sm btn-danger" data-act="mucancel" data-makeup-action data-case="' + esc(row.caseId) + '">취소</button>');
  }
  return buttons.join('');
}

function makeupNotificationHtml(row, initialLabel) {
  if (!row.notificationNeeded) return '';
  const eventLabel = row.notificationEvent
    ? ({ proposal: '일정 제안', confirmed: '일정 확정', cancelled: '취소' }[row.notificationEvent] || '상태 변경') : '상태 변경';
  const target = guardianOpsTargetForMakeup(row.caseId);
  const currentState = target && guardianOpsSendStates.get(guardianOpsKey(target));
  const heading = currentState && currentState.kind === 'accepted' ? '알림톡 상태' : (initialLabel || '알림톡 접수 필요');
  const action = session.isAdmin && target
    ? '<div class="guardian-ops-action">' +
      guardianOpsButtonHtml(target, 'guardianopsmakeup', '알림톡 상태 확인·보내기') +
      guardianOpsStatusHtml(target, '자동발송 없음 · 관리자 확인 필요') + '</div>' : '';
  return '<div class="makeup-notification">' + esc(heading) + ' · ' + esc(eventLabel) + action + '</div>';
}

function makeupCard(row) {
  const delayed = makeupIsDelayed(row, today());
  const scheduledToday = (row.confirmedDate || row.proposedDate) === today();
  const sourceTeacher = staffById(row.sourceTeacherId);
  const reason = MAKEUP_REASON_LABELS[row.reason] || '';
  const ownComplete = session.isStaffLink && row.status === 'confirmed' && row.confirmedStaffId === session.staffId;
  const notification = makeupNotificationHtml(row, '알림톡 발송 필요 · 템플릿 준비 중');
  const actions = makeupAdminActions(row) + (ownComplete

async function refreshMakeupsAfterConflict(error, caseId, act) {
  if (error && error.current) replaceMakeup(error.current);
  makeupLoaded = false;
  await loadMakeups(true);
  makeupLiveMessage = '다른 기기의 최신 변경을 다시 불러왔습니다.';
  rememberMakeupFocus(caseId, act);
  if (route === 'makeup') render();
}

async function mutateMakeup(payload, button, successText, focusAct, closeOnSuccess) {
  const auth = sync.auth();
  if (!auth) return toast('동기화 인증이 필요합니다');
  const caseId = String(payload.caseId || '');
  if (button) button.disabled = true;
  try {
    const result = await sync.post('/makeup', { app: SYNC_APP, auth: auth, ...payload });
    replaceMakeup(result.case);
    let completedText = successText;
    const impact = result.sessionPackImpact;
    if (impact && impact.refreshNeeded) {
      sessionPackLoaded = false;
      await loadSessionPacks(true);
      completedText += sessionPackError ? ' · 회차 현황은 새로고침해 주세요'
        : Number(impact.delta) === 1 ? ' · 회차 1회 반영' : ' · 기존 차감과 중복 없이 회차 반영';
    } else if (impact && impact.reason === 'pack_identity_mismatch') {
      completedText += ' · 회차권 배정 변경 확인 필요';
    }
    makeupLiveMessage = completedText;
    if (closeOnSuccess) closeModal();
    rememberMakeupFocus(caseId, focusAct);
    if (route === 'makeup') render();
    toast(completedText);
    return result;
  } catch (error) {
    toast('보강 처리 실패 — ' + (error.message || error));
    if (Number(error && error.status) === 409) await refreshMakeupsAfterConflict(error, caseId, focusAct);
    return null;
  } finally {
    if (button && button.isConnected) button.disabled = false;
  }
}

async function createMakeupFromAbsence(taskId, date, button, options) {
  const task = state.tasks.find(row => row.id === taskId);
  const check = getCheck(taskId, date);
  const auth = sync.auth();
  const automatic = !!(options && options.automatic);
  const expectedUpdatedAt = Number(options && options.expectedUpdatedAt) || 0;
  const sourceKey = makeupCreateKey(taskId, date);
  const operationId = uid();
  if (!isMakeupLessonTask(task) || !task.studentId || !check || check.att !== 'A') {
    if (automatic) return false;
    toast('학생 ID가 연결된 수업의 결석 출결을 먼저 기록해 주세요');
    return false;
  }
  const inFlight = makeupCreateStates.get(sourceKey);
  if (inFlight && inFlight.status === 'pending') return false;
  makeupCreateStates.set(sourceKey, { status: 'pending', expectedUpdatedAt: expectedUpdatedAt, operationId: operationId });
  if (!auth) {
    makeupCreateStates.set(sourceKey, { status: 'sync_failed', operationId: operationId });
    if (automatic) {
      toast('출결은 이 기기에 저장됨 · 동기화 인증 후 보강 검토를 다시 시도해 주세요');
      renderAfterSync();
      return false;
    }
    toast('동기화 인증이 필요합니다');
    renderAfterSync();
    return false;
  }
  if (button) { button.disabled = true; button.textContent = '출결 저장 중…'; }
  try {
    try {
      await settleSync();
    } catch (error) {
      error.makeupSyncFailed = true;
      throw error;
    }
    const latestCheck = getCheck(taskId, date);
    if (!latestCheck || latestCheck.att !== 'A' || (expectedUpdatedAt && Number(latestCheck.updatedAt) !== expectedUpdatedAt)) {
      const currentState = makeupCreateStates.get(sourceKey);
      if (currentState && currentState.operationId === operationId) makeupCreateStates.delete(sourceKey);
      return false;
    }
    const result = await sync.post('/makeup', {
      app: SYNC_APP, auth: auth, action: 'create_from_absence', sourceTaskId: taskId, sourceDate: date
    });
    replaceMakeup(result.case);
    const currentState = makeupCreateStates.get(sourceKey);
    if (currentState && currentState.operationId === operationId) makeupCreateStates.delete(sourceKey);
    makeupLiveMessage = (result.idempotent ? '기존' : '새') + ' 보강 검토 건을 확인했습니다.';
    if (button && button.isConnected) { button.textContent = '보강 요청됨'; button.disabled = true; }
    toast(result.idempotent ? '이미 등록된 보강 검토 건입니다' : (automatic ? '결석 출결 저장됨 · 보강 검토가 자동 생성되었습니다' : '보강 검토를 요청했습니다'));
    renderAfterSync();
    return true;
  } catch (error) {
    const current = getCheck(taskId, date);
    const currentState = makeupCreateStates.get(sourceKey);
    if (currentState && currentState.operationId === operationId) {
      if (current && current.att === 'A') {
        makeupCreateStates.set(sourceKey, { status: error.makeupSyncFailed ? 'sync_failed' : 'create_failed', operationId: operationId });
      } else {
        makeupCreateStates.delete(sourceKey);
      }
    }
    toast(error.makeupSyncFailed
      ? '출결은 이 기기에 저장됨 · 서버 동기화 후 보강 검토를 다시 시도해 주세요'
      : '출결 저장됨 · 보강 검토 생성 실패 — 다시 시도해 주세요');
    if (Number(error && error.status) === 409) await refreshMakeupsAfterConflict(error, '', '');
    if (button && button.isConnected) { button.disabled = false; button.textContent = '보강 검토 요청'; }
    renderAfterSync();
    return false;
  }
}

        const cls = st === 'done' ? 'done' : st === 'blocked' ? 'blocked' : st === 'doing' ? 'doing' : (d < today() ? 'miss' : '');

function seoulNowParts() {
  const values = {};
  new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
  }).formatToParts(new Date()).forEach(part => {
    if (part.type !== 'literal') values[part.type] = part.value;
  });
  const hour = Number(values.hour) % 24;
  const minute = Number(values.minute);
  return {
    date: values.year + '-' + values.month + '-' + values.day,
    minute: hour * 60 + minute,
    label: String(hour).padStart(2, '0') + ':' + String(minute).padStart(2, '0')
  };
}

function lessonGradeOf(t) {
  if (t.grade) return String(t.grade);
  const title = String(t.title || '');
  const open = title.indexOf('('), close = title.indexOf(')', open + 1);
  return open >= 0 && close > open ? title.slice(open + 1, close).trim() : '';
}

function dailyLessonSchedule(date) {
  const core = window.WBScheduleCore;
  const entries = [], issues = [];
  if (!core) {
    issues.push({ teacherName: '시스템', studentName: '', message: '수업 시간 모듈을 불러오지 못했습니다', source: '', staffId: '' });
    return { entries: entries, issues: issues };
  }
  const dow = dowOf(date);
  state.tasks.filter(t => !t.deleted && isLesson(t)).forEach(t => {
    const staff = staffById(t.staffId);
    const studentName = String(t.studentName || studentOf(t) || '학생 미입력');
    const grade = lessonGradeOf(t);
    const base = {
      task: t,
      staffId: t.staffId || '',
      teacherName: staff ? staff.name : '담당 미지정',
      studentId: String(t.studentId || rosterStudentId(studentName, grade, date) || ''),
      studentName: studentName,
      grade: grade
    };
    const result = core.classifyTaskSchedule(t, {
      date: date,
      dow: dow,
      occurs: occursOn(t, date),
      withinRange: (!t.start || date >= t.start) && (!t.end || date <= t.end)
    });
    result.slots.forEach((slot, index) => entries.push(Object.assign({}, base, {
      key: String(t.id) + '|' + String(slot.slotId || index),
      slot: slot,
      role: String(slot.lessonRole || t.lessonRole || '역할 미입력')
    })));
    result.issues.forEach(problem => issues.push(Object.assign({}, base, {
      message: problem.message,
      source: problem.source,
      code: problem.code
    })));
  });
  entries.sort((a, b) => a.slot.startMinute - b.slot.startMinute ||
    a.slot.endMinute - b.slot.endMinute || a.teacherName.localeCompare(b.teacherName, 'ko') ||
    a.studentName.localeCompare(b.studentName, 'ko'));
  issues.sort((a, b) => a.teacherName.localeCompare(b.teacherName, 'ko') || a.studentName.localeCompare(b.studentName, 'ko'));
  return { entries: entries, issues: issues };
}

function scheduleAttendance(entry, date) {
  const value = ((getCheck(entry.task.id, date) || {}).att) || '';
  if (value === 'P') return { value: value, label: '출석', cls: '' };
  if (value === 'L') return { value: value, label: '지각', cls: 'warn' };
  if (value === 'A') return { value: value, label: '결석', cls: 'bad' };
  if (value === 'E') return { value: value, label: '조퇴', cls: 'warn' };
  return { value: '', label: '미완료', cls: 'warn' };
}

function scheduleAttendanceSummaryText(session, date) {
  const counts = { P: 0, L: 0, A: 0, E: 0, pending: 0 };
  session.entries.forEach(entry => {
    const value = scheduleAttendance(entry, date).value;
    if (Object.prototype.hasOwnProperty.call(counts, value)) counts[value]++;
    else counts.pending++;
  });
  return [counts.P && '출석 ' + counts.P, counts.L && '지각 ' + counts.L,
    counts.A && '결석 ' + counts.A, counts.E && '조퇴 ' + counts.E,
    counts.pending && '미완료 ' + counts.pending].filter(Boolean).join(' · ') || '미완료';
}

function weeklyLessonSchedule(anchor) {
  const monday = mondayOf(anchor);
  const days = Array.from({ length: 7 }, (_, i) => addDays(monday, i));
  const entries = [], issues = [], issueByKey = new Map();
  days.forEach(date => {
    const daily = dailyLessonSchedule(date);
    daily.entries.forEach(entry => entries.push(Object.assign({}, entry, { date: date })));
    daily.issues.forEach(item => {
      const key = String((item.task || {}).id || item.studentName) + '|' + item.code + '|' + item.source;
      const applies = !item.task || occursOn(item.task, date);
      if (issueByKey.has(key)) {
        if (applies) issueByKey.get(key).dates.push(date);
        return;
      }
      const stored = Object.assign({}, item, { dates: applies ? [date] : [] });
      issueByKey.set(key, stored);
      issues.push(stored);
    });
  });
  return { monday: monday, days: days, entries: entries, issues: issues };
}

function normalizeScheduleSearch(value) {
  return String(value || '').normalize('NFKC').trim().toLocaleLowerCase('ko').split(/\s+/).filter(Boolean);
}

function scheduleSearchMatch(value, terms) {
  const text = String(value || '').normalize('NFKC').toLocaleLowerCase('ko');
  return terms.every(term => text.includes(term));
}

function scheduleSearchAny(value, terms) {
  const text = String(value || '').normalize('NFKC').toLocaleLowerCase('ko');
  return terms.some(term => text.includes(term));
}

function scheduleSearchPlan(cardSearch, aggregateSearch, rowSearches, terms) {
  if (!terms.length) return { card: true, rows: rowSearches.map(() => true) };
  const identityMatch = scheduleSearchMatch(cardSearch, terms);
  if (identityMatch) return { card: true, rows: rowSearches.map(() => true) };
  const exactRows = rowSearches.map(value => scheduleSearchMatch(value, terms));
  if (exactRows.some(Boolean)) return { card: true, rows: exactRows };
  if (!scheduleSearchMatch(aggregateSearch, terms)) return { card: false, rows: exactRows };
  const relatedRows = rowSearches.map(value => scheduleSearchAny(value, terms));
  return { card: true, rows: relatedRows.some(Boolean) ? relatedRows : rowSearches.map(() => true) };
}

function applyScheduleSearch(value) {
  scheduleSearchQuery = String(value || '');
  const terms = (scheduleView === 'teacher' || scheduleView === 'student')
    ? normalizeScheduleSearch(scheduleSearchQuery) : [];
  const cards = Array.from(document.querySelectorAll('[data-schedule-card]'));
  let shown = 0;
  cards.forEach(card => {
    const rows = Array.from(card.querySelectorAll('[data-schedule-row]'));
    const plan = scheduleSearchPlan(card.dataset.cardSearch, card.dataset.search,
      rows.map(row => row.dataset.search), terms);
    rows.forEach((row, index) => { row.hidden = !plan.rows[index]; });
    card.hidden = !plan.card;
    if (plan.card) shown++;
  });
  document.querySelectorAll('[data-schedule-collapsible]').forEach(details => {
    const hasMatch = Array.from(details.querySelectorAll('[data-schedule-card], [data-schedule-row]'))
      .some(item => !item.hidden);
    details.hidden = !!terms.length && !hasMatch;
    if (terms.length && hasMatch && !details.open) {
      details.open = true;
      details.dataset.searchOpened = '1';
    } else if (!terms.length && details.dataset.searchOpened === '1') {
      delete details.dataset.searchOpened;
    }
  });
  const count = document.getElementById('scheduleSearchCount');
  if (count) count.textContent = terms.length
    ? '전체 지표는 유지됩니다 · ' + shown + '개 카드가 검색되었습니다.'
    : '위 지표와 확인 필요 목록은 전체 주간 기준입니다.';
  const empty = document.getElementById('scheduleSearchEmpty');
  if (empty) empty.hidden = !terms.length || shown > 0;
}

      '" style="left:' + at(minute) + 'px">' + scheduleMinuteText(minute) + '</span><i class="schedule-axis-line" style="left:' + at(minute) + 'px"></i>').join('') +
    (showNow ? '<span class="schedule-now-label" style="left:' + at(nowKst.minute) + 'px">지금 ' + esc(nowKst.label) + '</span>' : '') + '</div>';

  timeline.rows.forEach(row => {
    const visuals = row.sessions.map(session => {
      const attendanceRows = scheduleSessionAttendanceRows(session, date);
      return { session: session, attendanceRows: attendanceRows, height: Math.max(42, attendanceRows.length * 32 + 10) };

    visuals.forEach(item => { laneHeights[item.session.lane] = Math.max(laneHeights[item.session.lane], item.height); });
    const laneOffsets = laneHeights.map((height, index) => laneHeights.slice(0, index).reduce((sum, value) => sum + value + 6, 0));
    const rowHeight = Math.max(60, laneHeights.reduce((sum, value) => sum + value, 0) + Math.max(0, laneHeights.length - 1) * 6 + 14);

  return '<div class="schedule-list-row' + (conflict ? ' is-conflict' : '') + '" data-schedule-row data-search="' + esc(search) + '">' +
    '<div class="schedule-list-time">' + esc(timeText) + '</div><div class="schedule-list-main">' +

    '<div class="schedule-role">' + esc([!hideTeacher && teacherName && teacherName + ' 선생님', subjects.join('·'), roles.join('·')].filter(Boolean).join(' · ')) +
    '</div>' + (modeBadges ? '<div class="schedule-person-meta">' + modeBadges + '</div>' : '') + '</div></div>';
}

  }).join('') + '</div>';

function scheduleTeacherCardsHtml(weekly) {
  const summary = window.WBScheduleCore.weeklyTeacherSummary(weekly.entries);
  const groups = summary.teachers.slice();
  weekly.issues.forEach(issue => {
    const key = issue.staffId || issue.teacherName;
    if (!groups.some(group => group.teacherKey === key)) groups.push({
      teacherKey: key, staffId: issue.staffId || '', teacherName: issue.teacherName,
      sessions: [], sessionCount: 0, studentCount: 0, durationMinutes: 0, conflictCount: 0
    });
  });
  const warningCount = group => group.conflictCount + weekly.issues.filter(issue =>
    (issue.staffId || issue.teacherName) === group.teacherKey).length;
  groups.sort((a, b) => warningCount(b) - warningCount(a) || a.teacherName.localeCompare(b.teacherName, 'ko'));
  const represented = new Set(groups.map(group => group.staffId || group.teacherKey));
  const noSchedule = weekly.monday >= mondayOf(today())
    ? teamStaff().filter(staff => !represented.has(staff.id)).map(staff => staff.name) : [];
  if (!groups.length && !noSchedule.length) return '<div class="card"><div class="empty"><b>🧑‍🏫</b>이번 주 확정 시간표가 없습니다.</div></div>';
  const cards = groups.map(group => {
    const issues = weekly.issues.filter(issue => (issue.staffId || issue.teacherName) === group.teacherKey);
    const search = [group.teacherName].concat(group.sessions.flatMap(session => session.entries.flatMap(entry =>
      [entry.studentName, entry.grade, entry.role, (entry.task || {}).subject, (entry.task || {}).className])))
      .concat(issues.flatMap(issue => [issue.studentName, issue.grade, issue.message])).join(' ');
    const warnings = group.conflictCount + issues.length;
    const rows = group.sessions.map(session => scheduleSessionRow(
      session, group.teacherName, DOW[dowOf(session.date)] + ' ' + session.label, true
    ));
    return '<div class="card schedule-person-card' + (warnings ? ' is-attention' : '') + '" data-schedule-card data-card-search="' + esc(group.teacherName) + '" data-search="' + esc(search) + '">' +
      '<div class="between mb8"><div class="card-title">' + esc(group.teacherName) + ' 선생님</div>' +
      (warnings ? '<span class="pill bad">⚠ ' + warnings + '</span>' : '<span class="pill">정상</span>') + '</div>' +
      '<div class="schedule-person-meta"><span class="tag time">' + group.sessionCount + '타임</span>' +
      '<span class="tag">' + group.studentCount + '명</span><span class="tag">' + esc(scheduleDurationText(group.durationMinutes) || '0분') + '</span></div>' +
      (rows.length ? scheduleRowsHtml(rows) : '<div class="schedule-empty-line">이번 주 확정 시간표 없음</div>') +
      (issues.length ? '<div class="schedule-pending-line" data-schedule-row data-search="' +
        esc(issues.flatMap(issue => [group.teacherName, issue.studentName, issue.grade, issue.message]).join(' ')) +
        '">⚠ 확정 전 시간표 ' + issues.length + '건</div>' : '') + '</div>';
  }).join('');
  const none = noSchedule.length ? '<div class="schedule-note">현재 직원 중 시간표 없음: ' + esc(noSchedule.join(', ')) + '</div>' : '';
  return none + (cards ? '<div class="schedule-card-grid">' + cards + '</div>' : '');

function scheduleStudentSources(group) {
  const byTask = new Map();
  group.entries.concat(group.issues).forEach(item => {
    const task = item.task || {};
    const key = String(task.id || item.key || item.teacherName + '|' + item.studentName);
    if (!byTask.has(key)) byTask.set(key, { task: task, teacherName: item.teacherName, entries: [], issues: [] });
    const source = byTask.get(key);
    if (item.slot) source.entries.push(item);
    else source.issues.push(item);
  });
  return Array.from(byTask.values()).map(source => {
    const task = source.task;
    const when = [...new Set(source.entries.map(entry => DOW[dowOf(entry.date)] + ' ' + entry.slot.label))].join(' · ') ||
      [...new Set(source.issues.flatMap(issue => issue.dates || []).map(date => DOW[dowOf(date)] + '요일'))].join(' · ') || '시간 미확정';
    const heading = [when, source.teacherName && source.teacherName + ' 선생님', task.subject, task.className].filter(Boolean).join(' / ');
    const rows = [
      ['교재·진도', task.materials], ['온라인', task.onlineProgram], ['숙제', task.homework],
      ['학생 특징', task.studentTraits], ['목표', task.goal], ['학부모 요청', task.parentRequest]
    ].filter(row => row[1]);
    return '<div class="schedule-source"><b>' + esc(heading) + '</b>' + rows.map(row =>
      '<div class="schedule-info-row"><b>' + esc(row[0]) + '</b>' + esc(row[1]) + '</div>'
    ).join('') + '</div>';
  }).join('');
}

function scheduleStudentWarningCount(group, conflictEntries, identityProblem) {
  return Number(identityProblem) + group.issues.length + group.entries.filter(entry =>
    conflictEntries.has(entry.date + '|' + entry.key)).length;
}

function scheduleStudentCardsHtml(weekly) {
  const conflictEntries = new Set();
  window.WBScheduleCore.weeklyTeacherSummary(weekly.entries).teachers.forEach(teacher => teacher.sessions.forEach(session => {
    if (!session.studentConflict) return;
    session.studentConflictEntries.forEach(entry => conflictEntries.add(session.date + '|' + entry.key));
  }));
  const groups = new Map();
  const ensureGroup = (studentId, name, grade, student) => {
    const key = window.WBScheduleCore.studentGroupKey(name, grade, studentId);
    if (!groups.has(key)) groups.set(key, {
      key: key, studentId: studentId || '', name: name, grade: grade || '',
      student: student || null, entries: [], issues: []
    });
    else if (student) groups.get(key).student = student;
    return groups.get(key);
  };
  if (rosterDb) activeDuringWeek(weekly.days).forEach(student => ensureGroup(student.id, student.name, student.grade, student));
  weekly.entries.forEach(entry => ensureGroup(entry.studentId, entry.studentName, entry.grade, null).entries.push(entry));
  weekly.issues.forEach(item => ensureGroup(item.studentId, item.studentName, item.grade, null).issues.push(item));

  const list = Array.from(groups.values());
  list.forEach(group => {
    const student = group.student || {}, first = group.entries[0] || {};
    const grade = student.grade || first.grade || group.grade || '';
    group.scheduleConflictCount = group.entries.filter(entry => conflictEntries.has(entry.date + '|' + entry.key)).length;
    group.scheduleIdentityProblem = !student.id && rosterStudentMatches(group.name, grade, weekly.days).length > 1;
    group.scheduleWarningCount = scheduleStudentWarningCount(group, conflictEntries, group.scheduleIdentityProblem);
  });
  list.sort((a, b) =>
    b.scheduleWarningCount - a.scheduleWarningCount ||
    Number(!!b.entries.length) - Number(!!a.entries.length) ||
    a.name.localeCompare(b.name, 'ko') || a.grade.localeCompare(b.grade, 'ko'));
  const rosterState = !rosterDb && rosterErr
    ? '<div class="card alert"><div class="card-title">원생 기본 정보를 불러오지 못했습니다</div>' +
      '<div class="card-sub">시간표 정보만 임시로 표시합니다. 재원생 수와 수업 없는 학생은 누락될 수 있습니다.</div>' +
      '<button class="btn btn-sm btn-ghost mt14" data-act="rosterretry">다시 시도</button></div>'
    : (!rosterDb ? '<div class="schedule-note">학생 기본 정보를 불러오는 중입니다.</div>' : '');
  if (!list.length) return rosterState + '<div class="card"><div class="empty"><b>👥</b>표시할 학생이 없습니다.</div></div>';

  const studentCard = group => {
    const name = group.name, student = group.student || {}, first = group.entries[0] || {};
    const taskSources = group.entries.concat(group.issues);
    const grade = student.grade || first.grade || group.grade || '';
    const actualTeachers = [...new Set(taskSources.map(entry => entry.teacherName).filter(Boolean))];
    const teachers = [...new Set(String(student.teacher || '').split('·').concat(actualTeachers).map(value => value.trim()).filter(Boolean))].join('·');
    const subjects = [...new Set([student.subject].concat(taskSources.flatMap(entry => [
      (entry.task || {}).subject, (entry.task || {}).className
    ])).filter(Boolean))];
    const identityProblem = group.scheduleIdentityProblem;
    const conflictCount = group.scheduleConflictCount;
    const sources = scheduleStudentSources(group);
    const modeBadges = sessionModeBadgesHtml(taskSources.map(entry => entry.task || {}));
    const search = [name, grade, teachers, student.memo || ''].concat(subjects).concat(taskSources.flatMap(entry => {
      const task = entry.task || {};
      return [entry.teacherName, entry.role, task.subject, task.className, task.materials, task.homework,
        task.studentTraits, task.goal, task.parentRequest];
    })).join(' ');
    const warnings = group.scheduleWarningCount;
    const rows = group.entries.map(entry => scheduleSimpleRow(
      DOW[dowOf(entry.date)] + ' ' + entry.slot.label, entry.teacherName + ' 선생님', entry.role,
      conflictEntries.has(entry.date + '|' + entry.key),
      [name, grade, entry.teacherName, entry.role, (entry.task || {}).subject, (entry.task || {}).className].join(' ')
    ));
    return '<div class="card schedule-person-card' + (warnings ? ' is-attention' : '') + '" data-schedule-card data-card-search="' +
      esc([name, grade].join(' ')) + '" data-search="' + esc(search) + '">' +
      '<div class="between"><div class="card-title">' + esc(name) + '</div>' +
      (grade ? '<span class="pill">' + esc(grade) + '</span>' : '') + '</div>' +
      '<div class="schedule-person-meta">' +
      (subjects.length ? '<span class="tag time">' + esc(subjects.join('·')) + '</span>' : '') +
      (teachers ? '<span class="tag">' + esc(teachers) + '</span>' : '') +
      modeBadges +
      (student.memo ? '<span class="tag high">메모 있음</span>' : '') +
      (identityProblem ? '<span class="tag high">학생 식별 확인 필요</span>' : '') +
      (conflictCount ? '<span class="tag high">겹침 ' + conflictCount + '건</span>' : '') +
      (group.issues.length ? '<span class="tag high">시간 확인 필요</span>' : '') + '</div>' +
      (rows.length ? scheduleRowsHtml(rows) : '<div class="schedule-empty-line">이번 주 확정 시간표 없음</div>') +
      ((student.memo || sources) ? '<details class="schedule-info"><summary>학생 정보 보기</summary>' +
        (student.memo ? '<div class="schedule-info-row"><b>원생 메모</b>' + esc(student.memo) + '</div>' : '') +
        sources + '</details>' : '') + '</div>';
  };
  const scheduled = list.filter(group => group.entries.length || group.issues.length);
  const rosterOnly = list.filter(group => !group.entries.length && !group.issues.length);
  const scheduledHtml = scheduled.length
    ? '<div class="schedule-card-grid">' + scheduled.map(studentCard).join('') + '</div>'
    : '<div class="schedule-note">이번 주 확정 수업이나 확인할 일정이 있는 학생이 없습니다.</div>';
  const rosterOnlyHtml = rosterOnly.length
    ? '<details class="card schedule-roster-only" data-schedule-collapsible><summary><span><b>이번 주 수업 없는 학생</b>' +
      '<span class="card-sub">필요할 때 펼쳐 기본 정보를 확인하세요.</span></span><span class="pill">' + rosterOnly.length +
      '명</span></summary><div class="schedule-roster-only-body"><div class="schedule-card-grid">' +
      rosterOnly.map(studentCard).join('') + '</div></div></details>' : '';
  return rosterState + scheduledHtml + rosterOnlyHtml;
}

/* ── 관리담당 통합 요청함 ──
 * 기존 승인 화면으로 이동하거나 보호자 요청은 이 자리에서 CAS로 처리한다. */
function managerRequestTeacher(staffId) {
  const staff = staffById(String(staffId || ''));
  return staff && staff.name ? staff.name + ' 선생님' : '요청 선생님 확인 필요';
}

const GUARDIAN_REQUEST_TYPE_LABELS = Object.freeze({
  consultation: '상담 요청', schedule_check: '일정 확인', info_correction: '정보 수정 요청'
});
const GUARDIAN_REQUEST_STATUS_LABELS = Object.freeze({
  open: '처리 대기', resolved: '처리 완료', dismissed: '확인 종료'
});

function normalizeGuardianRequest(row) {
  const requestId = String(row && row.requestId || '');
  if (!/^[A-Za-z0-9_-]{1,128}$/.test(requestId)) return null;
  const requestType = Object.prototype.hasOwnProperty.call(GUARDIAN_REQUEST_TYPE_LABELS, String(row.requestType || ''))
    ? String(row.requestType) : '';
  const status = Object.prototype.hasOwnProperty.call(GUARDIAN_REQUEST_STATUS_LABELS, String(row.status || ''))
    ? String(row.status) : '';
  return {
    requestId: requestId, studentId: String(row.studentId || ''),
    studentName: String(row.studentName || '학생').slice(0, 80), grade: String(row.grade || '').slice(0, 40),
    requestType: requestType, status: status, revision: Math.max(0, Number(row.revision) || 0),
    createdAt: Number(row.createdAt) || 0, updatedAt: Number(row.updatedAt) || 0
  };
}

async function loadGuardianRequests(force) {
  if (!session.isAdmin || guardianRequestsLoading || (guardianRequestsLoaded && !force)) return;
  const auth = sync.auth();
  if (!auth) {
    guardianRequestsLoaded = true;
    guardianRequestsError = '관리 인증을 확인해 주세요.';
    return;
  }
  guardianRequestsLoading = true;
  guardianRequestsError = '';
  try {
    const result = await sync.post('/parent-portal', {
      app: SYNC_APP, action: 'request_list', auth: auth, status: 'open'
    });
    guardianRequestRows = (result.requests || []).map(normalizeGuardianRequest).filter(Boolean);
    guardianRequestsLoaded = true;
  } catch (error) {
    if (error && error.personAuthHandled) return;
    guardianRequestsLoaded = true;
    guardianRequestsError = '보호자 요청을 불러오지 못했습니다.';
  } finally {
    guardianRequestsLoading = false;
  }
}

function guardianRequestControlsHtml(row) {
  if (!row.guardianRequestId || row.guardianRequestStatus !== 'open') return '';
  const busy = guardianRequestPending.has(row.guardianRequestId);
  const base = ' data-request="' + esc(row.guardianRequestId) + '" data-rev="' + Number(row.guardianRequestRevision) + '"';
  return '<div class="manager-guardian-actions" aria-label="보호자 요청 처리">' +
    '<button class="btn btn-sm btn-primary" data-act="guardianrequestresolve" data-resolution="resolved"' + base +
      (busy ? ' disabled' : '') + '>' + (busy ? '처리 중…' : '처리 완료') + '</button>' +
    '<button class="btn btn-sm btn-ghost" data-act="guardianrequestresolve" data-resolution="dismissed"' + base +
      (busy ? ' disabled' : '') + '>확인 종료</button></div>';
}

async function resolveGuardianRequest(requestId, resolution, expectedRevision, button) {
  if (!session.isAdmin || !['resolved', 'dismissed'].includes(resolution)) return;
  const id = String(requestId || '');
  const current = guardianRequestRows.find(row => row.requestId === id);
  if (!current || current.status !== 'open' || Number(current.revision) !== Number(expectedRevision)) {
    return toast('보호자 요청의 최신 상태를 다시 확인해 주세요');
  }
  const confirmation = resolution === 'resolved'
    ? '보호자에게 필요한 처리를 마쳤으며 이 요청을 처리 완료로 표시할까요?'
    : '이 요청을 별도 처리 없이 확인 종료할까요?';
  if (!confirm(confirmation)) return;
  const auth = sync.auth();
  if (!auth) return toast('관리 인증이 필요합니다');
  guardianRequestPending.add(id);
  guardianRequestsError = '';
  if (button) button.disabled = true;
  renderAfterSync();
  try {
    const result = await sync.post('/parent-portal', {
      app: SYNC_APP, action: 'request_resolve', auth: auth, requestId: id,
      resolution: resolution, expectedRevision: Number(expectedRevision)
    });
    const saved = normalizeGuardianRequest(result.request);
    if (!saved || saved.requestId !== id) throw new Error('REQUEST_RESPONSE_INVALID');
    guardianRequestRows = guardianRequestRows.map(row => row.requestId === id ? saved : row);
    toast(resolution === 'resolved' ? '보호자 요청을 처리 완료했습니다' : '보호자 요청을 확인 종료했습니다');
  } catch (error) {
    if (error && error.personAuthHandled) return;
    if (error && error.code === 'STALE_REVISION') {
      const latest = normalizeGuardianRequest(error.current);
      if (latest) guardianRequestRows = guardianRequestRows.map(row => row.requestId === id ? latest : row);
      else guardianRequestsLoaded = false;
      toast('다른 화면에서 먼저 처리했습니다. 최신 상태를 반영했습니다');
    } else {
      guardianRequestsError = '보호자 요청을 처리하지 못했습니다. 다시 시도해 주세요.';
    }
  } finally {
    guardianRequestPending.delete(id);
    if (route === 'schedule') renderAfterSync();
  }
}

function lessonChangeInboxMeta(changes) {
  const operation = String(changes && changes.operation || 'lesson_fields');
  const date = String(changes && changes.effectiveDate || '날짜 확인 필요');
  if (operation === 'withdrawal') return { kind: '퇴원 요청', detail: '퇴원 승인 · 적용일 ' + date };
  if (operation === 'leave') return { kind: '휴원 요청', detail: '휴원 승인 · 적용일 ' + date };
  if (operation === 'lesson_delete') return { kind: '수업삭제 요청', detail: '수업 삭제 승인 · 적용일 ' + date };
  if (operation === 'teacher_assignment') return { kind: '담당자 변경', detail: '새 담당 선생님 선택 · 시작일 ' + date };
  if (operation === 'information_request') return { kind: '학생정보 요청', detail: '학생 정보 수정 내용 확인' };
  return { kind: '수업 변경', detail: '요일·시간·진도 변경 승인' };
}

function managerRequestInboxRows() {
  if (!session.isAdmin) return [];
  const rows = [];
  const push = (kind, title, detail, staffId, targetRoute, updatedAt, priority) => rows.push({
    kind: kind, title: title || '내용 확인 필요', detail: detail || '', requester: managerRequestTeacher(staffId),
    route: targetRoute, updatedAt: Number(updatedAt) || 0, priority: Number(priority) || 0
  });

  lessonAssignmentRequests.filter(row => row.status === 'approval_waiting').forEach(row =>
    push('학생 배정', [row.studentName, row.grade].filter(Boolean).join(' · '), '담당 학생 연결 승인', row.staffId, 'lesson', row.updatedAt, 0));
  lessonChangeQueue.filter(row => row.status === 'approval_waiting').forEach(row => {
    const task = state.tasks.find(task => task.id === row.taskId);
    const meta = lessonChangeInboxMeta(row.changes);
    push(meta.kind, (task && (task.studentName || taskDisplayTitle(task))) || '수업 정보', meta.detail, row.owner, 'lesson', row.updatedAt, 0);
  });
  feedbackQueue.filter(row => row.status === 'approval_waiting').forEach(row => {
    const task = state.tasks.find(task => task.id === row.taskId);
    push('피드백 검토', row.studentName || (task && (task.studentName || taskDisplayTitle(task))) || '수업 피드백',
      '피드백 문구 승인', row.owner, 'feedback', row.updatedAt, 0);
  });
  bookAddQueue.filter(row => row.status === 'approval_waiting').forEach(row =>
    push('교재 추가', row.title || '새 교재', '새 교재 등록 승인', row.owner, 'books', row.updatedAt, 0));
  bookEditQueue.filter(row => row.status === 'approval_waiting').forEach(row =>
    push('교재 수정', row.title || '교재 정보', '교재 정보 변경 승인', row.owner, 'books', row.updatedAt, 0));
  bookOrderRows.filter(row => row.stage === 'student_handed' && !row.academyRegisteredAt).forEach(row =>
    push('아카등록', (row.title || '교재 정보') + ' · ' + Number(row.quantity || 0) + '권',
      '4단계 학생배부 완료 · 아카등록 필요', row.owner, 'books', row.studentHandedAt || row.taskUpdatedAt, 0));
  guardianRequestRows.filter(row => row.status === 'open').forEach(row => {
    const typeLabel = GUARDIAN_REQUEST_TYPE_LABELS[row.requestType] || '요청 유형 확인 필요';
    const statusLabel = GUARDIAN_REQUEST_STATUS_LABELS[row.status] || '상태 확인 필요';
    rows.push({
      kind: '보호자 요청', title: (row.studentName || '학생') + ' · ' + typeLabel,
      detail: [row.grade, statusLabel].filter(Boolean).join(' · '), requester: '보호자 앱', route: '',
      updatedAt: Number(row.updatedAt) || Number(row.createdAt) || 0, priority: -1,
      guardianRequestId: row.requestId, guardianRequestStatus: row.status,
      guardianRequestRevision: Number(row.revision) || 0
    });
  });
  const directiveInboxRows = typeof adminDirectiveManageRows === 'undefined' ? [] : adminDirectiveManageRows;
  directiveInboxRows.filter(row => row.isCurrent && row.directiveStatus === 'active').forEach(row => {
    const pending = typeof adminDirectiveAudienceSummary === 'function' ? adminDirectiveAudienceSummary(row).pending : [];
    if (pending.length) push('실시간 관리자 요청 미확인', row.title,
      '미확인: ' + pending.map(item => item.staffName || managerRequestTeacher(item.staffId)).join(', '), '', 'lesson', row.updatedAt, -2);
  });
  const studentChangeInboxEvents = typeof studentChangeEvents === 'undefined' ? [] : studentChangeEvents;
  studentChangeInboxEvents.filter(event => event.requiresAck && Array.isArray(event.audienceStatus)).forEach(event => {
    const pending = event.audienceStatus.filter(item => !item.acknowledgedAt);
    if (!pending.length) return;
    const task = state.tasks.find(row => String(row.id) === String(event.taskId || ''));
    const student = rosterDb && rosterDb.students && rosterDb.students.find(row => String(row.id) === String(event.studentId || ''));
    push(event.eventType === 'student_information' ? '학생정보 미확인' : '업무지시 미확인',
      (student && student.name) || (task && task.studentName) || '학생 정보',
      '미확인: ' + pending.map(item => managerRequestTeacher(item.staffId)).join(', '), '',
      event.eventType === 'student_information' ? 'roster' : 'lesson', event.changedAt, -1);
  });

  return rows.sort((a, b) => a.priority - b.priority || b.updatedAt - a.updatedAt || a.kind.localeCompare(b.kind, 'ko'));
}

function managerRequestInboxCount() { return session.isAdmin ? managerRequestInboxRows().length : 0; }

function managerRequestInboxReady() {
  return lessonAssignmentRequestsLoaded && lessonChangeQueueLoaded && feedbackQueueLoaded &&
    bookAddQueueLoaded && bookEditQueueLoaded && bookIssueLoaded && guardianRequestsLoaded &&
    studentChangeLoaded && adminDirectiveManageLoaded;
}

function managerRequestInboxErrors() {
  return [lessonAssignmentRequestsError, lessonChangeQueueError, feedbackQueueError, bookAddQueueError, bookEditQueueError,
    bookIssueError, guardianRequestsError, studentChangeError, adminDirectiveError]
    .filter(Boolean);
}

async function loadManagerRequestInbox(force) {
  if (!session.isAdmin || managerInboxLoading) return;
  managerInboxLoading = true;
  if (route === 'schedule') renderAfterSync();
  try {
    await Promise.all([
      loadLessonAssignmentRequests(force), loadLessonChangeQueue(force), loadFeedbackQueue(force),
      loadBookAddQueue(force), loadBookEditQueue(force), loadBookIssues(force), loadGuardianRequests(force),
      loadStudentChanges(force), loadAdminDirectives(force, false)
    ]);
  } finally {
    managerInboxLoading = false;
    if (route === 'schedule') renderAfterSync();
  }
}

function managerRequestInboxHtml() {
  if (!session.isAdmin) return '';
  const rows = managerRequestInboxRows();

  let h = '<section class="card lesson-review" data-manager-inbox><div class="between"><div><div class="card-title">📥 관리담당 통합 요청함</div>' +
    '<div class="card-sub">모든 선생님의 승인·처리 대기 항목입니다. 기존 검토 화면으로 이동하거나 보호자 요청은 여기서 안전하게 처리합니다.</div></div>' +
    '<span class="pill ' + (rows.length ? 'warn' : '') + '">' + rows.length + '건</span></div>' +
    '<button class="btn btn-sm btn-ghost mt14" data-act="managerinboxrefresh"' + (managerInboxLoading ? ' disabled' : '') + '>' +
      (managerInboxLoading ? '불러오는 중…' : '모두 새로고침') + '</button>';
  if (!managerRequestInboxReady() && managerInboxLoading) {
    h += '<div class="hint mt14" role="status" aria-live="polite">요청·승인 목록을 불러오는 중입니다.</div>';
  }

    h += '<div class="hint mt14" role="alert">일부 목록을 불러오지 못했습니다. 새로고침하면 다시 확인합니다.</div>';
  }
  if (rows.length) {
    h += '<div class="mt14" aria-live="polite">' + rows.map(row =>
      '<div class="task' + (row.guardianRequestId ? ' manager-guardian-request' : '') + '"><div class="task-body"><div class="between"><div class="task-t">' + esc(row.title) + '</div><span class="tag high">' + esc(row.kind) + '</span></div>' +
      '<div class="meta"><span class="tag">' + esc(row.requester) + '</span><span class="tag">' + esc(row.detail) + '</span></div></div>' +
      (row.guardianRequestId ? guardianRequestControlsHtml(row) :
        '<button class="btn btn-sm btn-primary" data-go="' + esc(row.route) + '">검토하기</button>') + '</div>'
    ).join('') + '</div>';
