<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>업무지시서 · WB 웩슬러브레인센터</title>
<meta name="theme-color" content="#1B3A5C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue:       #1E9DD6;
    --deep-blue:  #0F7AAB;
    --navy:       #1B3A5C;
    --coral:      #E85D4A;
    --ivory:      #FAF8F3;
    --dark-gray:  #2D2D2D;
    --mid-gray:   #6B7280;
    --line:       #E5E7EB;
    --light-gray: #F3F4F6;
    --white:      #FFFFFF;
    --green:      #16A34A;
    --amber:      #D97706;
  }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--dark-gray);
    background: var(--ivory);
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
    padding-bottom: 48px;
  }

  button, input, select, textarea { font-family: inherit; font-size: 100%; color: inherit; }
  button { cursor: pointer; border: none; background: none; }

  .wrap { max-width: 760px; margin: 0 auto; padding: 0 14px; }

  /* ─── 상단 바 ─── */
  .topbar { background: var(--navy); color: var(--white); padding: 12px 0; position: sticky; top: 0; z-index: 50; }
  .topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .brand { font-size: 15px; font-weight: 900; letter-spacing: -0.02em; }
  .brand span { color: var(--blue); }
  .brand small { display: block; font-size: 11px; font-weight: 400; color: rgba(255,255,255,0.6); letter-spacing: 0; }
  .whoami {
    font-size: 12px; font-weight: 700; background: rgba(255,255,255,0.14);
    padding: 6px 12px; border-radius: 999px; display: flex; align-items: center; gap: 6px;
  }
  .whoami i { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); font-style: normal; }
  .whoami.off i { background: var(--mid-gray); }

  /* ─── 탭 ─── */
  .tabs { background: var(--white); border-bottom: 1px solid var(--line); position: sticky; top: 55px; z-index: 40; }
  .tabs .wrap { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
  .tabs .wrap::-webkit-scrollbar { display: none; }
  .tab {
    padding: 13px 14px; font-size: 14px; font-weight: 700; color: var(--mid-gray);
    border-bottom: 3px solid transparent; white-space: nowrap; display: flex; align-items: center; gap: 5px;
  }
  .tab.on { color: var(--deep-blue); border-bottom-color: var(--blue); }
  .badge {
    background: var(--coral); color: var(--white); font-size: 11px; font-weight: 900;
    min-width: 18px; height: 18px; border-radius: 999px; padding: 0 5px;
    display: inline-flex; align-items: center; justify-content: center;
  }

  /* ─── 카드 ─── */
  .card { background: var(--white); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .card.alert { border-color: var(--coral); background: #FFF9F8; }
  .card-title { font-size: 15px; font-weight: 900; margin-bottom: 4px; }
  .card-sub { font-size: 13px; color: var(--mid-gray); }
  main { padding-top: 16px; }

  .row { display: flex; align-items: center; gap: 10px; }
  .wraprow { flex-wrap: wrap; }
  .between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .muted { color: var(--mid-gray); }
  .small { font-size: 12px; }
  .mb8 { margin-bottom: 8px; } .mb14 { margin-bottom: 14px; } .mt14 { margin-top: 14px; }

  /* ─── 버튼 ─── */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 11px 16px; border-radius: 10px; font-size: 14px; font-weight: 700;
    background: var(--light-gray); color: var(--dark-gray); border: 1px solid transparent;
  }
  .btn:active { filter: brightness(0.94); }
  .btn-primary { background: var(--blue); color: var(--white); }
  .btn-navy { background: var(--navy); color: var(--white); }
  .btn-ghost { background: var(--white); border-color: var(--line); }
  .btn-danger { background: #FEF2F2; color: var(--coral); }
  .btn-warn { background: #FFF7ED; color: var(--amber); border: 1px solid #FDE8CC; }
  .btn-sm { padding: 7px 11px; font-size: 12.5px; border-radius: 8px; }
  .btn-block { display: flex; width: 100%; }
  .btn:disabled { opacity: .5; cursor: default; }

  /* ─── 폼 ─── */
  label.fl { display: block; font-size: 12.5px; font-weight: 700; color: var(--mid-gray); margin-bottom: 5px; }
  .in { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--white); font-size: 14.5px; }
  .in:focus { outline: 2px solid rgba(30,157,214,.35); outline-offset: -1px; border-color: var(--blue); }
  textarea.in { resize: vertical; min-height: 62px; line-height: 1.6; }
  .field { margin-bottom: 12px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip { padding: 8px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--white); font-size: 13px; font-weight: 700; color: var(--mid-gray); }
  .chip.on { background: var(--navy); border-color: var(--navy); color: var(--white); }
  .chip.dow { min-width: 42px; padding: 8px 0; text-align: center; justify-content: center; }

  /* ─── 수업 등록 폼 ─── */
  .lesson-slot { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; background: #FCFDFE; }
  .lesson-slot .grid2 { margin-top: 10px; }
  .lesson-review { border-color: #F6D6A6; background: #FFFBF3; }
  .lesson-confirmed { border-color: #B9E3C7; background: #F3FCF6; }

  /* ─── 날짜 네비 ─── */
  .datenav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px; }
  .datenav .d { font-size: 17px; font-weight: 900; }
  .datenav .d em { font-style: normal; font-size: 13px; font-weight: 700; color: var(--blue); margin-left: 6px; }
  .navbtn { width: 38px; height: 38px; border-radius: 10px; background: var(--white); border: 1px solid var(--line); font-size: 16px; font-weight: 900; color: var(--mid-gray); }

  /* ─── 진행률 ─── */
  .prog { display: flex; align-items: center; gap: 14px; }
  .ring {
    width: 62px; height: 62px; border-radius: 50%; flex-shrink: 0;
    display: grid; place-items: center; font-weight: 900; color: var(--navy);
    background: conic-gradient(var(--blue) calc(var(--p) * 1%), var(--light-gray) 0);
    position: relative;
  }
  .ring::after { content: ''; position: absolute; inset: 7px; background: var(--white); border-radius: 50%; }
  .ring b { position: relative; z-index: 1; font-size: 15px; }
  .bar { height: 8px; border-radius: 99px; background: var(--light-gray); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--blue); border-radius: 99px; }
  .bar.mini { height: 5px; }
  .bar.doing i { background: var(--amber); }

  /* ─── 업무 항목 ─── */
  .task { display: flex; gap: 12px; align-items: flex-start; padding: 14px 4px; border-bottom: 1px solid var(--light-gray); }
  .task:last-child { border-bottom: none; }
  .task.isblocked { background: #FFF9F8; border-radius: 10px; padding-left: 10px; padding-right: 10px; }
  .box {
    width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0; margin-top: 1px;
    border: 2px solid #D1D5DB; background: var(--white);
    display: grid; place-items: center; color: transparent; font-size: 15px; font-weight: 900;
  }
  .task.done .box { background: var(--blue); border-color: var(--blue); color: var(--white); }
  .task.doing .box { border-color: var(--amber); }
  .task-body { flex: 1; min-width: 0; }
  .task-t { font-size: 15px; font-weight: 700; line-height: 1.45; word-break: keep-all; }
  .task.done .task-t { color: var(--mid-gray); text-decoration: line-through; }
  .task-d { font-size: 13px; color: var(--mid-gray); margin-top: 3px; white-space: pre-wrap; word-break: break-word; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; align-items: center; }
  .tag { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: var(--light-gray); color: var(--mid-gray); }
  .tag.time { background: #EAF6FC; color: var(--deep-blue); }
  .tag.high { background: #FEF2F2; color: var(--coral); }
  .tag.ok   { background: #ECFDF5; color: var(--green); }
  .tag.doing{ background: #FFF7ED; color: var(--amber); }
  .tag.blk  { background: var(--coral); color: var(--white); }
  .tag.carry{ background: #FEF2F2; color: var(--coral); }
  .tag.add  { background: #ECFDF5; color: var(--green); }
  .tag.edit { background: #FFF7ED; color: var(--amber); }
  .note { margin-top: 8px; width: 100%; font-size: 13px; padding: 8px 10px; border: 1px dashed var(--line); border-radius: 8px; background: var(--ivory); }
  .empty { text-align: center; padding: 40px 16px; color: var(--mid-gray); font-size: 14px; }
  .empty b { display: block; font-size: 30px; margin-bottom: 8px; }

  /* ─── 개인 링크 기기 연결 ─── */
  .link-gate { margin-top: 14px; }
  .link-gate .card-title { font-size: 17px; }
  .link-gate .guide { margin: 14px 0; }
  .link-problem { margin: 12px 0; padding: 11px 12px; border: 1px solid #F6D6A6; border-radius: 10px; background: #FFFBF3; color: #8A4B08; font-size: 13px; line-height: 1.65; }
  .link-problem.bad { border-color: #F3B8B0; background: #FFF5F3; color: #A13A2D; }
  .link-actions { display: grid; gap: 8px; margin-top: 14px; }

  /* ─── 단계 / 가이드 ─── */
  .opener { font-size: 12.5px; font-weight: 700; color: var(--deep-blue); padding: 4px 0; margin-top: 6px; }
  .panel { margin-top: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: #FCFDFE; }
  .guide { background: #F0F9FF; border: 1px solid #D5EBF7; border-radius: 8px; padding: 10px 12px; font-size: 13px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .guide b { display: block; color: var(--deep-blue); font-size: 12px; margin-bottom: 4px; }
  .step { display: flex; gap: 9px; align-items: flex-start; padding: 7px 0; font-size: 13.5px; }
  .sbox {
    width: 20px; height: 20px; border-radius: 6px; flex-shrink: 0; margin-top: 1px;
    border: 2px solid #D1D5DB; background: var(--white);
    display: grid; place-items: center; color: transparent; font-size: 12px; font-weight: 900;
  }
  .step.on .sbox { background: var(--green); border-color: var(--green); color: var(--white); }
  .step.on span { color: var(--mid-gray); text-decoration: line-through; }
  .counter { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; font-weight: 700; }
  .counter input { width: 74px; text-align: center; padding: 8px; }

  /* ─── 주간 그리드 ─── */
  .weekwrap { overflow-x: auto; }
  table.week { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 480px; }
  table.week th, table.week td { border: 1px solid var(--line); padding: 7px 6px; text-align: center; }
  table.week th.n, table.week td.n { text-align: left; width: 38%; font-weight: 700; }
  table.week thead th { background: var(--light-gray); font-size: 12px; color: var(--mid-gray); font-weight: 700; }
  table.week thead th.today { background: var(--navy); color: var(--white); }
  .dot { width: 20px; height: 20px; border-radius: 6px; display: inline-block; background: var(--light-gray); line-height: 20px; color: transparent; font-size: 12px; font-weight: 900; }
  .dot.done { background: var(--blue); color: var(--white); }
  .dot.doing { background: #FCD9A5; color: var(--amber); }
  .dot.blocked { background: var(--coral); color: var(--white); }
  .dot.miss { background: #FDE8E4; }
  .dot.none { background: transparent; }

  /* ─── 수업 현황 ─── */
  .schedule-note { margin: 12px 0; padding: 10px 12px; border: 1px solid #D5EBF7; border-radius: 10px; background: #F0F9FF; color: var(--deep-blue); font-size: 12.5px; line-height: 1.6; }
  .schedule-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 12px 0; }
  .schedule-kpi { min-width: 0; padding: 12px 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--white); text-align: center; }
  .schedule-kpi b { display: block; color: var(--navy); font-size: 20px; line-height: 1.1; }
  .schedule-kpi span { display: block; margin-top: 5px; color: var(--mid-gray); font-size: 10.5px; font-weight: 700; line-height: 1.25; }
  .schedule-kpi.is-alert { border-color: #F3B8B0; background: #FFF7F5; }
  .schedule-kpi.is-alert b { color: #9E3629; }
  .schedule-summary { display: flex; width: 100%; min-width: 0; flex-wrap: wrap; gap: 7px; margin: 10px 0 12px; }
  .schedule-summary span { min-width: 0; padding: 7px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--white); color: var(--mid-gray); font-size: 11.5px; font-weight: 700; }
  .schedule-summary b { color: var(--navy); font-size: 13px; }
  .schedule-timeline-card { width: 100%; min-width: 0; padding: 0; overflow: hidden; }
  .schedule-timeline-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .schedule-legend { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 5px 10px; color: var(--mid-gray); font-size: 10.5px; font-weight: 700; }
  .schedule-legend-item { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .schedule-legend-dot { width: 8px; height: 8px; border-radius: 3px; background: #D9EFF9; border: 1px solid var(--blue); }
  .schedule-legend-dot.current { background: var(--deep-blue); border-color: var(--deep-blue); }
  .schedule-legend-dot.next { background: #FFF1D6; border-color: var(--amber); }
  .schedule-legend-dot.conflict { background: #FDE8E4; border-color: var(--coral); }
  .schedule-timeline-scroll { width: 100%; max-width: 100%; overflow-x: auto; overscroll-behavior-inline: contain; scrollbar-color: #C7D2DB transparent; }
  .schedule-timeline-grid { --teacher-w: 88px; display: grid; grid-template-columns: var(--teacher-w) var(--time-w); width: calc(var(--teacher-w) + var(--time-w)); min-width: 100%; }
  .schedule-timeline-corner, .schedule-timeline-teacher { position: sticky; left: 0; z-index: 4; border-right: 1px solid var(--line); background: var(--white); }
  .schedule-timeline-corner { display: grid; place-items: center; height: 42px; color: var(--mid-gray); font-size: 10.5px; font-weight: 800; }
  .schedule-timeline-axis { position: relative; height: 42px; background: #F8FAFC; }
  .schedule-axis-label { position: absolute; top: 12px; transform: translateX(-50%); color: var(--mid-gray); font-size: 10px; font-weight: 700; white-space: nowrap; }
  .schedule-axis-label.first { transform: none; }
  .schedule-axis-label.last { transform: translateX(-100%); }
  .schedule-axis-line { position: absolute; top: 34px; bottom: 0; width: 1px; background: #D8DEE5; }
  .schedule-timeline-teacher { display: flex; min-height: 60px; align-items: center; justify-content: center; padding: 8px 5px; text-align: center; }
  .schedule-timeline-teacher b { display: block; color: var(--navy); font-size: 12px; line-height: 1.35; word-break: keep-all; }
  .schedule-timeline-teacher span { display: block; margin-top: 3px; color: var(--mid-gray); font-size: 9.5px; }
  .schedule-timeline-track { position: relative; min-height: 60px; border-top: 1px solid var(--line); background-color: #FCFDFE; background-image: repeating-linear-gradient(to right, transparent 0, transparent calc(var(--half-hour) - 1px), #EDF0F3 calc(var(--half-hour) - 1px), #EDF0F3 var(--half-hour)); }
  .schedule-timeline-block { position: absolute; z-index: 2; height: 42px; min-width: 38px; overflow: hidden; padding: 5px 7px; border: 1px solid #8DCAE5; border-radius: 8px; background: #EAF6FC; color: var(--navy); text-align: left; box-shadow: 0 2px 5px rgba(27,58,92,.08); }
  .schedule-timeline-block strong, .schedule-timeline-block small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .schedule-timeline-block strong { font-size: 11.5px; line-height: 1.35; }
  .schedule-timeline-block small { margin-top: 2px; font-size: 9.5px; line-height: 1.2; opacity: .82; }
  .schedule-timeline-block.is-ended { border-color: #D1D5DB; background: #F3F4F6; color: var(--mid-gray); opacity: .62; box-shadow: none; }
  .schedule-timeline-block.is-next { border-color: #F2B85C; background: #FFF7E8; color: #8A4B05; }
  .schedule-timeline-block.is-current { border-color: var(--deep-blue); background: var(--deep-blue); color: var(--white); box-shadow: 0 3px 10px rgba(15,122,171,.28); }
  .schedule-timeline-block.is-conflict { border-color: var(--coral); outline: 2px solid rgba(232,93,74,.26); background: #FFF1EF; color: #9E3629; }
  .schedule-timeline-block.is-conflict::after { content: '!'; position: absolute; top: 2px; right: 3px; display: grid; place-items: center; width: 11px; height: 11px; border-radius: 50%; background: var(--coral); color: var(--white); font-size: 8px; font-weight: 900; }
  .schedule-timeline-block.is-current.is-conflict { background: #B94234; color: var(--white); }
  .schedule-now-line { position: absolute; top: 0; bottom: 0; z-index: 1; width: 2px; background: var(--coral); pointer-events: none; }
  .schedule-now-label { position: absolute; top: 1px; z-index: 2; transform: translateX(-50%); padding: 1px 4px; border-radius: 4px; background: var(--coral); color: var(--white); font-size: 9px; font-weight: 900; white-space: nowrap; }
  .schedule-timeline-empty { padding: 30px 16px; }
  .schedule-role { color: var(--mid-gray); font-size: 11.5px; font-weight: 600; }
  .schedule-issues { margin-top: 12px; border-color: #F6D6A6; background: #FFFBF3; }
  .schedule-issues > summary, .schedule-roster-only > summary, .schedule-more > summary { list-style: none; cursor: pointer; }
  .schedule-issues > summary::-webkit-details-marker, .schedule-roster-only > summary::-webkit-details-marker,
  .schedule-more > summary::-webkit-details-marker { display: none; }
  .schedule-issues > summary, .schedule-roster-only > summary { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .schedule-issues > summary > span:first-child > b, .schedule-issues > summary .card-sub,
  .schedule-roster-only > summary > span:first-child > b, .schedule-roster-only > summary .card-sub { display: block; }
  .schedule-issues > summary .card-sub, .schedule-roster-only > summary .card-sub { margin-top: 2px; }
  .schedule-issues > summary::after, .schedule-roster-only > summary::after, .schedule-more > summary::after { content: '펼치기'; color: var(--deep-blue); font-size: 11px; font-weight: 800; }
  .schedule-issues[open] > summary::after, .schedule-roster-only[open] > summary::after, .schedule-more[open] > summary::after { content: '접기'; }
  .schedule-issues-body, .schedule-roster-only-body { margin-top: 10px; padding-top: 2px; border-top: 1px solid #F3E2C8; }
  .schedule-issue { padding: 10px 0; border-top: 1px solid #F3E2C8; }
  .schedule-issue:first-child { border-top: 0; }
  .schedule-toolbar { min-width: 0; padding: 14px; }
  .schedule-toolbar .between { min-width: 0; }
  .schedule-toolbar .chips { flex: 1 1 auto; min-width: 0; margin-top: 0; }
  .schedule-search { margin-top: 10px; }
  .schedule-card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); align-items: start; gap: 10px; }
  .schedule-week-grid { grid-template-columns: 1fr; }
  .schedule-day-card, .schedule-person-card { margin-bottom: 0; }
  .schedule-day-card.is-today { border-color: var(--deep-blue); box-shadow: 0 0 0 2px rgba(15,122,171,.1); }
  .schedule-day-card.is-attention, .schedule-person-card.is-attention { border-left: 4px solid var(--coral); background: linear-gradient(90deg, #FFF8F6 0, var(--white) 30%); }
  .schedule-day-head { min-width: 0; }
  .schedule-day-body { min-width: 0; }
  .schedule-list-row { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 10px; padding: 9px 0; border-top: 1px solid var(--light-gray); }
  .schedule-list-row:first-child { border-top: 0; }
  .schedule-list-row.is-conflict { margin: 0 -6px; padding-right: 6px; padding-left: 6px; border-radius: 8px; background: #FFF5F3; }
  .schedule-list-time { color: var(--deep-blue); font-size: 12px; font-weight: 900; }
  .schedule-list-main { min-width: 0; font-size: 13px; }
  .schedule-person-meta { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0; }
  .schedule-pending-line { margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: #FFF7ED; color: #92400E; font-size: 11.5px; font-weight: 700; }
  .schedule-day-card .pill.bad, .schedule-person-card .pill.bad { color: #9E3629; }
  .schedule-day-card .pill.warn, .schedule-issues .pill.warn { color: #92400E; }
  .schedule-info { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--light-gray); }
  .schedule-info summary { color: var(--deep-blue); font-size: 12.5px; font-weight: 800; cursor: pointer; }
  .schedule-info-row { padding: 6px 0; font-size: 12px; line-height: 1.55; }

<script>
"use strict";

/* ══════════════════════════════════════════════════════
   1. 저장소
   ══════════════════════════════════════════════════════ */
const SAFE_SCOPE_ID = (/^[A-Za-z0-9_-]{1,128}$/.test(new URLSearchParams(location.search).get('u') || ''))
  ? new URLSearchParams(location.search).get('u') : '';
const HAS_PERSON_SCOPE = !!SAFE_SCOPE_ID;
document.documentElement.classList.toggle('person-mobile', HAS_PERSON_SCOPE);
const LS_KEY = HAS_PERSON_SCOPE ? 'wb_taskboard_person_v1_' + SAFE_SCOPE_ID : 'wb_taskboard_v1';
const DOW = ['일','월','화','수','목','금','토'];

const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id' + Date.now() + Math.random().toString(16).slice(2));
const now = () => Date.now();

function blankState() {
  return {
    version: 2,
    staff: [],
    tasks: [],
    checks: {},
    settings: { adminPin: '', syncUrl: '', syncSecret: '', centerName: 'WB 웩슬러브레인센터' }
  };
}

let state = blankState();

function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      state = Object.assign(blankState(), p);
      state.settings = Object.assign(blankState().settings, p.settings || {});
    }
  } catch (e) { console.warn('load failed', e); }
}

function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  catch (e) { toast('저장 공간이 부족합니다'); }
}

/* ══════════════════════════════════════════════════════
   2. 날짜 유틸
   ══════════════════════════════════════════════════════ */
function ymd(d) {
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function parseYmd(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
function today() { return ymd(new Date()); }
function nowHM() { const d = new Date(); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
function dowOf(s) { return parseYmd(s).getDay(); }
function label(s) { const d = parseYmd(s); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + DOW[d.getDay()] + ')'; }
function shortDate(s) { const d = parseYmd(s); return (d.getMonth() + 1) + '/' + d.getDate(); }
function relLabel(s) {
  const diff = Math.round((parseYmd(s) - parseYmd(today())) / 86400000);
  if (diff === 0) return '오늘';
  if (diff === -1) return '어제';
  if (diff === 1) return '내일';
  return null;
}
function mondayOf(s) { const d = parseYmd(s); return addDays(s, -((d.getDay() + 6) % 7)); }

/* ══════════════════════════════════════════════════════
   3. 도메인 로직
   ══════════════════════════════════════════════════════ */
const liveStaff = () => state.staff.filter(s => !s.deleted);
/** 통계에 넣을 사람 — 대표는 제외한다. 대표 업무가 섞이면 직원 수행률이 흐려진다. */
const teamStaff = () => liveStaff().filter(s => !s.owner);
const owners = () => liveStaff().filter(s => s.owner);
const staffById = id => state.staff.find(s => s.id === id);
const staffByName = n => liveStaff().find(s => s.name === String(n || '').trim());

function occursOn(task, date) {
  if (task.deleted) return false;
  if (task.start && date < task.start) return false;
  if (task.end && date > task.end) return false;
  switch (task.repeat) {
    case 'once':    return date === task.start;
    case 'daily':   return true;
    case 'weekday': { const w = dowOf(date); return w >= 1 && w <= 5; }
    case 'days':    return (task.days || []).includes(dowOf(date));
    default:        return false;
  }
}

function tasksFor(staffId, date) {
  return state.tasks
    .filter(t => t.staffId === staffId && occursOn(t, date))
    .sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99')
                 || (b.priority === 'high') - (a.priority === 'high')
                 || (a.createdAt || 0) - (b.createdAt || 0));
}

const ckey = (taskId, date) => taskId + '|' + date;
const getCheck = (taskId, date) => state.checks[ckey(taskId, date)] || null;
const isDone = (taskId, date) => !!(state.checks[ckey(taskId, date)] || {}).done;

function setCheck(taskId, date, patch) {
  const k = ckey(taskId, date);
  const cur = state.checks[k] || { taskId: taskId, date: date, done: false, note: '', steps: {}, count: 0, blocked: false };
  const next = Object.assign({}, cur, patch, { updatedAt: now() });
  state.checks[k] = next;
  save();
  queueSync();
  return next;
}

/* ══════════════════════════════════════════════════════
   3-1. 기기 대장 (태블릿)
   ── 저장은 checks에 '__asset__<번호>|all' 키로 얹는다. 출결(__st__)·
      온라인프로그램(__op__)이 이미 같은 방식이라 백엔드를 건드리지 않는다.
   ── 서버는 개인 링크의 '__프리픽스__<값>' 쓰기를 값 === 본인 staffId 일 때만
      허용한다(worker-core.js). 기기 번호는 staffId가 아니므로 대장 편집은
      원장 화면 전용이다. 직원에게 필요한 기기 정보는 업무지시서로 내려간다.
   ══════════════════════════════════════════════════════ */
const AC = () => window.WBAssetCore;

function allAssets() {
  const core = AC();
  if (!core) return [];
  return Object.keys(state.checks || {})
    .filter(core.isAssetKey)
    .map(k => core.normalizeAsset(state.checks[k]))
    .filter(a => a.id && !a.deleted)
    .sort((a, b) => a.id.localeCompare(b.id, 'en'));
}

function getAsset(id) {
  const core = AC();
  if (!core || !id) return null;
  const row = state.checks[core.assetKey(id)];
  return row ? core.normalizeAsset(row) : null;
}

function setAsset(id, patch) {
  const core = AC();
  if (!core || !id) return null;
  const k = core.assetKey(id);
  const cur = state.checks[k] || { id: id };
  const next = core.normalizeAsset(Object.assign({}, cur, patch, { id: id }));
  next.updatedAt = now();
  state.checks[k] = next;
  save();
  queueSync();
  return next;
}

/** 단계·수량을 고려한 개별 업무 진행률 */
function taskProgress(t, c) {
  const steps = t.steps || [];
  if (steps.length) {
    const done = steps.filter(s => c && c.steps && c.steps[s.id]).length;
    return { done: done, total: steps.length, unit: '단계', pct: Math.round(done / steps.length * 100) };
  }
  if (t.target) {
    const n = (c && c.count) || 0;
    return { done: n, total: t.target, unit: t.unit || '건', pct: Math.min(100, Math.round(n / t.target * 100)) };
  }
  const d = (c && c.done) ? 1 : 0;
  return { done: d, total: 1, unit: '', pct: d * 100 };
}

/** 미착수 todo / 진행중 doing / 완료 done / 막힘 blocked */
function statusOf(t, date) {
  const c = getCheck(t.id, date);
  if (c && c.blocked) return 'blocked';
  if (c && c.done) return 'done';
  if (taskProgress(t, c).done > 0) return 'doing';
  return 'todo';
}
const STATUS_LABEL = { todo: '미착수', doing: '진행중', done: '완료', blocked: '막힘' };

/** 단계·수량이 다 차면 자동 완료, 되돌리면 자동 해제.
 *  둘 다 있는 업무는 단계도 끝나고 수량도 채워져야 완료다. */
function syncAuto(t, date) {
  const c = getCheck(t.id, date);
  if (!c) return;
  const hasSteps = (t.steps || []).length > 0, hasTarget = !!t.target;
  if (!hasSteps && !hasTarget) return;
  const stepsOk = !hasSteps || t.steps.every(s => c.steps && c.steps[s.id]);
  const countOk = !hasTarget || ((c.count || 0) >= t.target);
  const full = stepsOk && countOk;
  if (full && !c.done) setCheck(t.id, date, { done: true, at: now() });
  else if (!full && c.done) setCheck(t.id, date, { done: false, at: null });
}

function progress(staffId, date) {
  const list = tasksFor(staffId, date);
  const done = list.filter(t => isDone(t.id, date)).length;
  return { done: done, total: list.length, pct: list.length ? Math.round(done / list.length * 100) : 0 };
}

function weekProgress(staffId, anchor) {
  const mon = mondayOf(anchor);
  let done = 0, total = 0;
  for (let i = 0; i < 7; i++) { const p = progress(staffId, addDays(mon, i)); done += p.done; total += p.total; }
  return { done: done, total: total, pct: total ? Math.round(done / total * 100) : 0 };
}

function streak(staffId) {
  let d = today(), n = 0;
  for (let i = 0; i < 120; i++) {
    const p = progress(staffId, d);
    if (p.total === 0) { d = addDays(d, -1); continue; }
    if (p.done < p.total) break;
    n++; d = addDays(d, -1);
  }
  return n;
}

/** 이월: 최근 7일 안에 못 끝낸 '이월' 업무 */
function carryOver(staffId, date) {
  const out = [];
  for (let i = 1; i <= 7; i++) {
    const d = addDays(date, -i);
    tasksFor(staffId, d).forEach(t => {
      if (!t.carry || isDone(t.id, d)) return;
      out.push({ t: t, date: d });
    });
  }
  return out.sort((a, b) => a.date.localeCompare(b.date));
}

/** 그 주에 직원이 스스로 추가한 업무 */
function staffAdded(anchor) {
  const mon = mondayOf(anchor);
  const days = Array.from({ length: 7 }, (_, i) => addDays(mon, i));
  const out = [];
  state.tasks.forEach(t => {
    if (t.deleted || t.origin !== 'staff') return;
    const s = staffById(t.staffId);
    if (!s || s.owner) return;              // 대표가 스스로 넣은 건 '직원 추가'가 아니다
    days.forEach(d => { if (occursOn(t, d)) out.push({ t: t, date: d }); });
  });
  return out.sort((a, b) => a.date.localeCompare(b.date));
}

/** 원장이 바로 봐야 할 것: 막힘 + 예정 시각이 지난 미완료 */
function alertsToday() {
  const d = today(), hm = nowHM();
  let blocked = 0, overdue = 0;
  liveStaff().forEach(s => tasksFor(s.id, d).forEach(t => {
    const c = getCheck(t.id, d);
    if (c && c.blocked) { blocked++; return; }
    if (c && c.done) return;
    if (t.time && t.time < hm) overdue++;
  }));
  return { blocked: blocked, overdue: overdue, total: blocked + overdue };
}

/* ══════════════════════════════════════════════════════
   4. 동기화 (선택) — Google Apps Script 웹앱
   ══════════════════════════════════════════════════════ */
/* 동기화 — Cloudflare Workers + D1
 * 예전에는 매번 전체 상태를 통째로 주고받았다. 학생이 100명이 되면
 * 한 명이 체크 하나를 눌러도 나머지 99명 데이터가 오가서 감당이 안 된다.
 * 지금은 (1) 마지막 동기화 이후 바뀐 것만 (2) 학생은 자기 것만 주고받는다. */
const SYNC_URL = 'https://wb-sync.whdudwns33.workers.dev';
const SYNC_APP = 'task';
const CONTACT_CHECK_PREFIX = '__contact__';
const isContactCheckKey = key => String(key || '').split('|')[0].startsWith(CONTACT_CHECK_PREFIX);

/** 이 체크가 누구 것인지 — 서버가 학생별로 나눠 담는 기준이 된다.
 *  '__st__S1|2026-08-02' → S1,  '<taskId>|날짜' → 그 업무의 담당자 */
function ownerOfCheck(key) {
  const tid = String(key).split('|')[0];
  /* 기기 대장은 담당자별로 쪼개지 않는다. 여기서 걸러내지 않으면
     기기 번호가 담당자 id 자리에 들어가 조회 분할이 어긋난다. */
  if (window.WBAssetCore && window.WBAssetCore.isAssetKey(key)) return null;
  /* 연락 기록은 기존 수업 체크와 분리하지만, 동기화 소유자는 그 수업 담당자다. */
  if (isContactCheckKey(key)) return String(((state.checks[key] || {}).contact || {}).byStaffId || '') || null;
  /* 신규 학생 적응 기록은 stable studentId로 묶인다. 이를 직원 id로 오인하면
     개인 링크에 다른 학생 기록이 섞일 수 있으므로 관리자 범위에만 둔다. */
  if (/^__onboarding__/.test(tid)) return null;
  const m = tid.match(/^__[a-zA-Z]+__(.+)$/);
  if (m) return m[1];
  const t = (state.tasks || []).find(x => x.id === tid);
  return t ? (t.staffId || null) : null;
}

function onboardingReconcileChanges() {
  return Object.keys(state.checks || {}).filter(key => {
    const row = state.checks[key];
    return /^__onboarding__/.test(key) && row && row.casVersion === 1;
  }).map(key => ({ table: 'checks', k: key, owner: null, reconcile: true }));
}

/** 권한 근거가 아니라, 재로드 뒤에도 전체 관리 캐시를 지워야 함을 기억하는 표식이다. */
function hasSensitiveManagerCache(previousRole) {
  return previousRole === 'manager' || sync.accessRole === 'manager' ||
    state.settings.managerCacheSensitive === true;
}

const sync = {
  busy: false, dirty: false, last: null, timer: null, loud: false, err: '', personVerified: false, accessRole: '',

  /** 원장은 비밀키로, 학생은 개인 링크에 담겨 온 토큰으로 접속한다 */
  auth() {
    if (session.isStaffLink) {
      const t = state.settings.myToken || '';
      return t ? { mode: 'person', id: session.staffId, token: t } : null;
    }
    const k = state.settings.syncSecret || '';
    return k ? { mode: 'admin', secret: k } : null;
  },
  enabled() { return !!this.auth(); },

  /** since 이후 바뀐 것만 모은다. 각 레코드가 이미 updatedAt을 갖고 있어
   *  저장 지점마다 표시를 남기지 않아도 변경분을 정확히 골라낼 수 있다. */
  collect(since) {
    const out = [];
    (state.staff || []).forEach(s => {
      if ((s.updatedAt || 0) > since) out.push({ table: 'staff', id: s.id, owner: s.id, data: s, updated_at: s.updatedAt || 0 });
    });
    (state.tasks || []).forEach(t => {
      if ((t.updatedAt || 0) > since) out.push({ table: 'tasks', id: t.id, owner: t.staffId || null, data: t, updated_at: t.updatedAt || 0 });
    });
    Object.keys(state.checks || {}).forEach(k => {
      const c = state.checks[k];
      if (isContactCheckKey(k)) return; // 서버 검증 정본은 generic LWW로 다시 올리지 않는다.
      if (c && (c.updatedAt || 0) > since) out.push({ table: 'checks', k: k, owner: ownerOfCheck(k), data: c, updated_at: c.updatedAt || 0 });
    });
    return out;
  },

  /** 받은 변경을 반영한다. 내 것이 더 최신이면 그대로 둔다 */
  apply(changes) {
    let n = 0;
    (changes || []).forEach(ch => {
      if (!ch || !ch.data) return;
      const at = ch.data.updatedAt || 0;
      if (ch.table === 'checks') {
        const cur = state.checks[ch.key];
        const onboardingStudentId = String(ch.data.studentId || '');
        const authoritativeOnboarding = ch.authoritative === true && ch.data.casVersion === 1 &&
          /^__onboarding__/.test(String(ch.key || '')) &&
          at >= Number(onboardingServerConfirmedAt.get(onboardingStudentId) || 0);
        if (!cur || authoritativeOnboarding || at > (cur.updatedAt || 0)) {
          state.checks[ch.key] = ch.data;
          if (authoritativeOnboarding) onboardingServerConfirmedAt.set(onboardingStudentId, Number(at) || 0);
          n++;
        }
      } else if (ch.table === 'staff' || ch.table === 'tasks') {
        const arr = state[ch.table];
        const i = arr.findIndex(x => x.id === ch.key);
        if (i < 0) { arr.push(ch.data); n++; }
        else if (at > (arr[i].updatedAt || 0)) { arr[i] = ch.data; n++; }
      }
    });
    return n;
  },

  async post(path, body) {
    const res = await fetch(SYNC_URL + path, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const d = await res.json().catch(() => null);
    if (!d || d.ok !== true) {
      const error = new Error((d && (d.error || d.message)) || ('HTTP ' + res.status));
      error.status = res.status;
      error.code = String(d && (d.code || d.errorCode || d.reason) || '');
      error.current = d && d.current || null;
      error.apiResponse = !!d;
      const personRequest = body && body.auth && body.auth.mode === 'person';
      if (path !== '/sync' && session.isStaffLink && personRequest &&
          (res.status === 401 || res.status === 403)) {
        handlePersonAuthRejection(error, false);
      }
      throw error;
    }
    return d;
  },

  async run() {
    const auth = this.auth();
    if (!auth) {
      if (session.isStaffLink && hasSensitiveManagerCache('')) resetPersonCache('');
      else this.accessRole = '';
      return false;
    }
    if (this.busy) return false;
    const previousAccessRole = this.accessRole;
    let nextAccessRole = '';
    this.busy = true; paintStatus();
    try {
      const t0 = now();
      const needsAccessRender = session.isStaffLink && !this.personVerified;
      let applied = 0;
      const pending = this.collect(Number(state.settings.pushAt) || 0);
      let reconcileQueued = false;
      let reconcileOutstanding = 0;
      const queueOnboardingReconcile = eligible => {
        if (!eligible || reconcileQueued || Number(state.settings.onboardingCasReconcileVersion) >= 1) return;
        const rows = onboardingReconcileChanges();
        reconcileQueued = true;
        reconcileOutstanding = rows.length;
        if (rows.length) pending.push(...rows);
        else state.settings.onboardingCasReconcileVersion = 1;
      };
      queueOnboardingReconcile(auth.mode === 'admin' || session.isManager);
      let guard = 0, again = true;
      while (again && guard++ < 60) {
        const batch = pending.splice(0, 400);
        const batchReconcileCount = batch.filter(change => change && change.reconcile === true).length;
        const d = await this.post('/sync', {
          app: SYNC_APP, auth: auth,
          since: Number(state.settings.pullAt) || 0,
          changes: batch
        });
        // 개인 잠금 중 완료된 오래된 요청이 민감 캐시를 다시 저장하지 못하게 한다.
        const currentAuth = this.auth();
        if (session.isStaffLink && (!currentAuth || currentAuth.token !== auth.token)) return false;
        if (auth.mode === 'person' && d.authRole !== 'manager' && d.authRole !== 'staff') {
          const roleError = new Error('개인 권한을 확인하지 못했습니다');
          roleError.status = 403; roleError.code = 'AUTH_REQUIRED';
          throw roleError;
        }
        const responseAccessRole = auth.mode === 'person' ? d.authRole : '';
        const managerCacheDowngraded = responseAccessRole === 'staff' &&
          (hasSensitiveManagerCache(previousAccessRole) || nextAccessRole === 'manager');
        const scopedCacheUpgraded = responseAccessRole === 'manager' &&
          !hasSensitiveManagerCache(previousAccessRole) && Number(state.settings.pullAt) > 0;
        const roleChangedDuringSync = !!nextAccessRole && nextAccessRole !== responseAccessRole;
        if (managerCacheDowngraded || scopedCacheUpgraded || roleChangedDuringSync) {
          resetPersonCache(auth.token);
          render();
          location.reload();
          return false;
        }
        nextAccessRole = responseAccessRole;
        applied += this.apply(d.changes);
        state.settings.pullAt = d.now;
        if (batchReconcileCount) {
          reconcileOutstanding = Math.max(0, reconcileOutstanding - batchReconcileCount);
          if (!reconcileOutstanding) state.settings.onboardingCasReconcileVersion = 1;
        }
        queueOnboardingReconcile(auth.mode === 'admin' || responseAccessRole === 'manager');
        again = !!d.more || pending.length > 0;
      }
      // 요청 도중에 바뀐 것은 updatedAt이 t0보다 크므로 다음 회차에 올라간다
      state.settings.pushAt = t0;
      if (auth.mode === 'person' && nextAccessRole === 'manager') state.settings.managerCacheSensitive = true;
      else delete state.settings.managerCacheSensitive;
      save();
      this.last = now(); this.dirty = false; this.err = '';
      this.accessRole = auth.mode === 'person' ? nextAccessRole : '';
      if (session.isStaffLink) {
        this.personVerified = true;
        personAccessProblem = null;
      }
      const accessRoleChanged = previousAccessRole !== this.accessRole;
      if (previousAccessRole === 'manager' && this.accessRole !== 'manager') render();
      else if (applied || needsAccessRender || accessRoleChanged) renderAfterSync();
      return true;
    } catch (e) {
      console.warn('sync', e);
      this.dirty = true; this.err = String(e && e.message || e);
      if (session.isStaffLink) {
        const problem = classifyPersonLinkError(e, 'session');
        const authRejected = Number(e && e.status) === 401 || Number(e && e.status) === 403 ||
          problem.kind === 'session_expired' || problem.kind === 'session_revoked' || problem.kind === 'auth_required';
        if (authRejected) {
          handlePersonAuthRejection(e, nextAccessRole === 'manager', problem);
        }
      }
      if (this.loud) toast('동기화 실패 — ' + this.err);
      return false;
    } finally {
      this.busy = false; this.loud = false; paintStatus();
    }
  },

  /** 장기 bearer 대신 24시간 안에 한 번만 교환할 링크 code를 발급한다. */
  async issueBootstrap(staffId) {
    const auth = this.auth();
    if (!auth || (auth.mode !== 'admin' && !session.isManager)) throw new Error('관리자 화면에서만 발급할 수 있습니다');
    return await this.post('/bootstrap', { app: SYNC_APP, auth: auth, staffId: staffId });
  },

  async exchangeBootstrap(staffId, code) {
    return await this.post('/exchange', { app: SYNC_APP, staffId: staffId, code: code });
  },

  async handoff() {
    const auth = this.auth();
    if (!auth || auth.mode !== 'person') throw new Error('개인 인증이 필요합니다');
    return await this.post('/handoff', { app: SYNC_APP, auth: auth });
  },

  async revokeAccess(staffId) {
    const auth = this.auth();
    if (!auth || (auth.mode !== 'admin' && !session.isManager)) throw new Error('관리자 화면에서만 해지할 수 있습니다');
    return await this.post('/revoke', { app: SYNC_APP, auth: auth, staffId: staffId });
  }
};

function classifyPersonLinkError(error, phase) {
  const code = String(error && error.code || '').toUpperCase();
  const message = String(error && error.message || error || '');
  const lower = message.toLowerCase();
  const status = Number(error && error.status) || 0;
  const result = (kind, title, detail, retryable, bad) => ({ kind, title, detail, retryable: !!retryable, bad: bad !== false });

  if (/LINK_REPLACED|BOOTSTRAP_REPLACED|LINK_REVOKED|BOOTSTRAP_REVOKED/.test(code) || /교체|새 링크.*발급|replac|revok/.test(lower)) {
    return result('replaced', '새 링크로 교체된 주소입니다', '원장님이 이 링크 뒤에 새 링크를 발급하여 이전 링크가 중지되었습니다. 가장 최근에 받은 링크를 사용해 주세요.');
  }
  if (/LINK_USED|BOOTSTRAP_USED|CODE_USED/.test(code)) {
    return result('used', '이미 한 번 사용한 링크입니다', '이 연결 코드는 다른 브라우저나 기기에서 이미 사용되었습니다. 해당 브라우저를 계속 사용하거나 새 개인 링크를 요청해 주세요.');
  }
  if (/LINK_EXPIRED|BOOTSTRAP_EXPIRED|CODE_EXPIRED/.test(code)) {
    return result('expired', '사용 시간이 지난 링크입니다', '개인 링크의 연결 가능 시간이 지났습니다. 원장님께 새 개인 링크를 요청해 주세요.');
  }
  if (/LINK_INVALID|BOOTSTRAP_INVALID|INVALID_CODE|STAFF_NOT_FOUND/.test(code) || /잘못된.*링크|invalid.*(?:link|code)/.test(lower)) {
    return result('invalid', '올바르지 않은 개인 링크입니다', '주소가 일부 빠졌거나 대상 정보가 맞지 않습니다. 카카오 메시지의 원본 링크 전체를 다시 확인해 주세요.');
  }
  if (/만료.*이미 사용|이미 사용.*만료/.test(message) || status === 410) {
    return result('used_or_expired', '이미 사용했거나 시간이 지난 링크입니다', '서버에서 이전 방식의 응답을 받아 두 상태를 더 세분하지 못했습니다. 가장 최근 링크인지 확인한 뒤 새 링크를 요청해 주세요.');
  }
  if (/TOKEN_REVOKED|SESSION_REVOKED/.test(code) || /토큰.*폐기|세션.*해지|revoked/.test(lower)) {
    return result('session_revoked', '이 브라우저의 연결이 해지되었습니다', '새 링크를 다른 기기에 연결했거나 원장님이 접속을 해지했습니다. 새 개인 링크로 이 기기를 다시 연결해 주세요.');
  }
  if (/TOKEN_EXPIRED|SESSION_EXPIRED/.test(code) || /토큰.*만료|세션.*만료/.test(lower)) {
    return result('session_expired', '이 브라우저의 연결 시간이 끝났습니다', '저장된 인증의 사용 기간이 끝났습니다. 새 개인 링크로 이 기기를 다시 연결해 주세요.');
  }
  if (/AUTH_REQUIRED|PERSON_AUTH_REQUIRED|UNAUTHORIZED/.test(code)
      || (phase === 'session' && status === 401)) {
    return result('auth_required', '이 브라우저에는 유효한 개인 인증이 없습니다', '업무 캐시가 보여도 인증이 확인된 상태는 아닙니다. 새 개인 링크로 이 기기를 연결해 주세요.');
  }
  if (!status || /network|fetch|failed|시간 초과|timeout/.test(lower)) {
    return result('network', '서버에 연결하지 못했습니다', '인터넷 연결을 확인한 뒤 같은 링크에서 다시 시도할 수 있습니다.', true, false);
  }
  if (status >= 500) {
    return result('server', '서버가 잠시 응답하지 않습니다', '잠시 후 같은 링크에서 다시 시도해 주세요. 이 오류에서는 연결 코드를 지우지 않습니다.', true, false);
  }
  return result('unknown', '개인 링크를 확인하지 못했습니다', message || '같은 링크에서 다시 시도하고, 계속 실패하면 새 링크를 요청해 주세요.', true);
}

/** 링크에 담겨 온 것들을 흡수한다.
 *  s=  구형 원장 복구 링크 (보안상 내용은 무시하고 제거)
 *  c=  1회용 개인 링크 code
 *  add= 지시서 묶음 (원장이 링크 한 번으로 등록) */
function absorbLinkParams() {
  const q = new URLSearchParams(location.search);
  let touched = false;

  const tk = q.get('t');
  if (tk) {
    // 구형 링크는 전환 기간에만 1회 흡수하고 즉시 주소에서 제거한다.
    state.settings.myToken = tk; save();
    q.delete('t'); touched = true;
  }

  const s = q.get('s');
  if (s) {
    q.delete('s'); touched = true;
    setTimeout(() => toast('보안상 원장 복구 링크의 비밀정보는 사용하지 않습니다'), 0);
  }

  const codeMatch = location.hash.match(/[#&]c=([^&]+)/);
  if (codeMatch) {
    try { pendingBootstrapCode = decodeURIComponent(codeMatch[1]); } catch (error) { pendingBootstrapCode = ''; }
    personAccessProblem = null;
  }

  // 지시서는 주소창에 남지 않도록 해시(#add=)를 우선 쓴다
  let raw = null;
  const m = location.hash.match(/[#&]add=([^&]+)/);
  if (m) raw = m[1];
  else if (q.get('add')) { raw = q.get('add'); q.delete('add'); touched = true; }

  if (raw) {
    try {
      const p = JSON.parse(unb64(raw));
      const list = Array.isArray(p) ? p : (p.assignments || []);
      if (list.length) pendingAdd = list;
    } catch (e) { console.warn('link add', e); }
  }

  if (touched || m) {
    const keptHash = codeMatch ? '#c=' + encodeURIComponent(pendingBootstrapCode) : (m ? '' : location.hash);
    history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '') + keptHash);
  }
}

/* ══════════════════════════════════════════════════════
   6. 렌더 헬퍼

const $ = sel => document.querySelector(sel);
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('on'), 2400);
}
function repeatLabel(t) {

  if (t.repeat === 'daily')   return '매일';

}
const initials = name => String(name || '?').trim().slice(0, 2);

/** 지금 조작하는 사람 */
const actor = () => session.isManager ? 'manager' : session.isAdmin ? 'admin' : 'staff';

const meStaff = () => session.isStaffLink ? staffById(session.staffId) : null;

/** 출근 체크 — 업무가 아닌 특수 체크로 저장한다 (시트 체크현황에는 안 섞인다) */
const attKey = staffId => '__att__' + staffId;
const attOf = (staffId, date) => state.checks[attKey(staffId) + '|' + date] || null;
const fmtTime = ms => { const d = new Date(ms); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };

/** 학생 연락 기록.
 *  원장의 기존 이름 기반 특수 체크와, 교사가 담당 수업용 별도 행에 남긴 contact를 함께 읽는다.
 *  같은 담당자가 같은 학생에게 같은 날 다시 기록하면 그날 기록이 갱신된다.
 *  이름·유형·한 줄 메모만 남긴다 — 전화번호나 상담 상세는 넣지 않는다. */
const CT_TYPES = { call: '전화상담', msg: '문자·카톡', meet: '대면상담' };
const ctKey = name => '__ct__' + name;
function contactsOf(name, studentId) {
  const normalizedName = String(name || '').trim();
  const normalizedStudentId = String(studentId || '').trim();
  const pre = ctKey(name) + '|';
  const rows = Object.keys(state.checks)
    .filter(k => k.startsWith(pre)).map(k => state.checks[k])
    .filter(c => c && c.done)
    .map(c => ({ date: c.date, type: c.type, note: c.note, by: c.by, at: c.at || c.updatedAt || 0 }));

  Object.keys(state.checks).forEach(k => {
    if (!isContactCheckKey(k)) return;
    const check = state.checks[k];
    const contact = check && check.contact;
    if (!contact || !CT_TYPES[contact.type]) return;
    const sourceTask = (state.tasks || []).find(task => task.id === contact.sourceTaskId);
    const contactStudentId = String(contact.studentId || '').trim();
    const contactStudentName = String((sourceTask && (sourceTask.studentName || studentOf(sourceTask))) || '').trim();
    const sameStudent = normalizedStudentId && contactStudentId
      ? contactStudentId === normalizedStudentId
      : contactStudentName === normalizedName;
    if (!sameStudent) return;
    rows.push({
      date: contact.date || check.date,
      type: contact.type,
      note: contact.note || '',
      by: ((staffById(contact.byStaffId) || {}).name || contact.by || ''),
      at: contact.at || check.updatedAt || 0
    });
  });

  return rows.filter(row => row.date).sort((a, b) =>
    String(b.date).localeCompare(String(a.date)) || Number(b.at || 0) - Number(a.at || 0));
}
function daysSinceContact(name, studentId) {
  const list = contactsOf(name, studentId);
  if (!list.length) return null;
  return Math.round((new Date(today()) - new Date(list[0].date)) / 86400000);
}
/** 마지막 연락 표시 — 2주 안이면 무색, 한 달 안이면 주의, 넘으면 경고 */
function ctPill(name, studentId) {
  const d = daysSinceContact(name, studentId);
  if (d === null) return '<span class="pill warn">연락 기록 없음</span>';
  const cls = d > 30 ? 'bad' : d > 14 ? 'warn' : '';
  return '<span class="pill ' + cls + '">📞 ' + (d === 0 ? '오늘' : d + '일 전') + '</span>';
}

/** 위험 신호 — 퇴원은 후행지표라 결석·지각·연락 공백을 먼저 본다.
 *  수업 지시서의 출결 체크를 학생별로 최근 14일 집계한다. */
function riskMap() {
  const from = addDays(today(), -13), to = today();
  const m = {};
  Object.keys(state.checks).forEach(k => {
    const c = state.checks[k];
    if (!c || !c.att || c.date < from || c.date > to) return;
    const t = state.tasks.find(x => x.id === c.taskId);
    if (!t || !isLesson(t)) return;
    const n = studentOf(t);
    if (!n) return;
    m[n] = m[n] || { abs: 0, late: 0 };
    if (c.att === 'A') m[n].abs++;
    else if (c.att === 'L') m[n].late++;
  });
  return m;
}
/** 관심 필요 사유 목록 — [문구, 강도]. 비어 있으면 정상.
 *  연락은 '기록이 있는데 30일 넘게 끊긴' 경우만 — 기록 없음은 연락 현황 카드가 맡는다. */
function riskFlags(name, rm, studentId) {
  const flags = [];
  const r = rm[name];
  if (r && r.abs >= 2) flags.push(['2주 결석 ' + r.abs + '회', 'bad']);
  if (r && r.late >= 3) flags.push(['2주 지각 ' + r.late + '회', 'warn']);
  const d = daysSinceContact(name, studentId);
  if (d !== null && d > 30) flags.push(['연락 ' + d + '일 경과', 'warn']);
  opRisk(name).forEach(f => flags.push(f));
  examRisk(name).forEach(f => flags.push(f));
  return flags;
}

/* ── 정기 평가 (넬트 3개월 주기 · 메타수학 주간/월간) ──
 * 점수·백분위는 넣지 않는다. 앱은 공개 오리진이고, 3개월 데이터의 실제 용도는
 * "올라갔나 정체됐나"라서 단계만으로 충분하다. 원점수는 별도 시트가 정본이다. */
const EXAM_KINDS = ['넬트', '메타수학'];
const examKey = name => '__exam__' + name;
/** 같은 날 넬트와 메타수학을 함께 볼 수 있으므로 날짜별 배열로 담는다 */
const examOn = (name, date) => ((state.checks[examKey(name) + '|' + date] || {}).items) || [];
function examAll(name) {
  const pre = examKey(name) + '|';
  const out = [];
  Object.keys(state.checks).filter(k => k.startsWith(pre)).forEach(k => {
    const date = k.slice(pre.length);
    examOn(name, date).forEach(x => out.push(Object.assign({}, x, { date: date })));
  });
  return out.sort((a, b) => b.date.localeCompare(a.date));
}
const examOf = (name, kind) => examAll(name).filter(x => x.kind === kind);
/** 직전 회차 대비 변화 — [문구, 색] */
function examTrend(name, kind) {
  const l = examOf(name, kind);
  if (l.length < 2) return null;
  const d = (Number(l[0].lv) || 0) - (Number(l[1].lv) || 0);
  return d > 0 ? ['▲ 상승', ''] : d < 0 ? ['▼ 하락', 'bad'] : ['― 정체', 'warn'];
}
/** 3회차 이상 쌓였을 때만 판정한다 — 초반 두 회차로 단정하지 않는다 */
function examRisk(name) {
  const l = examOf(name, '넬트');
  if (l.length < 3) return [];
  const a = Number(l[0].lv) || 0, b = Number(l[1].lv) || 0, c = Number(l[2].lv) || 0;
  if (a < b) return [['넬트 단계 하락', 'bad']];
  if (a === b && b === c) return [['넬트 2회 연속 정체', 'warn']];
  return [];
}

let examTarget = null;

/* ── 온라인 프로그램 (스터디포스·클래스카드) ──
 * 정답률·진행단원 같은 수치는 넣지 않는다 — 그건 프로그램과 구독 명단 시트가 정본이고,
 * 여기 또 넣으면 이중 입력이 되어 둘 다 못 믿게 된다.
 * 여기서 다루는 건 이탈의 선행지표인 '주간 학습 횟수' 하나뿐이다.
 * 공현정 선생님이 주간 카톡을 쓰며 이미 확인하는 숫자라 추가 작업이 생기지 않는다. */
const OP_ALL = ['스터디포스', '클래스카드'];
const OP_LOW = 2;   // 주 이 횟수 이하면 저조로 본다

const opProgs = name => ((state.checks['__opset__' + name + '|all'] || {}).progs) || [];
const opCnt = (name, mon) => ((state.checks['__op__' + name + '|' + mon] || {}).cnt) || {};
const opSum = (name, mon) => {
  const c = opCnt(name, mon);
  return opProgs(name).reduce((a, p) => a + (Number(c[p]) || 0), 0);
};
/** 온라인 미접속은 정답률 하락보다 훨씬 먼저 나타나는 이탈 신호다 */
function opRisk(name) {
  const progs = opProgs(name);
  if (!progs.length) return [];
  const thisMon = mondayOf(today()), lastMon = addDays(thisMon, -7);
  const rec = state.checks['__op__' + name + '|' + lastMon];
  if (!rec) return [];                       // 아직 기록이 시작 안 된 학생은 신호로 보지 않는다
  const a = opSum(name, lastMon), b = opSum(name, addDays(thisMon, -14));
  if (a === 0 && b === 0) return [['온라인 2주 미접속', 'bad']];
  if (a === 0) return [['온라인 지난주 0회', 'bad']];
  if (a <= OP_LOW) return [['온라인 지난주 ' + a + '회', 'warn']];
  return [];
}

let opTarget = null;   // 지금 열려 있는 온라인 프로그램 모달의 학생
function opModal(name) {
  opTarget = name;
  const mon = mondayOf(today()), last = addDays(mon, -7);
  const progs = opProgs(name), cur = opCnt(name, mon), prev = opCnt(name, last);
  modal('📱 ' + name + ' 온라인 프로그램',
    '<div class="fl mb8">이용 중인 프로그램</div><div class="chips mb14" id="opProgs">' +
      OP_ALL.map(p => '<button type="button" class="chip ' + (progs.includes(p) ? 'on' : '') +
        '" data-act="opprog" data-v="' + p + '">' + p + '</button>').join('') + '</div>' +
    (progs.length
      ? '<hr class="sep"><div class="fl mb8">이번 주 학습 횟수 (' + shortDate(mon) + ' 주)</div>' +
        progs.map(p => '<div class="between mb8"><span class="small">' + esc(p) + '</span>' +
          '<span class="row" style="gap:8px">' +
          '<span class="small muted">지난주 ' + (Number(prev[p]) || 0) + '회</span>' +
          '<input class="in" type="number" min="0" max="7" style="max-width:90px" data-opcnt="' + esc(p) + '" value="' +
            (Number(cur[p]) || 0) + '"></span></div>').join('') +
        '<div class="hint">프로그램 관리자에서 확인한 지난 7일 학습 횟수를 넣으세요. 주 1회만 갱신하면 됩니다.<br>' +
        '정답률·진행단원은 여기 넣지 않습니다 — 구독 명단 시트가 정본입니다.</div>'
      : '<div class="hint">프로그램을 먼저 선택하세요.</div>'),
    (progs.length
      ? '<button class="btn btn-primary btn-block mt14" data-act="opsave" data-name="' + esc(name) + '">저장</button>'
      : ''));
}

/** 지시 내용을 고칠 수 있는가.
 *  원장은 전부. 직원은 자기가 추가한 업무만 — 원장이 내린 지시는 못 건드린다.
 *  (직원도 체크·단계·수량·메모·막힘은 언제나 가능하다) */
function canEditTask(t) {
  if (t && (t.lessonFormVersion || t.intakeVersion)) return false;
  if (session.isAdmin) return true;
  return t.origin === 'staff' && t.staffId === session.staffId;
}

function canEditLessonTask(t) {
  if (!t || !(t.lessonFormVersion || t.intakeVersion)) return false;
  return session.isAdmin || (session.isStaffLink && t.staffId === session.staffId && t.origin === 'staff');
}

/** 원장이 등록한 내 수업이라 직접은 못 고치지만, 변경을 제안할 수는 있는가 */
function canProposeLessonChange(t) {
  return !!t && isLesson(t) && session.isStaffLink && !session.isAdmin && t.staffId === session.staffId &&
    !canEditLessonTask(t) && !canEditTask(t);
}

  }
  else if (session.isManager) { text = ((meStaff() || {}).name || '관리 담당') + ' · 관리 담당 모드'; on = true; }

  let h = '<div class="task ' + st + (st === 'blocked' ? ' isblocked' : '') + '" data-task="' + t.id + '">' +

    '<div class="task-body">' +
      '<div class="task-t">' + esc(t.title) + '</div>' +
      (t.detail ? '<div class="task-d">' + esc(t.detail) + '</div>' : '') +
      '<div class="meta">' +
        (isCarry ? '<span class="tag carry">⚠ ' + shortDate(date) + ' 미완료</span>' : '') +
        (t.time ? '<span class="tag time">' + esc(t.time) + '</span>' : '') +
        (t.priority === 'high' ? '<span class="tag high">중요</span>' : '') +
        (st === 'blocked' ? '<span class="tag blk">막힘</span>' : '') +
        (st === 'doing' ? '<span class="tag doing">진행중 ' + prog.done + '/' + prog.total + prog.unit + '</span>' : '') +
        (!isCarry ? '<span class="tag">' + esc(repeatLabel(t)) + '</span>' : '') +
        (st === 'done' && c && c.at ? '<span class="tag ok">✓ ' + new Date(c.at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) + ' 완료</span>' : '') +
        (c && c.att && ATT_LABEL[c.att] ? '<span class="tag ' + ATT_LABEL[c.att][1] + '">' + ATT_LABEL[c.att][0] + '</span>' : '') +
        sessionModeBadgeHtml(t) +
        originTags(t) +
      '</div>';

  if (hasDetail && st !== 'done') {
    h += '<div class="bar mini ' + (st === 'doing' ? 'doing' : '') + '" style="margin-top:8px"><i style="width:' + prog.pct + '%"></i></div>';
  }
  if (hasDetail) {
    h += '<button class="opener" data-act="panel" data-id="' + t.id + '" data-date="' + date + '">' +
      (open ? '▾ 접기' : '▸ 하는 방법 · 단계 열기' + ((t.steps || []).length ? ' (' + prog.done + '/' + prog.total + ')' : '')) + '</button>';
  }
  if (open) h += taskPanel(t, date, c, editable);

  h += (editable
      ? '<input class="note" data-act="note" data-id="' + t.id + '" data-date="' + date + '" value="' + esc((c && c.note) || '') + '" placeholder="' +
        (isLesson(t) ? '메모 — +잘한점 / -보완점 / 숙제○○ 로 쓰면 피드백 문구에 자동 배치' : '메모 · 막힌 이유나 특이사항을 남기세요') + '">'
      : ((c && c.note) ? '<div class="note">' + esc(c.note) + '</div>' : ''));

  return h + '</div></div>';
}

function taskPanel(t, date, c, editable) {
  let h = '<div class="panel">';

  if (t.guide) h += '<div class="guide"><b>📘 이렇게 하세요</b>' + esc(t.guide) + '</div>';

  if ((t.steps || []).length) {
    h += '<div style="margin-top:10px">' + t.steps.map((s, i) => {
      const on = !!(c && c.steps && c.steps[s.id]);
      return '<div class="step ' + (on ? 'on' : '') + '">' +
        '<button class="sbox" ' + (editable ? 'data-act="step" data-id="' + t.id + '" data-date="' + date + '" data-step="' + s.id + '"' : 'disabled') + '>✓</button>' +
        '<span>' + (i + 1) + '. ' + esc(s.label) + '</span></div>';
    }).join('') + '</div>';
  }

  if (t.target) {
    h += '<div class="counter"><span>진행 수량</span>' +
      '<button class="btn btn-sm btn-ghost" ' + (editable ? 'data-act="cnt" data-id="' + t.id + '" data-date="' + date + '" data-n="-1"' : 'disabled') + '>−</button>' +
      '<input class="in" type="number" min="0" ' + (editable ? 'data-act="cntset" data-id="' + t.id + '" data-date="' + date + '"' : 'readonly') + ' value="' + ((c && c.count) || 0) + '">' +
      '<button class="btn btn-sm btn-ghost" ' + (editable ? 'data-act="cnt" data-id="' + t.id + '" data-date="' + date + '" data-n="1"' : 'disabled') + '>＋</button>' +
      '<span class="muted">/ ' + t.target + esc(t.unit || '건') + '</span></div>';
  }

  if (editable && isLesson(t)) {
    const att = (c && c.att) || '';
    h += '<div class="row wraprow mt14" style="gap:6px"><span class="fl" style="margin:0">학생 출결</span>' +
      [['P', '출석'], ['L', '지각'], ['A', '결석']].map(([v, l]) =>
        '<button class="chip ' + (att === v ? 'on' : '') + '" data-act="latt" data-id="' + t.id + '" data-date="' + date + '" data-v="' + v + '">' + l + '</button>'
      ).join('') + '</div>';
    h += makeupRequestHtml(t, date, c);
  }

  if (editable) {
    const blocked = !!(c && c.blocked);
    h += '<div class="row wraprow mt14" style="gap:8px">' +
      '<button class="btn btn-sm ' + (blocked ? 'btn-danger' : 'btn-warn') + '" ' +
        'data-act="block" data-id="' + t.id + '" data-date="' + date + '">' +
        (blocked ? '✓ 막힘 해제' : '🚧 막혔어요') + '</button>' +
      (isLesson(t)
        ? '<button class="btn btn-sm btn-navy" data-act="fbtext" data-id="' + t.id + '" data-date="' + date + '">💬 학부모 피드백 문구</button>' +
          '<button class="btn btn-sm btn-ghost" data-act="ctlog" data-id="' + esc(t.id) + '" data-date="' + esc(date) + '" data-name="' + esc(t.studentName || studentOf(t)) + '">📞 연락 기록</button>'
        : '') +
      (t.title.startsWith('[주문] ')
        ? '<button class="btn btn-sm btn-navy" data-act="ordermsg" data-id="' + t.id + '">📱 발주 문자 보내기</button>'
        : '') +
      (canEditLessonTask(t)
        ? '<button class="btn btn-sm btn-ghost" data-act="lessonedit" data-id="' + t.id + '">✏️ 수업 정보 수정</button>'
        : (canEditTask(t)
          ? '<button class="btn btn-sm btn-ghost" data-act="etask" data-id="' + t.id + '">✏️ 업무 수정</button>'
          : (canProposeLessonChange(t) ? '<button class="btn btn-sm btn-ghost" data-act="lcpropose" data-id="' + t.id + '">📝 변경 요청</button>' : ''))) +
    '</div>';
  }
  return h + '</div>';
}

function seedPick(arr, seedStr, salt) {
  let h = salt * 2654435761 >>> 0;
  const s = String(seedStr);
  for (let i = 0; i < s.length; i++) h = ((h * 31) + s.charCodeAt(i)) >>> 0;
  return arr[h % arr.length];
}
function buildComment(ctx, seedStr) {
  const parts = [];
  const focus = ctx.focus || 'good';
  parts.push(seedPick(FB_BANK[focus], seedStr, 1));
  parts.push(seedPick(FB_MOOD_FOLLOW[focus], seedStr, 20));
  (ctx.plus || []).slice(0, 2).forEach((idx, i) => {
    parts.push(seedPick(FB_BANK.plusPat, seedStr, 2 + i).replace('{x}', FB_PLUS[idx][1]));
    parts.push(seedPick(FB_BANK.plusFollow, seedStr, 22 + i));
  });
  const m = ctx.minus == null ? null : FB_MINUS[ctx.minus];
  if (m && m[1]) {
    parts.push(seedPick(FB_BANK.minusPat, seedStr, 5).replace('{y}', m[1]));
    parts.push(seedPick(FB_BANK.minusFollow, seedStr, 23));
  } else {
    parts.push(seedPick(FB_BANK.closer, seedStr, 6));
  }
  return parts.join(' ');
}

/** 학생이 보는 교재의 "다음 진도"를 실제 교재 DB에서 찾아 한 문장으로 —
 *  지어내지 않고 실제 위치(at) 기준 바로 다음 소단원만 안내한다. 못 찾으면 안전한
 *  대체 문장(FB_NEXT_FALLBACK)을 쓴다 — 어느 쪽이든 없는 진도를 지어내지는 않는다. */
function nextLessonHint(t, seedStr) {
  if (bookDb) {
    const st = (bookDb.students || []).find(s => s.name === studentOf(t));
    const b = st && (bookDb.books || []).find(x => x.id === st.bookId);
    const f = b ? flatSections(b) : [];
    if (f.length) {
      const idx = posOf(b, st.at);
      const nextIdx = idx >= 0 ? idx + 1 : 0;
      if (nextIdx < f.length) {
        return seedPick(FB_NEXT_LEAD, seedStr, 40) + f[nextIdx].sec + seedPick(FB_NEXT_TAIL, seedStr, 41);
      }
    }
  }
  return seedPick(FB_NEXT_FALLBACK, seedStr, 42);
}

function feedbackText(t, date, genComment) {
  const c = getCheck(t.id, date);
  const student = studentOf(t);
  const doneSteps = (t.steps || []).filter(s => c && c.steps && c.steps[s.id]).map(s => s.label);
  const seed = t.id + '|' + date;
  // 그날 편지 전체를 감싸는 말투 결 — 내용과 무관하게 학생·날짜 시드로만 정해진다
  const mood = seedPick(FB_MOOD_KEYS, seed, 99);

  const plus = [], minus = [], hw = [], etc = [];
  ((c && c.note) || '').split(/\n|\//).map(x => x.trim()).filter(Boolean).forEach(line => {
    if (line.startsWith('+')) plus.push(line.slice(1).trim());
    else if (line.startsWith('-') || line.startsWith('−')) minus.push(line.slice(1).trim());
    else if (/^숙제/.test(line)) hw.push(line.replace(/^숙제[:\s]*/, '').trim());
    else etc.push(line);
  });

  const parts = [];
  parts.push(seedPick(FB_GREET[mood], seed, 30));
  parts.push(seedPick(FB_INTRO[mood], seed, 31).replace('{S}', student));

  if (doneSteps.length) {
    let stepLine = seedPick(FB_STEP_LEAD, seed, 32) + doneSteps.join(seedPick(FB_STEP_JOIN, seed, 33)) +
      seedPick(FB_STEP_TAIL, seed, 34);
    // 계획한 단계를 다 마쳤는지/일부만 했는지도 실제 체크 여부로만 판단해 한 문장 더 붙인다
    const total = (t.steps || []).length;
    stepLine += ' ' + (total && doneSteps.length >= total
      ? seedPick(FB_STEP_ALLDONE, seed, 43)
      : seedPick(FB_STEP_PARTDONE, seed, 44));
    parts.push(stepLine);
  }

  if (genComment) parts.push(genComment);

  if (plus.length) {
    parts.push(seedPick(FB_PLUS_NOTE_LEAD, seed, 48) + '\n▪ 오늘 잘한 점\n' + plus.map(s => '· ' + s).join('\n'));
  }
  if (minus.length) {
    parts.push(seedPick(FB_MINUS_NOTE_LEAD, seed, 49) + '\n▪ 다음에 함께 봐주시면 좋은 점\n' + minus.map(s => '· ' + s).join('\n'));
  }
  if (etc.length) {
    parts.push(seedPick(FB_ETC_NOTE_LEAD, seed, 50) + '\n▪ ' + (genComment ? '덧붙임' : '선생님 코멘트') + '\n' +
      etc.map(s => '· ' + s).join('\n'));
  }

  if (hw.length) {
    parts.push(seedPick(FB_HW_LEAD, seed, 35) + hw.join(', ') + '.\n' +
      seedPick(FB_HW_TIP, seed, 36) + ' ' + seedPick(FB_HW_TIP2, seed, 45));
  }

  parts.push(nextLessonHint(t, seed));

  parts.push(seedPick(FB_CLOSING_LEAD[mood], seed, 46) + ' ' + seedPick(FB_BANK.closer, seed, 7));
  parts.push(seedPick(FB_PARENT_TIP[mood], seed, 47));
  parts.push(seedPick(FB_PARENT_NOTE[mood], seed, 37));
  parts.push(seedPick(FB_SIGNOFF[mood], seed, 38));

  return parts.join('\n\n');
}

/** 오늘 배운 내용/잘한 점/보완할 점 — 카카오 알림톡 항목별 변수 그대로 나가는 값이다.
 *  doneSteps(실제 체크한 단계)·FB_PLUS/FB_MINUS 칩 선택에서 초안을 뽑아주지만,
 *  최종적으로 나가는 건 이 입력칸에 남아있는 값이라 눌러서 고칠 수 있다. */
function computeFeedbackFields(t, date, fbCtx) {
  const c = getCheck(t.id, date);
  const doneSteps = (t.steps || []).filter(s => c && c.steps && c.steps[s.id]).map(s => s.label);
  const contentText = doneSteps.length ? doneSteps.join(', ') : (t.detail || '');
  const plusText = ((fbCtx && fbCtx.plus) || []).map(i => FB_PLUS[i][0]).join(', ');
  const minusPick = (fbCtx && fbCtx.minus != null) ? FB_MINUS[fbCtx.minus][0] : '';
  const minusText = minusPick === '없음' ? '특별히 없음 — 오늘도 잘 따라왔어요' : minusPick;
  return { contentText, plusText, minusText };
}

 *  letterText는 복사용 편지 — 안 주면 인터뷰 없이 그날 체크·메모만으로 생성한다. */

function restoreLessonDraft() {

      scheduleSlots: Array.isArray(saved.scheduleSlots) && saved.scheduleSlots.length
        ? saved.scheduleSlots.map(slot => Object.assign({ days: [], startTime: '', endTime: '' }, slot, {

async function loadLessonAssignmentRequests(force) {
  if (lessonAssignmentRequestsLoading || (lessonAssignmentRequestsLoaded && !force)) return;
  const auth = sync.auth();
  if (!auth) return;
  lessonAssignmentRequestsLoading = true;
  lessonAssignmentRequestsError = '';
  try {
    const endpoint = session.isAdmin ? '/lesson-assignment-review' : '/lesson-assignment-request';
    const result = await sync.post(endpoint, { app: SYNC_APP, auth: auth, action: 'list' });
    lessonAssignmentRequests = Array.isArray(result.requests) ? result.requests : [];
    lessonAssignmentRequestsLoaded = true;
  } catch (error) { lessonAssignmentRequestsError = String(error.message || error); }
  finally { lessonAssignmentRequestsLoading = false; renderAfterSync(); }
}

async function reviewLessonAssignment(action, button) {
  if (!session.isAdmin) return;
  const auth = sync.auth();
  const key = String(button.dataset.key || ''), revision = Number(button.dataset.rev);
  if (!auth || !key || !Number.isInteger(revision)) return;
  const body = { app: SYNC_APP, auth: auth, action: action, requestKey: key, revision: revision };
  if (action === 'approve') {
    const select = document.querySelector('[data-lar-student][data-key="' + CSS.escape(key) + '"]');
    body.studentId = select && select.value;
    if (!body.studentId) return toast('현재 원생 명단에서 학생을 선택해 주세요');
    const request = lessonAssignmentRequests.find(row => row.requestKey === key);
    const student = rosterDb && (rosterDb.students || []).find(row => String(row.id) === String(body.studentId));
    if (!request || !student) return toast('원생 명단을 새로고침한 뒤 다시 선택해 주세요');
    const same = value => String(value || '').normalize('NFKC').replace(/\s+/g, '').toLocaleLowerCase('ko');
    if (same(request.studentName) !== same(student.name) || same(request.grade) !== same(student.grade)) {
      if (!confirm('요청 정보는 “' + request.studentName + ' · ' + request.grade + '”이고 선택한 원생은 “' + student.name + ' · ' + student.grade + '”입니다. 같은 학생이 맞습니까?')) return;
      body.confirmIdentityMismatch = true;
    }
  } else {
    const note = prompt('반려 사유를 입력해 주세요');
    if (note == null) return;
    body.note = note;
  }
  try {
    await sync.post('/lesson-assignment-review', body);
    lessonAssignmentRequestsLoaded = false;
    rosterDb = null; rosterErr = '';
    loadRoster(); loadLessonAssignmentRequests(true);
    toast(action === 'approve' ? '담당 학생을 연결했습니다' : '배정 요청을 반려했습니다');
  } catch (error) { toast('처리 실패 — ' + (error.message || error)); }
}

function applyCreatedLesson(task) {
  const index = state.tasks.findIndex(item => item.id === task.id);
  if (index >= 0 && Number(state.tasks[index].updatedAt || 0) > Number(task.updatedAt || 0)) return false;
  if (index < 0) state.tasks.push(task); else state.tasks[index] = task;
  save();
  return true;
}

async function saveLessonRegistration(button) {
  if (lessonSubmitting || !lessonPreviewPayload) return;
  const auth = sync.auth();
  if (!auth) return toast('동기화 인증이 필요합니다');
  lessonSubmitting = true;
  if (button) button.disabled = true;
  try {
    const draft = currentLessonDraft();
    const targetStaffId = session.isStaffLink && !session.isAdmin ? session.staffId : draft.staffId;
    const result = await sync.post('/lesson-create', {
      app: SYNC_APP, auth: auth, staffId: targetStaffId,
      sourceTaskId: draft._sourceTaskId || undefined,
      expectedUpdatedAt: lessonPreviewExpectedUpdatedAt || undefined,
      lesson: lessonPreviewPayload
    });
    applyCreatedLesson(result.task);
    clearLessonDraft();
    lessonDraft = null; lessonPreviewPayload = null; lessonPreviewTask = null; lessonPreviewExpectedUpdatedAt = 0;
    if (session.isAdmin) viewStaff = targetStaffId;
    closeModal(); go('today');
    toast(result.idempotent || result.duplicate ? '변경 사항이 없어 기존 수업을 그대로 유지했습니다' : (result.updated ? '수업 정보를 수정했습니다' : '수업을 등록했습니다'));
  } catch (error) {
    toast('수업 등록 실패 — ' + (error.message || error));
    if (button) button.disabled = false;
  } finally {
    lessonSubmitting = false;
  }
}

const FEEDBACK_STATUS_LABEL = {
  approval_waiting: ['원장 검토 대기', 'warn'],
  content_approved_send_blocked: ['문구 승인 · 발송 대기', ''],
  sent: ['보호자 알림톡 접수', ''],
  revision_requested: ['수정 요청', 'bad'],
  cancelled: ['취소', '']
};

function feedbackSendState(item) {
  if (item && item.status === 'content_approved_send_blocked') {
    const note = String(item.reviewNote || '');
    if (note.startsWith('접수 여부 확인 필요')) return { label: ['접수 여부 확인 필요', 'warn'], retry: false };
    if (note.startsWith('카카오 발송이 거절되었습니다')) return { label: ['알림톡 거절 · 확인 필요', 'bad'], retry: false };
  }
  return { label: FEEDBACK_STATUS_LABEL[item && item.status] || [item && item.status || '', ''], retry: true };
}

function feedbackReviewPrefix(item, ownCard) {
  if (item && item.status === 'revision_requested') {
    return ownCard ? '<b>원장 수정 요청</b><br>' : '수정 요청: ';
  }
  const note = String(item && item.reviewNote || '');
  if (note.startsWith('접수 여부 확인 필요')) return '⚠ 접수 여부 확인 — ';
  if (note.startsWith('카카오 발송이 거절되었습니다')) return '발송 거절 — ';
  return '⏳ 아직 안 나감 — ';
}

/** 승인 대기 중인 제안 내용을 사람이 읽을 문장으로 — 값은 여기서 이스케이프한다 */
function lessonChangeSummary(changes) {
  changes = changes || {};
  const items = [];
  if (changes.days) items.push('요일 → ' + (changes.days.length ? esc(changes.days.map(d => DOW[d]).join('·')) : '(없음)'));
  if (changes.time !== undefined) items.push('시간 → ' + esc(changes.time || '(없음)'));
  if (changes.repeat) items.push('반복 → ' + esc(LESSON_CHANGE_REPEAT_LABEL[changes.repeat] || changes.repeat));
  if (changes.detail !== undefined) items.push('교재/진도 → ' + esc(changes.detail || '(없음)'));
  if (changes.guide !== undefined) items.push('수업 메모 → ' + esc(changes.guide || '(없음)'));
  if (changes.target !== undefined) items.push('목표 수량 → ' + esc(String(changes.target)));
  if (changes.unit !== undefined) items.push('단위 → ' + esc(changes.unit || ''));
  return items.join('<br>');
}

async function submitLessonChange(button) {
  if (!lcForm) return;
  if (lcForm.repeat === 'days' && !lcForm.days.length) return toast('요일을 선택해 주세요');
  const auth = sync.auth();
  if (!auth) return toast('동기화 인증이 필요합니다');
  const changes = {
    time: $('#lcTime').value || '',
    target: Number($('#lcTarget').value) || 0,
    repeat: lcForm.repeat,
    days: lcForm.repeat === 'days' ? lcForm.days.slice().sort() : [],
    detail: ($('#lcDetail').value || '').trim(),
    guide: ($('#lcGuide').value || '').trim()
  };
  const note = ($('#lcNote').value || '').trim();
  if (button) button.disabled = true;
  try {
    const result = await sync.post('/lesson-change-request', {
      app: SYNC_APP, auth: auth, action: 'submit', taskId: lcForm.taskId, changes: changes, note: note
    });
    lessonChangeQueueLoaded = false; ownLessonChangeQueueLoaded = false;
    lcForm = null;
    toast(result.idempotent ? '같은 내용이 이미 원장 검토 대기 중입니다' : '원장님께 변경 요청을 보냈습니다');
    closeModal();
  } catch (error) {
    toast('요청 실패 — ' + (error.message || error));
    if (button) button.disabled = false;
  }
}

async function reviewLessonChange(action, key, revision) {
  const auth = sync.auth();
  if (!auth) return toast('동기화 인증이 필요합니다');
  const body = { app: SYNC_APP, auth: auth, action: action, requestKey: key, revision: Number(revision) };
  if (action === 'reject') {
    const note = prompt('선생님에게 전달할 반려 사유를 적어 주세요');
    if (note === null) return;
    body.note = note.trim();
  }
  try {
    const result = await sync.post('/lesson-change-review', body);
    const index = lessonChangeQueue.findIndex(item => item.requestKey === key);
    if (index >= 0) lessonChangeQueue[index] = result.request;
    render();
    toast(action === 'approve' ? '승인했습니다 · 지시서에 반영됐습니다' : '반려했습니다');
  } catch (error) {
    toast('검토 실패 — ' + (error.message || error));
    loadLessonChangeQueue(true);
  }
}

/** 승인 단계 없이, 여기서 누르는 순간 서버가 바로 카카오 알림톡 발송을 시도한다.
 *  보호자 연락처·동의가 없거나 설정이 꺼져 있으면 서버가 조용히 막고 사유를 남긴다
 *  (막힌 사유는 "피드백 검토" 화면에서 원장님이 확인·재시도할 수 있다). */
async function submitFeedbackForReview(button) {
  if (!fbCtx) return;
  const message = (($('#mText') || {}).value || '').trim();
  const contentText = (($('#fldContent') || {}).value || '').trim();
  const plusText = (($('#fldPlus') || {}).value || '').trim();
  const minusText = (($('#fldMinus') || {}).value || '').trim();
  if (!message) return toast('피드백 문구를 입력해 주세요');
  if (!contentText || !plusText || !minusText) return toast('오늘 배운 내용·잘한 점·보완할 점을 모두 입력해 주세요');
  const auth = sync.auth();
  if (!auth) return toast('동기화 인증이 필요합니다');
  if (button) button.disabled = true;
  try {
    const result = await sync.post('/feedback-request', {
      app: SYNC_APP, auth: auth, taskId: fbCtx.id,
      feedbackDate: fbCtx.date, feedbackType: 'class_feedback', templateVersion: 'v1',
      message: message, contentText: contentText, plusText: plusText, minusText: minusText
    });
    feedbackQueueLoaded = false; ownFeedbackQueueLoaded = false;
    const status = result.request && result.request.status;
    if (status === 'sent') toast('보호자 알림톡 발송 요청이 접수됐습니다');
    else if (status === 'revision_requested') toast('원장 수정 요청을 확인해 문구를 바꿔 주세요');
    else if (result.idempotent) toast('같은 내용이 이미 처리되어 있습니다 — 상태는 "피드백 검토"에서 확인해 주세요');
    else toast('제출했습니다 — 아직 발송되지 않았다면 "피드백 검토"에서 사유를 확인해 주세요');
    closeModal();
  } catch (error) {
    toast('제출 실패 — ' + (error.message || error));
    if (button) button.disabled = false;
  }
}

async function reviewFeedbackRequest(action, key, revision) {

  if (!auth) return toast('동기화 인증이 필요합니다');
  const body = { app: SYNC_APP, auth: auth, action: action, requestKey: key, revision: Number(revision) };
  if (action === 'request_revision') {
    const note = prompt('선생님에게 전달할 수정 요청을 적어 주세요');

    body.note = note.trim();
  }

    const index = feedbackQueue.findIndex(item => item.requestKey === key);
    if (index >= 0) feedbackQueue[index] = result.request;

    toast(action === 'approve_content' ? '문구를 승인했습니다 · 발송 가능 상태라면 아래 버튼으로 다시 접수할 수 있습니다' : '수정 요청을 남겼습니다');

    toast('피드백 검토 실패 — ' + (error.message || error));

/** 막혔던 알림톡을 다시 접수한다 — 원장만, 승인과는 별개의 명시적 클릭 */
async function sendParentFeedback(key, button) {
  const auth = sync.auth();
  if (!auth) return toast('동기화 인증이 필요합니다');
  const resultBox = document.getElementById('fbSendResult-' + key);
  if (button) { button.disabled = true; button.textContent = '보내는 중…'; }
  try {
    const res = await sync.post('/parent-feedback-send', { app: SYNC_APP, auth: auth, requestKey: key });
    feedbackQueueLoaded = false;
    if (res.status === 'sent') {
      toast('보호자 알림톡 발송 요청이 접수됐습니다');
      loadFeedbackQueue(true);
    } else if (res.code === 'ALREADY_SENT') {
      toast('이미 발송된 문구입니다');
      loadFeedbackQueue(true);
    } else {
      const msg = '⏳ ' + (res.send ? res.send.status : '처리 중') + ' — 잠시 후 새로고침해서 확인해 주세요';
      if (resultBox) resultBox.textContent = msg; else toast(msg);
      if (button) { button.disabled = false; button.textContent = '📱 지금 학부모께 알림톡 접수'; }
    }
  } catch (error) {
    if (button) { button.disabled = false; button.textContent = '📱 지금 학부모께 알림톡 접수'; }
    if (resultBox) resultBox.textContent = '❌ ' + (error.message || error);
    else toast('발송 실패 — ' + (error.message || error));
  }
}
