document.addEventListener('click', ev => {
  const goEl = ev.target.closest('[data-go]');
  if (goEl) { go(goEl.dataset.go); return; }

  const el = ev.target.closest('[data-act]');
  if (!el) return;
  if (el.dataset.act === 'closemodal'
      && ev.target.closest('.modal-box')
      && !ev.target.closest('button[data-act="closemodal"]')) return;

  const act = el.dataset.act;
  const id = el.dataset.id;
  const date = el.dataset.date || cursor;
  const task = () => state.tasks.find(x => x.id === id);

  switch (act) {

    /* 잠금 */
    case 'setpin': {
      const v = ($('#pin').value || '').trim();
      if (v.length < 4) return toast('4자리 이상 입력해 주세요');
      state.settings.adminPin = v; save(); session.unlock(); go('staff'); toast('설정되었습니다');
      break;
    }
    case 'login': {
      if (($('#pin').value || '').trim() !== state.settings.adminPin) return toast('비밀번호가 다릅니다');
      session.unlock(); render(); toast('환영합니다');
      break;
    }
    case 'logout': session.lock(); render(); break;
    case 'changepin': {
      const v = ($('#newPin').value || '').trim();
      if (v.length < 4) return toast('4자리 이상 입력해 주세요');
      state.settings.adminPin = v; save(); toast('변경되었습니다');
      break;
    }

    /* 날짜 */
    case 'day':  cursor = addDays(cursor, Number(el.dataset.n)); cursorPinned = (cursor !== today()); render(); break;
    case 'week': cursor = addDays(cursor, Number(el.dataset.n) * 7); cursorPinned = (mondayOf(cursor) !== mondayOf(today())); render(); break;

    /* 체크 · 단계 · 수량 · 막힘 */
    case 'toggle': {
      const t = task(); if (!t) break;
      const c = getCheck(id, date);
      const turnOn = !(c && c.done);
      const steps = {};
      (t.steps || []).forEach(s => { steps[s.id] = turnOn; });
      setCheck(id, date, {
        done: turnOn, at: turnOn ? now() : null,
        steps: steps,
        count: t.target ? (turnOn ? t.target : 0) : ((c && c.count) || 0),
        blocked: turnOn ? false : (c ? c.blocked : false)
      });
      render();
      break;
    }
    case 'step': {
      const t = task(); if (!t) break;
      const c = getCheck(id, date);
      const cur = Object.assign({}, (c && c.steps) || {});
      const k = el.dataset.step;
      cur[k] = !cur[k];
      setCheck(id, date, { steps: cur, blocked: false });
      syncAuto(t, date);
      render();
      break;
    }
    case 'cnt': {
      const t = task(); if (!t) break;
      const c = getCheck(id, date);
      const n = Math.max(0, ((c && c.count) || 0) + Number(el.dataset.n));
      setCheck(id, date, { count: n, blocked: false });
      syncAuto(t, date);
      render();
      break;
    }
    case 'block': {
      const c = getCheck(id, date);
      const on = !(c && c.blocked);
      setCheck(id, date, { blocked: on, done: on ? false : (c ? c.done : false) });
      render();
      toast(on ? '원장님 화면에 표시됩니다' : '막힘을 해제했습니다');
      break;
    }
    case 'panel': {
      const k = id + '|' + date;
      openPanels.has(k) ? openPanels.delete(k) : openPanels.add(k);
      render();
      break;
    }

    /* 직원 */
    case 'pickstaff': viewStaff = id; render(); break;
    case 'openstaff': viewStaff = id; go('today'); break;
    case 'addstaff': {
      const name = ($('#sName').value || '').trim();
      if (!name) return toast('이름을 입력해 주세요');
      state.staff.push({ id: uid(), name: name, createdAt: now(), updatedAt: now(), deleted: false });
      save(); queueSync(); render(); toast(name + ' 등록 완료');
      break;
    }
    case 'delstaff': {
      if (!session.isAdmin) break;
      const s = staffById(id);
      if (!s || !confirm(s.name + ' 님을 삭제할까요? 지시 기록은 남습니다.')) return;
      s.deleted = true; s.updatedAt = now();
      save(); queueSync(); render();
      break;
    }
    case 'togglemanager': {
      if (!session.isAdmin) break;
      const s = staffById(id);
      if (!s) break;
      s.manager = !s.manager; s.updatedAt = now();
      save(); queueSync(); render();
      toast(s.manager
        ? s.name + ' — 관리자로 지정. 본인 개인 링크에서 현황·발행이 열립니다'
        : s.name + ' — 관리자 해제');
      break;
    }
    case 'attcheck': {
      if (!session.isStaffLink) break;
      const me = currentStaff(); if (!me) break;
      const a = attOf(me.id, today());
      if (a && a.done) {
        if (!confirm('출근 체크를 취소할까요?' + (a.out ? ' 퇴근 기록도 함께 지워집니다.' : ''))) return;
        setCheck(attKey(me.id), today(), { done: false, at: null, out: null });
      } else {
        setCheck(attKey(me.id), today(), { done: true, at: now(), out: null, blocked: false });
        toast('출근 체크 완료 — 오늘도 수고하세요!');
      }
      render();
      break;
    }
    case 'attout': {
      if (!session.isStaffLink) break;
      const me = currentStaff(); if (!me) break;
      const a = attOf(me.id, today());
      if (!a || !a.done) break;
      if (a.out) {
        if (!confirm('퇴근 체크를 취소할까요?')) return;
        setCheck(attKey(me.id), today(), { out: null });
      } else {
        setCheck(attKey(me.id), today(), { out: now() });
        toast('퇴근 체크 완료 — 수고하셨습니다!');
      }
      render();
      break;
    }
    case 'atthist': showText('출근 이력 (최근 14일)', attHistText()); break;
    case 'atteditopen': {
      if (!session.isAdmin && !(session.isStaffLink && session.staffId === id)) break;
      attEditModal(id);
      break;
    }
    case 'payrollmodal': if (session.isAdmin) payrollModal(); break;
    case 'paydownload': {
      if (!session.isAdmin) break;
      const ym = ($('#payYm') || {}).value || today().slice(0, 7);
      downloadFile('WB_attendance_' + ym + '.csv', payrollCsv(ym), 'text/csv');
      toast(ym + ' 출퇴근 CSV를 다운로드했습니다');
      break;
    }
    case 'ctlog': {
      const name = el.dataset.name;
      if (name) ctModal(name);
      break;
    }
    case 'oplog': { if (el.dataset.name) opModal(el.dataset.name); break; }
    case 'exlog': { if (el.dataset.name) examModal(el.dataset.name); break; }
    case 'exkind': {
      document.querySelectorAll('#exKind .chip').forEach(c => c.classList.toggle('on', c === el));
      break;
    }
    case 'exsave': {
      if (!examTarget) break;
      const d = $('#exDate').value || today();
      const kind = (document.querySelector('#exKind .chip.on') || {}).dataset;
      const lv = Math.max(1, Math.min(10, Number($('#exLv').value) || 1));
      const k = (kind && kind.v) || EXAM_KINDS[0];
      const rec = {
        kind: k, lv: lv,
        label: ($('#exLabel').value || '').trim(),
        memo: ($('#exMemo').value || '').trim()
      };
      // 같은 날 같은 종류를 다시 기록하면 덮어쓰고, 다른 종류면 나란히 쌓는다
      setCheck(examKey(examTarget), d, {
        items: examOn(examTarget, d).filter(x => x.kind !== k).concat(rec), done: true
      });
      closeModal(); render(); toast(examTarget + ' — 평가를 기록했습니다');
      break;

    case 'opprog': {
      if (!opTarget) break;
      el.classList.toggle('on');

      setCheck('__opset__' + opTarget, 'all', { progs: picked, done: true });

    case 'opsave': {
      const name = el.dataset.name;

        cnt[inp.dataset.opcnt] = Math.max(0, Math.min(7, Number(inp.value) || 0));

      setCheck('__op__' + name, mondayOf(today()), { cnt: cnt, done: true });
      closeModal(); render(); toast(name + ' — 이번 주 학습 횟수를 기록했습니다');

      render();
      break;
    }
    case 'fbtext': {
      const t = task(); if (!t) break;
      fbCtx = { id: id, date: date, focus: null, plus: [], minus: null };
      fbModal();
      break;
    }
    case 'fbq': {
      if (!fbCtx) break;
      const q = el.dataset.q, v = el.dataset.v;
      if (q === 'focus') fbCtx.focus = (fbCtx.focus === v) ? null : v;
      else if (q === 'plus') {
        const n = Number(v);
        fbCtx.plus = fbCtx.plus.includes(n) ? fbCtx.plus.filter(x => x !== n)
          : (fbCtx.plus.length >= 2 ? (toast('잘한 점은 2개까지만'), fbCtx.plus) : fbCtx.plus.concat(n));
      }
      else if (q === 'minus') fbCtx.minus = (fbCtx.minus === Number(v)) ? null : Number(v);
      fbModal();
      break;
    }
    case 'fbmake': {
      if (!fbCtx) break;
      const t = state.tasks.find(x => x.id === fbCtx.id); if (!t) break;
      if (!fbCtx.focus && !fbCtx.plus.length && fbCtx.minus == null) return toast('보기를 하나 이상 골라주세요');
      const gen = buildComment(fbCtx, t.title + '|' + fbCtx.date);
      showText('학부모 피드백 문구 — 확인·수정 후 복사하세요', feedbackText(t, fbCtx.date, gen), true);
      break;
    }
    case 'fbskip': {
      if (!fbCtx) break;
      const t = state.tasks.find(x => x.id === fbCtx.id); if (!t) break;
      const c = getCheck(fbCtx.id, fbCtx.date);
      if (!c || !c.note) toast('메모에 한 줄 적으면 코멘트로 들어갑니다 (+잘한점 / -보완점 / 숙제…)');
      showText('학부모 피드백 문구 — 확인·수정 후 복사하세요', feedbackText(t, fbCtx.date), true);
      break;
    }
    case 'toggleowner': {
      if (!session.isAdmin) break;
      const s = staffById(id);
      if (!s) break;
      s.owner = !s.owner; s.updatedAt = now();
      save(); queueSync(); render();
      toast(s.owner ? s.name + ' — 대표로 지정 (직원 통계에서 제외)' : s.name + ' — 대표 해제');
      break;
    }
    case 'copylink': {
      ensureToken(id)
        .then(() => copy(staffLink(id)))
        .catch(e => toast('링크를 만들지 못했습니다 — ' + e.message));
      break;
    }
    case 'alllinks': {
      const list = liveStaff();
      toast(list.length + '명 링크 준비 중…');
      Promise.all(list.map(s => ensureToken(s.id).catch(() => null)))
        .then(() => copy(list.map(s => s.name + '\n' + staffLink(s.id)).join('\n\n')))
        .catch(e => toast('링크를 만들지 못했습니다 — ' + e.message));
      break;
    }
    case 'adminlink': {
      const url = location.origin + location.pathname + '?s=' +
        b64(JSON.stringify({
          k: state.settings.syncSecret || '',
          p: state.settings.adminPin || ''      // 비밀번호까지 담아 한 번에 복구되게
        }));
      copy(url);
      toast('복사했습니다 — 즐겨찾기에 저장해 두세요');
      break;
    }
    case 'orderText': showText('카카오톡 지시서 문구', orderText(id, cursor)); break;
    case 'report': showText('오늘 수행 보고', reportText(currentStaff().id, cursor)); break;
    case 'brief': showText('오늘 마감 브리핑', briefText(cursor)); break;
    case 'copytext': copy($('#mText').value); break;
    case 'managetasks': manageTasks(id); break;
    case 'newtask': editTaskModal(null); break;

    /* 빠른 추가 — 한 줄로 쓰고 바로 카톡 문구까지 */
    case 'qadd': {
      const line = ($('#qAdd').value || '').trim();
      if (!line) return toast('내용을 입력해 주세요');
      const me = currentStaff();
      if (!me) return toast('직원을 먼저 선택해 주세요');
      const p = parseInstructions(line)[0];
      const t = {
        id: uid(), groupId: 'quick-' + now(), staffId: me.id,
        title: p.title, detail: '', guide: '', steps: [], target: 0, unit: '건',
        time: p.time, priority: p.priority,
        repeat: 'once', days: [], start: p.start, end: '', carry: true,
        origin: actor(), createdAt: now(), updatedAt: now(), deleted: false
      };
      state.tasks.push(t);
      save(); queueSync(); render();
      toast(me.name + ' — 추가했습니다');
      if (!session.isStaffLink) {
        setTimeout(() => showText('카톡으로 보낼 문구', quickText(t)), 300);
      }
      break;
    }

    /* 카톡 문장 붙여넣기 */
    case 'kopen': kakaoText = ''; kakaoParsed = null; kakaoModal(); break;
    case 'kparse': {
      kakaoText = $('#kText').value || '';
      kakaoParsed = parseInstructions(kakaoText);
      kakaoModal();
      break;
    }
    case 'kapply': {
      pendingAdd = kakaoParsed;
      kakaoParsed = null; kakaoText = '';
      closeModal(); render();
      break;
    }
    case 'etask': {
      const t = task();
      if (!t) break;
      if (!canEditTask(t)) return toast('원장님이 내린 지시는 수정할 수 없습니다');
      editTaskModal(id);
      break;
    }
    case 'edelete': {
      const t = state.tasks.find(x => x.id === eForm.id);
      if (!t) break;
      if (!canEditTask(t)) { closeModal(); return toast('원장님이 내린 지시는 중단할 수 없습니다'); }
      if (!confirm('이 업무를 중단할까요? 지난 기록은 유지됩니다.')) return;
      t.deleted = true; t.updatedAt = now();
      eForm = null;
      save(); queueSync(); closeModal(); render(); toast('중단했습니다');
      break;
    }
    case 'erepeat': {
      eForm.repeat = el.dataset.v;
      document.querySelectorAll('#eRepeat .chip').forEach(c => c.classList.toggle('on', c.dataset.v === eForm.repeat));
      $('#eDaysWrap').style.display = eForm.repeat === 'days' ? '' : 'none';
      break;
    }
    case 'edow': {
      const d = Number(el.dataset.d), i = eForm.days.indexOf(d);
      if (i < 0) eForm.days.push(d); else eForm.days.splice(i, 1);
      el.classList.toggle('on');
      break;
    }
    case 'ecarry': {
      eForm.carry = !eForm.carry;
      el.classList.toggle('on', eForm.carry);
      el.textContent = (eForm.carry ? '☑' : '☐') + ' 못 끝내면 다음날로 이월';
      break;
    }
    case 'esave': saveEditedTask(); break;
    case 'deltask': {
      const t = task();
      if (!t || !confirm('이 지시를 중단할까요? 지난 기록은 유지됩니다.')) return;
      t.deleted = true; t.updatedAt = now();
      save(); queueSync(); closeModal(); render(); toast('중단했습니다');
      break;
    }

    /* AI 가져오기 */
    case 'aiopen': aiModal(); break;
    case 'aisample': $('#aiText').value = AI_SAMPLE; break;
    case 'aiapply': applyAssignments($('#aiText').value || ''); break;
    case 'padd': { const p = pendingAdd; pendingAdd = null; applyAssignments(p, true); go('today'); break; }
    case 'pcancel': pendingAdd = null; render(); toast('취소했습니다'); break;

    /* 지시서 작성 */
    case 'wstaff': {
      const i = wForm.staff.indexOf(id);
      if (i < 0) wForm.staff.push(id); else wForm.staff.splice(i, 1);
      el.classList.toggle('on');
      break;
    }
    case 'wrepeat': {
      wForm.repeat = el.dataset.v;
      document.querySelectorAll('#wRepeat .chip').forEach(c => c.classList.toggle('on', c.dataset.v === wForm.repeat));
      $('#wDaysWrap').style.display = wForm.repeat === 'days' ? '' : 'none';
      $('#wEndWrap').style.display  = wForm.repeat === 'once' ? 'none' : '';
      break;
    }
    case 'wdow': {
      const d = Number(el.dataset.d), i = wForm.days.indexOf(d);
      if (i < 0) wForm.days.push(d); else wForm.days.splice(i, 1);
      el.classList.toggle('on');
      break;
    }
    case 'wcarry': { wForm.carry = !wForm.carry; render(); break; }
    case 'wadd': {
      const title = ($('#wTitle').value || '').trim();
      if (!wForm.staff.length) return toast('받는 직원을 선택해 주세요');
      if (!title) return toast('업무 내용을 입력해 주세요');
      if (wForm.repeat === 'days' && !wForm.days.length) return toast('요일을 선택해 주세요');
      wForm.start = $('#wStart').value || today();
      wForm.end = (wForm.repeat === 'once' ? '' : ($('#wEnd').value || ''));
      draft.push({
        title: title,
        detail: ($('#wDetail').value || '').trim(),
        guide: ($('#wGuide').value || '').trim(),
        steps: ($('#wSteps').value || '').split('\n').map(x => x.trim()).filter(Boolean)
                 .map(l => ({ id: uid(), label: l })),
        target: Number($('#wTarget').value) || 0,
        unit: ($('#wUnit').value || '건').trim(),
        time: $('#wTime').value || '',
        priority: $('#wPri').value,
        repeat: wForm.repeat,
        days: wForm.days.slice().sort(),
        start: wForm.start,
        end: wForm.end,
        carry: wForm.carry,
        staffIds: wForm.staff.slice(),
        names: wForm.staff.map(x => (staffById(x) || {}).name).filter(Boolean)
      });
      render();
      toast('목록에 담았습니다 (' + draft.length + '건)');
      break;
    }
    case 'wdel': draft.splice(Number(el.dataset.i), 1); render(); break;
    case 'wclear': draft = []; render(); break;
    case 'wpublish': {
      if (!draft.length) return;
      const gid = uid(), touched = new Set();
      draft.forEach(d => d.staffIds.forEach(sid => {
        state.tasks.push({
          id: uid(), groupId: gid, staffId: sid,
          title: d.title, detail: d.detail, guide: d.guide,
          steps: (d.steps || []).map(s => ({ id: uid(), label: s.label })),
          target: d.target, unit: d.unit,
          time: d.time, priority: d.priority,
          repeat: d.repeat, days: d.days, start: d.start, end: d.end, carry: d.carry,
          origin: session.isStaffLink ? 'manager' : undefined,
          createdAt: now(), updatedAt: now(), deleted: false
        });
        touched.add(sid);
      }));
      const n = draft.length;
      draft = [];
      save(); queueSync(); render();
      toast(n + '건 발행 완료');
      const first = [...touched][0];
      if (first) setTimeout(() => showText('카카오톡 지시서 문구', orderText(first, today())), 400);
      break;
    }

    /* 설정 */
    case 'savecfg': {
      state.settings.syncSecret = ($('#cfgSecret').value || '').trim();
      save(); render(); toast('저장했습니다');
      if (state.settings.syncSecret) { sync.loud = true; sync.run(); }
      break;
    }
    case 'syncnow': sync.loud = true; sync.run(); toast('동기화 중…'); break;
    case 'export': {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'wb-업무지시서-' + today() + '.json';
      a.click(); URL.revokeObjectURL(a.href);
      break;
    }
    case 'import': {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = 'application/json';
      inp.onchange = () => {
        const f = inp.files[0]; if (!f) return;
        const r = new FileReader();
        r.onload = () => {
          try {
            const p = JSON.parse(r.result);
            if (!p || !Array.isArray(p.staff)) throw new Error('형식 오류');
            if (!confirm('현재 데이터를 덮어씁니다. 계속할까요?')) return;
            state = Object.assign(blankState(), p);
            save(); render(); toast('불러왔습니다');
          } catch (e) { toast('파일을 읽을 수 없습니다'); }
        };
        r.readAsText(f);
      };
      inp.click();
      break;
    }
    case 'closemodal': closeModal(); break;
  }
});

/* 메모 · 수량 직접 입력 */
let inputTimer = null;
document.addEventListener('input', ev => {
  const noteEl = ev.target.closest('[data-act="note"]');
  if (noteEl) {
    clearTimeout(inputTimer);
    inputTimer = setTimeout(() => {
      setCheck(noteEl.dataset.id, noteEl.dataset.date || cursor, { note: noteEl.value });
      toast('메모 저장됨');
    }, 700);
    return;
  }
  const cntEl = ev.target.closest('[data-act="cntset"]');
  if (cntEl) {
    clearTimeout(inputTimer);
    inputTimer = setTimeout(() => {
      const t = state.tasks.find(x => x.id === cntEl.dataset.id);
      const d = cntEl.dataset.date || cursor;
      setCheck(cntEl.dataset.id, d, { count: Math.max(0, Number(cntEl.value) || 0), blocked: false });
      if (t) syncAuto(t, d);
      render();
    }, 600);
  }
});

/* 출퇴근 시각 직접 수정 — time input은 값이 확정될 때(change) 저장한다 */
document.addEventListener('change', ev => {
  const el = ev.target.closest('[data-act="attedit-in"],[data-act="attedit-out"]');
  if (!el) return;
  const staffId = el.dataset.staff, date = el.dataset.date;
  if (!canEditAtt(staffId, date)) { toast('이 날짜는 수정할 수 없습니다 — 원장님께 요청해 주세요'); render(); return; }
  const field = el.dataset.act === 'attedit-in' ? 'at' : 'out';
  const ms = el.value ? msFromDateTime(date, el.value) : null;
  const cur = attOf(staffId, date);
  const newAt = field === 'at' ? ms : (cur ? cur.at : null);
  const newOut = field === 'out' ? ms : (cur ? cur.out : null);
  setCheck(attKey(staffId), date, { [field]: ms, done: !!(newAt || newOut) });
  toast('저장했습니다');
});

/* 엔터 제출 */
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Enter') return;
  const t = ev.target;
  if (t.id === 'pin')   document.querySelector('[data-act="setpin"],[data-act="login"]')?.click();
  if (t.id === 'sName') document.querySelector('[data-act="addstaff"]')?.click();
  if (t.id === 'qAdd')  document.querySelector('[data-act="qadd"]')?.click();
});

/* 복귀 시 최신화 */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (!cursorPinned && cursor !== today()) { cursor = today(); render(); }
  sync.run();
});

/* ══════════════════════════════════════════════════════
   11. 시작
   ══════════════════════════════════════════════════════ */
load();
absorbLinkParams();
const h = location.hash.replace('#/', '');
if (h) route = h;
if (session.isStaffLink && !['today', 'week'].includes(route)) route = 'today';
render();

if (sync.enabled()) {
  sync.run();
  setInterval(() => sync.run(), 45000);
}

/* ── 새 버전 감지 ──
 * 단일 HTML이라 브라우저가 예전 파일을 계속 물고 있는 일이 잦다.
 * version.json을 주기적으로 확인해 새 버전이 올라오면 알려주고 한 번에 새로고침한다. */
const APP_VER = '2026-08-03.1';
function checkVersion() {
  fetch('../version.json?t=' + Date.now(), { cache: 'no-store' })
    .then(r => r.ok ? r.json() : null)
    .then(d => {
      if (!d || !d.v || d.v === APP_VER || document.getElementById('newver')) return;
      const el = document.createElement('div');
      el.className = 'newver'; el.id = 'newver';
      el.innerHTML = '<span>\uc0c8 \ubc84\uc804\uc774 \uc788\uc2b5\ub2c8\ub2e4 \u2014 \uc0c8\ub85c\uace0\uce68\ud558\uba74 \ubc14\ub85c \uc801\uc6a9\ub429\ub2c8\ub2e4</span>' +
        '<button type="button" id="verReload">\uc0c8\ub85c\uace0\uce68</button>';
      document.body.appendChild(el);
      document.getElementById('verReload').onclick = () => {
        location.replace(location.pathname + location.search.replace(/[?&]v=\d+/, '') +
          (location.search ? '&' : '?') + 'v=' + Date.now() + location.hash);
      };
    })
    .catch(() => {});
}
checkVersion();
setInterval(checkVersion, 10 * 60 * 1000);

</script>
