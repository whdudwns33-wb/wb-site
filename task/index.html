    h += '<div class="empty mt14"><b>✅</b>지금 승인·처리할 요청이 없습니다.</div>';
  }
  return h + '</section>';
}

function viewSchedule() {
  if (!session.isAdmin) return viewToday();
  const core = window.WBScheduleCore;
  if (!core) return '<div class="card"><div class="empty"><b>⚠️</b>수업 현황을 불러오지 못했습니다.<br>새로고침해 주세요.</div></div>';
  ensureSessionModeData(state.tasks);
  if (!rosterDb && !rosterErr) loadRoster();
  if (!managerRequestInboxReady() && !managerInboxLoading) setTimeout(() => loadManagerRequestInbox(false), 0);

  const nowKst = seoulNowParts();
  const weekly = scheduleView === 'day' ? null : weeklyLessonSchedule(cursor);
  const navStep = scheduleView === 'day' ? 1 : 7;
  const navUnit = weekly ? '주' : '날';
  const weekEnd = weekly && weekly.days[6];
  const navTitle = weekly ? weekly.monday.slice(0, 4) + '년 ' + shortDate(weekly.monday) + '–' +
    (weekEnd.slice(0, 4) === weekly.monday.slice(0, 4) ? shortDate(weekEnd) : weekEnd.slice(0, 4) + '년 ' + shortDate(weekEnd)) : label(cursor);
  const navRel = weekly ? (mondayOf(nowKst.date) === weekly.monday ? '이번 주' : '') : relLabel(cursor);

  let h = '<div class="datenav">' +
    '<button class="navbtn" data-act="day" data-n="-' + navStep + '" aria-label="이전 ' + navUnit + '">‹</button>' +
    '<div class="d">' + esc(navTitle) + (navRel ? '<em>' + esc(navRel) + '</em>' : '') + '</div>' +
    '<button class="navbtn" data-act="day" data-n="' + navStep + '" aria-label="다음 ' + navUnit + '">›</button></div>' + scheduleToolbarHtml();

  if (weekly) {
    const isStudentView = scheduleView === 'student';
    const summary = core.weeklyTeacherSummary(weekly.entries);
    const rosterCount = isStudentView ? (rosterDb ? activeDuringWeek(weekly.days).length : '—') : null;
    const teacherCount = new Set(summary.teachers.map(teacher => teacher.teacherKey).concat(
      weekly.issues.map(issue => issue.staffId || issue.teacherName).filter(Boolean))).size;
    const pendingCount = weekly.issues.length;
    const conflictCount = summary.totals.conflictCount;
    h += scheduleKpisHtml([
      [summary.totals.sessionCount, '주간 타임'],
      [isStudentView ? rosterCount : summary.totals.studentCount,
        isStudentView ? '재원 학생' : '시간표 학생'],
      [teacherCount, '담당 선생님'],
      [pendingCount + ' · ' + conflictCount, '미확정 · 학생 겹침', pendingCount + conflictCount > 0]
    ]);
    if (scheduleView === 'week') h += scheduleWeekCardsHtml(weekly);
    else if (scheduleView === 'teacher') h += scheduleTeacherCardsHtml(weekly);
    else h += scheduleStudentCardsHtml(weekly);
    return h + managerRequestInboxHtml() + scheduleIssuesHtml(weekly.issues);
  }

  const daily = dailyLessonSchedule(cursor);
  daily.entries.forEach(entry => { entry.clockState = core.clockState(entry.slot, cursor, nowKst.date, nowKst.minute); });
  const current = daily.entries.filter(entry => entry.clockState === 'current');
  const currentStudentCount = new Set(current.map(entry => core.studentGroupKey(entry.studentName, entry.grade, entry.studentId))).size;
  const attendanceRecorded = daily.entries.filter(entry => scheduleAttendance(entry, cursor).value).length;
  const timeline = { rows: core.timelineRows(daily.entries), range: core.timelineRange(daily.entries) };
  const conflictCount = timeline.rows.reduce((count, row) => count + row.sessions.filter(session =>
    session.studentConflict).length, 0);
  const isToday = cursor === nowKst.date;
  const future = isToday ? daily.entries.filter(entry => entry.slot.startMinute > nowKst.minute) : [];
  const nextStart = future.length ? Math.min(...future.map(entry => entry.slot.startMinute)) : null;
  const studentCount = new Set(daily.entries.map(entry => core.studentGroupKey(entry.studentName, entry.grade, entry.studentId))).size;

  h += scheduleSummaryHtml(isToday ? [
    [currentStudentCount + '명', '수업 중'], [nextStart === null ? '없음' : scheduleMinuteText(nextStart), '다음 시작'],
    [attendanceRecorded + '/' + daily.entries.length, '출결'], [daily.issues.length + conflictCount + '건', '확인 필요']
  ] : [
    [studentCount + '명', '학생'], [daily.entries.length + '건', '수업'],
    [attendanceRecorded + '/' + daily.entries.length, '출결'], [daily.issues.length + conflictCount + '건', '확인 필요']
  ]);
  h += scheduleTimelineHtml(timeline, cursor, nowKst);
  return h + managerRequestInboxHtml() + scheduleIssuesHtml(daily.issues);
}

/** 급여용 출퇴근 내보내기 — 대표 전용. 아카플로우 등 외부 급여 계산과는
 *  이 CSV 하나로만 연결한다 (단방향: 앱 → 급여, 역방향 없음). */
function daysInMonth(ym) {
  const y = Number(ym.slice(0, 4)), m = Number(ym.slice(5, 7));
  const last = new Date(y, m, 0).getDate();
  const out = [];
  for (let d = 1; d <= last; d++) out.push(ym + '-' + String(d).padStart(2, '0'));
  return out;
}
/** 급여 대상 직원 — teamStaff()와 달리 삭제(퇴사) 여부를 안 가린다.
 *  퇴사한 달의 급여는 여전히 계산해야 하므로, 그 달에 근무 기록이 있으면 포함한다. */
const payrollStaff = () => state.staff.filter(s => !s.owner);

function payrollRows(ym) {
  const rows = [];
  payrollStaff().forEach(s => {
    daysInMonth(ym).forEach(d => {
      const a = attOf(s.id, d);
      if (!a || !a.done) return;
      const valid = a.at && a.out && a.out > a.at;
      rows.push({
        name: s.name, date: d, inT: a.at ? fmtTime(a.at) : '', outT: a.out ? fmtTime(a.out) : '',
        hours: valid ? Math.round((a.out - a.at) / 3600000 * 100) / 100 : null,
        issue: !a.at ? '출근 미기록' : !a.out ? '퇴근 미기록' : !valid ? '시간 확인 필요(퇴근이 출근보다 빠름)' : ''
      });
    });
  });
  rows.sort((a, b) => a.name === b.name ? a.date.localeCompare(b.date) : a.name.localeCompare(b.name));
  return rows;
}
function payrollCsv(ym) {
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const rows = payrollRows(ym);
  let csv = '﻿' + ['이름', '날짜', '출근', '퇴근', '근무시간(시간)', '비고'].map(q).join(',') + '\n';
  rows.forEach(r => {
    csv += [r.name, r.date, r.inT, r.outT, r.hours != null ? r.hours.toFixed(2) : '', r.issue].map(q).join(',') + '\n';
  });
  // 직원별 월 합계 — 급여 계산에 바로 쓸 수 있게 CSV 끝에 덧붙인다
  const totals = {};
  rows.forEach(r => { if (r.hours != null) totals[r.name] = (totals[r.name] || 0) + r.hours; });
  if (Object.keys(totals).length) {
    csv += '\n' + ['이름', '합계 근무시간(시간)'].map(q).join(',') + '\n';
    Object.keys(totals).forEach(name => {
      csv += [name, totals[name].toFixed(2)].map(q).join(',') + '\n';
    });
  }
  return csv;
}
function downloadFile(filename, text, mime) {
  const blob = new Blob([text], { type: mime + ';charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ── 교재 DB ──
 * 공개 가능한 교재·거래처만 정적 파일에 두고, 학생별 진도는 인증 서버에서 받는다.
 * 학생별 현재 위치(◀)와 남은 분량·예상 소요를 함께 보여준다.
 *
 * 새 교재/기존 교재 수정은 선생님이 앱에서 신청하면(book-add-request.js,
 * book-edit-request.js) 원장 승인 후 여기 병합된다. textbooks.json 자체는 정적
 * 파일이라 배포 없이는 못 고치므로, 승인된 신청만 따로 서버에서 읽어와(list_approved)
 * bookDb.books에 얹는다 — 배포를 기다리지 않고 바로 목록에 나타나는 이유가 이것이다.
 * 항상 추가 → 수정 순서로 덮어써야 새로 추가된 책(ADD..) 위에 수정도 먹는다. */
let bookDb = null, bookDbErr = '', bookDbLoading = false;
const bookOpen = new Set();
function loadBooks() {
  if (bookDbLoading) return;
  bookDbLoading = true;
  bookDbErr = '';
  fetch('textbooks.json?v=' + Date.now())
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(d => {
      d.students = privateBookStudents.slice();
      bookDb = d;
      applyBookOverlays();
      if (route === 'books') renderAfterSync();
      loadApprovedBookAdditions(false);
      loadApprovedBookEdits(false);
    })
    .catch(e => { bookDbErr = String(e); if (route === 'books') renderAfterSync(); })
    .finally(() => { bookDbLoading = false; });
}

function applyBookOverlays() { mergeBookAdditions(); mergeBookEdits(); }

let approvedBookAdditions = null;
let approvedBookAdditionsLoaded = false;
let approvedBookAdditionsLoading = false;
let approvedBookAdditionsError = '';

/** 승인된 신청을 bookDb.books에 얹는다 — 이미 있는 id는 건너뛰어 중복을 막는다 */
function mergeBookAdditions() {
  if (!bookDb || !approvedBookAdditions) return;
  const existingIds = new Set((bookDb.books || []).map(b => b.id));
  approvedBookAdditions.forEach(a => {
    if (existingIds.has(a.bookId)) return;
    bookDb.books.push({
      id: a.bookId, title: a.title, subject: a.subject || '', level: a.level || '',
      verify: false, note: a.note || '', units: a.units || [],
      vendor: a.vendorName || '', addedBy: a.owner, source: 'added'
    });
    existingIds.add(a.bookId);
  });
}

async function loadApprovedBookAdditions(force) {
  if (approvedBookAdditionsLoading || (approvedBookAdditionsLoaded && !force)) return;
  const auth = sync.auth();
  if (!auth) { approvedBookAdditionsLoaded = true; return; }
  approvedBookAdditionsLoading = true;
  approvedBookAdditionsError = '';
  try {
    const result = await sync.post('/book-add-request', { app: SYNC_APP, auth: auth, action: 'list_approved', limit: 300 });
    approvedBookAdditions = result.books || [];
    approvedBookAdditionsLoaded = true;
    applyBookOverlays();
  } catch (error) {
    approvedBookAdditions = approvedBookAdditions || [];
    approvedBookAdditionsLoaded = false;
    approvedBookAdditionsError = String(error && error.message || error || '승인 교재 불러오기 실패');
  } finally {
    approvedBookAdditionsLoading = false;
    if (route === 'books') renderAfterSync();
  }
}

let approvedBookEdits = null;
let approvedBookEditsLoaded = false;
let approvedBookEditsLoading = false;
let approvedBookEditsError = '';

/** 승인된 수정을 대상 책 위에 그대로 덮어쓴다(최종 상태 스냅샷) — 대상이 아직 없으면(오탈자 등) 건너뛴다 */
function mergeBookEdits() {
  if (!bookDb || !approvedBookEdits) return;
  const byId = new Map((bookDb.books || []).map(b => [b.id, b]));
  approvedBookEdits.forEach(e => {
    const b = byId.get(e.bookId);
    if (!b) return;
    b.title = e.title;
    b.subject = e.subject || '';
    b.level = e.level || '';
    b.vendor = e.vendorName || '';
    b.units = e.units || [];
    b.note = e.note || '';
    b.editedBy = e.owner;
  });
}

async function loadApprovedBookEdits(force) {
  if (approvedBookEditsLoading || (approvedBookEditsLoaded && !force)) return;
  const auth = sync.auth();
  if (!auth) { approvedBookEditsLoaded = true; return; }
  approvedBookEditsLoading = true;
  approvedBookEditsError = '';
  try {
    const result = await sync.post('/book-edit-request', { app: SYNC_APP, auth: auth, action: 'list_approved', limit: 300 });
    approvedBookEdits = result.edits || [];
    approvedBookEditsLoaded = true;
    applyBookOverlays();
  } catch (error) {
    approvedBookEdits = approvedBookEdits || [];
    approvedBookEditsLoaded = false;
    approvedBookEditsError = String(error && error.message || error || '교재 분류 불러오기 실패');
  } finally {
    approvedBookEditsLoading = false;
    if (route === 'books') renderAfterSync();
  }
}

/** 목차 텍스트 ↔ units[] 변환 — 대단원 이름은 한 줄, 소단원은 앞에 "- "를 붙인다.
 *  기존 다단원 교재(Ⅰ장/Ⅱ장 등)도 그대로 불러와 고칠 수 있게 하는 왕복 변환. */
function unitsToText(units) {
  return (units || []).map(u => u.name + (u.sections && u.sections.length ? '\n' + u.sections.map(s => '- ' + s).join('\n') : '')).join('\n');
}
function textToUnits(text) {
  const lines = String(text || '').split('\n').map(l => l.trim()).filter(Boolean);
  const units = [];
  lines.forEach(line => {
    if (line.startsWith('- ')) {
      if (!units.length) units.push({ name: '목차', sections: [] });
      units[units.length - 1].sections.push(line.slice(2).trim());
    } else {
      units.push({ name: line, sections: [] });
    }
  });
  return units;
}

function bookStudents(bookId) {
  return ((bookDb && bookDb.students) || []).filter(s => s.bookId === bookId);
}
function flatSections(b) {
  const out = [];
  (b.units || []).forEach(u => (u.sections || []).forEach(sec => out.push({ unit: u.name, sec: sec })));
  return out;
}
function posOf(b, at) {
  if (!at) return -1;
  const f = flatSections(b);
  for (let i = 0; i < f.length; i++) if (f[i].sec.includes(at) || at.includes(f[i].sec)) return i;
  return -1;
}

/** 거래처 카드 접기 상태 — 기본은 펼침, 닫은 것만 이 집합에 담는다 */
const vendorClosed = new Set();
const seriesExpansion = new Map();
const UNASSIGNED_VENDOR_KEY = '__unassigned__';
const OTHER_BOOK_SERIES = '기타·개별 교재';
let bookSearchQuery = '';
let bookToggleFocus = null;

function rememberBookToggleFocus(el) {
  bookToggleFocus = { act: el.dataset.act, key: el.dataset.key };
}
function restoreBookToggleFocus() {
  const saved = bookToggleFocus;
  bookToggleFocus = null;

/** 시리즈는 주문 데이터가 아닌 표시용 파생값이다. 확실한 이름만 묶고 나머지는 추정하지 않는다. */
function bookSeriesName(book) {
  const explicit = String(book && book.series || '').normalize('NFKC').replace(/\s+/g, ' ').trim();
  if (explicit) return explicit;
  const title = String(book && book.title || '').normalize('NFKC').replace(/\s+/g, ' ').trim();
  const rules = [
    [/^팩토\s*사고력(?:\s|$)/i, '팩토사고력'],
    [/^독해창\s+비상[12](?:\s|$)/, '독해창'],
    [/^논리와 상상\s+(?:기본|도약)\d+(?:\s|$)/, '논리와 상상'],
    [/^개념원리(?:\s|$)/, '개념원리'],
    [/^수학의 바이블(?:\s|$)/, '수학의 바이블'],
    [/^라이트쎈(?:\s|$)/, '라이트쎈'],
    [/^RPM(?:\s|$)/i, 'RPM'],
    [/^우공비 비문학 독해(?:\s|$)/, '우공비 비문학 독해']
  ];
  const found = rules.find(rule => rule[0].test(title));
  return found ? found[1] : OTHER_BOOK_SERIES;
}

function groupBooksBySeries(books) {
  const groups = new Map();
  (books || []).forEach(book => {
    const name = bookSeriesName(book);
    if (!groups.has(name)) groups.set(name, []);
    groups.get(name).push(book);
  });
  return Array.from(groups, ([name, items]) => ({ name, books: items })).sort((a, b) =>
    a.name === OTHER_BOOK_SERIES ? 1 : b.name === OTHER_BOOK_SERIES ? -1 : 0);
}

function normalizeBookSearch(value) {
  return String(value || '').normalize('NFKC').toLocaleLowerCase('ko').replace(/\s+/g, ' ').trim();
}
function bookSearchText(book, vendorName, seriesName) {
  return normalizeBookSearch([
    book && book.title, book && book.subject, book && book.level, vendorName, seriesName
  ].filter(Boolean).join(' '));
}
function bookSearchMatches(text, query) {
  const haystack = normalizeBookSearch(text);
  return normalizeBookSearch(query).split(' ').filter(Boolean).every(term => haystack.includes(term));
}
function booksOutsideSearch(books, vendorName, query) {
  if (!normalizeBookSearch(query)) return 0;
  return (books || []).filter(book => !bookSearchMatches(
    bookSearchText(book, vendorName, bookSeriesName(book)), query
  )).length;
}
function updateBookBatchOutsideSearch(vendor, hasQuery) {
  const outside = hasQuery
    ? vendor.querySelectorAll('[data-book-entry][data-book-selected="true"][hidden]').length
    : 0;
  const note = vendor.querySelector('[data-book-batch-outside]');
  if (note) {
    note.hidden = outside === 0;
    note.textContent = outside ? ' · 검색 밖 ' + outside + '권 포함' : '';
  }
  return outside;
}

/** 검색은 DOM 표시만 바꾼다. 기존 접기·선택·주문 상태는 건드리지 않는다. */
function applyBookSearch(value) {
  bookSearchQuery = String(value || '').slice(0, 120);
  const hasQuery = !!normalizeBookSearch(bookSearchQuery);
  let shown = 0;
  document.querySelectorAll('[data-book-series]').forEach(series => {
    let count = 0;
    series.querySelectorAll('[data-book-entry]').forEach(entry => {
      const matched = bookSearchMatches(entry.dataset.bookSearch, bookSearchQuery);
      entry.hidden = !matched;
      if (matched) count++;
    });
    series.hidden = hasQuery && count === 0;
    const body = series.querySelector('[data-book-series-body]');
    const toggle = series.querySelector('[data-act="seriestoggle"]');
    const expanded = hasQuery ? count > 0 : series.dataset.expanded === 'true';
    if (body) body.hidden = !expanded;
    if (toggle) {
      toggle.setAttribute('aria-expanded', String(expanded));
      toggle.disabled = hasQuery;
      toggle.title = hasQuery ? '검색 중에는 결과를 자동으로 펼칩니다. 검색을 지우면 다시 접을 수 있습니다.' : '';
    }
    const arrow = series.querySelector('[data-book-series-arrow]');
    if (arrow) arrow.textContent = expanded ? '▾' : '▸';
    shown += count;
  });
  document.querySelectorAll('[data-book-vendor]').forEach(vendor => {
    const matches = vendor.querySelectorAll('[data-book-entry]:not([hidden])').length;
    const body = vendor.querySelector('[data-book-vendor-body]');
    const toggle = vendor.querySelector('[data-act="vendortoggle"]');
    const expanded = hasQuery ? matches > 0 : vendor.dataset.closed !== 'true';
    vendor.hidden = hasQuery && matches === 0;
    updateBookBatchOutsideSearch(vendor, hasQuery);
    if (body) body.hidden = !expanded;
    if (toggle) {
      toggle.setAttribute('aria-expanded', String(expanded));
      toggle.disabled = hasQuery;
      toggle.title = hasQuery ? '검색 중에는 결과를 자동으로 펼칩니다. 검색을 지우면 다시 접을 수 있습니다.' : '';
    }
    const arrow = vendor.querySelector('[data-book-vendor-arrow]');
    if (arrow) arrow.textContent = expanded ? '▾' : '▸';
  });
  const status = document.querySelector('[data-book-search-status]');
  if (status) status.textContent = hasQuery
    ? shown + '권 검색됨 · 검색 중에는 결과를 자동으로 펼칩니다. 접기는 검색을 지운 뒤 사용할 수 있습니다.'
    : '전체 ' + shown + '권';
  const empty = document.querySelector('[data-book-search-empty]');
  if (empty) empty.hidden = !hasQuery || shown > 0;
}

function bookPendingOrderCount(b) {
  return bookPendingOrders(b).length;
}
/** 이 책이 걸린 미완료 주문 — 책 하나짜리 주문(옛 방식 포함)과, 이 책이 포함된 일괄 주문 둘 다 잡는다 */
function bookPendingOrders(b) {
  const orders = state.tasks.filter(t => !t.deleted && t.title.startsWith('[주문] ') &&
    (t.title === '[주문] ' + b.title || (Array.isArray(t.orderItems) && t.orderItems.some(it =>
      String(it.bookId || '') === String(b.id) || (!it.bookId && it.title === b.title)))));
  return orders.filter(t => {
    if (Number(t.orderIdentityVersion) === 1 && Array.isArray(t.orderItems)) {
      const itemIndexes = t.orderItems.map((item, index) => ({ item, index })).filter(row =>
        String(row.item.bookId || '') === String(b.id) || (!row.item.bookId && row.item.title === b.title));
      return !bookIssueLoaded || !itemIndexes.length || !itemIndexes.every(row =>
        bookOrderRows.some(status => String(status.taskId) === String(t.id) &&
          Number(status.itemIndex) === row.index && status.stage === 'student_handed'));
    }
    return !Object.keys(state.checks).some(k => state.checks[k].taskId === t.id && state.checks[k].done);
  });
}

/** 같은 교재를 아직 배부받지 못한 학생 ID만 중복 주문 차단에 쓴다. */
function activeBookOrderStudentIds(bookId) {
  const ids = new Set();
  state.tasks.filter(task => !task.deleted && Number(task.orderIdentityVersion) === 1 &&
    Array.isArray(task.orderItems)).forEach(task => {
    task.orderItems.forEach((item, itemIndex) => {
      if (String(item.bookId || '') !== String(bookId)) return;
      const handed = bookIssueLoaded && bookOrderRows.some(status => String(status.taskId) === String(task.id) &&
        Number(status.itemIndex) === itemIndex && status.stage === 'student_handed');
      if (!handed) (Array.isArray(item.studentIds) ? item.studentIds : []).forEach(id => ids.add(String(id)));
    });
  });
  return ids;
}

/** 온라인 직접 주문은 문자 발송·보호자 자동 현황과 분리한 내부 수동 업무로만 남긴다. */
function saveManualOnlineBookOrder(items) {
  const at = now();
  const orderItems = items.map(item => ({
    bookId: item.bookId, title: item.title, studentIds: item.studentIds,
    qty: item.studentIds.length + '권', unitPrice: item.unitPrice
  }));
  const titleMain = orderItems.length > 1 ? batchVendorName + ' — ' + orderItems.length + '권' : orderItems[0].title;
  const task = {
    id: batchOrderTaskId || uid(), groupId: 'order-' + at,
    staffId: session.isStaffLink ? session.staffId : null,
    title: '[주문] ' + titleMain,
    detail: orderItems.map(item => item.title + ': ' + item.qty).join(' · ') + ' · 주문처: ' + batchVendorName,
    guide: '온라인 사이트에서 직접 주문하는 교재입니다.\n' +
      '1) 주문 사이트에서 직접 주문\n2) 배송 확인 후 수령·배부 처리\n' +
      '※ 문자 자동 발송·보호자 자동 상태 공개 대상이 아닙니다.',
    steps: [{ id: uid(), label: '온라인 직접 주문' }, { id: uid(), label: '배송 확인' }],
    target: 0, unit: '건', time: '', priority: 'normal',
    repeat: 'once', days: [], start: today(), end: '', carry: true,
    orderVendor: batchVendorName, orderItems: orderItems, orderDelivery: 'manual_online_v1',
    origin: actor(), createdAt: at, updatedAt: at, deleted: false
  };
  state.tasks.push(task);
  items.forEach(item => batchSelection.delete(item.bookId));
  const totalQty = items.reduce((sum, item) => sum + item.studentIds.length, 0);
  batchDraft = null; batchVendorName = ''; batchOrderTaskId = '';
  save(); queueSync(); closeModal(); render();
  toast(totalQty + '권 저장 · 온라인 사이트에서 직접 주문해 주세요');
}

/** 새 주문은 서버가 현재 재원·담당 범위와 학생 정체성을 봉인한 뒤에만 로컬에 반영한다. */
async function submitBookOrder(items, button) {
  const duplicateStudent = items.some(item => {
    const activeIds = activeBookOrderStudentIds(item.bookId);
    return (Array.isArray(item.studentIds) ? item.studentIds : []).some(id => activeIds.has(String(id)));
  });
  if (duplicateStudent) return toast('선택한 학생 중 같은 교재 주문이 이미 진행 중인 학생이 있습니다 — 주문 현황을 확인해 주세요');
  if (!batchVendorName) return toast('교재 정보에서 주문처를 먼저 등록해 주세요');
  const auth = sync.auth();
  if (!auth) return toast('동기화 인증이 필요합니다');
  const vendor = ((bookDb && bookDb.vendors) || []).find(item => (item.name || item) === batchVendorName);
  if (vendor && vendor.type === 'online') return saveManualOnlineBookOrder(items);
  if (!batchOrderTaskId) batchOrderTaskId = 'ord_' + uid();
  const taskId = batchOrderTaskId;
  if (button) button.disabled = true;
  try {
    const result = await sync.post('/book-order', {
      app: SYNC_APP, auth: auth, action: 'create', taskId: taskId,
      vendorName: batchVendorName,
      items: items.map(item => ({
        bookId: item.bookId, title: item.title, studentIds: item.studentIds, unitPrice: item.unitPrice
      }))
    });
    if (!result.task || result.task.id !== taskId || result.task.orderDelivery !== 'scheduled_batch_v1' ||
        Number(result.task.orderIdentityVersion) !== 1) {
      throw new Error('서버의 주문 등록 결과를 확인하지 못했습니다');
    }
    applyCreatedLesson(result.task);
    items.forEach(item => batchSelection.delete(item.bookId));
    const totalQty = items.reduce((sum, item) => sum + item.studentIds.length, 0);
    batchDraft = null; batchVendorName = ''; batchOrderTaskId = '';
    bookIssueLoaded = false;
    closeModal(); render(); loadBookIssues(true);
    toast(totalQty + '권 저장 · 저녁 8시 일괄 발송 대기');
  } catch (error) {
    toast('주문 등록 실패 — ' + String(error && error.message || error));
    if (button && button.isConnected) button.disabled = false;
  }
}

async function cancelSealedBookOrder(task, button) {
  const auth = sync.auth();
  if (!auth) return toast('동기화 인증이 필요합니다');
  if (button) button.disabled = true;
  try {
    const result = await sync.post('/book-order', {
      app: SYNC_APP, auth: auth, action: 'cancel', taskId: task.id,
      expectedUpdatedAt: Number(task.updatedAt) || 0
    });
    if (!result.task || result.task.id !== task.id || !result.task.deleted ||
        Number(result.task.orderIdentityVersion) !== 1 ||
        !Number.isInteger(Number(result.task.orderCancelledAt)) || Number(result.task.orderCancelledAt) <= 0) {
      throw new Error('서버의 주문 취소 결과를 확인하지 못했습니다');
    }
    applyCreatedLesson(result.task);
    bookIssueLoaded = false;
    closeModal(); render(); loadBookIssues(true);
    toast('주문을 취소했습니다');
  } catch (error) {
    if (error && error.code === 'ORDER_CANCEL_SEND_ACTIVE') {
      toast('발송 중·접수 완료된 주문은 취소하지 않았습니다 — 주문 현황을 확인해 주세요');
      bookIssueLoaded = false; loadBookIssues(true);
    } else if (error && error.code === 'REVISION_CONFLICT') {
      toast('주문 상태가 다른 기기에서 바뀌었습니다 — 새로고침 후 다시 확인해 주세요');
      state.settings.pullAt = 0; save(); sync.dirty = true; sync.run();
    } else {
      toast('주문 취소 실패 — ' + String(error && error.message || error));
    }
    if (button && button.isConnected) button.disabled = false;

function bookCard(b) {
  const f = flatSections(b);
  const studs = bookStudents(b.id);
  const open = bookOpen.has(b.id);
  const openOrders = bookPendingOrderCount(b);
  const checked = batchSelection.has(b.id);

  let h = '<div class="card">' +
    '<div class="between book-card-head" data-act="bkopen" data-id="' + b.id + '" style="cursor:pointer">' +
      '<div class="row book-card-main" style="gap:8px">' +
        '<input type="checkbox" data-act="bkselect" data-id="' + b.id + '" ' + (checked ? 'checked' : '') +
          ' style="margin-top:4px" aria-label="' + esc(b.title) + ' 일괄 주문 선택">' +
        '<div><div class="card-title">' + esc(b.title) +
          (b.verify ? ' <span class="tag edit">검증필요</span>' : '') +
          (b.source === 'added' ? ' <span class="tag" style="color:var(--navy)">🆕 신청 등록</span>' : '') +
          (openOrders ? ' <span class="tag high">🛒 주문 진행 ' + openOrders + '</span>' : '') + '</div>' +
        '<div class="small muted">' + esc(b.subject) + ' · ' + esc(b.level) +
          (f.length ? ' · 소단원 ' + f.length + '개' : ' · 목차 없음') + '</div></div></div>' +
      '<div class="row book-card-actions" style="gap:8px">' +
        (openOrders ? '<button class="btn btn-sm btn-danger" data-act="bkcancelopen" data-id="' + b.id + '">🗑 취소</button>' : '') +
        '<button class="btn btn-sm btn-ghost" data-act="beopen" data-id="' + b.id + '">✏ 수정</button>' +
        '<button class="btn btn-sm btn-ghost" data-act="bkorder" data-id="' + b.id + '">🛒 주문</button>' +
        '<button class="btn btn-sm btn-ghost" data-act="bkopen" data-id="' + b.id + '" aria-label="' +
          esc(b.title) + ' 목차 ' + (open ? '접기' : '펼치기') + '" aria-expanded="' + String(open) + '">' +
          (open ? '▾' : '▸') + '</button></div></div>';

  studs.forEach(st => {
    const idx = posOf(b, st.at);
    const done = idx >= 0 ? idx : 0;
    const remain = f.length ? f.length - done : 0;
    const weeks = (st.perWeek && remain) ? Math.ceil(remain / st.perWeek) : 0;
    const pct = f.length ? Math.round(done / f.length * 100) : 0;
    h += '<hr class="sep"><div class="small"><b>' + esc(st.name) + '</b>' +
      (st.teacher ? ' <span class="muted">(' + esc(st.teacher) + ')</span>' : '') +
      (idx >= 0 ? ' — 현재 <b>' + esc(f[idx].sec) + '</b>' : (st.at ? ' — 위치 미확인' : '')) + '</div>' +
      (f.length ? '<div class="bar" style="margin:6px 0 4px"><i style="width:' + pct + '%"></i></div>' +
        '<div class="small muted">진행 ' + done + '/' + f.length +
        (weeks ? ' · 주 ' + st.perWeek + '회 기준 약 ' + weeks + '주 남음' : '') +
        (st.goal ? ' · 목표: ' + esc(st.goal) : '') + '</div>' : '');
  });

  if (open) {
    let lastUnit = '';
    h += '<hr class="sep">';
    f.forEach((row, i) => {
      if (row.unit !== lastUnit) { h += '<div class="sect" style="margin:10px 0 4px">' + esc(row.unit) + '</div>'; lastUnit = row.unit; }
      const marks = studs.filter(st => posOf(b, st.at) === i).map(st => ' <span class="tag doing">◀ ' + esc(st.name) + '</span>').join('');
      h += '<div class="small" style="padding:3px 0">' + (i + 1) + '. ' + esc(row.sec) + marks + '</div>';
    });
    if (!f.length) h += '<div class="small muted">목차가 아직 없습니다 — ' + esc(b.note || '') + '</div>';
  }
  return h + '</div>';
}

function bookAddSummary(item) {
  const parts = [];
  if (item.subject) parts.push('과목: ' + esc(item.subject));
  if (item.level) parts.push('레벨: ' + esc(item.level));
  if (item.vendorName) parts.push('거래처: ' + esc(item.vendorName));

async function submitBookAdd(button) {
  const title = (($('#baTitle') || {}).value || '').trim();
  if (!title) return toast('교재명을 입력해 주세요');
  const subject = (($('#baSubject') || {}).value || '').trim();
  const level = (($('#baLevel') || {}).value || '').trim();
  const vendorName = (($('#baVendor') || {}).value || '').trim();
  const units = textToUnits(($('#baSections') || {}).value || '');
  const note = (($('#baNote') || {}).value || '').trim();
  const auth = sync.auth();
  if (!auth) return toast('동기화 인증이 필요합니다');
  if (button) button.disabled = true;
  try {
    const result = await sync.post('/book-add-request', {
      app: SYNC_APP, auth: auth, action: 'submit', title: title, subject: subject, level: level,
      vendorName: vendorName, units: units, note: note
    });
    ownBookAddQueueLoaded = false; bookAddQueueLoaded = false;
    const approvedNow = result.request && result.request.status === 'approved';
    if (approvedNow) { approvedBookAdditionsLoaded = false; loadApprovedBookAdditions(true); }
    toast(result.idempotent ? '같은 이름의 신청이 이미 접수돼 있습니다'
      : (approvedNow ? '교재를 등록했습니다' : '원장님께 교재 추가를 신청했습니다'));
    closeModal(); render();
  } catch (error) {
    toast('신청 실패 — ' + (error.message || error));
    if (button) button.disabled = false;
  }
}

async function reviewBookAdd(action, key, revision) {
  const auth = sync.auth();
  if (!auth) return toast('동기화 인증이 필요합니다');
  const body = { app: SYNC_APP, auth: auth, action: action, requestKey: key, revision: Number(revision) };
  if (action === 'reject') {
    const note = prompt('선생님에게 전달할 반려 사유를 적어 주세요');
    if (note === null) return;
    body.note = note.trim();
  }
  try {
    const result = await sync.post('/book-add-review', body);
    const index = bookAddQueue.findIndex(item => item.requestKey === key);
    if (index >= 0) bookAddQueue[index] = result.request;
    if (action === 'approve') { approvedBookAdditionsLoaded = false; loadApprovedBookAdditions(true); }
    render();
    toast(action === 'approve' ? '승인했습니다 · 교재 목록에 등록됐습니다' : '반려했습니다');
  } catch (error) {
    toast('검토 실패 — ' + (error.message || error));
    loadBookAddQueue(true);
  }
}

async function submitBookEdit(button) {
  if (!beForm) return;
  const title = (($('#beTitle') || {}).value || '').trim();
  if (!title) return toast('교재명을 입력해 주세요');
  const subject = (($('#beSubject') || {}).value || '').trim();
  const level = (($('#beLevel') || {}).value || '').trim();
  const vendorName = (($('#beVendor') || {}).value || '').trim();
  const units = textToUnits(($('#beSections') || {}).value || '');
  const note = (($('#beNote') || {}).value || '').trim();
  const auth = sync.auth();
  if (!auth) return toast('동기화 인증이 필요합니다');
  if (button) button.disabled = true;
  try {
    const result = await sync.post('/book-edit-request', {
      app: SYNC_APP, auth: auth, action: 'submit', bookId: beForm.bookId, title: title, subject: subject,
      level: level, vendorName: vendorName, units: units, note: note
    });
    ownBookEditQueueLoaded = false; bookEditQueueLoaded = false;
    const approvedNow = result.request && result.request.status === 'approved';
    if (approvedNow) { approvedBookEditsLoaded = false; loadApprovedBookEdits(true); }
    toast(result.idempotent ? '같은 내용이 이미 접수돼 있습니다'
      : (approvedNow ? '수정을 반영했습니다' : '원장님께 수정을 신청했습니다'));
    beForm = null;
    closeModal(); render();
  } catch (error) {
    toast('신청 실패 — ' + (error.message || error));
    if (button) button.disabled = false;
  }
}

async function reviewBookEdit(action, key, revision) {
  const auth = sync.auth();
  if (!auth) return toast('동기화 인증이 필요합니다');
  const body = { app: SYNC_APP, auth: auth, action: action, requestKey: key, revision: Number(revision) };
  if (action === 'reject') {
    const note = prompt('선생님에게 전달할 반려 사유를 적어 주세요');
    if (note === null) return;
    body.note = note.trim();
  }
  try {
    const result = await sync.post('/book-edit-review', body);
    const index = bookEditQueue.findIndex(item => item.requestKey === key);
    if (index >= 0) bookEditQueue[index] = result.request;
    if (action === 'approve') { approvedBookEditsLoaded = false; loadApprovedBookEdits(true); }
    render();
    toast(action === 'approve' ? '승인했습니다 · 교재 정보에 반영됐습니다' : '반려했습니다');
  } catch (error) {
    toast('검토 실패 — ' + (error.message || error));
    loadBookEditQueue(true);
  }
}

/* ── 학생별 교재 출고·인계 ──
 * privateBookStudents의 stable assignment id가 정본이다. 개인 링크는 /roster와
 * /book-issue 양쪽에서 서버가 본인 학생만 내려주며, UI도 현재 assignment id
 * 목록과 교차해 다른 학생의 응답을 그리지 않는다. 연락처·주소는 다루지 않는다. */
const BOOK_ISSUE_STATUS = {
  unissued: ['미출고', 'warn'], pending: ['미출고', 'warn'], prepared: ['배부 준비', ''],
  issued: ['보관함 출고', 'bad'], handed: ['학생 인계 완료', 'ok'], cancelled: ['출고 취소', 'warn']
};
const BOOK_ISSUE_FILTERS = [
  ['all', '전체'], ['unissued', '미출고'], ['risk', '1일+ 미수령'], ['active', '인계 중'], ['handed', '완료']
];

function normalizeBookIssueStatus(value) {
  const status = String(value || '').toLowerCase();
  return BOOK_ISSUE_STATUS[status] ? status : 'unissued';
}

function bookIssueTime(row, key) {
  const value = row && (row[key] ?? row[key.replace(/[A-Z]/g, c => '_' + c.toLowerCase())]);
  const n = Number(value);
  if (Number.isFinite(n) && n > 0) return n;
  const parsed = Date.parse(String(value || ''));
  return Number.isFinite(parsed) ? parsed : 0;
}

function bookIssueViewRows() {
  const issueByAssignment = new Map((bookIssueRows || []).map(row => [String(row.assignmentId || row.assignment_id || ''), row]));
  const bookById = new Map((((bookDb && bookDb.books) || [])).map(book => [String(book.id), book]));
  const currentIds = new Set();
  const rows = (privateBookStudents || []).map(assignment => {
    const assignmentId = String(assignment.id || assignment.assignmentId || '');
    if (!assignmentId) return null;
    currentIds.add(assignmentId);
    const stored = issueByAssignment.get(assignmentId) || {};
    const book = bookById.get(String(assignment.bookId || '')) || {};
    const status = normalizeBookIssueStatus(stored.status);
    const issuedAt = bookIssueTime(stored, 'issuedAt');
    const handedAt = bookIssueTime(stored, 'handedAt');
    const storedStudentId = String(stored.studentId || stored.student_id || '');
    const storedBookId = String(stored.bookId || stored.book_id || '');
    const identityMismatch = String(stored.integrity || '') === 'mismatch' ||
      !!(storedStudentId && storedStudentId !== String(assignment.studentId || '')) ||
      !!(storedBookId && storedBookId !== String(assignment.bookId || ''));
    const risk = status === 'issued' && !!issuedAt && Date.now() - issuedAt >= 86400000;
    return {
      assignmentId: assignmentId, studentId: String(assignment.studentId || ''), bookId: String(assignment.bookId || ''),
      studentName: String(identityMismatch ? (stored.studentName || stored.student_name || '학생 연결 확인 필요') : (assignment.name || stored.studentName || stored.student_name || '학생 미입력')),
      teacher: String(identityMismatch ? (stored.teacher || '담당 연결 확인 필요') : (assignment.teacher || stored.teacher || '담당 미지정')),
      title: String(identityMismatch ? (stored.bookTitle || stored.book_title || storedBookId || '교재 연결 확인 필요') : (book.title || stored.bookTitle || stored.book_title || assignment.bookId || '교재 미입력')),
      status: status, revision: Number(stored.revision) || 0, issuedAt: issuedAt, handedAt: handedAt,
      updatedAt: bookIssueTime(stored, 'updatedAt'), risk: risk, integrity: identityMismatch ? 'mismatch' : ''
    };
  }).filter(Boolean);
  if (session.isAdmin) {
    (bookIssueRows || []).forEach(stored => {
      const assignmentId = String(stored.assignmentId || stored.assignment_id || '');
      if (!assignmentId || currentIds.has(assignmentId)) return;
      const status = normalizeBookIssueStatus(stored.status);
      const issuedAt = bookIssueTime(stored, 'issuedAt');
      rows.push({
        assignmentId: assignmentId, studentId: String(stored.studentId || stored.student_id || ''), bookId: String(stored.bookId || stored.book_id || ''),
        studentName: String(stored.studentName || stored.student_name || '학생 연결 확인 필요'), teacher: String(stored.teacher || '담당 연결 확인 필요'),
        title: String(stored.bookTitle || stored.book_title || stored.bookId || stored.book_id || '교재 연결 확인 필요'),
        status: status, revision: Number(stored.revision) || 0, issuedAt: issuedAt, handedAt: bookIssueTime(stored, 'handedAt'),
        updatedAt: bookIssueTime(stored, 'updatedAt'), risk: status === 'issued' && !!issuedAt && Date.now() - issuedAt >= 86400000,
        integrity: 'orphan'
      });
    });
  }
  return rows.sort((a, b) => Number(!!b.integrity) - Number(!!a.integrity) || Number(b.risk) - Number(a.risk) ||
    a.studentName.localeCompare(b.studentName, 'ko') || a.title.localeCompare(b.title, 'ko'));
}

function bookIssueUnassignedStudents() {
  if (!session.isAdmin) return [];
  if (rosterLoading || rosterErr || !rosterDb || !Array.isArray(rosterDb.students) || !Array.isArray(privateBookStudents)) return null;
  const currentMonth = today().slice(0, 7);
  const assignedStudentIds = new Set(privateBookStudents.map(row => String(row && row.studentId || '')).filter(Boolean));
  return rosterDb.students.filter(student => student && student.id && student.start <= currentMonth &&
    (!student.end || student.end > currentMonth) && !assignedStudentIds.has(String(student.id)))
    .sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'ko'));
}

async function loadBookIssues(force) {
  if (bookIssueLoading || (bookIssueLoaded && !force)) return;
  const auth = sync.auth();
  if (!auth) { bookIssueError = '동기화 인증이 필요합니다'; bookIssueLoaded = true; return; }
  bookIssueLoading = true; bookIssueError = '';
  if (route === 'books' || route === 'schedule') renderAfterSync();
  try {
    const result = await sync.post('/book-issue', { app: SYNC_APP, auth: auth, action: 'list' });
    bookIssueRows = Array.isArray(result.issues) ? result.issues : [];
    bookOrderRows = Array.isArray(result.orders) ? result.orders : [];
    bookIssueLoaded = true;
  } catch (error) {
    bookIssueError = String(error && error.message || error);
    bookIssueLoaded = true;
  } finally {
    bookIssueLoading = false;
    if (route === 'books' || route === 'schedule') renderAfterSync();
  }
}

function bookIssueMatches(row) {
  if (bookIssueFilter === 'unissued' && !['unissued', 'pending'].includes(row.status)) return false;
  if (bookIssueFilter === 'risk' && !row.risk) return false;
  if (bookIssueFilter === 'active' && !['prepared', 'issued'].includes(row.status)) return false;
  if (bookIssueFilter === 'handed' && row.status !== 'handed') return false;
  return true;
}

function applyBookIssueSearch(value) {
  bookIssueSearchQuery = String(value || '');
  const terms = bookIssueSearchQuery.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);
  const cards = Array.from(document.querySelectorAll('[data-book-issue-card]'));
  let shown = 0;
  cards.forEach(card => {
    const match = terms.every(term => String(card.dataset.search || '').includes(term));
    card.hidden = !match;
    if (match) shown++;
  });
  const status = document.querySelector('[data-book-issue-search-status]');
  if (status) status.textContent = terms.length ? shown + '건 검색됨' : cards.length + '건 표시 중';
  const empty = document.querySelector('[data-book-issue-search-empty]');
  if (empty) empty.hidden = !terms.length || shown > 0;
}

function restoreBookIssueFocus() {
  const key = bookIssueRestoreFocus;
  if (!key) return false;
  bookIssueRestoreFocus = null;
  const button = document.querySelector('[data-book-issue-focus="' + CSS.escape(key) + '"]');
  if (!button) return false;
  button.focus({ preventScroll: true });
  return true;
}

function bookIssueActionButtons(row) {
  if (row.integrity) return '<button class="btn btn-sm btn-ghost" disabled aria-disabled="true">연결 확인 후 처리</button>';
  const base = ' data-id="' + esc(row.assignmentId) + '" data-rev="' + row.revision + '"';
  if (['unissued', 'pending'].includes(row.status)) {
    return '<button class="btn btn-sm btn-primary" data-act="bookissuetransition" data-next="prepared"' + base + ' data-book-issue-focus="' + esc(row.assignmentId) + '">배부 준비</button>';
  }
  if (row.status === 'cancelled') return '<button class="btn btn-sm btn-primary" data-act="bookissuetransition" data-next="reissue" data-reason-required="true"' + base +
    ' data-book-issue-focus="' + esc(row.assignmentId) + '">사유 입력·재출고</button>';
  if (row.status === 'prepared') return '<button class="btn btn-sm btn-primary" data-act="bookissuetransition" data-next="issued"' + base + ' data-book-issue-focus="' + esc(row.assignmentId) + '">보관함 출고</button>' +
    '<button class="btn btn-sm btn-ghost" data-act="bookissuetransition" data-next="cancelled" data-reason-required="true"' + base + '>출고 취소</button>';
  if (row.status === 'issued') return '<button class="btn btn-sm btn-primary" data-act="bookissuetransition" data-next="handed"' + base + ' data-book-issue-focus="' + esc(row.assignmentId) + '">학생 인계 완료</button>' +
    '<button class="btn btn-sm btn-ghost" data-act="bookissuetransition" data-next="cancelled" data-reason-required="true"' + base + '>출고 취소</button>';
  return '<button class="btn btn-sm btn-ghost" data-act="bookissuetransition" data-next="reissue" data-reason-required="true"' + base + ' data-book-issue-focus="' + esc(row.assignmentId) + '">인계 취소·재출고</button>';
}

function bookIssueCard(row) {
  const labelRow = BOOK_ISSUE_STATUS[row.status] || BOOK_ISSUE_STATUS.unissued;
  const timeText = row.status === 'handed' && row.handedAt ? '인계 ' + new Date(row.handedAt).toLocaleString('ko-KR')
    : row.issuedAt ? '출고 ' + new Date(row.issuedAt).toLocaleString('ko-KR') : '아직 보관함에서 출고되지 않음';
  return '<article class="card book-issue-card' + (row.risk ? ' is-risk' : '') + '" data-book-issue-card data-search="' +
    esc([row.studentName, row.teacher, row.title, labelRow[0]].join(' ').toLocaleLowerCase()) + '">' +
    '<div class="between"><div><div class="card-title">' + esc(row.studentName) + ' · ' + esc(row.title) + '</div>' +
      '<div class="card-sub">담당 ' + esc(row.teacher) + ' · ' + esc(timeText) + '</div></div>' +
      '<span class="pill ' + labelRow[1] + '">' + esc(labelRow[0]) + '</span></div>' +
    (row.integrity ? '<div class="hint mt8"><b>연결 끊김·확인 필요</b> — ' +
      (row.integrity === 'mismatch' ? '같은 배정 ID의 학생 또는 교재 정보가 달라 자동 연결하지 않았습니다.' : '현재 교재 배정에서 사라진 과거 출고 기록입니다. 미인계 여부를 확인하세요.') + '</div>' : '') +
    (row.risk ? '<div class="hint mt8"><b>누락 위험</b> — 보관함 출고 후 실제 24시간 이상 학생 인계가 확인되지 않았습니다.</div>' : '') +
    '<div class="ops-actions">' + bookIssueActionButtons(row) + '</div></article>';
}

function viewLegacyBookIssues() {
  if (!bookIssueLoaded && !bookIssueLoading) setTimeout(() => loadBookIssues(false), 0);
  const unassigned = bookIssueUnassignedStudents();
  const unassignedHtml = bookIssueUnassignedHtml(unassigned);
  if (bookIssueLoading && !bookIssueLoaded) return '<section class="card book-issue-board"><div class="empty"><b>⏳</b>학생별 출고 현황을 불러오는 중…</div></section>' + unassignedHtml;
  if (bookIssueError) return '<section class="card alert book-issue-board"><div class="card-title">학생별 출고 현황을 불러오지 못했습니다</div>' +
    '<div class="card-sub">' + esc(bookIssueError) + '</div><button class="btn btn-sm btn-ghost mt14" data-act="bookissuerefresh">다시 시도</button></section>' + unassignedHtml;
  const all = bookIssueViewRows();
  const visible = all.filter(bookIssueMatches);
  const unissued = all.filter(row => ['unissued', 'pending'].includes(row.status)).length;
  const risk = all.filter(row => row.risk).length;
  const issuedToday = all.filter(row => row.issuedAt && ymd(new Date(row.issuedAt)) === today()).length;
  const handed = all.filter(row => row.status === 'handed').length;
  let h = '<section class="card book-issue-board"><div class="between"><div><div class="card-title">기존 교재 출고 이력</div>' +
    '<div class="card-sub">보관함에서 꺼낸 시점과 학생에게 직접 전달한 시점을 나눠 누락을 찾습니다.</div></div>' +
    '<button class="btn btn-sm btn-ghost" data-act="bookissuerefresh" aria-label="학생별 출고 현황 새로고침">새로고침</button></div>' +
    '<div class="ops-kpis book-issue-kpis" aria-label="교재 출고 요약"><div class="ops-kpi"><b>' + unissued + '</b><span>미출고</span></div>' +
      '<div class="ops-kpi' + (risk ? ' is-alert' : '') + '"><b>' + risk + '</b><span>출고 후 1일+ 미수령</span></div>' +
      '<div class="ops-kpi"><b>' + issuedToday + '</b><span>오늘 출고</span></div><div class="ops-kpi"><b>' + handed + '</b><span>인계 완료</span></div>' +
      (session.isAdmin ? (unassigned === null
        ? '<div class="ops-kpi is-alert"><b>—</b><span>미배정 확인 불가</span></div>'
        : '<div class="ops-kpi' + (unassigned.length ? ' is-alert' : '') + '"><b>' + unassigned.length + '</b><span>교재 미배정 · 확인 필요</span></div>') : '') + '</div>' +
    '<div class="ops-toolbar"><div class="chips" aria-label="교재 출고 상태 필터">' + BOOK_ISSUE_FILTERS.map(filter =>
      '<button class="chip ' + (bookIssueFilter === filter[0] ? 'on' : '') + '" data-act="bookissuefilter" data-status="' + filter[0] + '" aria-pressed="' + (bookIssueFilter === filter[0]) + '">' + filter[1] + '</button>').join('') + '</div>' +
      '<input class="in ops-search" type="search" data-book-issue-search aria-label="학생별 출고 검색" placeholder="학생·선생님·교재·상태 검색" value="' + esc(bookIssueSearchQuery) + '">' +
      '<span class="small muted" data-book-issue-search-status role="status" aria-live="polite"></span></div></section>';
  h += unassignedHtml;
  h += '<div class="book-issue-grid">' + visible.map(bookIssueCard).join('') + '</div>' +
    '<div class="onboarding-empty-search" data-book-issue-search-empty hidden>검색 결과가 없습니다.</div>';
  if (!visible.length) h += '<div class="card"><div class="empty"><b>📦</b>' + (all.length ? '이 상태에 해당하는 교재가 없습니다.' : '학생에게 배정된 교재가 없습니다.') + '</div></div>';
  return h;
}

function bookOrderStageRows(stage) {
  if (stage === 'order_result') return bookOrderRows.filter(row => ['ordered', 'order_failed', 'order_check'].includes(row.stage));
  return bookOrderRows.filter(row => row.stage === stage);
}

function bookOrderStatusLabel(row) {
  if (row.needsStudentLink) return ['학생 연결 필요', 'warn'];
  if (row.integrity) return ['연결 확인 필요', 'bad'];
  if (row.stage === 'order_waiting') return ['주문대기', 'warn'];
  if (row.stage === 'order_failed') return ['주문실패', 'bad'];
  if (row.stage === 'order_check') return ['주문 결과 확인 중', 'warn'];
  if (row.stage === 'ordered') return ['주문완료', 'ok'];
  if (row.stage === 'teacher_received') return ['선생님 수령', 'ok'];
  return row.academyRegisteredAt ? ['아카등록 완료', 'ok'] : ['학생배부 완료', 'ok'];
}

function bookOrderActionButtons(row) {
  const canTeacherAct = session.isAdmin || (session.isStaffLink && String(row.owner || '') === session.staffId);
  const base = ' data-task="' + esc(row.taskId) + '" data-item="' + Number(row.itemIndex) + '" data-rev="' + Number(row.revision || 0) +
    '" data-task-updated="' + Number(row.taskUpdatedAt || 0) + '"';
  if (row.canLinkStudents && canTeacherAct) {
    return '<button class="btn btn-sm btn-primary" data-act="bookorderlinkopen"' + base + '>학생 연결</button>';
  }
  if (row.integrity || row.needsStudentLink) return '<button class="btn btn-sm btn-ghost" disabled>학생·교재 연결 확인 필요</button>';
  if (row.stage === 'ordered' && canTeacherAct) return '<button class="btn btn-sm btn-primary" data-act="bookordertransition" data-next="receive"' + base + '>수령완료</button>';
  if (row.stage === 'teacher_received' && canTeacherAct) return '<button class="btn btn-sm btn-primary" data-act="bookordertransition" data-next="hand"' + base + '>배부완료</button>';
  if (row.stage === 'student_handed' && session.isAdmin && !row.academyRegisteredAt) {
    return '<button class="btn btn-sm btn-primary" data-act="bookordertransition" data-next="academy_register"' + base + '>아카등록완료</button>';
  }
  return '';
}

function bookOrderDateText(value) {
  const at = Number(value);
  if (!Number.isFinite(at) || at <= 0) return '미완료';
  const date = new Date(at);
  return Number.isNaN(date.getTime()) ? '미완료' : date.toLocaleString('ko-KR', {
    year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
  });
}

function bookOrderMoneyHtml(row) {
  const unitPrice = Number(row.unitPrice);
  if (!Number.isInteger(unitPrice) || unitPrice < 1) return '<div class="book-order-money">교재 금액 · 미입력</div>';
  const quantity = Math.max(0, Number(row.quantity || 0));
  return '<div class="book-order-money">교재 금액 · 권당 ' + unitPrice.toLocaleString('ko-KR') +
    '원 · 합계 ' + (unitPrice * quantity).toLocaleString('ko-KR') + '원</div>';
}

function bookOrderPriceEntryHtml(row) {
  if (!row.canSetUnitPrice) return '';
  return '<div class="book-order-price-entry"><label><span>1회성 교재 금액 (1권 기준)</span>' +
    '<input class="in" type="number" inputmode="numeric" min="1" max="10000000" step="1" ' +
      'data-book-order-price-input aria-label="' + esc(row.title) + ' 권당 교재 금액" placeholder="예: 15000"></label>' +
    '<button class="btn btn-sm btn-primary" data-act="bookorderpricesave" data-task="' + esc(row.taskId) +
      '" data-item="' + Number(row.itemIndex) + '">금액 저장</button>' +
    '<div class="book-order-price-note">한 번 저장하면 변경할 수 없습니다.</div></div>';
}

function bookOrderDatesHtml(row) {
  return '<div class="book-order-dates" aria-label="교재 주문 단계별 날짜">' + [
    ['주문요청', row.orderRequestedAt],
    ['주문완료', row.orderCompletedAt],
    ['수령완료', row.teacherReceivedAt],
    ['배부완료', row.studentHandedAt]
  ].map(item => '<div class="book-order-date"><b>' + item[0] + '</b><span>' + bookOrderDateText(item[1]) + '</span></div>').join('') + '</div>';
}

function bookOrderRowHtml(row) {
  const label = bookOrderStatusLabel(row);
  const students = Array.isArray(row.students) ? row.students : [];
  return '<article class="book-order-row"><div class="between"><div><div class="card-title">' + esc(row.title) + ' · ' + Number(row.quantity || 0) + '권</div>' +
    '<div class="card-sub">주문 ' + esc(row.teacherName || '담당 미지정') + ' · 주문처 ' + esc(row.vendorName || '미등록') + '</div></div><span class="pill ' + label[1] + '">' + label[0] + '</span></div>' +
    bookOrderMoneyHtml(row) + bookOrderPriceEntryHtml(row) + bookOrderDatesHtml(row) +
    (students.length ? '<div class="book-order-student-list">' + students.map(student => '<span class="book-order-student">' + esc(student.name) +
      (student.grade ? ' · ' + esc(student.grade) : '') + '</span>').join('') + '</div>' :
      '<div class="small muted mt8">' + (row.integrity || row.needsStudentLink ? '현재 원생 명단과 주문의 stable studentId 연결을 확인해 주세요.' : '기존 수량 주문 · 학생 연결 없음') + '</div>') +
    (row.stage === 'student_handed' && !row.academyRegisteredAt && session.isAdmin ? '<div class="hint mt8"><b>해야 할 업무 · 아카등록</b></div>' : '') +
    '<div class="ops-actions">' + bookOrderActionButtons(row) + '</div></article>';

function bookOrderStageHtml(stage, title, description) {
  const rows = bookOrderStageRows(stage);
  const quantity = rows.reduce((sum, row) => sum + Number(row.quantity || 0), 0);
  return '<details class="book-order-stage"><summary><b>' + esc(title) + '</b><span class="pill">' + quantity + '권</span></summary>' +
    '<div class="book-order-stage-list">' + (rows.length ? rows.map(bookOrderRowHtml).join('') :
      '<div class="empty"><b>📚</b>' + esc(description) + '</div>') + '</div></details>';

function viewBookIssues() {

    '<button class="btn btn-sm btn-ghost" data-act="bookissuerefresh">새로고침</button></div>';

  else if (bookIssueError) h += '<div class="hint mt8">현황을 불러오지 못했습니다 · ' + esc(bookIssueError) + '</div>';

    bookOrderStageHtml('order_waiting', '1단계 · 주문대기', '저녁 8시 발송을 기다리는 교재가 없습니다.') +
    bookOrderStageHtml('order_result', '2단계 · 주문완료 / 주문실패', '저녁 8시 이후 주문 결과가 없습니다.') +
    bookOrderStageHtml('teacher_received', '3단계 · 선생님 수령', '선생님이 수령한 교재가 없습니다.') +
    bookOrderStageHtml('student_handed', '4단계 · 학생배부 완료', '학생 배부가 완료된 교재가 없습니다.') + '</div>';

function bookOrderLinkBook(row) {
  const books = bookDb && Array.isArray(bookDb.books) ? bookDb.books : [];
  if (row && row.bookId) return books.find(book => String(book.id || '') === String(row.bookId)) || null;
  const title = String(row && row.title || '').trim();
  const matches = books.filter(book => String(book.title || '').trim() === title);
  return matches.length === 1 ? matches[0] : null;
}

function openBookOrderStudentLink(button) {
  const taskId = String(button.dataset.task || '');
  const itemIndex = Number(button.dataset.item);
  const row = bookOrderRows.find(item => String(item.taskId) === taskId && Number(item.itemIndex) === itemIndex);
  if (!row || !row.canLinkStudents) return toast('학생 연결이 필요한 주문 정보를 새로고침해 주세요');
  const book = bookOrderLinkBook(row);
  if (!book) return toast('교재 DB에서 같은 이름의 교재를 하나로 확인할 수 없습니다. 관리자에게 교재 연결을 확인해 주세요');

    '<div class="hint mb14">' + esc(studentLinkScopeText()) + '에서 이 교재를 사용할 학생을 선택해 주세요. 학생 이름이 아닌 stable studentId로 연결되며, 선택 인원이 교재 수량이 됩니다.</div>' +
    '<div class="book-order-picker-list">' + students.map(student =>
      '<label class="book-order-picker-option"><input type="checkbox" data-order-link-student value="' + esc(student.id) + '">' +
      '<span>' + esc(student.name || '이름 미입력') + '<small class="card-sub">' + esc(student.grade || '학년 미지정') + '</small></span></label>').join('') + '</div>',
    '<button class="btn btn-primary btn-block mt14" data-act="bookorderlinksave" data-task="' + esc(taskId) +
      '" data-item="' + itemIndex + '" data-book="' + esc(book.id) + '" data-task-updated="' + Number(row.taskUpdatedAt || 0) + '">학생 연결 저장</button>');

async function saveBookOrderStudentLink(button) {
  const auth = sync.auth();
  if (!auth) return toast('동기화 인증이 필요합니다');
  const studentIds = Array.from(document.querySelectorAll('[data-order-link-student]:checked'))
    .map(input => String(input.value || '')).filter(Boolean);
  if (!studentIds.length) return toast('이 교재를 사용할 학생을 한 명 이상 선택해 주세요');
  button.disabled = true;
  try {
    await sync.post('/book-issue', { app: SYNC_APP, auth: auth, action: 'order_link',
      taskId: String(button.dataset.task || ''), itemIndex: Number(button.dataset.item),
      bookId: String(button.dataset.book || ''), studentIds: studentIds,
      expectedUpdatedAt: Number(button.dataset.taskUpdated) || 0 });
    closeModal();
    await sync.run();
    await loadBookIssues(true);
    toast('학생 연결을 저장했습니다 · 이제 수령완료를 처리할 수 있습니다');
  } catch (error) {
    button.disabled = false;
    toast('학생 연결 저장 실패 — ' + (error.message || error));
    loadBookIssues(true);
  }
}

async function transitionBookOrder(button) {
  const auth = sync.auth();
  if (!auth) return toast('동기화 인증이 필요합니다');
  const next = String(button.dataset.next || '');
  if (next === 'receive' && !confirm('선생님이 이 교재를 실제로 수령했나요?')) return;
  if (next === 'hand' && !confirm('선택된 학생들에게 교재를 모두 배부했나요?')) return;
  if (next === 'academy_register' && !confirm('아카에 교재 등록을 완료했나요?')) return;
  button.disabled = true;
  try {
    await sync.post('/book-issue', { app: SYNC_APP, auth: auth, action: 'order_transition',
      taskId: String(button.dataset.task || ''), itemIndex: Number(button.dataset.item),
      next: next, revision: Number(button.dataset.rev) || 0 });
    await loadBookIssues(true);
    toast(next === 'receive' ? '수령완료로 저장했습니다' : next === 'hand' ? '배부완료로 저장했습니다' : '아카등록완료로 저장했습니다');
  } catch (error) {
    button.disabled = false;
    toast('교재 단계 저장 실패 — ' + (error.message || error));
    loadBookIssues(true);
  }
}

async function saveLegacyBookOrderPrice(button) {
  const auth = sync.auth();
  if (!auth) return toast('동기화 인증이 필요합니다');
  const box = button.closest('.book-order-price-entry');
  const input = box && box.querySelector('[data-book-order-price-input]');
  const unitPrice = Number(input && input.value);
  if (!Number.isInteger(unitPrice) || unitPrice < 1 || unitPrice > 10000000) {
    if (input) input.focus();
    return toast('1원부터 1,000만원 사이의 권당 금액을 입력해 주세요');
  }
  if (!confirm('권당 ' + unitPrice.toLocaleString('ko-KR') + '원으로 저장할까요? 저장 후에는 변경할 수 없습니다.')) return;
  button.disabled = true;
  if (input) input.disabled = true;
  try {
    await sync.post('/book-issue', { app: SYNC_APP, auth: auth, action: 'order_price_set',
      taskId: String(button.dataset.task || ''), itemIndex: Number(button.dataset.item), unitPrice: unitPrice });
    await loadBookIssues(true);
    toast('교재 금액을 저장했습니다');
  } catch (error) {
    button.disabled = false;
    if (input) { input.disabled = false; input.focus(); }
    toast('교재 금액 저장 실패 — ' + (error.message || error));
    loadBookIssues(true);
  }
}

async function transitionBookIssue(button) {
  const auth = sync.auth();
  if (!auth) return toast('동기화 인증이 필요합니다');
  const assignmentId = String(button.dataset.id || '');
  const next = String(button.dataset.next || '');
  let reason = '';
  if (button.dataset.reasonRequired === 'true') {
    reason = String(prompt(next === 'reissue' ? '인계를 취소하고 다시 출고하는 사유를 입력해 주세요' : '출고를 취소하는 사유를 입력해 주세요') || '').trim();
    if (!reason) return toast('취소·재출고 사유를 입력해 주세요');
  }
  bookIssueRestoreFocus = assignmentId;
  button.disabled = true;
  try {
    await sync.post('/book-issue', { app: SYNC_APP, auth: auth, action: 'transition', assignmentId: assignmentId,
      next: next, revision: Number(button.dataset.rev) || 0, reason: reason });
    await loadBookIssues(true);
    toast(next === 'handed' ? '학생 인계를 완료했습니다' : next === 'issued' || next === 'reissue' ? '보관함 출고로 기록했습니다' : '출고 상태를 저장했습니다');
  } catch (error) {
    bookIssueRestoreFocus = null;
    button.disabled = false;
    toast('출고 상태 저장 실패 — ' + (error.message || error));
    loadBookIssues(true);
  }
}

function viewBooks() {
  if (!rosterDb) {
    if (!rosterErr && !rosterLoading) loadRoster();
    if (rosterErr) return '<div class="card alert"><div class="card-title">원생별 교재 정보를 불러오지 못했습니다</div>' +
      '<div class="card-sub">학생 배정과 진도를 0명으로 잘못 표시하지 않도록 교재 화면을 잠시 멈췄습니다.</div>' +
      '<button class="btn btn-sm btn-ghost mt14" data-act="rosterretry">다시 시도</button></div>';
    return '<div class="card"><div class="empty"><b>📚</b>원생별 교재 정보를 불러오는 중…</div></div>';
  }
  if (!bookDb && !bookDbErr) { loadBooks(); return '<div class="card"><div class="empty"><b>📚</b>교재 데이터를 불러오는 중…</div></div>'; }
  if (bookDbErr) return '<div class="card alert"><div class="empty"><b>⚠️</b>교재 데이터를 불러오지 못했습니다.<br><span class="muted">' + esc(bookDbErr) + '</span><br>' +
    '<button class="btn btn-sm btn-ghost mt14" data-act="bookretry">다시 시도</button></div></div>';

  let h = viewBookIssues() + '<div class="card"><div class="card-title">📚 교재 DB</div>' +
    '<div class="card-sub">주문처(출판사) → 시리즈 → 세부 교재 순서로 묶었습니다. 주문처를 누르면 접고 펼칠 수 있고, 교재를 누르면 목차가 열립니다.<br>' +
    '시리즈명이 확인되지 않은 교재는 잘못 추정하지 않고 "기타·개별 교재"에 둡니다.<br>' +
    '개별 주문도 매일 저녁 8시에 출판사별 문자 한 통으로 자동 묶입니다. 여러 권을 한 번에 입력하려면 왼쪽 체크박스를 사용하세요.<br>' +
    '기준일 ' + esc(bookDb.updated || '') + ' · 각 교재 카드의 "✏ 수정" 버튼으로 정보를 고칠 수 있습니다.</div>' +
    '<div class="book-search-row"><input class="in book-search" type="search" data-book-search-input aria-label="교재 검색" ' +
      'placeholder="교재명·시리즈·과목·학년·주문처 검색" value="' + esc(bookSearchQuery) + '">' +
      '<button type="button" class="btn btn-primary" data-act="booksearch">검색</button>' +
      '<button type="button" class="btn btn-ghost" data-act="booksearchclear">전체 보기</button></div>' +
    '<div class="small muted mt8" data-book-search-status role="status" aria-live="polite">전체 ' +
      (bookDb.books || []).length + '권</div>' +
    ((approvedBookAdditionsLoading || approvedBookEditsLoading) ? '<div class="hint mt8">주문처 분류 정보를 불러오는 중입니다.</div>' : '') +
    ((approvedBookAdditionsError || approvedBookEditsError) ? '<div class="hint mt8" style="color:var(--coral)">주문처 분류 정보를 모두 불러오지 못했습니다. ' +
      '<button type="button" class="btn btn-sm btn-ghost" data-act="bookoverlayretry">다시 불러오기</button></div>' : '') +
    '<button class="btn btn-sm btn-primary mt14" data-act="baopen">+ 새 교재 추가 신청</button></div>';

  if (session.isAdmin) h += viewBookAddReview() + viewBookEditReview();
  if (session.isStaffLink && !session.isAdmin) h += viewOwnBookAddRequests() + viewOwnBookEditRequests();

  const searching = !!normalizeBookSearch(bookSearchQuery);
  const configuredVendors = bookDb.vendors || [];
  const configuredNames = new Set(configuredVendors.map(vendor => String(vendor.name || vendor)));
  const extraVendorNames = Array.from(new Set((bookDb.books || []).map(book => String(book.vendor || '').trim())
    .filter(name => name && !configuredNames.has(name))));
  const vendors = configuredVendors.concat(extraVendorNames.map(name => ({ name: name, type: 'other', brands: [] })));
  const byVendor = new Map(vendors.map(v => [v.name, []]));
  const unassigned = [];
  (bookDb.books || []).forEach(b => {
    const vendorName = String(b.vendor || '').trim();
    if (vendorName && byVendor.has(vendorName)) byVendor.get(vendorName).push(b);
    else unassigned.push(b);
  });

  const sections = vendors
    .map(v => ({ key: v.name, vend: v, books: byVendor.get(v.name) }))
    .filter(sec => sec.books.length);
  if (unassigned.length) sections.push({ key: UNASSIGNED_VENDOR_KEY, vend: null, books: unassigned });

  if (!sections.length) return h + '<div class="card"><div class="empty"><b>📚</b>등록된 교재가 없습니다.</div></div>';

  h += '<div class="card" data-book-search-empty hidden><div class="empty"><b>🔎</b>검색 결과가 없습니다.</div></div>';

  sections.forEach(sec => {
    const pending = sec.books.reduce((sum, b) => sum + bookPendingOrderCount(b), 0);
    const selectedHere = sec.books.filter(b => batchSelection.has(b.id));
    const closed = vendorClosed.has(sec.key);
    const vendorLabel = sec.vend ? sec.vend.name : '거래처 미등록';
    const selectedOutsideSearch = booksOutsideSearch(selectedHere, vendorLabel, bookSearchQuery);
    const brands = sec.vend && Array.isArray(sec.vend.brands) ? sec.vend.brands : [];
    h += '<section class="book-vendor" data-book-vendor data-closed="' + String(closed) + '">' +
      '<button type="button" class="card between book-vendor-toggle" data-act="vendortoggle" data-key="' + esc(sec.key) +
      '" aria-expanded="' + String(!closed) + '"' + (searching ? ' disabled' : '') + '>' +
      '<span class="book-vendor-copy"><span class="card-title">' + (sec.vend ? esc(sec.vend.name) : '거래처 미등록') +
        (sec.vend ? ' ' + vendorTypeBadge(sec.vend) : '') +
        (selectedHere.length ? ' <span class="tag">선택 ' + selectedHere.length + '</span>' : '') +
        (pending ? ' <span class="tag high">🛒 주문 진행 ' + pending + '</span>' : '') + '</span>' +
        '<span class="small muted">교재 ' + sec.books.length + '권' +
        (brands.length ? ' · ' + esc(brands.slice(0, 4).join('·')) + (brands.length > 4 ? ' 외' : '') : '') +
        '</span></span><span class="muted" data-book-vendor-arrow>' + (closed ? '▸' : '▾') + '</span></button>' +
      '<div class="book-vendor-body" data-book-vendor-body' + (closed ? ' hidden' : '') + '>';
    groupBooksBySeries(sec.books).forEach(group => {
      const selected = group.books.filter(book => batchSelection.has(book.id)).length;
      const groupPending = group.books.reduce((sum, book) => sum + bookPendingOrderCount(book), 0);
      const seriesKey = sec.key + '::' + group.name;
