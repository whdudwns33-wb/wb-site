    case 'wdel': draft.splice(Number(el.dataset.i), 1); render(); break;
    case 'wclear': draft = []; render(); break;
    case 'wpublish': {
      if (!session.isAdmin) break;
      if (!draft.length) return;
      const gid = uid(), touched = new Set();
      draft.forEach(d => d.staffIds.forEach(sid => {
        state.tasks.push({
          id: uid(), groupId: gid, staffId: sid,
          title: d.title, detail: d.detail, guide: d.guide,
          steps: (d.steps || []).map(s => ({ id: uid(), label: s.label })),
          target: d.target, unit: d.unit,
          time: d.time, priority: d.priority,
          repeat: d.repeat, days: d.days, start: d.start, end: d.end, carry: d.carry,
          origin: actor(),
          createdAt: now(), updatedAt: now(), deleted: false
        });
        touched.add(sid);
      }));
      const n = draft.length;
      draft = [];
      save(); queueSync(); render();
      toast(n + '건 발행 완료');
      const first = [...touched][0];
      if (first) setTimeout(() => {
        issueLinkCode(first)
          .then(() => showText('카카오톡 지시서 문구', orderText(first, today())))
          .catch(e => toast('링크를 만들지 못했습니다 — ' + e.message));
      }, 400);
      break;
    }

    /* 설정 */
    case 'savecfg': {
      state.settings.syncSecret = ($('#cfgSecret').value || '').trim();
      save(); render(); toast('저장했습니다');
      if (state.settings.syncSecret) { sync.loud = true; sync.run(); }
      break;
    }
    case 'syncnow': sync.loud = true; sync.run(); toast('동기화 중…'); break;
    case 'export': {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'wb-업무지시서-' + today() + '.json';
      a.click(); URL.revokeObjectURL(a.href);
      break;
    }
    case 'import': {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = 'application/json';
      inp.onchange = () => {
        const f = inp.files[0]; if (!f) return;
        const r = new FileReader();
        r.onload = () => {
          try {
            const p = JSON.parse(r.result);
            if (!p || !Array.isArray(p.staff)) throw new Error('형식 오류');
            if (!confirm('현재 데이터를 덮어씁니다. 계속할까요?')) return;
            state = Object.assign(blankState(), p);
            save(); render(); toast('불러왔습니다');
          } catch (e) { toast('파일을 읽을 수 없습니다'); }
        };
        r.readAsText(f);
      };
      inp.click();
      break;
    }
    case 'closemodal': closeModal(); break;
  }
});

function captureTransportDraftFromEvent(target) {
  if (route !== 'transport' || !session.isAdmin || !target) return false;
  const field = target.matches && target.matches('[data-tc-base-address], [data-tc-name], [data-tc-plate], [data-tc-capacity], [data-tc-route-name], [data-tc-direction], [data-tc-route-time], [data-tc-vehicle-id], [data-tc-driver-id], [data-tc-active], [data-tc-day], [data-tc-dwell], [data-tc-stop-name], [data-tc-stop-address], [data-tc-stop-time], [data-tc-students]');
  if (!field) return false;
  transportConfigDraft = captureTransportConfig();
  transportConfigDirty = true;
  const routeRow = target.closest('[data-tc-route]');
  if (routeRow) transportOpenRouteId = String(routeRow.dataset.id || '');
  return true;
}

/* 메모 · 수량 직접 입력 */
let inputTimer = null;
document.addEventListener('input', ev => {
  if (captureTransportDraftFromEvent(ev.target)) return;
  const bookIssueSearch = ev.target.closest('[data-book-issue-search]');
  if (bookIssueSearch) {
    applyBookIssueSearch(bookIssueSearch.value);
    return;
  }
  const onboardingSearch = ev.target.closest('[data-onboarding-search]');
  if (onboardingSearch) {
    applyOnboardingSearch(onboardingSearch.value);
    return;
  }
  const bookSearch = ev.target.closest('[data-book-search-input]');
  if (bookSearch) {
    applyBookSearch(bookSearch.value);
    return;
  }
  const scheduleSearch = ev.target.closest('[data-schedule-search]');
  if (scheduleSearch) {
    applyScheduleSearch(scheduleSearch.value);
    return;
  }
  const noteEl = ev.target.closest('[data-act="note"]');
  if (noteEl) {
    clearTimeout(inputTimer);
    inputTimer = setTimeout(() => {
      setCheck(noteEl.dataset.id, noteEl.dataset.date || cursor, { note: noteEl.value });
      toast('메모 저장됨');
    }, 700);
    return;
  }
  const cntEl = ev.target.closest('[data-act="cntset"]');
  if (cntEl) {
    clearTimeout(inputTimer);
    inputTimer = setTimeout(() => {
      const t = state.tasks.find(x => x.id === cntEl.dataset.id);
      const d = cntEl.dataset.date || cursor;
      setCheck(cntEl.dataset.id, d, { count: Math.max(0, Number(cntEl.value) || 0), blocked: false });
      if (t) syncAuto(t, d);
      renderAfterSync();
    }, 600);
  }
});

/* 수업 등록 폼은 시간대 버튼으로 다시 그려져도 입력값을 유지한다. */
document.addEventListener('input', ev => {
  const field = ev.target.closest('[data-lesson-field]');
  if (field) {
    currentLessonDraft()[field.dataset.lessonField] = field.value;
    persistLessonDraft();
    return;
  }
  const slotField = ev.target.closest('[data-lesson-slot]');
  if (slotField) {
    const slot = currentLessonDraft().scheduleSlots[Number(slotField.dataset.i)];
    if (slot) { slot[slotField.dataset.lessonSlot] = slotField.value; persistLessonDraft(); }
  }
});

document.addEventListener('change', ev => {
  if (captureTransportDraftFromEvent(ev.target)) return;
  const lessonStudent = ev.target.closest('[data-lesson-student]');
  if (lessonStudent) {
    if (!(session.isStaffLink && !session.isAdmin)) return;
    const student = assignedLessonStudents().find(item => String(item.id) === String(lessonStudent.value));
    const draft = currentLessonDraft();
    draft.studentId = student ? student.id : '';
    draft.studentName = student ? student.name : '';
    draft.grade = student ? student.grade : '';
    persistLessonDraft(); render();
    return;
  }
  const onboardingDate = ev.target.closest('[data-onboarding-date]');
  if (onboardingDate) {
    if (!session.isAdmin) return;
    const studentId = String(onboardingDate.dataset.id || '');
    const student = rosterDb && (rosterDb.students || []).find(row => String(row.id) === studentId);
    if (student && student.end && student.end <= today().slice(0, 7)) {
      toast('재원이 종료된 학생의 기록은 수정할 수 없습니다'); render(); return;
    }
    if (!onboardingRecord(studentId) || !validOnboardingFirstDate(student, onboardingDate.value)) {
      toast('첫 등원일은 명단 시작월 이후의 재원 기간으로 입력해 주세요'); render(); return;
    }
    patchOnboarding(studentId, 'date', { firstClassDate: onboardingDate.value }, '첫 등원일을 수정했습니다');
    return;
  }
  const acaflowFile = ev.target.closest('[data-acaflow-file]');
  if (acaflowFile) {
    if (!session.isAdmin || session.isStaffLink) return;
    const file = acaflowFile.files && acaflowFile.files[0];
    const name = acaflowSpreadsheetName(file);
    const help = $('#acaflowFileHelp');
    const button = document.querySelector('[data-act="acaflowcopy"]');
    if (!name) {
      acaflowImportFileName = '';
      acaflowFile.value = '';
      if (help) help.textContent = '학생번호·이름·학년·담당·과목·상태·변경일만 남긴 Excel/CSV 사본을 선택하세요.';
      if (button) button.disabled = true;
      toast('Excel(.xlsx/.xls) 또는 CSV(.csv) 파일만 선택해 주세요');
    } else {
      acaflowImportFileName = name;
      if (help) help.textContent = '선택한 파일명: ' + name + ' · 앱은 내용을 검사하거나 보관하지 않습니다.';
      if (button) button.disabled = false;
      toast('파일명을 선택했습니다 — 내용은 검사하지 않았습니다. 정제 사본만 Codex 작업에 첨부해 주세요');
    }
    return;
  }
  const field = ev.target.closest('[data-lesson-field]');
  if (field) { currentLessonDraft()[field.dataset.lessonField] = field.value; persistLessonDraft(); }
});

/* 출퇴근 시각 직접 수정 — time input은 값이 확정될 때(change) 저장한다 */
document.addEventListener('change', ev => {
  const el = ev.target.closest('[data-act="attedit-in"],[data-act="attedit-out"]');
  if (!el) return;
  const staffId = el.dataset.staff, date = el.dataset.date;
  if (!canEditAtt(staffId, date)) { toast('이 날짜는 수정할 수 없습니다 — 원장님께 요청해 주세요'); render(); return; }
  const field = el.dataset.act === 'attedit-in' ? 'at' : 'out';
  const ms = el.value ? msFromDateTime(date, el.value) : null;
  const cur = attOf(staffId, date);
  const newAt = field === 'at' ? ms : (cur ? cur.at : null);
  const newOut = field === 'out' ? ms : (cur ? cur.out : null);
  setCheck(attKey(staffId), date, { [field]: ms, done: !!(newAt || newOut) });
  toast('저장했습니다');
});

/* 엔터 제출 */
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && !$('#modalHost').hidden) { closeModal(); return; }
  if (ev.key !== 'Enter') return;
  const t = ev.target;
  if (t.id === 'pin')   document.querySelector('[data-act="setpin"],[data-act="login"]')?.click();
  if (t.id === 'sName') document.querySelector('[data-act="addstaff"]')?.click();
  if (t.matches('[data-transport-driver-name]')) document.querySelector('[data-act="transportdriveradd"]')?.click();
  if (t.id === 'qAdd')  document.querySelector('[data-act="qadd"]')?.click();
});

/* 복귀 시 최신화 */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (!cursorPinned && cursor !== today()) { cursor = today(); render(); }
  sync.run();
});

/* ══════════════════════════════════════════════════════
   11. 시작
   ══════════════════════════════════════════════════════ */
load();
absorbLinkParams();
const h = location.hash.replace('#/', '');
if (h && !/(^|&)c=/.test(h)) route = h;
render();

let syncLoopStarted = false;
function ensureSyncLoopStarted() {
  if (syncLoopStarted || !sync.enabled()) return;
  syncLoopStarted = true;
  setInterval(() => sync.run(), 45000);
}

async function startSyncSession() {
  // 1회용 코드는 자동 교환하지 않는다. 카카오에서는 원본 링크를 보존하고,
  // 최종 브라우저의 '이 기기에 연결' 버튼에서만 exchange한다.
  if (pendingBootstrapCode) {
    // 새 연결 코드가 있으면 이전 토큰 상태와 무관하게 새 코드 연결 화면을 우선한다.
    // 만료된 기존 토큰이 유효한 새 링크의 연결 버튼을 숨기면 안 된다.
    render();
    return false;
  }
  if (!sync.enabled()) {
    if (session.isStaffLink && hasSensitiveManagerCache('')) resetPersonCache('');
    render();
    return false;
  }
  const verified = await sync.run();
  if (sync.enabled()) ensureSyncLoopStarted();
  return verified;
}
startSyncSession();

/* ── 새 버전 감지 ──
 * 단일 HTML이라 브라우저가 예전 파일을 계속 물고 있는 일이 잦다.
 * version.json을 주기적으로 확인해 새 버전이 올라오면 알려주고 한 번에 새로고침한다. */
const APP_VER = '2026-08-14.1';
const VERSION_RELOAD_KEY = 'wb_task_version_reload';
function reloadVersion(version) {
  const next = new URL(location.href);
  next.searchParams.set('v', version);
  location.replace(next.pathname + next.search + next.hash);
}
function checkVersion() {
  fetch('../version.json?t=' + Date.now(), { cache: 'no-store' })
    .then(r => r.ok ? r.json() : null)
    .then(d => {
      if (!d || !d.v) return;
      if (d.v === APP_VER) { sessionStorage.removeItem(VERSION_RELOAD_KEY); return; }
      if (sessionStorage.getItem(VERSION_RELOAD_KEY) !== d.v) {
        sessionStorage.setItem(VERSION_RELOAD_KEY, d.v);
        reloadVersion(d.v);
        return;
      }
      if (document.getElementById('newver')) return;
      const el = document.createElement('div');
      el.className = 'newver'; el.id = 'newver';
      el.innerHTML = '<span>\uc0c8 \ubc84\uc804\uc774 \uc788\uc2b5\ub2c8\ub2e4 \u2014 \uc0c8\ub85c\uace0\uce68\ud558\uba74 \ubc14\ub85c \uc801\uc6a9\ub429\ub2c8\ub2e4</span>' +
        '<button type="button" id="verReload">\uc0c8\ub85c\uace0\uce68</button>';
      document.body.appendChild(el);
      document.getElementById('verReload').onclick = () => reloadVersion(d.v);
    })
    .catch(() => {});
}
checkVersion();
setInterval(checkVersion, 10 * 60 * 1000);
setInterval(() => {
  if (route === 'schedule' && scheduleView === 'day' && session.isAdmin && cursor === seoulNowParts().date) render();
}, 60 * 1000);
