        id: uid(), groupId: 'quick-' + now(), staffId: me.id,
        title: p.title, detail: '', guide: '', steps: [], target: 0, unit: '건',
        time: p.time, priority: p.priority,
        repeat: 'once', days: [], start: p.start, end: '', carry: true,
        origin: actor(), createdAt: now(), updatedAt: now(), deleted: false
      };
      state.tasks.push(t);
      save(); queueSync(); render();
      toast(me.name + ' — 추가했습니다');
      if (session.isAdmin) {
        setTimeout(() => {
          issueLinkCode(t.staffId)
            .then(() => showText('카톡으로 보낼 문구', quickText(t)))
            .catch(e => toast('링크를 만들지 못했습니다 — ' + e.message));
        }, 300);
      }
      break;
    }

    /* 카톡 문장 붙여넣기 */
    case 'kopen': kakaoText = ''; kakaoParsed = null; kakaoModal(); break;
    case 'kparse': {
      kakaoText = $('#kText').value || '';
      kakaoParsed = parseInstructions(kakaoText);
      kakaoModal();
      break;
    }
    case 'kapply': {
      pendingAdd = kakaoParsed;
      kakaoParsed = null; kakaoText = '';
      closeModal(); render();
      break;
    }
    case 'etask': {
      const t = task();
      if (!t) break;
      if (!canEditTask(t)) return toast('원장님이 내린 지시는 수정할 수 없습니다');
      editTaskModal(id);
      break;
    }
    case 'edelete': {
      const t = state.tasks.find(x => x.id === eForm.id);
      if (!t) break;
      if (!canEditTask(t)) { closeModal(); return toast('원장님이 내린 지시는 중단할 수 없습니다'); }
      if (!confirm('이 업무를 중단할까요? 지난 기록은 유지됩니다.')) return;
      t.deleted = true; t.updatedAt = now();
      eForm = null;
      save(); queueSync(); closeModal(); render(); toast('중단했습니다');
      break;
    }
    case 'erepeat': {
      eForm.repeat = el.dataset.v;
      document.querySelectorAll('#eRepeat .chip').forEach(c => c.classList.toggle('on', c.dataset.v === eForm.repeat));
      $('#eDaysWrap').style.display = eForm.repeat === 'days' ? '' : 'none';
      break;
    }
    case 'edow': {
      const d = Number(el.dataset.d), i = eForm.days.indexOf(d);
      if (i < 0) eForm.days.push(d); else eForm.days.splice(i, 1);
      el.classList.toggle('on');
      break;
    }
    case 'ecarry': {
      eForm.carry = !eForm.carry;
      el.classList.toggle('on', eForm.carry);
      el.textContent = (eForm.carry ? '☑' : '☐') + ' 못 끝내면 다음날로 이월';
      break;
    }
    case 'esave': saveEditedTask(); break;
    case 'deltask': {
      const t = task();
      if (!t || !confirm('이 지시를 중단할까요? 지난 기록은 유지됩니다.')) return;
      t.deleted = true; t.updatedAt = now();
      save(); queueSync(); closeModal(); render(); toast('중단했습니다');
      break;
    }

    /* AI 가져오기 */
    case 'aiopen': aiModal(); break;
    case 'aisample': $('#aiText').value = AI_SAMPLE; break;
    case 'aiapply': applyAssignments($('#aiText').value || ''); break;
    case 'padd': { const p = pendingAdd; pendingAdd = null; applyAssignments(p, true); go('today'); break; }
    case 'pcancel': pendingAdd = null; render(); toast('취소했습니다'); break;

    /* 기기 대장 */
    case 'assetopen': deviceOpen = (deviceOpen === id ? '' : (id || '')); render(); break;
    case 'assetfilter': deviceFilter = id || 'all'; render(); break;
    case 'assetdetail': deviceDetail = !deviceDetail; render(); break;
    case 'assetquick': {
      const sets = AC().quickSet(el.dataset.cond);
      if (!sets) {
        /* 무엇이 문제인지 추측하지 않는다. 펼쳐서 직접 고르게 한다. */
        deviceOpen = id; deviceDetail = true; render();
        toast('무엇이 문제인지 골라 주세요');
        break;
      }
      setAsset(id, Object.assign({}, sets, { checkedAt: now(), checkedBy: 'admin' }));
      render();
      toast(id + ' 정상');
      break;
    }
    case 'assetsave': {
      const cur = getAsset(id) || {};
      const place = assetField(cur, 'place');
      const model = assetField(cur, 'model');
      setAsset(id, {
        model: model,
        serial: assetField(cur, 'serial'),
        os: assetField(cur, 'os'),
        chrome: assetField(cur, 'chrome'),
        battery: assetField(cur, 'battery'),
        charge: assetField(cur, 'charge'),
        screen: assetField(cur, 'screen'),
        locked: assetField(cur, 'locked'),
        place: place,
        tier: AC().tierOfPlace(place),
        holder: assetField(cur, 'holder'),
        spot: assetField(cur, 'spot'),
        note: assetField(cur, 'note'),
        pii: assetField(cur, 'pii'),
        kind: AC().kindOfModel(model),
        checkedAt: now(),
        checkedBy: 'admin'
      });
      deviceOpen = '';
      render();
      toast(id + ' 저장했습니다');
      break;
    }
    case 'assetdel': {
      if (!confirm(id + ' 을(를) 대장에서 지울까요?')) return;
      setAsset(id, { deleted: true });
      deviceOpen = '';
      render();
      toast('지웠습니다');
      break;
    }
    case 'assetbulk': {
      const out = AC().parseBulk($('#as-bulk').value, allAssets());
      out.added.forEach(a => setAsset(a.id, a));
      if (out.errors.length) {
        alert('넣지 못한 줄이 있습니다\n\n' +
          out.errors.map(e => e.line + '행: ' + e.why + '\n  ' + e.text).join('\n'));
      }
      if (out.added.length) { deviceOpen = ''; toast(out.added.length + '대를 넣었습니다'); }
      render();
      break;
    }
    case 'assetaudit': {
      const name = askAssetStaff('실사를 맡길 선생님 이름');
      if (!name) return;
      const list = AC().buildAuditAssignments(allAssets(), { staff: name });
      if (!list.length) return toast('실사할 기기가 없습니다');
      applyAssignments(list, false);
      break;
    }
    case 'assetrepair': {
      const a = AC().buildRepairAssignment(allAssets(), { staff: askAssetStaff('조치를 맡길 선생님 이름') });
      if (!a) return toast('이상으로 표시된 기기가 없습니다');
      applyAssignments([a], false);
      break;
    }
    case 'assetpii': {
      const a = AC().buildPiiCheckAssignment(allAssets(), { staff: askAssetStaff('점검을 맡길 선생님 이름') });
      if (!a) return toast('개인정보 취급으로 표시된 기기가 없습니다');
      applyAssignments([a], false);
      break;
    }

    /* 지시서 작성 */
    case 'wstaff': {
      const i = wForm.staff.indexOf(id);
      if (i < 0) wForm.staff.push(id); else wForm.staff.splice(i, 1);
      el.classList.toggle('on');
      break;
    }
    case 'wrepeat': {
      wForm.repeat = el.dataset.v;
      document.querySelectorAll('#wRepeat .chip').forEach(c => c.classList.toggle('on', c.dataset.v === wForm.repeat));
      $('#wDaysWrap').style.display = wForm.repeat === 'days' ? '' : 'none';
      $('#wEndWrap').style.display  = wForm.repeat === 'once' ? 'none' : '';
      break;
    }
    case 'wdow': {
      const d = Number(el.dataset.d), i = wForm.days.indexOf(d);
      if (i < 0) wForm.days.push(d); else wForm.days.splice(i, 1);
      el.classList.toggle('on');
      break;
    }
    case 'wcarry': { wForm.carry = !wForm.carry; render(); break; }
    case 'wadd': {
      const title = ($('#wTitle').value || '').trim();
      if (!wForm.staff.length) return toast('받는 직원을 선택해 주세요');
      if (!title) return toast('업무 내용을 입력해 주세요');
      if (wForm.repeat === 'days' && !wForm.days.length) return toast('요일을 선택해 주세요');
      wForm.start = $('#wStart').value || today();
      wForm.end = (wForm.repeat === 'once' ? '' : ($('#wEnd').value || ''));
      draft.push({
        title: title,
        detail: ($('#wDetail').value || '').trim(),
        guide: ($('#wGuide').value || '').trim(),
        steps: ($('#wSteps').value || '').split('\n').map(x => x.trim()).filter(Boolean)
                 .map(l => ({ id: uid(), label: l })),
        target: Number($('#wTarget').value) || 0,
        unit: ($('#wUnit').value || '건').trim(),
        time: $('#wTime').value || '',
        priority: $('#wPri').value,
        repeat: wForm.repeat,
        days: wForm.days.slice().sort(),
        start: wForm.start,
        end: wForm.end,
        carry: wForm.carry,
        staffIds: wForm.staff.slice(),
        names: wForm.staff.map(x => (staffById(x) || {}).name).filter(Boolean)
      });
      render();
      toast('목록에 담았습니다 (' + draft.length + '건)');
      break;
    }
    case 'wdel': draft.splice(Number(el.dataset.i), 1); render(); break;
    case 'wclear': draft = []; render(); break;
    case 'wpublish': {
      if (!session.isAdmin) break;
      if (!draft.length) return;
      const gid = uid(), touched = new Set();
      draft.forEach(d => d.staffIds.forEach(sid => {
        state.tasks.push({
          id: uid(), groupId: gid, staffId: sid,
          title: d.title, detail: d.detail, guide: d.guide,
          steps: (d.steps || []).map(s => ({ id: uid(), label: s.label })),
          target: d.target, unit: d.unit,
          time: d.time, priority: d.priority,
          repeat: d.repeat, days: d.days, start: d.start, end: d.end, carry: d.carry,
          origin: actor(),
          createdAt: now(), updatedAt: now(), deleted: false
        });
        touched.add(sid);
      }));
      const n = draft.length;
      draft = [];
      save(); queueSync(); render();
      toast(n + '건 발행 완료');
      const first = [...touched][0];
      if (first) setTimeout(() => {
        issueLinkCode(first)
          .then(() => showText('카카오톡 지시서 문구', orderText(first, today())))
          .catch(e => toast('링크를 만들지 못했습니다 — ' + e.message));
      }, 400);
      break;
    }

    /* 설정 */
    case 'savecfg': {
      state.settings.syncSecret = ($('#cfgSecret').value || '').trim();
      save(); render(); toast('저장했습니다');
      if (state.settings.syncSecret) { sync.loud = true; sync.run(); }
      break;
    }
    case 'syncnow': sync.loud = true; sync.run(); toast('동기화 중…'); break;
    case 'export': {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'wb-업무지시서-' + today() + '.json';
      a.click(); URL.revokeObjectURL(a.href);
      break;
    }
    case 'import': {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = 'application/json';
      inp.onchange = () => {
        const f = inp.files[0]; if (!f) return;
        const r = new FileReader();
        r.onload = () => {
          try {
            const p = JSON.parse(r.result);
            if (!p || !Array.isArray(p.staff)) throw new Error('형식 오류');
            if (!confirm('현재 데이터를 덮어씁니다. 계속할까요?')) return;
            state = Object.assign(blankState(), p);
            save(); render(); toast('불러왔습니다');
          } catch (e) { toast('파일을 읽을 수 없습니다'); }
        };
        r.readAsText(f);
      };
      inp.click();
      break;
    }
    case 'closemodal': closeModal(); break;
  }
});

function captureTransportDraftFromEvent(target) {
  if (route !== 'transport' || !session.isAdmin || !target) return false;
  const field = target.matches && target.matches('[data-tc-base-address], [data-tc-name], [data-tc-plate], [data-tc-capacity], [data-tc-route-name], [data-tc-direction], [data-tc-route-time], [data-tc-vehicle-id], [data-tc-driver-id], [data-tc-active], [data-tc-day], [data-tc-dwell], [data-tc-stop-name], [data-tc-stop-address], [data-tc-stop-time], [data-tc-students]');
  if (!field) return false;
  transportConfigDraft = captureTransportConfig();
  transportConfigDirty = true;
  const routeRow = target.closest('[data-tc-route]');
  if (routeRow) transportOpenRouteId = String(routeRow.dataset.id || '');
  return true;
}

/* 메모 · 수량 직접 입력 */
let inputTimer = null;
document.addEventListener('input', ev => {
  if (captureTransportDraftFromEvent(ev.target)) return;
  const bookIssueSearch = ev.target.closest('[data-book-issue-search]');
  if (bookIssueSearch) {
    applyBookIssueSearch(bookIssueSearch.value);
    return;
  }
  const onboardingSearch = ev.target.closest('[data-onboarding-search]');
  if (onboardingSearch) {
    applyOnboardingSearch(onboardingSearch.value);
    return;
  }
  const bookSearch = ev.target.closest('[data-book-search-input]');
  if (bookSearch) {
    applyBookSearch(bookSearch.value);
    return;
  }
  const scheduleSearch = ev.target.closest('[data-schedule-search]');
  if (scheduleSearch) {
    applyScheduleSearch(scheduleSearch.value);
    return;
  }
  const cntEl = ev.target.closest('[data-act="cntset"]');
  if (cntEl) {
    clearTimeout(inputTimer);
    inputTimer = setTimeout(() => {
      const t = state.tasks.find(x => x.id === cntEl.dataset.id);
      const d = cntEl.dataset.date || cursor;
      setCheck(cntEl.dataset.id, d, { count: Math.max(0, Number(cntEl.value) || 0), blocked: false });
      if (t) syncAuto(t, d);
      renderAfterSync();
    }, 600);
  }
});

/* 수업 등록 폼은 시간대 버튼으로 다시 그려져도 입력값을 유지한다. */
document.addEventListener('input', ev => {
  const existingLessonSearch = ev.target.closest('[data-lesson-existing-search]');
  if (existingLessonSearch) {
    lessonExistingSearchQuery = existingLessonSearch.value;
    const host = existingLessonSearch.closest('.lesson-existing-change');
    const current = host && host.querySelector('[data-lesson-existing-results]');
    if (current) {
      const holder = document.createElement('div');
      holder.innerHTML = lessonExistingChangeResultsHtml(lessonExistingSearchQuery);
      const next = holder.firstElementChild;
      if (next) current.replaceWith(next);
    }
    return;
  }
  const assignmentSearch = ev.target.closest('[data-assignment-search]');
  if (assignmentSearch) {
    const draft = currentLessonAssignmentDraft();
    draft.search = assignmentSearch.value;
    const query = String(assignmentSearch.value || '').normalize('NFKC').replace(/\s+/g, '').toLocaleLowerCase('ko');
    const select = document.querySelector('[data-assignment-request-student]');
    if (select) Array.from(select.options).forEach(option => {
      if (!option.value) return;
      const source = String(option.dataset.assignmentCandidateSearch || '').normalize('NFKC').replace(/\s+/g, '').toLocaleLowerCase('ko');
      option.hidden = !!query && !source.includes(query);
    });
    return;
  }
  const assignmentStart = ev.target.closest('[data-assignment-start]');
  if (assignmentStart) { currentLessonAssignmentDraft().startDate = assignmentStart.value; return; }
  const assignmentReason = ev.target.closest('[data-assignment-reason]');
  if (assignmentReason) { currentLessonAssignmentDraft().reason = assignmentReason.value; return; }
  const assignmentMissing = ev.target.closest('[data-assignment-missing]');
  if (assignmentMissing) {
    currentLessonAssignmentDraft()[assignmentMissing.dataset.assignmentMissing] = assignmentMissing.value;
    return;
  }
  const assignmentSlot = ev.target.closest('[data-assignment-slot]');
  if (assignmentSlot) {
    const slot = currentLessonAssignmentDraft().scheduleSlots[Number(assignmentSlot.dataset.i)];
    if (slot) slot[assignmentSlot.dataset.assignmentSlot] = assignmentSlot.value;
    return;
  }
  const lessonBulkSearch = ev.target.closest('[data-lesson-bulk-search]');
  if (lessonBulkSearch) {
    const draft = currentLessonDraft();
    draft.bulkStudentSearch = lessonBulkSearch.value;
    const query = lessonExistingSearchKey(lessonBulkSearch.value);
    document.querySelectorAll('[data-lesson-bulk-student-row]').forEach(row => {
      row.hidden = !!query && !String(row.dataset.search || '').includes(query);
    });
    persistLessonDraft();
    return;
  }
  if (syncRenderedLessonScheduleField(ev.target)) {
    persistLessonDraft();
    return;
  }
  const rosterField = ev.target.closest('[data-lesson-roster-field]');
  if (rosterField) {
    const info = currentLessonRosterDraft();
    if (info) info[rosterField.dataset.lessonRosterField] = rosterField.value;
    lessonPreviewRosterStudent = null;
    return;
  }
  const field = ev.target.closest('[data-lesson-field]');
  if (field) {
    currentLessonDraft()[field.dataset.lessonField] = field.value;
    lessonPreviewPayload = null; lessonPreviewBatchPayload = []; lessonPreviewRosterStudents = [];
    persistLessonDraft();
    return;
  }
});

document.addEventListener('change', async ev => {
  if (captureTransportDraftFromEvent(ev.target)) return;
  if (syncRenderedLessonScheduleField(ev.target)) {
    persistLessonDraft();
    return;
  }
  const sessionAbsence = ev.target.closest('[data-session-pack-absence]');
  if (sessionAbsence) {
    const taskId = String(sessionAbsence.dataset.id || '');
    const date = String(sessionAbsence.dataset.date || '');
    const task = state.tasks.find(row => String(row.id || '') === taskId);
    const attendanceState = task && sessionPackAttendanceState(task, date);
    if (!task || !attendanceState || attendanceState.locked) {
      toast('회차제 출결은 당일 23:50에 마감되어 변경할 수 없습니다');
      render();
      return;
    }
    const absenceType = String(sessionAbsence.value || '');
    if (absenceType && !SESSION_PACK_ABSENCE_OPTIONS.some(item => item[0] === absenceType)) return;
    setCheck(taskId, date, { absenceType });
    settleSync().catch(() => toast('결석 차감 유형은 이 기기에 저장됐지만 서버 동기화를 확인해 주세요'));
    toast(absenceType ? '결석 차감 유형을 저장했습니다' : '결석 차감 유형 선택을 지웠습니다');
    return;
  }
  const assignmentStudent = ev.target.closest('[data-assignment-request-student]');
  if (assignmentStudent) {
    const draft = currentLessonAssignmentDraft();
    const student = lessonAssignmentCandidates.find(item => String(item.id) === String(assignmentStudent.value) && !item.assigned);
    draft.studentId = student ? student.id : '';
    draft.subjects = student ? (student.subjects || []).slice() : [];
    if (student) draft.missingOpen = false;
    render(); return;
  }
  const assignmentSubject = ev.target.closest('[data-assignment-subject]');
  if (assignmentSubject) {
    currentLessonAssignmentDraft().subjects = Array.from(document.querySelectorAll('[data-assignment-subject]:checked')).map(input => String(input.value));
    return;
  }
  const lessonBulkStudent = ev.target.closest('[data-lesson-bulk-student]');
  if (lessonBulkStudent) {
    if (!session.isAdmin || currentLessonDraft().registrationMode !== 'students') return;
    const draft = currentLessonDraft();
    const selectedIds = new Set((draft.bulkStudentIds || []).map(String));
    const hadSelection = selectedIds.size > 0;
    const studentId = String(lessonBulkStudent.value || '');
    if (lessonBulkStudent.checked && !selectedIds.has(studentId) && selectedIds.size >= 50) {
      lessonBulkStudent.checked = false;
      toast('한 번에 학생은 최대 50명까지 선택할 수 있습니다');
    } else if (lessonBulkStudent.checked) selectedIds.add(studentId);
    else selectedIds.delete(studentId);
    draft.bulkStudentIds = Array.from(selectedIds);
    lessonPreviewBatchPayload = []; lessonPreviewRosterStudents = [];
    persistLessonDraft(); syncLessonBulkSelectionUi();
    if (hadSelection !== (selectedIds.size > 0) && ROSTER_SUBJECT_OPTIONS.includes(String(draft.subject || ''))) refreshLessonDirectEntry(true);
    return;
  }
  const lessonBatchSubject = ev.target.closest('[data-lesson-batch-subject]');
  if (lessonBatchSubject) {
    const entry = lessonBatchEntries()[Number(lessonBatchSubject.dataset.i)];
    if (!entry) return;
    if (String(entry.subject || '') !== String(lessonBatchSubject.value)) entry.staffId = '';
    entry.subject = String(lessonBatchSubject.value);
    entry.className = '';
    lessonPreviewRosterStudent = null;
    persistLessonDraft(); refreshLessonDirectEntry(true);
    return;
  }
  const lessonBatchField = ev.target.closest('[data-lesson-batch-field]');
  if (lessonBatchField) {
    const entry = lessonBatchEntries()[Number(lessonBatchField.dataset.i)];
    if (entry) {
      entry[lessonBatchField.dataset.lessonBatchField] = lessonBatchField.value;
      lessonPreviewRosterStudent = null;
      persistLessonDraft();
    }
    return;
  }
  const lessonSubject = ev.target.closest('[data-lesson-subject]');
  if (lessonSubject) {
    const draft = currentLessonDraft();
    if (String(draft.subject || '') !== String(lessonSubject.value) && session.isAdmin) draft.staffId = '';
    draft.subject = String(lessonSubject.value);
    draft.className = '';
    lessonPreviewRosterStudent = null;
    lessonPreviewRosterStudents = [];
    persistLessonDraft();
    refreshLessonDirectEntry(true);
    return;
  }
  const lessonStudent = ev.target.closest('[data-lesson-student]');
  if (lessonStudent) {
    if (!session.isAdmin && !(session.isStaffLink && !session.isAdmin)) return;
    const student = (session.isStaffLink && !session.isAdmin ? assignedLessonStudents() : lessonFormStudents())
      .find(item => String(item.id) === String(lessonStudent.value));
    const draft = currentLessonDraft();
    const studentChanged = String(draft.studentId || '') !== String(student && student.id || '');
    draft.studentId = student ? student.id : '';
    draft.studentName = student ? student.name : '';
    draft.grade = student ? student.grade : '';
    setLessonRosterDraft(student || null);
    if (studentChanged) {
      draft.subject = '';
      draft.className = '';
      if (session.isAdmin) {
        draft.staffId = '';
        if (!draft._sourceTaskId) draft.lessonEntries = [newLessonBatchEntry()];
      }
    }
    lessonPreviewBatchPayload = [];
    lessonPreviewRosterStudents = [];
    persistLessonDraft(); refreshLessonDirectEntry(true);
    return;
  }
  const onboardingDate = ev.target.closest('[data-onboarding-date]');
  if (onboardingDate) {
    if (!session.isAdmin) return;
    const studentId = String(onboardingDate.dataset.id || '');
    const student = rosterDb && (rosterDb.students || []).find(row => String(row.id) === studentId);
    if (student && student.end && student.end <= today().slice(0, 7)) {
      toast('재원이 종료된 학생의 기록은 수정할 수 없습니다'); render(); return;
    }
    if (!onboardingRecord(studentId) || !validOnboardingFirstDate(student, onboardingDate.value)) {
      toast('첫 등원일은 명단 시작월 이후의 재원 기간으로 입력해 주세요'); render(); return;
    }
    patchOnboarding(studentId, 'date', { firstClassDate: onboardingDate.value }, '첫 등원일을 수정했습니다');
    return;
  }
  const acaflowFile = ev.target.closest('[data-acaflow-file]');
  if (acaflowFile) {
    if (!session.isAdmin || session.isStaffLink) return;
    const file = acaflowFile.files && acaflowFile.files[0];
    const name = acaflowSpreadsheetName(file);
    if (!name) {
      acaflowFile.value = '';
      toast('아카플로우 .xls 또는 CSV(.csv) 파일만 선택해 주세요');
    } else {
      await prepareAcaflowContacts(file);
    }
    return;
  }
  const acaflowRow = ev.target.closest('[data-acaflow-row]');
  if (acaflowRow) {
    const key = String(acaflowRow.dataset.acaflowRow || '');
    if (acaflowRow.checked) acaflowImportSelection.add(key); else acaflowImportSelection.delete(key);
    render(); return;
  }
  const field = ev.target.closest('[data-lesson-field]');
  if (field) {
    currentLessonDraft()[field.dataset.lessonField] = field.value;
    if (field.dataset.lessonField === 'staffId' && lessonRosterDraft && field.value && !lessonRosterDraft.teacherIds.includes(field.value)) {
      lessonRosterDraft.teacherIds.push(field.value);
    }
    lessonPreviewRosterStudent = null;
    persistLessonDraft();
  }
});

document.addEventListener('toggle', ev => {
  if (ev.target && ev.target.matches && ev.target.matches('.lesson-direct-entry')) {
    const wasOpen = lessonDirectEntryOpen;
    lessonDirectEntryOpen = ev.target.open;
    if (session.isAdmin && ev.target.open && !wasOpen && !currentLessonDraft()._sourceTaskId) {
      resetLessonRegistrationDraft();
      lessonDirectEntryOpen = true;
      refreshLessonDirectEntry(true);
    }
  }
  if (ev.target && ev.target.matches && ev.target.matches('.lesson-existing-change')) {
    lessonExistingChangeOpen = ev.target.open;
  }
}, true);

document.addEventListener('change', ev => {
  const target = ev.target.closest('[data-admin-directive-target]');
  if (!target) return;
  const disabled = target.value === 'all';
  document.querySelectorAll('[data-admin-directive-staff]').forEach(input => { input.disabled = disabled; });
});

/* 출퇴근 시각 직접 수정 — time input은 값이 확정될 때(change) 저장한다 */
document.addEventListener('change', ev => {
  const el = ev.target.closest('[data-act="attedit-in"],[data-act="attedit-out"]');
  if (!el) return;
  const staffId = el.dataset.staff, date = el.dataset.date;
  if (!canEditAtt(staffId, date)) { toast('이 날짜는 수정할 수 없습니다 — 원장님께 요청해 주세요'); render(); return; }
  const field = el.dataset.act === 'attedit-in' ? 'at' : 'out';
  const ms = el.value ? msFromDateTime(date, el.value) : null;
  const cur = attOf(staffId, date);
  const newAt = field === 'at' ? ms : (cur ? cur.at : null);
  const newOut = field === 'out' ? ms : (cur ? cur.out : null);
  setCheck(attKey(staffId), date, { [field]: ms, done: !!(newAt || newOut) });
  toast('저장했습니다');
});

/* 엔터 제출 */
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && !$('#modalHost').hidden) { closeModal(); return; }
  if (ev.key !== 'Enter') return;
  const t = ev.target;
  if (t.id === 'pin')   document.querySelector('[data-act="setpin"],[data-act="login"]')?.click();
  if (t.id === 'sName') document.querySelector('[data-act="addstaff"]')?.click();
  if (t.matches('[data-transport-driver-name]')) document.querySelector('[data-act="transportdriveradd"]')?.click();
  if (t.id === 'qAdd')  document.querySelector('[data-act="qadd"]')?.click();
});

/* 복귀 시 최신화 */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (!cursorPinned && cursor !== today()) { cursor = today(); render(); }
  const auth = sync.auth();
  if (session.isStaffLink && hasVerifiedPersonAuth() && auth && auth.mode === 'person') loadStudentSelfChecks(today(), true);
  if (auth && (session.isAdmin || session.isStaffLink)) {
    loadAdminDirectives(true, true);
    loadStudentChanges(true);
  }
  sync.run();
});

/* ══════════════════════════════════════════════════════
   11. 시작
   ══════════════════════════════════════════════════════ */
load();
absorbLinkParams();
const h = location.hash.replace('#/', '');
if (h && !/(^|&)c=/.test(h)) route = h;
if (route === 'lesson' && session.isAdmin) {
  resetLessonRegistrationDraft();
  lessonDirectEntryOpen = false;
  lessonExistingChangeOpen = false;
  lessonExistingSearchQuery = '';
}
render();

let syncLoopStarted = false;
function ensureSyncLoopStarted() {
  if (syncLoopStarted || !sync.enabled()) return;
  syncLoopStarted = true;
  setInterval(() => sync.run(), 45000);
}

async function startSyncSession() {
  // 1회용 코드는 자동 교환하지 않는다. 카카오에서는 원본 링크를 보존하고,
  // 최종 브라우저의 '이 기기에 연결' 버튼에서만 exchange한다.
  if (pendingBootstrapCode) {
    // 새 연결 코드가 있으면 이전 토큰 상태와 무관하게 새 코드 연결 화면을 우선한다.
    // 만료된 기존 토큰이 유효한 새 링크의 연결 버튼을 숨기면 안 된다.
    render();
    return false;
  }
  if (!sync.enabled()) {
    if (session.isStaffLink && hasSensitiveManagerCache('')) resetPersonCache('');
    render();
    return false;
  }
  const verified = await sync.run();
  if (sync.enabled()) ensureSyncLoopStarted();
  if (verified && (session.isAdmin || session.isStaffLink)) {
    loadStudentChanges(false);
    loadAdminDirectives(false, true);
  }
  return verified;
}
startSyncSession();
setInterval(() => {
  if (document.visibilityState === 'visible' && sync.auth() && (session.isAdmin || session.isStaffLink)) {
    loadAdminDirectives(true, true);
  }
}, 15000);

/* ── 새 버전 감지 ──
 * 단일 HTML이라 브라우저가 예전 파일을 계속 물고 있는 일이 잦다.
 * version.json을 주기적으로 확인해 새 버전이 올라오면 알려주고 한 번에 새로고침한다. */
const APP_VER = '2026-08-27.6';
const VERSION_RELOAD_KEY = 'wb_task_version_reload';
function reloadVersion(version) {
  const next = new URL(location.href);
  next.searchParams.set('v', version);
  location.replace(next.pathname + next.search + next.hash);
}
function checkVersion() {
  fetch('../version.json?t=' + Date.now(), { cache: 'no-store' })
    .then(r => r.ok ? r.json() : null)
    .then(d => {
      if (!d || !d.v) return;
      if (d.v === APP_VER) { sessionStorage.removeItem(VERSION_RELOAD_KEY); return; }
      if (sessionStorage.getItem(VERSION_RELOAD_KEY) !== d.v) {
        sessionStorage.setItem(VERSION_RELOAD_KEY, d.v);
        reloadVersion(d.v);
        return;
      }
      if (document.getElementById('newver')) return;
      const el = document.createElement('div');
      el.className = 'newver'; el.id = 'newver';
      el.innerHTML = '<span>\uc0c8 \ubc84\uc804\uc774 \uc788\uc2b5\ub2c8\ub2e4 \u2014 \uc0c8\ub85c\uace0\uce68\ud558\uba74 \ubc14\ub85c \uc801\uc6a9\ub429\ub2c8\ub2e4</span>' +
        '<button type="button" id="verReload">\uc0c8\ub85c\uace0\uce68</button>';
      document.body.appendChild(el);
      document.getElementById('verReload').onclick = () => reloadVersion(d.v);
    })
    .catch(() => {});
}
checkVersion();
setInterval(checkVersion, 10 * 60 * 1000);
setInterval(() => {
  if (route === 'schedule' && scheduleView === 'day' && session.isAdmin && cursor === seoulNowParts().date) render();
}, 60 * 1000);

</script>
