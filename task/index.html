function lessonBriefingStudentPayload() {
  const editor = lessonBriefingEditor;
  if (!editor) throw new Error('수정할 학생 정보를 다시 열어 주세요');
  const value = key => String(((document.querySelector('[data-lesson-briefing-student="' + key + '"]') || {}).value) || '').normalize('NFKC').trim();
  const selectedSubjects = Array.from(document.querySelectorAll('[data-lesson-briefing-subject]:checked')).map(input => String(input.value));
  const selectedTeachers = Array.from(document.querySelectorAll('[data-lesson-briefing-teacher]:checked')).map(input => String(input.value));
  const preserveOrder = (previous, selected) => {
    const before = (previous || []).map(String);
    return before.length === selected.length && before.every(value => selected.includes(value)) ? before : selected;
  };
  const subjects = preserveOrder(rosterStudentSubjects(editor.student), selectedSubjects);
  const teacherIds = preserveOrder(editor.student.teacherIds || [], selectedTeachers);
  const student = {
    id: editor.student.id, name: value('name'), school: value('school'), grade: value('grade'),
    phoneSelf: value('phoneSelf'), phoneFather: value('phoneFather'), phoneMother: value('phoneMother'),
    registrationDate: value('registrationDate'), firstClassDate: value('firstClassDate'),
    teacher: teacherIds.map(id => (staffById(id) || {}).name).filter(Boolean).join('·'),
    subject: subjects.join('·'), subjects: subjects, teacherIds: teacherIds,
    start: value('start'), end: String(editor.student.end || ''), reason: String(editor.student.reason || ''),
    memo: value('memo')
  };
  if (editor.student.entryType) student.entryType = editor.student.entryType;
  if (!student.name || !student.grade || !student.start) throw new Error('이름·학년·명단 기준 시작월을 입력해 주세요');
  if (!student.teacherIds.includes(String(editor.task.staffId || ''))) {
    throw new Error('현재 수업 담당 선생님을 학생 공통 담당에서 유지해 주세요');
  }
  if (ROSTER_SUBJECT_OPTIONS.includes(String(editor.task.subject || '')) && !student.subjects.includes(String(editor.task.subject))) {
    throw new Error('현재 수업 과목을 학생 등록과목에서 유지해 주세요');
  }
  return student;
}

function lessonBriefingLessonPayload(student) {
  const editor = lessonBriefingEditor;
  const core = window.WBLessonFormCore;
  if (!editor || !core) throw new Error('수업 등록 모듈을 다시 불러와 주세요');
  const instruction = key => String(((document.querySelector('[data-lesson-briefing-instruction="' + key + '"]') || {}).value) || '').normalize('NFKC').trim() || '없음';
  const draft = lessonDraftFromTask(editor.task);
  draft.studentId = student.id;
  draft.studentName = student.name;
  draft.grade = student.grade;
  draft.lessonRole = draft.className || draft.subject;
  for (const key of ['materials', 'onlineProgram', 'homework', 'studentTraits', 'goal', 'parentRequest', 'adminRequest']) draft[key] = instruction(key);
  const validation = core.validateLessonInput(draft);
  if (!validation.valid) throw new Error(validation.errors[0].message);
  const taskBody = core.buildLessonTaskBody(draft, { staffId: editor.task.staffId, start: draft.start || today() });
  return lessonPreviewPayloadFromTask(taskBody, validation);
}

function lessonBriefingStudentChanged(current, next) {
  return ['name', 'school', 'grade', 'phoneSelf', 'phoneFather', 'phoneMother', 'registrationDate', 'firstClassDate',
    'teacher', 'subject', 'subjects', 'teacherIds', 'start', 'end', 'reason', 'memo', 'entryType']
    .some(key => JSON.stringify(current[key] || '') !== JSON.stringify(next[key] || ''));
}

async function saveLessonBriefingEditor(button) {
  if (!session.isAdmin || !lessonBriefingEditor || lessonBriefingSaving || !rosterDb) return;
  let student, lesson;
  try {
    student = lessonBriefingStudentPayload();
    lesson = lessonBriefingLessonPayload(student);
  } catch (error) {
    return toast(error.message || '입력 내용을 확인해 주세요');
  }
  const auth = sync.auth();
  if (!auth) return toast('관리자 인증을 확인해 주세요');
  const editor = lessonBriefingEditor;
  const currentTask = state.tasks.find(row => row.id === editor.taskId && !row.deleted);
  if (!currentTask || String(currentTask.studentId || '') !== editor.studentId) return toast('수업과 학생 연결을 다시 확인해 주세요');
  lessonBriefingSaving = true;
  if (button) { button.disabled = true; button.textContent = '저장 중…'; }
  let rosterSaved = false;
  try {
    if (lessonBriefingStudentChanged(editor.student, student)) {
      const rosterResult = await sync.post('/roster', {
        app: SYNC_APP, auth: auth, action: 'student_update', expectedUpdatedAt: editor.expectedRosterUpdatedAt,
        student: student
      });
      const index = rosterDb.students.findIndex(row => String(row.id) === editor.studentId);
      if (index >= 0) rosterDb.students[index] = Object.assign({}, student);
      rosterDb.updatedAt = Number(rosterResult.updatedAt) || rosterDb.updatedAt;
      editor.expectedRosterUpdatedAt = Number(rosterDb.updatedAt);
      editor.student = Object.assign({}, student);
      rosterSaved = true;
    }
    const result = await sync.post('/lesson-create', {
      app: SYNC_APP, auth: auth, staffId: editor.task.staffId,
      sourceTaskId: editor.taskId, expectedUpdatedAt: editor.expectedTaskUpdatedAt,
      lesson: lesson
    });
    applyCreatedLesson(result.task);
    publicationReadinessLoaded = false;
    publicationReadinessRows = [];
    if (rosterSaved || result.updated) { studentChangeLoaded = false; loadStudentChanges(true); }
    lessonBriefingEditor = null;
    closeModal();
    render();
    toast(result.idempotent || result.duplicate ? '변경 사항이 없어 기존 정보를 유지했습니다' : '학생정보와 업무지시를 저장했습니다');
  } catch (error) {
    toast((rosterSaved ? '학생 공통 정보는 저장됐습니다 · ' : '') + '업무지시 저장 실패 — ' + (error.message || error));
    if (button) { button.disabled = false; button.textContent = '학생정보 · 업무지시 저장'; }
  } finally {
    lessonBriefingSaving = false;
  }
}

/* 보호자 공개 내용은 내부 수업 메모와 완전히 분리해 서버의 수업일 정본에 저장한다. */
function guardianPublicationKey(taskId, lessonDate) {
  return String(taskId || '') + '|' + String(lessonDate || '');
}

function canEditGuardianPublication(task, lessonDate) {
  if (!task || lessonDate !== today() || !session.isStaffLink || !hasVerifiedPersonAuth() ||
      task.staffId !== session.staffId || !isLesson(task) ||
      !/^[A-Za-z0-9_-]{1,128}$/.test(String(task.studentId || '')) ||
      !guardianContactEnabledFor(task.studentId) || !rosterDb) return false;
  return assignedLessonStudents().some(student => String(student.id) === String(task.studentId));
}

function prepareGuardianPublicationPolicy(lessonDate) {
  const date = String(lessonDate || '');
  if (date !== today() || !session.isStaffLink || !hasVerifiedPersonAuth() ||
      guardianPublicationLoadedDates.has(date) || guardianPublicationLoadingDates.has(date) ||
      guardianPublicationErrors.has(date)) return;
  setTimeout(() => loadGuardianPublications(date, false), 0);
}

function guardianPublicationAccessHint(task, lessonDate) {
  if (String(lessonDate || '') !== today()) return '숙제·준비물은 해당 수업일이 오늘인 경우에 담당 선생님이 입력할 수 있습니다.';
  if (!task || !/^[A-Za-z0-9_-]{1,128}$/.test(String(task.studentId || ''))) {
    return 'stable studentId가 연결된 수업에서만 숙제·준비물을 입력할 수 있습니다.';
  }
  if (!session.isStaffLink) return '담당 선생님의 개인 인증 화면에서 숙제·준비물을 입력할 수 있습니다.';
  if (!hasVerifiedPersonAuth()) return '개인 인증 확인이 끝나면 숙제·준비물 입력칸이 활성화됩니다.';
  if (String(task.staffId || '') !== String(session.staffId || '')) return '이 수업의 담당 선생님만 숙제·준비물을 입력할 수 있습니다.';
  if (!rosterDb) return '원생 명단을 불러온 뒤 숙제·준비물 입력칸이 활성화됩니다.';
  return '현재 담당 원생 연결을 확인한 뒤 숙제·준비물을 입력할 수 있습니다.';
}

function normalizeGuardianPublication(row) {
  if (!row || !row.taskId || !/^\d{4}-\d{2}-\d{2}$/.test(String(row.lessonDate || ''))) return null;
  return {
    publicationId: String(row.publicationId || ''), taskId: String(row.taskId), lessonDate: String(row.lessonDate),
    status: row.status === 'published' ? 'published' : 'withdrawn',
    publicHomework: String(row.publicHomework || '').slice(0, 500),
    publicReadiness: String(row.publicReadiness || '').slice(0, 500),
    studentVisible: !!row.studentVisible,
    revision: Math.max(0, Number(row.revision) || 0), updatedAt: Number(row.updatedAt) || 0
  };
}

function normalizeStudentSelfCheck(row) {
  const activityId = String(row && row.activityId || ''), taskId = String(row && row.taskId || '');
  const lessonDate = String(row && row.lessonDate || ''), publicationRevision = Number(row && row.publicationRevision);
  const revision = Number(row && row.revision), response = String(row && row.response || '');
  const reviewStatus = String(row && row.reviewStatus || ''), finalCompleted = row && row.finalCompleted;
  if (!/^[A-Za-z0-9_-]{8,100}$/.test(activityId) || !taskId || !/^\d{4}-\d{2}-\d{2}$/.test(lessonDate) ||
      !Number.isInteger(publicationRevision) || publicationRevision < 1 || !Number.isInteger(revision) || revision < 0 ||
      !['', 'completed', 'help_needed'].includes(response) || !['', 'pending', 'confirmed'].includes(reviewStatus) ||
      typeof finalCompleted !== 'boolean' || (response === '' && (revision !== 0 || reviewStatus !== '' || finalCompleted)) ||
      (response !== '' && (revision < 1 || !['pending', 'confirmed'].includes(reviewStatus))) ||
      (reviewStatus === 'confirmed' && finalCompleted !== (response === 'completed')) ||
      (reviewStatus !== 'confirmed' && finalCompleted)) return null;
  return {
    activityId: activityId, publicationRevision: publicationRevision, taskId: taskId, lessonDate: lessonDate,
    studentName: String(row.studentName || ''), subject: String(row.subject || ''), className: String(row.className || ''),
    response: response, reviewStatus: reviewStatus, revision: revision,
    updatedAt: Number(row.updatedAt) || 0, confirmedAt: Number(row.confirmedAt) || 0, finalCompleted: finalCompleted
  };
}

async function loadStudentSelfChecks(lessonDate, force) {
  const date = String(lessonDate || '');
  if (!session.isStaffLink || !hasVerifiedPersonAuth() || date !== today() ||
      studentSelfCheckLoadingDates.has(date) || (studentSelfCheckLoadedDates.has(date) && !force) ||
      (studentSelfCheckErrors.has(date) && !force)) return;
  const auth = sync.auth();
  if (!auth || auth.mode !== 'person') return;
  if (force) studentSelfCheckLoadedDates.delete(date);
  studentSelfCheckLoadingDates.add(date); studentSelfCheckErrors.delete(date);
  if (route === 'today') renderAfterSync();
  try {
    const result = await sync.post('/student-portal', {
      app: SYNC_APP, action: 'self_check_list', auth: auth, lessonDate: date
    });
    Array.from(studentSelfChecks.keys()).forEach(key => { if (key.endsWith('|' + date)) studentSelfChecks.delete(key); });
    (result.selfChecks || []).forEach(value => {
      const row = normalizeStudentSelfCheck(value);
      if (row && row.lessonDate === date) studentSelfChecks.set(guardianPublicationKey(row.taskId, date), row);
    });
    studentSelfCheckLoadedDates.add(date);
  } catch (error) {
    if (error && error.personAuthHandled) return;
    studentSelfCheckErrors.set(date, '학생 자기 체크를 불러오지 못했습니다. 다시 시도해 주세요.');
  } finally {
    studentSelfCheckLoadingDates.delete(date);
    if (route === 'today') renderAfterSync();
  }
}

function studentSelfCheckReviewHtml(task, lessonDate, publication) {
  if (!publication || publication.status !== 'published' || !publication.studentVisible || lessonDate !== today() ||
      !session.isStaffLink || !hasVerifiedPersonAuth()) return '';
  const key = guardianPublicationKey(task.id, lessonDate), loading = studentSelfCheckLoadingDates.has(lessonDate);
  const loaded = studentSelfCheckLoadedDates.has(lessonDate), error = studentSelfCheckErrors.get(key) || studentSelfCheckErrors.get(lessonDate) || '';
  if (!loaded && !loading && !error) setTimeout(() => loadStudentSelfChecks(lessonDate, false), 0);
  const refresh = '<button type="button" class="btn btn-sm btn-ghost" data-act="studentselfcheckrefresh" data-date="' + esc(lessonDate) + '">새로고침</button>';
  if (!loaded) return '<div class="student-self-check-review"><div class="student-self-check-review-head"><b>학생 자기 체크</b>' + refresh + '</div>' +
    (error ? '<div class="student-self-check-review-status is-error" role="alert">' + esc(error) + '</div>' :
      '<div class="student-self-check-review-status" role="status">학생 선택을 확인하고 있습니다.</div>') + '</div>';
  const row = studentSelfChecks.get(key);
  if (!row || !row.response) return '<div class="student-self-check-review"><div class="student-self-check-review-head"><b>학생 자기 체크</b>' + refresh + '</div>' +
    '<div class="student-self-check-review-status">학생이 아직 완료 또는 도움 필요를 선택하지 않았습니다.</div></div>';
  const responseLabel = row.response === 'completed' ? '완료' : '도움 필요';
  if (row.reviewStatus === 'confirmed') return '<div class="student-self-check-review"><div class="student-self-check-review-head"><b>학생 자기 체크</b>' + refresh + '</div>' +
    '<div class="student-self-check-review-status"><span class="tag ' + (row.finalCompleted ? 'ok' : 'high') + '">' + responseLabel + '</span> · 선생님 확인 완료' +
    (row.finalCompleted ? ' · 최종 완료' : ' · 도움 요청 확인') + '</div></div>';
  const confirming = studentSelfCheckConfirming.has(row.activityId);
  const actionLabel = row.response === 'completed' ? '최종 완료 확인' : '도움 요청 확인';
  return '<div class="student-self-check-review"><div class="student-self-check-review-head"><b>학생 자기 체크</b>' + refresh + '</div>' +
    '<div class="student-self-check-review-status"><span class="tag ' + (row.response === 'completed' ? 'ok' : 'high') + '">' + responseLabel + '</span> · 선생님 확인 전</div>' +
    '<button type="button" class="btn btn-primary btn-block mt8" data-act="studentselfcheckconfirm" data-id="' + esc(task.id) +
    '" data-date="' + esc(lessonDate) + '"' + (confirming ? ' disabled' : '') + '>' + actionLabel + (confirming ? ' 중…' : '') + '</button></div>';
}

async function confirmStudentSelfCheck(taskId, lessonDate, button) {
  const date = String(lessonDate || ''), task = state.tasks.find(row => row.id === taskId);
  if (!task || date !== today() || !session.isStaffLink || !hasVerifiedPersonAuth() ||
      task.staffId !== session.staffId || !isSessionLessonTask(task)) return toast('오늘 내 담당 수업만 확인할 수 있습니다');
  const key = guardianPublicationKey(taskId, date), row = studentSelfChecks.get(key);
  if (!row || !row.response || row.reviewStatus !== 'pending') return toast('확인할 최신 학생 선택이 없습니다');
  if (studentSelfCheckConfirming.has(row.activityId)) return;
  const auth = sync.auth();
  if (!auth || auth.mode !== 'person') return toast('개인 링크 인증이 필요합니다');
  if (row.response === 'completed' && !confirm('이 선택을 최종 완료로 확인할까요?\n\n같은 공개 내용에서는 학생이 다시 도움 필요로 바꿀 수 없습니다.')) return;
  studentSelfCheckConfirming.add(row.activityId); studentSelfCheckErrors.delete(key);
  if (button) button.disabled = true;
  if (route === 'today') renderAfterSync();
  try {
    await sync.post('/student-portal', {
      app: SYNC_APP, action: 'self_check_confirm', auth: auth,
      activityId: row.activityId, expectedRevision: row.revision
    });
    await loadStudentSelfChecks(date, true);
    toast(row.response === 'completed' ? '학생의 완료 선택을 최종 확인했습니다' : '학생의 도움 요청을 확인했습니다');
  } catch (error) {
    if (error && error.personAuthHandled) return;

  } finally {
    studentSelfCheckConfirming.delete(row.activityId);
    if (route === 'today') renderAfterSync();
  }
}

async function loadGuardianPublications(lessonDate, force) {
  const date = String(lessonDate || '');
  if (!session.isStaffLink || !hasVerifiedPersonAuth() || date !== today() ||
      guardianPublicationLoadingDates.has(date) || (guardianPublicationLoadedDates.has(date) && !force)) return;
  const auth = sync.auth();
  if (!auth) return;
  guardianPublicationLoadingDates.add(date);
  guardianPublicationErrors.delete(date);
  if (route === 'today') renderAfterSync();
  try {
    const result = await sync.post('/parent-portal', {
      app: SYNC_APP, action: 'publication_list', auth: auth, lessonDate: date
    });
    applyGuardianDeliveryStudentIds(result.deliveryEnabledStudentIds);
    Array.from(guardianLessonPublications.keys()).forEach(key => {
      if (key.endsWith('|' + date)) guardianLessonPublications.delete(key);
    });
    (result.publications || []).forEach(value => {
      const row = normalizeGuardianPublication(value);
      if (row && row.lessonDate === date) guardianLessonPublications.set(guardianPublicationKey(row.taskId, date), row);
    });
    guardianPublicationLoadedDates.add(date);
  } catch (error) {
    if (error && error.personAuthHandled) return;
    guardianPublicationErrors.set(date, '보호자 공개 내용을 불러오지 못했습니다. 다시 시도해 주세요.');
  } finally {
    guardianPublicationLoadingDates.delete(date);
    if (route === 'today') renderAfterSync();
  }
}

async function saveGuardianPublication(container, button) {
  if (!container) return toast('공개 입력칸을 다시 확인해 주세요');
  const taskId = String(container.dataset.task || ''), lessonDate = String(container.dataset.date || '');
  const task = state.tasks.find(row => row.id === taskId);
  if (!canEditGuardianPublication(task, lessonDate)) return toast('오늘 내 담당 수업만 보호자에게 공개할 수 있습니다');
  const homework = String((container.querySelector('[data-public-homework]') || {}).value || '').normalize('NFKC').trim();
  const readiness = String((container.querySelector('[data-public-readiness]') || {}).value || '').normalize('NFKC').trim();
  const studentVisible = !!(container.querySelector('[data-student-visible]') || {}).checked;
  if (homework.length > 500 || readiness.length > 500) return toast('숙제와 준비물은 각각 500자까지 입력할 수 있습니다');
  const key = guardianPublicationKey(taskId, lessonDate);
  const current = guardianLessonPublications.get(key) || { status: 'withdrawn', revision: 0 };
  const published = !!(homework || readiness);
  const guardianContactEnabled = guardianContactEnabledFor(task && task.studentId);
  if (!published && current.status === 'published' && !confirm(guardianContactEnabled
    ? '보호자 앱에서 숙제·준비물 공개 내용을 지울까요?'
    : '저장된 숙제·준비물 내용을 지울까요?')) return;
  const auth = sync.auth();
  if (!auth) return toast('개인 링크 인증이 필요합니다');
  guardianPublicationDrafts.set(key, { publicHomework: homework, publicReadiness: readiness, studentVisible: published && studentVisible });
  guardianPublicationErrors.delete(key);
  guardianPublicationSaving.add(key);
  if (button) { button.disabled = true; button.textContent = '숙제 · 준비물 저장 중…'; }
  try {
    const result = await sync.post('/parent-portal', {
      app: SYNC_APP, action: 'publication_set', auth: auth, taskId: taskId, lessonDate: lessonDate,
      publicHomework: homework, publicReadiness: readiness, published: published,
      studentVisible: published && studentVisible,
      expectedRevision: Number(current.revision) || 0
    });
    const saved = normalizeGuardianPublication(result.publication);
    if (!saved || saved.taskId !== taskId || saved.lessonDate !== lessonDate) throw new Error('PUBLICATION_RESPONSE_INVALID');
    guardianLessonPublications.set(key, saved);
    guardianPublicationDrafts.delete(key);
    toast(published
      ? (!guardianContactEnabled
        ? (studentVisible ? '숙제·준비물을 저장하고 학생 앱에 공개했습니다' : '숙제·준비물을 수업 기록에 저장했습니다')
        : (studentVisible ? '보호자·학생 앱에 숙제·준비물을 공개했습니다' : '보호자 앱에 숙제·준비물을 공개했습니다'))
      : '숙제·준비물 내용을 지웠습니다');
  } catch (error) {
    if (error && error.personAuthHandled) return;
    if (error && error.code === 'STALE_REVISION' && error.current) {
      const latest = normalizeGuardianPublication(error.current);
      if (latest) guardianLessonPublications.set(key, latest);
      guardianPublicationDrafts.delete(key);
      guardianPublicationErrors.set(key, '다른 화면에서 먼저 수정했습니다. 최신 내용을 확인해 주세요.');
    } else {
      guardianPublicationErrors.set(key, '저장하지 못했습니다. 입력 내용은 유지했으니 다시 시도해 주세요.');
    }
  } finally {
    guardianPublicationSaving.delete(key);
    if (route === 'today') renderAfterSync();
  }
}

/** 수업 출결 표시용 */
const ATT_LABEL = { P: ['출석', 'ok'], L: ['지각', 'high'], A: ['결석', 'blk'], E: ['조퇴', 'doing'] };

/** 수업 지시서인가 — 제목 접두어로 판별 */
const isLesson = t => /^\[(수업|컨설팅)\]/.test(t.title || '');
/** 수업 지시서 세부 형식 판별 */
const isMakeupLessonTask = t => !!(t && !t.deleted && (t.taskKind === 'lesson_instruction' ||
  t.lessonFormVersion || t.intakeVersion || /^\[수업\]/.test(String(t.title || ''))));
const isSessionLessonTask = t => !!(t && !t.deleted && (t.taskKind === 'lesson_instruction' ||
  t.lessonFormVersion || t.intakeVersion));

/** 수업 지시서 제목에서 학생 이름만 뽑는다: [수업] 이름 (학년) — 과목 */
const studentOf = t => (t.title || '').replace(/^\[[^\]]+\]\s*/, '').split('—')[0].replace(/\([^)]*\)/g, '').trim();

/** 제목 말머리는 데이터 판별용으로 보존하고 화면에서만 감춘다. */
function taskTitlePrefix(t) {
  const matched = String(t && t.title || '').match(/^\[(수업|주문)\]\s*/);
  return matched ? matched[0].trim() : '';
}

function taskTitleWithoutPrefix(t) {
  return String(t && t.title || '').replace(/^\[(수업|주문)\]\s*/, '').trim();
}

/** 학교 이름에서 확실히 확인되는 학교급만 반환한다. */
function schoolLevelLabel(school) {
  const value = String(school || '').normalize('NFKC').replace(/\s+/g, '');
  if (/(초등학교|초등|초교|초)$/.test(value)) return '초';
  if (/(중학교|중등|중교|중)$/.test(value)) return '중';
  if (/(고등학교|고등|고교|고)$/.test(value)) return '고';
  return '';
}

/** 원본 학년은 바꾸지 않고 화면 표시만 초4·중2·고1 형식으로 표준화한다. */
function schoolGradeDisplayLabel(school, grade) {
  const value = String(grade || '').normalize('NFKC').trim();
  if (!value) return '';
  const alreadyQualified = value.match(/^(초|중|고)(?:등)?\s*([1-6])(?:\s*학년)?$/);
  if (alreadyQualified) return alreadyQualified[1] + alreadyQualified[2];
  const numeric = value.match(/^([1-6])(?:\s*학년)?$/);
  if (!numeric) return value;
  const level = schoolLevelLabel(school);
  return level ? level + numeric[1] : value;
}

function taskRosterStudent(t) {
  const stableId = String(t && t.studentId || '');
  const students = rosterDb && Array.isArray(rosterDb.students) ? rosterDb.students : [];
  return stableId ? students.find(student => String(student.id || '') === stableId) || null : null;
}

function taskDisplayTitle(t) {
  const raw = String(t && t.title || '');
  if (!/^\[수업\]\s*/.test(raw)) return taskTitleWithoutPrefix(t);
  let visible = taskTitleWithoutPrefix(t);
  const student = taskRosterStudent(t);
  const grade = schoolGradeDisplayLabel(student && student.school, (student && student.grade) || (t && t.grade));
  if (!grade) return visible;
  const separator = visible.indexOf('—');
  let studentPart = separator >= 0 ? visible.slice(0, separator).trim() : visible;
  const subjectPart = separator >= 0 ? visible.slice(separator).trim() : '';
  studentPart = /\([^)]*\)/.test(studentPart)
    ? studentPart.replace(/\([^)]*\)/, '(' + grade + ')')
    : studentPart + ' (' + grade + ')';
  return [studentPart, subjectPart].filter(Boolean).join(' ');
}

/* ── 인터뷰형 코멘트 생성 ──
 * 선생님은 보기만 고르고, 문장은 문장 은행에서 학생·날짜 시드로 조합한다.

 * 보완점·숙제·다음 시간·마무리·맺음말 — 9개 이상), 조합 가짓수가 수만 가지가 되어

  ['어려운 문제를 포기 안 함', '어려운 문제 앞에서 포기하지 않은 것'],

function seedPick(arr, seedStr, salt) {
  let h = salt * 2654435761 >>> 0;
  const s = String(seedStr);
  for (let i = 0; i < s.length; i++) h = ((h * 31) + s.charCodeAt(i)) >>> 0;
  return arr[h % arr.length];
}
function buildComment(ctx, seedStr) {
  const parts = [];
  const focus = ctx.focus || 'good';
  parts.push(seedPick(FB_BANK[focus], seedStr, 1));
  parts.push(seedPick(FB_MOOD_FOLLOW[focus], seedStr, 20));
  (ctx.plus || []).slice(0, 2).forEach((idx, i) => {
    parts.push(seedPick(FB_BANK.plusPat, seedStr, 2 + i).replace('{x}', FB_PLUS[idx][1]));
    parts.push(seedPick(FB_BANK.plusFollow, seedStr, 22 + i));
  });
  const m = ctx.minus == null ? null : FB_MINUS[ctx.minus];
  if (m && m[1]) {
    parts.push(seedPick(FB_BANK.minusPat, seedStr, 5).replace('{y}', m[1]));
    parts.push(seedPick(FB_BANK.minusFollow, seedStr, 23));
  } else {
    parts.push(seedPick(FB_BANK.closer, seedStr, 6));
  }
  return parts.join(' ');
}

function formalFeedbackSentenceCount() {
  return FB_FORMAL_OPENERS.length + Object.values(FB_FORMAL_FOCUS).reduce((sum, rows) => sum + rows.length, 0) +
    FB_FORMAL_CONNECTORS.length + FB_FORMAL_PRAISE.length + FB_FORMAL_MINUS.length + FB_FORMAL_CLOSINGS.length;
}

function formalizeDirectFeedback(value) {
  const replacements = [
    [/이었어요$/, '이었습니다'], [/였어요$/, '였습니다'], [/이에요$/, '입니다'], [/예요$/, '입니다'],
    [/있었어요$/, '있었습니다'], [/없었어요$/, '없었습니다'], [/있어요$/, '있습니다'], [/없어요$/, '없습니다'],
    [/되었어요$/, '되었습니다'], [/됐어요$/, '되었습니다'], [/돼요$/, '됩니다'],
    [/보였어요$/, '보였습니다'], [/보여요$/, '보입니다'],
    [/어려웠어요$/, '어려웠습니다'], [/어려워요$/, '어렵습니다'], [/쉬웠어요$/, '쉬웠습니다'], [/쉬워요$/, '쉽습니다'],
    [/했어요$/, '했습니다'], [/해요$/, '합니다'], [/었어요$/, '었습니다'], [/았어요$/, '았습니다'],
    [/같아요$/, '같습니다'], [/봐요$/, '봅니다'], [/줘요$/, '줍니다']
  ];
  return String(value || '').split(/[.!?]+\s*|\n+/).map(raw => raw.trim()).filter(Boolean).map(raw => {
    if (/(?:습니다|입니다)$/.test(raw)) return raw + '.';
    for (const pair of replacements) {
      if (pair[0].test(raw)) return raw.replace(pair[0], pair[1]) + '.';
    }
    return '선생님이 직접 기록한 핵심 내용은 “' + raw + '”입니다.';
  }).join(' ');
}

function buildFormalFeedbackComment(ctx, seedStr) {
  if (formalFeedbackSentenceCount() < 100) throw new Error('피드백 격식체 기본 문장은 100개 이상이어야 합니다');
  const focus = ctx && FB_FORMAL_FOCUS[ctx.focus] ? ctx.focus : 'good';
  const parts = [seedPick(FB_FORMAL_OPENERS, seedStr, 101), seedPick(FB_FORMAL_FOCUS[focus], seedStr, 102)];
  const direct = String(ctx && ctx.comment || '').trim();
  if (direct) parts.push(formalizeDirectFeedback(direct));
  parts.push(seedPick(FB_FORMAL_CONNECTORS, seedStr, 103));
  (ctx && ctx.plus || []).slice(0, 2).forEach((index, offset) => {
    if (FB_PLUS[index]) parts.push(seedPick(FB_FORMAL_PRAISE, seedStr, 104 + offset).replace('{x}', FB_PLUS[index][1]));
  });
  const minus = ctx && ctx.minus != null ? FB_MINUS[ctx.minus] : null;
  if (minus && minus[1]) parts.push(seedPick(FB_FORMAL_MINUS, seedStr, 107).replace('{y}', minus[1]));
  parts.push(seedPick(FB_FORMAL_CLOSINGS, seedStr, 108));
  return parts.join(' ');
}

/** 학생이 보는 교재의 "다음 진도"를 실제 교재 DB에서 찾아 한 문장으로 —
 *  지어내지 않고 실제 위치(at) 기준 바로 다음 소단원만 안내한다. 못 찾으면 안전한
 *  대체 문장(FB_NEXT_FALLBACK)을 쓴다 — 어느 쪽이든 없는 진도를 지어내지는 않는다. */
function nextLessonHint(t, seedStr) {
  if (bookDb) {
    const st = (bookDb.students || []).find(s => s.name === studentOf(t));
    const b = st && (bookDb.books || []).find(x => x.id === st.bookId);
    const f = b ? flatSections(b) : [];
    if (f.length) {
      const idx = posOf(b, st.at);
      const nextIdx = idx >= 0 ? idx + 1 : 0;
      if (nextIdx < f.length) {
        return seedPick(FB_NEXT_LEAD, seedStr, 40) + f[nextIdx].sec + seedPick(FB_NEXT_TAIL, seedStr, 41);
      }
    }
  }
  return seedPick(FB_NEXT_FALLBACK, seedStr, 42);
}

/** 학부모 피드백 문구 — 그날의 체크·메모에서 조립한다.
 *  메모 규칙: '+' 잘한 점 / '-' 보완점 / '숙제 ○○' 숙제 / 그 외는 코멘트.
 *  인사말·도입·진행 서술·숙제·다음 진도·마무리·맺음말까지 슬롯을 잘게 쪼개 각각
 *  따로 시드를 먹인다 — 재료(체크한 단계·메모·다음 진도)는 전부 실제 데이터이고,
 *  없는 장면이나 대사는 지어내지 않는다. 점수 비교·진단성 표현이 들어갈 자리도 없다. */
function feedbackText(t, date, genComment) {
  const c = getCheck(t.id, date);
  const student = studentOf(t);
  const steps = taskSteps(t, c);
  const doneSteps = steps.filter(s => c && c.steps && c.steps[s.id]).map(s => s.label);
  const seed = t.id + '|' + date;
  // 그날 편지 전체를 감싸는 말투 결 — 내용과 무관하게 학생·날짜 시드로만 정해진다
  const mood = seedPick(FB_MOOD_KEYS, seed, 99);

  const plus = [], minus = [], hw = [], etc = [];
  const storedLessonMemo = c && c.lessonMemo;
  const hasStructuredLessonMemo = storedLessonMemo && typeof storedLessonMemo === 'object' && !Array.isArray(storedLessonMemo) &&
    LESSON_MEMO_FIELDS.some(field => Object.prototype.hasOwnProperty.call(storedLessonMemo, field.key));
  if (hasStructuredLessonMemo) {
    const memo = lessonMemoValues(c);
    if (memo.contentProgress.trim()) etc.push(memo.contentProgress.trim());
    if (memo.homework.trim()) hw.push(memo.homework.trim());
    if (memo.comment.trim()) etc.push(memo.comment.trim());
    // 기타·특이사항은 선생님 내부 공유 전용이며 학부모 피드백 문구에는 절대 넣지 않는다.
  } else {
    ((c && c.note) || '').split(/\n|\//).map(x => x.trim()).filter(Boolean).forEach(line => {
      if (line.startsWith('+')) plus.push(line.slice(1).trim());
      else if (line.startsWith('-') || line.startsWith('−')) minus.push(line.slice(1).trim());
      else if (/^숙제/.test(line)) hw.push(line.replace(/^숙제[:\s]*/, '').trim());
      else etc.push(line);
    });
  }

  const parts = [];
  parts.push(seedPick(FB_GREET[mood], seed, 30));
  parts.push(seedPick(FB_INTRO[mood], seed, 31).replace('{S}', student));

  if (doneSteps.length) {
    let stepLine = seedPick(FB_STEP_LEAD, seed, 32) + doneSteps.join(seedPick(FB_STEP_JOIN, seed, 33)) +
      seedPick(FB_STEP_TAIL, seed, 34);
    // 계획한 단계를 다 마쳤는지/일부만 했는지도 실제 체크 여부로만 판단해 한 문장 더 붙인다
    const total = steps.length;
    stepLine += ' ' + (total && doneSteps.length >= total
      ? seedPick(FB_STEP_ALLDONE, seed, 43)
      : seedPick(FB_STEP_PARTDONE, seed, 44));
    parts.push(stepLine);
  }

  if (genComment) parts.push(genComment);

  if (plus.length) {
    parts.push(seedPick(FB_PLUS_NOTE_LEAD, seed, 48) + '\n▪ 오늘 잘한 점\n' + plus.map(s => '· ' + s).join('\n'));
  }
  if (minus.length) {
    parts.push(seedPick(FB_MINUS_NOTE_LEAD, seed, 49) + '\n▪ 다음에 함께 봐주시면 좋은 점\n' + minus.map(s => '· ' + s).join('\n'));
  }
  if (etc.length) {
    parts.push(seedPick(FB_ETC_NOTE_LEAD, seed, 50) + '\n▪ ' + (genComment ? '덧붙임' : '선생님 코멘트') + '\n' +
      etc.map(s => '· ' + s).join('\n'));
  }

  if (hw.length) {
    parts.push(seedPick(FB_HW_LEAD, seed, 35) + hw.join(', ') + '.\n' +
      seedPick(FB_HW_TIP, seed, 36) + ' ' + seedPick(FB_HW_TIP2, seed, 45));
  }

  parts.push(nextLessonHint(t, seed));

  parts.push(seedPick(FB_CLOSING_LEAD[mood], seed, 46) + ' ' + seedPick(FB_BANK.closer, seed, 7));
  parts.push(seedPick(FB_PARENT_TIP[mood], seed, 47));
  parts.push(seedPick(FB_PARENT_NOTE[mood], seed, 37));
  parts.push(seedPick(FB_SIGNOFF[mood], seed, 38));

  return parts.join('\n\n');
}

function feedbackFlatField(value) {
  return String(value == null ? '' : value).replace(/[\r\n\u0000-\u001f]/g, ' ').replace(/\s+/g, ' ').trim();
}

function feedbackDateLabel(value) {
  const matched = String(value || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return matched ? matched[1] + '년 ' + Number(matched[2]) + '월 ' + Number(matched[3]) + '일' : '';
}

/** 새 알림톡 v2의 과목/수업내용/과제/코멘트 변수값이다.
 *  수업내용·진도와 과제는 저장된 수업 메모를 우선하고, 코멘트는 직접 작성 내용과
 *  인터뷰 선택값을 100개 이상의 격식체 기본 문장에서 학생·수업·날짜별로 조합한다. */
function computeFeedbackFields(t, date, fbCtx) {
  const c = getCheck(t.id, date);
  const doneSteps = taskSteps(t, c).filter(s => c && c.steps && c.steps[s.id]).map(s => s.label);
  const memo = lessonMemoValues(c);
  const contentText = feedbackFlatField(String(memo.contentProgress || '').trim() ||
    (doneSteps.length ? doneSteps.join(', ') : '') || taskCardDetail(t) ||
    [t.subject, t.className].filter(Boolean).join(' · ') || '수업 진행').slice(0, 300);
  const subjectText = feedbackFlatField(t.subject || t.className || '').slice(0, 80);
  const homeworkText = feedbackFlatField(memo.homework || '없음').slice(0, 300) || '없음';
  const plusText = ((fbCtx && fbCtx.plus) || []).map(i => FB_PLUS[i][0]).join(', ');
  const minusPick = (fbCtx && fbCtx.minus != null) ? FB_MINUS[fbCtx.minus][0] : '';
  const minusText = minusPick === '없음' ? '특별히 없음' : minusPick;
  const seed = String(t.studentId || '') + '|' + t.id + '|' + date;
  const commentText = buildFormalFeedbackComment(fbCtx || {}, seed);
  return { subjectText, contentText, homeworkText, commentText, plusText, minusText };
}

/** 실제 발송(카카오 알림톡) 미리보기 + 발송 버튼.
 *  v2는 승인 템플릿과 같은 고정 틀을 읽기 전용으로 보여 주어 미리보기와 실제 발송이 어긋나지 않게 한다.

    legacyFields +
    (guardianDeliveryEnabled
      ? '<div class="hint mt14"><b>테스트 학생 전달 기능 사용 중</b> — 아래 발송 버튼을 누르면 저장된 보호자 연락처로 실제 알림톡 발송을 시도합니다.</div>'
      : '<div class="hint mt14"><b>학부모 연락 기능 사용 중지</b> — 연락처는 보관하지만 메시지나 과제물을 학부모에게 전달하지 않습니다.</div>') +
    '<textarea class="in" rows="12" id="mText" style="margin-top:10px"' + (templateVersion === 'v2' ? ' readonly' : '') + '>' + esc(letterText) + '</textarea>' +
    '<div class="small muted mt8">' + (templateVersion === 'v2'
      ? '승인 템플릿과 실제 발송 변수로 만든 최종 미리보기입니다. 내용을 바꾸려면 수업 메모 또는 피드백 선택 화면으로 돌아가 수정해 주세요.'
      : '과거 템플릿 수정 요청입니다. 저장된 수업내용·진도와 선택 항목을 확인해 주세요.') + '</div>',
    '<button class="btn btn-ghost btn-block mt14" data-act="copytext">복사하기</button>' +
    (guardianDeliveryEnabled ? '<button class="btn btn-primary btn-block mt8" data-act="feedbacksubmit">보호자 알림톡 보내기</button>' : ''));
}

function todayStaffList() {
  const ownName = session.isStaffLink ? String((staffById(session.staffId) || {}).name || '') : '';
  const firstTwo = ownName === '김남기' ? ['김남기', '김혜지'] : ['김혜지', '김남기'];
  const rank = name => name === firstTwo[0] ? 0 : name === firstTwo[1] ? 1 : String(name || '').includes('테스트') ? 3 : 2;
  return liveStaff().slice().sort((a, b) => rank(a.name) - rank(b.name) || String(a.name || '').localeCompare(String(b.name || ''), 'ko'));

      ? saved.scheduleSlots.map(slot => Object.assign({ days: [], startTime: '', endTime: '', lessonHours: lessonHoursValue(saved.lessonHours) }, slot, {

function lessonRosterStudentPayload(selected, draft, lessons) {
  const info = currentLessonRosterDraft();
  if (!session.isAdmin || !selected || !info) return null;
  const lessonList = Array.isArray(lessons) && lessons.length ? lessons : [draft];
  const sourceTask = draft._sourceTaskId && (state.tasks || []).find(task => String(task.id) === String(draft._sourceTaskId));
  const teacherTransfer = sourceTask && lessonList.length === 1 &&
    String(sourceTask.staffId || '') !== String(lessonList[0].staffId || '');
  const teacherIds = [...new Set((info.teacherIds || []).map(String)
    .concat(teacherTransfer ? [] : lessonList.map(item => String(item.staffId || ''))).filter(Boolean))];
  const rosterSubjects = (info.subjects || []).filter(subject => ROSTER_SUBJECT_OPTIONS.includes(subject));
  const lessonSubjects = lessonList.map(item => String(item.subject || '')).filter(subject => ROSTER_SUBJECT_OPTIONS.includes(subject));
  const subjects = [...new Set(rosterSubjects.concat(lessonSubjects))];
  if (!String(info.name || '').trim() || !String(info.grade || '').trim() || !subjects.length || !teacherIds.length) {
    throw new Error('원생 이름·학년·수업 과목·담당 선생님을 모두 확인해 주세요');
  }
  return Object.assign({}, selected, {
    id: selected.id, name: String(info.name).normalize('NFKC').trim(), school: String(info.school || '').normalize('NFKC').trim(),
    grade: String(info.grade).normalize('NFKC').trim(), phoneSelf: String(info.phoneSelf || '').normalize('NFKC').trim(),
    phoneFather: String(info.phoneFather || '').normalize('NFKC').trim(), phoneMother: String(info.phoneMother || '').normalize('NFKC').trim(),
    registrationDate: String(info.registrationDate || ''), firstClassDate: String(info.firstClassDate || ''),
    teacher: teacherIds.map(id => (staffById(id) || {}).name).filter(Boolean).join('·'),
    subject: subjects.join('·'), subjects: subjects, teacherIds: teacherIds, memo: String(info.memo || '').normalize('NFKC').trim()
  });
}

  const container = button && button.closest('[data-publication-audit-task]');
  const studentId = String(((container && container.querySelector('[data-publication-student]')) || {}).value || '');
  const student = lessonFormStudents().find(item => String(item.id) === studentId);
  const owner = row && staffById(row.taskOwner);

  if (!student) return toast('연결할 실제 원생을 선택해 주세요');
  if (!owner || owner.deleted) return toast('수업 저장 담당자가 현재 직원 명단에 없어 먼저 담당자를 정리해야 합니다');

  lessonPreviewBatchPayload = [];
  lessonPreviewRosterStudents = [];

    .join(' · ') + (student.contactHint ? ' · 보호자 끝 ' + student.contactHint : '') + (student.assigned ? ' · 이미 담당' : '');
}

function lessonAssignmentScheduleText(slots, fallbackLessonHours) {
  return groupedScheduleSlotsForDisplay(slots, fallbackLessonHours).map(lessonScheduleSlotLabel).join(' / ');
}

async function submitLessonAssignmentRequest(button) {
  if (!(session.isStaffLink && !session.isAdmin)) return;
  const draft = currentLessonAssignmentDraft();
  const selected = lessonAssignmentCandidates.find(student => String(student.id) === String(draft.studentId));
  if (!selected || selected.assigned) return toast('배정받을 재원생을 선택해 주세요');
  if (!draft.subjects.length) return toast('요청할 과목을 선택해 주세요');
  if (!draft.scheduleSlots.length || draft.scheduleSlots.some(slot => !(slot.days || []).length || !slot.startTime || !slot.endTime || !lessonHoursValue(slot.lessonHours))) {
    return toast('각 확정 시간의 요일·시작·종료·수업시수를 모두 입력해 주세요');
  }
  if (!draft.startDate) return toast('수업 시작일을 선택해 주세요');
  if (!String(draft.reason || '').trim()) return toast('배정 요청 사유를 입력해 주세요');
  const auth = sync.auth();
  if (!auth) return toast('개인 인증을 먼저 확인해 주세요');
  if (button) button.disabled = true;
  try {
    await sync.post('/lesson-assignment-request', {
      app: SYNC_APP, auth: auth, action: 'submit', studentId: selected.id,
      subjects: draft.subjects, scheduleSlots: draft.scheduleSlots, startDate: draft.startDate,
      reason: String(draft.reason || '').trim()
    });
    lessonAssignmentDraft = null;
    lessonAssignmentRequestsLoaded = false;
    await loadLessonAssignmentRequests(true);
    toast('담당 원생 배정과 수업 생성 요청을 보냈습니다');
  } catch (error) {
    if (button) button.disabled = false;
    toast('배정 요청 실패 — ' + (error.message || error));
  }
}

async function cancelLessonAssignmentRequest(button) {
  if (!(session.isStaffLink && !session.isAdmin)) return;
  const key = String(button && button.dataset.key || '');
  const revision = Number(button && button.dataset.rev);
  const request = lessonAssignmentRequests.find(row => row.requestKey === key && row.status === 'approval_waiting');
  if (!request || !Number.isInteger(revision)) return toast('요청 목록을 새로고침해 주세요');
  if (!confirm(request.studentName + ' 학생 배정 요청을 취소할까요?')) return;
  if (button) button.disabled = true;
  try {
    await sync.post('/lesson-assignment-request', { app: SYNC_APP, auth: sync.auth(), action: 'cancel', requestKey: key, revision: revision });
    lessonAssignmentRequestsLoaded = false;
    await loadLessonAssignmentRequests(true);
    toast('배정 요청을 취소했습니다');
  } catch (error) {
    if (button) button.disabled = false;
    toast('요청 취소 실패 — ' + (error.message || error));
  }
}

async function reviewLessonAssignment(action, button) {
  if (!session.isAdmin) return;
  const auth = sync.auth();
  const key = String(button.dataset.key || ''), revision = Number(button.dataset.rev);
  if (!auth || !key || !Number.isInteger(revision)) return;
  const body = { app: SYNC_APP, auth: auth, action: action, requestKey: key, revision: revision };
  if (action === 'approve') {
    const request = lessonAssignmentRequests.find(row => row.requestKey === key);
    if (request && request.details && request.studentId) {
      body.studentId = request.studentId;
      if (!rosterDb || !(rosterDb.students || []).some(row => String(row.id) === String(body.studentId))) {
        return toast('현재 재원생 명단에서 학생을 다시 확인해 주세요');
      }
    } else {
      const select = document.querySelector('[data-lar-student][data-key="' + CSS.escape(key) + '"]');
      body.studentId = select && select.value;
      if (!body.studentId) return toast('현재 원생 명단에서 학생을 선택해 주세요');
    }
    const student = rosterDb && (rosterDb.students || []).find(row => String(row.id) === String(body.studentId));
    if (!request || !student) return toast('원생 명단을 새로고침한 뒤 다시 선택해 주세요');
    const same = value => String(value || '').normalize('NFKC').replace(/\s+/g, '').toLocaleLowerCase('ko');
    if (!request.details && (same(request.studentName) !== same(student.name) || same(request.grade) !== same(student.grade))) {
      if (!confirm('요청 정보는 “' + request.studentName + ' · ' + request.grade + '”이고 선택한 원생은 “' + student.name + ' · ' + student.grade + '”입니다. 같은 학생이 맞습니까?')) return;
      body.confirmIdentityMismatch = true;
    }
  } else {
    const note = prompt('반려 사유를 입력해 주세요');
    if (note == null) return;
    body.note = note;
  }
  try {
    const result = await sync.post('/lesson-assignment-review', body);
    if (result && result.task) applyCreatedLesson(result.task);
    lessonAssignmentRequestsLoaded = false;
    rosterDb = null; rosterErr = '';
    loadRoster(); loadLessonAssignmentRequests(true);
    toast(action === 'approve' ? (result && result.task ? '담당 원생을 연결하고 수업을 생성했습니다' : '담당 원생을 연결했습니다') : '배정 요청을 반려했습니다');
  } catch (error) { toast('처리 실패 — ' + (error.message || error)); }
}

function lessonDraftFromTask(t) {
  return {
    staffId: t.staffId || '', studentId: t.studentId || '', studentName: t.studentName || studentOf(t), grade: t.grade || '',
    subject: t.subject || '', className: t.className || '', lessonHours: lessonHoursValue(t.lessonHours),
    scheduleText: t.scheduleText || '',
    scheduleSlots: Array.isArray(t.scheduleSlots) && t.scheduleSlots.length

    parentRequest: t.parentRequest || '', adminRequest: t.adminRequest || '없음', start: t.start || today(),

function lessonClockLabel(value) {
  const match = String(value || '').match(/^([01]\d|2[0-3]):([0-5]\d)$/);
  if (!match) return '미선택';
  const hour = Number(match[1]);
  return (hour < 12 ? '오전 ' : '오후 ') + (hour % 12 || 12) + ':' + match[2] + ' (' + match[0] + ')';
}

function lessonClockSummary(slot) {
  slot = slot || {};
  return '선택 결과 · ' + lessonClockLabel(slot.startTime) + ' → ' + lessonClockLabel(slot.endTime);
}

function syncLessonBulkSelectionUi() {
  const selectedIds = new Set((currentLessonDraft().bulkStudentIds || []).map(String));
  document.querySelectorAll('[data-lesson-bulk-student-row]').forEach(row => {
    const input = row.querySelector('[data-lesson-bulk-student]');
    const selected = !!(input && selectedIds.has(String(input.value)));
    if (input) input.checked = selected;
    row.classList.toggle('on', selected);
  });
  const count = document.querySelector('[data-lesson-bulk-count]');
  if (count) count.textContent = '선택 ' + selectedIds.size + '명';
  const preview = document.querySelector('.lesson-form-panel [data-act="lessonpreview"]');
  if (preview) {
    preview.disabled = selectedIds.size === 0;
    preview.textContent = '선택 ' + selectedIds.size + '명 · 수업 일괄 등록 미리보기';
  }
}

function lessonExistingSearchKey(value) {
  return String(value || '').normalize('NFKC').replace(/\s+/g, '').toLocaleLowerCase('ko');
}

function lessonExistingChangeRows(query) {
  const key = lessonExistingSearchKey(query);
  if (!key || !session.isAdmin) return [];
  const students = (rosterDb && Array.isArray(rosterDb.students)) ? rosterDb.students : [];
  return (state.tasks || []).filter(task => task && !task.deleted && isLesson(task) && canEditLessonTask(task)).map(task => {
    const teacher = staffById(task.staffId);
    const student = students.find(item => String(item.id) === String(task.studentId || ''));
    const studentName = String((student && student.name) || task.studentName || studentOf(task) || '학생 미지정');
    const studentLabel = student
      ? [student.name, student.school || '학교 미입력', student.grade || '학년 미입력'].join(' · ')
      : [studentName, task.grade || '학년 미입력'].join(' · ');
    const teacherName = String((teacher && teacher.name) || '담당 미지정');
    return {
      task: task, studentName: studentName, studentLabel: studentLabel, teacherName: teacherName,
      subject: String(task.subject || task.className || task.lessonRole || '과목 미지정'),
      schedule: lessonAssignmentScheduleText(task.scheduleSlots, task.lessonHours) || task.scheduleText || '요일·시간·시수 미지정'
    };
  }).filter(row => lessonExistingSearchKey(row.studentName).includes(key) || lessonExistingSearchKey(row.teacherName).includes(key))
    .sort((a, b) => a.studentLabel.localeCompare(b.studentLabel, 'ko') || a.teacherName.localeCompare(b.teacherName, 'ko') ||
      a.subject.localeCompare(b.subject, 'ko') || String(a.task.id || '').localeCompare(String(b.task.id || '')));
}

function refreshLessonDirectEntry(forceOpen) {
  const current = document.querySelector('.lesson-form-panel');
  if (!current) return;
  const directDetails = current.closest('.lesson-direct-entry');
  const existingDetails = current.closest('.lesson-existing-change');
  if (directDetails) lessonDirectEntryOpen = forceOpen === true || directDetails.open;
  if (existingDetails) lessonExistingChangeOpen = forceOpen === true || existingDetails.open;
  const holder = document.createElement('div');
  holder.innerHTML = viewLessonEntry();
  const next = holder.querySelector('.lesson-form-panel');
  if (!next) return;
  current.replaceWith(next);
}

function lessonInputPayload() {
  const draft = currentLessonDraft();
  const slots = (draft.scheduleSlots || []).filter(slot =>
    (slot.days || []).length || slot.startTime || slot.endTime || slot.lessonHours);
  return Object.assign({}, draft, {
    lessonRole: draft.className || draft.subject,
    scheduleSlots: slots,
    materials: draft._sourceTaskId ? (draft.materials || '없음') : '없음',
    onlineProgram: draft._sourceTaskId ? (draft.onlineProgram || '없음') : '없음',
    homework: draft._sourceTaskId ? (draft.homework || '없음') : '없음',
    studentTraits: draft._sourceTaskId ? (draft.studentTraits || '없음') : '없음',
    goal: draft._sourceTaskId ? (draft.goal || '없음') : '없음',
    parentRequest: draft._sourceTaskId ? (draft.parentRequest || '없음') : '없음',
    adminRequest: draft._sourceTaskId ? (draft.adminRequest || '없음') : '없음'
  });
}

function syncRenderedLessonScheduleField(target) {
  if (!target || !target.closest) return false;
  const slotField = target.closest('[data-lesson-slot]');
  if (slotField) {
    const slot = currentLessonDraft().scheduleSlots[Number(slotField.dataset.i)];
    if (slot) {
      slot[slotField.dataset.lessonSlot] = slotField.value;
      const row = slotField.closest('.lesson-slot');
      const display = row && row.querySelector('[data-lesson-time-display]');
      if (display) display.textContent = lessonClockSummary(slot);
    }
    return !!slot;
  }
  const batchField = target.closest('[data-lesson-batch-slot]');
  if (batchField) {
    const entry = lessonBatchEntries()[Number(batchField.dataset.lessonI)];
    const slot = entry && entry.scheduleSlots[Number(batchField.dataset.slotI)];
    if (slot) {
      slot[batchField.dataset.lessonBatchSlot] = batchField.value;
      const row = batchField.closest('.lesson-slot');
      const display = row && row.querySelector('[data-lesson-time-display]');
      if (display) display.textContent = lessonClockSummary(slot);
    }
    return !!slot;
  }
  return false;
}

function captureRenderedLessonScheduleInputs() {
  let captured = false;
  document.querySelectorAll('.lesson-form-panel [data-lesson-slot], .lesson-form-panel [data-lesson-batch-slot]').forEach(field => {
    if (syncRenderedLessonScheduleField(field)) captured = true;
  });
  if (captured) persistLessonDraft();
}

function applyCreatedLesson(task) {
  const index = state.tasks.findIndex(item => item.id === task.id);
  if (index >= 0 && Number(state.tasks[index].updatedAt || 0) > Number(task.updatedAt || 0)) return false;
  if (index < 0) state.tasks.push(task); else state.tasks[index] = task;
  save();
  return true;
}

async function saveLessonRegistration(button) {
  if (lessonSubmitting || !lessonPreviewPayload) return;
  const auth = sync.auth();
  if (!auth) return toast('동기화 인증이 필요합니다');
  lessonSubmitting = true;
  if (button) button.disabled = true;
  let rosterSaved = false;
  try {
    const draft = currentLessonDraft();
    const targetStaffId = session.isStaffLink && !session.isAdmin ? session.staffId : draft.staffId;
    if (session.isAdmin && lessonPreviewRosterStudent) {
      const currentStudent = rosterDb && (rosterDb.students || []).find(row => String(row.id) === String(lessonPreviewRosterStudent.id));
      if (!currentStudent) throw new Error('원생 명단을 새로고침한 뒤 다시 등록해 주세요');
      if (lessonRosterStudentChanged(currentStudent, lessonPreviewRosterStudent)) {
        const rosterResult = await sync.post('/roster', {
          app: SYNC_APP, auth: auth, action: 'student_update', expectedUpdatedAt: Number(rosterDb.updatedAt),
          student: lessonPreviewRosterStudent
        });
        const index = rosterDb.students.findIndex(row => String(row.id) === String(lessonPreviewRosterStudent.id));
        if (index >= 0) rosterDb.students[index] = Object.assign({}, lessonPreviewRosterStudent);
        rosterDb.updatedAt = Number(rosterResult.updatedAt) || rosterDb.updatedAt;
        rosterSaved = true;
      }
    }
    const result = await sync.post('/lesson-create', {
      app: SYNC_APP, auth: auth, staffId: targetStaffId,
      sourceTaskId: draft._sourceTaskId || undefined,
      expectedUpdatedAt: lessonPreviewExpectedUpdatedAt || undefined,
      lesson: lessonPreviewPayload
    });
    applyCreatedLesson(result.task);
    if (result.updated && session.isAdmin) { studentChangeLoaded = false; loadStudentChanges(true); }
    publicationReadinessLoaded = false;
    publicationReadinessRows = [];
    clearLessonDraft();
    lessonDraft = null; lessonPreviewPayload = null; lessonPreviewTask = null; lessonPreviewBatchPayload = []; lessonPreviewExpectedUpdatedAt = 0;
    lessonPreviewRosterStudents = [];
    lessonRosterDraft = null; lessonRosterDraftStudentId = ''; lessonPreviewRosterStudent = null;
    if (session.isAdmin) viewStaff = targetStaffId;
    closeModal(); go('today');
    toast(result.idempotent || result.duplicate ? '변경 사항이 없어 기존 수업을 그대로 유지했습니다' : (result.updated ? '수업 정보를 수정했습니다' : '수업을 등록했습니다'));
  } catch (error) {
    toast((rosterSaved ? '원생 기본 정보는 저장됐습니다 · ' : '') + '수업 등록 실패 — ' + (error.message || error));
    if (button) button.disabled = false;
  } finally {
    lessonSubmitting = false;
  }
}

  if (!session.isAdmin) return toast('관리자만 수업을 일괄 등록할 수 있습니다');
  const auth = sync.auth();
  if (!auth) return toast('동기화 인증이 필요합니다');
  const previewBatchKind = lessonPreviewBatchKind;
  const previewBatchPayload = lessonPreviewBatchPayload.map(item => ({ staffId: item.staffId, lesson: item.lesson }));
  const previewRosterStudents = lessonPreviewRosterStudents.slice();
  const previewRosterStudent = lessonPreviewRosterStudent;
  if (!['students', 'lessons'].includes(previewBatchKind)) return toast('일괄 등록 미리보기를 다시 확인해 주세요');
  lessonSubmitting = true;
  if (button) button.disabled = true;
  let rosterSavedCount = 0;
  try {
    const rosterCandidates = previewBatchKind === 'students' ? [] : (previewRosterStudents.length
      ? previewRosterStudents
      : (previewRosterStudent ? [previewRosterStudent] : []));
    for (const rosterStudent of rosterCandidates) {
      const currentStudent = rosterDb && (rosterDb.students || []).find(row => String(row.id) === String(rosterStudent.id));
      if (!currentStudent) throw new Error('원생 명단을 새로고침한 뒤 다시 등록해 주세요');
      if (lessonRosterStudentChanged(currentStudent, rosterStudent)) {
        const rosterResult = await sync.post('/roster', {
          app: SYNC_APP, auth: auth, action: 'student_update', expectedUpdatedAt: Number(rosterDb.updatedAt),
          student: rosterStudent
        });
        const index = rosterDb.students.findIndex(row => String(row.id) === String(rosterStudent.id));
        if (index >= 0) rosterDb.students[index] = Object.assign({}, rosterStudent);
        rosterDb.updatedAt = Number(rosterResult.updatedAt) || rosterDb.updatedAt;
        rosterSavedCount += 1;
      }
    }
    const submitted = previewBatchPayload;
    const result = await sync.post('/lesson-create-batch', {
      app: SYNC_APP, auth: auth,
      batchKind: previewBatchKind,
      lessons: submitted
    });
    if (!result || !Array.isArray(result.tasks) || result.tasks.length !== submitted.length) {
      throw new Error('일괄 등록 결과를 확인할 수 없습니다');
    }
    result.tasks.forEach(applyCreatedLesson);
    if (previewBatchKind === 'students' || result.rosterUpdated) {
      rosterDb = null;
      rosterErr = '';
      loadRoster();
    }
    publicationReadinessLoaded = false;
    publicationReadinessRows = [];
    const firstStaffId = submitted[0] && submitted[0].staffId;
    clearLessonDraft();
    lessonDraft = null; lessonPreviewPayload = null; lessonPreviewTask = null; lessonPreviewBatchPayload = []; lessonPreviewExpectedUpdatedAt = 0;
    lessonPreviewRosterStudents = []; lessonPreviewBatchKind = '';
    lessonRosterDraft = null; lessonRosterDraftStudentId = ''; lessonPreviewRosterStudent = null;
    if (firstStaffId) viewStaff = firstStaffId;
    closeModal(); go('today');
    toast(result.createdCount ? '수업 ' + result.createdCount + '건을 한 번에 등록했습니다' : '모든 수업이 이미 같은 내용으로 등록되어 있습니다');
  } catch (error) {
    toast((rosterSavedCount ? '원생 배정 ' + rosterSavedCount + '명은 저장됐습니다 · ' : '') + '수업 일괄 등록 실패 — ' + (error.message || error));
    if (button) button.disabled = false;
  } finally {
    lessonSubmitting = false;
  }
}

function reconcileOwnLessonChangeTasks(requests) {
  if (!session.isStaffLink || session.isAdmin) return false;
  const hidden = new Set((requests || []).filter(item => item && item.status === 'approved' && item.changes &&
    ['teacher_assignment', 'withdrawal', 'leave', 'lesson_delete'].includes(item.changes.operation)).map(item => String(item.taskId || '')));
  if (!hidden.size) return false;
  const before = state.tasks.length;

  if (state.tasks.length === before) return false;
  save();
  return true;

function lessonChangeSummary(changes) {

  if (changes.operation === 'leave') return '휴원 · ' + esc(changes.effectiveDate || '날짜 확인 필요');
  if (changes.operation === 'lesson_delete') return '수업삭제 · ' + esc(changes.effectiveDate || '날짜 확인 필요');
  if (changes.operation === 'information_request') return '학생 정보 수정 요청<br>' + esc(changes.informationRequest || '');

  if (changes.days) items.push('요일 → ' + (changes.days.length ? esc(daysForDisplay(changes.days).map(d => DOW[d]).join('·')) : '(없음)'));
  if (changes.time !== undefined) items.push('시간 → ' + esc(changes.time || '(없음)'));
  if (changes.lessonHours !== undefined) items.push('수업시수 → ' + esc(changes.lessonHours || '(없음)'));
  if (changes.repeat) items.push('반복 → ' + esc(LESSON_CHANGE_REPEAT_LABEL[changes.repeat] || changes.repeat));
  if (changes.detail !== undefined) items.push('교재/진도 → ' + esc(changes.detail || '(없음)'));
  if (changes.guide !== undefined) items.push('수업 메모 → ' + esc(changes.guide || '(없음)'));
  if (changes.target !== undefined) items.push('목표 수량 → ' + esc(String(changes.target)));
  if (changes.unit !== undefined) items.push('단위 → ' + esc(changes.unit || ''));
  return items.join('<br>');

function lessonChangeDiffHtml(task, changes) {
  changes = changes || {};
  if (changes.operation === 'teacher_assignment') return '<div class="guide"><b>담당선생님 변경</b><br>변경 시작일: ' +
    esc(changes.effectiveDate || '확인 필요') + '<br>승인할 선생님은 관리자 승인 화면에서 직접 선택합니다.</div>';
  if (changes.operation === 'withdrawal' || changes.operation === 'leave' || changes.operation === 'lesson_delete') {
    const labels = { withdrawal: '퇴원', leave: '휴원', lesson_delete: '수업삭제' };
    return '<div class="guide"><b>' + labels[changes.operation] + '</b><br>적용 날짜: ' + esc(changes.effectiveDate || '확인 필요') + '</div>';
  }
  if (changes.operation === 'information_request') {
    return '<div class="guide"><b>학생 정보 수정 요청</b><br>' + esc(changes.informationRequest || '입력 내용 없음') + '</div>';
  }
  const has = key => Object.prototype.hasOwnProperty.call(changes, key);
  const empty = value => value === undefined || value === null || value === '' ? '(없음)' : String(value);
  const days = value => Array.isArray(value) && value.length ? daysForDisplay(value).map(day => DOW[day]).join('·') : '(없음)';
  const repeat = value => LESSON_CHANGE_REPEAT_LABEL[value] || empty(value);
  const fields = [
    ['days', '요일', value => days(value)],
    ['time', '시간', value => empty(value)],
    ['lessonHours', '수업시수', value => empty(value)],
    ['repeat', '반복', value => repeat(value)],
    ['detail', '교재·진도', value => empty(value)],
    ['guide', '수업 메모', value => empty(value)],
    ['target', '목표 수량', value => empty(value)],
    ['unit', '단위', value => empty(value)]
  ];
  const rows = fields.filter(field => {
    if (!has(field[0])) return false;
    if (!task) return true;
    return field[2](task[field[0]]) !== field[2](changes[field[0]]);
  }).map(field => {
    const key = field[0], label = field[1], format = field[2];
    const before = task ? format(task[key]) : '현재 수업 확인 필요';
    const after = format(changes[key]);
    return '<div class="lesson-change-diff-row"><div class="small muted"><b>' + esc(label) + '</b></div>' +
      '<div class="grid2"><div class="guide"><b>변경 전</b><br>' + esc(before) + '</div>' +
      '<div class="guide lesson-change-after"><b>변경 후</b><br>' + esc(after) + '</div></div></div>';
  });
  return rows.length ? rows.join('') : '<div class="guide">변경 내용을 확인할 수 없습니다.</div>';
}

function viewLessonChangeReview() {
  if (!lessonChangeQueueLoaded && !lessonChangeQueueLoading) setTimeout(() => loadLessonChangeQueue(false), 0);
  let h = '<div class="card lesson-review"><div class="card-title">📅 수업 정보 변경 요청 검토</div>' +
    '<div class="card-sub">수업 정보·담당 선생님·퇴원·휴원·수업삭제와 학생 정보 수정 요청을 검토합니다.</div>' +
    '<button class="btn btn-sm btn-ghost mt14" data-act="lcrefresh">새로고침</button></div>';
  if (lessonChangeQueueLoading) return h + '<div class="card"><div class="empty"><b>⏳</b>불러오는 중입니다.</div></div>';
  if (lessonChangeQueueError) return h + '<div class="card alert"><div class="small">불러오기 실패 — ' + esc(lessonChangeQueueError) + '</div></div>';
  const visibleQueue = lessonChangeQueue.filter(item => item.status !== 'approved');
  if (!visibleQueue.length) return h + '<div class="card"><div class="empty"><b>✅</b>검토할 변경 요청이 없습니다.</div></div>';
  const rank = { approval_waiting: 0, rejected: 1, cancelled: 2 };
  return h + visibleQueue.slice().sort((a, b) => (rank[a.status] ?? 9) - (rank[b.status] ?? 9) || b.updatedAt - a.updatedAt)
    .map(lessonChangeQueueCard).join('');
}

async function submitLessonChange(button) {
  if (!lcForm) return;
  if (lcForm.operation === 'lesson_fields' && lcForm.repeat === 'days' && !lcForm.days.length) return toast('요일을 선택해 주세요');
  const auth = sync.auth();
  if (!auth) return toast('동기화 인증이 필요합니다');
  let changes;
  if (lcForm.operation === 'lesson_fields') {
    changes = {
      time: $('#lcTime').value || '', target: Number($('#lcTarget').value) || 0,
      repeat: lcForm.repeat, days: lcForm.repeat === 'days' ? lcForm.days.slice().sort() : [],
      detail: ($('#lcDetail').value || '').trim(), guide: ($('#lcGuide').value || '').trim()
    };
  } else {
    changes = { operation: lcForm.operation };
    if (['teacher_assignment', 'withdrawal', 'leave', 'lesson_delete'].includes(lcForm.operation)) {
      changes.effectiveDate = ($('#lcEffectiveDate') || {}).value || '';
      if (!changes.effectiveDate) return toast(lcForm.operation === 'teacher_assignment' ? '변경 시작일을 선택해 주세요' : '적용 날짜를 선택해 주세요');
    }
  }
  const note = ($('#lcNote').value || '').trim();
  if (button) button.disabled = true;
  try {
    const result = await sync.post('/lesson-change-request', {
      app: SYNC_APP, auth: auth, action: 'submit', taskId: lcForm.taskId, changes: changes, note: note
    });
    lessonChangeQueueLoaded = false; ownLessonChangeQueueLoaded = false;
    lcForm = null;
    toast(result.idempotent ? '같은 내용이 이미 원장 검토 대기 중입니다' : '원장님께 변경 요청을 보냈습니다');
    closeModal();
  } catch (error) {
    toast('요청 실패 — ' + (error.message || error));
    if (button) button.disabled = false;
  }
}

async function reviewLessonChange(action, key, revision) {
  const auth = sync.auth();
  if (!auth) return toast('동기화 인증이 필요합니다');
  const body = { app: SYNC_APP, auth: auth, action: action, requestKey: key, revision: Number(revision) };
  if (action === 'approve') {
    const request = lessonChangeQueue.find(item => item.requestKey === key);
    if (request && request.changes && request.changes.operation === 'teacher_assignment') {
      const select = document.querySelector('[data-lc-teacher][data-key="' + key + '"]');
      body.selectedStaffId = String(select && select.value || '');
      if (!body.selectedStaffId) return toast('변경할 담당 선생님을 선택해 주세요');
    }
  }
  if (action === 'reject') {
    const note = prompt('선생님에게 전달할 반려 사유를 적어 주세요');
    if (note === null) return;
    body.note = note.trim();
  }
  try {
    const result = await sync.post('/lesson-change-review', body);
    const index = lessonChangeQueue.findIndex(item => item.requestKey === key);
    if (index >= 0) lessonChangeQueue[index] = result.request;
    lessonChangeQueueLoaded = false; studentChangeLoaded = false; rosterDb = null; rosterErr = '';
    if (action === 'approve') await sync.run();
    loadRoster(); loadLessonChangeQueue(true); render();
    toast(action === 'approve' ? '승인했습니다 · 지시서에 반영됐습니다' : '반려했습니다');
  } catch (error) {
    toast('검토 실패 — ' + (error.message || error));
    loadLessonChangeQueue(true);
  }
}

/** 승인 단계 없이, 여기서 누르는 순간 서버가 바로 카카오 알림톡 발송을 시도한다.
 *  보호자 연락처·동의가 없거나 설정이 꺼져 있으면 서버가 조용히 막고 사유를 남긴다
 *  (막힌 사유는 "피드백 검토" 화면에서 원장님이 확인·재시도할 수 있다). */
async function submitFeedbackForReview(button) {
  if (!fbCtx) return;
  const task = state.tasks.find(row => row.id === fbCtx.id);
  if (!guardianContactEnabledFor(task && task.studentId)) return toast('이 학생은 학부모 전달 테스트 대상이 아닙니다');
  const message = (($('#mText') || {}).value || '').trim();
  const templateVersion = fbCtx.templateVersion === 'v1' ? 'v1' : 'v2';
  const contentText = String(fbCtx.contentText || '').trim();
  const plusText = templateVersion === 'v1' ? (($('#fldPlus') || {}).value || '').trim() : String(fbCtx.plusText || '').trim();
  const minusText = templateVersion === 'v1' ? (($('#fldMinus') || {}).value || '').trim() : String(fbCtx.minusText || '').trim();
  if (!message) return toast('피드백 문구를 입력해 주세요');
  if (!contentText || (templateVersion === 'v1' && (!plusText || !minusText))) {
    return toast('수업 기록과 피드백 항목을 확인해 주세요');
  }
  if (templateVersion === 'v2' && (!fbCtx.subjectText || !fbCtx.homeworkText || !fbCtx.commentText)) {
    return toast('과목·수업내용·과제·코멘트를 모두 확인해 주세요');
  }
  if (!confirm('저장된 보호자 연락처로 수업 피드백 알림톡을 실제 발송할까요?')) return;
  const auth = sync.auth();
  if (!auth) return toast('동기화 인증이 필요합니다');
  if (button) button.disabled = true;
  try {
    const result = await sync.post('/feedback-request', {
      app: SYNC_APP, auth: auth, taskId: fbCtx.id,
      feedbackDate: fbCtx.date, feedbackType: 'class_feedback', templateVersion: templateVersion,
      message: message, contentText: contentText, subjectText: fbCtx.subjectText,
      homeworkText: fbCtx.homeworkText, commentText: fbCtx.commentText,
      plusText: plusText, minusText: minusText
    });
    feedbackQueueLoaded = false; ownFeedbackQueueLoaded = false;
    const status = result.request && result.request.status;
    if (status === 'sent') toast('보호자 알림톡 발송 요청이 접수됐습니다');
    else if (status === 'revision_requested') toast('원장 수정 요청을 확인해 문구를 바꿔 주세요');
    else if (result.idempotent) toast('같은 내용이 이미 처리되어 있습니다 — 상태는 "피드백 검토"에서 확인해 주세요');
    else toast('제출했습니다 — 아직 발송되지 않았다면 "피드백 검토"에서 사유를 확인해 주세요');
    closeModal();
  } catch (error) {
    toast('제출 실패 — ' + (error.message || error));
    if (button) button.disabled = false;
  }
}

async function reviewFeedbackRequest(action, key, revision) {

/** 막혔던 알림톡을 다시 접수한다 — 원장만, 승인과는 별개의 명시적 클릭 */
async function sendParentFeedback(key, button) {
  const auth = sync.auth();
  if (!auth) return toast('동기화 인증이 필요합니다');
  const resultBox = document.getElementById('fbSendResult-' + key);
  if (button) { button.disabled = true; button.textContent = '보내는 중…'; }
  try {
    const res = await sync.post('/parent-feedback-send', { app: SYNC_APP, auth: auth, requestKey: key });
    feedbackQueueLoaded = false;
    if (res.status === 'sent') {
      toast('보호자 알림톡 발송 요청이 접수됐습니다');
      loadFeedbackQueue(true);
    } else if (res.code === 'ALREADY_SENT') {
      toast('이미 발송된 문구입니다');
      loadFeedbackQueue(true);
    } else {
      const msg = '⏳ ' + (res.send ? res.send.status : '처리 중') + ' — 잠시 후 새로고침해서 확인해 주세요';
      if (resultBox) resultBox.textContent = msg; else toast(msg);
      if (button) { button.disabled = false; button.textContent = '📱 지금 학부모께 알림톡 접수'; }
    }
  } catch (error) {
    if (button) { button.disabled = false; button.textContent = '📱 지금 학부모께 알림톡 접수'; }
    if (resultBox) resultBox.textContent = '❌ ' + (error.message || error);
    else toast('발송 실패 — ' + (error.message || error));
  }
}
