<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>업무지시서 · WB 웩슬러브레인센터</title>
<meta name="theme-color" content="#1B3A5C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue:       #1E9DD6;
    --deep-blue:  #0F7AAB;
    --navy:       #1B3A5C;
    --coral:      #E85D4A;
    --ivory:      #FAF8F3;
    --dark-gray:  #2D2D2D;
    --mid-gray:   #6B7280;
    --line:       #E5E7EB;
    --light-gray: #F3F4F6;
    --white:      #FFFFFF;
    --green:      #16A34A;
    --amber:      #D97706;
  }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--dark-gray);
    background: var(--ivory);
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
    padding-bottom: 48px;
  }

  button, input, select, textarea { font-family: inherit; font-size: 100%; color: inherit; }
  button { cursor: pointer; border: none; background: none; }

  .wrap { max-width: 760px; margin: 0 auto; padding: 0 14px; }

  /* ─── 상단 바 ─── */
  .topbar { background: var(--navy); color: var(--white); padding: 12px 0; position: sticky; top: 0; z-index: 50; }
  .topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .brand { font-size: 15px; font-weight: 900; letter-spacing: -0.02em; }
  .brand span { color: var(--blue); }
  .brand small { display: block; font-size: 11px; font-weight: 400; color: rgba(255,255,255,0.6); letter-spacing: 0; }
  .whoami {
    font-size: 12px; font-weight: 700; background: rgba(255,255,255,0.14);
    padding: 6px 12px; border-radius: 999px; display: flex; align-items: center; gap: 6px;
  }
  .whoami i { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); font-style: normal; }
  .whoami.off i { background: var(--mid-gray); }

  /* ─── 탭 ─── */
  .tabs { background: var(--white); border-bottom: 1px solid var(--line); position: sticky; top: 55px; z-index: 40; }
  .tabs .wrap { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
  .tabs .wrap::-webkit-scrollbar { display: none; }
  .tab {
    padding: 13px 14px; font-size: 14px; font-weight: 700; color: var(--mid-gray);
    border-bottom: 3px solid transparent; white-space: nowrap; display: flex; align-items: center; gap: 5px;
  }
  .tab.on { color: var(--deep-blue); border-bottom-color: var(--blue); }
  .badge {
    background: var(--coral); color: var(--white); font-size: 11px; font-weight: 900;
    min-width: 18px; height: 18px; border-radius: 999px; padding: 0 5px;
    display: inline-flex; align-items: center; justify-content: center;
  }

  /* ─── 카드 ─── */
  .card { background: var(--white); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .card.alert { border-color: var(--coral); background: #FFF9F8; }
  .card-title { font-size: 15px; font-weight: 900; margin-bottom: 4px; }
  .card-sub { font-size: 13px; color: var(--mid-gray); }
  main { padding-top: 16px; }

  .row { display: flex; align-items: center; gap: 10px; }
  .wraprow { flex-wrap: wrap; }
  .between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .muted { color: var(--mid-gray); }
  .small { font-size: 12px; }
  .mb8 { margin-bottom: 8px; } .mb14 { margin-bottom: 14px; } .mt14 { margin-top: 14px; }

  /* ─── 버튼 ─── */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 11px 16px; border-radius: 10px; font-size: 14px; font-weight: 700;
    background: var(--light-gray); color: var(--dark-gray); border: 1px solid transparent;
  }
  .btn:active { filter: brightness(0.94); }
  .btn-primary { background: var(--blue); color: var(--white); }
  .btn-navy { background: var(--navy); color: var(--white); }
  .btn-ghost { background: var(--white); border-color: var(--line); }
  .btn-danger { background: #FEF2F2; color: var(--coral); }
  .btn-warn { background: #FFF7ED; color: var(--amber); border: 1px solid #FDE8CC; }
  .btn-sm { padding: 7px 11px; font-size: 12.5px; border-radius: 8px; }
  .btn-block { display: flex; width: 100%; }
  .btn:disabled { opacity: .5; cursor: default; }

  /* ─── 폼 ─── */
  label.fl { display: block; font-size: 12.5px; font-weight: 700; color: var(--mid-gray); margin-bottom: 5px; }
  .in { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--white); font-size: 14.5px; }
  .in:focus { outline: 2px solid rgba(30,157,214,.35); outline-offset: -1px; border-color: var(--blue); }
  textarea.in { resize: vertical; min-height: 62px; line-height: 1.6; }
  .field { margin-bottom: 12px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip { padding: 8px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--white); font-size: 13px; font-weight: 700; color: var(--mid-gray); }
  .chip.on { background: var(--navy); border-color: var(--navy); color: var(--white); }
  .chip.dow { min-width: 42px; padding: 8px 0; text-align: center; justify-content: center; }

  /* ─── 날짜 네비 ─── */
  .datenav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px; }
  .datenav .d { font-size: 17px; font-weight: 900; }
  .datenav .d em { font-style: normal; font-size: 13px; font-weight: 700; color: var(--blue); margin-left: 6px; }
  .navbtn { width: 38px; height: 38px; border-radius: 10px; background: var(--white); border: 1px solid var(--line); font-size: 16px; font-weight: 900; color: var(--mid-gray); }

  /* ─── 진행률 ─── */
  .prog { display: flex; align-items: center; gap: 14px; }
  .ring {
    width: 62px; height: 62px; border-radius: 50%; flex-shrink: 0;
    display: grid; place-items: center; font-weight: 900; color: var(--navy);
    background: conic-gradient(var(--blue) calc(var(--p) * 1%), var(--light-gray) 0);
    position: relative;
  }
  .ring::after { content: ''; position: absolute; inset: 7px; background: var(--white); border-radius: 50%; }
  .ring b { position: relative; z-index: 1; font-size: 15px; }
  .bar { height: 8px; border-radius: 99px; background: var(--light-gray); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--blue); border-radius: 99px; }
  .bar.mini { height: 5px; }
  .bar.doing i { background: var(--amber); }

  /* ─── 업무 항목 ─── */
  .task { display: flex; gap: 12px; align-items: flex-start; padding: 14px 4px; border-bottom: 1px solid var(--light-gray); }
  .task:last-child { border-bottom: none; }
  .task.isblocked { background: #FFF9F8; border-radius: 10px; padding-left: 10px; padding-right: 10px; }
  .box {
    width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0; margin-top: 1px;
    border: 2px solid #D1D5DB; background: var(--white);
    display: grid; place-items: center; color: transparent; font-size: 15px; font-weight: 900;
  }
  .task.done .box { background: var(--blue); border-color: var(--blue); color: var(--white); }
  .task.doing .box { border-color: var(--amber); }
  .task-body { flex: 1; min-width: 0; }
  .task-t { font-size: 15px; font-weight: 700; line-height: 1.45; word-break: keep-all; }
  .task.done .task-t { color: var(--mid-gray); text-decoration: line-through; }
  .task-d { font-size: 13px; color: var(--mid-gray); margin-top: 3px; white-space: pre-wrap; word-break: break-word; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; align-items: center; }
  .tag { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: var(--light-gray); color: var(--mid-gray); }
  .tag.time { background: #EAF6FC; color: var(--deep-blue); }
  .tag.high { background: #FEF2F2; color: var(--coral); }
  .tag.ok   { background: #ECFDF5; color: var(--green); }
  .tag.doing{ background: #FFF7ED; color: var(--amber); }
  .tag.blk  { background: var(--coral); color: var(--white); }
  .tag.carry{ background: #FEF2F2; color: var(--coral); }
  .tag.add  { background: #ECFDF5; color: var(--green); }
  .tag.edit { background: #FFF7ED; color: var(--amber); }
  .note { margin-top: 8px; width: 100%; font-size: 13px; padding: 8px 10px; border: 1px dashed var(--line); border-radius: 8px; background: var(--ivory); }
  .empty { text-align: center; padding: 40px 16px; color: var(--mid-gray); font-size: 14px; }
  .empty b { display: block; font-size: 30px; margin-bottom: 8px; }

  /* ─── 단계 / 가이드 ─── */
  .opener { font-size: 12.5px; font-weight: 700; color: var(--deep-blue); padding: 4px 0; margin-top: 6px; }
  .panel { margin-top: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: #FCFDFE; }
  .guide { background: #F0F9FF; border: 1px solid #D5EBF7; border-radius: 8px; padding: 10px 12px; font-size: 13px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .guide b { display: block; color: var(--deep-blue); font-size: 12px; margin-bottom: 4px; }
  .step { display: flex; gap: 9px; align-items: flex-start; padding: 7px 0; font-size: 13.5px; }
  .sbox {
    width: 20px; height: 20px; border-radius: 6px; flex-shrink: 0; margin-top: 1px;
    border: 2px solid #D1D5DB; background: var(--white);
    display: grid; place-items: center; color: transparent; font-size: 12px; font-weight: 900;
  }
  .step.on .sbox { background: var(--green); border-color: var(--green); color: var(--white); }
  .step.on span { color: var(--mid-gray); text-decoration: line-through; }
  .counter { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; font-weight: 700; }
  .counter input { width: 74px; text-align: center; padding: 8px; }

  /* ─── 주간 그리드 ─── */
  .weekwrap { overflow-x: auto; }
  table.week { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 480px; }
  table.week th, table.week td { border: 1px solid var(--line); padding: 7px 6px; text-align: center; }
  table.week th.n, table.week td.n { text-align: left; width: 38%; font-weight: 700; }
  table.week thead th { background: var(--light-gray); font-size: 12px; color: var(--mid-gray); font-weight: 700; }
  table.week thead th.today { background: var(--navy); color: var(--white); }
  .dot { width: 20px; height: 20px; border-radius: 6px; display: inline-block; background: var(--light-gray); line-height: 20px; color: transparent; font-size: 12px; font-weight: 900; }
  .dot.done { background: var(--blue); color: var(--white); }
  .dot.doing { background: #FCD9A5; color: var(--amber); }
  .dot.blocked { background: var(--coral); color: var(--white); }
  .dot.miss { background: #FDE8E4; }
  .dot.none { background: transparent; }

  /* ─── 직원 현황 ─── */
  .staffcard { display: flex; gap: 14px; align-items: center; }
  .ava { width: 44px; height: 44px; border-radius: 12px; background: var(--navy); color: var(--white); display: grid; place-items: center; font-weight: 900; font-size: 15px; flex-shrink: 0; }

  /* ─── 토스트 / 모달 ─── */
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px);
    background: var(--navy); color: var(--white); padding: 12px 20px; border-radius: 999px;
    font-size: 13.5px; font-weight: 700; opacity: 0; pointer-events: none; transition: all .2s; z-index: 200;
    max-width: 90vw; text-align: center;
  }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  .modal { position: fixed; inset: 0; background: rgba(27,58,92,.55); display: grid; place-items: center; padding: 16px; z-index: 150; }
  .modal-box { background: var(--white); border-radius: 16px; padding: 20px; width: 100%; max-width: 460px; max-height: 88vh; overflow-y: auto; }

  hr.sep { border: none; border-top: 1px solid var(--line); margin: 14px 0; }
  .hint { font-size: 12.5px; color: var(--mid-gray); line-height: 1.65; }
  .newver {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 90;
    background: var(--navy); color: #fff; padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    font-size: 13.5px; font-weight: 700; box-shadow: 0 -4px 16px rgba(0,0,0,.18);
  }
  .newver button { background: #fff; color: var(--navy); font-weight: 900;
    padding: 8px 14px; border-radius: 8px; font-size: 13px; }
  .pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #EAF6FC; color: var(--deep-blue); }
  .pill.warn { background: #FFF7ED; color: var(--amber); }
  .pill.bad { background: #FEF2F2; color: var(--coral); }
  .sect { font-size: 12px; font-weight: 900; color: var(--mid-gray); letter-spacing: .04em; margin: 18px 0 8px; }
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <div class="brand"><span>WB</span> 업무지시서<small>Work Order &amp; Check</small></div>
    <button class="whoami off" id="whoami"><i></i><span>—</span></button>
  </div>
</header>

<nav class="tabs"><div class="wrap" id="tabs"></div></nav>

<main class="wrap" id="view"></main>

<div id="toast"></div>
<div id="modalHost"></div>

<script>
"use strict";

/* ══════════════════════════════════════════════════════
   1. 저장소
   ══════════════════════════════════════════════════════ */
const LS_KEY = 'wb_taskboard_v1';
const DOW = ['일','월','화','수','목','금','토'];

const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id' + Date.now() + Math.random().toString(16).slice(2));
const now = () => Date.now();

function blankState() {
  return {
    version: 2,
    staff: [],
    tasks: [],
    checks: {},
    settings: { adminPin: '', syncUrl: '', syncSecret: '', centerName: 'WB 웩슬러브레인센터' }
  };
}

let state = blankState();

function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      state = Object.assign(blankState(), p);
      state.settings = Object.assign(blankState().settings, p.settings || {});
    }
  } catch (e) { console.warn('load failed', e); }
}

function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  catch (e) { toast('저장 공간이 부족합니다'); }
}

/* ══════════════════════════════════════════════════════
   2. 날짜 유틸
   ══════════════════════════════════════════════════════ */
function ymd(d) {
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function parseYmd(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
function today() { return ymd(new Date()); }
function nowHM() { const d = new Date(); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
function dowOf(s) { return parseYmd(s).getDay(); }
function label(s) { const d = parseYmd(s); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + DOW[d.getDay()] + ')'; }
function shortDate(s) { const d = parseYmd(s); return (d.getMonth() + 1) + '/' + d.getDate(); }
function relLabel(s) {
  const diff = Math.round((parseYmd(s) - parseYmd(today())) / 86400000);
  if (diff === 0) return '오늘';
  if (diff === -1) return '어제';
  if (diff === 1) return '내일';
  return null;
}
function mondayOf(s) { const d = parseYmd(s); return addDays(s, -((d.getDay() + 6) % 7)); }

/* ══════════════════════════════════════════════════════
   3. 도메인 로직
   ══════════════════════════════════════════════════════ */
const liveStaff = () => state.staff.filter(s => !s.deleted);
/** 통계에 넣을 사람 — 대표는 제외한다. 대표 업무가 섞이면 직원 수행률이 흐려진다. */
const teamStaff = () => liveStaff().filter(s => !s.owner);
const owners = () => liveStaff().filter(s => s.owner);
const staffById = id => state.staff.find(s => s.id === id);
const staffByName = n => liveStaff().find(s => s.name === String(n || '').trim());

function occursOn(task, date) {
  if (task.deleted) return false;
  if (task.start && date < task.start) return false;
  if (task.end && date > task.end) return false;
  switch (task.repeat) {
    case 'once':    return date === task.start;
    case 'daily':   return true;
    case 'weekday': { const w = dowOf(date); return w >= 1 && w <= 5; }
    case 'days':    return (task.days || []).includes(dowOf(date));
    default:        return false;
  }
}

function tasksFor(staffId, date) {
  return state.tasks
    .filter(t => t.staffId === staffId && occursOn(t, date))
    .sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99')
                 || (b.priority === 'high') - (a.priority === 'high')
                 || (a.createdAt || 0) - (b.createdAt || 0));
}

const ckey = (taskId, date) => taskId + '|' + date;
const getCheck = (taskId, date) => state.checks[ckey(taskId, date)] || null;
const isDone = (taskId, date) => !!(state.checks[ckey(taskId, date)] || {}).done;

function setCheck(taskId, date, patch) {
  const k = ckey(taskId, date);
  const cur = state.checks[k] || { taskId: taskId, date: date, done: false, note: '', steps: {}, count: 0, blocked: false };
  const next = Object.assign({}, cur, patch, { updatedAt: now() });
  state.checks[k] = next;
  save();
  queueSync();
  return next;
}

/** 단계·수량을 고려한 개별 업무 진행률 */
function taskProgress(t, c) {
  const steps = t.steps || [];
  if (steps.length) {
    const done = steps.filter(s => c && c.steps && c.steps[s.id]).length;
    return { done: done, total: steps.length, unit: '단계', pct: Math.round(done / steps.length * 100) };
  }
  if (t.target) {
    const n = (c && c.count) || 0;
    return { done: n, total: t.target, unit: t.unit || '건', pct: Math.min(100, Math.round(n / t.target * 100)) };
  }
  const d = (c && c.done) ? 1 : 0;
  return { done: d, total: 1, unit: '', pct: d * 100 };
}

/** 미착수 todo / 진행중 doing / 완료 done / 막힘 blocked */
function statusOf(t, date) {
  const c = getCheck(t.id, date);
  if (c && c.blocked) return 'blocked';
  if (c && c.done) return 'done';
  if (taskProgress(t, c).done > 0) return 'doing';
  return 'todo';
}
const STATUS_LABEL = { todo: '미착수', doing: '진행중', done: '완료', blocked: '막힘' };

/** 단계·수량이 다 차면 자동 완료, 되돌리면 자동 해제.
 *  둘 다 있는 업무는 단계도 끝나고 수량도 채워져야 완료다. */
function syncAuto(t, date) {
  const c = getCheck(t.id, date);
  if (!c) return;
  const hasSteps = (t.steps || []).length > 0, hasTarget = !!t.target;
  if (!hasSteps && !hasTarget) return;
  const stepsOk = !hasSteps || t.steps.every(s => c.steps && c.steps[s.id]);
  const countOk = !hasTarget || ((c.count || 0) >= t.target);
  const full = stepsOk && countOk;
  if (full && !c.done) setCheck(t.id, date, { done: true, at: now() });
  else if (!full && c.done) setCheck(t.id, date, { done: false, at: null });
}

function progress(staffId, date) {
  const list = tasksFor(staffId, date);
  const done = list.filter(t => isDone(t.id, date)).length;
  return { done: done, total: list.length, pct: list.length ? Math.round(done / list.length * 100) : 0 };
}

function weekProgress(staffId, anchor) {
  const mon = mondayOf(anchor);
  let done = 0, total = 0;
  for (let i = 0; i < 7; i++) { const p = progress(staffId, addDays(mon, i)); done += p.done; total += p.total; }
  return { done: done, total: total, pct: total ? Math.round(done / total * 100) : 0 };
}

function streak(staffId) {
  let d = today(), n = 0;
  for (let i = 0; i < 120; i++) {
    const p = progress(staffId, d);
    if (p.total === 0) { d = addDays(d, -1); continue; }
    if (p.done < p.total) break;
    n++; d = addDays(d, -1);
  }
  return n;
}

/** 이월: 최근 7일 안에 못 끝낸 '이월' 업무 */
function carryOver(staffId, date) {
  const out = [];
  for (let i = 1; i <= 7; i++) {
    const d = addDays(date, -i);
    tasksFor(staffId, d).forEach(t => {
      if (!t.carry || isDone(t.id, d)) return;
      out.push({ t: t, date: d });
    });
  }
  return out.sort((a, b) => a.date.localeCompare(b.date));
}

/** 그 주에 직원이 스스로 추가한 업무 */
function staffAdded(anchor) {
  const mon = mondayOf(anchor);
  const days = Array.from({ length: 7 }, (_, i) => addDays(mon, i));
  const out = [];
  state.tasks.forEach(t => {
    if (t.deleted || t.origin !== 'staff') return;
    const s = staffById(t.staffId);
    if (!s || s.owner) return;              // 대표가 스스로 넣은 건 '직원 추가'가 아니다
    days.forEach(d => { if (occursOn(t, d)) out.push({ t: t, date: d }); });
  });
  return out.sort((a, b) => a.date.localeCompare(b.date));
}

/** 원장이 바로 봐야 할 것: 막힘 + 예정 시각이 지난 미완료 */
function alertsToday() {
  const d = today(), hm = nowHM();
  let blocked = 0, overdue = 0;
  liveStaff().forEach(s => tasksFor(s.id, d).forEach(t => {
    const c = getCheck(t.id, d);
    if (c && c.blocked) { blocked++; return; }
    if (c && c.done) return;
    if (t.time && t.time < hm) overdue++;
  }));
  return { blocked: blocked, overdue: overdue, total: blocked + overdue };
}

/* ══════════════════════════════════════════════════════
   4. 동기화 (선택) — Google Apps Script 웹앱
   ══════════════════════════════════════════════════════ */
/* 동기화 — Cloudflare Workers + D1
 * 예전에는 매번 전체 상태를 통째로 주고받았다. 학생이 100명이 되면
 * 한 명이 체크 하나를 눌러도 나머지 99명 데이터가 오가서 감당이 안 된다.
 * 지금은 (1) 마지막 동기화 이후 바뀐 것만 (2) 학생은 자기 것만 주고받는다. */
const SYNC_URL = 'https://wb-sync.whdudwns33.workers.dev';
const SYNC_APP = 'task';

/** 이 체크가 누구 것인지 — 서버가 학생별로 나눠 담는 기준이 된다.
 *  '__st__S1|2026-08-02' → S1,  '<taskId>|날짜' → 그 업무의 담당자 */
function ownerOfCheck(key) {
  const tid = String(key).split('|')[0];
  const m = tid.match(/^__[a-zA-Z]+__(.+)$/);
  if (m) return m[1];
  const t = (state.tasks || []).find(x => x.id === tid);
  return t ? (t.staffId || null) : null;
}

const sync = {
  busy: false, dirty: false, last: null, timer: null, loud: false, err: '',

  /** 원장은 비밀키로, 학생은 개인 링크에 담겨 온 토큰으로 접속한다 */
  auth() {
    if (session.isStaffLink) {
      const t = state.settings.myToken || '';
      return t ? { mode: 'person', id: session.staffId, token: t } : null;
    }
    const k = state.settings.syncSecret || '';
    return k ? { mode: 'admin', secret: k } : null;
  },
  enabled() { return !!this.auth(); },

  /** since 이후 바뀐 것만 모은다. 각 레코드가 이미 updatedAt을 갖고 있어
   *  저장 지점마다 표시를 남기지 않아도 변경분을 정확히 골라낼 수 있다. */
  collect(since) {
    const out = [];
    (state.staff || []).forEach(s => {
      if ((s.updatedAt || 0) > since) out.push({ table: 'staff', id: s.id, owner: s.id, data: s, updated_at: s.updatedAt || 0 });
    });
    (state.tasks || []).forEach(t => {
      if ((t.updatedAt || 0) > since) out.push({ table: 'tasks', id: t.id, owner: t.staffId || null, data: t, updated_at: t.updatedAt || 0 });
    });
    Object.keys(state.checks || {}).forEach(k => {
      const c = state.checks[k];
      if (c && (c.updatedAt || 0) > since) out.push({ table: 'checks', k: k, owner: ownerOfCheck(k), data: c, updated_at: c.updatedAt || 0 });
    });
    return out;
  },

  /** 받은 변경을 반영한다. 내 것이 더 최신이면 그대로 둔다 */
  apply(changes) {
    let n = 0;
    (changes || []).forEach(ch => {
      if (!ch || !ch.data) return;
      const at = ch.data.updatedAt || 0;
      if (ch.table === 'checks') {
        const cur = state.checks[ch.key];
        if (!cur || at > (cur.updatedAt || 0)) { state.checks[ch.key] = ch.data; n++; }
      } else if (ch.table === 'staff' || ch.table === 'tasks') {
        const arr = state[ch.table];
        const i = arr.findIndex(x => x.id === ch.key);
        if (i < 0) { arr.push(ch.data); n++; }
        else if (at > (arr[i].updatedAt || 0)) { arr[i] = ch.data; n++; }
      }
    });
    return n;
  },

  async post(path, body) {
    const res = await fetch(SYNC_URL + path, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const d = await res.json().catch(() => null);
    if (!d || d.ok !== true) throw new Error((d && d.error) || ('HTTP ' + res.status));
    return d;
  },

  async run() {
    const auth = this.auth();
    if (!auth || this.busy) return;
    this.busy = true; paintStatus();
    try {
      const t0 = now();
      const pending = this.collect(Number(state.settings.pushAt) || 0);
      let guard = 0, again = true;
      while (again && guard++ < 60) {
        const batch = pending.splice(0, 400);
        const d = await this.post('/sync', {
          app: SYNC_APP, auth: auth,
          since: Number(state.settings.pullAt) || 0,
          changes: batch
        });
        this.apply(d.changes);
        state.settings.pullAt = d.now;
        again = !!d.more || pending.length > 0;
      }
      // 요청 도중에 바뀐 것은 updatedAt이 t0보다 크므로 다음 회차에 올라간다
      state.settings.pushAt = t0;
      save();
      this.last = now(); this.dirty = false; this.err = '';
      render();
    } catch (e) {
      console.warn('sync', e);
      this.dirty = true; this.err = String(e && e.message || e);
      if (this.loud) toast('동기화 실패 — ' + this.err);
    } finally {
      this.busy = false; this.loud = false; paintStatus();
    }
  },

  /** 개인 링크용 토큰 발급 (원장만). 링크마다 다른 토큰이라 하나가 새어도 그 학생 것만 열린다 */
  async issueToken(staffId) {
    const auth = this.auth();
    if (!auth || auth.mode !== 'admin') throw new Error('원장 화면에서만 발급할 수 있습니다');
    const d = await this.post('/token', { app: SYNC_APP, auth: auth, staffId: staffId });
    return d.token;
  }
};

function queueSync() {
  if (!sync.enabled()) return;
  sync.dirty = true;
  clearTimeout(sync.timer);
  sync.timer = setTimeout(() => sync.run(), 1200);
}

function unb64(s) { return decodeURIComponent(escape(atob(String(s).replace(/-/g, '+').replace(/_/g, '/')))); }

let pendingAdd = null;   // 링크로 들어온 지시서 — 확인 후 등록

/** 링크에 담겨 온 것들을 흡수한다.
 *  s=  동기화 설정 (직원 기기 세팅 대신)
 *  add= 지시서 묶음 (원장이 링크 한 번으로 등록) */
function absorbLinkParams() {
  const q = new URLSearchParams(location.search);
  let touched = false;

  const tk = q.get('t');
  if (tk) { state.settings.myToken = tk; save(); }

  const s = q.get('s');
  if (s) {
    try {
      const cfg = JSON.parse(unb64(s));
      if (cfg.k) state.settings.syncSecret = cfg.k;
      // 원장 복구 링크에는 비밀번호도 담긴다 — 새 기기에서 다시 정하지 않아도 되게
      if (cfg.p && !new URLSearchParams(location.search).get('u')) {
        state.settings.adminPin = cfg.p;
        session.unlock();
      }
      save();
    } catch (e) { console.warn('link config', e); }
    q.delete('s'); touched = true;
  }

  // 지시서는 주소창에 남지 않도록 해시(#add=)를 우선 쓴다
  let raw = null;
  const m = location.hash.match(/[#&]add=([^&]+)/);
  if (m) raw = m[1];
  else if (q.get('add')) { raw = q.get('add'); q.delete('add'); touched = true; }

  if (raw) {
    try {
      const p = JSON.parse(unb64(raw));
      const list = Array.isArray(p) ? p : (p.assignments || []);
      if (list.length) pendingAdd = list;
    } catch (e) { console.warn('link add', e); }
  }

  if (touched || m) {
    history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '') + (m ? '' : location.hash));
  }
}

function riskMap() {

const OP_ALL = ['스터디포스', '클래스카드'];
const OP_LOW = 2;   // 주 이 횟수 이하면 저조로 본다

const opProgs = name => ((state.checks['__opset__' + name + '|all'] || {}).progs) || [];
const opCnt = (name, mon) => ((state.checks['__op__' + name + '|' + mon] || {}).cnt) || {};
const opSum = (name, mon) => {

  return opProgs(name).reduce((a, p) => a + (Number(c[p]) || 0), 0);
};
/** 온라인 미접속은 정답률 하락보다 훨씬 먼저 나타나는 이탈 신호다 */
function opRisk(name) {
  const progs = opProgs(name);
  if (!progs.length) return [];
  const thisMon = mondayOf(today()), lastMon = addDays(thisMon, -7);
  const rec = state.checks['__op__' + name + '|' + lastMon];
  if (!rec) return [];                       // 아직 기록이 시작 안 된 학생은 신호로 보지 않는다
  const a = opSum(name, lastMon), b = opSum(name, addDays(thisMon, -14));
  if (a === 0 && b === 0) return [['온라인 2주 미접속', 'bad']];
  if (a === 0) return [['온라인 지난주 0회', 'bad']];
  if (a <= OP_LOW) return [['온라인 지난주 ' + a + '회', 'warn']];
  return [];
}

let opTarget = null;   // 지금 열려 있는 온라인 프로그램 모달의 학생
function opModal(name) {
  opTarget = name;
  const mon = mondayOf(today()), last = addDays(mon, -7);
  const progs = opProgs(name), cur = opCnt(name, mon), prev = opCnt(name, last);
  modal('📱 ' + name + ' 온라인 프로그램',
    '<div class="fl mb8">이용 중인 프로그램</div><div class="chips mb14" id="opProgs">' +
      OP_ALL.map(p => '<button type="button" class="chip ' + (progs.includes(p) ? 'on' : '') +
        '" data-act="opprog" data-v="' + p + '">' + p + '</button>').join('') + '</div>' +
    (progs.length
      ? '<hr class="sep"><div class="fl mb8">이번 주 학습 횟수 (' + shortDate(mon) + ' 주)</div>' +
        progs.map(p => '<div class="between mb8"><span class="small">' + esc(p) + '</span>' +
          '<span class="row" style="gap:8px">' +
          '<span class="small muted">지난주 ' + (Number(prev[p]) || 0) + '회</span>' +
          '<input class="in" type="number" min="0" max="7" style="max-width:90px" data-opcnt="' + esc(p) + '" value="' +
            (Number(cur[p]) || 0) + '"></span></div>').join('') +
        '<div class="hint">프로그램 관리자에서 확인한 지난 7일 학습 횟수를 넣으세요. 주 1회만 갱신하면 됩니다.<br>' +
        '정답률·진행단원은 여기 넣지 않습니다 — 구독 명단 시트가 정본입니다.</div>'
      : '<div class="hint">프로그램을 먼저 선택하세요.</div>'),
    (progs.length
      ? '<button class="btn btn-primary btn-block mt14" data-act="opsave" data-name="' + esc(name) + '">저장</button>'
      : ''));
}

/** 누가 만들고 누가 고쳤는지 — 원장 화면에서만 표시한다 */
function originTags(t) {
  if (session.isStaffLink) return '';
  let h = '';
  if (t.origin === 'staff') h += '<span class="tag add">직원 추가</span>';
  else if (t.origin === 'manager') h += '<span class="tag edit">관리자 발행</span>';
  else if (t.lastEditBy === 'staff') h += '<span class="tag edit">직원 수정</span>';
  return h;
}

/** 지시 내용을 고칠 수 있는가.
 *  원장은 전부. 직원은 자기가 추가한 업무만 — 원장이 내린 지시는 못 건드린다.
 *  (직원도 체크·단계·수량·메모·막힘은 언제나 가능하다) */
function canEditTask(t) {
  if (!session.isStaffLink) return session.isAdmin;
  return t.origin === 'staff' && t.staffId === session.staffId;
}

function paintStatus() {
  const el = $('#whoami');
  const me = currentStaff();
  let text, on = false;
  if (session.isStaffLink) { text = me ? me.name + ' 선생님' + (isManager() ? ' · 관리자' : '') : '알 수 없는 링크'; on = !!me; }
  else if (session.isAdmin) { text = '원장 모드'; on = true; }
  else { text = '잠김'; }
  if (sync.busy) text += ' · 동기화중';
  else if (sync.enabled() && sync.dirty) text += ' · 대기';
  el.innerHTML = '<i></i><span>' + esc(text) + '</span>';
  el.classList.toggle('off', !on);

function currentStaff() {
  if (session.isStaffLink) return staffById(session.staffId);
  return staffById(viewStaff) || liveStaff()[0] || null;
}

function viewToday() {
  const me = currentStaff();
  if (!me) return emptyStaffCard();

  const rel = relLabel(cursor);
  const list = tasksFor(me.id, cursor);
  const p = progress(me.id, cursor);
  const editable = session.isStaffLink || session.isAdmin;
  const carry = (cursor === today()) ? carryOver(me.id, cursor) : [];

  let h = '';
  if (!session.isStaffLink) h += staffSwitcher(me.id);

  h += '<div class="datenav">' +
    '<button class="navbtn" data-act="day" data-n="-1">‹</button>' +
    '<div class="d">' + label(cursor) + (rel ? '<em>' + rel + '</em>' : '') + '</div>' +
    '<button class="navbtn" data-act="day" data-n="1">›</button></div>';

  const counts = { todo: 0, doing: 0, done: 0, blocked: 0 };
  list.forEach(t => counts[statusOf(t, cursor)]++);

  h += '<div class="card"><div class="prog">' +
    '<div class="ring" style="--p:' + p.pct + '"><b>' + p.pct + '%</b></div>' +
    '<div style="flex:1">' +
      '<div class="card-title">' + esc(me.name) + ' 선생님</div>' +
      '<div class="card-sub mb8">' +
        (list.length
          ? '완료 ' + counts.done + ' · 진행중 ' + counts.doing + ' · 미착수 ' + counts.todo +
            (counts.blocked ? ' · <b style="color:var(--coral)">막힘 ' + counts.blocked + '</b>' : '') +
            (p.total && p.done === p.total ? ' · 오늘 완료 🎉' : '')
          : '지시된 업무가 없습니다') +
      '</div>' +
      '<div class="bar"><i style="width:' + p.pct + '%"></i></div>' +
    '</div></div></div>';

  if (session.isStaffLink && cursor === today()) {
    const att = attOf(me.id, cursor);
    let attUi;
    if (!att || !att.done) {
      attUi = '<button class="btn btn-sm btn-primary" data-act="attcheck">출근했습니다</button>';
    } else if (!att.out) {
      attUi = '<div class="row" style="gap:8px"><span class="pill">' + fmtTime(att.at) + ' 출근</span>' +
        '<button class="btn btn-sm btn-navy" data-act="attout">퇴근했습니다</button>' +
        '<button class="btn btn-sm btn-ghost" data-act="attcheck">취소</button></div>';
    } else {
      attUi = '<div class="row" style="gap:8px"><span class="pill">' + fmtTime(att.at) + ' ~ ' + fmtTime(att.out) + '</span>' +
        '<button class="btn btn-sm btn-ghost" data-act="attout">퇴근 취소</button></div>';
    }
    h += '<div class="card" style="padding:12px"><div class="between">' +
      '<div class="card-title">🕘 출퇴근</div>' + attUi + '</div>' +
      '<button class="btn btn-sm btn-ghost mt8" data-act="atteditopen" data-id="' + me.id + '">✏️ 최근 기록 수정 (실수로 안 눌렀을 때)</button></div>';

    // 📞 이번 달 학부모 연락 — 담당 학생별 월 1회가 기본 업무.
    // 연락 기록에서 자동 집계되고 매월 1일 저절로 리셋된다.
    if (!rosterDb && !rosterErr) loadRoster();
    if (rosterDb) {
      const ym = today().slice(0, 7);
      const mine = (rosterDb.students || []).filter(s =>
        String(s.teacher || '').split('·').includes(me.name) &&
        s.start <= ym && (!s.end || s.end > ym));
      if (mine.length) {
        const left = mine.filter(s => !contactsOf(s.name).some(c => String(c.date).slice(0, 7) === ym));
        const done = mine.length - left.length;
        const pct = Math.round(done / mine.length * 100);
        h += '<div class="card" style="padding:12px">' +
          '<div class="between mb8"><div class="card-title">📞 이번 달 학부모 연락</div>' +
          '<span class="pill ' + (left.length ? '' : 'ok') + '">' + done + '/' + mine.length + '명</span></div>' +
          '<div class="bar mb8"><i style="width:' + pct + '%"></i></div>' +
          (left.length
            ? '<div class="small muted" style="margin-bottom:6px">아직 이번 달 연락을 못 한 학생 — 누르면 바로 기록할 수 있어요</div>' +

          '</div>';
      }
    }
  }

  if (editable && cursor === today()) {
    h += '<div class="card" style="padding:12px">' +
      '<div class="row" style="gap:8px">' +
        '<input class="in" id="qAdd" placeholder="빠른 추가 — 예) 3시까지 보호자께 전화">' +
        '<button class="btn btn-primary" data-act="qadd">추가</button>' +
      '</div></div>';
  }

  if (carry.length) {
    h += '<div class="sect">지난 미완료 — 오늘로 넘어왔습니다</div>' +
      '<div class="card alert">' + carry.map(x => taskRow(x.t, x.date, editable, true)).join('') + '</div>';
  }

  if (!list.length) {
    if (!carry.length) h += '<div class="card"><div class="empty"><b>🗓️</b>이 날짜에 지시된 업무가 없습니다.</div></div>';
  } else {
    if (carry.length) h += '<div class="sect">오늘 할 일</div>';
    h += '<div class="card">' + list.map(t => taskRow(t, cursor, editable, false)).join('') + '</div>';
  }

  if (editable) {
    h += '<button class="btn btn-ghost btn-block mb8" data-act="newtask">＋ 업무 추가</button>';
  }
  if (session.isStaffLink) {
    h += '<button class="btn btn-navy btn-block" data-act="report">오늘 수행 보고 문자 만들기</button>' +
      '<div class="hint" style="text-align:center;margin-top:10px">체크는 자동 저장됩니다.</div>';
  }
  return h;
}

function taskRow(t, date, editable, isCarry) {
  const c = getCheck(t.id, date);
  const st = statusOf(t, date);
  const prog = taskProgress(t, c);
  const hasDetail = (t.steps || []).length || t.guide || t.target;
  const open = openPanels.has(t.id + '|' + date);

  let h = '<div class="task ' + st + (st === 'blocked' ? ' isblocked' : '') + '" data-task="' + t.id + '">' +
    '<button class="box" ' + (editable ? 'data-act="toggle" data-id="' + t.id + '" data-date="' + date + '"' : 'disabled') + '>✓</button>' +
    '<div class="task-body">' +
      '<div class="task-t">' + esc(t.title) + '</div>' +
      (t.detail ? '<div class="task-d">' + esc(t.detail) + '</div>' : '') +
      '<div class="meta">' +
        (isCarry ? '<span class="tag carry">⚠ ' + shortDate(date) + ' 미완료</span>' : '') +
        (t.time ? '<span class="tag time">' + esc(t.time) + '</span>' : '') +
        (t.priority === 'high' ? '<span class="tag high">중요</span>' : '') +
        (st === 'blocked' ? '<span class="tag blk">막힘</span>' : '') +
        (st === 'doing' ? '<span class="tag doing">진행중 ' + prog.done + '/' + prog.total + prog.unit + '</span>' : '') +
        (!isCarry ? '<span class="tag">' + esc(repeatLabel(t)) + '</span>' : '') +
        (st === 'done' && c && c.at ? '<span class="tag ok">✓ ' + new Date(c.at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) + ' 완료</span>' : '') +
        (c && c.att && ATT_LABEL[c.att] ? '<span class="tag ' + ATT_LABEL[c.att][1] + '">' + ATT_LABEL[c.att][0] + '</span>' : '') +
        originTags(t) +
      '</div>';

  if (hasDetail && st !== 'done') {
    h += '<div class="bar mini ' + (st === 'doing' ? 'doing' : '') + '" style="margin-top:8px"><i style="width:' + prog.pct + '%"></i></div>';
  }
  if (hasDetail) {
    h += '<button class="opener" data-act="panel" data-id="' + t.id + '" data-date="' + date + '">' +
      (open ? '▾ 접기' : '▸ 하는 방법 · 단계 열기' + ((t.steps || []).length ? ' (' + prog.done + '/' + prog.total + ')' : '')) + '</button>';
  }
  if (open) h += taskPanel(t, date, c, editable);

  h += (editable
      ? '<input class="note" data-act="note" data-id="' + t.id + '" data-date="' + date + '" value="' + esc((c && c.note) || '') + '" placeholder="' +
        (isLesson(t) ? '메모 — +잘한점 / -보완점 / 숙제○○ 로 쓰면 피드백 문구에 자동 배치' : '메모 · 막힌 이유나 특이사항을 남기세요') + '">'
      : ((c && c.note) ? '<div class="note">' + esc(c.note) + '</div>' : ''));

  return h + '</div></div>';
}

function taskPanel(t, date, c, editable) {
  let h = '<div class="panel">';

  if (t.guide) h += '<div class="guide"><b>📘 이렇게 하세요</b>' + esc(t.guide) + '</div>';

  if ((t.steps || []).length) {
    h += '<div style="margin-top:10px">' + t.steps.map((s, i) => {
      const on = !!(c && c.steps && c.steps[s.id]);
      return '<div class="step ' + (on ? 'on' : '') + '">' +
        '<button class="sbox" ' + (editable ? 'data-act="step" data-id="' + t.id + '" data-date="' + date + '" data-step="' + s.id + '"' : 'disabled') + '>✓</button>' +
        '<span>' + (i + 1) + '. ' + esc(s.label) + '</span></div>';
    }).join('') + '</div>';
  }

  if (t.target) {
    h += '<div class="counter"><span>진행 수량</span>' +
      '<button class="btn btn-sm btn-ghost" ' + (editable ? 'data-act="cnt" data-id="' + t.id + '" data-date="' + date + '" data-n="-1"' : 'disabled') + '>−</button>' +
      '<input class="in" type="number" min="0" ' + (editable ? 'data-act="cntset" data-id="' + t.id + '" data-date="' + date + '"' : 'readonly') + ' value="' + ((c && c.count) || 0) + '">' +
      '<button class="btn btn-sm btn-ghost" ' + (editable ? 'data-act="cnt" data-id="' + t.id + '" data-date="' + date + '" data-n="1"' : 'disabled') + '>＋</button>' +
      '<span class="muted">/ ' + t.target + esc(t.unit || '건') + '</span></div>';
  }

  if (editable && isLesson(t)) {
    const att = (c && c.att) || '';
    h += '<div class="row wraprow mt14" style="gap:6px"><span class="fl" style="margin:0">학생 출결</span>' +
      [['P', '출석'], ['L', '지각'], ['A', '결석']].map(([v, l]) =>
        '<button class="chip ' + (att === v ? 'on' : '') + '" data-act="latt" data-id="' + t.id + '" data-date="' + date + '" data-v="' + v + '">' + l + '</button>'
      ).join('') + '</div>';
  }

  if (editable) {
    const blocked = !!(c && c.blocked);
    h += '<div class="row wraprow mt14" style="gap:8px">' +
      '<button class="btn btn-sm ' + (blocked ? 'btn-danger' : 'btn-warn') + '" ' +
        'data-act="block" data-id="' + t.id + '" data-date="' + date + '">' +
        (blocked ? '✓ 막힘 해제' : '🚧 막혔어요') + '</button>' +
      (isLesson(t)
        ? '<button class="btn btn-sm btn-navy" data-act="fbtext" data-id="' + t.id + '" data-date="' + date + '">💬 학부모 피드백 문구</button>' +
          '<button class="btn btn-sm btn-ghost" data-act="ctlog" data-name="' + esc(studentOf(t)) + '">📞 연락 기록</button>'
        : '') +
      (t.title.startsWith('[주문] ')
        ? '<button class="btn btn-sm btn-navy" data-act="ordermsg" data-id="' + t.id + '">📱 발주 문자 보내기</button>'
        : '') +
      (canEditTask(t) ? '<button class="btn btn-sm btn-ghost" data-act="etask" data-id="' + t.id + '">✏️ 업무 수정</button>' : '') +
    '</div>';
  }
  return h + '</div>';
}

];
const FB_MINUS = [
  ['어휘', '어휘력'], ['추론 문제', '추론 유형'], ['실수', '아는 문제에서의 실수'],

const FB_BANK = {
  best: ['오늘은 시작부터 끝까지 집중이 아주 좋았습니다.', '오늘 컨디션이 좋아서 수업 흐름이 유난히 매끄러웠어요.',

  good: ['오늘 수업 태도가 안정적이었어요.', '차분하게 잘 따라온 하루였습니다.',
    '전반적으로 성실하게 참여했습니다.', '수업 리듬이 잘 잡힌 날이었어요.'],

    '큰 기복 없이 계획한 분량을 마쳤습니다.'],
  shaky: ['오늘은 집중이 조금 흔들리는 날이었어요.', '중반에 집중이 잠깐 풀렸지만 다시 잡고 잘 마무리했습니다.',
    '컨디션이 다소 처져 보였지만 끝까지 해냈습니다.'],
  plusPat: ['특히 {x}이 좋았습니다.', '오늘은 {x}이 눈에 띄었어요.', '{x}을 크게 칭찬해 주었습니다.',
    '무엇보다 {x}이 반가웠습니다.', '{x}에서 성장이 보였어요.', '{x}이 오늘의 하이라이트였습니다.'],
  minusPat: ['다만 {y} 부분은 조금 더 챙겨보려고 합니다.', '{y} 부분은 다음 수업에서 이어서 잡아가겠습니다.',
    '{y} 쪽이 아직 아쉬워서 반복해서 다져갈 계획입니다.', '{y} 부분은 서두르지 않고 차근차근 보완하겠습니다.'],
  closer: ['지금 흐름이 좋아서 이대로 이어가겠습니다.', '다음 시간도 오늘 같은 흐름으로 진행하겠습니다.',
    '좋은 페이스라 그대로 밀고 가겠습니다.']
};
function seedPick(arr, seedStr, salt) {
  let h = salt * 2654435761 >>> 0;
  const s = String(seedStr);
  for (let i = 0; i < s.length; i++) h = ((h * 31) + s.charCodeAt(i)) >>> 0;
  return arr[h % arr.length];
}
function buildComment(ctx, seedStr) {
  const parts = [];
  parts.push(seedPick(FB_BANK[ctx.focus || 'good'], seedStr, 1));
  (ctx.plus || []).slice(0, 2).forEach((idx, i) => {
    parts.push(seedPick(FB_BANK.plusPat, seedStr, 2 + i).replace('{x}', FB_PLUS[idx][1]));
  });
  const m = ctx.minus == null ? null : FB_MINUS[ctx.minus];
  if (m && m[1]) parts.push(seedPick(FB_BANK.minusPat, seedStr, 5).replace('{y}', m[1]));
  else parts.push(seedPick(FB_BANK.closer, seedStr, 6));
  return parts.join(' ');
}

/** 학부모 피드백 문구 — 그날의 체크·메모에서 조립한다.
 *  메모 규칙: '+' 잘한 점 / '-' 보완점 / '숙제 ○○' 숙제 / 그 외는 코멘트.
 *  템플릿 구조라 톤이 항상 같고, 점수 비교·진단성 표현이 들어갈 자리가 없다. */
function feedbackText(t, date, genComment) {
  const c = getCheck(t.id, date);
  const student = studentOf(t);
  const doneSteps = (t.steps || []).filter(s => c && c.steps && c.steps[s.id]).map(s => s.label);

  const plus = [], minus = [], hw = [], etc = [];
  ((c && c.note) || '').split(/\n|\//).map(x => x.trim()).filter(Boolean).forEach(line => {
    if (line.startsWith('+')) plus.push(line.slice(1).trim());
    else if (line.startsWith('-') || line.startsWith('−')) minus.push(line.slice(1).trim());
    else if (/^숙제/.test(line)) hw.push(line.replace(/^숙제[:\s]*/, '').trim());
    else etc.push(line);
  });

  let out = '안녕하세요 어머님, WB 웩슬러브레인센터입니다 :)\n' +
    '오늘 ' + student + ' 학생 수업 내용 전해드립니다.\n\n';
  if (doneSteps.length) out += '▪ 오늘 진행\n' + doneSteps.map(s => '· ' + s).join('\n') + '\n\n';
  if (genComment) out += '▪ 선생님 코멘트\n' + genComment + '\n\n';
  if (plus.length) out += '▪ 오늘 잘한 점\n' + plus.map(s => '· ' + s).join('\n') + '\n\n';
  if (minus.length) out += '▪ 다음에 함께 봐주시면 좋은 점\n' + minus.map(s => '· ' + s).join('\n') + '\n\n';
  if (!genComment && etc.length) out += '▪ 선생님 코멘트\n' + etc.map(s => '· ' + s).join('\n') + '\n\n';
  if (genComment && etc.length) out += '▪ 덧붙임\n' + etc.map(s => '· ' + s).join('\n') + '\n\n';
  if (hw.length) out += '▪ 숙제\n' + hw.map(s => '· ' + s).join('\n') + '\n\n';
  out += '궁금한 점 있으시면 편하게 답장 주세요 :)';
  return out;
}

    '<button class="navbtn" data-act="week" data-n="1">›</button></div>';

    '<div class="card-title">이번 주 달성률</div>' +

  h += '<div class="card weekwrap"><table class="week"><thead><tr><th class="n">업무</th>' +
    days.map(d => '<th class="' + (d === today() ? 'today' : '') + '">' + DOW[dowOf(d)] + '<br>' + parseYmd(d).getDate() + '</th>').join('') +
    '</tr></thead><tbody>' +

    '</tbody></table></div>' +
    '<div class="hint">🔵 완료 · 🟠 진행중 · 🔴 막힘 · 🩷 지난 날짜 미완료. 칸을 눌러 바로 체크할 수 있습니다.</div>';
  return h;

/** 급여용 출퇴근 내보내기 — 대표 전용. 아카플로우 등 외부 급여 계산과는
 *  이 CSV 하나로만 연결한다 (단방향: 앱 → 급여, 역방향 없음). */
function daysInMonth(ym) {
  const y = Number(ym.slice(0, 4)), m = Number(ym.slice(5, 7));
  const last = new Date(y, m, 0).getDate();
  const out = [];
  for (let d = 1; d <= last; d++) out.push(ym + '-' + String(d).padStart(2, '0'));
  return out;
}
/** 급여 대상 직원 — teamStaff()와 달리 삭제(퇴사) 여부를 안 가린다.
 *  퇴사한 달의 급여는 여전히 계산해야 하므로, 그 달에 근무 기록이 있으면 포함한다. */
const payrollStaff = () => state.staff.filter(s => !s.owner);

function payrollRows(ym) {
  const rows = [];
  payrollStaff().forEach(s => {
    daysInMonth(ym).forEach(d => {
      const a = attOf(s.id, d);
      if (!a || !a.done) return;
      const valid = a.at && a.out && a.out > a.at;
      rows.push({
        name: s.name, date: d, inT: a.at ? fmtTime(a.at) : '', outT: a.out ? fmtTime(a.out) : '',
        hours: valid ? Math.round((a.out - a.at) / 3600000 * 100) / 100 : null,
        issue: !a.at ? '출근 미기록' : !a.out ? '퇴근 미기록' : !valid ? '시간 확인 필요(퇴근이 출근보다 빠름)' : ''
      });
    });
  });
  rows.sort((a, b) => a.name === b.name ? a.date.localeCompare(b.date) : a.name.localeCompare(b.name));
  return rows;
}
function payrollCsv(ym) {
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const rows = payrollRows(ym);
  let csv = '﻿' + ['이름', '날짜', '출근', '퇴근', '근무시간(시간)', '비고'].map(q).join(',') + '\n';
  rows.forEach(r => {
    csv += [r.name, r.date, r.inT, r.outT, r.hours != null ? r.hours.toFixed(2) : '', r.issue].map(q).join(',') + '\n';
  });
  // 직원별 월 합계 — 급여 계산에 바로 쓸 수 있게 CSV 끝에 덧붙인다
  const totals = {};
  rows.forEach(r => { if (r.hours != null) totals[r.name] = (totals[r.name] || 0) + r.hours; });
  if (Object.keys(totals).length) {
    csv += '\n' + ['이름', '합계 근무시간(시간)'].map(q).join(',') + '\n';
    Object.keys(totals).forEach(name => {
      csv += [name, totals[name].toFixed(2)].map(q).join(',') + '\n';
    });
  }
  return csv;
}
function downloadFile(filename, text, mime) {
  const blob = new Blob([text], { type: mime + ';charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function payrollModal() {
  const ym = today().slice(0, 7);
  const n = payrollRows(ym).length;
  modal('📅 급여용 출퇴근 내보내기',

    '<input class="in" type="month" id="payYm" value="' + ym + '" style="margin-bottom:10px">' +
    '<div class="hint">근무시간은 출근~퇴근 시각 차이로 자동 계산됩니다.<br>퇴근 체크를 안 한 날은 "퇴근 미기록"으로 표시되니 정산 전에 확인해 주세요.<br>이번 달 현재 기록 ' + n + '건.</div>',
    '<button class="btn btn-primary btn-block mt14" data-act="paydownload">CSV 다운로드</button>');

/* ── 교재 DB ──
 * 데이터는 같은 폴더의 textbooks.json (정적 파일 — 동기화 무게 0, 수정은 저장소에서).
 * 학생별 현재 위치(◀)와 남은 분량·예상 소요를 함께 보여준다. */
let bookDb = null, bookDbErr = '';
const bookOpen = new Set();
function loadBooks() {
  fetch('textbooks.json?v=' + Date.now())
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(d => { bookDb = d; if (route === 'books') render(); })
    .catch(e => { bookDbErr = String(e); if (route === 'books') render(); });
}

function bookStudents(bookId) {
  return ((bookDb && bookDb.students) || []).filter(s => s.bookId === bookId);
}
function flatSections(b) {
  const out = [];
  (b.units || []).forEach(u => (u.sections || []).forEach(sec => out.push({ unit: u.name, sec: sec })));
  return out;
}
function posOf(b, at) {
  if (!at) return -1;
  const f = flatSections(b);
  for (let i = 0; i < f.length; i++) if (f[i].sec.includes(at) || at.includes(f[i].sec)) return i;
  return -1;
}

function viewBooks() {
  if (!bookDb && !bookDbErr) { loadBooks(); return '<div class="card"><div class="empty"><b>📚</b>교재 데이터를 불러오는 중…</div></div>'; }
  if (bookDbErr) return '<div class="card"><div class="empty"><b>⚠️</b>교재 데이터를 불러오지 못했습니다.<br><span class="muted">' + esc(bookDbErr) + '</span></div></div>';

  let h = '<div class="card"><div class="card-title">📚 교재 DB</div>' +
    '<div class="card-sub">소단원 목차와 학생별 현재 위치. 교재를 누르면 목차가 열립니다.<br>' +
    '기준일 ' + esc(bookDb.updated || '') + ' · 목차 수정은 원장님이 저에게 말로 지시하면 반영됩니다.</div></div>';

  (bookDb.books || []).forEach(b => {
    const f = flatSections(b);
    const studs = bookStudents(b.id);
    const open = bookOpen.has(b.id);
    const orders = state.tasks.filter(t => !t.deleted && t.title === '[주문] ' + b.title);
    const openOrders = orders.filter(t =>
      !Object.keys(state.checks).some(k => state.checks[k].taskId === t.id && state.checks[k].done));

    h += '<div class="card">' +
      '<div class="between" data-act="bkopen" data-id="' + b.id + '" style="cursor:pointer">' +
        '<div><div class="card-title">' + esc(b.title) +
          (b.verify ? ' <span class="tag edit">검증필요</span>' : '') +
          (openOrders.length ? ' <span class="tag high">🛒 주문 진행 ' + openOrders.length + '</span>' : '') + '</div>' +
        '<div class="small muted">' + esc(b.subject) + ' · ' + esc(b.level) +
          (f.length ? ' · 소단원 ' + f.length + '개' : ' · 목차 없음') +
          ' · 주문처: ' + (b.vendor ? esc(b.vendor) : '<span style="color:var(--amber)">미등록</span>') + '</div></div>' +
        '<div class="row" style="gap:8px;flex-shrink:0">' +
          '<button class="btn btn-sm btn-ghost" data-act="bkorder" data-id="' + b.id + '">🛒 주문</button>' +
          '<span class="muted">' + (open ? '▾' : '▸') + '</span></div></div>';

    studs.forEach(st => {
      const idx = posOf(b, st.at);
      const done = idx >= 0 ? idx : 0;
      const remain = f.length ? f.length - done : 0;
      const weeks = (st.perWeek && remain) ? Math.ceil(remain / st.perWeek) : 0;
      const pct = f.length ? Math.round(done / f.length * 100) : 0;
      h += '<hr class="sep"><div class="small"><b>' + esc(st.name) + '</b>' +
        (st.teacher ? ' <span class="muted">(' + esc(st.teacher) + ')</span>' : '') +
        (idx >= 0 ? ' — 현재 <b>' + esc(f[idx].sec) + '</b>' : (st.at ? ' — 위치 미확인' : '')) + '</div>' +
        (f.length ? '<div class="bar" style="margin:6px 0 4px"><i style="width:' + pct + '%"></i></div>' +
          '<div class="small muted">진행 ' + done + '/' + f.length +
          (weeks ? ' · 주 ' + st.perWeek + '회 기준 약 ' + weeks + '주 남음' : '') +
          (st.goal ? ' · 목표: ' + esc(st.goal) : '') + '</div>' : '');
    });

    if (open) {
      let lastUnit = '';
      h += '<hr class="sep">';
      f.forEach((row, i) => {
        if (row.unit !== lastUnit) { h += '<div class="sect" style="margin:10px 0 4px">' + esc(row.unit) + '</div>'; lastUnit = row.unit; }
        const marks = studs.filter(st => posOf(b, st.at) === i).map(st => ' <span class="tag doing">◀ ' + esc(st.name) + '</span>').join('');
        h += '<div class="small" style="padding:3px 0">' + (i + 1) + '. ' + esc(row.sec) + marks + '</div>';
      });
      if (!f.length) h += '<div class="small muted">목차가 아직 없습니다 — ' + esc(b.note || '') + '</div>';
    }
    h += '</div>';
  });
  return h;
}

/* ── 원생 현황 (월별 실적) ──
 * 데이터는 roster.json (정적 파일). 신규·퇴원 이벤트에서 월별 재원·유지율을 계산한다.
 * 원장·관리자·선생님 모두 열람 — 숫자가 경각심과 동기가 되도록 전원 공개.
 */
let rosterDb = null, rosterErr = '';
function loadRoster() {
  fetch('roster.json?v=' + Date.now())
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(d => { rosterDb = d; render(); })
    .catch(e => { rosterErr = String(e); if (route === 'roster') render(); });
}
function ymNext(ym) {
  const d = new Date(Number(ym.slice(0, 4)), Number(ym.slice(5, 7)), 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function rosterMonths() {
  const cur = today().slice(0, 7);
  let m = (rosterDb && rosterDb.baseline) || cur;
  const out = [];
  while (m <= cur && out.length < 36) { out.push(m); m = ymNext(m); }
  return out.reverse();   // 최신 달 먼저
}
function activeIn(m) {
  return ((rosterDb && rosterDb.students) || []).filter(s =>
    s.start <= m && (!s.end || s.end > m));
}

function viewRoster() {
  if (!rosterDb && !rosterErr) { loadRoster(); return '<div class="card"><div class="empty"><b>📈</b>원생 데이터를 불러오는 중…</div></div>'; }
  if (rosterErr) return '<div class="card"><div class="empty"><b>⚠️</b>원생 데이터를 불러오지 못했습니다.<br><span class="muted">' + esc(rosterErr) + '</span></div></div>';

  const baseline = rosterDb.baseline;
  const months = rosterMonths();
  const cur = months[0];
  const curActive = activeIn(cur);

  let h = '';

  // 선생님 개인 링크: 내 학생 먼저
  const myName = session.isStaffLink ? ((meStaff() || {}).name || '') : '';
  const isMine = s => myName && String(s.teacher || '').split('·').includes(myName);

  // ⚠️ 관심 필요 — 위험 신호가 있는 학생을 맨 위로 (일반 직원은 내 학생만)
  {
    const rm = riskMap();
    const scope = (session.isAdmin || isManager()) ? curActive : curActive.filter(isMine);
    const risky = scope.map(s => ({ s: s, flags: riskFlags(s.name, rm) })).filter(x => x.flags.length);
    h += '<div class="card"><div class="between mb8">' +
      '<div class="card-title">⚠️ 관심 필요</div>' +
      '<div class="pill ' + (risky.length ? 'bad' : '') + '">' + risky.length + '명</div></div>' +
      (risky.length
        ? '<div class="card-sub mb8">결석이 이어질 때 그날 바로 연락하는 것이 가장 효과가 큽니다.</div>' +
          risky.map(x => '<div class="between small" style="padding:4px 0">' +
            '<span>· ' + esc(x.s.name) + ' <span class="muted">(' + esc(x.s.grade) + ' · ' + esc(x.s.teacher || '미지정') + ')</span> ' +
            x.flags.map(f => '<span class="pill ' + f[1] + '">' + esc(f[0]) + '</span>').join(' ') + '</span>' +
            '<button class="btn btn-sm btn-ghost" data-act="ctlog" data-name="' + esc(x.s.name) + '">📞 기록</button></div>').join('')
        : '<div class="small muted">지금 기준 위험 신호 없음 — 최근 2주 결석 2회 이상, 지각 3회 이상, 연락 30일 경과가 생기면 여기 올라옵니다.</div>') +
      '</div>';
  }

  if (myName) {
    const mine = rosterDb.students.filter(isMine);
    const mineActive = mine.filter(s => s.start <= cur && (!s.end || s.end > cur));
    if (mine.length) {
      h += '<div class="card"><div class="between mb8">' +
        '<div class="card-title">🧑‍🏫 내 학생</div>' +
        '<div class="pill">재원 ' + mineActive.length + '명</div></div>' +
        mineActive.map(s => '<div class="between small" style="padding:4px 0">' +
          '<span>· ' + esc(s.name) + ' <span class="muted">(' + esc(s.grade) + ' · ' + esc(s.subject) + ')</span>' +
          (s.memo ? ' <span class="pill warn">' + esc(s.memo) + '</span>' : '') + '</span>' +
          '<span class="row" style="gap:6px">' + ctPill(s.name) +
          '<button class="btn btn-sm btn-ghost" data-act="ctlog" data-name="' + esc(s.name) + '">📞 기록</button></span></div>').join('');
      // 내 학생 월별 변동 (변동 있는 달만)
      let moved = '';
      months.forEach(m => {
        const j = mine.filter(s => s.start === m && m !== baseline);
        const l = mine.filter(s => s.end === m);
        if (j.length || l.length) {
          moved += '<div class="small" style="padding:2px 0"><b>' + Number(m.slice(5)) + '월</b> ' +
            (j.length ? ' ➕ ' + j.map(s => esc(s.name)).join(', ') : '') +
            (l.length ? ' ➖ ' + l.map(s => esc(s.name) + (s.reason ? '(' + esc(s.reason) + ')' : '')).join(', ') : '') + '</div>';
        }
      });
      h += moved
        ? '<hr class="sep"><div class="fl mb8">월별 변동</div>' + moved
        : '<hr class="sep"><div class="small muted">기준월 이후 변동 없음 — 전원 유지 중 👍</div>';
      h += '</div><div class="sect">센터 전체</div>';
    }
  }

  // 이번 달 요약
  h += '<div class="card"><div class="prog">' +
    '<div class="ring" style="--p:100"><b>' + curActive.length + '</b></div>' +
    '<div style="flex:1"><div class="card-title">현재 재원생</div>' +
    '<div class="card-sub">기준월 ' + esc(baseline) + ' 이후의 신규·퇴원을 기록합니다.<br>' +
    '신규·퇴원이 생기면 원장님·관리자가 알려주는 대로 반영됩니다.</div></div></div>';

  // 선생님별 재원
  const byT = {};
  curActive.forEach(s => String(s.teacher || '미지정').split('·').forEach(t => { byT[t] = (byT[t] || 0) + 1; }));
  h += '<hr class="sep"><div class="card-title mb8">담당별 재원 (겸임은 양쪽 집계)</div>' +
    Object.keys(byT).sort((a, b) => byT[b] - byT[a]).map(t =>
      '<div class="between small" style="padding:3px 0"><span>' + esc(t) + '</span><span class="pill">' + byT[t] + '명</span></div>').join('') +
    '</div>';

  // 연락 현황 — 대표·관리자는 전체, 오래 못 챙긴 학생부터 위로
  if (session.isAdmin || isManager()) {
    const rank = s => { const d = daysSinceContact(s.name); return d === null ? 9999 : d; };
    const sorted = curActive.slice().sort((a, b) => rank(b) - rank(a));
    const fresh = curActive.filter(s => { const d = daysSinceContact(s.name); return d !== null && d <= 30; }).length;
    h += '<div class="card"><div class="between mb8">' +
      '<div class="card-title">📞 연락 현황</div>' +
      '<div class="pill ' + (fresh === curActive.length ? '' : 'warn') + '">최근 30일 내 연락 ' + fresh + '/' + curActive.length + '명</div></div>' +
      '<div class="card-sub mb8">오래 연락하지 못한 학생이 위로 올라옵니다. 퇴원은 연락이 끊긴 뒤에 옵니다 — 위쪽부터 챙겨주세요.</div>' +
      sorted.map(s => '<div class="between small" style="padding:4px 0">' +
        '<span>· ' + esc(s.name) + ' <span class="muted">(' + esc(s.grade) + ' · ' + esc(s.teacher || '미지정') + ')</span></span>' +
        '<span class="row" style="gap:6px">' + ctPill(s.name) +
        '<button class="btn btn-sm btn-ghost" data-act="ctlog" data-name="' + esc(s.name) + '">📞 기록</button></span></div>').join('') +
      '</div>';
  }

  // 온라인 프로그램 — 전 직원 공개. 이용 중인 학생이 위, 미지정 학생은 아래에서 지정한다.
  {
    const mon = mondayOf(today()), last = addDays(mon, -7);
    const using = curActive.filter(s => opProgs(s.name).length);
    const rest = curActive.filter(s => !opProgs(s.name).length);
    const low = using.filter(s => opSum(s.name, last) <= OP_LOW).length;
    h += '<div class="card"><div class="between mb8">' +
      '<div class="card-title">📱 온라인 프로그램</div>' +
      (using.length
        ? '<div class="pill ' + (low ? 'warn' : '') + '">이용 ' + using.length + '명' + (low ? ' · 저조 ' + low : '') + '</div>'
        : '') + '</div>' +
      (using.length
        ? '<div class="card-sub mb8">주 1회, 프로그램에서 확인한 학습 횟수만 기록합니다. 접속이 끊기는 것이 정답률보다 먼저 오는 이탈 신호입니다.</div>' +
          using.sort((a, b) => opSum(a.name, last) - opSum(b.name, last)).map(s => {
            const nowN = opSum(s.name, mon), lastN = opSum(s.name, last);
            const cls = lastN === 0 ? 'bad' : lastN <= OP_LOW ? 'warn' : '';
            return '<div class="between small" style="padding:4px 0">' +
              '<span>· ' + esc(s.name) + ' <span class="muted">(' + opProgs(s.name).join('·') + ')</span></span>' +
              '<span class="row" style="gap:6px">' +
                '<span class="pill ' + cls + '">지난주 ' + lastN + '회</span>' +
                '<span class="pill">이번주 ' + nowN + '</span>' +
                '<button class="btn btn-sm btn-ghost" data-act="oplog" data-name="' + esc(s.name) + '">기록</button>' +
              '</span></div>';
          }).join('')
        : '<div class="small muted">아직 지정된 학생이 없습니다. 아래에서 이용 중인 프로그램을 지정하세요.</div>') +
      (rest.length
        ? '<hr class="sep"><div class="fl mb8">프로그램 지정</div><div class="chips">' +
          rest.map(s => '<button class="chip" data-act="oplog" data-name="' + esc(s.name) + '">＋ ' + esc(s.name) + '</button>').join('') +
          '</div>'
        : '') +
      '</div>';
  }

  // 정기 평가 — 넬트(3개월)·메타수학(주간·월간). 추세만 본다.
  {
    const withEx = curActive.filter(s => examAll(s.name).length);
    h += '<div class="card"><div class="between mb8">' +
      '<div class="card-title">📊 정기 평가</div>' +
      (withEx.length ? '<div class="pill">기록 ' + withEx.length + '명</div>' : '') + '</div>' +
      (withEx.length
        ? withEx.map(s => {
            const last = examAll(s.name)[0];
            const tr = examTrend(s.name, last.kind);
            return '<div class="between small" style="padding:4px 0">' +
              '<span>· ' + esc(s.name) + ' <span class="muted">(' + esc(last.kind) + ' · ' + esc(last.date) + ')</span></span>' +
              '<span class="row" style="gap:6px">' +
                (tr ? '<span class="pill ' + tr[1] + '">' + tr[0] + '</span>' : '<span class="pill">첫 기록</span>') +
                '<span class="pill">' + esc(last.label || (last.lv + '단계')) + '</span>' +
                '<button class="btn btn-sm btn-ghost" data-act="exlog" data-name="' + esc(s.name) + '">기록</button>' +
              '</span></div>';
          }).join('')
        : '<div class="small muted">아직 기록이 없습니다. 넬트는 3개월마다, 메타수학은 주간·월간으로 단계만 남기세요.</div>') +
      '<hr class="sep"><div class="fl mb8">평가 기록 추가</div><div class="chips">' +
        curActive.filter(s => !examAll(s.name).length)
          .map(s => '<button class="chip" data-act="exlog" data-name="' + esc(s.name) + '">＋ ' + esc(s.name) + '</button>').join('') +
      '</div></div>';
  }

  // 월별 카드
  months.forEach(m => {
    const act = activeIn(m);
    const joins = rosterDb.students.filter(s => s.start === m);
    const leaves = rosterDb.students.filter(s => s.end === m);
    const prevAct = m === baseline ? null : activeIn(months[months.indexOf(m) + 1] || m);
    const keep = prevAct && prevAct.length
      ? Math.round((prevAct.length - leaves.length) / prevAct.length * 100) : null;

    h += '<div class="card"><div class="between mb8">' +
      '<div class="card-title">' + m.slice(0, 4) + '년 ' + Number(m.slice(5)) + '월</div>' +
      '<div class="row" style="gap:6px">' +
        '<span class="pill">재원 ' + act.length + '</span>' +
        (keep !== null ? '<span class="pill ' + (keep >= 95 ? '' : keep >= 85 ? 'warn' : 'bad') + '">유지율 ' + keep + '%</span>' : '<span class="pill">기준월</span>') +
      '</div></div>' +
      '<div class="between small" style="padding:2px 0"><span>➕ ' + (m === baseline ? '기준 등록' : '신규') + '</span>' +
        '<span>' + (joins.length ? joins.length + '명' : '0') + '</span></div>' +
      (m !== baseline && joins.length
        ? '<div class="small muted">' + joins.map(s => esc(s.name) + '(' + esc(s.grade) + ')').join(', ') + '</div>' : '') +
      '<div class="between small" style="padding:2px 0"><span>➖ 퇴원</span><span>' + (leaves.length ? leaves.length + '명' : '0') + '</span></div>' +
      (leaves.length
        ? leaves.map(s => '<div class="small muted">· ' + esc(s.name) + '(' + esc(s.grade) + ')' +
            (s.reason ? ' — ' + esc(s.reason) : '') + '</div>').join('') : '') +
      '</div>';
  });

  h += '<div class="hint">유지율 = (전월 재원 − 당월 퇴원) ÷ 전월 재원. 신규는 유지율에 넣지 않습니다.<br>' +
    '숫자는 경향입니다 — 퇴원은 반드시 사유와 함께 보세요 (이사·시간 문제와 불만은 다른 이야기입니다).</div>';
  return h;
}

function b64(str) { return btoa(unescape(encodeURIComponent(str))).replace(/\+/g, '-').replace(/\//g, '_'); }

/** 개인 링크. 전체 접근 비밀키 대신 직원별 토큰을 담는다 — 링크를 잃어버려도 해지할 수 있다. */
function staffLink(id) {
  const s = staffById(id);
  const t = s && s.token ? '&t=' + encodeURIComponent(s.token) : '';
  return location.origin + location.pathname + '?u=' + id + t;
}
async function ensureToken(id) {
  const s = staffById(id);
  if (!s) throw new Error('대상을 찾을 수 없습니다');
  if (s.token) return s.token;
  s.token = await sync.issueToken(id);
  s.updatedAt = now();
  save(); queueSync();
  return s.token;
}

function orderText(staffId, date) {
  const s = staffById(staffId);
  const list = tasksFor(staffId, date);
  let txt = '📋 ' + label(date) + ' 업무지시서\n' + (s ? s.name + ' 선생님\n' : '') + '─────────\n';
  txt += list.length
    ? list.map((t, i) => (i + 1) + '. ' + (t.time ? '[' + t.time + '] ' : '') + t.title + (t.priority === 'high' ? ' ⭐' : '') +
        (t.detail ? '\n   → ' + t.detail.replace(/\n/g, '\n   ') : '') +
        ((t.steps || []).length ? '\n   단계 ' + t.steps.length + '개 · 링크에서 확인' : '')).join('\n')
    : '(지시된 업무 없음)';
  txt += '\n─────────\n하는 방법은 링크 안에 있습니다.\n' + staffLink(staffId);

}

function reportText(staffId, date) {
  const s = staffById(staffId);
  const list = tasksFor(staffId, date);
  const p = progress(staffId, date);
  let txt = '✅ ' + label(date) + ' 업무 수행 보고\n' + (s ? s.name + '\n' : '') +
    '완료 ' + p.done + '/' + p.total + '건 (' + p.pct + '%)\n─────────\n';
  txt += list.map(t => {
    const c = getCheck(t.id, date), st = statusOf(t, date), pr = taskProgress(t, c);
    const mark = st === 'done' ? '✅' : st === 'blocked' ? '🚧' : st === 'doing' ? '🔸' : '⬜';
    return mark + ' ' + t.title +
      (st === 'doing' ? ' (' + pr.done + '/' + pr.total + pr.unit + ')' : '') +
      (c && c.note ? '\n   · ' + c.note : '');
  }).join('\n') || '(지시된 업무 없음)';
  return txt;
}

function briefText(date) {
  const list = teamStaff();
  let done = 0, total = 0;
  const pend = [], blocked = [], clear = [];
  list.forEach(s => {
    const p = progress(s.id, date);
    done += p.done; total += p.total;
    let hasPend = false;
    tasksFor(s.id, date).forEach(t => {
      const st = statusOf(t, date), c = getCheck(t.id, date), pr = taskProgress(t, c);
      if (st === 'done') return;
      hasPend = true;
      const line = '· ' + s.name + ' — ' + t.title + (t.time ? ' (' + t.time + ')' : '') +
        (st === 'doing' ? ' [진행 ' + pr.done + '/' + pr.total + pr.unit + ']' : '') +
        (c && c.note ? '\n   “' + c.note + '”' : '');
      (st === 'blocked' ? blocked : pend).push(line);
    });
    if (!hasPend && p.total) clear.push(s.name);
  });
  const pct = total ? Math.round(done / total * 100) : 0;

  let txt = '📊 ' + label(date) + ' 업무 마감 브리핑\n' +
    '전체 ' + total + '건 중 ' + done + '건 완료 (' + pct + '%)\n─────────\n';
  if (blocked.length) txt += '🚧 막힘 ' + blocked.length + '건 — 조치 필요\n' + blocked.join('\n') + '\n─────────\n';
  txt += pend.length ? '⚠️ 미완료 ' + pend.length + '건\n' + pend.join('\n') + '\n' : '✅ 미완료 없음\n';
  if (clear.length) txt += '─────────\n✅ 전원 완료: ' + clear.join(', ') + '\n';

  // 지시하지 않았는데 직원이 스스로 한 일
  const own = [];
  list.forEach(s => tasksFor(s.id, date).forEach(t => {
    if (t.origin !== 'staff') return;
    const st = statusOf(t, date);
    own.push('· ' + s.name + ' — ' + t.title + ' [' + STATUS_LABEL[st] + ']');
  }));
  if (own.length) txt += '─────────\n＋ 직원 추가 업무 ' + own.length + '건\n' + own.join('\n') + '\n';

  // 대표 본인 업무는 직원 통계와 섞지 않고 따로 붙인다
  const mineLines = [];
  owners().forEach(s => tasksFor(s.id, date).forEach(t => {
    const st = statusOf(t, date), c = getCheck(t.id, date), pr = taskProgress(t, c);
    mineLines.push('· ' + t.title + (t.time ? ' (' + t.time + ')' : '') +
      ' [' + STATUS_LABEL[st] + (st === 'doing' ? ' ' + pr.done + '/' + pr.total + pr.unit : '') + ']' +
      (c && c.note ? '\n   “' + c.note + '”' : ''));
  }));
  if (mineLines.length) txt += '─────────\n🙋 내 업무 ' + mineLines.length + '건\n' + mineLines.join('\n') + '\n';

  return txt;
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast('복사했습니다'); }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('복사했습니다'); }
    catch (e2) { toast('복사 실패 — 직접 선택해 주세요'); }
    document.body.removeChild(ta);
  }
}

function saveEditedTask() {
  const isNew = !eForm.id;
  const title = ($('#eTitle').value || '').trim();
  if (!title) return toast('업무 내용을 입력해 주세요');
  if (eForm.repeat === 'days' && !eForm.days.length) return toast('요일을 선택해 주세요');

  let t;
  if (isNew) {
    const who = currentStaff();
    if (!who) return toast('직원을 먼저 선택해 주세요');
    t = {
      id: uid(), groupId: 'own-' + now(), staffId: who.id,
      steps: [], createdAt: now(), deleted: false,
      origin: actor()
    };
    state.tasks.push(t);
  } else {
    t = state.tasks.find(x => x.id === eForm.id);
    if (!t) return closeModal();
    if (!canEditTask(t)) { closeModal(); return toast('원장님이 내린 지시는 수정할 수 없습니다'); }
    if (actor() === 'staff') t.lastEditBy = 'staff';
    else if (t.origin !== 'staff') t.lastEditBy = 'admin';
  }

  // 같은 순서의 단계는 id를 물려줘서 이미 체크한 진행 상태를 잃지 않게 한다
  const oldSteps = t.steps || [];
  const labels = ($('#eSteps').value || '').split('\n').map(x => x.trim()).filter(Boolean);
  t.steps = labels.map((label, i) => ({ id: (oldSteps[i] && oldSteps[i].id) || uid(), label: label }));

  t.title = title;
  t.detail = ($('#eDetail').value || '').trim();
  t.guide = ($('#eGuide').value || '').trim();
  t.target = Number($('#eTarget').value) || 0;
  t.unit = ($('#eUnit').value || '건').trim();
  t.time = $('#eTime').value || '';
  t.priority = $('#ePri').value;
  t.repeat = eForm.repeat;
  t.days = eForm.days.slice().sort();
  t.start = $('#eStart').value || today();
  t.end = $('#eEnd').value || '';

  t.updatedAt = now();

  eForm = null;
  save(); queueSync(); closeModal(); render();
  toast(isNew ? '추가했습니다' : '수정했습니다');
}

/* ══════════════════════════════════════════════════════
   8-1. 말로 쓴 지시를 업무로 — 카톡 문장 해석
   ══════════════════════════════════════════════════════ */
const pad2 = n => String(n).padStart(2, '0');

/** "혜지쌤", "김혜지", "혜지 선생님" 모두 잡는다 */
function matchStaff(text) {
  const list = liveStaff();
  for (const s of list) if (text.includes(s.name)) return { s: s, token: s.name };
  for (const s of list) {
    const short = s.name.length >= 3 ? s.name.slice(1) : '';
    if (short.length >= 2 && text.includes(short)) return { s: s, token: short };
  }
  return null;
}

/** "3시까지", "오후 3시반", "15:00", "9시 30분" */
function matchTime(text) {
  let m = text.match(/(\d{1,2})\s*:\s*(\d{2})/);
  if (m) return { time: pad2(m[1]) + ':' + m[2], token: m[0] };

  m = text.match(/(오전|오후|아침|저녁|밤|낮)?\s*(\d{1,2})\s*시\s*(반|\d{1,2}\s*분)?/);
  if (!m) return null;
  let h = Number(m[2]);
  const mer = m[1] || '';
  if (/오후|저녁|밤/.test(mer)) { if (h < 12) h += 12; }
  else if (/오전|아침/.test(mer)) { if (h === 12) h = 0; }
  else if (h >= 1 && h <= 7) h += 12;   // 오후에 도는 센터라 한 자리 시각은 오후로 본다
  let mm = '00';
  if (m[3]) mm = m[3] === '반' ? '30' : pad2(parseInt(m[3], 10));
  return { time: pad2(h) + ':' + mm, token: m[0] };
}

/** "오늘", "내일", "모레", "금요일", "8월 3일" */
function matchDate(text) {
  if (/오늘/.test(text)) return { date: today(), token: '오늘' };
  if (/내일/.test(text)) return { date: addDays(today(), 1), token: '내일' };
  if (/모레/.test(text)) return { date: addDays(today(), 2), token: '모레' };

  const dw = text.match(/([일월화수목금토])\s*요일/);
  if (dw) {
    const want = DOW.indexOf(dw[1]);
    for (let i = 1; i <= 7; i++) {
      const c = addDays(today(), i);
      if (dowOf(c) === want) return { date: c, token: dw[0] };
    }
  }
  const md = text.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
  if (md) return { date: new Date().getFullYear() + '-' + pad2(md[1]) + '-' + pad2(md[2]), token: md[0] };
  return null;
}

function cleanTitle(s) {
  return String(s)
    .replace(/(쌤|선생님|샘)/g, ' ')
    .replace(/(긴급히?|급히|급하게|asap)/gi, ' ')   // 중요 표시로 이미 잡히므로 제목에서는 뺀다
    .replace(/^[\s,.·\-~]*(에게|한테|께)?\s*/, '')
    .replace(/\s*(좀|까지|안에|전에)\s*/g, ' ')
    .replace(/\s*(부탁\s*(해요|드려요|드립니다|합니다|해)|해\s*주세요|해주세요|해줘요|해줘|하세요|해주시고|해주시면|바랍니다)\s*[.!~]*$/, '')
    .replace(/\s+/g, ' ')
    .replace(/[\s.,!~]+$/, '')
    .trim();
}

/** 한 줄에 한 건. 이름·시간·날짜를 뽑고 나머지를 업무 이름으로 쓴다. */
function parseInstructions(text) {
  return String(text || '').split('\n').map(l => l.trim()).filter(Boolean).map(line => {
    let rest = line;
    const sm = matchStaff(rest); if (sm) rest = rest.replace(sm.token, ' ');
    const tm = matchTime(rest);  if (tm) rest = rest.replace(tm.token, ' ');
    const dm = matchDate(rest);  if (dm) rest = rest.replace(dm.token, ' ');
    const title = cleanTitle(rest);
    return {
      staff: sm ? sm.s.name : '',
      title: title || line,
      time: tm ? tm.time : '',
      start: dm ? dm.date : today(),
      repeat: 'once',
      priority: /긴급|급하|급히|중요|바로|asap/i.test(line) ? 'high' : 'normal',
      carry: true,
      raw: line
    };
  });
}

function applyAssignments(input, preConfirmed) {
  let data = input;
  if (typeof input === 'string') {
    try { data = JSON.parse(input); }
    catch (e) { return toast('JSON 형식이 잘못되었습니다'); }
  }
  const list = Array.isArray(data) ? data : (data.assignments || []);
  if (!list.length) return toast('등록할 업무가 없습니다');

  // 이름 확인 → 없는 직원은 물어보고 등록
  const missing = [...new Set(list.map(a => String(a.staff || '').trim()).filter(n => n && !staffByName(n)))];
  if (missing.length) {
    if (!preConfirmed && !confirm('등록되지 않은 직원이 있습니다: ' + missing.join(', ') + '\n새로 등록할까요?')) return;
    missing.forEach(n => {
      const isOwner = list.some(a => String(a.staff || '').trim() === n && a.owner === true);
      state.staff.push({ id: uid(), name: n, owner: isOwner, createdAt: now(), updatedAt: now(), deleted: false });
    });
  }

  let added = 0, skipped = 0;
  list.forEach(a => {
    const s = staffByName(a.staff);
    if (!s) { skipped++; return; }
    const steps = (a.steps || []).map(x => ({
      id: uid(), label: typeof x === 'string' ? x : String(x.label || '')
    })).filter(x => x.label);
    state.tasks.push({
      id: uid(), groupId: 'ai-' + now(), staffId: s.id,
      title: String(a.title || '').trim() || '(제목 없음)',
      detail: String(a.detail || ''),
      guide: String(a.guide || ''),
      steps: steps,
      target: Number(a.target) || 0,
      unit: String(a.unit || '건'),
      time: String(a.time || ''),
      priority: a.priority === 'high' ? 'high' : 'normal',
      repeat: ['once', 'daily', 'weekday', 'days'].includes(a.repeat) ? a.repeat : 'once',
      days: Array.isArray(a.days) ? a.days.map(Number).filter(n => n >= 0 && n <= 6) : [],
      start: /^\d{4}-\d{2}-\d{2}$/.test(a.start || '') ? a.start : today(),
      end: /^\d{4}-\d{2}-\d{2}$/.test(a.end || '') ? a.end : '',
      carry: a.carry !== false,
      createdAt: now(), updatedAt: now(), deleted: false
    });
    added++;
  });

  save(); queueSync(); closeModal(); render();
  toast(added + '건 등록' + (skipped ? ' · ' + skipped + '건 건너뜀' : ''));
}
