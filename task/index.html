  const checked = batchSelection.has(b.id);

  let h = '<div class="card">' +
    '<div class="between book-card-head" data-act="bkopen" data-id="' + b.id + '" style="cursor:pointer">' +
      '<div class="row book-card-main" style="gap:8px">' +
        '<input type="checkbox" data-act="bkselect" data-id="' + b.id + '" ' + (checked ? 'checked' : '') +
          ' style="margin-top:4px" aria-label="' + esc(b.title) + ' 일괄 주문 선택">' +
        '<div><div class="card-title">' + esc(b.title) +
          (b.verify ? ' <span class="tag edit">검증필요</span>' : '') +
          (b.source === 'added' ? ' <span class="tag" style="color:var(--navy)">🆕 신청 등록</span>' : '') +
          (openOrders ? ' <span class="tag high">🛒 주문 진행 ' + openOrders + '</span>' : '') + '</div>' +
        '<div class="small muted">' + esc(b.subject) + ' · ' + esc(b.level) +
          (f.length ? ' · 소단원 ' + f.length + '개' : ' · 목차 없음') + '</div></div></div>' +
      '<div class="row book-card-actions" style="gap:8px">' +
        (openOrders ? '<button class="btn btn-sm btn-danger" data-act="bkcancelopen" data-id="' + b.id + '">🗑 취소</button>' : '') +
        '<button class="btn btn-sm btn-ghost" data-act="beopen" data-id="' + b.id + '">✏ 수정</button>' +
        '<button class="btn btn-sm btn-ghost" data-act="bkorder" data-id="' + b.id + '">🛒 주문</button>' +
        '<button class="btn btn-sm btn-ghost" data-act="bkopen" data-id="' + b.id + '" aria-label="' +

  studs.forEach(st => {

    const remain = f.length ? f.length - done : 0;
    const weeks = (st.perWeek && remain) ? Math.ceil(remain / st.perWeek) : 0;
    const pct = f.length ? Math.round(done / f.length * 100) : 0;
    h += '<hr class="sep"><div class="small"><b>' + esc(st.name) + '</b>' +
      (st.teacher ? ' <span class="muted">(' + esc(st.teacher) + ')</span>' : '') +
      (idx >= 0 ? ' — 현재 <b>' + esc(f[idx].sec) + '</b>' : (st.at ? ' — 위치 미확인' : '')) + '</div>' +
      (f.length ? '<div class="bar" style="margin:6px 0 4px"><i style="width:' + pct + '%"></i></div>' +
        '<div class="small muted">진행 ' + done + '/' + f.length +
        (weeks ? ' · 주 ' + st.perWeek + '회 기준 약 ' + weeks + '주 남음' : '') +
        (st.goal ? ' · 목표: ' + esc(st.goal) : '') + '</div>' : '');
  });

  if (open) {
    let lastUnit = '';
    h += '<hr class="sep">';
    f.forEach((row, i) => {
      if (row.unit !== lastUnit) { h += '<div class="sect" style="margin:10px 0 4px">' + esc(row.unit) + '</div>'; lastUnit = row.unit; }
      const marks = studs.filter(st => posOf(b, st.at) === i).map(st => ' <span class="tag doing">◀ ' + esc(st.name) + '</span>').join('');
      h += '<div class="small" style="padding:3px 0">' + (i + 1) + '. ' + esc(row.sec) + marks + '</div>';
    });
    if (!f.length) h += '<div class="small muted">목차가 아직 없습니다 — ' + esc(b.note || '') + '</div>';
  }
  return h + '</div>';
}

function bookAddSummary(item) {
  const parts = [];
  if (item.subject) parts.push('과목: ' + esc(item.subject));
  if (item.level) parts.push('레벨: ' + esc(item.level));
  if (item.vendorName) parts.push('거래처: ' + esc(item.vendorName));

async function reviewBookAdd(action, key, revision) {
  const auth = sync.auth();
  if (!auth) return toast('동기화 인증이 필요합니다');
  const body = { app: SYNC_APP, auth: auth, action: action, requestKey: key, revision: Number(revision) };
  if (action === 'reject') {
    const note = prompt('선생님에게 전달할 반려 사유를 적어 주세요');
    if (note === null) return;
    body.note = note.trim();
  }
  try {
    const result = await sync.post('/book-add-review', body);
    const index = bookAddQueue.findIndex(item => item.requestKey === key);
    if (index >= 0) bookAddQueue[index] = result.request;
    if (action === 'approve') { approvedBookAdditionsLoaded = false; loadApprovedBookAdditions(true); }
    render();
    toast(action === 'approve' ? '승인했습니다 · 교재 목록에 등록됐습니다' : '반려했습니다');
  } catch (error) {
    toast('검토 실패 — ' + (error.message || error));
    loadBookAddQueue(true);
  }
}

    toast('신청 실패 — ' + (error.message || error));
    if (button) button.disabled = false;
  }
}

async function reviewBookEdit(action, key, revision) {
  const auth = sync.auth();
  if (!auth) return toast('동기화 인증이 필요합니다');
  const body = { app: SYNC_APP, auth: auth, action: action, requestKey: key, revision: Number(revision) };
  if (action === 'reject') {
    const note = prompt('선생님에게 전달할 반려 사유를 적어 주세요');
    if (note === null) return;
    body.note = note.trim();
  }
  try {
    const result = await sync.post('/book-edit-review', body);
    const index = bookEditQueue.findIndex(item => item.requestKey === key);
    if (index >= 0) bookEditQueue[index] = result.request;
    if (action === 'approve') { approvedBookEditsLoaded = false; loadApprovedBookEdits(true); }
    render();
    toast(action === 'approve' ? '승인했습니다 · 교재 정보에 반영됐습니다' : '반려했습니다');
  } catch (error) {
    toast('검토 실패 — ' + (error.message || error));
    loadBookEditQueue(true);
  }
}

/* ── 학생별 교재 출고·인계 ──
 * privateBookStudents의 stable assignment id가 정본이다. 개인 링크는 /roster와
 * /book-issue 양쪽에서 서버가 본인 학생만 내려주며, UI도 현재 assignment id
 * 목록과 교차해 다른 학생의 응답을 그리지 않는다. 연락처·주소는 다루지 않는다. */
const BOOK_ISSUE_STATUS = {
  unissued: ['미출고', 'warn'], pending: ['미출고', 'warn'], prepared: ['배부 준비', ''],
  issued: ['보관함 출고', 'bad'], handed: ['학생 인계 완료', 'ok'], cancelled: ['출고 취소', 'warn']
};
const BOOK_ISSUE_FILTERS = [
  ['all', '전체'], ['unissued', '미출고'], ['risk', '1일+ 미수령'], ['active', '인계 중'], ['handed', '완료']
];

function normalizeBookIssueStatus(value) {
  const status = String(value || '').toLowerCase();
  return BOOK_ISSUE_STATUS[status] ? status : 'unissued';
}

function bookIssueTime(row, key) {
  const value = row && (row[key] ?? row[key.replace(/[A-Z]/g, c => '_' + c.toLowerCase())]);
  const n = Number(value);
  if (Number.isFinite(n) && n > 0) return n;
  const parsed = Date.parse(String(value || ''));
  return Number.isFinite(parsed) ? parsed : 0;
}

function bookIssueViewRows() {
  const issueByAssignment = new Map((bookIssueRows || []).map(row => [String(row.assignmentId || row.assignment_id || ''), row]));
  const bookById = new Map((((bookDb && bookDb.books) || [])).map(book => [String(book.id), book]));
  const currentIds = new Set();
  const rows = (privateBookStudents || []).map(assignment => {
    const assignmentId = String(assignment.id || assignment.assignmentId || '');
    if (!assignmentId) return null;
    currentIds.add(assignmentId);
    const stored = issueByAssignment.get(assignmentId) || {};
    const book = bookById.get(String(assignment.bookId || '')) || {};
    const status = normalizeBookIssueStatus(stored.status);
    const issuedAt = bookIssueTime(stored, 'issuedAt');
    const handedAt = bookIssueTime(stored, 'handedAt');
    const storedStudentId = String(stored.studentId || stored.student_id || '');
    const storedBookId = String(stored.bookId || stored.book_id || '');
    const identityMismatch = String(stored.integrity || '') === 'mismatch' ||
      !!(storedStudentId && storedStudentId !== String(assignment.studentId || '')) ||
      !!(storedBookId && storedBookId !== String(assignment.bookId || ''));
    const risk = status === 'issued' && !!issuedAt && Date.now() - issuedAt >= 86400000;
    return {
      assignmentId: assignmentId, studentId: String(assignment.studentId || ''), bookId: String(assignment.bookId || ''),
      studentName: String(identityMismatch ? (stored.studentName || stored.student_name || '학생 연결 확인 필요') : (assignment.name || stored.studentName || stored.student_name || '학생 미입력')),
      teacher: String(identityMismatch ? (stored.teacher || '담당 연결 확인 필요') : (assignment.teacher || stored.teacher || '담당 미지정')),
      title: String(identityMismatch ? (stored.bookTitle || stored.book_title || storedBookId || '교재 연결 확인 필요') : (book.title || stored.bookTitle || stored.book_title || assignment.bookId || '교재 미입력')),
      status: status, revision: Number(stored.revision) || 0, issuedAt: issuedAt, handedAt: handedAt,
      updatedAt: bookIssueTime(stored, 'updatedAt'), risk: risk, integrity: identityMismatch ? 'mismatch' : ''
    };
  }).filter(Boolean);
  if (session.isAdmin) {
    (bookIssueRows || []).forEach(stored => {
      const assignmentId = String(stored.assignmentId || stored.assignment_id || '');
      if (!assignmentId || currentIds.has(assignmentId)) return;
      const status = normalizeBookIssueStatus(stored.status);
      const issuedAt = bookIssueTime(stored, 'issuedAt');
      rows.push({
        assignmentId: assignmentId, studentId: String(stored.studentId || stored.student_id || ''), bookId: String(stored.bookId || stored.book_id || ''),
        studentName: String(stored.studentName || stored.student_name || '학생 연결 확인 필요'), teacher: String(stored.teacher || '담당 연결 확인 필요'),
        title: String(stored.bookTitle || stored.book_title || stored.bookId || stored.book_id || '교재 연결 확인 필요'),
        status: status, revision: Number(stored.revision) || 0, issuedAt: issuedAt, handedAt: bookIssueTime(stored, 'handedAt'),
        updatedAt: bookIssueTime(stored, 'updatedAt'), risk: status === 'issued' && !!issuedAt && Date.now() - issuedAt >= 86400000,
        integrity: 'orphan'
      });
    });
  }
  return rows.sort((a, b) => Number(!!b.integrity) - Number(!!a.integrity) || Number(b.risk) - Number(a.risk) ||
    a.studentName.localeCompare(b.studentName, 'ko') || a.title.localeCompare(b.title, 'ko'));
}

function bookIssueUnassignedStudents() {
  if (!session.isAdmin) return [];
  if (rosterLoading || rosterErr || !rosterDb || !Array.isArray(rosterDb.students) || !Array.isArray(privateBookStudents)) return null;
  const currentMonth = today().slice(0, 7);
  const assignedStudentIds = new Set(privateBookStudents.map(row => String(row && row.studentId || '')).filter(Boolean));
  return rosterDb.students.filter(student => student && student.id && student.start <= currentMonth &&
    (!student.end || student.end > currentMonth) && !assignedStudentIds.has(String(student.id)))
    .sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'ko'));
}

    '<button class="btn btn-sm btn-ghost mt14" data-act="bookissuerefresh">원생 명단 다시 불러오기</button></section>';

    '<div class="hint mt8">명단 누락을 숨기지 않기 위한 확인 목록입니다. 교재는 자동 배정하지 않습니다.</div>' +

      esc(student.grade || '학년 미지정') + ' · 담당 ' + esc(student.teacher || '미지정') + '</span></div><span class="pill warn">미배정</span></div>').join('') + '</details>';
}

async function loadBookIssues(force) {
  if (bookIssueLoading || (bookIssueLoaded && !force)) return;
  const auth = sync.auth();
  if (!auth) { bookIssueError = '동기화 인증이 필요합니다'; bookIssueLoaded = true; return; }
  bookIssueLoading = true; bookIssueError = '';
  if (route === 'books') renderAfterSync();
  try {
    const result = await sync.post('/book-issue', { app: SYNC_APP, auth: auth, action: 'list' });
    bookIssueRows = Array.isArray(result.issues) ? result.issues : [];
    bookIssueLoaded = true;
  } catch (error) {
    bookIssueError = String(error && error.message || error);
    bookIssueLoaded = true;
  } finally {
    bookIssueLoading = false;
    if (route === 'books') renderAfterSync();
  }
}

function bookIssueMatches(row) {
  if (bookIssueFilter === 'unissued' && !['unissued', 'pending'].includes(row.status)) return false;
  if (bookIssueFilter === 'risk' && !row.risk) return false;
  if (bookIssueFilter === 'active' && !['prepared', 'issued'].includes(row.status)) return false;
  if (bookIssueFilter === 'handed' && row.status !== 'handed') return false;
  return true;
}

function applyBookIssueSearch(value) {
  bookIssueSearchQuery = String(value || '');
  const terms = bookIssueSearchQuery.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);
  const cards = Array.from(document.querySelectorAll('[data-book-issue-card]'));
  let shown = 0;
  cards.forEach(card => {
    const match = terms.every(term => String(card.dataset.search || '').includes(term));
    card.hidden = !match;
    if (match) shown++;
  });
  const status = document.querySelector('[data-book-issue-search-status]');
  if (status) status.textContent = terms.length ? shown + '건 검색됨' : cards.length + '건 표시 중';
  const empty = document.querySelector('[data-book-issue-search-empty]');
  if (empty) empty.hidden = !terms.length || shown > 0;
}

function restoreBookIssueFocus() {
  const key = bookIssueRestoreFocus;
  if (!key) return false;
  bookIssueRestoreFocus = null;
  const button = document.querySelector('[data-book-issue-focus="' + CSS.escape(key) + '"]');
  if (!button) return false;
  button.focus({ preventScroll: true });
  return true;
}

function bookIssueActionButtons(row) {
  if (row.integrity) return '<button class="btn btn-sm btn-ghost" disabled aria-disabled="true">연결 확인 후 처리</button>';
  const base = ' data-id="' + esc(row.assignmentId) + '" data-rev="' + row.revision + '"';
  if (['unissued', 'pending'].includes(row.status)) {
    return '<button class="btn btn-sm btn-primary" data-act="bookissuetransition" data-next="prepared"' + base + ' data-book-issue-focus="' + esc(row.assignmentId) + '">배부 준비</button>';
  }
  if (row.status === 'cancelled') return '<button class="btn btn-sm btn-primary" data-act="bookissuetransition" data-next="reissue" data-reason-required="true"' + base +
    ' data-book-issue-focus="' + esc(row.assignmentId) + '">사유 입력·재출고</button>';
  if (row.status === 'prepared') return '<button class="btn btn-sm btn-primary" data-act="bookissuetransition" data-next="issued"' + base + ' data-book-issue-focus="' + esc(row.assignmentId) + '">보관함 출고</button>' +
    '<button class="btn btn-sm btn-ghost" data-act="bookissuetransition" data-next="cancelled" data-reason-required="true"' + base + '>출고 취소</button>';

    '<button class="btn btn-sm btn-ghost" data-act="bookissuetransition" data-next="cancelled" data-reason-required="true"' + base + '>출고 취소</button>';

function bookIssueCard(row) {
  const labelRow = BOOK_ISSUE_STATUS[row.status] || BOOK_ISSUE_STATUS.unissued;
  const timeText = row.status === 'handed' && row.handedAt ? '인계 ' + new Date(row.handedAt).toLocaleString('ko-KR')
    : row.issuedAt ? '출고 ' + new Date(row.issuedAt).toLocaleString('ko-KR') : '아직 보관함에서 출고되지 않음';
  return '<article class="card book-issue-card' + (row.risk ? ' is-risk' : '') + '" data-book-issue-card data-search="' +
    esc([row.studentName, row.teacher, row.title, labelRow[0]].join(' ').toLocaleLowerCase()) + '">' +
    '<div class="between"><div><div class="card-title">' + esc(row.studentName) + ' · ' + esc(row.title) + '</div>' +
      '<div class="card-sub">담당 ' + esc(row.teacher) + ' · ' + esc(timeText) + '</div></div>' +
      '<span class="pill ' + labelRow[1] + '">' + esc(labelRow[0]) + '</span></div>' +
    (row.integrity ? '<div class="hint mt8"><b>연결 끊김·확인 필요</b> — ' +
      (row.integrity === 'mismatch' ? '같은 배정 ID의 학생 또는 교재 정보가 달라 자동 연결하지 않았습니다.' : '현재 교재 배정에서 사라진 과거 출고 기록입니다. 미인계 여부를 확인하세요.') + '</div>' : '') +
    (row.risk ? '<div class="hint mt8"><b>누락 위험</b> — 보관함 출고 후 실제 24시간 이상 학생 인계가 확인되지 않았습니다.</div>' : '') +
    '<div class="ops-actions">' + bookIssueActionButtons(row) + '</div></article>';
}

function viewBookIssues() {
  if (!bookIssueLoaded && !bookIssueLoading) setTimeout(() => loadBookIssues(false), 0);
  const unassigned = bookIssueUnassignedStudents();
  const unassignedHtml = bookIssueUnassignedHtml(unassigned);
  if (bookIssueLoading && !bookIssueLoaded) return '<section class="card book-issue-board"><div class="empty"><b>⏳</b>학생별 출고 현황을 불러오는 중…</div></section>' + unassignedHtml;
  if (bookIssueError) return '<section class="card alert book-issue-board"><div class="card-title">학생별 출고 현황을 불러오지 못했습니다</div>' +
    '<div class="card-sub">' + esc(bookIssueError) + '</div><button class="btn btn-sm btn-ghost mt14" data-act="bookissuerefresh">다시 시도</button></section>' + unassignedHtml;
  const all = bookIssueViewRows();
  const visible = all.filter(bookIssueMatches);
  const unissued = all.filter(row => ['unissued', 'pending'].includes(row.status)).length;
  const risk = all.filter(row => row.risk).length;
  const issuedToday = all.filter(row => row.issuedAt && ymd(new Date(row.issuedAt)) === today()).length;
  const handed = all.filter(row => row.status === 'handed').length;
  let h = '<section class="card book-issue-board"><div class="between"><div><div class="card-title">학생별 교재 출고·인계</div>' +
    '<div class="card-sub">보관함에서 꺼낸 시점과 학생에게 직접 전달한 시점을 나눠 누락을 찾습니다.</div></div>' +
    '<button class="btn btn-sm btn-ghost" data-act="bookissuerefresh" aria-label="학생별 출고 현황 새로고침">새로고침</button></div>' +
    '<div class="ops-kpis book-issue-kpis" aria-label="교재 출고 요약"><div class="ops-kpi"><b>' + unissued + '</b><span>미출고</span></div>' +
      '<div class="ops-kpi' + (risk ? ' is-alert' : '') + '"><b>' + risk + '</b><span>출고 후 1일+ 미수령</span></div>' +
      '<div class="ops-kpi"><b>' + issuedToday + '</b><span>오늘 출고</span></div><div class="ops-kpi"><b>' + handed + '</b><span>인계 완료</span></div>' +
      (session.isAdmin ? (unassigned === null
        ? '<div class="ops-kpi is-alert"><b>—</b><span>미배정 확인 불가</span></div>'
        : '<div class="ops-kpi' + (unassigned.length ? ' is-alert' : '') + '"><b>' + unassigned.length + '</b><span>교재 미배정 · 확인 필요</span></div>') : '') + '</div>' +
    '<div class="ops-toolbar"><div class="chips" aria-label="교재 출고 상태 필터">' + BOOK_ISSUE_FILTERS.map(filter =>
      '<button class="chip ' + (bookIssueFilter === filter[0] ? 'on' : '') + '" data-act="bookissuefilter" data-status="' + filter[0] + '" aria-pressed="' + (bookIssueFilter === filter[0]) + '">' + filter[1] + '</button>').join('') + '</div>' +
      '<input class="in ops-search" type="search" data-book-issue-search aria-label="학생별 출고 검색" placeholder="학생·선생님·교재·상태 검색" value="' + esc(bookIssueSearchQuery) + '">' +
      '<span class="small muted" data-book-issue-search-status role="status" aria-live="polite"></span></div></section>';
  h += unassignedHtml;
  h += '<div class="book-issue-grid">' + visible.map(bookIssueCard).join('') + '</div>' +
    '<div class="onboarding-empty-search" data-book-issue-search-empty hidden>검색 결과가 없습니다.</div>';
  if (!visible.length) h += '<div class="card"><div class="empty"><b>📦</b>' + (all.length ? '이 상태에 해당하는 교재가 없습니다.' : '학생에게 배정된 교재가 없습니다.') + '</div></div>';
  return h;
}

async function transitionBookIssue(button) {
  const auth = sync.auth();
  if (!auth) return toast('동기화 인증이 필요합니다');
  const assignmentId = String(button.dataset.id || '');
  const next = String(button.dataset.next || '');
  let reason = '';
  if (button.dataset.reasonRequired === 'true') {
    reason = String(prompt(next === 'reissue' ? '인계를 취소하고 다시 출고하는 사유를 입력해 주세요' : '출고를 취소하는 사유를 입력해 주세요') || '').trim();
    if (!reason) return toast('취소·재출고 사유를 입력해 주세요');
  }
  bookIssueRestoreFocus = assignmentId;
  button.disabled = true;
  try {
    await sync.post('/book-issue', { app: SYNC_APP, auth: auth, action: 'transition', assignmentId: assignmentId,
      next: next, revision: Number(button.dataset.rev) || 0, reason: reason });
    await loadBookIssues(true);
    toast(next === 'handed' ? '학생 인계를 완료했습니다' : next === 'issued' || next === 'reissue' ? '보관함 출고로 기록했습니다' : '출고 상태를 저장했습니다');
  } catch (error) {
    bookIssueRestoreFocus = null;
    button.disabled = false;
    toast('출고 상태 저장 실패 — ' + (error.message || error));
    loadBookIssues(true);
  }
}

    '<div class="small muted mt8" data-book-search-status role="status" aria-live="polite">전체 ' +
      (bookDb.books || []).length + '권</div>' +
    '<button class="btn btn-sm btn-primary mt14" data-act="baopen">+ 새 교재 추가 신청</button></div>';

  if (session.isAdmin) h += viewBookAddReview() + viewBookEditReview();
  if (session.isStaffLink && !session.isAdmin) h += viewOwnBookAddRequests() + viewOwnBookEditRequests();

  const searching = !!normalizeBookSearch(bookSearchQuery);
  const vendors = bookDb.vendors || [];
  const byVendor = new Map(vendors.map(v => [v.name, []]));
  const unassigned = [];
  (bookDb.books || []).forEach(b => {
    if (b.vendor && byVendor.has(b.vendor)) byVendor.get(b.vendor).push(b);
    else unassigned.push(b);
  });

  const sections = vendors
    .map(v => ({ key: v.name, vend: v, books: byVendor.get(v.name) }))
    .filter(sec => sec.books.length);
  if (unassigned.length) sections.push({ key: UNASSIGNED_VENDOR_KEY, vend: null, books: unassigned });

  if (!sections.length) return h + '<div class="card"><div class="empty"><b>📚</b>등록된 교재가 없습니다.</div></div>';

  h += '<div class="card" data-book-search-empty hidden><div class="empty"><b>🔎</b>검색 결과가 없습니다.</div></div>';

  sections.forEach(sec => {
    const pending = sec.books.reduce((sum, b) => sum + bookPendingOrderCount(b), 0);
    const selectedHere = sec.books.filter(b => batchSelection.has(b.id));
    const closed = vendorClosed.has(sec.key);
    const vendorLabel = sec.vend ? sec.vend.name : '거래처 미등록';
    const selectedOutsideSearch = booksOutsideSearch(selectedHere, vendorLabel, bookSearchQuery);
    const brands = sec.vend && Array.isArray(sec.vend.brands) ? sec.vend.brands : [];
    h += '<section class="book-vendor" data-book-vendor data-closed="' + String(closed) + '">' +
      '<button type="button" class="card between book-vendor-toggle" data-act="vendortoggle" data-key="' + esc(sec.key) +
      '" aria-expanded="' + String(!closed) + '"' + (searching ? ' disabled' : '') + '>' +
      '<span class="book-vendor-copy"><span class="card-title">' + (sec.vend ? esc(sec.vend.name) : '거래처 미등록') +
        (sec.vend ? ' ' + vendorTypeBadge(sec.vend) : '') +
        (selectedHere.length ? ' <span class="tag">선택 ' + selectedHere.length + '</span>' : '') +
        (pending ? ' <span class="tag high">🛒 주문 진행 ' + pending + '</span>' : '') + '</span>' +
        '<span class="small muted">교재 ' + sec.books.length + '권' +
        (brands.length ? ' · ' + esc(brands.slice(0, 4).join('·')) + (brands.length > 4 ? ' 외' : '') : '') +
        '</span></span><span class="muted" data-book-vendor-arrow>' + (closed ? '▸' : '▾') + '</span></button>' +
      '<div class="book-vendor-body" data-book-vendor-body' + (closed ? ' hidden' : '') + '>';
    groupBooksBySeries(sec.books).forEach(group => {
      const selected = group.books.filter(book => batchSelection.has(book.id)).length;
      const groupPending = group.books.reduce((sum, book) => sum + bookPendingOrderCount(book), 0);
      const seriesKey = sec.key + '::' + group.name;
      const expanded = seriesExpansion.has(seriesKey)
        ? seriesExpansion.get(seriesKey) : !!(selected || groupPending);
      h += '<section class="book-series" data-book-series data-expanded="' + String(expanded) + '">' +
        '<button type="button" class="between book-series-toggle" data-act="seriestoggle" data-key="' + esc(seriesKey) +
        '" aria-expanded="' + String(expanded) + '"' + (searching ? ' disabled' : '') + '>' +
        '<span class="book-series-title">' + esc(group.name) + ' <span class="pill">' + group.books.length + '권</span></span>' +
        '<span class="row" style="gap:6px">' +
          (selected ? '<span class="pill">선택 ' + selected + '</span>' : '') +
          (groupPending ? '<span class="pill warn">주문 ' + groupPending + '</span>' : '') +
          '<span class="muted" data-book-series-arrow>' + (expanded ? '▾' : '▸') + '</span></span></button>' +
        '<div data-book-series-body' + (expanded ? '' : ' hidden') + '>';
      group.books.forEach(book => {
        h += '<div class="book-entry" data-book-entry data-book-selected="' +
          String(batchSelection.has(book.id)) + '" data-book-search="' +
          esc(bookSearchText(book, sec.vend ? sec.vend.name : '거래처 미등록', group.name)) + '">' + bookCard(book) + '</div>';
      });
      h += '</div></section>';
    });
    if (selectedHere.length >= 2) {
      h += '<button class="btn btn-primary btn-block" data-act="bkbatch" data-key="' + esc(sec.key) + '">' +
        '🛒 선택한 ' + selectedHere.length + '권' +
        '<span data-book-batch-outside' + (selectedOutsideSearch ? '' : ' hidden') + '>' +
          (selectedOutsideSearch ? ' · 검색 밖 ' + selectedOutsideSearch + '권 포함' : '') + '</span>' +
        ' · 저녁 8시 발송 대기</button>';
    }
    h += '</div></section>';
  });
  return h;
}

/* ── 차량 운행 ──
 * 차량은 교재·신규학생과 섞지 않는 독립 route다. 서버 list가 개인 링크 범위를
 * 기사로 배정된 오늘 운행만 잘라 준다. 통화 동의가 확인된 번호는 기사 개인 링크의
 * 명시적 번호 확인 모달과 tel: 링크에서만 일시 표시하며 data/localStorage/log에 복제하지 않는다. */
const TRANSPORT_STATUS = {
  scheduled: ['탑승 예정', 'warn'], boarded: ['탑승 중 · 미하차', 'bad'],
  dropped: ['하차·인계 완료', 'ok'], absent: ['미탑승', '']
};
const TRANSPORT_NOTIFICATION_STATUS = {
  accepted: ['카톡 접수', ''],
  rejected: ['카톡 거절 · 관리자 확인', 'is-alert'],
  unknown: ['카톡 접수 여부 확인 필요', 'is-alert'],
  skipped: ['카톡 미발송', 'is-alert'],
  blocked: ['카톡 미발송 · 관리자 확인', 'is-alert']
};
const TRANSPORT_RUN_STATUS = {
  upcoming: ['운행 전', 'warn'], running: ['운행 중', ''],
  attention: ['확인 필요', 'bad'], completed: ['운행 종료', 'ok'], empty: ['배정 없음', '']
};

function transportPendingStudentNames(stop) {
  if (!stop || !Array.isArray(stop.pendingStudentNames)) return [];
  return Array.from(new Set(stop.pendingStudentNames.map(name => String(name || '').trim()).filter(Boolean)));
}

function transportRoutePendingCount(routeRow) {
  if (!session.isAdmin) return Math.max(0, Number(routeRow && routeRow.pendingCount) || 0);
  return (routeRow && Array.isArray(routeRow.stops) ? routeRow.stops : [])
    .reduce((count, stop) => count + transportPendingStudentNames(stop).length, 0);
}

function deepCopy(value) { return JSON.parse(JSON.stringify(value || {})); }
function transportSafeId(prefix) { return prefix + '-' + uid().replace(/[^A-Za-z0-9_-]/g, '').slice(0, 24); }
function transportConfig() {
  const value = transportData && transportData.config;
  return value && typeof value === 'object' ? value : { vehicles: [], drivers: [], routes: [] };
}

function transportRoutes() {
  const value = transportData && transportData.routes;
  return Array.isArray(value) ? value : [];
}

function transportStates() {
  const value = transportData && transportData.states;
  return Array.isArray(value) ? value : [];
}

function transportStateKey(routeId, studentId) { return String(routeId) + '|' + String(studentId); }

function normalizeTransportStatus(value) {
  const status = String(value || '').toLowerCase();
  return TRANSPORT_STATUS[status] ? status : 'scheduled';
}

function transportTelHref(value) {
  const number = String(value || '').replace(/[^+\d]/g, '');
  return /^\+?\d{8,15}$/.test(number) ? 'tel:' + number : '';
}

function transportNotificationKey(date, routeId, studentId) {
  return String(date) + '|' + transportStateKey(routeId, studentId);
}

function normalizeTransportNotification(value, next) {
  const source = value && typeof value === 'object' ? value : {};
  let status = String(source.status || '');
  if (!TRANSPORT_NOTIFICATION_STATUS[status]) status = 'unknown';
  return { status: status, event: String(source.event || next || ''), code: String(source.code || '') };
}

function transportNotificationStatus(value) {
  const status = String(value && value.status || 'unknown');
  const code = String(value && value.code || '');
  if (status !== 'blocked') return TRANSPORT_NOTIFICATION_STATUS[status] || TRANSPORT_NOTIFICATION_STATUS.unknown;
  if (['SEND_DISABLED', 'TEMPLATE_NOT_APPROVED'].includes(code)) {
    return ['카톡 미발송 · 알림 설정 준비 중', 'is-alert'];
  }
  if (/^(?:GUARDIAN|CALL)/.test(code) || /^TRANSPORT_.*CONSENT/.test(code) || /RECONSENT/.test(code)) {
    return ['카톡 미발송 · 연락처·동의 필요', 'is-alert'];
  }
  if (/^(?:DATE|STATE|ROUTE|SOURCE_CHANGED|DAILY)/.test(code)) {
    return ['카톡 미발송 · 관리자 확인', 'is-alert'];
  }
  return TRANSPORT_NOTIFICATION_STATUS.blocked;
}

function rememberTransportNotification(date, routeId, studentId, next, value) {
  if (next !== 'boarded' && next !== 'dropped') return null;
  const notification = normalizeTransportNotification(value, next);
  transportNotificationStates.set(transportNotificationKey(date, routeId, studentId), notification);
  return notification;
}

function transportNotificationHtml(row) {
  const expectedEvent = row.status === 'boarded' ? 'boarded' : row.status === 'dropped' ? 'dropped' : '';
  if (!expectedEvent) return '';
  const serverValue = row.student && row.student.notification && typeof row.student.notification === 'object'
    ? normalizeTransportNotification(row.student.notification, expectedEvent) : null;
  const cached = transportNotificationStates.get(transportNotificationKey(transportDate, row.routeId, row.studentId));
  const value = serverValue || (cached && cached.event === expectedEvent ? cached : null);
  if (!value) return '';
  const status = transportNotificationStatus(value);
  const record = value.event === 'dropped' ? '하차 확인 저장' : '탑승 확인 저장';
  return '<div class="transport-notification ' + status[1] + '" role="status">' + esc(record + ' · ' + status[0]) + '</div>';
}

function transportGuardianState(value, studentId) {
  const source = value && value.guardian && typeof value.guardian === 'object' ? value.guardian : (value || {});
  return {
    studentId: String(source.studentId || studentId || ''),
    studentName: String(source.studentName || ''), maskedPhone: String(source.maskedPhone || ''),
    phoneReady: !!source.phoneReady, callAllowed: !!source.callAllowed,
    boardedConsent: !!source.boardedConsent, droppedConsent: !!source.droppedConsent,
    needsReconsent: !!source.needsReconsent,
    contactUpdatedAt: Number(source.contactUpdatedAt) || 0,
    consentUpdatedAt: Number(source.consentUpdatedAt) || 0,
    updatedAt: Number(source.updatedAt) || 0
  };
}

function transportGuardianSummaryHtml(row) {
  if (!session.isAdmin) return '';
  const state = transportGuardianStates.get(String(row.studentId));
  if (!state) return '<div class="transport-guardian-summary">차량 연락·알림 상태는 설정을 열 때 조회합니다.</div>';
  const phone = state.phoneReady ? (state.maskedPhone || '연락처 등록됨') : '연락처 미등록';
  const flags = ['기사 전화 ' + (state.callAllowed ? '허용' : '미동의'),
    '탑승 알림 ' + (state.boardedConsent ? '동의' : '미동의'),
    '하차 알림 ' + (state.droppedConsent ? '동의' : '미동의')];
  return '<div class="transport-guardian-summary' + (state.needsReconsent ? ' transport-capacity' : '') + '">' +
    esc(phone + ' · ' + flags.join(' · ') + (state.needsReconsent ? ' · 재동의 필요' : '')) + '</div>';
}

function transportRouteStudents(route) {
  const direct = Array.isArray(route.students) ? route.students : [];
  const byStudent = new Map();
  direct.forEach(student => {
    const id = String(student.studentId || student.id || '');
    const nestedStop = student.stop && typeof student.stop === 'object' ? student.stop : {};
    if (id) byStudent.set(id, Object.assign({}, student, {
      studentId: id, stopId: String(student.stopId || nestedStop.id || ''),
      stopName: String(student.stopName || nestedStop.name || ''), stopTime: String(student.stopTime || nestedStop.time || '')
    }));
  });
  (route.stops || []).forEach(stop => {
    const stopStudents = Array.isArray(stop.students) ? stop.students : [];
    stopStudents.forEach(student => {
      const id = String(student.studentId || student.id || '');
      if (id) byStudent.set(id, Object.assign({}, student, {
        studentId: id, stopId: String(stop.id || ''), stopName: String(stop.name || ''), stopTime: String(stop.time || '')
      }));
    });
    (stop.studentIds || []).forEach(studentId => {
      const id = String(studentId || '');
      const rosterStudent = rosterDb && (rosterDb.students || []).find(student => String(student.id) === id);
      if (id && !byStudent.has(id)) byStudent.set(id, {
        studentId: id, name: rosterStudent ? rosterStudent.name : '학생 정보 확인 필요',
        stopId: String(stop.id || ''), stopName: String(stop.name || ''), stopTime: String(stop.time || '')
      });
    });
  });
  return Array.from(byStudent.values());
}

function transportVehicle(route) {
  const config = transportConfig();
  return route.vehicle || (config.vehicles || []).find(item => String(item.id) === String(route.vehicleId || route.vehicle_id || '')) || null;
}
function transportDriver(route) {
  const config = transportConfig();
  return route.driver || (config.drivers || []).find(item => String(item.id) === String(route.driverId || route.driver_id || '')) || null;
}

async function loadTransport(date, force, throwOnError) {
  date = validYmd(date) ? date : today();
  if (transportLoading || (!force && transportLoadedDate === date && transportData)) return;
  const auth = sync.auth();
  if (!auth) { transportError = '동기화 인증이 필요합니다'; transportLoadedDate = date; return; }
  transportLoading = true; transportError = '';
  const preservedDraft = transportConfigDirty && transportConfigDraft ? transportConfigDraft : null;
  const draftRevision = Number(transportData && transportData.revision) || 0;
  if (route === 'transport') renderAfterSync();
  try {
    const result = await sync.post('/transport', { app: SYNC_APP, auth: auth, action: 'list', date: date });
    const latestRevision = Number(result.revision ?? result.configRevision) || 0;
    transportData = {
      config: result.config || { vehicles: [], drivers: [], routes: [] },
      routes: Array.isArray(result.routes) ? result.routes : [], states: Array.isArray(result.states) ? result.states : [],
      unresolved: Array.isArray(result.unresolved) ? result.unresolved : [],
      warnings: Array.isArray(result.warnings) ? result.warnings : [],
      capabilities: result.capabilities && typeof result.capabilities === 'object' ? result.capabilities : {},
      revision: latestRevision
    };
    transportLoadedDate = date;
    transportLoadedAt = now();
    if (preservedDraft) {
      transportConfigDraft = preservedDraft;
      if (latestRevision !== draftRevision) transportConfigRevisionConflict = true;
    }
    else {
      transportConfigDraft = null; transportConfigDirty = false; transportConfigRevisionConflict = false;
      transportOpenRouteId = ''; transportDriverTargetRoute = '';
      transportRouteDwellMinutes.clear();
    }
  } catch (error) {
    transportError = String(error && error.message || error);
    transportData = null;
    transportLoadedDate = date;
    if (throwOnError) throw error;
  } finally {
    transportLoading = false;
    if (route === 'transport') renderAfterSync();
  }
}

function transportProjectedRows() {
  const states = new Map(transportStates().map(row => [transportStateKey(row.routeId || row.route_id, row.studentId || row.student_id), row]));
  const out = [];
  transportRoutes().forEach(routeRow => {
    const routeId = String(routeRow.id || routeRow.routeId || '');
    transportRouteStudents(routeRow).forEach(student => {
      const stateRow = states.get(transportStateKey(routeId, student.studentId)) || {};
      out.push({ route: routeRow, routeId: routeId, student: student, studentId: String(student.studentId),
        status: normalizeTransportStatus(stateRow.status), revision: Number(stateRow.revision) || 0, stateRow: stateRow });
    });
  });
  return out;
}

function transportTimeMinutes(value) {
  const match = /^(\d{1,2}):(\d{2})$/.exec(String(value || '').trim());
  if (!match) return -1;
  const hour = Number(match[1]), minute = Number(match[2]);
  return hour >= 0 && hour <= 23 && minute >= 0 && minute <= 59 ? hour * 60 + minute : -1;
}

function transportMinuteLabel(value) {
  if (!Number.isFinite(value) || value < 0) return '';
  const minutes = Math.min(1439, Math.floor(value));
  return String(Math.floor(minutes / 60)).padStart(2, '0') + ':' + String(minutes % 60).padStart(2, '0');
}

function transportRouteEndMinutes(routeRow) {
  const start = transportTimeMinutes(routeRow && (routeRow.startTime || routeRow.time));
  let end = start;
  (routeRow && Array.isArray(routeRow.stops) ? routeRow.stops : []).forEach(stop => {
    end = Math.max(end, transportTimeMinutes(stop && stop.time));
  });
  const serviceMinutes = Number(routeRow && routeRow.plan && routeRow.plan.serviceMinutes);
  const hasPlan = routeRow && routeRow.plan && Number.isFinite(serviceMinutes) && serviceMinutes >= 0;
  if (start >= 0 && hasPlan) end = Math.max(end, start + serviceMinutes);
  else if (String(routeRow && routeRow.direction || '') === 'pickup' && end >= 0) end += 20;
  return end;
}

function transportRouteEndIsEstimated(routeRow) {
  return String(routeRow && routeRow.direction || '') === 'pickup' &&
    !(routeRow && routeRow.plan && Number.isFinite(Number(routeRow.plan.serviceMinutes)) && Number(routeRow.plan.serviceMinutes) >= 0);
}

function transportRouteCompletionAt(rows) {
  return (Array.isArray(rows) ? rows : []).reduce((latest, row) => {
    const state = row && row.stateRow && typeof row.stateRow === 'object' ? row.stateRow : {};
    const at = row.status === 'dropped' ? Number(state.droppedAt || state.dropped_at) :
      row.status === 'absent' ? Number(state.absentAt || state.absent_at) : 0;
    return Number.isFinite(at) && at > latest ? at : latest;
  }, 0);
}

function transportRouteRunStatus(routeRow, rows, selectedDate, currentDate, currentTime, orphanBoarded, pendingCount) {
  rows = Array.isArray(rows) ? rows : [];
  orphanBoarded = Math.max(0, Number(orphanBoarded) || 0);
  pendingCount = Math.max(0, Number(pendingCount) || 0);
  if (pendingCount) return 'attention';
  if (!rows.length && !orphanBoarded) return 'empty';
  if (orphanBoarded) return 'attention';
  if (selectedDate > currentDate) {
    return rows.some(row => row.status !== 'scheduled') ? 'attention' : 'upcoming';
  }
  if (rows.every(row => row.status === 'dropped' || row.status === 'absent')) return 'completed';
  if (selectedDate < currentDate) return 'attention';
  const start = transportTimeMinutes(routeRow && (routeRow.startTime || routeRow.time));
  const end = transportRouteEndMinutes(routeRow);
  const current = transportTimeMinutes(currentTime);
  if (start < 0 || end < 0 || current < 0) return 'attention';
  if (current > end + 15) return 'attention';
  if (rows.some(row => row.status !== 'scheduled')) return 'running';
  if (current < start) return 'upcoming';
  return 'running';
}

function transportRunDashboard(routes, stateByRoute, orphanBoardedByRoute) {
  const seoulNow = seoulNowParts(), currentDate = seoulNow.date, currentTime = seoulNow.label;
  const loadedLabel = transportLoadedAt ? new Date(transportLoadedAt).toLocaleTimeString('ko-KR', {
    timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit'
  }) : '확인 중';
  const statusRank = { attention: 0, running: 1, upcoming: 2, completed: 3, empty: 4 };
  const items = routes.map(routeRow => {
    const routeId = String(routeRow.id || routeRow.routeId || '');
    const rows = stateByRoute.get(routeId) || [];
    const orphanBoarded = Number(orphanBoardedByRoute && orphanBoardedByRoute.get(routeId)) || 0;
    const pendingCount = transportRoutePendingCount(routeRow);
    const key = transportRouteRunStatus(routeRow, rows, transportDate, currentDate, currentTime, orphanBoarded, pendingCount);
    const completed = rows.filter(row => row.status === 'dropped' || row.status === 'absent').length;
    return { route: routeRow, rows: rows, key: key, completed: completed, orphanBoarded: orphanBoarded, pendingCount: pendingCount,
      completionAt: transportRouteCompletionAt(rows) };
  }).sort((a, b) => statusRank[a.key] - statusRank[b.key] ||
    transportTimeMinutes(a.route.startTime || a.route.time) - transportTimeMinutes(b.route.startTime || b.route.time) ||
    String(a.route.name || '').localeCompare(String(b.route.name || ''), 'ko'));
  let h = '<section class="card transport-run-board" aria-labelledby="transportRunBoardTitle"><div class="transport-run-board-head"><div>' +
    '<div class="card-title" id="transportRunBoardTitle">기사·코스별 운행 현황판</div>' +
    '<div class="card-sub">코스의 전체 학생이 하차 또는 미탑승 처리되고 명단 연결 대기가 없어야 운행 종료로 표시됩니다. 마지막 갱신 ' + esc(loadedLabel) + '</div></div>' +
    '<button class="btn btn-sm btn-ghost" data-act="transportrefresh">현황 새로고침</button></div>';
  if (!items.length) return h + '<div class="empty"><b>🚐</b>이 날짜에 확인할 운행이 없습니다.</div></section>';
  h += '<div class="transport-run-list" aria-live="polite">' + items.map(item => {
    const routeRow = item.route, status = TRANSPORT_RUN_STATUS[item.key];
    const vehicle = transportVehicle(routeRow), driver = transportDriver(routeRow);
    const start = transportTimeMinutes(routeRow.startTime || routeRow.time);
    const end = transportRouteEndMinutes(routeRow);
    const estimated = transportRouteEndIsEstimated(routeRow);
    const timeRange = start < 0 ? '시간 미입력' : transportMinuteLabel(start) +
      (end > start ? '–' + transportMinuteLabel(end) + (estimated ? ' 예상' : '') : '');
    const completion = item.key === 'completed'
      ? (item.completionAt ? ' · 종료 ' + new Date(item.completionAt).toLocaleTimeString('ko-KR', {
        timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit'
      }) : ' · 종료 시각 미기록') : '';
    const orphanWarning = item.orphanBoarded ? ' · 연결 확인 ' + item.orphanBoarded + '건' : '';
    const pendingWarning = session.isAdmin && item.pendingCount ? ' · 명단 연결 대기 ' + item.pendingCount + '명' : '';
    return '<article class="transport-run-item is-' + item.key + '"><div class="between"><div class="transport-run-title">' +
      esc(routeRow.name || '노선 이름 미입력') + '</div><span class="pill ' + status[1] + '">' + status[0] + '</span></div>' +
      '<div class="transport-run-meta">' + esc(timeRange) + ' · 기사 ' + esc(driver && driver.name || routeRow.driverName || '미지정') +
      ' · 차량 ' + esc(vehicle && (vehicle.name || vehicle.label) || routeRow.vehicleName || '미지정') + '</div>' +
      '<div class="transport-run-progress">확인 완료 ' + item.completed + '/' + item.rows.length + '명' + esc(completion + orphanWarning + pendingWarning) + '</div></article>';
  }).join('') + '</div></section>';
  return h;
}

function transportUnmatchedStates() {
  const matched = new Set(transportProjectedRows().map(row => transportStateKey(row.routeId, row.studentId)));
  const rows = [];
  (transportData && Array.isArray(transportData.unresolved) ? transportData.unresolved : []).forEach(row => {
    const key = transportStateKey(row.routeId || row.route_id, row.studentId || row.student_id);
    if (String(row.date || '') === transportDate && matched.has(key)) return;
    rows.push(row);
  });
  transportStates().forEach(row => {
    if (normalizeTransportStatus(row.status) !== 'boarded') return;
    if (!matched.has(transportStateKey(row.routeId || row.route_id, row.studentId || row.student_id))) rows.push(row);
  });
  const unique = new Map();
  rows.forEach(row => {
    if (normalizeTransportStatus(row.status) !== 'boarded') return;
    const key = String(row.date || transportDate) + '|' + transportStateKey(row.routeId || row.route_id, row.studentId || row.student_id);
    if (!unique.has(key)) unique.set(key, row);
  });
  return Array.from(unique.values());
}

function transportHasRiders() {
  return transportStates().some(row => normalizeTransportStatus(row.status) === 'boarded') ||
    transportProjectedRows().some(row => row.status === 'boarded') ||
    transportUnmatchedStates().some(row => normalizeTransportStatus(row.status) === 'boarded');
}

async function transitionTransportState(button) {

  const routeId = String(button.dataset.route || ''), studentId = String(button.dataset.student || '');

  const stateDate = validYmd(button.dataset.date) ? button.dataset.date : transportDate;
  let reason = '';
  if (next === 'dropped' || next === 'absent') {
    const studentName = String(button.dataset.studentName || '학생 정보 확인 필요');
    const stopName = String(button.dataset.stopName || '정류장 미입력');

      if (!confirm(studentName + ' 학생 · ' + stopName + '\n실제 하차·보호자 인계를 확인했나요?')) return;
    } else {

        ? '전화 버튼으로 보호자에게 탑승 여부를 먼저 확인했나요?'
        : '기사 전화 동의 또는 연락처가 없어 전화할 수 없습니다. 미탑승 기록 후 학원에 즉시 알려 주세요.';
      if (!confirm(studentName + ' 학생 · ' + stopName + '\n' + phoneStep + '\n확인 후 미탑승으로 기록할까요?')) return;
    }
  }
  if (button.dataset.reasonRequired === 'true') {
    reason = String(prompt('상태를 되돌리는 사유를 입력해 주세요') || '').trim();
    if (!reason) return toast('되돌림 사유를 입력해 주세요');
  }
  transportRestoreFocus = transportStateKey(routeId, studentId);
  button.disabled = true;
  let notification = null;
  try {
    const result = await sync.post('/transport', { app: SYNC_APP, auth: auth, action: 'state', date: stateDate,
      routeId: routeId, studentId: studentId, next: next, revision: Number(button.dataset.rev) || 0, reason: reason,
      notifyGuardian: stateDate === today() && (next === 'boarded' || next === 'dropped') });
    notification = rememberTransportNotification(stateDate, routeId, studentId, next, result.notification);
    toast(transportStateSuccessToast(next, notification));
  } catch (error) {
    transportRestoreFocus = null;
    button.disabled = false;
    toast('차량 상태 저장 실패 — ' + (error.message || error));
    loadTransport(transportDate, true);
    return;
  }
  try {
    await loadTransport(transportDate, true, true);
  } catch (refreshError) {
    transportRestoreFocus = null;
    button.disabled = true;
    toast('기록은 저장됨 · 화면 새로고침 필요 — 같은 확인 버튼을 다시 누르지 마세요');
  }
}

function ensureTransportDraft() {
  if (!transportConfigDraft) {
    const source = transportConfig();
    transportConfigDraft = {
      baseAddress: String(source.baseAddress || ''),
      vehicles: Array.isArray(source.vehicles) ? deepCopy(source.vehicles) : [],
      drivers: Array.isArray(source.drivers) ? deepCopy(source.drivers) : [],
      routes: Array.isArray(source.routes) ? deepCopy(source.routes) : []
    };
  }
  return transportConfigDraft;
}

function normalizeTransportPlan(value) {
  if (!value || typeof value !== 'object' || String(value.provider || '') !== 'naver') return null;
  const distanceMeters = Math.max(0, Number(value.distanceMeters) || 0);
  const driveMinutes = Math.max(0, Number(value.driveMinutes) || 0);
  const serviceMinutes = Math.max(0, Number(value.serviceMinutes) || 0);
  const dwellMinutes = Number(value.dwellMinutes);
  const plannedAt = Math.floor(Number(value.plannedAt) || 0);
  if (!Number.isSafeInteger(dwellMinutes) || dwellMinutes < 0 || dwellMinutes > 60 ||
      !Number.isSafeInteger(plannedAt) || plannedAt <= 0) return null;
  return { provider: 'naver', distanceMeters: distanceMeters, driveMinutes: driveMinutes,
    serviceMinutes: serviceMinutes, dwellMinutes: dwellMinutes, plannedAt: plannedAt };
}

function transportPlanSummary(plan) {
  const safe = normalizeTransportPlan(plan);
  if (!safe) return '';
  const km = (safe.distanceMeters / 1000).toFixed(safe.distanceMeters >= 10000 ? 0 : 1);
  return '네이버 지도 기준 · 약 ' + km + 'km · 주행 ' + safe.driveMinutes + '분 · 정차 포함 ' +
    safe.serviceMinutes + '분 · 정류장당 ' + safe.dwellMinutes + '분';
}

function transportOrderedMapAddresses(config, routeRow) {
  const baseAddress = String(config && config.baseAddress || '').trim();
  const stopAddresses = (routeRow && Array.isArray(routeRow.stops) ? routeRow.stops : [])
    .map(stop => String(stop.address || '').trim()).filter(Boolean);
  if (!baseAddress) return stopAddresses;
  return String(routeRow && routeRow.direction || '') === 'pickup'
    ? stopAddresses.concat(baseAddress) : [baseAddress].concat(stopAddresses);
}

function transportGoogleDirectionsUrl(config, routeRow) {
  const addresses = transportOrderedMapAddresses(config, routeRow);
  if (addresses.length < 2) return '';
  const params = new URLSearchParams({ api: '1', travelmode: 'driving', origin: addresses[0],
    destination: addresses[addresses.length - 1] });
  if (addresses.length > 2) params.set('waypoints', addresses.slice(1, -1).join('|'));
  return 'https://www.google.com/maps/dir/?' + params.toString();
}

function transportRosterReady() {
  return !!(rosterDb && Array.isArray(rosterDb.students)) && !rosterErr;
}

function transportDraftStudentIds(draft, routeId, stopId) {
  const routeRow = (draft.routes || []).find(item => String(item.id) === String(routeId));
  const stopRow = routeRow && (routeRow.stops || []).find(item => String(item.id) === String(stopId));
  return stopRow && Array.isArray(stopRow.studentIds) ? stopRow.studentIds.map(String) : [];
}

function transportDraftPendingStudentNames(draft, routeId, stopId) {
  const routeRow = (draft.routes || []).find(item => String(item.id) === String(routeId));
  const stopRow = routeRow && (routeRow.stops || []).find(item => String(item.id) === String(stopId));
  return transportPendingStudentNames(stopRow);
}

function transportCapturedStudentIds(draft, routeId, stopId, select) {
  const previous = transportDraftStudentIds(draft, routeId, stopId);
  if (!transportRosterReady()) return previous;
  const options = Array.from((select && select.options) || []);
  const rendered = new Set(options.map(option => String(option.value)));
  const selected = Array.from((select && select.selectedOptions) || []).map(option => String(option.value));
  return Array.from(new Set(selected.concat(previous.filter(studentId => !rendered.has(studentId)))));
}

function captureTransportConfig() {
  const draft = ensureTransportDraft();
  const baseAddress = String((document.querySelector('[data-tc-base-address]') || {}).value || draft.baseAddress || '').trim();
  const baseAddressChanged = baseAddress !== String(draft.baseAddress || '').trim();
  const vehicles = Array.from(document.querySelectorAll('[data-tc-vehicle]')).map(row => ({
    id: String(row.dataset.id || ''), name: String((row.querySelector('[data-tc-name]') || {}).value || '').trim(),
    plate: String((row.querySelector('[data-tc-plate]') || {}).value || '').trim(),
    capacity: Math.max(0, Number((row.querySelector('[data-tc-capacity]') || {}).value) || 0)
  }));
  const drivers = (draft.drivers || []).map(driver => ({ id: String(driver.staffId || driver.id || ''),
    staffId: String(driver.staffId || driver.id || ''), name: String(driver.name || '') }));
  const routes = Array.from(document.querySelectorAll('[data-tc-route]')).map(row => {
    const id = String(row.dataset.id || '');
    const previous = (draft.routes || []).find(item => String(item.id) === id) || {};
    const dwellInput = row.querySelector('[data-tc-dwell]');
    const previousPlan = normalizeTransportPlan(previous.plan);
    const previousDwell = transportRouteDwellMinutes.has(id) ? transportRouteDwellMinutes.get(id) :
      (previousPlan ? previousPlan.dwellMinutes : 3);
    const dwell = dwellInput ? Math.min(30, Math.max(0, Number(dwellInput.value) || 0)) : previousDwell;
    if (dwellInput) transportRouteDwellMinutes.set(id, dwell);
    const direction = String((row.querySelector('[data-tc-direction]') || {}).value || '');
    const startTime = String((row.querySelector('[data-tc-route-time]') || {}).value || '');
    const stops = Array.from(row.querySelectorAll('[data-tc-stop]')).map(stop => ({
      id: String(stop.dataset.id || ''), name: String((stop.querySelector('[data-tc-stop-name]') || {}).value || '').trim(),
      address: String((stop.querySelector('[data-tc-stop-address]') || {}).value || '').trim(),
      time: String((stop.querySelector('[data-tc-stop-time]') || {}).value || ''),
      studentIds: transportCapturedStudentIds(draft, row.dataset.id, stop.dataset.id, stop.querySelector('[data-tc-students]')),
      pendingStudentNames: transportDraftPendingStudentNames(draft, row.dataset.id, stop.dataset.id)
    }));
    const previousStops = Array.isArray(previous.stops) ? previous.stops : [];
    const routePlanChanged = baseAddressChanged || direction !== String(previous.direction || '') ||
      startTime !== String(previous.startTime || previous.time || '') || dwell !== previousDwell ||
      stops.length !== previousStops.length || stops.some((stop, index) => {
        const old = previousStops[index] || {};
        return stop.id !== String(old.id || '') || stop.name !== String(old.name || '').trim() ||
          stop.address !== String(old.address || '').trim() || stop.time !== String(old.time || '');
      });
    return {
      id: id, name: String((row.querySelector('[data-tc-route-name]') || {}).value || '').trim(),
      days: Array.from(row.querySelectorAll('[data-tc-day]:checked')).map(input => Number(input.value)).sort(),
      direction: direction,
      startTime: startTime,
      vehicleId: String((row.querySelector('[data-tc-vehicle-id]') || {}).value || ''),
      driverId: String((row.querySelector('[data-tc-driver-id]') || {}).value || ''),
      active: !!(row.querySelector('[data-tc-active]') || {}).checked,
      plan: routePlanChanged ? undefined : normalizeTransportPlan(previous.plan) || undefined,
      stops: stops
    };
  });
  draft.baseAddress = baseAddress; draft.vehicles = vehicles; draft.drivers = drivers; draft.routes = routes;
  return draft;
}

function transportConfigValidation(config) {
  const errors = [];
  const vehicles = new Map((config.vehicles || []).map(item => [String(item.id), item]));
  const drivers = new Set((config.drivers || []).map(item => String(item.id)));
  (config.vehicles || []).forEach(item => { if (!item.name || !item.plate || !(Number(item.capacity) > 0)) errors.push('차량 이름·차량번호·정원을 입력해 주세요'); });
  (config.routes || []).forEach(routeRow => {
    if (!routeRow.name || !routeRow.days.length || !routeRow.direction || !routeRow.startTime || !vehicles.has(routeRow.vehicleId) || !drivers.has(routeRow.driverId)) {
      errors.push((routeRow.name || '이름 없는 노선') + ': 요일·방향·시간·차량·기사를 모두 입력해 주세요');
    }
    if (!(routeRow.stops || []).length) errors.push((routeRow.name || '이름 없는 노선') + ': 정류장을 하나 이상 추가해 주세요');
    const assigned = [], pendingAssigned = [];
    (routeRow.stops || []).forEach(stop => {
      if (!stop.name || !stop.time) errors.push((routeRow.name || '노선') + ': 정류장 이름과 시간을 입력해 주세요');
      assigned.push(...(stop.studentIds || []));
      pendingAssigned.push(...transportPendingStudentNames(stop));
    });
    if (new Set(assigned).size !== assigned.length) errors.push((routeRow.name || '노선') + ': 한 학생이 여러 정류장에 중복 배정됐습니다');
    if (new Set(pendingAssigned).size !== pendingAssigned.length) errors.push((routeRow.name || '노선') + ': 명단 연결 대기 학생이 여러 정류장에 중복되었습니다');
    const assignedNames = new Set(assigned.map(studentId => {
      const student = rosterDb && (rosterDb.students || []).find(item => String(item.id) === String(studentId));
      return student && String(student.name || '').trim();
    }).filter(Boolean));
    if (pendingAssigned.some(name => assignedNames.has(name))) errors.push((routeRow.name || '노선') + ': 원생 배정이 끝난 이름은 명단 연결 대기에서 완료 처리해 주세요');
    const vehicle = vehicles.get(routeRow.vehicleId);
    if (vehicle && new Set(assigned).size + new Set(pendingAssigned).size > Number(vehicle.capacity)) errors.push((routeRow.name || '노선') + ': 차량 정원 ' + vehicle.capacity + '명을 초과했습니다');
  });
  return Array.from(new Set(errors));
}

        '<button class="btn btn-sm btn-ghost" data-act="transportconfigdelete" data-kind="route" data-id="' + esc(routeRow.id) + '"' + disabled + '>노선 삭제</button></div></details>';
  }).join('') + '<div class="ops-actions mt8"><button class="btn btn-sm btn-primary" data-act="transportconfigadd" data-kind="route" data-direction="pickup"' + disabled + '>+ 등원 노선</button>' +
    '<button class="btn btn-sm btn-ghost" data-act="transportconfigadd" data-kind="route" data-direction="dropoff"' + disabled + '>+ 하원 노선</button></div></div></details>';
  h += '<div class="transport-savebar" role="region" aria-label="차량 설정 저장">' +
    (transportConfigDirty ? '<div class="small"><b>저장되지 않은 변경이 있습니다.</b> 지도 계산 결과와 정류장 순서를 포함해 아래 버튼으로 확정하세요.</div>' : '<div class="small muted">설정을 바꾼 뒤 전체 설정 저장을 눌러야 운영에 반영됩니다.</div>') +
    '<button class="btn btn-primary" data-act="transportsave"' + saveDisabled + '>전체 설정 저장</button></div>';
  return h + '</section>';
}

async function saveTransportConfig(button) {

  if (transportHasRiders()) return toast('탑승 중인 학생이 있어 설정을 저장할 수 없습니다');
  if (transportConfigRevisionConflict) return toast('서버의 최신 차량 설정을 새로고침한 뒤 다시 반영해 주세요');

  }
  const auth = sync.auth();
  if (!auth) return toast('동기화 인증이 필요합니다');
  const config = captureTransportConfig();
  const errors = transportConfigValidation(config);
  if (errors.length) return toast(errors[0]);

function moveTransportStop(routeId, stopId, delta) {
  if (!session.isAdmin || transportHasRiders()) return toast('탑승 중인 학생이 있어 설정을 변경할 수 없습니다');
  const config = captureTransportConfig();
  const routeRow = (config.routes || []).find(item => String(item.id) === String(routeId));
  if (!routeRow) return toast('노선을 다시 확인해 주세요');
  const index = (routeRow.stops || []).findIndex(item => String(item.id) === String(stopId));
  const next = index + Number(delta || 0);
  if (index < 0 || next < 0 || next >= routeRow.stops.length) return;
  const moved = routeRow.stops.splice(index, 1)[0];
  routeRow.stops.splice(next, 0, moved);
  routeRow.plan = undefined;
  transportConfigDraft = config; transportConfigDirty = true; transportOpenRouteId = String(routeId);
  transportRestoreFocus = 'stop:' + String(stopId);
  render();
}

async function planTransportRoute(button) {
  if (!session.isAdmin || transportHasRiders() || transportPlannerBusyRoute) return;
  if (!(transportData && transportData.capabilities && transportData.capabilities.mapsPlanning)) {
    return toast('네이버 지도 전용 키 설정이 필요합니다 — Google 지도 확인은 바로 사용할 수 있습니다');
  }
  const auth = sync.auth();
  if (!auth) return toast('동기화 인증이 필요합니다');
  const config = captureTransportConfig();
  const routeId = String(button.dataset.route || '');
  const routeRow = (config.routes || []).find(item => String(item.id) === routeId);
  if (!routeRow) return toast('노선을 다시 확인해 주세요');
  const baseAddress = String(config.baseAddress || '').trim();
  const stops = (routeRow.stops || []).map(stop => ({ id: String(stop.id || ''),
    name: String(stop.name || '').trim(), address: String(stop.address || '').trim() }));
  if (!baseAddress) return toast('학원 출발·도착 기준 지점을 입력해 주세요');
  if (!routeRow.direction || !routeRow.startTime) return toast('방향과 출발 시간을 입력해 주세요');
  if (!stops.length || stops.some(stop => !stop.name || !stop.address)) {
    return toast('모든 정류장의 이름과 공동 승하차 지점 주소를 입력해 주세요');
  }
  const dwellMinutes = Math.min(30, Math.max(0, Number(transportRouteDwellMinutes.get(routeId)) || 0));
  transportConfigDraft = config; transportConfigDirty = true; transportOpenRouteId = routeId;
  transportPlannerBusyRoute = routeId; transportRestoreFocus = 'plan:' + routeId;
  render();
  try {
    const result = await sync.post('/transport', { app: SYNC_APP, auth: auth, action: 'plan',
      baseAddress: baseAddress, direction: routeRow.direction, startTime: routeRow.startTime,
      dwellMinutes: dwellMinutes, stops: stops });
    const plan = normalizeTransportPlan(result && result.plan);
    const suggestedStops = result && Array.isArray(result.suggestedStops) ? result.suggestedStops : [];
    if (!plan || suggestedStops.length !== stops.length) throw new Error('지도 계산 결과 형식을 확인해 주세요');
    const byId = new Map(suggestedStops.map(stop => [String(stop.id || ''), stop]));
    routeRow.stops.forEach(stop => {
      const suggested = byId.get(String(stop.id || ''));
      if (!suggested || !/^\d{2}:\d{2}$/.test(String(suggested.time || ''))) throw new Error('정류장 예상시간을 확인하지 못했습니다');
      stop.time = String(suggested.time);
      if (String(suggested.address || '').trim()) stop.address = String(suggested.address).trim();
    });
    routeRow.plan = plan;
    transportConfigDraft = config; transportConfigDirty = true;
    const trafficBased = result && (result.trafficBased === true || (result.plan && result.plan.trafficBased === true));
    toast((trafficBased ? '실시간 교통량을 반영한' : '지도 기준') + ' 예상시간을 초안에 적용했습니다 — 전체 설정 저장으로 확정하세요');
  } catch (error) {
    toast('지도 예상시간 계산 실패 — ' + String(error && error.message || error));
  } finally {
    transportPlannerBusyRoute = '';
    if (route === 'transport') render();
  }
}

async function addTransportDriver(button) {
  if (!session.isAdmin || transportHasRiders()) return toast('탑승 중인 학생이 있어 기사를 등록할 수 없습니다');
  const auth = sync.auth();
  if (!auth) return toast('원장·관리 담당 동기화 인증이 필요합니다');
  const input = document.querySelector('[data-transport-driver-name]');
  const name = String(input && input.value || '').trim();
  if (!name) return toast('기사 이름을 입력해 주세요');
  if (transportDriverPending.has(name)) return;
  const config = captureTransportConfig();
  const sameMatches = liveStaff().filter(staff => staff.name === name);
  if (sameMatches.length > 1) return toast('같은 이름의 재직 직원이 여러 명입니다 — 직원 관리에서 정확한 기사를 확인해 주세요');
  const same = sameMatches[0];
  if (same && !confirm(name + ' 님은 이미 재직 직원으로 등록되어 있습니다.\n기존 직원을 기사로 재사용할까요?')) return;
  const pendingId = same ? same.id : uid();
  const originalRevision = Number(transportData && transportData.revision) || 0;
  const pending = (async () => {
    if (button) button.disabled = true;
    try {
      if (!same) {
        const stamp = now();
        state.staff.push({ id: pendingId, name: name, createdAt: stamp, updatedAt: stamp, deleted: false });
        save(); sync.dirty = true;
      }
      clearTimeout(sync.timer); sync.timer = null;
      for (let i = 0; sync.busy && i < 100; i++) await new Promise(resolve => setTimeout(resolve, 50));
      const synced = await sync.run();
      if (!synced || sync.err) throw new Error(sync.err || '직원 동기화 결과를 확인하지 못했습니다');
      const latest = await sync.post('/transport', { app: SYNC_APP, auth: auth, action: 'list', date: transportDate });
      const serverConfig = latest && latest.config && typeof latest.config === 'object' ? latest.config : {};
      const serverDrivers = Array.isArray(serverConfig.drivers) ? serverConfig.drivers : [];
      const driver = serverDrivers.find(item => String(item.staffId || item.id || '') === String(pendingId));
      if (!driver) throw new Error('서버 기사 등록 반영을 확인하지 못했습니다');
      config.drivers = serverDrivers.map(item => ({ id: String(item.staffId || item.id || ''),
        staffId: String(item.staffId || item.id || ''), name: String(item.name || '') }));
      if (transportDriverTargetRoute) {
        const target = (config.routes || []).find(item => String(item.id) === String(transportDriverTargetRoute));
        if (target) target.driverId = String(pendingId);
      }
      transportConfigDraft = config; transportConfigDirty = true;
      const latestRevision = Number(latest.revision ?? latest.configRevision) || 0;
      const revisionChanged = latestRevision !== originalRevision;
      if (revisionChanged) transportConfigRevisionConflict = true;
      transportDriverTargetRoute = 'open'; transportRestoreFocus = 'driver-name';
      render();
      toast(revisionChanged
        ? name + ' 기사 등록 완료 — 서버 설정 변경도 감지되어 현재 초안을 보존했습니다. 새로고침 후 다시 반영해 주세요'
        : name + ' 기사 등록 완료 — 직원 개인 링크도 함께 사용할 수 있습니다');
    } catch (error) {
      transportConfigDraft = config;
      toast('기사 등록 실패 — ' + String(error && error.message || error));
    } finally {
      transportDriverPending.delete(name);
      if (button && button.isConnected) button.disabled = false;
    }
  })();
  transportDriverPending.set(name, { id: pendingId, promise: pending });
  await pending;
}

function mutateTransportConfig(kind, action, id, routeId, direction) {
  if (!session.isAdmin || transportHasRiders()) return toast('탑승 중인 학생이 있어 설정을 변경할 수 없습니다');
  const config = captureTransportConfig();
  if (action === 'add') {
    if (kind === 'vehicle') config.vehicles.push({ id: transportSafeId('vehicle'), name: '', plate: '', capacity: 9 });
    else if (kind === 'driver') config.drivers.push({ id: transportSafeId('driver'), staffId: '', name: '' });
    else if (kind === 'route') {
      const newId = transportSafeId('route');
      const pickedDirection = direction === 'pickup' ? 'pickup' : direction === 'dropoff' ? 'dropoff' : '';
      config.routes.push({ id: newId, name: pickedDirection === 'pickup' ? '등원 노선' : pickedDirection === 'dropoff' ? '하원 노선' : '',
        days: [], direction: pickedDirection, startTime: '', vehicleId: '', driverId: '',
        stops: [{ id: transportSafeId('stop'), name: '', address: '', time: '', studentIds: [] }], active: true });
      transportOpenRouteId = newId; transportRestoreFocus = 'route:' + newId;
    }
    else if (kind === 'stop') {
      const routeRow = config.routes.find(item => String(item.id) === String(routeId));
      if (routeRow) {
        const stopId = transportSafeId('stop');
        (routeRow.stops || (routeRow.stops = [])).push({ id: stopId, name: '', address: '', time: '', studentIds: [] });
        routeRow.plan = undefined; transportOpenRouteId = String(routeId); transportRestoreFocus = 'stop:' + stopId;
      }
    }
  } else {
    if (!confirm('이 ' + ({ vehicle: '차량', driver: '기사', route: '노선', stop: '정류장' }[kind] || '항목') + '을 삭제할까요? 저장 전까지 서버에는 반영되지 않습니다.')) return;
    if (kind === 'vehicle') config.vehicles = config.vehicles.filter(item => String(item.id) !== String(id));
    else if (kind === 'driver') config.drivers = config.drivers.filter(item => String(item.id) !== String(id));
    else if (kind === 'route') config.routes = config.routes.filter(item => String(item.id) !== String(id));
    else if (kind === 'stop') {
      const routeRow = config.routes.find(item => String(item.id) === String(routeId));
      if (routeRow) {
        routeRow.stops = (routeRow.stops || []).filter(item => String(item.id) !== String(id));
        routeRow.plan = undefined;
      }
    }
  }
  transportConfigDraft = config; transportConfigDirty = true;
  render();
}

function ymNext(ym) {

function onboardingProgress(record) {
  const done = ONBOARDING_ITEMS.filter(id => record && record.items && record.items[id]).length;
  const total = ONBOARDING_ITEMS.length;
  return { done: done, total: total, pct: total ? Math.round(done / total * 100) : 0 };
}

function onboardingStatus(record, referenceDate) {
  const current = referenceDate || today();
  const first = record && record.firstClassDate;
  const progress = onboardingProgress(record);
  if (!validYmd(first)) return { key: 'date-missing', label: '첫 등원일 확인 필요', progress: progress, overdue: true };
  const end = addDays(first, 30);
  const overdueStages = ONBOARDING_STAGES.filter(stage => {
    const stageDone = stage.items.every(item => record.items && record.items[item.id]);
    return !stageDone && addDays(first, stage.day) < current;
  });
  const complete = current >= end && progress.done === progress.total;
  if (complete) return { key: 'done', label: '30일 관리 완료', progress: progress, overdue: false, end: end };
  if (first === current) return {
    key: 'firstday', label: overdueStages.length ? '오늘 첫 등원 · 확인 지연' : '오늘 첫 등원',
    progress: progress, overdue: !!overdueStages.length, end: end
  };
  if (overdueStages.length) return { key: 'overdue', label: '확인 지연 ' + overdueStages.length + '단계', progress: progress, overdue: true, end: end };
  if (current < first) return { key: 'upcoming', label: '첫 등원 예정', progress: progress, overdue: false, end: end };
  return { key: 'active', label: 'D30까지 관리 중', progress: progress, overdue: false, end: end };
}
