/* ── 교재 DB ──
 * 데이터는 같은 폴더의 textbooks.json (정적 파일 — 동기화 무게 0, 수정은 저장소에서).
 * 학생별 현재 위치(◀)와 남은 분량·예상 소요를 함께 보여준다.
 *
 * 새 교재/기존 교재 수정은 선생님이 앱에서 신청하면(book-add-request.js,
 * book-edit-request.js) 원장 승인 후 여기 병합된다. textbooks.json 자체는 정적
 * 파일이라 배포 없이는 못 고치므로, 승인된 신청만 따로 서버에서 읽어와(list_approved)
 * bookDb.books에 얹는다 — 배포를 기다리지 않고 바로 목록에 나타나는 이유가 이것이다.
 * 항상 추가 → 수정 순서로 덮어써야 새로 추가된 책(ADD..) 위에 수정도 먹는다. */
let bookDb = null, bookDbErr = '';
const bookOpen = new Set();
function loadBooks() {
  fetch('textbooks.json?v=' + Date.now())
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(d => { bookDb = d; applyBookOverlays(); if (route === 'books') render(); loadApprovedBookAdditions(false); loadApprovedBookEdits(false); })
    .catch(e => { bookDbErr = String(e); if (route === 'books') render(); });
}

function applyBookOverlays() { mergeBookAdditions(); mergeBookEdits(); }

let approvedBookAdditions = null;
let approvedBookAdditionsLoaded = false;
let approvedBookAdditionsLoading = false;

/** 승인된 신청을 bookDb.books에 얹는다 — 이미 있는 id는 건너뛰어 중복을 막는다 */
function mergeBookAdditions() {
  if (!bookDb || !approvedBookAdditions) return;
  const existingIds = new Set((bookDb.books || []).map(b => b.id));
  approvedBookAdditions.forEach(a => {
    if (existingIds.has(a.bookId)) return;
    bookDb.books.push({
      id: a.bookId, title: a.title, subject: a.subject || '', level: a.level || '',
      verify: false, note: a.note || '', units: a.units || [],
      vendor: a.vendorName || '', addedBy: a.owner, source: 'added'
    });
    existingIds.add(a.bookId);
  });
}

async function loadApprovedBookAdditions(force) {
  if (approvedBookAdditionsLoading || (approvedBookAdditionsLoaded && !force)) return;
  const auth = sync.auth();
  if (!auth) { approvedBookAdditionsLoaded = true; return; }
  approvedBookAdditionsLoading = true;
  try {
    const result = await sync.post('/book-add-request', { app: SYNC_APP, auth: auth, action: 'list_approved', limit: 300 });
    approvedBookAdditions = result.books || [];
    approvedBookAdditionsLoaded = true;
    applyBookOverlays();
  } catch (error) {
    approvedBookAdditions = approvedBookAdditions || [];
    approvedBookAdditionsLoaded = true;
  } finally {
    approvedBookAdditionsLoading = false;
    if (route === 'books') render();
  }
}

let approvedBookEdits = null;
let approvedBookEditsLoaded = false;
let approvedBookEditsLoading = false;

/** 승인된 수정을 대상 책 위에 그대로 덮어쓴다(최종 상태 스냅샷) — 대상이 아직 없으면(오탈자 등) 건너뛴다 */
function mergeBookEdits() {
  if (!bookDb || !approvedBookEdits) return;
  const byId = new Map((bookDb.books || []).map(b => [b.id, b]));
  approvedBookEdits.forEach(e => {
    const b = byId.get(e.bookId);
    if (!b) return;
    b.title = e.title;
    b.subject = e.subject || '';
    b.level = e.level || '';
    b.vendor = e.vendorName || '';
    b.units = e.units || [];
    b.note = e.note || '';
    b.editedBy = e.owner;
  });
}

async function loadApprovedBookEdits(force) {
  if (approvedBookEditsLoading || (approvedBookEditsLoaded && !force)) return;
  const auth = sync.auth();
  if (!auth) { approvedBookEditsLoaded = true; return; }
  approvedBookEditsLoading = true;
  try {
    const result = await sync.post('/book-edit-request', { app: SYNC_APP, auth: auth, action: 'list_approved', limit: 300 });
    approvedBookEdits = result.edits || [];

    applyBookOverlays();

    approvedBookEdits = approvedBookEdits || [];
    approvedBookEditsLoaded = true;
  } finally {
    approvedBookEditsLoading = false;
    if (route === 'books') render();
  }
}

/** 목차 텍스트 ↔ units[] 변환 — 대단원 이름은 한 줄, 소단원은 앞에 "- "를 붙인다.
 *  기존 다단원 교재(Ⅰ장/Ⅱ장 등)도 그대로 불러와 고칠 수 있게 하는 왕복 변환. */
function unitsToText(units) {
  return (units || []).map(u => u.name + (u.sections && u.sections.length ? '\n' + u.sections.map(s => '- ' + s).join('\n') : '')).join('\n');
}
function textToUnits(text) {
  const lines = String(text || '').split('\n').map(l => l.trim()).filter(Boolean);
  const units = [];
  lines.forEach(line => {
    if (line.startsWith('- ')) {
      if (!units.length) units.push({ name: '목차', sections: [] });
      units[units.length - 1].sections.push(line.slice(2).trim());
    } else {
      units.push({ name: line, sections: [] });
    }
  });
  return units;
}

function bookStudents(bookId) {
  return ((bookDb && bookDb.students) || []).filter(s => s.bookId === bookId);
}
function flatSections(b) {
  const out = [];
  (b.units || []).forEach(u => (u.sections || []).forEach(sec => out.push({ unit: u.name, sec: sec })));
  return out;
}
function posOf(b, at) {
  if (!at) return -1;
  const f = flatSections(b);
  for (let i = 0; i < f.length; i++) if (f[i].sec.includes(at) || at.includes(f[i].sec)) return i;
  return -1;
}

/** 거래처 카드 접기 상태 — 기본은 펼침, 닫은 것만 이 집합에 담는다 */

function bookPendingOrderCount(b) {

}
/** 이 책이 걸린 미완료 주문 — 책 하나짜리 주문(옛 방식 포함)과, 이 책이 포함된 일괄 주문 둘 다 잡는다 */
function bookPendingOrders(b) {
  const orders = state.tasks.filter(t => !t.deleted && t.title.startsWith('[주문] ') &&
    (t.title === '[주문] ' + b.title || (Array.isArray(t.orderItems) && t.orderItems.some(it => it.title === b.title))));
  return orders.filter(t =>
    !Object.keys(state.checks).some(k => state.checks[k].taskId === t.id && state.checks[k].done));
}
/** 이 주문을 취소할 수 있는가 — 원장은 전부, 직원은 본인에게 배정된 것만 */
function canCancelOrder(t) {
  return !!t && (session.isAdmin || (session.isStaffLink && t.staffId === session.staffId));
}

/** 담당: 직원이 요청하면 본인, 원장이 요청하면 관리자(없으면 첫 직원) */

    target: 0, unit: '건', time: '', priority: 'normal',

  });
}

function bookCard(b) {
  const f = flatSections(b);
  const studs = bookStudents(b.id);
  const open = bookOpen.has(b.id);
  const openOrders = bookPendingOrderCount(b);
  const checked = batchSelection.has(b.id);

  let h = '<div class="card">' +
    '<div class="between" data-act="bkopen" data-id="' + b.id + '" style="cursor:pointer">' +
      '<div class="row" style="gap:8px;align-items:flex-start">' +
        '<input type="checkbox" data-act="bkselect" data-id="' + b.id + '" ' + (checked ? 'checked' : '') +
          ' style="margin-top:4px" title="일괄 주문에 담기">' +
        '<div><div class="card-title">' + esc(b.title) +
          (b.verify ? ' <span class="tag edit">검증필요</span>' : '') +
          (b.source === 'added' ? ' <span class="tag" style="color:var(--navy)">🆕 신청 등록</span>' : '') +
          (openOrders ? ' <span class="tag high">🛒 주문 진행 ' + openOrders + '</span>' : '') + '</div>' +
        '<div class="small muted">' + esc(b.subject) + ' · ' + esc(b.level) +
          (f.length ? ' · 소단원 ' + f.length + '개' : ' · 목차 없음') + '</div></div></div>' +
      '<div class="row" style="gap:8px;flex-shrink:0">' +
        (openOrders ? '<button class="btn btn-sm btn-danger" data-act="bkcancelopen" data-id="' + b.id + '">🗑 취소</button>' : '') +
        '<button class="btn btn-sm btn-ghost" data-act="beopen" data-id="' + b.id + '">✏ 수정</button>' +
        '<button class="btn btn-sm btn-ghost" data-act="bkorder" data-id="' + b.id + '">🛒 주문</button>' +
        '<span class="muted">' + (open ? '▾' : '▸') + '</span></div></div>';

  studs.forEach(st => {
    const idx = posOf(b, st.at);
    const done = idx >= 0 ? idx : 0;
    const remain = f.length ? f.length - done : 0;
    const weeks = (st.perWeek && remain) ? Math.ceil(remain / st.perWeek) : 0;
    const pct = f.length ? Math.round(done / f.length * 100) : 0;
    h += '<hr class="sep"><div class="small"><b>' + esc(st.name) + '</b>' +
      (st.teacher ? ' <span class="muted">(' + esc(st.teacher) + ')</span>' : '') +
      (idx >= 0 ? ' — 현재 <b>' + esc(f[idx].sec) + '</b>' : (st.at ? ' — 위치 미확인' : '')) + '</div>' +
      (f.length ? '<div class="bar" style="margin:6px 0 4px"><i style="width:' + pct + '%"></i></div>' +
        '<div class="small muted">진행 ' + done + '/' + f.length +
        (weeks ? ' · 주 ' + st.perWeek + '회 기준 약 ' + weeks + '주 남음' : '') +
        (st.goal ? ' · 목표: ' + esc(st.goal) : '') + '</div>' : '');
  });

  if (open) {
    let lastUnit = '';
    h += '<hr class="sep">';
    f.forEach((row, i) => {
      if (row.unit !== lastUnit) { h += '<div class="sect" style="margin:10px 0 4px">' + esc(row.unit) + '</div>'; lastUnit = row.unit; }
      const marks = studs.filter(st => posOf(b, st.at) === i).map(st => ' <span class="tag doing">◀ ' + esc(st.name) + '</span>').join('');
      h += '<div class="small" style="padding:3px 0">' + (i + 1) + '. ' + esc(row.sec) + marks + '</div>';
    });
    if (!f.length) h += '<div class="small muted">목차가 아직 없습니다 — ' + esc(b.note || '') + '</div>';
  }
  return h + '</div>';
}

function bookAddSummary(item) {
  const parts = [];
  if (item.subject) parts.push('과목: ' + esc(item.subject));
  if (item.level) parts.push('레벨: ' + esc(item.level));
  if (item.vendorName) parts.push('거래처: ' + esc(item.vendorName));

function viewBooks() {
  if (!bookDb && !bookDbErr) { loadBooks(); return '<div class="card"><div class="empty"><b>📚</b>교재 데이터를 불러오는 중…</div></div>'; }
  if (bookDbErr) return '<div class="card"><div class="empty"><b>⚠️</b>교재 데이터를 불러오지 못했습니다.<br><span class="muted">' + esc(bookDbErr) + '</span></div></div>';

  let h = '<div class="card"><div class="card-title">📚 교재 DB</div>' +
    '<div class="card-sub">거래처(출판사)별로 묶었습니다. 거래처를 누르면 접고 펼칠 수 있고, 교재를 누르면 목차가 열립니다.<br>' +
    '기준일 ' + esc(bookDb.updated || '') + ' · 각 교재 카드의 "✏ 수정" 버튼으로 정보를 고칠 수 있습니다.</div>' +
    '<button class="btn btn-sm btn-primary mt14" data-act="baopen">+ 새 교재 추가 신청</button></div>';

  if (session.isAdmin) h += viewBookAddReview() + viewBookEditReview();
  if (session.isStaffLink) h += viewOwnBookAddRequests() + viewOwnBookEditRequests();

  const vendors = bookDb.vendors || [];
  const byVendor = new Map(vendors.map(v => [v.name, []]));
  const unassigned = [];
  (bookDb.books || []).forEach(b => {
    if (b.vendor && byVendor.has(b.vendor)) byVendor.get(b.vendor).push(b);
    else unassigned.push(b);
  });

  const sections = vendors
    .map(v => ({ key: v.name, vend: v, books: byVendor.get(v.name) }))
    .filter(sec => sec.books.length);
  if (unassigned.length) sections.push({ key: UNASSIGNED_VENDOR_KEY, vend: null, books: unassigned });

  if (!sections.length) return h + '<div class="card"><div class="empty"><b>📚</b>등록된 교재가 없습니다.</div></div>';

  sections.forEach(sec => {
    const closed = vendorClosed.has(sec.key);
    const pending = sec.books.reduce((sum, b) => sum + bookPendingOrderCount(b), 0);
    const brands = sec.vend && Array.isArray(sec.vend.brands) ? sec.vend.brands : [];
    h += '<div class="card" style="padding:12px"><div class="between" data-act="vendortoggle" data-key="' + esc(sec.key) + '" style="cursor:pointer">' +
      '<div><div class="card-title">' + (sec.vend ? esc(sec.vend.name) : '거래처 미등록') +
        (sec.vend ? ' ' + vendorTypeBadge(sec.vend) : '') +
        (pending ? ' <span class="tag high">🛒 주문 진행 ' + pending + '</span>' : '') + '</div>' +
        '<div class="small muted">교재 ' + sec.books.length + '권' +
        (brands.length ? ' · ' + esc(brands.slice(0, 4).join('·')) + (brands.length > 4 ? ' 외' : '') : '') +
        '</div></div><span class="muted">' + (closed ? '▸' : '▾') + '</span></div></div>';
    if (!closed) {
      sec.books.forEach(b => { h += bookCard(b); });
      const selectedHere = sec.books.filter(b => batchSelection.has(b.id));
      if (selectedHere.length >= 2) {
        h += '<button class="btn btn-primary btn-block" data-act="bkbatch" data-key="' + esc(sec.key) + '">' +
          '🛒 선택한 ' + selectedHere.length + '권 한번에 주문하기</button>';
      }
    }
  });
  return h;
}

/* ── 원생 현황 (월별 실적) ──
 * 데이터는 roster.json (정적 파일). 신규·퇴원 이벤트에서 월별 재원·유지율을 계산한다.
 * 원장·관리자·선생님 모두 열람 — 숫자가 경각심과 동기가 되도록 전원 공개.
 */
let rosterDb = null, rosterErr = '';
function loadRoster() {
  fetch('roster.json?v=' + Date.now())
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(d => { rosterDb = d; render(); })
    .catch(e => { rosterErr = String(e); if (route === 'roster') render(); });
}
function ymNext(ym) {
  const d = new Date(Number(ym.slice(0, 4)), Number(ym.slice(5, 7)), 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function rosterMonths() {
  const cur = today().slice(0, 7);
  let m = (rosterDb && rosterDb.baseline) || cur;
  const out = [];
  while (m <= cur && out.length < 36) { out.push(m); m = ymNext(m); }
  return out.reverse();   // 최신 달 먼저
}
function activeIn(m) {
  return ((rosterDb && rosterDb.students) || []).filter(s =>
    s.start <= m && (!s.end || s.end > m));
}

function viewRoster() {
  if (!rosterDb && !rosterErr) { loadRoster(); return '<div class="card"><div class="empty"><b>📈</b>원생 데이터를 불러오는 중…</div></div>'; }
  if (rosterErr) return '<div class="card"><div class="empty"><b>⚠️</b>원생 데이터를 불러오지 못했습니다.<br><span class="muted">' + esc(rosterErr) + '</span></div></div>';

  const baseline = rosterDb.baseline;
  const months = rosterMonths();
  const cur = months[0];
  const curActive = activeIn(cur);

  let h = '';

  // 선생님 개인 링크: 내 학생 먼저
  const myName = session.isStaffLink ? ((meStaff() || {}).name || '') : '';
  const isMine = s => myName && String(s.teacher || '').split('·').includes(myName);

  // ⚠️ 관심 필요 — 위험 신호가 있는 학생을 맨 위로 (일반 직원은 내 학생만)
  {
    const rm = riskMap();
    const scope = (session.isAdmin || isManager()) ? curActive : curActive.filter(isMine);
    const risky = scope.map(s => ({ s: s, flags: riskFlags(s.name, rm) })).filter(x => x.flags.length);
    h += '<div class="card"><div class="between mb8">' +
      '<div class="card-title">⚠️ 관심 필요</div>' +
      '<div class="pill ' + (risky.length ? 'bad' : '') + '">' + risky.length + '명</div></div>' +
      (risky.length
        ? '<div class="card-sub mb8">결석이 이어질 때 그날 바로 연락하는 것이 가장 효과가 큽니다.</div>' +
          risky.map(x => '<div class="between small" style="padding:4px 0">' +
            '<span>· ' + esc(x.s.name) + ' <span class="muted">(' + esc(x.s.grade) + ' · ' + esc(x.s.teacher || '미지정') + ')</span> ' +
            x.flags.map(f => '<span class="pill ' + f[1] + '">' + esc(f[0]) + '</span>').join(' ') + '</span>' +
            (session.isAdmin ? '<button class="btn btn-sm btn-ghost" data-act="ctlog" data-name="' + esc(x.s.name) + '">📞 기록</button>' : '') +
            '</div>').join('')
        : '<div class="small muted">지금 기준 위험 신호 없음 — 최근 2주 결석 2회 이상, 지각 3회 이상, 연락 30일 경과가 생기면 여기 올라옵니다.</div>') +
      '</div>';
  }

  if (myName) {
    const mine = rosterDb.students.filter(isMine);
    const mineActive = mine.filter(s => s.start <= cur && (!s.end || s.end > cur));
    if (mine.length) {
      h += '<div class="card"><div class="between mb8">' +
        '<div class="card-title">🧑‍🏫 내 학생</div>' +
        '<div class="pill">재원 ' + mineActive.length + '명</div></div>' +
        mineActive.map(s => '<div class="between small" style="padding:4px 0">' +
          '<span>· ' + esc(s.name) + ' <span class="muted">(' + esc(s.grade) + ' · ' + esc(s.subject) + ')</span>' +
          (s.memo ? ' <span class="pill warn">' + esc(s.memo) + '</span>' : '') + '</span></div>').join('');
      // 내 학생 월별 변동 (변동 있는 달만)
      let moved = '';
      months.forEach(m => {
        const j = mine.filter(s => s.start === m && m !== baseline);
        const l = mine.filter(s => s.end === m);
        if (j.length || l.length) {
          moved += '<div class="small" style="padding:2px 0"><b>' + Number(m.slice(5)) + '월</b> ' +
            (j.length ? ' ➕ ' + j.map(s => esc(s.name)).join(', ') : '') +
            (l.length ? ' ➖ ' + l.map(s => esc(s.name) + (s.reason ? '(' + esc(s.reason) + ')' : '')).join(', ') : '') + '</div>';
        }
      });
      h += moved
        ? '<hr class="sep"><div class="fl mb8">월별 변동</div>' + moved
        : '<hr class="sep"><div class="small muted">기준월 이후 변동 없음 — 전원 유지 중 👍</div>';
      h += '</div>';
    }
  }

  if (session.isStaffLink) {
    return h + '<div class="card"><div class="small muted">개인 링크에서는 담당 학생 명단만 확인할 수 있습니다. 센터 전체 기록과 학생 기록 수정은 원장 화면에서 관리합니다.</div></div>';
  }

  // 이번 달 요약
  h += '<div class="card"><div class="prog">' +
    '<div class="ring" style="--p:100"><b>' + curActive.length + '</b></div>' +
    '<div style="flex:1"><div class="card-title">현재 재원생</div>' +
    '<div class="card-sub">기준월 ' + esc(baseline) + ' 이후의 신규·퇴원을 기록합니다.<br>' +
    '신규·퇴원이 생기면 원장님·관리자가 알려주는 대로 반영됩니다.</div></div></div>';

  // 선생님별 재원
  const byT = {};
  curActive.forEach(s => String(s.teacher || '미지정').split('·').forEach(t => { byT[t] = (byT[t] || 0) + 1; }));
  h += '<hr class="sep"><div class="card-title mb8">담당별 재원 (겸임은 양쪽 집계)</div>' +
    Object.keys(byT).sort((a, b) => byT[b] - byT[a]).map(t =>
      '<div class="between small" style="padding:3px 0"><span>' + esc(t) + '</span><span class="pill">' + byT[t] + '명</span></div>').join('') +
    '</div>';

  // 연락 현황 — 대표·관리자는 전체, 오래 못 챙긴 학생부터 위로
  if (session.isAdmin || isManager()) {
    const rank = s => { const d = daysSinceContact(s.name); return d === null ? 9999 : d; };
    const sorted = curActive.slice().sort((a, b) => rank(b) - rank(a));
    const fresh = curActive.filter(s => { const d = daysSinceContact(s.name); return d !== null && d <= 30; }).length;
    h += '<div class="card"><div class="between mb8">' +
      '<div class="card-title">📞 연락 현황</div>' +
      '<div class="pill ' + (fresh === curActive.length ? '' : 'warn') + '">최근 30일 내 연락 ' + fresh + '/' + curActive.length + '명</div></div>' +
      '<div class="card-sub mb8">오래 연락하지 못한 학생이 위로 올라옵니다. 퇴원은 연락이 끊긴 뒤에 옵니다 — 위쪽부터 챙겨주세요.</div>' +
      sorted.map(s => '<div class="between small" style="padding:4px 0">' +
        '<span>· ' + esc(s.name) + ' <span class="muted">(' + esc(s.grade) + ' · ' + esc(s.teacher || '미지정') + ')</span></span>' +
        '<span class="row" style="gap:6px">' + ctPill(s.name) +
        '<button class="btn btn-sm btn-ghost" data-act="ctlog" data-name="' + esc(s.name) + '">📞 기록</button></span></div>').join('') +
      '</div>';
  }

  // 온라인 프로그램 — 전 직원 공개. 이용 중인 학생이 위, 미지정 학생은 아래에서 지정한다.
  {
    const mon = mondayOf(today()), last = addDays(mon, -7);
    const using = curActive.filter(s => opProgs(s.name).length);
    const rest = curActive.filter(s => !opProgs(s.name).length);
    const low = using.filter(s => opSum(s.name, last) <= OP_LOW).length;
    h += '<div class="card"><div class="between mb8">' +
      '<div class="card-title">📱 온라인 프로그램</div>' +
      (using.length
        ? '<div class="pill ' + (low ? 'warn' : '') + '">이용 ' + using.length + '명' + (low ? ' · 저조 ' + low : '') + '</div>'
        : '') + '</div>' +
      (using.length
        ? '<div class="card-sub mb8">주 1회, 프로그램에서 확인한 학습 횟수만 기록합니다. 접속이 끊기는 것이 정답률보다 먼저 오는 이탈 신호입니다.</div>' +
          using.sort((a, b) => opSum(a.name, last) - opSum(b.name, last)).map(s => {
            const nowN = opSum(s.name, mon), lastN = opSum(s.name, last);
            const cls = lastN === 0 ? 'bad' : lastN <= OP_LOW ? 'warn' : '';
            return '<div class="between small" style="padding:4px 0">' +
              '<span>· ' + esc(s.name) + ' <span class="muted">(' + opProgs(s.name).join('·') + ')</span></span>' +
              '<span class="row" style="gap:6px">' +
                '<span class="pill ' + cls + '">지난주 ' + lastN + '회</span>' +
                '<span class="pill">이번주 ' + nowN + '</span>' +
                '<button class="btn btn-sm btn-ghost" data-act="oplog" data-name="' + esc(s.name) + '">기록</button>' +
              '</span></div>';
          }).join('')
        : '<div class="small muted">아직 지정된 학생이 없습니다. 아래에서 이용 중인 프로그램을 지정하세요.</div>') +
      (rest.length
        ? '<hr class="sep"><div class="fl mb8">프로그램 지정</div><div class="chips">' +
          rest.map(s => '<button class="chip" data-act="oplog" data-name="' + esc(s.name) + '">＋ ' + esc(s.name) + '</button>').join('') +
          '</div>'
        : '') +
      '</div>';
  }

  // 정기 평가 — 넬트(3개월)·메타수학(주간·월간). 추세만 본다.
  {
    const withEx = curActive.filter(s => examAll(s.name).length);
    h += '<div class="card"><div class="between mb8">' +
      '<div class="card-title">📊 정기 평가</div>' +
      (withEx.length ? '<div class="pill">기록 ' + withEx.length + '명</div>' : '') + '</div>' +
      (withEx.length
        ? withEx.map(s => {
            const last = examAll(s.name)[0];
            const tr = examTrend(s.name, last.kind);
            return '<div class="between small" style="padding:4px 0">' +
              '<span>· ' + esc(s.name) + ' <span class="muted">(' + esc(last.kind) + ' · ' + esc(last.date) + ')</span></span>' +
              '<span class="row" style="gap:6px">' +
                (tr ? '<span class="pill ' + tr[1] + '">' + tr[0] + '</span>' : '<span class="pill">첫 기록</span>') +
                '<span class="pill">' + esc(last.label || (last.lv + '단계')) + '</span>' +
                '<button class="btn btn-sm btn-ghost" data-act="exlog" data-name="' + esc(s.name) + '">기록</button>' +
              '</span></div>';
          }).join('')
        : '<div class="small muted">아직 기록이 없습니다. 넬트는 3개월마다, 메타수학은 주간·월간으로 단계만 남기세요.</div>') +
      '<hr class="sep"><div class="fl mb8">평가 기록 추가</div><div class="chips">' +
        curActive.filter(s => !examAll(s.name).length)
          .map(s => '<button class="chip" data-act="exlog" data-name="' + esc(s.name) + '">＋ ' + esc(s.name) + '</button>').join('') +
      '</div></div>';
  }

  // 월별 카드
  months.forEach(m => {
    const act = activeIn(m);
    const joins = rosterDb.students.filter(s => s.start === m);
    const leaves = rosterDb.students.filter(s => s.end === m);
    const prevAct = m === baseline ? null : activeIn(months[months.indexOf(m) + 1] || m);
    const keep = prevAct && prevAct.length
      ? Math.round((prevAct.length - leaves.length) / prevAct.length * 100) : null;

    h += '<div class="card"><div class="between mb8">' +
      '<div class="card-title">' + m.slice(0, 4) + '년 ' + Number(m.slice(5)) + '월</div>' +
      '<div class="row" style="gap:6px">' +
        '<span class="pill">재원 ' + act.length + '</span>' +
        (keep !== null ? '<span class="pill ' + (keep >= 95 ? '' : keep >= 85 ? 'warn' : 'bad') + '">유지율 ' + keep + '%</span>' : '<span class="pill">기준월</span>') +
      '</div></div>' +
      '<div class="between small" style="padding:2px 0"><span>➕ ' + (m === baseline ? '기준 등록' : '신규') + '</span>' +
        '<span>' + (joins.length ? joins.length + '명' : '0') + '</span></div>' +
      (m !== baseline && joins.length
        ? '<div class="small muted">' + joins.map(s => esc(s.name) + '(' + esc(s.grade) + ')').join(', ') + '</div>' : '') +
      '<div class="between small" style="padding:2px 0"><span>➖ 퇴원</span><span>' + (leaves.length ? leaves.length + '명' : '0') + '</span></div>' +
      (leaves.length
        ? leaves.map(s => '<div class="small muted">· ' + esc(s.name) + '(' + esc(s.grade) + ')' +
            (s.reason ? ' — ' + esc(s.reason) : '') + '</div>').join('') : '') +
      '</div>';
  });

  h += '<div class="hint">유지율 = (전월 재원 − 당월 퇴원) ÷ 전월 재원. 신규는 유지율에 넣지 않습니다.<br>' +
    '숫자는 경향입니다 — 퇴원은 반드시 사유와 함께 보세요 (이사·시간 문제와 불만은 다른 이야기입니다).</div>';
  return h;
}

/* ── 보호자 연락처·발송 동의 ──
 * 학부모 피드백 실제 발송(parent-feedback-send.js)이 전화번호를 찾아오는 유일한 곳.
 * 정적 파일(roster.json)에는 절대 안 올라간다 — D1에만 저장되고 원장만 보고 고친다. */
let guardianContacts = null;      // Map studentName -> {phone, consent, updatedAt}
let guardianContactsLoaded = false;
let guardianContactsLoading = false;
let guardianContactsError = '';
let settingsGuardianStudents = [];   // 현재 렌더링된 순서 — data-idx로 입력칸을 찾을 때 쓴다

async function loadGuardianContacts(force) {
  if (!session.isAdmin || guardianContactsLoading || (guardianContactsLoaded && !force)) return;
  const auth = sync.auth();
  if (!auth) { guardianContactsError = '동기화 인증이 필요합니다'; guardianContactsLoaded = true; return; }
  guardianContactsLoading = true; guardianContactsError = '';
  if (route === 'settings') render();
  try {
    const result = await sync.post('/guardian-contact', { app: SYNC_APP, auth: auth, action: 'list' });
    guardianContacts = new Map((result.contacts || []).map(c => [c.studentName, c]));
    guardianContactsLoaded = true;
  } catch (error) {
    guardianContactsError = String(error && error.message || error);
    guardianContactsLoaded = true;
  } finally {
    guardianContactsLoading = false;
    if (route === 'settings') render();
  }
}

async function saveGuardianContact(idx, button) {
  const name = settingsGuardianStudents[Number(idx)];
  if (!name) return toast('학생 정보를 찾을 수 없습니다');
  const phone = (($('#gcPhone-' + idx) || {}).value || '').trim();
  const consent = !!(($('#gcConsent-' + idx) || {}).checked);

function b64(str) { return btoa(unescape(encodeURIComponent(str))).replace(/\+/g, '-').replace(/\//g, '_'); }

const linkCodeVault = new Map();
function storeLinkCode(id, code, expiresAt) {
  linkCodeVault.set(String(id), { code: String(code || ''), expiresAt: Number(expiresAt) || 0 });
}
function linkCodeFor(id) {
  const item = linkCodeVault.get(String(id));
  if (!item || item.expiresAt <= Date.now()) { linkCodeVault.delete(String(id)); return ''; }
  return item.code;
}
function clearLinkCode(id) { linkCodeVault.delete(String(id)); }

/** 링크에는 장기 bearer 대신 1회용 code만 fragment로 담는다. */
function staffLink(id) {
  const code = linkCodeFor(id);
  if (!code) throw new Error('인증 코드가 없어 링크를 만들 수 없습니다');
  return location.origin + location.pathname + '?u=' + encodeURIComponent(id) + '#c=' + encodeURIComponent(code);
}
async function issueLinkCode(id) {
  if (!staffById(id)) throw new Error('대상을 찾을 수 없습니다');
  for (let i = 0; sync.busy && i < 100; i++) await new Promise(resolve => setTimeout(resolve, 50));
  if (sync.enabled()) {
    sync.loud = true;
    await sync.run();
    if (sync.err) throw new Error('운영 데이터 연결 실패 — ' + sync.err);
  }
  const issued = await sync.issueBootstrap(id);
  storeLinkCode(id, issued.code, issued.expiresAt);
  return issued.code;
}

const DIRECTOR_REPORT_TASK_URL = 'https://whdudwns33-wb.github.io/wb-site/task/';

function reportCounts(staffId, date) {
  const list = tasksFor(staffId, date);
  const counts = { done: 0, doing: 0, pending: 0, blocked: 0 };
  list.forEach(t => {
    const status = statusOf(t, date);
    if (status === 'done') counts.done++;
    else if (status === 'doing') counts.doing++;
    else if (status === 'blocked') counts.blocked++;
    else counts.pending++;
  });
  return {
    done: counts.done,
    total: list.length,
    doing: counts.doing,
    pending: counts.pending,
    blocked: counts.blocked
  };
}

function directorReportSummaryText(staffId, date) {
  const staff = staffById(staffId);

  return '📊 원장님 문자 발송용 요약\n' + ((staff && staff.name) || '선생님') + ' 선생님\n' +
    '완료 ' + counts.done + '/' + counts.total + '건 · 진행 ' + counts.doing + '건 · 미완료 ' +
    counts.pending + '건 · 막힘 ' + counts.blocked + '건\n업무지시서: ' + DIRECTOR_REPORT_TASK_URL;
}

function briefText(date) {
  const list = teamStaff();
  let done = 0, total = 0;
  const pend = [], blocked = [], clear = [];
  list.forEach(s => {
    const p = progress(s.id, date);
    done += p.done; total += p.total;
    let hasPend = false;
    tasksFor(s.id, date).forEach(t => {
      const st = statusOf(t, date), c = getCheck(t.id, date), pr = taskProgress(t, c);
      if (st === 'done') return;
      hasPend = true;
      const line = '· ' + s.name + ' — ' + t.title + (t.time ? ' (' + t.time + ')' : '') +
        (st === 'doing' ? ' [진행 ' + pr.done + '/' + pr.total + pr.unit + ']' : '') +
        (c && c.note ? '\n   “' + c.note + '”' : '');
      (st === 'blocked' ? blocked : pend).push(line);
    });
    if (!hasPend && p.total) clear.push(s.name);
  });
  const pct = total ? Math.round(done / total * 100) : 0;

  let txt = '📊 ' + label(date) + ' 업무 마감 브리핑\n' +
    '전체 ' + total + '건 중 ' + done + '건 완료 (' + pct + '%)\n─────────\n';
  if (blocked.length) txt += '🚧 막힘 ' + blocked.length + '건 — 조치 필요\n' + blocked.join('\n') + '\n─────────\n';
  txt += pend.length ? '⚠️ 미완료 ' + pend.length + '건\n' + pend.join('\n') + '\n' : '✅ 미완료 없음\n';
  if (clear.length) txt += '─────────\n✅ 전원 완료: ' + clear.join(', ') + '\n';

  // 지시하지 않았는데 직원이 스스로 한 일
  const own = [];
  list.forEach(s => tasksFor(s.id, date).forEach(t => {
    if (t.origin !== 'staff') return;
    const st = statusOf(t, date);
    own.push('· ' + s.name + ' — ' + t.title + ' [' + STATUS_LABEL[st] + ']');
  }));
  if (own.length) txt += '─────────\n＋ 직원 추가 업무 ' + own.length + '건\n' + own.join('\n') + '\n';

  // 대표 본인 업무는 직원 통계와 섞지 않고 따로 붙인다
  const mineLines = [];
  owners().forEach(s => tasksFor(s.id, date).forEach(t => {
    const st = statusOf(t, date), c = getCheck(t.id, date), pr = taskProgress(t, c);
    mineLines.push('· ' + t.title + (t.time ? ' (' + t.time + ')' : '') +
      ' [' + STATUS_LABEL[st] + (st === 'doing' ? ' ' + pr.done + '/' + pr.total + pr.unit : '') + ']' +
      (c && c.note ? '\n   “' + c.note + '”' : ''));
  }));
  if (mineLines.length) txt += '─────────\n🙋 내 업무 ' + mineLines.length + '건\n' + mineLines.join('\n') + '\n';

  return txt;
}

async function copy(text, successMessage) {
  let copied = false;
  try {
    if (!navigator.clipboard || typeof navigator.clipboard.writeText !== 'function') throw new Error('Clipboard API unavailable');
    await navigator.clipboard.writeText(String(text));
    copied = true;
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = String(text); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    try {
      ta.focus(); ta.select();
      copied = document.execCommand('copy') === true;
    } catch (e2) {
      copied = false;
    } finally {
      document.body.removeChild(ta);
    }
  }
  toast(copied ? (successMessage || '복사했습니다') : '복사되지 않았습니다 — 내용을 길게 눌러 직접 복사해 주세요');
  return copied;
}

    toast('공유를 마쳤습니다');

  } catch (error) {
    if (error && error.name === 'AbortError') toast('공유가 취소되었습니다');
    else toast('공유하지 못했습니다 — 링크 복사를 이용해 주세요');
    return false;
  }
}

async function connectPendingDevice() {
  if (IS_KAKAO_IN_APP) {
    toast('카카오톡 안에서는 연결하지 않습니다 — 원본 링크를 최종 브라우저에서 열어 주세요');
    return false;
  }
  if (!pendingBootstrapCode || linkExchangeBusy) return false;
  const code = pendingBootstrapCode;
  const previousToken = String(state.settings.myToken || '');
  linkExchangeBusy = true;
  personAccessProblem = null;
  render();
  try {
    const exchanged = await sync.exchangeBootstrap(session.staffId, code);
    state.settings.myToken = exchanged.token;
    state.settings.pullAt = 0;
    state.settings.pushAt = 0;
    save();
    pendingBootstrapCode = '';
    scrubBootstrapCodeFromAddress();
    sync.personVerified = false;
    const verified = await sync.run();
    ensureSyncLoopStarted();
    if (verified) toast('이 기기의 개인 링크 연결을 완료했습니다');
    else toast('기기 연결은 저장했습니다 — 동기화를 다시 확인하고 있습니다');
    return verified;
  } catch (error) {
    if (!previousToken) state.settings.myToken = '';
    personAccessProblem = classifyPersonLinkError(error, 'exchange');
    toast(personAccessProblem.title);
    return false;
  } finally {
    linkExchangeBusy = false;
    render();
  }
}

async function createVerifiedHandoffLink() {
  if (!hasVerifiedPersonAuth()) {
    toast('개인 인증이 확인된 브라우저에서만 새 링크를 만들 수 있습니다');
    return false;
  }
  const verified = await sync.run();
  if (!verified) {
    const authLost = personAccessProblem && ['session_expired', 'session_revoked', 'auth_required'].includes(personAccessProblem.kind);
    toast(authLost
      ? '개인 인증을 확인하지 못했습니다 — 새 개인 링크가 필요합니다'
      : '동기화 상태를 확인하지 못했습니다 — 잠시 후 다시 시도해 주세요');
    render();
    return false;
  }
  if (!hasVerifiedPersonAuth()) {
    toast('개인 인증을 다시 확인해 주세요');
    return false;
  }
  try {
    const issued = await sync.handoff();
    const url = location.origin + location.pathname + '?u=' + encodeURIComponent(session.staffId) + '#c=' + encodeURIComponent(issued.code);
    const copied = await copy(url, '새 브라우저용 링크를 복사했습니다 · 10분 안에 열어 주세요');
    if (!copied) showText('새 브라우저용 개인 링크', url);
    return copied;
  } catch (error) {
    const problem = classifyPersonLinkError(error, 'session');
    if (problem.kind === 'session_expired' || problem.kind === 'session_revoked' || problem.kind === 'auth_required') {
      sync.personVerified = false;
      personAccessProblem = problem;
      state.settings.myToken = '';
      save();
      render();
    }

function flushReportInputs() {
  clearTimeout(inputTimer);
  document.querySelectorAll('[data-act="note"]').forEach(noteEl => {
    const date = noteEl.dataset.date || cursor;
    const current = getCheck(noteEl.dataset.id, date);
    if (String((current && current.note) || '') !== noteEl.value) {
      setCheck(noteEl.dataset.id, date, { note: noteEl.value });
    }
  });
  document.querySelectorAll('[data-act="cntset"]').forEach(cntEl => {
    const date = cntEl.dataset.date || cursor;
    const value = Math.max(0, Number(cntEl.value) || 0);
    const current = getCheck(cntEl.dataset.id, date);
    if (Number((current && current.count) || 0) !== value) {
      const task = state.tasks.find(t => t.id === cntEl.dataset.id);
      setCheck(cntEl.dataset.id, date, { count: value, blocked: false });
      if (task) syncAuto(task, date);

async function settleDirectorReportSync() {
  clearTimeout(sync.timer);
  sync.timer = null;
  for (let attempt = 0; sync.busy && attempt < 60; attempt++) {
    await new Promise(resolve => setTimeout(resolve, 50));
  }
  if (sync.busy) throw new Error('SYNC_BUSY');
  await sync.run();
  if (sync.dirty || sync.err) throw new Error('SYNC_FAILED');
}

function directorReportErrorText(error) {
  const raw = String(error && error.message || error || '');
  if (/SYNC_BUSY|SYNC_FAILED|동기화|인증/i.test(raw)) {
    return '최신 수행 상태를 동기화하지 못해 문자 요청을 접수하지 않았습니다. 연결을 확인한 뒤 다시 시도해 주세요.';
  }
  if (/설정|구성|NOT_CONFIGURED|secret|api.?key|발신번호|수신번호/i.test(raw)) {
    return '문자 발송 설정이 아직 완료되지 않았습니다. 원장님 설정을 확인해 주세요.';
  }
  if (/중복|이미.*접수/i.test(raw)) return '같은 수행 보고가 이미 접수됨';
  return '문자 발송 요청을 접수하지 못했습니다. 잠시 후 다시 시도해 주세요.';
}

async function submitDirectorReport(button) {
  const context = directorReportContext;
  if (!context || context.date !== today()) return toast('오늘 수행 보고만 문자로 접수할 수 있습니다');
  if (session.isStaffLink && context.staffId !== session.staffId) return toast('본인 수행 보고만 접수할 수 있습니다');
  if (directorReportSending) return;
  const auth = sync.auth();
  if (!auth) return toast(session.isAdmin ? '원장 동기화 인증이 필요합니다' : '개인 링크 인증이 필요합니다');
  if (!confirm('원장님께 오늘 수행 보고 요약 문자 1건을 접수할까요?\n문자 비용이 발생할 수 있습니다.')) return;

  directorReportSending = true;
  if (button) { button.disabled = true; button.textContent = '최신 상태 확인 중…'; }
  try {
    flushReportInputs();
    await settleDirectorReportSync();
    if (button) button.textContent = '문자 요청 접수 중…';
    const result = await sync.post('/director-report-send', directorReportRequestPayload(context));
    const sendStatus = String(result && result.send && result.send.status || 'unknown');
    if (sendStatus === 'accepted') {
      toast('원장님 문자 발송 요청이 접수됨');
      closeModal();
    } else {
      toast('결과 확인 필요 — 다시 누르지 말고 원장 발송 내역을 확인해 주세요');
      if (button) {
        button.disabled = true;
        button.textContent = '결과 확인 필요';
      }
    }
  } catch (error) {
    toast(directorReportErrorText(error));
    if (button) { button.disabled = false; button.textContent = '원장님께 요약 문자 접수'; }
  } finally {
    directorReportSending = false;
  }
}

/* ══════════════════════════════════════════════════════
   8-1. 말로 쓴 지시를 업무로 — 카톡 문장 해석
   ══════════════════════════════════════════════════════ */
const pad2 = n => String(n).padStart(2, '0');

/** "혜지쌤", "김혜지", "혜지 선생님" 모두 잡는다 */
function matchStaff(text) {
  const list = liveStaff();
  for (const s of list) if (text.includes(s.name)) return { s: s, token: s.name };
  for (const s of list) {
    const short = s.name.length >= 3 ? s.name.slice(1) : '';
    if (short.length >= 2 && text.includes(short)) return { s: s, token: short };
  }
  return null;
}

/** "3시까지", "오후 3시반", "15:00", "9시 30분" */
function matchTime(text) {
  let m = text.match(/(\d{1,2})\s*:\s*(\d{2})/);
  if (m) return { time: pad2(m[1]) + ':' + m[2], token: m[0] };

  m = text.match(/(오전|오후|아침|저녁|밤|낮)?\s*(\d{1,2})\s*시\s*(반|\d{1,2}\s*분)?/);
  if (!m) return null;
  let h = Number(m[2]);
  const mer = m[1] || '';
  if (/오후|저녁|밤/.test(mer)) { if (h < 12) h += 12; }
  else if (/오전|아침/.test(mer)) { if (h === 12) h = 0; }
  else if (h >= 1 && h <= 7) h += 12;   // 오후에 도는 센터라 한 자리 시각은 오후로 본다
  let mm = '00';
  if (m[3]) mm = m[3] === '반' ? '30' : pad2(parseInt(m[3], 10));
  return { time: pad2(h) + ':' + mm, token: m[0] };
}

/** "오늘", "내일", "모레", "금요일", "8월 3일" */
function matchDate(text) {
  if (/오늘/.test(text)) return { date: today(), token: '오늘' };
  if (/내일/.test(text)) return { date: addDays(today(), 1), token: '내일' };
  if (/모레/.test(text)) return { date: addDays(today(), 2), token: '모레' };

  const dw = text.match(/([일월화수목금토])\s*요일/);
  if (dw) {
    const want = DOW.indexOf(dw[1]);
    for (let i = 1; i <= 7; i++) {
      const c = addDays(today(), i);
      if (dowOf(c) === want) return { date: c, token: dw[0] };
    }
  }
  const md = text.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
  if (md) return { date: new Date().getFullYear() + '-' + pad2(md[1]) + '-' + pad2(md[2]), token: md[0] };
  return null;
}

function cleanTitle(s) {
  return String(s)
    .replace(/(쌤|선생님|샘)/g, ' ')
    .replace(/(긴급히?|급히|급하게|asap)/gi, ' ')   // 중요 표시로 이미 잡히므로 제목에서는 뺀다
    .replace(/^[\s,.·\-~]*(에게|한테|께)?\s*/, '')
    .replace(/\s*(좀|까지|안에|전에)\s*/g, ' ')
    .replace(/\s*(부탁\s*(해요|드려요|드립니다|합니다|해)|해\s*주세요|해주세요|해줘요|해줘|하세요|해주시고|해주시면|바랍니다)\s*[.!~]*$/, '')
    .replace(/\s+/g, ' ')
    .replace(/[\s.,!~]+$/, '')
    .trim();
}

/** 한 줄에 한 건. 이름·시간·날짜를 뽑고 나머지를 업무 이름으로 쓴다. */
function parseInstructions(text) {
  return String(text || '').split('\n').map(l => l.trim()).filter(Boolean).map(line => {
    let rest = line;
    const sm = matchStaff(rest); if (sm) rest = rest.replace(sm.token, ' ');
    const tm = matchTime(rest);  if (tm) rest = rest.replace(tm.token, ' ');
    const dm = matchDate(rest);  if (dm) rest = rest.replace(dm.token, ' ');
    const title = cleanTitle(rest);
    return {
      staff: sm ? sm.s.name : '',
      title: title || line,
      time: tm ? tm.time : '',
      start: dm ? dm.date : today(),
      repeat: 'once',
      priority: /긴급|급하|급히|중요|바로|asap/i.test(line) ? 'high' : 'normal',
      carry: true,
      raw: line
    };
  });
}

function aiModal() {

function applyAssignments(input, preConfirmed) {
  let data = input;
  if (typeof input === 'string') {
    try { data = JSON.parse(input); }
    catch (e) { return toast('JSON 형식이 잘못되었습니다'); }
  }
  const list = Array.isArray(data) ? data : (data.assignments || []);
  if (!list.length) return toast('등록할 업무가 없습니다');

  // 이름 확인 → 없는 직원은 물어보고 등록
  const missing = [...new Set(list.map(a => String(a.staff || '').trim()).filter(n => n && !staffByName(n)))];
  if (missing.length) {
    if (!preConfirmed && !confirm('등록되지 않은 직원이 있습니다: ' + missing.join(', ') + '\n새로 등록할까요?')) return;
    missing.forEach(n => {
      const isOwner = list.some(a => String(a.staff || '').trim() === n && a.owner === true);
      state.staff.push({ id: uid(), name: n, owner: isOwner, createdAt: now(), updatedAt: now(), deleted: false });
    });
  }

  let added = 0, skipped = 0;
  list.forEach(a => {
    const s = staffByName(a.staff);
    if (!s) { skipped++; return; }
    const steps = (a.steps || []).map(x => ({
      id: uid(), label: typeof x === 'string' ? x : String(x.label || '')
    })).filter(x => x.label);
    state.tasks.push({
      id: uid(), groupId: 'ai-' + now(), staffId: s.id,
      title: String(a.title || '').trim() || '(제목 없음)',
      detail: String(a.detail || ''),
      guide: String(a.guide || ''),
      steps: steps,
      target: Number(a.target) || 0,
      unit: String(a.unit || '건'),
      time: String(a.time || ''),
      priority: a.priority === 'high' ? 'high' : 'normal',
      repeat: ['once', 'daily', 'weekday', 'days'].includes(a.repeat) ? a.repeat : 'once',
      days: Array.isArray(a.days) ? a.days.map(Number).filter(n => n >= 0 && n <= 6) : [],
      start: /^\d{4}-\d{2}-\d{2}$/.test(a.start || '') ? a.start : today(),
      end: /^\d{4}-\d{2}-\d{2}$/.test(a.end || '') ? a.end : '',
      carry: a.carry !== false,
      createdAt: now(), updatedAt: now(), deleted: false
    });
    added++;
  });

  save(); queueSync(); closeModal(); render();
  toast(added + '건 등록' + (skipped ? ' · ' + skipped + '건 건너뜀' : ''));
}

document.addEventListener('click', ev => {
  const goEl = ev.target.closest('[data-go]');
  if (goEl) { go(goEl.dataset.go); return; }

  const el = ev.target.closest('[data-act]');
  if (!el) return;
  if (el.dataset.act === 'closemodal'
      && ev.target.closest('.modal-box')
      && !ev.target.closest('button[data-act="closemodal"]')) return;

  const act = el.dataset.act;
  const id = el.dataset.id;
  const date = el.dataset.date || cursor;
  const task = () => state.tasks.find(x => x.id === id);

  switch (act) {

    /* 개인 링크 기기 연결 */
    case 'connectdevice': connectPendingDevice(); break;
    case 'copyentrylink': {
      const link = currentBootstrapLink();
      if (!link) return toast('복사할 개인 링크가 없습니다');
      copy(link, '원본 개인 링크를 복사했습니다');
      break;
    }
    case 'shareentrylink': shareBootstrapLink(); break;
    case 'useexistingauth': useExistingPersonAuth(); break;
    case 'retryauthcheck': startSyncSession(); break;

    /* 잠금 */
    case 'setpin': {
      const v = ($('#pin').value || '').trim();
      if (v.length < 4) return toast('4자리 이상 입력해 주세요');
      state.settings.adminPin = v; save(); session.unlock(); go('staff'); toast('설정되었습니다');
      break;
    }
    case 'login': {
      if (($('#pin').value || '').trim() !== state.settings.adminPin) return toast('비밀번호가 다릅니다');
      session.unlock(); render(); toast('환영합니다');
      break;
    }
    case 'logout': session.lock(); render(); break;
    case 'changepin': {
      const v = ($('#newPin').value || '').trim();
      if (v.length < 4) return toast('4자리 이상 입력해 주세요');
      state.settings.adminPin = v; save(); toast('변경되었습니다');
      break;
    }
    case 'gcsave': saveGuardianContact(el.dataset.idx, el); break;
    case 'gcrefresh': guardianContactsLoaded = false; loadGuardianContacts(true); break;

    /* 날짜 */
    case 'day':  cursor = addDays(cursor, Number(el.dataset.n)); cursorPinned = (cursor !== today()); render(); break;
    case 'week': cursor = addDays(cursor, Number(el.dataset.n) * 7); cursorPinned = (mondayOf(cursor) !== mondayOf(today())); render(); break;

    /* 체크 · 단계 · 수량 · 막힘 */
    case 'toggle': {
      const t = task(); if (!t) break;
      const c = getCheck(id, date);
      const turnOn = !(c && c.done);
      const steps = {};
      (t.steps || []).forEach(s => { steps[s.id] = turnOn; });
      setCheck(id, date, {
        done: turnOn, at: turnOn ? now() : null,
        steps: steps,
        count: t.target ? (turnOn ? t.target : 0) : ((c && c.count) || 0),
        blocked: turnOn ? false : (c ? c.blocked : false)
      });
      render();
      break;
    }
    case 'step': {
      const t = task(); if (!t) break;
      const c = getCheck(id, date);
      const cur = Object.assign({}, (c && c.steps) || {});
      const k = el.dataset.step;
      cur[k] = !cur[k];
      setCheck(id, date, { steps: cur, blocked: false });
      syncAuto(t, date);
      render();
      break;
    }
    case 'cnt': {
      const t = task(); if (!t) break;
      const c = getCheck(id, date);
      const n = Math.max(0, ((c && c.count) || 0) + Number(el.dataset.n));
      setCheck(id, date, { count: n, blocked: false });
      syncAuto(t, date);
      render();
      break;
    }
    case 'block': {
      const c = getCheck(id, date);
      const on = !(c && c.blocked);
      setCheck(id, date, { blocked: on, done: on ? false : (c ? c.done : false) });
      render();
      toast(on ? '원장님 화면에 표시됩니다' : '막힘을 해제했습니다');
      break;
    }
    case 'panel': {
      const k = id + '|' + date;
      openPanels.has(k) ? openPanels.delete(k) : openPanels.add(k);
      render();
      break;
    }

    /* 직원 */
    case 'pickstaff': viewStaff = id; render(); break;
    case 'openstaff': viewStaff = id; go('today'); break;
    case 'addstaff': {
      const name = ($('#sName').value || '').trim();
      if (!name) return toast('이름을 입력해 주세요');
      state.staff.push({ id: uid(), name: name, createdAt: now(), updatedAt: now(), deleted: false });
      save(); queueSync(); render(); toast(name + ' 등록 완료');
      break;
    }
    case 'delstaff': {
      if (!session.isAdmin) break;
      const s = staffById(id);
      if (!s || !confirm(s.name + ' 님을 삭제할까요? 지시 기록은 남고 개인 링크는 해지됩니다.')) return;
      s.deleted = true; s.updatedAt = now();
      save(); queueSync(); render();
      sync.revokeAccess(id)
        .then(() => toast(s.name + ' — 삭제 및 개인 링크 해지 완료'))
        .catch(e => toast('직원 삭제는 저장했습니다 — 링크 해지는 다시 시도해 주세요: ' + e.message));
      break;
    }
    case 'togglemanager': {
      if (!session.isAdmin) break;
      const s = staffById(id);
      if (!s) break;
      s.manager = !s.manager; s.updatedAt = now();
      save(); queueSync(); render();
      toast(s.manager
        ? s.name + ' — 관리자로 지정. 본인 개인 링크에서 현황·발행이 열립니다'
        : s.name + ' — 관리자 해제');
      break;
    }
    case 'attcheck': {
      if (!session.isStaffLink) break;
      const me = currentStaff(); if (!me) break;
      const a = attOf(me.id, today());

        if (!confirm('출근 체크를 취소할까요?' + (a.out ? ' 퇴근 기록도 함께 지워집니다.' : ''))) return;
        setCheck(attKey(me.id), today(), { done: false, at: null, out: null });
      } else {
        setCheck(attKey(me.id), today(), { done: true, at: now(), out: null, blocked: false });
        toast('출근 체크 완료 — 오늘도 수고하세요!');
      }

      break;
    }
    case 'attout': {

      } else openMsg();
      break;
    }
    case 'smsmanual': {
      const phone = prompt('거래처 전화번호를 입력해 주세요 (문자 앱으로 직접 보낼 때만 필요합니다)');
      if (!phone) break;
      const msg = ($('#mText') || {}).value || '';
      location.href = 'sms:' + phone.replace(/[^\d+]/g, '') + '?body=' + encodeURIComponent(msg);
      break;
    }
    case 'bossend': {
      const t = state.tasks.find(x => x.id === id); if (!t) break;
      const auth = sync.auth();
      if (!auth) { toast('동기화 인증이 필요합니다'); break; }
      const btn = el; btn.disabled = true; btn.textContent = '보내는 중…';
      const resultBox = $('#bosResult');
      sync.post('/book-order-send', { app: SYNC_APP, auth: auth, taskId: t.id })
        .then(res => {
          if (res.send && res.send.status === 'accepted') {
            const steps = t.steps || [];
            if (steps[0]) {
              const c = getCheck(t.id, today());
              const cur = Object.assign({}, (c && c.steps) || {});
              cur[steps[0].id] = true;
              setCheck(t.id, today(), { steps: cur, note: '자동 발송 완료 · ' + new Date().toLocaleString('ko-KR') });
            }
            toast(res.idempotent ? '이미 발송된 주문입니다' : ((res.vendorName || '거래처') + ' — 발송 완료'));
            closeModal(); render();
          } else if (resultBox) {
            resultBox.textContent = '⏳ ' + (res.send ? res.send.status : '처리 중') + ' — 잠시 후 다시 확인해 주세요';
          }
        })
        .catch(error => {
          if (btn) { btn.disabled = false; btn.textContent = '🚀 지금 바로 문자 발송'; }
          if (resultBox) resultBox.textContent = '❌ ' + (error.message || error);
          else toast('발송 실패 — ' + (error.message || error));
        });
      break;
    }
    case 'latt': {
      const t = task(); if (!t) break;
      const c = getCheck(id, date);
      const v = el.dataset.v;
      const next = (c && c.att === v) ? '' : v;
      setCheck(id, date, { att: next });
      if (next === 'A') toast('결석 — 메모에 사유와 보강 계획을 남겨주세요');
      render();
      break;
    }
    case 'fbtext': {

      fbModal();
      break;
    }
    case 'fbq': {
      if (!fbCtx) break;
      const q = el.dataset.q, v = el.dataset.v;
      if (q === 'focus') fbCtx.focus = (fbCtx.focus === v) ? null : v;
      else if (q === 'plus') {
        const n = Number(v);
        fbCtx.plus = fbCtx.plus.includes(n) ? fbCtx.plus.filter(x => x !== n)
          : (fbCtx.plus.length >= 2 ? (toast('잘한 점은 2개까지만'), fbCtx.plus) : fbCtx.plus.concat(n));
      }
      else if (q === 'minus') fbCtx.minus = (fbCtx.minus === Number(v)) ? null : Number(v);
      fbModal();

    case 'fbmake': {

    case 'alllinks': {

    }
    case 'orderText':

        .then(() => showText('카카오톡 지시서 문구', orderText(id, cursor)))
        .catch(e => toast('링크를 만들지 못했습니다 — ' + e.message));

    case 'directorreportsend': submitDirectorReport(el); break;

    case 'managetasks': manageTasks(id); break;
    case 'newtask': editTaskModal(null); break;
    case 'lessonday': {
      const draft = currentLessonDraft(), slot = draft.scheduleSlots[Number(el.dataset.i)];
      if (!slot) break;
      const day = Number(el.dataset.d), at = slot.days.indexOf(day);
      if (at < 0) slot.days.push(day); else slot.days.splice(at, 1);

    case 'lessonslotadd':
      currentLessonDraft().scheduleSlots.push({ days: [], startTime: '', endTime: '' }); persistLessonDraft(); render(); break;

      lessonDraft = lessonDraftFromTask(t);

    }
    case 'lessonpreview': previewLessonRegistration(); break;
    case 'lessonsave': saveLessonRegistration(el); break;

    /* 빠른 추가 — 한 줄로 쓰고 바로 카톡 문구까지 */
    case 'qadd': {
      const line = ($('#qAdd').value || '').trim();
      if (!line) return toast('내용을 입력해 주세요');
      const me = currentStaff();
      if (!me) return toast('직원을 먼저 선택해 주세요');

        id: uid(), groupId: 'quick-' + now(), staffId: me.id,
        title: p.title, detail: '', guide: '', steps: [], target: 0, unit: '건',
        time: p.time, priority: p.priority,
        repeat: 'once', days: [], start: p.start, end: '', carry: true,
        origin: actor(), createdAt: now(), updatedAt: now(), deleted: false
      };

      save(); queueSync(); render();
      toast(me.name + ' — 추가했습니다');
      if (!session.isStaffLink) {
        setTimeout(() => {
          issueLinkCode(t.staffId)
            .then(() => showText('카톡으로 보낼 문구', quickText(t)))
            .catch(e => toast('링크를 만들지 못했습니다 — ' + e.message));
        }, 300);
      }
      break;
    }

    /* 카톡 문장 붙여넣기 */
    case 'kopen': kakaoText = ''; kakaoParsed = null; kakaoModal(); break;
    case 'kparse': {
      kakaoText = $('#kText').value || '';
      kakaoParsed = parseInstructions(kakaoText);
      kakaoModal();
      break;
    }
    case 'kapply': {
      pendingAdd = kakaoParsed;
      kakaoParsed = null; kakaoText = '';
      closeModal(); render();
      break;
    }
    case 'etask': {
      const t = task();
      if (!t) break;
      if (!canEditTask(t)) return toast('원장님이 내린 지시는 수정할 수 없습니다');
      editTaskModal(id);
      break;
    }
    case 'edelete': {
      const t = state.tasks.find(x => x.id === eForm.id);
      if (!t) break;
      if (!canEditTask(t)) { closeModal(); return toast('원장님이 내린 지시는 중단할 수 없습니다'); }
      if (!confirm('이 업무를 중단할까요? 지난 기록은 유지됩니다.')) return;
      t.deleted = true; t.updatedAt = now();
      eForm = null;
      save(); queueSync(); closeModal(); render(); toast('중단했습니다');
      break;
    }
    case 'erepeat': {
      eForm.repeat = el.dataset.v;
      document.querySelectorAll('#eRepeat .chip').forEach(c => c.classList.toggle('on', c.dataset.v === eForm.repeat));
      $('#eDaysWrap').style.display = eForm.repeat === 'days' ? '' : 'none';
      break;
    }
    case 'edow': {
      const d = Number(el.dataset.d), i = eForm.days.indexOf(d);
      if (i < 0) eForm.days.push(d); else eForm.days.splice(i, 1);
      el.classList.toggle('on');
      break;
    }
    case 'ecarry': {
      eForm.carry = !eForm.carry;
      el.classList.toggle('on', eForm.carry);
      el.textContent = (eForm.carry ? '☑' : '☐') + ' 못 끝내면 다음날로 이월';
      break;
    }
    case 'esave': saveEditedTask(); break;
    case 'deltask': {
      const t = task();
      if (!t || !confirm('이 지시를 중단할까요? 지난 기록은 유지됩니다.')) return;
      t.deleted = true; t.updatedAt = now();
      save(); queueSync(); closeModal(); render(); toast('중단했습니다');
      break;
    }

    /* AI 가져오기 */
    case 'aiopen': aiModal(); break;
    case 'aisample': $('#aiText').value = AI_SAMPLE; break;
    case 'aiapply': applyAssignments($('#aiText').value || ''); break;
    case 'padd': { const p = pendingAdd; pendingAdd = null; applyAssignments(p, true); go('today'); break; }
    case 'pcancel': pendingAdd = null; render(); toast('취소했습니다'); break;

    /* 지시서 작성 */
    case 'wstaff': {
      const i = wForm.staff.indexOf(id);
      if (i < 0) wForm.staff.push(id); else wForm.staff.splice(i, 1);
      el.classList.toggle('on');
      break;
    }
    case 'wrepeat': {
      wForm.repeat = el.dataset.v;
      document.querySelectorAll('#wRepeat .chip').forEach(c => c.classList.toggle('on', c.dataset.v === wForm.repeat));
      $('#wDaysWrap').style.display = wForm.repeat === 'days' ? '' : 'none';
      $('#wEndWrap').style.display  = wForm.repeat === 'once' ? 'none' : '';
      break;
    }
    case 'wdow': {
      const d = Number(el.dataset.d), i = wForm.days.indexOf(d);
      if (i < 0) wForm.days.push(d); else wForm.days.splice(i, 1);
      el.classList.toggle('on');
      break;
    }
    case 'wcarry': { wForm.carry = !wForm.carry; render(); break; }
    case 'wadd': {
      const title = ($('#wTitle').value || '').trim();
      if (!wForm.staff.length) return toast('받는 직원을 선택해 주세요');
      if (!title) return toast('업무 내용을 입력해 주세요');
      if (wForm.repeat === 'days' && !wForm.days.length) return toast('요일을 선택해 주세요');
      wForm.start = $('#wStart').value || today();
      wForm.end = (wForm.repeat === 'once' ? '' : ($('#wEnd').value || ''));
      draft.push({
        title: title,
        detail: ($('#wDetail').value || '').trim(),
        guide: ($('#wGuide').value || '').trim(),
        steps: ($('#wSteps').value || '').split('\n').map(x => x.trim()).filter(Boolean)
                 .map(l => ({ id: uid(), label: l })),
        target: Number($('#wTarget').value) || 0,
        unit: ($('#wUnit').value || '건').trim(),
        time: $('#wTime').value || '',
        priority: $('#wPri').value,
        repeat: wForm.repeat,
        days: wForm.days.slice().sort(),
        start: wForm.start,
        end: wForm.end,
        carry: wForm.carry,
        staffIds: wForm.staff.slice(),
        names: wForm.staff.map(x => (staffById(x) || {}).name).filter(Boolean)
      });
      render();
      toast('목록에 담았습니다 (' + draft.length + '건)');
      break;
    }
    case 'wdel': draft.splice(Number(el.dataset.i), 1); render(); break;
    case 'wclear': draft = []; render(); break;
    case 'wpublish': {
      if (!draft.length) return;
      const gid = uid(), touched = new Set();
      draft.forEach(d => d.staffIds.forEach(sid => {
        state.tasks.push({
          id: uid(), groupId: gid, staffId: sid,
          title: d.title, detail: d.detail, guide: d.guide,
          steps: (d.steps || []).map(s => ({ id: uid(), label: s.label })),
          target: d.target, unit: d.unit,
          time: d.time, priority: d.priority,
          repeat: d.repeat, days: d.days, start: d.start, end: d.end, carry: d.carry,
          origin: session.isStaffLink ? 'manager' : undefined,
          createdAt: now(), updatedAt: now(), deleted: false
        });
        touched.add(sid);
      }));
      const n = draft.length;
      draft = [];
      save(); queueSync(); render();
      toast(n + '건 발행 완료');
      const first = [...touched][0];
      if (first) setTimeout(() => {
        issueLinkCode(first)
          .then(() => showText('카카오톡 지시서 문구', orderText(first, today())))
          .catch(e => toast('링크를 만들지 못했습니다 — ' + e.message));
      }, 400);
      break;
    }

    /* 설정 */
    case 'savecfg': {
      state.settings.syncSecret = ($('#cfgSecret').value || '').trim();
      save(); render(); toast('저장했습니다');
      if (state.settings.syncSecret) { sync.loud = true; sync.run(); }
      break;
    }
    case 'syncnow': sync.loud = true; sync.run(); toast('동기화 중…'); break;
    case 'export': {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'wb-업무지시서-' + today() + '.json';
      a.click(); URL.revokeObjectURL(a.href);
      break;
    }
    case 'import': {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = 'application/json';
      inp.onchange = () => {
        const f = inp.files[0]; if (!f) return;
        const r = new FileReader();
        r.onload = () => {
          try {
            const p = JSON.parse(r.result);
            if (!p || !Array.isArray(p.staff)) throw new Error('형식 오류');
            if (!confirm('현재 데이터를 덮어씁니다. 계속할까요?')) return;
            state = Object.assign(blankState(), p);
            save(); render(); toast('불러왔습니다');
          } catch (e) { toast('파일을 읽을 수 없습니다'); }
        };
        r.readAsText(f);
      };
      inp.click();
      break;
    }
    case 'closemodal': closeModal(); break;
  }
});

/* 메모 · 수량 직접 입력 */
let inputTimer = null;
document.addEventListener('input', ev => {
  const noteEl = ev.target.closest('[data-act="note"]');
  if (noteEl) {
    clearTimeout(inputTimer);
    inputTimer = setTimeout(() => {
      setCheck(noteEl.dataset.id, noteEl.dataset.date || cursor, { note: noteEl.value });
      toast('메모 저장됨');
    }, 700);
    return;
  }
  const cntEl = ev.target.closest('[data-act="cntset"]');
  if (cntEl) {
    clearTimeout(inputTimer);
    inputTimer = setTimeout(() => {
      const t = state.tasks.find(x => x.id === cntEl.dataset.id);
      const d = cntEl.dataset.date || cursor;
      setCheck(cntEl.dataset.id, d, { count: Math.max(0, Number(cntEl.value) || 0), blocked: false });
      if (t) syncAuto(t, d);
      render();
    }, 600);
  }
});

/* 수업 등록 폼은 시간대 버튼으로 다시 그려져도 입력값을 유지한다. */
document.addEventListener('input', ev => {
  const field = ev.target.closest('[data-lesson-field]');
  if (field) {
    currentLessonDraft()[field.dataset.lessonField] = field.value;
    persistLessonDraft();
    return;
  }
  const slotField = ev.target.closest('[data-lesson-slot]');
  if (slotField) {
    const slot = currentLessonDraft().scheduleSlots[Number(slotField.dataset.i)];
    if (slot) { slot[slotField.dataset.lessonSlot] = slotField.value; persistLessonDraft(); }
  }
});

document.addEventListener('change', ev => {
  const field = ev.target.closest('[data-lesson-field]');
  if (field) { currentLessonDraft()[field.dataset.lessonField] = field.value; persistLessonDraft(); }
});

/* 출퇴근 시각 직접 수정 — time input은 값이 확정될 때(change) 저장한다 */
document.addEventListener('change', ev => {
  const el = ev.target.closest('[data-act="attedit-in"],[data-act="attedit-out"]');
  if (!el) return;
  const staffId = el.dataset.staff, date = el.dataset.date;
  if (!canEditAtt(staffId, date)) { toast('이 날짜는 수정할 수 없습니다 — 원장님께 요청해 주세요'); render(); return; }
  const field = el.dataset.act === 'attedit-in' ? 'at' : 'out';
  const ms = el.value ? msFromDateTime(date, el.value) : null;
  const cur = attOf(staffId, date);
  const newAt = field === 'at' ? ms : (cur ? cur.at : null);
  const newOut = field === 'out' ? ms : (cur ? cur.out : null);
  setCheck(attKey(staffId), date, { [field]: ms, done: !!(newAt || newOut) });
  toast('저장했습니다');
});

/* 엔터 제출 */
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Enter') return;
  const t = ev.target;
  if (t.id === 'pin')   document.querySelector('[data-act="setpin"],[data-act="login"]')?.click();
  if (t.id === 'sName') document.querySelector('[data-act="addstaff"]')?.click();
  if (t.id === 'qAdd')  document.querySelector('[data-act="qadd"]')?.click();
});

/* 복귀 시 최신화 */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (!cursorPinned && cursor !== today()) { cursor = today(); render(); }
  sync.run();
});

/* ══════════════════════════════════════════════════════
   11. 시작
   ══════════════════════════════════════════════════════ */
load();
absorbLinkParams();
const h = location.hash.replace('#/', '');
if (h && !/(^|&)c=/.test(h)) route = h;
if (session.isStaffLink && !['today', 'week', 'lesson', 'feedback', 'books', 'roster'].includes(route)) route = 'today';
render();

let syncLoopStarted = false;
function ensureSyncLoopStarted() {
  if (syncLoopStarted || !sync.enabled()) return;
  syncLoopStarted = true;
  setInterval(() => sync.run(), 45000);
}

async function startSyncSession() {
  // 1회용 코드는 자동 교환하지 않는다. 카카오에서는 원본 링크를 보존하고,
  // 최종 브라우저의 '이 기기에 연결' 버튼에서만 exchange한다.
  if (pendingBootstrapCode) {
    // 새 연결 코드가 있으면 이전 토큰 상태와 무관하게 새 코드 연결 화면을 우선한다.
    // 만료된 기존 토큰이 유효한 새 링크의 연결 버튼을 숨기면 안 된다.
    render();
    return false;
  }
  if (!sync.enabled()) { render(); return false; }
  const verified = await sync.run();
  if (sync.enabled()) ensureSyncLoopStarted();
  return verified;
}
startSyncSession();

/* ── 새 버전 감지 ──
 * 단일 HTML이라 브라우저가 예전 파일을 계속 물고 있는 일이 잦다.
 * version.json을 주기적으로 확인해 새 버전이 올라오면 알려주고 한 번에 새로고침한다. */
const APP_VER = '2026-08-07.9';
function checkVersion() {
  fetch('../version.json?t=' + Date.now(), { cache: 'no-store' })
    .then(r => r.ok ? r.json() : null)
    .then(d => {
      if (!d || !d.v || d.v === APP_VER || document.getElementById('newver')) return;
      const el = document.createElement('div');
      el.className = 'newver'; el.id = 'newver';
      el.innerHTML = '<span>\uc0c8 \ubc84\uc804\uc774 \uc788\uc2b5\ub2c8\ub2e4 \u2014 \uc0c8\ub85c\uace0\uce68\ud558\uba74 \ubc14\ub85c \uc801\uc6a9\ub429\ub2c8\ub2e4</span>' +
        '<button type="button" id="verReload">\uc0c8\ub85c\uace0\uce68</button>';
      document.body.appendChild(el);
      document.getElementById('verReload').onclick = () => {
        location.replace(location.pathname + location.search.replace(/[?&]v=\d+/, '') +
          (location.search ? '&' : '?') + 'v=' + Date.now() + location.hash);
      };
    })
    .catch(() => {});
}
checkVersion();
setInterval(checkVersion, 10 * 60 * 1000);
setInterval(() => {
  if (route === 'schedule' && session.isAdmin && cursor === seoulNowParts().date) render();
}, 60 * 1000);

</script>
