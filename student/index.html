  <style>
    :root{--navy:#173957;--blue:#087ba6;--sky:#eaf7fb;--bg:#f3f7f8;--line:#d9e5e9;--muted:#647784;--ink:#20384c;--ok:#14755e;--warn:#8a4b08;--bad:#9b352b;--white:#fff}
    *{box-sizing:border-box}html{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}body{min-width:280px;margin:0}button{font:inherit}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #087ba6;outline-offset:2px}.headbtn:focus-visible{outline-color:#fff}
    header{position:sticky;top:0;z-index:5;padding:max(11px,env(safe-area-inset-top)) 14px 11px;background:var(--navy);color:#fff;box-shadow:0 4px 18px #17395730}.head{display:flex;max-width:560px;margin:auto;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:18px;font-weight:900;line-height:1.1}.brand small{display:block;margin-top:3px;font-size:9px;letter-spacing:.1em;opacity:.72}.head-actions{display:flex;gap:7px}.headbtn{min-width:44px;min-height:44px;padding:0 10px;border:1px solid #ffffff66;border-radius:12px;background:transparent;color:#fff;font-size:13px;font-weight:850}.headbtn:disabled{opacity:.55}
    main{max-width:560px;margin:auto;padding:14px 12px calc(30px + env(safe-area-inset-bottom))}.card{margin-bottom:12px;padding:17px;border:1px solid var(--line);border-radius:18px;background:var(--white);box-shadow:0 5px 18px #1739570a;overflow-wrap:anywhere}.hero{padding:19px;border-color:#b9deed;background:linear-gradient(145deg,#eaf7fd 0,#fff 70%)}h1,h2,p{margin:0}h1{color:var(--navy);font-size:24px;line-height:1.25}h2{color:var(--navy);font-size:18px;line-height:1.3}.eyebrow{margin-bottom:5px;color:var(--blue);font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.hero-head,.section-head,.between{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.date-pill{flex:0 0 auto;padding:6px 9px;border-radius:999px;background:#fff;color:var(--blue);font-size:12px;font-weight:900;box-shadow:inset 0 0 0 1px #cce7f2}.sub{margin-top:5px;color:var(--muted);font-size:13px;line-height:1.55}.summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:15px}.stat{min-width:0;padding:11px 4px;border:1px solid #d6ebf4;border-radius:13px;background:#f5fbfe;text-align:center}.stat b{display:block;color:var(--navy);font-size:20px;line-height:1.15}.stat span{display:block;margin-top:4px;color:var(--muted);font-size:12px;font-weight:800;line-height:1.25}.section-head{align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}.section-count{flex:0 0 auto;color:var(--muted);font-size:12px;font-weight:800}.self-check-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.self-check-choice{min-height:48px;padding:9px;border:1px solid #bfd7e1;border-radius:12px;background:#fff;color:var(--navy);font-weight:900}.self-check-choice[aria-pressed="true"]{border-color:var(--blue);background:var(--sky);box-shadow:inset 0 0 0 1px var(--blue)}.self-check-choice.help[aria-pressed="true"]{border-color:#b56a16;background:#fff4e6;color:#7a4308;box-shadow:inset 0 0 0 1px #b56a16}.self-check-choice:disabled{cursor:not-allowed;opacity:.7}.self-check-note{margin-top:9px;color:var(--muted);font-size:12px;line-height:1.55}.study-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:13px}.study-link{display:flex;min-height:72px;align-items:center;justify-content:space-between;gap:10px;padding:12px 13px;border:1px solid #c9e5ef;border-radius:14px;background:#f5fbfe;color:var(--navy);text-decoration:none}.study-link b,.study-link small{display:block}.study-link b{font-size:15px}.study-link small{margin-top:4px;color:#526b79;font-size:12px;line-height:1.4}.study-link strong{flex:0 0 auto;color:var(--blue);font-size:20px}.study-note{margin-top:10px;color:#526b79;font-size:12px;line-height:1.55}.group{padding-top:13px}.group+.group{margin-top:3px;border-top:1px dashed var(--line)}.group-title{margin-bottom:2px;color:var(--muted);font-size:12px;font-weight:900}.row{min-width:0;padding:12px 0;border-top:1px solid var(--line)}.group-title+.row,.card>.row:first-of-type{border-top:0}.item-main{min-width:0;flex:1}.item-title{color:var(--ink);font-size:15px}.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:var(--sky);color:var(--blue);font-size:12px;font-weight:900;line-height:1.2}.tag.ok{background:#e7f6f0;color:var(--ok)}.tag.warn{background:#fff4e6;color:var(--warn)}.tag.bad{background:#fff0ef;color:var(--bad)}.tag.muted{background:#eef2f4;color:var(--muted)}.today-status{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:5px}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:10px}.steps i{height:7px;border-radius:999px;background:#dfe8ec}.steps i.done{background:var(--ok)}.steps-label{margin-top:5px;color:var(--muted);font-size:12px;font-weight:800}.day-badge{display:grid;place-items:center;flex:0 0 42px;min-height:42px;border-radius:12px;background:var(--navy);color:#fff;font-size:13px;font-weight:900}.schedule-row{align-items:center}.time{flex:0 0 auto;color:var(--navy);font-size:14px;font-weight:900;text-align:right}.copy{margin-top:8px;white-space:pre-wrap;color:#263f55;font-size:14px;line-height:1.65}.public-box{margin-top:10px;padding:11px 12px;border:1px solid #d6ebf4;border-radius:12px;background:#f5fbfe}.public-line{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;font-size:13px;line-height:1.6}.public-line+.public-line{margin-top:7px}.public-label{color:var(--blue);font-weight:900}.empty{padding:20px 8px 10px;color:var(--muted);text-align:center;font-size:13px;line-height:1.6}.error{border-color:#efb6ae;background:#fff7f5;color:var(--bad)}.loading{padding:48px 16px;text-align:center;color:var(--muted)}.info summary{min-height:48px;padding:13px 0;color:var(--navy);font-size:13px;font-weight:900;cursor:pointer}.info .sub{margin-bottom:5px}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:430px){.summary-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:350px){.hero-head,.between{flex-direction:column}.today-status,.time{text-align:left;justify-content:flex-start}.date-pill{align-self:flex-start}.summary-grid,.study-grid,.self-check-actions{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><div class="head"><div class="brand">WB 학생<small>WEXLER BRAIN CENTER</small></div><div class="head-actions"><button class="headbtn" id="refreshButton" type="button" hidden>새로고침</button><button class="headbtn" id="logoutButton" type="button" hidden>로그아웃</button></div></div></header>
  <main id="app" aria-busy="true"><div class="loading" role="status">학생 정보를 확인하고 있습니다.</div></main>
  <div id="liveStatus" class="sr" role="status" aria-live="polite" aria-atomic="true"></div>
  <script>
  'use strict';
  const API='/student-portal';
  const app=document.getElementById('app'),refreshButton=document.getElementById('refreshButton'),logoutButton=document.getElementById('logoutButton'),liveStatus=document.getElementById('liveStatus');
  const ATTENDANCE={P:['출석','ok'],L:['지각','warn'],A:['결석','bad'],'':['출결 확인 전','muted']};
  const RIDE_STATUS={scheduled:['탑승 확인 전','muted'],boarded:['탑승 확인','warn'],dropped:['하차 확인','ok'],absent:['미탑승','bad']};
  const BOOK_CLASS={preparing:'muted',ready_for_handoff:'warn',handed:'ok',cancelled:'muted'};
  const DAY_ORDER='월화수목금토일';
  let refreshing=false,lastRefreshAt=0,pendingInviteCode='',selfCheckEnabled=false,lastStudentData=null;
  const pendingSelfChecks=new Set();
  const esc=value=>String(value==null?'':value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const rows=value=>Array.isArray(value)?value:[];
  function count(value,max){const number=Number(value);return Number.isFinite(number)?Math.max(0,Math.min(max==null?999:max,Math.floor(number))):0}
  function teacher(value){const name=String(value||'').trim();return !name?'담당 선생님':/선생님$/.test(name)?name:name+' 선생님'}
  function clock(value){const number=Number(value);return value==null||value===''||!Number.isFinite(number)||number<=0?'':new Date(number).toLocaleTimeString('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit'})}
  function stamp(value){const number=Number(value);return value==null||value===''||!Number.isFinite(number)||number<=0?'':new Date(number).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'})}
  async function post(body){
    let response;try{response=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',credentials:'include',body:JSON.stringify(Object.assign({app:'task'},body))})}catch(error){throw new Error('인터넷 연결을 확인하고 다시 시도해 주세요')}
    let data={};try{data=await response.json()}catch(error){}
    if(!response.ok||!data.ok){const failure=new Error(data.error||'학생 정보를 불러오지 못했습니다');failure.status=response.status;failure.code=String(data.code||'');throw failure}return data;
  }
  function section(kicker,title,items,empty){return '<section class="card"><div class="section-head"><div><p class="eyebrow">'+esc(kicker)+'</p><h2>'+esc(title)+'</h2></div><span class="section-count">'+items.length+'건</span></div>'+(items.length?items.join(''):'<div class="empty">'+esc(empty)+'</div>')+'</section>'}
  function studySection(enabled){return enabled?'<section class="card"><div class="section-head"><div><p class="eyebrow">Study</p><h2>바로 학습하기</h2></div><span class="tag">외부 학습</span></div><div class="study-grid"><a class="study-link" href="https://new.mmath.co.kr/Pages/student/" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer" aria-label="메타수학 학생홈 열기, 새 창/탭에서 열림"><span><b>메타수학</b><small>수학 문제 풀기·채점</small></span><strong aria-hidden="true">↗</strong></a><a class="study-link" href="https://www.classcard.net/Login" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer" aria-label="클래스카드 열기, 새 창/탭에서 열림"><span><b>클래스카드</b><small>단어·문장 학습하기</small></span><strong aria-hidden="true">↗</strong></a></div><p class="study-note">링크를 누르면 새 창/탭에서 외부 서비스로 이동합니다. 해당 서비스가 기기 정보·접속 기록·서비스 쿠키를 처리할 수 있습니다. WB는 외부 아이디·비밀번호·학습 결과를 받거나 저장하지 않습니다.</p></section>':''}
  function group(title,items,empty){return '<div class="group"><div class="group-title">'+esc(title)+'</div>'+(items.length?items.join(''):'<div class="empty">'+esc(empty)+'</div>')+'</div>'}
  function progress(completed){const done=count(completed,5);return '<div class="steps" aria-label="5단계 중 '+done+'단계 완료">'+Array.from({length:5},(_,index)=>'<i class="'+(index<done?'done':'')+'"></i>').join('')+'</div><div class="steps-label">5단계 중 '+done+'단계 완료</div>'}
  function lessonRows(value){return rows(value).map(row=>{const attendance=ATTENDANCE[String(row.attendance||'')]||ATTENDANCE[''];return '<article class="row"><div class="between"><div class="item-main"><b class="item-title">'+esc(row.subject||row.className||'수업')+'</b><div class="sub">'+esc(teacher(row.teacherName))+' · '+esc(row.timeLabel||'시간 확인 중')+'</div></div><div class="today-status"><span class="tag '+attendance[1]+'">'+attendance[0]+'</span><span class="tag '+(row.completed?'ok':'muted')+'">'+(row.completed?'수업 완료':'진행 중')+'</span></div></div>'+progress(row.completed?5:row.completedSteps)+'</article>'})}
  function transportRows(value){return rows(value).map(row=>{const status=RIDE_STATUS[String(row.status||'')]||RIDE_STATUS.scheduled;const at=clock(row.statusAt);return '<div class="row between"><div class="item-main"><b class="item-title">'+(row.direction==='dropoff'?'하원':'등원')+' 차량</b><div class="sub">예정 '+esc(row.scheduledTime||'시간 확인 중')+'</div></div><div class="today-status"><span class="tag '+status[1]+'">'+status[0]+'</span>'+(at?'<span class="tag muted">'+esc(at)+'</span>':'')+'</div></div>'})}
  function normalizeSelfCheckRow(row,todayDate,enabled){if(!enabled||!row||row.lessonDate!==todayDate||!/^\d{4}-\d{2}-\d{2}$/.test(String(todayDate||'')))return null;const check=row.selfCheck,activityId=String(row.activityId||''),publicationRevision=Number(row.publicationRevision),revision=Number(check&&check.revision),response=String(check&&check.response||''),review=String(check&&check.reviewStatus||''),finalCompleted=check&&check.finalCompleted;if(!check||!/^[A-Za-z0-9_-]{8,100}$/.test(activityId)||!Number.isInteger(publicationRevision)||publicationRevision<1||!Number.isInteger(revision)||revision<0||!['','completed','help_needed'].includes(response)||!['','pending','confirmed'].includes(review)||typeof finalCompleted!=='boolean'||(response===''&&(revision!==0||review!==''||finalCompleted))||(response!==''&&(revision<1||!['pending','confirmed'].includes(review)))||(review==='confirmed'&&finalCompleted!==(response==='completed'))||(review!=='confirmed'&&finalCompleted))return null;return {row:row,activityId:activityId,publicationRevision:publicationRevision,revision:revision,response:response,review:review,finalCompleted:finalCompleted}}
  function selfCheckRows(items){return rows(items).map(item=>{const row=item.row,response=item.response,confirmed=item.review==='confirmed',locked=item.finalCompleted===true,status=confirmed?(locked?['완료 · 선생님 확인 완료','ok']:['도움 필요 · 선생님 확인함','warn']):response?(response==='completed'?['완료 선택 · 선생님 확인 전','warn']:['도움 필요 · 선생님 확인 전','warn']):['아직 선택하지 않았어요','muted'];return '<article class="row self-check-row" data-activity="'+esc(item.activityId)+'" data-publication-revision="'+item.publicationRevision+'" data-revision="'+item.revision+'"><div class="between"><div class="item-main"><b class="item-title">'+esc(row.subject||row.className||'오늘 숙제·준비물')+'</b><div class="sub">'+esc(teacher(row.teacherName))+'</div></div><span class="tag '+status[1]+'" data-self-check-status role="status" aria-live="polite">'+status[0]+'</span></div><div class="public-box">'+(String(row.publicHomework||'').trim()?'<div class="public-line"><span class="public-label">숙제</span><span class="copy">'+esc(String(row.publicHomework).trim())+'</span></div>':'')+(String(row.publicReadiness||'').trim()?'<div class="public-line"><span class="public-label">준비물</span><span class="copy">'+esc(String(row.publicReadiness).trim())+'</span></div>':'')+'</div><div class="self-check-actions" aria-label="오늘 할 일 상태 선택"><button type="button" class="self-check-choice" data-self-check-choice="completed" aria-pressed="'+(response==='completed')+'"'+(locked?' disabled':'')+'>✓ 완료</button><button type="button" class="self-check-choice help" data-self-check-choice="help_needed" aria-pressed="'+(response==='help_needed')+'"'+(locked?' disabled':'')+'>도움 필요</button></div><p class="self-check-note">'+(locked?'선생님 확인까지 끝나 최종 완료되었습니다. 공개 내용이 수정되면 새 할 일로 다시 선택할 수 있습니다.':'선택하면 선생님이 확인합니다. 도움 필요를 확인받은 뒤에는 완료로 바꿀 수 있습니다. 자유 메모나 연락처는 전송되지 않습니다.')+'</p></article>'})}
  function publicLessonRows(value){return rows(value).map(row=>{const homework=String(row.publicHomework||'').trim(),readiness=String(row.publicReadiness||'').trim();if(!homework&&!readiness)return '';return '<article class="row"><div class="between"><div class="item-main"><b class="item-title">'+esc(row.subject||row.className||'수업')+'</b><div class="sub">'+esc(row.lessonDate||'최근 수업')+' · '+esc(teacher(row.teacherName))+'</div></div><span class="tag">공개 기록</span></div><div class="public-box">'+(homework?'<div class="public-line"><span class="public-label">숙제</span><span class="copy">'+esc(homework)+'</span></div>':'')+(readiness?'<div class="public-line"><span class="public-label">준비물</span><span class="copy">'+esc(readiness)+'</span></div>':'')+'</div></article>'}).filter(Boolean)}
  function scheduleRows(value){return rows(value).slice().sort((a,b)=>{const left=DAY_ORDER.indexOf(String(a.dayLabel||'')[0]),right=DAY_ORDER.indexOf(String(b.dayLabel||'')[0]);return (left<0?99:left)-(right<0?99:right)||String(a.timeLabel||'').localeCompare(String(b.timeLabel||''))}).map(row=>'<div class="row between schedule-row"><span class="day-badge">'+esc(row.dayLabel||'요일')+'</span><div class="item-main"><b class="item-title">'+esc(row.subject||row.className||'수업')+'</b><div class="sub">'+esc(teacher(row.teacherName))+'</div></div><div class="time">'+esc(row.timeLabel||'시간 확인 중')+'</div></div>')}
  function bookRows(value){return rows(value).filter(row=>row&&row.kind==='distribution').map(row=>'<div class="row between"><div class="item-main"><b class="item-title">'+esc(row.title||'교재')+'</b><div class="sub">배정 교재'+(row.updatedAt?' · '+esc(stamp(row.updatedAt)):'')+'</div></div><span class="tag '+(BOOK_CLASS[row.stage]||'muted')+'">'+esc(row.label||'상태 확인 중')+'</span></div>')}
  function render(data){
    const student=data.student&&typeof data.student==='object'?data.student:{},today=data.today&&typeof data.today==='object'?data.today:{},capabilities=data.capabilities&&typeof data.capabilities==='object'?data.capabilities:{};
    selfCheckEnabled=capabilities.selfCheck===true;lastStudentData=data;
    const selfCheckItems=rows(data.publicLessons).map(row=>normalizeSelfCheckRow(row,today.date,selfCheckEnabled)).filter(Boolean),selfCheckIds=new Set(selfCheckItems.map(item=>item.activityId));
    const lessons=lessonRows(today.lessons),transport=transportRows(today.transport),selfChecks=selfCheckRows(selfCheckItems),publicLessons=publicLessonRows(rows(data.publicLessons).filter(row=>!selfCheckIds.has(String(row&&row.activityId||'')))),books=bookRows(data.bookStatus),schedule=scheduleRows(data.schedule);
    const lessonCount=lessons.length,completedCount=count(rows(today.lessons).filter(row=>row&&row.completed).length),homeworkCount=publicLessons.length,checkedAt=clock(data.generatedAt);
    const selfCheckInfo=selfCheckEnabled?' 오늘 공개된 할 일은 완료 또는 도움 필요만 선택하며 선생님이 확인합니다.':'';
    app.innerHTML='<section class="card hero"><div class="hero-head"><div><p class="eyebrow">My learning</p><h1>'+esc(student.name||'학생')+' <span class="tag">'+esc(student.grade||'')+'</span></h1></div><span class="date-pill">'+esc(today.dateLabel||'오늘')+'</span></div><p class="sub">학원에서 공개한 학습 정보만 보여드립니다.'+(checkedAt?' · 마지막 확인 '+esc(checkedAt):'')+'</p><div class="summary-grid"><div class="stat"><b>'+lessonCount+'</b><span>오늘 수업</span></div><div class="stat"><b>'+completedCount+'</b><span>완료 수업</span></div><div class="stat"><b>'+(selfCheckEnabled?selfChecks.length:homeworkCount)+'</b><span>'+(selfCheckEnabled?'오늘 할 일':'공개 기록')+'</span></div></div></section>'+(selfCheckEnabled?section('Plan','오늘 할 일',selfChecks,'오늘 공개된 숙제·준비물이 없습니다.'):'')+'<section class="card"><div class="section-head"><div><p class="eyebrow">Today</p><h2>오늘 현황</h2></div><span class="section-count">'+(lessonCount+transport.length)+'건</span></div>'+group('오늘 수업',lessons,'오늘 예정된 수업이 없습니다.')+group('오늘 차량',transport,'오늘 이용 예정인 차량이 없습니다.')+'</section>'+studySection(capabilities.externalLearning===true)+section('Learning','최근 공개 숙제·준비물',publicLessons,'최근 14일 공개 기록이 없습니다.')+section('Book','교재 준비·수령',books,'현재 진행 중인 교재가 없습니다.')+section('Schedule','주간 시간표',schedule,'확정된 정규 수업이 없습니다.')+'<section class="card info"><details><summary>학생 앱에서 볼 수 있는 정보</summary><p class="sub">내 수업·출결·5단계 진행, 최근 14일 중 학생 공개가 확인된 숙제·준비물, 차량 탑승 상태, 교재 진행 상태와 시간표를 확인할 수 있습니다.'+selfCheckInfo+' 연락처·주소·정류장·내부 메모와 보호자 전용 기능은 표시하지 않습니다.</p></details></section>';
    app.setAttribute('aria-busy','false');refreshButton.hidden=false;logoutButton.hidden=false;liveStatus.textContent='학생 정보 새로고침 완료'+(checkedAt?' '+checkedAt:'');
  }
  function fail(message,clear){refreshButton.hidden=!!clear;logoutButton.hidden=!!clear;app.setAttribute('aria-busy','false');app.innerHTML='<section class="card error" role="alert" tabindex="-1"><h2>확인이 필요합니다</h2><p class="copy">'+esc(message)+'</p></section>';const alert=app.querySelector('[role="alert"]');if(alert)alert.focus()}
  async function refresh(force){if(refreshing||(!force&&Date.now()-lastRefreshAt<1000))return;refreshing=true;refreshButton.disabled=true;app.setAttribute('aria-busy','true');try{const data=await post({action:'view'});lastRefreshAt=Date.now();render(data)}catch(error){fail(error.message,error.status===401||error.status===410)}finally{refreshing=false;refreshButton.disabled=false;app.setAttribute('aria-busy','false')}}
  async function submitSelfCheck(button){
    if(!selfCheckEnabled||!button)return;
    const row=button.closest('.self-check-row'),activityId=String(row&&row.dataset.activity||''),response=String(button.dataset.selfCheckChoice||'');
    const publicationRevision=Number(row&&row.dataset.publicationRevision),expectedRevision=Number(row&&row.dataset.revision);
    if(!row||pendingSelfChecks.has(activityId)||!['completed','help_needed'].includes(response)||!Number.isInteger(publicationRevision)||publicationRevision<1||!Number.isInteger(expectedRevision)||expectedRevision<0)return;
    const todayDate=String(lastStudentData&&lastStudentData.today&&lastStudentData.today.date||'');
    const source=rows(lastStudentData&&lastStudentData.publicLessons).find(item=>item&&item.activityId===activityId);
    const checked=normalizeSelfCheckRow(source,todayDate,selfCheckEnabled);
    if(!checked||checked.finalCompleted||checked.publicationRevision!==publicationRevision||checked.revision!==expectedRevision)return;
    const choices=row.querySelectorAll('[data-self-check-choice]'),status=row.querySelector('[data-self-check-status]');
    pendingSelfChecks.add(activityId);choices.forEach(item=>item.disabled=true);
    if(status){status.className='tag muted';status.textContent='저장 중…'}
    liveStatus.textContent='오늘 할 일 상태를 저장하고 있습니다';
    let saved=false;
    try{
      const result=await post({action:'self_check_set',activityId:activityId,publicationRevision:publicationRevision,response:response,expectedRevision:expectedRevision});
      saved=true;
      const next=Object.assign({},source,{selfCheck:result.selfCheck});
      if(!normalizeSelfCheckRow(next,todayDate,true)){
        if(status){status.className='tag warn';status.textContent='선택은 저장됨 · 화면 새로고침 필요'}
        liveStatus.textContent='오늘 할 일 선택은 저장되었습니다. 화면을 새로고침해 주세요';
        return;
      }
      source.selfCheck=result.selfCheck;render(lastStudentData);
    }catch(error){
      if(saved){
        choices.forEach(item=>item.disabled=true);
        if(status){status.className='tag warn';status.textContent='선택은 저장됨 · 화면 새로고침 필요'}
        liveStatus.textContent='오늘 할 일 선택은 저장되었습니다. 화면을 새로고침해 주세요';
        return;
      }
      if(error&&['SELF_CHECK_FINALIZED','SELF_CHECK_REVISION_CONFLICT','SELF_CHECK_NOT_AVAILABLE'].includes(error.code)){
        await refresh(true);liveStatus.textContent='다른 화면의 최신 선택 상태를 불러왔습니다';return;
      }
      choices.forEach(item=>item.disabled=false);
      if(status){status.className='tag bad';status.textContent='저장 실패 · 다시 선택해 주세요'}
      liveStatus.textContent='오늘 할 일 상태를 저장하지 못했습니다. '+String(error.message||error);
    }finally{pendingSelfChecks.delete(activityId)}
  }
  async function boot(){const params=new URLSearchParams(location.hash.replace(/^#/,'')),code=params.get('code')||'';if(code){pendingInviteCode=code;history.replaceState(null,'',location.pathname+location.search);try{await post({action:'exchange',code});pendingInviteCode=''}catch(error){if(error.code==='SESSION_ALREADY_ACTIVE'){fail('이 기기에 기존 학생 연결이 있습니다. 로그아웃을 누르면 방금 받은 새 학생 링크로 바꿉니다.',true);logoutButton.hidden=false;return}pendingInviteCode='';return fail(error.message,true)}}await refresh()}
  refreshButton.addEventListener('click',()=>refresh(true));
  document.addEventListener('click',event=>{const button=event.target.closest('[data-self-check-choice]');if(button)submitSelfCheck(button)});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!logoutButton.hidden)refresh()});
  window.addEventListener('focus',()=>{if(!logoutButton.hidden)refresh()});
  logoutButton.addEventListener('click',async()=>{const nextCode=pendingInviteCode;pendingInviteCode='';refreshButton.hidden=true;logoutButton.hidden=true;try{await post({action:'logout'})}catch(error){}if(nextCode){try{await post({action:'exchange',code:nextCode});await refresh(true);return}catch(error){return fail(error.message,true)}}fail('로그아웃했습니다. 다시 이용하려면 새 학생 초대 링크가 필요합니다.',true)});
  boot();
  </script>
