<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="초승달부터 보름달을 지나 그믐달까지 여덟 단계의 달">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f1b3d"/><stop offset="1" stop-color="#27356b"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff6c8" stop-opacity="0.35"/><stop offset="1" stop-color="#fff6c8" stop-opacity="0"/></radialGradient>
    <clipPath id="c1"><circle cx="0" cy="0" r="70"/></clipPath>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <g fill="#ffffff" opacity="0.8">
    <circle cx="120" cy="140" r="2.5"/><circle cx="310" cy="90" r="2"/><circle cx="520" cy="180" r="3"/><circle cx="760" cy="70" r="2"/><circle cx="980" cy="160" r="2.5"/><circle cx="1210" cy="95" r="2"/><circle cx="1440" cy="150" r="3"/><circle cx="1530" cy="60" r="2"/><circle cx="200" cy="820" r="2"/><circle cx="640" cy="860" r="2.5"/><circle cx="1100" cy="840" r="2"/><circle cx="1380" cy="880" r="2.5"/><circle cx="880" cy="900" r="2"/><circle cx="420" cy="760" r="1.8"/><circle cx="1290" cy="720" r="1.8"/>
  </g>
  <g transform="translate(800 500)"><circle r="360" fill="url(#glow)"/></g>
  <!-- 여덟 단계: 삭 → 초승 → 상현 → 차가는 달 → 보름 → 이지러지는 달 → 하현 → 그믐 (오른쪽이 먼저 밝아지고, 오른쪽이 먼저 어두워진다) -->
  <g transform="translate(180 520)">
    <circle r="70" fill="#1b2650" stroke="#3b4a86" stroke-width="3"/>
    <text y="125" text-anchor="middle" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" font-size="30" fill="#c9d2ff">삭</text>
  </g>
  <g transform="translate(360 520)">
    <circle r="70" fill="#1b2650"/><g clip-path="url(#c1)"><circle r="70" fill="#f6e7a1"/><ellipse cx="-22" cy="0" rx="62" ry="72" fill="#1b2650"/></g>
    <text y="125" text-anchor="middle" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" font-size="30" fill="#c9d2ff">초승달</text>
  </g>
  <g transform="translate(540 520)">
    <circle r="70" fill="#1b2650"/><g clip-path="url(#c1)"><rect x="0" y="-72" width="72" height="144" fill="#f6e7a1"/></g>
    <text y="125" text-anchor="middle" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" font-size="30" fill="#c9d2ff">상현달</text>
  </g>
  <g transform="translate(720 520)">
    <circle r="70" fill="#f6e7a1"/><g clip-path="url(#c1)"><ellipse cx="-52" cy="0" rx="40" ry="72" fill="#1b2650"/></g>
    <text y="125" text-anchor="middle" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" font-size="30" fill="#c9d2ff">차가는 달</text>
  </g>
  <g transform="translate(900 520)">
    <circle r="70" fill="#f6e7a1"/><circle cx="-18" cy="-14" r="11" fill="#e9d98f"/><circle cx="20" cy="18" r="16" fill="#e9d98f"/><circle cx="24" cy="-30" r="7" fill="#e9d98f"/>
    <text y="125" text-anchor="middle" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" font-size="30" fill="#fff3b0" font-weight="700">보름달</text>
  </g>
  <g transform="translate(1080 520)">
    <circle r="70" fill="#f6e7a1"/><g clip-path="url(#c1)"><ellipse cx="52" cy="0" rx="40" ry="72" fill="#1b2650"/></g>
    <text y="125" text-anchor="middle" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" font-size="30" fill="#c9d2ff">이지러지는 달</text>
  </g>
  <g transform="translate(1260 520)">
    <circle r="70" fill="#1b2650"/><g clip-path="url(#c1)"><rect x="-72" y="-72" width="72" height="144" fill="#f6e7a1"/></g>
    <text y="125" text-anchor="middle" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" font-size="30" fill="#c9d2ff">하현달</text>
  </g>
  <g transform="translate(1440 520)">
    <circle r="70" fill="#1b2650"/><g clip-path="url(#c1)"><circle r="70" fill="#f6e7a1"/><ellipse cx="22" cy="0" rx="62" ry="72" fill="#1b2650"/></g>
    <text y="125" text-anchor="middle" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" font-size="30" fill="#c9d2ff">그믐달</text>
  </g>
  <path d="M0 780 Q 400 700 800 760 T 1600 740 L1600 1000 L0 1000 Z" fill="#131c3a"/>
  <path d="M0 840 Q 500 790 1000 830 T 1600 810 L1600 1000 L0 1000 Z" fill="#0c1330"/>
</svg>
