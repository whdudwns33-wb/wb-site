<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>WB 진로독서 · 학부모 리포트</title>
  <style>
    :root{--navy:#173957;--blue:#087ba6;--sky:#eaf7fb;--bg:#f3f7f8;--line:#d9e5e9;--muted:#647784;--ink:#20384c;--ok:#14755e;--coral:#c9503c}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;line-height:1.65}
    header{padding:14px 18px;background:var(--navy);color:#fff}
    header b{font-size:17px}header small{display:block;font-size:10px;letter-spacing:.09em;opacity:.7;margin-top:2px}
    main{max-width:560px;margin:auto;padding:14px 12px 50px}
    .card{margin-bottom:12px;padding:17px;border:1px solid var(--line);border-radius:16px;background:#fff}
    .hero{border-color:#b9deed;background:linear-gradient(145deg,#eaf7fd 0,#fff 70%)}
    h1{margin:0;color:var(--navy);font-size:21px}h2{margin:0 0 6px;color:var(--navy);font-size:16px}
    .eyebrow{margin:0 0 5px;color:var(--blue);font-size:12px;font-weight:900;letter-spacing:.06em}
    .sub{margin:5px 0 0;color:var(--muted);font-size:13px}
    .tag{display:inline-block;padding:4px 9px;border-radius:999px;background:var(--sky);color:var(--blue);font-size:12px;font-weight:800}
    .tag.ok{background:#e7f6f0;color:var(--ok)}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:14px}
    .stat{padding:10px 4px;border:1px solid #d6ebf4;border-radius:12px;background:#f5fbfe;text-align:center;min-width:0}
    .stat b{display:block;color:var(--navy);font-size:18px}
    .stat span{font-size:10.5px;color:var(--muted);font-weight:800}
    .weekdots{display:flex;justify-content:space-between;margin-top:12px}
    .wd{display:grid;justify-items:center;gap:5px;font-size:10.5px;color:var(--muted);font-weight:700}
    .wd i{width:30px;height:30px;border-radius:999px;background:#e4edf1}
    .wd i.done{background:var(--ok)}
    .wd.today i{box-shadow:inset 0 0 0 2.5px var(--blue)}
    .rline{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed #e4edf1;font-size:13.5px}
    .rline:last-child{border-bottom:0}
    .rline small{color:var(--muted);flex:0 0 auto}
    .speedbox{margin-top:10px;padding:11px 13px;border-radius:11px;background:var(--sky);font-size:13.5px}
    footer{max-width:560px;margin:auto;padding:0 14px 40px;color:var(--muted);font-size:12px;text-align:center}
    .err{padding:40px 16px;text-align:center;color:var(--muted)}
  </style>
</head>
<body>
<header><b>WB 진로독서 · 학부모 리포트</b><small>WEXLER BRAIN CENTER</small></header>
<main id="app"><div class="err">불러오는 중…</div></main>
<footer>이 페이지는 읽기 전용이에요 · 문의: WB 독해력학원 · 웩슬러브레인센터</footer>
<script>
'use strict';
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LV={L2:'초등 심화',L3:'중등',L4:'고등'};
(async()=>{
  const app=document.getElementById('app');
  const t=new URLSearchParams(location.search).get('t')||'';
  if(!t){app.innerHTML='<div class="err">주소가 올바르지 않아요.<br>학원에서 받은 링크로 열어 주세요.</div>';return;}
  let d;
  try{
    const r=await fetch('/api/parent/summary?t='+encodeURIComponent(t),{cache:'no-store'});
    d=await r.json();
    if(!r.ok)throw new Error(d.error||'불러오기 실패');
  }catch(e){app.innerHTML='<div class="err">'+esc(e.message||'불러오지 못했어요.')+'</div>';return;}
  const enc=d.week>=5?'이번 주도 아주 꾸준했어요! 큰 칭찬 부탁드려요 🙂'
    :d.week>=3?'이번 주 리듬이 좋아요. 오늘 한 편이면 더 단단해져요.'
    :d.today?'오늘 한 편을 읽었어요! 이 흐름이 이어지게 응원해 주세요.'
    :'매일 한 편 습관을 만드는 중이에요. 오늘 한 편, 함께 챙겨 주세요.';
  app.innerHTML=`
  <div class="card hero"><p class="eyebrow">주간 읽기 리포트</p>
    <h1>${esc(d.name)} <span class="tag">${esc(LV[d.level]||d.level||'')}</span></h1>
    <p class="sub">${esc(d.cls||'')}${d.cls?' · ':''}${esc(d.grade||'')} · ${new Date(d.generatedAt).toLocaleDateString('ko-KR')} 기준</p>
    <div class="stats">
      <div class="stat"><b>${d.streak}</b><span>연속(일)</span></div>
      <div class="stat"><b>${d.week}/7</b><span>이번 주</span></div>
      <div class="stat"><b>${d.reads}</b><span>총 완독</span></div>
      <div class="stat"><b>${d.acc==null?'—':d.acc+'%'}</b><span>문제 정답률</span></div>
    </div>
    <div class="weekdots">${(d.weekDays||[]).map(w=>`<span class="wd ${w.today?'today':''}"><i class="${w.done?'done':''}"></i>${esc(w.dow)}</span>`).join('')}</div>
    <p class="sub" style="margin-top:12px">${enc}</p></div>
  ${(d.wordbrain&&d.wordbrain.total)?`<div class="card"><h2>어휘 — 워드브레인</h2>
    <p class="sub" style="margin-top:2px">읽다가 몰랐던 낱말을 잊을 때쯤 다시 만나 문제로 확인해요. 한자어·고유어·영어를 각각 다른 방법으로 익힙니다.</p>
    <div class="stats">
      <div class="stat"><b>${d.wordbrain.total}</b><span>기르는 낱말</span></div>
      <div class="stat"><b>${d.wordbrain.graduated}</b><span>장기 기억 🌳</span></div>
      <div class="stat"><b>${d.wordbrain.streak}</b><span>연속(일)</span></div>
      <div class="stat"><b>${d.wordbrain.msAvg?(d.wordbrain.msAvg/1000).toFixed(1)+'초':'—'}</b><span>떠올리는 속도</span></div>
    </div>
    ${d.wordbrain.due?`<p class="sub" style="margin-top:10px">지금 복습할 낱말이 <b>${d.wordbrain.due}개</b> 기다리고 있어요${d.wordbrain.emergency?` (그중 ${d.wordbrain.emergency}개는 많이 시들었어요)`:''}.</p>`:`<p class="sub" style="margin-top:10px">복습할 낱말이 밀리지 않았어요 — 잘 관리하고 있어요 👍</p>`}
    </div>`:''}
  ${d.speed?`<div class="card"><h2>읽기 속도</h2>
    <div class="speedbox">최근 <b>분당 ${d.speed.last}자</b>${d.speed.delta>0?` — 시작할 때보다 <b style="color:var(--ok)">+${d.speed.delta}자/분</b> 빨라졌어요!`:d.speed.delta<0?' — 요즘은 천천히 꼼꼼하게 읽고 있어요.':' — 꾸준히 유지 중이에요.'}</div></div>`:''}
  <div class="card"><h2>최근 읽은 글</h2>
    ${(d.recent||[]).map(r=>`<div class="rline"><span>${esc(r.title)}</span><small>${esc(r.date)}</small></div>`).join('')||'<p class="sub">아직 없어요.</p>'}</div>
  ${(d.reports||[]).length?`<div class="card"><h2>완성한 탐구보고서</h2>
    ${d.reports.map(r=>`<div class="rline"><span>${esc(r.title)}</span><small>${esc(r.done)}</small></div>`).join('')}
    <p class="sub" style="margin-top:8px">보고서 원문은 아이의 앱 → 탐구 랩에서 인쇄·PDF로 받을 수 있어요.</p></div>`:''}
  <div class="card"><h2>이 리포트는요</h2>
    <p class="sub">아이가 매일 한 편, 진로에 맞는 글을 읽고 문제와 탐구보고서로 소화하는 <b>WB 진로독서</b> 기록이에요. 어휘 ${d.vocab}개 · 읽기 훈련 ${d.train}회 · 붉은 책 요약 ${d.redbook}회가 함께 쌓였어요.</p></div>`;
})();
</script>
</body>
</html>
