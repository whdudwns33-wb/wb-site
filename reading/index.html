<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173957">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'; worker-src 'self'; base-uri 'none'; form-action 'none'">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>WB 진로독서</title>
  <style>
    :root{--navy:#173957;--blue:#087ba6;--sky:#eaf7fb;--bg:#f3f7f8;--line:#d9e5e9;--muted:#647784;--ink:#20384c;--ok:#14755e;--warn:#8a4b08;--bad:#9b352b;--coral:#c9503c;--white:#fff}
    *{box-sizing:border-box}html{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}body{min-width:280px;margin:0}
    button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
    header{position:sticky;top:0;z-index:5;padding:max(11px,env(safe-area-inset-top)) 14px 11px;background:var(--navy);color:#fff;box-shadow:0 4px 18px #17395730}
    .head{display:flex;max-width:560px;margin:auto;align-items:center;justify-content:space-between;gap:12px}
    .brand{font-size:18px;font-weight:900;line-height:1.1}.brand small{display:block;margin-top:3px;font-size:9px;letter-spacing:.1em;opacity:.72}
    .headbtn{min-width:44px;min-height:44px;padding:0 12px;border:1px solid #ffffff66;border-radius:12px;background:transparent;color:#fff;font-size:13px;font-weight:850}
    main{max-width:560px;margin:auto;padding:14px 12px calc(84px + env(safe-area-inset-bottom))}
    .card{margin-bottom:12px;padding:17px;border:1px solid var(--line);border-radius:18px;background:var(--white);box-shadow:0 5px 18px #1739570a;overflow-wrap:anywhere}
    .hero{padding:19px;border-color:#b9deed;background:linear-gradient(145deg,#eaf7fd 0,#fff 70%)}
    h1,h2,h3,p{margin:0}h1{color:var(--navy);font-size:23px;line-height:1.3}h2{color:var(--navy);font-size:18px;line-height:1.35}h3{color:var(--navy);font-size:15px}
    .eyebrow{margin-bottom:5px;color:var(--blue);font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
    .sub{margin-top:5px;color:var(--muted);font-size:13px;line-height:1.6}
    .between{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    .tag{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--sky);color:var(--blue);font-size:12px;font-weight:900;line-height:1.2}
    .tag.ok{background:#e7f6f0;color:var(--ok)}.tag.warn{background:#fff4e6;color:var(--warn)}.tag.bad{background:#fff0ef;color:var(--bad)}.tag.muted{background:#eef2f4;color:var(--muted)}
    .tag.c-science{background:#e7f2fb;color:#155d94}.tag.c-society{background:#fdf0e4;color:#8a5a12}.tag.c-history{background:#f4ece1;color:#7a5230}.tag.c-humanities{background:#f3ecf8;color:#6b4390}.tag.c-environment{background:#e7f6ec;color:#20714a}
    .btn{display:block;width:100%;min-height:52px;margin-top:12px;border:0;border-radius:14px;background:var(--blue);color:#fff;font-size:16px;font-weight:900}
    .btn:disabled{opacity:.45;cursor:default}
    .btn.ghost{background:#fff;border:1.5px solid #bfd7e1;color:var(--navy)}
    .btn.navy{background:var(--navy)}
    .btn.sm{min-height:46px;font-size:14px;margin-top:9px}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:15px}
    .stat{min-width:0;padding:11px 4px;border:1px solid #d6ebf4;border-radius:13px;background:#f5fbfe;text-align:center}
    .stat b{display:block;color:var(--navy);font-size:20px;line-height:1.15;font-variant-numeric:tabular-nums}
    .stat span{display:block;margin-top:4px;color:var(--muted);font-size:11.5px;font-weight:800;line-height:1.25}
    .pick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:13px}
    .pick{min-height:64px;padding:9px 6px;border:1.5px solid #bfd7e1;border-radius:13px;background:#fff;color:var(--navy);font-weight:850;font-size:13.5px;line-height:1.3}
    .pick[aria-pressed="true"]{border-color:var(--blue);background:var(--sky);box-shadow:inset 0 0 0 1.5px var(--blue)}
    .pick small{display:block;margin-top:3px;font-weight:600;font-size:11px;color:var(--muted)}
    .glist{margin-top:13px}
    .grow{display:flex;width:100%;min-height:56px;align-items:center;justify-content:space-between;gap:10px;padding:10px 4px;border:0;border-top:1px solid var(--line);background:none;text-align:left}
    .grow:first-child{border-top:0}
    .grow .t{min-width:0;flex:1;color:var(--ink);font-size:14.5px;font-weight:700;line-height:1.45}
    .grow .t small{display:block;margin-top:3px;color:var(--muted);font-size:12px;font-weight:600}
    .grow .go{flex:0 0 auto;color:var(--blue);font-size:18px;font-weight:900}
    .empty{padding:22px 8px;color:var(--muted);text-align:center;font-size:13px;line-height:1.6}
    nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
    .tabin{display:grid;max-width:560px;margin:auto;grid-template-columns:repeat(4,1fr)}
    .tab{min-height:56px;border:0;background:none;color:var(--muted);font-size:12px;font-weight:850;display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center}
    .tab b{font-size:17px;line-height:1}
    .tab[aria-current="true"]{color:var(--blue)}
    /* reader */
    .rd-tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
    .toolbtn{min-height:40px;padding:6px 12px;border:1.5px solid #bfd7e1;border-radius:999px;background:#fff;color:var(--navy);font-size:12.5px;font-weight:850}
    .toolbtn[aria-pressed="true"]{border-color:var(--blue);background:var(--sky)}
    .rd-body{margin-top:14px}
    .para{margin:0 0 16px;font-size:16.5px;line-height:1.95;color:#22303d}
    .lv-L2 .para{font-size:17.5px}
    .chunked .seg:not(:last-child)::after{content:"∕";color:var(--coral);opacity:.95;font-weight:900;font-size:.85em;padding:0 2px}
    .para.hl{background:#fff9e8;border-radius:8px;box-shadow:0 0 0 6px #fff9e8}
    .vw{display:inline;padding:0;border:0;background:none;color:inherit;font:inherit;border-bottom:2px dotted var(--blue);cursor:pointer}
    .sheet{position:fixed;left:0;right:0;bottom:0;z-index:8;transform:translateY(105%);transition:transform .18s ease;padding:0 10px calc(10px + env(safe-area-inset-bottom))}
    .sheet.open{transform:none}
    .sheet-in{max-width:560px;margin:auto;padding:16px 17px;border:1px solid #b9deed;border-radius:18px;background:#fff;box-shadow:0 -8px 30px #17395726}
    .sheet-w{color:var(--navy);font-size:19px;font-weight:900}
    .hanja{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
    .hanja span{padding:5px 9px;border-radius:9px;background:#f4ece1;color:#7a5230;font-size:13px;font-weight:800}
    .sheet-e{margin-top:9px;font-size:14.5px;line-height:1.65}
    .sheet-s{margin-top:8px;color:var(--ok);font-size:12px;font-weight:800}
    .src{margin-top:14px;padding:12px 13px;border:1px dashed #bfd7e1;border-radius:12px;background:#f8fcfe;font-size:12.5px;color:var(--muted);line-height:1.6}
    .src a{color:var(--blue);font-weight:800;text-decoration:none}
    .evalrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
    .evalbtn{min-height:52px;padding:8px;border:1.5px solid #bfd7e1;border-radius:13px;background:#fff;color:var(--navy);font-weight:850;font-size:13px}
    .evalbtn[aria-pressed="true"]{border-color:var(--blue);background:var(--sky)}
    /* quiz */
    .qnum{color:var(--muted);font-size:12px;font-weight:900;letter-spacing:.05em}
    .qtext{margin-top:7px;font-size:16.5px;font-weight:800;color:var(--navy);line-height:1.55}
    .choices{display:grid;gap:8px;margin-top:13px}
    .choice{min-height:50px;padding:12px 14px;border:1.5px solid #bfd7e1;border-radius:13px;background:#fff;text-align:left;font-size:14.5px;line-height:1.5;color:var(--ink)}
    .choice.correct{border-color:var(--ok);background:#e7f6f0;font-weight:800}
    .choice.wrong{border-color:#e0a9a1;background:#fff0ef}
    .choice:disabled{cursor:default;opacity:.92}
    .explain{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--sky);font-size:13.5px;line-height:1.65}
    .explain b{color:var(--navy)}
    .streak-flame{font-size:15px;color:var(--coral);font-weight:900}
    .bar{height:10px;border-radius:999px;background:#e4edf1;overflow:hidden;margin-top:5px}
    .bar i{display:block;height:100%;border-radius:999px;background:var(--blue)}
    .dist{margin-top:10px}
    .dist .l{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:700;margin-top:9px}
    .days7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
    .day7{display:grid;place-items:center;gap:3px;font-size:10.5px;color:var(--muted);font-weight:800}
    .day7 i{width:26px;height:26px;border-radius:999px;background:#e4edf1}
    .day7 i.on{background:var(--ok)}
    .note{margin-top:10px;padding:10px 12px;border-radius:11px;background:#fff4e6;color:#7a4308;font-size:12.5px;line-height:1.6}
    .vlist .grow .t b{font-size:15.5px;color:var(--navy)}
    .meaning{display:none;margin-top:5px}
    .grow.open .meaning{display:block}
    textarea{width:100%;min-height:64px;margin-top:10px;padding:11px;border:1.5px solid #bfd7e1;border-radius:12px;font:inherit;font-size:14px;resize:vertical}
    select{width:100%;min-height:48px;margin-top:8px;padding:0 12px;border:1.5px solid #bfd7e1;border-radius:12px;background:#fff;font:inherit;font-size:15px;font-weight:700;color:var(--navy)}
    /* ── v1.1 피그마 시안 반영 ── */
    .greet{display:flex;align-items:center;gap:10px;margin:2px 2px 13px}
    .greet .g-l{flex:1;min-width:0}
    .g-date{color:var(--muted);font-size:12px;font-weight:600}
    .greet h1{font-size:22px}
    .streak-chip{flex:0 0 auto;display:flex;gap:5px;align-items:center;padding:7px 12px;border-radius:999px;background:#fbeae6;color:var(--coral);font-size:13px;font-weight:900}
    .hero2{padding:0;overflow:hidden;border-color:#b9deed}
    .hero2 .band{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 18px;font-size:13px;font-weight:900}
    .hero2 .band small{font-size:12px;font-weight:600;color:var(--muted)}
    .band.c-science{background:#e7f2fb;color:#155d94}.band.c-society{background:#fdf0e4;color:#8a5a12}.band.c-history{background:#f4ece1;color:#7a5230}.band.c-humanities{background:#f3ecf8;color:#6b4390}.band.c-environment{background:#e7f6ec;color:#20714a}
    .hero2 .hbody{padding:15px 18px 18px}
    .weekhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
    .weekdots{display:flex;justify-content:space-between;margin-top:12px}
    .wd{display:grid;justify-items:center;gap:5px;font-size:10.5px;color:var(--muted);font-weight:700}
    .wd i{width:30px;height:30px;border-radius:999px;background:#e4edf1}
    .wd i.done{background:var(--ok)}
    .wd.today i{background:#fff;box-shadow:inset 0 0 0 2.5px var(--blue)}
    .wd.today{color:var(--blue);font-weight:900}
    .rowdot{width:9px;height:9px;border-radius:999px;flex:0 0 auto;margin-top:6px}
    .dot-science{background:#155d94}.dot-society{background:#8a5a12}.dot-history{background:#7a5230}.dot-humanities{background:#6b4390}.dot-environment{background:#20714a}
    .progress-top{position:fixed;top:0;left:0;right:0;height:4px;background:var(--line);z-index:7}
    .progress-top i{display:block;height:100%;width:0;background:var(--blue)}
    .rd-fs .para{font-size:calc(16.5px * var(--fs,1))}
    .lv-L2.rd-fs .para{font-size:calc(17.5px * var(--fs,1))}
    .qhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
    .qbar{height:6px;border-radius:999px;background:#e4edf1;overflow:hidden;margin-top:9px}
    .qbar i{display:block;height:100%;background:var(--blue);border-radius:999px}
    .choice{display:flex;gap:11px;align-items:center}
    .cnum{flex:0 0 26px;width:26px;height:26px;border-radius:999px;background:var(--sky);color:var(--blue);font-weight:900;font-size:12.5px;display:grid;place-items:center}
    .choice.correct .cnum{background:var(--ok);color:#fff}
    .choice.wrong .cnum{background:var(--bad);color:#fff}
    .evchip{display:inline-block;margin-top:9px;padding:7px 12px;border-radius:999px;background:#fff;color:var(--blue);font-size:12px;font-weight:800}
    .ringwrap{display:flex;gap:18px;align-items:center;margin-top:6px}
    .ring{position:relative;flex:0 0 96px;width:96px;height:96px}
    .ring .rc{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
    .ring .rc b{display:block;color:var(--navy);font-size:19px;line-height:1.1}
    .ring .rc span{display:block;color:var(--muted);font-size:10px;font-weight:700}
    .grade-lbl{margin:12px 0 0;color:var(--muted);font-size:12.5px;font-weight:900}
    .obdots{display:flex;gap:7px;margin-bottom:9px}
    .obdots i{width:9px;height:9px;border-radius:999px;background:var(--line)}
    .obdots i.on{width:26px;background:var(--blue)}
    /* ── v1.2 훈련·탐구·영어 대역 ── */
    .para-en{margin:-8px 0 18px;padding:12px 14px;border-left:3px solid var(--blue);border-radius:0 10px 10px 0;background:#f5fbfe;color:#1e2f3d;font-size:16px;line-height:1.85;font-weight:450}
    .en-only .para{display:none}
    .en-only .para-en{margin:0 0 18px;padding:0;border-left:0;background:transparent;font-size:17px;line-height:1.9;color:#22303d}
    .vw-en{border-bottom-color:var(--ok)}
    .seg-ctl{display:inline-flex;border:1.5px solid #bfd7e1;border-radius:999px;overflow:hidden;background:#fff}
    .seg-ctl button{min-height:40px;padding:6px 13px;border:0;background:none;color:var(--muted);font-size:12.5px;font-weight:850}
    .seg-ctl button+button{border-left:1.5px solid #e2ebef}
    .seg-ctl button[aria-pressed="true"]{background:var(--sky);color:var(--navy)}
    /* 자동 읽기 (SentenceMask) */
    .autoread .rd-body .seg{opacity:.13;transition:opacity .18s}
    .autoread .rd-body .seg.now{opacity:1}
    .autoread .rd-body .vw{pointer-events:none}
    .autoread.chunked .seg:not(:last-child)::after{opacity:.15}
    .autoread .seg.now::after{opacity:.95}
    .auto-bar{position:fixed;left:0;right:0;bottom:0;z-index:9;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px #17395722}
    .auto-in{display:flex;max-width:560px;margin:auto;gap:7px;align-items:center;flex-wrap:wrap}
    .lang-en-tag{display:inline-block;padding:2px 7px;border-radius:6px;background:#e7f6f0;color:var(--ok);font-size:11px;font-weight:900;vertical-align:2px;margin-right:5px}
    .deep{margin-top:14px;padding:14px 15px;border:1px solid #d6ebf4;border-radius:14px;background:#f8fcfe}
    .deep h3{margin-bottom:4px}
    .deep-item{display:block;width:100%;margin-top:9px;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;text-align:left;text-decoration:none;color:var(--ink)}
    .deep-item b{display:block;color:var(--navy);font-size:13.5px;line-height:1.5}
    .deep-item small{display:block;margin-top:3px;color:var(--muted);font-size:12px;line-height:1.5}
    .deep-link{display:block;text-decoration:none;color:inherit}
    .deep-mini{display:inline-block;margin-top:8px;padding:6px 11px;border-radius:999px;background:#fff0ef;color:#9b352b;font-size:11.5px;font-weight:850;text-decoration:none}
    .train-num{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:999px;background:var(--sky);color:var(--blue);font-size:13px;font-weight:900;margin-right:8px}
    .tokenwrap{display:flex;flex-wrap:wrap;align-items:center;row-gap:10px;margin-top:14px;font-size:16.5px;line-height:1.6}
    .tok{color:var(--ink)}
    .gap{min-width:20px;min-height:34px;margin:0 1px;padding:0 3px;border:0;background:none;color:#c3d4dc;font-size:15px;font-weight:900}
    .gap[aria-pressed="true"]{color:var(--blue)}
    .gap.hit{color:var(--ok)}
    .gap.miss{color:var(--bad)}
    .gap.extra{color:var(--warn)}
    .stage-dots{display:flex;gap:6px;margin-top:8px}
    .stage-dots i{height:7px;flex:1;border-radius:999px;background:#e4edf1}
    .stage-dots i.on{background:var(--blue)}
    .hj-char{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;background:#f4ece1;color:#7a5230;font-size:22px;font-weight:900;margin-right:10px;flex:0 0 auto}
    .chipword{display:inline-block;margin:3px 4px 0 0;padding:5px 9px;border-radius:999px;background:var(--sky);color:var(--navy);font-size:12.5px;font-weight:800}
    .lab-step{display:flex;gap:6px;margin:10px 0 4px}
    .lab-step i{height:7px;flex:1;border-radius:999px;background:#e4edf1}
    .lab-step i.on{background:var(--blue)}
    .guide{margin-top:10px;padding:11px 13px;border-radius:11px;background:#f3ecf8;color:#553a70;font-size:13px;line-height:1.65}
    .matchip{display:flex;gap:10px;align-items:flex-start;width:100%;margin-top:8px;padding:11px 13px;border:1.5px solid #bfd7e1;border-radius:12px;background:#fff;text-align:left}
    .matchip[aria-pressed="true"]{border-color:var(--blue);background:var(--sky)}
    .matchip .ck{flex:0 0 20px;width:20px;height:20px;border-radius:6px;border:2px solid #9db8c4;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:900}
    .matchip[aria-pressed="true"] .ck{background:var(--blue);border-color:var(--blue)}
    .report-doc{margin-top:12px;padding:16px;border:1px solid var(--line);border-radius:12px;background:#fffdf8;font-size:14px;line-height:1.75}
    .report-doc h4{margin:14px 0 4px;color:var(--navy);font-size:14px}
    .report-doc h4:first-child{margin-top:0}
    input[type="text"]{width:100%;min-height:48px;margin-top:8px;padding:0 12px;border:1.5px solid #bfd7e1;border-radius:12px;font:inherit;font-size:15px;color:var(--ink);background:#fff}
    .loading{padding:48px 16px;text-align:center;color:var(--muted)}
    .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:350px){.pick-grid,.stat-grid,.evalrow{grid-template-columns:repeat(2,minmax(0,1fr))}.row2{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><div class="head"><div class="brand">WB 진로독서<small>WEXLER BRAIN CENTER</small></div><div id="headActions"></div></div></header>
  <main id="app" aria-busy="true"><div class="loading" role="status">오늘의 글을 준비하고 있어요…</div></main>
  <nav class="tabbar" id="tabbar" hidden><div class="tabin">
    <button class="tab" data-act="nav" data-v="home"><b>⌂</b>홈</button>
    <button class="tab" data-act="nav" data-v="train"><b>◎</b>훈련</button>
    <button class="tab" data-act="nav" data-v="lab"><b>✎</b>탐구</button>
    <button class="tab" data-act="nav" data-v="library"><b>▤</b>서재</button>
    <button class="tab" data-act="nav" data-v="report"><b>◔</b>리포트</button>
  </div></nav>
  <div class="sheet" id="sheet" role="dialog" aria-label="어휘 풀이"><div class="sheet-in" id="sheetIn"></div></div>
  <div id="live" class="sr" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ───────────────────────── 상수 ───────────────────────── */
const KEY='wbr.v1';
const GRADES=[['e3','초3'],['e4','초4'],['e5','초5'],['e6','초6'],['m1','중1'],['m2','중2'],['m3','중3'],['h1','고1'],['h2','고2'],['h3','고3']];
const LEVEL_OF={e3:'L2',e4:'L2',e5:'L2',e6:'L2',m1:'L3',m2:'L3',m3:'L3',h1:'L4',h2:'L4',h3:'L4'};
const LEVELS=['L2','L3','L4'];
const LEVEL_LABEL={L2:'초등 심화',L3:'중등',L4:'고등'};
const INTERESTS=[
  ['eng','공학·기계','로봇, 자동차, 우주'],['it','IT·소프트웨어','코딩, 인공지능, 게임'],
  ['med','의학·보건','의사, 간호, 건강'],['bio','생명과학','동물, 식물, 유전자'],
  ['nat','자연·수학','과학 원리, 수학'],['biz','경영·경제','회사, 돈의 흐름'],
  ['media','미디어·콘텐츠','방송, 웹툰, 영상'],['law','법·행정','법, 정치, 공무원'],
  ['edu','교육','가르치는 일'],['art','예술·디자인','그림, 음악, 디자인'],
  ['env','환경·에너지','기후, 자연 보호'],['hum','인문·글쓰기','책, 역사, 글']
];
const INTEREST_LABEL=Object.fromEntries(INTERESTS.map(x=>[x[0],x[1]]));
const CATS={science:'과학·기술',society:'사회·경제',history:'역사·문화',humanities:'인문·예술',environment:'환경'};
const EVALS=[['good','잘 이해했어요','ok'],['hard','조금 어려웠어요','warn'],['again','다시 읽고 싶어요','muted']];

/* ───────────────────────── 상태 ───────────────────────── */
let DB=null;
let S=loadState();
let view={name:'boot'};
let sess={}; // 화면 임시 상태 (진단/퀴즈 진행 등)
let deferredPrompt=null; // PWA 설치 프롬프트
const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;

function normalizeState(s){
  s.prefs=s.prefs||{};
  s.prefs.chunk=s.prefs.chunk||{L2:true,L3:false,L4:false};
  s.prefs.en=s.prefs.en||{L3:0,L4:0};
  ['L3','L4'].forEach(l=>{if(typeof s.prefs.en[l]==='boolean')s.prefs.en[l]=s.prefs.en[l]?1:0;});
  s.train=s.train||[];
  s.redbook=s.redbook||[];
  s.reports=s.reports||[];
  if(!('lab' in s))s.lab=null;
  (s.vocab||[]).forEach(v=>{if(v.box==null)v.box=0;if(!v.last)v.last=v.addedAt||dkey();});
  return s;
}
function loadState(){
  try{const raw=localStorage.getItem(KEY);if(raw){const s=JSON.parse(raw);if(s&&s.v===1)return normalizeState(s);}}catch(e){}
  return normalizeState({v:1,profile:null,prefs:{chunk:{L2:true,L3:false,L4:false}},readings:{},scraps:{},vocab:[],quiz:{},days:{},daily:{},diag:null});
}
function save(){S.ts=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}schedulePush();}

/* ───────────────────────── 서버 동기화 (선생님 연동) ───────────────────────── */
const SYNC={avail:false,auth:null,timer:null,busy:false};
try{SYNC.auth=JSON.parse(localStorage.getItem('wbr.auth')||'null');}catch(e){}
function syncSaveAuth(){try{if(SYNC.auth)localStorage.setItem('wbr.auth',JSON.stringify(SYNC.auth));else localStorage.removeItem('wbr.auth');}catch(e){}}
async function syncApi(path,opt){
  const r=await fetch('/api'+path,Object.assign({headers:{'Content-Type':'application/json',...(SYNC.auth&&SYNC.auth.token?{Authorization:'Bearer '+SYNC.auth.token}:{})}},opt||{}));
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&SYNC.auth){SYNC.auth=null;syncSaveAuth();}
  if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
  return j;
}
async function syncHealth(){
  try{const r=await fetch('/api/health',{cache:'no-store'});const j=await r.json();SYNC.avail=!!(j&&j.ok);}catch(e){SYNC.avail=false;}
}
function activityScore(s){
  if(!s)return 0;
  return Object.keys(s.readings||{}).length*3+(s.reports||[]).length*5+(s.vocab||[]).length+(s.train||[]).length+(s.redbook||[]).length+Object.keys(s.scraps||{}).length;
}
async function syncPull(login){
  if(!SYNC.avail||!SYNC.auth)return;
  try{
    const j=await syncApi('/pull');
    const adopt=j.state&&(
      !S.profile
      ||(login&&activityScore(j.state)>activityScore(S))
      ||(!login&&(j.state.ts||0)>(S.ts||0)&&activityScore(j.state)>=activityScore(S))
    );
    if(adopt){S=normalizeState(j.state);save();}
    if(j.level&&S.profile&&S.profile.level!==j.level&&LEVELS.includes(j.level)){
      S.profile.level=j.level;save();announce('선생님이 레벨을 '+LEVEL_LABEL[j.level]+'로 조정했어요');
    }
    SYNC.auth.lastSync=Date.now();syncSaveAuth();
  }catch(e){}
}
async function syncPush(){
  if(!SYNC.avail||!SYNC.auth||SYNC.busy)return;
  SYNC.busy=true;
  try{await syncApi('/state',{method:'PUT',body:JSON.stringify({state:S})});SYNC.auth.lastSync=Date.now();syncSaveAuth();}
  catch(e){}
  SYNC.busy=false;
}
function schedulePush(){
  if(!SYNC.avail||!SYNC.auth)return;
  if(SYNC.timer)clearTimeout(SYNC.timer);
  SYNC.timer=setTimeout(()=>{SYNC.timer=null;syncPush();},2500);
}

/* ───────────────────────── 유틸 ───────────────────────── */
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dkey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(k,n){const d=new Date(k+'T12:00:00');d.setDate(d.getDate()+n);return dkey(d);}
function hash(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}return Math.abs(h);}
function announce(t){$('#live').textContent=t;}
function paraText(p){return p.join('');}
function levelBody(a,lv){return a.levels&&a.levels[lv];}
function myLevel(){return S.profile?S.profile.level:'L3';}
function published(){return DB.articles.filter(a=>a.status==='published'&&levelBody(a,myLevel()));}

/* ───────────────────────── 추천 로직 ───────────────────────── */
function lastCats(n){
  const rs=Object.entries(S.readings).sort((a,b)=>b[1].date<a[1].date?-1:1).slice(0,n);
  return rs.map(([id])=>{const a=DB.articles.find(x=>x.id===id);return a?a.category:null;}).filter(Boolean);
}
function score(a,today){
  let sc=0;
  const iv=S.profile?S.profile.interests:[];
  if(a.careers.some(c=>iv.includes(c)))sc+=2;
  if(!lastCats(2).includes(a.category))sc+=1;
  return sc*1000+hash(today+a.id)%1000;
}
function pickDaily(){
  const today=dkey();
  if(S.daily[today]&&DB.articles.find(a=>a.id===S.daily[today]))return S.daily[today];
  const pool=published();
  const unread=pool.filter(a=>!S.readings[a.id]);
  const cands=(unread.length?unread:pool).slice().sort((a,b)=>score(b,today)-score(a,today));
  if(!cands.length)return null;
  S.daily[today]=cands[0].id;save();
  return cands[0].id;
}
function recommend(excludeId){
  const today=dkey();
  const iv=S.profile?S.profile.interests:[];
  const pool=published().filter(a=>a.id!==excludeId&&!S.readings[a.id]);
  const sorted=pool.slice().sort((a,b)=>score(b,today)-score(a,today));
  const match=sorted.filter(a=>a.careers.some(c=>iv.includes(c)));
  const other=sorted.filter(a=>!a.careers.some(c=>iv.includes(c)));
  const out=[...match.slice(0,2),...other.slice(0,1)];
  for(const a of sorted){if(out.length>=3)break;if(!out.includes(a))out.push(a);}
  return out.slice(0,3);
}

/* ───────────────────────── 스트릭 ───────────────────────── */
function streak(){
  let d=dkey();let n=0;
  if(!S.days[d])d=addDays(d,-1);
  while(S.days[d]){n++;d=addDays(d,-1);}
  return n;
}
function weekCount(){
  let n=0;for(let i=0;i<7;i++){if(S.days[addDays(dkey(),-i)])n++;}
  return n;
}

    return `<div class="card hero"><p class="eyebrow">시작하기 3/3</p><h1>짧은 글로 레벨을 확인해요</h1>
      <p class="sub">2분짜리 글 하나를 읽고 4문제를 풀면, 딱 맞는 수준의 글부터 시작할 수 있어요. 건너뛰면 학년 기준으로 시작해요.</p>

      <div class="rd-body">${d.paragraphs.map(p=>`<p class="para">${esc(paraText(p))}</p>`).join('')}</div>

function finishOnboard(levelOverride){
  const st=sess.ob;

  S.profile={grade:st.grade,level:lv,interests:st.interests.slice(0,3),createdAt:dkey()};
  if(st.diagQ)S.diag={score:st.diagQ.correct,total:4,at:dkey(),level:lv};
  save();go('home');
}

/* ───────────────────────── 홈 ───────────────────────── */
function weekDots(){
  const dows=['일','월','화','수','목','금','토'];
  let cells='';
  for(let i=6;i>=0;i--){
    const k=addDays(dkey(),-i);
    const d=new Date(k+'T12:00:00');
    const done=!!S.days[k];
    cells+=`<span class="wd ${i===0?'today':''}"><i class="${done?'done':''}"></i>${dows[d.getDay()]}</span>`;
  }
  return cells;
}

/* ───────────────────────── 읽기 화면 ───────────────────────── */
function vReader(){
  const a=DB.articles.find(x=>x.id===view.id);if(!a)return '<div class="card"><div class="empty">글을 찾을 수 없어요.</div></div>';
  const lv=myLevel();const b=levelBody(a,lv);
  if(!sess.startAt)sess.startAt=Date.now();
  const chunk=S.prefs.chunk[lv];
  const done=sess.readDone;
  const linked=new Set();
  const linkedEn=new Set();
  const hasEn=lv!=='L2'&&Array.isArray(b.en)&&b.en.length===b.paragraphs.length;
  const enMode=hasEn?(S.prefs.en[lv]||0):0;
  const paras=b.paragraphs.map((p,pi)=>{
    const segs=p.map(seg=>{
      let html=null;
      for(const vb of b.vocab){
        if(linked.has(vb.word))continue;
        const idx=seg.indexOf(vb.word);
        if(idx>=0){linked.add(vb.word);
          html=esc(seg.slice(0,idx))+`<button class="vw" data-act="vocab" data-id="${a.id}" data-w="${esc(vb.word)}">${esc(vb.word)}</button>`+esc(seg.slice(idx+vb.word.length));
          break;}
      }
      return `<span class="seg">${html!=null?html:esc(seg)}</span>`;
    }).join('');

const QTYPE_LABEL={main:'핵심 내용',detail:'세부 정보',vocab:'어휘',infer:'추론',critical:'비판적 사고'};
function quizCard(questions,q,prefix,title){
  const cur=questions[q.i];
  const total=questions.length;
  const answered=q.picked!=null;
  return `<div class="card"><div class="qhead"><p class="qnum">문제 ${q.i+1} / ${total}</p>
    ${title?`<p class="qnum" style="font-weight:600">${esc(title)}</p>`:''}</div>
    <div class="qbar"><i style="width:${Math.round(((q.i+(answered?1:0))/total)*100)}%"></i></div>
    <p class="sub" style="margin-top:12px"><span class="tag">${QTYPE_LABEL[cur.type]||'문항'}</span></p>
    <p class="qtext">${esc(cur.q)}</p>
    <div class="choices">${cur.choices.map((c,i)=>{
      let cls='choice';let num=String(i+1);
      if(answered){if(i===cur.answer){cls+=' correct';num='✓';}else if(i===q.picked){cls+=' wrong';num='✕';}}
      return `<button class="${cls}" data-act="${prefix}-pick" data-i="${i}" ${answered?'disabled':''}>
        <span class="cnum">${num}</span><span style="flex:1;text-align:left">${esc(c)}</span></button>`;
    }).join('')}</div>
    ${answered?`<div class="explain"><b>${q.picked===cur.answer?'정답이에요!':'아쉬워요 — 정답은 '+(cur.answer+1)+'번.'}</b> ${esc(cur.explain)}<br>
    <span class="evchip">근거: ${cur.evidencePara+1}번째 문단</span></div>
    <button class="btn" data-act="${prefix}-next">${q.i+1<total?'다음 문제':'결과 보기'}</button>`:''}</div>`;
}
function vQuiz(){
  const a=DB.articles.find(x=>x.id===view.id);
  const b=levelBody(a,myLevel());
  const q=sess.q||(sess.q={i:0,correct:0,picked:null,fin:false});
  if(q.fin){
    const total=b.questions.length;
    const acc=Math.round(q.correct/total*100);
    let msg='잘했어요! 근거를 찾으며 읽는 습관이 붙고 있어요.';
    if(acc===100)msg='완벽해요! 다음에는 한 단계 높은 글에 도전해 볼까요? (레벨 조정은 선생님과 상의해요)';
    else if(acc<50)msg='괜찮아요. 해설의 근거 문단을 다시 읽어 보면 힘이 돼요.';
    return `<div class="card hero"><p class="eyebrow">문제 풀이 결과</p><h1>${total}문제 중 ${q.correct}개 정답</h1>

/* ───────────────────────── 훈련 ───────────────────────── */
function daysSince(k){const a=new Date(k+'T12:00:00'),b=new Date(dkey()+'T12:00:00');return Math.round((b-a)/86400000);}
function dueVocab(){const iv=[0,1,3,7,14];return S.vocab.filter(v=>daysSince(v.last)>=iv[Math.min(v.box,4)]);}
function hanjaFamilies(){
  const map={};
  for(const a of DB.articles){
    if(a.status!=='published')continue;
    for(const lv of LEVELS){
      const b=a.levels[lv];if(!b)continue;
      for(const v of b.vocab){
        if(!v.hanja)continue;
        for(const part of v.hanja.split('+')){
          const m=part.trim().match(/^(.)\((.+)\)$/);if(!m)continue;
          if(!map[m[1]])map[m[1]]={ch:m[1],rd:m[2],words:{}};
          map[m[1]].words[v.word]={word:v.word,easy:v.easy};
        }
      }
    }
  }
  return Object.values(map).map(f=>({ch:f.ch,rd:f.rd,words:Object.values(f.words)}))
    .filter(f=>f.words.length>=2).sort((x,y)=>y.words.length-x.words.length);
}
function copyText(t){
  const fb=()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');announce('복사했어요');}catch(e){announce('복사가 안 됐어요');}ta.remove();};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>announce('복사했어요'),fb);}else fb();
}
function pickTrainPara(){
  const reads=Object.entries(S.readings).sort((x,y)=>y[1].date<x[1].date?-1:1);
  for(const [id] of reads){
    const a=DB.articles.find(x=>x.id===id);if(!a)continue;
    const b=levelBody(a,myLevel());if(!b)continue;
    let best=-1,bi=0;
    b.paragraphs.forEach((p,i)=>{const len=p.join('').length;if(p.length>=3&&len>best){best=len;bi=i;}});
    if(best>0)return {articleId:id,paraIdx:bi};
  }
  return null;
}
function modelBoundaries(p){
  const out=new Set();let cum=0;
  for(let i=0;i<p.length;i++){
    cum+=p[i].trim().split(/\s+/).filter(Boolean).length;
    if(i<p.length-1)out.add(cum-1);
  }
  return out;
}
function vTrain(){

function vChunkTrain(){
  const ct=sess.ct;
  const a=DB.articles.find(x=>x.id===ct.articleId);
  const b=levelBody(a,myLevel());
  const p=b.paragraphs[ct.paraIdx];
  const text=p.join('');
  const dots=`<div class="stage-dots">${[1,2,3].map(i=>`<i class="${ct.stage>=i?'on':''}"></i>`).join('')}</div>`;
  const quit=`<button class="btn ghost sm" data-act="ct-quit">그만하기</button>`;
  if(ct.stage===1){
    return `<div class="card chunked"><p class="eyebrow">끊어 읽기 훈련 1/3 — 따라 읽기</p>${dots}
      <p class="sub" style="margin-top:10px">「${esc(b.title)}」의 한 문단이에요. ∕ 표시에서 살짝 쉬며 의미 덩어리로 읽어 보세요.</p>
      <p class="para" style="margin-top:14px">${p.map(seg=>`<span class="seg">${esc(seg)}</span>`).join('')}</p>
      <button class="btn" data-act="ct-to2">다 읽었어요 — 직접 끊어 볼래요</button>${quit}</div>`;
  }
  if(ct.stage===2){
    const words=text.split(/\s+/).filter(Boolean);
    let flow='';
    words.forEach((w,i)=>{
      flow+=`<span class="tok">${esc(w)}</span>`;
      if(i<words.length-1){
        const on=ct.marks.has(i);
        let cls='gap',sym=on?'∕':'·';
        if(ct.checked){
          const inM=ct.model.has(i);
          if(on&&inM){cls+=' hit';sym='∕';}
          else if(!on&&inM){cls+=' miss';sym='∕';}
          else if(on&&!inM){cls+=' extra';sym='∕';}
        }
        flow+=`<button class="${cls}" data-act="ct-gap" data-i="${i}" aria-pressed="${on}" ${ct.checked?'disabled':''}>${sym}</button>`;
      }
    });
    let result='';
    if(ct.checked){
      result=`<div class="explain" style="margin-top:14px"><b>일치 ${ct.hit} / 모범 ${ct.model.size}${ct.extra?` · 불필요 ${ct.extra}`:''} — ${ct.score}점</b><br>
      <span style="color:var(--ok);font-weight:800">초록 ∕</span> 잘 끊었어요 · <span style="color:var(--bad);font-weight:800">빨강 ∕</span> 여기서도 끊어야 해요${ct.extra?` · <span style="color:var(--warn);font-weight:800">주황 ∕</span> 안 끊어도 돼요`:''}</div>
      <button class="btn" data-act="ct-to3">다음 — 표시 없이 읽기</button>`;
    }else{
      result=`<button class="btn" data-act="ct-check">확인하기</button>`;
    }
    return `<div class="card"><p class="eyebrow">끊어 읽기 훈련 2/3 — 직접 끊기</p>${dots}
      <p class="sub" style="margin-top:10px">의미가 나뉘는 곳의 <b>·</b> 를 눌러 ∕ 로 바꿔 보세요.</p>
      <div class="tokenwrap">${flow}</div>${result}${quit}</div>`;
  }
  const q=ct.q;
  const answered=ct.picked!=null;
  if(ct.stage===3){
    return `<div class="card"><p class="eyebrow">끊어 읽기 훈련 3/3 — 표시 없이 읽기</p>${dots}
      <p class="para" style="margin-top:14px">${esc(text)}</p>
      <p class="qtext">${esc(q.q)}</p>
      <div class="choices">${q.choices.map((c,i)=>{
        let cls='choice',num=String(i+1);
        if(answered){if(i===q.answer){cls+=' correct';num='✓';}else if(i===ct.picked){cls+=' wrong';num='✕';}}
        return `<button class="${cls}" data-act="ct-pick" data-i="${i}" ${answered?'disabled':''}><span class="cnum">${num}</span><span style="flex:1;text-align:left">${esc(c)}</span></button>`;
      }).join('')}</div>
      ${answered?`<div class="explain"><b>${ct.picked===q.answer?'정답!':'아쉬워요.'}</b> ${esc(q.explain)}</div>
      <button class="btn" data-act="ct-finish">훈련 마치기</button>`:''}${answered?'':quit}</div>`;
  }
  return `<div class="card hero"><p class="eyebrow">끊어 읽기 훈련 완료</p><h1>끊기 ${ct.score}점 · 문제 ${ct.qOk?'정답':'오답'}</h1>
    <p class="sub">${ct.score>=80?'의미 덩어리가 눈에 잘 들어오고 있어요!':'모범 ∕ 위치를 다시 보며 한 번 더 해 보면 늘어요.'}</p>
    <button class="btn" data-act="ct-quit">훈련으로 돌아가기</button></div>`;
}

/* ───────────────────────── 탐구 랩 ───────────────────────── */
const LAB_STEPS=['재료 고르기','탐구 주제','탐구 동기','알게 된 내용','더 알아보기','결론과 성찰','완성'];
function labMaterials(){
  const ids=[...new Set([...Object.keys(S.scraps),...Object.keys(S.readings)])];
  return ids.map(id=>{const a=DB.articles.find(x=>x.id===id);if(!a)return null;
    const b=levelBody(a,myLevel())||a.levels.L3||a.levels.L2;
    return {id,title:b.title,category:a.category,a};}).filter(Boolean);
}
function reportText(r){
  const mats=r.mats.map(id=>{const a=DB.articles.find(x=>x.id===id);const b=a?(levelBody(a,myLevel())||a.levels.L3):null;return {a,title:b?b.title:id};});
  const refs=[];
  mats.forEach(m=>{if(m.a)m.a.sources.forEach(s=>{const t=s.title+' — '+s.url;if(!refs.includes(t))refs.push(t);});});
  const lines=[];
  lines.push('# '+(r.title||'탐구보고서'));
  lines.push('');
  lines.push('## 1. 주제 선정 이유(탐구 동기)');lines.push(r.motive||'');
  lines.push('## 2. 탐구 질문');lines.push(r.topic||'');
  lines.push('## 3. 읽은 자료');
  mats.forEach(m=>lines.push('- '+m.title));
  lines.push('## 4. 알게 된 내용');
  mats.forEach(m=>{const l=(r.learned||{})[m.a?m.a.id:''];if(l)lines.push('- ('+m.title+') '+l);});
  if(r.more){lines.push('## 5. 더 알아본 것');lines.push(r.more);}
  lines.push('## '+(r.more?'6':'5')+'. 결론');lines.push(r.conclusion||'');
  lines.push('## '+(r.more?'7':'6')+'. 느낀 점과 진로 성찰');lines.push(r.reflect||'');
  lines.push('## 참고 자료');
  refs.forEach(t=>lines.push('- '+t));
  return lines.join('\n');
}

}
function vLab(){
  if(sess.labView!=null)return vReportDoc(S.reports[sess.labView]);
  if(!S.lab){
    const mats=labMaterials();
    return `<div class="card hero"><p class="eyebrow">탐구 랩</p><h1>읽은 글이 보고서가 됩니다</h1>
      <p class="sub">재료(완독·스크랩) ${mats.length}편. 3편 이상이면 좋아요.</p>
      <button class="btn" data-act="lab-new" ${mats.length?'':'disabled'}>${mats.length?'탐구보고서 시작하기':'먼저 글을 1편 읽어 주세요'}</button></div>
    ${S.reports.length?`<div class="card"><h2>완성한 보고서</h2><div class="glist">${S.reports.map((r,i)=>`<button class="grow" data-act="lab-view" data-i="${i}"><span class="t"><b>${esc(r.title||'제목 없음')}</b><small>${r.done} · 재료 ${r.mats.length}편</small></span><span class="go">›</span></button>`).join('')}</div></div>`:''}

      <p class="sub" style="margin-top:10px">보고서의 재료가 될 글을 고르세요. (1편 이상, 3편 추천)</p>
      ${mats.map(m=>`<button class="matchip" data-act="lab-mat" data-id="${m.id}" aria-pressed="${L.mats.includes(m.id)}">
        <span class="ck">${L.mats.includes(m.id)?'✓':''}</span>
        <span><b>${esc(m.title)}</b><br><small style="color:var(--muted)">${CATS[m.category]}</small></span></button>`).join('')}
      ${nav()}</div>`;
  }
  if(step===1){
    const titles=L.mats.map(id=>{const m=labMaterials().find(x=>x.id===id);return m?m.title:id;});
    return `<div class="card">${head}
      <div class="guide">고른 글: ${titles.map(esc).join(' / ')}<br>이 글들을 관통하는 <b>궁금증을 질문 한 문장</b>으로 써 보세요. 예: "우주에서 사람 몸을 지키려면 무엇이 필요할까?"</div>

      <div class="guide">유도 질문 — 글을 읽다가 <b>가장 놀랐던 부분</b>은? 이 주제가 <b>내 진로와 어떻게 닿아</b> 있나요? 왜 하필 이 질문인가요?</div>

      ${L.mats.map(id=>{const m=labMaterials().find(x=>x.id===id);
        return `<p class="sub" style="margin-top:12px;font-weight:800;color:var(--navy)">${esc(m?m.title:id)}</p>

      <textarea id="labMore" style="min-height:80px" placeholder="더 찾아본 내용·출처 (선택)">${esc(L.more||'')}</textarea>
      ${nav()}</div>`;
  }
  if(step===5){
    return `<div class="card">${head}

function renderEnPara(text,segArr,vocabList,linked,articleId,chunkOn){
  const chunks=(Array.isArray(segArr)&&segArr.join('')===text)?segArr:[text];
  return chunks.map(c=>{
    const hits=[];
    for(const ev of vocabList){
      if(linked.has(ev.word))continue;
      const i=c.indexOf(ev.word);
      if(i>=0){hits.push([i,ev.word]);linked.add(ev.word);}
    }
    hits.sort((x,y)=>x[0]-y[0]);
    let out='',pos=0;
    for(const [i,w] of hits){
      if(i<pos)continue;
      out+=esc(c.slice(pos,i))+`<button class="vw vw-en" data-act="vocab-en" data-id="${articleId}" data-w="${esc(w)}">${esc(w)}</button>`;
      pos=i+w.length;
    }
    out+=esc(c.slice(pos));
    return `<span class="seg">${out}</span>`;
  }).join('');
}

function autoSegs(){return Array.from(document.querySelectorAll('#readerCard .rd-body .seg')).filter(el=>el.offsetParent!==null);}
function autoDelay(el){
  const len=(el.textContent||'').trim().length;
  const per=[240,165,110][sess.auto?sess.auto.speed:1];
  return Math.max(700,len*per);
}
function autoTick(){
  const a=sess.auto;if(!a||!a.playing)return;
  const segs=autoSegs();
  if(a.idx>=segs.length){autoStop(true);return;}
  segs.forEach((s,i)=>s.classList.toggle('now',i===a.idx));
  const el=segs[a.idx];
  if(el)el.scrollIntoView({block:'center',behavior:'smooth'});
  a.timer=setTimeout(()=>{a.idx++;autoTick();},autoDelay(el));
}
function autoStop(done){
  if(sess.auto&&sess.auto.timer)clearTimeout(sess.auto.timer);
  sess.auto=null;
  const c=document.getElementById('readerCard');if(c)c.classList.remove('autoread');
  document.querySelectorAll('.seg.now').forEach(s=>s.classList.remove('now'));
  const bar=document.getElementById('autoBar');if(bar)bar.remove();
  if(done)announce('자동 읽기 완료! 눈이 의미 단위를 따라갔어요.');
}
function autoStart(){
  if(sess.auto)return;
  sess.auto={idx:0,playing:true,speed:1,timer:null};
  const c=document.getElementById('readerCard');if(c)c.classList.add('autoread');
  const bar=document.createElement('div');bar.className='auto-bar';bar.id='autoBar';
  bar.innerHTML=`<div class="auto-in">

    <span style="flex:1"></span>

}

document.addEventListener('change',e=>{
  const t=e.target.closest('[data-act-change]');if(!t)return;
  if(t.dataset.actChange==='level'){S.profile.level=t.value;save();render();announce('레벨 변경: '+LEVEL_LABEL[t.value]);}
});

/* ───────────────────────── PWA ───────────────────────── */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferredPrompt=e;
  if(view.name==='settings')render();
});
window.addEventListener('appinstalled',()=>{
  deferredPrompt=null;announce('앱 설치 완료!');
  if(view.name==='settings')render();
});

/* ───────────────────────── 부팅 ───────────────────────── */
(async function boot(){
  try{
    const res=await fetch('./articles.json',{cache:'no-store'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    DB=await res.json();
    if(!DB||!Array.isArray(DB.articles)||!DB.diagnostics)throw new Error('bad data');
  }catch(err){
    $('#app').innerHTML='<div class="card"><div class="empty">글 데이터를 불러오지 못했어요.<br>인터넷 연결을 확인하고 새로고침해 주세요.</div><button class="btn" id="reloadBtn">새로고침</button></div>';
    $('#app').removeAttribute('aria-busy');
    $('#reloadBtn').addEventListener('click',()=>location.reload());
    return;
  }
  await syncHealth();
  if(SYNC.avail&&SYNC.auth)await syncPull();
  view={name:S.profile?'home':'onboard'};
  render();
})();
</script>
</body>
</html>
