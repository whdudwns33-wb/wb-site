<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173957">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; img-src 'self' data:; media-src 'self' blob:; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'; worker-src 'self'; base-uri 'none'; form-action 'none'">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>WB 진로독서</title>
  <style>
    :root{--navy:#173957;--blue:#087ba6;--sky:#eaf7fb;--bg:#f3f7f8;--line:#d9e5e9;--muted:#647784;--ink:#20384c;--ok:#14755e;--warn:#8a4b08;--bad:#9b352b;--coral:#c9503c;--white:#fff;
      --rdf:system-ui,-apple-system,'Noto Sans KR',sans-serif;--rdfs:16.5px;--rdlh:1.95}
    /* 본문 기본 크기 — 읽기 화면은 #readerCard 인라인 변수(학생이 고른 값)가 이기고,
       진단 지문처럼 인라인이 없는 카드는 여기 값을 쓴다. */
    .lv-L1{--rdfs:19.5px;--rdlh:2}
    .lv-L2{--rdfs:17.5px}
    *{box-sizing:border-box}html{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}body{min-width:280px;margin:0}
    button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
    header{position:sticky;top:0;z-index:5;padding:max(11px,env(safe-area-inset-top)) 14px 11px;background:var(--navy);color:#fff;box-shadow:0 4px 18px #17395730}
    .head{display:flex;max-width:560px;margin:auto;align-items:center;justify-content:space-between;gap:12px}
    .brand{font-size:18px;font-weight:900;line-height:1.1}.brand small{display:block;margin-top:3px;font-size:9px;letter-spacing:.1em;opacity:.72}
    .headbtn{min-width:44px;min-height:44px;padding:0 12px;border:1px solid #ffffff66;border-radius:12px;background:transparent;color:#fff;font-size:13px;font-weight:850}
    .headright{display:flex;align-items:center;gap:6px}
    /* 두 앱은 한 벌이다. 오갈 길이 없으면 학생이 주소를 손으로 쳐야 한다. */
    .swap{display:inline-flex;align-items:center;min-height:44px;padding:0 11px;border:1px solid #ffffff66;border-radius:12px;color:#fff;font-size:13px;font-weight:850;text-decoration:none;white-space:nowrap}
    main{max-width:560px;margin:auto;padding:14px 12px calc(84px + env(safe-area-inset-bottom))}
    .card{margin-bottom:12px;padding:17px;border:1px solid var(--line);border-radius:18px;background:var(--white);box-shadow:0 5px 18px #1739570a;overflow-wrap:anywhere}
    .hero{padding:19px;border-color:#b9deed;background:linear-gradient(145deg,#eaf7fd 0,#fff 70%)}
    h1,h2,h3,p{margin:0}h1{color:var(--navy);font-size:23px;line-height:1.3}h2{color:var(--navy);font-size:18px;line-height:1.35}h3{color:var(--navy);font-size:15px}
    .eyebrow{margin-bottom:5px;color:var(--blue);font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
    .sub{margin-top:5px;color:var(--muted);font-size:13px;line-height:1.6}
    .between{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    /* 제목이 길면 옆 버튼이 눌려 "닫 / 기"로 쪼개졌다 — 버튼은 줄이지 않는다 */
    .between>h2{min-width:0}
    .between>.toolbtn,.between>.btn{flex:0 0 auto;white-space:nowrap}
    .tag{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--sky);color:var(--blue);font-size:12px;font-weight:900;line-height:1.2}
    .tag.ok{background:#e7f6f0;color:var(--ok)}.tag.warn{background:#fff4e6;color:var(--warn)}.tag.bad{background:#fff0ef;color:var(--bad)}.tag.muted{background:#eef2f4;color:var(--muted)}
    .tag.c-science{background:#e7f2fb;color:#155d94}.tag.c-society{background:#fdf0e4;color:#8a5a12}.tag.c-history{background:#f4ece1;color:#7a5230}.tag.c-humanities{background:#f3ecf8;color:#6b4390}.tag.c-environment{background:#e7f6ec;color:#20714a}
    .btn{display:block;width:100%;min-height:52px;margin-top:12px;border:0;border-radius:14px;background:var(--blue);color:#fff;font-size:16px;font-weight:900}
    .btn:disabled{opacity:.45;cursor:default}
    .btn.ghost{background:#fff;border:1.5px solid #bfd7e1;color:var(--navy)}
    .btn.navy{background:var(--navy)}
    .btn.sm{min-height:46px;font-size:14px;margin-top:9px}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:15px}
    .stat{min-width:0;padding:11px 4px;border:1px solid #d6ebf4;border-radius:13px;background:#f5fbfe;text-align:center}
    .stat b{display:block;color:var(--navy);font-size:20px;line-height:1.15;font-variant-numeric:tabular-nums}
    button.stat{width:100%;cursor:pointer;font:inherit;transition:background .12s}
    button.stat:active{background:#e7f4fb}
    .stat span{display:block;margin-top:4px;color:var(--muted);font-size:11.5px;font-weight:800;line-height:1.25}
    .pick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:13px}
    .pick{min-height:64px;padding:9px 6px;border:1.5px solid #bfd7e1;border-radius:13px;background:#fff;color:var(--navy);font-weight:850;font-size:13.5px;line-height:1.3}
    .pick[aria-pressed="true"]{border-color:var(--blue);background:var(--sky);box-shadow:inset 0 0 0 1.5px var(--blue)}
    .pick small{display:block;margin-top:3px;font-weight:600;font-size:11px;color:var(--muted)}
    /* 7세~초2 — 아이콘 큰 6칸 */
    .pick-grid.kid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .pick.kid{min-height:108px;padding:14px 8px;font-size:16.5px;line-height:1.35}
    .pick.kid .ico{display:block;margin-bottom:7px;font-size:36px;line-height:1}
    .pick.kid small{margin-top:5px;font-size:12.5px}
    .glist{margin-top:13px}
    .grow{display:flex;width:100%;min-height:56px;align-items:center;justify-content:space-between;gap:10px;padding:10px 4px;border:0;border-top:1px solid var(--line);background:none;text-align:left}
    .grow:first-child{border-top:0}
    .grow .t{min-width:0;flex:1;color:var(--ink);font-size:14.5px;font-weight:700;line-height:1.45}
    .grow .t small{display:block;margin-top:3px;color:var(--muted);font-size:12px;font-weight:600}
    .grow .go{flex:0 0 auto;color:var(--blue);font-size:18px;font-weight:900}
    .empty{padding:22px 8px;color:var(--muted);text-align:center;font-size:13px;line-height:1.6}
    nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
    .tabin{display:grid;max-width:560px;margin:auto;grid-template-columns:repeat(4,1fr)}
    .tab{min-height:56px;border:0;background:none;color:var(--muted);font-size:12px;font-weight:850;display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center}
    .tab b{font-size:17px;line-height:1}
    .tab[aria-current="true"]{color:var(--blue)}
    /* reader */
    .rd-tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
    .toolbtn{min-height:40px;padding:6px 12px;border:1.5px solid #bfd7e1;border-radius:999px;background:#fff;color:var(--navy);font-size:12.5px;font-weight:850}
    .toolbtn[aria-pressed="true"]{border-color:var(--blue);background:var(--sky)}
    .rd-body{margin-top:14px}
    .para{margin:0 0 16px;font-size:16.5px;line-height:1.95;color:#22303d}
    .lv-L2 .para{font-size:17.5px}
    .lv-L1 .para{font-size:19.5px;line-height:2}
    .chunked .seg:not(:last-child)::after{content:"∕";color:var(--coral);opacity:.95;font-weight:900;font-size:.85em;padding:0 2px}
    .para.hl{background:#fff9e8;border-radius:8px;box-shadow:0 0 0 6px #fff9e8}
    .vw{display:inline;padding:0;border:0;background:none;color:inherit;font:inherit;border-bottom:2px dotted var(--blue);cursor:pointer}
    .sheet{position:fixed;left:0;right:0;bottom:0;z-index:8;transform:translateY(105%);transition:transform .18s ease;padding:0 10px calc(10px + env(safe-area-inset-bottom))}
    .sheet.open{transform:none}
    .sheet-in{max-width:560px;margin:auto;padding:16px 17px;border:1px solid #b9deed;border-radius:18px;background:#fff;box-shadow:0 -8px 30px #17395726}
    .sheet-w{color:var(--navy);font-size:19px;font-weight:900}
    .hanja{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
    .hanja span{padding:5px 9px;border-radius:9px;background:#f4ece1;color:#7a5230;font-size:13px;font-weight:800}
    .sheet-e{margin-top:9px;font-size:14.5px;line-height:1.65}
    .sheet-s{margin-top:8px;color:var(--ok);font-size:12px;font-weight:800}
    .src{margin-top:14px;padding:12px 13px;border:1px dashed #bfd7e1;border-radius:12px;background:#f8fcfe;font-size:12.5px;color:var(--muted);line-height:1.6}
    .src a{color:var(--blue);font-weight:800;text-decoration:none}
    .evalrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
    .evalbtn{min-height:52px;padding:8px;border:1.5px solid #bfd7e1;border-radius:13px;background:#fff;color:var(--navy);font-weight:850;font-size:13px}
    .evalbtn[aria-pressed="true"]{border-color:var(--blue);background:var(--sky)}
    /* quiz */
    .qnum{color:var(--muted);font-size:12px;font-weight:900;letter-spacing:.05em}
    .qtext{margin-top:7px;font-size:16.5px;font-weight:800;color:var(--navy);line-height:1.55}
    .choices{display:grid;gap:8px;margin-top:13px}
    .choice{min-height:50px;padding:12px 14px;border:1.5px solid #bfd7e1;border-radius:13px;background:#fff;text-align:left;font-size:14.5px;line-height:1.5;color:var(--ink)}
    .choice.correct{border-color:var(--ok);background:#e7f6f0;font-weight:800}
    .choice.wrong{border-color:#e0a9a1;background:#fff0ef}
    .choice:disabled{cursor:default;opacity:.92}
    .explain{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--sky);font-size:13.5px;line-height:1.65}
    .qrev .qtext{font-size:15px}
    .explain b{color:var(--navy)}
    .streak-flame{font-size:15px;color:var(--coral);font-weight:900}
    .bar{height:10px;border-radius:999px;background:#e4edf1;overflow:hidden;margin-top:5px}
    .bar i{display:block;height:100%;border-radius:999px;background:var(--blue)}
    .dist{margin-top:10px}
    .dist .l{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:700;margin-top:9px}
    .days7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
    .day7{display:grid;place-items:center;gap:3px;font-size:10.5px;color:var(--muted);font-weight:800}
    .day7 i{width:26px;height:26px;border-radius:999px;background:#e4edf1}
    .day7 i.on{background:var(--ok)}
    .note{margin-top:10px;padding:10px 12px;border-radius:11px;background:#fff4e6;color:#7a4308;font-size:12.5px;line-height:1.6}
    .vlist .grow .t b{font-size:15.5px;color:var(--navy)}
    /* 어휘장 한 줄 — 뜻은 늘 보이고, 누르면 아래로 편집칸이 열린다 */
    .vrow{border-top:1px solid var(--line)}
    .vrow:first-child{border-top:0}
    .vrow .grow{border-top:0}
    .vedit{padding:2px 4px 14px}
    .vedit textarea{width:100%;min-height:64px;margin:6px 0 10px;padding:10px 12px;border:1px solid var(--line);
      border-radius:10px;font:inherit;font-size:14.5px;line-height:1.6;color:var(--ink);resize:vertical}
    .vedit textarea:focus{outline:2px solid var(--blue);outline-offset:1px}
    .lv-L1 .vedit textarea{font-size:16.5px}
    textarea{width:100%;min-height:64px;margin-top:10px;padding:11px;border:1.5px solid #bfd7e1;border-radius:12px;font:inherit;font-size:14px;resize:vertical}
    select{width:100%;min-height:48px;margin-top:8px;padding:0 12px;border:1.5px solid #bfd7e1;border-radius:12px;background:#fff;font:inherit;font-size:15px;font-weight:700;color:var(--navy)}
    /* ── v1.1 피그마 시안 반영 ── */
    .greet{display:flex;align-items:center;gap:10px;margin:2px 2px 13px}
    .greet .g-l{flex:1;min-width:0}
    .g-date{color:var(--muted);font-size:12px;font-weight:600}
    .greet h1{font-size:22px}
    .streak-chip{flex:0 0 auto;display:flex;gap:5px;align-items:center;padding:7px 12px;border-radius:999px;background:#fbeae6;color:var(--coral);font-size:13px;font-weight:900}
    .hero2{padding:0;overflow:hidden;border-color:#b9deed}
    .hero2 .band{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 18px;font-size:13px;font-weight:900}
    .hero2 .band small{font-size:12px;font-weight:600;color:var(--muted)}
    .band.c-science{background:#e7f2fb;color:#155d94}.band.c-society{background:#fdf0e4;color:#8a5a12}.band.c-history{background:#f4ece1;color:#7a5230}.band.c-humanities{background:#f3ecf8;color:#6b4390}.band.c-environment{background:#e7f6ec;color:#20714a}
    .hero2 .hbody{padding:15px 18px 18px}
    .weekhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
    .weekdots{display:flex;justify-content:space-between;margin-top:12px}
    .wd{display:grid;justify-items:center;gap:5px;font-size:10.5px;color:var(--muted);font-weight:700}
    .wd i{width:30px;height:30px;border-radius:999px;background:#e4edf1}
    .wd i.done{background:var(--ok)}
    .wd.today i{background:#fff;box-shadow:inset 0 0 0 2.5px var(--blue)}
    .wd.today{color:var(--blue);font-weight:900}
    .rowdot{width:9px;height:9px;border-radius:999px;flex:0 0 auto;margin-top:6px}
    .dot-science{background:#155d94}.dot-society{background:#8a5a12}.dot-history{background:#7a5230}.dot-humanities{background:#6b4390}.dot-environment{background:#20714a}
    .progress-top{position:fixed;top:0;left:0;right:0;height:4px;background:var(--line);z-index:7}
    .progress-top i{display:block;height:100%;width:0;background:var(--blue)}
    .rd-body .para{font-family:var(--rdf);font-size:var(--rdfs);line-height:var(--rdlh)}
    .rd-body .para-en{font-family:var(--rdf);font-size:calc(var(--rdfs) - 1px);line-height:var(--rdlh)}
    .typebox{margin-top:10px;padding:13px 14px;border:1px solid #d6ebf4;border-radius:14px;background:#f8fcfe}
    .trow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .trow+.trow{margin-top:11px}
    .tlab{flex:0 0 auto;color:var(--navy);font-size:13px;font-weight:900}
    .stepper{display:inline-flex;align-items:center;gap:4px;border:1.5px solid #bfd7e1;border-radius:999px;background:#fff;padding:2px}
    .stepper button{min-width:34px;min-height:34px;border:0;border-radius:999px;background:none;color:var(--navy);font-size:16px;font-weight:900}
    .stepper button:disabled{color:#c3d4dc}
    .stepper b{min-width:44px;text-align:center;color:var(--navy);font-size:14px;font-variant-numeric:tabular-nums}
    .qhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
    .qbar{height:6px;border-radius:999px;background:#e4edf1;overflow:hidden;margin-top:9px}
    .qbar i{display:block;height:100%;background:var(--blue);border-radius:999px}
    .choice{display:flex;gap:11px;align-items:center}
    .cnum{flex:0 0 26px;width:26px;height:26px;border-radius:999px;background:var(--sky);color:var(--blue);font-weight:900;font-size:12.5px;display:grid;place-items:center}
    .choice.correct .cnum{background:var(--ok);color:#fff}
    .choice.wrong .cnum{background:var(--bad);color:#fff}
    .choice.picked{border-color:var(--blue);background:var(--sky);font-weight:800}
    .choice.picked .cnum{background:var(--blue);color:#fff}
    /* 7세~초2 — 문제·선지 글씨 한 단계 크게 */
    .lv-L1 .qtext{font-size:19.5px;line-height:1.6}
    .lv-L1 .choice{min-height:60px;padding:14px 15px;font-size:17px;line-height:1.55}
    .lv-L1 .cnum{flex:0 0 30px;width:30px;height:30px;font-size:14.5px}
    .lv-L1 .explain{font-size:15px;line-height:1.7}
    .lv-L1 .qrev .qtext{font-size:17px}
    .lv-L1 .odot{font-size:14.5px}
    .omr{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;justify-content:center}
    .odot{min-width:34px;height:34px;padding:0 4px;border:1.5px solid #cfe0e8;border-radius:10px;background:#fff;color:var(--muted);font-size:13px;font-weight:900}
    .odot.done{background:var(--sky);border-color:var(--blue);color:var(--navy)}
    .odot.cur{box-shadow:0 0 0 2.5px var(--blue)}
    .odot.flag{border-color:var(--coral);color:var(--coral)}
    .odot.ok{background:#e7f6f0;border-color:#a9d9c6;color:var(--ok)}
    .odot.no{background:#fff0ef;border-color:#e0a9a1;color:var(--bad)}
    .qrev{margin-top:12px;padding:13px 15px;border:1px solid var(--line);border-left-width:4px;border-radius:12px;background:#fff}
    .qrev.ok{border-left-color:var(--ok)}
    .qrev.no{border-left-color:var(--bad)}
    .evchip{display:inline-block;margin-top:9px;padding:7px 12px;border-radius:999px;background:#fff;color:var(--blue);font-size:12px;font-weight:800}
    /* 근거 문단 다시 보기 — 오답 노트·문항별 해설에서 지문을 펼칠 때 */
    .evbox{margin-top:10px;padding:12px 14px;border-radius:12px;background:#fbfdfe;border:1px solid #dceef5;max-height:52vh;overflow-y:auto}
    .evpara{position:relative;margin:0 0 12px;padding-left:26px;font-size:15.5px;line-height:1.9;color:#22303d}
    .evpara:last-child{margin-bottom:0}
    .evpara.hit{background:#fff8e1;border-radius:8px;padding:8px 10px 8px 26px;margin-left:-4px}
    .evno{position:absolute;left:0;top:2px;width:19px;height:19px;border-radius:6px;background:var(--sky);color:var(--blue);
      font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
    .evpara.hit .evno{background:var(--coral);color:#fff}
    .lv-L1 .evpara{font-size:17.5px;line-height:2}
    .lv-L2 .evpara{font-size:16.5px}
    .ringwrap{display:flex;gap:18px;align-items:center;margin-top:6px}
    .ring{position:relative;flex:0 0 96px;width:96px;height:96px}
    .ring .rc{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
    .ring .rc b{display:block;color:var(--navy);font-size:19px;line-height:1.1}
    .ring .rc span{display:block;color:var(--muted);font-size:10px;font-weight:700}
    .grade-lbl{margin:12px 0 0;color:var(--muted);font-size:12.5px;font-weight:900}
    .obdots{display:flex;gap:7px;margin-bottom:9px}
    .obdots i{width:9px;height:9px;border-radius:999px;background:var(--line)}
    .obdots i.on{width:26px;background:var(--blue)}
    /* ── v1.2 훈련·탐구·영어 대역 ── */
    .para-en{margin:-8px 0 18px;padding:12px 14px;border-left:3px solid var(--blue);border-radius:0 10px 10px 0;background:#f5fbfe;color:#1e2f3d;font-size:16px;line-height:1.85;font-weight:450}
    .en-only .para{display:none}
    .en-only .para-en{margin:0 0 18px;padding:0;border-left:0;background:transparent;font-size:17px;line-height:1.9;color:#22303d}
    .vw-en{border-bottom-color:var(--ok)}
    .seg-ctl{display:inline-flex;border:1.5px solid #bfd7e1;border-radius:999px;overflow:hidden;background:#fff}
    .seg-ctl button{min-height:40px;padding:6px 13px;border:0;background:none;color:var(--muted);font-size:12.5px;font-weight:850}
    .seg-ctl button+button{border-left:1.5px solid #e2ebef}

<script src="./voice.js"></script>
<script>
'use strict';
/* ───────────────────────── 상수 ───────────────────────── */
const KEY='wbr.v1';
const GRADES=[['k7','7세'],['e1','초1'],['e2','초2'],['e3','초3'],['e4','초4'],['e5','초5'],['e6','초6'],['m1','중1'],['m2','중2'],['m3','중3'],['h1','고1'],['h2','고2'],['h3','고3']];
const LEVEL_OF={k7:'L1',e1:'L1',e2:'L1',e3:'L2',e4:'L2',e5:'L2',e6:'L2',m1:'L3',m2:'L3',m3:'L3',h1:'L4',h2:'L4',h3:'L4'};
const LEVELS=['L1','L2','L3','L4'];
/* 학부모가 한눈에 알아보도록 '레벨' 대신 학년 범위로 부른다 */
const LEVEL_LABEL={L1:'7세~초2',L2:'초3~6',L3:'중1~3',L4:'고1~3'};
const LEVEL_NOTE={L1:'짧은 글로 시작',L2:'생각을 넓히는 글',L3:'교과와 이어지는 글',L4:'수능형 비문학'};
const INTERESTS=[
  ['eng','공학·기계','로봇, 자동차, 우주'],['it','IT·소프트웨어','코딩, 인공지능, 게임'],
  ['med','의학·보건','의사, 간호, 건강'],['bio','생명과학','동물, 식물, 유전자'],
  ['nat','자연·수학','과학 원리, 수학'],['biz','경영·경제','회사, 돈의 흐름'],
  ['media','미디어·콘텐츠','방송, 웹툰, 영상'],['law','법·행정','법, 정치, 공무원'],
  ['edu','교육','가르치는 일'],['art','예술·디자인','그림, 음악, 디자인'],
  ['env','환경·에너지','기후, 자연 보호'],['hum','인문·글쓰기','책, 역사, 글']
];
const INTEREST_LABEL=Object.fromEntries(INTERESTS.map(x=>[x[0],x[1]]));
/* 7세~초2는 12개 중 3개 고르기가 버겁다 — 같은 12개 키를 6개 묶음으로 접어
   큰 아이콘으로 보여주고, 최대 2묶음만 고르게 한다 (저장되는 값은 그대로 키). */
const KID_INTERESTS=[
  ['🤖','로봇·컴퓨터','로봇, 자동차, 코딩',['eng','it']],
  ['🚀','우주·자연','별, 지구, 환경',['nat','env']],
  ['🐶','동물·몸','동물, 식물, 병원',['bio','med']],
  ['🎨','그림·음악','그림, 노래, 웹툰',['art','media']],
  ['📚','이야기·학교','책, 옛날이야기, 선생님',['hum','edu']],
  ['🏪','가게·약속','회사, 돈, 규칙',['biz','law']]
];
const KID_INT_MAX=2;
function kidGroupsOn(iv){return KID_INTERESTS.filter(g=>g[3].every(k=>iv.includes(k))).length;}
/* 묶음에 속하지 않는 잔여 키 정리 — 화면에 보이는 것과 저장값을 일치시킨다 */
function kidPrune(iv){
  const keep=new Set();
  KID_INTERESTS.forEach(g=>{if(g[3].every(k=>iv.includes(k)))g[3].forEach(k=>keep.add(k));});
  for(let i=iv.length-1;i>=0;i--)if(!keep.has(iv[i]))iv.splice(i,1);
}
function interestGridHtml(act,iv,lv){
  if(lv!=='L1')return `<div class="pick-grid">${INTERESTS.map(([v,l,d])=>`<button class="pick" data-act="${act}" data-v="${v}" aria-pressed="${iv.includes(v)}">${l}<small>${d}</small></button>`).join('')}</div>`;
  return `<div class="pick-grid kid">${KID_INTERESTS.map(([ic,l,d,keys])=>`<button class="pick kid" data-act="${act}" data-v="${keys.join(',')}" aria-pressed="${keys.every(k=>iv.includes(k))}"><span class="ico" aria-hidden="true">${ic}</span>${l}<small>${d}</small></button>`).join('')}</div>`;
}
/* iv를 제자리에서 토글. keepOne=true면 마지막 1개는 못 지운다(설정 화면). */
function toggleInterest(iv,v,lv,keepOne){
  if(lv==='L1'){
    const g=KID_INTERESTS.find(x=>x[3].join(',')===v);if(!g)return;
    const keys=g[3];
    if(keys.every(k=>iv.includes(k))){
      if(keepOne&&kidGroupsOn(iv)<=1)return;
      keys.forEach(k=>{const i=iv.indexOf(k);if(i>=0)iv.splice(i,1);});
    }else{
      if(kidGroupsOn(iv)>=KID_INT_MAX)return;
      kidPrune(iv);
      keys.forEach(k=>{if(!iv.includes(k))iv.push(k);});
    }
    return;
  }
  const i=iv.indexOf(v);
  if(i>=0){if(!(keepOne&&iv.length<=1))iv.splice(i,1);}
  else if(iv.length<3)iv.push(v);
}
const CATS={science:'과학·기술',society:'사회·경제',history:'역사·문화',humanities:'인문·예술',environment:'환경'};
const EVALS=[['good','잘 이해했어요','ok'],['hard','조금 어려웠어요','warn'],['again','다시 읽고 싶어요','muted']];

/* ───────────────────────── 상태 ───────────────────────── */
let DB=null;
let S=loadState();
let view={name:'boot'};
let sess={}; // 화면 임시 상태 (진단/퀴즈 진행 등)
let deferredPrompt=null; // PWA 설치 프롬프트
const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;

function normalizeState(s){
  s.prefs=s.prefs||{};
  s.prefs.chunk=s.prefs.chunk||{L2:true,L3:false,L4:false};
  s.prefs.en=s.prefs.en||{L2:0,L3:0,L4:0};
  if(s.prefs.en.L2==null)s.prefs.en.L2=0;
  ['L2','L3','L4'].forEach(l=>{if(typeof s.prefs.en[l]==='boolean')s.prefs.en[l]=s.prefs.en[l]?1:0;});
  s.train=s.train||[];
  s.redbook=s.redbook||[];
  s.reports=s.reports||[];
  if(!('lab' in s))s.lab=null;
  s.prefs.auto=s.prefs.auto||{speed:2,scope:0};
  s.prefs.type=s.prefs.type||{font:'sans',fs:null,lh:null};
  /* 줄 간격 기본값(1.9)이 저장돼 있던 기존 사용자는 레벨 기본값을 따르도록 되돌린다 */
  if(s.prefs.type.lh===1.9&&!s.prefs.type.lhSet)s.prefs.type.lh=null;
  /* 속도 단계가 4→5로 늘어, 예전에 저장된 값을 같은 체감 속도로 옮긴다 */
  if(!s.prefs.auto.v5){s.prefs.auto.speed=[1,2,3,4][s.prefs.auto.speed]!=null?[1,2,3,4][s.prefs.auto.speed]:2;s.prefs.auto.v5=true;}
  s.mychunks=s.mychunks||{};
  s.speed=s.speed||[];
  s.wrong=s.wrong||[];
  if(!('lvhint' in s))s.lvhint=null;
  (s.vocab||[]).forEach(v=>{if(v.box==null)v.box=0;if(!v.last)v.last=v.addedAt||dkey();});
  return s;
}
function loadState(){
  try{const raw=localStorage.getItem(KEY);if(raw){const s=JSON.parse(raw);if(s&&s.v===1)return normalizeState(s);}}catch(e){}
  return normalizeState({v:1,profile:null,prefs:{chunk:{L2:true,L3:false,L4:false}},readings:{},scraps:{},vocab:[],quiz:{},days:{},daily:{},diag:null});
}
function save(){S.ts=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}schedulePush();}

/* ───────────────────────── 서버 동기화 (선생님 연동) ───────────────────────── */
const SYNC={avail:false,auth:null,timer:null,busy:false};
try{SYNC.auth=JSON.parse(localStorage.getItem('wbr.auth')||'null');}catch(e){}
function syncSaveAuth(){try{if(SYNC.auth)localStorage.setItem('wbr.auth',JSON.stringify(SYNC.auth));else localStorage.removeItem('wbr.auth');}catch(e){}}
async function syncApi(path,opt){
  const r=await fetch('/api'+path,Object.assign({headers:{'Content-Type':'application/json',...(SYNC.auth&&SYNC.auth.token?{Authorization:'Bearer '+SYNC.auth.token}:{})}},opt||{}));
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&SYNC.auth){SYNC.auth=null;syncSaveAuth();}
  if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
  return j;
}
async function syncHealth(){
  try{const r=await fetch('/api/health',{cache:'no-store'});const j=await r.json();SYNC.avail=!!(j&&j.ok);}catch(e){SYNC.avail=false;}
}
function activityScore(s){
  if(!s)return 0;
  return Object.keys(s.readings||{}).length*3+(s.reports||[]).length*5+(s.vocab||[]).length+(s.train||[]).length+(s.redbook||[]).length+Object.keys(s.scraps||{}).length;
}
async function syncPull(login){
  if(!SYNC.avail||!SYNC.auth)return;
  try{
    const j=await syncApi('/pull');
    const adopt=j.state&&(
      !S.profile
      ||(login&&activityScore(j.state)>activityScore(S))
      ||(!login&&(j.state.ts||0)>(S.ts||0)&&activityScore(j.state)>=activityScore(S))
    );
    if(adopt){S=normalizeState(j.state);save();}
    if(j.level&&S.profile&&S.profile.level!==j.level&&LEVELS.includes(j.level)){
      S.profile.level=j.level;save();announce('선생님이 읽기 과정을 '+LEVEL_LABEL[j.level]+'로 조정했어요');
    }
    SYNC.auth.lastSync=Date.now();syncSaveAuth();
  }catch(e){}
}
async function syncPush(){
  if(!SYNC.avail||!SYNC.auth||SYNC.busy)return;
  SYNC.busy=true;
  try{await syncApi('/state',{method:'PUT',body:JSON.stringify({state:S})});SYNC.auth.lastSync=Date.now();syncSaveAuth();}
  catch(e){}
  SYNC.busy=false;
}
function schedulePush(){
  if(!SYNC.avail||!SYNC.auth)return;
  if(SYNC.timer)clearTimeout(SYNC.timer);
  SYNC.timer=setTimeout(()=>{SYNC.timer=null;syncPush();},2500);
}

/* ───────────────────────── 유틸 ───────────────────────── */
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dkey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(k,n){const d=new Date(k+'T12:00:00');d.setDate(d.getDate()+n);return dkey(d);}
function hash(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}return Math.abs(h);}
let TOAST_T=null;
/* 안내는 눈에도 보여야 한다 — 예전에는 화면 낭독기 전용이라 학생이 실패를 알 수 없었다 */
function announce(t){
  $('#live').textContent=t;
  const el=$('#toast');if(!el)return;
  el.textContent=t;el.classList.add('show');
  if(TOAST_T)clearTimeout(TOAST_T);
  TOAST_T=setTimeout(()=>el.classList.remove('show'),3400);
}
function paraText(p){return p.join('');}
function levelBody(a,lv){return a.levels&&a.levels[lv];}
function myLevel(){return S.profile?S.profile.level:'L3';}
function published(){return DB.articles.filter(a=>a.status==='published'&&levelBody(a,myLevel()));}

/* 지문 데이터는 학년대별로 쪼개 받는다.
   예전에는 켤 때마다 전체(1MB)를 캐시 없이 받았다. 주 4~5편 × 4학년대로 쌓이면
   1년 뒤 7MB가 되는데, 학생에게 필요한 것은 자기 학년대 하나뿐이다.
   version.json(수십 바이트)만 캐시 없이 받고, 본체는 ?v= 를 붙여 캐시한다. */
let DATA_VER=null, DB_LEVEL=null, HANJA=null;
async function fetchVersion(){
  try{
    const r=await fetch('./version.json',{cache:'no-store'});
    if(r.ok){const j=await r.json();if(j&&j.v)return String(j.v);}
  }catch(e){}
  return String(Date.now());          /* 버전을 못 받으면 캐시를 쓰지 않는다 */
}
async function loadLevel(lv){
  const want=LEVELS.includes(lv)?lv:'L3';
  if(DB&&DB_LEVEL===want)return DB;
  if(!DATA_VER)DATA_VER=await fetchVersion();
  const r=await fetch('./articles-'+want+'.json?v='+encodeURIComponent(DATA_VER));
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();
  if(!j||!Array.isArray(j.articles)||!j.diagnostics)throw new Error('bad data');
  DB=j;DB_LEVEL=want;
  return DB;
}
/* 한자 카드만 전 학년대 어휘를 훑어야 해서 따로 미리 만들어 둔 파일을 쓴다 */
async function loadHanja(){
  if(HANJA)return HANJA;
  if(!DATA_VER)DATA_VER=await fetchVersion();
  const r=await fetch('./hanja.json?v='+encodeURIComponent(DATA_VER));
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();
  HANJA=Array.isArray(j.families)?j.families:[];
  return HANJA;
}

/* ───────────────────────── 추천 로직 ───────────────────────── */
function lastCats(n){
  const rs=Object.entries(S.readings).sort((a,b)=>b[1].date<a[1].date?-1:1).slice(0,n);
  return rs.map(([id])=>{const a=DB.articles.find(x=>x.id===id);return a?a.category:null;}).filter(Boolean);
}
function score(a,today){
  let sc=0;
  const iv=S.profile?S.profile.interests:[];
  if(a.careers.some(c=>iv.includes(c)))sc+=2;
  if(!lastCats(2).includes(a.category))sc+=1;
  if(a.issue)sc+=2; // 시사·사회 이슈 지문 우선 노출
  return sc*1000+hash(today+a.id)%1000;
}
function pickDaily(){
  const today=dkey();
  if(S.daily[today]&&DB.articles.find(a=>a.id===S.daily[today]))return S.daily[today];
  const pool=published();
  const unread=pool.filter(a=>!S.readings[a.id]);
  const cands=(unread.length?unread:pool).slice().sort((a,b)=>score(b,today)-score(a,today));
  if(!cands.length)return null;
  S.daily[today]=cands[0].id;save();
  return cands[0].id;
}
function recommend(excludeId){
  const today=dkey();
  const iv=S.profile?S.profile.interests:[];
  const pool=published().filter(a=>a.id!==excludeId&&!S.readings[a.id]);
  const sorted=pool.slice().sort((a,b)=>score(b,today)-score(a,today));
  const match=sorted.filter(a=>a.careers.some(c=>iv.includes(c)));
  const other=sorted.filter(a=>!a.careers.some(c=>iv.includes(c)));
  const out=[...match.slice(0,2),...other.slice(0,1)];
  for(const a of sorted){if(out.length>=3)break;if(!out.includes(a))out.push(a);}
  return out.slice(0,3);
}

/* ───────────────────────── 레벨 자동 제안 ───────────────────────── */
function levelSuggest(){
  const lv=myLevel();
  const recs=Object.entries(S.quiz).filter(([k])=>!k.endsWith('#c')).map(([,v])=>v)
    .sort((a,b)=>a.date<b.date?-1:1).slice(-5);
  const qt=recs.reduce((s,q)=>s+q.total,0),qc=recs.reduce((s,q)=>s+q.correct,0);
  if(recs.length<3||qt<12)return null;                      // 표본 부족
  if(S.lvhint&&daysSince(S.lvhint)<14)return null;          // 최근에 제안함
  const acc=qc/qt*100;
  if(acc>=85&&lv!=='L4')return {dir:'up',acc:Math.round(acc),to:LEVELS[LEVELS.indexOf(lv)+1]};
  if(acc<60&&lv!=='L2')return {dir:'down',acc:Math.round(acc),to:LEVELS[LEVELS.indexOf(lv)-1]};
  return null;
}

/* ───────────────────────── 스트릭 ───────────────────────── */
function streak(){
  let d=dkey();let n=0;
  if(!S.days[d])d=addDays(d,-1);
  while(S.days[d]){n++;d=addDays(d,-1);}
  return n;
}
function weekCount(){
  let n=0;for(let i=0;i<7;i++){if(S.days[addDays(dkey(),-i)])n++;}
  return n;
}

/* 카드를 펼치는 것처럼 '제자리 갱신'일 때는 보던 위치를 지킨다.
   예전에는 무엇을 누르든 맨 위로 튀어서, 방금 누른 항목을 다시 찾아 내려가야 했다. */
function render(opt){
  const keep=!!(opt&&opt.keep);
  const y=window.scrollY;
  const app=$('#app');
  const fns={onboard:vOnboard,home:vHome,reader:vReader,quiz:vQuiz,library:vLibrary,report:vReport,settings:vSettings,train:vTrain,lab:vLab,rb:vRedbookForm};
  const f=fns[view.name]||vHome;
  app.innerHTML=f();
  app.removeAttribute('aria-busy');
  /* 요약(rb)도 문제 풀이처럼 탭바를 감춘다 — 탭을 누르면 go() 가 sess 를 비워
     쓰던 초안이 아무 말 없이 사라진다. 나가려면 「1차만 저장」이나 「취소」로. */
  $('#tabbar').hidden=!S.profile||['reader','quiz','onboard','rb'].includes(view.name);
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-current',t.dataset.v===view.name?'true':'false'));
  if(sess.auto&&view.name==='reader'){const rc=document.getElementById('readerCard');if(rc)rc.classList.add('autoread');}
  if(view.name==='report')loadLeague();
  if(view.name==='reader'||view.name==='quiz'){
    $('#headActions').innerHTML='<button class="headbtn" data-act="nav" data-v="home">홈으로</button>';
  }else if(view.name==='settings'){
    $('#headActions').innerHTML='<button class="headbtn" data-act="nav" data-v="home">홈으로</button>';
  }else if(S.profile){
    $('#headActions').innerHTML='<button class="headbtn" data-act="nav" data-v="settings" aria-label="설정">⚙</button>';
  }else{$('#headActions').innerHTML='';}
  if(keep)window.scrollTo(0,y);else window.scrollTo(0,0);
}
/* 안드로이드 뒤로 가기 — 기록을 남기지 않으면 뒤로 가기가 곧 앱 종료다.
   글을 읽는 중이나 퀴즈 중에 눌러도 그대로 닫혀 버린다. 화면마다 기록을
   하나씩 남겨 앞 화면으로 돌아가게 하고, 기록이 바닥나면 그때 닫히게 한다.
   extra 에는 글 id 같은 값만 들어가므로 기록에 그대로 담아도 된다. */
function navSet(v,replace){try{
  var cur=history.state;
  if(replace||(cur&&cur.wb&&cur.wb.name===v.name&&cur.wb.id===v.id))history.replaceState({wb:v},'');
  else history.pushState({wb:v},'');
}catch(e){/* 기록을 못 써도 앱은 그대로 돌아간다 */}}
function go(name,extra,fromPop){if(sess.auto)autoStop(false);aloudClose();view=Object.assign({name},extra||{});sess={};if(!fromPop)navSet(view);render();}
window.addEventListener('popstate',function(e){
  var st=e.state&&e.state.wb;
  if(st&&st.name)go(st.name,st,true);
  /* 맞는 기록이 없으면 브라우저가 앱을 닫도록 그냥 둔다 */
});

/* 선생님 연동 — 코드는 '요청'만 만들고, 강사가 승인해야 열린다.
   코드가 유일한 자격 증명이라 그것만으로 열어 주면 친구 코드로도 들어갈 수 있었다. */
let PEND_T=null;
function pendStop(){if(PEND_T){clearInterval(PEND_T);PEND_T=null;}}
function pendStart(){pendStop();PEND_T=setInterval(()=>syncPoll(false),4000);}
function deviceLabel(){
  const u=navigator.userAgent||'';
  return /iPad/.test(u)?'아이패드':/iPhone/.test(u)?'아이폰':/Android/.test(u)?'안드로이드':/Mac/.test(u)?'맥':/Windows/.test(u)?'윈도우':'기기';
}
function syncRequest(code){
  const c=String(code||'').trim();
  if(!c){sess.syncErr='학생 코드를 입력해 주세요.';render();return;}
  sess.syncCode=c;sess.syncErr=null;
  syncApi('/login',{method:'POST',body:JSON.stringify({code:c,device:deviceLabel()})})
    .then(j=>{
      if(j.token){return finishSync(j);}                   // 옛 서버 호환
      sess.pend={nonce:j.nonce,name:j.name};render();
      announce('선생님 승인을 기다리는 중이에요');
      pendStart();
    })
    .catch(e=>{sess.syncErr=e.message;sess.pend=null;pendStop();render();});
}
function finishSync(j){
  SYNC.auth={code:j.student.code,name:j.student.name,token:j.token,lastSync:null};
  syncSaveAuth();sess.pend=null;sess.syncErr=null;sess.syncCode=null;pendStop();
  return syncPull(true).then(()=>syncPush()).then(()=>{render();announce('선생님 연동 완료');});
}
function syncPoll(loud){
  if(!sess.pend)return;
  syncApi('/login/status?n='+encodeURIComponent(sess.pend.nonce))
    .then(j=>{
      if(j.token)return finishSync(j);
      if(j.denied){sess.pend=null;pendStop();sess.syncErr='연동이 거절됐어요. 선생님께 확인해 주세요.';render();return;}
      if(loud)announce('아직 승인 전이에요');
    })
    .catch(e=>{sess.pend=null;pendStop();sess.syncErr=e.message;render();});
}
/* QR로 들어오면 ?c=코드 — 학생이 코드를 손으로 칠 필요가 없다 */
function consumeCodeLink(){
  let c=null;
  try{c=new URLSearchParams(location.search).get('c');}catch(e){}
  if(c)try{history.replaceState(null,'',location.pathname);}catch(e){}   // 주소창에 코드를 남기지 않는다
  return c;
}

/* ── 읽기 글자 설정 ──
   휴대폰·태블릿에서 실제로 효과가 있는 것만 남겼다.
   글자체는 명조/고딕 둘만 — 굴림은 iOS에 없어 고딕으로 되돌아가고, 화면에서 획이 뭉개져 도움이 안 된다.
   크기와 줄 간격은 작은 화면에서 체감이 가장 크고, 끊어 읽기(∕)·영어 대역과 겹칠 때 특히 중요하다. */
const TYPE_FONTS={

function typePanelHtml(tp){

/* ───────────────────────── 읽기 화면 ───────────────────────── */
function segsFromBounds(text,bounds){
  const words=text.split(/\s+/).filter(Boolean);
  const bs=new Set(bounds||[]);
  const out=[];let cur=[];
  words.forEach((w,i)=>{cur.push(w);
    if(bs.has(i)&&i<words.length-1){out.push(cur.join(' ')+' ');cur=[];}});
  if(cur.length)out.push(cur.join(' '));
  return out.length?out:[text];
}
function myChunkKey(a,lv){return a.id+'|'+lv;}
function vMyChunkEdit(a,b,lv){
  const me=sess.myEdit;
  return `<div class="card lv-${lv}"><p class="eyebrow">✂ 직접 끊기 — 내 의미 단위 만들기</p>
    <h2>${esc(b.title)}</h2>
    <p class="sub" style="margin-top:8px">의미가 나뉘는 곳의 <b>·</b> 를 눌러 <b style="color:var(--coral)">∕</b> 로 바꾸세요. 저장하면 읽기 화면과 자동 읽기가 <b>내가 끊은 단위</b>대로 움직여요.</p>
    ${b.paragraphs.map((p,pi)=>{
      const words=paraText(p).split(/\s+/).filter(Boolean);
      let flow='';
      words.forEach((w,i)=>{flow+=`<span class="tok">${esc(w)}</span>`;
        if(i<words.length-1){const on=me.marks[pi].has(i);
          flow+=`<button class="gap" data-act="myedit-gap" data-p="${pi}" data-i="${i}" aria-pressed="${on}">${on?'∕':'·'}</button>`;}});
      return `<p class="sub" style="margin-top:14px;font-weight:800;color:var(--navy)">${pi+1}문단</p><div class="tokenwrap" style="font-size:15.5px">${flow}</div>`;
    }).join('')}
    <button class="btn" data-act="myedit-save">저장 — 내 단위로 읽기</button>
    <button class="btn ghost sm" data-act="myedit-cancel">취소</button></div>`;
}
/* 지문 한 문단을 어휘 밑줄과 함께 그린다 — 독해 화면과 근거 문단 보기가 함께 쓴다.
   한 조각에 어휘가 둘 이상 들어 있어도 전부 밑줄 친다. 예전에는 첫 낱말만 걸고
   멈춰서, 「연대를 못 박아 주는 유물이」처럼 두 낱말이 한 조각에 겹치면
   뒤엣것은 어디에서도 눌리지 않았다. */
function koParaHtml(segSrc,vocab,linked,aid){
  return segSrc.map(seg=>{
    const hits=[];
    for(const vb of (vocab||[])){
      if(linked.has(vb.word))continue;
      const idx=seg.indexOf(vb.word);
      if(idx>=0)hits.push({w:vb.word,i:idx});
    }
    hits.sort((x,y)=>x.i-y.i);
    let html='',pos=0;
    for(const h of hits){
      if(h.i<pos)continue;            /* 앞 낱말과 글자가 겹치면 건너뛴다 */
      linked.add(h.w);
      html+=esc(seg.slice(pos,h.i))+`<button class="vw" data-act="vocab" data-id="${aid}" data-w="${esc(h.w)}">${esc(h.w)}</button>`;
      pos=h.i+h.w.length;
    }
    html+=esc(seg.slice(pos));
    return `<span class="seg">${html}</span>`;
  }).join('');
}

/* ── 근거 문단 다시 보기 ─────────────────────────────────────
   오답 노트와 문항별 해설에는 「근거: 3번째 문단」 칩만 있었다. 가리키는
   문단이 화면 어디에도 없으니, 학생은 왜 틀렸는지 확인하지 못한 채 넘어갔다.
   그렇다고 지문을 늘 펼쳐 두면 오답 노트가 읽고 판단하는 연습이 아니라
   낱말 찾기가 된다 — 문제 화면이 정답을 감추는 이유와 같다.
   그래서 답을 고르기 전에는 접어 두고, 고른 뒤에는 근거 문단을 펼쳐 준다.
   펼친 지문에서도 어휘를 눌러 뜻을 볼 수 있다 — 어휘 때문에 틀리는 일이
   적지 않은데 지금까지는 그걸 확인할 길이 없었다. */
function evidenceHtml(a,b,evIdx,all){
  const linked=new Set();
  const idxs=all?b.paragraphs.map((_,i)=>i):[evIdx];
  const body=idxs.map(i=>{
    const p=b.paragraphs[i];
    if(!p)return '';
    return `<p class="evpara${i===evIdx?' hit':''}"><span class="evno">${i+1}</span>${koParaHtml(p,b.vocab,linked,a.id)}</p>`;
  }).join('');
  return `<div class="evbox">${body}${all?'':`<p class="sub" style="margin:8px 0 0">${evIdx+1}번째 문단만 보여 주고 있어요.</p>`}</div>`;
}

        <button class="toolbtn" data-act="mychunk-edit">✂ 직접 끊기</button>

function completeRead(a,evalv){
  const mins=Math.max(1,Math.round((Date.now()-sess.startAt)/60000));
  const prev=S.readings[a.id];
  /* 읽기 속도 샘플 — 첫 완독만, 비정상 값(너무 빠름/느림)은 제외 */
  if(!prev){
    const b=levelBody(a,myLevel());
    const chars=b?b.paragraphs.reduce((s,p)=>s+paraText(p).length,0):0;
    const secs=sess.readSecs||0;
    if(chars>0&&secs>=20&&secs<=3600){
      const cpm=Math.round(chars/(secs/60));
      if(cpm>=30&&cpm<=1500)S.speed.push({date:dkey(),id:a.id,level:myLevel(),chars,secs,cpm});
    }
  }
  S.readings[a.id]={date:dkey(),level:myLevel(),evalv,minutes:Math.min(mins,60),count:(prev?prev.count:0)+1};
  S.days[dkey()]=true;save();
}

/* ───────────────────────── 퀴즈 ───────────────────────── */
const QTYPE_LABEL={main:'핵심 내용',detail:'세부 정보',vocab:'어휘',infer:'추론',critical:'비판적 사고',apply:'적용'};
function quizCard(questions,q,prefix,title,lv){
  const cur=questions[q.i];
  const total=questions.length;
  const answered=q.picked!=null;
  return `<div class="card ${lv==='L1'?'lv-L1':''}"><div class="qhead"><p class="qnum">문제 ${q.i+1} / ${total}</p>
    ${title?`<p class="qnum" style="font-weight:600">${esc(title)}</p>`:''}</div>
    <div class="qbar"><i style="width:${Math.round(((q.i+(answered?1:0))/total)*100)}%"></i></div>
    <p class="sub" style="margin-top:12px"><span class="tag">${QTYPE_LABEL[cur.type]||'문항'}</span></p>
    <p class="qtext">${esc(cur.q)}</p>
    <div class="choices">${cur.choices.map((c,i)=>{
      let cls='choice';let num=String(i+1);
      if(answered){if(i===cur.answer){cls+=' correct';num='✓';}else if(i===q.picked){cls+=' wrong';num='✕';}}
      return `<button class="${cls}" data-act="${prefix}-pick" data-i="${i}" ${answered?'disabled':''}>
        <span class="cnum">${num}</span><span style="flex:1;text-align:left">${esc(c)}</span></button>`;
    }).join('')}</div>
    ${answered?`<div class="explain"><b>${q.picked===cur.answer?'정답이에요!':'아쉬워요 — 정답은 '+(cur.answer+1)+'번.'}</b> ${esc(cur.explain)}<br>
    <span class="evchip">근거: ${cur.evidencePara+1}번째 문단</span></div>
    <button class="btn" data-act="${prefix}-next">${q.i+1<total?'다음 문제':'결과 보기'}</button>`:''}</div>`;
}
function fmtSecs(ms){const s=Math.max(0,Math.round(ms/1000));return Math.floor(s/60)+'분 '+String(s%60).padStart(2,'0')+'초';}
/* 시험지처럼 — 다 풀고 제출한 뒤 한 번에 채점한다.
   문제마다 정답이 바로 보이면 다음 문제를 풀 때 '답 찾기'가 아니라 '눈치'가 늘어서,
   실제 국어 시험처럼 끝까지 스스로 판단해 보는 연습이 안 된다. */
function vQuiz(){
  const a=DB.articles.find(x=>x.id===view.id);
  const b=levelBody(a,myLevel());
  const q=sess.q||(sess.q={i:0,correct:0,picks:[],flags:{},fin:false,ch:false,t0:Date.now(),warn:false});
  const qs=q.ch?(b.challenge||[]):b.questions;
  const lvc=myLevel()==='L1'?' lv-L1':'';
  if(q.fin){
    const total=qs.length;
    const acc=Math.round(q.correct/total*100);
    let msg='잘했어요! 근거를 찾으며 읽는 습관이 붙고 있어요.';
    if(q.ch){
      msg=acc>=80?'심화까지 완벽해요! 글의 속뜻을 꿰뚫어 보고 있어요.'
        :acc>=50?'심화 문제는 원래 어려워요. 해설의 근거 문단을 다시 보면 확실해져요.'
        :'심화는 어려운 게 정상이에요! 해설을 읽고 내일 다시 도전하면 실력이 확 늘어요.';
    }
    else if(acc===100)msg='완벽해요! 다음에는 한 단계 높은 글에 도전해 볼까요? (레벨 조정은 선생님과 상의해요)';
    else if(acc<50)msg='괜찮아요. 해설의 근거 문단을 다시 읽어 보면 힘이 돼요.';
    const hasCh=!q.ch&&Array.isArray(b.challenge)&&b.challenge.length>0;
    const review=qs.map((cq,i)=>{
      const pick=q.picks[i];const okk=pick===cq.answer;
      return `<div class="qrev ${okk?'ok':'no'}">
        <p class="qnum">${i+1}. <span class="tag">${QTYPE_LABEL[cq.type]||'문항'}</span> ${okk?'<span class="tag ok">정답</span>':'<span class="tag bad">오답</span>'}</p>
        <p class="qtext" style="margin-top:6px">${esc(cq.q)}</p>
        <p class="sub" style="margin-top:6px">내 답: <b>${pick==null?'무응답':(pick+1)+'번 · '+esc(cq.choices[pick])}</b>${okk?'':`<br>정답: <b style="color:var(--ok)">${cq.answer+1}번 · ${esc(cq.choices[cq.answer])}</b>`}</p>
        <div class="explain" style="margin-top:8px">${esc(cq.explain)}<br><span class="evchip">근거: ${cq.evidencePara+1}번째 문단</span></div>
        <button class="toolbtn" data-act="qrev-ev" data-i="${i}" aria-pressed="${!!(q.rev&&q.rev[i])}" style="margin-top:9px">📄 근거 문단 ${q.rev&&q.rev[i]?'접기':'펼치기'}</button>
        ${q.rev&&q.rev[i]?evidenceHtml(a,b,cq.evidencePara,false):''}</div>`;
    }).join('');
    /* 「이 글, 어땠어요?」는 여기 있어야 배울 것이 생긴다. 읽자마자 물으면 그냥
       느낌일 뿐이지만, 정답률 옆에 나란히 놓으면 「익숙한 느낌」과 「실제로 아는 것」이
       얼마나 어긋나는지 스스로 보게 된다. 그 어긋남을 좁히는 것이 공부의 핵심이다. */
    const rd=S.readings[a.id];
    const evc=rd?EVALS.find(e=>e[0]===rd.evalv):null;
    let calib='';
    if(!q.ch&&rd){
      if(!evc){
        calib=`<div class="explain" style="margin-top:14px"><b>풀기 전에 느낀 대로 골라 보세요 — 이 글, 어땠어요?</b>
          <div class="evalrow" style="margin-top:10px">${EVALS.map(([v,l])=>`<button class="evalbtn" data-act="eval" data-v="${v}">${l}</button>`).join('')}</div></div>`;
      }else{
        const felt=evc[0]==='good';const felthard=evc[0]!=='good';
        const note=felt&&acc>=80?'느낌과 결과가 딱 맞았어요. 자기 이해도를 정확히 읽고 있어요 — 이건 큰 무기예요.'
          :felt&&acc<50?'잘 이해했다고 느꼈는데 정답률은 낮았어요. 눈에 익은 것과 아는 것은 다릅니다 — 해설의 근거 문단을 꼭 펼쳐 보세요.'
          :felthard&&acc>=80?'어렵게 느꼈는데 잘 풀었어요! 생각보다 훨씬 잘 읽고 있어요. 자신감을 가져도 됩니다.'
          :felthard&&acc<50?'어렵게 느낀 그대로였어요. 솔직하게 본 것이 실력을 늘리는 첫걸음이에요.'
          :'느낌과 결과가 비슷해요.';
        calib=`<div class="explain" style="margin-top:14px">
          <b>내 느낌 <span class="tag ${evc[2]}">${evc[1]}</span> · 실제 정답률 <span class="tag ${acc>=80?'ok':acc>=50?'warn':'bad'}">${acc}%</span></b><br>${note}</div>`;
      }
    }
    return `<div class="card hero${lvc}"><p class="eyebrow">${q.ch?'심화 문제 결과':'문제 풀이 결과'}</p><h1>${total}문제 중 ${q.correct}개 정답</h1>
      <p class="sub">${msg}${q.t0?` · 걸린 시간 ${fmtSecs((q.tEnd||Date.now())-q.t0)}`:''}</p>
      ${calib}
      <div class="omr" style="margin-top:12px">${qs.map((cq,i)=>`<span class="odot ${q.picks[i]===cq.answer?'ok':'no'}">${i+1}</span>`).join('')}</div>
      ${hasCh?`<button class="btn navy" data-act="quiz-challenge">🔥 심화 문제 도전 (${b.challenge.length}문항)</button>`:''}
      <p class="sub" style="margin-top:14px">이 글의 요약 쓰기는 <b>내일</b> 홈에서 알려 드려요 — 해설을 막 본 지금 쓰면 기억이 아니라 해설을 옮겨 적게 되거든요.</p>
      <button class="btn ghost sm" data-act="rb-new" data-id="${a.id}">✎ 그래도 지금 쓰기</button>
      ${S.scraps[a.id]?'':`<button class="btn ghost sm" data-act="scrap-quick" data-id="${a.id}">이 글 스크랩하기</button>`}
      <button class="btn ${hasCh?'ghost sm':''}" data-act="nav" data-v="home">홈으로</button></div>
      <div class="card${lvc}"><h2>문항별 해설</h2><p class="sub">틀린 문제는 오답 노트에 자동으로 담겼어요.</p>${review}</div>`;
  }
  /* 문제 풀이 화면 — 정답은 알려주지 않는다 */
  const cur=qs[q.i];const total=qs.length;
  const picked=q.picks[q.i];
  const unanswered=qs.map((_,i)=>i).filter(i=>q.picks[i]==null);
  const last=q.i+1>=total;
  return `<div class="card${lvc}"><div class="qhead"><p class="qnum">문제 ${q.i+1} / ${total}</p>
    <p class="qnum" style="font-weight:600">${esc(b.title)}${q.ch?' · 심화':''}</p></div>
    <div class="qbar"><i style="width:${Math.round((qs.filter((_,i)=>q.picks[i]!=null).length/total)*100)}%"></i></div>
    <p class="sub" style="margin-top:12px"><span class="tag">${QTYPE_LABEL[cur.type]||'문항'}</span>
      <button class="toolbtn" data-act="quiz-flag" aria-pressed="${!!q.flags[q.i]}" style="float:right;min-height:34px;padding:4px 11px">${q.flags[q.i]?'★ 표시함':'☆ 나중에 다시'}</button></p>
    <p class="qtext">${esc(cur.q)}</p>
    <div class="choices">${cur.choices.map((c,i)=>`<button class="choice ${picked===i?'picked':''}" data-act="quiz-pick" data-i="${i}">
      <span class="cnum">${i+1}</span><span style="flex:1;text-align:left">${esc(c)}</span></button>`).join('')}</div>
    <div class="omr">${qs.map((_,i)=>`<button class="odot ${q.picks[i]!=null?'done':''} ${i===q.i?'cur':''} ${q.flags[i]?'flag':''}" data-act="quiz-go" data-i="${i}">${i+1}</button>`).join('')}</div>
    <div class="row2" style="margin-top:12px">
      <button class="btn sm ghost" data-act="quiz-move" data-d="-1" style="margin-top:0" ${q.i?'':'disabled'}>‹ 이전</button>
      ${last?`<button class="btn sm" data-act="quiz-submit" style="margin-top:0">제출하기</button>`
            :`<button class="btn sm" data-act="quiz-move" data-d="1" style="margin-top:0">다음 ›</button>`}</div>
    ${q.warn?`<div class="note">아직 답을 고르지 않은 문제가 ${unanswered.length}개 있어요 (${unanswered.map(i=>i+1).join('·')}번). 그래도 제출할까요?
      <div class="row2"><button class="btn sm ghost" data-act="quiz-go" data-i="${unanswered[0]}" style="margin-top:9px">그 문제로 가기</button>
      <button class="btn sm" data-act="quiz-submit" data-force="1" style="margin-top:9px">그대로 제출</button></div></div>`:''}
    ${!last&&unanswered.length===0?`<button class="btn ghost sm" data-act="quiz-submit">다 풀었어요 — 제출하기</button>`:''}
    </div>`;
}

/* ───────────────────────── 서재 ───────────────────────── */
function vLibrary(){
  const tab=view.tab||'reads';
  const tabs=[['reads','완독'],['scraps','스크랩'],['vocab','어휘장']];
  let body='';
  if(tab==='reads'){
    const rs=Object.entries(S.readings).sort((x,y)=>y[1].date<x[1].date?-1:1);
    body=rs.length?rs.map(([id,r])=>{
      const a=DB.articles.find(x=>x.id===id);if(!a)return '';
      const b=levelBody(a,r.level)||levelBody(a,myLevel());
      const ev=EVALS.find(e=>e[0]===r.evalv);
      return `<button class="grow" data-act="read" data-id="${id}"><span class="t">${esc(b.title)}
        <small>${r.date} · <span class="tag c-${a.category}">${CATS[a.category]}</span> ${ev?`<span class="tag ${ev[2]}">${ev[1]}</span>`:''}</small></span><span class="go">›</span></button>`;
    }).join(''):'<div class="empty">아직 완독한 글이 없어요.<br>오늘의 1지문부터 시작해 보세요!</div>';
  }
  if(tab==='scraps'){
    const ss=Object.entries(S.scraps).sort((x,y)=>y[1].date<x[1].date?-1:1);
    body=ss.length?ss.map(([id,s])=>{
      const a=DB.articles.find(x=>x.id===id);if(!a)return '';
      const b=levelBody(a,myLevel());
      return `<button class="grow" data-act="read" data-id="${id}"><span class="t">${esc(b.title)}
        <small>${s.date}${s.note?' · “'+esc(s.note)+'”':''}</small></span><span class="go">›</span></button>`;
    }).join(''):'<div class="empty">스크랩한 글이 없어요.<br>마음에 남는 글을 모아 두면 탐구보고서의 재료가 돼요.</div>';
    body+=`<p class="sub" style="margin-top:10px">스크랩 ${ss.length}편 · 5편이 모이면 탐구 주제를 잡을 수 있어요 (v1 예정)</p>`;
  }
  if(tab==='vocab'){
    const vs=S.vocab.slice().reverse();
    /* 예전에는 「뜻」 단추로 뜻을 폈다 접었다 하게 해 두었는데, `.grow .t small`(0,2,1)이
       `.meaning`(0,1,0)을 눌러 이겨서 뜻이 늘 펼쳐져 있었다. 단추를 눌러도 글자만
       「뜻」↔「−」로 바뀌고 화면은 그대로였으니, 학생 눈에는 고장 난 단추였다.
       뜻이 어차피 한 줄에 들어가니 접었다 펴는 일 자체가 필요 없다 —
       그 자리를 학생이 실제로 하고 싶어 하는 일, 곧 편집에 내준다. */
    body=vs.length?`<div class="vlist">${vs.map((v,i)=>{
      const open=!!sess['vopen'+i];
      const mine=v.mine&&v.mine.trim();
      return `<div class="vrow ${open?'open':''}">
        <button class="grow" data-act="vocab-toggle" data-i="${i}">
          <span class="t">${v.lang==='en'?'<span class="lang-en-tag">EN</span>':''}<b>${esc(v.word)}</b>${v.hanja?` <span class="tag muted">${esc(v.hanja)}</span>`:''}
          <small>${mine?`<span class="tag ok">내 말</span> ${esc(mine)}`:esc(v.easy)}</small></span>
          <span class="go">${open?'−':'✎'}</span></button>
        ${open?`<div class="vedit">
          ${mine?`<p class="sub" style="margin:0 0 8px">원래 뜻: ${esc(v.easy)}</p>`:''}
          <label class="sub" for="vm${i}">뜻을 내 말로 바꿔 써 보세요 — 내 말로 옮겨야 진짜 아는 낱말이 돼요.</label>
          <textarea id="vm${i}" maxlength="120" placeholder="${esc(v.easy)}">${esc(mine||'')}</textarea>
          <div class="row2">
            <button class="btn sm" data-act="vocab-save" data-i="${i}" style="margin-top:0">저장</button>
            <button class="btn sm ghost" data-act="vocab-del" data-i="${i}" style="margin-top:0">어휘장에서 빼기</button>
          </div>
          ${sess.vdel===i?`<div class="note">「${esc(v.word)}」을 어휘장에서 뺄까요? 복습 기록도 함께 지워져요.
            <div class="row2"><button class="btn sm ghost" data-act="vocab-del-no" style="margin-top:9px">그대로 두기</button>
            <button class="btn sm" data-act="vocab-del-yes" data-i="${i}" style="margin-top:9px">빼기</button></div></div>`:''}
        </div>`:''}
      </div>`;}).join('')}</div>`
      :'<div class="empty">모은 어휘가 없어요.<br>글에서 밑줄 단어를 누르면 어휘장에 쌓여요.</div>';
    /* 복습 버튼은 어휘가 없어도 자리를 지킨다 — 사라지면 학생은 기능이 없어진 줄 안다 */
    body+=`<button class="btn sm" data-act="vocab-review" ${vs.length?'':'disabled'}>복습 퀴즈 (${Math.min(5,vs.length)}개)</button>
      ${vs.length?'':'<p class="sub" style="margin-top:6px">글에서 밑줄 단어를 누르면 어휘가 쌓이고, 그때부터 복습할 수 있어요.</p>'}`;
    if(sess.vq){
      const vq=sess.vq;
      if(vq.i>=vq.list.length){
        body=`<div class="card" id="vqCard" style="margin:0 0 12px;border-color:#b3dcc9;background:linear-gradient(145deg,#effaf4 0,#fff 70%)">
          <p class="eyebrow" style="color:var(--ok)">어휘 복습 완료</p>
          <h2 style="font-size:18px">${vq.list.length}개 중 ${vq.ok}개 알았어요</h2>
          <p class="sub">헷갈린 낱말은 훈련 탭 '어휘 복습'에서 알맞은 때에 다시 나와요.</p>
          <div class="row2"><button class="btn sm ghost" data-act="vq-done" style="margin-top:10px">닫기</button>
          <button class="btn sm" data-act="vocab-review" style="margin-top:10px">한 번 더</button></div></div>`+body;
      }else{
        const v=vq.list[vq.i];
        body=`<div class="card" id="vqCard" style="margin:0 0 12px;border-color:#b9deed;background:linear-gradient(145deg,#eaf7fd 0,#fff 70%)">
          <p class="qnum">어휘 복습 ${vq.i+1}/${vq.list.length}</p>
          <p class="qtext" style="font-size:23px;margin-top:10px">${v.lang==='en'?'<span class="lang-en-tag">EN</span>':''}${esc(v.word)}</p>
          ${vq.show?`<div class="explain">${v.hanja?`<b>${esc(v.hanja)}</b><br>`:''}${esc(v.easy)}${v.mine&&v.mine.trim()?`<br><span class="tag ok">내 말</span> ${esc(v.mine)}`:''}</div>
          <div class="row2" style="margin-top:10px"><button class="btn sm ghost" data-act="vq-mark" data-ok="0" style="margin-top:0">헷갈려요</button>
          <button class="btn sm" data-act="vq-mark" data-ok="1" style="margin-top:0">알았어요</button></div>`
          :`<p class="sub">뜻을 떠올린 다음 눌러 확인해요.</p><button class="btn sm" data-act="vq-show">뜻 보기</button>`}
          <button class="btn ghost sm" data-act="vq-done">그만하기</button></div>`+body;
      }
    }
  }
  return `<div class="card"><div class="between"><h2>내 서재</h2></div>
    <div class="rd-tools">${tabs.map(([v,l])=>`<button class="toolbtn" data-act="lib-tab" data-v="${v}" aria-pressed="${tab===v}">${l}</button>`).join('')}</div>
    <div class="glist">${body}</div></div>`;
}

/* ───────────────────────── 리포트 ───────────────────────── */
function vReport(){
  const total=Object.keys(S.readings).length;
  const qs=Object.values(S.quiz);
  const qc=qs.reduce((s,q)=>s+q.correct,0),qt=qs.reduce((s,q)=>s+q.total,0);
  const acc=qt?Math.round(qc/qt*100):null;
  const dist={};Object.keys(CATS).forEach(c=>dist[c]=0);
  Object.keys(S.readings).forEach(id=>{const a=DB.articles.find(x=>x.id===id);if(a)dist[a.category]++;});
  const max=Math.max(1,...Object.values(dist));
  const days=[];for(let i=6;i>=0;i--){const k=addDays(dkey(),-i);days.push([k.slice(8),!!S.days[k]]);}
  /* 링은 '읽은 날 수'(x/7), 타일은 '읽은 글 수' — 같은 숫자를 두 번 보여 주면
     하루에 3편을 읽고도 '이번 주 1'로 읽혀 오해가 생겼다. */
  const wkKeys=new Set(days.map((_,i)=>addDays(dkey(),-(6-i))));
  const weekReads=Object.values(S.readings).filter(r=>wkKeys.has(r.date)).length;
  const ringC=(2*Math.PI*40).toFixed(1);
  /* 읽기 속도 성장 그래프 */
  let speedCard='';
  const sp=S.speed||[];
  if(sp.length>=2){
    const pts=sp.slice(-12);
    const w=300,h=110,pad=8;
    const lo=Math.min(...pts.map(p=>p.cpm)),hi=Math.max(...pts.map(p=>p.cpm));
    const rng=Math.max(1,hi-lo);
    const xy=pts.map((p,i)=>[pad+i*(w-2*pad)/Math.max(1,pts.length-1),h-pad-(p.cpm-lo)*(h-2*pad)/rng]);
    const poly=xy.map(c=>c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
    const avg=arr=>Math.round(arr.reduce((s,p)=>s+p.cpm,0)/arr.length);
    const d=avg(pts.slice(-3))-avg(pts.slice(0,Math.min(3,pts.length)));
    speedCard=`<div class="card"><h2>읽기 속도 성장</h2>
      <p class="sub">완독한 글의 <b>분당 글자 수</b>예요. ${d>0?`처음보다 <b style="color:var(--ok)">+${d}자/분</b> 빨라졌어요!`:d<0?'요즘은 천천히 꼼꼼하게 읽는 중이에요.':'꾸준히 유지하고 있어요.'}</p>
      <svg viewBox="0 0 ${w} ${h}" style="display:block;width:100%;height:auto;margin-top:10px" aria-label="읽기 속도 변화 그래프">
        <polyline points="${poly}" fill="none" stroke="#087ba6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
        ${xy.map((c,i)=>`<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3.2" fill="${i===xy.length-1?'#c9503c':'#087ba6'}"/>`).join('')}
      </svg>
      <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:12px;color:var(--muted);font-weight:700">
        <span>최근 ${pts.length}편</span><span>지금 약 <b style="color:var(--navy)">${pts[pts.length-1].cpm}자/분</b></span></div></div>`;
  }
  return `<div class="card hero"><p class="eyebrow">나의 읽기 리포트</p>
    <div class="ringwrap">
      <span class="ring"><svg width="96" height="96" viewBox="0 0 96 96" aria-hidden="true">
        <circle cx="48" cy="48" r="40" fill="none" stroke="#e4edf1" stroke-width="11"/>
        <circle cx="48" cy="48" r="40" fill="none" stroke="#087ba6" stroke-width="11" stroke-linecap="round" stroke-dasharray="${(2*Math.PI*40*weekCount()/7).toFixed(1)} ${ringC}" transform="rotate(-90 48 48)"/>

/* ───────────────────────── 훈련 ───────────────────────── */
function daysSince(k){const a=new Date(k+'T12:00:00'),b=new Date(dkey()+'T12:00:00');return Math.round((b-a)/86400000);}
function dueVocab(){const iv=[0,1,3,7,14];return S.vocab.filter(v=>daysSince(v.last)>=iv[Math.min(v.box,4)]);}
function hanjaFamilies(){ return HANJA||[]; }
function copyText(t){
  const fb=()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');announce('복사했어요');}catch(e){announce('복사가 안 됐어요');}ta.remove();};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>announce('복사했어요'),fb);}else fb();
}
function pickTrainPara(){
  const reads=Object.entries(S.readings).sort((x,y)=>y[1].date<x[1].date?-1:1);
  for(const [id] of reads){
    const a=DB.articles.find(x=>x.id===id);if(!a)continue;
    const b=levelBody(a,myLevel());if(!b)continue;
    let best=-1,bi=0;
    b.paragraphs.forEach((p,i)=>{const len=p.join('').length;if(p.length>=3&&len>best){best=len;bi=i;}});
    if(best>0)return {articleId:id,paraIdx:bi};
  }
  return null;
}
function modelBoundaries(p){
  const out=new Set();let cum=0;
  for(let i=0;i<p.length;i++){
    cum+=p[i].trim().split(/\s+/).filter(Boolean).length;
    if(i<p.length-1)out.add(cum-1);
  }
  return out;
}
/* 낱말에서 이 한자에 해당하는 음절을 짚어 준다 — '같은 한자 = 같은 소리'가 눈에 들어와야 확장이 된다 */
function hjWordHtml(w,ch){
  const t=String(w.word||'');

  return esc(t.slice(0,i))+'<span class="hl">'+esc(t[i])+'</span>'+esc(t.slice(i+1));
}

function vChunkTrain(){
  const ct=sess.ct;
  const a=DB.articles.find(x=>x.id===ct.articleId);
  const b=levelBody(a,myLevel());
  const p=b.paragraphs[ct.paraIdx];
  const text=p.join('');
  const dots=`<div class="stage-dots">${[1,2,3].map(i=>`<i class="${ct.stage>=i?'on':''}"></i>`).join('')}</div>`;
  const quit=`<button class="btn ghost sm" data-act="ct-quit">그만하기</button>`;
  if(ct.stage===1){
    return `<div class="card chunked ${myLevel()==='L1'?'lv-L1':''}"><p class="eyebrow">끊어 읽기 훈련 1/3 — 따라 읽기</p>${dots}
      <p class="sub" style="margin-top:10px">「${esc(b.title)}」의 한 문단이에요. ∕ 표시에서 살짝 쉬며 의미 덩어리로 읽어 보세요.</p>
      <p class="para" style="margin-top:14px">${p.map(seg=>`<span class="seg">${esc(seg)}</span>`).join('')}</p>
      <button class="btn" data-act="ct-to2">다 읽었어요 — 직접 끊어 볼래요</button>${quit}</div>`;
  }
  if(ct.stage===2){
    const words=text.split(/\s+/).filter(Boolean);
    let flow='';
    words.forEach((w,i)=>{
      flow+=`<span class="tok">${esc(w)}</span>`;
      if(i<words.length-1){
        const on=ct.marks.has(i);
        let cls='gap',sym=on?'∕':'·';
        if(ct.checked){
          const inM=ct.model.has(i);
          if(on&&inM){cls+=' hit';sym='∕';}
          else if(!on&&inM){cls+=' miss';sym='∕';}
          else if(on&&!inM){cls+=' extra';sym='∕';}
        }
        flow+=`<button class="${cls}" data-act="ct-gap" data-i="${i}" aria-pressed="${on}" ${ct.checked?'disabled':''}>${sym}</button>`;
      }
    });
    let result='';
    if(ct.checked){
      result=`<div class="explain" style="margin-top:14px"><b>일치 ${ct.hit} / 모범 ${ct.model.size}${ct.extra?` · 불필요 ${ct.extra}`:''} — ${ct.score}점</b><br>
      <span style="color:var(--ok);font-weight:800">초록 ∕</span> 잘 끊었어요 · <span style="color:var(--bad);font-weight:800">빨강 ∕</span> 여기서도 끊어야 해요${ct.extra?` · <span style="color:var(--warn);font-weight:800">주황 ∕</span> 안 끊어도 돼요`:''}</div>
      <button class="btn" data-act="ct-to3">다음 — 표시 없이 읽기</button>`;
    }else{
      result=`<button class="btn" data-act="ct-check">확인하기</button>`;
    }
    return `<div class="card ${myLevel()==='L1'?'lv-L1':''}"><p class="eyebrow">끊어 읽기 훈련 2/3 — 직접 끊기</p>${dots}
      <p class="sub" style="margin-top:10px">의미가 나뉘는 곳의 <b>·</b> 를 눌러 ∕ 로 바꿔 보세요.</p>
      <div class="tokenwrap">${flow}</div>${result}${quit}</div>`;
  }
  const q=ct.q;
  const answered=ct.picked!=null;
  if(ct.stage===3){
    return `<div class="card ${myLevel()==='L1'?'lv-L1':''}"><p class="eyebrow">끊어 읽기 훈련 3/3 — 표시 없이 읽기</p>${dots}
      <p class="para" style="margin-top:14px">${esc(text)}</p>
      <p class="qtext">${esc(q.q)}</p>
      <div class="choices">${q.choices.map((c,i)=>{
        let cls='choice',num=String(i+1);
        if(answered){if(i===q.answer){cls+=' correct';num='✓';}else if(i===ct.picked){cls+=' wrong';num='✕';}}
        return `<button class="${cls}" data-act="ct-pick" data-i="${i}" ${answered?'disabled':''}><span class="cnum">${num}</span><span style="flex:1;text-align:left">${esc(c)}</span></button>`;
      }).join('')}</div>
      ${answered?`<div class="explain"><b>${ct.picked===q.answer?'정답!':'아쉬워요.'}</b> ${esc(q.explain)}</div>
      <button class="btn" data-act="ct-finish">훈련 마치기</button>`:''}${answered?'':quit}</div>`;
  }
  return `<div class="card hero"><p class="eyebrow">끊어 읽기 훈련 완료</p><h1>끊기 ${ct.score}점 · 문제 ${ct.qOk?'정답':'오답'}</h1>
    <p class="sub">${ct.score>=80?'의미 덩어리가 눈에 잘 들어오고 있어요!':'모범 ∕ 위치를 다시 보며 한 번 더 해 보면 늘어요.'}</p>
    <button class="btn" data-act="ct-quit">훈련으로 돌아가기</button></div>`;
}

function wrongQuestion(w){
  const a=DB.articles.find(x=>x.id===w.aid);if(!a)return null;
  const b=a.levels&&a.levels[w.lv];if(!b)return null;
  const qs=w.ch?(b.challenge||[]):(b.questions||[]);
  const q=qs[w.qi];if(!q)return null;
  return {a,b,q};
}
function removeWrong(w){
  const i=S.wrong.findIndex(x=>x.aid===w.aid&&x.lv===w.lv&&x.ch===w.ch&&x.qi===w.qi);
  if(i>=0){S.wrong.splice(i,1);save();}
}
function vWrongSession(){
  const wq=sess.wq;
  while(wq.i<wq.list.length&&!wrongQuestion(wq.list[wq.i])){
    removeWrong(wq.list[wq.i]);wq.list.splice(wq.i,1); // 지문 개편으로 사라진 문항 정리
  }
  if(wq.i>=wq.list.length){
    /* 지문을 열고 맞힌 것도 노트에서 지운다 — 야박하면 오답 노트를 안 열게 된다.
       대신 스스로 푼 것과 나눠 보여 주어, 학생도 선생님도 상태를 알 수 있게 한다. */
    const self=wq.solved-(wq.peeked||0);
    return `<div class="card hero"><p class="eyebrow">오답 노트 완료</p><h1>${wq.solved}개 해결!${wq.again?` ${wq.again}개는 다음에 다시`:''}</h1>
      <p class="sub">${wq.peeked?`스스로 해결 ${self}개 · 지문 보고 해결 ${wq.peeked}개. `:''}맞힌 문제는 노트에서 지워졌어요. 남은 문제는 내일 또 도전해요.</p>
      <button class="btn" data-act="wq-done">훈련으로 돌아가기</button></div>`;
  }
  const w=wq.list[wq.i];
  const {a,b,q}=wrongQuestion(w);
  const answered=wq.picked!=null;
  const evIdx=q.evidencePara;
  /* ev: 0 접힘 · 1 근거 문단만 · 2 전체 지문 */
  const ev=wq.ev||0;
  return `<div class="card ${myLevel()==='L1'?'lv-L1':''}"><div class="qhead"><p class="qnum">오답 다시 풀기 ${wq.i+1} / ${wq.list.length}</p>
    <p class="qnum" style="font-weight:600">${esc(b.title)}${w.ch?' · 심화':''}</p></div>
    <div class="qbar"><i style="width:${Math.round(((wq.i+(answered?1:0))/wq.list.length)*100)}%"></i></div>
    <p class="sub" style="margin-top:12px"><span class="tag">${QTYPE_LABEL[q.type]||'문항'}</span> <span class="tag muted">${w.date}에 틀림</span></p>
    <p class="qtext">${esc(q.q)}</p>
    <div class="choices">${q.choices.map((c,i)=>{
      let cls='choice';let num=String(i+1);
      if(answered){if(i===q.answer){cls+=' correct';num='✓';}else if(i===wq.picked){cls+=' wrong';num='✕';}}
      return `<button class="${cls}" data-act="wq-pick" data-i="${i}" ${answered?'disabled':''}>
        <span class="cnum">${num}</span><span style="flex:1;text-align:left">${esc(c)}</span></button>`;
    }).join('')}</div>
    ${answered?`<div class="explain"><b>${wq.picked===q.answer?'해결! 노트에서 지웠어요.':'아직이에요 — 다음에 또 나와요.'}</b> ${esc(q.explain)}<br>
    <span class="evchip">근거: ${evIdx+1}번째 문단</span></div>`:''}
    <div class="rd-tools" style="margin-top:12px">
      <button class="toolbtn" data-act="wq-ev" data-m="${ev===1?0:1}" aria-pressed="${ev===1}">📄 ${answered?'근거 문단':'지문 다시 보기'}</button>
      <button class="toolbtn" data-act="wq-ev" data-m="${ev===2?0:2}" aria-pressed="${ev===2}">전체 지문</button>
    </div>
    ${ev?evidenceHtml(a,b,evIdx,ev===2):''}
    ${answered?`<button class="btn" data-act="wq-next">${wq.i+1<wq.list.length?'다음 문제':'끝내기'}</button>`:''}
    ${answered?'':'<button class="btn ghost sm" data-act="wq-done">그만하기</button>'}</div>`;
}

/* ── 요약 세션 열고 닫기 ────────────────────────────────────
   요약은 자기 화면(view.name==='rb')을 갖고, 끝나면 온 곳으로 돌아간다.
   go() 는 sess 를 비우므로 쓸 수 없다 — 요약 초안이 sess 에 들어 있다. */
function rbOpen(id,a,b,from){
  view={name:'rb',from:from||'train',id:id||null};navSet(view);
  sess={rb:{stage:1,articleId:id||null,title:b?b.title:''},rbChecks:[false,false,false,false],

/* ── 하루 뒤 요약 ───────────────────────────────────────────
   완독 직후에 요약을 시키면, 바로 앞 화면에서 문항별 해설로 핵심 문장을
   다 읽려 준 뒤라 회상이 아니라 해설 재생이 된다. 하루 지나 기억이 흐려진
   뒤에 끄집어내야 훈련이 된다 — 워드브레인이 「물 줄 시간」을 알려 주는 것과
   같은 장치다. 완독한 글 가운데 어제 이전에 읽었고 아직 요약을 안 쓴 것을 낸다. */
function rbDue(){
  const today=dkey();
  const written=new Set(S.redbook.filter(r=>r.articleId).map(r=>r.articleId));
  return Object.entries(S.readings)
    .filter(([id,r])=>r.date<today&&!written.has(id)&&DB.articles.some(x=>x.id===id))
    .sort((x,y)=>y[1].date<x[1].date?-1:1)
    .map(([id,r])=>({id,date:r.date,a:DB.articles.find(x=>x.id===id)}));
}

function renderEnPara(text,segArr,vocabList,linked,articleId,chunkOn){
  const chunks=(Array.isArray(segArr)&&segArr.join('')===text)?segArr:[text];
  return chunks.map(c=>{
    const hits=[];
    for(const ev of vocabList){
      if(linked.has(ev.word))continue;
      const i=c.indexOf(ev.word);
      if(i>=0){hits.push([i,ev.word]);linked.add(ev.word);}
    }
    hits.sort((x,y)=>x[0]-y[0]);
    let out='',pos=0;
    for(const [i,w] of hits){
      if(i<pos)continue;
      out+=esc(c.slice(pos,i))+`<button class="vw vw-en" data-act="vocab-en" data-id="${articleId}" data-w="${esc(w)}">${esc(w)}</button>`;
      pos=i+w.length;
    }
    out+=esc(c.slice(pos));
    return `<span class="seg">${out}</span>`;
  }).join('');
}

/* ── 자동 읽기 (SentenceMask) ── */
const AUTO_SPEEDS=[240,170,120,85,55];           // ms/글자 — 5단계
const AUTO_SPEED_LABELS=['매우 느리게','느리게','보통','빠르게','매우 빠르게'];
const VOICE_RATES=[0.6,0.8,1.0,1.25,1.6];        // 들으며 읽기 — 같은 5단계를 배속으로
const AUTO_SPEED_DEFAULT=2;                       // '보통'
const AUTO_SCOPES=['좁게','넓게','문장'];         // 좁게=의미 단위 1개, 넓게=2개 묶음, 문장=문장 단위
function autoSegs(){return Array.from(document.querySelectorAll('#readerCard .rd-body .seg')).filter(el=>el.offsetParent!==null);}
function autoGroups(){
  const segs=autoSegs();
  const scope=sess.auto?sess.auto.scope:0;
  if(scope===0)return segs.map(s=>[s]);
  const groups=[];let cur=[];
  const flush=()=>{if(cur.length){groups.push(cur);cur=[];}};
  for(const el of segs){
    if(cur.length&&cur[0].parentElement!==el.parentElement)flush();
    cur.push(el);
    if(scope===1){if(cur.length>=2)flush();}
    else if(/[.!?…]['"”’)»]?$/.test((el.textContent||'').trim()))flush();
  }
  flush();
  return groups;
}
function autoDelay(g){
  const len=(g||[]).reduce((s,el)=>s+(el.textContent||'').trim().length,0);
  const per=AUTO_SPEEDS[sess.auto?sess.auto.speed:AUTO_SPEED_DEFAULT]||AUTO_SPEEDS[AUTO_SPEED_DEFAULT];
  return Math.max(450,len*per);
}
function autoHighlight(groups){
  const a=sess.auto;if(!a)return;
  const now=new Set(groups[a.idx]||[]);
  autoSegs().forEach(s=>s.classList.toggle('now',now.has(s)));
  const cnt=document.getElementById('autoCount');
  if(cnt)cnt.textContent=Math.min(a.idx+1,groups.length)+' / '+groups.length;
}
function autoTick(){
  const a=sess.auto;if(!a||!a.playing)return;
  const groups=autoGroups();
  if(a.idx>=groups.length){autoStop(true);return;}
  autoHighlight(groups);
  const first=groups[a.idx][0];
  if(first)first.scrollIntoView({block:'center',behavior:'smooth'});
  if(a.voice){
    /* 타이머로 넘기면 소리와 글자가 어긋난다. 말이 실제로 끝난 순간에 넘긴다. */
    const text=groups[a.idx].map(el=>(el.textContent||'').trim()).filter(Boolean).join(' ');
    const tok=(a.tok=(a.tok||0)+1);   // 멈추거나 속도·범위를 바꾸면 옛 발화의 끝은 무시한다
    /* 소리가 시작되는지 딱 한 번만 지켜본다.
       목소리 목록(getVoices)은 못 믿는다 — 비어 있어도 읽어 주는 기기가 있고 그 반대도 있다.
       덩어리마다 감시를 다시 걸면 안 된다: onstart 없이 onend만 오는 기기에서는
       감시가 계속 미뤄져, 지문을 끝까지 조용히 넘긴 채 아무 말도 안 해 주게 된다. */
    if(!a.spoke&&!a.watch){
      a.watch=setTimeout(()=>{
        if(sess.auto===a&&!a.spoke)
          voiceFail('이 기기가 한국어를 읽어 주지 못해요. 휴대폰에서 열어 보시거나 기기 설정에서 한국어 음성을 추가해 주세요.');
      },2500);
    }
    WBVoice.speak(text,{rate:VOICE_RATES[a.speed]||1,onstart:()=>{
      a.spoke=true;clearTimeout(a.watch);
    },onend:()=>{
      const b=sess.auto;if(!b||!b.playing||b.tok!==tok)return;
      b.idx++;autoTick();
    },onerror:()=>{
      const b=sess.auto;if(!b||b.tok!==tok)return;
      voiceFail('이 기기가 한국어를 읽어 주지 못해요. 휴대폰에서 열어 보시거나 기기 설정에서 한국어 음성을 추가해 주세요.');
    }});
  }else{
    a.timer=setTimeout(()=>{a.idx++;autoTick();},autoDelay(groups[a.idx]));
  }
}
function autoStop(done){
  const wasVoice=!!(sess.auto&&sess.auto.voice);
  if(sess.auto&&sess.auto.watch)clearTimeout(sess.auto.watch);
  if(sess.auto&&sess.auto.timer)clearTimeout(sess.auto.timer);
  if(wasVoice)WBVoice.stop();
  sess.auto=null;
  const c=document.getElementById('readerCard');if(c)c.classList.remove('autoread');
  document.querySelectorAll('.seg.now').forEach(s=>s.classList.remove('now'));
  const bar=document.getElementById('autoBar');if(bar)bar.remove();
  if(done)announce(wasVoice?'끝까지 들으며 읽었어요! 이제 🎙 낭독으로 직접 읽어 보세요.'
                           :'자동 읽기 완료! 눈이 의미 단위를 따라갔어요.');
}
/* 소리가 안 났을 때 눈에 보이게 알린다.
   announce()는 스크린리더 전용 영역(.sr)이라 화면에서 1px로 잘려 보이지 않는다.
   완료 알림은 화면이 이미 바뀌니 그걸로 됐지만, 실패는 아무것도 안 바뀌어서
   "눌렀는데 아무 일도 없다"가 된다. */
function voiceFail(msg){
  autoStop(false);
  const bar=document.createElement('div');bar.className='auto-bar';bar.id='autoBar';
  bar.innerHTML=`<div class="auto-in"><span class="tag bad">소리가 나지 않아요</span>
    <span class="auto-lbl">${esc(msg)}</span><span style="flex:1"></span>
    <button class="toolbtn" data-act="auto-exit">닫기 ✕</button></div>`;
  document.body.appendChild(bar);
  announce(msg);
}
/* 들으며 읽기 — 목소리 목록을 미리 믿지 않는다.
   getVoices()가 비어 있어도 읽어 주는 기기가 있고, 차 있어도 못 내는 기기가 있다.
   일단 시작하고, 실제로 소리가 시작되는지(autoTick의 onstart)로 판단한다. */
function listenStart(){
  if(sess.auto)return;
  if(!WBVoice.ttsSupported()){
    voiceFail('이 브라우저는 읽어주기를 지원하지 않아요. 크롬이나 사파리에서 열어 보세요.');return;
  }
  /* 누른 '그 순간' 안에서 잠금을 풀어야 모바일에서 소리가 난다.
     목소리 목록을 기다렸다 시작하면 그 순간을 놓쳐 조용히 아무 일도 일어나지 않는다. */
  WBVoice.unlock();
  autoStart(true);
}
function autoStart(voice){

  const scope=voice?2:Math.min(pf.scope==null?0:pf.scope,AUTO_SCOPES.length-1);

  const c=document.getElementById('readerCard');if(c)c.classList.add('autoread');

  bar.innerHTML=`<div class="auto-in">
    <button class="toolbtn" data-act="auto-pp" id="autoPP">⏸ 정지</button>
    ${voice?'<span class="tag ok">🔊 들으며 읽기</span>':''}
    <span class="auto-lbl">속도</span>
    <span class="seg-ctl" id="autoSpeedCtl">${AUTO_SPEED_LABELS.map((l,i)=>`<button data-act="auto-speed" data-i="${i}" aria-pressed="${i===sess.auto.speed}">${l}</button>`).join('')}</span>

/* ── 낭독 녹음 (기기 밖으로 전송하지 않음 — 이 화면에서만 재생) ── */
let ALOUD={rec:null,stream:null,chunks:[],url:null,timer:null,t0:0};
async function aloudStart(){
  if(sess.auto)autoStop(false);
  if(ALOUD.url){URL.revokeObjectURL(ALOUD.url);ALOUD.url=null;}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const rec=new MediaRecorder(stream);
    ALOUD={rec,stream,chunks:[],url:null,timer:null,t0:Date.now()};
    rec.ondataavailable=e=>{if(e.data&&e.data.size)ALOUD.chunks.push(e.data);};
    rec.onstop=()=>{
      stream.getTracks().forEach(t=>t.stop());
      const blob=new Blob(ALOUD.chunks,{type:rec.mimeType||'audio/webm'});
      ALOUD.url=URL.createObjectURL(blob);
      aloudBar('done');
    };
    rec.start();
    aloudBar('rec');
  }catch(e){announce('마이크를 사용할 수 없어요. 브라우저의 마이크 권한을 확인해 주세요.');}
}
function aloudBar(state){
  let bar=document.getElementById('aloudBar');
  if(!bar){bar=document.createElement('div');bar.className='auto-bar';bar.id='aloudBar';document.body.appendChild(bar);}
  if(ALOUD.timer){clearInterval(ALOUD.timer);ALOUD.timer=null;}
  if(state==='rec'){
    bar.innerHTML=`<div class="auto-in"><span class="tag bad">● 녹음 중</span><span class="qnum" id="aloudTime">0:00</span>
      <span class="auto-lbl">소리 내어 끝까지 읽어 보세요</span><span style="flex:1"></span>
      <button class="toolbtn" data-act="aloud-stop">■ 녹음 끝</button><button class="toolbtn" data-act="aloud-close">✕</button></div>`;
    ALOUD.timer=setInterval(()=>{const s=Math.floor((Date.now()-ALOUD.t0)/1000);
      const el=document.getElementById('aloudTime');if(el)el.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');},500);
  }else{
    bar.innerHTML=`<div class="auto-in"><span class="tag ok">낭독 완료 — 들어 보세요</span>
      <audio controls src="${ALOUD.url}" style="flex:1;min-width:170px;height:40px"></audio>
      <button class="toolbtn" data-act="aloud">다시 녹음</button><button class="toolbtn" data-act="aloud-close">✕</button></div>`;
  }
}
function aloudClose(){
  try{
    if(ALOUD.rec&&ALOUD.rec.state==='recording'){ALOUD.rec.onstop=()=>{ALOUD.stream.getTracks().forEach(t=>t.stop());};ALOUD.rec.stop();}
    else if(ALOUD.stream)ALOUD.stream.getTracks().forEach(t=>t.stop());
  }catch(e){}
  if(ALOUD.timer)clearInterval(ALOUD.timer);
  if(ALOUD.url)URL.revokeObjectURL(ALOUD.url);
  const bar=document.getElementById('aloudBar');if(bar)bar.remove();
  ALOUD={rec:null,stream:null,chunks:[],url:null,timer:null,t0:0};
}
