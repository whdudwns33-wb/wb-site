/* ── 낭독 (기기 음성으로 읽어 주기 · 따라 읽기) ──
   자동 읽기가 "눈의 속도"를 잡아 준다면, 낭독은 "귀로 듣고 소리로 따라가기"다.
   저학년은 해독에 작업기억을 다 써서 이해까지 가지 못하므로, 먼저 유창성을 만든다.
   발음 채점은 하지 않는다 — 아동 음성 인식률이 낮아 "잘 읽었는데 틀렸다"가 이탈로 이어진다. */
const SPK_RATES=[0.6,0.8,1,1.2];
const SPK_RATE_LABELS=['아주 천천히','천천히','보통','빠르게'];
let SPK=null;
function spkOK(){try{return 'speechSynthesis' in window && typeof SpeechSynthesisUtterance==='function';}catch(e){return false;}}
function spkVoice(lang){
  let vs=[];try{vs=speechSynthesis.getVoices()||[];}catch(e){}
  const pre=lang.slice(0,2).toLowerCase();
  const same=vs.filter(v=>(v.lang||'').replace('_','-').toLowerCase().startsWith(pre));
  return same.find(v=>v.localService)||same[0]||null;
}
/* 문장 단위로 묶는다 — 문단을 넘지 않고, 영어 문단은 영어 음성으로.
   긴 문장을 한 번에 넘기면 일부 브라우저가 중간에 끊으므로 문장 단위가 안전하다. */
function spkUnits(){
  const segs=Array.from(document.querySelectorAll('#readerCard .rd-body .seg')).filter(el=>el.offsetParent!==null);
  const out=[];let cur=[];
  const flush=()=>{
    if(!cur.length)return;
    const text=cur.map(el=>(el.textContent||'').trim()).join(' ').replace(/\s+/g,' ').trim();
    if(text)out.push({els:cur,text,lang:cur[0].closest('.para-en')?'en-US':'ko-KR'});
    cur=[];
  };
  for(const el of segs){
    if(cur.length&&cur[0].parentElement!==el.parentElement)flush();
    cur.push(el);
    if(/[.!?…]['"”’)»]?$/.test((el.textContent||'').trim()))flush();
  }
  flush();
  return out;
}
function spkPaint(units){
  units=units||spkUnits();
  const u=SPK?units[SPK.idx]:null;
  const now=new Set(u?u.els:[]);
  document.querySelectorAll('#readerCard .rd-body .seg').forEach(el=>el.classList.toggle('spk',now.has(el)));
  const c=document.getElementById('spkCount');
  if(c&&SPK)c.textContent=Math.min(SPK.idx+1,units.length)+' / '+units.length;
}
function spkBar(units){
  if(!SPK)return;
  let bar=document.getElementById('spkBar');
  if(!bar){bar=document.createElement('div');bar.className='auto-bar';bar.id='spkBar';document.body.appendChild(bar);}
  const head=SPK.waiting
    ? `<span class="spk-cue">🗣 따라 읽어 보세요</span>
       <button class="toolbtn" data-act="spk-again">↺ 다시 들려줘</button>
       <button class="toolbtn" data-act="spk-next">다음 문장 ▶</button>`
    : `<button class="toolbtn" data-act="spk-pp">${SPK.paused?'▶ 이어서':'⏸ 정지'}</button>
       <button class="toolbtn" data-act="spk-again">↺ 이 문장 다시</button>`;
  bar.innerHTML=`<div class="auto-in">${head}
    <span class="auto-lbl">속도</span>
    <span class="seg-ctl">${SPK_RATE_LABELS.map((l,i)=>`<button data-act="spk-rate" data-i="${i}" aria-pressed="${i===SPK.rate}">${l}</button>`).join('')}</span>
    <span class="seg-ctl"><button data-act="spk-echo" aria-pressed="${SPK.echo}">🗣 따라 읽기</button></span>
    <span class="qnum" id="spkCount"></span>
    <span style="flex:1"></span>
    <button class="toolbtn" data-act="spk-exit">끝내기 ✕</button></div>`;
  spkPaint(units);
}
function spkClearTimers(){
  if(!SPK)return;
  if(SPK.timer){clearTimeout(SPK.timer);SPK.timer=null;}
  if(SPK.guard){clearTimeout(SPK.guard);SPK.guard=null;}
}
function spkSpeak(){
  if(!SPK)return;
  spkClearTimers();
  const units=spkUnits();
  if(SPK.idx>=units.length){spkStop(true);return;}
  const u=units[SPK.idx];
  SPK.waiting=false;SPK.paused=false;
  spkBar(units);
  if(u.els[0])u.els[0].scrollIntoView({block:'center',behavior:'smooth'});
  let handled=false;
  /* 한국어 음성이 없는 기기에서는 speak()가 즉시 onerror로 떨어진다.
     그대로 두면 문장이 소리 없이 좌르륵 넘어가므로, 첫 문장부터 실패하면 멈추고 알린다. */
  const finish=(failed)=>{
    if(handled||!SPK)return;
    handled=true;
    if(failed){
      SPK.err++;
      if(!SPK.ok&&SPK.err>=2){spkStop(false);announce('이 기기에는 읽어 줄 목소리가 없어요. 대신 🎙 녹음으로 직접 읽어 보세요.');return;}
    }else{SPK.ok++;SPK.err=0;}
    spkAfter();
  };
  try{
    speechSynthesis.cancel();
    const utt=new SpeechSynthesisUtterance(u.text);
    utt.lang=u.lang;utt.rate=SPK_RATES[SPK.rate];utt.pitch=1;
    const v=spkVoice(u.lang);if(v)utt.voice=v;
    utt.onend=()=>finish(false);
    utt.onerror=()=>finish(true);
    speechSynthesis.speak(utt);
    /* onend가 오지 않는 기기 대비 안전장치 — 예상 낭독 시간 + 여유 */
    SPK.guard=setTimeout(()=>finish(false),Math.max(4000,u.text.length*400/SPK_RATES[SPK.rate])+2500);
  }catch(e){finish(true);}
}
function spkAfter(){
  if(!SPK)return;
  spkClearTimers();
  if(SPK.echo){
    /* 따라 읽기: 아이가 소리 내어 따라 읽을 시간을 준다 (문장 길이에 비례, 손 안 대도 넘어감) */
    const units=spkUnits();
    const u=units[SPK.idx];
    SPK.waiting=true;
    spkBar(units);
    SPK.timer=setTimeout(spkNext,Math.max(1800,(u?u.text.length:0)*260));
    return;
  }
  SPK.timer=setTimeout(spkNext,200);
}
function spkNext(){
  if(!SPK)return;
  spkClearTimers();
  SPK.idx++;SPK.waiting=false;
  if(SPK.idx>=spkUnits().length){spkStop(true);return;}
  spkSpeak();
}
function spkStop(done){
  if(!SPK)return;
  spkClearTimers();
  const n=SPK.idx,echo=SPK.echo,aid=SPK.articleId;
  SPK=null;
  try{speechSynthesis.cancel();}catch(e){}
  const c=document.getElementById('readerCard');if(c)c.classList.remove('readaloud');
  document.querySelectorAll('.seg.spk').forEach(el=>el.classList.remove('spk'));
  const bar=document.getElementById('spkBar');if(bar)bar.remove();
  if(!done)return;
  if(aid){S.train.push({date:dkey(),articleId:aid,type:'readaloud',echo,sentences:n});save();}
  announce(echo?'따라 읽기 완료! 소리 내어 읽으면 더 잘 이해돼요.':'낭독 완료! 끝까지 들었어요.');
}
function spkStart(){
  if(!spkOK()){announce('이 기기에서는 낭독을 지원하지 않아요. 대신 🎙 녹음으로 직접 읽어 보세요.');return;}
  if(sess.auto)autoStop(false);
  aloudClose();
  if(SPK)spkStop(false);
  try{speechSynthesis.getVoices();}catch(e){}   // 첫 호출에서 목소리 목록을 깨운다
  if(!spkUnits().length){announce('읽어 줄 문장을 찾지 못했어요.');return;}
  const pf=S.prefs.spk||{};
  SPK={idx:0,rate:Math.min(pf.rate==null?1:pf.rate,SPK_RATES.length-1),echo:!!pf.echo,
       waiting:false,paused:false,timer:null,guard:null,ok:0,err:0,articleId:view.id||null};
  const c=document.getElementById('readerCard');if(c)c.classList.add('readaloud');
  spkSpeak();
}
function spkSavePrefs(){if(SPK){S.prefs.spk={rate:SPK.rate,echo:SPK.echo};save();}}
/* 화면을 벗어나면 목소리가 따라다니지 않게 */
document.addEventListener('visibilitychange',()=>{if(document.hidden&&SPK)spkStop(false);});
window.addEventListener('pagehide',()=>{try{speechSynthesis.cancel();}catch(e){}});

/* ── 내 목소리 녹음 (기기 밖으로 전송하지 않음 — 이 화면에서만 재생) ── */
let ALOUD={rec:null,stream:null,chunks:[],url:null,timer:null,t0:0};
async function aloudStart(){
  if(sess.auto)autoStop(false);
  if(ALOUD.url){URL.revokeObjectURL(ALOUD.url);ALOUD.url=null;}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const rec=new MediaRecorder(stream);
    ALOUD={rec,stream,chunks:[],url:null,timer:null,t0:Date.now()};
    rec.ondataavailable=e=>{if(e.data&&e.data.size)ALOUD.chunks.push(e.data);};
    rec.onstop=()=>{
      stream.getTracks().forEach(t=>t.stop());
      const blob=new Blob(ALOUD.chunks,{type:rec.mimeType||'audio/webm'});
      ALOUD.url=URL.createObjectURL(blob);
      aloudBar('done');
    };
    rec.start();
    aloudBar('rec');
  }catch(e){announce('마이크를 사용할 수 없어요. 브라우저의 마이크 권한을 확인해 주세요.');}
}
function aloudBar(state){
  let bar=document.getElementById('aloudBar');
  if(!bar){bar=document.createElement('div');bar.className='auto-bar';bar.id='aloudBar';document.body.appendChild(bar);}
  if(ALOUD.timer){clearInterval(ALOUD.timer);ALOUD.timer=null;}
  if(state==='rec'){
    bar.innerHTML=`<div class="auto-in"><span class="tag bad">● 녹음 중</span><span class="qnum" id="aloudTime">0:00</span>
      <span class="auto-lbl">소리 내어 끝까지 읽어 보세요</span><span style="flex:1"></span>
      <button class="toolbtn" data-act="aloud-stop">■ 녹음 끝</button><button class="toolbtn" data-act="aloud-close">✕</button></div>`;
    ALOUD.timer=setInterval(()=>{const s=Math.floor((Date.now()-ALOUD.t0)/1000);
      const el=document.getElementById('aloudTime');if(el)el.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');},500);
  }else{
    bar.innerHTML=`<div class="auto-in"><span class="tag ok">녹음 완료 — 들어 보세요</span>
      <audio controls src="${ALOUD.url}" style="flex:1;min-width:170px;height:40px"></audio>
      <button class="toolbtn" data-act="aloud">다시 녹음</button><button class="toolbtn" data-act="aloud-close">✕</button></div>`;
  }
}
function aloudClose(){
  try{
    if(ALOUD.rec&&ALOUD.rec.state==='recording'){ALOUD.rec.onstop=()=>{ALOUD.stream.getTracks().forEach(t=>t.stop());};ALOUD.rec.stop();}
    else if(ALOUD.stream)ALOUD.stream.getTracks().forEach(t=>t.stop());
  }catch(e){}
  if(ALOUD.timer)clearInterval(ALOUD.timer);
  if(ALOUD.url)URL.revokeObjectURL(ALOUD.url);
  const bar=document.getElementById('aloudBar');if(bar)bar.remove();
  ALOUD={rec:null,stream:null,chunks:[],url:null,timer:null,t0:0};
}
/* ───────────────────────── 어휘 인출 게이트 ─────────────────────────
   누르자마자 뜻이 나오면 "봤으니 안다"(친숙도 착각)로 끝나고, 어휘장에는
   궁금해서 눌러 본 아는 낱말까지 섞여 복습 슬롯을 잡아먹는다.
   그래서 뜻을 보기 전에 한 번 떠올리게 하고, 그 결과로만 어휘장에 넣는다.
   → 어휘장이 "누른 기록"이 아니라 "정말 몰랐던 낱말"이 된다. */
let VG=null;
function vgRec(word){
  const r=S.vgate[word]||(S.vgate[word]={kn:0,un:0,il:0,last:null});
  r.last=dkey();return r;
}
function vocabFind(word,lang){return S.vocab.find(x=>x.word===word&&((x.lang==='en')===(lang==='en')));}
/* 회상 실패 — 어휘장에 없으면 넣고, 있으면 간격을 처음으로 되돌린다 */
function vocabAdd(w,why){
  const sv=vocabFind(w.word,w.lang);
  if(sv){sv.miss=(sv.miss||0)+1;sv.box=0;sv.last=dkey();return false;}
  const e={word:w.word,easy:w.easy,hanja:w.hanja||null,articleId:w.articleId,
    addedAt:dkey(),ok:0,miss:0,box:0,last:addDays(dkey(),-1),why};
  if(w.lang==='en'){e.lang='en';e.base=w.base||null;e.hanja=null;}
  S.vocab.push(e);return true;
}
/* 회상 성공 — 어휘장에 있던 낱말이면 간격을 한 칸 늘린다 */
function vocabHit(word,lang){
  const sv=vocabFind(word,lang);if(!sv)return;
  sv.ok=(sv.ok||0)+1;sv.box=Math.min(4,(sv.box||0)+1);sv.last=dkey();
}
function vgRender(){
  if(!VG)return;
  const w=VG;
  const head=`<div class="between"><span class="sheet-w">${w.lang==='en'?'<span class="lang-en-tag">EN</span>':''}${esc(w.word)}${hjWordTag(w.hanja)}</span>
    <button class="toolbtn" data-act="sheet-close">닫기</button></div>`;
  /* 한자 분해·영어 원형은 뜻을 보기 전에도 보여 준다 — 답이 아니라 추론할 재료라서 */
  const hint=w.hanja?hjChips(w.hanja)
    :(w.base?`<p class="sub" style="margin-top:6px;font-weight:800">${esc(w.base)}</p>`:'');
  let body;
  if(w.stage==='ask'){
    body=`<p class="vg-ask">이 낱말의 뜻, 떠올릴 수 있나요?</p>
      <p class="vg-tip">머릿속으로 말해 보거나 소리 내어 말해 보세요.</p>
      <div class="row2" style="margin-top:11px">
        <button class="btn sm ghost" data-act="vg-no" style="margin-top:0">모르겠어요</button>
        <button class="btn sm" data-act="vg-yes" style="margin-top:0">떠올랐어요</button></div>`;
  }else if(w.stage==='self'){
    body=`<p class="sheet-e">${esc(w.easy)}</p>
      <p class="vg-ask">생각한 뜻과 같았나요?</p>
      <p class="vg-tip">솔직하게 눌러야 내 어휘장이 정확해져요.</p>
      <div class="row2" style="margin-top:11px">
        <button class="btn sm ghost" data-act="vg-miss" style="margin-top:0">사실 달랐어요</button>
        <button class="btn sm" data-act="vg-hit" style="margin-top:0">같았어요</button></div>`;
  }else{
    body=`<p class="sheet-e">${esc(w.easy)}</p>
      <p class="sheet-s${w.warm?' vg-il':''}">${esc(w.msg||'')}</p>
      ${w.stage==='known'?`<button class="btn sm ghost" data-act="vg-keep" style="margin-top:9px">그래도 어휘장에 넣어 둘래요</button>`:''}`;
  }
  $('#sheetIn').innerHTML=head+hint+body;
}
function vgOpen(w){
  VG=Object.assign({stage:'ask',msg:'',warm:false},w);
  vgRender();
  $('#sheet').classList.add('open');
  announce(w.word+' — 뜻을 떠올려 보세요');
}
function vgClose(){VG=null;$('#sheet').classList.remove('open');}
function openVocabEn(articleId,word){
  const b=levelBody(DB.articles.find(x=>x.id===articleId),myLevel());
  const v=b&&(b.envocab||[]).find(x=>x.word===word);if(!v)return;
  vgOpen({articleId,word:v.word,easy:v.ko,base:v.base||null,hanja:null,lang:'en'});
}
function openVocab(articleId,word){
  const b=levelBody(DB.articles.find(x=>x.id===articleId),myLevel());
  const v=b&&b.vocab.find(x=>x.word===word);if(!v)return;
  vgOpen({articleId,word:v.word,easy:v.easy,hanja:v.hanja||null,lang:'ko'});
}

/* ───────────────────────── 완독 후 어휘 체크 ─────────────────────────
   인출 게이트는 "누른 낱말"만 잡는다. 일부러 안 누르고 넘어간 낱말은
   여기서 잡는다 — 건너뛰기가 일을 줄여 주지 못하게. */
const VCHECK_N=3;
/* 아직 한 번도 안 다뤄 본 낱말(=건너뛴 낱말)을 맨 앞에, 몰랐던 낱말을 그다음에 */
function vcheckPick(b){
  const all=(b&&b.vocab)||[];
  const rank=v=>{const r=S.vgate[v.word];if(!r)return 0;return (r.un||r.il)?1:2;};
  return all.map((v,i)=>({v,i,r:rank(v)}))
    .sort((x,y)=>x.r-y.r||x.i-y.i).slice(0,VCHECK_N).map(x=>x.v);
}
/* 오답 보기는 같은 레벨의 다른 어휘에서 — 엉뚱한 보기로 정답이 드러나지 않게 */
function vcheckOptions(v){
  const lv=myLevel(),pool=[];
  DB.articles.forEach(a=>{const bb=levelBody(a,lv);
    if(bb&&bb.vocab)bb.vocab.forEach(o=>{if(o.word!==v.word&&o.easy!==v.easy)pool.push(o.easy);});});
  const seed=hash(v.word);
  const uniq=Array.from(new Set(pool)).sort((x,y)=>(hash(x)+seed)%997-(hash(y)+seed)%997).slice(0,3);
  if(uniq.length<3)return null;                 // 보기를 못 채우면 문항으로 쓰지 않는다
  const answer=hash(v.word+'a')%(uniq.length+1);
  uniq.splice(answer,0,v.easy);
  return {choices:uniq,answer};
}
function vcheckBuild(b){
  const list=vcheckPick(b).map(v=>{
    const o=vcheckOptions(v);
    return o&&{word:v.word,easy:v.easy,hanja:v.hanja||null,choices:o.choices,answer:o.answer};
  }).filter(Boolean);
  return list.length?{list,i:0,picked:null,ok:0}:null;
}
function vcheckAvail(b){return !!vcheckBuild(b);}
/* 문항에는 한자를 보여 주지 않는다 — 軌+道를 보여 주면 '길'이 답으로 드러나
   "정말 아는가"를 못 재게 된다. 한자 분해는 답을 고른 뒤 배우는 자리로 옮겼다. */
function vcheckCard(vc){
  const q=vc.list[vc.i],answered=vc.picked!=null;
  return `<div class="card" style="margin:16px 0 0;border-color:#b9deed">
    <p class="qnum">어휘 체크 ${vc.i+1} / ${vc.list.length}</p>
    <p class="qtext">‘${esc(q.word)}’의 뜻은?</p>
    <div class="choices">${q.choices.map((c,i)=>{
      let cls='choice',num=String(i+1);
      if(answered){if(i===q.answer){cls+=' correct';num='✓';}else if(i===vc.picked){cls+=' wrong';num='✕';}}
      return `<button class="${cls}" data-act="vc-pick" data-i="${i}" ${answered?'disabled':''}>
        <span class="cnum">${num}</span><span style="flex:1;text-align:left">${esc(c)}</span></button>`;}).join('')}</div>
    ${answered?`<div class="explain"><b>${vc.picked===q.answer?'맞았어요!':'아쉬워요 — 어휘장에 넣어 둘게요.'}</b>
      ${esc(q.word)}: ${esc(q.easy)}${q.hanja?hjChips(q.hanja):''}</div>
      <button class="btn" data-act="vc-next">${vc.i+1<vc.list.length?'다음':'끝내기'}</button>`:''}</div>`;
}

/* ───────────────────────── 이벤트 ───────────────────────── */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const act=t.dataset.act;
  const ob=sess.ob;
  if(act==='nav'){go(t.dataset.v);}
  else if(act==='ob-grade'){ob.grade=t.dataset.v;render();}
  else if(act==='ob-next-grade'){ob.step='interests';render();}
  else if(act==='ob-int'){const v=t.dataset.v;const i=ob.interests.indexOf(v);
    if(i>=0)ob.interests.splice(i,1);else if(ob.interests.length<3)ob.interests.push(v);render();}
  else if(act==='ob-next-int'){ob.step='diag-intro';render();}
  else if(act==='ob-diag-start'){ob.step='diag-read';render();}
  else if(act==='ob-diag-quiz'){ob.step='diag-quiz';render();}
  else if(act==='ob-diag-pick'){const q=ob.diagQ;if(q.picked!=null)return;
    q.picked=+t.dataset.i;const cur=DB.diagnostics[LEVEL_OF[ob.grade]].questions[q.i];
    if(q.picked===cur.answer)q.correct++;render();}
  else if(act==='ob-diag-next'){const q=ob.diagQ;const qs=DB.diagnostics[LEVEL_OF[ob.grade]].questions;
    if(q.i+1<qs.length){q.i++;q.picked=null;}else{ob.step='diag-result';}render();}
  else if(act==='ob-finish'){finishOnboard(t.dataset.lv||null);}
  else if(act==='read'){go('reader',{id:t.dataset.id});}
  else if(act==='toggle-chunk'){const lv=myLevel();
    const a=DB.articles.find(x=>x.id===view.id);
    const mc=a?S.mychunks[myChunkKey(a,lv)]:null;
    if(S.prefs.chunk[lv]&&!(mc&&mc.use)){S.prefs.chunk[lv]=false;}
    else{S.prefs.chunk[lv]=true;if(mc)mc.use=false;}
    save();render();}
  else if(act==='toggle-mychunk'){const lv=myLevel();
    const a=DB.articles.find(x=>x.id===view.id);
    const mc=S.mychunks[myChunkKey(a,lv)];if(!mc)return;
    if(S.prefs.chunk[lv]&&mc.use){S.prefs.chunk[lv]=false;}
    else{S.prefs.chunk[lv]=true;mc.use=true;}
    save();render();}
  else if(act==='mychunk-edit'){const lv=myLevel();
    const a=DB.articles.find(x=>x.id===view.id);if(!a)return;
    const b=levelBody(a,lv);
    if(sess.auto)autoStop(false);
    const mc=S.mychunks[myChunkKey(a,lv)];
    sess.myEdit={marks:b.paragraphs.map((p,i)=>new Set((mc&&mc.b&&mc.b[i])||[]))};
    render();}
  else if(act==='myedit-gap'){const me=sess.myEdit;if(!me)return;
    const s=me.marks[+t.dataset.p];const i=+t.dataset.i;
    if(s.has(i))s.delete(i);else s.add(i);render();}
  else if(act==='myedit-save'){const lv=myLevel();
    const a=DB.articles.find(x=>x.id===view.id);const me=sess.myEdit;if(!a||!me)return;
    if(!me.marks.some(s=>s.size)){announce('∕ 를 한 곳 이상 눌러 주세요');return;}
    S.mychunks[myChunkKey(a,lv)]={b:me.marks.map(s=>[...s].sort((x,y)=>x-y)),use:true,at:dkey()};
    S.prefs.chunk[lv]=true;sess.myEdit=null;save();render();
    announce('내 단위 저장! 이제 내가 끊은 대로 표시되고, 자동 읽기도 따라가요');}
  else if(act==='myedit-cancel'){sess.myEdit=null;render();}
  else if(act==='fs-minus'){S.prefs.fs=Math.round(Math.max(0.9,(S.prefs.fs||1)-0.1)*10)/10;save();render();}
  else if(act==='fs-plus'){S.prefs.fs=Math.round(Math.min(1.3,(S.prefs.fs||1)+0.1)*10)/10;save();render();}
  else if(act==='vocab'){openVocab(t.dataset.id,t.dataset.w);}
  else if(act==='sheet-close'){vgClose();}
  /* ── 어휘 인출 게이트 ── */
  else if(act==='vg-yes'){if(!VG)return;VG.stage='self';vgRender();announce(VG.word+': '+VG.easy);}
  else if(act==='vg-no'){if(!VG)return;
    vgRec(VG.word).un++;
    const isNew=vocabAdd(VG,'unknown');save();
    VG.stage='done';
    VG.msg=isNew?'✓ 어휘장에 넣었어요 — 모른다고 말한 게 실력이에요':'어휘장에 있는 낱말이에요. 곧 다시 물어볼게요';
    vgRender();announce(VG.word+': '+VG.easy);}
  else if(act==='vg-hit'){if(!VG)return;
    vgRec(VG.word).kn++;
    vocabHit(VG.word,VG.lang);save();
    VG.stage='known';VG.msg='좋아요! 아는 낱말이라 어휘장에는 넣지 않을게요';
    vgRender();}
  else if(act==='vg-miss'){if(!VG)return;
    vgRec(VG.word).il++;
    const isNew=vocabAdd(VG,'illusion');save();
    VG.stage='done';VG.warm=true;
    VG.msg=isNew?'✓ 어휘장에 넣었어요 — 아는 줄 알았던 낱말이 가장 크게 늘어요':'어휘장에 있는 낱말이에요. 곧 다시 물어볼게요';
    vgRender();}
  else if(act==='vg-keep'){if(!VG)return;
    if(!vocabFind(VG.word,VG.lang))vocabAdd(VG,'kept');
    save();VG.stage='done';VG.msg='✓ 어휘장에 넣었어요';vgRender();}
  /* ── 완독 후 어휘 체크 ── */
  else if(act==='vc-start'){
    sess.vc=vcheckBuild(levelBody(DB.articles.find(x=>x.id===view.id),myLevel()));render();}
  else if(act==='vc-pick'){const vc=sess.vc;if(!vc||vc.picked!=null)return;
    vc.picked=+t.dataset.i;
    const q=vc.list[vc.i],r=vgRec(q.word);
    if(vc.picked===q.answer){vc.ok++;r.kn++;vocabHit(q.word,'ko');}
    else{r.un++;vocabAdd({word:q.word,easy:q.easy,hanja:q.hanja,articleId:view.id,lang:'ko'},'check');}
    save();render();}
  else if(act==='vc-next'){const vc=sess.vc;if(!vc)return;
    if(vc.i+1<vc.list.length){vc.i++;vc.picked=null;}
    else{S.vcheck[view.id]={date:dkey(),n:vc.list.length,ok:vc.ok};save();
      announce('어휘 체크 완료 — '+vc.list.length+'개 중 '+vc.ok+'개 맞았어요');
      sess.vc=null;}
    render();}
  else if(act==='read-done'){sess.readSecs=Math.round((Date.now()-sess.startAt)/1000);sess.readDone=true;render();}
  else if(act==='eval'){const a=DB.articles.find(x=>x.id===view.id);
    completeRead(a,t.dataset.v);sess.evalDone=true;render();announce('완독 기록 완료');}
  else if(act==='start-quiz'){go('quiz',{id:t.dataset.id});}
  else if(act==='quiz-pick'){const q=sess.q;if(q.picked!=null)return;
    q.picked=+t.dataset.i;const b=levelBody(DB.articles.find(x=>x.id===view.id),myLevel());
    const qs=q.ch?(b.challenge||[]):b.questions;
    if(q.picked===qs[q.i].answer)q.correct++;
    else{const w={aid:view.id,lv:myLevel(),ch:!!q.ch,qi:q.i};
      if(!S.wrong.some(x=>x.aid===w.aid&&x.lv===w.lv&&x.ch===w.ch&&x.qi===w.qi)){S.wrong.push({...w,date:dkey()});save();}}
    render();}
  else if(act==='quiz-next'){const q=sess.q;const b=levelBody(DB.articles.find(x=>x.id===view.id),myLevel());
    const qs=q.ch?(b.challenge||[]):b.questions;
    if(q.i+1<qs.length){q.i++;q.picked=null;}
    else{q.fin=true;S.quiz[view.id+(q.ch?'#c':'')]={correct:q.correct,total:qs.length,date:dkey()};save();}
    render();}
  else if(act==='quiz-challenge'){sess.q={i:0,correct:0,picked:null,fin:false,ch:true};render();}
  else if(act==='scrap-open'){sess.scrapOpen=true;render();}
  else if(act==='scrap-save'){const note=($('#scrapNote')?$('#scrapNote').value.trim():'').slice(0,80);
    S.scraps[t.dataset.id]={date:dkey(),note};save();sess.scrapOpen=false;render();announce('스크랩 저장');}
  else if(act==='scrap-quick'){S.scraps[t.dataset.id]={date:dkey(),note:''};save();render();}
  else if(act==='lib-tab'){view.tab=t.dataset.v;sess={};render();}
  else if(act==='vocab-toggle'){sess['vopen'+t.dataset.i]=!sess['vopen'+t.dataset.i];render();}
  else if(act==='vocab-review'){const pool=S.vocab.slice().sort(()=>hash(dkey()+Math.random())%2?1:-1);
    sess.vq={list:pool.slice(0,Math.min(5,pool.length)),i:0,show:false};render();}
  else if(act==='vq-show'){sess.vq.show=true;render();}
  else if(act==='vq-mark'){const v=sess.vq.list[sess.vq.i];
    const sv=S.vocab.find(x=>x.word===v.word);if(sv){if(t.dataset.ok==='1')sv.ok++;else sv.miss++;save();}
    if(sess.vq.i+1<sess.vq.list.length){sess.vq.i++;sess.vq.show=false;}else{sess.vq=null;announce('어휘 복습 완료');}
    render();}
  else if(act==='set-int'){const v=t.dataset.v;const iv=S.profile.interests;const i=iv.indexOf(v);
    if(i>=0){if(iv.length>1)iv.splice(i,1);}else if(iv.length<3)iv.push(v);save();render();}
  else if(act==='pwa-install'){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(()=>{deferredPrompt=null;render();});}}
  else if(act==='sync-login'){const code=($('#syncCode')||{}).value||'';
    syncApi('/login',{method:'POST',body:JSON.stringify({code:code.trim()})})
      .then(j=>{SYNC.auth={code:j.student.code,name:j.student.name,token:j.token,lastSync:null};syncSaveAuth();sess.syncErr=null;
        return syncPull(true).then(()=>syncPush());})
      .then(()=>{render();announce('선생님 연동 완료');})
      .catch(e=>{sess.syncErr=e.message;render();});}
  else if(act==='sync-now'){syncPush().then(()=>syncPull()).then(()=>{render();announce('동기화 완료');});}
  else if(act==='sync-off'){SYNC.auth=null;syncSaveAuth();render();}
  else if(act==='en-mode'){const lv=myLevel();if(sess.auto)autoStop(false);spkStop(false);S.prefs.en[lv]=+t.dataset.m;save();render();}
  else if(act==='auto-start'){autoStart();}
  else if(act==='auto-pp'){const a=sess.auto;if(!a)return;
    a.playing=!a.playing;
    const pp=document.getElementById('autoPP');if(pp)pp.textContent=a.playing?'⏸ 정지':'▶ 계속';
    if(a.playing)autoTick();else if(a.timer)clearTimeout(a.timer);}
  else if(act==='auto-speed'){const a=sess.auto;if(!a)return;
    a.speed=+t.dataset.i;
    S.prefs.auto=S.prefs.auto||{};S.prefs.auto.speed=a.speed;save();
    document.querySelectorAll('#autoSpeedCtl button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.i===t.dataset.i?'true':'false'));}
  else if(act==='auto-scope'){const a=sess.auto;if(!a)return;
    const old=autoGroups();const curEl=(old[a.idx]||[])[0];
    a.scope=+t.dataset.i;
    S.prefs.auto=S.prefs.auto||{};S.prefs.auto.scope=a.scope;save();
    const ng=autoGroups();
    let ni=curEl?ng.findIndex(g=>g.includes(curEl)):-1;
    if(ni<0)ni=Math.min(a.idx,Math.max(0,ng.length-1));
    a.idx=ni;
    document.querySelectorAll('#autoScopeCtl button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.i===t.dataset.i?'true':'false'));
    if(a.timer)clearTimeout(a.timer);
    if(a.playing)autoTick();else autoHighlight(ng);}
  else if(act==='auto-exit'){autoStop(false);}
  /* ── 낭독 (TTS) ── */
  else if(act==='spk'){spkStart();}
  else if(act==='spk-pp'){if(!SPK)return;
    if(SPK.paused){spkSpeak();}
    else{SPK.paused=true;spkClearTimers();try{speechSynthesis.cancel();}catch(e){}spkBar();}}
  else if(act==='spk-again'){if(SPK)spkSpeak();}
  else if(act==='spk-next'){if(SPK)spkNext();}
  else if(act==='spk-rate'){if(!SPK)return;
    SPK.rate=+t.dataset.i;spkSavePrefs();
    if(SPK.waiting||SPK.paused)spkBar();else spkSpeak();}
  else if(act==='spk-echo'){if(!SPK)return;
    SPK.echo=!SPK.echo;spkSavePrefs();
    if(SPK.waiting&&!SPK.echo)spkNext();else spkBar();
    announce(SPK.echo?'따라 읽기 켜짐 — 한 문장 듣고 따라 읽어요':'따라 읽기 꺼짐 — 이어서 읽어 줘요');}
  else if(act==='spk-exit'){spkStop(false);}
  /* ── 내 목소리 녹음 ── */
  else if(act==='aloud'){aloudStart();}
  else if(act==='aloud-stop'){if(ALOUD.rec&&ALOUD.rec.state==='recording'){ALOUD.rec.stop();
    S.train.push({date:dkey(),articleId:view.id,type:'aloud'});save();announce('녹음 완료! 들어 보세요.');}}
  else if(act==='aloud-close'){aloudClose();}
  else if(act==='vocab-en'){openVocabEn(t.dataset.id,t.dataset.w);}
  else if(act==='ct-start-article'){const id=t.dataset.id;
    const a=DB.articles.find(x=>x.id===id);const b=levelBody(a,myLevel());
    let bi=-1,best=-1;b.paragraphs.forEach((p,i)=>{const len=p.join('').length;if(p.length>=3&&len>best){best=len;bi=i;}});
    if(bi<0){announce('이 글에는 연습용 문단이 없어요');return;}
    const p=b.paragraphs[bi];const q=b.questions.find(x=>x.evidencePara===bi)||b.questions[0];
    view={name:'train'};
    sess={ct:{articleId:id,paraIdx:bi,stage:1,marks:new Set(),model:modelBoundaries(p),checked:false,q,picked:null,score:0,hit:0,extra:0,qOk:false}};
    render();}
  /* ── 끊어 읽기 훈련 ── */
  else if(act==='ct-start'){const tp=pickTrainPara();if(!tp)return;
    const a=DB.articles.find(x=>x.id===tp.articleId);const b=levelBody(a,myLevel());
    const p=b.paragraphs[tp.paraIdx];
    const q=b.questions.find(x=>x.evidencePara===tp.paraIdx)||b.questions[0];
    sess.ct={articleId:tp.articleId,paraIdx:tp.paraIdx,stage:1,marks:new Set(),model:modelBoundaries(p),checked:false,q,picked:null,score:0,hit:0,extra:0,qOk:false};
    render();}
  else if(act==='ct-quit'){sess.ct=null;render();}
  else if(act==='ct-to2'){sess.ct.stage=2;render();}
  else if(act==='ct-gap'){const i=+t.dataset.i;const m=sess.ct.marks;if(m.has(i))m.delete(i);else m.add(i);render();}
  else if(act==='ct-check'){const ct=sess.ct;
    ct.hit=[...ct.marks].filter(i=>ct.model.has(i)).length;
    ct.extra=[...ct.marks].filter(i=>!ct.model.has(i)).length;
    ct.score=Math.max(0,Math.round((ct.hit-0.5*ct.extra)/Math.max(1,ct.model.size)*100));
    ct.checked=true;render();}
  else if(act==='ct-to3'){sess.ct.stage=3;render();}
  else if(act==='ct-pick'){const ct=sess.ct;if(ct.picked!=null)return;
    ct.picked=+t.dataset.i;ct.qOk=ct.picked===ct.q.answer;render();}
  else if(act==='ct-finish'){const ct=sess.ct;
    S.train.push({date:dkey(),articleId:ct.articleId,score:ct.score,qOk:ct.qOk});save();
    ct.stage=4;render();}
  /* ── 어휘 SRS 복습 ── */
  else if(act==='vs-start'){const due=dueVocab();if(!due.length)return;
    sess.vs={list:due.slice(0,10),i:0,show:false,ok:0,miss:0};render();}
  else if(act==='vs-show'){sess.vs.show=true;render();}
  else if(act==='vs-mark'){const vs=sess.vs;const v=vs.list[vs.i];
    const sv=S.vocab.find(x=>x.word===v.word);
    if(sv){if(t.dataset.ok==='1'){sv.box=Math.min(4,(sv.box||0)+1);sv.ok=(sv.ok||0)+1;vs.ok++;}
      else{sv.box=0;sv.miss=(sv.miss||0)+1;vs.miss++;}
      sv.last=dkey();save();}
    vs.i++;vs.show=false;render();}
  else if(act==='vs-done'){sess.vs=null;render();}
  /* ── 오답 노트 ── */
  else if(act==='wq-start'){if(!S.wrong.length)return;
    sess.wq={list:S.wrong.slice(0,10).map(w=>({...w})),i:0,picked:null,solved:0,again:0};render();}
  else if(act==='wq-pick'){const wq=sess.wq;if(!wq||wq.picked!=null)return;
    wq.picked=+t.dataset.i;
    const w=wq.list[wq.i];const res=wrongQuestion(w);
    if(res&&wq.picked===res.q.answer){removeWrong(w);wq.solved++;}
    else wq.again++;
    render();}
  else if(act==='wq-next'){const wq=sess.wq;wq.i++;wq.picked=null;render();}
  else if(act==='wq-done'){sess.wq=null;render();}
  /* ── 한자 카드 ── */
  else if(act==='hj-open'){sess.hjOpen=sess.hjOpen===t.dataset.ch?null:t.dataset.ch;render();}
  /* ── 붉은 책 요약 ── */
  else if(act==='rb-new'){sess.rb=true;sess.rbChecks=[false,false,false];sess.rbUnit='';sess.rbSum='';render();}
  else if(act==='rb-check'){sess.rbUnit=($('#rbUnit')||{}).value||'';sess.rbSum=($('#rbSum')||{}).value||'';
    const i=+t.dataset.i;sess.rbChecks[i]=!sess.rbChecks[i];render();}
  else if(act==='rb-save'){const unit=($('#rbUnit')||{}).value||'';const sum=($('#rbSum')||{}).value||'';
    if(!unit.trim()){announce('단원명을 적어 주세요');return;}
    if(sum.trim().length<50){announce('요약을 50자 이상 써 주세요 (지금 '+sum.trim().length+'자)');return;}
    S.redbook.push({date:dkey(),unit:unit.trim(),summary:sum.trim(),checks:sess.rbChecks});save();
    sess.rb=null;render();announce('요약 저장 완료');}
  else if(act==='rb-quit'){sess.rb=null;render();}
  else if(act==='rb-copy'){const txt=S.redbook.map(r=>`[${r.date}] ${r.unit}\n${r.summary}\n셀프체크: ${r.checks.filter(Boolean).length}/3`).join('\n\n');
    copyText('WB 붉은 책 요약 기록\n\n'+txt);}
  /* ── 탐구 랩 ── */
  else if(act==='lab-new'){S.lab={step:0,mats:[],topic:'',motive:'',learned:{},more:'',conclusion:'',reflect:'',title:'',name:'',checks:[false,false,false],started:dkey(),log:[dkey()]};save();render();}
  else if(act==='lab-hint'){const el=$('#labTopic');if(el){el.value=t.dataset.h;el.focus();}}
  else if(act==='lab-check'){labCollect();const L=S.lab;if(!L)return;
    L.checks=L.checks||[false,false,false];
    const i=+t.dataset.i;L.checks[i]=!L.checks[i];save();render();}
  else if(act==='lab-mat'){const id=t.dataset.id;const m=S.lab.mats;const i=m.indexOf(id);
    if(i>=0)m.splice(i,1);else m.push(id);save();render();}
  else if(act==='lab-back'){labCollect();S.lab.step=Math.max(0,S.lab.step-1);save();render();}
  else if(act==='lab-next'){const L=S.lab;
    if(L.step===0&&!L.mats.length){announce('재료를 1편 이상 골라 주세요');return;}
    labCollect();
    if(L.step===1&&!L.topic.trim()){announce('탐구 질문을 한 문장 써 주세요');return;}
    if(L.step===2&&L.motive.trim().length<10){announce('동기를 조금만 더 써 주세요');return;}
    if(L.step===5&&!L.conclusion.trim()){announce('결론을 써 주세요');return;}
    L.step=Math.min(6,L.step+1);L.log.push(dkey());save();render();}
  else if(act==='lab-quit'){labCollect();save();go('lab');announce('임시 저장했어요');}
  else if(act==='lab-finish'){labCollect();const L=S.lab;
    if(!L.title.trim()){announce('제목을 붙여 주세요');return;}
    if(!(L.checks||[]).every(Boolean)){announce('마지막 점검 3가지를 모두 확인해 주세요');return;}
    S.reports.push({...L,done:dkey()});S.lab=null;save();
    sess.labView=S.reports.length-1;render();announce('보고서 완성!');}
  else if(act==='lab-view'){sess.labView=+t.dataset.i;sess.confirmDelReport=false;render();}
  else if(act==='lab-close-view'){sess.labView=null;sess.confirmDelReport=false;render();}
  else if(act==='lab-copy-doc'){copyText(reportText(S.reports[sess.labView]));}
  else if(act==='lab-print'){printReport(S.reports[sess.labView]);}
  else if(act==='lab-edit'){
    if(S.lab){announce('쓰던 보고서가 있어요 — 먼저 완성하거나 저장하고 나가기 해 주세요');return;}
    const i=sess.labView;const r=S.reports[i];if(!r)return;
    S.reports.splice(i,1);
    S.lab={...r,step:6};delete S.lab.done;save();
    sess.labView=null;sess.confirmDelReport=false;render();announce('수정 모드로 열었어요 — 완성하면 다시 저장돼요');}
  else if(act==='lab-del'){sess.confirmDelReport=true;render();}
  else if(act==='lab-del-no'){sess.confirmDelReport=false;render();}
  else if(act==='lab-del-yes'){S.reports.splice(sess.labView,1);save();
    sess.labView=null;sess.confirmDelReport=false;render();announce('보고서를 삭제했어요');}
  else if(act==='lv-hint-later'){S.lvhint=dkey();save();render();}
  else if(act==='lv-hint-go'){const to=t.dataset.lv;if(!LEVELS.includes(to))return;
    S.profile.level=to;S.lvhint=dkey();save();render();announce('레벨 변경: '+LEVEL_LABEL[to]);}
  else if(act==='reset-ask'){sess.confirmReset=true;render();}
  else if(act==='reset-no'){sess.confirmReset=false;render();}
  else if(act==='reset-yes'){localStorage.removeItem(KEY);S=loadState();go('onboard');}
});
function labCollect(){
  const L=S.lab;if(!L)return;
  const g=id=>{const el=document.getElementById(id);return el?el.value:null;};
  const tv=g('labTopic');if(tv!=null)L.topic=tv;
  const mv=g('labMotive');if(mv!=null)L.motive=mv;
  const mo=g('labMore');if(mo!=null)L.more=mo;
  const co=g('labConc');if(co!=null)L.conclusion=co;
  const re=g('labRef');if(re!=null)L.reflect=re;
  const ti=g('labTitle');if(ti!=null)L.title=ti;
  const nm=g('labName');if(nm!=null)L.name=nm;
  document.querySelectorAll('[data-learn]').forEach(el=>{L.learned[el.dataset.learn]=el.value;});
}
window.addEventListener('scroll',()=>{
  if(view.name!=='reader')return;
  const el=document.getElementById('progTop');if(!el)return;
  const h=document.documentElement;const max=h.scrollHeight-h.clientHeight;
  el.style.width=(max>0?Math.min(100,h.scrollTop/max*100):100)+'%';
},{passive:true});
document.addEventListener('change',e=>{
  const t=e.target.closest('[data-act-change]');if(!t)return;
  if(t.dataset.actChange==='level'){S.profile.level=t.value;save();render();announce('레벨 변경: '+LEVEL_LABEL[t.value]);}
});

/* ───────────────────────── PWA ───────────────────────── */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferredPrompt=e;
  if(view.name==='settings')render();
});
window.addEventListener('appinstalled',()=>{
  deferredPrompt=null;announce('앱 설치 완료!');
  if(view.name==='settings')render();
});

/* ───────────────────────── 부팅 ───────────────────────── */
(async function boot(){
  const gradesReady=loadHanjaGrades();   /* 지문과 동시에 — 급수는 라벨이라 실패해도 앱은 돈다 */
  try{
    const res=await fetch('./articles.json',{cache:'no-store'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    DB=await res.json();
    if(!DB||!Array.isArray(DB.articles)||!DB.diagnostics)throw new Error('bad data');
  }catch(err){
    $('#app').innerHTML='<div class="card"><div class="empty">글 데이터를 불러오지 못했어요.<br>인터넷 연결을 확인하고 새로고침해 주세요.</div><button class="btn" id="reloadBtn">새로고침</button></div>';
    $('#app').removeAttribute('aria-busy');
    $('#reloadBtn').addEventListener('click',()=>location.reload());
    return;
  }
  await gradesReady;
  await syncHealth();
  if(SYNC.avail&&SYNC.auth)await syncPull();
  view={name:S.profile?'home':'onboard'};
  render();
})();
</script>
</body>
</html>
