<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#203c63">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Cache-Control" content="no-store">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src 'self'; img-src 'self' data:; manifest-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <title>WB 보호자 학습 리포트</title>
  <style>
    :root{--navy:#203c63;--blue:#386fc3;--sky:#eef5ff;--ink:#22354d;--muted:#68778b;--line:#dce4ee;--paper:#fff;--bg:#f4f6f9;--ok:#14745c;--warn:#98600d;--bad:#a63a35}
    *{box-sizing:border-box}html{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}body{margin:0;min-width:280px}button{font:inherit}button:focus-visible,[tabindex]:focus-visible{outline:3px solid #74a8ee;outline-offset:3px}
    header{position:sticky;top:0;z-index:5;padding:max(10px,env(safe-area-inset-top)) 14px 10px;background:var(--navy);color:#fff;box-shadow:0 4px 18px #203c6328}.head{max-width:720px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:17px;font-weight:900;line-height:1.2}.brand small{display:block;margin-top:2px;font-size:10px;opacity:.7;letter-spacing:.08em}.head-actions{display:flex;gap:7px}.headbtn{min-height:44px;padding:0 11px;border:1px solid #ffffff70;border-radius:12px;background:transparent;color:#fff;font-size:13px;font-weight:850}
    main{max-width:720px;margin:auto;padding:16px 12px calc(36px + env(safe-area-inset-bottom))}.card,.report-detail{margin-bottom:13px;padding:18px;border:1px solid var(--line);border-radius:19px;background:var(--paper);box-shadow:0 6px 20px #203c630b;overflow-wrap:anywhere}.hero{border-color:#cbdcf4;background:linear-gradient(145deg,#edf5ff,#fff 72%)}h1,h2,h3,p{margin:0}h1{color:var(--navy);font-size:25px;line-height:1.25}h2{color:var(--navy);font-size:19px;line-height:1.35}h3{color:var(--navy);font-size:15px}.eyebrow{margin-bottom:5px;color:var(--blue);font-size:11px;font-weight:900;letter-spacing:.09em;text-transform:uppercase}.sub{margin-top:6px;color:var(--muted);font-size:13px;line-height:1.55}.between,.card-head,.detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:13px}.card-head{padding-bottom:13px;border-bottom:1px solid var(--line)}.pill{flex:0 0 auto;padding:5px 9px;border-radius:999px;background:var(--sky);color:var(--blue);font-size:12px;font-weight:900}.pill.ok{background:#e6f5ef;color:var(--ok)}.pill.warn{background:#fff4df;color:var(--warn)}
    .report-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.report-card{display:flex;min-width:0;flex-direction:column}.report-card .actions{margin-top:auto}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:14px}.stat{min-width:0;padding:11px 4px;border:1px solid #d8e5f5;border-radius:13px;background:#f6f9fe;text-align:center}.stat b{display:block;color:var(--navy);font-size:20px;line-height:1.15}.stat span{display:block;margin-top:4px;color:var(--muted);font-size:11px;font-weight:800;line-height:1.25}.actions{display:flex;gap:8px;margin-top:14px}.btn{min-height:46px;padding:0 15px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-weight:900}.btn.alt{border:1px solid var(--line);background:#fff;color:var(--navy)}.btn:disabled{opacity:.55;cursor:not-allowed}.actions .btn{flex:1}
    .loading,.empty{padding:52px 18px;text-align:center;color:var(--muted);line-height:1.65}.empty{padding:30px 12px}.spinner{display:block;width:30px;height:30px;margin:0 auto 14px;border:3px solid #dbe5f1;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.error{border-color:#efb9b3;background:#fff8f7}.error h2{color:var(--bad)}
    .report-detail{padding:22px}.detail-head{padding-bottom:15px;border-bottom:2px solid var(--navy)}.detail-section{padding-top:18px}.detail-section+.detail-section{margin-top:18px;border-top:1px solid var(--line)}.subject-list,.day-list,.task-list{margin-top:10px;border:1px solid var(--line);border-radius:14px;overflow:hidden}.subject-row,.day-row,.task-row{display:grid;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid var(--line);font-size:13px}.subject-row:first-child,.day-row:first-child,.task-row:first-child{border-top:0}.subject-row{grid-template-columns:minmax(90px,1fr) auto auto}.day-row{grid-template-columns:88px 1fr auto}.task-row{grid-template-columns:88px minmax(0,1fr) auto}.row-title{font-weight:850}.row-meta{color:var(--muted);font-size:12px}.bar{height:7px;margin-top:6px;border-radius:99px;background:#e5ebf2;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:var(--blue)}.narrative{margin-top:9px;padding:14px;border-radius:13px;background:#f6f8fb;white-space:pre-wrap;font-size:14px;line-height:1.7}.notice{max-width:860px;margin:12px auto 0;padding:12px 16px;border-radius:12px;background:#fff1ef;border:1px solid #f5b8b0;color:#8f2f23;font-weight:750}.notice[hidden]{display:none}.print-mark{display:none}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:580px){.report-grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.report-detail{padding:17px}.task-row{grid-template-columns:75px minmax(0,1fr)}.task-row .pill{grid-column:2;justify-self:start}.headbtn{padding:0 9px}}
    @media(max-width:350px){.between,.card-head,.detail-head{flex-direction:column}.actions{flex-direction:column}.actions .btn{width:100%}.subject-row,.day-row{grid-template-columns:1fr}.head-actions{gap:4px}.headbtn{font-size:12px}}
    @media(prefers-reduced-motion:reduce){.spinner{animation:none}}
    @media print{@page{size:A4;margin:14mm}.screen-only{display:none!important}html,body{background:#fff}main{max-width:none;padding:0}.report-detail{display:block!important;margin:0;padding:0;border:0;box-shadow:none}.print-mark{display:block;margin-bottom:12px;color:var(--muted);font-size:10px}.detail-section{break-inside:avoid}.subject-row,.day-row,.task-row{break-inside:avoid}.narrative{background:#fff;border:1px solid var(--line)}.pill{border:1px solid var(--line)}}
  </style>
</head>
<body>
  <header class="screen-only"><div class="head"><div class="brand">WB 보호자<small>학습 리포트</small></div><div class="head-actions"><button class="headbtn" id="refreshButton" type="button" hidden>새로고침</button><button class="headbtn" id="logoutButton" type="button" hidden>로그아웃</button></div></div></header>
  <div id="portalNotice" class="notice screen-only" role="alert" hidden></div>
  <main id="app" aria-busy="true"><div class="loading" role="status"><span class="spinner" aria-hidden="true"></span>보호자 리포트를 확인하고 있습니다.</div></main>
  <div id="liveStatus" class="sr" role="status" aria-live="polite" aria-atomic="true"></div>
  <script>
  'use strict';
  const API='/consult-guardian';
  const app=document.getElementById('app'),refreshButton=document.getElementById('refreshButton'),logoutButton=document.getElementById('logoutButton'),liveStatus=document.getElementById('liveStatus'),portalNotice=document.getElementById('portalNotice');
  let currentData=null,currentReports=new Map(),busy=false,lastRefreshAt=0,pendingInviteCode='',reportReturnFocus=null,currentDetailType='';
  const esc=value=>String(value==null?'':value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const num=(value,max=999999)=>Math.min(max,Math.max(0,Number.isFinite(Number(value))?Number(value):0));
  const integer=(value,max)=>Math.round(num(value,max));
  const safeDate=value=>/^\d{4}-\d{2}-\d{2}$/.test(String(value||''))?String(value):'';
  const typeLabel=type=>type==='week'?'주간 리포트':type==='month'?'월간 리포트':'';
  const statusLabel=status=>({done:['완료','ok'],blocked:['보류','warn'],doing:['진행 중','warn'],todo:['예정','']}[status]||['확인','']);
  function minutes(value){const min=Math.round(num(value,31536000)/60);return min>=60?Math.floor(min/60)+'시간 '+(min%60?min%60+'분':''):min+'분'}
  function stamp(value){const n=Number(value);if(!Number.isFinite(n)||n<=0)return '';return new Date(n).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'})}
  function period(report){const start=safeDate(report.periodStart||report.snapshot&&report.snapshot.periodStart),end=safeDate(report.periodEnd||report.snapshot&&report.snapshot.periodEnd);return start&&end?start+' ~ '+end:esc(report.periodKey||'기간 확인 중')}
  async function post(body){
    const response=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',cache:'no-store',body:JSON.stringify(Object.assign({app:'consult'},body))});
    let data={};try{data=await response.json()}catch(error){}
    if(!response.ok||data.ok!==true){const failure=new Error(data.error||'보호자 리포트를 불러오지 못했습니다.');failure.status=response.status;failure.code=data.code||'';throw failure}return data;
  }
  function latestReports(rows){
    const latest=new Map();
    (Array.isArray(rows)?rows:[]).forEach(report=>{
      if(!report||!typeLabel(report.reportType)||typeof report.id!=='string')return;
      const before=latest.get(report.reportType),rank=Number(report.publishedAt)||0,beforeRank=before&&(Number(before.publishedAt)||0);
      if(!before||rank>beforeRank||(rank===beforeRank&&String(report.periodEnd||report.periodKey||'')>String(before.periodEnd||before.periodKey||''))||(rank===beforeRank&&String(report.periodEnd||report.periodKey||'')===String(before.periodEnd||before.periodKey||'')&&integer(report.reportRevision,999999)>integer(before.reportRevision,999999)))latest.set(report.reportType,report);
    });
    return ['week','month'].map(type=>latest.get(type)).filter(Boolean);
  }
  function summaryOf(report){const snapshot=report&&report.snapshot&&typeof report.snapshot==='object'?report.snapshot:{},summary=snapshot.summary&&typeof snapshot.summary==='object'?snapshot.summary:{};return {snapshot,summary,done:integer(summary.done,99999),total:integer(summary.total,99999),pct:integer(summary.pct,100),blocked:integer(summary.blocked,99999),studySecs:num(summary.studySecs,31536000)}}
  function subjectLabel(value){return ({korean:'국어',english:'영어',math:'수학',social:'사회',science:'과학',other:'기타'})[String(value||'')]||'기타'}
  function reportCard(report){
    const values=summaryOf(report),ack=stamp(report.acknowledgedAt),published=stamp(report.publishedAt),partial=report.isPartial===true||values.snapshot.isPartial===true;
    return '<article class="card report-card"><div class="card-head"><div><p class="eyebrow">'+esc(report.reportType)+'</p><h2>'+typeLabel(report.reportType)+'</h2><p class="sub">'+esc(period(report))+'</p></div><span class="pill '+(ack?'ok':'warn')+'">'+(ack?'확인 완료':'확인 전')+'</span></div><div class="stats"><div class="stat"><b>'+values.pct+'%</b><span>수행률</span></div><div class="stat"><b>'+values.done+'/'+values.total+'</b><span>할 일</span></div><div class="stat"><b>'+esc(minutes(values.studySecs))+'</b><span>학습</span></div><div class="stat"><b>'+values.blocked+'</b><span>보류</span></div></div><p class="sub">'+(published?'발행 '+esc(published):'발행 시각 확인 중')+' · '+integer(report.reportRevision,999999)+'판'+(partial?' · 진행 중 기간':'')+'</p><div class="actions"><button class="btn" type="button" data-open="'+report.reportType+'">상세 보기</button>'+(ack?'<button class="btn alt" type="button" disabled aria-disabled="true">확인했어요</button>':'<button class="btn alt" type="button" data-ack="'+report.reportType+'">확인했어요</button>')+'</div></article>';
  }
  function subjectRows(subjects){
    const rows=Array.isArray(subjects)?subjects:Object.values(subjects&&typeof subjects==='object'?subjects:{});
    return rows.slice(0,20).map(row=>{const done=integer(row&&row.done,99999),total=integer(row&&row.total,99999),pct=total?Math.round(done/total*100):0;return '<div class="subject-row"><div><div class="row-title">'+esc(row&&row.label||'과목')+'</div><div class="bar" aria-label="수행률 '+pct+'%"><i style="width:'+pct+'%"></i></div></div><span class="row-meta">'+done+'/'+total+' 완료</span><span class="row-meta">'+esc(minutes(row&&row.studySecs))+'</span></div>'}).join('');
  }
  function dayRows(days){return (Array.isArray(days)?days:[]).slice(0,31).map(row=>{const done=integer(row&&row.done,9999),total=integer(row&&row.total,9999);return '<div class="day-row"><b>'+esc(safeDate(row&&row.date)||'날짜 확인')+'</b><span class="row-meta">'+done+'/'+total+' 완료</span><span class="row-meta">'+esc(minutes(row&&row.studySecs))+'</span></div>'}).join('')}
  function taskRows(rows){return (Array.isArray(rows)?rows:[]).slice(0,120).map(row=>{const state=statusLabel(row&&row.status);return '<div class="task-row"><span class="row-meta">'+esc(safeDate(row&&row.date)||'')+'</span><div><div class="row-title">'+esc(row&&row.title||'학습 항목')+'</div><div class="row-meta">'+subjectLabel(row&&row.subject)+'</div></div><span class="pill '+state[1]+'">'+state[0]+'</span></div>'}).join('')}
  function reportDetail(report,studentName){
    const values=summaryOf(report),snapshot=values.snapshot,subjects=subjectRows(snapshot.subjects),days=dayRows(snapshot.days),rows=taskRows(snapshot.rows),reflection=String(snapshot.reflection||'').trim(),directorFeedback=String(snapshot.directorNote||'').trim(),nextFocus=String(snapshot.nextFocus||'').trim(),ack=stamp(report.acknowledgedAt),published=stamp(report.publishedAt);
    return '<article id="reportDetail" class="report-detail" tabindex="-1"><div class="print-mark">WB 보호자 학습 리포트 · 발행 시점 학생 기록 기준</div><div class="detail-head"><div><p class="eyebrow">'+esc(report.reportType)+'</p><h1>'+esc(studentName||'학생')+' '+typeLabel(report.reportType)+'</h1><p class="sub">'+esc(period(report))+' · 발행 시점 학생 기록 기준</p></div><span class="pill '+(ack?'ok':'warn')+'">'+(ack?'확인 완료':'확인 전')+'</span></div><div class="stats"><div class="stat"><b>'+values.pct+'%</b><span>수행률</span></div><div class="stat"><b>'+values.done+'/'+values.total+'</b><span>완료/전체</span></div><div class="stat"><b>'+esc(minutes(values.studySecs))+'</b><span>총 학습</span></div><div class="stat"><b>'+values.blocked+'</b><span>보류</span></div></div>'+(subjects?'<section class="detail-section"><h2>과목별 학습</h2><div class="subject-list">'+subjects+'</div></section>':'')+(days?'<section class="detail-section"><h2>날짜별 기록</h2><div class="day-list">'+days+'</div></section>':'')+(rows?'<section class="detail-section"><h2>학습 항목</h2><div class="task-list">'+rows+'</div></section>':'')+(reflection?'<section class="detail-section"><h2>학생 돌아보기</h2><div class="narrative">'+esc(reflection)+'</div></section>':'')+(directorFeedback?'<section class="detail-section"><h2>원장 피드백</h2><div class="narrative">'+esc(directorFeedback)+'</div></section>':'')+(nextFocus?'<section class="detail-section"><h2>다음 집중 목표</h2><div class="narrative">'+esc(nextFocus)+'</div></section>':'')+'<p class="sub detail-section">'+(published?'발행 '+esc(published):'발행 시각 확인 중')+' · '+integer(report.reportRevision,999999)+'판'+(ack?' · 확인 '+esc(ack):'')+'</p><div class="actions screen-only"><button class="btn alt" type="button" data-close>목록으로</button><button class="btn" type="button" data-print>인쇄 · PDF 저장</button></div></article>';
  }
  function render(data){
    currentData=data;const reports=latestReports(data.reports),student=data.student&&typeof data.student==='object'?data.student:{};currentReports=new Map(reports.map(report=>[report.reportType,report]));
    portalNotice.hidden=true;portalNotice.textContent='';
    refreshButton.hidden=false;logoutButton.hidden=false;app.setAttribute('aria-busy','false');
    app.innerHTML='<div id="reportList" class="screen-only"><section class="card hero"><div class="between"><div><p class="eyebrow">Learning report</p><h1>'+esc(student.name||'학생')+' 보호자 리포트</h1></div><span class="pill">읽기 전용</span></div><p class="sub">학원에서 발행한 최신 주간·월간 기록만 보여드립니다.</p></section>'+(reports.length?'<div class="report-grid">'+reports.map(reportCard).join('')+'</div>':'<section class="card"><div class="empty"><b>아직 발행된 리포트가 없습니다.</b><br>리포트가 발행되면 이 화면에서 확인할 수 있습니다.</div></section>')+'</div>';
    liveStatus.textContent='보호자 리포트를 새로고침했습니다.';
  }
  function fail(message,closed){
    if(closed){refreshButton.hidden=true;logoutButton.hidden=true;currentReports.clear()}app.setAttribute('aria-busy','false');
    app.innerHTML='<section class="card error" role="alert" tabindex="-1"><h2>리포트를 열 수 없습니다</h2><p class="sub">'+esc(message)+'</p>'+(closed?'':'<div class="actions"><button class="btn" type="button" data-retry>다시 시도</button></div>')+'</section>';const alert=app.querySelector('[role="alert"]');if(alert)alert.focus();
  }
  async function refresh(force){
    if(busy||(!force&&Date.now()-lastRefreshAt<1000))return;busy=true;refreshButton.disabled=true;
    try{const data=await post({action:'view'});lastRefreshAt=Date.now();render(data)}catch(error){fail(error.message,error.status===401||error.status===410)}finally{busy=false;refreshButton.disabled=false}
  }
  function openReport(type,print,trigger){const report=currentReports.get(type);if(!report||!currentData)return;reportReturnFocus=trigger||document.activeElement;currentDetailType=type;const old=document.getElementById('reportDetail');if(old)old.remove();app.insertAdjacentHTML('beforeend',reportDetail(report,currentData.student&&currentData.student.name));document.getElementById('reportList').hidden=true;const detail=document.getElementById('reportDetail');detail.focus();if(print)requestAnimationFrame(()=>window.print())}
  function closeReport(){const detail=document.getElementById('reportDetail');if(detail)detail.remove();const list=document.getElementById('reportList');if(list){list.hidden=false;const direct=reportReturnFocus&&reportReturnFocus.isConnected?reportReturnFocus:list.querySelector('[data-open="'+currentDetailType+'"]');reportReturnFocus=null;currentDetailType='';if(direct)direct.focus()}}
  async function acknowledge(type,button){
    const report=currentReports.get(type);if(!report||busy)return;busy=true;button.disabled=true;app.setAttribute('aria-busy','true');
    try{let data=await post({action:'ack',reportId:report.id,reportRevision:integer(report.reportRevision,999999)});if(!Array.isArray(data.reports))data=await post({action:'view'});render(data);liveStatus.textContent=typeLabel(type)+'를 확인했습니다.'}catch(error){if(error.status===401||error.status===410)fail(error.message,true);else{button.disabled=false;portalNotice.textContent=error.message;portalNotice.hidden=false;liveStatus.textContent=error.message}}finally{busy=false;app.setAttribute('aria-busy','false')}
  }
  async function connectPortal(){
    if(busy)return;busy=true;refreshButton.disabled=true;app.setAttribute('aria-busy','true');
    const code=pendingInviteCode;
    try{let data=code?await post({action:'exchange',code}):await post({action:'view'});pendingInviteCode='';if(!Array.isArray(data.reports))data=await post({action:'view'});lastRefreshAt=Date.now();render(data)}catch(error){const terminal=[400,401,403,404,409,410,422].includes(Number(error.status));if(terminal)pendingInviteCode='';fail(error.message,terminal)}finally{busy=false;refreshButton.disabled=false;app.setAttribute('aria-busy','false')}
  }
  async function boot(){
    const fragment=location.hash,code=new URLSearchParams(fragment.replace(/^#/,'')).get('code')||'';
    if(code)pendingInviteCode=code;
    if(fragment)history.replaceState(null,'',location.pathname+location.search);
    return connectPortal();
  }
  app.addEventListener('click',event=>{const open=event.target.closest('[data-open]');if(open)return openReport(open.dataset.open,false,open);const ack=event.target.closest('[data-ack]');if(ack)return acknowledge(ack.dataset.ack,ack);if(event.target.closest('[data-close]'))return closeReport();if(event.target.closest('[data-print]'))return window.print();if(event.target.closest('[data-logout-retry]'))return logout();if(event.target.closest('[data-retry]'))return pendingInviteCode?connectPortal():refresh(true)});
  refreshButton.addEventListener('click',()=>refresh(true));
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!logoutButton.hidden)refresh(false)});
  window.addEventListener('focus',()=>{if(!logoutButton.hidden)refresh(false)});
  async function logout(){
    if(busy)return;busy=true;logoutButton.disabled=true;
    try{
      await post({action:'logout'});refreshButton.hidden=true;logoutButton.hidden=true;currentReports.clear();currentData=null;
      app.innerHTML='<section class="card"><div class="empty"><b>로그아웃했습니다.</b><br>다시 이용하려면 학원에서 받은 새 초대 링크를 열어 주세요.</div></section>';liveStatus.textContent='로그아웃했습니다.';
    }catch(error){
      refreshButton.hidden=true;logoutButton.hidden=false;currentReports.clear();currentData=null;
      app.innerHTML='<section class="card error" role="alert" tabindex="-1"><h2>로그아웃하지 못했습니다</h2><p class="sub">'+esc(error.message||'인터넷 연결을 확인한 뒤 다시 시도해 주세요.')+'</p><div class="actions"><button class="btn" type="button" data-logout-retry>로그아웃 다시 시도</button></div></section>';const alert=app.querySelector('[role="alert"]');if(alert)alert.focus();liveStatus.textContent='로그아웃하지 못했습니다. 다시 시도해 주세요.';
    }finally{busy=false;logoutButton.disabled=false}
  }
  logoutButton.addEventListener('click',logout);
  boot();
  </script>
</body>
</html>
