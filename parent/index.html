<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1b3a5c">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>WB 보호자</title>
  <style>
    :root{--navy:#1b3a5c;--blue:#0f7aab;--sky:#eaf6fc;--bg:#f4f7f9;--line:#dbe4ea;--muted:#667785;--ok:#147d64;--warn:#92400e;--bad:#9e3629;--white:#fff}
    *{box-sizing:border-box}html{background:var(--bg);color:var(--navy);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}body{margin:0;min-width:280px}button{font:inherit}
    header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:max(13px,env(safe-area-inset-top)) 16px 13px;box-shadow:0 2px 12px #1b3a5c33}.head{max-width:560px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:18px;font-weight:900}.brand small{display:block;font-size:10px;opacity:.72;letter-spacing:.08em}.logout{min-width:44px;min-height:44px;border:1px solid #ffffff55;border-radius:10px;background:transparent;color:#fff;font-weight:800}
    main{max-width:560px;margin:auto;padding:14px 14px calc(28px + env(safe-area-inset-bottom))}.card{margin-bottom:12px;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--white);box-shadow:0 2px 9px #1b3a5c0d}.hero{border-color:#b9ddf0;background:linear-gradient(145deg,#eef9ff,#fff 72%)}h1,h2,p{margin:0}h1{font-size:22px}h2{margin-bottom:10px;font-size:15px}.sub{margin-top:4px;color:var(--muted);font-size:12px;line-height:1.55}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.stat{padding:11px 8px;border-radius:12px;background:var(--sky);text-align:center}.stat b{display:block;font-size:20px}.stat span{display:block;margin-top:3px;color:var(--muted);font-size:10.5px;font-weight:800}.row{padding:11px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}.between{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.tag{display:inline-block;padding:3px 8px;border-radius:999px;background:var(--sky);color:var(--blue);font-size:10.5px;font-weight:900}.tag.warn{background:#fff7ed;color:var(--warn)}.tag.bad{background:#fff1f1;color:var(--bad)}.text{margin-top:7px;white-space:pre-wrap;color:#263f55;font-size:13px;line-height:1.65}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.btn{min-height:46px;border:0;border-radius:11px;background:var(--navy);color:#fff;font-weight:900}.btn.alt{border:1px solid var(--line);background:#fff;color:var(--navy)}.empty{padding:19px 8px;color:var(--muted);text-align:center;font-size:13px;line-height:1.6}.error{border-color:#efb6ae;background:#fff7f5;color:var(--bad)}.loading{padding:40px 16px;text-align:center;color:var(--muted)}.install{font-size:12px;line-height:1.65}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:360px){.grid,.actions{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><div class="head"><div class="brand">WB 보호자<small>WEXLER BRAIN CENTER</small></div><button class="logout" id="logout" type="button" hidden>로그아웃</button></div></header>
  <main id="app" aria-live="polite"><div class="loading">보호자 정보를 확인하고 있습니다.</div></main>
  <script>
  'use strict';
  const API='/parent-portal';
  const app=document.getElementById('app'),logout=document.getElementById('logout');
  const esc=value=>String(value==null?'':value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  async function post(body){
    const response=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',credentials:'include',body:JSON.stringify(Object.assign({app:'task'},body))});
    let data={};try{data=await response.json()}catch(error){}
    if(!response.ok||!data.ok){const e=new Error(data.error||'보호자 정보를 불러오지 못했습니다');e.status=response.status;e.code=data.code||'';throw e}return data;
  }
  function section(title,rows,empty){return '<section class="card"><h2>'+esc(title)+'</h2>'+(rows&&rows.length?rows.join(''):'<div class="empty">'+esc(empty)+'</div>')+'</section>'}
  function scheduleRows(rows){return (rows||[]).map(row=>'<div class="row between"><div><b>'+esc(row.subject||row.className||'수업')+'</b><div class="sub">'+esc(row.teacherName||'담당 선생님')+'</div></div><div style="text-align:right"><b>'+esc(row.dayLabel||'')+'</b><div class="sub">'+esc(row.timeLabel||'시간 확인 중')+'</div></div></div>')}
  function makeupRows(rows){return (rows||[]).map(row=>'<div class="row" data-makeup="'+esc(row.caseId)+'"><div class="between"><div><b>'+esc(row.subject||'보강 수업')+'</b><div class="sub">원 수업 '+esc(row.sourceDate||'')+'</div></div><span class="tag '+(row.status==='confirmed'?'':'warn')+'">'+esc(row.statusLabel||row.status)+'</span></div>'+(row.confirmedDate?'<div class="text">'+esc(row.confirmedDate)+' '+esc(row.confirmedTime||'')+' · '+esc(row.teacherName||'담당 확인 중')+'</div>':'')+(row.canRespond?'<div class="actions"><button class="btn" type="button" data-response="accept" data-id="'+esc(row.caseId)+'" data-rev="'+Number(row.revision||0)+'">참석 가능</button><button class="btn alt" type="button" data-response="decline" data-id="'+esc(row.caseId)+'" data-rev="'+Number(row.revision||0)+'">일정 재조율</button></div>':'')+'</div>')}
  function packRows(rows){return (rows||[]).map(row=>'<div class="row"><div class="between"><div><b>'+esc(row.subject||row.className||'횟수제 수업')+'</b><div class="sub">'+esc(row.validUntil?row.validUntil+'까지':'유효기간 확인 중')+'</div></div><span class="tag">남음 '+Number(row.remaining||0)+'회</span></div><div class="grid"><div class="stat"><b>'+Number(row.total||0)+'</b><span>등록</span></div><div class="stat"><b>'+Number(row.used||0)+'</b><span>사용</span></div></div></div>')}
  function feedbackRows(rows){return (rows||[]).map(row=>'<details class="row"><summary><b>'+esc(row.feedbackDate||'수업 피드백')+'</b> <span class="tag">'+esc(row.statusLabel||'접수')+'</span></summary><div class="text">'+esc(row.message||'')+'</div><div class="sub">'+esc(row.teacherName||'담당 선생님')+'</div></details>')}
  function render(data){
    logout.hidden=false;
    const student=data.student||{},summary=data.summary||{};
    app.innerHTML='<section class="card hero"><h1>'+esc(student.name||'학생')+' <span class="tag">'+esc(student.grade||'')+'</span></h1><p class="sub">확정된 학원 운영 정보를 확인할 수 있습니다.</p><div class="grid"><div class="stat"><b>'+Number(summary.makeupPending||0)+'</b><span>보강 확인</span></div><div class="stat"><b>'+Number(summary.sessionRemaining||0)+'</b><span>남은 회차</span></div></div></section>'+section('이번 주 시간표',scheduleRows(data.schedule),'확정된 시간표가 없습니다.')+section('보강 일정',makeupRows(data.makeups),'확인할 보강 일정이 없습니다.')+section('횟수제 수업',packRows(data.sessionPacks),'횟수제로 지정된 수업이 없습니다.')+section('수업 피드백',feedbackRows(data.feedback),'아직 공개된 수업 피드백이 없습니다.')+'<section class="card install"><b>패드·휴대폰에 설치</b><p class="sub">Chrome 또는 Safari 메뉴에서 “홈 화면에 추가”를 선택하세요. 공용 기기에서는 사용하지 마세요.</p></section>';
  }
  function fail(message,clear){if(clear)logout.hidden=true;app.innerHTML='<section class="card error"><h2>확인이 필요합니다</h2><p class="text">'+esc(message)+'</p></section>'}
  async function refresh(){try{const data=await post({action:'view'});render(data)}catch(error){fail(error.message,error.status===401||error.status===410)}}
  async function boot(){
    const params=new URLSearchParams(location.hash.replace(/^#/,'')),code=params.get('code')||'';
    if(code){history.replaceState(null,'',location.pathname+location.search);try{await post({action:'exchange',code})}catch(error){return fail(error.message,true)}}
    await refresh();
  }
  app.addEventListener('click',async event=>{const button=event.target.closest('[data-response]');if(!button)return;button.disabled=true;try{await post({action:'respond',caseId:button.dataset.id,revision:Number(button.dataset.rev),response:button.dataset.response});await refresh()}catch(error){fail(error.message,false)}finally{button.disabled=false}});
  logout.addEventListener('click',async()=>{logout.hidden=true;try{await post({action:'logout'})}catch(error){}fail('로그아웃했습니다. 다시 이용하려면 새 초대 링크가 필요합니다.',false)});
  boot();
  </script>
</body>
</html>
