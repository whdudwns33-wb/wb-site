<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173957">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>WB 보호자</title>
  <style>
    :root{--navy:#173957;--blue:#096f9f;--sky:#eaf6fc;--bg:#f3f6f8;--line:#dce5ea;--muted:#647684;--ink:#20384c;--ok:#14755e;--warn:#8a4b08;--bad:#9b352b;--white:#fff}
    *{box-sizing:border-box}html{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}body{margin:0;min-width:280px}button{font:inherit}button:focus-visible,summary:focus-visible{outline:3px solid #55b8e5;outline-offset:2px}
    header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:max(11px,env(safe-area-inset-top)) 14px 11px;box-shadow:0 4px 18px #17395730}.head{max-width:560px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:18px;font-weight:900;line-height:1.1}.brand small{display:block;margin-top:3px;font-size:9px;opacity:.72;letter-spacing:.1em}.head-actions{display:flex;gap:7px}.headbtn{min-width:44px;min-height:44px;padding:0 10px;border:1px solid #ffffff66;border-radius:12px;background:transparent;color:#fff;font-size:13px;font-weight:850}
    main{max-width:560px;margin:auto;padding:14px 12px calc(30px + env(safe-area-inset-bottom))}.card{margin-bottom:12px;padding:17px;border:1px solid var(--line);border-radius:18px;background:var(--white);box-shadow:0 5px 18px #1739570a;overflow-wrap:anywhere}.hero{padding:19px;border-color:#b9deed;background:linear-gradient(145deg,#eaf7fd 0,#fff 70%)}h1,h2,h3,p{margin:0}h1{color:var(--navy);font-size:24px;line-height:1.25}h2{color:var(--navy);font-size:18px;line-height:1.3}.eyebrow{margin-bottom:5px;color:var(--blue);font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.hero-head,.section-head,.between{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.date-pill{flex:0 0 auto;padding:6px 9px;border-radius:999px;background:#fff;color:var(--blue);font-size:12px;font-weight:900;box-shadow:inset 0 0 0 1px #cce7f2}.sub{margin-top:5px;color:var(--muted);font-size:13px;line-height:1.55}.summary-grid,.usage-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:15px}.usage-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{min-width:0;padding:11px 4px;border:1px solid #d6ebf4;border-radius:13px;background:#f5fbfe;text-align:center}.stat b{display:block;color:var(--navy);font-size:20px;line-height:1.15}.stat span{display:block;margin-top:4px;color:var(--muted);font-size:12px;font-weight:800;line-height:1.25}.section-head{align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}.section-count{flex:0 0 auto;color:var(--muted);font-size:12px;font-weight:800}.group{padding-top:13px}.group+.group{margin-top:3px;border-top:1px dashed var(--line)}.group-title{margin-bottom:2px;color:var(--muted);font-size:12px;font-weight:900}.row{padding:12px 0;border-top:1px solid var(--line);min-width:0}.group-title+.row,.card>.row:first-of-type{border-top:0}.item-main{min-width:0;flex:1}.item-title{color:var(--ink);font-size:15px}.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:var(--sky);color:var(--blue);font-size:12px;font-weight:900;line-height:1.2}.tag.ok{background:#e7f6f0;color:var(--ok)}.tag.warn{background:#fff4e6;color:var(--warn)}.tag.bad{background:#fff0ef;color:var(--bad)}.tag.muted{background:#eef2f4;color:var(--muted)}.today-status{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:5px}.day-badge{display:grid;place-items:center;flex:0 0 42px;min-height:42px;border-radius:12px;background:var(--navy);color:#fff;font-size:13px;font-weight:900}.schedule-row{align-items:center}.time{flex:0 0 auto;color:var(--navy);font-size:14px;font-weight:900;text-align:right}.text{margin-top:8px;white-space:pre-wrap;color:#263f55;font-size:14px;line-height:1.65}.lesson-public{margin-top:11px;padding:11px 12px;border:1px solid #d6ebf4;border-radius:12px;background:#f5fbfe}.public-source{margin-bottom:7px;color:var(--muted);font-size:11px;font-weight:900}.public-line{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;color:#263f55;font-size:13px;line-height:1.55}.public-line+.public-line{margin-top:7px}.public-label{color:var(--blue);font-weight:900}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.request-actions{grid-template-columns:repeat(3,minmax(0,1fr))}.btn{min-height:48px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-weight:900}.btn.alt{border:1px solid var(--line);background:#fff;color:var(--navy)}.btn:disabled{opacity:.55;cursor:not-allowed}.request-actions .btn{padding:8px;font-size:13px}.request-message{margin-top:10px;color:var(--blue);font-size:13px;font-weight:800}.request-message:empty{display:none}.request-message.error{color:var(--bad)}.empty{padding:20px 8px 10px;color:var(--muted);text-align:center;font-size:13px;line-height:1.6}.notice{border-color:#efd3aa;background:#fffaf2}.feedback{display:block}.feedback summary{min-height:44px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;list-style:none}.feedback:first-of-type summary{border-top:0}.feedback summary::-webkit-details-marker{display:none}.feedback summary:after{content:'보기';float:right;color:var(--blue);font-size:12px;font-weight:900}.feedback[open] summary:after{content:'닫기'}.error{border-color:#efb6ae;background:#fff7f5;color:var(--bad)}.loading{padding:48px 16px;text-align:center;color:var(--muted)}.info details{border-top:1px solid var(--line)}.info details:first-child{border-top:0}.info summary{min-height:44px;padding:12px 0;color:var(--navy);font-size:13px;font-weight:900;cursor:pointer}.info .sub{margin:0 0 12px}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:430px){.summary-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.request-actions{grid-template-columns:1fr}}
    @media(max-width:350px){.hero-head,.between{flex-direction:column}.today-status,.time{text-align:left;justify-content:flex-start}.actions{grid-template-columns:1fr}.date-pill{align-self:flex-start}}
  </style>
</head>
<body>
  <header><div class="head"><div class="brand">WB 보호자<small>WEXLER BRAIN CENTER</small></div><div class="head-actions"><button class="headbtn" id="refreshButton" type="button" hidden>새로고침</button><button class="headbtn" id="logout" type="button" hidden>로그아웃</button></div></div></header>
  <main id="app"><div class="loading" role="status">보호자 정보를 확인하고 있습니다.</div></main>
  <div id="liveStatus" class="sr" role="status" aria-live="polite" aria-atomic="true"></div>
  <script>
  'use strict';
  const API='/parent-portal';
  const app=document.getElementById('app'),logout=document.getElementById('logout'),refreshButton=document.getElementById('refreshButton'),liveStatus=document.getElementById('liveStatus');
  let refreshing=false,lastRefreshAt=0;
  const esc=value=>String(value==null?'':value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  async function post(body){
    const response=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',credentials:'include',body:JSON.stringify(Object.assign({app:'task'},body))});
    let data={};try{data=await response.json()}catch(error){}
    if(!response.ok||!data.ok){const e=new Error(data.error||'보호자 정보를 불러오지 못했습니다');e.status=response.status;e.code=data.code||'';throw e}return data;
  }
  function section(kicker,title,rows,empty){return '<section class="card"><div class="section-head"><div><p class="eyebrow">'+esc(kicker)+'</p><h2>'+esc(title)+'</h2></div><span class="section-count">'+Number(rows&&rows.length||0)+'건</span></div>'+(rows&&rows.length?rows.join(''):'<div class="empty">'+esc(empty)+'</div>')+'</section>'}
  function group(title,rows,empty){return '<div class="group"><div class="group-title">'+esc(title)+'</div>'+(rows&&rows.length?rows.join(''):'<div class="empty">'+esc(empty)+'</div>')+'</div>'}
  const ATTENDANCE={P:['출석','ok'],L:['지각','warn'],A:['결석','bad'],'':['출결 확인 전','muted']};
  const RIDE_STATUS={scheduled:['탑승 확인 전','muted'],boarded:['탑승 확인','warn'],dropped:['하차 확인','ok'],absent:['미탑승','bad']};
  const DAY_ORDER='월화수목금토일';
  const WRITE_SCOPE_VERSION=3;
  const REQUEST_TYPES={consultation:'상담 요청',schedule_check:'일정 확인',info_correction:'정보 수정 요청'};
  const REQUEST_STATUS={open:['처리 중','warn'],resolved:['처리 완료','ok'],dismissed:['확인 종료','muted']};
  const pendingRequestIds=new Map();
  function clock(value){if(value==null||value===''||Number(value)<=0||!Number.isFinite(Number(value)))return '';return new Date(Number(value)).toLocaleTimeString('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit'})}
  function stamp(value){if(value==null||value===''||Number(value)<=0||!Number.isFinite(Number(value)))return '';return new Date(Number(value)).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'})}
  function lessonDateLabel(value){const match=/^\d{4}-(\d{2})-(\d{2})$/.exec(String(value||''));return match?Number(match[1])+'월 '+Number(match[2])+'일 안내':'최근 수업 안내'}
  function teacherLabel(value){const name=String(value||'').trim();return !name?'담당 선생님':/선생님$/.test(name)?name:name+' 선생님'}
  function capability(capabilities,name){return !!capabilities&&capabilities[name]===true&&Number(capabilities.scopeVersion||0)>=WRITE_SCOPE_VERSION}
  function publicLessonDetails(rows,enabled){if(!enabled)return '';const content=(rows||[]).map(row=>{const homework=String(row.publicHomework||'').trim(),readiness=String(row.publicReadiness||'').trim();return (homework||readiness)?'<div class="lesson-public"><div class="public-source">'+esc(lessonDateLabel(row.lessonDate))+'</div>'+(homework?'<div class="public-line"><span class="public-label">숙제</span><span>'+esc(homework)+'</span></div>':'')+(readiness?'<div class="public-line"><span class="public-label">준비물</span><span>'+esc(readiness)+'</span></div>':'')+'</div>':''}).filter(Boolean);return content.join('')}
  function todayLessonRows(rows){return (rows||[]).map(row=>{const attendance=ATTENDANCE[row.attendance]||ATTENDANCE[''];const progress=Number(row.completedSteps||0)+'/'+Number(row.totalSteps||0)+'단계';return '<div class="row between"><div class="item-main"><b class="item-title">'+esc(row.subject||row.className||'수업')+'</b><div class="sub">'+esc(teacherLabel(row.teacherName))+' · '+esc(row.timeLabel||'시간 확인 중')+'</div></div><div class="today-status"><span class="tag '+attendance[1]+'">'+attendance[0]+'</span><span class="tag '+(row.completed?'ok':'muted')+'">'+(row.completed?'수업 기록 완료':esc(progress))+'</span></div></div>'})}
  function publicLessonRows(rows){return (rows||[]).map(row=>'<div class="row"><div class="item-main"><b class="item-title">'+esc(row.subject||row.className||'수업')+'</b><div class="sub">'+esc(teacherLabel(row.teacherName))+'</div></div>'+publicLessonDetails([row],true)+'</div>')}
  function todayTransportRows(rows){return (rows||[]).map(row=>{const status=RIDE_STATUS[row.status]||RIDE_STATUS.scheduled;const direction=row.direction==='dropoff'?'하원':'등원';const at=clock(row.statusAt);return '<div class="row between"><div class="item-main"><b class="item-title">'+direction+' 차량</b><div class="sub">예정 '+esc(row.scheduledTime||'시간 확인 중')+'</div></div><div class="today-status"><span class="tag '+status[1]+'">'+status[0]+'</span>'+(at?'<span class="tag muted">'+esc(at)+'</span>':'')+'</div></div>'})}
  function scheduleRows(rows){return (rows||[]).slice().sort((a,b)=>DAY_ORDER.indexOf(String(a.dayLabel||'')[0])-DAY_ORDER.indexOf(String(b.dayLabel||'')[0])||String(a.timeLabel||'').localeCompare(String(b.timeLabel||''))).map(row=>'<div class="row between schedule-row"><span class="day-badge">'+esc(row.dayLabel||'요일')+'</span><div class="item-main"><b class="item-title">'+esc(row.subject||row.className||'수업')+'</b><div class="sub">'+esc(teacherLabel(row.teacherName))+'</div></div><div class="time">'+esc(row.timeLabel||'시간 확인 중')+'</div></div>')}
  function makeupRows(rows){return (rows||[]).map(row=>'<div class="row" data-makeup="'+esc(row.caseId)+'"><div class="between"><div class="item-main"><b class="item-title">'+esc(row.subject||'보강 수업')+'</b><div class="sub">원 수업 '+esc(row.sourceDate||'')+'</div></div><span class="tag '+(row.status==='confirmed'?'ok':'warn')+'">'+esc(row.statusLabel||row.status)+'</span></div>'+(row.confirmedDate?'<div class="text">'+esc(row.confirmedDate)+' '+esc(row.confirmedTime||'')+' · '+esc(row.teacherName?teacherLabel(row.teacherName):'담당 확인 중')+'</div>':'')+(row.canRespond?'<div class="actions"><button class="btn" type="button" data-response="accept" data-id="'+esc(row.caseId)+'" data-rev="'+Number(row.revision||0)+'">참석 가능</button><button class="btn alt" type="button" data-response="decline" data-id="'+esc(row.caseId)+'" data-rev="'+Number(row.revision||0)+'">일정 재조율</button></div>':'')+'</div>')}
  function packRows(rows){return (rows||[]).map(row=>'<div class="row"><div class="between"><div class="item-main"><b class="item-title">'+esc(row.subject||row.className||'횟수제 수업')+'</b><div class="sub">'+esc(row.validUntil?row.validUntil+'까지':'유효기간 확인 중')+'</div></div><span class="tag">남음 '+Number(row.remaining||0)+'회</span></div><div class="usage-grid"><div class="stat"><b>'+Number(row.total||0)+'</b><span>등록</span></div><div class="stat"><b>'+Number(row.used||0)+'</b><span>사용</span></div></div></div>')}
  function feedbackRows(rows){return (rows||[]).map(row=>'<details class="feedback"><summary><b>'+esc(row.feedbackDate||'수업 피드백')+'</b> <span class="tag">'+esc(row.statusLabel||'접수')+'</span></summary><div class="text">'+esc(row.message||'')+'</div><div class="sub">'+esc(teacherLabel(row.teacherName))+'</div></details>')}
  function requestRows(rows){return (rows||[]).filter(row=>REQUEST_TYPES[row.requestType]).map(row=>{const status=REQUEST_STATUS[row.status]||['확인 중','muted'];const created=stamp(row.createdAt),updated=stamp(row.updatedAt);return '<div class="row between"><div class="item-main"><b class="item-title">'+REQUEST_TYPES[row.requestType]+'</b><div class="sub">'+esc(created?'요청 '+created:'접수 시각 확인 중')+(updated&&updated!==created?' · 최근 처리 '+esc(updated):'')+'</div></div><span class="tag '+status[1]+'">'+status[0]+'</span></div>'})}
  function requestSection(capabilities,rows){if(!capability(capabilities,'guardianRequests'))return '';const history=requestRows(rows),open=new Set((rows||[]).filter(row=>row.status==='open').map(row=>row.requestType));const buttons=Object.entries(REQUEST_TYPES).map(([type,label])=>'<button class="btn'+(open.has(type)?' alt':'')+'" type="button" data-request-type="'+type+'" data-open="'+(open.has(type)?'true':'false')+'"'+(open.has(type)?' disabled aria-disabled="true"':'')+'>'+label+(open.has(type)?' 접수됨':'')+'</button>').join('');return '<section class="card" data-request-panel><div class="section-head"><div><p class="eyebrow">Request</p><h2>보호자 요청</h2></div><span class="section-count">'+history.length+'건</span></div><div class="group"><div class="group-title">새 요청</div><p class="sub">요청 종류만 학원에 전달됩니다. 설명·연락처·첨부파일은 입력하지 않습니다.</p><div class="actions request-actions" role="group" aria-label="보호자 요청 종류">'+buttons+'</div><p id="requestMessage" class="request-message" role="status" aria-live="polite" aria-atomic="true" tabindex="-1"></p></div><div class="group"><div class="group-title">요청 처리 현황</div>'+(history.length?history.join(''):'<div class="empty">아직 접수한 요청이 없습니다.</div>')+'</div></section>'}
  function render(data){
    logout.hidden=false;refreshButton.hidden=false;
    const student=data.student||{},summary=data.summary||{},capabilities=data.capabilities||{},today=data.today||{};
    const todayEnabled=capabilities.today===true;
    const publicLessonsEnabled=capability(capabilities,'publicLessons');
    const heroStats=todayEnabled?'<div class="stat"><b>'+Number(summary.todayLessons||0)+'</b><span>오늘 수업</span></div><div class="stat"><b>'+Number(summary.todayCompleted||0)+'</b><span>기록 완료</span></div>':'';
    const todaySections=todayEnabled?'<section class="card"><div class="section-head"><div><p class="eyebrow">Today</p><h2>오늘 현황</h2></div><span class="section-count">'+Number((today.lessons||[]).length+(today.transport||[]).length)+'건</span></div>'+group('오늘 수업',todayLessonRows(today.lessons),'오늘 예정된 수업이 없습니다.')+group('오늘 차량',todayTransportRows(today.transport),'오늘 이용 예정인 차량이 없습니다.')+'</section>':'<section class="card notice"><p class="eyebrow">확인 필요</p><h2>오늘 현황을 아직 볼 수 없습니다</h2><p class="sub">오늘 출결·수업 진행·차량 확인은 새 공개 범위 동의 후 제공됩니다. 학원에 새 보호자 앱 초대를 요청해 주세요.</p></section>';
    const publicLessonSection=publicLessonsEnabled?section('Learning','숙제·준비물',publicLessonRows(data.publicLessons),'현재 공개된 숙제·준비물이 없습니다.'):'';
    const checkedAt=clock(data.generatedAt);
    app.innerHTML='<section class="card hero"><div class="hero-head"><div><p class="eyebrow">오늘 우리 아이</p><h1>'+esc(student.name||'학생')+' <span class="tag">'+esc(student.grade||'')+'</span></h1></div><span class="date-pill">'+esc(todayEnabled?(today.dateLabel||'오늘'):'운영 정보')+'</span></div><p class="sub">학원에서 확정된 내용만 보여드립니다.'+(checkedAt?' · 마지막 확인 '+esc(checkedAt):'')+'</p><div class="summary-grid">'+heroStats+'<div class="stat"><b>'+Number(summary.makeupPending||0)+'</b><span>보강 확인</span></div><div class="stat"><b>'+Number(summary.sessionRemaining||0)+'</b><span>남은 회차</span></div></div></section>'+todaySections+publicLessonSection+section('Schedule','정규 수업 시간표',scheduleRows(data.schedule),'확정된 정규 수업이 없습니다.')+section('Action','확인·응답',makeupRows(data.makeups),'지금 확인하거나 응답할 일정이 없습니다.')+requestSection(capabilities,data.guardianRequests)+section('Usage','횟수제 수업',packRows(data.sessionPacks),'횟수제로 지정된 수업이 없습니다.')+section('Record','최근 수업 기록',feedbackRows(data.feedback),'아직 공개된 수업 피드백이 없습니다.')+'<section class="card info"><details><summary>보호자 앱에서 볼 수 있는 정보</summary><p class="sub">현재 자녀의 확정 수업·출결·차량·보강·회차·피드백과 공개된 숙제·준비물, 요청 처리 상태를 표시합니다. 내부 수업 메모, 정류장·주소, 연락처는 표시하지 않습니다.</p></details><details><summary>휴대폰·패드 홈 화면에 추가하기</summary><p class="sub">Chrome 또는 Safari 메뉴에서 “홈 화면에 추가”를 선택하세요. 공용 기기에서는 사용하지 마세요.</p></details></section>';
    liveStatus.textContent='보호자 정보 새로고침 완료'+(checkedAt?' '+checkedAt:'');
  }
  function fail(message,clear){if(clear){logout.hidden=true;refreshButton.hidden=true}app.innerHTML='<section class="card error" role="alert" tabindex="-1"><h2>확인이 필요합니다</h2><p class="text">'+esc(message)+'</p></section>';const alert=app.querySelector('[role="alert"]');if(alert)alert.focus()}
  async function refresh(force){if(refreshing||(!force&&Date.now()-lastRefreshAt<1000))return;refreshing=true;refreshButton.disabled=true;try{const data=await post({action:'view'});lastRefreshAt=Date.now();render(data)}catch(error){fail(error.message,error.status===401||error.status===410)}finally{refreshing=false;refreshButton.disabled=false}}
  function newClientRequestId(){return Array.from(crypto.getRandomValues(new Uint8Array(16)),byte=>byte.toString(16).padStart(2,'0')).join('')}
  function requestButtonsBusy(busy){const panel=app.querySelector('[data-request-panel]');if(panel)panel.setAttribute('aria-busy',busy?'true':'false');app.querySelectorAll('[data-request-type]').forEach(button=>{button.disabled=busy||button.dataset.open==='true'})}
  function setRequestMessage(message,isError){const output=document.getElementById('requestMessage');if(!output)return;output.textContent=message||'';output.classList.toggle('error',!!isError);output.setAttribute('role',isError?'alert':'status');if(isError)output.focus()}
  async function submitGuardianRequest(button){const requestType=String(button&&button.dataset.requestType||''),label=REQUEST_TYPES[requestType];if(!label||button.dataset.open==='true')return;if(!window.confirm(label+'을 보낼까요?\n요청 종류만 학원에 전달됩니다.'))return;let clientRequestId=pendingRequestIds.get(requestType);if(!clientRequestId){clientRequestId=newClientRequestId();pendingRequestIds.set(requestType,clientRequestId)}requestButtonsBusy(true);setRequestMessage(label+'을 접수하고 있습니다.',false);try{const result=await post({action:'submit_request',requestType,clientRequestId});pendingRequestIds.delete(requestType);await refresh(true);liveStatus.textContent=result.idempotent?label+'이 이미 접수되어 있습니다.':label+'이 접수되었습니다.'}catch(error){if(error.status===401||error.status===410)return fail(error.message,true);if(error.code==='REQUEST_CONFLICT'||error.code==='SCOPE_VERSION_REQUIRED'){pendingRequestIds.delete(requestType);await refresh(true);liveStatus.textContent=error.message;return}setRequestMessage(error.message||'요청을 접수하지 못했습니다.',true)}finally{requestButtonsBusy(false)}}
  async function boot(){
    const params=new URLSearchParams(location.hash.replace(/^#/,'')),code=params.get('code')||'';
    if(code){history.replaceState(null,'',location.pathname+location.search);try{await post({action:'exchange',code})}catch(error){return fail(error.message,true)}}
    await refresh();
  }
  app.addEventListener('click',async event=>{const requestButton=event.target.closest('[data-request-type]');if(requestButton)return submitGuardianRequest(requestButton);const button=event.target.closest('[data-response]');if(!button)return;button.disabled=true;try{await post({action:'respond',caseId:button.dataset.id,revision:Number(button.dataset.rev),response:button.dataset.response});await refresh(true)}catch(error){fail(error.message,false)}finally{button.disabled=false}});
  refreshButton.addEventListener('click',()=>refresh(true));
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!logout.hidden)refresh()});
  window.addEventListener('focus',()=>{if(!logout.hidden)refresh()});
  logout.addEventListener('click',async()=>{logout.hidden=true;refreshButton.hidden=true;try{await post({action:'logout'})}catch(error){}fail('로그아웃했습니다. 다시 이용하려면 새 초대 링크가 필요합니다.',false)});
  boot();
  </script>
</body>
</html>
